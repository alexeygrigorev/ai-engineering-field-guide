position:
  title: AI Performance Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The role writes and optimizes attention and foundational AI
      kernels (FlashAttention-style, paged KV-cache) that directly
      shape how LLMs run and perform, including numerical behavior
      and algorithmic tradeoffs. Optimizing model internals is
      shaping, and the targets are LLM/attention components, so
      ai-first.
  responsibilities:
  - Design and implement high-performance attention kernels for prefill and decode,
    including MHA, GQA, paged attention, sliding-window/global attention, and fused
    FlashAttention-style algorithms
  - Build and optimize general AI kernels such as matmul, softmax, normalization,
    activation, embedding, and data-movement primitives for new accelerators
  - Contribute to the design and implementation of the Attention framework with reusable,
    portable, tunable interfaces
  - Profile workloads, identify bottlenecks, build performance models, and tune implementations
    against hardware limits
  - Develop benchmarks, correctness tests, regression tests, and automated performance
    analysis
  - Partner with Modular teams on software stack improvements and work with hardware
    partners to validate toolchains and interfaces
  - Write design documents, participate in technical reviews, and mentor teammates
    on kernel quality and performance methodology
  use_cases:
  - High-performance attention kernel implementations for new accelerator architectures
    (GPUs, NPUs, ASICs, TPUs)
  - Bringing up modern LLMs on new hardware with production-ready inference performance
  - Reusable attention framework enabling model and kernel developers to express attention
    variants
  - End-to-end performant token serving for cloud users
