  responsibilities:
  - 'Build and own the AI runtime control plane: deploy and operate the inline enforcement
    pipeline (AI gateway, runtime data protection, intent-based enforcement) fronting
    LLMs, tools, and MCP servers across Azure AI Foundry, AWS Bedrock, GCP Vertex,
    Copilot Studio, Databricks, and self-hosted environments'
  - Author and calibrate runtime policies including prompt-injection/jailbreak prevention,
    PII detection and redaction, intent-based filtering, tool-call validation, MCP
    access control, and agent permission boundaries, tuned per AI archetype
  - Operate a closed-loop defensive system translating continuous red-team findings
    into runtime policy updates, new detection content, and guardrail tuning, validating
