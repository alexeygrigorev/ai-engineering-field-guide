  - 'Serve as L3 final escalation for AI security incidents: investigate prompt injection,
    RAG poisoning, agent hijacking, MCP/tool abuse, and AI-driven exfiltration; perform
    decision-replay forensics and drive automated containment'
  - Integrate AI asset-intelligence, model-security, and supply-chain telemetry into
    SIEM correlation and SOC workflows
  - Evaluate and pilot AI security vendors via structured proofs-of-concept for runtime
    defense, AIDR, AI-SPM, and red-teaming platforms
  - Engineer cloud security controls across Azure, AWS, and GCP including Kubernetes
    (AKS/EKS) posture, detection tuning, and remediation
  - Embed security into DevSecOps with Terraform IaC scanning, container/Kubernetes
    security, secrets management, and CI/CD hardening in Azure DevOps/GitHub Actions
  use_cases:
  - Runtime enforcement and data protection for AI agent traffic across LLMs, tools,
    and MCP servers
  - Prompt-injection, jailbreak, and agent-hijacking prevention with PII redaction
  - Security detection, forensics, and automated containment for AI-specific attacks
  - Closed-loop defense where red-team findings improve runtime policies and detections
  - Multi-cloud security posture and zero-trust agent access management
  - Vendor evaluation and piloting of AI security platforms (AIDR, AI-SPM, red-teaming)
