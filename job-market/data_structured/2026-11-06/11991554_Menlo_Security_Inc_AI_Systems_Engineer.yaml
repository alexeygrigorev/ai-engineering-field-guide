position:
  title: AI Systems Engineer
  ai_type:
    type: ai-first
    reasoning: |-
      The engineer builds guardrails, continuous evaluation, and
      regression gates that judge SLM detection quality, and
      performs model quantization and batching optimization on
      Small Language Models - all of which shape model
      behavior/output quality with an LLM (SLM) component, making
      it ai-first. Serving infrastructure alone would be ai-
      support, but the explicit ownership of guardrails, automated
      evals, and quantization tips it into shaping.
  responsibilities:
  - Architect and optimize production serving pipelines for Small Language Models
    and traditional ML models using quantization, batching, and GPU acceleration
  - Own and scale backend microservices delivering real-time threat detection (prompt
    injection, document detection)
  - Build consumption-based monitoring, tenant rate-limiting, and runtime guardrail
    infrastructure
  - Manage and optimize GPU cluster replicas on Kubernetes to minimize cold-start
    times and infrastructure costs
  - Build continuous evaluation, automated retraining pipelines, model CI/CD, and
    automated regression gates
  - Refactor legacy service boundaries, service-to-service auth flows, and backend
    database configurations
  use_cases:
  - Real-time prompt injection detection for browser and AI agent security
  - Content and intent classification for threat detection
  - Securing AI agents at runtime (Agent Runtime Security)
  - Document and data-loss-pretection (DLP/PII) filtering
