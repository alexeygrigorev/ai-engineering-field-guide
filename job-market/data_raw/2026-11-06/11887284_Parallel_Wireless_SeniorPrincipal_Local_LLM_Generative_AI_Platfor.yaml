title: "Senior/Principal Local LLM & Generative AI Platform Engineer"
company: Parallel Wireless
location: USA
remote: true
work_type: FULL_TIME
description: |
  Parallel Wireless is a U.S.-based pioneer in Open RAN
  innovation, transforming how mobile networks are built,
  optimized, and powered. Through our GreenRAN™ portfolio, we
  help operators deliver secure, energy-efficient, automated,
  and flexible connectivity across 2G, 3G, 4G, 5G, and the
  path toward 6G. Our software-centric, hardware-agnostic
  approach brings intelligence into the RAN while helping
  customers reduce complexity and total cost of ownership.

  Parallel Wireless is looking for a hands-on technical leader
  to build and operate a secure local large-language-model
  platform for the company. The platform will allow
  engineering and business teams to use generative AI with
  proprietary source code, product documentation, technical
  standards, test artifacts, support knowledge, and other
  approved internal data while keeping sensitive information
  within company-controlled environments.

  This is a senior individual-contributor role spanning
  applied LLM engineering, platform architecture, search and
  data pipelines, security, and production operations. You
  will turn promising prototypes into a dependable internal
  capability: selecting and optimizing open-weight models,
  building permission-aware retrieval, creating reusable APIs
  and tools, integrating with existing engineering workflows,
  and establishing objective ways to measure quality, safety,
  latency, capacity, and business value.

  The successful candidate will understand that a useful
  enterprise LLM is more than a model and a chat interface. It
  requires trustworthy source grounding, strong access
  controls, repeatable evaluation, careful tool permissions,
  observable production services, and an operating model that
  keeps data, indexes, prompts, models, and dependencies
  current. You will make pragmatic build-versus-buy decisions
  and choose the simplest approach—search, retrieval-augmented
  generation (RAG), prompting, workflow automation, or model
  adaptation—that meets each use case.

  Initial use cases may include engineering knowledge
  discovery, source-code understanding, troubleshooting
  assistance, technical-document Q&A and summarization, test
  and log analysis, and drafting structured engineering
  artifacts. The platform should be extensible to additional
  approved use cases as needs and model capabilities evolve.

