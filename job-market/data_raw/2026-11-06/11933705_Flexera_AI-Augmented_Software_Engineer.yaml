  Software Engineer

  About the Role

  We are looking for a Software Engineer to build cloud-
  native, data-intensive systems across backend services,
  APIs, integrations and data pipelines.

  We are adopting AI-assisted development across our
  engineering workflow and expect you to use these tools
  effectively while building strong engineering judgment.

  What You'll Do

  •  Build backend services, APIs, integrations and data
  pipelines using Go and Python.

  •  Own scoped features and improvements through
  implementation, testing and deployment.

  •  Work with cloud-native systems, Kubernetes and
  containers.

  •  Write maintainable code, automated tests, and participate
  in code and design reviews.

  •  Debug software issues, identify root causes and implement
  reliable fixes.

  •  Contribute to CI/CD, observability and production
  operations.

  •  Use AI development tools for implementation, testing,
  debugging and code exploration while understanding and
  validating the resulting work.

  What We're Looking For

  •  1–2 years of professional software engineering
  experience, primarily in backend development.

  •  Programming experience with Go, Python or a similar
  backend language.

  •  Good understanding of APIs, data structures, debugging,
  testing and version control.

  •  Experience with REST APIs and relational databases.

  •  Familiarity with cloud-native applications and
  distributed systems.

  •  Experience with automated testing and modern development
  workflows.

  •  Ability to break down technical problems, investigate
  issues and develop practical solutions.

  •  Good communication skills and a strong engineering
  mindset.

  Nice to Have

  •  Familiarity with AWS, Kubernetes, Docker, Terraform or
  PostgreSQL.

  •  Experience with asynchronous processing, queues or event-
  driven systems.

  •  Experience building data-processing or integration
  services.

  •  Familiarity with gRPC or service-to-service APIs.

  •  Exposure to multi-tenant SaaS applications or external
  cloud and SaaS integrations.

  •  Experience working with AI/ML platforms, APIs or related
  data.

  What Success Looks Like

  •  You deliver reliable, well-tested features with
  increasing independence.

  •  You understand how your changes fit into the broader
  system and architecture.

  •  You troubleshoot issues methodically and implement
  durable solutions.

  •  Your code is clear, maintainable and consistent with
  established engineering practices.

  •  You apply feedback and production experience to
  strengthen your technical judgment.

  How We Work

  We value engineers who are curious, pragmatic, low-ego and
  accountable. We favor clear ownership, simple designs,
  incremental delivery and automation over unnecessary
  process.

  We believe AI should amplify engineering judgment, not
  replace it. Every engineer remains responsible for
  understanding, validating and owning the software they
  deliver.

