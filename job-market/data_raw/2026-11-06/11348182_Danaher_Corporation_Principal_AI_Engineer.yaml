description: |
  Bring more to life.

  Are you ready to accelerate your potential and make a real
  difference within life sciences, diagnostics and
  biotechnology?

  At Beckman Coulter Diagnostics, one of Danaher’s 15+
  operating companies, our work saves lives—and we’re all
  united by a shared commitment to innovate for tangible
  impact.

  You’ll thrive in a culture of belonging where you and your
  unique viewpoint matter. And by harnessing Danaher’s system
  of continuous improvement, you help turn ideas into impact –
  innovating at the speed of life.

  As a global leader in clinical diagnostics, Beckman Coulter
  Diagnostics has challenged convention to elevate the
  diagnostic laboratory’s role in improving patient health for
  more than 90 years. Our diagnostic solutions are used in
  routine and complex clinical testing, and are used in
  hospitals, reference and research laboratories, and
  physician offices around the world. Every hour around the
  world, more than one million tests are run on Beckman
  Coulter Diagnostics systems, impacting 1.2 billion patients
  and more than three million clinicians per year. From
  uncovering the next clinical breakthrough, to rapid and
  reliable sample analysis, to more rigorous decision
  making—we are enabling clinicians to deliver the best
  possible care to their patients with improved efficiency,
  clinical confidence, adaptive collaboration, and accelerated
  intelligence.

  Learn about the Danaher Business System which makes
  everything possible.

  The Principal AI Engineer – R&D is a senior individual-
  contributor technology leader responsible for defining the
  architecture, engineering standards, and technical direction
  for enterprise AI solutions that transform research and
  development across Beckman Coulter Diagnostics. This role
  combines hands-on solution design and development with
  cross-functional technical leadership to build, validate,
  and scale production-grade AI agents, Retrieval-Augmented
  Generation solutions, and intelligent engineering workflows
  across product development, systems engineering, software
  engineering, verification and validation, quality, and
  regulatory activities. The Principal AI Engineer partners
  with R&D and technology leaders to identify high-value
  opportunities, establish reusable architecture patterns and
  responsible AI controls, mentor engineering teams, and
  deliver secure, observable, compliant solutions that improve
  productivity, product quality, traceability, and speed to
  market. This position reports to the AI Transformation
  Leader and is part of the Global Technology Organization
  located in Bangalore, India and will be an on-site role.

  In this role, you will have the opportunity to:

  - Architect and deliver production-grade AI agents,
    engineering assistants, and agentic workflows that improve
    requirements development, systems engineering, risk
    management, design reviews, technical documentation, and
    end-to-end traceability.
  - Design and scale intelligent solutions that accelerate
    software development, code and test generation,
    verification and validation, defect investigation,
    technical data analysis, and repetitive engineering work.
  - Develop secure and scalable Retrieval-Augmented Generation
    (RAG) solutions grounded in engineering documentation,
    standards, technical reports, design history files, and
    lessons learned.
  - Own the technical direction for agent architecture,
    orchestration frameworks, model selection and evaluation,
    reusable design patterns, enterprise integration, and
    standards for AI governance, validation, security,
    observability, model risk management, and responsible AI.
  - Partner with R&D, quality, regulatory, security, and
    technology teams to prioritize high-value use cases, lead
    technical reviews, mentor engineers, and scale solutions
    that deliver measurable improvements in productivity,
    product quality, traceability, and speed to market.

  The essential requirements of the job include:

  - Bachelor’s degree in computer science, Software Engineering,
    Computer Engineering, Data Science, Artificial
    Intelligence, or related technical discipline.
  - 14+years of experience developing enterprise software
    solutions using Python, C#, Java, or similar languages in
    medical device industry.
  - Experience building AI applications utilizing LLMs, agent
    frameworks, RAG architectures, vector databases, and cloud
    AI services (Azure AI, OpenAI, Anthropic, or equivalent).

  Travel, Motor Vehicle Record & Physical/Environment
  Requirements: if applicable for role

  - 25% Ability to travel domestic and international
  - Must have a valid driver’s license with an acceptable
    driving record
  - Ability to lift, move or carry equipment up to 25lb, any
    other physical requirements

  It would be a plus if you also possess previous experience
  in:

  - Medical devices, diagnostics, healthcare, biotechnology, or
    other regulated industries.
  - Model-Based Systems Engineering (MBSE), requirements
    management, risk management, or engineering lifecycle
    tools.

  Join our winning team today. Together, we’ll accelerate the
  real-life impact of tomorrow’s science and technology. We
  partner with customers across the globe to help them solve
  their most complex challenges, architecting solutions that
  bring the power of science to life.

  For more information, visit www.danaher.com.
