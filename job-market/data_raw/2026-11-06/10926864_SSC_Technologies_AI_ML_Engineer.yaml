  Job Description

  - 4 – 7 years of hands-on experience in Machine Learning,
    Natural Language Processing, and Deep Learning model
    development.
  - Fluency in Python and main ML packages: PyTorch, Hugging
    Face Transformers, Scikit-Learn, Pandas, and NumPy.
  - Practical experience fine-tuning transformer-based
    architectures on proprietary enterprise domain data.
  - Solid working knowledge of document OCR processing tools
    (LayoutLM, Tesseract, PaddleOCR) and PDF parsing
    frameworks.
  - Rigorous understanding of model evaluation metrics,
    statistical sampling, and error analysis.

