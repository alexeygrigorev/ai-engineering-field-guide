description: |
  About Suno

  We're building the world's first creative entertainment
  platform, where the entire world can feel the joy and
  fulfillment of making music. Music is for everyone: Our
  users include everyone from grandmothers creating songs for
  their loved ones, to Grammy winners using Suno Studio, our
  power tool, to make the most popular hits in the world.

  Building the future of entertainment requires ambition. The
  pace is fast, the problems are hard, and the work demands
  ownership and intensity. For the right people, it’s
  incredibly rewarding: a chance to shape a new medium, work
  with a small team that cares deeply about quality, make
  music, drink too much coffee, and build something that
  millions of people use to express themselves in ways that
  were never before possible.

  Suno is the fastest growing consumer entertainment company
  and the leader in AI music. We are backed by leading
  investors including Bond Capital, Menlo Ventures, Lightspeed
  Venture Partners, IVP, Forerunner, Union Square Ventures,
  Alkeon, Quiet, Matrix Partners, Schroders Capital and,
  NVentures (venture arm of NVIDIA).

  About the Role

  The AI Visuals team builds Suno’s visual creation products,
  including AI-generated music videos, cover art, and video
  covers for songs. We’re shaping the future of music media
  through visual storytelling.

  In this full-stack role, you’ll build and ship features
  across the frontend and backend, help shape product scope,
  and collaborate closely with designers and product managers
  to bring new experiences to life. You’ll also work directly
  with a range of image and video generation models, gaining
  hands-on experience with inference and integrating their
  capabilities into our products.

  Check out the visuals that can be created with Suno’s AI:

  - https://cdn1.suno.ai/video_gen_01a18e44-c797-703e-b0a9-
    415386c16495.mp4
  - https://cdn1.suno.ai/video_gen_01a182ed-55d1-762b-aa1b-
    302512987625.mp4

  What You’ll Do

  - Build visual creation products: Develop and ship features
    for AI music videos, generative cover art, and animated
    video covers.
  - Develop data pipelines: Build preference data pipelines to
    support model tuning and improve output quality.
  - Elevate aesthetic quality: Collaborate with UX/UI designers
    to refine the visual quality of generated images and
    videos.
  - Create agentic workflows: Build AI director workflows that
    guide music video creation from concept to final cut.
  - Evaluate image and video models: Assess emerging models and
    translate their capabilities into compelling music video
    features.

  Must-Haves

  - Excitement about building products from 0 to 1.
  - Hands-on experience with image and video models and
    inference.
  - A strong background in backend or infra engineering.
  - Experience working with AI image or video generation models
    such as Nano Banana, H3, FLUX, GPT Image, Seedance, Kling
    or similar generation models.

  Nice-to-Haves

  - 4+ years of software engineering experience.
  - Experience building agentic AI systems, such as RAG
    pipelines or multi-step orchestration of video generation
    workflows.

  Work Location Policy

  This role is expected to work from the designated Suno
  office 5 days a week, per Suno's company policy. Full-time
  employees will receive competitive equity packages, and
  comprehensive benefits. The actual base salary offered may
  vary depending on location, skills, qualifications, and
  experience

  Additional Notes

  Applicants must be eligible to work in the US.

  Perks & Benefits for Full-Time Employees:

  - Company Equity Package
  - 401(k) with 3% Employer Match & Roth 401(k)
  - Medical, Dental, & Vision Insurance (PPO w/ HSA & FSA
    options)
  - 11 Paid Holidays + Unlimited PTO & Sick Time
  - 16 Weeks of Paid Parental Leave
  - Creative Education Stipend
  - Generous Commuter Allowance
  - In-Office Lunch (5 days per week)

  Compensation:

  The annual salary range for this role is $228K – $363K +
  target equity + benefits (including medical, dental, vision,
  and 401k)

