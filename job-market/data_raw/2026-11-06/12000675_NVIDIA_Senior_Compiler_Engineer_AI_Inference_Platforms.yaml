title: Senior Compiler Engineer, AI Inference Platforms
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  NVIDIA's invention of the GPU 1999 sparked the growth of the
  PC gaming market, redefined modern computer graphics, and
  revolutionized parallel computing. More recently, GPU deep
  learning ignited modern AI — the next era of computing —
  with the GPU acting as the brain of computers, robots, and
  self-driving cars that can perceive and understand the
  world. Today, we are increasingly known as “the AI computing
  company”.

  We are looking for an AI & Deep Learning Compiler Engineer.
  NVIDIA is hiring software engineers for its Deep Learning &
  AI Compiler (DLC) team. Academic and commercial groups
  around the world are using GPUs to power a revolution in
  deep learning, enabling breakthroughs in many areas, e.g.
  large language models, generative AI, recommendation
  systems, image classification, speech recognition, etc. With
  the rapid advancement of AI, our DLC has been the backbone
  of NVIDIA’s inference engine, spanning across data centers,
  personal devices, automotive, and robotics. The compiler
  must deliver leading inference performance, fast build time,
  reduced memory footprints, and ease of use in the forms of
  both Ahead-of-Time and Just-in-Time. Join the team building
  the DLC which will be used by the entire deep learning
  community.

  What you’ll be doing:

  - Analyzing deep learning networks and developing compiler
    optimization algorithms.
  - Collaborating with members of the deep learning software
    framework teams and the GPU architecture teams to
    accelerate the next generation of deep learning software.
  - Scope of these efforts includes defining public APIs,
    performance optimizations and analysis, crafting and
    implementing compiler techniques for AI workloads and
    future NVIDIA GPUs.

  What we need to see:

  - Bachelor’s, Master’s or Ph.D. in Computer Science, Computer
    Engineering, related field or equivalent experience.
  - 3+ years of relevant work or research experience in
    performance analysis and compiler optimizations.
  - Experience with compiler technologies (e.g., MLIR, LLVM,
    XLA, Triton, etc.).
  - Excellent C/C++ and Python programming and software design
    skills, including debugging, performance analysis, and
    test design.
  - Ability to work independently, define project goals and
    scope, and lead your own development efforts.
  - Strong interpersonal skills are required along with the
    ability to work in a dynamic product-oriented team.

  Ways to stand out from the crowd:

  - Proficient in CPU and/or GPU architecture. CUDA or OpenCL
    programming experience.
  - Understanding of deep learning models, algorithms and
    frameworks, such as PyTorch, JAX.
  - GPU kernel authoring and performance analysis using tools
    such as Nsight Compute.
  - A track record of success in mentoring early-career
    engineers and interns is a bonus.
  - Track record on new hardware bring-up is a plus.

  With competitive salaries and a generous benefits package,
  we are widely considered to be one of the technology world’s
  most desirable employers. We have some of the most forward-
  thinking and hardworking people in the world working for us
  and, due to unprecedented growth, our exclusive engineering
  teams are rapidly growing. If you're a creative and
  autonomous engineer with a real passion for technology, we
  want to hear from you.

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary range for this position is 152,000 USD
  – 241,500 USD.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  November 3, 2026.

  This posting is for an existing vacancy.

