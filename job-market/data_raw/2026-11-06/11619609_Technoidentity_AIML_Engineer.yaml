description: |
  Supercharge Your Career as a AI/ML Engineer at
  Technoidentity!

  At Technoidentity, we're a Data & AI product engineering
  company with over 15 years of expertise in building durable
  digital products, intelligent enterprise solutions, and
  scalable Data & AI platforms. As we continue expanding
  globally, it's the perfect time to join our team of tech
  innovators and make a lasting impact.

  We are looking for AI/ML Engineers who are excited about
  building intelligent systems, AI agents, LLM-powered
  applications, and production-ready AI workflows that solve
  real business problems.

  What Will You Be Doing?

  - Design, develop, and maintain AI/ML applications and LLM-
    powered solutions.
  - Build AI agents, agentic workflows, and orchestration
    layers.
  - Develop and integrate Model Context Protocol tools and AI
    system integrations.
  - Work with prompts, tools, retrieval, function calling, and
    workflow automation patterns.
  - Collaborate with product, engineering, and business teams to
    convert use cases into AI solutions.
  - Evaluate model performance, reliability, safety, and output
    quality.
  - Support production deployment, monitoring, and continuous
    improvement of AI systems.
  - Document solution architecture, workflows, evaluation
    results, and implementation details.

  Requirements

  What Makes You the Perfect Fit?

  - 3+ years of experience in AI/ML engineering, LLM application
    development, backend engineering, or applied AI roles.
  - Hands-on experience building LLM-powered applications or AI
    agents.
  - Understanding of AI agent development, orchestration, and
    tool-based workflows.
  - Exposure to Model Context Protocol tools and integrations,
    or willingness to learn quickly.
  - Experience with Python and common AI/ML or LLM development
    frameworks.
  - Understanding of prompt engineering, RAG, function calling,
    embeddings, and evaluation techniques.
  - Ability to deploy, monitor, and improve AI solutions in
    production environments.
  - Strong problem-solving, experimentation, and critical
    thinking skills.
  - Good communication, collaboration, and ownership mindset.
  - Understanding of MLOps, LLMOps, observability, monitoring,
    and evaluation pipelines.
  - Bachelor's degree in Computer Science, IT, Engineering, Data
    Science, or a related field.

  Good to Have Skills

  - Exposure to working with temporal.
  - Experience with ADK.
  - Exposure to cloud platforms such as AWS, Azure, or GCP.
  - Experience with vector databases such as Pinecone, Weaviate,
    Qdrant, Chroma, or pgvector.
  - Familiarity with backend development using Python, Go, Java.
  - Experience with workflow orchestration tools such as
    Temporal or similar platforms.
  - Exposure to enterprise workflows, or regulated production
    environments.



  Work Requirements

  - Willingness to work in flexible shift timings based on
    project requirements.
  - Ability to work independently on POCs, prototypes, and
    production AI solutions.
  - Strong ownership in building reliable, secure, and useful AI
    systems.
