description: |
  WHO WE ARE

  We're Altman Solon, a global leader in strategy consulting
  and one of the fastest-growing firms in the Technology,
  Media, and Telecommunications (TMT) sector. We assist
  clients in fast, high-impact, confident decision-making, and
  enable them to seize new opportunities, improve performance,
  and increase shareholder value within complex and converging
  industries. Altman Solon has an extensive international
  reach, with offices across Europe, the Americas, and Asia-
  Pacific. We've successfully completed projects in more than
  100 countries around the world.

  Are you ready to make an impact with us? Join Altman Solon
  today.



  YOUR RESPONSIBILITIES

  We're looking for a proactive, technically skilled, and
  collaborative Data, Analytics & AI Platform Engineer to join
  our global Enterprise IT team in a full-time, permanent
  position.  In this role, you will help shape how Altman
  Solon uses data, analytics, automation, and AI across the
  firm. You will play a key role in developing our Microsoft
  Fabric and Power BI environment, building scalable data
  solutions, and enabling business teams to make better use of
  technology and data.

  Key Responsibilities

  - Data Platform Development: Own and continuously develop our
    Microsoft Fabric environment, including data flows,
    pipelines, workspaces, and integrations.
  - Business Intelligence & Reporting: Act as an internal Power
    BI expert, developing reusable datasets, semantic models,
    reporting standards, and best practices.
  - Data Integration & Automation: Integrate data from
    enterprise applications, Microsoft 365, and internal
    systems, while automating data and reporting processes
    using Azure, APIs, Power Platform, and related
    technologies.
  - Application Support: Support internally developed
    applications, including their data integrations and
    reporting capabilities.
  - AI Enablement: Provide technical expertise in Microsoft 365
    Copilot, Copilot Studio, and Azure AI services, helping
    integrate AI capabilities into business processes and
    applications.
  - Business Collaboration: Partner with Finance, HR, Staffing,
    Marketing, Operations, and other teams to translate
    business requirements into scalable technical solutions.
  - Standards, Governance & Self-Service: Help establish a Power
    BI and Fabric Center of Excellence, defining reusable
    standards, governed datasets and semantic models, data
    quality practices, security and access principles, while
    enabling business teams to safely build and use self-
    service analytics.



  YOUR QUALIFICATIONS

  - Technical Expertise: Strong hands-on experience with
    Microsoft Fabric and Power BI, including Lakehouses,
    OneLake, data pipelines, notebooks, semantic models, data
    modelling, DAX, and Power Query.
  - Data Integration: Good knowledge of Microsoft Azure, APIs,
    SQL, and modern enterprise data integration technologies.
  - Automation & Development: Experience with Power Platform,
    Python, PowerShell, or similar automation and development
    tools.
  - AI Technologies: Experience with or strong interest in
    Microsoft 365 Copilot, Copilot Studio, and Azure AI
    services.
  - Security & Governance: Understanding of data security,
    access permissions, governance, and enterprise
    architecture principles.
  - Analytical & Problem-Solving Skills: Strong ability to
    translate complex business requirements into practical,
    scalable technical solutions.
  - Communication & Collaboration: Excellent interpersonal
    skills, with the ability to work effectively with both
    technical and non-technical stakeholders.
  - Ownership & Initiative: Proactive, solution-oriented mindset
    with a passion for hands-on engineering, continuous
    improvement, and enabling others to use technology
    effectively.

  YOUR BENEFITS

  - Culture & People: Be part of a global and entrepreneurial
    team surrounded by smart people passionate about
    innovation. Enjoy regular team outings and after-work
    gatherings.
  - Professional Development: Benefit from our flat
    organisational structure, direct exposure to senior
    leadership, and opportunities to take ownership of
    impactful technology initiatives.
  - International Exposure: Collaborate with colleagues across
    our global offices and contribute to firmwide technology
    and digital transformation projects.
  - Central Office Location: Enjoy our centrally located offices
    with snacks, refreshments, and regular team gatherings.
  - Flexibility: Benefit from hybrid working arrangements,
    supportive leave policies, and our family and wellbeing
    programmes.



  Altman Solon is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. Altman Solon values diverse
  perspectives and fosters an environment where all voices are
  heard.
