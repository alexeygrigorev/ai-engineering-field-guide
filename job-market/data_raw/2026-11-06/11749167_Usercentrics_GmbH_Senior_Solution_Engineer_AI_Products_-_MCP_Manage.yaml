description: |
  Usercentrics is a global leader in consent management, and
  now we're bringing that same mission of trust and control
  into the AI era. MCP Manager (MCPM) is our newest product: a
  governance and management platform for Model Context
  Protocol (MCP), the emerging standard that connects AI
  agents to business systems like Salesforce, Confluence,
  Slack, and GitHub.

  As AI adoption accelerates, enterprises face a new and
  urgent challenge: how do you give teams the power of AI
  agents while maintaining visibility, security, and control
  over what those agents can access and do? MCP Manager is the
  answer, serving as the trust and control layer for AI agent
  connections.

  This is a category-creation opportunity. MCP is being
  compared to the invention of the USB connector for AI: a
  universal standard that changes everything. We're looking
  for a Senior Sales Engineer who wants to be on the ground
  floor of defining that category and to become the technical
  voice customers trust when they put AI agents into
  production.

  As our Senior Solution Engineer, you will own the technical
  side of every MCP Manager evaluation, from the first
  discovery call through a successful proof of concept and
  into onboarding. After the sale, you will partner with our
  Customer Success Manager to provide post-sales engineering
  support as customers expand their use of MCP Manager. You
  will partner with each of our Account Executives to win
  deals across a shared pipeline, lead security and
  architecture reviews with CISOs and IT teams, and build the
  demo environments, solution plans, and technical materials
  that help prospects see MCP Manager working against their
  own AI stack. When customers run into technical issues, you
  will investigate and resolve them yourself with modern AI
  coding tools, bringing in engineering only when needed.

  You will sit within the MCP Manager engineering team, which
  gives you direct access to the people building the gateway
  and a clear path for turning field feedback into product
  improvements. The role exists now because buyers are moving
  from AI experiments to production agent rollouts, and they
  need a trusted technical guide who can show them how to
  govern those connections with confidence. Your Tasks:

  Technical Discovery & Demos

  - Lead technical discovery with AI leads, engineering
    managers, and IT teams to map each prospect's AI clients,
    MCP servers, identity provider, and governance
    requirements.
  - Deliver tailored product demonstrations that show MCP
    Manager governing the prospect's own tools and workflows.
  - Verify compatibility between a prospect's AI ecosystem and
    MCP Manager before demos and trials, and raise any gaps
    with product and engineering early.

  Proofs of Concept & Trials

  - Support Account Executives as they scope each proof of
    concept with the prospect by identifying the technical
    blockers that need to be resolved before the PoC begins,
    such as compatibility of the MCP servers and clients in
    play, workspace access, and identity setup.
  - Support customers through each proof of concept as they
    configure gateways, identities, and configure policies
    themselves, answering their questions in real time over
    Slack or in-product chat.
  - Drive each evaluation to a clear technical decision on an
    agreed timeline and document the outcome for the deal
    team.

  Security & Compliance Reviews

  - Lead security questionnaires, architecture reviews, and
    vendor due diligence with CISOs, security teams, and
    compliance reviewers.
  - Explain how MCP Manager handles authentication, data flow,
    logging, and access control in terms that security and
    audit stakeholders can act on.
  - Maintain a library of reusable answers and security
    documentation, working with engineering and Legal to keep
    it accurate.

  Post-Sales Support & Enablement

  - Build and maintain demo environments, solution plans,
    reference architectures, and technical guides for the
    sales team and for prospects.
  - Partner with our Customer Success Manager to onboard new
    customers with a documented configuration, and provide
    ongoing post-sales engineering support as they roll MCP
    Manager out more widely.
  - Investigate and resolve prospect & customer technical issues
    as they arise, using Claude Code and other AI coding
    assistants to reproduce problems, inspect configurations
    and logs, and propose fixes before escalating to
    engineering.

  Product Feedback & Documentation

  - Log feedback, feature ideas, technical objections, and
    competitive signals from every customer conversation so
    product and engineering can act on them.
  - Work closely with the Product Manager to prioritize customer
    needs, clarify requirements, and validate new features
    with the customers who asked for them.
  - Update product documentation, guides, and troubleshooting
    articles based on what you learn from customer evaluations
    and support cases.

  Requirements

  - 3 or more years of experience in sales engineering,
    solutions engineering, solutions architecture, or a
    similar customer-facing technical role at a B2B software
    company.
  - A track record of running technical evaluations and proofs
    of concept that convert into closed business, in close
    partnership with Account Executives, and experience
    supporting customers after the sale alongside Customer
    Success.
  - Ability to support several Account Executives at once,
    running multiple evaluations in parallel and prioritizing
    your time across a shared pipeline.
  - Strong working knowledge of APIs, authentication and
    authorization (OAuth, SSO, and identity providers), and
    SaaS configuration. You should also be comfortable reading
    technical documentation and troubleshooting integrations.
  - Basic coding experience, and comfort using Claude Code and
    other AI coding assistants to investigate and resolve
    customer issues as they arise. You don't need to be a
    software engineer, but you should be able to read code,
    write simple scripts, and debug problems with modern
    tools.
  - Experience supporting security reviews and vendor due
    diligence, and comfort discussing frameworks such as SOC 2
    and HIPAA with security and compliance teams.
  - Hands-on experience using AI assistants and agents in your
    own work, and real curiosity about how enterprises are
    adopting them.
  - Ideally, experience with Model Context Protocol and AI
    gateways. Must have experience with AI agent tooling and a
    background in developer tools, security, or governance
    software.
  - Excellent verbal and written communication, with the ability
    to explain complex technical ideas to engineers and
    business stakeholders alike.
  - Comfort operating in an early-stage, category-creation
    environment where the playbook is still being written.
  - Willingness to travel occasionally for customer meetings and
    industry events.Don't meet every single requirement?
    Studies have shown that women and people of colour are
    less likely to apply to jobs unless they meet every single
    qualification. At Usercentrics we are dedicated to
    building a diverse, inclusive and authentic workplace, so
    if you're excited about this role but your past experience
    doesn't align perfectly with every qualification in the
    job description, we encourage you to apply anyway. You may
    be just the right candidate for this or other roles.

  Salary Range: $180,000 - $194,400

  The annual base salary range is determined based on a
  variety of factors, including geographic location, role-
  specific skills, relevant experience, and internal equity.
  Usercentrics is committed to transparent and equitable
  compensation practices.

  Benefits

  - 401(k) plan contribution with employer match
  - 18 paid vacation days (PTO)
  - Health insurance
  - Personal development budget for every employee
  - Hybrid workplace
  - Online wellness sessions
  - Team events including team buildings, happy hours, company
    breakfasts/lunches, in-person and virtual
  - Refreshments: snacks, fruit, coffee, and drinks in the
    office

  Why join usercentrics?

  - Joining Usercentrics means becoming part of a fast-growing,
    diverse, and international team of tech enthusiasts and
    entrepreneurially-minded people who build our success
    story together.
  - Company culture is important to us. We strive to
    continuously develop a positive, vibrant, and inspiring
    environment that enables everyone to thrive both
    personally and professionally.
  - Get involved! We have plenty of initiatives and love seeing
    people from all departments enthusiastically participating
    in cross-department projects and shaping our future.
  - Your work-life balance matters. We offer flexible working
    hours, hybrid working, and the possibility of workcations
    (in accordance with our company policy).
  - We always remember to have fun, both in our day-to-day work
    and at our regular team events in our offices across
    Munich, Prague, Lisbon, Copenhagen, Odense, Buenos Aires,
    and New York, or online.
  - You are our most valuable asset. We offer a personal
    development budget, job-related language courses, and much
    more to support your wellbeing and growth.
