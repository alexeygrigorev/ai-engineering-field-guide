  Job Description:

  AI Cloud Engineer (Solventum)



  3M Health Care is now Solventum

  At Solventum, we enable better, smarter, safer healthcare to
  improve lives. As a new company with a long legacy of
  creating breakthrough solutions for our customers’ toughest
  challenges, we pioneer game-changing innovations at the
  intersection of health, material and data science that
  change patients' lives for the better while enabling
  healthcare professionals to perform at their best. Because
  people, and their wellbeing, are at the heart of every
  scientific advancement we pursue.



  We partner closely with the brightest minds in healthcare to
  ensure that every solution we create melds the latest
  technology with compassion and empathy. Because at
  Solventum, we never stop solving for you.



  The Impact You’ll Make in this Role

  As an AI Cloud Engineer, you will have the opportunity to
  design and build secure, scalable, and enterprise-grade
  cloud platforms that enable advanced AI and Generative AI
  solutions across the organization. Here, you will make an
  impact by:



  - Design, develop, and deploy cloud-native AI solutions from
    proof of concept through production deployment.

  - Build and manage scalable AI application infrastructure
    leveraging Azure cloud services, containerized
    architectures, and modern software engineering practices.

  - Implement and support Generative AI, Retrieval-Augmented
    Generation (RAG), Agentic AI, and AI-powered automation
    solutions across enterprise business functions.

  - Develop and maintain API-driven integrations with enterprise
    platforms including Microsoft Graph, SharePoint, Microsoft
    Fabric, Snowflake, Power BI, and other business
    applications.

  - Collaborate with AI engineers, data engineers, architects,
    cybersecurity teams, and business stakeholders to deliver
    secure and production-ready AI solutions.

  - Design and implement CI/CD pipelines, automated deployment
    frameworks, monitoring solutions, and operational best
    practices for AI workloads.

  - Deploy and manage AI applications using Azure Container
    Apps, cloud-native services, and infrastructure automation
    techniques.

  - Ensure compliance with enterprise security, governance,
    responsible AI, and regulatory requirements, particularly
    within healthcare and other regulated environments.

  - Contribute to platform standardization, architecture
    reviews, technical documentation, and cloud engineering
    best practices.

  - Experience with multi-agent orchestration frameworks,
    autonomous AI systems, and advanced LLM application
    architectures.

  - Knowledge of Responsible AI, model evaluation frameworks,
    enterprise governance, compliance, and risk management
    practices.

  Your Skills and Expertise

  To set you up for success in this role from day one,
  Solventum requires (at a minimum) the following
  qualifications:

  - Bachelor’s Degree or higher in Computer Science,
    Engineering, Data Science, Mathematics, Information
    Technology, or a related technical field AND 5-7 years of
    job-related experience OR High School Diploma/GED AND 10
    years of the same job-related experience.

  In addition to the above requirements, the following are
  also required:

  - Proficiency in Python and modern API development frameworks
    such as FastAPI.

  - Hands-on experience with Microsoft Azure and cloud-native
    application development.

  - Strong experience with Azure OpenAI, Azure AI Foundry, Azure
    AI Search, Azure Container Apps, Azure Functions, and
    related Azure platform services.

  - Experience building and deploying enterprise-scale AI/ML and
    Generative AI solutions in cloud environments.

  - Working knowledge of Retrieval-Augmented Generation (RAG),
    vector search architectures, prompt orchestration, and
    Agentic AI systems.

  - Experience with Docker containerization and cloud deployment
    patterns.

  - Experience implementing CI/CD pipelines using GitHub
    Actions, Azure DevOps, and modern DevSecOps practices.

  - Working knowledge of infrastructure monitoring, logging,
    application telemetry, and observability tools.

  - Experience integrating enterprise applications through REST
    APIs, Microsoft Graph APIs, SharePoint services, and cloud
    data platforms.

  - Familiarity with Microsoft Fabric, Snowflake, and Power BI
    integration architectures.

  - Strong understanding of cloud security principles including
    RBAC, Managed Identity, Key Vault, secret management, and
    secure application design.

  - Knowledge of scalable application architecture, distributed
    systems, performance optimization, and reliability
    engineering.

  - Professional proficiency in English required.



  Additional qualifications that could help you succeed even
  further in this role include:

  - Master's Degree or higher in Computer Science, Cloud
    Computing, Artificial Intelligence, Machine Learning, or
    related technical discipline.

  - Experience implementing enterprise AI platforms, AI Centers
    of Excellence, or cloud-based AI transformation
    initiatives.

  - Experience deploying and supporting AI workloads in
    regulated industries such as healthcare, life sciences, or
    medical technology.

  - Hands-on experience with Infrastructure as Code (IaC) tools
    such as Terraform, Bicep, or equivalent cloud automation
    frameworks.

  - Passion for innovation, continuous learning, and solving
    complex cloud and AI engineering challenges.



  Additional Requirements

  In this role, you may be required to enter healthcare or
  other third-party facilities. Those facilities may, in turn,
  require you to possess certain licenses, vaccinations,
  and/or other credentials or qualifications (collectively
  “prerequisites to entry”) for regulatory, safety, or other
  business reasons. All information will be kept in accordance
  with applicable law and Solventum policies. In order to
  respond to the prerequisites to entry, Solventum may share
  your information with the providers of medical screens,
  vaccinations, or verifications as well as the healthcare or
  other third-party facilities requiring the prerequisites to
  entry.

