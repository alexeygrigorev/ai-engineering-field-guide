description: |
  About the Role

  We are looking for a passionate Agentic AI Developer to
  design, build, and deploy intelligent AI agents that can
  automate real-world business processes and day-to-day
  workflows. The ideal candidate will work at the intersection
  of Artificial Intelligence, Software Development,
  Automation, and Multi-Agent Systems, creating AI-powered
  solutions that can reason, plan, execute tasks, and
  integrate seamlessly with enterprise applications.

  This role requires strong software engineering fundamentals
  along with hands-on experience in developing AI applications
  using modern LLMs, AI frameworks, and agent orchestration
  platforms.

  Key Responsibilities

  - Design, develop, and deploy autonomous and semi-autonomous
    AI agents for business and consumer use cases.
  - Build Agentic workflows involving planning, reasoning,
    memory management, and tool usage.
  - Develop AI-powered applications using Large Language Models
    (LLMs) such as GPT, Claude, Gemini, Llama, etc.
  - Integrate AI agents with enterprise systems, APIs,
    databases, CRMs, ERPs, and third-party platforms.
  - Create multi-agent ecosystems capable of collaboration and
    task delegation.
  - Build AI copilots, chatbots, automation assistants, and
    workflow orchestration solutions.
  - Develop backend services and APIs to support agent-based
    applications.
  - Implement Retrieval-Augmented Generation (RAG), vector
    databases, and knowledge management systems.
  - Optimize AI applications for performance, scalability,
    security, and cost efficiency.
  - Evaluate emerging AI technologies and recommend innovative
    solutions.
  - Collaborate with product, engineering, and business teams to
    identify automation opportunities.

  Requirements

  Required Skills AI & Agent Development

  - Experience with AI agent frameworks such as:
    - LangGraph
    - LangChain
    - CrewAI
    - AutoGen
    - Semantic Kernel
    - OpenAI Agents SDK
  - Strong understanding of:
    - Agentic AI
    - Multi-Agent Systems
    - Prompt Engineering
    - RAG Architectures
    - Function Calling & Tool Usage
    - AI Memory Management

  Software Development

  - Strong programming skills in:
    - Python (Mandatory)
    - JavaScript / TypeScript
  - Experience with:
    - REST APIs
    - Microservices Architecture
    - Backend Development
    - Database Design

  AI Ecosystem

  - Experience working with:
    - OpenAI
    - Azure AI Services
    - Anthropic Claude
    - Google Gemini
    - Open-Source LLMs

  Data & Infrastructure

  - Vector Databases:
    - Pinecone
    - Weaviate
    - Chroma
    - Milvus
  - Databases:
    - SQL
    - PostgreSQL
    - MongoDB

  Cloud & DevOps

  - Azure / AWS / GCP
  - Docker
  - Git
  - CI/CD Pipelines

  Preferred Qualifications

  - Bachelor's or Master's degree in Computer Science, AI, Data
    Science, or related field.
  - Experience building enterprise-grade AI applications.
  - Hands-on experience with workflow automation platforms.
  - Understanding of AI governance, security, and responsible AI
    practices.
  - Exposure to MLOps and AI deployment frameworks.
