description: |
  The Opportunity As a Fraud Solutions - Data Scientist - Risk
  Detect - Manager, you will leverage data and analytics to
  provide strategic insights and drive informed decision-
  making for clients. You will develop and implement
  innovative solutions to optimize business performance and
  enhance competitive advantage within our Risk & Regulatory
  practice. As a Manager, you will motivate, develop, and
  inspire others to deliver quality, while coaching and
  leveraging team members' unique strengths to meet client
  expectations. You are expected to lead with integrity and
  authenticity, articulating our purpose and values in a
  meaningful way, and embrace technology and innovation to
  enhance your delivery. In this role at PwC, you will analyze
  and identify the linkages and interactions between the
  component parts of an entire system, taking ownership of
  projects to validate their successful planning, budgeting,
  execution, and completion. You will address conflicts or
  issues, engaging in difficult conversations with clients,
  team members, and other stakeholders, escalating where
  appropriate. You will uphold and reinforce professional and
  technical standards, the Firm's code of conduct, and
  independence requirements, all while contributing to the
  success of our Firm by identifying opportunities that align
  with our broader business strategies. Responsibilities
  - Leading data-driven initiatives to optimize business
    performance and enhance competitive advantage
  - Developing and implementing innovative solutions using
    advanced analytics techniques to drive strategic insights
  - Managing client service accounts and driving engagement
    workstreams by supervising teams and solving complex
    problems
  - Utilizing Python and data science methodologies to analyze
    and interpret large data sets for informed decision-making
  - Building and maintaining data pipelines and architectures to
    support business intelligence efforts
  - Guiding teams in strategic planning and execution while
    mentoring junior staff to leverage their strengths
  - Collaborating with stakeholders to address conflicts and
    engage in critical conversations, escalating when
    necessary
  - Upholding professional and technical standards, including
    adherence to the firm's code of conduct and independence
    requirements
  - Promoting continuous process improvement and embracing
    change to enhance delivery and encourage innovation
  What You Must Have
  - At least a Bachelor's degree
  - At least 5 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Analytics/Data Science,
    Biology/Biomedical Sciences, Business
    Administration/Management, Computer Science/Information
    Systems, Economics, Engineering, Finance, Financial
    Mathematics/Quantitative Finance, Health
    Administration/Public Health, Mathematics/Statistics,
    Operations/Supply Chain, Project/Technology Management,
    Risk Management/Insurance, Science
  - Excelling in data analysis and interpretation for strategic
    insights
  - Utilizing Python for advanced data science applications
  - Developing data visualization techniques to enhance
    decision-making
  - Embracing continuous process improvement in data management
  - Engaging in stakeholder collaboration for successful project
    outcomes
  - Demonstrating leadership in coaching and mentoring team
    members
