description: |
  Who are we:

  At Maersk, we are redefining global logistics through data,
  platform engineering, and AI-driven innovation. As part of
  this journey, we are building scalable platforms and
  intelligent systems that enable faster decision-making,
  operational efficiency, and seamless integration across the
  enterprise.

  Team/Opportunity:

  As an Associate Software Engineer, AI & Data, you will
  design, build, and scale data and AI-driven applications
  that power critical business capabilities.

  You will work at the intersection of data engineering,
  platform development, and agentic AI, contributing to end-
  to-end solution delivery, from data pipelines to intelligent
  applications enabling self-service analytics and AI-driven
  decision-making across the enterprise.

  What you will do:

  AI, Agentic AI & Application Development

  - Design and build AI-powered and agentic AI applications,
    leveraging modern frameworks and enterprise AI platforms

  - Develop intelligent workflows using AI agents to automate
    business processes and decision-making

  - Contribute to end-to-end AI application development,
    including APIs, backend services, and user-facing
    integrations

  Data Engineering & Analytics Enablement

  - Build scalable data pipelines and data products to support
    AI and analytics use cases

  - Enable self-service data access and reporting, ensuring
    governed and reliable data consumption

  - Contribute to integrated data foundations enabling cross-
    platform use cases (e.g., end-to-end visibility)

  Software Engineering & Platform Development

  - Develop scalable, secure backend services and APIs to
    support AI and data applications

  - Follow modern engineering practices including CI/CD, DevOps,
    testing, and observability

  - Contribute to reusable platform components and shared
    capabilities

  Cross-Functional Delivery

  - Work with Product, Data, Platform, and AI teams to deliver
    end-to-end solutions

  - Contribute to architecture discussions and ensure alignment
    with enterprise standards

  - Support integrations across SAP and non-SAP ecosystems

  Operational Excellence

  - Ensure solutions are reliable, scalable, and production-
    ready

  - Monitor, troubleshoot, and continuously improve platform
    performance

  - Drive automation, observability, and supportability of AI
    and data solutions

  Our Ideal Candidate:

  - Strong software engineering experience with focus on
    backend, data, or platform development

  - Hands-on experience building AI/ML or agentic AI-based
    applications

  - Solid understanding of data engineering, data pipelines, and
    analytics use cases

  - Familiarity with cloud platforms (Azure preferred) and
    distributed systems

  - Strong problem-solving skills with ownership mindset and
    ability to work across teams



  Required Skills/Experience:

  - BE or B Tech in a Computer Science or a science/engineering
    discipline.

  - 2–5 years of experience in software engineering or data
    engineering

  - Proficiency in Python, Java, or similar programming
    languages

  - Experience with SQL and basic data pipelines / ETL processes

  - Understanding of APIs, microservices, and backend
    development

  - Exposure to cloud platforms and DevOps practices

  - Basic knowledge of AI/ML or interest in building AI-driven
    solutions

