title: "AI Automation Engineer, Marketing & Growth (Contract)"
company: Wynd Labs
location: USA
remote: true
work_type: CONTRACTOR
description: |
  Who We Are:

  We build infrastructure that delivers massive amounts of web
  data to the companies training the world’s most powerful AI
  models.

  We're the team that helps to power and support Grass, a
  bandwidth-sharing network that lets us operate a massive
  distributed crawler, giving us unique access to high-quality
  public web data at global scale. On top of that, we’ve built
  pipelines for ingesting, segmenting, and annotating billions
  of videos, transcripts, and audio files, powering dataset
  creation for frontier labs.

  We’re lean, technical, and move fast. No red tape, no slow
  decision-making; just a team of builders pushing to expand
  what’s possible for open web data and AI.

  The Role:

  We are seeking a hands-on AI Automation Engineer to come in
  for a fixed engagement and rebuild how our marketing, growth
  and community work gets done. Today, producing and
  distributing our content and running our community takes
  roughly 10 hours of manual work per cycle. Your goal is to
  bring that to about 2, with the remaining time spent on
  judgment, approvals and relationships rather than copy-
  pasting, formatting and scheduling.

  This role is ideal for someone who enjoys building, cares
  about the quality of what they ship, and can work with a
  high degree of independence. You should be comfortable
  taking a high-level objective, auditing how the work is done
  today, deciding what to automate and what to leave human,
  and driving it through to reliable workflows our team runs
  without you after the engagement ends.

  Who You Are:

  - Acts with integrity and seeks out responsibility
  - Demonstrates resilience, resourcefulness, and motivation for
    getting things done
  - Organized and process-driven
  - Approaches challenges as opportunities
  - Curious and challenges personal assumptions regularly
  - Welcomes feedback and open dialogue
  - Values team success over personal recognition

  What You'll Be Doing:

  - Map how a blog post gets made today, from idea to published,
    time each step, and set a baseline we can measure against.
  - Build automated workflows and agents for the rote parts of
    blog production: research and source gathering, briefs and
    outlines, first drafts, fact and link checks, SEO
    metadata, formatting and publishing to our CMS, with a
    human edit and approval step before anything goes live.
  - Encode our brand voice into reusable prompts, style guides
    and examples so drafts need light edits, not rewrites.
  - Automate the creation of marketing and sales collateral
    (one-pagers, case studies, slide decks, email sequences)
    from templates and our existing content, product docs and
    customer stories.
  - Turn each published post into on-brand drafts for X,
    LinkedIn and our community channels.
  - Document every workflow and run a handoff so the team can
    operate and adjust it after you leave.

  Skills, Requirements and Qualifications:

  - 2+ years building automation, integrations or internal
    tooling, with at least some of it for marketing, growth or
    community teams.
  - Hands-on experience building production workflows with LLM
    APIs (e.g. Claude, OpenAI), including prompt design,
    structured outputs and evaluating output quality.
  - Proficiency with a workflow platform such as n8n, Make or
    Zapier, plus enough Python or TypeScript to go beyond what
    no-code tools can do.
  - Experience connecting social, email, CRM, and community
    platform APIs, and handling auth, rate limits, and
    failures gracefully.
  - A portfolio of workflows you have shipped that are still
    running, and the ability to walk us through the before-
    and-after.
  - Strong written judgment: you can tell when AI output is on-
    brand and when it isn't.

  Nice to Have:

  - Experience building Discord, Telegram, or Slack bots.
  - Experience with retrieval over company docs (RAG) for
    support or FAQ assistants.
  - Familiarity with marketing analytics and attribution tools.
  - A background in marketing, content, or community yourself.

  Why Work With Us:

  - Opportunity. We are at the forefront of developing a web-
    scale crawler and knowledge graph that improves access to
    public web data and extends the value of AI to the people.
  - Culture. We're a lean team with a high bar. We come to work
    not to be comfortable, but to find out what we're capable
    of and to do work that matters. We're not calling for
    people who keep things moving. We're calling for people
    who make everyone around them better. We prioritize low
    ego and high output. This is a fully remote team.
  - Compensation. You’ll receive a competitive salary &
    benefits.
