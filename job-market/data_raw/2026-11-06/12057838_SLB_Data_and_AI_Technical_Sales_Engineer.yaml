description: |
  Job Summary:

  The Digital Data and AI Technical Sales Engineer provide
  direct support for Oil & Gas upstream and bridges the gap
  between complex artificial intelligence, cloud analytics,
  and business buyers. They should be customer centric
  mindset, should be able to identify customers requirements
  and challenges and come up with the appropriate technical
  solutions, build custom proofs-of-concept (PoCs) to help
  enterprise clients adopt data and machine learning platforms
  and their solutions, participating in the building and
  execution of sales strategies by identifying opportunities
  based on expertise of Oil & Gas exploration and production
  cycle.

  This position establishes professional relationships at
  client user level as well as at the executive level, and
  shares gained client requirements and opportunities across
  the Slb different domains and functions to maximize SLB
  value, as well as to provide input into the R&D process. The
  Digital Data and AI Technical Sales Engineer develop a deep
  understanding of the Oil and Gas upstream exploration and
  production Domain strategy and technology and will
  contribute to products and services adoption in the
  Divisional Unit.



  Key Responsibilities:

  - Develops new business by actively participating in promoting
    of Slb's new technology and services offerings related to
    Data and AI in any digital Domain.
  - Establishes lasting, professional relationships with
    customer contacts.
  - Understands customers local environment and identifies new
    Data and AI applications suited to their needs and
    challenges.
  - Ensures that customer problems arising from sales are
    responded to and appropriately managed.
  - Provides answers to technical questions on Data and AI
    domain in E&P cycle from customers and produces applicable
    Data and AI related solution.
  - Maintains integrity in all words and actions ensuring
    ethics, quality and HSE (Health Safety and Environment)
    are evident and a key differentiator.
  - Provides technical support for marketing activities such as
    presentations, demonstrations, and technology launches for
    application of Data and AI on related Oil & Gas
    exploration and production applications.
  - Delivery of the yearly assigned revenue targets for Data and
    AI domain for Oil & Gas exploration and production domain.

  Additional Experiences and Responsibilities:

  - Candidates with previous experience with digital oil field
    workflow design, testing and implementation would be
    preferred.
  - Consult with relevant subject matter experts as required to
    optimize the technical design.
  - Experience in providing technical support throughout the
    service delivery process.

  Location of Assignment: Navi Mumbai, INDIA

  Reporting to Digital Sales and Commercial Manager

  Behavior:

  - Customer focused; communicates effectively with
    stakeholders; promotes good client relations on a social
    and professional level with strong oral and written
    communication skills; able to confidently facilitate
    meetings.
  - Practices effective listening techniques.
  - Strong drive to seek alignment.
  - Strong Team Player & ready for traveling and client-facing
    roles.
  - Leads by example and always acts professionally.

  Minimum Qualification –  Bachelor Petroleum engineering and
  technology or Master of Science, Master. Tech. in Geology/
  Geophysics/ Geoscience from reputed university. Additional
  certification/ course in AI and Data Analytics will be
  preferred.

  Experience –  Preferably from Oil and gas upstream industry
  with minimum 3-5 years’ experience in E&P workflow or any
  other upstream division along with 3-4 years of experience
  in Data Science/ AI/ Analytics.

  SLB is an equal employment opportunity employer. Qualified
  applicants are considered without regard to race, color,
  religion, sex, national origin, age, disability, or other
  characteristics protected by law.
