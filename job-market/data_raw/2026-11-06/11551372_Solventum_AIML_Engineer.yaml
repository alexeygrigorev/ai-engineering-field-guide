  Job Description:

  AI/ ML Engineer (Solventum)

  3M Health Care is now Solventum

  At Solventum, we enable better, smarter, safer healthcare to
  improve lives. As a new company with a long legacy of
  creating breakthrough solutions for our customers’ toughest
  challenges, we pioneer game-changing innovations at the
  intersection of health, material and data science that
  change patients' lives for the better while enabling
  healthcare professionals to perform at their best. Because
  people, and their wellbeing, are at the heart of every
  scientific advancement we pursue.

  We partner closely with the brightest minds in healthcare to
  ensure that every solution we create melds the latest
  technology with compassion and empathy. Because at
  Solventum, we never stop solving for you.

  The Impact You’ll Make in this Role

  As an AI/ML Engineer, you will have the opportunity to tap
  into your curiosity and collaborate with some of the most
  innovative and diverse people around the world. Here, you
  will make an impact by:

  - Design, develop, and implement AI/ML solutions to solve
    business problems, contributing to projects from proof of
    concept and pilot through production deployment.
  - Build and apply both traditional machine learning models and
    modern AI techniques, including large language models
    (LLMs), generative AI, retrieval-augmented generation
    (RAG), and agentic AI systems.
  - Collaborate with senior engineers, product managers, data
    scientists, and business stakeholders to refine project
    scope, technical approach, success metrics, and deployment
    requirements.
  - Contribute to building scalable and maintainable AI systems
    with a focus on accuracy, robustness, fairness, and
    explainability, adhering to responsible AI principles.
  - Apply model evaluation frameworks to assess performance,
    generalization, bias, and resilience to edge cases or
    adversarial inputs.
  - Support the transition of AI prototypes into production-
    ready systems by partnering with platform and engineering
    teams on deployment, monitoring, and lifecycle management.
  - Contribute to documentation, governance, and compliance
    processes to meet enterprise and regulatory standards,
    especially in healthcare and other regulated environments.

  Your Skills and Expertise

  To set you up for success in this role from day one,
  Solventum requires (at a minimum) the following
  qualifications:

  - Bachelor’s Degree or higher in Computer Science, Data
    Science, Engineering, Mathematics, or a related technical
    field AND 5-10 years of job-related experience.

  In addition to the above requirements, the following are
  also required:

  - Proficiency in AI programming languages (e.g., Python)
  - Hands-on experience with ML libraries and frameworks such as
    PyTorch, TensorFlow, scikit-learn, AWS Bedrock, and Azure
    AI Foundry
  - Solid software engineering skills (testing, code quality,
    modular design, performance awareness)
  - Experience building end-to-end ML pipelines (data
    preparation, training, evaluation, deployment integration)
  - Experience designing, training, and tuning deep neural
    networks
  - Understanding of model architecture, training dynamics, and
    evaluation techniques
  - Exposure to autonomous and/or multi-agent systems, including
    basic agent orchestration and tool usage
  - Understanding of reliability, safety, and evaluation
    considerations for agent-based systems
  - Familiarity with deploying or supporting AI solutions on
    cloud platforms
  - Professional proficiency in English required

  Additional qualifications that could help you succeed even
  further in this role include:

  - Master’s degree or higher in Computer Science, Machine
    Learning, AI, or related field.
  - Exposure to regulated industries such as healthcare, with
    understanding compliance and governance requirements.
  - Enthusiasm for solving complex AI problems and a strong
    desire for continuous learning and innovation.

  Additional Requirements

  In this role, you may be required to enter healthcare or
  other third-party facilities. Those facilities may, in turn,
  require you to possess certain licenses, vaccinations,
  and/or other credentials or qualifications (collectively
  “prerequisites to entry”) for regulatory, safety, or other
  business reasons. All information will be kept in accordance
  with applicable law and Solventum policies. In order to
  respond to the prerequisites to entry, Solventum may share
  your information with the providers of medical screens,
  vaccinations, or verifications as well as the healthcare or
  other third-party facilities requiring the prerequisites to
  entry.

