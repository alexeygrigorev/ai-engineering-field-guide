title: Global Tech - Software Developer with AI, Sr. Associate
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  The Opportunity As a Software Developer with AI, Sr.
  Associate you will develop innovative software solutions
  that support digital transformation, using your software
  engineering skills to design, code, test, and maintain
  applications that align with evolving business needs within
  our Internal Firm Services practice. As a Senior Associate
  you will analyze complex problems, manage assigned
  workstreams, build meaningful relationships, and mentor
  junior team members while navigating ambiguity and
  developing your technical skills and personal brand. In this
  role at PwC, you will use AI fluency, application
  development, software design, debugging, and quality
  software practices to deliver work across the software
  development lifecycle, interpret data to inform
  recommendations, and respond to changing priorities in a
  practice support environment. Responsibilities
  - Developing software solutions using Python, Java,
    JavaScript, or related programming languages
  - Designing and building applications with AI-enabled
    features, microservices, and enterprise integration
    patterns
  - Translating business requirements into functional technical
    designs and implementable code
  - Writing, reviewing, and debugging code to improve
    reliability, maintainability, and performance
  - Creating and executing test cases, including acceptance-
    driven and automated testing approaches
  - Using CI/CD pipelines and application lifecycle management
    tools to support controlled releases
  - Collaborating with internal stakeholders to clarify
    priorities, refine requirements, and track progress on
    assigned workstreams
  - Troubleshooting software issues, documenting root causes,
    and applying corrective fixes across development and
    maintenance activities
  - Applying coding standards, architecture principles, and
    quality controls across the software development process
  - Contributing to solution design discussions and identifying
    opportunities to improve user experience and delivery
    speed
  What You Must Have
  - At least a Bachelor's degree or, in lieu of a degree,
    demonstrating in addition to the minimum years of
    experience required for the role, three years of
    specialized training and/or progressively responsible work
    experience in Software Engineering for each missing year
    of college is required
  - At least 2 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Accounting, Business Analytics, Computer and
    Information Science, Computer Systems Analysis, Data
    Processing/Analytics/Science, Finance, Information
    Technology, Management Information Systems
  - Demonstrating experience building software using Java,
    Python, or JavaScript
  - Applying AI tools, prompt techniques, and human validation
    in development
  - Using CI/CD, code review, and testing in delivery cycles
  - Translating business needs into functional software design
  - Interpreting data to guide technical decisions and
    recommendations
  - Mentoring peers and navigating ambiguity in team settings
  The salary range for this position is: $55,000 - $151,470.
