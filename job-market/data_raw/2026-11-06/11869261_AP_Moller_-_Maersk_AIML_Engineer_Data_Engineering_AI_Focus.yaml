description: |
  Data AI/ML (Artificial Intelligence and Machine Learning)
  Engineering involves the use of algorithms and statistical
  models to enable systems to analyze data, learn patterns,
  and make data-driven predictions or decisions without
  explicit human programming. AI/ML applications leverage vast
  amounts of data to identify insights, automate processes,
  and solve complex problems across a wide range of fields,
  including healthcare, finance, e-commerce, and more. AI/ML
  processes transform raw data into actionable intelligence,
  enabling automation, predictive analytics, and intelligent
  solutions. Data AI/ML combines advanced statistical
  modeling, computational power, and data engineering to build
  intelligent systems that can learn, adapt, and automate
  decisions.

  AI/ML Engineer (Data Engineering + AI Focus)

  A.P. Moller – Maersk is the global leader in container
  shipping services. The business operates in 130 countries
  and employs 80,000 staff. An integrated container logistics
  company, Maersk aims to connect and simplify its customers’
  supply chains. Today, we have more than 180 nationalities
  represented in our workforce across 131 Countries and this
  mean, we have elevated level of responsibility to continue
  to build inclusive workforce that is truly representative of
  our customers and their customers and our vendor partners
  too. The Brief

  In this role as an AI/ML Engineer within the Global Data &
  Analytics (GDA) team, you will build and scale data-
  intensive AI/ML solutions that power intelligent decision-
  making across Maersk’s supply chain ecosystem.

  This role combines strong data engineering foundations with
  applied AI/ML expertise, enabling the development of robust
  data pipelines, scalable ML systems, and production-grade AI
  applications.

  You will work on designing reliable data platforms, enabling
  high-quality data availability, and embedding advanced
  analytics and AI capabilities into business workflows.

  Key Responsibilities:

  - Partner with business, product, and engineering teams to
    define scalable data and AI/ML solutions aligned with
    measurable business outcomes.
  - Design, build, and maintain robust data pipelines and data
    platforms using Python, Spark/PySpark, and cloud-native
    services.
  - Develop and deploy end-to-end AI/ML solutions, including
    data ingestion, feature engineering, model training,
    evaluation, and production deployment.
  - Architect and optimize large-scale data processing systems
    on cloud platforms (Azure/AWS), ensuring performance,
    reliability, and cost efficiency.
  - Implement and manage MLOps and DataOps practices, including
    CI/CD pipelines, model versioning, monitoring, and
    automated retraining.
  - Work with LLMs and Generative AI systems, integrating them
    into production workflows using frameworks such as
    LangChain, LlamaIndex, or similar.
  - Design and maintain data models (batch and streaming) that
    support analytics, reporting, and AI use cases.
  - Ensure data quality, governance, and observability across
    pipelines and ML systems.
  - Optimize infrastructure and workloads for cost, scalability,
    and performance, including efficient use of compute and
    storage.
  - Collaborate with engineering teams to deploy solutions using
    containerization and orchestration (Docker, Kubernetes).
  - Mentor junior engineers and contribute to engineering
    excellence through code reviews and best practices.

  We are looking for:

  - 7+ years of experience across Data Engineering and AI/ML
    engineering in production environments.
  - Strong programming skills in Python and SQL, with hands-on
    expertise in Spark/PySpark for large-scale data
    processing.
  - Deep experience with cloud platforms (Azure or AWS),
    including services for data engineering, ML, and
    distributed systems (e.g., Databricks, Synapse, EMR, S3,
    ADF, etc.).
  - Hands-on experience in building and deploying scalable data
    pipelines and ML systems.
  - Strong understanding of data modeling (data lakes,
    lakehouse, warehouse, medallion architecture).
  - Experience with MLOps frameworks (e.g., MLflow) and
    production model lifecycle management.
  - Practical experience with LLMs / Generative AI applications,
    including RAG, document processing, or workflow
    automation.
  - Experience with containerization (Docker) and orchestration
    (Kubernetes).
  - Strong understanding of system design, scalability, and cost
    optimization in cloud environments.
  - Experience with data quality, observability, and monitoring
    frameworks.
  - Ability to translate business problems into scalable
    technical solutions with measurable impact.
  - Prior experience in logistics, supply chain, or operations
    is a plus.
  - Experience in simulation, optimization, or operations
    research is an added advantage.

