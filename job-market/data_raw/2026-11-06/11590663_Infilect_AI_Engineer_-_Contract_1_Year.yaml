description: |
  Infilect, a leader in visual-intelligence for worldwide
  retail, is looking for candidates with engineering and deep
  learning experience of at least 2 years in the industry



  About Infilect:

  Infilect is founded by two PhDs and ex-IBM-Research-
  Scientists to build scalable visual-AI systems to make the
  world a better place. Infilect (https://www.infilect.com)
  builds state of the art cloud and AI applications for the
  worldwide retail industry. We process images and videos at
  scale and in real-time in order to solve retail supply-chain
  problems, and make an environmentally sustainable net-
  positive impact on the world. We are driven by the promise
  of AI and software technology to save time, save cost, save
  energy, and improve user experience for businesses and
  consumers all over the world.

  Responsibilities:

  - Reading research papers and implementing state-of-the-art
    techniques
  - Rapidly extending publicly available code modules to work on
    custom problems
  - Software development of machine learning back-end
  - Rapid experimentation, analysis, and deployment of
    machine/deep learning models
  - Training and testing deep learning models at scale
  - Working on cutting-edge technology in object detection,
    object tracking, OCR in natural scenes, image
    classification, video analysis, and many more exciting
    techniques that form the basis of AI (artificial
    intelligence).

  Skills Required:

  - Hands-on experience in deep/machine learning for computer
    vision of 2+ years (extensive experience OpenCV, PyTorch,
    Tensorflow)
  - Hands-on experience in Python with 2+ years of in-depth
    system building experience
  - Smart programmers with strong analytical skills

  Job Perks:

  - Work on a problem that will have positive impact on millions
    of users
  - Work with experienced computer scientists
  - Lively and highly collaborative environment

  We offer a competitive salary, commission structure, and
  benefits package, as well as a dynamic and fast-paced work
  environment. We are an early-stage startup, and it implies
  putting your heart out to connect with customers and team
  members, solve hard & challenging problems, and build &
  maintain scalable systems. We are also quite conscious to
  build a highly collaborative & rich culture at Infilect.
  From 50 today, we expect to be 200 team member strong team
  in the next 2 years, serving global customers. If this
  interests you, come and join us on the rocket ship!

