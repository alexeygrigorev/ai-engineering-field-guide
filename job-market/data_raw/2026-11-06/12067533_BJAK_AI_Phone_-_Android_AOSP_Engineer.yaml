description: |
  About

  We are reimagining the phone. AI phones need to be
  proactive, intuitive, intelligent and low cost. This is a
  mission critical for rest of the world to adopt
  intelligence.

  There are over 5 billion people using everyday applications
  such as email, messaging, notes, tasks, and calendars, yet
  most are not AI-native. Our mission is to build proactive
  applications and devices that bring intelligence into daily
  conversations, coordination and workflows, with minimal
  prompting.

  Focus: Implementing the OS-level functionality and system
  integrations required by AI agents.

  Responsibilities

  - Develop and modify Android Framework components.
  - Implement system services and privileged APIs.
  - Build secure interfaces for AI agents to access system
    functionality.
  - Work on application lifecycle, permissions and background
    execution.
  - Implement system-level integration with first-party
    applications.
  - Improve OS stability and performance.
  - Collaborate with agent engineers on execution capabilities.

  Requirements

  - Strong Android development experience.
  - Java / Kotlin.
  - Android Framework or AOSP knowledge.
  - Understanding of system services, Binder IPC and
    permissions.
  - Experience debugging complex Android issues.

  Nice to have

  - Custom ROM development.
  - C++ and Linux knowledge.
  - Android security and power management.
  - Experience shipping system-level Android functionality.
