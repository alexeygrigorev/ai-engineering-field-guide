description: |
  Our client is an international online gaming company focused
  on delivering engaging and innovative gaming experiences,
  leveraging modern technologies to provide high-quality
  products and services for a global audience.Perfect for
  those who aim to:

  - Manage the complete development cycle of AI automation
    features from initial theme brief input to automated asset
    generation, validation, and integration into existing
    release pipelines;
  - Analyze product requirements and model output quality to
    identify and mitigate potential generation defects or
    pipeline bottlenecks well ahead of release schedules;
  - Architect and optimize Generative AI workflows, model
    selection, and prompt engineering to consistently produce
    high-fidelity static files and visual assets tailored for
    slot games;
  - Implement strict AI security, input validation, and
    guardrails to prevent prompt injection attacks and
    safeguard automated backend integrations;
  - Develop backend integrations connecting AI asset generation
    services with game engines, asset storage pipelines, and
    operator management panels;
  - Work closely with QA, UI/UX designer, and gamedev teams to
    ensure generated assets pass standards, translation
    checks, and certification tests;
  - Collaborate with software engineers to design scalable
    microservices, manage proxy routing, and optimize request
    handling across distributed environments;
  - Partner with product stakeholders to deliver trend product
    releases quickly and reliably;
  - Build and maintain internal tooling and AI agents to
    continuously streamline product development workflows.

  Experience you’ll need to bring:

  - 3+ years of practical software engineering experience with a
    strong focus on Generative AI and process automation;
  - Strong knowledge of Generative AI models (image generation,
    LLMs, vision-language models) and automated workflow
    orchestration;
  - Advanced Software Engineering — robust architecture, clean
    code principles, strict typing, and reliable error
    handling in production systems without any compromised
    quality;
  - Robust Integration & Networking with hands-on experience
    using Postman, managing HTTP requests, API gateways,
    proxies, and seamlessly linking backend services;
  - Deep understanding of model selection, prompt optimization,
    fine-tuning techniques, and evaluation methods for
    image/asset generation models;
  - Proven expertise in AI security, implementing robust
    guardrails, and defending pipelines against prompt
    injection and malicious inputs;
  - Experience establishing automated verification and review
    layers to validate AI-generated assets against initial
    briefs prior to final human sign-off;
  - Practical experience developing and configuring AI agents
    (Claude Code, Cursor, Copilot, or similar) integrated
    directly into team workflows and CI/CD pipelines;
  - Solid grasp of slot game structure: mechanics, static asset
    pipelines, themes, and reskin delivery processes.

  It's a perfect match if you have those personal features:

  - Strong teamwork and collaboration skills;
  - A responsible and disciplined approach to work;
  - Commitment to continuous learning and self-development;
  - Adaptability to a dynamic, fast-changing environment;
  - Results-oriented mindset.

  Apply, and let your growth journey begin.
