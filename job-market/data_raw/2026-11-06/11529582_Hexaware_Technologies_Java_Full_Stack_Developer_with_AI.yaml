description: |
  Role: Java Full Stack Developer with AI Location: McLean, VA
  (5 Days Onsite) Employment Type: Fulltime

  Note

  Candidates must be authorized to work in the United States
  on a long-term basis without current or future employer
  sponsorship requirements.

  Role Overview

  Seeking an experienced Java Full Stack Developer with AI
  exposure to design, develop, and deploy enterprise
  applications using modern Java, microservices, cloud, and
  front-end technologies.

  Required Qualifications

  - 8-15 years of experience in designing and developing
    applications using Java 8+/J2EE, Spring, Spring Boot,
    RESTful services, and UI frameworks.
  - 2+ years of experience in designing and developing
    microservices using Spring Boot and REST APIs.
  - Strong knowledge and experience with ORM frameworks such as
    JPA/Hibernate.
  - Good knowledge and experience with Docker and Kubernetes.
  - 2+ years of experience with at least one UI framework:
    Angular or ReactJS.
  - 1+ year of experience in designing and implementing cloud-
    based solutions across AWS services such as EC2, IAM, S3,
    Lambda, etc.
  - Good knowledge and experience with any RDBMS/PostgreSQL.
  - Strong experience with the DevOps toolchain: Jenkins,
    Artifactory, Maven/Gradle, and Git/BitBucket.
  - Good knowledge of technical concepts including security,
    transactions, monitoring, and performance.
  - Experience with AI-driven solutions, Python, LangChain, and
    LangGraph will be highly valuable for enterprise
    applications using modern Java, microservices, cloud, and
    front-end technologies.

  Preferred Qualifications

  - Experience with OAuth implementation using Ping Identity.
  - Familiarity with API management using Apigee and service
    mesh using Istio.
  - Experience with Elasticsearch, Logstash, and Kibana.
  - Good knowledge and experience with queue-based
    implementations.
  - Good knowledge and experience with NoSQL, such as MongoDB.
  - Experience with scripting languages such as Unix and Python.

  Soft Skills

  - Fast learner of new technologies and tools.
  - Able to work independently and contribute to the success of
    assigned projects.
  - Participates in discussions with project teams to understand
    application design and build processes and helps deploy
    applications in target environments.
  - Degree in Computer Science, Engineering, or equivalent.
  - AWS certification is preferred.
