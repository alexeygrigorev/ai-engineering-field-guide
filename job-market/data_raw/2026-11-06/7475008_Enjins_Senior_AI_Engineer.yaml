description: |
  Someone has to build the engine

  Since 2018, Enjins has been building high-performance
  engines: production-grade ML systems, data infrastructure,
  and agentic AI, engineered by our AI Engineers from
  architecture to implementation. Real systems that ship, not
  slideware.

  Every engine starts on the workbench: the model
  architecture, the data pipeline, the MLOps foundation that
  has to hold up long after go-live. Someone has to design it
  right the first time, because a client's production
  environment is not the place to discover it doesn't scale.

  That's where you come in. As a Senior AI Engineer, you own
  that build end-to-end, from first architecture decision to a
  production-grade system running at scale inside our clients'
  infrastructure, for high-growth scale-ups in climate, energy
  and mobility.

  Forward Deployed & AI Engineering

  Together, they bridge the gap between cutting-edge
  technology and real-world business value, working hand-in-
  hand to build and scale the future of enterprise AI.

  - AI Engineer: Designs and builds advanced AI systems,
    combining deep expertise in LLMs, MLOps, data engineering,
    and software architecture to solve complex technical
    challenges. Thrives on architecting scalable solutions and
    pushing the boundaries of what's technically possible.
  - Forward Deployed AI Engineer: Sits across the table from
    CEOs, CTOs, and CPOs to uncover what the business actually
    needs, then translates that into working AI solutions.
    Combines strong technical implementation skills with a
    consulting mindset, rapidly building and iterating agentic
    AI applications that deliver measurable business value.
    Interested? See our Forward Deployed AI Engineer vacancy.

  Together, they form the engine: one architecting the robust
  systems that power it at scale, and the other embedding with
  the client to shape the solution.

  The role

  As a Senior AI Engineer, you work at the intersection of
  technical excellence and project leadership within our team
  of 20+ engineers, acting as a hands-on technical lead in a
  consultancy context to maximize the impact of AI
  applications for innovative Dutch and international clients.

  - Own the build. Develop and implement robust AI/ML/LLM
    applications end-to-end, ensuring systems are scalable and
    production-ready from day one.
  - Lead technically. Act as the senior technical partner for
    stakeholders on client engagements, translating complex AI
    architectures into clear business decisions.
  - Grow the team. Coach engineers on the job and share
    knowledge on evolving technologies and stacks.
  - Maximize agentic leverage. Continuously follow and apply new
    AI developments into the systems you architect and the
    impact we can have for clients.
  - Shape Enjins. Play an active role in building the company:
    participate in interviews and identify new tools and
    methods that increase team velocity.

  Requirements

  What matters most: you think in systems and own outcomes
  end-to-end.

  - 3+ years building and scaling data & AI solutions in
    production environments
  - Strong software engineering fundamentals: you write
    production-grade code and know your way around
    infrastructure (Docker, Kubernetes, CI/CD, data pipelines)
  - Mastery of at least one major cloud platform (AWS, Azure,
    GCP) and experience leading MLOps/LLMOps architectures
  - Proven experience taking LLM-based or agentic systems to
    production
  - Experience leading projects, overseeing delivery, and
    managing client accounts
  - You can translate technical complexity into clear decisions
    for non-technical stakeholders
  - Fluent in English and eligible to work in the Netherland

  Benefits

  We publish our salary ranges and keep terms straightforward.
  No surprises.

  Compensation

  - €5,100 - €6,200 gross per month (excl. holiday allowance,
    pension, bonus, and AI-Leap benefits)
  - Annual performance bonus of 1.5 months' salary
  - Two career tracks available: choose between technical
    deepening or engineering leadership

  Growth

  - AI-Leap: our structured development programme with a
    dedicated personal training budget, cloud practitioner
    certification in your first month, and a specialised track
    sharpening skills in leadership, stakeholder management,
    architecture, and Tech Due Diligence
  - 1-on-1 coaching with our Leads and C-level, alongside
    regular feedback moments and project assessments to ensure
    continuous professional evolution

  Team & culture

  - Office on the Oudegracht in Utrecht (note: not yet fully
    accessible for individuals with physical disabilities);
    hybrid setup
  - 28 vacation days, flexible across 3 national holidays
  - Monthly team events (themed parties, sports tournaments, pub
    quizzes) and the annual two-day Enjins Summer Summit on AI
    × Climate
  - OV-First travel policy, fully covered; meat-free catering
  - Apple MacBook Pro and the tools you need
