description: |
  Summary

  We are seeking a highly skilled AI-Powered Java Full Stack
  Developer to join our IT Services team. In this pivotal
  role, you will leverage cutting-edge artificial intelligence
  technologies to architect, build, and maintain robust
  enterprise-grade applications. The position demands a
  professional with extensive expertise in full-stack
  development who can seamlessly integrate advanced AI
  capabilities, such as Retrieval-Augmented Generation (RAG),
  into scalable cloud-native solutions. This role is essential
  for driving innovation within our technical landscape,
  ensuring that our software products remain at the forefront
  of industry advancements while delivering exceptional
  performance and user experiences.

  Responsibilities

  - Design and develop complex, scalable full-stack applications
    utilizing Java, Spring Boot, and modern frontend
    frameworks like React, Angular, or Vue.js.
  - Integrate AI-driven features and models into existing
    systems, specifically implementing RAG architectures to
    enhance data retrieval and processing capabilities.
  - Architect and deploy cloud-based solutions, ensuring high
    availability, security, and efficient resource utilization
    across various cloud environments.
  - Establish and maintain robust CI/CD pipelines to automate
    testing, integration, and deployment processes,
    accelerating the delivery lifecycle.
  - Develop and optimize RESTful and GraphQL APIs to facilitate
    seamless communication between frontend interfaces and
    backend services.
  - Manage and query diverse data stores, including both SQL and
    NoSQL databases, to support complex application logic and
    reporting needs.
  - Collaborate with cross-functional teams to translate
    business requirements into technical specifications and
    high-quality code using C# or .NET where applicable.
  - Conduct code reviews, mentor junior developers, and advocate
    for best practices in software engineering and AI
    integration.

  Requirements

  Requirements:

  - Possess 8 to 12 years of professional experience in software
    development, with a strong focus on full-stack
    technologies.
  - Demonstrate deep proficiency in Java Full Stack Development,
    including extensive hands-on experience with the Spring
    Boot framework.
  - Show proven expertise in implementing AI concepts,
    particularly Retrieval-Augmented Generation (RAG) and
    cloud-based AI services.
  - Have a solid command of modern frontend technologies,
    specifically React, Angular, or Vue.js, for building
    responsive user interfaces.
  - Exhibit strong skills in backend development using C#/.NET
    and database management with both SQL and NoSQL systems.
  - Be well-versed in designing and consuming REST and GraphQL
    APIs for efficient data exchange.
  - Display a comprehensive understanding of Cloud
    infrastructure and the ability to configure and manage
    Continuous Integration/Continuous Deployment (CI/CD)
    pipelines.
  - Hold a competitive salary expectation within the range of
    ₹18-22 LPA, reflecting the seniority and specialized skill
    set required for this position.
