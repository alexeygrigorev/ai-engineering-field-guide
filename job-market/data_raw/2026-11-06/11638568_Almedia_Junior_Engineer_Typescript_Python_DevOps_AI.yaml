description: |
  This isn’t your regular job. Almedia is a place where those
  who want to push harder can accelerate their careers faster
  than anywhere else. We’re aiming to become Germany’s second
  bootstrapped unicorn. Almedia is already Europe’s #3
  fastest-growing company in 2025 (FT1000).

  We are building the future of marketing by rewarding our
  community of over 95 million users for engaging with our
  advertisers’ products. We are offering a new way to acquire
  users for the biggest companies in the world.

  Berlin, On-site Top-of-Market Compensation - Exceptional
  commitment deserves exceptional reward

  Most junior engineers take years to earn full ownership.
  Here as all our engineers, you will have real impact from
  week one and be a part of a team shipping a product millions
  of people use every day. Your first 12 months compress what
  takes 3 years elsewhere.

  You'll join a small team of engineers who have built and
  shipped at scale, with the support to learn fast. Show us
  you can own more, and we'll give you more.

  We're looking for AI-native Junior Software Engineers who
  know how to build with AI tools, with different focus
  points, so you can pick your track:

  - TypeScript (Backend or Frontend):
    - If you love building things people see and use.
    - You'll build features in our web and mobile apps, test what
      works with real users.
    - You'll need: strong TypeScript understanding with a focus on
      either Node.Js or React.Js.
  - Python (Backend):
    - If you love building the systems behind the app.
    - You'll build the services that handle rewards, offers, and
      payments for millions of users.
    - You'll need: strong Python and SQL.
  - DevOps:
    - If you love building the tools that help everyone else ship.
    - You'll build the CI/CD pipelines, deployments, and AI
      tooling our engineers use every day, and make them
      faster and safer.
    - You'll need: strong TypeScript, Python, or Rust; Kubernetes
      or GitHub Actions is a plus.
  - AI:
    - If you love building with LLMs and want to see them work in
      production.
    - You'll build AI features and automation that real users and
      teams rely on like AI-powered product features, internal
      agents.
    - You'll need: Hands-on experience building with LLMs or ML
      models.

  What You’ll Do

  - You'll own real problems from first idea to production.
  - You get going on a vague problem without waiting for a spec,
    and take it further
  - You use AI tools to move faster, and you still check the
    output.
  - You dig into bugs until you find the real cause.

  What You'll Bring

  - Solid fundamentals with proof of depth: projects you
    shipped, open-source contributions, internships, or strong
    coursework.
  - You think about what breaks before it breaks: performance,
    failure modes, edge cases.
  - You debug when things go wrong and find the root cause, not
    just the symptom.
  - Bonus: a live product with real users, a system you built
    and hardened yourself, or hackathon / competitive
    programming results.

  Why Almedia

  - Grow at Almedia: profitable from launch, higher revenue per
    employee than Big Tech.
  - Sharp, small team: we keep it small on purpose, every hire
    raises the bar.
  - Equity: every Berlin employee gets a stake.
  - Top-of-market baseline. Deliver outlier impact, earn
    accordingly.

  Small team, high bar. Growing at scale. If that sounds like
  home, apply.

  We believe in fostering talent, evaluating all skill levels
  during the hiring process, and providing a clear path for
  growth. Almedia is an equal opportunity employer. We embrace
  and celebrate diversity, and encourage individuals from all
  backgrounds to apply.
