  Job Description:

  3M Health Care is now Solventum

  At Solventum, we enable better, smarter, safer healthcare to
  improve lives. As a new company with a long legacy of
  creating breakthrough solutions for our customers’ toughest
  challenges, we pioneer game-changing innovations at the
  intersection of health, material and data science that
  change patients' lives for the better while enabling
  healthcare professionals to perform at their best. Because
  people, and their wellbeing, are at the heart of every
  scientific advancement we pursue.

  We partner closely with the brightest minds in healthcare to
  ensure that every solution we create melds the latest
  technology with compassion and empathy. Because at
  Solventum, we never stop solving for you.

  The Impact You’ll Make in this Role

  As a Power Platform & AI Automation Engineer, you will have
  the opportunity to tap into your curiosity and collaborate
  with some of the most innovative and diverse people around
  the world. Here, you will make an impact by:

  - Leads the end-to-end delivery of assigned automation backlog
    items using Copilot Studio, Cowork, Power Apps, Power
    Automate, and PowerShell for M365 automation,
    administration and lifecycle management, following
    established and recommended architecture patterns,
    governance standards, and ALM guidance.
  - Implements Copilot Studio agents and AI enabled automation
    for approved use cases, applying the organization’s
    governance and security standards.
  - Determines the root causes of automation failures,
    performance issues, and operational incidents reported and
    remediates issues appropriately.
  - Supports production automation and platform workloads in a
    backlog-driven, service-oriented model, contributing to
    documentation, operational runbooks, and knowledge-base
    articles.
  - Builds and maintains Power BI reports and dashboards
    covering automation health, platform usage and adoption,
    and governance/audit metrics.

  Your skills & expertise (Minimum qualifications):

  - Overall experience of 7+ years with Bachelor’s degree in
    Computer Science, Information Technology, or a relevant
    related field.
  - Three (3) years of experience building solutions with Power
    Platform (Power Apps canvas and model-driven applications,
    Power Automate flows with enterprise error-handling and
    resiliency patterns, Dataverse, Copilot Studio).
  - Three (3) years of PowerShell scripting experience for
    Microsoft 365 automation and administration, including
    Graph API.
  - Two (2) years of experience building AI-enabled or agent-
    based solutions (e.g., Copilot Studio, Azure AI Foundry,
    or LLM-based automations)
  - Experience supporting production platforms and automation
    workloads, including incident response and root cause
    analysis.
  - Microsoft certifications such as PL-400 (Power Platform
    Developer), AB-620 (AI Agent Builder Associate), PL-200,
    or AI-102 (Azure AI Engineer Associate).
  - Experience building and governing Copilot Studio agents or
    other AI/agent-based solutions including knowledge
    sources, custom actions and connectors, prompt design, and
    responsible AI practices.
  - Strong troubleshooting and debugging skills, comfort in
    backlog-driven delivery models, clear written
    communication skills, and effective use of AI-assisted
    development tools.



