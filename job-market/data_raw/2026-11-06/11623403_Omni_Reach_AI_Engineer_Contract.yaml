description: |
  We are seeking an AI Engineer to design, develop, deploy,
  and monitor AI and machine learning solutions using Azure
  data and AI services. The role will build secure, scalable
  applications and workflows that address business needs and
  integrate with enterprise systems.

  Key Responsibilities

  - Design and develop AI solutions using Azure Machine
    Learning, Azure AI Studio, and Azure AI Services.
  - Build and deploy machine learning models using Azure ML
    pipelines and SDKs.
  - Create reusable frameworks, components, APIs, and
    accelerators.
  - Develop integrations with SAP, Dynamics 365, Power Platform,
    Dataverse, HR systems, and other Azure services.
  - Work with data engineers, analysts, and business
    stakeholders to translate requirements into AI solutions.
  - Apply security, privacy, and data protection requirements in
    solution design and development.
  - Monitor AI workloads using Azure Monitor, Application
    Insights, and MLOps practices.
  - Evaluate and improve model performance, reliability, and
    cost efficiency.
  - Document technical designs and test cases, and contribute to
    architecture discussions.

  Requirements

  - At least 3 years of experience developing and monitoring AI
    solutions in Azure-based enterprise environments.
  - Hands-on experience designing and deploying AI/ML solutions
    on Azure.
  - Proficiency in Python and Azure SDKs.
  - Strong understanding of AI/ML fundamentals, including model
    training, evaluation, and deployment.
  - Experience developing reusable frameworks, components, APIs,
    or accelerators.
  - Familiarity with cloud-native development and CI/CD
    practices for ML workflows.
  - Knowledge of Azure cloud, enterprise integration, and data
    platform development.
  - Understanding of Microsoft Fabric and modern data platform
    patterns for ingestion, storage, serving, and governance.
  - Hands-on understanding of Azure AI Studio and Azure AI
    Services for AI applications and agents, including
    evaluation, monitoring, and lifecycle considerations.
  - Working knowledge of Copilot Studio, including connectors,
    actions, topics, orchestration, and enterprise deployment.
  - Ability to implement security, identity and access
    management, compliance, and operational governance
    requirements in Azure solutions.
  - Bachelor’s degree in AI Engineering, Data Science
    Engineering, Computer Science, or another engineering
    discipline with relevant experience.
  - Strong English communication, collaboration, and technical
    documentation skills.

  Preferred

  - Experience with AI platform architecture, agent
    architecture, or enterprise copilots.
  - Microsoft certifications such as Fabric Data Engineer
    Associate (DP-700) or Azure AI Engineer Associate (AI-102
    or successor).
