description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you.   Core Mission The Senior
  Enterprise Applied Agent Builder owns the end-to-end
  delivery of complex AI services and Generative AI features
  that automate or augment critical enterprise workflows. The
  role combines strong software engineering execution with
  multi-step agent design, human-centered product thinking,
  and production operations discipline. This individual leads
  solution design from discovery to deployment, integrates AI
  capabilities into enterprise platforms, and establishes
  measurable quality and adoption outcomes. They also mentor
  junior engineers and contribute reusable patterns that help
  the organization ship agentic solutions more consistently.
  Key Responsibilities This is a hybrid role blending hands-on
  delivery with technical ownership, evaluation rigor, and
  cross-functional leadership. 1. End-to-End Ownership of
  Complex AI Services (55% of time) Own the development of a
  complex AI service or GenAI feature, delivering from concept
  through production rollout and ongoing iteration. Translate
  ambiguous business requirements into concrete user stories,
  acceptance criteria, and technical implementation plans.
  Integrate agentic solutions with enterprise systems (e.g.,
  CRMs, ERPs, HR platforms, data warehouses, internal APIs)
  and ensure production-grade performance through rapid
  iteration and troubleshooting. Lead pilot launches and
  transitions, including documentation, user enablement, and
  stakeholder alignment. 2. Multi-Step Agent Architecture,
  Evaluation & Operations (30% of time) Lead the design and
  implementation of multi-step agents, including tool/function
  calling, retrieval, state management, and human-in-the-loop
  oversight where required. Develop evaluation approaches
  (test suites, golden datasets, regression checks) and
  optimize solutions for accuracy, latency, reliability, and
  cost. Implement production observability (logging, tracing,
  monitoring) and contribute to runbooks and incident response
  processes for AI services. 3. Reusable Patterns, Standards &
  Mentorship (15% of time) Extract successful patterns from
  delivery work to create reusable libraries, templates, and
  reference implementations for other teams. Lead technical
  reviews and share best practices for secure, reliable, and
  user-trustworthy agentic systems. Mentor and coach P1-P2
  engineers through code reviews, design reviews, and day-to-
  day execution. Required Qualifications 8+ years of
  experience in software engineering, including ownership of
  production services. 3+ years building and deploying AI/ML
  or Generative AI solutions that deliver measurable business
  results in production. Strong proficiency with LLM
  application patterns: prompt engineering, Retrieval-
  Augmented Generation (RAG), and tool/function calling within
  agentic systems. Experience with agent frameworks (e.g.,
  LangChain, LlamaIndex, Semantic Kernel, Microsoft Agent
  Framework, or similar). Hands-on experience with enterprise
  integrations, authentication/authorization, and secure API
  design. Operational excellence: familiarity with logging,
  tracing, monitoring, performance tuning, and cost management
  for AI applications. Strong communication skills and
  demonstrated ability to lead cross-functional delivery with
  business and technical stakeholders. Bachelor’s degree in
  Computer Science, Engineering, or a related field (or
  equivalent practical experience). Ideal Candidate Profile:
  Who Thrives in This Role Accountable Owner: You take end-to-
  end ownership and ensure solutions are deliverable,
  operable, and adopted. Field-Focused Problem Solver: You get
  energized by embedding with users, mapping real workflows,
  and making tangible improvements. Pragmatic Architect: You
  design solutions that are robust and maintainable, and you
  know when to keep things simple. Evaluation Mindset: You
  build measurement into the product and invest in test
  coverage and monitoring to keep quality stable over time.
  Translator: You communicate tradeoffs clearly to both
  executives and engineers and bridge business needs with
  technical implementation. Mentor: You raise the bar for the
  team through coaching, reviews, and reusable patterns.

  Company Overview:

  UKG is the Workforce Operating Platform that puts workforce
  understanding to work. With the world's largest collection
  of workforce insights, and people-first AI, our ability to
  reveal unseen ways to build trust, amplify productivity, and
  empower talent, is unmatched. It's this expertise that
  equips our customers with the intelligence to solve any
  challenge in any industry — because great organizations know
  their workforce is their competitive edge. Learn more at
  ukg.com.

  UKG is proud to be an equal opportunity employer and is
  committed to promoting diversity and inclusion in the
  workplace, including the recruitment process.     

  Disability Accommodation in the Application and Interview
  Process

  For individuals with disabilities that need additional
  assistance at any point in the application and interview
  process, please email UKGCareers@ukg.com
