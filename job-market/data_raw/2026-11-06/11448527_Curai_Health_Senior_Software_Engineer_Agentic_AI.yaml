description: |
  At Curai, we believe that access to high-quality healthcare
  is a fundamental human right, not a privilege. Our mission
  is to radically transform healthcare delivery by harnessing
  the power of artificial intelligence and clinical expertise
  to make care more affordable, accessible, and effective for
  everyone.  Patients interact with advanced AI systems at
  every step of their care and follow-up. Licensed physicians
  review each case with the patient for the clinical decision
  in our integrated virtual clinic.



  We ground our approach in rigorous research, continuous
  learning, and a deep commitment to clinical integrity. We
  focus on making a real impact: improving health outcomes,
  expanding access to care, and setting new standards for what
  trustworthy, patient-centered healthcare is. Read some of
  our latest publications.

  About the Senior Software Engineer, Agentic AI role

  What You'll Do

  What You'll Bring

  What We Offer

  Compensation: $175,000 - $210,000/year



  The pay range listed for this position reflects what Curai
  Health reasonably and in good faith expects to pay at the
  time of posting. Actual base salary will depend on a variety
  of factors, including your qualifications and years of
  relevant experience.



  Culture: A mission-driven team of talented colleagues who
  are committed to living our values, collaborating closely,
  and driving meaningful impact in healthcare.



  Benefits:

  - Comprehensive medical, dental, and vision coverage
  - Flexible spending plans
  - Generous and flexible Paid Time Off (PTO), floating
    holidays, and parental leave
  - 401k plan with employer matching
  - 100% remote — work from home

  Work Location Requirement: This is a remote position.
  Employees must perform all work physically within the
  country they reside in. International work is not permitted
  during scheduled work hours.

  Work Environment: This is a remote position and may be “on
  camera” at any time. Employees will work from a home office,
  requiring reliable internet connectivity and a secure,
  private workspace.

  Curai Health is an equal opportunity employer and is deeply
  committed to building a diverse and inclusive workforce. In
  keeping with our beliefs and values, no employee or
  applicant will face discrimination or harassment based on
  race, color, ancestry, national origin, religion, age,
  gender, marital or domestic partner status, sexual
  orientation, gender identity, disability status, veteran
  status, or any other legally protected characteristic. To
  promote an equitable and bias-free workplace, we set
  competitive compensation packages for each position and do
  not negotiate on our offers. We are looking for mission-
  driven teammates who embody our core values and appreciate
  our transparent approach.



  Beware of job scam fraudsters! Our company uses @curai.com
  email addresses exclusively. We do not conduct interviews
  via text or instant message and we do not ask candidates to
  download software, to purchase equipment through us, or to
  provide sensitive personally identifiable information such
  as bank account or social security numbers. If you have been
  contacted by someone claiming to be from Curai from a
  different domain about a job offer, please report it as
  potential job fraud to law enforcement and contact us at
  jobs@curai.com.
