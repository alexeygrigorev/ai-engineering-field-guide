  Cloud Engineer (AWS & AI/ML Infrastructure)

  Help shape the future of mobility.

  Imagine a world with zero vehicle accidents, zero vehicle
  emissions, and wireless vehicle connectivity all around us.
  Every day, we move closer to making that world a reality.
  Aptiv’s passionate team of engineers and developers creates
  advanced safety systems, high-performance electrification
  solutions and data connectivity solutions so that automakers
  can bring advanced capabilities to more people around the
  globe. This is how we enable sustainable mobility and help
  to prevent accidents caused by human error.

  Your Roles and Responsibilities:

  Core Competencies & Demonstrated Success:

  •

  - Strong AWS expertise with relevant AWS certification
  - Kubernetes, node management, cluster administration, and
    networking
  - AWS services, infrastructure provisioning, and automation
    using IaC
  - Linux administration
  - GPU infrastructure management and workload optimization
  - Infrastructure monitoring, observability, and
    troubleshooting
  - Building and managing scalable infrastructure for ML
    workloads, MLOps, and Data Engineering platforms

  Why join us?

  You grow at Aptiv.

  Aptiv's winning culture is global by design. We bring
  together diverse perspectives, cultures, and business
  contexts to solve our customers' toughest challenges. In
  this environment, every individual can grow, lead, and make
  an impact, regardless of background, because inclusion fuels
  how we innovate and win. 

  You make an impact at Aptiv.

  One of the strengths of humanity is our drive to progress,
  to improve, to achieve more tomorrow than we did yesterday.
  People need solutions they can trust when it matters most.
  At Aptiv, you are building those solutions every day.

  You have support at Aptiv.

  We ensure you have the resources and support you need to
  take care of your family, your physical health, and your
  mental health with a competitive benefits package.

  Your Benefits at Aptiv:

  - Higher Education Opportunities (UDACITY, UDEMY, COURSERA are
    available for your continuous growth and development);
  - Life  and accident insurance;
  - Sodexo cards for food and beverages
  - Well Being Program that includes regular workshops and
    networking events;
  - EAP Employee Assistance;
  - Access to fitness clubs (T&C apply);
  - Creche facility for working parents;

  Meet the Next-Generation Aptiv:

  At Aptiv, we deliver innovative solutions that people trust
  when it matters most.

  Progress is never static. It is about reaching further,
  exploring new possibilities, and enabling mobility. Aptiv
  empowers customers to create solutions people rely
  on—advancing safety and autonomy in Automotive and
  Commercial Vehicles, enabling mission-critical performance
  in Aerospace & Defense, and powering intelligent systems
  across Energy, Enterprise, and Telecommunications. We also
  drive precision and efficiency in Industrials & Robotics and
  support life-critical innovation in Medical technologies.

  Guided by our winning culture and values to Think & Act Like
  Owners, as One Team, and Play to Win, we turn commitment
