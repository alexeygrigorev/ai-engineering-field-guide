description: |
  This is a remote position.



  Shuru is an AI-native technology and engineering services
  company helping businesses build and scale high-impact
  products and AI solutions.

   Role Overview


  We are looking for a Senior Voice AI / LLM Engineer to own
  and improve a production Voice AI agent for a US insurance
  organization. The role involves improving reliability,
  reducing latency, moving scripted flows toward agentic
  conversations, and ensuring secure, governed production
  releases.

   Key Responsibilities


  - Own and improve a production Voice AI / LLM application.
  - Build agentic workflows using prompts, tool calling,
    structured outputs, and RAG.
  - Work hands-on with Amazon Connect, Lex V2, and Bedrock.
  - Build LLM evaluation suites and automated quality gates.
  - Improve voice latency, reliability, and production
    performance.
  - Implement PII/PHI safeguards and monitor quality and cost.







    Requirements

  - Production LLM application experience.
  - Prompt Engineering, Tool Calling, RAG, Structured Outputs.
  - Amazon Connect and Amazon Lex V2.
  - Amazon Bedrock or similar managed LLM platforms.
  - LLM evaluation frameworks.
  - Strong Python.
  - AWS Lambda, IAM, DynamoDB, S3, CloudWatch, KMS.
  - Experience in regulated environments such as insurance,
    healthcare, or financial services.







    Benefits

  - Work on challenging, large-scale engineering and data
    problems.
  - Work closely with experienced engineering, product, and
    technology leaders.
  - Opportunity to take ownership of architecture and key
    technical decisions.
  - Remote-first and collaborative work environment.
  - Strong opportunities for learning, leadership, and career
    growth.
