description: |
  Role Overview

  As a Forward Deployed Engineer, you’ll design, build, and
  support integrations between the Blue Machines platform and
  client systems. You’ll work across APIs, cloud services, and
  AI frameworks (like LangChain and LLM APIs) to deliver
  intelligent, reliable, and production-grade integrations.

  Responsibilities

  • Develop and maintain integrations using REST APIs,
  WebSockets, and webhooks

  • Build and deploy solutions leveraging cloud platforms (GCP
  / AWS / Azure)

  • Integrate with AI/LLM frameworks such as LangChain,
  OpenAI, or similar SDKs

  • Collaborate with client and internal teams for deployment,
  debugging, and optimization

  • Automate, document, and maintain integration workflows and
  observability

  Requirements

  • Experience in Python or Java development for backend and
  integrations

  • Mandatory hands-on experience with cloud platforms
  (preferably GCP)

  • Strong understanding of web technologies, APIs, and
  authentication protocols (OAuth2, JWT)

  • Familiarity with AI/LLM ecosystems, prompt design, or
  LangChain-style orchestration

  • Excellent problem-solving and client communication skills

  Nice to Have

  • Experience with telephony and real-time communication
  (SIP, WebRTC, Twilio, Avaya, Ubona)

  • Familiarity with Postman, Wireshark, or observability
  tools

  • Understanding of CI/CD pipelines and containerized
  deployments
