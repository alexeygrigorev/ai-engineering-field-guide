description: |
  Company Description

  Enviri Corporation is a US-based global provider of
  environmental and industrial solutions, headquartered in
  Philadelphia, Pennsylvania. With operations across 30+
  countries and 250+ locations, Enviri serves the global
  steel, metals, and railway industries. Backed by a 170-year
  legacy of innovation, on-site expertise, and global reach,
  the company is committed to advancing industrial
  sustainability and creating long-term value for its
  customers, people, and communities.

  Enviri operates through two key business units, supported by
  its Global Service Centre (GSC):

  Harsco Environmental: A leading provider of environmental
  services and material processing solutions to the steel
  industry, specializing in slag management, metal recovery,
  and resource optimization.

  Harsco Rail: A global supplier of railway track maintenance
  and construction equipment, advanced technologies, and
  support solutions.

  Enviri Global Service Centre (GSC): Provides centralized
  shared services and global business support across Finance &
  Accounting, Human Resources, IT, Engineering, Knowledge
  Services, and other functional areas, supporting Enviri's
  operations across geographies.

  Job Description

  We are seeking a hands-on SeniorDigital Developer who
  combines strong software engineering fundamentals with
  modern AI-assisted development practices. The role will
  design, build, modernize, and support enterprise
  applications using .NET 8+, ASP.NET Core, EF Core, Angular,
  SQL Server, and Azure. The successful candidate will use
  GitHub Copilot and approved AI tools thoughtfully to
  accelerate delivery while remaining accountable for
  correctness, security, maintainability, testing, and
  business outcomes.

  Key Responsibilities

  - Full-Stack Engineering: Architect and implement scalable
    backend services using C#, .NET 8+, ASP.NET Core, and EF
    Core, together with responsive Angular applications using
    TypeScript, Angular Material, HTML, and SCSS.
  - Solution Design: Translate business requirements into
    maintainable technical designs, APIs, data models,
    integrations, and reusable components. Contribute to
    architecture reviews and document key decisions and trade-
    offs.
  - AI-Assisted Development: Use GitHub Copilot and other
    approved AI tools for code exploration, scaffolding,
    refactoring, debugging, test generation, documentation,
    and development planning. Write clear prompts and provide
    relevant context to improve output quality.
  - Human Validation: Critically review AI-generated code and
    recommendations. Verify logic, licensing considerations,
    security, performance, accessibility, test coverage, and
    alignment with coding standards before adoption.
  - Cloud Engineering: Build and support secure Azure solutions
    using services such as App Service, Azure SQL, Key Vault,
    Storage, Functions, Logic Apps, Application Insights, and
    managed identities where appropriate.
  - Database Engineering: Design and optimize SQL Server data
    models, queries, stored procedures, indexes, and EF Core
    mappings, migrations, and Fluent API configurations.
  - Quality Engineering: Develop unit, integration, and frontend
    tests. Use automation and AI assistance to improve
    coverage while ensuring tests validate meaningful behavior
    and edge cases.
  - DevOps & Automation: Manage Git and GitHub workflows, pull
    requests, branching, reviews, and CI/CD automation using
    GitHub Actions. Support repeatable deployments across
    environments.
  - Production Reliability: Troubleshoot defects and performance
    issues using logs, telemetry, profiling, and root-cause
    analysis. Improve observability and preventive controls
    following incidents.
  - Technical Leadership: Mentor juniors, lead design
    discussions, provide constructive code-review feedback,
    share effective AI-assisted practices, and promote
    continuous improvement.

  Qualifications

  Required Skills & Experience:

  - 8-12 years of hands-on software development experience, with
    strong recent experience delivering enterprise web
    applications.
  - Advanced C# and .NET experience, including ASP.NET Core,
    RESTful APIs, dependency injection, asynchronous
    programming, security, error handling, and performance
    optimization.
  - Strong Angular and TypeScript experience, including
    component design, reactive programming, forms, routing,
    state management, performance, and reusable UI patterns.
  - Strong SQL Server and EF Core experience covering schema
    design, query tuning, indexing, transactions, migrations,
    concurrency, and troubleshooting.
  - Practical Azure development experience with secure
    configuration, monitoring, diagnostics, and cloud
    deployment patterns.
  - Experience with GitHub, pull requests, code reviews, GitHub
    Actions, CI/CD pipelines, and automated quality checks.
  - Hands-on use of GitHub Copilot or comparable AI-assisted
    programming tools within day-to-day software delivery.
  - Ability to assess AI-assisted output for correctness,
    security, performance, maintainability, and suitability
    before adoption.
  - Experience integrating Azure OpenAI or other approved AI
    services into enterprise applications or building AI-
    enabled business features.
  - Understanding of responsible AI, privacy, security,
    transparency, human oversight, and governance.
  - Strong debugging, problem-solving, communication,
    collaboration, ownership, and stakeholder-management
    skills

  Ideal Candidate Profile - You are a pragmatic senior
  engineer who remains hands-on while influencing design and
  delivery. You are comfortable using AI as an engineering
  accelerator, but you understand that accountability stays
  with the developer. You can explain technical decisions
  clearly, challenge weak assumptions, support colleagues, and
  deliver secure, maintainable solutions in a collaborative
  enterprise environment.

