description: |
  Database and AI Support Engineer


  About Arango:

  Arango delivers a unified, natively multimodel contextual
  data platform that powers AI agents, assistants, and
  applications with the unified, current, and trusted business
  context needed to reason, decide, and act at scale.



  The Arango Contextual Data Platform connects fragmented
  enterprise data with LLMs, copilots, and AI agents through a
  simplified architecture delivered out of the box. By
  combining graph, vector, document, key-value, and search
  capabilities in a single platform, Arango eliminates the
  complex stacks many organizations build to operationalize
  enterprise AI.



  Trusted by organizations including NVIDIA, HPE, the London
  Stock Exchange, PSI CRO, the U.S. Air Force, NIH, Siemens,
  Transient.AI, Matpriskollen, and Articul8, Arango helps
  enterprises move from AI pilots to reliable production
  systems faster while lowering infrastructure complexity and
  total cost of ownership. Arango is a proud member of the
  NVIDIA Inception Program and the AWS ISV Accelerate Program.
  Learn more at arango.ai, LinkedIn, and G2.



  Location: Only candidates in India will be considered
  (Remote)



  Core Competencies

  - Database Fundamentals: Data modeling, query optimization,
    indexing, clustering, replication, backups, and
    performance tuning across document, graph, key/value, and
    vector databases.
  - AI & RAG Knowledge: Understanding of LLMs, embeddings,
    vector search, retrieval-augmented generation (RAG),
    prompt engineering, and AI APIs.
  - Cloud & Infrastructure: Experience with Linux, Docker,
    Kubernetes, networking, and cloud platforms (AWS, Azure,
    or GCP).
  - Troubleshooting & Diagnostics: Ability to analyze logs,
    identify root causes, debug complex issues, and
    collaborate with Engineering on product defects.
  - APIs & Scripting: Familiarity with REST APIs, JSON,
    authentication mechanisms, and scripting languages such as
    Python or Bash.
  - Customer Excellence: Strong communication, problem-solving,
    expectation management, and the ability to explain complex
    technical concepts to both technical and non-technical
    audiences.
  - Collaboration & Documentation: Proven ability to document
    solutions, contribute to knowledge bases, and work cross-
    functionally with Product, Engineering, and Customer
    Success teams.



  Technical Skills

  - 5+ years of Support Engineering experience
  - 3+ years of experience working with Databases (ArangoDB,
    Neo4j, or similar)
  - Strong experience with Kubernetes (AKS/EKS/OpenShift) and
    Helm
  - Solid understanding of cloud infrastructure (AWS, Azure) and
    on‑prem environments
  - Familiarity with storage systems (EBS, gp3, MinIO,
    S3‑compatible storage)
  - Ability to debug networking issues: load balancers,
    timeouts, service endpoints, DNS, and ingress controllers
  - Comfort with Linux, SSH, jump boxes, and cluster‑admin
    workflows
  - Basic scripting skills
  - Ability to read and understand code



  Soft Skills

  - Communication
    - Ability to explain technical concepts clearly to both
      technical and non-technical audiences.
    - Builds trust by acknowledging the customer's situation and
      concerns.
    - Ability to  ensure the real issue is understood before
      troubleshooting begins.
  - Problem solving and critical thinking
    - Ability to break down complex issues into manageable steps
      and identify root causes.
    - Ability to evaluate evidence objectively
  - Collaboration
    - Ability to work collaboratively with Engineering, Product,
      QA, and other teams.
    - A great team player

  What Makes Arango Special?

  At Arango, we believe that AI is only as powerful as the
  data foundation. Our mission is to help organizations build
  AI systems that can reason, decide and act based on unified,
  current, and trusted business context at scale. We are
  helping define a new category of infrastructure: the
  contextual data layer for AI.

  Working at Arango means:

  - Contributing to cutting-edge AI and data infrastructure
  - Collaborating with experienced engineers, marketers, and
    product leaders
  - Helping shape how enterprises build AI-powered applications

  If you're excited about the intersection of AI, data, and
  social media, we’d love to hear from you.
