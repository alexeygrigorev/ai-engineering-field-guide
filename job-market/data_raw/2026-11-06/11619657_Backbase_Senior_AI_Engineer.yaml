description: |
  The Job in short At Backbase, we build AI-powered, secure,
  enterprise-grade digital banking software used daily by
  millions worldwide. With seamless integration, unified data,
  agentic AI, and a complete banking suite built for every
  line of business, you'll be building the next generation of
  banking. As a Senior iOS Engineer, you will drive the AI-
  native engineering of our product across the software
  development lifecycle, following and improving our way of
  working, and refining our best practices. You will lead the
  team in ensuring our practices are not only best practice
  and efficient but continually evolving and improving to use
  AI principles Meet the job You will help design, build and
  maintain one or more capabilities for the Backbase Mobile
  Platform, working closely with the Principal Engineers. You
  will be part of a multidisciplinary squad that is
  responsible for delivering an end-to-end solution, from
  initial concept to fruition in one of our production-ready
  applications. You will be tasked with addressing complex
  business requirements and with translating them into
  technical designs and implementations. You will be expected
  to deliver high-quality, well-engineered software that is
  performant, clean and is easy to maintain. As a squad
  member, you will contribute to all aspects of product
  development, starting from gathering feedback & requirements
  and implementing actual functionality, to writing tests,
  documentation and providing product adoption support to
  colleagues, customers and partners. As a Senior Mobile
  Engineer, you will be working in the Identity team, which
  builds Identity and Authentication journeys and components
  for the Backbase mobile banking applications for Retail,
  Business and Wealth customers. You will ● Platform
  Development: Help design, build, and maintain one or more
  capabilities for the Backbase Mobile Platform, working
  closely with the Principal Engineers. ● Engineering &
  Quality: Build, improve, and grow SDKs and libraries to
  revolutionise Identity and Authentication for mobile
  banking. Write clean, maintainable Swift code to create
  scalable features that other developers can use seamlessly.
  Developing features with native frameworks and cutting-edge
  Apple technologies, collaborating with others in the squad
  and other mobile squads to bring in the latest ways to
  develop. Responsible for upholding our engineering standards
  across the product, proactively proposing and leading
  initiatives within your squad to improve engineering
  excellence. ● Agile & CI/CD: Automate testing while working
  closely with QAs to achieve an 80% minimum unit test
  coverage using frameworks like XCTest and XCUITest. You have
  a strong engineering culture in all parts of the SDLC,
  working in Agile practices to deliver a complete product.
  CI/CD practices are part of your mantra, ideally with
  Bitrise and GitHub Actions. ● AI-Native Mindset: Showing an
  AI-Native mindset, you will proactively explore, experiment
  with, and apply AI tools and agentic frameworks (e.g., code
  generation, test automation, dev productivity). Encourage AI
  adoption across engineering workflows and product
  capabilities. ● Collaboration: Contribute to all aspects of
  product development, starting from gathering feedback &
  requirements and implementing actual functionality, to
  writing tests, documentation and providing product adoption
  support to colleagues, customers and partners. How about you
  ● Experience: 6+ years of professional experience in native
  iOS development. ● Languages: Strong proficiency in Swift
  and practical experience with Objective-C. ● Domain:
  Experience developing applications in the FinTech, Banking,
  or Payments space. ● Architecture: Expertise in modern iOS
  architectural patterns (e.g., MVVM, VIPER, Clean
  Architecture) and development frameworks (e.g., SwiftUI,
  UIKit, Combine/RxSwift). ● Concurrency & Integration: Solid
  experience integrating with RESTful APIs, GraphQL, and
  asynchronous programming (e.g., Grand Central Dispatch
  (GCD), async/await, Combine). ● Security & Tools: Strong
  understanding of mobile security best practices (e.g.,
  Keychain, Biometrics). Experience with version control
  systems like Git. ● AI/ML Passion: You are passionate about
  embracing AI/ML tools such as GitHub Copilot, Cursor AI, and
  Xcode (AI) and you enjoy shaping the product or platform’s
  functionality with AI. Bonus Points (Preferred Experience) ●
  In-depth knowledge of mobile application security and data
  encryption standards ● Experience with dependency managers
  like Swift Package Manager (SPM) or CocoaPods. ● Familiarity
  with mobile analytics, A/B testing, and crash reporting
  tools (e.g., Firebase, Crashlytics). ● Experience with
  building and maintaining CI/CD pipelines (e.g., Jenkins,
  GitLab CI, GitHub Actions). ● Published one or more iOS
  applications on the Apple App Store.
