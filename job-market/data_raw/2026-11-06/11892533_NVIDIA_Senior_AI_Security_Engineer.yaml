job_id: 11892533
title: Senior AI Security Engineer
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  At NVIDIA, we are stewards of AI. Agents are now a crucial
  part of cybersecurity where NVIDIA collaborates to set the
  standard. As model functionality increases and the
  cybersecurity landscape evolves, we need agents that can
  seamlessly interface between humans, models, and computing
  artifacts to build secure environments.

  Our Agentic & AI Cybersecurity Research team at NVIDIA is
  seeking a Senior Engineer. This hands-on role suits someone
  who transforms sophisticated problems and basic prototypes
  into practical solutions. They work with research, security,
  product, and partner teams to build lasting code bases.

  What you will be doing:

  - Building leading software ahead of the curve to accelerate
    and improve cybersecurity tooling for AI.
  - Collaborating closely with research teams and product teams
    to be responsible for development of research code into
    alpha versions of products.
  - Rapidly identifying the highest-value MVP for ambiguous
    security and identity problems, prototyping solutions,
    validating them with partner teams, and iterating towards
    production-ready services.
  - Developing reusable skills, CLI tools, APIs, and integration
    patterns to help internal teams embrace secure agent
    approaches across enterprise tools and platforms.
  - Partnering closely with teams across Enterprise Security,
    Product Security, Enterprise AI, Enterprise Product, and
    relevant platform teams to align architecture with real
    workflow needs and operational constraints.

  What we need to see:

  - Bachelor’s degree or Master’s degree or equivalent
    experience in Computer Science or a related field.
  - 8+ years in software engineering, security engineering, or
    related areas, including hands-on technical leadership.
  - Excellent software engineering skills, including crafting
    and building backend services, APIs, automation, or
    platform components in various programming environments.
    The role requires quickly learning new paradigms,
    frameworks, and tools as needed.
  - Experience with multi-contributor software projects and
    long-running software projects.
  - Familiarity with building agents, AI tooling, and
    architectures.
  - Track record of framing problem spaces, defining an MVP,
    prototyping quickly, and evolving ideas into production
    systems.
  - Familiarity with offensive security, adversarial thinking,
    red teaming, or attack-path analysis, capable of applying
    that perspective to architecture decisions and security
    tradeoffs.
  - Flexibility and willingness to frequently collaborate across
    organizational boundaries, balancing security with
    usability and adoption.

  Ways to stand out from the crowd:

  - Demonstrate strong human-centered thinking, carefully
    integrating underlying requirements from researchers and
    users into code.
  - Excellent software engineering instincts, including the
    ability to build reusable frameworks, understand and
    refine requirements, build tooling that improve
    engineering velocity and consistency.
  - Deep familiarity with open-source projects, including
    community involvement, workflow, and governance.
  - Experience with agentic or AI-adjacent systems, such as
    tool-using applications, workflow orchestration,
    evaluation loops, policy controls, memory/context
    services, or trust and discovery systems.
  - Understanding of AI-specific security risks such as
    injection, tool misuse, unauthorized access expansion,
    data exfiltration, or unsafe delegation patterns.

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary ranges for this position are: 184,000
  USD – 287,500 USD for Level 4; and 224,000 USD – 356,500 USD
  for Level 5.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  November 3, 2026.

  This posting is for an existing vacancy.

