description: |
  Bring more to life.

  Bring more to life. At Danaher, our work saves lives. And
  each of us plays a part. Fueled by our culture of continuous
  improvement, we turn ideas into impact, innovating at the
  speed of life. Our 60,000+ associates work across the globe
  at more than 15 unique businesses within life sciences,
  diagnostics, and biotechnology. Are you ready to accelerate
  your potential and make a real difference? At Danaher, you
  can build an incredible career at a leading science and
  technology company, where we're committed to hiring and
  developing from within. You'll thrive in a culture of
  belonging where you and your unique viewpoint matter. DHR
  Enterprise AI Solutions is Danaher's enterprise AI
  engineering capability, responsible for identifying
  opportunities, building and scaling reusable AI solutions,
  and accelerating measurable business impact across operating
  companies. We combine product, architecture, AI science,
  engineering and operations to industrialise AI, establish
  enterprise standards and enable the next generation of AI-
  powered products, workflows, applications and decision-
  making. We look forward to welcoming you to our
  organisation. In DHR Enterprise AI Solutions, you will be
  responsible for creating reusable, production-grade feature
  data products that enable high-performing Data Science,
  Machine Learning and AI solutions across Danaher. You will
  serve as a technical expert in feature engineering and
  applied machine learning, helping transform complex
  enterprise, scientific, laboratory and instrument data into
  meaningful signals, predictive variables and reusable
  features that power scalable analytics, ML and AI solutions.
  In this role, you will have the opportunity to: • Discover,
  develop and maintain high-quality features from enterprise,
  scientific, laboratory and instrument data that improve the
  performance, explainability and reliability of Machine
  Learning and AI solutions. • Design and execute data
  exploration, feature engineering and feature-selection
  experiments to identify meaningful signals, validate
  assumptions and maximise model performance. • Build reusable
  feature data products, feature stores and feature generation
  pipelines that can be consistently consumed across multiple
  solutions, models and operating companies. • Establish best
  practices for feature quality, lineage, monitoring,
  documentation and lifecycle management, ensuring features
  remain reliable, traceable and production-ready over time. •
  Partner with Data Scientists, AI Scientists, AI Engineers,
  Product Owners and Architects to translate business and
  scientific challenges into scalable feature assets and
  predictive capabilities. The essential requirements of the
  job include: • Strong hands-on experience in Data Science,
  Machine Learning, feature engineering and predictive
  modelling, including the development of high-quality
  features for production machine learning solutions. • Deep
  understanding of data preparation, feature extraction,
  dimensionality reduction, feature selection, statistical
  analysis and model performance optimisation. • Proficiency
  in Python, SQL, notebooks, machine learning libraries and
  modern data-processing frameworks used to develop and
  operationalise ML solutions. • Experience building scalable
  data pipelines, feature generation workflows and reusable
  feature assets in cloud-based environments. • Strong
  analytical and problem-solving skills with the ability to
  identify valuable signals in complex data and translate them
  into measurable business and scientific outcomes. It would
  be a plus if you also possess previous experience in: •
  Building feature stores, reusable feature repositories or
  feature engineering frameworks used across multiple machine
  learning solutions. • Developing predictive models using
  techniques such as gradient boosting, ensemble methods,
  Bayesian modelling, optimisation algorithms, forecasting or
  advanced statistical approaches. • Working in life sciences,
  diagnostics, healthcare, laboratory environments, advanced
  manufacturing or other data-rich scientific industries.
  Danaher offers a broad array of comprehensive, competitive
  benefit programs that add value to our lives. Whether it's a
  healthcare program or paid time off, our programs contribute
  to life beyond the job. At Danaher, we believe in designing
  a better, more sustainable workforce. We recognise the
  benefits of flexible and remote working arrangements for
  eligible roles and are committed to providing enriching
  careers regardless of work arrangement. This position is
  eligible for a remote work arrangement in which you can work
  remotely from your home. Additional information about this
  remote work arrangement will be provided by your interview
  team. Explore the flexibility and challenge that working for
  Danaher can provide.

  Join our winning team today. Together, we’ll accelerate the
  real-life impact of tomorrow’s science and technology. We
  partner with customers across the globe to help them solve
  their most complex challenges, architecting solutions that
  bring the power of science to life.

  For more information, visit www.danaher.com.
