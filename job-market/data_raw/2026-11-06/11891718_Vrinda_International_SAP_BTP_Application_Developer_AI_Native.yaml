title: SAP BTP Application Developer – AI Native
company: Vrinda International
location: Bengaluru, IND
work_type: FULL_TIME
company_size: 10 Employees
description: |
  Summary

  We are seeking a highly skilled SAP BTP Application
  Developer with a focus on AI-native technologies to join our
  IT Services team. In this pivotal role, you will leverage
  the SAP Business Technology Platform to architect and deploy
  intelligent solutions that drive innovation. The position
  demands a deep understanding of modern application
  development frameworks combined with advanced capabilities
  in artificial intelligence, including large language models
  and agentic systems. You will play a crucial part in
  building scalable, secure, and efficient applications that
  integrate seamlessly with enterprise data landscapes,
  ensuring our organization stays at the forefront of digital
  transformation.

  Responsibilities

  - Design, develop, and maintain robust applications within the
    SAP BTP environment, ensuring alignment with business
    objectives.
  - Implement and manage AI-driven features, including the
    integration of Large Language Models (LLMs) and the
    creation of agentic AI workflows.
  - Build Retrieval-Augmented Generation (RAG) systems and other
    retrieval-based applications to enhance data accessibility
    and intelligence.
  - Utilize SAP Business Application Studio for efficient
    coding, testing, and deployment of cloud-native solutions.
  - Configure and administer SAP BTP connectivity to ensure
    seamless communication between various system components.
  - Establish comprehensive AI evaluation protocols and
    monitoring mechanisms to maintain model performance and
    accuracy.
  - Develop user interfaces using SAPUI5, XML, and MVC patterns
    to deliver intuitive and responsive user experiences.
  - Manage data modeling and integration strategies leveraging
    SAP HANA capabilities.
  - Adhere to version control best practices using Git and
    participate in CI/CD pipelines to streamline the software
    delivery lifecycle.
  - Collaborate within Agile teams to deliver high-quality
    software solutions on schedule.

  Requirements

  Requirements:

  - Possess 4 to 6 years of professional experience in software
    development, specifically within the IT Services sector.
  - Hold a competitive salary expectation aligned with the
    market rate of ₹12 lpa.
  - Demonstrate proven expertise in SAP BTP Administration and
    connectivity configurations.
  - Show proficiency in SAP Business Application Studio for
    full-stack development tasks.
  - Possess strong knowledge of LLMs, Agentic AI concepts, and
    their practical implementation.
  - Have hands-on experience designing and deploying RAG and
    retrieval-based application architectures.
  - Be skilled in setting up AI evaluation frameworks and
    monitoring tools for ongoing system health.
  - Exhibit familiarity with Git version control, CI/CD
    automation, and Agile development methodologies.
  - Display advanced capabilities in SAP BTP Application
    Development and SAPUI5, including XML and MVC
    architecture.
  - Understand SAP HANA database structures and data modeling
    principles.
