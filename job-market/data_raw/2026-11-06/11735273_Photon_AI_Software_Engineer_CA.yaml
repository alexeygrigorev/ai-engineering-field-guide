description: |
  AI Software Engineer Overview: The AI Software Engineer is
  responsible for the technical backbone of our autonomous
  tools. This role bridges software engineering, API
  integrations, and AI-driven automation to design and deploy
  intelligent, highly scalable pipelines that connect
  underlying data layers to execution engines.

  Key Responsibilities ● Design, develop, and deploy the next-
  generation AI Agentic Workflow Framework enabling autonomous
  and semi-autonomous business operations. ● Build multi-agent
  orchestration platforms, LLM integration layers, retrieval
  systems (RAG), and production-grade evaluation pipelines. ●
  Integrate Generative AI services (e.g., OpenAI APIs, Claude,
  LangChain) to automate parsing, data mapping, and action
  triggers. ● Partner closely with design and product teams to
  translate workflow concepts into reliable, highly available
  backend architecture.

  Skills & Seniority Bar

  Seniority & Experience: 7-10+ years of hands-on professional
  software engineering, with significant experience operating
  at a Senior, Staff, or Lead level scaling distributed
  systems.

  AI / Automation Expertise : Applied experience with LLM
  orchestration, custom prompt pipelines, state management,
  and asynchronous event processing.

  Core Infrastructure : Deep knowledge of cloud ecosystems
  (GCP/AWS), JVM languages (Java/Kotlin), containerization,
  and microservices architecture.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 54,000 Maximum Compensation: USD
  189,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
