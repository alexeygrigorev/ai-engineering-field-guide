description: |
  WHO WE ARE

  At Basis, we empower agencies and brands with cutting-edge
  software that automates digital media operations. Our all-
  in-one platform supports seamless planning, reporting, and
  financial reconciliation across direct, programmatic,
  search, and social media.

  We’re not just building advanced technology; we’re also
  building a culture where passionate, motivated individuals
  come together to drive meaningful change. Our commitment to
  inclusivity and growth ensures our employees thrive both
  professionally and personally.

  With our headquarters in Chicago, we offer flexible work
  options across the U.S. and Canada, including remote,
  hybrid, or on-site at headquarters.

  ABOUT THE TEAM

  Technology is at the core of what we do. The AI Core team at
  Basis Technologies builds Compass, the AI agent platform
  behind Basis. Compass agents plan and execute media
  planning, buying, and operations work on behalf of agencies
  and brands. We build the orchestration, tooling, and
  evaluation infrastructure that lets LLM-powered agents work
  reliably in a complex ad tech domain, and we expose the
  Basis platform to our own and our customers’ agents through
  MCP and A2A. The AI Core team also functions as an enabling
  team for all of Basis Engineering, developing the patterns
  and best practices for agentic and AI-assisted development
  that other teams build on.



  WAYS YOU’LL CONTRIBUTE

  As a Staff AI Engineer, you will be the technical lead for
  the AI Core team, specializing in the architecture and
  development of our agentic platform. Other ways you will
  contribute:

