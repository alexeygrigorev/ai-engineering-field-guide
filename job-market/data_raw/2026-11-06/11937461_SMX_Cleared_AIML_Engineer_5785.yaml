title: Cleared AI/ML Engineer (5785)
company: SMX
location: USA
remote: true
work_type: FULL_TIME
description: |
  SMX is seeking an AI/ML Engineer to join our team in support
  of a Modernized Data Science Platform for a Federal
  customer. The focus of this role is to bridge the gap
  between business needs and technical solutions, focusing on
  using modern AI capabilities. If you are interested in
  joining a high-performing team with advancement
  opportunities, then look no further!

  Essential Duties & Responsibilities

  - Design and develop new AI Agents to expedite the development
    of capabilities to meeting business functional
    requirements.
  - Research AI capabilities within tools like Databricks and
    Palantir to standardize the process of how the provided
    capabilities should be used by developers.
  - Prompt Engineer LLM’s to be utilized by the development team
    to expedite functional analysis and coding.
  - Develop chatbots to support developer and customer
    interactions.
  - Train Machine Learning models to predict outcomes based on
    historical data inputs.

  Required Skills/Experience

  - Security Clearance: U.S. citizenship and an active DoD
    Secret security clearance or the ability to get a
    clearance are required
  - Education: Bachelor's degree in Computer Science or related
    field
  - Experience: 6 years of related work experience
  - Strong analytical, problem-solving, and decision-making
    skills.
  - Minimum of 2 years of hands-on development experience in
    training AI models.
  - Experience integrating AI capabilities into Dev/Ops
    pipelines to expedite coding and delivery.
  - Experience developing Agents using Open AI LLM’s.
  - Experience with developing AI chatbots to support business
    requirements.
  - Experience with training ML models on live/production
    datasets to support predictive analysis and identify data
    anomalies.
  - Experience working with agile development methodology.
  - Familiarity with database design and architecture;
    relational and non-relational
  - Ability to work cross-functionally, and participate in
    discussions
  - Proven ability to work independently on assigned tasks
    without any supervision.
  - Proven experience in knowledge sharing (i.e., code reviews,
    solid documentation).
  - Driven, self-directed personality.
  - Strong sense of mission and commitment to making a
    difference.

  Desired Skills/Experience

  - Exceptional communication skills and the ability to foster
    positive outcomes from diverse interests of people and
    teams.
  - Experience working with the DoD.

  The SMX salary determination process takes into account a
  number of factors, including but not limited to, geographic
  location, Federal Government contract labor categories,
  relevant prior work experience, specific skills, education
  and certifications. At SMX, one of our Core Values is to
  Invest in Our People so we offer a competitive mix of
  compensation, learning & development opportunities, and
  benefits. Some key components of our robust benefits include
  health insurance, paid leave, and retirement.

  The proposed salary for this position is:

  $115,000—$180,000 USD

  At SMX®, we are a team of technical and domain experts
  dedicated to enabling your mission. From priority national
  security initiatives for the DoD to highly assured and
  compliant solutions for healthcare, we understand that
  digital transformation is key to your future success.

  We share your vision for the future and strive to accelerate
  your impact on the world. We bring both cutting edge
  technology and an expansive view of what’s possible to every
  engagement. Our delivery model and unique approaches harness
  our deep technical and domain knowledge, providing forward-
  looking insights and practical solutions to power secure
  mission acceleration.

  SMX is an Equal Opportunity employer including disabilities
  and veterans.

  Selected applicant may be subject to a background
  investigation and/or education verification.

  SMX does not sponsor a new applicant for employment
  authorization or immigration related support for this
  position (i.e. H1B, F-1 OPT, F-1 STEM OPT, F-1 CPT, J-1, TN,
  E-2, E-3, L-1 and O-1, or any EADs or other forms of work
  authorization that require immigration support from an
  employer).
