description: |
  AI Engineer (Technical Consultant – AI Integration)

  Summary

  We are seeking an experienced AI Engineer to serve as a
  Technical Consultant specializing in AI Integration within
  the IT Services sector. In this pivotal role, you will
  leverage your deep expertise to design, develop, and deploy
  sophisticated artificial intelligence solutions that drive
  business value. You will act as a strategic advisor,
  bridging the gap between complex AI technologies and
  practical business applications, ensuring seamless
  integration of advanced models into existing enterprise
  architectures. Your work will be instrumental in shaping the
  future of our AI capabilities, focusing on scalable, secure,
  and high-performance systems that meet the evolving demands
  of our clients.

  Responsibilities

  - Architect and implement robust AI solutions using modern
    frameworks, specifically leveraging Chainlit for
    interactive applications and RAG (Retrieval-Augmented
    Generation) techniques for enhanced context awareness.
  - Design and orchestrate agentic AI workflows to automate
    complex decision-making processes and improve operational
    efficiency.
  - Develop scalable backend services and APIs utilizing Node.js
    and TypeScript, ensuring high availability and performance
    across Azure App Service and Container Apps environments.
  - Manage end-to-end CI/CD pipelines using GitHub Actions or
    Azure DevOps to facilitate rapid, reliable, and secure
    deployment of AI models and applications.
  - Utilize Azure AI Foundry and Databricks (including Genie and
    Mosaic AI) to train, fine-tune, and deploy machine
    learning models at scale.
  - Collaborate with cross-functional teams to translate
    business requirements into technical specifications for
    AI-driven products and services.
  - Optimize system performance and resource utilization while
    maintaining strict adherence to security and compliance
    standards.
  - Provide technical guidance and mentorship to junior
    engineers, fostering a culture of innovation and
    continuous learning.

  Requirements

  Requirements:

  - Possess 8 to 12 years of professional experience in software
    development, with a strong focus on AI, machine learning,
    and cloud technologies.
  - Demonstrate advanced proficiency in backend development
    using Node.js and TypeScript.
  - Show proven experience with Chainlit for building
    conversational AI interfaces and user-friendly
    applications.
  - Have extensive hands-on knowledge of cloud infrastructure,
    specifically Azure App Service and Azure Container Apps.
  - Be well-versed in implementing CI/CD strategies using GitHub
    Actions or Azure DevOps for automated testing and
    deployment.
  - Possess deep expertise in Azure AI Foundry for model
    management and lifecycle operations.
  - Demonstrate practical experience with Databricks platforms,
    including the use of Genie and Mosaic AI features.
  - Have a strong track record of designing and deploying RAG
    architectures and Agentic AI systems.
  - Ability to work effectively in a fast-paced IT Services
    environment, delivering high-quality solutions that align
    with industry standards.
  - Competitive salary package of ₹20 LPA commensurate with
    experience and expertise.
