description: |
  Who We Are:

  Acuiti Labs is a specialist Global SAP consulting firm
  headquartered in London, UK, servicing clients globally for
  ‘Consume to Cash’ process transformation and optimization.

  We solve business challenges and problems using the most
  appropriate solution architecture, technology which fits
  into the client’s requirements and provides optimum
  functionalities, build tech platforms, and enable market-
  winning digital strategies. Our core expertise and
  experience are in technology R&D, digital and business
  strategy. We deploy efficient and effective talent solutions
  to enable innovation and build software products and
  solutions in a robust and economic manner. We also have
  innovative business engagement models to suit the needs of
  each client. For more information, please visit our website.
  https://www.acuitilabs.com/

  - Most Innovative Companies in The UK – 2024
  - Great Place to Work® Certified™ (2022 – Present)

  What we believe in:

  We take pride in having a diverse and talented workforce
  spread across various geographical locations. We are a
  gender-neutral organization and we strongly believe in
  Diversity and Inclusion. Our core values include

  - Excellence
  - Integrity
  - Learning
  - Organizational pride
  - Respect

  What We Do:

  Innovation is at the heart of everything that Acuiti Labs
  offers. As an SAP Silver Partner and an SAP BRIM company,
  Acuiti Labs has been delivering business technology
  solutions & digital transformation, deploying SAP BRIM
  (Billing) on S/4HANA and cloud-based applications such as
  Subscription Billing, CPQ & Entitlement Management.

  Acuiti Labs come with the experience of multiple industry
  use cases to support the subscription and consumption-based
  Target Operating Models. This includes Mobility-as-a-Service
  (Travel using Public Transport and Private Vehicles),
  Tourism-as-a-Service (Hotels, Entertainment Parks), Ports-
  as-a-Service (Airports and Seaports), Postal-as-a-Service,
  Telco-as-a-Service, and Software-as-a-Service. “Our core
  expertise and experience lie in providing reliable
  technology, enabling digital transformation for an
  intelligent enterprise, and offering business strategy
  consulting, and deploying innovative and efficient
  solutions.

  What We Offer You:

  We are proud to be an organization that firmly believes in
  having a company culture that is friendly, motivating,
  nurturing, and challenging at the same time. We
  enthusiastically promote new policies and practices that
  ensures wellbeing of our employees.

  We offer comprehensive benefits, including life insurance,
  group medical coverage for you and your family, and personal
  accident protection. Enjoy a supportive work-life balance
  with flexible hours, paid time off, and various lifestyle
  perks. Be recognised with monthly rewards, spot bonuses, and
  growth shares, while advancing your career with training,
  global exposure, and onsite opportunities. We're committed
  to your development, diversity, and well-being.

  About the role

  We are looking for a Principal AI Engineer to lead our AI
  work for both the engineering and the people doing it. This
  is a senior role with real ownership. You'll architect AI-
  based applications and platforms, run their delivery from
  first design through to production, and build and lead the
  team that gets them there. It's hands-on (you'll still be in
  the code and the architecture) but you'll also be the person
  setting direction, mentoring engineers, and making sure
  things actually ship.

  The work itself is bringing LLMs, AI agents, and automation
  into enterprise billing and subscription platforms, usually
  in and around SAP, often solving problems that don't have an
  obvious answer yet.

  What you'll do

  - Owning the architecture of our AI applications and
    platforms, and managing delivery end to end.
  - Leading the AI engineering team day to day, setting
    direction, mentoring, managing performance, and helping
    people grow.
  - Planning and prioritising the team's work so it ships on
    time and to the right quality.
  - Building LLM-powered applications, AI agents, and
    intelligent workflows.
  - Designing the RAG, retrieval, memory, and vector-database
    side of things for systems that need to scale.
  - Writing and reviewing backend services in Python and Java,
    and wiring them into enterprise and SAP APIs.
  - Getting the hard parts right: prompt engineering, function
    calling, tool use, multi-agent orchestration.
  - Keeping our systems fast, secure, reliable, and sensibly
    priced once they're live.
  - Working closely with product, engineering, and our
    consulting teams to shape where the AI work goes next.

  What we're looking for

  - Around 10+ years in software engineering, with solid recent
    experience taking LLM-based systems into production.
  - Experience leading and managing engineering teams, not just
    mentoring, but owning performance and growth.
  - A track record of architecting and delivering AI
    applications or platforms from end to end.
  - Strong Python, and good backend Java.
  - Real hands-on time with frameworks like LangChain,
    LangGraph, AutoGen, or LlamaIndex.
  - A good grasp of RAG, prompt engineering, and orchestrating
    LLMs at scale.
  - Experience with vector databases and memory architectures,
    FAISS, Pinecone, Chroma, pgvector, that kind of thing.
  - Comfort with APIs, function calling, and secure enterprise
    integrations.
  - Experience on at least one of AWS, Azure, or GCP.

  Nice to have

  - Docker, Kubernetes, and modern CI/CD.
  - MLOps or LLMOps tooling, deployment, monitoring, evaluation,
    observability.
  - Some exposure to SAP or other large enterprise systems.
  - A degree in Computer Science, Engineering, or AI/ML (though
    strong real-world experience counts for more).
  - Open-source work, papers, patents, or talks in AI/ML.
