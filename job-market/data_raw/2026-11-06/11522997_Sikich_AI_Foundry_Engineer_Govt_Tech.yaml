  AI Foundry Engineer (US- Remote)

  What to expect when you join Sikich

  Team members at Sikich have a lot in common while also being
  part of a rich and varied group of contributors, creating a
  distinct and thriving culture. Chief among our commonalities
  is a desire for growth and a shared unity of purpose in our
  professional lives. We believe that through diverse
  perspectives, challenging the status quo and rewarding
  action, we accelerate innovation and drive growth – for our
  clients, for ourselves and for our communities.

  The professional services landscape continues to evolve. For
  Sikich, this means we have an opportunity to further cement
  our leadership position in this industry and continue to
  grow our organization in increasingly exciting ways. This
  growth is meaningful for every team member at our company
  because larger companies simply see more interesting client
  opportunities and can attract impressively talented
  individuals like you. Through a dedicated focus on key
  business priorities and intentionally creating a rewarding
  employee experience, Sikich has developed into a highly
  regarded provider of professional services and a sought-
  after employer of choice.

  Do you want to work with other skilled and agile
  practitioners who thrive on challenge and growth? We believe
  everyone has untapped potential. That’s why we lead with
  vision and act fast, pairing deep expertise with practical
  solutions. Our teams cut through complexity and deliver real
  impact. It's our hope that you find more than just a job. At
  Sikich, you'll find optimism, clear insights and genuine
  warmth, without egos.

  Are you ready to grow with us?

  Position summary

  Sikich is seeking a highly skilled AI Foundry Engineer to
  support our government client.

  What will you do in this role?



  - Understand and translate business requirements and problem
    statements into a set of prompts that direct AI foundry
    platforms and ecosystems to generate full stack, AI and
    agent-based systems
  - Assess the generated systems code to discover design gaps
    and inefficiencies, standard and coding style issues.
    Identify and implement fixes in the design and code as
    necessary
  - Test, verify, and deploy the end-to-end system / application

  What do you need to succeed in this role?



  - Must be able to obtain and maintain a government issued
    Public Trust
  - 20+ years of overall software, distributed systems, and
    cloud native system development experience
  - Coding standards (Google JavaScript / JSON style guide, PEP
    8 style guide)
  - Design patterns (GOF, Others)
  - Architecture frameworks
  - 2-3+ years of developing and integrating AI, Gen AI, and
    agentic AI algorithms, models, frameworks, and prompt
    engineering
  - Knowledge about emerging standards for AI agent ecosystem
  - SME / Power user for at least one Gen AI system (Gemini,
    ChatGPT, Claude, CoPilot)
  - Prompt engineering - translating business / user
    requirements into prompts
  - 5-7+ years of in-depth, hands-on experience with one or more
    web application frameworks and programming languages
  - Angular, React, Python, NodeJS, Rust
  - Minimum of 5 years in-depth, hands-on experience with one or
    more cloud tech stacks, including virtual network
    architecture, design, implementation and management
  - AWS / Google (preferred)
  - AZURE / Oracle
  - Minimum of one-year in-depth, hands-on experience with one
    or more QA frameworks and test automation platforms
  - Experience in testing AI and LLM’s using tools to evaluate
    accuracy, bias, and reliability of AI tools and systems
  - Hands-on experience in using tools such as Brainstrust and
    Galileo

  In compliance with this state’s pay transparency laws, the
  base compensation range (25%-50%-75%) for this role is
  $165,000-- $180,000- $195,000. This is not a guarantee of
  compensation or salary, as final offer amount may vary based
  on several factors including but not limited to experience
  and geographic location. Compensation ranges for roles in
  our Government Services pillar are determined by contract
  with the specific government agency Sikich is servicing.

  In addition, specific skills/experience required are as
  follows:

  - Servant Leader – You are hyper focused on engaging
    employees, fostering their development, and building a
    positive culture.
  - Solutions Focused – You see opportunities in every business
    problem and can develop, articulate, and implement
    solutions.
  - Collaboration – You are a relationship builder across all
    levels of the organization and across all business units.
  - Instills Trust - You do what you say, and you follow through
    on commitments, you act with integrity, you are consistent
    and are perceived as credible.
  - Impact & Influence Thinking – You gain support for ideas,
    proposals, and solutions, and get others to act, with or
    without formal authority, to advance
    initiatives/objectives.

  About Sikich

  Sikich offers the public and private sectors a diverse
  platform of professional services across consulting,
  technology, and compliance. Highly specialized and hands-on
  teams deliver integrated solutions rooted in deep industry
  experience. Our approach is strategically and thoughtfully
  designed to help our clients, teams and communities
  accelerate success.

  Sikich has approximately 2,000 team members and operates
  across North America, EMEA and APAC.

  Sikich Total Rewards

  Our team members enjoy expansive benefits ranging from
  competitive compensation and insurance options to wellness
  programs and a flexible time off policy, to name only a few.
  Sikich also takes pride in prioritizing team members’
  health, total wellbeing and time spent with family, friends
  and in the pursuit of personal goals, hobbies, and
  endeavors.

  Some examples of our many benefits:

  - Sikich maintains a Flexible Time Off (FTO) Policy. We
    encourage every full-time employee, as your role permits,
    to utilize paid time off (personal time, mental/physical
    health care, vacation, sick leave, etc.). Waiting for time
    off to accrue is common at other companies. At Sikich, you
    do not have to wait for this benefit to kick in. FTO is
    activated on your first day with our organization.
  - Sikich will also recognize paid holidays during the year and
    strives to permit employees to have time off the last week
    of the calendar year when client and project work permits.
  - Sikich offers a comprehensive wellness program to engage,
    challenge and empower team members to take responsibility
    for their wellbeing. Activities can be tracked through our
    wellness provider to obtain gift cards and other rewards.

  We also offer:

  - Flexible work arrangements
  - Health, dental, vision, life, and accident/death/disability
    insurance options
  - HSA employer contribution
  - Eleven (11) paid holidays annually.
  - A robust paid Parental Bonding Leave program covering birth,
    adoption, and foster children.
  - 401(k) with employer contributions
  - Tuition reimbursement
  - Generous employee referral bonus program
  - Client referral bonus program
  - Pet insurance
  - FORCE –Sikich community volunteer program enabling each team
    member to use up to four hours of paid time annually to
    volunteer and make a difference in their local
    communities.

