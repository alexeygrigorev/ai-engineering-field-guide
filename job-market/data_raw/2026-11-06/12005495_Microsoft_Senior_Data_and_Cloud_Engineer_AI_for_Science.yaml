description: |
  Overview

  At Microsoft Research AI for Science we believe deep
  learning has the potential to transform scientific modelling
  and discovery crucial for solving the most pressing problems
  facing society, including sustainable materials and
  discovery of new drugs.

  For our labs in Amsterdam (NL), London (UK), Cambridge (UK),
  and Berlin (DE), we seek a highly motivated data and cloud
  engineer to join our density functional theory (DFT) team
  (What is DFT?). The mission of the team is to enable highly
  accurate and scalable predictions of the electronic
  structure of molecules and materials using deep learning-
  powered DFT. Accurate predictions of electronic structure
  are essential for predictive modeling across chemistry and
  materials science. Learn more about our work on accurate and
  scalable DFT in our blog and our project website.

  The primary focus of this role will be building and
  operating the cloud data pipelines that generate the large
  quantum chemistry datasets our models are trained on. You
  will work on turning quantum chemistry software into
  scalable cloud workflows, organizing and validating large
  scientific datasets, and running the cloud infrastructure
  behind them reliably and efficiently. If you have solid data
  and cloud engineering expertise and enjoy building
  infrastructure that enables cutting-edge scientific
  research, we encourage you to apply.

  This post will be open until the position is filled.

  Responsibilities

  - Work with domain experts to turn quantum chemistry software
    into large-scale cloud data generation pipelines
  - Organise, validate, and store large scientific datasets and
    make them efficiently available for ML and analysis
  - Build cloud infrastructure with containers, infrastructure
    as code, and CI/CD for repeatable deployments
  - Ensure reliability, security, and efficiency through
    observability, incident response, and capacity planning

  Qualifications

  Required qualifications:

  - MSc in computer science, mathematics, physics, chemistry, or
    a related area
  - Solid Python software engineering
  - Experience building and operating large-scale, distributed,
    fault-tolerant systems and data pipelines
  - Hands-on experience with Azure (preferred) or another major
    cloud, including containers and orchestration,
    infrastructure as code, and CI/CD
  - Experience with agentic software development
  - Ability to work in an interdisciplinary collaborative
    environment, through effective communication of technical
    concepts to non-experts from different technical
    backgrounds

  Qualifications that are considered a plus, but are not
  strictly required:

  - Prior experience supporting large-scale computing
    environments used for scientific research
  - Experience with large-scale data generation or acquisition
    for machine learning
  - Familiarity with quantum chemistry or other scientific
    simulation software
  - Experience with data storage, backup and recovery, and cloud
    security



