description: |
  Job Summary:

  The AI & Machine Learning Engineer, based in Athens, Greece,
  is responsible for designing and developing integrated AI
  systems, implementing ML algorithms, conducting experiments,
  and staying updated with the latest developments in the
  field. Your will collaborate with interdisciplinary teams to
  build efficient applications at the intersection of AI and
  Finance.

  What You Will Do:

  ·       Develop and deploy AI solutions at production scale,
  leveraging state-of-the-art technologies.

  ·       Work with large language models (LLMs), both closed
  and open-source, to solve complex problems.

  ·       Experiment with and refine prompt engineering
  techniques to improve model performance.

  ·       Design and optimize neural networks for various
  applications.

  ·       Utilize OpenAI and Anthropic APIs to build and
  enhance intelligent solutions.

  ·       Keep abreast of developments in the field.

  Requirements

  What You Will Bring:

  ·       Bachelor's degree in Computer Science, Mathematics,
  Physics, or related fields.

  ·       Master's degree in AI, Machine Learning, NLP, or
  related fields.

  ·  5+ years proven AI experience

  ·       Strong software engineering background.

  ·       Strong programming skills in Python.

  ·       Experience with Spacy, HuggingFace,
  TensorFlow/Keras/PyTorch.

  ·       Proven experience with prompt engineering.

  ·       Proven track record of developing and deploying
  machine learning models and applications in production.

  ·       Knowledge and experience with OpenAI/Anthropic APIs
  and other commercial AI products.

  ·       Basic experience of building and deploying services
  on cloud computing providers such as AWS or Azure.

  ·       Strong collaboration and communication skills to
  work within inter-disciplinary teams.

  ·    Prior experience in the Financial sector is a strong
  advantage

  Benefits

    What We Offer:

  ·        Competitive and performance-based remuneration.

  ·        Meal Vouchers.

  ·        Medical & Life Insurance Plan.

  ·        New experiences within a multinational environment
  and global teams.

  ·        Team spirit environment with passion for
  technology.

  ·        Development opportunities within a market-leading,
  fast-growing organization!

  If you want to be part of one of the top leading software
  firms in the FinTech industry internationally, we want to
  hear from you!

  We are an equal opportunities employer. All applications
  will be treated with strict confidentiality. By submitting
  your CV, you accept the content of our Privacy Policy, and
  consent to the processing of your data as part of this
  application.

  About Profile:

  Founded in 1990, Profile Software is a leading international
  software solutions provider for the Banking and Investment
  Management industries, with global offices in key financial
  centers and presence in 50 countries across 4 continents, as
  well as a listed company in Athens Stock Exchange.

  Thanks to our passionate, highly aspirated and tech savvy
  people, we deliver innovative, agile, and award-winning
  solutions to the biggest FinTech institutions, always aiming
  to develop on cutting-edge technologies (mobile, cloud, AI),
  offering various deployment methods (BPO, SaaS) and
  competitive functionality.
