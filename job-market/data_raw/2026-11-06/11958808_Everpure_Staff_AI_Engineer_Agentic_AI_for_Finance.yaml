description: |
  Everpure (NYSE: P) has evolved from storage pioneer to data
  platform, closing fiscal 2026 with $3.7 billion in revenue,
  its first billion-dollar quarter, and accelerating growth
  into FY27. Our strategic agenda spans the companies defining
  the next era of technology - hyperscalers, AI labs, the AI
  hardware supply chain, data platform providers, and the
  broader AI ecosystem.

  This type of work—work that changes the world—is what the
  tech industry was founded on. So, if you're ready to seize
  the endless opportunities and leave your mark, come join us.

  Staff AI Engineer, Agentic AI for Finance

  THE ROLE

  Join Everpure’s AI Factory as a founding technical lead
  driving the Office of the CFO’s mission to transform Global
  Finance into an insight-driven strategic partner. In this
  high-impact, hands-on role, you will pioneer production-
  grade autonomous agent systems and enterprise platform
  components that unlock automated financial workflows at
  scale. You will collaborate directly with finance leaders,
  internal software teams, and external engineering partners,
  establishing technical direction while shipping clean,
  auditable code daily.

  WHAT YOU'LL DO

  - Architect and ship resilient, auditable multi-agent
    workflows using LangGraph and Amazon Bedrock AgentCore,
    translating core financial logic into deterministic,
    review-ready production systems.
  - Design and implement secure, least-privilege Model Context
    Protocol (MCP) servers and Snowflake retrieval pipelines
    to enable safe data access across enterprise systems.
  - Partner with product and engineering teams to build
    intuitive user review portals, administration consoles,
    and human-in-the-loop governance workflows that guarantee
    data safety and SOX compliance.
  - Drive operational excellence across the AI lifecycle by
    establishing automated evaluation suites, shadow-mode
    release gates, and real-time observability for latency,
    drift, and cost.
  - Provide hands-on technical guidance across the codebase
    through rigorous pull request reviews, architectural
    blueprints, and collaborative mentorship for internal and
    partner engineering teams.

  WHAT YOU BRING

  - Demonstrated track record of designing, building, and
    operating production-grade agentic AI or LLM systems and
    distributed architectures, with a focus on cost, latency,
    and reliability trade-offs.
  - Expertise in secure backend and AI engineering, including
    Python, TypeScript, SQL, API development
    (FastAPI/GraphQL), and modern cloud infrastructure (AWS,
    Docker, CI/CD).
  - Experience architecting controls for regulated or enterprise
    environments, including role-based access controls,
    comprehensive audit logging, human-in-the-loop gates, and
    AI security standards (prompt defense, PII masking).
  - Strong cross-functional collaboration and communication
    skills, with proven ability to translate complex technical
    architectures into clear business context for non-
    technical stakeholders.

  We are primarily an in-office environment and therefore, you
  will be expected to work from the Bangalore office in
  compliance with Everpure’s policies, unless you are on PTO,
  or work travel, or other approved leave.

  WHAT YOU CAN EXPECT FROM US:

  - Innovation: We celebrate those who think critically, like a
    challenge, and aspire to be trailblazers.
  - Growth: We give you the space and support to grow along with
    us and to contribute to something meaningful. We have been
    named Fortune's Best Workplaces in Technology™, Fortune's
    Best Workplaces in the Bay Area™, and certified as a Great
    Place to Work®!
  - Team: We build each other up and set aside ego for the
    greater good.

  And because we understand the value of bringing your full
  and best self to work, we offer a variety of perks to manage
  a healthy balance, including flexible time off, wellness
  resources, and company-sponsored team events. Check out
  http://benefits.everpuredata.com/ for more information.

  ACCOMMODATIONS AND ACCESSIBILITY:

  Candidates with disabilities may request accommodations for
  all aspects of our hiring process. For more on this, contact
  us at TA-Ops@purestorage.com if you’re invited to an
  interview.

  OUR COMMITMENT TO A STRONG AND INCLUSIVE TEAM:

  We’re forging a future where everyone finds their rightful
  place and where every voice matters. Where uniqueness isn’t
  just accepted but embraced. That’s why we are committed to
  fostering the growth and development of every person,
  cultivating a sense of community through our Employee
  Resource Groups and advocating for inclusive leadership.

  Everpure is proud to be an equal opportunity employer. We do
  not discriminate based upon race, religion, color, national
  origin, sex (including pregnancy, childbirth, or related
  medical conditions), sexual orientation, gender, gender
  identity, gender expression, transgender status, sexual
  stereotypes, age, status as a protected veteran, status as
  an individual with a disability, or any other characteristic
  legally protected by the laws of the jurisdiction in which
  you are being considered for hire.

  Join us and bring your best.

  Bring your bold.

  Pure and simple.
