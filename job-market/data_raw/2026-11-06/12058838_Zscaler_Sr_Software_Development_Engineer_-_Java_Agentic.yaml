description: |
  Zscaler (NASDAQ: ZS) accelerates digital transformation so
  customers can be more agile, efficient, resilient, and
  secure. The Zscaler Zero Trust Exchange platform protects
  thousands of customers from cyberattacks and data loss by
  securely connecting users, devices, and applications in any
  location. Distributed across 200+ public data centers
  globally and thousands of private sites at the edge, the
  SASE-based Zero Trust Exchange is the world’s largest in-
  line cloud security platform.

  We believe the future of work is Human + AI and are building
  an AI-native enterprise where human potential is amplified
  by machine intelligence to solve the world’s hardest
  security challenges. Driven by deep customer obsession, we
  are committed to the mission, outcome, and to each other. We
  bring these commitments to life through three core
  behaviors: ownership and collaboration, trust through
  outcomes and impact, and a challenge culture with ongoing
  feedback. Ready to make an impact at the company pioneering
  security transformation in the AI era? Join us at Zscaler.

  Role

  As a Senior Software Engineer in Data + AI within the ZDX
  Engineering team, you will design and develop our high-
  throughput ZDX data platform using an AI-first approach to
  analyze massive volumes of network data in near real time.
  You will solve complex business and security challenges by
  detecting anomalies, identifying threat patterns, and
  delivering actionable intelligence. In this role, you will
  architect and orchestrate autonomous, multi-agent
  systems—partnering closely with data architects, product
  management, and engineering stakeholders to build the next
  generation of intelligent, automated data solutions.

  What you’ll do (Role Expectations)

  - Architect and scale distributed data pipelines supporting
    high-throughput ingestion, feature engineering, and real-
    time data serving from Big Data platforms
  - Design, build, and orchestrate Agentic AI systems, including
    multi-agent workflows, tool integrations, state
    management, observability, and real-time agent serving
  - Partner cross-functionally with data architects, product
    management, and engineering to automate complex analytics,
    anomaly detection, and threat triage
  - Lead the technical implementation, debugging, and end-to-end
    monitoring rollout plans for resilient, production-grade
    agentic frameworks

  Who You Are (Success Profile)

  - You thrive in ambiguity and view uncharted challenges as
    opportunities to build meaningful, scalable platform
    architecture.
  - You operate with true ownership, balancing high-level
    strategic planning with deep, hands-on technical
    execution.
  - You run toward complex problems with a bias for action,
    delivering measurable impact across data and AI systems.
  - You are a high-trust partner who practices transparent
    communication, constructive candor, and shared
    accountability to elevate team performance.
  - You embody a continuous learning mindset, proactively
    incorporating emerging AI frameworks, architectures, and
    engineering best practices.

  What We’re Looking for (Minimum Qualifications)

  - Foundational understanding of AI/ML technologies and
    experience leveraging, securing, or positioning AI-driven
    solutions to optimize outcomes within your functional
    domain
  - 3+ years of hands-on software engineering experience in Java
    and Spring Boot within large-scale, data-intensive
    environments
  - Hands-on experience with Redis caching, partition-aware
    query patterns, and high-performance querying on platforms
    such as Azure Data Explorer (ADX/Kusto) or Google BigQuery
  - Proven experience building and operating LLM- or agent-based
    architectures, including multi-agent orchestration, agent-
    to-agent communication, and autonomous decision-making
    workflows
  - Deep expertise in distributed systems architecture and major
    public cloud platforms including Azure, GCP, or AWS

  What Will Make You Stand Out (Preferred Qualifications)

  - Experience designing and optimizing autonomous AI agents
    with advanced reasoning, planning, and tool-use
    capabilities to automate complex network analytics and
    threat triage
  - Proven track record of designing, building, and shipping
    production applications processing billions of events
    across big data, AI, and distributed systems
  - Hands-on experience with advanced frameworks like LangGraph,
    multi-agent systems, prompt engineering, and state-of-the-
    art agent orchestration patterns

