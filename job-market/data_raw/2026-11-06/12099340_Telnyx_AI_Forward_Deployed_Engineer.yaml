description: |
  About Telnyx

  Telnyx is an industry leader that's not just imagining the
  future of global connectivity—we're building it. From
  architecting and amplifying the reach of a private, global,
  multi-cloud IP network, to bringing hyperlocal edge
  technology right to your fingertips through intuitive APIs,
  we're shaping a new era of seamless interconnection between
  people, devices, and applications.

  We're driven by a desire to transform and modernize what's
  antiquated, automate the manual, and solve real-world
  problems through innovative connectivity solutions. As a
  testament to our success, we're proud to stand as a
  financially stable and profitable company. Our robust
  profitability allows us not only to invest in pioneering
  technologies but also to foster an environment of continuous
  learning and growth for our team.

  Our collective vision is a world where borderless
  connectivity fuels limitless innovation. By joining us, you
  can be part of laying the foundations for this
  interconnected future. We're currently seeking passionate
  individuals who are excited about the opportunity to
  contribute to an industry-shaping company while growing
  their own skills and careers.

  We are looking for a Senior Software Engineer to join our AI
  Enablement team to help enable both our customers and our
  internal employees with tools that make their lives easier.
  You will develop and integrate tools that make employees
  better at their job while simultaneously making sure
  customers can easily integrate with our services whenever
  they use AI.  Additionally you will develop and maintain
  agent primitives such as meeting participation, web search,
  browser automation, email, payments, and related services.
  These capabilities will give agents secure, reliable ways to
  join meetings, browse the web, communicate, make purchases,
  and complete tasks on behalf of users.

  This role combines product engineering, platform design,
  applied AI, and support. You will work on services that must
  behave predictably in production, handle external systems
  safely, and expose clear interfaces that agents can use
  effectively.

  What you’ll do

  - Design, build, and operate production services for AI
    agents.
  - Build internal tools that make our employee’s lives easier
  - Build external integrations, connectors and tools that make
    customer integrations more seamless
  - Develop reusable primitives for meetings, browsing, search,
    email, payments, and adjacent capabilities.
  - Define reliable interfaces and workflows for agent tool use.
  - Work closely with product and engineering teams to turn new
    agent use cases into practical services.
  - Improve safety, observability, testing, and operational
    reliability across the platform.
  - Help shape the architecture and direction of our agent
    enablement platform.

  What we’re looking for

  - Strong software engineering experience, including ownership
    of production systems.
  - Comfort working with LLMs, AI agents, tool calling, and
    agent orchestration.
  - Good judgment around reliability, security, permissions, and
    external side effects.
  - An ability to work through ambiguous problems and turn early
    ideas into maintainable products.
  - Clear communication and a practical, hands-on approach to
    engineering.

  Experience with agent frameworks and runtimes such as Hermes
  Agent or OpenClaw is a plus.
