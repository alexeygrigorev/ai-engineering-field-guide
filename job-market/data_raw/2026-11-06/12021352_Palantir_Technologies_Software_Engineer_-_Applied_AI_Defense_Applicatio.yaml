description: |
  A World-Changing Company



  Palantir builds the world’s leading software for data-driven
  decisions and operations. By bringing the right data to the
  people who need it, our platforms empower our partners to
  develop lifesaving drugs, forecast supply chain disruptions,
  locate missing children, and more.

  The RolePalantir's Defense Applied AI product team builds
  products that help the modern warfighter leverage AI for
  their most mission-critical work. You will help own the
  entire end to end Agent experience in our products and work
  relentlessly to ensure they deliver value for our users,
  while maintaining a high bar for quality. Your day-to-day
  workflow will vary, adapting to the requirements of our
  users and the technical challenges that arise. One day, you
  may find yourself collaborating with users to refine the UX
  of a particular workflow, the next you could be fine-tuning
  performance to enable low-latency or more accurate
  operational outcomes. Our Product Development organization
  is made up of small teams of Software Engineers. Each team
  focuses on a specific aspect of a product and work
  collaboratively to build cross functional capabilities,
  streamline user workflows and continuously improve our
  software's efficiency and reliability. We’re hiring
  engineers who are passionate about solving real-world
  problems and empowering both developers and end-users to
  work optimally. If you’re motivated to develop reliable,
  performant, and scalable AI products, this role offers the
  opportunity to make a significant impact on our products and
  the people who use them.

