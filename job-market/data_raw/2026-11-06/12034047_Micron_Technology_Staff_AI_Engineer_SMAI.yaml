  possible. We're 40 years, 20+ countries, 26,000+ lifetime
  patents, and over 30,000 people strong. Required Skill:

  - Hands-on experience with full-stack software development
    with strong fundamentals in Core Programming and Object-
    Oriented Design.
  - Experience with the following technologies:
    - Programming languages / technologies: C#, C++, .NET, .NET
      Core, WPF, ADO.NET, WebAPI, RESTful services

  - Scripting languages: Perl, Python, PowerShell
  - Database environments: MS SQL Server, MySQL (experience with
    performance tuning and query optimization preferred)

  - Others: Design Patterns, DevOps, Agile/Scrum
  - Prior architecture and technical ownership experience is a
    plus
  - Cloud technologies: AWS, Azure
  - DevOps: CI/CD pipelines (build, release, and deployment
    automation)
  - Source Control: GIT, TFS
  - Windows' environment - Windows Desktop, Windows Server, IIS
  - Unix environment - Linux (RHEL), Apache Web Server
  - Familiarity with technologies - Microservices, Containers,
    OpenShift etc.
  - Familiarity with modern web UI development frameworks and
    responsive design principles.
  - Hands-on experience using Generative AI tools and Agentic
    AIs to support software development, debugging, testing,
    or productivity (e.g., GitHub Copilot, Claude Code)

  Qualifications:

  - The ability to work in numerous areas of software
    development independently or as part of a team
  - Strong analytical, problem solving, and organizational
    skills
  - Strong attention to detail
  - Passionate to contribute to a fast-paced environment on
    parallel projects and tasks
  - Self-driven and capable of delivering with minimal
    supervision
  - Strong stakeholder and customer collaboration skills
  - Active team participation and shown teamwork and consensus
    building skills
  - Excellent verbal and written communication skills
  - Knowledge of Agile / Scrum / Kanban
  - Familiar with DevOps principles
  - Demonstrated ability to leverage AI-assisted development
    tools (e.g., copilots or agents) to improve productivity,
    code quality, and problem solving, while following
    responsible and secure AI usage practices.

