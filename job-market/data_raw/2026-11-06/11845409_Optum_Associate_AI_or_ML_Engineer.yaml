description: |
  Requisition Number: 2391791 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:

  - Drives automation opportunity identification and assessment
    within the Shared Services.
  - Coding on RPA tools like UI Path, Power Automate
  - Define, design, configure, test, deploy and integration of
    new, modified and/or enhanced automations
  - Performs ETE Development and supports till hyper care or
    warranty period to make the project successful
  - Leads and/or participates in various types of interviews,
    meetings or workshops to define and design automation
    solutions
  - Leads and/or participates in the development process,
    including constructing and maintaining efficient, reusable
    and reliable code with robotic process automation software
    and tools
  - Leads and/or participates in testing activities, including
    integration testing, end-to-end (business process) testing
    and user acceptance testing
  - Leads and/or participates in the problem
    identification/error resolution process, including
    tracking, repairing and reporting defects
  - Creates, edits, revises and finalizes life cycle
    deliverables such as requirements specifications, solution
    design documents, and operating instructions (i.e. SOP)
  - Creates and maintains process, technical, project or other
    documentation, as may be required, to support development,
    project management and training
  - Coordinates sign-off approvals by business and/or technical
    staff to certify successful results of milestone
    deliverable(s) or phase completion, including program
    development and deployment
  - Performs code review of automations and provides
    constructive feedback to ensure quality of code
  - Supports QA activities as needed
  - Comply with all applicable Company policies, procedures, and
    business directives, changes including those relating to
    work location, team assignments, work schedules, and
    flexible work arrangements

  Required Qualifications:

  - Bachelor's degree with 5+ years of total IT experience
  - 3+ years of programmer and/or analyst experience with
    healthcare /finance/administrative business processes,
    systems and applications of varying scope and complexity
  - 3+ years of hands-on experience in developing using Java or
    automation tools
  - Experience with systems development life cycle and
    structured programming methods (both traditional and
    agile), including requirements definition, solution
    design, program development, testing, documentation,
    training, deployment, operations, support and maintenance
  - Knowledge of AI ML, Generative AI and Agentic AI, LLMs, RAG
  - Knowledge of advance Java
  - Good understanding of .Net (CSharp or VBA.net) - any of the
    following platforms

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
