description: |
  Description

  We are looking for a highly hands-on Senior Platform
  Engineer to lead and shape our platform engineering and
  developer experience capabilities. This role is responsible
  for building the engineering foundations that enable teams
  to develop, ship, and operate software faster, safer, and
  with greater confidence.

  You will drive improvements across platform engineering,
  developer workflows, CI/CD, observability, release
  management, and engineering productivity. This is an
  individual contributor role with significant influence
  across engineering teams and the opportunity to grow into
  platform leadership as the function evolves.

  What You'll Do

  - Define and execute a practical platform roadmap spanning
    CI/CD, release automation, environments, observability,
    developer workflows, and engineering productivity.
  - Build internal tools, automation, templates, paved roads,
    and reusable patterns that simplify software delivery
    across engineering teams.
  - Improve local development experiences, deployment processes,
    environment stability, and production visibility.
  - Increase delivery confidence through automated validation,
    quality controls, release guardrails, and rapid production
    feedback loops.
  - Partner closely with product engineering teams to identify
    delivery bottlenecks and convert them into platform
    improvements.
  - Operate with a platform-as-a-product mindset, treating
    engineering teams as internal customers and focusing on
    adoption, usability, and measurable impact.
  - Leverage DORA, developer experience (DX), and engineering
    productivity metrics to prioritize investments and track
    outcomes.
  - Establish AI-first engineering workflows for coding,
    debugging, documentation, reviews, and automation using
    modern AI development tools and agent-based workflows.
  - Raise engineering standards through technical leadership,
    architecture discussions, code reviews, design reviews,
    mentoring, and practical examples.
  - Lead through influence, collaboration, and technical
    expertise.

  What You'll Bring

  - 7+ years of experience in platform engineering, developer
    experience, engineering productivity, internal tooling,
    DevOps, software infrastructure, or related disciplines.
  - Proven experience building or significantly improving
    platform engineering, developer experience, or shared
    services functions.
  - Strong hands-on engineering capabilities with a track record
    of building the systems and tools you advocate for.
  - Experience creating scalable developer platforms, internal
    tooling, automation frameworks, paved roads, and reusable
    engineering patterns.
  - Deep understanding of CI/CD, release automation,
    observability, cloud infrastructure, environments, and
    production operations.
  - Ability to drive cross-functional initiatives and influence
    technical direction across multiple engineering teams.
  - Strong communication skills and the ability to build trust
    through technical expertise and sound judgment.
  - A practical approach to AI-enabled software development
    focused on measurable engineering outcomes rather than
    experimentation alone.

  Technology & Tools

  Required

  - Strong hands-on experience with AWS and modern cloud-native
    architectures.
  - Experience building and operating solutions leveraging AWS
    services such as:
  - ECS
  - EC2
  - Lambda
  - S3
  - IAM
  - VPC
  - CloudWatch

  Preferred Experience

  - Go, Python, C#, .NET, or other platform-focused programming
    languages.
  - Kubernetes and container orchestration technologies.
  - Infrastructure-as-Code tools such as Terraform.
  - CI/CD platforms including GitHub Actions, GitLab CI/CD,
    Jenkins, ArgoCD, or similar.
  - Observability platforms such as Datadog, Grafana,
    CloudWatch, or comparable solutions.
  - Engineering productivity and developer experience
    measurement tools.
  - AI-powered development tools, coding assistants, agent-based
    workflows, and automation platforms.

  Nice to Have

  - Production-grade Go development experience.
  - Experience supporting or modernizing large-scale C#/.NET
    environments.
  - TypeScript, React, or frontend platform engineering
    experience.
  - Internal developer portals, service scaffolding, golden-path
    frameworks, and platform-as-a-product practices.
  - Legacy modernization initiatives within mature SaaS
    environments.
  - Experience in transactional or workflow-intensive industries
    such as payments, financial technology, accounting,
    eCommerce, real estate technology, or similar domains.
  - Security-focused engineering, compliance-aware development,
    policy-as-code, and access control frameworks.

  What Success Looks Like

  - Engineering teams have clear, reliable, and well-documented
    paths for building, testing, deploying, and operating
    services.
  - CI/CD pipelines, environments, and release processes become
    more reliable, scalable, and developer-friendly.
  - Observability and production feedback loops support faster
    troubleshooting and improved operational confidence.
  - AI-assisted development workflows become practical, trusted,
    repeatable, and integrated into day-to-day engineering
    practices.
  - Platform initiatives are prioritized based on measurable
    engineering friction and demonstrable business impact.
  - Developer productivity, delivery speed, quality, and
    engineering satisfaction improve over time

  .

  WHY JOIN US

  Matrix is a global, dynamic, and fast‑growing technology
  services and consulting company with over 17,000 employees
  worldwide. Founded in 2001, Matrix has grown through
  significant organic expansion and strategic acquisitions,
  executing some of the largest and most impactful technology
  projects in the market.

  We specialize in the design, development, and implementation
  of advanced technologies, software solutions, and digital
  products. Our services include infrastructure and
  consulting, IT outsourcing and offshore delivery, training
  and assimilation programs, and acting as a trusted
  implementation and delivery partner for the world’s leading
  software vendors.

  With deep expertise across both the private and public
  sectors—spanning Finance, Telecom, Healthcare, Hi‑Tech,
  Education, Defense, and Security—Matrix serves a strong
  customer base in Israel alongside a continuously expanding
  global client portfolio.

  At Matrix, our people are at the heart of our success. We
  are a community of talented, creative, and dedicated
  professionals who are passionate about innovation and
  excellence. We actively attract, develop, and retain top
  talent, recognizing that every employee’s contribution is
  critical to our continued growth and future success.

  Matrix’s success is built on a challenging and engaging work
  environment, competitive compensation and benefits, and
  meaningful career development opportunities. We foster a
  diverse, inclusive culture that encourages collaboration,
  continuous learning, and growth—together.

  Join the winning team. Be challenged, grow your career, and
  enjoy the journey in a highly respected global organization.

  To learn more, visit: www.matrix-ifs.com



