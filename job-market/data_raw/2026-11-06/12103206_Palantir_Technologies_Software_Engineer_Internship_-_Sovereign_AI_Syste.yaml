description: |
  A World-Changing Company



  Palantir builds the world’s leading software for data-driven
  decisions and operations. By bringing the right data to the
  people who need it, our platforms empower our partners to
  develop lifesaving drugs, forecast supply chain disruptions,
  locate missing children, and more.

  The Role



  As a Software Engineer Intern on Sovereign AI
  Infrastructure, you will help build the systems that make AI
  agents useful, reliable, and governable in high-stakes
  operational environments. This is not a research-only
  internship. You’ll own a project with hands-on mentorship
  from experienced engineers, contributing to the systems that
  make production AI useful and trustworthy. That may mean
  working directly on agentic workflows, or on the layers they
  depend on: customer ontologies, context assembly, tool
  interfaces, agent identity or permissions, evaluations, and
  the core workflows that turn model outputs into real
  operational decisions. We are looking for interns with
  strong coding fundamentals and experience with AI systems.
  You should be excited to learn quickly, communicate clearly,
  and build systems where correctness, reliability, and
  customer trust matter.



  Core Responsibilities (may include)

  - Build production software that improves how Palantir
    deploys, operates, evaluates, or monitors AI systems in
    customer-controlled environments.
  - Contribute to infrastructure for agentic workflows,
    including tool use, context assembly, permissions,
    execution safety, observability, and debugging.
  - Design and implement  services, APIs, test harnesses,
    evaluation pipelines, or developer tools that make AI
    systems easier to operate.
  - Work with engineers, product teams, and customer-facing
    teams to understand real operational problems and turn
    them into durable software.
  - Debug issues across services, deployment systems, logs,
    configuration, permissions, and product behaviour.
  - Write clear, maintainable code and participate in code
    review with a high bar for quality.
  - Communicate your design decisions, tradeoffs, and results
    clearly to teammates.

  What We Value

  - Strong coding fundamentals and the ability to learn new
    languages and systems quickly.
  - Curiosity about how AI systems work in production,
    especially agentic systems that use tools, retrieve
    context, and interact with real workflows.
  - Clear written and verbal communication.
  - Grit & Ownership mindset: you care about getting the details
    right and seeing your work through.
  - Ability to collaborate with people across engineering,
    product, and customer-facing teams.
  - Active US Security clearance, or eligibility and willingness
    to obtain a US Security clearance, is beneficial but not
    required.

  What We Require

  - Currently pursuing a Bachelor’s or Master’s degree in
    Computer Science, Mathematics, Software Engineering,
    Physics, or a similar technical field.
  - Demonstrated interest in AI systems, agentic applications.
  - Experience coding in programming languages such as Java,
    Python, C++, Go, Rust, JavaScript, or similar.
  - Familiarity with data structures, algorithms, systems
    programming, backend services, cloud infrastructure, or
    distributed systems.
  - Strong written and verbal communication skills.
  - Ability to work full-time for the duration of the
    internship.

  To apply, please submit the following:

  - An updated resume / CV - please do so in PDF format.
  - Thoughtful responses to our application questions.

  Life at Palantir



  We want every Palantirian to achieve their best outcomes,
  that’s why we celebrate individuals’ strengths, skills, and
  interests, from your first interview to your longterm
  growth, rather than rely on traditional career ladders.
  Paying attention to the needs of our community enables us to
  optimize our opportunities to grow and helps ensure many
  pathways to success at Palantir. Promoting health and well-
  being across all areas of Palantirians’ lives is just one of
  the ways we’re investing in our community. Learn more at
  Life at Palantir and note that our offerings may vary by
  region.



  In keeping consistent with Palantir’s values and culture, we
  believe employees are “better together” and in-person work
  affords the opportunity for more creative outcomes.
  Therefore, we encourage employees to work from our offices
  to foster connectivity and innovation. Many teams do offer
  hybrid options (WFH a day or two a week), allowing our
  employees to strike the right trade-off for their personal
  productivity. Based on business need, there are a few roles
  that allow for “Remote” work on an exceptional basis. If you
  are applying for one of these roles, you must work from the
  state in which you are employed. If the posting is specified
  as Onsite, you are required to work from an office.



  If you want to empower the world's most important
  institutions, you belong here. Palantir values excellence
  regardless of background. We are proud to be an Equal
  Opportunity Employer for all, including but not limited to
  Veterans and those with disabilities. Palantir is committed
  to making the application and hiring process accessible to
  everyone and will provide a reasonable accommodation for
  those living with a disability. If you need an accommodation
  for the application or hiring process, please reach out and
  let us know how we can help.



  Please note that you will never be asked to submit a payment
  or share financial information to participate in our
  interview process. If you suspect that you've been contacted
  by a scammer, we recommend you cease all communication with
  the individual and consider reporting them to the relevant
  authorities, such as the US FBI Internet Crime Complaint
  Center (IC3). If you would like to understand more about how
  your personal data will be processed by Palantir, please see
  our Privacy Policy.
