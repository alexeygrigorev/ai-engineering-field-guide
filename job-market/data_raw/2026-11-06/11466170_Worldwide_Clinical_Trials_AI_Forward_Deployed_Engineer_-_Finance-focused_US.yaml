  Make an Impact as a Forward Deployed Engineer (Finance
  Focused) at Worldwide

  Help transform how Finance teams work by building AI-powered
  tools that give analysts valuable time back. In this role,
  you'll partner closely with finance stakeholders to create
  practical solutions that accelerate close activities,
  improve financial analysis, and make financial data easier
  to access and understand.

  You'll work at the intersection of finance, data, and AI,
  developing tools that assist with variance commentary,
  financial planning and analysis, and close processes while
  maintaining strong governance and compliance standards. Your
  work will help finance professionals focus on higher-value
  analysis and decision-making.

  This is an opportunity for someone who combines finance
  expertise with software engineering skills and enjoys
  solving complex business challenges through modern data and
  AI technologies.

  Where You'll Work

  This is a REMOTE role open to candidates based in US. You
  will collaborate with global teams across multiple time
  zones.

  What You'll Do

  - Build AI-assisted variance commentary and close-checklist
    solutions that generate draft insights from financial data
    and identify key business drivers.
  - Develop experiences using Databricks Genie and governed
    finance data to enable analysts to explore information
    through natural language.
  - Partner with FP&A Analysts and Project Financial Analysts to
    deliver tools that improve efficiency and enhance
    financial decision-making.
  - Measure and report solution adoption, usage, and
    productivity gains to demonstrate business impact.
  - Create assistive reconciliation capabilities that support
    finance teams while preserving human ownership of controls
    and approvals.
  - Design and deliver AI-enabled applications using Databricks,
    Python, and modern LLM technologies.
  - Ensure solutions align with governance requirements by
    maintaining clear separation between AI-generated
    recommendations and financial control activities.
  - Collaborate with finance stakeholders to understand
    processes, close cycles, planning activities, and
    reporting needs.

  What You'll Bring

  - Bachelor's degree in Finance, Accounting, Computer Science,
    Information Systems, Engineering, or a related field, or
    equivalent relevant experience.
  - 2+ years of hands-on experience with Databricks and building
    data-driven solutions.
  - 2+ years of LLM application engineering experience,
    including prompt engineering, context engineering,
    retrieval, structured outputs, and evaluation.
  - 2+ years of experience using Python and sufficient full-
    stack development skills to deliver production-ready
    applications.
  - 2+ years of experience working within or closely alongside
    Finance teams, with knowledge of FP&A processes, monthly
    close activities, budgeting, forecasting, variance
    analysis, and revenue recognition fundamentals.
  - Experience working with finance systems and governed
    financial data, including platforms such as NetSuite,
    Certinia, and Workday Adaptive Planning.
  - Familiarity with Microsoft 365 and Copilot, MLflow,
    Databricks Vector Search, Databricks Genie, Genie Code,
    and/or GenieOne; CRO or pharma-services experience and SOX
    exposure are preferred.
  - Proficiency in English

