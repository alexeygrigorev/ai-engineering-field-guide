description: |
  Job Description

  Help bring AI into the systems tax and audit professionals
  rely on every day. As a Senior Integration Engineer, you
  will connect AI solutions with Thomson Reuters products and
  client enterprise systems, building reliable integrations
  that turn complex financial data into useful AI workflows.
  Working within Forward Deployed Engineering, you will
  partner directly with public accounting firms, corporate tax
  departments and engineering teams to deliver solutions that
  can be reused across client engagements.

  Key Responsibilities

  - Deliver enterprise integrations connecting AI solutions with
    Thomson Reuters tax and audit products, enterprise
    resource planning systems, document management platforms
    and data warehouses. Own standard client integrations from
    scoping through delivery and handoff, and lead integration
    work within larger engagements.
  - Build reliable data and retrieval pipelines that parse
    documents, preserve tables and forms, and support
    effective chunking, embeddings and vector search.
    Establish data mapping, transformation and validation for
    financial information such as trial balances, tax returns,
    K-1s and workpapers.
  - Enable AI agents to interact with enterprise systems through
    application programming interfaces (APIs), Model Context
    Protocol (MCP) servers and connectors, using shared
    platform capabilities where available and supporting
    legacy applications and file-based exchanges.
  - Own data and output quality by defining readiness standards
    and automated checks, including schema validation,
    reference datasets and model-assisted evaluations, to
    identify when upstream data changes affect AI results.
  - Protect sensitive client information through secure
    authentication, single sign-on, appropriate tenant
    separation, secrets management and least-privilege access.
  - Create reusable integration assets with automated tests,
    clear documentation and deployment patterns that help
    engineers deliver future engagements more efficiently.
  - Ensure production reliability through monitoring, failure
    handling and operational runbooks, partnering with
    technical consulting, product engineering, platform and
    site reliability teams on deployment and support.

  Required Qualifications

  - At least five years of software engineering experience, with
    substantial hands-on experience in APIs, data integration,
    middleware or enterprise system connectivity.
  - Strong proficiency in Python and/or C#/.NET, solid SQL
    skills, and experience building REST APIs, event-driven
    integrations and file or batch-based data exchanges.
  - Hands-on experience building AI data pipelines, including
    document parsing, chunking, embeddings, vector databases
    and retrieval quality measurement.
  - Experience integrating enterprise resource planning or
    financial systems, such as SAP, Oracle or Workday, and
    implementing data quality and validation controls.
  - Experience deploying cloud applications on AWS or Azure
    using automated build and deployment pipelines and
    containers, with working knowledge of secure
    authentication and access management.
  - Ability to communicate clearly with technical and finance
    stakeholders, solve ambiguous integration problems, take
    ownership of delivery, collaborate across teams and
    exercise sound judgment about data quality and security.

  Preferred Qualifications

  - Experience with Thomson Reuters products such as UltraTax
    CS, GoSystem Tax RS, ONESOURCE, GoFileRoom or Checkpoint,
    or comparable tax and accounting software.
  - Familiarity with tax and accounting workflows, legacy .NET
    and SQL Server systems, or electronic tax filing XML
    formats.
  - Experience with large language model tool use, function
    calling or Model Context Protocol, and a background in
    client-facing professional services or consulting
    delivery.

  #LI-TH1

