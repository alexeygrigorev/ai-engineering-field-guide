description: |
  Company Description

  Metro Global Solution Center (MGSC) is internal solution
  partner for METRO, a €31 Billion international wholesaler
  with operations in more than 30 countries. The store network
  comprises a total of 623 stores in 21 countries, of which
  522 offer out-of-store delivery (OOS), and 94 dedicated
  depots. In 12 countries, METRO runs only the delivery
  business by its delivery companies (Food Service
  Distribution, FSD).

  HoReCa and Traders are core customer groups of METRO. The
  HoReCa section includes hotels, restaurants, catering
  companies as well as bars, cafés and canteen operators. The
  Traders section includes small grocery stores and kiosks.
  The majority of all customer groups are small and medium-
  sized enterprises as well as sole traders. METRO helps them
  manage their business challenges more effectively.

  MGSC, location wise is present in Pune (India), Düsseldorf
  (Germany) and Szczecin (Poland). We provide HR, Finance, IT
  & Business operations support to 31 countries, speak 24+
  languages and process over 18,000 transactions a day. We are
  setting tomorrow’s standards for customer focus, digital
  solutions, and sustainable business models. For over 10
  years, we have been providing services and solutions from
  our two locations in Pune and Szczecin. This has allowed us
  to gain extensive experience in how we can best serve our
  internal customers with high quality and passion. We believe
  that we can add value, drive efficiency, and satisfy our
  customers.

  Job Description

  Role Overview

  An AI Engineer at METRO unlocks the potential of AI for full
  organization. Rapidly delivers business-driven AI solutions
  by integrating existing cloud models and APIs, rather than
  inventing new algorithms. An AI Engineer builds digital
  agents and engineers the future of smart wholesale by
  delivering pragmatic, secure, maintainable, and observable
  AI powered solutions, that drive business value. Curious to
  get more information about the team, the products, or the
  tech stack?

  Key Responsibilities

  - Rapidly deliver business-driven AI solutions by integrating
    existing cloud models and APIs, focusing on practical
    implementation rather than developing new algorithms.
  - Translate business goals into AI-powered solutions, ensuring
    technical feasibility through collaboration with squad
    leads, data scientists, architects, and full stack
    engineers.
  - Integrate Google Cloud AI services and models into
    microservices and workflows to support scalable and
    maintainable solutions.
  - Design, implement, deploy, and monitor intelligent agents to
    support automation and personalization.
  - Build and maintain CI/CD pipelines using Cloud Build and
    GitHub Actions, collaborating closely with DevOps
    engineers and SREs for robust deployment and monitoring.
  - Maintain comprehensive documentation including API
    references, runbooks, architecture diagrams, and conduct
    internal demos and training sessions.
  - Ensure all AI solutions comply with METRO’s corporate
    policies on responsible AI and ethical standards.

  Qualifications

  Education: Bachelor’s or Master’s degree in Computer
  Science, Software Engineering.

  Work Experience & Skills

  - Proven experience with Google Cloud Platform development (AI
    services/products such as Vertex AI, Document AI, BigQuery
    ML, Agent Development Framework).
  - Strong knowledge of third-party LLMs (e.g. OpenAI,
    Anthropic, Gemini, Azure OpenAI), mastering prompt and
    context engineering.
  - Strong knowledge of microservices architecture and several
    development patterns (API-driven development; event-driven
    or message-driven development).
  - Proven experience with programming languages (SQL & Python
    is a must).
  - Knowledge of agentic development frameworks (e.g. Google
    Agent Development Kit).
  - Proficient in using coding assistant tools, building POCs
    rapidly.
  - Knowledge of BigQuery.
  - Knowledge of CI/CD pipelines, in the context of Google Cloud
    Platform.
  - Strong team player with a fast-learning, “iterate quickly”
    mindset, eager to help redefine how METRO operates in the
    age of AI.
  - Excellent English communication skills, both written and
    verbal.
  - Demonstrated problem-solving ability with a structured,
    process-oriented approach.
