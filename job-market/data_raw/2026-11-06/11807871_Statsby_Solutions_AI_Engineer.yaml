description: |
  We’re looking for an AI Engineer who enjoys turning machine
  learning ideas into working, reliable products. You’ll build
  and deploy AI solutions, guide a small team, and take
  ownership of projects from the first idea through to
  delivery.

  What you’ll do:

  - Design, build, and deploy machine learning and AI models
    that solve real business problems
  - Lead projects end to end: planning, task allocation,
    delivery, and stakeholder updates
  - Work with data teams to prepare, clean, and understand
    datasets
  - Test, monitor, and improve model performance in production
  - Mentor junior team members and review their work
  - Keep up with new AI tools and techniques, and suggest what’s
    worth adopting

  What we’re looking for:

  - 4+ years of experience in AI/ML engineering
  - Proven experience leading at least one project or a small
    team
  - Strong understanding of machine learning concepts and
    algorithms
  - Hands-on experience with Python and ML frameworks such as
    TensorFlow, PyTorch, or scikit-learn
  - Experience taking models from development to deployment
  - Good communication skills and the ability to explain
    technical work to non-technical people

  Good to have:

  - Experience with generative AI, LLMs, or NLP
  - Familiarity with cloud platforms (AWS, Azure, or GCP)
  - Knowledge of MLOps practices and tools

  - Location: Pune
  - Work mode: Work from office
  - Experience: 4+ year
