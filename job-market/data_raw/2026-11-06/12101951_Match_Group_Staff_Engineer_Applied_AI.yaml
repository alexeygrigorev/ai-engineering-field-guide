description: |
  Our Mission

  As humans, there are few things more exciting than meeting
  someone new. At Tinder, we’re inspired by the challenge of
  keeping the magic of human connection alive. With tens of
  millions of users, hundreds of millions of downloads, 2+
  billion swipes per day, 20+ million matches per day, and a
  presence in 190+ countries, our reach is expansive—and
  rapidly growing.

  We work together to solve complex problems. Behind the
  simplicity of every match, we think deeply about human
  relationships, behavioral science, network economics, AI and
  ML, online and real-world safety, cultural nuances,
  loneliness, love, sex, and more.

  Our Values

  - Take the Lead: We don't ghost our work or each other. Just
    as users don't leave their matches hanging, we don't let
    each other down.
  - Move Fast: We have a bias for action and urgency. Something
    that could be done tomorrow would be better if done today.
  - Better Together: We keep connection at the heart of dating
    and at the heart of how we work. Just as our users are
    better when they connect with others, so are we when we
    collaborate.
  - Real Talk: We say the hard thing the human way. Just as we
    ask our users to behave with kindness and candor in our
    community, we expect Team Tinder to do the same.
  - Safety First: We act with integrity, transparency, and
    consistency so people feel safe—whether they're swiping,
    matching, or working alongside us.
  - Spark Fun: We have fun to unlock creativity, fuel
    innovation, and help us build better experiences for
    daters.

  The Team or Role

  Agents now do real work at Tinder. They review code,
  security risks, accessibility, make UI improvements, help
  marketing teams with their workflows, and run inside
  engineers' coding tools and in Slack. Every one of them
  reaches our internal systems through our agent platform: a
  gateway, a growing set of MCP connectors, and the identity,
  policy and observability layers around them.

  We're hiring the engineer who owns that platform's design
  and functions by closely collaborating with internal teams
  on real use cases. You'll make it safe by default for agents
  that can read sensitive data and take consequential actions,
  fast and reliable enough that teams want to build on it, and
  simple enough that the next connector or agent takes days,
  not weeks.

  Where you’ll work:

  This is a hybrid role and requires in-office collaboration
  three times per week in our Palo Alto, California office.

