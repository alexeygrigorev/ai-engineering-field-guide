    through Udemy, and an annual $3,000 stipend for your
    professional development
  - Investment in your wellness: access to mental health support
    via Modern Health, paid concierge medical membership, pet
    insurance, fitness membership subsidy, and commuter
    subsidy
  - Free subscription to Tinder Gold

  Commitment to Inclusion



  At Tinder, we don’t just accept difference, we celebrate it.
  We strive to build a workplace that reflects the rich
  diversity of our members around the world, and we value
  unique perspectives and backgrounds. Even if you don’t meet
  all the listed qualifications, we invite you to apply and
  show us how your skills could transfer. Tinder is proud to
  be an equal opportunity workplace where we welcome people of
  all sexes, gender identities, races, ethnicities,
  disabilities, and other lived experiences. Learn more here:
  https://www.lifeattinder.com/dei



  If you require reasonable accommodation to complete a job
  application, pre-employment testing, or a job interview or
  to otherwise participate in the hiring process, please speak
  to your Talent Acquisition Partner directly.



