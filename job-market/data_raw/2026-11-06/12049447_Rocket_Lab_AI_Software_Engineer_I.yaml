title: AI Software Engineer I
company: Rocket Lab
location: Long Beach, USA
work_type: FULL_TIME
description: |
  ABOUT ROCKET LAB

  Rocket Lab is the end-to-end space company building rockets,
  spacecraft, and critical subsystems that keep the world
  connected, protected, expand humanity’s reach to the Moon,
  Mars, and beyond. We move fast, build real hardware for
  meaningful missions, and make the impossible routine. Come
  shape the future with us.

  IT

  Rocket Lab’s IT team is responsible for how our global teams
  access information and run operations across our computer
  systems, networks, and devices. Our hardworking IT team is a
  group of flexible problem-solvers working in a fast-paced
  environment but who also thrive under the challenge of
  supporting all of our proprietary systems and people, from
  finance to launch operations.

  AI SOFTWARE ENGINEER I

  Based on-site at Rocket Lab's Long Beach, CA facility, the
  AI Software Engineer will develop innovative AI solutions,
  deploy these systems company-wide, and seamlessly integrate
  them with our critical internal applications. You'll join a
  collaborative team running rapid experiments to identify the
  most promising AI use cases, while developing robust,
  scalable infrastructure that supports the whole organization
  to leverage AI.

  WHAT YOU'LL GET TO DO:

  - Provide access to off-the-shelf AI tools, supporting
    integration and offering training.
  - Build AI-driven solutions that deliver high value across the
    organization.
  - Integrate internal applications with AI by implementing AI
    agents and providing APIs for software developers.
  - Evaluate and integrate specialized AI solutions from
    external partners to complement our capabilities.
  - Collaborate with teams, sharing knowledge and training
    colleagues on the practical applications of AI.
  - Stay informed about internal developments to identify and
    assess emerging AI opportunities.

  YOU'LL BRING THESE QUALIFICATIONS:

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related field.
  - Proficiency in a modern programming language.
  - Familiarity with LLM agents, MCP, and how they are used in
    current AI solutions.

  THESE QUALIFICATIONS WOULD BE NICE TO HAVE:

  - 1+ years of experience in software engineering or machine
    learning engineering.
  - Passion for software, staying up to date with latest
    developments and experimenting with interesting
    technology.
  - Excellent communication skills, with the ability to
    translate technical concepts for diverse audiences.
  - Expert level skills in Python, including libraries commonly
    used in AI/ML from pandas to PyTorch.
  - In-depth knowledge of Kubernetes and cloud provider
    technologies (AWS/Azure/Google Cloud).
  - Proven track record of automating software CI/CD pipelines
    with tools such as TeamCity and ArgoCD.
  - Experience with advanced machine learning techniques such as
    deep learning, natural language processing, or
    reinforcement learning.

  This position may require prolonged periods of sitting,
  standing, walking, computer work, and occasional exposure to
  moderate levels of noise, dust, and fumes in production
  areas.

  Level and base salary will be determined on a case-by-case
  basis and may vary based on the following considerations:
  job-related knowledge and skills, education, and experience.

  Base salary is just one component of our total rewards
  package at Rocket Lab. Our comprehensive benefits package
  includes our industry-leading Employee Stock Purchase
  Program (with a 15% discount on company stock), top-tier
  medical plans (HMO, PPO, and a zero cost HDHP option with a
  significant HSA company contribution), dental and vision
  coverage, paid vacation and sick time, 11 paid holidays,
  flexible spending and dependent care accounts, paid parental
  leave, disability and life insurance, and a 401(k)
  retirement plan with company match.

  Additional perks include subsidized EV charging, onsite
  fitness centers (where available), discounted gym
  memberships, complimentary snacks and beverages, 50%
  employee discount on our popular merch store, and a variety
  of other employee discounts.

  Eligibility for benefits may vary based on employment
  status, please check with your recruiter for a comprehensive
  list of the benefits available for this role. Benefit
  programs are subject to change at the company’s discretion.

  Hourly Pay Range (CA Only)

  $45.39—$52 USD

  WHAT TO EXPECT

  We’re on a mission to unlock the potential of space to
  improve life on Earth, but that’s not an easy task. It takes
  hard work, determination, relentless innovation, teamwork,
  grit, and an unwavering commitment to achieving what others
  often deem impossible. Our people out-think, out-work, and
  out-pace. We pride ourselves on having each other’s backs,
  checking our egos at the door, and rolling up our sleeves on
  all tasks big and small. We thrive under pressure, work to
  tight deadlines, and our focus is always on how we can
  deliver, rather than dwelling on the challenges that stand
  in the way.

  Important information:

  FOR CANDIDATES SEEKING TO WORK IN US OFFICES ONLY:

  To conform to U.S. Government space technology export
  regulations, including the International Traffic in Arms
  Regulations (ITAR), Rocket Lab Employees must be a U.S.
  citizen, lawful U.S. permanent resident (i.e., current Green
  Card holder), or lawfully admitted into the U.S. as a
  refugee or granted asylum, or be eligible to obtain the
  required authorizations from the U.S. Department of State
  and/or the U.S. Department of Commerce, as applicable. Learn
  more about ITAR here.

  Rocket Lab provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state, or local laws.
  This policy applies to all terms and conditions of
  employment at Rocket Lab, including recruiting, hiring,
  placement, promotion, termination, layoff, recall, transfer,
  leaves of absence, compensation, and training.

  Applicants requiring a reasonable accommodation for the
  application/interview process for a job in the United States
  should contact Giulia Johnson at
  g.biow@rocketlabusa.com.This dedicated resource is intended
  solely to assist job seekers with disabilities whose
  disability prevents them from being able to apply/interview.
  Only messages left for this purpose will be considered. A
  response to your request may take up to two business days.

  FOR CANDIDATES SEEKING TO WORK IN NEW ZEALAND OFFICES ONLY:

  For security reasons, background checks will be undertaken
  prior to any employment offers being made to an applicant.
  These checks will include nationality checks as it is a
  requirement of this position that you be eligible to access
  equipment and data regulated by the United States'
  International Traffic in Arms Regulations.

  Under these Regulations, you may be ineligible for this role
  if you do not hold citizenship of Australia, Japan, New
  Zealand, Switzerland, the European Union, or a country that
  is part of NATO, or if you hold ineligible dual citizenship
  or nationality.  For more information on these Regulations,
  click here ITAR Regulations.
