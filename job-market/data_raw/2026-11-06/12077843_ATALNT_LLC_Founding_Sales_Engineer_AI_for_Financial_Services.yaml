description: |
  Founding Sales Engineer, AI for Financial Services

  - Location: New York, NY. Hybrid, 3 to 4 days a week in the
    office or on client sites
  - Job type: Full-time
  - Pay: $180,000 - $250,000 base, plus commission and equity

  About the company

  A seed-funded, already profitable AI company with $10M+ in
  revenue, closing its Series A. Its platform is in production
  at financial institutions managing over $1 trillion in
  assets. The founders come from senior AI leadership roles at
  major banks, big tech and private equity. The platform
  deploys agentic AI built around each firm's own workflows
  and rules, running inside the client's own cloud, with
  outputs that are traceable and defensible to a regulator.
  It's live across insurance, private credit, private equity
  and commercial lending.

  MUST HAVES

  - Sales or solutions engineering for AI or fintech software
    sold into regulated financial services
  - Holds their own with business buyers (claims ops, FP&A,
    credit ops leaders) and technical buyers (CIO, model risk,
    InfoSec)
  - Comfortable running security and architecture reviews,
    including data lineage, human-in-the-loop controls and
    guardrails
  - NYC based (or ready to be), in the office or on client sites
    3 to 4 days a week

  The role

  You'll be the first sales engineer, carrying the function
  while you build it. You're the technical partner to the
  Client Partners and Account Executives across the full sales
  cycle, turning a client's operational problem into something
  engineering can scope, and what's been built into something
  a business buyer can act on.

  What you'll do

  - Lead technical discovery: find the real workflow, the
    exception paths and where the current process breaks
  - Own the business-buyer demo: the flow, the story and the
    data, tied to real commercial outcomes
  - Run architecture and security reviews with CIOs, model risk
    committees and InfoSec teams
  - Scope workflows and hand off cleanly to delivery
  - Build the sales engineering playbook from scratch

  Qualifications

  - Sales or solutions engineering at an AI or fintech software
    company
  - Selling to insurers, lenders, asset managers or banks
  - Founding or early sales engineer experience is a big plus

  Why this job

  - First sales engineer at a profitable, fast-growing AI
    company at its Series A
  - Build the function and write the playbook
  - Strong base plus commission and equity
