description: |
  Senior Developer AI Automation

  Description -

  Job Summary

  - This role is responsible for designing, developing, and
    supporting AI-powered applications and automation
    solutions that improve business operations. It combines
    hands-on programming, cloud, and infrastructure experience
    with expertise in AI and RPA to deliver reliable, scalable
    solutions. The role collaborates with business and
    technical teams, contributes to solution design, and
    provides technical guidance to other developers.

  Responsibilities

  - Designs and develops AI applications, intelligent agents,
    RPA bots, and end-to-end automation workflows.
  - Translates business requirements into technical designs,
    reusable components, and maintainable code.
  - Implements solutions using generative AI, document
    understanding, information extraction, and business rules.
  - Integrates solutions with enterprise applications, APIs,
    databases, and other data sources.
  - Develops workflows that handle complex scenarios,
    exceptions, and appropriate human review.
  - Deploys and supports solutions on cloud platforms, including
    application infrastructure and configuration.
  - Implements testing, AI evaluation, CI/CD, logging, and
    monitoring to ensure production reliability.
  - Troubleshoots issues and improves solution accuracy,
    performance, scalability, and cost.
  - Applies security, data privacy, access control, and software
    engineering standards.
  - Conducts code reviews, maintains technical documentation,
    and mentors developers.

  Education & Experience Recommended

  - Degree in Computer Science, Engineering, Information
    Systems, or a related discipline, or equivalent practical
    experience.
  - Typically has 5–8 years of relevant experience in software
    development, AI, RPA, or enterprise automation.
  - Strong hands-on programming experience and demonstrated
    delivery of production solutions.
  - Practical experience with cloud platforms, application
    infrastructure, and enterprise integrations.

  Preferred Certifications

  - AI, Cloud Platform, RPA, or DevOps Certification
  - Programming Language Certification

  Knowledge & Skills

  - Python and Working Knowledge of Java, C#, or Comparable
    Languages
  - Generative AI, Large Language Models, and Agentic Workflows
  - Prompt Engineering and Retrieval-Augmented Generation
  - RPA and Workflow Orchestration
  - Document Understanding and Information Extraction
  - APIs, Enterprise Integration, SQL, and Databases
  - Microsoft Azure, Amazon Web Services, or Google Cloud
  - Containers, CI/CD, and Infrastructure as Code
  - Networking, Identity, Secrets, and Access Management
  - Software Design, Testing, Debugging, and Monitoring
  - AI Evaluation, Security, and Data Privacy

  Cross-Org Skills

  - Customer Centricity
  - Analytical Thinking and Problem-Solving
  - Cross-Functional Collaboration
  - Communication and Technical Mentoring
  - Ownership and Prioritization
  - Adaptability and Continuous Learning

  Impact & Scope

  - Delivers and improves AI and automation capabilities across
    business processes, contributing to productivity,
    processing accuracy, and operational efficiency.

  Complexity

  - Applies technical judgment to resolve ambiguous
    requirements, variable AI outputs, complex business
    scenarios, and enterprise integration challenges.

