description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Our vision is to transform how the world uses
  information to enrich life for all. Micron Technology is a
  world leader in innovating memory and storage solutions that
  accelerate the transformation of information into
  intelligence, inspiring the world to learn, communicate, and
  advance faster than ever. About Our Team The Smart
  Manufacturing and Artificial Intelligence (SMAI)
  organization is leading Micron's AI-first transformation by
  building intelligent applications, AI-powered platforms,
  data products, and automation solutions that accelerate
  innovation across manufacturing, engineering, and business
  operations. Position Overview As a Senior AI Full Stack
  Engineer, you will lead the architecture, development,
  deployment and operationalization of secure, scalable AI-
  powered applications. You will combine strong software
  engineering with practical expertise in Generative AI,
  agentic systems, cloud-native services, data integration and
  modern user experiences. The role is expected to
  independently own complex technical outcomes, guide
  engineering decisions, mentor junior engineers and partner
  with architects, data scientists, product owners and
  business stakeholders to deliver measurable enterprise
  value. You will build enterprise-grade services and APIs
  using C# and .NET (ASP.NET Core), develop modern frontend
  experiences, integrate Large Language Models (LLMs), AI
  agents, Retrieval-Augmented Generation (RAG), Model Context
  Protocol (MCP) and enterprise data sources, and establish
  engineering practices that improve reliability, security,
  observability and delivery velocity. Responsibilities

  - Lead end-to-end design, development, testing, deployment and
    support of full-stack and AI-powered applications.
  - Translate business problems and non-functional requirements
    into scalable solution architectures, technical designs
    and executable delivery plans.
  - Build secure, maintainable backend services, APIs and
    microservices using C#, .NET and ASP.NET Core; apply sound
    object-oriented and domain-driven design principles where
    appropriate.
  - Develop responsive, accessible and reusable frontend
    components using Angular, React, Blazor or an equivalent
    modern framework.
  - Design and implement GenAI solutions using LLMs, RAG, prompt
    orchestration, tool calling, AI agents and copilots,
    including Azure OpenAI and Semantic Kernel-based
    integrations.
  - Implement MCP or similar integration patterns that enable
    governed connectivity between AI agents, enterprise tools,
    APIs and data sources.
  - Design retrieval pipelines including document ingestion,
    chunking, metadata, embeddings, vector search, relevance
    evaluation and citation or grounding strategies.
  - Integrate relational, non-relational, streaming and
    analytical data sources; contribute to reliable data
    pipelines and data contracts that support AI applications.
  - Apply responsible AI and security-by-design practices,
    including access control, privacy, content safety, prompt-
    injection defenses, auditability and human oversight
    appropriate to the use case.
  - Own production readiness through automated testing, CI/CD,
    infrastructure configuration, observability, performance
    tuning, incident response and root-cause analysis.
  - Conduct design reviews and code reviews; define reusable
    patterns, coding standards and quality gates across the
    engineering lifecycle.
  - Mentor associate and mid-level engineers through technical
    guidance, pairing, constructive review feedback and
    knowledge sharing.
  - Partner with product owners and stakeholders to refine
    scope, communicate technical trade-offs, manage
    dependencies and deliver incremental business value.
  - Evaluate emerging technologies through structured prototypes
    and recommend adoption based on security, operability,
    cost, maintainability and business fit.
  - Use AI-assisted engineering tools responsibly for coding,
    testing, documentation and developer productivity while
    ensuring human review and compliance

  Minimum Qualifications

  - 5+ years of professional software engineering experience,
    including hands-on delivery of production applications.

  - Bachelor's or Master's degree in:
    - Computer Science
    - Information Technology
    - Artificial Intelligence
    - Data Science
    - Software Engineering
    - Computer Engineering
    - Or a related technical discipline

  Required technical expertise

  - Advanced proficiency in C# and .NET / ASP.NET Core, RESTful
    APIs, object-oriented design, asynchronous programming,
    dependency injection, testing and performance
    optimization.
  - Production experience with a modern frontend framework such
    as Angular, React or Blazor, plus HTML, CSS, TypeScript or
    JavaScript and secure client-server integration.
  - Hands-on experience integrating LLMs or machine-learning
    capabilities into applications, including prompt design,
    RAG, tool or function calling, evaluation and production
    safeguards.
  - Strong SQL skills and practical experience with relational
    databases such as Microsoft SQL Server or PostgreSQL;
    working knowledge of non-relational or vector data stores.
  - Experience delivering cloud-native workloads on Azure, GCP
    or AWS using containers, Kubernetes or OpenShift,
    configuration management and managed platform services.
  - Experience with Git, pull-request workflows, CI/CD using
    Azure DevOps or GitHub Actions, automated unit and
    integration testing, code quality and release practices.
  - Working expertise in logging, metrics, tracing, alerting,
    resiliency, troubleshooting, incident response and
    production support.
  - Practical knowledge of authentication and authorization,
    secrets management, secure coding, dependency risk, data
    protection and enterprise security controls.

