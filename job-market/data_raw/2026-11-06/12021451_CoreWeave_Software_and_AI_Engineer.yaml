description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do

  The Strategy and Transformation team builds intelligent
  systems and first-party applications that improve how
  CoreWeave’s internal teams work. The team partners with
  Finance, Supply Chain, HR, and core business operations to
  connect workflows across enterprise platforms, including
  ERP, HRIS, MRP, PDM, and DCIM.

  About the Role

  As a Software and AI Engineer, IT Systems, you’ll design and
  build AI agents, copilots, and first-party applications that
  make CoreWeave’s internal workflows more intelligent,
  automated, and intuitive. You’ll work across applied AI,
  product design, and full-stack engineering—from agentic
  workflows built with integration platforms and AI frameworks
  to React interfaces and backend services in Node.js and Go.

  In this role, you will:

  - Develop AI agents and copilots for Finance, Billing, Supply
    Chain, and other internal teams, using frameworks and APIs
    such as LangChain, LangGraph, Cohere, OpenAI, Gemini, and
    Glean.
  - Design and build first-party web and mobile applications
    using React, TypeScript, and modern front-end frameworks.
  - Develop scalable backend services in Node.js and Go for data
    processing, orchestration, and automation.
  - Integrate enterprise systems—including ERP, HRIS, MRP, PDM,
    DCIM, and data warehouses—through native integrations or
    iPaaS platforms such as Workato or Boomi.
  - Build APIs and microservices that support modular, event-
    driven application architectures.
  - Use GenAI development tools such as Cursor, Claude, Copilot,
    and ChatGPT Codex to accelerate implementation, testing,
    and documentation.
  - Build observability, maintainability, and security into
    applications across the stack.
  - Partner with stakeholders in Finance, Accounting, Security,
    Engineering, and other business teams to design useful,
    user-centered workflows.

  Who You Are

  - You have 3+ years of programming experience in C++, Go, C#,
    Java, TypeScript, or Python, building production-grade
    cloud services.
  - You have 3+ years of scripting experience in Python or Bash
    for automation and tooling.
  - You have solid experience designing RESTful APIs and event-
    driven integration architectures.
  - You have experience building and deploying production-grade
    applications and microservices.
  - You have experience with cloud environments (AWS, Azure, or
    GCP), container orchestration, and DevOps and CI/CD
    practices.
  - You have experience with modern backend and frontend
    technologies; familiarity with React, TypeScript, Node.js,
    Go, FastAPI, Next.js, Kestrel, or gRPC is relevant to this
    role.
  - You’re familiar with generative AI frameworks and APIs, such
    as LangChain, LangGraph, OpenAI, or Glean, and how they
    can be applied in products.
  - You’re motivated by building user-facing tools that improve
    business productivity and employee experience.

  Preferred Skills

  - Experience shipping production-grade AI, ML, or LLM-based
    applications at scale.
  - Experience developing AI-powered or agentic applications
    integrated with enterprise data.
  - Familiarity with machine learning and data engineering
    platforms such as Ray, Kafka, or Spark.
  - Experience with iPaaS platforms such as Workato or Boomi.
  - Exposure to Finance, Supply Chain, or other operational
    domains where intelligent automation can drive efficiency.
  - Experience with AI-assisted development tools such as
    Cursor, Claude, or ChatGPT Codex.
  - A collaborative approach and an eye for user experience and
    long-term system maintainability.

  Wondering if you’re a good fit? We believe in investing in
  our people and value candidates who bring unique
  backgrounds—even if you don’t check every box. Here are a
  few qualities we’ve found make someone successful on our
  team. If some of this describes you, we’d love to talk.

  - You’re curious about how AI and software can make everyday
    work simpler and more effective.
  - You enjoy turning complex business needs into clear,
    approachable experiences.
  - You communicate well with both technical and non-technical
    partners and like building solutions together.
  - You balance moving quickly with building systems that are
    secure, maintainable, and dependable.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast! We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we get
  set for takeoff, the growth opportunities within the
  organization are constantly expanding. You will be
  surrounded by some of the best talent in the industry, who
  will want to learn from you, too. Come join us!

  The base salary range for this role is $153,000 to $204,000.
  The starting salary will be determined by job-related
  knowledge, skills, experience, and the market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  The range we’ve posted represents the typical compensation
  range for this role. To determine actual compensation, we
  review the market rate for each candidate which can include
  a variety of factors. These include qualifications,
  experience, interview performance, and location.

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

