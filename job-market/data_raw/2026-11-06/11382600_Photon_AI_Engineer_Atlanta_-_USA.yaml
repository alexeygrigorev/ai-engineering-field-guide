description: |
  AI Engineer

  Required Qualifications

  - 8+ years of software engineering experience, including
    strong hands-on development in JavaScript/TypeScript, with
    recent experience building, enhancing, and supporting
    Generative AI/LLM-based applications in production
    environments.
  - Experience developing, enhancing, and supporting production-
    grade enterprise applications or platforms.
  - Hands-on experience building Generative AI / LLM-based
    applications and capabilities.
  - Experience integrating applications with Large Language
    Models (LLMs), AI services, and enterprise APIs.
  - Understanding of key GenAI concepts including:
    - Prompt engineering
    - Retrieval-Augmented Generation (RAG)
    - AI agents and agentic workflows
    - Tool/function calling
    - Context and conversation management
    - Model evaluation and monitoring
  - Experience building and consuming REST APIs and integrating
    with enterprise systems and data sources.
  - Ability to troubleshoot complex production issues across
    application, integration, AI/model, and platform layers.
  - Experience with modern software engineering practices
    including source control, automated testing, CI/CD,
    monitoring, and production deployments.
  - Understanding of security, authentication, authorization,
    data privacy, and responsible AI considerations for
    enterprise AI applications.

  Preferred Qualifications

  - Experience working on an enterprise AI platform or shared
    GenAI platform.
  - Experience developing AI applications using
    JavaScript/TypeScript-based frameworks and SDKs.
  - Experience building or supporting AI agents and multi-step
    AI workflows.
  - Experience with RAG, embeddings, semantic search, or
    enterprise knowledge retrieval.
  - Familiarity with AI observability, model evaluation,
    prompt/version management, usage monitoring, and cost
    optimization.
  - Experience integrating AI capabilities with multiple
    enterprise applications and APIs.
  - Familiarity with cloud-based AI services and foundation
    models.
  - Experience supporting business-critical applications in a
    production environment.

  Core Skills

  JavaScript / TypeScript | Generative AI | LLM Integration |
  AI Agents | RAG | API Development & Integration | Prompt
  Engineering | Production Support | AI Observability |
  Enterprise Application Development

  Compensation, Benefits and Duration

  Minimum Compensation: USD 50,000 Maximum Compensation: USD
  175,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
