description: |
  About Testsigma

  Testsigma is an AI-native quality intelligence platform
  built for AI-first engineering teams. Our agentic AI

  coworkers autonomously write, run, heal and analyse tests
  across web, mobile, API and enterprise

  applications, so quality keeps pace with rapid release
  cycles.

  Global enterprises including DHL, IndusInd Bank and NTUC
  trust Testsigma, and more than 50 million

  test cases have been authored on our platform.

  In G2's Fall 2026 Reports, Testsigma was recognised as a
  Leader, Momentum Leader and High

  Performer across AI Software Testing Tools, Test Management,
  Automation Testing, Software Testing

  and DevOps. G2 also named us one of the Top 50 Best Software
  Companies in India for 2026, selected

  from more than 3,000 companies.

  Join us to shape how software gets tested in the AI era.

  About the Role

  We are looking for a hands-on Senior AI QA Engineer with a
  strong foundation in AI, functional and API

  testing experience, good programming skills, and a keen
  interest in leveraging AI to improve software

  quality and testing efficiency. You will test the way our
  customers work, validating the product against

  real customer workflows and customer-centric data.

  Key Responsibilities & Skills

  • Strong experience in Functional Testing, API Testing, and
  end-to-end testing.

  • Hands-on experience leveraging AI tools such as Claude and
  LLMs for test case generation, test

  automation, and improving QA processes.

  • Automation experience using Playwright with TypeScript or
  Python.

  • Strong programming and problem-solving skills.

  • Complete ownership of feature testing, defect management,
  and release activities.

  • Ability to understand requirements, identify gaps, and
  ensure comprehensive test coverage.

  • Good experience in testing customer-centric data and
  workflows.

  • Good communication skills and the ability to collaborate
  effectively with cross-functional teams.

  • Prior experience in a customer-facing role is strongly
  preferred

  Good to Have

  • Performance testing experience.

  • Experience with low-code/no-code automation platforms.

  • Experience in the technology/SaaS domain.

  What We Are Looking For

  A proactive QA engineer who combines strong testing
  fundamentals, programming expertise, AI-driven

  testing capabilities and a customer-centric approach to
  quality, with the ability to independently own

  quality across features and releases.

  Prior experience in a customer-facing role is strongly
  preferred

  WHAT WE OFFER

  - 100% company-paid medical insurance
  - Daily catered lunch and free snacks
  - Flat hierarchy — direct access to founders and leadership
  - Flexible working hours
