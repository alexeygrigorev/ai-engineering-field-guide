description: |
  London (Hackney, E2) · Hybrid, at least 3 days a week in the
  office

  About Geomiq

  Geomiq is a digital manufacturing platform. Engineers upload
  a CAD file, configure their parts, get a quote and order:
  CNC machining, injection moulding, sheet metal and 3D
  printing. Behind that sits a global supplier network and our
  own teams in London, China, India and Portugal, covering
  quoting, quality and logistics. We work with brands
  including BMW, Rolls-Royce, Brompton Bicycle and Google.

  We're building the execution layer for distributed
  manufacturing. Demand isn't the hard part. Turning thousands
  of quotes a month into orders, repeat customers and
  suppliers who deliver is.

  The role

  This isn't a RevOps job. We don't need another dashboard.

  This is a role for someone who wants to run a business
  within a business.

  Every day, customers upload parts, get quotes, change their
  minds, order or go quiet. Suppliers quote, win, deliver or
  slip. Some problems are obvious: a key supplier's lead
  times, a step on the website that loses people, a customer
  who left for a reason sales already know. Others only show
  up when someone is looking closely. Your job is to find
  both, work out why they happen, and remove them.

  The fix might be an AI agent, an automation, a change to a
  page, a new step in a workflow, or a change to how sales or
  suppliers work. Data, AI and automation are your tools. The
  outcome is fewer lost customers, less friction and more
  orders.

  What you'll do

  - Spend your first weeks with sales, supply chain and our
    hubs, and in our CRM and platform data, mapping where
    customers and suppliers get stuck.
  - Keep a live list of the biggest friction points and reasons
    customers leave, ranked by what they cost us.
  - Find the cause of each, then fix it yourself or own the fix
    with the team that has to make it.
  - Build AI agents and automations (Claude, n8n, light
    scripting) that remove slow, manual or error-prone work.
  - Work across sales, supply chain, quality and product, and
    follow each problem through until it's gone.
  - Spot opportunities the data alone won't show, and bring them
    to the CEO with a case.
  - Measure what changed after every fix, and be honest when
    something didn't work.

  What we're looking for

  - A rare mix: you genuinely enjoy getting deep into AI tools
    and automation, and you care about winning commercially.
    For you, the tech isn't the reward; the result is.
  - Hands-on with AI: you've built agents, automations or tools
    with Claude, ChatGPT, n8n or similar, not just used them.
  - Comfortable with data: SQL, Python or enough to get answers
    from raw data yourself.
  - A record of owning outcomes, not just analysis: you've been
    on the hook for decisions with numbers attached, in a role
    such as buying, merchandising, forecasting, operations or
    commercial.
  - Evidence that you found a problem nobody had spotted and
    fixed it. Tell us what it was, what you did and what
    changed.
  - A quantitative degree (physics, maths, engineering or
    similar), or equivalent proof of how you think.
  - You've stayed in roles long enough to live with the results
    of your decisions.

  Nice to have

  - B2B, marketplace, procurement or logistics experience
    (strongly preferred).
  - Experience in a business that grew quickly while you were
    there.
  - Manufacturing, engineering or industrial exposure.
  - Experience with HubSpot or Metabase.

  Practical requirements

  - You must have the right to work in the UK. We can't offer
    visa sponsorship.
  - You must live in the UK, within commuting distance of our
    Hackney office (E2 9DQ).
  - At least 3 days a week in the office, ideally Monday,
    Wednesday and Friday, when most of the team is in.

  Benefits

  - Competitive salary.
  - 23 days' annual leave plus bank holidays, and an extra day
    off for your birthday.
  - Stocked kitchen, pet-friendly office and regular team
    events.
  - Career development and internal progression.
  - Cycle to Work scheme.
