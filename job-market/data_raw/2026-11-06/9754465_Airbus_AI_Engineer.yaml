description: |
  Job Description:

  Ready to revolutionize intelligent automation and
  operational efficiency at Airbus?

  We're seeking an innovative AI Agent Designer to join our
  high-impact Methods and Tools team. You'll be the crucial
  link, translating intricate business logic and engineering
  workflows into autonomous, high-performing AI agents and
  multi-agent systems on our cutting-edge, Engineering
  Knowledge Framework [EKF] AI platform.

  This isn't just about prompt engineering; it's about shaping
  the future of digital continuity and AI augmented Aircraft
  Engineering across Airbus. You'll dive deep into dynamic
  data integration, retrieval-augmented generation (RAG), and
  agentic workflows—turning complex engineering requirements
  into seamless, secure, and compliant AI solutions.

  If you're a proactive leader, eager to drive AI innovation
  from concept to deployment in a large, complex engineering
  ecosystem, this is your opportunity to shine! Key
  Responsibilities:

  - Agent Architecture & Analysis: Understand complex business
    and engineering workflows, identify augmentation
    opportunities, and document detailed functional
    requirements for AI agent personas, tools, and guardrails.
  - Feasibility & Risk Assessment: Proactively evaluate AI
    automation suitability for use cases. Analyze engineering
    requirements to determine appropriateness, identifying
    potential failure modes, data gaps, or regulatory risks
    before development.
  - Hands-on Agent Configuration: Directly design, configure,
    and fine-tune AI agents, prompting strategies, agent body
    of knowledge (databases and graphs) within our internal
    EKF platform.
  - Stakeholder Engagement: Act as the primary liaison between
    engineering business teams and core EKF development teams,
    managing expectations and ensuring alignment on agent
    capabilities and limitations.
  - Agile Execution: Collaborate closely with EKF development
    teams to refine, clarify, and prioritize user stories for
    EKF capabilities, agent tools, APIs, and data pipelines.
  - Testing & Evaluation: Develop test plans specifically for AI
    behavior (including accuracy, hallucination mitigation,
    and regression testing), lead User Acceptance Testing
    (UAT), and ensure agents meet rigorous quality and safety
    standards.
  - Documentation & Governance: Create comprehensive
    documentation (agent specifications, prompt catalogs,
    configuration guides) and train end-users on interacting
    with and auditing AI agents.
  - Continuous Optimization: Monitor agent performance in
    production, analyze user feedback loops, and iteratively
    improve agent reasoning, context retrieval, and
    efficiency.

  Experience: 5+ years of progressive experience as a Business
  Analyst, Systems Designer, or Solution Architect, with a
  minimum of 2 years explicitly focused on designing decision
  support systems, AI agents, or advanced LLM implementations.

  Experience in the aerospace engineering field would be a
  plus.

  Required Skills

  - Proprietary Tool Mastery: The ability to quickly learn and
    master internal, proprietary agent-building platforms and
    orchestration frameworks with provided training.
  - AI & Data Literacy: Strong understanding of LLM
    capabilities, agentic design patterns (e.g., reflection,
    planning, tool-use), RAG patterns, semantic data handling
    and LLM as judge.
  - Integration Skills: Solid understanding of databases,
    knowledge graphs, vector embeddings, and API integrations
    required to grant agents access to external tools.
  - Core Business Analysis: Excellent requirements elicitation,
    analysis, and documentation skills (use cases, user
    stories, interaction diagrams, and process flows).
  - Pragmatic Problem-Solving: Proven ability to balance
    technical ideals with operational reality. You prioritize
    reliability, maintainability, and data quality over
    theoretical AI performance, ensuring agents deliver
    measurable business value in constrained environments.
  - Communication & Alignment: Outstanding communication,
    presentation, and interpersonal skills; proven ability to
    translate complex business logic into AI instructions and
    constraints.,
  - Agile Expertise: Well-experienced in Agile/SAFe
    methodologies and modern project management tools
    (VersionOne, ALM, Jira, Confluence, etc.).
  - Leadership & Autonomy: Autonomous with strong leadership and
    influence skills to drive collaboration across interfacing
    technical and Airbus engineering business teams in a fast-
    paced environment.

  This job requires an awareness of any potential compliance
  risks and a commitment to act with integrity, as the
  foundation for the Company’s success, reputation and
  sustainable growth.

