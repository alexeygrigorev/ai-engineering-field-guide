  About the Role:

  CrowdStrike Falcon Host is a two-component security product.
  One component is a “sensor”: a driver installed on client
  machines that observes system activity and recognizes
  malicious behavior, then provides on-box prevention
  capability and remote telemetry to the Falcon Host cloud.
  The sensor processes thousands of events per second to
  provide deep visibility into operations on the endpoint, and
  performs rich correlation and computation to identify
  malicious events and blocks malicious activity.

  The cloud component aggregates sensor telemetry for each
  customer’s network, correlates malicious behavior across
  multiple machines, and presents our customers’ operations
  teams with a prioritized summary of the threats detected in
  their environments.

  This is a Sr. Software Development Engineer II (SDE) role in
  the CTIO team that is bringing multiple AI-based strategies
  together into an integrated capability on our next-
  generation sensor (lightweight agent) across macOS, Linux,
  and Windows platforms. The Sr. SDEs in the team own the
  design and development of the features that put AI on the
  endpoint: operationalizing machine learning models inside
  the sensor, building the data pipelines that collect,
  transform and deliver sensor telemetry for model training,
  evaluation and on-device inference, and integrating those
  capabilities with the core sensor features. Features will
  cross-cut most core OS subsystems such as file system,
  memory, process, and networking, and many are built with
  shared components across platforms. The team operates under
  the Agile development principles and ships frequently.

  The CTIO team at CrowdStrike is responsible for defining and
  executing the company's technology vision and strategy,
  driving innovation and overseeing the development and
  evolution of the Falcon platform. The CTIO ensures
  CrowdStrike maintains its position as a technology leader by
  fostering engineering excellence, aligning technical
  capabilities with business objectives, and anticipating
  emerging threats and market trends.

  What You’ll Do:

  - Collaborate with all the sensor development teams, across
    the company, on architecture and strategic initiatives.
  - Conceptualize and develop new product features.
  - Provide guidance and support to development teams in
    designing and implementing software for cross-platform
    delivery (Windows, macOS, Linux).
  - Take ownership of features throughout the entire lifecycle,
    from initial design to final delivery, including
    presenting product demonstrations at the conclusion of
    each sprint.
  - Engage in cross-functional collaboration with teams situated
    in various locations.

  What You’ll Need:

  - Deep knowledge of C/C++; Swift experience required for
    macOS-focused candidates; Windows OS Kernel and Driver
    Development experience required for Windows-focused
    candidates.
  - Hands-on experience operationalizing machine learning models
    on the endpoint, including building the data pipelines
    that collect, transform and deliver sensor telemetry for
    model training, evaluation and on-device inference.
  - Extensive, fundamental understanding of internals for your
    primary platform (macOS, Linux, or Windows)
  - Proven experience in debugging memory corruption issues,
    process contentions, and system performance bottlenecks.
  - Demonstrated experience collaborating with teams to
    successfully deliver major features and releases.
  - Ability to lead, mentor, communicate, collaborate, and
    operate effectively within a geographically distributed
    team.

  Bonus Points:

  - Demonstrated strong background in developing scalable,
    light-weight, and highly performing systems
  - In-depth OS system expertise regarding core concepts and
    subsystems
  - Familiarity and experience utilizing Agile methodologies
  - Knowledge of security principles
  - Experience with eBPF

