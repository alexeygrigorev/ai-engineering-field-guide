description: |
  Why loveholidays?

  We’re on a mission to open the world to everyone, giving our
  customers unlimited choice, unmatched ease and unmissable
  value for their next getaway.

  Our trailblaze together culture is what drives our success,
  powered by our people and the way they work. Using
  progressive technology, we drive cutting-edge innovation and
  improve how our customers discover, book and experience
  their holidays. You’ll have the opportunity to accelerate
  your growth through meaningful challenges, new experiences
  and the freedom to shape your own path. You’ll create impact
  for our future by taking ownership, contributing to shared
  goals and helping shape what comes next, all as part of our
  enhanced international community of talented, collaborative
  and passionate teams.



  The difference you’ll make:

  You’ll sit in the Applied AI who are part of the wider AI
  Centre of Excellence reporting to the Lead Applied AI
  Engineer. You’ll work closely with our business verticals,
  engineering, security, vendors and business stakeholders to
  build, administer and improve the AI-enabled systems and
  SaaS platforms that support our customers and colleagues.

  Together, the Centre of Excellence teams builds and operates
  applied and agentic AI workflows, SaaS services,
  integrations and data pipelines to deliver the business
  objectives of the supported verticals. You’ll contribute to
  production services from day one, developing your skills
  while improving reliability, automation and operational
  outcomes.

  The team sits within Business IT & AI Operations, providing
  the technical expertise, governance and operational
  ownership that help loveholidays scale intelligent
  automation and well-run business systems safely and
  effectively.

  Your day-to-day:

  - Administer and continuously improve a rangeSaaS platforms
    and AI-enabled services, including configuration, access,
    environments, integrations and lifecycle management.
  - Build and maintain applied and agentic AI workflows and
    automation pipelines that connect models, tools, business
    data, APIs and SaaS systems.
  - Use Google ADK or similar frameworks to build, test and
    iterate on tool-using agents and AI-powered automations.
  - Monitor service health, usage, cost and performance; lead
    testing, evaluation and incident triage to improve
    reliability and prevent recurring issues.
  - Partner with product, engineering, security, vendors and
    business teams to translate needs into effective platform
    configurations, integrations and automations.
  - Document configurations, dependencies and runbooks, applying
    secure change-management, governance and operational
    practices.

  Your skillset:

  - SaaS Administration: Experience administering cloud-based
    business systems, including configuration, user access,
    environments, integrations, release management and vendor
    support.
  - Applied AI & Agentic Workflows: Experience building agentic
    workflows that combine models, tools and business data,
    including orchestration, retrieval-augmented generation
    and evaluation. Familiarity with Google ADK or similar
    frameworks is desirable.
  - API & Data Integration: Strong knowledge of REST APIs,
    webhooks and event-driven or scheduled pipelines for
    connecting SaaS platforms, AI services and backend
    systems.
  - Familiarity with cloud environments, preferably Google Cloud
    Platform, CI/CD, observability, incident management and
    secure operational practices.

  The interview journey:

  - Intro with a member of the Talent Acquisition team - 30 mins
  - 1st stage video interview with Lead Applied AI Engineer - 1
    hour
  - Applied AI and SaaS administration task
  - Final stage with Director of Applied AI and senior
    stakeholders - 1 hour

  Perks of joining us:

  - Company pension contributions at 5%
  - Individualised training budget for you to learn on the job
    and level yourself up
  - Discounted holidays for you, your family and friends
  - 25 days of holidays per annum (plus 8 public holidays)
    increases by 1 day for every second year of service, up to
    a maximum 30 days per annum
  - Ability to buy and sell annual leave
  - Cycle to work scheme, season ticket loan and eye care
    vouchers

  Our commitment to inclusion:

  At loveholidays, we focus on creating an inclusive
  environment where everyone can contribute, grow and succeed.
  We value the different perspectives, experiences and ideas
  each person brings, because they help us work better
  together, challenge our thinking and make stronger
  decisions.

  As we continue to grow and evolve, we want everyone to feel
  supported and able to do their best work. We’re also
  committed to making our hiring process accessible, so please
  let our Talent Acquisition team know if you need any
  adjustments at any stage.
