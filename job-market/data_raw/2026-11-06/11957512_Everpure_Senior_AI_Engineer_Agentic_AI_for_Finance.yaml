description: |
  Everpure (NYSE: P) has evolved from storage pioneer to data
  platform, closing fiscal 2026 with $3.7 billion in revenue,
  its first billion-dollar quarter, and accelerating growth
  into FY27. Our strategic agenda spans the companies defining
  the next era of technology - hyperscalers, AI labs, the AI
  hardware supply chain, data platform providers, and the
  broader AI ecosystem.

  This type of work—work that changes the world—is what the
  tech industry was founded on. So, if you're ready to seize
  the endless opportunities and leave your mark, come join us.

  Senior AI Engineer, Agentic AI for Finance

  THE ROLE

  Join the AI Factory as a founding engineer driving the
  Office of the CFO's mission to transform Finance into an
  agile strategic advisor delivering enterprise-wide
  productivity and insight. In this high-impact technical
  contributor role, you will autonomously architect, build,
  and deploy production-grade multi-agent systems and
  foundational platform components. You will set technical
  direction for internal engineers and vendor partners,
  writing production code daily while maintaining rigorous
  alignment with the Everpure™ platform architecture.

  WHAT YOU'LL DO

  - Architect and deploy multi-agent workflows: Design, ship,
    and own end-to-end multi-agent systems using LangGraph and
    Amazon Bedrock AgentCore, ensuring financial calculations,
    business logic, and outputs remain fully deterministic,
    auditable, and production-ready.
  - Build enterprise tool integrations and secure data access:
    Create secure, least-privilege Model Context Protocol
    (MCP) tools across core systems (ERP, CRM, ticketing) and
    implement grounded retrieval architectures and read-only
    query layers on Snowflake to deliver trusted operational
    insights.
  - Deliver enterprise-grade user interfaces and approval
    portals: Develop performant Next.js portals,
    administrative consoles, and human-in-the-loop review
    interfaces to enable business teams to validate outputs
    and maintain strict governance seamlessly.
  - Implement robust AI guardrails, safety, and evaluation
    frameworks: Establish automated evals, shadow-mode
    validation pipelines, role-based access controls, audit
    logging, and prompt-injection defenses to safeguard
    regulated financial workflows before release.
  - Drive operational reliability and collaborative technical
    excellence: Monitor platform accuracy, drift, latency, and
    cost using observability tools like Datadog and Langfuse,
    while guiding vendor and in-house engineers through
    rigorous code reviews, architecture specs, and on-call
    ownership.

  WHAT YOU BRING

  - Production-proven agentic AI and distributed systems
    expertise: Deep hands-on experience designing, shipping,
    and running complex multi-agent architectures and LLM
    applications in production, with mastery of Python,
    TypeScript, SQL, LangGraph, and cloud ecosystems such as
    AWS (Bedrock, AgentCore, Lambda, ECS).
  - Enterprise data integration and architectural rigor:
    Demonstrated proficiency developing secure tools and APIs
    using Model Context Protocol (MCP), designing grounded
    retrieval/RAG pipelines over enterprise data platforms
    (such as Snowflake), and managing fine-grained
    authorization and data security.
  - Safety, governance, and evaluation ownership: Proven
    capability implementing enterprise security controls,
    comprehensive audit logging, human-in-the-loop
    verification, and continuous automated evaluation
    frameworks to manage latency, cost, and accuracy trade-
    offs.
  - Cross-functional leadership and technical communication:
    Demonstrated ability to translate complex financial and
    business processes into clear system specifications,
    evaluate technical trade-offs effectively, and guide
    cross-functional contributors through architectural
    reviews and mentorship.

  Workplace Model: We are primarily an in-office environment
  and therefore, you will be expected to work from the
  Bangalore office in compliance with Everpure’s policies,
  unless you are on PTO, or work travel, or other approved
  leave.

  WHAT YOU CAN EXPECT FROM US:

  - Innovation: We celebrate those who think critically, like a
    challenge, and aspire to be trailblazers.
  - Growth: We give you the space and support to grow along with
    us and to contribute to something meaningful. We have been
    named Fortune's Best Workplaces in Technology™, Fortune's
    Best Workplaces in the Bay Area™, and certified as a Great
    Place to Work®!
  - Team: We build each other up and set aside ego for the
    greater good.

  And because we understand the value of bringing your full
  and best self to work, we offer a variety of perks to manage
  a healthy balance, including flexible time off, wellness
  resources, and company-sponsored team events. Check out
  http://benefits.everpuredata.com/ for more information.

  ACCOMMODATIONS AND ACCESSIBILITY:

  Candidates with disabilities may request accommodations for
  all aspects of our hiring process. For more on this, contact
  us at TA-Ops@purestorage.com if you’re invited to an
  interview.

  OUR COMMITMENT TO A STRONG AND INCLUSIVE TEAM:

  We’re forging a future where everyone finds their rightful
  place and where every voice matters. Where uniqueness isn’t
  just accepted but embraced. That’s why we are committed to
  fostering the growth and development of every person,
  cultivating a sense of community through our Employee
