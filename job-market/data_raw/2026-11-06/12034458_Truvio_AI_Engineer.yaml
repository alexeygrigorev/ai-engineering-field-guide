description: |
  About the role

  You will turn real finance problems into AI features
  customers use every day. Working inside a product team, you
  will build agents that capture and code invoices, match
  payments, flag anomalies and prepare decisions for approval
  in Dynamics 365. You own the feature end to end:
  understanding the workflow, designing the agent, proving it
  with evals and running it in production.

  What you will do

  • Build agentic features for AP, AR and treasury on top of
  the Truvio AI platform, starting with TruvioSense and Trust
  & Control.

  • Design prompts, tools and multi-step workflows that act on
  ERP data reliably, with clear points for human review.

  • Create evaluation datasets with domain experts, including
  synthetic data, and use them to drive accuracy, cost and
  latency improvements.

  • Ship to production and stay close to outcomes: monitor
  quality, investigate failures and iterate with customer
  feedback.

  • Work directly with product managers, consultants and
  customers to understand how finance teams work today and
  where AI saves them time.

  • Feed what you learn back into the platform team so the
  next feature is faster to build.

  What you bring

  • 4+ years of software engineering, with at least 1 year
  shipping LLM-powered features to real users.

  • Strong Python and/or C#/.NET skills and good product
  judgment.

  • Experience with tool calling, structured outputs,
  retrieval and agent workflows, and an honest view of where
  they break.

  • A rigorous approach to evaluation: you do not ship on
  vibes.

  • Comfort working with messy business data, documents and
  APIs.

  • Curiosity about how businesses run, and the patience to
  learn a domain deeply.

  • Clear written English and the ability to explain AI trade-
  offs to non-engineers.

  Nice to have

  • Experience with Microsoft Dynamics 365 (Business Central
  or Finance & Operations) or another ERP.

  • Background in accounts payable, accounts receivable,
  invoice processing or finance operations.

  • Document AI, OCR or Azure AI Document Intelligence.

  • Experience fine-tuning or distilling models for cost and
  latency.

  Who you are

  You combine technical curiosity with a practical, customer-
  focused approach. You enjoy understanding how people work,
  solving complex problems and taking ownership from the first
  idea through to production. You build trust through clear
  communication, share what you learn and work closely with
  others to turn feedback into better solutions.

  Why Truvio

  At Truvio, you will join a global SaaS environment with a
  clear product focus and a strong connection to the Microsoft
  Dynamics ecosystem. This role gives you the opportunity to
  own AI features from understanding the finance workflow to
  running them in production. Working alongside product
  managers, consultants, customers and the platform team, you
  will turn technical innovation into meaningful customer
  value.

  What we offer and how to apply

  • Real AI in production for thousands of finance teams, not
  demos.

  • A small, senior AI group with direct access to the CTO and
  room to shape the platform from the start.

  • Remote-first work across Europe, with regular in-person
  time at our hubs.

  • Competitive salary, learning budget and modern tooling,
  including AI coding assistants.

  Other information

  Location: Remote, Europe (Nordic hubs or Vienna welcome)

  Level: Mid to senior individual contributor

  Employment: Permanent, 100 %

  Start: As soon as we find the right candidate

  About Truvio

  Truvio is a global software company delivering solutions for
  Microsoft Dynamics 365. We help organizations get more value
  from their business systems by bringing together finance,
  business operations and commerce. Truvio has approximately
  450 employees across North America, Europe, Asia and
  Australia.

  Our core values: Take Ownership, Build Trust, Drive
  Innovation and Succeed Together, guide how we work and help
  our customers get more from their ERP investments. Own your
  growth, shape your future with us.

  Ready to bring AI into everyday finance at Truvio? We’d love
  to hear from you.
