description: |
  Company Description

  Experian is a global data and technology company, powering
  opportunities for people and businesses around the world. We
  operate across a range of markets, from financial services
  to healthcare, automotive, agribusiness, insurance, and many
  more. Experian invests in people and new advanced
  technologies to unlock the power of data. We have an amazing
  team of 25,200 people in 32 countries.

  Job Description

  Experian Partner Solutions (EPS) is looking for Senior Web
  Engineers to build the products our partners white label as
  their own – embedded components that run inside partner
  applications, and turnkey hosted sites that carry a
  partner's brand. When a partner puts our software in front
  of their customers, our code runs under their brand, in
  their environment, with their reputation attached. There is
  no margin for "it works on my machine."

  We are looking for problem solvers first. We care much more
  about the depth and judgment you bring than about which
  specific frameworks you have used. Our stack is
  predominantly JavaScript and TypeScript across the browser
  and the server – React on the front end, Node in our
  services and tooling.

  We are building this team around AI-assisted development.
  That is not a perk in the job description – it is the
  operating model. You will spend a significant share of your
  time directing AI coding agents, reviewing what those agents
  produce, and being personally accountable for code you did
  not type character by character. If that sounds like a
  downgrade of the craft, this is the wrong role. If it sounds
  like the most leveraged version of the job you have ever
  had, keep reading.

  This is a senior individual contributor role. We are looking
  for someone with the architecture judgment to decide what to
  build, not just the speed to build it.

  - Own web software end-to-end – design, build, ship, and
    support it in production. Ownership does not stop at the
    merge.
  - Direct AI coding agents as your primary implementation
    method rather than hand-writing every line.
  - Decompose features into work an agent can execute reliably,
    and write the prompts and specs that make that possible.
  - Make the architecture calls AI cannot make for you:
    interface and API design, state and service boundaries,
    versioning, and backward compatibility for consumers who
    depend on your releases.
  - Design for environments you do not control, whether that is
    a hostile host page, an unfamiliar partner configuration,
    or an unexpected client of your API.
  - Use AI to generate test suites and regression coverage, then
    hunt what the generator missed: adversarial inputs,
    integration conflicts, and configuration edge cases.
  - Assess blast radius before you merge — in a multi-tenant
    product, a change that is wrong for one partner is often
    wrong for all of them.

  Agentic Responsibilities:

  - Fluent use of AI coding assistants – Claude Code, Copilot,
    Cursor, Kiro, or equivalent – as a primary development
    tool.
  - Ability to decompose a non-trivial feature into chunks an
    agent completes reliably.
  - A track record of catching real bugs, security issues, and
    bad architectural choices in AI-generated code.
  - Ability to explain what makes a prompt produce usable code
    rather than plausible-looking garbage.
  - Use of AI to generate tests, paired with a clear view of
    where those tests give false confidence.
  - Architecture and system-design judgment that weighs at least
    as heavily as tooling fluency.
  - Calibrated skepticism – you can name specific things AI is
    bad at in your domain.

  Qualifications

  - 6+ years building and shipping production web software, with
    real ownership of what you built after it went live.
  - Bachelor's degree in a relevant field or equivalent
    experience.
  - Strong JavaScript and TypeScript, applied across the browser
    and the server. We work primarily in React and Node; deep
    expertise in a comparable ecosystem plus evidence you pick
    up new stacks quickly is equally welcome.
  - Component libraries, design systems, or SDKs consumed by
    teams outside your own — where breaking changes carry real
    cost.
  - Server-side or full-stack web work — Node services, APIs,
    and the integrations that connect a customer-facing
    product to the systems behind it.
  - Practical web security awareness: injection and XSS vectors,
    authentication and session handling, dependency risk, and
    safe handling of sensitive data.
  - Experience with DevOps and CI/CD, automated test and build
    tooling.

  Additional Information

  Our uniqueness is that we celebrate yours. Experian's people
  first, inclusive and purpose driven culture is multi award-
  winning; World's Best Workplaces™ 2025 (Fortune Global Top
  25), Great Place To Work™ in 26 countries to name a few.
  Check out Experian Life on social or explore our Careers
  Site to understand why. Experian is also proud to be an
  Equal Opportunity and Affirmative Action employer. If you
  have a disability or special need that requires
  accommodation, please let us know at the earliest
  opportunity.

  Recruitment Fraud Awareness - Experian's recruitment process
  is conducted only through authorised channels. Recruitment
  communications will only be sent from an @experian.com email
  address. Experian will never ask candidates to make any
  payment as part of an application, interview, assessment,
  onboarding, or recruitment process. To apply for roles or
  verify opportunities, please visit experian.com/careers.

  Benefits and Perks:

  - Inclusive paid leave
  - People-first and inclusive workplace
  - Medical insurance

