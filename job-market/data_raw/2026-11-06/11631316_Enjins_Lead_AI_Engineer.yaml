description: |
  We are AI builders

  Since 2018, Enjins has done one thing: ship AI that works in
  production. From Utrecht and Berlin, we build machine
  learning systems, data infrastructure, and agentic AI layers
  for European tech companies, with a deliberate focus on
  climate and energy, where we believe the biggest
  technological shift of our generation should meet its most
  critical challenge.

  We embed directly with the engineering teams of high-growth
  scale-ups like Crisp, PlanBlue, NextSense, and Groendus. We
  take ownership of the full technical lifecycle: from first
  architecture decision to a production-grade system running
  inside our partner's infrastructure, long after go-live.

  The role

  As Lead AI Engineer, you are the technical owner of client
  engagements. You architect the solution, ship it to
  production, and make sure it still performs a year later.
  Alongside the other Leads, you shape the engineering team
  and the way we build.

  In practice:

  - Design AI roadmaps with client leadership and own them
    through to production
  - Create and implement the AI solution architectures to
    deliver on those roadmaps
  - Set and uphold Data Platform and MLOps standards across your
    client portfolio, so systems stay healthy after handover
  - Mentor engineers and weigh in on hiring, team growth, and
    accounts
  - Push our engineering practice forward, including how we use
    agentic coding workflows to build faster without
    compromising reliability. We test, document, and share
    what works, so the whole team levels up
  - Elevate our product mindset to ensure we build the right
    things, not just more things

  Why a Lead role here, not somewhere else

  You'll work across more stacks, clouds, and frontier
  frameworks in a year than most engineers see in five, with
  the collective knowledge of the whole team behind you, not
  the isolation of freelance work. And because our clients
  build grid software, energy forecasting, and climate
  infrastructure, you develop real domain expertise in energy
  and climate systems on top of production-grade AI
  engineering.

  In your first months you'll join a client project alongside
  an experienced Enjins engineer, supported by a dedicated
  coach. Within half a year, you own the technical roadmap of
  at least one engagement, mentor engineers, and have a
  recognised voice in our Asset strategy.

  Requirements

  What matters most: you think in systems, own outcomes end-
  to-end, and grow the people around you.

  - 5+ years building and scaling data & AI solutions in
    production environments
  - Strong software engineering fundamentals: you write
    production-grade code and know your way around
    infrastructure (Docker, Kubernetes, CI/CD, data pipelines)
  - Mastery of at least one major cloud platform (AWS, Azure,
    GCP) and experience leading MLOps/LLMOps architectures
  - Proven experience taking LLM-based or agentic systems to
    production
  - Experience mentoring engineers, overseeing delivery, and
    managing client accounts
  - You can translate technical complexity into clear decisions
    for non-technical stakeholders
  - Fluent in English and eligible to work in the Netherlands

  Benefits

  We publish our salary ranges and keep terms straightforward.
  No surprises.

  Compensation

  - €5,950 - €7,800 gross per month (excl. holiday allowance,
    pension, bonus, equity, and AI-Leap benefits)
  - Annual performance bonus of 1.5 months' salary
  - Equity participation (VSOP)

  Growth

  - AI-Leap: our structured development programme with a
    dedicated certification budget and a specialised track for
    Leads
  - 1-on-1 mentoring with our founders and external coaching to
    close your specific gaps

  Team & culture

  - Office on the Oudegracht in Utrecht (note: not yet fully
    accessible for individuals with physical disabilities);
    hybrid setup
  - 28 vacation days, flexible across 3 national holidays
  - Monthly team events and the annual two-day Enjins Summer
    Summit on AI × Climate
  - OV-First travel policy, fully covered; meat-free catering
  - Apple MacBook Pro and the tools you need
