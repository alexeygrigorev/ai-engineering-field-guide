description: |
  Traba is building the AI operating system for the industrial
  supply chain - the network of warehouses, manufacturers,
  logistics providers, and workers behind the physical goods
  people rely on every day.



  We started by tackling labor, supplying industrial
  businesses with consistent, reliable temporary workforces,
  and quickly became the fastest growing staffing company in
  America.



  Since then, we've expanded our suite of AI agents to help
  logistics providers, manufacturers, 3PLs, and other
  industrial businesses fully automate their manual workflows,
  derive insights from their data streams, and transform their
  decision intelligence.



  Our mission is to build a world where the global supply
  chain operates at peak efficiency.



  We’re proud to be backed by some of the world’s best
  investors, including Founders Fund, Khosla Ventures, and
  General Catalyst.



  You'll build Traba's product on top of AI agents—taking
  frontier models and existing agents and putting them to work
  across our staffing marketplace to automate the pipeline
  that sources, vets, matches, and places workers on millions
  of shifts. (Our AI Agents team builds the agent platform;
  you apply it everywhere it creates leverage.) This is a
  product-engineering role first, so you'll go where the
  priorities are—some quarters that's an agent that automates
  vetting or matching, others it's a payments flow or platform
  work. You'll partner with our CTO on architecture and
  roadmap, and build the platform the rest of the company runs
  on.



  About You:

  - An applier, not a researcher. You take frontier models and
    existing agents and wire them into real product across the
    stack—shipping reliable automation rather than owning the
    orchestration internals. And you don't need every task to
    be an AI task: you take the highest-priority problem,
    model or not.
  - Voracious learner. You move easily between API design, UX,
    and deployment infrastructure.
  - Proven full-stack builder. You have a track record of
    shipping scalable, performant applications from frontend
    interfaces to backend distributed systems.

  You Will:

  - Apply existing agents and frontier models across the
    stack—worker app, business app, ops platform,
    marketplace—to automate vetting, matching, and
    fulfillment.
  - Lead frontend and backend development, mentoring other
    engineers.
  - Architect and build core systems—real-time matching,
    autonomous vetting pipelines, distributed systems, and
    APIs.
  - Own product surfaces end to end, partnering closely with
    product and design.

  You Have:

  - 5+ years across frontend and backend: TypeScript,
    React/React Native, and Node.js or Python.
  - Strong with APIs, distributed systems, PostgreSQL, and
    messaging (Kafka or RabbitMQ).
  - Hands-on experience integrating LLMs or agents into real
    product—prompting, tool wiring, evals. You've shipped AI
    features, even if you didn't build the platform.
  - A track record of shipping scalable products in fast,
    ambiguous, early-stage environments.

  Benefits:

  - 📈 Start-up equity
  - 💰 Competitive Salary
  - 🩺 100% Paid health, dental & vision coverage
  - 🍽️ Dinner Provided via DoorDash, free DashPass & stocked
    kitchen for NY employees
  - 🚍 Commuter benefit
  - 🏋🏽 Gympass Benefit
  - ✚✚ Additional: One Medical Membership, Gympass, HSA via
    Optum, Talkspace, HealthAdvocate, Teledoc Health

  Salary Range Details

  The compensation range for this position is set between
  $200,000 and $240,000, reflecting our market analysis and
  other relevant considerations. However, exceptions may be
  made for candidates with qualifications that significantly
  differ from those outlined in the job description.



