title: AI Orchestration Engineer I - 1644
company: aKube Inc
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  Location Preference in Order: New York City, NY; Los
  Angeles, CA; San Francisco, CA; then Tempe, AZ

  Onsite/Hybrid/Remote: Hybrid. At least office 1 day a week
  onsite.

  Duration: Through June 2027, with potential extension or
  conversion

  Rate Range: $50–$65/hour on W2, based on experience. No
  benefits.

  Work Authorization: U.S. citizens, Green Card holders, and
  candidates with valid EADs. No H-1B, OPT, CPT, visa
  sponsorship, or visa-related documentation.

  Must Have:

  - Hands-on Python development
  - ITSM or internal IT workflow automation
  - JSON and API payloads
  - REST API integrations
  - OAuth, API keys, and authentication methods
  - SaaS workflow automation and orchestration
  - Experience building and supporting production workflows
  - Experience using AI coding or automation tools
  - Ability to read, debug, and improve AI-generated code
  - Logging, monitoring, retry logic, and exception handling

  Responsibilities:

  - Build net-new enterprise workflows using an AI automation
    platform.
  - Develop API-driven integrations across internal business
    systems.
  - Intake tickets to create, repair, and improve automation
    workflows.
  - Support ITSM processes such as incidents, requests,
    approvals, access, and routing.
  - Develop workflows involving HR, identity, access, and IT
    systems.
  - Write Python and JSON-based automation logic.
  - Review and improve code generated through AI development
    tools.
  - Troubleshoot APIs, authentication, payloads, and workflow
    failures.
  - Implement logging, monitoring, correlation IDs, retries, and
    error handling.
  - Meet with stakeholders to understand processes and identify
    automation opportunities.
  - Replace repetitive and ticket-based processes with automated
    workflows.
  - Build reusable workflow templates and technical
    documentation.
  - Support business users creating approved automations.
  - Follow security, governance, testing, and release standards.

  Qualifications:

  - Hands-on experience building workflow automations and SaaS
    integrations.
  - Experience supporting internal IT operations or ITSM
    environments.
  - Experience working with connected enterprise systems.
  - Ability to develop and troubleshoot solutions using an IDE.
  - Experience supporting production workflows in a large
    enterprise environment.
  - Ability to attend an approved office when required.

  Nice to Have:

  - Serval experience
  - Moveworks experience
  - ServiceNow workflow or API integration experience
  - Workday integration experience
  - Okta, identity, or access-management integration experience
  - AI help desk or automated ticket-resolution experience
  - RAG, MCP, or AI-agent orchestration experience
  - RPA or browser-based automation
  - Low-code or no-code automation platforms
  - Personal automation or AI development projects
