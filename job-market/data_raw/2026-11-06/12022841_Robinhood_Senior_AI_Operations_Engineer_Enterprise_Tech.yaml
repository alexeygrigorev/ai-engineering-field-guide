  Robinhood provides equal opportunity for all applicants,
  offers reasonable accommodations upon request, and complies
  with applicable equal employment and privacy laws. Inclusion
  is built into how we hire and work—welcoming different
  backgrounds, perspectives, and experiences so everyone can
  do their best. Please review the Privacy Policy for your
  country of application.
