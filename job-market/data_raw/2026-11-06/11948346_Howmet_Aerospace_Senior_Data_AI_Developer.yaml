  Our Story:

  Howmet Aerospace Inc. (NYSE: HWM), headquartered in
  Pittsburgh, Pennsylvania, is a leading global provider of
  advanced engineered solutions for the aerospace and
  transportation industries. Our primary businesses focus on
  jet engine components, aerospace fastening systems, titanium
  structural parts and forged wheels. With $8.3 Billion in
  revenue in 2025, our products play a crucial role in
  enabling fuel efficiency and lightweighting, contributing to
  our customers’ success and making a positive impact on the
  world. To learn more about the way Howmet Aerospace Inc. is
  advancing the sustainability of our customers, markets, and
  communities where we operate, review the 2025 Environmental
  Social and Governance report at www.howmet.com/esg-report.
