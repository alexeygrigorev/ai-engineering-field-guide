description: |
  At Woolpert, you’ll do work that matters.

  As a leading global architecture, engineering, and
  geospatial firm, we help clients solve complex challenges
  that shape communities, strengthen critical infrastructure,
  advance technology, and improve the world around us. Here,
  you’ll collaborate across disciplines, tackle meaningful
  projects, and build a career defined by growth, opportunity,
  and impact.

  Position Overview

  Woolpert is hiring a Cloud AI/ML Delivery Engineer to join
  our dynamic Cloud Solutions and Interdisciplinary Services
  (CSIS) team. This position reports to the Cloud Engineering
  Lead and is responsible for providing hands-on engineering
  and customer-facing project delivery, supporting the Digital
  Innovations market. The successful Cloud AI/ML Delivery
  Engineer will research and implement rapidly evolving Google
  AI/ML technologies (including Gemini Enterprise),
  frameworks, tools, and approaches. This position is client-
  facing and focused on successful project delivery, including
  providing technical leadership for your project team,
  collaborating during discovery activities, developing
  technical solutions, hands-on delivery, testing, and user
  training.

  Please note this is a Hybrid job.  We are looking for a
  candidate willing to work in one of our many US-based
  offices and have the flexibility to work for home as well

  We are unable to provide visa sponsorship for this position.
  Applicants must already possess work authorization in the
  country the job is located.

  What You Will Do:

  - Key member of the engineering team, working with client
    engineering teams, product owners, solutions architects,
    back-end/front-end developers to drive successful project
    delivery for our clients and solutions.
  - Perform client and project discovery activities to
    understand business and technical requirements, success
    metrics, and solution architecture.
  - Act as a trusted advisor to clients, understanding their
    business challenges and translating them into actionable,
    high-impact AI/ML solutions.
  - Develop clear, compelling AI/ML roadmaps and strategies that
    align with client goals and maximize the use of Google
    Cloud's AI and data capabilities.
  - Design and implement end-to-end AI/ML solutions on Google
    Cloud Platform, including data ingestion, feature
    engineering, model training, deployment, and monitoring.
  - Work closely with cross functional team members to drive
    successful delivery of client projects as well as
    establish repeatable processes and best practices in a
    professional services organization.

  What You Will Bring:

  - 8+ years of experience in customer facing consulting role.
  - Proven experience with AI/ML technologies and applications.
  - Proven experience in utilizing the Gemini family of models,
    spanning from integration and customization of Gemini
    Enterprise solutions to hands-on development and fine-
    tuning of custom Gemini models.
  - Hands-on experience with core GCP services relevant to
    AI/ML, such as Vertex AI, TensorFlow, BigQuery, Cloud
    Storage, and Dataflow.
  - Demonstrated proficiency in at least one programming
    language or scripting language (Python, NodeJS/ES6, etc)
    and associated AI/ML libraries and frameworks.
  - Solid understanding of SDLC and Agile software development
    methodologies and tools related to team software
    development (e.g. Git, Jira, etc.).
  - Strong communication and collaboration skills, with the
    ability to articulate complex technical concepts to both
    technical and non-technical audiences.

  Preferred Qualifications:

  - Hands on experience with Google Cloud Services such as
    Vertex AI, TensorFlow, BigQuery, Cloud Storage, and
    Dataflow.
  - Google Cloud Platform professional certifications
  - Professional services experience, designing and delivering
    large enterprise solutions
  - Knowledge of security and IAM tools and principles

  About Woolpert CSIS:

  The Cloud Solutions and Interdisciplinary Services (CSIS)
  team is part of Woolpert’s Geospatial sector. We are an
  industry leading development organization delivering SaaS
  solutions and professional services. Our customers span both
  the public and private sectors and range from startups to
  fortune 300 companies. Born out of Woolpert’s award-winning
  Digital Innovations team, we deliver advanced geospatial and
  cloud native solutions.

  Benefits You Will Love

  Certified as a Great Place to Work, Woolpert is one of the
  fastest-growing architecture, engineering, and geospatial
  companies in the world. With over 75 offices and countless
  projects around the globe, you’ll work on meaningful
  assignments that improve quality of life around the world.
  In addition to offering competitive pay, we provide
  employees with a robust set of unique benefits, including:

  - Freedom to Work program: Set your own schedule and location
    (as appropriate).
  - Principal program: Earn the opportunity to become an owner
    of the firm.
  - Flexible paid time off/vacation: Take time off when it makes
    sense for you and your team.
  - Career development: Explore a wide range of learning and
    growth opportunities within and across industries.
  - Health, life, vision, and dental insurance: Cover all your
    medical bases.
  - Paid sick time, retirement plan, fitness reimbursement, pet
    insurance, identity protection, technology stipend,
    employee assistance program, and more!

  Base pay offered may vary depending on job-related
  knowledge, skills, and experience.

  Pay Range

  $118,200—$147,800 USD

