description: |
  Company Description

  Are you ready to join the forefront of technology innovation
  with Netcompany?

  As one of the fastest growing technology companies, we are
  disrupting the marketplace and revolutionizing the way
  businesses operate. Our vision is to be the leading digital
  challenger in Europe whilst evolving the next generation of
  IT consulting.

  Operating across both public and private sectors, we offer a
  comprehensive range of services from application development
  and seamless cloud migration to program delivery and service
  operations, our offerings are designed to meet diverse
  business needs

  Job Description

  As a Senior AI Engineer, you will play a key role in
  building, deploying, and maintaining machine learning and AI
  solutions that solve real business problems for our clients.
  Working alongside senior data scientists, engineers, and
  consultants, you will contribute to solutions across the
  full development lifecycle, from data preparation and model
  development through to production deployment and monitoring.

  - Solution Development: Support the design and implementation
    of data science and AI solutions, translating defined
    requirements into working technical components.

  - Modelling & Analysis: Apply established data science and
    machine learning techniques to analyse data and solve
    business problems under the guidance of senior team
    members.

  - Production & MLOps: Build, test, and help deploy machine
    learning models into production environments. Contribute
    to the design and maintenance of MLOps pipelines to ensure
    solutions are scalable and maintainable.

  - Stakeholder Collaboration: Work with clients and internal
    teams to understand requirements and communicate technical
    findings clearly to both technical and non-technical
    audiences.

  - Ethical AI & Governance: Apply responsible AI principles and
    support adherence to governance and compliance standards
    in AI/ML development.

  - Mentorship & Knowledge Sharing: Mentor and guide junior data
    scientists and engineers, fostering a culture of technical
    excellence.

  Qualifications

  - Must be eligible for Security Clearance
  - Proficiency in Python and C#. SQL or R is a plus.
  - Experience with Cloud AI services such as Azure ML, AWS
    SageMaker, GCP Vertex AI.
  - Hands-on experience with machine learning libraries such as
    scikit-learn, TensorFlow, or PyTorch.
  - Practical knowledge of algorithms and techniques such as
    regression, decision trees, random forest, XGBoost,
    k-means, anomaly detection, and time series forecasting.
  - Working understanding of model evaluation and explainability
    concepts, e.g. overfitting, bias, cross-validation.
  - Experience developing and implementing end to end
    observability and monitoring for AI.
  - Experience working with large, complex, or messy datasets.

  Knowledge of Public Sector:

  - Understanding of the challenges and opportunities facing
    public sector organisations.
  - Experience working with public sector data.
  - Knowledge of public sector regulations and compliance
    requirements.

  Desired Skills: 

  - Excellent analytical and problem-solving skills.
  - Strong communication and interpersonal skills.
  - Ability to work independently and as part of a team.
  - Commitment to continuous learning and development.

  Additional Information

  Benefits:

  - Hybrid working model with some flexible working
  - 25 days’ holiday
  - Private Medical Health care via Vitality
  - Pension contribution, Life Assurance
  - Professional certifications supported as part of learning
    and development.
  - A range of retail discounts to enhance your lifestyle,
    encompassing restaurants, supermarkets, travel, leisure
    activities and health and well-being services.
  - Access to our Employee Resource Groups, our groups represent
    diverse backgrounds and provide a platform for colleagues
    to connect, learn, and support one another.

