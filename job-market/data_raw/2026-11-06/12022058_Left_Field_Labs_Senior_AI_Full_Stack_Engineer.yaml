  Compensation

  Compensation

  The salary range for this role is $130,000 to $175,000 and
  applies only to jobs performed in Culver City, California.
  This range represents the lowest to highest salary we
  reasonably and in good faith believe we would pay for this
  role at the time of this posting. Please note that we may
  ultimately pay more or less than the posted range, and the
  range may be modified in the future. An employee’s position
  within the salary range will be based on several factors,
  including but not limited to relevant education,
  qualifications, certifications, experience, skills,
  geographic location, performance, and business or
  organizational needs.
