  knit team, and will be responsible for building software and
  AI tools to facilitate research in fault-tolerant quantum
  computing architectures. Prior knowledge of quantum
  computing is not required. We are hiring at all experience
  levels.

  Requirements:

  - Wants to build a quantum computer
  - Works well in a highly collaborative team environment

  Compensation:

  - $200,000-$350,000/year depending on experience
  - Benefits (health and dental coverage, 401K, unlimited PTO,
    paid family leave, visa sponsorship)
  - Equity

  Work location: Onsite in Pasadena, CA

  Oratomic is an equal opportunity employer. If you need a
  reasonable accommodation during the application process,
  contact info@oratomic.com.
