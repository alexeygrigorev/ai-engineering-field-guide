  Agentic AI Engineer

  Description -

  Job Summary This role is responsible for leading the design
  and execution of advanced AI solutions using ML and NLP,
  solving highly complex problems through experimental
  research and deep technical expertise. It involves
  architecting large-scale systems for language processing,
  optimizing predictive algorithms, mentoring senior
  researchers, and applying expert judgment to drive
  innovation with minimal oversight. Responsibilities

  • Solve highly complex problems using advanced AI
  technologies such as ML and NLP. • Conduct experimental
  research with extensive experience to identify
  groundbreaking solutions. • Apply deep expertise to resolve
  highly complex issues creatively and effectively. • Analyze
  situations or data requiring deep expertise and innovative
  solutions. • Lead and architect large-scale projects or
  processes with minimal oversight. • Develop and implement
  cutting-edge systems for language translation, sentiment
  analysis, and speech recognition. • Optimize and innovate
  algorithms for machine learning and predictive analytics. •
  Document and share research processes and findings across
  the organization. • Mentor and guide senior researchers on
  highly complex projects. •Exercise expert judgment in
  selecting methods, techniques, and evaluation criteria for
  obtaining results. Education & Experience Recommended • 10+
  year of experience • Bachelor’s degree in engineering,
  computer science, information technology or a related field.
  Preferred Certifications • N/A. Knowledge & Skills •
  Programming Languages • Python (Programming Language) •
  Machine Learning & Deep Learning • Natural Language
  Processing (NLP) • Data Engineering • MLOps • Cloud
  Platforms • Algorithm Design • Generative AI & LLMs • AI
  Ethics • Product Thinking • Collaboration & Communication •
  Analytical skills • AI agents - agentic systems •
  Statistical Modeling • Critical Thinking. Cross-Org Skills •
  Effective Communication • Results Orientation • Learning
  Agility • Digital Fluency • Customer Centricity Impact &
  Scope • Impacts large functions and leads large, cross-
  division functional teams or projects. Complexity • Provides
  highly innovative solutions to complex problems within
  established policy. Disclaimer • This job description
  describes the general nature and level of work performed in
  this role. It is not intended to be an exhaustive list of
  all duties, skills, responsibilities, knowledge, etc. These
  may be subject to change and additional functions may be
  assigned as needed by management.

