description: |
  Job Summary & Responsibilities

  Role Overview

  Location: Bangalore

  As a Senior R&D Engineer – AI Integration, you will design
  and integrate AI-enabled capabilities into complex
  semiconductor test systems. This senior role requires at
  least five years of professional software development
  experience, including extensive work with large and mature
  codebases.

  You should have a strong background in object-oriented
  programming with languages such as Java and C++, along with
  scripting experience in Python and Shell. A solid
  understanding of modern AI solutions and concepts -including
  LLMs, RAG, indexing, embeddings, and semantic search is
  essential.

  Key Responsibilities

  • Design, implement, test, and maintain production-quality
  software for complex systems • Analyze, debug, refactor, and
  extend large, mature codebases • Integrate AI components and
  services into existing Java- and C++-based systems • Define
  robust interfaces between existing platforms, AI services,
  and supporting tools • Develop automation, integration, and
  data-processing tools using Python and Shell • Collaborate
  with AI specialists, software architects, and product teams
  to translate requirements into scalable solutions • Evaluate
  AI integrations for correctness, performance, reliability,
  security, and maintainability • Apply software engineering
  best practices, including code reviews, automated testing,
  version control, and continuous integration • Provide
  technical guidance and lead integration projects • Work
  confidently in Linux-based development environments

  Preferred Qualifications

  • University degree in Computer Science, Electrical
  Engineering, Data Science, or a related field • At least
  five years of hands-on professional software development
  experience • Extensive experience developing and maintaining
  large, complex software systems and codebases • Strong
  programming skills in Java or C++ • Proficiency in Python
  and Shell scripting • Strong understanding of object-
  oriented programming, software architecture, design
  patterns, APIs, and system integration • Experience with
  Linux, Git, automated testing, build systems, and CI/CD
  workflows • General understanding of AI and LLM-based
  solutions, including RAG, indexing, embeddings, semantic
  search, and model APIs • Strong communication skills in
  English and the ability to document technical work clearly
  Preferred Qualifications • Experience with Advantest V93000
  test systems and SmarTest 8 • Experience with Eclipse-based
  development, Eclipse RCP, OSGi, plug-in development, or
  comparable modular application platforms • Experience
  integrating AI components into existing software platforms •
  Familiarity with Docker, MLOps, and cloud platforms such as
  AWS or Azure
