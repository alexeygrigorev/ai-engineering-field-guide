  About the Role:

  What You'll Build:

  - Production-grade agentic systems - multi-step, tool-using
    agents with orchestration, planning, memory and context
    management, and human-in-the-loop controls - for platform
    automation and internal engineering workflows.
  - A shared AI platform for product teams: reusable agent
    frameworks, tool and MCP integrations, an LLM gateway
    (routing, rate limiting, caching, fallbacks), and
    prompt/model versioning.Evaluation and observability for
    AI systems - eval harnesses, tracing of agent runs, and
    metrics for quality, latency, cost, and safety.
  - AI-driven engineering practices that improve developer
    velocity - agentic developer workflows, AI-assisted
    tooling, and automation of operational toil.
  - Cloud infrastructure for AI workloads across GCP/AWS,
    including provisioning, scaling, security, and cost
    governance for inference and token spend.

  What You'll Drive:

  What Success Looks Like:

  - Agentic systems run reliably in production at growing scale,
    with clear quality, latency, and safety targets that are
    tracked and met.
  - Agent changes ship with evals and observability in place, so
    regressions are caught before customers see them.
  - Product and platform teams adopt a shared AI platform and
    see it as a trusted, well-documented foundation to build
    on.
  - AI-related costs are optimized and predictable, with clear
    ownership of spend against usage.
  - The Platform Services team works AI-first, and engineering
    teams measurably gain velocity from AI-driven workflows
    and automation.
  - Engineers around you grow technically and recognize you as a
    go-to authority on agentic system design.

