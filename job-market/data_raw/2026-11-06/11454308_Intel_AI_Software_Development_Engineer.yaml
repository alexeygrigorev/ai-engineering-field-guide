description: |
  Job Details:

  Job Description: The Role and Impact  Seeking an experienced
  AI Platform Engineer with 5+ years of industry experience to
  design and build cloud-native and edge AI platforms.
  Responsibilities include developing AI deployment
  frameworks, model lifecycle management, containerized AI
  workloads, inference optimization, and platform services for
  scalable edge deployments. Strong hands-on experience with
  Python, AI/ML frameworks, Kubernetes, Docker, cloud
  platforms (Azure/AWS), MLOps, and distributed systems is
  required. Experience deploying AI solutions across cloud and
  edge environments is highly desirable. Business group Intel
  Corporation is a global leader in innovation, driving
  advancements across computing and AI technologies. As part
  of this business group, you will join a team focused on
  developing AI solutions that push the boundaries of
  performance, efficiency, and functionality. Together, we
  work to enable transformative solutions that support Intel's
  broader mission of creating world-changing technology. Key
  Responsibilities
  - Design, develop, and debug software to enable AI features
    across Intel's product portfolio.
  - Collaborate with internal and external partners to optimize
    AI solutions spanning firmware, drivers, OS, middleware,
    frameworks, algorithms, and applications.
  - Develop reference AI software and optimize customer designs
    to ensure maximum utilization of Intel AI products.
  - Improve AI workloads and benchmarks to support power and
    performance analyses and architecture recommendations.
  - Contribute to AI software development within the open-source
    community to drive adoption and innovation.

  Qualifications:Minimum Qualifications
  - Bachelor's degree in Computer Science, Electronic
    Engineering, Electrical Engineering, or a related field
    with 4+ years of experience in software development OR a
    Master's degree with 3+ years of experience OR a PhD with
    no prior professional experience. Requirements can be met
    through a combination of industry experience, internships,
    and academic projects.
  - Proficiency in Python and C++ programming.
  - Experience developing software for Linux environments,
    including multiple distributions (e.g., deb, RPM).
  - Demonstrated expertise in AI technologies, such as
    Generative AI, AI models, training, inference, and AI
    frameworks.
  - Familiarity with software development in open-source
    communities.
  Preferred Qualifications
  - Strong written and verbal communication skills.
  - Proven ability to collaborate effectively in
    multidisciplinary teams.
  - Experience with AI workload optimization for benchmarking
    and simulation.
  - A proactive mindset with a passion for innovation and
    problem-solving.
  We invite you to be part of a team shaping the future of
  Artificial Intelligence, where your expertise will drive
  meaningful advancements in technology and create
  opportunities for growth and impact.



  Job Type:Experienced Hire

  Shift:Shift 1 (India)

  Primary Location: India, Bangalore

