description: |
  About the company

  Our client is a software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and ship AI agent systems that run in production for
  real users, from model pipelines through backend services
  and user interfaces. Design shared agent frameworks,
  evaluation tools and orchestration layers that the wider
  engineering team relies on, and take full ownership of the
  modules you deliver.

  What you'll do

  - Build and release production AI agents that carry out multi-
    step business workflows.

  - Design agent frameworks, context handling, orchestration,
    evaluation and verification layers used across the
    engineering team.

  - Work directly with end customers to understand their
    processes and turn them into AI-based solutions.

  - Own features end to end, spanning the language model
    pipeline, infrastructure, backend services and user
    experience.

  - Contribute platform abstractions and shared systems that
    raise the output of the whole team.

  Requirements

  What we're looking for

  - 4 to 12 years of software engineering experience.

  - A computer science or mathematics degree from a highly
    ranked US university.

  - Two-plus years of hands-on work taking agent-based AI
    software from concept to live operation.

  - Proven background in server-side engineering, with a record
    of constructing core systems that handle heavy load at
    well-regarded firms.

  - Hands-on record of delivering language-model agents that
    include evaluation, context handling, orchestration and
    safety checks.

  - Comfortable using modern AI-assisted development tools in
    everyday work.

  - Strong communication skills for interactions with customers.

  Bonus points

  - Peer-reviewed publications in artificial intelligence or
    machine learning.

  - Experience at an early-stage startup.

  - Depth in large-scale distributed computing, data platforms
    or process orchestration software.

  - Comfort holding direct conversations with business users and
    senior leaders.

  Benefits

  Compensation and benefits

  - Base salary: USD 180,000 to 270,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - On-site

  - 5 days in-office per week

  - Full-time
