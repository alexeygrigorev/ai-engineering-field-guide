description: |
  What success looks like in this role:

  The Knowledge Manager is responsible for shaping how ECS
  captures, creates, organizes, validates, presents, and
  sustains knowledge.  The role combines knowledge and content
  strategy, information architecture, learning enablement,
  SharePoint fluency, and AI knowledge readiness.  The
  objective is not simply to administer repositories, but to
  make trusted knowledge easy for employees, clients, and AI
  solutions to understand, access, and use.

  This manager-level individual contributor will establish the
  frameworks and operating practices needed to turn fragmented
  documentation and institutional expertise into current,
  authoritative, audience-appropriate knowledge assets.  The
  role will support internal ECS needs and reusable approaches
  that may be applied to client knowledge-management
  engagements, support experiences, and AI knowledge
  assistants.

  The successful candidate will bring deep knowledge-
  management and content-creation expertise, strong
  information-organization instincts, and enough hands-on
  SharePoint experience to contribute immediately.  Experience
  in learning and development is important because ECS needs
  to effectively connect knowledge capture with training,
  upskilling, workshops, and knowledge transfer.  The role
  will work with technical teams on platform decisions, while
  retaining accountability for the knowledge framework,
  content quality, governance, and user experience.

  Key Responsibilities1. Knowledge Strategy, Architecture and
  Governance  |  30%

  ·       Design and maintain an ECS knowledge-management
  framework aligned to Endurance program principles, business
  priorities, and user needs.

  ·       Define repository hierarchies, taxonomies, metadata,
  naming and smart-titling conventions, content types, source-
  authority rules, and audience segmentation.

  ·       Establish governance for content creation, human
  validation, approval, publishing, access, periodic review,
  retention, archival, and disposition.

  ·       Clarify decision rights and responsibilities for
  content owners, authors, reviewers, approvers, repository
  managers, and technical platform teams.

  ·       Create scalable patterns that separate and
  appropriately connect shared Unisys knowledge, product-
  specific knowledge, client-owned content, and tailored
  client experiences.

  ·       Serve as a hands-on SharePoint practitioner for
  knowledge design, while partnering with platform specialists
  for complex administration, engineering, integration, and
  security decisions.

  2. Content Creation, Knowledge Capture and Curation  |  25%

  ·       Develop structured templates, toolkits, and guidance
  that enable subject matter experts and designated
  contributors to conduct interviews, workshops, documentation
  reviews, lessons learned, and knowledge-transfer sessions.

  ·       Create and maintain templates, editorial standards,
  and authoring guidance that help content owners develop
  consistent playbooks, guides, reference materials, standard
  operating procedures, training content, and other reusable
  knowledge artifacts.

  ·       Organize content so employees and clients can
  quickly understand it, navigate it, and apply it to their
  work.

  ·       Operate staged content workflows that support
  intake, assessment, cleanup, smart titling, tagging,
  categorization, validation, publishing, and maintenance.

  ·       Identify and remediate duplicate, obsolete,
  redundant, conflicting, orphaned, or poorly structured
  content.

  ·       Improve the quality and consistency of how ECS
  presents technical and business knowledge internally and to
  clients.

  3. AI Knowledge Readiness and Managed Knowledge Services  |
  25%

  ·       Prepare trusted knowledge sources for Microsoft
  Copilot, AI knowledge assistants, RAG solutions, intelligent
  search, and multi-agent experiences.

  ·       Establish AI-ready content standards covering
  structure, completeness, metadata, permissions, source
  authority, currency, validation, and intended audience.

  ·       Partner with AI, engineering, UX, platform,
  security, and services teams to translate knowledge
  requirements into feasible solution designs without owning
  technical architecture decisions outside the role.

  ·       Support knowledge assessments that determine whether
  source content is suitable for AI ingestion and identify
  cleanup or remediation required before implementation.

  ·       Design reusable managed-knowledge practices covering
  content creation, validation, governance, maintenance, and
  service metrics.

  ·       Create feedback loops that connect user experience
  and AI response quality to source-content remediation and
  knowledge-gap closure.

  4. Learning Enablement and Adoption  |  15%

  ·       Help apply learning-and-development principles to
  convert captured knowledge into role-based learning paths,
  workshops, job aids, and onboarding materials.

  ·       Partner with Endurance program leads, practice
  teams, and learning resources to support concurrent training
  and knowledge-transfer activities.

  ·       Build repeatable enablement patterns that can be
  piloted in one product or practice and adapted for
  subsequent areas.

  ·       Develop guidance and communications that help
  contributors create better content and help users find and
  apply authoritative knowledge.

  ·       Promote sustainable knowledge-sharing behaviors and
  support practices in taking operational ownership of their
  knowledge.

  5. Metrics, Reporting and Continuous Improvement  |  5%

  ·       Define indicators for content quality, validation
  status, freshness, coverage, discoverability, reuse,
  adoption, learning effectiveness, and AI readiness.

  ·       Provide concise reporting on repository health,
  knowledge gaps, governance compliance, risks, remediation
  priorities, and business outcomes.

  ·       Use analytics, search behavior, feedback, and AI-
  quality observations to maintain a prioritized improvement
  backlog.

  #LI-ND1

  You will be successful in this role if you have:

  Required Skills: ·       Bachelor's degree in Knowledge
  Management, Library or Information Science, Instructional
  Design, Information Systems, Communications, Business, or a
  related field.

  ·       Min 2 years of experience across knowledge
  management, content strategy, information architecture,
  content operations, organizational learning, or a related
  discipline.

  ·       Demonstrated ability to design taxonomies, metadata
  models, repository hierarchies, content standards, and
  lifecycle-governance practices.

  ·       Hands-on experience with SharePoint, including hubs,
  sites, libraries, content types, metadata, permissions,
  navigation, and search.

  ·       Experience capturing expert knowledge and converting
  it into accessible, reusable content for different
  audiences.

  ·       Experience leading cross-functional work with
  business, technical, learning, and governance stakeholders
  in a globally distributed environment.

  ·       Strong writing, editing, facilitation, synthesis,
  and visual-communication skills.

  ·       Demonstrated ability to operate as a hands-on
  manager-level individual contributor, set frameworks, and
  influence without direct authority.

  ·       Experience supporting Microsoft Copilot, AI
  knowledge assistants, enterprise search, agentic solutions,
  or RAG-based implementations.

  Preferred Qualifications

  ·       Background in learning and development,
  instructional design, curriculum development, technical
  training, or workforce enablement.

  ·       Familiarity with content ingestion, semantic
  retrieval, vector search, knowledge graphs, web crawling,
  automated tagging, or content-quality automation.

  ·       Experience assessing and organizing technical
  product, support, engineering, or client documentation.

  ·       Experience shaping managed knowledge services or
  professional-services offerings.

  ·       Relevant certification in knowledge management,
  library science, learning, SharePoint, Microsoft 365,
  records management, or information governance.

