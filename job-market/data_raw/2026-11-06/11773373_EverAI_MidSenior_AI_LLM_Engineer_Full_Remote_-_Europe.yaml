  Budget: Dedicated funds to support your professional growth:
  courses, books, conferences, events, or certifications 💻
  Company Laptop & Equipment: Laptop provided + monitor budget
  up to 250 USD + keyboard/mouse/mic/headphones budget up to
  150 USD ⚡ AI Tools Access: Premium access to ChatGPT,
  Hugging Face, Claude Code, and any other tool needed to
  excel at your job, power your ideas and workflows

  🎯 Top Tier Talent Is Our Multiplier

  We’re a fully remote group of A-players from Tier 1 tech,
  led by an exec team who’ve launched, scaled, and exited
  multiple companies. We move fast, and care deeply about what
