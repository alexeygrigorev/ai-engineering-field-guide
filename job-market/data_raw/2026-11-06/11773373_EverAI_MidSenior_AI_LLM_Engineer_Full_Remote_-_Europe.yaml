  🛡️ Ethical Core: Our AI ecosystem is governed by EverGuard,
  our proprietary AI moderation technology, ensuring
  responsible development at scale

  What We Offer

  ✍️ Contract Type: We prefer B2B, but we’re flexible, what
  matters is long-term commitment and impact 📍 Work From
  Anywhere: Fully remote. Choose the environment where you do
  your best work 🏝️ Paid Time Off: 4 weeks (20 working days)
  of PTO per year to recharge and reset 👨‍👩‍👧‍👦 Annual
  Gathering: A yearly in-person meetup to connect, brainstorm,
  and celebrate wins together ❤️‍🩹 Health & Wellness Support:
  Monthly allowance of 100 USD for health insurance expenses &
  access to unlimited 1:1 sessions with psychologists and
  lifestyle experts through OpenUp (also available to up to
  three of your family members) 🏢 Co-Working Space Budget:
  Work from a co-working space up to twice per month (35 EUR /
