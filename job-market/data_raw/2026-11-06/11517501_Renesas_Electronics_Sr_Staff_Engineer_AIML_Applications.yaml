description: |
  Company Description

  Renesas is one of the top global semiconductor companies in
  the world. We strive to develop a safer, healthier, greener,
  and smarter world, and our goal is to make every endpoint
  intelligent by offering product solutions in the automotive,
  industrial, infrastructure and IoT markets. Our robust
  product portfolio includes world leading MCUs, SoCs, Analog
  and power products, plus Winning Combination solutions that
  curate these complementary products. We are a key supplier
  to the world’s leading manufacturers of electronics you rely
  on every day; you may not see our products, but they are all
  around you.

  Renesas employs roughly 21,000 people in more than 30
  countries worldwide. As a global team, our employees
  actively embody the Renesas Culture, our guiding principles
  based on five key elements: Transparent, Agile, Global,
  Innovative, and Entrepreneurial. Renesas believes in, and
  has a commitment to, diversity and inclusion, with
  initiatives and a leadership team dedicated to its resources
  and values. At Renesas, we want to build a sustainable
  future where technology helps make our lives easier. Join us
  and build your future by being part of what’s next in
  electronics and the world.

  Job Description

  Job Summary

  Renesas is seeking a Sr Staff Engineer to build AI-powered
  engineering applications and data platforms that improve
  semiconductor development productivity, accelerate decision-
  making, and reduce engineering cycle time.

  The ideal candidate will lead the development of scalable
  full-stack solutions that transform engineering data into
  actionable insights through AI-driven workflows, analytics,
  and modern web applications. This role spans data
  engineering, backend services, AI integration, and React-
  based user experiences, enabling solutions such as
  engineering copilots, design exploration agents, workflow
  automation, and digital-thread platforms.



  Job Responsibilities

  - Lead development of AI-powered engineering applications and
    platforms.

  - Integrate LLMs, RAG systems, vector databases, and agent
    frameworks into production solutions.

  - Design and implement scalable data ingestion,
    transformation, and serving pipelines for engineering
    data.

  - Build backend services and APIs supporting AI agents,
    workflow orchestration, analytics, and decision-support
    systems.

  - Develop modern web applications using React.js and
    TypeScript.

  - Design data models connecting requirements, architecture,
    implementation, verification, and sign-off results into a
    unified engineering knowledge platform.

  - Build dashboards, analytics, and workflow automation
    solutions that improve engineering productivity and reduce
    cycle time.

  - Collaborate with Architecture, Design, Verification, and
    Product Engineering teams to identify and deliver high-
    impact AI solutions.

  - Drive technical direction, architecture reviews, and
    engineering best practices.

  - Mentor engineers and influence technology strategy across
    teams.

  Qualifications

  Qualifications

  - BS/MS in Computer Science, Electronics, AI/ML, or related
    field.

  - 10+ years of software engineering experience.

  - Experience developing AI-enabled applications using LLMs,
    RAG, vector databases, or agent-based architectures.

  - Strong experience in Data Engineering, including ETL
    pipelines, data modelling, data quality, and large-scale
    data processing using Azure Data Bricks.

  - Strong proficiency in Python and backend application
    development.

  - Hands-on experience with React.js, TypeScript, HTML, and
    modern web technologies.

  - Experience building REST APIs, microservices, and
    distributed systems.

  - Strong software design, problem-solving, and communication
    skills.

  - Demonstrated technical leadership and mentoring experience.

  Nice-to-Have

  - Experience with semiconductor design flows, EDA tools, or
    engineering productivity platforms.

  - Familiarity with physical design, verification, PPA
    analysis, or silicon development workflows.

  - Experience with graph databases, knowledge graphs, and
    engineering knowledge-management systems.

  - Experience with docker, cloud-native platforms, and workflow
    orchestration frameworks.

  Additional Information

  Renesas is an embedded semiconductor solution provider
  driven by its Purpose ‘To Make Our Lives Easier.’ As the
  industry’s leading expert in embedded processing with
  unmatched quality and system-level know-how, we have evolved
  to provide scalable and comprehensive semiconductor
  solutions for automotive, industrial, infrastructure, and
  IoT industries based on the broadest product portfolio,
  including High Performance Computing, Embedded Processing,
  Analog & Connectivity, and Power.

  With a diverse team of over 21,000 professionals in more
  than 30 countries, we continue to expand our boundaries to
  offer enhanced user experiences through digitalization and
  usher into a new era of innovation. We design and develop
  sustainable, power-efficient solutions today that help
  people and communities thrive tomorrow, ‘To Make Our Lives
  Easier.’

  At Renesas, you can:

  - Launch and advance your career in technical and business
    roles across four Product Groups and various corporate
    functions. You will have the opportunities to explore our
    hardware and software capabilities and try new things.

  - Make a real impact by developing innovative products and
    solutions to meet our global customers' evolving needs and
    help make people’s lives easier, safe and secure.

  - Maximize your performance and wellbeing in our flexible and
    inclusive work environment. Our people-first culture and
    global support system, including the remote work option
    and Employee Resource Groups, will help you excel from the
    first day.

  Are you ready to own your success and make your mark?

  Join Renesas. Let’s Shape the Future together.

