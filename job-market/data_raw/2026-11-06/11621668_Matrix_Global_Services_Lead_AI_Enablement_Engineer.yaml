description: |
  Description

  Senior AI Enablement Engineer

  We are seeking a hands-on Senior AI Enablement Engineer to
  make AI-assisted software delivery practical, repeatable,
  trustworthy, and directly tied to measurable engineering
  outcomes.

  The Role

  This is a hands-on individual contributor role embedded
  within the Platform Engineering team and working across all
  product engineering teams. You will partner closely with
  platform and engineering leaders to scale, improve, and
  standardize AI-assisted workflows throughout the software
  development lifecycle.

  You will help evolve AI usage from individual tooling and
  local experimentation into structured, validated, and
  eventually sandboxed agent-based workflows. You will also
  establish reusable patterns that enable both customer-facing
  AI capabilities and internal AI-powered employee tools.

  What You'll Do

  - Establish practical AI-first workflows for coding,
    debugging, testing, planning, design, documentation, code
    reviews, and production investigation.
  - Build reusable agent instructions, prompt frameworks,
    skills, repository context, integrations, and examples
    that engineering teams can apply immediately.
  - Partner with Platform Engineering to integrate AI workflows
    into CI/CD pipelines, testing, observability, release
    readiness, developer experience initiatives, and agent
    orchestration frameworks.
  - Design validation loops that verify AI-generated outputs
    through testing, quality controls, security reviews, and
    release processes.
  - Enable adoption through demonstrations, documentation,
    workshops, office hours, pairing sessions, and hands-on
    coaching.
  - Develop reusable patterns for AI-powered applications and
    internal solutions, including assistants, retrieval
    systems, workflow automation, governance models, and
    access controls.
  - Use productivity, adoption, quality, cost, and delivery
    metrics to prioritize investments and measure impact.

  What You'll Bring

  - 7+ years of software engineering experience preferred,
    though exceptional senior-level candidates will be
    considered.
  - Experience improving developer productivity, platform
    engineering, developer experience, internal tooling,
    engineering effectiveness, or AI enablement initiatives.
  - Deep hands-on experience applying AI tools to real-world
    engineering work, including AI coding assistants,
    autonomous agents, LLM APIs, agent workflows, or similar
    technologies.
  - Strong engineering fundamentals and experience creating
    reusable workflows, automations, integrations, reference
    implementations, evaluation patterns, and developer
    tooling.
  - Practical understanding of software planning,
    implementation, testing, deployment, code reviews,
    production operations, and documentation.
  - Strong judgment around AI quality, validation, security,
    privacy, governance, operational risk, and cost
    management.
  - Ability to drive change through coaching, documentation,
    workshops, office hours, mentoring, and enablement
    programs.
  - A pragmatic AI-first mindset focused on measurable business
    and engineering outcomes.

  Technology & Tools

  Strong candidates will have hands-on experience with several
  of the following:

  - AI coding assistants and agent-driven development tools.
  - Large language model platforms and APIs.
  - Agent frameworks, tool calling, orchestration, prompt
    engineering, reusable instructions, and workflow
    automation.
  - One or more modern programming languages such as Python,
    TypeScript, Go, C#, or .NET.
  - Retrieval-Augmented Generation (RAG), semantic search,
    embeddings, vector databases, and knowledge retrieval
    systems.
  - Git-based development, CI/CD pipelines, test automation,
    code review workflows, and developer productivity tooling.
  - Cloud platforms, containerized environments, and sandboxed
    execution environments.
  - Observability, monitoring, tracing, logging, evaluation
    frameworks, and cost management.
  - Security, privacy, governance, access controls, and
    auditability for AI-enabled systems.

  Nice to Have

  - Experience with sandboxed or cloud-based agent execution
    environments.
  - Parallel agent workflows and human-in-the-loop orchestration
    models.
  - AI-powered SaaS features, employee assistants, knowledge
    agents, or collaboration-platform integrations.
  - Legacy modernization initiatives within mature SaaS
    environments.
  - Experience in transactional industries such as payments,
    fintech, accounting, eCommerce, real estate technology, or
    similar domains.
  - Familiarity with compliance-focused development, regulated
    environments, and secure data access controls.

  What Success Looks Like

  - Engineering teams have clear, repeatable AI-enabled
    workflows for common development activities.
  - AI-assisted engineering delivers measurable improvements in
    speed, quality, developer experience, and release
    confidence.
  - AI workflows effectively leverage business context, product
    knowledge, engineering standards, and codebase
    understanding.
  - Engineers can orchestrate AI-supported work with robust
    testing, validation, review, and release-readiness
    processes.
  - Platform Engineering establishes the foundation for
    scalable, agent-based development workflows.
  - Product and internal teams share common standards,
    guardrails, and reusable frameworks for AI assistants,
    automation, and knowledge systems.

  WHY JOIN US

  Matrix is a global, dynamic, and fast‑growing technology
  services and consulting company with over 17,000 employees
  worldwide. Founded in 2001, Matrix has grown through
  significant organic expansion and strategic acquisitions,
  executing some of the largest and most impactful technology
  projects in the market.

  We specialize in the design, development, and implementation
  of advanced technologies, software solutions, and digital
  products. Our services include infrastructure and
  consulting, IT outsourcing and offshore delivery, training
  and assimilation programs, and acting as a trusted
  implementation and delivery partner for the world’s leading
  software vendors.

  With deep expertise across both the private and public
  sectors—spanning Finance, Telecom, Healthcare, Hi‑Tech,
  Education, Defense, and Security—Matrix serves a strong
  customer base in Israel alongside a continuously expanding
  global client portfolio.

  At Matrix, our people are at the heart of our success. We
  are a community of talented, creative, and dedicated
  professionals who are passionate about innovation and
  excellence. We actively attract, develop, and retain top
  talent, recognizing that every employee’s contribution is
  critical to our continued growth and future success.

  Matrix’s success is built on a challenging and engaging work
  environment, competitive compensation and benefits, and
  meaningful career development opportunities. We foster a
  diverse, inclusive culture that encourages collaboration,
  continuous learning, and growth—together.

  Join the winning team. Be challenged, grow your career, and
  enjoy the journey in a highly respected global organization.

  To learn more, visit: www.matrix-ifs.com



