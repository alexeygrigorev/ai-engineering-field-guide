description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you.  Core Mission The
  Enterprise Applied AI Solution Specialist is a hands-on
  engineer who builds and deploys practical AI solutions that
  improve internal workflows and employee productivity. The
  role focuses on implementing agentic and Generative AI
  features using established patterns, grounded in enterprise
  knowledge and data. This individual partners closely with
  business stakeholders to translate requirements into usable,
  reliable capabilities while operating within enterprise
  constraints such as security, governance, and user trust.
  The position is ideal for a builder who ships, iterates
  quickly, and continuously improves solution quality through
  feedback and measurement. Key Responsibilities This is a
  delivery-focused role combining hands-on implementation with
  light product ownership and operational discipline. 1.
  Applied Solution Delivery & Iteration (65% of time) Build
  and enhance AI-powered features (e.g., copilots,
  summarization, classification, routing, Q&A) aligned to
  defined business workflows. Partner with business users to
  clarify requirements, run demos, capture feedback, and
  iterate toward measurable outcomes. Support pilot launches,
  troubleshoot issues, and contribute to smooth adoption
  through user training and clear documentation. 2. Knowledge-
  Based Agents & Conversational Design (25% of time) Develop
  agents grounded in the company’s internal knowledge base,
  using Retrieval-Augmented Generation (RAG) patterns and
  retrieval quality improvements. Design conversational flows
  for internal functions (e.g., HR helpdesk), including intent
  handling, escalation paths, and handoff to human support
  when needed. Implement simple agentic or predictive models
  for operational use cases (e.g., predicting customer support
  ticket volume) under guidance from senior engineers. 3.
  Product Execution, Quality & Documentation (10% of time)
  Manage the feature backlog for an AI product area: write
  user stories, define acceptance criteria, and coordinate
  UAT. Contribute to evaluation and regression testing using
  approved checklists; help monitor quality, latency, and cost
  for deployed features. Create and maintain documentation
  (how-to guides, runbooks, and user enablement materials) to
  support long-term sustainability. Required Qualifications 3+
  years of experience in software engineering or applied
  solutions development (or equivalent practical experience).
  Proficiency in Python and API-based integration; working
  knowledge of SQL and data access patterns. Working
  familiarity with large language models (LLMs), prompt
  engineering, and Retrieval-Augmented Generation (RAG).
  Exposure to agent frameworks (e.g., LangChain, LlamaIndex,
  Semantic Kernel, or similar) and the ability to implement
  tool/function calling patterns. Basic understanding of
  enterprise security, privacy, and data governance
  requirements; ability to follow established guardrails and
  escalate risks early. Strong communication skills and the
  ability to collaborate effectively with technical and
  business stakeholders. Bachelor’s degree in Computer
  Science, Engineering, or a related field (or equivalent
  practical experience). Ideal Candidate Profile: Who Thrives
  in This Role Builders Over Theorists: You enjoy shipping
  working software and iterating based on user feedback. User-
  Centered Mindset: You like sitting with users, mapping
  workflows, and improving day-to-day productivity. Pragmatic
  Technologist: You choose simple, reliable approaches and
  adopt new techniques when they clearly improve outcomes.
  Quality-Driven: You care about correctness, safety, and
  operational reliability, and you follow established
  production standards. Continuous Learner: You stay current
  on rapidly evolving GenAI capabilities and apply them
  responsibly. Generous Collaborator: You document clearly,
  communicate proactively, and work well across teams.

  Company Overview:

  UKG is the Workforce Operating Platform that puts workforce
  understanding to work. With the world's largest collection
  of workforce insights, and people-first AI, our ability to
  reveal unseen ways to build trust, amplify productivity, and
  empower talent, is unmatched. It's this expertise that
  equips our customers with the intelligence to solve any
  challenge in any industry — because great organizations know
  their workforce is their competitive edge. Learn more at
  ukg.com.

  UKG is proud to be an equal opportunity employer and is
  committed to promoting diversity and inclusion in the
  workplace, including the recruitment process.     

  Disability Accommodation in the Application and Interview
  Process

  For individuals with disabilities that need additional
  assistance at any point in the application and interview
  process, please email UKGCareers@ukg.com
