  What We Offer You:

  We are proud to be an organization that firmly believes in
  having a company culture that is friendly, motivating,
  nurturing, and challenging at the same time. We
  enthusiastically promote new policies and practices that
  ensures wellbeing of our employees.

  We offer comprehensive benefits, including life insurance,
  group medical coverage for you and your family, and personal
  accident protection. Enjoy a supportive work-life balance
  with flexible hours, paid time off, and various lifestyle
  perks. Be recognised with monthly rewards, spot bonuses, and
  growth shares, while advancing your career with training,
  global exposure, and onsite opportunities. We're committed
  to your development, diversity, and well-being.

  About the Role:

  We are looking for a passionate and highly skilled Software
  Engineer – AI (Python, Java) to join our growing technology
  team. The role involves designing and developing
  intelligent, scalable, and enterprise-grade AI solutions
  using modern AI/ML technologies, Large Language Models
  (LLMs), and automation frameworks. You will work closely
  with cross-functional teams to build innovative solutions,
  integrate AI capabilities into enterprise applications, and
  contribute to next-generation digital transformation
  initiatives.

  Key Responsibilities

  - Design, develop, and deploy AI/LLM-powered applications and
    intelligent workflows.
  - Build and integrate AI agents with enterprise APIs and
    business applications.
  - Develop scalable backend services using Python and Java.
  - Implement memory, retrieval, and vector database solutions
    for AI applications.
  - Work on prompt engineering, RAG pipelines, and LLM
    orchestration frameworks.
  - Collaborate with product, engineering, and consulting teams
    to deliver high-quality solutions.
  - Optimize AI model performance, scalability, security, and
    reliability.
  - Conduct testing, debugging, and continuous improvement of AI
    systems.
  - Stay updated with emerging trends in AI, Machine Learning,
    and Generative AI technologies.

  Required Skills & Qualifications

  - Strong experience in Python and Java development.
  - Good understanding of Large Language Models (LLMs) and AI
    frameworks.
  - Hands-on experience with frameworks such as LangChain,
    LangGraph, AutoGen, LlamaIndex, or similar technologies.
  - Experience working with APIs, function calling, and secure
    integrations.
  - Knowledge of vector databases and memory architectures
    (FAISS, Pinecone, Chroma, pgvector, etc.).
  - Understanding of RAG architecture, prompt engineering, and
    AI orchestration.
  - Familiarity with cloud platforms such as AWS, Azure, or GCP.
  - Good problem-solving, analytical, and communication skills.
  - Ability to work in a fast-paced, collaborative environment.

  Preferred Qualifications

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, AI/ML, or related field.
  - Experience with Docker, Kubernetes, or modern deployment
    practices.
  - Exposure to SAP technologies or enterprise application
    ecosystems is an advantage.
  - Knowledge of MLOps / LLMOps tools is a plus.
