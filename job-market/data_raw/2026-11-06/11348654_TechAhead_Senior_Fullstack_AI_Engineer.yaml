description: |
  We are looking for a Senior Full Stack Engineer with strong
  backend expertise and experience in building scalable
  applications, distributed systems, and AI-powered features.
  The candidate will primarily focus on backend architecture
  and development while contributing to web and mobile
  applications.

  Key Responsibilities

  - Design, develop, and maintain scalable backend applications
    using Node.js, NestJS, and TypeScript.
  - Design microservices and distributed systems with a focus on
    performance, reliability, and scalability.
  - Build event-driven architectures using Kafka or similar
    messaging technologies.
  - Implement caching strategies using Redis and optimize
    database performance using MongoDB.
  - Develop and integrate AI-powered features using LLMs, RAG,
    embeddings, and vector search.
  - Build and maintain web applications using React.js and
    contribute to mobile applications using React Native.
  - Design and integrate REST APIs and ensure seamless
    communication between frontend and backend systems.
  - Deploy, monitor, and optimize applications on AWS.
  - Participate in system design, architecture decisions, code
    reviews, and production troubleshooting.
  - Collaborate with cross-functional teams and take ownership
    of end-to-end feature delivery.

  Required Skills

  - 5–10 years of software development experience.
  - Strong proficiency in Node.js, TypeScript, and NestJS.
  - Strong understanding of system design, microservices, and
    distributed systems.
  - Experience with Kafka or similar message queue technologies.
  - Hands-on experience with MongoDB, Redis, database design,
    and query optimization.
  - Practical experience implementing AI features using LLMs and
    RAG.
  - Experience with React.js and frontend application
    development.
  - Hands-on experience with AWS and production deployments.
  - Strong problem-solving and analytical skills.

  Good to Have

  - Experience with React Native.
  - Experience with OpenSearch, Elasticsearch, or vector
    databases.
  - Knowledge of AI agents, embeddings, and multimodal AI.
  - Experience in e-commerce, fashion technology, or quick
    commerce.

  About Us:

  TechAhead is a global digital transformation company with a
  strong presence in the USA and India. We specialize in AI-
  first product design thinking and bespoke development
  solutions. With over 16 years of proven expertise, we have
  partnered with Fortune 500 companies and leading global
  brands to drive digital innovation and deliver excellence.
  At TechAhead, we are committed to continuous learning,
  growth and crafting tailored solutions that meet the unique
  needs of our clients.

  Join us to shape the future of digital innovation worldwide
  and drive impactful results with cutting-edge AI tools and
  strategies!
