description: |
  Who We Are

  You've ordered dinner through Just Eat Takeaway. You've
  bought and sold on OLX. You've paid with PayU. Chances are,
  you've already used a Prosus company today.

  We are Prosus, a global technology company powering some of
  the world's leading lifestyle ecommerce businesses. Every
  day, billions of people across India, Latin America, Europe
  and beyond use our products and services to buy, sell, pay,
  connect and discover.

  Our AI-driven ecosystem spans 100+ companies across
  ecommerce, food delivery, fintech and experiences, serving
  billions of consumers worldwide. AI powers how we operate
  and innovate, with more than 60,000 active AI agents helping
  our teams build, scale and move faster. Through our
  investment team, we also back the founders and technologies
  shaping the future: From robotics and autonomous systems to
  synthetic biology and frontier AI.

  Guided by our five values Innovation, Results, People,
  Impact, and Entrepreneurship, culture is our competitive
  advantage. We thrive with experimentation; we build, we
  test, we learn, we iterate.

  Join us in shaping the future of technology at global scale.

  About Toqan

  Toqan is Prosus’s agentic execution platform, allowing
  people and businesses to turn ideas into working AI-powered
  applications. It combines frontier and open-weight models,
  agents, tools, sandboxes, memory, context management,
  integrations, and infrastructure into one system for
  reliably executing complex tasks. Toqan already operates at
  significant scale across the Prosus ecosystem, and we’re now
  pushing toward the next generation: more autonomous, more
  reliable, more cost-efficient, and easier for developers and
  businesses to build on.

  The role

  As Community Engineer, you’ll be the technical face of Toqan
  for the developers and teams building on it across Prosus.
  You’ll build working examples, integrations, and tooling,
  write documentation people actually use, and run the
  feedback loop between the developers building on Toqan and
  the core engineering team. You’ll also be a public-facing
  advocate, growing awareness and adoption of Toqan through
  talks, content, and events.

  What you will do

  - Build and maintain examples, integrations, and tooling that
    demonstrate practical uses of Toqan.
  - Reproduce reported bugs, contribute tested fixes, and
    improve installation, APIs, and error messages.
  - Write clear quickstarts, tutorials, and contribution guides,
    and keep them accurate as the platform evolves.
  - Create and share public technical content such as blog
    posts, videos, demos, and talks that grow awareness and
    adoption of Toqan.
  - Support developers through issues and community discussions.
    Follow problems through to resolution and share updates.
  - Review pull requests constructively, identify suitable first
    contributions, and help contributors develop their ideas.
  - Establish welcoming community practices, communicate
    expectations, and handle disagreements with patience and
    sound judgment.
  - Grow the community of builders on Toqan, and represent Toqan
    at internal and external events and conferences.
  - Turn recurring questions and feedback into prioritized
    improvements, working with the engineering team.
  - Support launches with working demos and useful technical
    content. Run workshops, hackathons, or office hours as
    community needs emerge.

  What you’ll need

  - 3+ years of professional software engineering experience.
    Comfortable reading, writing, and debugging production-
    quality code. Ideally experienced in Go, Python or
    TypeScript. Backend or full-stack background both fine.
  - Real hands-on experience with agents or LLM-based systems,
    not just calling an API. You should be able to explain how
    an agent loop, tool call, or model router actually works.
  - Comfortable working with MCP server infrastructure. You
    don’t need to have architected one from scratch, but you
    should understand it well enough to build on it and help
    others use it.
  - Some cloud experience (AWS or GCP). Comfortable with the
    terminal, Git and GitHub workflows, Docker, and diagnosing
    common setup problems.
  - You use AI coding tools (Cursor, Claude Code, Copilot,
    Codex) daily as part of how you work.
  - Proven technical teaching ability: you can write a
    quickstart another developer can follow, build a runnable
    example, and explain technical decisions patiently.
  - Strong written and verbal communication. This role lives in
    docs, issues, and PR reviews, and also in talks,
    workshops, and video. A track record of public technical
    communication (talks, blogs, videos, or open-source
    presence) is expected.
  - Comfortable being a visible technical point of contact
    across multiple teams, and turning varied technical input
    into a prioritized backlog.

  Nice to have

  - A following or reputation in the AI developer community.
  - Experience building example apps, SDKs, or integration
    templates on top of an agent or LLM platform.
  - Exposure to multi-model routing, or working with both
    frontier and open-weight models.
  - Familiarity with sandboxing or isolation concepts
    (Firecracker, gVisor, containers).
  - Experience running workshops, meetups, hackathons, office
    hours, or onboarding programs for developers.

  Why Prosus?

  At Prosus, your colleagues include 60,000 AI agents… and
  your job is to figure out what that actually means. We're
  one of the largest operators of agentic AI on the planet,
  inside a $100B+ portfolio across 100+ companies and two
  billion people. The humans here own what AI can't do alone:
  judgment, creativity, and the call on what gets built next.

  Own the impact. Work the ecosystem. Earn your growth. Build
  with backing.

  Curious about our perks and benefits? Take a look at this
  page.

  Our Diversity & Inclusion Commitment

  We respect the dignity and human rights of individuals and
  communities wherever we operate in the world. Building an
  inclusive workplace where everyone feels welcome and can
  thrive is critical for us. We provide access to education,
  which helps everyone understand the important role they play
  and the positive impact they can have.

  Want to know more about life at Prosus? Explore our culture
  and values.
