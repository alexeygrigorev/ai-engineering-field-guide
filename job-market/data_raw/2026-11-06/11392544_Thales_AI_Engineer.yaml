  - Programming languages: Strong proficiency in Java and
    JavaScript
  - Software architecture: Good experience with modern
    microservices architecture and REST APIs
  - Applied AI expertise: Strong experience in AI solution
    patterns, including:
    - Agentic architectures
    - RAG pipelines
    - Orchestration frameworks
    - Evaluation pipelines
    - Intelligent automation
  - Modern AI system concepts: Understanding of:
    - Memory management
    - Planning
    - Tool orchestration
    - Model evaluation
    - Guardrails
    - Responsible AI principles
  - Frontend framework: Strong proficiency in React
  - Backend framework: Strong proficiency in Spring Boot
  - Database: Good experience with PostgreSQL
  - Development practices: Familiarity with the software
    development lifecycle and tools/methodologies (e.g., Git,
    Agile)
  - Team & mindset: Autonomy, technical excellence,
    communication, teamwork, problem-solving, adaptability,
    curiosity, continuous improvement
