title: AI Engineer - Assistant Vice President
company: Citigroup
location: Pune, IND
work_type: FULL_TIME
company_size: 226,610 Employees
description: |
  Job Description

  We are building the most consequential AI solutions in Funds
  Transfer Pricing and Financial Hedging platforms, and we are
  looking for an AI Engineer to help design and develop
  Agentic AI solutions for these domains.

  The ideal candidate is a skilled engineer, passionate about
  building sophisticated AI agents and contributing to their
  development from concept to production.

  In this position, you will be responsible for helping to
  create agentic solutions that automate complex workflows,
  enhance critical decision-making, and deliver scalable,
  cutting-edge technology at a global scale.

  Responsibilities:

  Advanced Agent and Model Development

  - Contribute to the development of multi-agent systems where
    autonomous agents collaborate to solve business problems.
  - Implement and optimize planning and reasoning capabilities
    using techniques such as knowledge graphs, rule-based
    reasoning, and planning/search algorithms to execute
    multi-step workflows.
  - Build resilient and adaptive agent architectures with
    mechanisms for feedback-driven improvement, error
    recovery, and self-correction.
  - Integrate large language models (LLMs), predictive models,
    and reasoning frameworks to expand agent capabilities and
    support complex business workflows.
  - Work on the design and optimization of Retrieval-Augmented
    Generation (RAG) architectures, including embedding
    strategies, vector databases, and retrieval pipelines to
    improve response accuracy.
  - Develop APIs, tools, and microservices that enable seamless
    integration of AI capabilities with enterprise
    applications and platforms.

  Performance and Optimization

  - Contribute to the optimization of AI systems for low latency
    and high throughput.
  - Implement techniques such as response streaming and caching,
    while ensuring cost-effectiveness through model selection
    and token usage optimization

  Collaboration and Innovation:

  - AI Research and Application: Stay current with state-of-the-
    art research and apply it to solve business problems,
    identifying opportunities for innovation.
  - Team Collaboration: Collaborate with and mentor other
    engineers on AI best practices, fostering a culture of
    engineering excellence within the team.

  Required Qualifications & Skills

  - 8+ years of professional experience in software development
    and system design, with a proven track record of
    delivering large-scale systems
  - Professional experience in software development and system
    design.
  - Proficiency in Python and SQL, with experience in
    production-quality Agentic AI development; applied
    experience with frameworks like LangChain, LlamaIndex, or
    equivalents.
  - Experience in developing multi-agent systems using
    frameworks like Google ADK, LangGraph, AutoGen, or CrewAI.
    This includes hands-on experience with planning/reasoning,
    memory systems, and Vector DBs.
  - Practical knowledge of LLMs and their application within
    agentic architectures, including API design and
    integration for AI services.
  - Strong skills in Prompt and Context Engineering, including
    the ability to structure and compress information for
    optimal model performance

  Beneficial Qualifications & Skills

  - Experience working in the financial services industry.
  - Proficiency in Java as an additional programming language.

  Education

  - Bachelor’s degree/University degree in Computer Science or a
    related field.
  - Master's degree preferred

