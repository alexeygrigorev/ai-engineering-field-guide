description: |
  At eBay, we're more than a global ecommerce leader — we’re
  changing the way the world shops and sells. Our platform
  empowers millions of buyers and sellers in more than 190
  markets around the world. We’re committed to pushing
  boundaries and leaving our mark as we reinvent the future of
  ecommerce for enthusiasts.

  Our customers are our compass, authenticity thrives, bold
  ideas are welcome, and everyone can bring their unique
  selves to work — every day. We're in this together,
  sustaining the future of our customers, our company, and our
  planet.

  Join a team of passionate thinkers, innovators, and dreamers
  — and help us connect people and build communities to create
  economic opportunity for all.

  Role Overview:

  The Finance Innovation & Transformation (FIT) team is
  driving the next phase of Finance transformation at eBay
  through process modernization, data, and AI to build
  scalable solutions that improve efficiency, strengthen
  controls, and enable smarter decision-making. The team
  builds advanced AI and intelligent transformation solutions
  that turn high-value Finance opportunities into scalable,
  production-ready capabilities.

  This role is for a hands-on AI Engineer and AI specialist
  who will serve as a core developer within FIT, designing,
  building, and deploying advanced AI, machine learning, and
  automation solutions for complex Finance use cases. The role
  includes developing production-grade models, web apps,
  intelligent agents, automation workflows, and decision-
  support tools, while translating business problems into
  scalable technical solutions from concept through
  deployment.

  The ideal candidate brings strong expertise in AI/ML,
  automation, system design and applied data science. They
  should be comfortable working across structured and
  unstructured data, building reusable capabilities, staying
  current with emerging AI technologies, and applying them to
  real Finance use cases. Passion for innovation, intellectual
  curiosity, and delivering measurable business outcomes
  through automation and AI are key to success

  Primary Job Responsibilities:

  - Partner with Finance and cross-functional stakeholders to
    shape solution approaches, translate prioritized business
    problems into scalable technical and system designs, and
    drive execution of AI and intelligent automation
    solutions.
  - Design, build, and deploy production-grade AI, machine
    learning, and automation solutions using core Python, SQL,
    modern AI/ML frameworks, and related technologies to solve
    complex Finance use cases.
  - Develop intelligent agents, web apps, automation workflows,
    and decision-support tools that move beyond analysis into
    execution and integrate seamlessly into business
    processes.
  - Build and maintain robust data pipelines, model workflows,
    and reusable solution components that support scalability,
    reliability, and long-term adoption.
  - Evaluate emerging AI technologies and AI-assisted
    development tools, and apply leading and emerging
    solutions where appropriate to accelerate implementation
    and create measurable business value.
  - Monitor, refine, and scale deployed solutions to improve
    performance, reliability, usability, and alignment with
    evolving business needs.
  - Partner proactively with teams across Finance, Product,
    Engineering, ITSS and other functions to ensure strong
    collaboration, visibility, and successful delivery across
    the solution lifecycle.

  Job skills required:

  - Intellectual curiosity, strong problem-solving skills, and
    comfort working in ambiguity and fast-evolving technology
    spaces.
  - Proven experience building and delivering end-to-end AI,
    machine learning, and intelligent automation solutions
    from technical/system design and data preparation through
    deployment and ongoing optimization.
  - Strong programming and technical skills in Python, SQL, and
    modern AI/ML frameworks; experience building scalable
    applications, automation solutions, or decision-support
    tools is highly valued.
  - Experienced in handling big data (Hadoop, Teradata, etc.)
    and agile experience; Google Big Query experience is a
    plus
  - Ability to translate business needs into scalable,
    maintainable software and automation solutions.
  - Comfort operating as a hands-on individual contributor while
    collaborating effectively across global, cross-functional
    teams.
  - Strong communication and stakeholder management skills, with
    the ability to explain technical concepts clearly and
    drive alignment across business, data, product, and
    engineering partners.

  Desired Qualifications:

  - 4+ years of experience designing and delivering AI, machine
    learning, and intelligent automation solutions in complex
    enterprise environments.
  - Strong programming proficiency in Python and SQL, with
    experience using modern AI/ML frameworks to build scalable
    technical solutions.
  - Experience delivering production-ready solutions in complex,
    regulated, or controls-focused environments is preferred.

