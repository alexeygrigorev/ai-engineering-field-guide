title: AI Engineer
company: Raydar
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  About the company

  Our client is a small technology holding company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and ship software across internal tooling, sales-
  facing systems and client product work, often starting from
  loosely defined problems. Use AI coding agents as the
  default way of building, and own technical problems from
  scoping through delivery. Early-career engineers who already
  build this way are welcome.

  What you'll do

  - Build internal tools that help the sales function find and
    reach new prospects.

  - Ship features and fixes for existing clients.

  - Generalize internal tooling so that a solution built for one
    purpose can be reused.

  - Take unclear client problems and unfinished product
    features, decide what to build, and deliver it with
    limited oversight.

  - Contribute to a shared set of reusable AI agent components
    alongside platform engineering leadership.

  - Travel occasionally for client kickoffs.

  Requirements

  What we're looking for

  - A history of taking AI applications past prototype stage and
    into real use, well beyond simple conversational demos.

  - Experience working directly with a client, end user or non-
    technical stakeholder to scope and deliver finished
    products.

  - Broad full-stack skills across product, data and
    engineering.

  - Ability to write code both with and without AI assistance,
    and to check agent outputs for errors.

  - Strong communication skills, since regular client
    interaction is expected.

  Bonus points

  - Computer science degree from a top 50 university.

  - Earlier experience delivering AI features for an outside
    organization in a paid or contracted capacity.

  - Track record of shipping production code with little
    oversight.

  Benefits

  Compensation and benefits

  - Base salary: USD 130,000 to 160,000 per year

  - Equity

  Location and work model

  - Los Angeles, CA, United States

  - On-site, 5 days a week in office

  - Full-time
