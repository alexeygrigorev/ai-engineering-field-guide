description: |
  We are seeking a highly analytical and technical
  professional to spearhead the evolution of our trading
  infrastructure.  This hybrid role combines the fast-paced
  execution of a Trading Operations Specialist, the analytical
  rigor of a Risk Manager, and the technical capabilities of
  an AI-focused Developer.

  The successful candidate will not only manage daily
  operational workflows and risk monitoring but will also lead
  the digital transformation of these functions. You will
  leverage Large Language Models (LLMs), machine learning, and
  advanced scripting to automate legacy manual processes,
  improve predictive risk modeling, and build real-time
  performance visualization tools and analyses.

