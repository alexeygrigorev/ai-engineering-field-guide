description: |
  About CIRCL CIRCL is redefining how energy and goods move
  across the globe. We build at the intersection of IoT,
  enterprise workflows, and AI — a single, fast-evolving
  product suite that solves critical real-world logistics
  problems. From optimizing last-mile delivery to creating
  delightful customer experiences, our solutions drive
  immediate, high-impact results.

  We work across industries and borders, pushing boundaries
  every day. That means agility isn’t optional — it’s our
  baseline. We embrace emerging tech, ship fast, and solve
  problems that matter.

  We’re looking for high-agency builders: people who think
  like product owners, design like users, and code like
  engineers. If you enjoy wearing multiple hats, challenge
  assumptions by default, and care about both the “how” and
  the “why” behind great products — you’ll thrive here.

  At CIRCL, technology isn’t just a tool — it’s a service.
  Join us to help shape the future of global movement — and
  grow faster than you thought possible.

  About the Role

  We’re looking for a dynamic, adaptable, and growth-oriented
  Full-Stack Developer who thrives in a fast-paced environment
  and knows how to leverage AI tools to move 10x faster — from
  development to deployment. You’ll be part of a small, high-
  impact team building full product experiences, not just
  isolated components. Your work will directly contribute to
  how we change energy consumption globally, delivering end-
  to-end systems that solve real customer problems.

  You don’t need to have mastered everything — but you do need
  to figure things out fast, be willing to learn anything, and
  own outcomes.

  This role is for someone who builds things even when no
  one’s asking — whether that’s a side project, automation
  script, personal app, or just a crazy idea you had to try
  out. If your GitHub is full of experiments and prototypes,
  you’re probably in the right place.

  🌍 What You’ll Do

  • Build and maintain full-stack applications using React,
  Golang, and Node.js

  • Use AI tools (like GitHub Copilot, Winsurf/Cursor, Claude,
  or your own stack) to enhance development quality and speed

  • Jump between languages and frameworks as needed, guided by
  problem-solving — not preference

  • Collaborate with product and design to deliver customer-
  centric, fully integrated solutions

  • Contribute to deployment and DevOps strategies as needed
  (containerisation, CI/CD, cloud infra)

  • Own your work from idea to release — you’ll deploy often
  and iterate fast

  • Spot opportunities to make systems more scalable,
  maintainable, and elegant

  • Share ideas freely and improve not just code, but product,
  process, and team dynamics

  ⚙️ Tech Stack You’ll Use (and Evolve)

  • Frontend: React, Next.js

  • Backend: Golang, Node.js, PostgreSQL

  • Infra & DevOps: Docker, GitHub Actions, AWS/GCP

  • AI & Automation: GitHub Copilot, Windsurf/Cursor, OpenAI,
  Anthropic APIs, LangChain, custom LLM tools

  • Other Tools: GraphQL/REST APIs, Redis, Kubernetes (if
  needed)

  And you’re comfortable jumping into other stacks (Python,
  Rust, etc.) when the job calls for it — especially when AI
  makes it easier to cross those bridges.

  🧬 You’ll Thrive If You…

  • Are self-directed, proactive, and make things happen

  • Have a builder’s mindset and care about the why behind the
  work

  • Regularly work on your own ideas or side projects to try
  things out and learn

  • Are passionate about learning new tech and using AI as a
  force multiplier

  • Care about end-to-end solutions, not just shipping
  features

  • Have a strong grasp of modern deployment strategies or the
  hunger to learn them fast

  • Prefer solving real-world problems over abstract
  perfection

  • Want to be surrounded by people who think big, work fast,
  and have fun doing it

  🚀 Why Join Us?

  • We’re solving real, global problems in energy consumption
  and logistics

  • You’ll ship quickly and get feedback from real users

  • You’ll work with other high-agency, smart people who
  genuinely care

  • We embrace AI as a tool to go faster and build smarter —
  not as a threat

  • You’ll have room to grow into leadership, product, or
  specialist roles as we scale

  🔍 How to Apply

  Send us a few lines about who you are, what you’ve built,
  and how you’ve used AI to work smarter. Tell us about a side
  project or a time you chased an idea just to see if you
  could build it. Show us your GitHub, blog, or personal site
  — we love builders.
