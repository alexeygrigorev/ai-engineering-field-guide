description: |
  Viridien (www.viridiengroup.com) is an advanced technology,
  digital and Earth data company that pushes the boundaries of
  science for a more prosperous and sustainable future. With
  our ingenuity, drive and deep curiosity we discover new
  insights, innovations, and solutions that efficiently and
  responsibly resolve complex natural resource, digital,
  energy transition and infrastructure challenges.

  Are you interested in building AI systems for real-world
  scientific problems?

  Viridien is expanding its capabilities in agentic AI, large
  language models and reinforcement learning for complex
  scientific and enterprise workflows.

  We operate global high-performance scientific computing
  infrastructure delivering more than 700 petaflops and
  executing over one million scientific computing jobs each
  day across areas including geophysical imaging, materials
  science, biotechnology and AI-driven research.

  We are looking for a hands-on Machine Learning Engineer to
  help build and evaluate intelligent agent systems, turning
  emerging AI methods into robust and adaptive solutions for
  scientific applications.

  Who you'll work with

  As a member of our AI Lab, you'll collaborate with senior
  machine learning engineers, software developers, HPC
  specialists and scientific domain experts across Viridien.
  Learn more about the team on our website, in a recent blog
  post featuring one of our senior machine learning engineers
  and from our Voices of Viridien.

  What you'll work on

  - Designing and developing single-agent and multi-agent
    systems.
  - Implementing and evaluating capabilities such as reasoning,
    planning, task decomposition, memory, tool use and agent
    collaboration.
  - Integrating LLMs, vision-language models, retrieval systems
    and domain-specific tools.
  - Experimenting with fine-tuning and adapting foundation
    models using supervised learning, preference optimisation
    and reinforcement learning where appropriate.
  - Developing training environments, reward functions, graders
    and feedback mechanisms.
  - Designing evaluations, guardrails and monitoring approaches
    for agent reliability.
  - Helping turn successful prototypes into APIs, services and
    reusable software components.

  What we look for

  Essential

  - Degree in computer science, artificial intelligence, machine
    learning, engineering or a related discipline, or
    equivalent practical experience.
  - Good Python programming skills and an understanding of
    software engineering practices.
  - Experience building machine-learning, generative-AI or LLM
    applications, gained through employment, industry or
    research internships, applied research or significant
    academic projects.
  - Experience with PyTorch, JAX, TensorFlow or a similar
    framework.
  - Familiarity with core agentic AI concepts such as tool
    calling, planning, memory and workflow orchestration.
  - An understanding of reinforcement learning, preference
    optimisation or sequential decision-making.
  - Some experience evaluating models or implementing ideas from
    machine-learning research.

  Desirable

  - Familiarity with multi-agent systems using LangGraph,
    AutoGen, smolagents or similar frameworks.
  - Some exposure to LLM fine-tuning or preference and
    reinforcement-learning approaches, such as DPO, GRPO, RLHF
    or RLAIF.
  - Experience designing reward functions, graders or agent
    training environments.
  - Familiarity with Model Context Protocol or other approaches
    to tool integration.
  - Exposure to training or deploying open-source language or
    vision-language models using GPUs, including distributed
    training.
  - Experience applying AI to scientific, engineering, energy or
    geoscience workflows.

  Why work with us?

  At Viridien, we are dedicated to providing the needs of our
  employees; and we know every employee has unique personal
  goals, family circumstances, and preferences. That is why we
  offer a wide array of benefits to promote and enhance your
  total well-being:

  India

  - Flexible Hybrid Work Model
  - Comprehensive Personal and Family Healthcare
  - Fun Employee Wellness & Sustainable Activities

  Learning and development

  At Viridien, we foster a culture of continuous learning and
  provide tailored training programmes through our Learning
  Hub, designed to enhance technical, commercial, and personal
  growth.

  We care for the environment

  We encourage and actively support a strong sense of
  community, through volunteering and various company
  initiatives. As a company we are also committed to reducing
  our environmental impact, improving energy efficiency and
  accelerating sustainable solutions.

  Our Hiring Process

  At Viridien, we are committed to delivering a respectful,
  inclusive, and transparent recruitment experience.

  Due to the high volume of applications we receive, we may
  not be able to provide individual feedback to every
  applicant. Only candidates whose qualifications closely
  match the role criteria will be contacted for an interview.
  We do, however, aim to share personalized feedback with
  those who progress to the first round of interviews and
  beyond.

  We are also dedicated to ensuring that our hiring process
  accessible to all. If you require any reasonable adjustments
  to fully participate in the application or interview stages,
  please don’t hesitate to contact your recruiter directly.

  We see things differently. Diversity fuels our innovation,
  we value the unique ways in which we differ, and we are
  committed to equal employment opportunities for all
  professionals.
