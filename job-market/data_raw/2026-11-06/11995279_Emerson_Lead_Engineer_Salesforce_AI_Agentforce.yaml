description: |
  This role defines Agentforce governance standards, reviews
  AI use cases, guides agent design patterns, establishes
  guardrails, audits AI usage, and coordinates remediation
  when AI behaviors, data readiness, or process controls do
  not meet Emerson expectations. The role partners closely
  with Emerson AI Governance Council,  Data Cloud, Security,
  Legal, Compliance, Architecture, Business Group leaders, and
  implementation workstreams to ensure AI capabilities are
  deployed responsibly across the Salesforce ecosystem.

  In This Role, Your Responsibilities Will Be:

  AI Governance, Policy & Responsible Deployment

  - Define, document, and enforce Emerson AI governance
    policies, ethical guidelines, compliance expectations, and
    approval standards for Salesforce AI capabilities,
    including Agentforce and Einstein
  - Review proposed AI toolsets and agent use cases across
    business functions for regulatory, ethical, privacy,
    security, and business-process readiness
  - Establish practical guardrails for agent design, topic
    configuration, actions, data grounding, escalation,
    auditability, and human oversight
  - Track evolving AI regulations, Salesforce trust guidance,
    and corporate policies, translating requirements into
    usable governance practices for delivery teams
  - Create AI risk assessment templates, model/use-case review
    checkpoints, exception processes, and remediation
    procedures for Salesforce AI deployments



  Agentforce Enablement & Design Leadership

  - Advise workstream teams on Agentforce design patterns, agent
    topics, actions, instructions, prompt quality,
    hallucination prevention, and safe handoff to human users
  - Enable responsible AI innovation by helping teams move from
    concept to governed pilots, production readiness, and
    measurable business outcomes
  - Partner with Data Cloud, Data Stewardship, and Integration
    teams to ensure agent grounding data is accurate,
    permission-aware, compliant, and fit for intended use
  - Develop reusable Agentforce patterns, documentation,
    training materials, and playbooks to accelerate consistent
    adoption across Business Groups and World Areas



  Audit, Monitoring & Continuous Improvement

  - Audit AI agent usage, performance, quality, compliance, bias
    risk, and outcome measures, coordinating remediation
    actions when issues are identified
  - Define AI trust and safety metrics, adoption metrics, value
    measures, and executive reporting for Salesforce AI
    capabilities
  - Partner with Security, Legal, Compliance, Architecture, and
    Data teams to ensure AI controls align with Emerson
    enterprise policies and risk posture
  - Support post-deployment reviews, incident learnings, and
    continuous improvement of AI governance standards and
    agent operating models



  Who You Are:

  You are energized by helping Emerson innovate responsibly,
  turning emerging AI capabilities into trusted business tools
  (Nimble Learning; Strategic Mindset). You can diagnose risk
  without becoming a blocker, applying sound judgment to
  privacy, compliance, security, data readiness, and user
  experience trade-offs (Decision Quality; Manages
  Complexity). You communicate clearly with both technical
  teams and senior leaders, making AI governance practical and
  actionable (Communicates Effectively). You build alignment
  across functions that may see AI through different lenses,
  creating confidence that Agentforce capabilities can scale
  safely and deliver value (Collaborates; Builds Networks;
  Ensures Accountability).


  For This Role, You Will Need:



  Technical Skills:

  - Salesforce Agentforce concepts, including agent design,
    topics, actions, instructions, guardrails, grounding,
    human handoff, and monitoring
  - Salesforce Einstein and AI-enabled CRM capabilities, with
    understanding of Salesforce Data Cloud as an AI data
    foundation
  - AI/ML governance frameworks, responsible AI principles,
    model/use-case risk assessment, bias monitoring, and AI
    audit practices
  - Data privacy regulations and compliance considerations,
    including GDPR, CCPA, industry-specific requirements, and
    enterprise security controls
  - LLM capabilities, limitations, hallucination risk, prompt
    engineering concepts, retrieval/grounding patterns, and
    safe automation design



  Interpersonal and Leadership Skills:

  - Cross-functional influence and education across business,
    delivery, data, security, legal, compliance, and
    architecture stakeholders
  - Risk assessment and mitigation planning with the judgment to
    distinguish acceptable experimentation from unacceptable
    enterprise risk
  - Clear communication of AI concepts, controls, and trade-offs
    to non-technical leaders and delivery teams
  - Pragmatic governance orientation that accelerates
    responsible innovation rather than creating unnecessary
    friction
  - Curiosity, regulatory awareness, and disciplined learning in
    a rapidly evolving AI technology landscape



  Required Certifications:

  - Salesforce Agentforce certification
  - Salesforce AI Associate, Salesforce Administrator, Data
    Cloud, or responsible AI / AI ethics certifications valued



  Preferred / Nice-to-Have:

  - Experience with manufacturing, industrial, commercial,
    service, or channel AI use cases
  - Hands-on Salesforce Einstein, Agentforce, Data Cloud, or CRM
    automation experience
  - Formal AI ethics, responsible AI, privacy, security, or
    compliance certification
  - Familiarity with Salesforce Trust Layer concepts,
    permission-aware grounding, and enterprise AI assurance
    practices
  - Experience designing AI governance for global, matrixed
    organizations



  Preferred Qualifications That Set You Apart:

  - Bachelor's degree required in Computer Science, Information
    Systems, Data Science, Engineering, Business,
    Legal/Compliance, or a related field; advanced degree
    preferred
  - 3+ years of experience in AI/ML governance, data ethics,
    compliance, risk management, enterprise technology, or
    Salesforce platform leadership
  - Experience defining or operating governance frameworks for
    AI, analytics, automation, or data-driven technology in an
    enterprise context
  - Strong understanding of data privacy, security, compliance,
    auditability, and responsible AI principles
  - Ability to translate complex AI concepts and risks into
    clear guidance for technical, business, legal, and
    executive audiences
  - Approximately 10-20% travel (global)



