description: |
  At Databricks, we are passionate about helping enterprises
  that build ML models and AI agents deliver high-quality AI
  to production fast. Founded by engineers, and customer
  obsessed, we leap at every opportunity to tackle technical
  challenges, from designing great developer experiences to
  building reliable systems at global scale. And we're only
  getting started.

  Our team builds the MLOps and LLMOps platform that millions
  of AI developers and ML practitioners use to track model
  training experiments, manage model registry, observe and
  evaluate AI agents. We're the team behind MLflow, the most
  widely adopted open-source AI engineering platform with more
  than 30 million package downloads per month, and its managed
  service used by thousands of organizations globally. We're
  now expanding to Bengaluru, India, and building our first AI
  engineering team there from scratch to work on this
  platform.

  As a Senior Software Engineer and a founding member of the
  Bengaluru team, you'll design and build the backend systems
  behind these products and take them from design through
  production. This is an excellent opportunity for a hands-on
  engineer who thrives in a fast-paced environment.

  Check out our recent blog post: coSTAR: How we ship AI
  agents at Databricks fast, without breaking things

  The impact you will have:

  - Design and implement core services and APIs for the
    platform, ensuring scalability, reliability, and
    operational excellence.
  - Build systems that ingest, store, and query traces, metrics,
    and artifacts from training runs and production agents.
  - Develop evaluation and monitoring capabilities, such as LLM
    judges and quality metrics, that catch regressions before
    they reach production.
  - Optimize the scalability and cost of the platform as usage
    grows across customers and cloud regions.
  - Work with product, research, and customers on what we build
    next.
  - Establish best practices for code quality, testing, and
    operational readiness, and mentor other engineers.

  What we look for:

  - BS (or higher) in Computer Science, or a related field.
  - 5+ years of experience developing large-scale distributed
    systems, scaling infrastructure, or building platforms and
    developer tools for other teams.
  - Strong foundation in algorithms, data structures, and system
    design.
  - Strong experience with backend technical stacks such as
    Scala or Java.
  - Experience with cloud technologies, e.g. AWS, Azure, GCP,
    Docker, Kubernetes.
  - Engineering maturity in security, correctness, and
    operational excellence.
  - Strong communication skills and ability to collaborate
    across teams.
  - Experience with ML or LLM systems is a plus.

  About Databricks

  Databricks is the Data and AI company. More than 20,000
  organizations worldwide — including adidas, AT&T, Bayer,
  Block, Mastercard, Rivian, Unilever, and 70% of the Fortune
  500 — rely on the Databricks Data + AI Platform to build and
  scale data and AI apps, analytics and agents. Headquartered
  in San Francisco with 30+ offices around the globe,
  Databricks offers a unified platform that includes Genie,
  Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity
  Catalog. To learn more, follow Databricks on LinkedIn, X,
  YouTube, and Instagram. Benefits At Databricks, we strive to
  provide comprehensive benefits and perks that meet the needs
  of all of our employees. For specific details on the
  benefits offered in your region click here.

