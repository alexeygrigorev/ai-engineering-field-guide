description: |
  Job Description:

  Job Title: GCP Data and AI Engineer, AVP

  Location: Pune, India

  Role Description:

  As an AVP and Senior GCP Data and AI Engineer, you will lead
  the architecture and hands-on delivery of complex data and
  generative AI solutions on GCP. Working as a senior
  individual contributor, you will translate business and
  technical requirements into production-ready designs; build
  scalable batch and streaming pipelines, APIs, RAG systems,
  and agentic workflows; and establish engineering standards
  for security, testing, deployment, resilience, and
  operational support. You will own solutions from design
  through production deployment and provide technical guidance
  on critical engineering decisions and complex production
  issues

  What we’ll offer you

  As part of our flexible scheme, here are just some of the
  benefits that you’ll enjoy

  - Best in class leave policy.
  - Gender neutral parental leaves
  - 100% reimbursement under childcare assistance benefit
    (gender neutral)
  - Sponsorship for Industry relevant certifications and
    education
  - Employee Assistance Program for you and your family members
  - Comprehensive Hospitalization Insurance for you and your
    dependents
  - Accident and Term life Insurance
  - Complementary Health screening for 35 yrs. and above

  Your key responsibilities:

  As a Senior Engineer, your hands-on responsibilities will
  include:

  AI & Application Development:

  - Design, build, and operationalize sophisticated AI
    applications, including production-grade RAG pipelines on
    GCP.
  - Leverage the Vertex AI platform to train, fine-tune, and
    deploy machine learning and generative AI models.
  - Design and implement complex agentic workflows to automate
    and optimize business processes.
  - Develop, consume, and host mission-critical REST APIs using
    Python, deployed as containerized applications on Cloud
    Run.

  Data Engineering & Pipelines:

  - Design, develop, and maintain scalable batch and streaming
    data pipelines using Python, SQL, Cloud Composer, and
    Pub/Sub.
  - Develop and optimize complex SQL queries in BigQuery for
    large-scale data analysis, extraction, and transformation.
  - Automate data quality and ETL testing procedures using
    Python and SQL.

  Infrastructure & Operations:

  - Develop and deploy all cloud infrastructure as code using
    Terraform.

  - Implement and manage CI/CD pipelines for data and AI
    applications, including automated testing, security
    checks, controlled environment promotion, and reliable
    production deployment.

  - Own security and governance controls for data and AI
    solutions, including IAM, least-privilege access,
    encryption, secrets management, audit logging, data
    protection, and compliance with enterprise standards.

  - Serve as a key escalation point for complex L3 production
    issues, providing expert troubleshooting and resolution

  Your skills and experience

  Mandatory Engineering Skills:

  - 10+ years of IT experience as a hands-on engineer, including
    responsibility for designing, building, deploying, and
    supporting large-scale data systems in production.

  - Expert-Level Languages: Deep proficiency in Python and
    advanced SQL, including complex query optimization and
    data modelling.
  - Cloud Platform: Extensive hands-on experience building
    solutions on GCP. Experience with Azure or AWS is also
    valuable.

  - Core GCP Services: Mastery of BigQuery, Cloud Composer (or
    Apache Airflow), and Cloud Run in production environments.

  - Infrastructure & Automation: Proficient in defining
    infrastructure as code using Terraform and designing and
    managing robust CI/CD pipelines using Cloud Build,
    Artifact Registry, automated testing, vulnerability
    scanning, and environment-based release strategies.

  Advanced Technical & Design Expertise: We expect candidates
  to have deep, practical experience in the following areas,
  with a portfolio of projects demonstrating their expertise.

  - System Design: Strong understanding of modern data patterns,
    distributed systems, and architectural best practices.

  - Conversational AI: Hands-on experience designing and
    developing conversational AI solutions and chatbots using
    Dialog flow CX (Conversational Agents) or CX Agent Studio.

  - Gemini Enterprise Agent Platform: Extensive hands-on
    experience building enterprise AI solutions using the
    Gemini Enterprise Agent Platform, including agent
    configuration, integration, evaluation, security,
    deployment, and operational monitoring.

  - Generative AI Systems: Proven experience building and
    deploying production-grade RAG (Retrieval-Augmented
    Generation) systems. Deep understanding of LLMs (like
    Gemini), vector databases, and embedding models.

  - Agentic AI Application & Workflow Development: Strong
    practical experience designing and developing agentic AI
    applications, complex workflows, agentic patterns, and
    multi-agent systems using the Google Agent Development Kit
    (ADK). Knowledge of concepts such as the A2A (agent-to-
    agent) protocol and agent cards is highly desirable.

  - AgentOps & Application Hosting: Demonstrable experience in
    operationalizing AI models and hosting applications using
    containers (Docker).

  How we’ll support you

  - Training and development to help you excel in your career
  - Coaching and support from experts in your team
  - A culture of continuous learning to aid progression
  - A range of flexible benefits that you can tailor to suit
    your needs

  About us and our teams

  Please visit our company website for further information:

  https://www.db.com/company/company.html

  We strive for a culture in which we are empowered to excel
  together every day. This includes acting responsibly,
  thinking commercially, taking initiative and working
  collaboratively.

  Together we share and celebrate the successes of our people.
  Together we are Deutsche Bank Group.

  We welcome applications from all people and promote a
  positive, fair and inclusive work environment.
