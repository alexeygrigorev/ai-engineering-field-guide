description: |
  About Nominal

  Our mission is to accelerate how the world engineers new
  hardware. Nominal's connected test and operations platform
  powers the world's most advanced hardware programs and its
  most ambitious startups, from spacecraft, racecars, and
  autonomous vehicles to next-generation defense and energy
  programs. Our customers include Anduril, Shield AI, Hermeus,
  Albedo, Shinkei, and Pratt Miller Motorsports, as well as
  U.S. Navy and U.S. Air Force programs. Now we're expanding
  across the entire hardware lifecycle, building the
  foundation, AI-native applications, and agents that
  accelerate innovators' work and change what's possible to
  build.

  We're backed by Sequoia, General Catalyst, Founders Fund,
  Lux Capital, and Lightspeed, and our team comes from SpaceX,
  Apple, Palantir, Anduril, Applied Intuition, and other
  leading companies.

  About Hardware Intelligence

  We're the team behind Nominal's agents, AI-native
  applications, and MCP, and its forward-leaning AI bets. Our
  mission is to unlock the bottlenecks of the hardware
  lifecycle with AI. Our agents reason over physical reality,
  from high-rate telemetry and test campaigns to designs and
  simulations, where real test results are the ground truth
  their work is checked against. We believe opinionated AI,
  built for the real work of hardware programs, will change
  how the world engineers.

  We're collaborative, iterative, and high-agency, and we're
  human-centered and customer-focused. We build with the
  newest AI tools every day, and because those tools keep
  changing, so do we: we stay curious and keep looking for the
  better way. Our team spans data science and ML, distributed
  systems, search, and knowledge systems, and we obsess over
  how agents can be genuinely useful to the engineers who rely
  on them.

  The Role:

  As a Staff Product Engineer, you'll take agent products from
  zero to one, turning new ideas into prototypes and
  prototypes into products engineers love, and lead the team
  that builds them, from the agents engineers use every day to
  the AI-native apps that come next.

  💼 What You'll Do:

  - Prototype new agent products and interactions in days,
    putting working ideas in front of engineers before
    anything is spec'd.
  - Take the best ideas from zero to one: shape the product,
    build it end to end, and ship it.
  - Obsess over the user experience: watch engineers work, find
    where agents help and where they get in the way, and fix
    it.
  - Set the patterns for agent UX across Nominal: streaming work
    as it happens, showing every step, citing sources, and
    letting engineers edit and take over.
  - Turn hardware workflows (reviews, qualification, reporting)
    into agent-native products, not chat bolted onto old
    screens.
  - Lead technically across product engineers, and partner
    closely with design, product, and the agent platform team.

  🚀 What you'll bring:

  - 8+ years building products end to end, with a strong front-
    end and full-stack core.
  - A track record of taking products from zero to one,
    including AI or agent experiences users chose to use
    daily.
  - Product sense and taste: you know what makes a great product
    great, what to build, what to leave out, and why.
  - Deep empathy for users, and the habit of learning from them
    directly.
  - A track record of setting product engineering direction
    across a team and raising the bar for the engineers around
    you.
  - You build with modern AI coding agents (Claude Code, Cursor,
    Codex) every day, and stay curious and open to better ways
    of working. The tools keep changing, and so do we.

  ⚡️ Nice to have:

  - You've designed agent interaction patterns others adopted:
    streaming work, reviewable steps, human takeover.
  - You've built tools for technical users who live in data:
    notebooks, IDEs, observability, or CAD.
  - You've led product engineering at a company known for its
    craft.
  - You've founded a company or been an early engineer at a
    product-led startup.

  Benefits/Perks

  - 🏥 100% coverage of medical, dental, and vision insurance
  - 🏖️ Unlimited PTO and sick leave
  - 🍽️ Free lunch, snacks, and coffee
  - 🚀 Professional Development Stipend
  - ✈️ Annual company retreat

  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, or national origin.

  ITAR Requirements

  To conform to U.S. Government export regulations, applicant
  must be a (i) U.S. citizen or national, (ii) U.S. lawful,
  permanent resident (aka green card holder), (iii) Refugee
  under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158,
  or be eligible to obtain the required authorizations from
  the U.S. Department of State. Learn more about the ITAR
  here.
