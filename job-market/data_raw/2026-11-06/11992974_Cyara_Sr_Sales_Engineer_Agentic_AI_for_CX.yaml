title: Sr. Sales Engineer – Agentic AI for CX
company: Cyara
location: USA
remote: true
work_type: FULL_TIME
description: |
  As the global leader in AI-powered customer experience
  assurance, we help some of the world's most recognized
  brands deliver seamless, reliable, and engaging interactions
  across voice, digital, messaging, and AI-powered channels.
  Every year, our platform helps optimize hundreds of millions
  of customer journeys, ensuring businesses can confidently
  deliver exceptional experiences at scale.

  As enterprises race to deploy agentic AI, the defining
  question is no longer whether AI can handle customer
  interactions, it’s whether those interactions can be
  trusted. Cyara is the confidence layer that answers that
  question, testing AI agents with AI agents to detect
  hallucinations, validate decisions, and ensure compliance
  before failures ever reach your customers.

  Joining Cyara means helping shape the future of customer
  experience, partnering with some of the world’s biggest
  brands, and working alongside passionate, talented people
  who are committed to making every customer interaction
  better.

  Let's talk about the role and responsibilities:

  - Ownership: Own the technical sales engagement from first
    discovery through technical win.
  - Discovery: Lead deep discovery on customers’ CX tech stack,
    AI agents, quality and compliance risks, and success
    criteria.
  - Solution design: Design closed-loop assurance solutions that
    test, monitor, and observe customers’ AI agents across
    their CX stack.
  - Demos and workshops: Deliver tailored demos, overviews, and
    workshops that connect the platform to customers’ AI agent
    quality and compliance goals.
  - Proofs of concept: Scope and run POCs that validate the
    platform against customer success criteria.
  - Business case: Quantify the cost of AI failure and the
    efficiency gained through assurance for executive buyers.
  - Collaboration: Partner with Sales, Product, and
    Implementation on RFPs, objections, and delivery handoff.
  - Enablement: Create reusable demos and materials, and mentor
    teammates on agentic AI technology and prompt engineering.

  Let’s talk about your skills and expertise:

  - Pre-sales experience: 5+ years in pre-sales or solutions
    engineering with C-level and VP-level stakeholders.
  - CX technology: Solid understanding of the CX tech stack,
    including CCaaS, IVR, CRM, and digital channels.
  - Agentic AI experience: Strong, proven experience with how AI
    agents and agentic workflows are built, deployed, and
    behave in CX environments.
  - AI technology: Deep knowledge of the agentic tech stack:
    LLMs, RAG, tool calling, orchestration, and MCP.
  - Prompt engineering: Advanced prompt engineering skill, from
    reading agent system prompts to crafting adversarial test
    scenarios.
  - AI observability: Strong grasp of AI agent quality and
    compliance monitoring: evaluation, hallucination
    detection, and policy adherence.
  - Closed-loop assurance: Understanding of how testing,
    monitoring, and observability combine so production
    failures feed new tests.
  - Discovery and solutioning: Exceptional ability to turn
    complex CX and AI requirements into sound technical
    solutions.
  - Communication: Credible storytelling that links technology
    to business outcomes for executive and technical
    audiences.
  - Education: Bachelor’s degree in Computer Science, IT, or a
    related field, or equivalent experience.

  Preferred experience:

  Why you should join us:   Looking for a place where your
  ideas matter, your growth is accelerated, and your work
  creates real impact? Welcome to Cyara.

  We're building the assurance layer that gives enterprises
  the confidence to deploy agentic AI at scale with a global
  team that values curiosity, collaboration, and continuous
  learning. Whether you're launching new ideas, solving
  complex problems, or learning from talented colleagues
  across the world, you'll be surrounded by people who
  challenge and support you to do your best work.  At Cyara,
  inclusivity isn't a buzzword, it's part of who we are. We
  foster a culture where everyone feels seen, heard, and
  empowered to contribute. Pair that with competitive pay,
  comprehensive benefits, flexible work options, recognition
  programs, and a strong focus on employee well-being, and
  you've got a workplace designed for both success and
  fulfilment.

  Big opportunities. Real impact. Amazing people. That's the
  Cyara experience.

