description: |
  Build What Matters at RevStar

  Position: Data & AI Engineer

  - Reports To: Product Manager/Engineering Lead
  - Location: Remote (AZ, DC, FL, GA, IA, IL, ME, NY, NJ, SC,
    TX, VA)
  - Employment Type: Full-Time W2

  Job Summary

  Ready to build greenfield Lakehouse solutions at the
  bleeding edge of AI and big data? RevStar is an innovation
  shop and official Databricks Partner launching a dedicated,
  cloud-agnostic Data, ML, and AI practice. Tired of spending
  months in endless corporate approval loops only to build AI
  concepts that never reach production? We turn modern
  Lakehouse architectures and production AI into live,
  scalable enterprise solutions in fast-paced execution
  cycles. We build fast, cut bureaucratic red tape, and ship
  production-ready solutions for client founders and tech
  leaders who value real engineering impact. In this role, you
  will work directly with data architects, scientists, and
  client leaders to turn complex data into scalable,
  production-ready AI models. Above all, our team operates on
  three core principles:

  - Self-Mastery: We hold a high bar for how we think,
    communicate, and improve.
  - Ownership: We own outcomes, not just effort.
  - Shared Destiny: We rise or fall together.

  Your Impact Pillars

  - Databricks Lakehouse & Pipeline Engineering: Design, build,
    and optimize scalable ETL/ELT pipelines using Apache Spark
    and Delta Lake across multi-cloud environments (AWS,
    Azure, GCP). Implement robust Lakehouse architectures that
    seamlessly process both structured and unstructured data
    at enterprise scale. Automate data ingestion, storage, and
    feature engineering workflows to support downstream
    analytics and real-time AI workloads.
  - Performance Tuning & MLOps Integration: Fine-tune Spark jobs
    for low latency, high throughput, and maximum cloud cost-
    efficiency across client environments. Partner with ML
    engineers and data scientists to operationalize AI models
    inside Databricks using MLflow for tracking, versioning,
    and deployment. Implement robust CI/CD pipelines and
    Infrastructure-as-Code (Terraform, Databricks CLI) to
    establish automated, production-grade deployments.
  - Data Governance & Client Leadership: Enforce enterprise data
    security, access controls, and compliance standards (GDPR,
    HIPAA, SOC 2) within Unity Catalog and cloud ecosystems.
    Collaborate directly with client tech leaders, product
    managers, and engineering teams to translate complex AI
    data requirements into clear business outcomes. Author
    clean technical documentation and lead seamless solution
    handoffs to client engineering teams upon project
    completion.

  Requirements

  What You Bring

  Benefits

  - Paid Time Off – Take the time you need to recharge and stay
    productive.
  - Remote-First Working Environment – Collaborate from anywhere
    while staying connected with our global team.
  - Comprehensive Health Coverage – Medical, Dental, Vision
  - 401(k) Retirement Plan – Plan for your future with access to
    a company-sponsored 401(k) program.
  - Annual Learning & Development Stipend – Invest in your
    skills with conferences, certifications, or courses.
  - Peer Mentorship & Coaching – Learn from experienced
    engineers, product managers, and architects to accelerate
    your growth.
  - Professional Growth Opportunities – Exposure to cutting-edge
    AWS GenAI, data, and cloud technologies across diverse
    industries.
  - Company Outings & Volunteer Opportunities – Build
    relationships and give back to the community.
  - Collaborative, Innovative Culture – Work alongside top
    talent in a fast-paced, supportive environment that values
    curiosity and initiative.

