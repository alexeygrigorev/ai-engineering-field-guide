description: |
  Job Description

  Fabletics is looking for a AI Enablement Engineer for our
  internal AI and product teams.

  Fabletics is seeking a talented and experienced AI
  Enablement Engineer to join our team. Across the company,
  people who aren’t engineers (we call them Builders) are
  already using AI and AI-assisted coding tools to get
  internal apps and prototypes most of the way there on their
  own. This role focuses on closing the last mile: making that
  work secure, scalable, tested, observable, and maintainable
  so it can reach production. The ideal candidate is a strong
  engineer who is also a patient enabler, someone who
  multiplies other people’s output by unblocking, reviewing,
  and hardening their work rather than taking it over.

  This position will report to VP, Architecture and AI
  Technologies

  What you will do:

  - Design and lead training for our Builder Program
  - Advise Builders on architecture and tooling early, so they
    start a use case on a sound foundation instead of
    refactoring later.
  - Give Builders a technical safety net as they build: answer
    questions, unblock, and steer decisions without taking the
    work over.
  - Review, harden, and deploy Builder-created apps, covering
    secure auth and secrets handling, data governance,
    testing, CI/CD, monitoring, and documentation.
  - Define the production path and a clear support model for
    each app, including who owns it after launch, so you don’t
    become the default permanent owner of everything.
  - Build reusable templates, starter kits, and guardrails that
    turn one good solution into a pattern everyone can reuse.
  - A few times a quarter, take on complex, cross-functional, or
    strategic builds end-to-end: scope, architect, build, and
    ship them tested, documented, and packaged as reusable
    templates.
  - Make Builders measurably more self-sufficient over time, so
    each new build is faster and safer than the last.
  - Partner with engineering, security, and data teams when
    builds need deeper review, and raise the bar on production
    standards across the company.

  What you can bring:

  - 5 of professional software development experience, at a
    senior or staff level of judgment and ownership.
  - Deep, hands-on experience across the full path to
    production: architecture, secure auth and secrets
    handling, data modeling and governance, testing, CI/CD,
    monitoring, and documentation.
  - Experience building AI applications, including LLM APIs,
    prompt engineering, agents, RAG, and evals/testing, with
    sound judgment about where AI fits and where it doesn’t.
  - Comfort across a modern, fast-moving stack such as Next.js
    and Vercel, Supabase and Postgres, GitHub, and automation
    tools like Zapier, Make, n8n, or Retool. These tools are
    illustrative; the ability to learn and reason across a
    stack matters more than any specific one.
  - Proven ability to teach, unblock, and review the work of
    non-engineers patiently and pragmatically, raising the
    quality bar without seizing the keyboard.
  - Pragmatism about production standards: you know which
    corners can be cut for an internal prototype and which
    absolutely cannot.
  - Experience building internal platforms, developer
    enablement, or “paved road” tooling a plus.
  - Ideal candidate brings foundational AI literacy, including
    experience using generative AI tools, and a proactive
    mindset to experiment with new technologies to drive
    productivity and innovation.
  - Background in technical coaching, mentorship, or enabling
    low-code/citizen developers a plus.
  - Familiarity with AI-assisted frontend tools such as v0, and
    with edge/serverless patterns, a plus.

  Where We Are:

  - This role will be based in our El Segundo Headquarters

