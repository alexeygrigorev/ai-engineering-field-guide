description: |
  The AI Security Engineer is responsible for building and
  running the security controls that find and govern the use
  of artificial intelligence across Danaher, including chat
  tools, AI platforms, and autonomous agents. The engineer
  configures and tunes policies and detections in CrowdStrike
  Falcon and AI gateways, and builds the automation that lets
  Danaher adopt AI safely.

  This position reports to the Senior Manager, AI Security &
  Governance and is part of the DIS Corporate Cybersecurity -
  AI Security team located in Bangalore or Pune India and will
  be an on-site role.

  In this role, you will have the opportunity to:

  - Configure, tune, and maintain security policies for the AI
    control plane in CrowdStrike Falcon AI Detection and
    Response (now Falcon Guardian) and Falcon Shield,
    including access rules, prompt rules, and report,
    transform, or block actions.
  - Manage policy and configuration for AI gateways that cover
    gaps the CrowdStrike tools cannot reach.
  - Build alerts and detections for unapproved AI use, risky
    agent behavior, and policy violations, aligned to the
    OWASP Top 10 for Large Language Model Applications.
  - Build the automation yourself: prove a task by hand in the
    platform, then automate it with Python, PowerShell, and
    platform APIs.
  - Contribute to AI security design with the AI Security
    Architect, and coordinate with the Security Operations
    Center and the CrowdStrike engineering team.

  The essential requirements of the job include:

  - Bachelor’s degree in Cybersecurity, Computer Science,
    Information Technology, or a related field.
  - 9+ years of security engineering experience, including
    hands-on work on endpoint, software-as-a-service, or cloud
    security platforms.
  - Hands-on experience deploying, configuring, or customizing
    CrowdStrike Falcon, such as policy authoring,
    integrations, detection logic, or console administration.
  - Experience writing and tuning detection logic and security
    policy, and building automation for it with Python,
    PowerShell, or platform APIs.
  - Working knowledge of the OWASP Top 10 for Large Language
    Model Applications, including how prompt injection, data
    leakage, and excessive agency map to policy or detection
    logic.

  It would be a plus if you also possess previous experience
  in:

  - CrowdStrike Falcon AI Detection and Response (now Falcon
    Guardian) or Falcon Shield.
  - AI gateways or AI security platforms (such as JetStream,
    LiteLLM, or Prisma AIRS), or security for Copilot Studio
    and Power Platform.
  - Securing autonomous AI agents or Model Context Protocol
    servers.

  Join our winning team today. Together, we’ll accelerate the
  real-life impact of tomorrow’s science and technology. We
  partner with customers across the globe to help them solve
  their most complex challenges, architecting solutions that
  bring the power of science to life.

  For more information, visit www.danaher.com.
