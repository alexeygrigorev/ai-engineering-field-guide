description: |
  Company Overview

  Arcesium is a global financial technology firm that solves
  complex data-driven challenges faced by some of the world’s
  most sophisticated financial institutions. We constantly
  innovate our platform and capabilities to meet tomorrow’s
  challenges, anticipate the risks our clients encounter, and
  design advanced solutions to help our clients achieve
  transformational business outcomes.

  Financial technology is a high-growth industry as change and
  innovation continue to disrupt the status-quo and prompt
  major transformation. Arcesium is at a particularly
  interesting time in our own growth as we look to leverage
  our successfully established market position and expand
  operations in pursuit of strategic new business
  opportunities. We value intellectual curiosity, proactive
  ownership, and collaboration with colleagues, and we empower
  you to meaningfully contribute from day one and accelerate
  your professional development.

  Position Summary

  Arcesium is building a Corporate AI Transformation team, and
  you will be one of its few first members. As a Forward
  Deployed Engineer, you will work closely with business,
  operations and engineering teams to identify high-impact
  internal use cases and convert them into working AI
  solutions that run in production.

  This is not a traditional backend or application engineering
  role. You will operate like a builder, systems engineer, and
  product thinker rolled into one. You will take ambiguous
  business problems, break them into solvable workflows,
  design the agent architecture, and ship production-grade
  internal tools. You will work with Arcesium's corporate
  systems, data assets, and AI tech stack to build agents and
  automations that reduce manual effort, improve decision-
  making, and scale repeatable work. Success for this role
  isn’t just measured by shipping a prototype or completing a
  project, it’s measured by putting solutions into production
  and driving meaningful adoption and impact.

  The ideal candidate brings strong engineering fundamentals,
  a builder’s mindset, and a passion for using AI to improve
  how work gets done. This is a high-impact role for someone
  who wants to build AI solutions that meaningfully improve
  enterprise processes.

  Responsibilities

  - Partner with business and functional teams to find the
    opportunities: workflow automation, AI-assisted decision-
    making, and work that agents can take on.
  - Understand complex operational processes across teams and
    convert them into structured problem statements, system
    designs, and technical workflows.
  - Build agents, workflow automations, and internal
    applications on top of Arcesium's corporate data systems,
    and enterprise tools.
  - Rapidly prototype using LLMs, agent frameworks, MCPs. Get
    something small in front of real users early and iterate
    on their feedback.
  - Design agent architectures that complete business tasks
    reliably.
  - Work with engineering, business, and security teams to take
    prototypes to move prototypes into scalable, maintainable
    solutions.
  - Evaluate build-vs-buy options for AI workflows and identify
    the right technical approach for each use case.
  - Create reusable components, templates and playbooks that
    accelerate this work across the firm.
  - Define the KPIs, measure the impact, and drive adoption.

  Qualifications

  - 6+ years of hands-on engineering experience, with a track
    record of shipping systems that other people depend on.
  - Strong engineering fundamentals across APIs, data, and
    systems design.
  - Experience building internal tools or automation systems for
    business teams.
  - The ability to understand a platform quickly, build on top
    of it, and turn business context into reliable technical
    solutions.
  - Systems thinking. You can hold a whole workflow in your
    head, see where it is structurally inefficient, and
    redesign it rather than automate it as it stands.
  - A bias to ship iteratively. You get a thin version into real
    use, learn from it, and improve it, instead of waiting for
    a complete design.
  - Credibility with senior business and technology leaders, and
    the ability to say hard things clearly to both.
  - Comfort with ambiguity and ownership. You will pick your own
    problems as often as you are handed them.

  The expected annual base salary for this position is
  $200,000 - $250,000. Our compensation package includes
  variable compensation in the form of a year-end bonus,
  guaranteed in the first year of hire, benefits including
  medical and prescription drug coverage, and 401k
  contribution matching.

  The applicable annual base salary paid to a successful
  applicant will be determined based on multiple factors
  including without limitation the nature and extent of prior
  experience and educational background.

  Arcesium's Personal Data Privacy Notice for Candidates is
  linked here.

  Recruiting Security Emails from genuine Arcesium recruiters
  who are employees of the company will always come from the
  @arcesium.com domain. In some cases, you may also be
  contacted by independent search firms engaged to recruit on
  our behalf; emails from their employees should always come
  from their firm's applicable domain. We'll never ask for
  your banking information or any payment as part of the
  recruiting process. If something seems off or you're
  contacted by an unexpected third party, please reach out to
  us at careers@arcesium.com (US/UK), careers-
  india@arcesium.com (India) or careers-europe@arcesium.com
  (Portugal/Sweden).

  Arcesium is an equal opportunity employer.
