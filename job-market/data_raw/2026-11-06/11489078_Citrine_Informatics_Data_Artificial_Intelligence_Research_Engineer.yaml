  Our Core Values

  Citrine Informatics recognizes that its most valuable asset
  is its people. We have created our set of Core Values to
  encourage, support, and invest in our team as they work to
  innovate and support a more sustainable world. Our Core
  Values reflect our ongoing commitment to continuously invest
  in nurturing our talent and our people-first approach to
  conducting business.

  - We take pride in and recognize the successes and growth of
    ourselves and our colleagues. We support each other in our
    growth.

  - We prototype and collect data to make good decisions. We
    question that data and are constantly iterating to find
    the best solution.

  - We are all owners of Citrine and make decisions like owners.
    We work autonomously with personal and organizational
    accountability.

  - We commit to building a diverse and inclusive community
    within Citrine and actively promote equity and belonging.

  - We are tirelessly committed to creating value for our
    customers.

  - We exist to help our customers accelerate the development of
    sustainable products that are critical to the future of
    both our planet and our industry.

  Compensation and Pay Transparency

  At Citrine, we want your path to career growth to be
  transparent, straightforward, fair, and easily accessible --
  starting with your application and interview process. The
  annual salary range listed below reflects the level we are
  considering for this position (please note that there may be
  unique situations where you may fall outside of this range).
  Where you fall within the range will depend on how your
  experience and skills align with our internal leveling
  system as we learn more about you throughout the interview
  process.

  $182,000 USD - $210,000 USD

  *Range(s) listed are for full-time employees based in the
  United States only.

