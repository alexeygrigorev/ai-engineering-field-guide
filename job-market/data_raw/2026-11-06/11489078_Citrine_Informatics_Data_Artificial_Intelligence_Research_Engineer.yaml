description: |
  About Citrine Informatics

  At Citrine, we’re using Artificial Intelligence (AI)  to
  enable our customers to usher in the next generation of
  sustainable, high-performing materials and chemicals.

  Our customers love what we do:

  “We understand our own laboratory more than before. It’s fun
  to work in this way.”

  We’re the leader in AI for materials and chemicals. 10 of
  the top 20 chemical companies have trusted us as their AI
  provider and we have created more than $100 Million dollars
  in value for our customers to date. Our no-code SaaS
  platform empowers product developers to accelerate their
  work using chemically-aware data management and AI tools.

  Citrine regularly wins awards for innovation and
  sustainability, earning spots on the CB Insights AI 100 list
  and the Inc. 5000 list of fastest-growing private companies
  in the US. Our customers include leading organizations such
  as LyondellBasell, Evonik, Grace, Avery Dennison, and
  Syensqo. We also collaborate with researchers from world-
  renowned institutions on cutting-edge research at the
  intersection of AI and the physical sciences. Our team is
  exceptional, eager to grow and learn from each other. Team
  members work remotely throughout North America and Europe
  driven by our sustainability mission. We’re growing quickly,
  and looking for the best to join us!

  About the Role

  Data & AI Research Engineering (DARE) is a uniquely
  interdisciplinary team working at the intersection of
  materials science, machine learning, and software
  engineering. We are responsible for researching, developing,
  testing, implementing, and maintaining the core materials-
  aware machine learning functionality that powers the Citrine
  Platform. We collaborate extensively across the company —
  other teams rely on us throughout the product lifecycle to
  translate ideas to math to code and back again.

  Example projects:

  - Improve and maintain our core Python libraries that enable
    our users to apply machine learning to solve the world’s
    most important materials science problems at an industrial
    scale
  - Collaborate with our Product team to shape the future of our
    AI capabilities and support our customer’s unique use
    cases
  - Improve the interpretability of machine learning models and
    develop tools to communicate that information to users
  - Improve our inverse design capabilities that efficiently
    explore complex parameter spaces that characterize real-
    world materials synthesis problems
  - Collaborate with our External Research and Development (ERD)
    team to write and publish papers related to the work we’re
    doing
  - Develop new methods to quantify uncertainty in machine
    learning predictions

  Responsibilities

  - Writing and maintaining Python ML code
  - Researching, prototyping, and developing new materials-aware
    ML models and features
  - Collaborating closely with other engineers, frequently
    reviewing code and best practices
  - Mentoring other developers
  - Designing high-performance, scalable ML systems
  - Testing & analyzing the impact and performance of models
  - Working in a multi-functional team on features from concept
    to delivery

  Skills and Experience

  - 8+ years of professional experience or 3+ years with MS/PhD
    in a quantitative discipline
  - Proficient in a programming language such as Python or Scala
  - Proven history of implementing AI solutions for customers,
    with quantifiable results
  - Experience solving scientific problems with computational
    techniques
  - Ability to communicate complex technical concepts and design
    choices to any audience
  - In depth knowledge of how core ML algorithms work and their
    design (random forest, neural networks, etc.)
  - Ability to write tested, production-quality code
  - Legally eligible to work in the United States

  Preferred Skills and Experience

  - Experience with or a degree in Materials Science
  - Extensive knowledge of statistics
  - Experience with LLMs
    - Bonus points if you’ve pre-trained or fine-tuned foundation
      models!
  - SQL and relational databases
  - Close integration with various AWS services (S3, RDS, SQS,
    etc)
  - Published papers that establish you as a domain expert in
    AI/ML, NLP, or CV

  Equal Opportunity

