  Software Development Engineer II - AI and Optimization



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  About the role

  As a Full Stack Software Development Engineer in HPE's
  Product Security Office, you will design, develop,
  troubleshoot, and enhance AI/ML-powered security
  applications. You will work on modern web applications and
  services using the MERN stack and Python while contributing
  to solutions that leverage AI/ML, large language models,
  cloud technologies, and automation.

  This is a hands-on engineering role where you will
  contribute to application development, testing, integration,
  debugging, and continuous improvement activities while
  working closely with software engineers and cross-functional
  teams to deliver reliable, high-quality solutions.

  About you

  You are an engineer who enjoys solving technical problems
  and building reliable applications. You bring strong
  application development skills, a collaborative mindset, and
  a willingness to learn new technologies and approaches.

  You are comfortable translating requirements into working
  solutions, debugging complex issues, participating in
  technical discussions, and contributing to software quality
  through testing, automation, and continuous improvement. You
  communicate effectively with team members and stakeholders
  and enjoy working in a collaborative engineering
  environment.



  What you’ll do:

  - Design enhancements, updates, and programming changes for
    application components, services, and supporting systems.

  - Analyze design requirements and determining coding,
    programming, testing, and integration activities required
    to meet project objectives.

  - Develop application functionality using established
    engineering standards, development practices, and project
    guidelines.

  - Execute test plans, debugging software issues, and
    identifying opportunities for improvements in code
    quality, performance, and reliability.

  - Participate as a member of cross-functional engineering
    teams to develop reliable, cost-effective, and high-
    quality software solutions.

  - Collaborate with engineering teams and development partners
    to communicate design status, project progress, and issue
    resolution activities.

  What you need to bring:

  - Bachelor's or Master's degree in Computer Science,
    Information Systems, or a related discipline, or
    equivalent practical experience.

  - Typically 2-4 years of software development experience.

  - Experience developing applications using the MERN stack and
    Python.

  - Experience working with CI/CD pipelines and tools such as
    GitOps, Docker, Jenkins, GitHub Actions, or similar
    technologies.

  - Experience designing, developing, testing, and debugging
    software applications and services.

  - Experience working with software testing methodologies,
    execution of test plans, debugging practices, and testing
    tools.

  - Experience designing software solutions across multiple
    platform types.

  Experience and expertise

  - Familiarity with AI/ML, cloud technologies, MLOps, large
    language models, and agentic AI concepts.

  - Understanding of OWASP Top 10 vulnerabilities and secure
    coding practices.

  - Experience using software design tools, frameworks, and
    programming languages.

  - Ability to apply analytical and problem-solving skills to
    technical challenges.

  - Strong written and verbal communication skills, including
    the ability to communicate technical concepts, design
    proposals, and implementation options effectively.

  - Ability to work collaboratively across engineering teams
    while delivering high-quality technical outcomes.

