description: |
  Who We Are:

  Real REMAX Group (Nasdaq: REAX) is a global real estate
  company bringing together two trusted brands and a shared
  belief: when real estate professionals are empowered by
  innovation and community, everyone benefits. By combining
  Real’s AI-powered technology platform and entrepreneurial
  community with REMAX’s iconic global brand and trusted
  franchise network, we’re building one of the industry’s most
  innovative real estate companies. Together, our network of
  more than 180,000 real estate professionals spans over 120
  countries and territories, united by a commitment to helping
  agents and brokers build stronger businesses and deliver
  exceptional experiences for their clients.

  At the Real REMAX Group, we believe in pairing Tech x
  Humanity to create something truly different.

  Learn more at RealREMAXGroup.com

  Work Schedule: IST 2:30 PM-11:30 PM | Monday - Friday

  About the Role:

  We are seeking a skilled and motivated Senior AI Systems
  Engineer to join

  our R&D Team at the Real REMAX Group. The ideal candidate
  will have a strong foundation in software engineering, with
  hands-on experience in building Generative AI systems, LLM-
  driven applications, and agentic pipelines to solve real-
  world problems. The candidate should also have experience
  with AI-assisted software development using tools such as
  Claude and Codex.

  In this role, you will work transversely across the company,
  embedding AI-driven

  solutions into various facets of our business, including
  operations, customer experience, and product development,
  with a strong emphasis on scalable system design and
  production deployment.

  What You’ll Do:

  - Design, develop, and deploy reliable AI-powered software
    systems to enhance real estate operations, customer
    experience, and product innovation
  - Build and optimize agentic pipelines, including
    orchestration, tool integration, and feedback loops
  - Work closely with various teams (e.g., operations,
    marketing, product development) to identify and prioritize
    opportunities for AI and LLM integration
  - Architect and maintain scalable, production-grade AI systems
    using Python, cloud platforms, and modern AI frameworks
    (e.g., Pydantic AI or similar orchestration tools)
  - Implement event-driven and asynchronous architectures to
    support high-performance AI applications
  - Stay informed about the latest trends and advancements in
    Generative AI and agentic development to drive innovation
    and maintain competitive advantage
  - Troubleshoot, optimize, and refine AI systems to ensure high
    performance, reliability, and scalability in production
    environments
  - Maintain thorough documentation of systems, processes, and
    results; communicate findings and progress to stakeholders

  What You’ll Bring:

  - Strong programming skills in Python, with experience in
    building and deploying production-grade systems
  - Experience working with Generative AI / LLM-based
    applications and workflows
  - Solid understanding of system design, scalable
    architectures, and model deployment strategies
  - Familiarity with agentic workflows, orchestration
    frameworks, and multi-step AI pipelines
  - Understanding of asynchronous processing, event-driven
    systems, and distributed architectures
  - Experience with containerization (e.g., Docker) and cloud
    platforms
  - Strong problem-solving skills with the ability to analyze
    complex systems and implement effective solutions in a
    dynamic environment
  - Excellent interpersonal skills, with the ability to
    communicate technical concepts to non-technical
    stakeholders effectively
  - Willingness to learn and adapt to new technologies and
    methodologies as the field of AI continues to evolve
  - Experience managing multiple projects simultaneously, with a
    focus on meeting deadlines and delivering high-quality
    work

  Education & Experience:

  - Minimum of 5 years of experience working with Python in
    production
  - environments
  - At least 2 years of experience in building AI-based software
    systems
  - Bachelor’s degree in Computer Science or related field

  How We Work: Our Operating Principles

  Our Operating Principles are the blueprint of Real REMAX
  Group’s culture. They guide how we show up, make decisions,
  and bring our mission to life every day:

  - Be Agent Obsessed: We design every decision around creating
    value for our agents and their clients.
  - Move Fast with Purpose: We act with urgency, clarity, and
    focus—without compromising our standards.
  - Own Your Outcome: Effort matters, but results matter more.
    We adapt, learn, and improve.
  - Be Bold; Challenge Often: We challenge assumptions, rethink
    “the usual,” and push for smarter, simpler solutions.
  - Win Together: We set high standards, collaborate deeply, and
    celebrate shared success.

  Additional Details:

  - Physical Requirements: Ability to sit for long periods of
    time.

  Our Commitment:

  Real REMAX Group is proud to be an equal opportunity
  employer. We celebrate diversity and are committed to
  building an inclusive environment for all employees. We
  welcome applicants of all backgrounds and identities, and we
  do not discriminate on the basis of race, color, ancestry,
  religion, sex, sexual orientation, gender identity or
  expression, age, marital or family status, disability,
  citizenship, veteran status, or any other status protected
  by applicable law.
