description: |
  About Fluidstack

  We exist to make humanity more free. For most of human
  history, you farmed or you starved. Technology gave people
  more time for the things they wanted to do, instead of
  things they had to do. Powerful AI will be the biggest lever
  for human choice we've ever built - but only if models are
  aligned with what humanity actually wants. There are groups
  building AI who don't share these goals. Whoever deploys
  frontier compute infrastructure fastest will decide whether
  AI expands human freedom or shrinks it.

  We're singularly focused on delivering 10 to 100s of GWs of
  compute faster than anyone else, rethinking every layer of
  the stack. We acquire power, design and build data centers,
  and operate them - with teams spanning hardware and
  software. Speed and scale are our key differentiators. Come
  be a part of building civilization-scale infrastructure for
  AI.

  We hire people who care deeply about this problem space. If
  that is you, please apply!

  How We Operate

  - Be a barrel. Full autonomy. Own things end to end, take on
    scope without being asked, no permission required to
    operate outside your core role.
  - Insane urgency. We drive everything forward as fast as
    possible.
  - Reason from first principles. Challenge every assumption.
    Zero analogy thinking, no egos, the best idea wins.
  - Love of the game. The frontier of AI is the most interesting
    problem of our time. We put in long hours at high
    intensity to push the frontier forward.
  - Build something that actually matters. If you're going to
    spend your time, spend it on something that matters to the
    world.

  The Decision Team

  Examples of key problems the team is working on

  - Automate the delivery of gigawatts. Every process that takes
    AI infrastructure from land to live compute becomes
    software: schedules, decisions, and todos generated from a
    live knowledge graph instead of chased by hand.
  - Forward-deploy beside the experts. Product teams sit with
    quality managers, sourcing leads, and deployment engineers
    on factory floors and sites, and turn their judgment into
    systems that reach every unit.
  - Deliver every supercomputer faster than the last. Dozens of
    concurrent projects feed one graph, so every lesson
    learned at one site becomes a preventive check at all of
    them.

  Role Scope

  - Build the hiring machine as software. Hiring is the
    company's biggest bottleneck. Every role, seat, and
    interview loop already lives in one graph, and you take it
    the rest of the way: the recruiting system synced both
    directions, interviewer supply and load visible to every
    hiring manager, and onboarding generated the moment an
    offer is signed, so day one starts with the job instead of
    the checklist.
  - Build the cash view the company runs on: today no system
    derives near term spend, so finance forecasts by hand and
    misses what construction already committed. You turn
    purchase orders, contract terms, and build milestones into
    an order schedule, a cash demand curve by month, and a
    payment schedule that recompute as procurement and
    construction move.
  - Build one capital pipeline from approved budget to released
    capital to spent dollar, gated on build milestones the
    delivery system already verifies, with the proof chain
    behind every financing drawdown assembled automatically,
    so releasing nine figures takes a day of judgment and
    funding follows construction within days.
  - Parse every MSA, change order, and side letter into
    obligations, prices, deadlines, penalties, and SLAs, so a
    delivery lead gets what we owe a customer at a site with
    the clause attached, a change order arrives with its legal
    and finance checks done, and the corpus of executed deals
    prices the next negotiation.
  - Embed forward-deployed with finance, treasury, accounting,
    legal, and people teams through a close, a drawdown, a
    negotiation, and a hiring loop, and turn their approvals,
    contract terms, screens, and reconciliations into
    structured data and generated work, including a continuous
    close where capitalization and depreciation post as events
    the moment they happen.

  What We're Looking For

  The below is a starting point. We always make space for
  exceptional people, so if you don't fit this role exactly,
  tell us where you would.

  - You've shipped production code in Go, Python, or TypeScript,
    and you pick up whatever language the problem demands.
  - You've built real features on LLM APIs (OpenAI, Anthropic,
    or open-weight models), MCP servers, and agentic
    frameworks.
  - You work daily with AI coding tools like Claude Code and
    Cursor, and you get agents doing useful work autonomously
    alongside you.
  - You identify problems, design the solution, and ship it
    without waiting for direction or approval.
  - You've moved fast under deadline while leaving foundations
    that other engineers extended after you moved on.
  - You've earned credibility with experts outside engineering:
    finance leads, lawyers, recruiters, or auditors, and
    driven adoption of your software inside their real
    deadlines, like a working close calendar or an offer that
    has to go out today.
  - Your product taste shows in what you've shipped: a
    controller, a recruiter, or a lawyer calls your interface
    obvious, and the workflow matches how their work actually
    happens.
  - Bonus: ERP and fixed asset accounting. FP&A, cash
    forecasting, and capital planning. Structured finance or
    treasury operations. Contract lifecycle systems. ATS and
    HRIS integrations (Ashby, Greenhouse, Rippling, Workday).
    LLM extraction over legal and financial documents.

  Benefits:

  - Competitive total compensation package (cash + equity)
  - Health, dental, and vision insurance
  - Retirement plan
  - Generous PTO policy

  We are committed to pay equity and transparency.

