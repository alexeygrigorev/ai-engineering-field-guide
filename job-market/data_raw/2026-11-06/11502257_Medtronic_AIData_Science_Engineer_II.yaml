description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the LifeThe Data Science and Artificial
  Intelligence function develops intelligent software
  solutions that combine machine learning, artificial
  intelligence, data analytics, and software engineering to
  address business and product challenges. The team partners
  with engineering, product, and business stakeholders to
  design, develop, deploy, and support scalable AI-enabled
  applications while maintaining quality, traceability, and
  operational excellence. This position is based in Hyderabad,
  India and follows a Flex work arrangement. No travel is
  required.

  As an AI Data Science Engineer II, you will design, develop,
  deploy, and support AI-enabled applications that combine
  prompt engineering, traditional machine learning, and full
  stack software development. The role requires close
  collaboration with technical and non-technical stakeholders
  to deliver scalable, maintainable, and audit-defensible
  solutions while supporting application operations,
  documentation, and continuous improvement initiatives.

  Primary Responsibilities

  - Design, evaluate, and optimize prompts for large language
    model (LLM) and AI-enabled applications to improve
    accuracy, consistency, and user experience.
  - Develop and maintain full stack applications using Python,
    Vue, JavaScript, and TypeScript technologies.
  - Integrate artificial intelligence and machine learning
    solutions into production-grade software applications.
  - Apply machine learning techniques including data
    preparation, feature engineering, model development,
    validation, deployment, and performance evaluation.
  - Manage application deployment, support, and troubleshooting
    activities within Internet Information Services (IIS) and
    Windows-based server environments.
  - Produce technical documentation for software, models,
    workflows, and operational processes to support
    traceability, reproducibility, and audit readiness.
  - Collaborate with engineering, product, business, and
    operational stakeholders to communicate technical
    concepts, project status, risks, dependencies, and
    implementation plans.
  - Contribute to technical design, architecture decisions, code
    reviews, software testing, debugging, and continuous
    improvement initiatives.

  Required Qualifications

  - Bachelor's degree with 4+ years of experience OR Master's
    degree in Computer Science, Data Science, Artificial
    Intelligence, Software Engineering, Information
    Technology, or Machine Learning.
  - Experience in prompt engineering and AI-enabled application
    development.
  - Proficiency in Python and full stack software development.
  - Experience with Vue and JavaScript or TypeScript for
    frontend
  - development.
  - Experience with IIS, server management, application
    deployment, and traditional machine learning techniques.

  Preferred Qualifications

  - Experience in regulated or quality-driven environments
    requiring documentation, traceability, and audit
    readiness.
  - Experience with Continuous Integration/Continuous Deployment
    (CI/CD), DevOps practices, and software release processes.
  - Experience building AI-enabled enterprise applications and
    deploying machine learning solutions in production
    environments.
  - Experience with cloud or hybrid computing environments.
  - Experience providing technical leadership, mentoring team
    members, or leading technical initiatives.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

