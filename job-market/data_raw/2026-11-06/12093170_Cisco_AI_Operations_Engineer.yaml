description: |
  Builds Operations (AI Ops) Solutions for specific domains.
  Automates and optimizes IT operations processes, managing
  risk, incident management, and root cause analysis using
  artificial intelligence (AI) and machine learning (ML)
  techniques. AI Ops aim to reduce the time and effort needed
  for IT processes while increasing the precision and speed of
  problem-solving through optimizing the end-to-end lifecycle
  of artificial intelligence (AI) applications and systems.
  Collaborates with cross-functional teams, including data
  scientists, SWEs, and infrastructure/operations, to ensure
  the reliability, scalability, and performance of IT
  applications. Automates routine tasks and implements
  continuous integration/continuous deployment (CI/CD)
  pipelines to optimize AI Ops processes and workflows. What
  You’ll Do: • Troubleshoots basic issues in AI Ops
  environments, such as configuration errors or service
  disruptions • Supports the development and implementation of
  AI Ops solutions for network assurance • Assists in
  analyzing network performance data and identifying trends
  and anomalies • Sets up basic monitoring and alerting
  systems using open-source tools • Develops simple automation
  scripts to streamline workflows and tasks using scripting
  languages along with automation frameworks • Designs and
  implements large-scale machine learning pipelines • Works
  closely with cross-functional teams to ensure seamless
  integration of AI Ops into existing IT processes • Stays up
  to date with the latest advancements in AI and machine
  learning technologies • Tracks key performance indicators
  (KPIs) related to AI Ops implementations Minimum
  Qualifications: • Bachelors + 2 years of related experience,
  or Masters + 0 years of related experience Preferred
  Qualifications Varies based on the team and business needs |
  Preferred Qualifications are desired education, experience,
  and skills that are in addition to Minimum Qualifications.

