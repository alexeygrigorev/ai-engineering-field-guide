description: |
  Full Stack Developer (AI-Enabled Applications)

  Summary

  We are seeking a seasoned Full Stack Developer with
  specialized expertise in artificial intelligence to design,
  build, and maintain robust AI-driven applications. In this
  pivotal role, you will leverage advanced machine learning
  models and cloud-native architectures to deliver scalable
  solutions that integrate seamlessly with existing enterprise
  systems. The ideal candidate will bridge the gap between
  traditional web development and cutting-edge generative AI
  technologies, ensuring that all applications are secure,
  efficient, and aligned with responsible AI principles. This
  position is critical for driving innovation in our IT
  services sector, requiring a deep understanding of both
  front-end user experiences and back-end AI orchestration.

  Responsibilities

  - Architect and develop scalable full-stack applications
    utilizing TypeScript, JavaScript, and modern HTML/CSS
    frameworks.
  - Implement advanced AI capabilities by integrating Large
    Language Models (LLMs) and Generative AI tools into core
    business workflows.
  - Design and manage Retrieval-Augmented Generation (RAG)
    pipelines to enhance application intelligence and data
    retrieval accuracy.
  - Engineer secure cloud infrastructure using AWS or Azure,
    focusing on cloud-native patterns and microservices
    architecture.
  - Automate deployment and configuration processes through
    Terraform (HCL) and Shell scripting to ensure reliable and
    repeatable environments.
  - Develop and maintain RESTful APIs and microservices to
    facilitate seamless communication between AI components
    and client applications.
  - Embed security and data privacy protocols directly into the
    AI development lifecycle to uphold responsible AI
    standards.
  - Utilize Python to build automation scripts, integrate AI
    models, and manage API interactions for enhanced system
    performance.

  Requirements

  Requirements:

  - Experience: A proven track record of 6 to 9 years in
    software development, specifically within the IT Services
    industry.
  - Core Languages: Proficiency in TypeScript, JavaScript,
    HTML/CSS, and Python for full-stack and AI integration
    tasks.
  - AI & Machine Learning: Hands-on experience with Generative
    AI, LLMs, Prompt Engineering, and AI Orchestration
    frameworks.
  - Cloud & DevOps: Strong background in AWS or Azure cloud
    platforms, including expertise in Terraform (HCL) and
    Shell scripting for infrastructure as code.
  - Architecture: Demonstrated ability to design and implement
    microservices, REST APIs, and cloud-native architectures.
  - Security & Compliance: Knowledge of Responsible AI
    practices, data privacy regulations, and security best
    practices for AI applications.
