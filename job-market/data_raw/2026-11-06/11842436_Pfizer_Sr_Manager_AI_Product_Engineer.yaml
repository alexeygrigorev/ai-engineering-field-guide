description: |
  ROLE SUMMARY At Pfizer, our purpose is breakthroughs that
  change patients' lives and our colleagues make this happen.
  All over the world, our colleagues work together to touch
  millions of lives. The Sr. Manager, AI Product Engineer is a
  senior hands-on engineer in an AI Development Pod in the AI
  Product & Innovation Studio, building and delivering Spark
  and new, yet to be imagined platforms which will drive the
  company's AI vision and strategy. The role owns the
  technical quality and delivery of significant product areas
  within the pod and helps set the bar for what is good enough
  to put in colleagues' hands. Operating globally, the Sr.
  Manager works with AI Product Owners and the pod's Director,
  AI Product Engineer to turn the "what" into working
  software: designing, building, testing and shipping
  features, and mentoring other AI Product Engineers. The bar
  is working software, honest estimates, and no unowned
  prototypes. ROLE RESPONSIBILITIES

  - Design and implement core product capabilities, including
    AI-native flows (models, tools, retrieval, evaluation)
    that must work under real colleague use.
  - Act as technical lead for a product slice: break down work,
    review code, and keep quality high without becoming a
    bottleneck.
  - Partner with AI Product Owners to shape scope for learning
    speed and operability; surface technical risk early.
  - Raise the engineering bar through pairing, critique, and
    examples - especially for Manager, AI Product Engineers.
  - Work with DevOps on CI/CD, environments, and production
    readiness for what you own.
  - Contribute to shared studio patterns so the two development
    pods do not diverge accidentally.
  - Instrument features; use data and failure traces to improve
    the product, not only to debug.
  - Communicate clearly in demos and design reviews; write the
    minimum design notes others can act on.

  BASIC QUALIFICATIONS

  - Bachelor's degree in Computer Science, Engineering, or
    related field - or equivalent practical experience.
  - 6+ years of professional software engineering with a track
    record of shipping and iterating production systems.
  - Hands-on experience integrating AI/ML or generative AI into
    product features.
  - Ability to lead technically without formal authority:
    sequencing, review, and coaching.
  - Strong fundamentals: APIs, data, testing, and debugging of
    distributed web systems.
  - Excellent collaboration with product and design in
    iterative, ambiguous environments.
  - Clear written and verbal communication.

  PREFERRED QUALIFICATIONS

  - Advanced degree.
  - Experience as a tech lead on a squad or pod.
  - Familiarity with modern AI platforms and at least one major
    cloud.
  - Healthcare, pharma, or other regulated-industry experience.
  - Mentoring or informal people-development experience.
  - Previous consulting or senior product-engineering experience
    is a plus.

  Please apply by sending your CV in English.  Work Location
  Assignment: Hybrid The annual base salary for this position
  ranges from €41.250,00. This salary range applies to the
  location Greece-Thessaloniki Chortiatis. We also offer a
  range of benefits and programs to meet colleagues' needs.
  Benefits vary by location and can include health care
  coverage, retirement savings plans, insurance benefits, an
  Employee Assistance Program, wellness benefits and more.
  Additional details about total compensation and benefits
  will be provided during the hiring process. Pfizer
  compensation structures and benefit packages are aligned
  based on the location of hire. Final compensation will be
  determined based on the successful candidate's relevant
  skills, experience, and qualifications, in accordance with
  pay equity principles and applicable employment laws.
