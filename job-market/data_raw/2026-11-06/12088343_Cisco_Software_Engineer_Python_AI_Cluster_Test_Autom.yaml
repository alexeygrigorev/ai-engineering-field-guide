description: |
  Meet The Team

  Cisco Validated Infrastructure Services (CVIS) establishes
  and proves the performance of large AI clusters before they
  are handed over to customers. We deploy each cluster,
  validate it against performance baselines, and deliver the
  evidence that it is ready for service.  The platform behind
  that work is full stack. It combines workflow and API
  services, network and infrastructure automation, and the UI
  used to run validation across labs and customer
  environments.

  Your Impact

  As a Release Software Engineer, you will own the release
  lifecycle for CVIS/NVIS software across AI clusters. You
  will take every build from integration through Jenkins-
  driven, end-to-end automated testing on AI cluster
  environments to test planning, acceptance criteria, RA
  certification, release qualification and readiness.

  - AI cluster releases meet documented functional, performance,
    interoperability and reliability gates.
  - Results are reproducible and traceable to specific Jenkins
    builds. They are packaged for engineering, support and
    customer readiness.
  - Critical AI cluster regressions are caught early in the
    Jenkins pipeline and resolved with actionable evidence.

  Release operations: Drive CVIS releases through each stage,
  from integration and automated Jenkins test runs to final
  readiness. Enforce release gates in Jenkins pipelines
  covering GPU, NCCL, network-fabric and workload validation,
  and keep release status transparent to all stakeholders.

  Minimum Qualification

  - Ability to turn AI cluster system requirements into
    measurable tests, acceptance criteria and release gates
  - Clear technical writing and strong cross-functional
    communication
  - Test automation in Python or a similar language, built into
    Jenkins CI/CD pipelines (Jenkins-file, shared libraries,
    job orchestration) that validate AI cluster deployments
  - Linux skills for debugging compute, GPU, network and storage
    issues in AI clusters
  - Track AI cluster feature readiness across releases, using
    Jenkins build and test results as evidence

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

