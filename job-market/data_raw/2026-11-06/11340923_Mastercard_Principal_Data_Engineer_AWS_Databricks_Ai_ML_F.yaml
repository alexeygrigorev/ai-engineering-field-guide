  AI Engineers, Data Scientists, Researchers, Software
  Engineers, and Product Managers to create reusable data
  capabilities that accelerate experimentation and the
  delivery of innovative products. Role What You'll Do• Lead
  the architecture, design, and engineering of scalable batch,
  streaming, and event-driven data platforms.• Design and
  build reliable data ingestion, transformation, enrichment,
  processing, and consumption pipelines.• Develop governed
