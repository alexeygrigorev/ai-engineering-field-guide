  Job Description:

  Own your opportunity to turn data into measurable outcomes
  for our customers’ most complex challenges. As an AI
  Engineer/Architect, you’ll see the bigger picture on mission
  initiatives and where your program management career can go
  at GDIT. MEANINGFUL WORK AND PERSONAL IMPACT As an AI
  Engineer/Architect, the work you’ll do at GDIT will be
  impactful to the missions that matter. You will play a
  crucial role in advancing the integration of automation and
  AI into the battlespace: ● Lead the design, architecture,
  and product roadmap of next-gen AI/ML and LLM solutions for
  customers ● Showcase solutions thru customer facing
  exercises, demos and pace-setting projects ● Collaborate
  with business development and capture teams to support bids,
  proposals and OTA efforts ● Bring innovation to programs by
  partnering with on-program teams to deliver AI/ML solutions

  WHAT YOU’LL NEED TO SUCCEED Bring your expertise and drive
  for innovation to GDIT. The AI Engineer/Architect must have:
  ● Education: BA/BS or equivalent. ● Experience: 10+ years of
  related experience

  ● Proven experience in growing AI projects from proof of
  concept to production, in one or more functional areas of
  edge AI and sensing, autonomous systems, intelligence
  analysis, contested logistics and training & readiness

  ● Excellent consultative selling skills; proven ability to
  engage stakeholders, identify new opportunities, and drive
  outcome-based value of AI/ML or LLM solutions.

  ● Strong communication and leadership skills; ability to
  distill complex requirements into actionable deliverables
  and guide multidisciplinary teams.

  ● Willingness to travel (up to 25%) and work on-site at GDIT
  facilities as needed. ● Experience supporting U.S.
  Department of War (DOW) programs

  ● Experience with multi-tenant, distributed systems, and
  cloud-native architecture patterns  ● Security clearance
  level: Secret clearance required to start with the ability
  to obtain & maintain a Top Secret ● US citizenship required

  ● Location: Remote

  Preferred Qualifications:

  ● Master of Science or PhD in related fields

  ● Cloud experience with AWS, Azure, etc.

  ● Programming experience with JAVA, RUST, Python or similar
  languages

  ● Experience with building and training classification and
  prediction models; leveraging large language models and
  agentic workflows


  GDIT IS YOUR PLACE At GDIT, the mission is our purpose, and
  our people are at the center of everything we do. ● Growth:
  AI-powered career tool that identifies career steps and
  learning opportunities ● Support: An internal mobility team
  focused on helping you achieve your career goals ● Rewards:
  Comprehensive benefits and wellness packages, 401K with
  company match, and competitive pay and paid time off ●
  Community: Award-winning culture of innovation and a
  military-friendly workplace OWN YOUR OPPORTUNITY Explore a
  career in data science and engineering at GDIT and you’ll
  find endless opportunities to grow alongside colleagues who
  share your determination for solving complex data
  challenges.

