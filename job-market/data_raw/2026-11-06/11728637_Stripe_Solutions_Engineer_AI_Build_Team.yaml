description: |
  Who we are About Stripe

  Stripe is a financial infrastructure platform for
  businesses. Millions of companies - from the world’s largest
  enterprises to the most ambitious startups - use Stripe to
  accept payments, grow their revenue, and accelerate new
  business opportunities. Our mission is to increase the GDP
  of the internet, and we have a staggering amount of work
  ahead. That means you have an unprecedented opportunity to
  put the global economy within everyone's reach while doing
  the most important work of your career.

  About the team

  The AI Build team is a new, industry-focused team dedicated
  to building with the world’s leading and fastest-scaling AI
  companies. We work alongside Stripe’s AI Solutions
  Architecture and GTM teams, and across Stripe’s product
  suite to help customers adopt emerging products, close
  interoperability and 0→1 solution gaps, and bring field
  learning directly into Stripe’s product roadmap. The team
  owns strategic proof-of-concept engagements across the pre-
  and post-sales lifecycle, complementing Stripe’s AI account
  teams and the product depth of Stripe’s specialist teams.

  What you'll do

  As a Solutions Engineer on the AI Build team, you’ll work
  directly with frontier AI companies on the payments,
  billing, and monetization infrastructure underlying their
  core businesses. You’ll own complex proof-of-concept
  engagements on Stripe’s frontier products, from initial
  scoping through activation and handoff, combining customer
  discovery, solution design, rapid prototyping, and cross-
  functional leadership. You won’t simply implement a finished
  product: you’ll build with customers, identify where
  Stripe’s products or integrations need to evolve, and help
  customers feel as though they are inside our product
  roadmap.

  Responsibilities

  - Own strategic POCs end to end: Sell, scope, and lead proof-
    of-concept engagements from initial customer commitment
    through activation.
  - Build with customers: Work deeply with users’ engineers and
    technical leaders to understand their workflows, rapidly
    prototype solutions, and establish credible paths to
    production.
  - Design across Stripe: Create solutions that span multiple
    Stripe products and determine whether blockers require
    configuration, integration work, custom development, or a
    core product change.
  - Close 0→1 gaps: Navigate incomplete products, evolving
    requirements, and interoperability gaps while balancing
    immediate customer outcomes with reusable solutions.
  - Influence the roadmap: Translate customer needs and
    deployment friction into clear product requirements, and
    partner with product and engineering teams to shape how
    Stripe’s frontier products are built.
  - Lead cross-functionally: Coordinate AI account teams, AI and
    specialist Solutions Architects, product and engineering
    teams, Professional Services, and post-sales technical
    resources across the engagement lifecycle of new builds
    and deployments.
  - Create repeatable patterns: Turn successful customer-
    specific work into reusable prototypes, reference
    architectures, implementation playbooks, and solution
    components.
  - Stay close to the AI frontier: Operate at the pace and in
    the working style of AI-native companies, and remain
    current on emerging companies, products, business models,
    and technical developments across the industry.

  Who you are

  You are a customer-oriented technical builder who thrives in
  ambiguous, fast-moving environments. You build trusted
  relationships with engineers, technical leaders, and senior
  stakeholders, and you are equally comfortable discovering an
  unclear problem, designing an architecture, prototyping a
  solution, and coordinating teams through activation. You use
  code pragmatically to accelerate your work. You communicate
  clearly, lead through influence, and look for patterns that
  can turn one customer engagement into a better product or
  repeatable approach for many customers.

  Minimum requirements

  - 7+ years of relevant experience in customer-facing technical
    delivery, solutions engineering, implementation, technical
    product management, or a related field
  - Experience owning complex customer engagements from
    discovery and solution design through implementation or
    activation, including work across both pre- and post-sales
    phases
  - Demonstrated success in ambiguous, 0→1 environments where
    the standard product, integration, or implementation
    pattern did not yet exist
  - Strong understanding of APIs, integrations, application
    architecture, and data flows, with the judgment to
    distinguish implementation gaps from core product gaps
  - Ability to prototype rapidly using modern AI coding
    harnesses and development tools such as Cursor, Claude
    Code, or Codex
  - Working proficiency in one or more relevant languages, such
    as Python, JavaScript/TypeScript, Java, or Ruby; depth in
    a particular language is less important than the ability
    to learn quickly and build credible prototypes
  - Ability to build trusted relationships with customer
    engineers, technical leaders, founders, and other senior
    stakeholders
  - Ability to lead through influence across sales, product,
    engineering, implementation, and post-sales teams while
    maintaining clear ownership of the customer outcome
  - Experience operating at startup speed and in Slack-first,
    rapidly changing environments, along with active
    engagement in the broader AI industry

  This role offers a unique opportunity to partner directly
  with leading AI companies and work on the financial
  infrastructure that powers their businesses. As an early
  member of Stripe’s AI industry team, you’ll help shape how
  Stripe partners with frontier companies, brings emerging
  products to market, and translates customer insights into
  product direction.
