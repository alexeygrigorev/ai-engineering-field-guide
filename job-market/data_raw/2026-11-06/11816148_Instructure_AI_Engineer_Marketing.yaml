title: AI Engineer, Marketing
company: Instructure
location: USA
remote: true
work_type: FULL_TIME
description: |
  At Instructure, we believe in the power of people to grow
  and succeed throughout their lives. Our goal is to amplify
  that power by creating intuitive products that simplify
  learning and personal development, facilitate meaningful
  relationships, and inspire people to go further in their
  education and careers. We do this by giving smart, creative,
  passionate people opportunities to create awesome. And
  that's where you come in:

  Why This Role Exists

  Marketing's AI tools are already in production and
  delivering real results - localization time down 90%,
  meeting prep down 90%, case study builds down 70%. Demand
  for new tools now outpaces what one person can build. This
  role adds dedicated engineering capacity so the team can
  ship more, support what's live, and keep raising the bar on
  quality without becoming a bottleneck.



  Scope

  You'll build for all marketing functions - Brand, Content,
  Events, PMM, International, and SDR. If a marketing team has
  a workflow AI can improve, it's in scope. You'll partner
  closely with the Senior Manager on where to focus, then own
  your pieces of the build.



  Day to day, you'll work across the marketing tech stack
  (Salesforce, Asana, Marketo, CMS platforms) and the
  automation and LLM tooling that connects them.

  Key ResponsibilitiesAI Tool Development (~50%)

  - Build and maintain production AI tools for marketing teams -
    content generators, meeting and SDR prep systems, case
    study automation, and workflow integrations.
  - Write, test, and iterate prompts across LLM-powered
    applications; version them and track what works.
  - Build integrations between AI tools and the marketing tech
    stack (Salesforce, Asana, Marketo, CMS platforms) using
    APIs, webhooks, and automation platforms.
  - Take tools from prototype to production with clear quality
    checks, and own them after launch - monitor outputs, tune
    prompts, fix drift, and ship improvements based on user
    feedback.

  Enablement & Documentation (~25%)

  - Write clear, usable documentation and playbooks so teams can
    self-serve.
  - Help train marketing teams on the tools you build - not just
    the clicks, but how to get good output and when AI isn't
    the right fit.
  - Support the AI Incubator intake process: help evaluate
    submissions and move projects from sandbox toward
    production.

  Quality & Support (~25%)

  - Keep production tools inside data and brand guardrails; flag
    anything that touches customer data or brand voice for
    review before it ships.
  - Respond to user issues on live tools, triage what's
    breaking, and close the loop.
  - Help track tool usage and impact so every tool has a
    defensible ROI story.



  Required Qualifications

  - Proficiency with or ability to quickly ramp on our primary
    AI and marketing tech stack, including Claude, Gemini,
    Clay, and Glean.
  - 2+ years in marketing technology, automation, software, or a
    comparable technical role or equivalent hands-on project
    experience.
  - Hands-on experience with LLMs: writing and iterating
    prompts, evaluating output quality, and working within
    context limits.
  - Comfort with technical integration: APIs, webhooks,
    automation platforms (Zapier/Make), and at least basic
    scripting (Python preferred).
  - Strong written communication - this role produces
    documentation others rely on.
  - Comfort with ambiguity and a bias toward shipping. This
    function is evolving, and you'll iterate constantly.

  Preferred Qualifications

  - Experience in B2B SaaS marketing, ideally EdTech or
    enterprise software.
  - Familiarity with marketing ops tooling: Salesforce, Marketo,
    Asana, Google Analytics, or comparable platforms.
  - Experience building something real with AI that people
    actually used - a tool, a bot, an automation, even a side
    project counts.
  - Exposure to CMS or web platforms (Drupal, content
    management, localization workflows).
  - Experience with GitHub and Railway for version control and
    deployment

  Get in on all the awesome at Instructure!

  We offer competitive, meaningful benefits in every country
  where we operate. While they vary by location, here's a
  general idea of what you can expect:

  - Competitive compensation, plus all full-time employees
    participate in our ownership program - because everyone
    should have a stake in our success.
  - Flexible work culture. Our remote, hybrid and in-office
    collaboration spaces vary by role, team and location.
  - Generous time off, including local holidays and our annual
    “Dim the Lights” period in late December, when teams are
    encouraged to step back and recharge based on departmental
    needs.
  - Comprehensive wellness programs and mental health support
  - Learning and development resources, including professional
    development tools and tuition reimbursement, to support
    your growth
  - The technology and tools you need to do your best work
  - Motivosity employee recognition program
  - A culture rooted in inclusivity, support, and meaningful
    connection

  We believe in hiring great people and treating them right.
  The more diverse we are, the better our ideas and outcomes.

  Instructure is an Equal Opportunity Employer. We comply with
  applicable employment and anti-discrimination laws in every
  country where we operate.

  All employees must pass a background check as part of the
  hiring process. To help protect our teams and systems, we’ve
  implemented identity verification measures. Candidates may
  be asked to verify their legal name, current physical
  location, and provide a valid contact number and residential
  address, in accordance with local data privacy laws.

  Any attempt to misrepresent personal or professional
  information will result in disqualification.
