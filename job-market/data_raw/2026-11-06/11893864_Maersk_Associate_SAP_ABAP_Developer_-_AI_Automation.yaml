description: |
  About the Role:

  We are looking for an Associate SAP ABAP Developer who
  combines solid ABAP engineering with practical AI
  experience. You will build and enhance custom SAP solutions,
  and you will bring AI capabilities into SAP processes,
  including machine learning models, generative AI services
  and intelligent automation. The role suits someone who wants
  to move beyond classic ABAP development towards clean-core,
  AI-enabled solutions on S/4HANA and SAP BTP. You will also
  automate day-to-day SAP Security and Basis tasks, so that
  routine operations run with little manual effort.

  Key Responsibilities:

  ABAP Development

  - Design, develop, test and deploy custom ABAP solutions from
    functional specifications, including reports, interfaces,
    enhancements, forms and workflows.
  - Build modern ABAP applications using ABAP OO, CDS views,
    AMDP, RAP (RESTful Application Programming Model), OData
    services and Fiori/UI5 integration.
  - Apply clean-core principles using in-app and side-by-side
    extensibility, BAdIs and released APIs.
  - Optimise performance of ABAP programs and HANA-based
    queries, and fix defects through root-cause analysis.
  - Follow transport, change control and code quality standards,
    including ABAP Test Cockpit and Code Inspector checks.

  AI & Intelligent Automation

  - Integrate AI capabilities into SAP processes using SAP AI
    Core, the Generative AI Hub and SAP Business AI features
    on SAP BTP.
  - Build ABAP-to-AI integrations that call ML and LLM services
    through REST APIs, including prompt design, response
    handling and error management.
  - Develop practical use cases such as document extraction,
    intelligent classification, anomaly detection, forecasting
    support and natural-language assistants for SAP data.
  - Support Retrieval-Augmented Generation (RAG) patterns that
    use SAP data as grounded context.
  - Evaluate model output quality, monitor performance and
    handle data privacy, access control and audit logging for
    AI use cases.
  - Work with data scientists and solution architects to move AI
    prototypes into stable production solutions.

  Integration & Automation

  - Build and maintain integrations using OData, REST, SOAP,
    IDocs, BAPIs and SAP Integration Suite.
  - Automate repetitive business and technical tasks using SAP
    Build Process Automation, workflow tools and scripting
    (Python).
  - Use Git-based version control and CI/CD practices for ABAP
    and BTP development where available.
  - Automate SAP Security tasks such as user provisioning and
    deprovisioning, role assignment, access reviews, SoD and
    critical access reporting, firefighter log reviews and
    dormant user clean-up, using ABAP, Python, PowerShell and
    SAP APIs.
  - Automate SAP Basis tasks such as system health checks,
    transport and release management, job, spool and dump
    monitoring, certificate and parameter checks, and post-
    copy or system refresh steps, using ABAP, shell scripting,
    Ansible and CI/CD pipelines.
  - Build scheduled ABAP programs, OData/REST services and BTP
    workflows that give Security and Basis teams self-service,
    low-touch processes with full logging and an audit trail.
  - Apply AI to these tasks where it helps, for example log
    analysis, alert triage and anomaly detection in user
    behaviour and system events.

  Quality & Collaboration

  - Gather clear and complete requirements from functional
    consultants, process owners and business users.
  - Write technical specifications, unit test cases and handover
    documentation for support teams.
  - Deliver work in an Agile framework as part of cross-
    functional teams.
  - Take part in code reviews, mentor junior developers and
    share knowledge on ABAP and AI best practice.
  - Support SAP implementations, rollouts, upgrades and
    production support when needed.

  Qualifications:

  Education & Experience

  - Bachelor's or master's degree in Computer Science,
    Information Technology or a related field, or equivalent
    experience.
  - 3 - 5 years of hands-on SAP ABAP development experience.
  - At least 2 years of working experience with AI, ML or
    Generative AI, either in SAP projects or in related
    solutions.
  - Delivered at least 1–2 full-lifecycle SAP implementation or
    enhancement projects.

  Technical Skills (Must Have):

  - Strong hands-on skills in ABAP (classic and ABAP OO), Open
    SQL, CDS views, OData and Fiori backend development.
  - Working knowledge of S/4HANA, ABAP on HANA, RAP and ABAP
    Development Tools (ADT) in Eclipse.
  - Experience with enhancement techniques: BAdIs, user exits,
    enhancement framework and implicit/explicit enhancements.
  - Practical experience with AI/ML or LLM-based solutions,
    including calling AI services through APIs.
  - Proficiency in Python or another scripting language for AI
    and automation tasks.
  - Experience with REST/OData APIs, JSON and authentication
    methods such as OAuth.
  - Proven ability to automate SAP Security and Basis tasks
    using ABAP, Python, shell or PowerShell scripting and SAP
    APIs.

  Good to Have:

  - Experience with SAP BTP, including AI Core, the Generative
    AI Hub, Joule and SAP AI Launchpad.
  - Knowledge of SAP Cloud Application Programming Model (CAP)
    or SAP Build Apps.
  - Familiarity with prompt engineering, vector databases,
    embeddings and RAG architecture.
  - Understanding of AI risks such as prompt injection, data
    leakage and over-privileged integrations, and awareness of
    the OWASP LLM Top 10.
  - Exposure to SAP Integration Suite, SAP Build Process
    Automation or Azure, AWS or GCP AI services.
  - Familiarity with SAP Basis tooling and practices, such as
    Solution Manager, Focused Run, CTS+ or ChaRM, abapGit,
    Jenkins and Ansible.
  - Working knowledge of SAP Security concepts such as roles,
    authorisations, SoD and SAP GRC Access Control.

  What We're Looking For:

  - Clear written and verbal communication, and comfort working
    with stakeholders from developers to business leaders.
  - A problem-solving, automation-first mindset and genuine
    curiosity about how AI is changing SAP development.
  - A strong sense of ownership, attention to detail and a
    commitment to code quality and security.
  - Willingness to learn quickly and to mentor others as your
    experience grows.

