title: "Solution Engineer - Cloud & AI Applications"
company: Microsoft
location: USA
remote: true
work_type: FULL_TIME
description: |
  Overview

  Are you insatiably curious, deeply passionate about the
  realm of Cloud & AI and Applications, and ready to tackle
  complex challenges in a dynamic environment? If so, we
  invite you to join our team as a Solution Engineer - Cloud &
  AI Applications for commercial customers at Microsoft. Here,
  you'll be at the forefront of innovation, working on
  cutting-edge projects that leverage the latest technologies
  to drive meaningful impact. Join us and be part of a team
  that thrives on collaboration, creativity, and continuous
  learning.

  Microsoft is transforming the developer experience for Cloud
  & AI Applications across the development lifecycle. With AI
  Foundry and seamless integration with Azure AI, we’re
  leading the way in Agenetic AI development, where AI agents
  streamline development and operations. As a Solution
  Engineer - Cloud & AI Applications, you’ll help customers
  adopt these innovations to boost productivity, drive
  innovation, and become AI-native. You will also play a
  pivotal role in helping enterprise AI developers unlock the
  full potential of Microsoft’s AI-powered stack across every
  stage of the development lifecycle.

  As a Solution Engineer - Cloud & AI Applications, you'll
  collaborate closely with engineering leaders and platform
  teams to accelerate AI Foundry, Azure AI, and Responsible AI
  through hands-on engagements like Proof of Concepts,
  hackathons, and architecture workshops. You’ll guide
  customers through secure, scalable solution design,
  influence technical decisions, and accelerate AI
  applications development into their deployment workflows. In
  summary, you’ll help customers modernize their applications
  and realize the full value of Microsoft’s AI platform, all
  while enjoying flexible work opportunities. This opportunity
  will allow you to accelerate your career growth, develop
  deep business acumen, hone your technical skills, and become
  adept at solution design and deployment.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees, we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  By applying to this role, you will be considered for
  multiple opportunities within Microsoft across the United
  States including locations beyond where the role is posted.
  This role is flexible in that you can work up to 50% from
  home. Travel percentages will vary according to role.

  Responsibilities

  - Drive technical sales with decision makers using demos and
    PoCs to influence solution design and enable production
    deployments.

  - Lead hands-on engagements—hackathons, code-with sessions,
    and architecture workshops—to accelerate adoption of
    Microsoft’s developer tools and cloud platforms.

  - Build trusted relationships with developers and platform
    leads, co-designing secure, scalable architectures and
    solutions

  - Resolve technical blockers and objections, collaborating
    with engineering to share insights and improve products.

  - Maintain deep expertise in AI Foundry & App architecture
    (Agentic AI framework, Semantic Kernel, Foundry SDK,
    Responsible AI) and App architecture/cloud native dev
    (APIs, containerization, microservices, event-driven,
    Python, Java or .NET).

  - Maintain and grow expertise in AI Management & Security (Gen
    AI Ops, Sentinel, orchestrator, monitoring).
  - Represent Microsoft through thought leadership in developer
    communities and customer forums

  Other:

  - Embody our culture and values

  Qualifications Required/Minimum Qualifications:

  - Bachelor's Degree in Computer Science, Information
    Technology, or related field AND 2+ years technical pre-
    sales or technical consulting experience
    - OR Master's Degree in Computer Science, Information
      Technology, or related field AND 1+ year(s) technical
      pre-sales or technical consulting experience
    - OR 3+ years technical pre-sales or technical consulting
      experience
    - OR equivalent experience

  Other Requirements:

  - Microsoft is unable to sponsor a work visa for this role due
    to the nature of the role’s job duties.

  Additional or Preferred Qualifications:

  - 6+ years technical pre-sales, technical consulting, or
    technology delivery, or related experience
    - OR equivalent experience
  - 4+ years experience with cloud and hybrid, or on premises
    infrastructure, architecture designs, migrations, industry
    standards, and/or technology management
  - Proficient on Agentic framework, AI Management & Security
    (e.g., Gen AI Ops, Sentinel, Responsible AI, orchestrator,
    monitoring)
  - Skilled with 1 or more frameworks, tools, languages (e.g.,
    GitHub, Copilot Studio, VS Code, Jupyter, PyCharm,
    Node.js, Python, Java, C#, C++, AI Assisted Dev Tools)
  - Understanding of full stack App architecture design /
    modernization  and cloud native dev (e.g., APIs,
    containerization, microservices, event-driven, Python,
    Java, .NET)
  - Familiarity of AI & ML models (e.g., Agentic AI framework,
    AI Foundry, Semantic Kernel, Foundry SDK, Responsible AI,
    fine-tuning/inferencing, etc.)
  - Proven ability to lead technical engagements (e.g.,
    hackathons, PoCs, MVPs) that drive production-scale
    outcomes.



