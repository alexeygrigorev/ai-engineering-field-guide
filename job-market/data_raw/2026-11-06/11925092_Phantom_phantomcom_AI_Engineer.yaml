description: |
  Phantom is on a mission to connect the world to the freedom
  of open markets. Tens of millions of people all over the
  world use Phantom to access global markets that never close,
  including perpetuals, prediction markets, tokenized assets,
  stablecoins and memes. Phantom users are able to discover
  the markets that matter and the cultural moments that shape
  them, building conviction through real-time data and the
  verified performance of top traders. With self-custody and
  access to open networks at its core, Phantom lets them
  control their financial moves in the same app they use to
  safely store or spend money worldwide.

  Phantom has reached #1 in Google Play's finance category and
  consistently ranks in the top 50 apps across all categories.
  Check out our Forbes Fintech 50 and CNBC and Statista's
  World's Top Fintech Companies 2026!

  We are around 180 people, fully remote, backed by a $150M
  Series C investment from a16z, Sequoia Capital and Paradigm.

  About the role

  At Phantom, we're looking for an AI Engineer to help shape
  how AI is adopted and scaled across the company. You'll play
  a key role in building the internal AI tools, integrations,
  and automation that enable teams to work smarter, move
  faster, and operate more efficiently.

  This is a hands on engineering role focused on turning
  emerging AI capabilities into practical, reliable solutions
  that drive meaningful business impact. You'll partner
  closely with teams across the organization to identify
  opportunities, build AI powered workflows, and establish the
  technical foundations that make AI accessible, secure, and
  scalable.

  We're looking for someone who enjoys building,
  experimenting, and shipping, with a strong understanding of
  modern LLM technologies and the engineering fundamentals
  required to bring AI solutions into production.

  Responsibilities

  - Build AI Solutions: Design, develop, and deploy AI powered
    tools, agents, and automation that streamline workflows
    and solve real business problems across the organization.
  - Develop AI Integrations: Connect LLMs and AI applications
    with internal systems, APIs, and enterprise tools to
    enable seamless, intelligent workflows.
  - Own AI Infrastructure: Build and maintain the underlying
    infrastructure, services, and integrations that support
    reliable AI applications across teams.
  - Enable AI Adoption: Partner with stakeholders to identify
    opportunities for AI, translate business needs into
    technical solutions, and empower teams to leverage AI
    tools effectively.
  - Build for Scale: Develop reusable components, frameworks,
    and tooling that make it easier for teams to build,
    customize, and maintain their own AI workflows.
  - Ensure Security & Reliability: Implement appropriate access
    controls, monitoring, observability, and operational
    safeguards to ensure AI solutions are secure, reliable,
    and maintainable.
  - Optimize AI Usage: Monitor model performance, usage, and
    costs while identifying opportunities to improve
    efficiency, quality, and business outcomes.
  - Drive Innovation: Stay current with emerging AI
    technologies, evaluate new models and frameworks, and
    identify practical opportunities to bring new capabilities
    into the organization.

  Qualifications

  - Strong software engineering background with experience
    building and maintaining production applications,
    services, or internal platforms.
  - Hands on experience developing applications using LLMs such
    as OpenAI, Anthropic Claude, or open source models.
  - Proficiency in Python, TypeScript, or similar programming
    languages, with experience integrating APIs and building
    backend services.
  - Experience building AI agents, workflow automation, or
    applications that leverage LLM orchestration frameworks.
  - Familiarity with retrieval augmented generation (RAG), tool
    calling, structured outputs, prompt engineering, and
    modern AI application patterns.
  - Experience integrating applications with enterprise tools,
    internal systems, and third party APIs.
  - Understanding of cloud infrastructure, deployment practices,
    monitoring, and production reliability.
  - Strong product mindset with the ability to translate
    ambiguous business problems into practical technical
    solutions.
  - Ability to work independently, take ownership of projects,
    and collaborate effectively with both technical and
    nontechnical stakeholders.
  - A genuine interest in AI and a bias toward experimentation,
    execution, and measurable impact.

  Nice to Have

  - Experience building internal AI platforms or enterprise AI
    automation solutions.
  - Familiarity with AI coding tools, agent frameworks, and
    orchestration platforms.
  - Experience with technologies such as LangChain, LangGraph,
    Claude Agent SDK, or similar frameworks.
  - Experience with MCP, enterprise connectors, and AI tool
    integrations.
  - Familiarity with LLM observability, evaluation frameworks,
    cost optimization, and usage analytics.
  - Experience implementing security, governance, and access
    controls for enterprise AI applications.
  - Experience working in a fast growing technology company
    where speed, ownership, and adaptability are essential.

  You'll help make AI a practical and valuable part of how
  Phantom operates. Success means delivering solutions that
  teams actively use, reducing manual work, accelerating
  execution, and creating a scalable foundation for continued
  AI adoption.

  You'll have the opportunity to own projects from concept
  through production, influence our internal AI strategy, and
  help define how we leverage AI across the organization.

  Why Work With Us

  Phantom's journey to becoming a global trading app began
  with making crypto easier to use. Today, we’re building on
  that foundation to help people discover the markets that
  matter, make informed financial moves, and safely store or
  spend their money worldwide. Joining Phantom means helping
  shape that next chapter: building products that bring the
  freedom of open markets to more people.



  - Build for global impact: Create products used by tens of
    millions of people, making innovative financial markets
    more accessible to users around the world.
  - Make complexity feel simple: Solve meaningful challenges
    across design, engineering, and user experience to make
    discovering markets and managing money seamless.
  - Put users in control: Help build a future where people have
    greater freedom over their assets and financial decisions,
    with security and self-custody at the foundation.

  Benefits (only available to full-time employees)

  - Competitive salary and equity
  - Comprehensive insurance (medical/dental/vision): base plan
    100% covered
  - Flexible hours and a long-standing, supportive remote
    environment
  - Unlimited vacation: Take time when you need it (and we
    really mean it!)
  - 401(k) retirement plan
  - Wellness stipend
  - Weekly meal stipend
  - Learning & Development stipend
  - Remote / WFH set-up stipend

  We strongly encourage candidates of all backgrounds to
  apply. We believe that our work is stronger with a variety
  of perspectives, and we’re eager to further diversify our
  company. If you have a background that you feel would make
  an impact at Phantom, please consider applying. We’re
  committed to building an inclusive, supportive place for you
  to do the best work of your career.

  By submitting your resume and application materials, you
  acknowledge and agree that Phantom Technologies, Inc.
  ("Phantom") collects and processes your personal information
  (including application materials, interview records, and
  related data) to evaluate your candidacy. Phantom may use
  AI-powered tools and third-party service providers for
  transcription, note-taking, scheduling, and other
  administrative tasks. Phantom does not sell your information
  and your materials will be handled securely and in
  accordance with applicable data protection laws.
