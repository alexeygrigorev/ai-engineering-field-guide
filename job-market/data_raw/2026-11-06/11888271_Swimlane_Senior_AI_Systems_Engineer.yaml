description: |
  Who we are, and what we offer:

  Swimlane is redefining security operations with Agentic AI
  automation that empowers organizations to work smarter,
  respond faster, and stay ahead of threats. Our low-code
  platform combines automation, orchestration, and intelligent
  reasoning to unlock true operational autonomy across the
  modern SOC.

  At Swimlane, we put people first. We foster a culture of
  innovation, trust, and continuous improvement—where your
  ideas matter and your work drives meaningful change. Join us
  and help build the next era of Agentic AI-powered security
  operations.

  Senior AI Systems Engineer

  Agentic AI & AI SOC

  About the role

  Our current team is firing on all cylinders to deliver core
  features, but as our product scope rapidly expands, we need
  a technical driver to help us scale. We are looking for a
  Principal AI Systems. Engineer to act as a pathfinder and
  shape the next generation of AI SOC capabilities in the
  Swimlane Turbine platform.

  This position sits within Data Science but is fundamentally
  a software engineering and integration role—not a model-
  training role. You will take the wheel on applied LLM
  projects, driving the transition from single-prompt features
  to robust multi-agent systems and intelligent customer-
  facing security chatbots.

  What you'll do

  - Drive Architectural Change: Lead the technical strategy and
    hands-on execution for building production-grade multi-
    agent systems and security chatbots.
  - Scale Our Capabilities: Act as an accelerator for the team,
    taking ownership of new AI feature development so we can
    keep pace with rapidly growing product demands.
  - Build Applied LLM Workflows: Design secure, maintainable
    workflows using for AI SOC use cases like alert triage,
    summarization, and workflow automation.
  - Own Evaluation (Evals): Create test sets, define success
    metrics (accuracy, faithfulness, latency), and run
    regression tests before and after changes for your
    features.
  - Monitor Production Behavior: Debug hallucinations and
    systematically reduce failure modes through better
    retrieval, prompting, and guardrails (not just "tweak the
    temperature").
  - Establish Engineering Standards: Define robust patterns for
    context engineering, tool design, retrieval, and harness
    engineering to ensure our agents are rigorously evaluated
    for quality and safety.●
  - Champion Security-First AI: Ensure data privacy, access
    controls, and prompt injection defenses are embedded
    deeply into our multi-agent architectures.
  - Collaborate Cross-Functionally: Work seamlessly across Data
    Science, Engineering, Product, and Platform teams to guide
    emerging AI capabilities from prototype to production.

  What We’re Looking For:

  - 8+ years of professional software engineering experience,
    with a strong foundation in designing and operating
    reliable, production-grade systems.
  - Programming Languages: Expertise in .NET, TypeScript or
    Python is expected.
  - 1–2 years of hands-on applied AI experience specifically
    focused on building multi-agent systems, chatbots, tool-
    using agents, or AI-powered automation.
  - Cloud-Native AI Expertise: Practical experience using cloud
    AI services (AWS Bedrock strongly preferred) and LLM
    provider SDKs (such as Claude AgentSDK).
  - Core AI Technical Depth: Proven understanding of enterprise
    RAG systems, Model Context Protocol (MCP) tool
    integrations, context engineering, and harness engineering
    for evaluations.
  - Project Leadership: A track record of driving complex
    technical projects and influencing architectural decisions
    in a fast-paced, low-bureaucracy environment.
  - Security Mindset: Strong grasp of AI security frameworks,
    data privacy

  Nice to Have

  - Experience building security automation, SOAR, SOC, threat
    intelligence, detection engineering, or incident response
    products.
  - Familiarity with AI security frameworks, prompt injection
    defenses, agent sandboxing, policy-based tool control, or
    AI governance practices.
  - Experience building evaluation harnesses for AI quality,
    latency, cost, safety, and reliability.
  - Experience using AI coding tools such as Cursor, Claude
    Code, GitHub Copilot, or similar tools in real engineering
    workflows.

  The Perks of being a Swimlaner:

  - Competitive Benefits & Compensation
  - Stock Options
  - Training & Professional Development Opportunities
  - MacBook Pro
  - Great Company Culture
  - We value collaboration and innovation
  - Give-back Volunteering Opportunities

  Here at Swimlane, our core focus is to Automate the World of
  Security and we strive to represent our five core values in
  everything we do:

  - Punch above your weight class - We make the most of our
    circumstances and constantly surprise and impress with our
    ability to deliver.
  - Be a happy innovator - The hard problems are the fun
    problems to solve, we’re excited to take on difficult
    challenges and find creative solutions.
  - Always be leveling up - We are continuously improving,
    embracing change, and consuming information to better
    ourselves and each other.
  - Move at the speed of WOW - We work with an extreme sense of
    urgency, but we never compromise quality.
  - Have honesty and integrity in ‘all the things’ - We make
    decisions with the best of intentions, doing what is right
    for as many stakeholders as possible.

  What’s the best thing about working at Swimlane? If you ask
  the team, they'll tell you it's the people. Swimlaners are
  innovative, collaborative and driven by the purpose of
  revolutionizing the way security teams automate and respond
  to alerts. Headquartered in beautiful Denver, Colorado,
  Swimlane's staff spans 28 states and 23 countries!

  To complete your application, please submit your resume to
  https://ats.rippling.com/swimlane
