description: |
  Company Description

  About Pramira

  Pramira is a California-based engineering and construction
  company specializing in telecommunications, electrical, and
  infrastructure projects. We are hiring an AI Automation
  Engineer to join our team in India.

  Job Description

  About the Role

  You will study how our teams work, find tasks that AI agents
  and automation can take over, and then build, deploy, and
  maintain those solutions. You will use free, open-source,
  and existing Microsoft 365 tools wherever possible, running
  them on the cloud or on our own servers. This is a hands-on
  role: you will own your solutions from idea to daily use.

  Key Responsibilities

  - Review workflows with our operations, project, field,
    finance, and HR teams and find where AI can save time
  - Build AI agents that can plan, use tools, and complete
    multi-step business tasks
  - Build an AI assistant that answers staff questions from our
    company procedures and policies (RAG)
  - Automate construction tasks such as RFI drafting, document
    data extraction, bid screening, compliance reminders, and
    weekly reports
  - Connect agents to Microsoft 365 (SharePoint, Teams, Power
    Automate), Smartsheet, and other systems through APIs
  - Deploy and run open-source platforms such as n8n, LangGraph,
    CrewAI, and Ollama using Docker on Linux or cloud servers
  - Monitor performance, fix issues, control costs, and keep
    sensitive data secure
  - Document your work and train staff to use the tools

  Qualifications

  Requirements

  - Bachelor’s degree in Computer Science, IT, Engineering, or
    equivalent experience
  - 3+ years in software development or automation, including 1+
    year building LLM applications or AI agents
  - Strong Python skills and experience with REST APIs
  - Hands-on experience with at least one agent framework
    (LangChain, LangGraph, CrewAI, AutoGen, or n8n)
  - Experience with RAG and vector databases (Chroma, Qdrant,
    pgvector, or similar)
  - Experience deploying applications with Docker on Linux and
    on at least one cloud platform
  - Experience with both commercial LLM APIs and open-source
    models run locally
  - Good spoken and written English, and the ability to explain
    technical work to non-technical staff

  Nice to Have

  - Power Automate, SharePoint, Microsoft Graph, or Copilot
    Studio experience
  - Smartsheet API experience
  - Experience in construction, telecom, engineering, or field
    services
  - OCR and data extraction from PDFs, drawings, and forms
  - Experience working with US-based teams

  What We Offer

  - Health insurance
  - Paid time off
  - Paid sick leave
  - Direct work with company leadership on high-impact projects
  - Freedom to choose and build the tools that shape how the
    company runs

  Application Questions

  - Describe one AI agent or automation you built that people
    use regularly. What did it do?
  - Which agent frameworks have you used in production?
  - Have you run open-source language models on your own server?
    Which ones?
  - Can you work (X) hours of daily overlap with US Pacific
    time?
  - What is your current and expected annual CTC, and your
    notice period?

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
