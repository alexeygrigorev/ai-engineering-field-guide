description: |
  Summary

  We are seeking a highly skilled AI Engineer – Technical
  Consultant to drive the integration of advanced artificial
  intelligence solutions within our IT Services division. In
  this pivotal role, you will leverage your extensive
  expertise to architect and implement robust AI strategies,
  ensuring seamless deployment of cutting-edge technologies.
  Your work will be instrumental in transforming business
  processes through intelligent automation and data-driven
  insights, directly contributing to the organization's
  strategic objectives and technological leadership in the AI
  landscape.

  Responsibilities

  - Design and deploy scalable AI architectures utilizing Azure
    AI Foundry and Copilot to enhance operational efficiency.
  - Develop sophisticated Natural Language Processing (NLP)
    models and implement Retrieval-Augmented Generation (RAG)
    frameworks to deliver intelligent conversational
    interfaces.
  - Engineer and maintain vector databases to support advanced
    search capabilities and knowledge retrieval systems.
  - Establish comprehensive Agent Governance protocols to ensure
    the reliability, security, and ethical deployment of
    autonomous AI agents.
  - Build and optimize large-scale data pipelines using Azure
    Databricks, PySpark, Python, and SQL for efficient data
    processing and analytics.
  - Integrate data ingestion and transformation workflows
    leveraging Azure Data Factory (ADF) and Azure Data Lake
    Storage (ADLS).
  - Collaborate with cross-functional teams to translate complex
    business requirements into technical AI solutions.
  - Conduct performance tuning and optimization of AI models and
    data infrastructure to meet high-availability standards.

  Requirements

  Requirements:

  - Minimum of 8 to 12 years of professional experience in data
    engineering, machine learning, or AI solution
    architecture.
  - Proven proficiency in Azure AI Foundry and Microsoft Copilot
    technologies.
  - Deep expertise in Natural Language Processing (NLP) and
    experience implementing RAG architectures.
  - Strong hands-on knowledge of Vector Databases and Agent
    Governance principles.
  - Advanced skills in Azure Databricks, PySpark, Python, and
    SQL for big data processing.
  - Demonstrated experience with Azure Data Factory (ADF) and
    Azure Data Lake Storage (ADLS).
  - Ability to design end-to-end AI integration solutions within
    the IT Services sector.
  - Compensation package is structured at ₹20 LPA, commensurate
    with the required skill set and experience level.
