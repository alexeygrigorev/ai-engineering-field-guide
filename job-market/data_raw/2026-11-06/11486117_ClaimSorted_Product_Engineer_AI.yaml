description: |
  Building a More Resilient World

  When things go wrong, insurance has one job: get people and
  businesses back on their feet. Too often, it doesn't. At
  ClaimSorted, we're changing that, and building a more
  resilient world where people and businesses have the
  confidence to go after bigger opportunities.

  We're creating the company that will define how claims are
  handled for the next generation. The world's largest
  insurers and Fortune 500 companies already trust us to
  handle their claims and manage their risk.

  And we're moving fast. We grew 10x in the past year, raised
  one of the largest InsurTech rounds of its kind, and are
  backed by Y Combinator, Atomico and Eurazeo. We ship, learn
  and improve every week, never settling for "how it's always
  been done."

  We're just getting started. There's never been a better time
  to join.

  About the Role

  We're looking for an Product Engineer // AI to build the
  automations that turn claims handling into something the
  industry has never had: fast, reliable, and actually built
  for the volume insurance runs at.

  - You'll find the automation nobody else saw - liaise with
    claims handlers, watch where the process actually breaks
    down, and turn what you learn into the feature that fixes
    it. Not a backlog ticket — your idea, built and shipped.
  - You'll build agents that are actually used, every single day
    - full-stack, end-to-end, deployed into production where
    they're doing real work on real claims, not sitting in a
    demo. Most engineers wait years before their AI systems
    touch anything real. You'll do it from day one.
  - You'll own the risk, not just the code - work shoulder-to-
    shoulder with AI engineers and ops to make sure what you
    ship is bulletproof, then keep pushing it further as the
    system scales. This is the difference between building
    something clever and building something that lasts.

  We love working together in the office, so this is a full-
  time, office-based role in our London office. We're a high-
  intensity team and often put in significant time and effort,
  because we believe great outcomes come from doing the work
  well.

  Who You Are

  We care more about hunger and grit than years on a resume.
  You might come from a product engineering background, an
  AI/ML team shipping real features, or a startup where you've
  had to own things end-to-end.

  - Comfortable working directly with users to find real
    opportunities - you don't wait for a spec, you go find out
    what's actually slow or broken
  - Genuine understanding of agentic AI systems - you know how
    to design AI that takes real actions, not just answers
    questions
  - Fast, capable full-stack builder - you can take a feature
    from idea to production without waiting on someone else to
    unblock you
  - Obsessive about correctness and risk - you think about what
    happens when an automation is wrong, not just when it's
    right

  Our Values



  Move Fast – Act decisively, iterate quickly, optimize for
  momentum.

  Always Overdeliver – We exceed expectations in everything we
  do.

  Think Customer-First, Always – The customer experience
  drives every decision.

  Challenge the Status Quo – We innovate relentlessly and
  never settle for 'good enough.'

  Say It How It Is – Transparency and direct communication
  build trust.



  Compensation & Benefits

  - Generous, transparent equity participation
  - Skilled Worker visa sponsorship
  - 28 days annual leave plus bank holidays
  - 30 days of remote work annually
  - Private medical insurance
  - Pension contributions
  - Company offsites
  - Accelerated promotion track in a high-growth environment
