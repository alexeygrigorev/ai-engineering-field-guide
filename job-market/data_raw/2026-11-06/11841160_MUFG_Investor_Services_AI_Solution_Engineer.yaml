description: |
  Company Description

  MUFG Investor Services is a trusted partner to many of the
  world’s largest public and private funds, providing asset
  servicing and operational solutions built for alternatives.
  With over $1 trillion in client assets under administration,
  we offer fund administration, banking, payments, fund
  financing, foreign exchange overlay, corporate and
  regulatory services, custody, business consulting, and more.
  Operating from 17 locations worldwide, we help clients
  mitigate risk, enhance efficiency, and navigate the
  operational complexities of today’s investment management
  landscape. As a division of Mitsubishi UFJ Financial Group
  (MUFG), one of the world’s largest financial institutions
  with approximately $3 trillion in assets, we combine deep
  expertise with the strength and stability of a leading
  financial institution. To learn more, visit us at www.mufg-
  investorservices.com.

  Job Description

  We are hiring a AI Solution Engineer to design and deliver
  AI-enabled platform capabilities and internal/external
  products. This is not a traditional full-stack role. Working
  closely within our AI Research and Development team, you
  will operate as an end-to-end owner, from integration
  through the whole engineering surface, shaping how AI agents
  are embedded into enterprise-grade systems. You will work at
  the intersection of product, platform, and AI, helping
  define the next generation of AI-native engineering within
  the organization.

  AI Feature Development & Enhancement

  - Build and evolve the technical layer of the Workflow and
    Agent AI Platform, the foundation teams use to design,
    run, and scale AI workflows and agents.
  - Own capabilities end to end, from integration through the
    whole engineering surface: design, delivery, production
    deployment, and continuous improvement.
  - Design and deliver AI-enabled features across frontend,
    backend, AI, and integration layers, turning business
    problems from stakeholders and customers into production-
    grade solutions.
  - Embed product functionality into AI-enabled workflows as
    consistent, reusable patterns, and enhance them using
    evaluation results, monitoring, and user feedback.
  - Contribute to architecture decisions that support
    scalability, observability, security, and long-term
    platform evolution.

  Collaboration & Delivery

  - Work closely with Data Scientists and AI Engineers to
    productionize research outputs.
  - Coordinate with Platform Engineers on deployment and
    infrastructure needs.
  - Support tactical AI solutions with team members and other
    groups as new business needs emerge.
  - Take part in code reviews, documentation, and knowledge
    sharing, contributing to shared delivery goals.

  #LI-Hybrid

  Qualifications

  You Have:

  - 3+ years of software engineering experience, with end-to-end
    ownership of complex products or platforms.
  - Strong proficiency in TypeScript and modern JavaScript,
    building production-grade applications;
  - Experience with modern frameworks; React preferred (Vue.js 3
    also welcome).
  - Strong proficiency in at least one backend language (Python
    preferred, but not required) and comfort working across
    frontend/backend boundaries.
  - Experience with relational databases (e.g. PostgreSQL), data
    modeling, and designing APIs and integrations.
  - Strong software engineering fundamentals: including clean
    architecture, evolvability, testing, code reviews and
    CI/CD discipline.

  Good to Have

  - Experience with MLOps tooling
  - Exposure to AI and agent frameworks (e.g., AWS Strands,
    Azure AI Agent Service, LangChain, LangSmith, CrewAI) is a
    plus
  - Experience with GenAI application development
  - Experience with cloud platforms (AWS, Azure) or data
    platforms (e.g., Databricks)
  - Financial services background.
  - Experience with design systems and accessibility standards.

  Additional Information

  What’s in it for you to join MUFG Investor Services? 

  Take a look at our careers site and you’ll find everything
  you’d expect from a career with the fastest-growing business
  at one of the world’s largest financial groups. Now take
  another look. Because it’s how we defy expectations that
  really defines us. You’ll feel that difference in all kinds
  of ways. Our vibrant CULTURE. Connected team. Love of
  innovation, laser client focus, and next-level LEARNING &
  DEVELOPMENT, we also talk the talk when it comes to HYBRID
  WORKING.  

  So, why settle for the ordinary? Apply now for a Brilliantly
  Different career.

  We thank all candidates for applying; however, only those
  proceeding to the interview stage will be contacted.

  MUFG is an equal opportunity employer.
