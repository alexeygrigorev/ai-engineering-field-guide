description: |
  82396 Senior Director, Java Full-Stack Engineer - AI Hub
  Engineering


  We’re seeking a future team member for the role of Senior
  Director, Java Full-Stack Engineering to join our Data
  Solutions & Services team.

  This role is located in New York, NY or Pittsburgh, PA.

  In this role, you’ll make an impact in the following ways:

  - Consult with internal business groups to provide advanced
    application software development services and technical
    support.
  - Design, develop, test, and maintain scalable full-stack
    applications using modern technologies and frameworks such
    as Java, React, Oracle, Kafka, Snowflake, Node.js,
    Angular, JavaScript, HTML, and CSS.
  - Develop high-quality, efficient, maintainable, and testable
    code while implementing automated testing and quality
    assurance practices.
  - Architect and implement AI-powered solutions utilizing Large
    Language Models (LLMs), vector databases, and
    orchestration frameworks.
  - Lead technical discovery, proof-of-concepts, prototyping,
    and innovation initiatives to evaluate emerging
    technologies and business solutions.
  - Provide senior-level technical consulting and strategic
    guidance to IT leadership and business stakeholders.
  - Establish and promote engineering best practices, coding
    standards, architectural principles, and development
    methodologies.
  - Design and develop automated test frameworks, test suites,
    flowcharts, documentation, and technical specifications.
  - Maintain software functionality, application performance,
    and platform modernization efforts while reducing
    technical debt.
  - Apply security, privacy, database, and architecture design
    principles throughout the software development lifecycle.
  - Participate in code reviews and mentor junior engineers to
    foster technical excellence and professional growth.
  - Collaborate closely with product, operations, data, and
    security teams to deliver end-to-end enterprise solutions.
  - Communicate complex technical concepts and architectural
    recommendations to both technical and non-technical
    stakeholders.
  - Influence technology decisions through architectural
    leadership, data-driven insights, and technology
    evaluations.
  - Drive execution of AI modernization initiatives while
    ensuring delivery commitments, platform stability,
    scalability, and future growth objectives are achieved.

  To be successful in this role, we’re seeking the following:

  - Bachelor's degree in Computer Science, Engineering, or a
    related discipline, or equivalent professional experience.
    Advanced degree preferred.
  - 15+ years of software development experience, preferably
    within financial services or securities industries.
  - Strong experience in full-stack development with expertise
    in Java, C#, Node.js, Angular, JavaScript, HTML, CSS,
    JSON, and related technologies.
  - Experience with modern application frameworks,
    containerization technologies, relational databases, and
    distributed systems.
  - Knowledge of software architecture, security principles,
    privacy controls, and enterprise application design.
  - Experience implementing vendor-specific and structured
    development methodologies.
  - Strong leadership, communication, organizational, and
    interpersonal skills with demonstrated mentoring
    experience.
  - Ability to stay current with emerging technologies and
    continuously drive innovation and learning.

  Preferred Qualifications

  - Experience building and deploying AI-enabled applications
    and intelligent automation solutions.
  - Experience influencing enterprise technology strategy and
    large-scale modernization initiatives.
  - Exposure to cloud-native architectures, event-driven
    systems, and enterprise integration frameworks.
  - Proven track record of balancing innovation initiatives with
    critical business delivery commitments.

