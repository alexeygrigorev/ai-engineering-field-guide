description: |
  About OLIX

  AI is growing faster than any technology in history, and the
  demand has created an infrastructure gap: we can no longer
  build chips or power stations fast enough to keep up. The
  industry still relies on a ten-year-old hardware blueprint
  that has reached its limit. The OLIX Decode Accelerator 1
  (DX-1) is the first accelerator architected specifically for
  decode. Rack-scale co-design of logic, data movement,
  packaging, optics and interconnect delivers a step change in
  system-level performance.

  The Role

  We build infrastructure for frontier AI, and we use AI to
  build it. Every team at OLIX works with AI tools, coding
  harnesses, models and agents, and we intend to use them
  more. We are hiring an AI Security Engineer to make that
  adoption safe without slowing it down.

  You will map our AI footprint, secure our agents and their
  identities, protect our compute infrastructure, and build
  the controls that stop our IP and data leaving through AI
  systems. You will give teams a fast path to adopt new tools
  and make AI security measurable. This is a hands-on, high-
  ownership role with the freedom to define AI security at
  OLIX from the ground up.

  Responsibilities

  - Map the AI footprint: build and maintain the inventory of AI
    tools, models, agents and data flows across the company.
  - Secure agents: give every agent a managed identity, least-
    privilege access, logged actions and the right human
    approvals.
  - Build controls against AI threats: prompt injection, data
    leakage, model and package supply chain, unsafe agent
    actions and shadow AI.
  - Secure AI infrastructure: harden the cloud compute our teams
    use to build and run AI workloads.
  - Make AI security measurable: run our ISO 42001 self-
    assessment and feed AI security events into our SIEM.
  - Enable safe adoption: review new AI tools within days and
    publish the guardrails teams need.

  Skills and experience

  - 5 or more years in security engineering, application
    security or cloud security, with at least 2 years securing
    AI or ML systems, LLM applications or agents.
  - Hands-on knowledge of LLM-specific threats and their
    mitigations.
  - Experience securing agentic systems: tool permissions, MCP
    servers, credentials and human approval steps.
  - AWS security experience and identity experience, ideally
    Okta.
  - Software engineering in Python or TypeScript.
  - Daily use of AI coding tools and agents in your own work.
  - Nice to have: experience with ISO 42001 or the NIST AI Risk
    Management Framework, or in a hardware or deep-tech
    company.

  Compensation and equity

  - Competitive salary: commensurate with your experience,
    skills and location.
  - Equity and ownership: meaningful stock options.
  - Proximity bonus: an annual Living-Local Bonus if you live
    within 20 minutes of the office.
  - Retirement benefits: employer-contributed retirement plans.

  Due to U.S. export control regulations, candidates'
  eligibility to work at OLIX depends on their most recent
  citizenship or permanent residency status. We are generally
  unable to consider applicants whose most recent citizenship
  or permanent residence is in certain restricted countries
  (currently including Iran, North Korea, Syria, Cuba, Russia,
  Belarus, China, Hong Kong, Macau, and Venezuela). Applicants
  who have subsequently obtained citizenship or permanent
  residency in another country not subject to these
  restrictions may still be eligible.
