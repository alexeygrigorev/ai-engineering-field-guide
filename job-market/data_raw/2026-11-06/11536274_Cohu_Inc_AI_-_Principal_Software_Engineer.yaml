  disability, medical conditions, pregnancy, genetic
  information, military or veteran status or any other legally
  protected category. In addition, reasonable accommodations
  are available to qualified disabled individuals, upon
  request. Globally, Cohu is committed to full compliance with
  all applicable laws and regulations governing employment, in
  the U.S. and in all other locations around the world where
  we have operations.
