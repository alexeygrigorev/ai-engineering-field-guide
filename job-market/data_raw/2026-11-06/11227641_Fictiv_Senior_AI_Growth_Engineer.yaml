description: |
  About MISUMI Americas

  MISUMI Americas, a division of MISUMI Group, is a leading
  provider of standard, configurable, and custom manufacturing
  solutions. By integrating a vast catalog of components with
  a world-class digital manufacturing platform, MISUMI
  Americas empowers engineers and procurement teams to
  accelerate innovation across the entire product lifecycle.
  With operations in the San Francisco Bay Area and Chicago,
  the company serves as a vital partner for the most
  innovative companies in the Americas.

  Role Summary (Impact in this Role): Objective / Purpose of
  the Position

  The Senior AI Growth Engineer builds the systems that power
  customer acquisition at MISUMI Americas. This is a builder
  role: the person who designs and ships the automated, AI-
  driven acquisition infrastructure — audience models,
  enrichment pipelines, personalization logic, and multi-touch
  campaign automation — that the demand generation function
  runs on.

  Areas of Responsibility: Essential Functions

  Acquisition Systems & Automation

  - Design, build, and maintain automated acquisition systems —
    including AI-driven outbound (e.g. AI SDR workflows),
    enrichment pipelines, lead routing, and lifecycle
    automation.
  - Build personalization logic for inbound and outbound
    programs, driven by audience segments, behavioral signals,
    and lifecycle stage, and operate it at scale.
  - Instrument and integrate the acquisition stack — CDP,
    marketing automation, CRM, and experimentation tooling —
    so data and triggers flow reliably across systems.

  Segment & Audience Intelligence

  - Mine quantitative and qualitative data to identify high-
    propensity customer segments, and build the models that
    score and prioritize acquisition targets.
  - Leverage AI and automation to enrich audience profiles,
    including data append, third-party signal aggregation, and
    web scraping where appropriate.

  Campaign Architecture & Experimentation

  - In partnership with the Director of Demand Generation and
    Director of Lifecycle Marketing, translate pipeline goals
    into automated campaign workflows spanning acquisition,
    onboarding, and account graduation.
  - Build the experimentation infrastructure that lets the team
    test messaging, offers, and channel mix, and turn winning
    pilots into evergreen, automated motions.
  - Build and maintain reporting dashboards that surface funnel
    performance, segment health, and campaign attribution for
    stakeholders.

  Cross-Functional Collaboration

  - Partner with the Director of Demand Generation and Director
    of Lifecycle marketing — building the platforms that the
    demand generation function operates.
  - Partner with the data and analytics team to access, clean,
    and model the data required for segmentation and
    measurement.
  - Collaborate with marketing operations, product marketing,
    and sales to align systems to messaging, territory, and
    outbound priorities.

  Desired Traits: Distinguished skills, abilities, features,
  character, and quality.

  - Systems thinker with a builder’s bias — defaults to
    automating a problem rather than executing it manually.
    Intellectually curious and analytically rigorous,
    comfortable in ambiguous, data-rich environments.
  - Entrepreneurial, with a bias toward testing, iteration, and
    measurable outcomes.
  - Excellent communicator, able to translate technical systems
    into narratives that both technical and non-technical
    stakeholders can act on.
  - Thrives in a fast-paced, high-growth environment.

  Physical Demands

  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.

  While performing the duties of this job, the employee
  routinely is required to sit; walk; talk and hear; use hands
  to keyboard, fingers, handle, and feel; stoop, kneel,
  crouch, twist, crawl, reach, and stretch.

  The compensation range for this position is $180,000 -
  $215,000 USD based on experience

  We’re actively seeking teammates who:

  - Bring diverse perspectives and experience to our culture and
    company.
  - Excel at being part of a strong, empathetic team.
  - Thrive in an environment emphasizing respect, honesty,
    collaboration, and growth.
  - Have an ‘always learning’ mindset that celebrates learning,
    not just wins.
  - Help us continue to build a world-class organization that
    values the contributions of all of our teammates

  We encourage applications from members of underrepresented
  groups, including but not limited to women, members of the
  LGBTQ community, people of color, people with disabilities,
  and veterans.
