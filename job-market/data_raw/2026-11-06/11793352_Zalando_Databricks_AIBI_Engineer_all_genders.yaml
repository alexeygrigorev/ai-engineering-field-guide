title: Databricks AI/BI Engineer (all genders)
company: Zalando
location: Berlin, DEU
work_type: FULL_TIME
company_size: 10,000 Employees
description: |
  THE ROLE & THE TEAM

  We are looking for a motivated and curious Software Engineer
  to join our team and grow their career in AI/BI. In this
  role, you will work closely with senior engineers to learn,
  build, and support our department’s Data Products. You will
  gain hands-on experience with the Databricks ecosystem,
  contributing to scalable data pipelines, learning to
  implement Data Governance, and helping design Metric Views,
  Genie and interactive Databricks Dashboards.

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Dashboards & Metrics: Help build Metric Views and develop
    interactive Databricks Dashboards to support data-driven
    decision-making across teams.

  - Data Product Support: Share responsibility for the
    reliability, quality, and performance of our department’s
    Data Products.

  - Pipeline Development: Assist in building and maintaining
    scalable ELT pipelines using Databricks Delta Live Tables
    (DLT) under the guidance of senior team members.

  - Governance & Security: Learn and apply Data Governance and
    security standards using Databricks Unity Catalog.

  - Data Quality & Problem Solving: Perform basic technical
    analysis and root cause analysis to troubleshoot data
    quality issues and Databricks dashboard failures.

  - Team Collaboration: Work closely with engineering teams and
    the Zalando Data Foundation to integrate and streamline
    data flows.

  - Knowledge Sharing: Document your work, record lessons
    learned, and participate in building a collaborative,
    high-performance data culture.

  WE’D LOVE TO MEET YOU IF

  - Metric View and Genie: Define and maintain metric views and
    business logic so natural language queries map correctly
    to governed KPIs.Build and maintain Genie Spaces,
    iterating on data room composition and instructions to
    improve response accuracy and relevance.

  - Databricks Fundamentals: You have foundational experience or
    hands-on coursework/project experience with Databricks
    (e.g., Unity Catalog, Delta Live Tables, Metric Views,
    Workflows, or Dashboard creation).

  - Programming & Spark: You are proficient in Python and have
    exposure to Apache Spark (PySpark) for data manipulation.

  - Data Architecture Concepts: You understand the basics of the
    Medallion Architecture (Bronze, Silver, Gold). Analyze
    failure modes (ambiguous questions, join errors,
    misinterpreted metrics) and iterate on fixes — via schema
    improvements, better metadata, or prompt/instruction
    tuning

  - Data Modeling: You can translate basic business requirements
    into clean tabular models optimized for analysis and
    reporting.

  - DevOps Basics: You have foundational knowledge of Version
    Control (Git) and basic familiarity with concepts like
    Docker, CI/CD, or Infrastructure as Code (Terraform).

  - Cloud & Web Basics: You possess a working understanding of
    Cloud basics (AWS) and REST APIs.

  - Soft Skills & Mindset: You have strong problem-solving
    skills, an eagerness to learn from senior peers, and good
    verbal and written English communication skills to
    document work clearly.

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - 27 days of holiday a year to start for full-time employees
    (+1 day for every calendar year up to 30 days)
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Lounge by Zalando, discounts from
    external partners
  - Family support, including counselling and dedicated services
    for parents and carers
  - Company pension scheme
  - Employee shares programme
  - Health and wellbeing options, including Wellhub
  - Mental health support and coaching
  - Development through our training platform and biannual peer-
    to-peer review
  - 2 paid volunteering days a year
  - Relocation assistance (subject to prior agreement)

  INCLUSIVE BY DESIGN

  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!

  At Zalando, our vision is to be the leading European
  technology platform for fashion and lifestyle – one that
  thrives on diversity and is truly inclusive by design. We
  believe that diverse teams fuel innovation and creativity,
  and we actively seek out talent from all backgrounds.

  We actively seek to reduce bias in our hiring and employment
  processes, focusing on your qualifications, skills, and
  contributions. To support this, we kindly ask that you
  refrain from including personal details such as your photo,
  age, or marital status in your CV, ensuring a fair and
  equitable evaluation based solely on your abilities and
  potential.

  We are committed to providing an exceptional and accessible
  candidate experience for everyone. If you require any
  accommodations to support you throughout the hiring process,
  please let us know – we are here to assist you.

  Discover more about our commitment to creating a diverse and
  inclusive workplace: https://jobs.zalando.com/en/our-
  culture/diversity-and-inclusion
