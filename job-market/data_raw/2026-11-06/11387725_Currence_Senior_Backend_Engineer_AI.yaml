description: |
  Location: London (ideally 3+ day per week in the office in
  Farringdon, London)

  Job Type: Full-time

  The Company

  Currence aims to move the world towards a cleaner, cheaper
  and faster energy ecosystem. We are an AI-native market
  intelligence company, looking at the energy build-out, which
  combines the speed of AI with the trust of expert research.

  Our core product consists of a data engine which builds a
  comprehensive view of the market. This feeds into models and
  frameworks built by our analysts to create proprietary
  insights which drives modern investment decisions.

  We're headquartered in London and New York.

  The Team

  We are a product focused engineering team, consisting of a
  mixture of AI and full-stack engineers. We’re looking for
  technology generalists to join our team.

  This is a hands-on, delivery-focused role in a start-up
  environment. That means you'll wear many hats and will often
  be asked to implement and run projects you've never done
  before (ranging from training models, to building data
  pipelines, to monitoring evals, designing data schemas,
  setting up MCP servers, and maintaining infrastructure).
  It's a great environment for picking up and learning new
  skills.

  Tech Stack

  We work primarily with Python, SQL, TypeScript/React and are
  hosted on AWS. But don’t worry too much about having
  experience with the specific tech stack - we are generally
  looking for people with strong core engineering skills and
  principles. We are looking for polyglots who believe
  specific technologies are just tools for tackling problems.

  The Role

  You’ll be working across our AI back-end (Python, Dagster)
  and the data layer (Postgresql, Elasticsearch, Iceberg). The
  kind of problems you may cover include:

  - Design, build, evaluate and deploy automations for agentic
    workflows, retrieval strategies, and LLM-powered data
    pipelines.
  - Creating evals for multi-step agent workflows
  - Add proactive intelligence inside the data pipelines from
    ingestion all the way to consumption
  - Create interfaces that make agent behavior easier to
    inspect, steer, and trust by internal users

  You can also expect to:

  - Work closely with product, research and commercial teams to
    define what “good” looks like
  - Take ownership of our codebase, balancing high-quality code,
    security and speed of development
  - Own and drive forward PoCs and solve broad technical
    challenges

  The Essentials

  - 5+ years experience as a Software Engineer or equivalent
  - Experience in data and AI engineering deploying AI
    applications in production, including RAG pipelines, agent
    orchestration, and performance monitoring.
  - Proven history developing and maintaining production-grade
    software and systems
  - Wanting to work in a small fast-moving team with high
    ownership and impact.

  Big Plus

  - Experience working with data pipelines at scale
  - Experience with cloud infrastructure (AWS), Dagster,
    Kubernetes, and high-throughput background processing
  - Working understanding of energy and climate tech sectors

  Application process

  - Video call with the VP Engineering (30min)
  - In-person whiteboarding session (90min)
  - In-person / video call pairing session (60min)
  - References and offer

  Our Offer

  - Opportunity to work and learn in a tech start-up environment
  - To help us make an impact in the race to net zero
  - The excitement and fun of being part of a growing, dedicated
    and professional start-up
  - Stock options
  - 25 days annual leave + bank holidays

  Currence is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
