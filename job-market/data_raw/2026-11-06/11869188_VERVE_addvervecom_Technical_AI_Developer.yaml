description: |
  About Verve

  At Verve, we’re redefining how insight works in an AI-
  powered world — combining Human, Cultural and Artificial
  Intelligence to help clients act with greater speed and
  confidence.

  Through Verve Vero — our AI-powered platform and consultancy
  ecosystem — we build AI-enabled insight tools, simulations
  and models that bring human truth into the heart of
  decision-making. From Verve Intelligent Personas &
  Simulations to bespoke solutions grounded in client data,
  everything we create is designed to enable confident
  decisions of consequence with real-world impact.

  Our work spans categories and continents, helping global
  brands navigate complex challenges — from innovation and
  brand strategy to customer experience and future planning.
  We combine deep human understanding with AI to deliver
  insight that is faster, more scalable, and more actionable.

  This is a hands-on environment. We move quickly, test and
  learn, and continuously build and refine the tools that
  power our work. Curiosity, experimentation and practical
  application sit at the heart of how we operate.

  About the Role

  If you’re a hands-on technical builder who wants to
  experiment with AI and turn ideas into working products —
  this is it.

  As a Technical AI Developer in our R&D Lab, you’ll be
  responsible for bringing ideas to life — rapidly
  prototyping, testing emerging technologies and building the
  technical foundations of new Vero tools and processes.

  This isn’t a role where you’ll simply oversee development.
  You’ll build.

  You’ll work closely with our product team and wider R&D
  colleagues to explore what’s possible, test ideas quickly
  and turn the strongest experiments into robust, scalable
  solutions.

  Your Contribution

  - Rapidly prototype new AI-enabled Vero tools, features and
    processes
  - Build and test solutions using Python, APIs, LLMs and
    emerging AI technologies
  - Develop and experiment with RAG, vector embeddings, MCP and
    agentic pipelines
  - Explore new technologies and assess where they can solve
    real user and business problems
  - Run fast, lightweight technical experiments to test
    feasibility and value
  - Build integrations between AI models, data sources and other
    services
  - Test, debug and refine prototypes based on real-world use
  - Improve the technical performance and capability of existing
    Vero tools and workflows
  - Work with product and R&D colleagues to translate successful
    prototypes into production-ready solutions
  - Bring technical judgement to decisions around feasibility,
    scalability and how things should be built

  What We’re Looking For

  - Strong, hands-on Python experience
  - Practical experience building with LLMs and APIs
  - Working knowledge of AI concepts and infrastructure
    including prompt engineering, RAG, MCP, vector embeddings
    and agentic pipelines
  - Evidence that you’ve built and experimented with AI
    applications, not just worked alongside teams that have
  - A practical problem-solving mindset — you like making
    things, testing them and figuring out why they don’t work
  - Comfortable experimenting with emerging technologies where
    there may not yet be a clear playbook
  - Able to balance speed of experimentation with building
    solutions that can ultimately scale
  - Comfortable working collaboratively with product and other
    non-technical colleagues
  - Able to explain technical decisions and complexity clearly
  - A growth mindset — you’re comfortable with ambiguity, take
    initiative and thrive in fast-moving, entrepreneurial
    environments
  - A Computer Science degree or similar is preferred, but not
    required.

  Bonus Points For

  - Experience building modern web applications, for example
    using React or TypeScript
  - Experience using rapid prototyping or low/no-code tools such
    as Lovable
  - Experience building AI tools that improve business processes
    or ways of working
  - Experience taking early-stage AI experiments towards
    production
  - Experience in the market research or insight sector

  What We Offer

  - Exposure to cutting-edge AI tools and thinking — practical,
    not theoretical
  - The opportunity to build AI products that solve genuine
    business and insight problems
  - Working at the intersection of AI, technology, product and
    consultancy
  - A fast-paced, agile and empowering environment
  - Autonomy to experiment, test, learn and influence how things
    get built
  - Collaboration with an ambitious global team solving real-
    world problems

  If you’re excited by the opportunity to build the tools
  shaping the future of AI-empowered consultancy —
  experimenting quickly, solving difficult technical problems
  and turning ideas into things people can actually use — we’d
  love to hear from you.

  By applying to Verve, you acknowledge our use of AI-assisted
  tools to help screen applications against job-related
  criteria. All outcomes are reviewed by humans and are not
  determinative. You can request human review, express your
  views, or contest any assessment at any time via
  privacymanagement@addverve.com. Full details can be found in
  our Recruitment Privacy Notice.
