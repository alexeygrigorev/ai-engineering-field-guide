description: |
  About CloudRaft

  CloudRaft builds AI and cloud-native platforms for
  enterprises and startups. We move fast, argue about hard
  problems, and ship things. If you want to grow quickly and
  work on stuff that actually matters to customers, this is a
  good place to be.

  The Role

  We're looking for engineers who build first and ask
  questions later. You'll work on AI agents, data pipelines,
  Kubernetes deployments — whatever it takes to get a system
  working in the real world. This is a high-ownership role in
  a startup that moves fast. You'll design, experiment, ship,
  and iterate. You should have strong opinions about what good
  engineering looks like.

  This role is probably not for you if you need detailed specs
  before starting, prefer narrowly defined work, or aren't
  comfortable talking directly with customers.

  What you'll do

  - Build AI systems that solve actual business problems, not
    demos
  - Work directly with customers to turn business challenges
    into technical solutions
  - Design and deploy AI applications that automate workflows
  - Run experiments, measure results, and iterate quickly
  - Ship production-ready code across backend systems, APIs,
    data pipelines, and models
  - Make smart trade-offs between getting it right and getting
    it done (we bias toward shipping)
  - Own outcomes, not just tasks

  What we're looking for

  - 1–2 years in software engineering, AI, internships, or
    research
  - Strong computer science fundamentals and system design
    experience
  - Clean, testable code — and enough AI experience to know when
    a model is generating bad code
  - Solid understanding of AI basics: Large language models,
    agentic systems, data preprocessing, MCP, multimodal
    systems, data retrieval and memory.
  - Some familiarity with cloud platforms or Kubernetes
  - Comfortable working with ambiguity and minimal hand-holding
  - Strong communication skills — you'll be talking to customers
    regularly
  - Engineering degree from an accredited university

  When applying, include your portfolio and a short note on
  why this role is a good fit for you specifically!

  Compensation Range: INR 5,00,000 - INR 10,00,000 Per Annum.
