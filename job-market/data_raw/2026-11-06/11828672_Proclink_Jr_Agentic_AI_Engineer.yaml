description: |
  Job Description

  We are looking for passionate and experienced Agentic AI
  Engineers across Junior, Senior, and Lead levels to design,
  develop, and deploy next-generation AI agents using GitHub
  Copilot Agent SDK, Microsoft Agent Framework, and Python.
  The ideal candidate should have strong expertise in building
  autonomous and multi-agent systems, integrating LLMs,
  implementing Agentic AI workflows, and delivering
  enterprise-grade AI solutions.

  The role involves architecting intelligent agents, enabling
  agent-to-agent collaboration, integrating enterprise tools
  and data sources, implementing RAG solutions, and deploying
  scalable AI applications in cloud environments.

  Responsibilities

    - Design, develop, and deploy AI agents using GitHub Copilot
      Agent SDK and Microsoft Agent Framework.
    - Build autonomous, multi-agent, and workflow-driven AI
      solutions for enterprise use cases.
    - Develop agent orchestration, tool-calling, function-calling,
      and human-in-the-loop workflows.
    - Implement memory management, context handling, and agent
      communication patterns.
    - Design and develop scalable backend services using Python
      and FastAPI.
    - Build Retrieval-Augmented Generation (RAG) solutions using
      vector databases and semantic search techniques.
    - Integrate AI agents with enterprise applications, APIs,
      databases, and external tools.
    - Develop and optimize prompt engineering strategies for
      improved agent performance.
    - Design, implement, and maintain CI/CD pipelines for AI agent
      deployments.
    - Monitor, evaluate, and continuously improve agent
      performance, accuracy, and operational efficiency.
    - Collaborate with cross-functional teams including Product,
      QA, Engineering, and DevOps teams.
    - Contribute to architecture design, technical documentation,
      and best practices for Agentic AI development.

  Skills and Qualifications

    - 2.5+ years' experience in software engineering and AI
      solution development.
    - Strong Python fundamentals.
    - Basic experience with LLMs and AI agent development.
    - API integration and workflow automation experience.
    - Ability to develop and support enterprise AI agents under
      guidance.

  Preferred Qualifications

    - Experience with Microsoft AI Foundry, Prompt Flow, and AI
      model deployment.
    - Knowledge of Azure OpenAI, Azure AI Services, and Azure
      cloud-native solutions.
    - Experience with Vector Databases such as Azure AI Search,
    - Understanding of Model Context Protocol (MCP) and tool
      integration frameworks.
    - Hands-on experience with Docker, Kubernetes, and
      containerized deployments.
    - Experience implementing enterprise-grade security,
      governance, and compliance controls for AI applications.
    - Knowledge of DevOps practices, GitHub Actions, and CI/CD
      automation.
    - Experience leading AI projects and mentoring engineering
      teams (Senior/Lead positions).
    - Bachelor’s or master’s degree in computer science,
      Artificial Intelligence, Data Science, or a related
      field.
