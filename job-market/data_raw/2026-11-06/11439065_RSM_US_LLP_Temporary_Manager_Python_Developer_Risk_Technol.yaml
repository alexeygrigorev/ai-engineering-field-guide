  Temporary Manager – Python Developer, Risk Technology & AI
  Position Summary

  RSM IS seeking a hands-on Python Developer at the Manager
  level to support technology, AI, and automation initiatives
  within our Risk Consulting practice. This temporary role
  will focus on developing and scaling Python-based solutions
  that enhance credit review and other risk-related workflows.

  The ideal candidate brings strong Python development
  experience, exposure to AI and large language models (LLMs),
  and experience building solutions that process large volumes
  of structured and unstructured data. Experience working in
  financial services, risk, credit review, audit, or another
  regulated environment is highly preferred.

  Key Responsibilities

  - Develop, enhance, and scale Python-based applications,
    scripts, and automation solutions supporting credit review
    and risk workflows.
  - Build solutions capable of processing large volumes of
    structured and unstructured data.
  - Develop and maintain document ingestion, extraction, and
    analysis pipelines across PDFs, images, spreadsheets, and
    other file formats.
  - Enhance existing AI and automation solutions and expand
    their use across additional lending portfolios and
    business use cases.
  - Integrate large language models (LLMs) using OpenAI APIs and
    related technologies to support workflow automation,
    document analysis, and data processing.
  - Design solutions that produce structured, traceable, and
    auditable outputs appropriate for governance, reporting,
    and review.
  - Partner with business stakeholders to identify automation
    opportunities and translate requirements into scalable
    technical solutions.
  - Support broader AI, automation, analytics, and process
    transformation initiatives across the practice.

  Qualifications

  - Strong hands-on Python development experience, including
    building applications, scripts, data-processing solutions,
    or automation workflows.
  - Experience developing solutions that process and analyze
    both structured and unstructured data.
  - Experience with AI, generative AI, LLMs, or related
    automation technologies.
  - Experience integrating OpenAI APIs or comparable LLM
    technologies into applications or workflows.
  - Experience building and deploying scalable AI or automation
    solutions, preferably within a regulated environment.
  - Ability to translate business requirements into practical,
    scalable technical solutions.
  - Strong problem-solving, communication, and stakeholder
    management skills.
  - Ability to operate independently while collaborating
    effectively with both technical and business teams.

  Preferred Qualifications

  - Experience developing Alteryx workflows and ETL processes.
  - Experience with Power BI, dashboard modernization, or
    reporting automation.
  - Experience within financial services, credit risk, credit
    review, risk management, or internal audit.
  - Experience developing technology solutions within a
    regulated environment.

