  Senior Software Development Engineer - AI and Optimization



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  About the Role

  As a Senior Software Development Engineer within HPE's
  Product Security Office, you will design, build, and scale
  AI-enabled security applications that improve engineering
  productivity, security analysis, automation, and decision-
  making across the enterprise. You will combine software
  engineering, AI/ML, large language models, agentic
  workflows, data engineering, and secure development
  practices to create capabilities that accelerate how Product
  Security teams identify risk, generate insight, and drive
  remediation.

  This role requires strong technical depth, systems thinking,
  and a builder mindset. You will work across Product
  Security, engineering, data, and platform teams to transform
  complex security challenges into scalable software solutions
  that deliver measurable impact.

  About You

  You are an experienced software engineer who enjoys building
  new capabilities from ambiguous problems. You combine strong
  software engineering fundamentals with curiosity about AI
  technologies and their practical application to
  cybersecurity challenges.

  You can move comfortably between architecture discussions,
  hands-on development, AI experimentation, and production
  deployment. You focus on delivering solutions that are
  maintainable, scalable, and measurable, and you look for
  opportunities to create capabilities that continue
  delivering value long after the initial implementation is
  complete.

  What you’ll do:

  - Lead the design, development, and delivery of complex
    software applications and platforms, providing technical
    leadership across solution design, analysis, coding,
    testing, integration, and deployment activities.

  - Drive end-to-end execution of software engineering
    initiatives, ensuring solutions are scalable,
    maintainable, secure, and aligned with business and
    technical objectives.

  - Review and evaluate software designs, architecture
    decisions, and development activities to ensure alignment
    with engineering standards, improve solution quality, and
    reduce operational and delivery risk.

  - Provide technical expertise and engineering leadership for
    cross-functional projects, influencing technical
    direction, resolving complex challenges, and enabling
    successful delivery across organizational boundaries.

  - Champion the evaluation, adoption, and integration of
    emerging technologies, tools, and engineering practices
    that improve product capabilities, developer productivity,
    and overall solution effectiveness.

  - Contribute to the definition and evolution of software
    engineering standards, development methodologies, and best
    practices that support consistent and high-quality
    delivery.

  - Mentor and coach engineers through technical guidance,
    design reviews, knowledge sharing, and hands-on
    collaboration, helping to strengthen engineering
    capability across the team.

  What you need to bring:

  - Bachelor's or Master's degree in Computer Science,
    Information Systems, or a related discipline, or
    equivalent practical experience.

  - Typically 6-10 years of software engineering experience
    designing and delivering enterprise applications and
    platforms.

  - Experience developing applications using the MERN stack and
    Python.

  - Experience with CI/CD pipelines and tools such as GitOps,
    Docker, Jenkins, or GitHub Actions.

  - Experience with software systems architecture, including
    designing and integrating solutions across multiple
    platform types.

  - Experience evaluating software testing methodologies,
    developing test plans, debugging complex issues, and
    creating testing tools and automation.

  - Experience working with AI/ML, cloud technologies, MLOps,
    large language models, and agentic AI concepts.

  Experience and Expertise

  - Understanding of AI security, responsible AI principles, and
    governance frameworks.

  - Understanding of OWASP Top 10 vulnerabilities and secure
    coding practices.

  - Experience with a variety of software design tools,
    frameworks, and programming languages.

  - Strong analytical and problem-solving capabilities.

  - Strong written and verbal communication skills, including
    the ability to communicate technical concepts, product
    architectures, and design proposals to technical and
    senior leadership audiences.

  - Ability to evaluate alternatives, influence technical
    direction, and build alignment across stakeholders.

  Accessibility

  HPE is committed to creating an inclusive and accessible
  workplace and encourages applications from all qualified
  individuals, including those with disabilities. If you
  believe you require accommodation during any stage of the
  application or interview process, please submit your request
  by completing our secure form linked here.

  Note: This option is reserved for applicants needing
  assistance/reasonable accommodation related to a disability.

  What We Can Offer You:

  Health & Wellbeing

  We strive to provide our team members and their loved ones
  with a comprehensive suite of benefits that supports their
  physical, financial and emotional wellbeing.

  Personal & Professional Development

  We also invest in your career because the better you are,
  the better we all are. We have specific programs catered to
  helping you reach any career goals you have — whether you
  want to become a knowledge expert in your field or apply
  your skills to another division.

  Unconditional Inclusion

  We are unconditionally inclusive in the way we work and
  celebrate individual uniqueness. We know varied backgrounds
  are valued and succeed here. We have the flexibility to
  manage our work and personal needs. We make bold moves,
  together, and are a force for good.

