description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you.   Role Overview We are
  looking for an AI Data Engineer with 2–5 years of experience
  in building and supporting scalable data pipelines and
  cloud-based data solutions. The role will primarily focus on
  data engineering using GCP, Python, PySpark, SQL, and cloud
  data platforms, while providing opportunities to work with
  emerging AI and Generative AI use cases. The ideal candidate
  should have strong data engineering fundamentals, hands-on
  experience with ETL/ELT pipelines, and an interest in
  applying data engineering skills to AI-enabled solutions.
  Key Responsibilities • Develop and maintain ETL/ELT data
  pipelines for batch data processing and analytics workloads.
  • Build data transformation solutions using Python, PySpark,
  and SQL. • Work with Databricks to ingest, transform,
  process, and curate enterprise datasets. • Integrate data
  from relational databases, APIs, files, and cloud storage. •
  Support migration of datasets and pipelines from legacy or
  existing platforms to modern cloud-based data platforms. •
  Perform data validation, reconciliation, and quality checks
  to ensure accuracy and completeness of migrated and
  processed data. • Develop and maintain datasets and data
  models used by reporting, analytics, and downstream
  applications. • Work with Azure Data Lake and related Azure
  data services for storing and processing enterprise data. •
  Troubleshoot data pipeline failures, performance issues, and
  data quality problems. • Participate in code reviews and
  follow standard development, testing, deployment, and CI/CD
  practices. • Collaborate with Data Engineers, Analysts, Data
  Scientists, and business teams to understand data
  requirements. • Support AI-related data requirements such as
  preparing and processing structured and unstructured
  datasets. • Gain hands-on exposure to Generative AI
  concepts, LLMs and Retrieval-Augmented Generation (RAG) as
  part of AI-enabled data initiatives. Required Skills • 2–5
  years of experience in Data Engineering, Data Analytics
  Engineering, or a related role. • Good hands-on experience
  with Python. • Strong working knowledge of SQL. • Experience
  with Spark / PySpark for data processing. • Hands-on
  experience with Databricks or a similar cloud data
  processing platform. • Experience developing and maintaining
  ETL/ELT pipelines. • Understanding of Data Lake / Lakehouse
  concepts. • Experience working with structured and semi-
  structured data such as CSV, JSON, and Parquet. •
  Understanding of data quality, data validation, and
  reconciliation techniques. • Experience with at least one
  cloud platform, preferably Microsoft Azure. • Familiarity
  with Git and CI/CD / DevOps practices. • Good analytical and
  troubleshooting skills. Candidates should be willing to
  learn and work with: • Generative AI and Large Language
  Models (LLMs) • Preparing enterprise data for AI use cases •
  Embeddings and semantic search • Vector databases / vector
  search • Retrieval-Augmented Generation (RAG) • AI-assisted
  data engineering and automation Qualifications • Bachelor's
  degree in Computer Science, Information Technology,
  Engineering, or a related field. • 2–5 years of relevant
  Data Engineering experience. • Strong willingness to learn
  new data and AI technologies. • Good communication, problem-
  solving, and collaboration skills.

