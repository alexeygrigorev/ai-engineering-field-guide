description: |
  About AKASA

  AKASA is building the future of healthcare by developing AI-
  native solutions for some of healthcare’s most complex,
  consequential work. Our customers include the most
  innovative health systems in the country, like Cleveland
  Clinic, Mayo Clinic, NewYork-Presbyterian, Duke, Stanford,
  and Johns Hopkins. Our customer base represents 1 in 10
  inpatient discharges across the United States and more than
  $180B+ in net patient revenue.



  Our products help health systems comprehensively capture and
  communicate the full patient clinical journey. By empowering
  health systems to streamline their operations, they can
  focus on what matters most - delivering quality patient
  care.



  We train internal models and build domain-specific harnesses
  to power our products and best capture clinical nuance for
  each customer. We hire people with high agency and good
  judgment. Everyone here is an owner and builder who is
  looking to help solve high stakes challenges every day.

  We have raised over $250M in funding from investors such as
  Andreessen Horowitz, BOND, and Coatue. Our deployments have
  been recognized nationally as "one of the most comprehensive
  real-world uses of GenAI in healthcare finance to date"
  (link).

  Some of our recent recognitions include being named one of
  America's Top Startup Employers 2026 by Forbes, a Top
  Healthcare Technology Company of 2026 by Healthcare
  Technology Report, the #1 most promising healthcare RCM
  startup of 2025 by Black Book Market Research, and we have
  been certified as a “Great Place to Work” for the past 6
  years in a row.

  About the Role

  As an Applied AI Engineer, you will be building AI-powered
  solutions across our Clinical Documentation and Medical
  Coding suite. You will work closely with the product,
  design, and machine learning teams to design and build the
  services, APIs, and tools that undergird our SaaS products.



  Together with the broader team, you will work on AI-native
  products that correct clinical errors for hundreds of
  thousands of patients, and deliver hundreds of millions of
  dollars in measurable value for our customers.



  These products improve the quality of physician
  documentation, help clinicians identify missing diagnoses,
  convert documentation to medical codes and ensure financial
  integrity for health systems. The interfaces you develop
  help thousands of clinicians and hospital staff tackle some
  of the most challenging and high-impact patient encounters
  in U.S. healthcare.

  What You'll Do

  - Build features and products driven by LLMs. You will touch
    the whole stack, from designing agentic systems for
    revenue cycle workflows to the infrastructure that runs
    them in production across hundreds of hospitals.
  - Work alongside strong subject matter experts on complex,
    challenging problems that span from high-stakes clinical
    diagnoses to regulated medical billing with no easy
    answers.
  - Deploy the evaluation frameworks and experimentation loops
    that deliver reliable, production-grade systems. You'll
    use data-driven and statistical approaches to balance
    across medical coding guidelines, user feedback, and
    auditability.
  - Partner directly with product, clinical, and revenue cycle
    experts to push the frontier of what AI can do inside the
    healthcare revenue cycle.



  What We're Looking For

  - Bachelor of Science in Computer Science/Software Engineering
    or related field
  - 3+ years in a technical role with a strong foundation in AI
    and data analysis or backend systems
  - 1+ years shipping production AI systems to end users
  - Experience designing offline/online evaluations and landing
    agentic systems
  - Proficiency in Python
  - Thrives in a startup environment working on challenging
    problems
  - Healthcare technology experience (EDI,HL7,FHIR) is a plus

  What We Offer

  - Flexible paid time off (PTO)
  - Expansive coverage for health, dental, and vision
  - Employer contribution to Health Savings Accounts (HSA)
  - Generous parental leave policy
  - Full employee coverage for life insurance
  - Home office stipend
  - Cell phone/internet reimbursement
  - Company-paid holidays
  - 401(K) plan

  Compensation

  - Based on market data and other factors, the salary range for
    this position is $180,000-$250,000 + Equity. However, a
    salary higher or lower than this range may be appropriate
    for a candidate whose qualifications differ meaningfully
    from those listed in the job description.

  We’re committed to doing the best work of our lives,
  together. Come see if we're the right team for you.

  AKASA is a proud equal opportunity employer and we believe
  that a diverse and inclusive workforce is an imperative. We
  welcome people of different backgrounds, genders, races,
  ethnicities, abilities, sexual orientations, and
  perspectives, just to name a few. We do not discriminate
  based upon any protected class and we encourage candidates
  of all identities and backgrounds to apply. AKASA considers
  qualified applicants regardless of criminal histories in
  accordance with the San Francisco Fair Chance Ordinance.

  AKASA is committed to providing reasonable accommodations
  for candidates with disabilities in our recruiting process.
  If you need any assistance or accommodations due to a
  disability, please let us know at recruiting@akasa.com.
