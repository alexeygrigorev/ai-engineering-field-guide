job_id: 12011554
title: Integrations Engineer, AI Services
company: Virtuous
location: USA
remote: true
work_type: FULL_TIME
description: |
  Position Summary

  Virtuous is building something exciting inside our Customer
  Experience organization: a small, technically elite Services
  function designed to deliver high-impact, productized
  solutions to nonprofits at scale. This is a builder role.

  The Integrations Engineer, AI Services requires deep
  technical experience and the creativity to solve customer
  problems by designing and delivering integrations and AI-
  powered solutions, and doing it in a way that is repeatable,
  documented, and scalable across our client base.

  The model we have in mind is closer to a Forward Deployed
  Engineer than a traditional Developer. You will own the full
  arc of discovery, solution design, build, delivery, and
  iteration. You will also be central to productizing what you
  build, turning individual engagements into packaged
  offerings that can be sold and delivered to many customers
  as part of a new market place.

  What You'll Own

  Deploy Into Customer Problems

  - Embed with nonprofit customers to understand their data
    ecosystems, operational workflows, and integration gaps,
    not just surface-level requirements.
  - Lead technical discovery and solution design, translating
    dynamic, complex customer environments into scoped,
    deliverable solutions.
  - Build and maintain customer trust as a technical expert who
    understands the nonprofit space from the inside.

  Build Integration and AI-Powered Solutions

  - Design and implement integration pipelines between Virtuous
    and external systems, such as Accounting and ERP
    platforms, caging/mail processing, event software, phone
    operations, and more.
  - Build human-in-the-loop AI applications that surface data to
    staff for review and action, reducing manual effort while
    preserving data quality.
  - Develop shared infrastructure components that power all
    solutions; authentication, logging, monitoring, error
    handling, API/webhook management, etc.
  - Use AI-assisted development deliberately and effectively.
    Define the problem space precisely so AI can generate
    conformant, high-quality code reliably.

  Productize What You Build

  - Document every solution with the rigor of someone building a
    product, not just delivering a one-off project, that helps
    identify patterns, design frameworks, and architect
    playbooks that make the next engagement faster.
  - Identify which solutions are candidates for productization,
    such as common integration patterns that can be packaged,
    priced, and sold to multiple customers with efficiency and
    lower cost.
  - Partner with CX leadership to shape the AI Services catalog
    based on what you learn in the field.

  Operate as a Revenue-Generating Function

  - Scope and price engagements in partnership with the Services
    team. Your work carries a cost and a margin target.
  - Deliver against defined SOWs with clear deliverables,
    timelines, and quality standards.
  - Contribute to revenue reporting and provide feedback on
    pricing and packaging as the function matures.

  Bridge CX and Product

  - Feed structured product feedback to EPD based on patterns
    you observe across customer integrations. You are one of
    the best signals in the company to help identify where the
    product falls short and where it can be enhanced.
  - Collaborate across Sales, CS, and Implementation to identify
    customers who would benefit from additional Services
    offerings.

  You Must Have

  - 5+ years of hands-on technical work in a customer-facing
    environment, with direct ownership of integration design
    and delivery
  - Production experience building API integrations, ETL
    pipelines, and webhook-driven automation, not just
    configuring tools, but writing code
  - Demonstrated ability to work across the full solution
    lifecycle; discovery, design, build, testing, deployment,
    and documentation
  - Experience building and deploying AI-assisted workflows,
    including LLM integration and human-in-the-loop
    application design
  - Experience working in cloud services environments (AWS,
    Azure, GCP) including deployment, monitoring, and scaling
  - Strong written and verbal communication; you can explain
    technical architecture to a nonprofit COO without losing
    them
  - Deep understanding of nonprofit operations, fundraising
    workflows, or the nonprofit CRM space
  - A builder's instinct; you see a repeatable problem and
    immediately think about how to systematize it

  Strong Signal

  - Direct Virtuous CRM experience, either as a customer,
    implementer, or developer building against the Virtuous
    API
  - Experience with caging, mail processing, or phone operations
    integrations in a nonprofit context
  - Familiarity with Blackbaud or other nonprofit CRM migrations
  - Backend development experience in SQL, Python, Node.js, or
    similar, particularly for data transformation and pipeline
    logic
  - Experience building and maintaining production monitoring
    dashboards and audit logging infrastructure
  - A portfolio of solutions you built, maintained, and are
    proud of

  Why This Role

  This is a first-of-its-kind position at Virtuous. You will
  have direct influence over how we build AI Services as a
  function, including what we offer, how we price it, and how
  we deliver it. You will not be executing someone else's
  playbook. You will be writing it.

  Virtuous works exclusively with nonprofits. Our customers
  are organizations doing meaningful work in the world, and
  they are chronically under-resourced technically. The
  solutions you build will have a direct, measurable impact on
  their ability to operate and raise money. That is not a
  throwaway line, it is the thing our customers tell us
  matters most.

  If you have spent time deep inside the Virtuous ecosystem
  and have strong opinions about what it could do for
  nonprofits if it were better integrated, better automated,
  and better instrumented, this role was designed with you in
  mind.

  About Us

  Virtuous software is powering the world’s leading nonprofits
  and inspiring a new generation of generosity.

  At Virtuous, we believe generosity has the power to
  transform the world - and so we are on a mission to create
  $10B in net new generosity by helping nonprofits better
  connect with and inspire their donors.

  Our talented team is hungry, humble, and committed to
  delivering best-in-class software solutions, customer
  success interactions, and sales experiences to the nonprofit
  community.

  Our values are more than just a poster on the wall. Instead,
  our mission and values are precisely why candidates choose
  Virtuous. Our core values are:

  - Build Better: We build audacious ideas to accelerate
    philanthropy and dismantle the status quo.
  - Display Radical Generosity: We are generous with our time &
    talent as we serve our team and the nonprofit community.
  - Stay Humble & Enjoy the Journey: We take our work seriously,
    but we don't take ourselves too seriously.

  Virtuous should act as a career accelerator for everyone on
  our team. Team members should look back at their time at
  Virtuous as one of the most productive and stretching
  seasons in their professional lives. This means that working
  at Virtuous isn't for everybody. It is for the select few
  who are ready to do hard things and build something truly
  great.

  If this sounds like you, we’d love for you to apply!

  What We Offer

  - Market competitive pay leveraging Carta data
  - Employee recognition through Bonusly (birthdays,
    anniversaries, achievements, etc.)
  - 401(k) retirement plan with company matching- 50% match up
    to 6% of compensation after 90 days
  - We value our employee’s work-life balance and encourage
    taking advantage of Unlimited PTO
  - Supportive time off including paid volunteer days and
    company holidays
  - Employer-contributed healthcare benefits, encompassing
    medical, dental, and vision coverage, with plans available
    for dependents and choices for Health Savings Accounts
    (HSA) and Flexible Spending Accounts (FSA).
  - 12 weeks primary parent leave, 4 weeks secondary parent
    leave - full pay (adoption as well)
  - We pride ourselves on Community and host exciting company
    outings and events.

  We’ve recently noticed an increase in recruitment scams
  where individuals are impersonating recruiters to obtain
  personal or financial information through fraudulent
  interviews and job offers. Please note that all legitimate
  communication from Virtuous will only come from the
  @virtuous.org domain. If you receive a message from other
  domains, even if they look similar (e.g.,
  virtuouscareers.org or virtuousjobs.com), they are not
  legitimate and we recommend disregarding it immediately.
