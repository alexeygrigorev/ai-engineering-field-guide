description: |
  Job Description

  At SIXT, AI is changing how work gets done and we are
  looking for the person who will help us do it safely. As an
  AI Security Engineer, you will shape how SIXT understands,
  assesses, and secures AI usage across the organisation,
  exploring where AI touches our data and systems, defining
  what safe usage looks like, and building the detections and
  controls that keep AI behaviour secure. This is a builder's
  role at the frontier of a fast-moving field handson, high-
  ownership, and directly influential in making responsible AI
  adoption real at a global scale. If you are excited about
  defining what secure AI looks like inside a world-class
  organisation, apply now and become part of Team Orange.

  YOUR ROLE AT SIXT

  - You assess AI tooling and AI-built applications across SIXT,
    identify and derive associated security risks, and present
    clear, actionable findings to relevant stakeholders for
    informed decision-making
  - You author remediation policies that keep AI usage inside
    agreed boundaries, automating enforcement so it does not
    depend on manual review
  - You partner with teams and business units building their own
    AI-powered tools, steering them toward more secure
    approaches and making risk-based decisions on what AI
    usage is acceptable
  - You define the baseline of healthy, productive AI usage that
    SIXT should actively encourage, and track progress through
    clear KPIs that show how risk is being reduced over time
  - You respond to AI-related security incidents, containing
    issues quickly and decisively, and work continuously with
    security and engineering teams to improve and automate AI
    governance controls
  - You partner with Security, Legal, and Data Protection
    colleagues to keep AI usage aligned with the EU AI Act,
    GDPR, and other evolving regulatory obligations

  YOUR SKILLS MATTER

  - Education & Experience You have Bachelor's or Master's
    degree in Computer Science or a related discipline, with
    3–5 years of experience in security engineering
  - Security Assessment You run pragmatic security assessments,
    translate risk patterns into reliable rules including
    deterministic detections, remediation policies, regular
    expressions and propose safer alternatives constructively
    without becoming a blocker
  - AI Security Knowledge You bring real knowledge of AI-
    specific threats such as prompt injection, indirect prompt
    injection, and agentic and tool-use risks, alongside a
    solid understanding of modern AI architectures including
    LLMs, RAG systems, and tool-use workflows
  - Risk Methodology You have practical experience applying a
    structured security risk-assessment methodology such as
    CVSS or equivalent to score, document, and communicate
    risk consistently
  - Communication You possess strong written communication
    skills and can make findings and decisions clear enough
    that colleagues can act on them with confidence, including
    comfort with making decisions under ambiguity and knowing
    when to escalate
  - Collaboration You enjoy working across time zones with
    global teams, and bring familiarity with observability
    platforms to gain visibility into system and AI behaviour

  WHAT WE OFFER

  - Grow Further, Go Further Advance your skills and unlock your
    potential with our Education Assistance Program
  - Balance Your Career Benefit from a hybrid work environment
    complemented by flexible working hours
  - Fuel Your Day Great work deserves great fuel. Enjoy meal
    benefits that keep you energized and ready to bring your
    A-game
  - Your Wellness Matters We're committed to your well-being
    through comprehensive insurance, wellness programs, health
    checkups, and fitness benefits
  - Recognition That Counts We create a culture of appreciation,
    rewarding your impact through referral incentives and
    loyalty perks as you advance with us
  - Growing Families, Growing Joy As your family grows, we're
    here to celebrate with a special newborn gift for your
    little one

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.00 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  350,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 110
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
