title: AI Engineer, Public Sector
company: Seekr Technologies
location: USA
remote: true
work_type: FULL_TIME
description: |
  Seekr is looking for talented AI Engineers to join our team
  and deliver generative and predictive capabilities for US
  Government customers.  The right candidate will work on
  developing , and deployment of AI/ML capabilities for
  various applications implementing generative AI and
  integrations with predictive capabilities (agentic
  workflows, LLM fine-tuning).  Additionally, this person will
  be working on quick proof-of-concept solutions but also
  building in a generalized fashion to support longer term
  implementation.

  From your first day, you will make a valuable contribution.
  We are a fast-growing company where no one is a bystander.
  We offer you the opportunity to make a meaningful impact for
  the US while designing and developing cutting-edge, novel
  capabilities.

  Duties and Responsibilities: 

  - Design, implement, and deploy AI Solutions for USG customers
  - Design and develop prototype solutions incorporating both
    generative and predictive capabilities
  - Innovate creative solutions, integrating generative and
    predictive capabilities to answer unique customer
    challenges
  - Design and develop interfaces and applications for customer
    utilization of AI solutions
  - Interact directly with customers and subject matter experts,
    translating AI/ML concepts into practical language
  - Support pre-sales efforts, identifying how the Seekr
    Platform could help satisfy customer requirements
  - Research and development on cutting-edge application of
    generative AI and agentic capabilities

  Qualifications and Skills: 

  - Ability to obtain a U.S. security clearance at the Top
    Secret level is required: active Top Secret clearance
    preferred.
  - Minimum of 3 years of professional experience in AI/ML,
    software engineering, or a related technical field.
  - Undergraduate degree in technical field with a strong
    background in application of AI/ML
  - Comfortable interacting with customers and subject matter
    experts, translating complex concepts into practical
    language and impacts
  - Capable of developing prototype solutions using UI SDKs
    (e.g., Flask, Streamlit)
  - Familiar with generative AI concepts like RAG, prompt
    engineering, agents, structured output, multi-modal LLMs,
    various embedding models
  - Strong programming skills in Python required. Experience in
    java and html a plus.
  - Experience working with or in the DoD, US Intelligence
    Community, or US Federal Civilian agencies
  - Experience training and employing predictive AI models in a
    government context.
  - Solid knowledge of LLM Frameworks such as LangCHain,
    LlamaIndex, Transformers
  - Familiarity with common APIs including OpenAI, GraphQL,
    FastAPI
  - Familiarity with Databases and Retrieval Augmented
    Generation (RAG) technologies such as Pinecone, FAISS,
    OpenSearch, and Neo4j

  About the Company:  

  Seekr is a leader in explainable and trustworthy artificial
  intelligence designed to power mission-critical decisions in
  enterprises, government, and regulated industries.
  SeekrFlow™, our end-to-end AI platform, provides secure,
  auditable AI solutions tailored to sectors where
  transparency, accuracy, and compliance are paramount.
  Available across cloud, on-premises, and edge environments,
  SeekrFlow reduces bias, strengthens data integrity, and
  simplifies model oversight so organizations can rely on
  trusted AI decisions in high-stakes settings that impact
  society’s most sensitive and vital systems. Trusted by
  leading enterprises and government agencies, we partner with
  defense, finance, telecom, and critical infrastructure
  leaders to enable AI solutions that drive real-world results
  with unmatched transparency and control. We are a team of
  strategic thinkers and problem-solvers tackling the toughest
  challenges facing critical infrastructure and global
  enterprises through best-in-class AI models and customer
  deployment. Our team operates with unwavering commitment to
  our core values and mission:

  - We are driven by outcomes—our customers' success is what we
    strive for every day.
  - We believe trust is earned, which is why we build
    explainability and transparency into the entire AI
    lifecycle.
  - We take our responsibility to deliver secure AI seriously.
  - We believe innovation drives progress—we are building the
    technologies that power the systems our society depends
    on.

   Company Benefits:

  - Meaningful Mission & Impact - Work with a deeply talented,
    collaborative team solving some of the toughest AI
    challenges that matter.
  - Equity Ownership – RSUs that let you share directly in
    Seekr’s long‑term success and growth.
  - Time Off That Respects Real Life – Unlimited PTO plus 14
    paid company holidays to truly recharge.
  - Work Your Way – A flexible hybrid work environment with
    offices in Reston, VA and Austin, TX, plus remote options
    and flexible working hours.
  - Competitive Total Rewards – A role‑appropriate compensation
    structure that supports long‑term growth, including base
    salary, bonuses, or commission plans depending on role.
  - 401(k) with Company Match – Build your future with a
    retirement plan that includes employer matching.
  - Comprehensive Health & Wellness – Medical, dental, vision,
    and life insurance coverage starting day one—for you and
    your family.
  - Parental Leave – Paid parental leave to support employees as
    they welcome a new child through birth, adoption, or
    foster placement.



  This range reflects Seekr’s good faith estimate of  what it
  expects to pay for this role at the time of posting.
  Placement within the range depends on a number of factors,
  including but not limited to geographic location, applicable
  labor categories under Seekr’s federal government contracts,
  relevant prior work experience, specific skills, education,
  and certifications. This role may also be eligible for
  annual bonus, equity, other other incentive compensation.



  The proposed salary range for this position is:

  $185,000—$225,000 USD

