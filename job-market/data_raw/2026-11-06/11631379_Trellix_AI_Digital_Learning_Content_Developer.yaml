description: |
  Job Title:

  AI & Digital Learning Content Developer

  About Trellix   Trellix is a global company redefining the
  future of cybersecurity. The company’s comprehensive, open,
  and native cybersecurity platform helps organizations
  confronted by today’s most advanced threats gain confidence
  in the protection and resilience of their operations.
  Trellix, along with an extensive partner ecosystem,
  accelerates technology innovation through artificial
  intelligence, automation, and analytics to empower over
  50,000 business and government customers with responsibly
  architected security. More at https://trellix.com.

  Role Overview:

  We are looking for an AI & Digital Learning Content
  Developer to create engaging, modern, and scalable digital
  learning experiences for technical audiences. The ideal
  candidate combines strong visual, editorial, eLearning,
  video, and social media skills with a basic understanding of
  technology and a strong interest in AI and digital learning.
  This role will focus primarily on developing high-quality
  technical learning content. The successful candidate will
  quickly build familiarity with Trellix technologies,
  products, and platforms and translate complex technical
  concepts into clear, engaging learning experiences.

  About the role :

  - Design and develop eLearning, microlearning, and digital
    learning content.
  - Create engaging video-based learning, demonstrations,
    tutorials, and supporting materials.
  - Develop visually compelling presentations, graphics,
    animations, and other learning assets.
  - Transform technical information into clear, accessible,
    learner-focused content.
  - Support technical training materials for PS,Tech Support,
    partners, and customers.
  - Develop and maintain content for digital learning platforms
    and learning environments.
  - Support social media and digital communications content
    related to learning and enablement.
  - Explore and incorporate AI tools and emerging technologies
    to improve content development and learner engagement.
  - Collaborate with Product Specialists (PS), Subject Matter
    Experts (SMEs), technical teams, Education Services, and
    other stakeholders to validate and develop content.
  - Work closely with PS and SMEs to ensure technical accuracy
    while maintaining a learner-focused approach.
  - Maintain consistency in editorial standards, visual
    identity, terminology, and learning design.
  - Continuously improve content based on learner feedback,
    engagement, and business needs.

  About You :

  Digital Learning & Content

  - 2-4 Years of experience developing eLearning, microlearning,
    tutorials, or other digital learning content.
  - Strong understanding of visual communication and content
    design.
  - Excellent writing, editing, proofreading, and storytelling
    skills.
  - Experience creating or editing video and multimedia content.
  - Experience creating content for social media and digital
    channels.

  Technical Aptitude

  - Basic understanding of IT, software, cloud, cybersecurity,
    or related technologies.
  - Ability and willingness to learn new technical concepts
    quickly.
  - Comfortable working with PS, SMEs, and technical teams and
    translating technical information into learner-friendly
    content.
  - No deep cybersecurity or engineering expertise required;
    technical curiosity and learning agility are key.

  AI & Digital Tools

  - Interest in AI-powered content creation and learning
    technologies.
  - Experience with, or willingness to learn, AI tools for
    content development, video creation, research, editing,
    and personalization.
  - Experience with Camtasia for screen recording, video
    editing, demonstrations, and tutorials.
  - Ability to evaluate new digital tools and identify
    opportunities to improve learning efficiency and quality.

  Preferred Qualifications

  - Experience working in a technical training, corporate
    learning, EdTech, or technology environment.
  - Experience developing content for technical or professional
    audiences.
  - Familiarity with Learning Management Systems (LMS), Digital
    Asset Management (DAM), or related platforms.
  - Familiarity with instructional design principles.
  - Experience with cybersecurity or enterprise technology
    content is a plus.
  - Experience with tools such as Camtasia, Articulate, Adobe
    Creative Cloud, Canva, video editing platforms, or similar
    tools is a plus.

  Key Competencies

  - Strong visual and creative skills
  - Excellent writing and editorial judgment
  - Learning and instructional design mindset
  - Video and multimedia production
  - Camtasia / screen-recording expertise
  - Social media and digital content development
  - AI and digital technology mindset
  - Technical curiosity and learning agility
  - Strong collaboration with PS, SMEs, and stakeholders
  - Ability to simplify complex information
  - Ability to manage multiple projects and deadlines

