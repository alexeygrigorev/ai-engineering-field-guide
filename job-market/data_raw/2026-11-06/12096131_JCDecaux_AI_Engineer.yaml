description: |
  The AI Engineer designs, builds and operates scalable,
  secure AI solutions for JCDecaux UK, with a focus on Copilot
  implementations and agentic AI that augment users and
  automate complex workflows. The role converts business and
  data requirements into production-grade AI assistants,
  copilots and intelligent agents embedded into products,
  processes and decision making. Working closely with
  technology and business teams, the AI Engineer oversees
  solutions from experimentation through to deployment,
  optimisation and support, ensuring they integrate with
  JCDecaux UK’s digital, data and technology landscape.  The
  role supports JCDecaux UK’s vision and mission by using
  advanced AI to pioneer real-world communications and enhance
  client and consumer understanding. Reports to: Chief
  Innovation and Technology Officer

  What you'll be doing...

  - Design and implement AI copilots and agentic AI solutions
    that assist users, automate multi-step tasks and
    orchestrate calls to internal tools and systems.
  - Translate business use cases into Copilot scenarios, prompt
    flows, connectors and agent behaviours, defining secure,
    scalable solution architectures.
  - Build and maintain AI components (e.g. RAG, classification,
    recommendation, summarisation) using Python and modern
    ML/LLM frameworks.
  - Implement end-to-end MLOps pipelines for development,
    testing, deployment and monitoring of Copilot and AI
    solutions, and deploy them into production environments
    (e.g. Microsoft 365 Copilot, Azure, internal apps).
  - Integrate AI agents with enterprise systems (e.g. CRM, ERP,
    scheduling, inventory, data platforms) via APIs and
    microservices.
  - Collaborate with data engineers to design data pipelines,
    retrieval layers (vector stores, search indices) and
    large-scale processing using big data frameworks.
  - Implement monitoring, logging and analytics to track usage,
    performance, quality and user satisfaction, and lead
    optimisation to address issues such as drift,
    hallucinations and latency.
  - Contribute to AI engineering standards, guardrails and best
    practices, and support incident investigation and
    resolution with Service Delivery.
  - Ensure solutions comply with security, privacy, compliance
    and ethical AI requirements, including access controls,
    data protection and risk assessments.
  - Share knowledge and mentor colleagues to build AI literacy
    and capability across IT and the wider business.

  A little bit about you...

  - Degree in Computer Science, Data Science, Software
    Engineering, Mathematics, Engineering or a closely related
    field.
  - Previous experience in AI, data science, ML engineering or
    advanced analytics.
  - hands-on experience designing, building and deploying
    Copilot and/or agentic AI solutions (e.g. Microsoft 365
    Copilot extensions, Azure OpenAI-based copilots, custom AI
    assistants/agents).
  - Strong proficiency in Python for AI/ML development,
    including use of common ML and data libraries (e.g.
    TensorFlow/PyTorch, scikit-learn, pandas, NumPy).
  - Proven experience integrating AI services with enterprise
    systems via APIs and event-driven architectures.
  - Practical experience with LLMs, prompt engineering, RAG and
    tools/plugins for agents and copilots.
  - Familiarity with cloud platforms (ideally Azure) and AI
    services (e.g. Azure OpenAI, Azure Machine Learning, or
    equivalents).
  - Experience working in agile, cross-functional delivery
    teams.

  Desired but not essential….

  - Postgraduate study or certifications in AI, machine learning
    or data science.
  - Cloud certifications (e.g. Azure, GCP, AWS) and relevant
    AI/ML credentials.
  - Experience with big data and distributed computing (e.g.
    Spark, Databricks, Hadoop or cloud-native alternatives).
  - Experience with containerisation and DevOps/MLOps tools
    (e.g. Docker, Kubernetes, Git, CI/CD, MLflow, Airflow).
  - Strong experience with data engineering concepts (ETL/ELT,
    data integration, warehousing, vector databases/search)

  A little bit more about us...


  - We believe in building a diverse and inclusive culture and
    positive employee experience.
  - We are One Team, more than just ourselves.
  - We are customer first, we understand, and help solve our
    customers’ problems.
  - We Test & Learn, we are empowered to learn and grow,
    unafraid of change.
  - We choose to care, we are committed to doing the right
    thing, the right way.

  It’s really important to us that we give as much to our
  colleagues as they give to us.

  Our latest Belonging Survey showed that our colleagues feel
  valued and listened to as we continue to build an
  environment where everyone can thrive, grow, belong and be
  their authentic selves.

  We believe that diversity of thought, experience and
