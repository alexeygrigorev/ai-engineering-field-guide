  About our Values

  We want to be everything for someone rather than something
  for everyone and we do this by living and modeling our
  values in all that we do. We value

  - Courage. We believe that when we overcome fear, we enable
    our best selves.
  - Curiosity. We are curious, which is the gateway to empathy,
    inclusion, and understanding.
  - Kaizen. We have a growth mindset committed to constant
    forward progress.
  - Service. We serve our community with humility, enabling joy
    and belonging for others.

