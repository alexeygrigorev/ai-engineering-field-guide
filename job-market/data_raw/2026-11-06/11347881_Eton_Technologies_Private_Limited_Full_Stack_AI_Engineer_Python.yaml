title: Full Stack AI Engineer Python
company: Eton Technologies Private Limited
location: IND
remote: true
work_type: FULL_TIME
company_size: 95 Employees
description: |
  This is a remote position.



  Eton Technologies is hiring a Full Stack AI Engineer with
  10+ years of experience to design and build scalable web
  applications and AI-powered solutions.




  The ideal candidate is strong in ReactJS, Python and
  PostgreSQL, and has built RESTful APIs, backend services and
  modern user interfaces. You will work across the stack, from
  the React frontend to FastAPI services and the database, and
  contribute to AI-enabled features and platform
  infrastructure.


   Key responsibilities



  - Develop and maintain full-stack applications using ReactJS,
    Python, FastAPI and PostgreSQL.
  - Design, build and optimize scalable APIs and database
    solutions.
  - Collaborate with cross-functional teams to deliver high-
    quality software.
  - Participate in application deployment, monitoring,
    troubleshooting and ongoing enhancements.
  - Contribute to AI-enabled features and integrations where
    applicable.
  - Contribute to platform infrastructure, runtime adapters and
    security-by-default middleware, following ADR-driven
    design.

   Required qualifications



  - 10 + years of software development experience, within 10+
    years of total professional experience.
  - Strong proficiency in ReactJS for frontend development.
  - Hands-on experience with Python and FastAPI for backend and
    API development.
  - Strong knowledge of PostgreSQL, database design and SQL
    optimization.
  - Experience developing and consuming REST APIs.
  - Familiarity with cloud platforms, Git, Docker and CI/CD
    practices.
  - Strong problem-solving, communication and collaboration
    skills.

   Preferred skills



  - Understanding of AI/LLM integrations, RAG or automation
    workflows.
  - Azure experience, including Container Apps and Bicep or
    other infrastructure-as-code.
  - Workflow orchestration with Temporal or a similar tool.
  - API middleware patterns: CORS, RBAC, audit logging and
    SSE/streaming contracts.







