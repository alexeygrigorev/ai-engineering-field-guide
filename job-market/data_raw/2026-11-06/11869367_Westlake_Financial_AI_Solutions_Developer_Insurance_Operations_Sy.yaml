description: |
  AI Solutions Developer – Insurance Operations & Systems
  Integration

  Los Angeles | Onsite

  Pay Range: $100,000- $150,000 Per Year. The exact starting
  compensation to be offered will be determined at the time of
  selecting an applicant for hire and will be dependent on a
  wide range of factors, including but not limited to
  geographic location, skill set, experience, education,
  credentials, and licensure when applicable.

  Knight Insurance is seeking a motivated, innovative AI
  Solutions Developer to design, build, test, and deploy AI-
  enabled business solutions. This role will help improve
  operational efficiency, reporting, underwriting workflows,
  and system integrations across the organization.

  The ideal candidate combines strong software development
  skills with an understanding of insurance operations and
  systems. You’ll build practical tools—including internal
  applications, dashboards, reporting solutions, workflow
  automations, and API integrations—and work with internal
  teams and external technology partners to turn business
  needs into scalable solutions.

  What You'll Do as an AI Solutions Developer:

  Application development

  - Use AI-assisted development tools and frameworks to build
    internal web applications, dashboards, reporting tools,
    workflow automations, operational utilities, portals, and
    other business solutions.
  - Prototype and deploy proof-of-concept applications to
    address operational needs.
  - Use AI coding assistants and low-code/no-code platforms
    where appropriate to accelerate development.
  - Develop lightweight web interfaces for internal and external
    users.

  Systems integration

  - Connect internal insurance systems, databases, and third-
    party platforms through APIs and middleware.
  - Build and maintain integrations for rating, billing, claims,
    CRM, reporting, data warehouse, and analytics systems.
  - Work with external IT companies and software vendors to
    share technical requirements, validate integrations, and
    support accurate data flow between systems.
  - Help ensure secure and accurate access to data across
    departments.

  Insurance operations and quality assurance

  - Review insurance manuals, underwriting guidelines, and
    rating algorithms to understand business logic and
    workflow requirements.
  - Validate systems across underwriting, rating, billing,
    claims, reporting, security, and permissions.
  - Test and perform quality assurance on internally developed
    software and vendor solutions before production release.
  - Ensure solutions meet operational and compliance
    requirements.

  Collaboration

  - Work with operations, underwriting, claims, finance and
    accounting, executive leadership, and external technology
    partners.
  - Translate operational needs into technical specifications
    and scalable solutions.
  - Explain technical concepts clearly to non-technical
    stakeholders.

  Qualifications

  What do we look for in our AI Solutions Developer?

  - Experience with AI-assisted software development tools.
  - Strong understanding of web application development, API
    integrations, SQL and database connectivity, reporting and
    analytics tools, and workflow automation.
  - Experience with modern programming languages and frameworks
    such as Python, JavaScript, Node.js, React, and SQL.
  - Experience integrating cloud platforms and SaaS
    applications.
  - Ability to collaborate with technical and non-technical
    colleagues and understand insurance workflows.

  Required Education & Work Experience

  - Bachelor’s Degree in Computer Science, Software Engineering,
    Data Science, Artificial Intelligence, or a related
    technical discipline. Master’s degree is a plus.
  - 4–5 years of professional experience in full-stack software
    engineering or backend development, with at least 2+ years
    actively building and deploying AI/ML solutions or LLM-
    driven applications into production environments.
  - Proven track record of building automated workflows, custom
    internal tools, or enterprise software integrations.
  - Insurance, InsurTech, or FinTech experience (specifically
    working with policy life cycles, claims triage, or FNOL
    intake systems) is highly preferred.

  Benefits

  What do we offer?

  - Medical, Dental, Vision, Supplemental Life Insurance, LTD,
    and Flexible Spending Account
  - 401K and Employee Stock Ownership Program (employer
    matching)
  - Career Path Opportunities
  - Onsite Yoga, Pilates, Onsite Gym
  - UKG Wallet (access to your pay before payday)
  - Onsite gym with group Yoga and Pilates classes (California)
  - Tickets at Work - discounts on entertainment, travel, and
    more
  - AT&T Wireless discounts
  - Midway Rent a Car discount (California)
  - Dell Member Purchase Program

