job_id: 12079092
title: Junior AI and Automation Engineer
company: Myriad360
location: USA
remote: true
work_type: FULL_TIME
description: |
  Who You Are

  You are a curious, hands-on early-career engineer who enjoys
  learning new technologies and using AI, automation, and
  software to solve practical business problems. You have
  built projects through coursework, internships, personal
  work, or a first technical role and are ready to apply those
  skills in a business environment.

  You ask thoughtful questions, communicate clearly, and are
  comfortable seeking guidance. You take feedback well, pay
  attention to detail, and follow through on your work.

  You're excited to join Myriad360's AI & Automation team,
  learn from experienced engineers, and take on more
  responsibility as your skills grow.

  About The Role

  As Myriad360's Junior AI & Automation Engineer, you will
  report to the AI & Automation Lead and work alongside the AI
  & Automation Engineer to build, test, and support AI-powered
  applications and workflow automations across the
  organization. You will help turn defined business
  requirements into reliable solutions that reduce manual
  effort and improve day-to-day operations.

  You will work within our Microsoft 365 environment using
  platforms such as Microsoft Power Platform, ChatGPT
  Enterprise, StackAI, and Zapier. With guidance and review
  from the team, you will contribute to GPTs, agents,
  integrations, and internal tools while developing your
  engineering skills.

  Must be based in the United States. Travel up to 10% may be
  required.

  Other responsibilities include:

  - Build and update workflow automations, scripts, and
    integrations using established designs and development
    standards.
  - Configure and refine GPTs, AI agents, prompts, and tools
    with guidance from the team.
  - Connect applications through approved connectors, APIs, and
    webhooks, and assist with data preparation and
    transformation.
  - Help prepare internal knowledge sources and test retrieval
    results for AI applications.
  - Test solutions, document results, support user acceptance
    testing (UAT), and incorporate stakeholder feedback.
  - Monitor existing automations, investigate failures, resolve
    routine issues, and escalate more complex problems.
  - Document workflow logic, configurations, dependencies, and
    support procedures; assist with user guides and training.
  - Participate in discovery sessions, capture requirements, and
    share progress, questions, and blockers with the team.
  - Assist with deployments and ongoing improvements, following
    team review and approval processes.
  - Complete required security awareness training and comply
    with all company information security policies, standards,
    and procedures.
  - Identify, document, and escalate security risks to the
    appropriate Executive Leadership Team member and
    contribute to remediation efforts.
  - Perform other duties as assigned

  Desired skills and experience:

  - 0-2 years of relevant experience in software development,
    automation, AI, or a related technical area. Internships,
    coursework, and personal projects count toward this
    experience.
  - Foundational programming skills, preferably in Python, with
    the ability to read, write, and debug simple scripts.
  - Basic understanding of APIs, JSON, and how applications
    exchange data.
  - Practical familiarity with generative AI tools and
    prompting, including reviewing outputs for accuracy and
    usefulness.
  - A methodical approach to troubleshooting, attention to
    detail, and willingness to learn version control and team
    development practices.
  - Clear communication and collaboration skills, with the
    ability to document work and explain questions or issues
    to technical and non-technical colleagues.
  - Awareness of data privacy, access permissions, and the
    importance of handling business information securely.

  Additional experience that is a plus

  - Exposure to Power Automate, StackAI, Zapier, or similar
    automation and agent-building platforms.
  - Familiarity with Microsoft 365, SharePoint, Microsoft Graph,
    Azure, or Copilot Studio.
  - Exposure to Git, JavaScript/TypeScript, PowerShell,
    retrieval-augmented generation (RAG), or Model Context
    Protocol (MCP).

  A Little About Us

  Our mission is to challenge and enable our employees to
  achieve great things.

  We live and breathe our core values:

  - We Before Me: We demonstrate empathy through our actions and
    solicit diverse voices and opinions. We put ourselves in
    each other’s shoes, readily admit our mistakes, and
    generously share our time and knowledge.

  - Dare To Be Great: We are big-picture thinkers who focus on
    solutions to problems. We solicit and offer actionable
    feedback to others without hesitation. We embrace
    opportunities to improve ourselves, our teams, and our
    work. We aim to be the best of the best.

  - Own It: We set clear expectations, communicate proactively,
    and follow through on our commitments. We take pride in
    the experiences we create and the outcomes we deliver. We
    are personally invested in the success of our team and our
    clients. We iterate to deliver ever better results.

  We are consistently listed among Inc & Crain's "Best Places
  to Work" and we're proud of our accessible & engaged
  executive team. We believe in cultivating an atmosphere
  of inclusion and providing an environment that enables every
  employee to work to the best of their ability.

  Some of Our Benefits

  - Unlimited Paid Time Off (PTO)
  - Incentive compensation plans for all employees
  - Company-funded 401k contributions
  - Zero-cost employer-covered health insurance
  - Annual BYOD (Bring Your Own Device) reimbursement up to $500
  - Paid Parental Leave
  - Transparent, candid culture with 1:1 coaching, performance
    reviews, and a consistent feedback loop
  - Quirky, diverse, respectful, high-performing coworkers
    you’ll want to achieve greatness with!

  Must be based in the United States.

  Pursuant to the NYC Pay Transparency Law, the base salary
  range in New York City for this position is $85,000.00.
  Compensation in other geographies may vary.

  Myriad360 is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to sex, gender identity, sexual orientation, race,
  color, religion, national origin, disability, protected
  veteran status, age, or any other characteristic protected
  by law.
