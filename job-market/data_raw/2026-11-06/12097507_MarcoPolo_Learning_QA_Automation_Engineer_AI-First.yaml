description: |
  QA Automation Engineer (AI-First)

  Location: Bengaluru, India (remote), with daily overlap with
  our UK team

  Engagement Type: Full-time contract, 3 months then ongoing

  Experience: 2–4 years

  Reports to: Technical Project Manager

  Compensation: India-based, aligned to experience and
  location

  About MarcoPolo Learning

  MarcoPolo Learning is a leading provider of innovative
  content, technology, and instructional support for early
  childhood education. Since 2013, we’ve impacted thousands of
  classrooms and hundreds of thousands of families across
  North America. Our Emmy-nominated MarcoPolo World School app
  and The Polos TV series bring STEM and global discovery to
  life for young learners.

  Backed by top-tier investors, we’re on a mission to
  transform early learning at scale. At the center of that
  mission is Audrey, our AI Teaching Companion & Coach for
  early-learning educators.

  Role Overview

  We ship fast. AI helps our engineers write code quicker than
  ever, and we’re about to launch two major web platforms used
  by thousands of educators. Speed only counts if what reaches
  teachers works beautifully, every time.

  We’re looking for a QA Automation Engineer who wants to own
  that quality. You’ll learn our products inside out, help us
  move from manual checks to smart, AI-assisted automated
  testing, and become the person the team trusts to say “this
  is ready.”

  You’ll work directly with our technical project manager and
  engineers, get hands-on with the latest AI testing and agent
  tools, and have room to grow into a broader engineering role
  as you prove yourself.

  Key Responsibilities

  Quality and testing

  - Test new features end to end across our web platforms and
    mobile apps, thinking like a teacher, a director and an
    admin, and catch issues before they reach customers.
  - Write clear test cases and acceptance criteria, using AI to
    generate and expand them quickly.
  - Build and maintain automated regression suites (e.g.
    Playwright, Cypress or similar) so every release is
    checked consistently without repetitive manual work.
  - Evaluate and pilot new AI-forward QA testing platforms
    (self-healing, agent-driven and visual AI testing tools),
    measure what actually saves time, and help us adopt the
    ones that work.
  - Verify that reports, dashboards and data exports reflect
    real user activity accurately.
  - Test user journeys that span systems, such as course
    completion, certificates and automated customer emails.
  - Log bugs clearly in Jira, reproduce them reliably, and work
    with engineers until they’re fixed and verified.

  Release and production support

  - Run pre-release and post-release checks, and help verify
    hotfixes quickly when something needs attention.
  - Be the first technical line for product questions from our
    customer-facing team: investigate, resolve what you can,
    and route the rest with the right detail.
  - Turn recurring questions into simple guides and self-serve
    answers, so the team can find solutions without waiting.

  AI and automation

  - Work alongside our automation specialist to test and refine
    the AI agents and workflows we’re rolling out across the
    company.
  - Document how our products work, building shared knowledge
    that helps the whole team and our AI tools.

  What We’re Looking For

  - A degree in Computer Science, IT, or a related engineering
    field (B.E./B.Tech, BCA/MCA or equivalent), or equivalent
    hands-on experience.
  - 2–4 years of experience in QA, test automation or software
    development on web applications.
  - Hands-on experience testing mobile apps on iOS, Android and
    Amazon (Fire OS) devices, including app store builds and
    testing across devices and screen sizes.
  - Experience building automated tests with Playwright,
    Cypress, Selenium or similar.
  - Working knowledge of at least one programming language
    (JavaScript/TypeScript or Python preferred) and comfort
    reading code.
  - An AI-native way of working: you use tools like ChatGPT,
    Claude, Cursor or Copilot daily, and you’re curious about
    AI agents and AI testing tools.
  - Openness to new AI-forward QA testing platforms (e.g. Mabl,
    Testim, testRigor, Applitools, or AI agents working with
    Playwright), and the curiosity to try them, compare them
    and bring the best into our workflow.
  - A sharp eye for detail: you notice when a number, a layout
    or a flow isn’t quite right, and you can explain exactly
    why.
  - Clear, structured bug reporting and documentation.
  - Comfort with web fundamentals: browser dev tools, APIs and
    testing across devices and screen sizes.
  - Ownership and follow-through: you see an issue through to
    resolution and speak up early when something is off.
  - Clear written and spoken English; comfortable working with
    technical and non-technical colleagues in the UK time
    zone.

  Bonus points

  - Jira or Asana experience in an agile sprint setup.
  - Exposure to a headless CMS (e.g. Strapi), SQL, or tools like
    Postman.
  - Familiarity with CI/CD pipelines (e.g. GitHub Actions) or
    AWS.
  - Experience with no-code automation tools (Zapier, n8n, Make)
    or email platforms like Customer.io.
  - An ISTQB Foundation certification or similar.
  - Interest in education, ed-tech or early childhood learning.

  What Success Looks Like in the First 90 Days

  - First 30 days: learn our products and users, take on release
    checks, and log your first well-documented bugs.
  - By 60 days: own testing for a product area and ship your
    first automated regression tests.
  - By 90 days: run release QA independently, with automated
    coverage on our key user journeys and a recommendation on
    which AI testing tools we should adopt.

  What to Be Ready to Demonstrate

  Be ready to walk us through test automation you’ve built:
  what you chose to automate, how you structured it, and what
  you’d do differently. The process includes a short, paid
  practical exercise (AI tools encouraged). Sanitized examples
  are welcome; please don’t share confidential employer or
  customer information.

  What We Offer

  - Experience with a growing international education company,
    working closely with our UK-based team.
  - Real ownership: what you test and automate goes straight to
    thousands of educators.
  - Daily exposure to AI agents, AI testing tools and modern
    engineering practices.
  - Mentorship and a clear path to grow into a broader
    engineering role.
  - Compensation benchmarked to the Bengaluru/India market,
    based on your experience and location.
  - Remote working, plus 15 days paid annual leave and Indian
    public holidays.
  - A collaborative, mission-driven team at the intersection of
    education, media and technology.

  Why Join Us

  If you’re curious about AI and want your work to matter,
  this is the role. You’ll help shape how a growing global
  education company builds and tests its products in the AI
  era, and grow your skills faster than you would almost
  anywhere else.

  Note: This is an India-based engagement. Applicants must
  have the right to work in India; visa sponsorship is not
  available at this time.

  MarcoPolo Learning is an Equal Opportunity Employer and does
  not discriminate on the basis of race, national origin,
  gender, gender identity, sexual orientation, protected
  veteran status, disability, age, or other legally protected
  status.
