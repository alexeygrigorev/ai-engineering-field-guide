  Company Overview

  TIAA Global Capabilities was established in 2016 with a
  mission to tap into a vast pool of talent, reduce risk by
  insourcing key platforms and processes, as well as
  contribute to innovation with a focus on enhancing our
  technology stack. TIAA Global Capabilities is focused on
  building a scalable and sustainable organization , with a
  focus on technology , operations and expanding into the
  shared services business space.


  Working closely with our U.S. colleagues and other partners,
  our goal is to reduce risk, improve the efficiency of our
  technology and processes and develop innovative ideas to
  increase throughput and productivity.

  We are an Equal Opportunity Employer. TIAA does not
  discriminate against any candidate or employee on the basis
  of age, race, color, national origin, sex, religion, veteran
  status, disability, sexual orientation, gender identity, or
  any other legally protected status.

  Our Culture of Impact

  At TIAA, we're on a mission to build on our 100+ year legacy
  of delivering for our clients while evolving to meet
  tomorrow's challenges. We equip our associates with future-
  focused skills and AI tools that enable us to advance our
  mission. Together, we are fighting to ensure a more secure
  financial future for all and for generations to come. We are
  guided by our values: Champion Our People, Be Client
  Obsessed, Lead with Integrity, Own It, and Win As One. They
  influence every decision we make and how we work together to
  serve our clients every day. We thrive in a collaborative
  in-office environment where teams work across organizational
  boundaries with shared purpose, accelerating innovation and
  delivering meaningful results. Our workplace brings together
  TIAA and Nuveen's entrepreneurial spirit, where we work hard
  and work together to create lasting impact. Here, every
  associate can grow through meaningful learning experiences
  and development pathways—because when our people succeed,
  our impact on clients' lives grows stronger.

