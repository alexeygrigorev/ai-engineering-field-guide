description: |
  AI Platform Senior Engineer The Associate, AI Platform
  Senior Engineer (Foundation Engineering) will support
  development and maintenance of core AI infrastructure,
  contributing to agent development, model/prompt
  optimization, and backend engineering efforts under the
  guidance of senior team members within the AI Center of
  Excellence. Key Responsibilities and Duties

  - Assist in building and testing AI agent components and
    workflows
  - Support implementation of LLM optimization and prompt
    engineering techniques under senior engineer guidance
  - Develop and maintain backend services, APIs, and
    integrations supporting AI systems, deployed on AWS/cloud
    infrastructure
  - Support implementation of Model Context Protocol (MCP)-based
    integrations for agent tool/data access
  - Write clean, well-tested, maintainable Python code
  - Participate in code reviews, design discussions, and sprint
    planning
  - Document technical processes and contribute to internal
    knowledge sharing
  - Troubleshoot and resolve issues in existing AI
    infrastructure components

  Required Qualifications

  - Strong proficiency in Python
  - Working knowledge of agent development concepts and
    frameworks
  - Familiarity with LLM/prompt optimization techniques (prompt
    engineering, RAG, basic fine-tuning approaches)
  - Backend development experience (APIs, databases, service
    integration)
  - Required working knowledge of AWS and cloud services
  - Mandatory familiarity with Model Context Protocol (MCP)
    concepts and implementation
  - Background or coursework in machine learning fundamentals
    preferred
  - Good communication skills with ability to work effectively
    in a collaborative, cross-functional team environment

  Educational Requirements

  - Bachelor's degree required; Master's degree or equivalent
    postgraduate qualification preferred

  Work Experience

  - 3+ Years Required; 5+ Years Preferred

  Physical Requirements

  - Physical Requirements: Sedentary Work

  Career Level 7IC

  NA

  Related Skills

  Continuous Integration and Deployment, Debugging, DevOps,
  Enterprise Application Integration, Problem Solving,
  Programming, Software Development, Software Development Life
  Cycle, Software Testing, Systems Design/Analysis, Systems
  Development Life Cycle

