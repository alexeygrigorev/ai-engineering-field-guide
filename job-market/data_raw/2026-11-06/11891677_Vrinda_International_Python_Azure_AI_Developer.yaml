description: |
  Summary

  We are seeking a highly skilled Python + Azure AI Developer
  to lead the design, development, and deployment of
  intelligent applications within our IT Services sector. In
  this pivotal role, you will leverage advanced cloud
  technologies and artificial intelligence frameworks to drive
  innovation and deliver scalable solutions. The ideal
  candidate will possess a robust background in full-stack
  development, combining backend expertise with modern
  frontend technologies to create seamless, high-performance
  user experiences. This position is critical for advancing
  our digital transformation initiatives and ensuring our
  technology stack remains at the forefront of industry
  standards.

  Responsibilities

  - Architect and develop robust, scalable AI-powered
    applications utilizing Python frameworks such as Django,
    Flask, and FastAPI.
  - Design and implement efficient database solutions using MS
    SQL, focusing on complex queries, indexing strategies,
    performance tuning, and stored procedure optimization.
  - Integrate cloud-native services on the Azure platform,
    including Service Bus, Blob Storage, App Services, Key
    Vault, and Redis, to ensure secure and reliable
    application infrastructure.
  - Collaborate on the development of responsive and dynamic
    user interfaces using Angular, React, and JavaScript.
  - Utilize .NET technologies to support existing systems and
    facilitate seamless interoperability between different
    application components.
  - Optimize application performance and reliability through
    rigorous testing, debugging, and continuous improvement of
    code quality.

  Requirements

  Requirements:

  - Minimum of 7 years of professional experience in software
    development, specifically within the IT Services industry.
  - Proven expertise in Python programming with a strong
    portfolio of work using Django, Flask, or FastAPI.
  - Deep proficiency in Microsoft SQL Server, including advanced
    query writing, join operations, indexing, performance
    tuning, and stored procedure management.
  - Extensive hands-on experience with Microsoft Azure cloud
    services, particularly Service Bus, Blob Storage, App
    Services, Key Vault, and Redis.
  - Strong command of frontend technologies, including .NET,
    Angular, React, and JavaScript, for building modern web
    applications.
  - Demonstrated ability to design and deploy AI-driven
    applications, integrating machine learning models into
    production environments.
