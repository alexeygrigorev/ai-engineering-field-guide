description: |
  About V2 AI

  V2 AI is a leading AI-Native consultancy backed by $30m in
  VC funding, allowing us to meet our customers' needs. We
  harness the power of AI to accelerate business outcomes for
  some of the world's largest brands.

  We bring decades of experience and a unique delivery model
  to partner with our customers on the most complex problems
  for immense, measurable impact.

  Our Services

  - AI Strategy & Governance
  - AI Enablement
  - Applied AI
  - Data & AI Security

  About the Role

  We're looking for an experienced Principal Forward Deployed
  Engineer – Applied AI to lead the implementation and
  adoption of Claude Enterprise for a major enterprise
  customer within the financial services and asset management
  sector.

  You'll work directly with customer stakeholders to deploy,
  configure and integrate Claude Enterprise, with a strong
  focus on Claude Cowork, enterprise workflows and AI-powered
  productivity.

  This is a hands-on, customer-facing role where you'll bridge
  the gap between technical implementation and business
  outcomes, helping teams adopt Claude effectively, securely
  and at scale.

  You'll bring strong experience in financial services and
  asset management, with an understanding of industry
  workflows, data security, governance and regulatory
  considerations.

  Responsibilities

  - Lead the rollout, configuration and implementation of Claude
    Enterprise within a large enterprise environment.
  - Leverage Claude Cowork to design, build and optimise AI-
    powered workflows that improve business productivity and
    operational efficiency.
  - Work closely with customer stakeholders to identify high-
    value use cases across financial services and asset
    management.
  - Integrate Claude Enterprise with existing enterprise
    systems, tools, data sources and business workflows.
  - Design and implement secure, scalable AI solutions aligned
    with enterprise security, compliance and governance
    requirements.
  - Provide hands-on technical guidance, troubleshooting and
    support throughout implementation and adoption.
  - Collaborate with business and technical teams to drive user
    adoption, enablement and continuous improvement.
  - Identify opportunities to automate manual processes and
    enhance business workflows using Claude and agentic AI
    capabilities.
  - Translate complex business requirements into practical AI
    solutions that deliver measurable outcomes.
  - Share technical knowledge, best practices and implementation
    learnings across V2 AI and customer teams.

  What We're Looking For

  - Hands-on experience with Claude Cowork, including
    configuring and implementing AI-powered workflows in an
    enterprise environment.
  - Experience deploying, integrating or supporting Claude
    Enterprise or similar enterprise AI platforms.
  - Strong financial services experience, specifically within
    asset management, with an understanding of industry
    processes and business workflows.
  - Experience delivering enterprise AI solutions within
    complex, regulated environments.
  - Strong understanding of enterprise security, data privacy,
    governance and compliance requirements.
  - Experience integrating AI tools with enterprise
    applications, APIs and internal systems.
  - Knowledge of LLMs, agentic AI, workflow automation and AI
    adoption best practices.
  - Strong stakeholder engagement skills, with the ability to
    work directly with technical and non-technical customer
    teams.
  - Excellent problem-solving skills and the ability to operate
    independently in a fast-paced consulting environment.

  Highly Regarded

  - Experience with Claude Code, Claude APIs and Anthropic's
    broader ecosystem.
  - Experience with AWS and cloud-based enterprise
    architectures.
  - Exposure to investment management, portfolio management,
    investment operations or related asset management
    workflows.
  - Experience driving enterprise-wide AI adoption and change
    management.

  Apply Now

  If you're passionate about Claude, agentic AI and helping
  financial services organisations unlock the value of
  enterprise AI, we'd love to hear from you.

  APPLY NOW and help shape the future of AI adoption with V2
  AI!
