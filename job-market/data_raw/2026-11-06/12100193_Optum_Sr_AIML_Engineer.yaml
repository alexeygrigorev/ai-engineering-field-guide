description: |
  Requisition Number: 2387005 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:

  - Design and Deliver AI Solutions
    - Design, develop, and deploy AI-powered solutions that solve
      business problems
    - Build AI-enabled applications, automations, agents, and
      platforms that can operate at enterprise scale
    - Integrate AI capabilities into existing products and
      engineering workflows
  - Lead Technical Solution Architecture
    - Define AI solution architecture and engineering standards
    - Drive technical decisions for AI adoption across platforms
      and applications
    - Ensure solutions are scalable, secure, reliable, and
      maintainable
    - Leverage GitHub Copilot, M365 Copilot, enterprise LLMs, and
      approved AI tools
    - Automate repetitive development activities such as coding,
      testing, documentation, and analysis
    - Drive productivity improvements across engineering teams
  - Build Responsible AI Solutions
    - Apply responsible AI principles, governance, security,
      privacy, and compliance controls
    - Evaluate AI outputs and risks before production deployment
    - Promote safe and responsible AI usage within the team
  - Mentor and Influence Other Engineers
    - Coach software engineers on AI engineering best practices
    - Share reusable patterns, prompt engineering techniques, and
      AI development frameworks
    - Help teams evolve from AI User to AI Builder maturity
  - Drive Innovation
    - Evaluate emerging AI technologies and industry trends
    - Prototype new capabilities and identify high-value use cases
    - Translate business opportunities into AI-enabled solutions
  - Comply with all applicable Company policies, procedures, and
    business directives, changes including those relating to
    work location, team assignments, work schedules, and
    flexible work arrangements

  Required Qualifications:

  - Graduate degree or equivalent experience
  - Bachelor's degree in Computer Science, Software Engineering,
    Data Science, Mathematics, Statistics, or a related
    technical field
  - Master's degree in AI, Machine Learning, Data Science, or
    related disciplines is often preferred for advanced AI
    roles. (Preference varies by team.)
  - Experience
    - Typically 5+ years of software engineering experience with
      significant hands-on development responsibilities
    - Usually 2+ years of direct AI/ML, Generative AI, or data
      science experience building production solutions
    - Experience taking solutions from proof of concept through
      enterprise production deployment

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone - of every race, gender,
  sexuality, age, location and income - deserves the
  opportunity to live their healthiest life. Today, however,
  there are still far too many barriers to good health which
  are disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
