title: Senior AI Engineer
company: AbsenceSoft
location: USA
remote: true
work_type: FULL_TIME
description: |
  At AbsenceSoft, we’re transforming the employee experience.
  Our secure, intuitive technology helps employers bring
  humanity, certainty, and efficiency to some of the most
  complex moments in the workplace. Built by HR professionals
  for HR professionals, we’re proud of where we’ve been and
  even more excited about where we’re going.

  We’re seeking a highly skilled and innovative Senior AI
  Engineer to design, build, and optimize advanced artificial
  intelligence solutions that drive innovation and efficiency
  across AbsenceSoft’s leave management platform. This role
  will play a key part in developing scalable AI models,
  enhancing automation, and collaborating across teams to
  embed AI capabilities into core product experiences. The
  ideal candidate brings deep technical expertise, creative
  problem-solving, and a passion for ethical, responsible AI.

  WHAT YOU'LL DO

  - Design, develop, and deploy AI and machine learning models
    to power automation, analytics, and decision support.
  - Collaborate with product managers and engineers to align AI
    initiatives with business goals and product strategies.
  - Research and prototype new AI applications in the leave
    management domain.
  - Optimize models and algorithms for performance, accuracy,
    and scalability.
  - Implement MLOps best practices for model training, testing,
    deployment, and monitoring.
  - Partner with data engineering teams to build and maintain
    clean, secure, and reliable data pipelines.
  - Ensure compliance with ethical AI standards, focusing on
    fairness, transparency, and bias detection.
  - Apply NLP, predictive modeling, and other AI techniques to
    enhance product intelligence.
  - Troubleshoot, refine, and document AI solutions to maintain
    high reliability and trust.
  - Stay current with emerging AI technologies and contribute to
    strategic adoption initiatives.
  - Participate in a highly compliant environment while
    assisting to maintain company controls and security within
    your job role.
  - Assist in maintaining applicable organizational security and
    compliance controls within your department, role, and
    subordinate’s roles.
  - Other duties as assigned.

  WHAT YOU'LL BRING

  - 7+ years of software engineering experience, including 3+
    years building and training production ML models, with a
    Bachelor's degree in Computer Science, Data Science,
    Engineering, or a related field (Master's preferred).
  - Hands-on experience training and fine-tuning neural network
    models in PyTorch or TensorFlow (required), plus Python
    and familiarity with Scikit-learn, with a strong
    understanding of NLP, predictive modeling, and neural
    networks.
  - Hands-on experience with MLOps tools, cloud-based AI
    platforms (AWS, Azure, or GCP), and building secure,
    reliable data pipelines.
  - Strong analytical and communication skills, with the ability
    to translate business needs into technical solutions and
    collaborate across technical and non-technical teams.
  - A genuine commitment to ethical, transparent, and
    responsible AI practices.

  Why join us

  At AbsenceSoft, we LEAD with our values:

  Lead with Innovation - We create meaningful change through
  intelligence, focus and passion.  We embrace curiosity,
  data, and insight to shape the future of our industry.
  Always innovating, learning and evolving.

  Elevate Every Voice - Every perspective matters. We listen,
  learn, and build a culture where diversity of thought and
  experience drives better solutions and smarter decisions.

  Achieve Together - The customer fuels everything we do. We
  share knowledge, collaborate, celebrate wins, and face
  challenges as one team because success is always a
  collective achievement.

  Drive Outcome - Every action we take delivers measurable
  value to our teams, our customers, and the employees they
  support. Accountability is non-negotiable. We honor our
  commitments, take responsibility for results, and see every
  success and setback as a chance to grow stronger.



  We offer:

  - Impact that matters. You’ll do work that shapes the future
    of the modern workplace
  - Flexibility and trust. We’re remote-first and results
    driven. You’ll have the freedom and flexibility to do your
    best work, wherever you do it best.
  - Growth and development. We believe the best work happens
    when people are growing. You’ll have access to learning
    resources, leadership programs, and real opportunities to
    take on new challenges and expand your impact.
  - Competitive rewards. We offer comprehensive benefits, a
    performance-based bonus program, and equity opportunities
    – because when we grow, you should too.
  - Time for life. Recharge and reconnect with flexible time
    off, paid holidays, and flexible leave programs designed
    to support every season of life.
  - Belonging and balance. We’re building an inclusive culture
    where every voice is valued, collaboration is celebrated,
    and success is shared.



  We’re committed to building a team as diverse as the
  customers we serve. If your experience doesn’t align
  perfectly with every qualification, we still encourage you
  to apply you might be exactly what we’re looking for. If
  this sounds like a fit, apply today, we’d love to meet you!

  Final compensation is determined based on a candidate's
  relevant experience, skills, education, and geographic
  location. This position is also eligible for annual bonus.

  The range for this position is 170,311.00 - 212,888.00 USD
  per year (US National)

