description: |
  About Us

  Who We Are

  Left Field Labs is the creative technology agency that
  builds what’s next. We partner with the world’s most
  ambitious brands to transform breakthrough technology into
  extraordinary human experiences. Since 2008, we’ve delivered
  end-to-end digital transformation services—from strategy to
  platform development to immersive experiences—for the
  biggest companies in the world, including Google, Amazon,
  and Meta.

  What We Do

  - Digital Experience: We architect seamless digital ecosystems
    that simplify complexity and drive measurable impact.
    Whether launching new platforms or evolving legacy
    systems, we strike the perfect balance between innovation
    and pragmatism
  - Product Innovation: We build scalable platforms and products
    in lockstep with organizations, identifying and seizing
    new technology opportunities.
  - Immersive: We create immersive, cross-media experiences that
    move beyond omnichannel thinking, blending digital,
    social, AI, and physical spaces to engage and delight.
  - Applied AI: We transform AI from a tech tool to the
    infrastructure for business evolution—enhancing decision-
    making, unlocking new efficiencies, and expanding human
    capacity. Our AI solutions power predictive intelligence,
    sharper decision-making, and game-changing innovation.

  Overview

  LFL in Partnership with illumend

  LFL is closely collaborating with illumend, an AI-first
  partnership acceleration platform that’s building solutions
  in the insurance sector. The partnership leverages 15 years
  of insurance compliance expertise with LFL's creative
  technology and applied AI capabilities. The illumend
  platform aims to make meaningful risk management accessible
  to all businesses by providing an intuitive interface for
  non-insurance professionals to track compliance.

  Responsibilities

  What You Will Do

  We are seeking a Senior AI Engineer to design, build, and
  ship the AI-powered features at the core of the illumend
  platform. This is a hands-on engineering role: you will
  write production code every day, using modern AI development
  tools to move quickly in a fast-paced environment while
  keeping quality, security, and reliability high.

  illumend works in a regulation-heavy space. Insurance
  policies, certificates, and contract requirements are dense
  with detailed rules. Your job is to build AI systems that
  handle that complexity behind the scenes so customers get
  simple, accurate results.

  - Build and ship production AI features end to end, such as
    extracting and validating data from insurance documents,
    checking coverage against contract requirements, and AI
    assistants and agents that help users act on what they
    find
  - Design LLM pipelines and integrations (prompting, structured
    outputs, tool use, retrieval) across Python/FastAPI
    backend services and React/TypeScript frontends
  - Build evaluation sets and automated checks to measure
    accuracy, catch regressions, and improve model output over
    time, and monitor quality, latency, and cost in production
  - Fully embed AI development tools (e.g., Claude Code, Cursor,
    GitHub Copilot) into your daily workflow to accelerate
    coding, refactoring, test generation, prototyping, and
    documentation, while reviewing and validating everything
    you ship
  - Build fast, functional prototypes to test new AI
    capabilities, then iterate and harden them for production
  - Dig into raw customer documents, data, edge cases, and API
    specs rather than relying on secondhand information
  - Make pragmatic technical decisions that put stability,
    security, and ROI ahead of novel or overly complex tech

  Required Skills

  What You Will Need to be Successful

  - Senior-level experience building production web
    applications, with strong Python (FastAPI) skills and
    working knowledge of React, TypeScript, Next.js, and
    PostgreSQL
  - Hands-on experience shipping LLM-powered features to
    production, including prompt design, structured outputs,
    tool use and agents, and retrieval
  - Experience evaluating AI output: building test sets,
    measuring accuracy, and handling failure cases such as
    hallucinations and low-confidence results
  - Experience extracting structured data from unstructured
    documents (PDFs, scanned forms) is a strong plus
  - Mastery of AI coding assistants and agents in daily
    engineering work, backed by a clear method for reviewing
    and validating their output
  - Ability to quickly learn a complex, regulation-heavy B2B
    domain; insurance experience is a plus
  - A strong commitment to engineering standards,
    maintainability, and security, balanced with business
    pragmatism
  - Thrives in a lean, fast-paced environment; self-driven,
    adaptable, and comfortable owning features end to end with
    minimal supervision
  - Clear written and verbal communication; able to explain AI
    tradeoffs and limitations to product and business partners
    and raise risks early

