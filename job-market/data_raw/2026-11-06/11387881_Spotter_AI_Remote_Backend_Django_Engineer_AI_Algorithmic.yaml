description: |
  We’re a remote, product-focused startup building AI- and
  algorithm-driven systems, and we’re looking for a strong
  Backend Django Engineer who loves clean data models, well-
  designed APIs, and clever algorithms.

  You’ll own core backend features end-to-end: from modeling
  the data to implementing the logic and exposing it through
  fast, reliable services that ship to users quickly, working
  with a small distributed team across several countries.

  💰 $100 Bonus Opportunity: Candidates who successfully
  complete the coding assessment and meet our quality
  standards may be invited to an additional evaluation stage.
  Candidates who successfully pass this stage and are selected
  to proceed to the final interview will receive a $100 bonus.
  To be considered for the assessment, please submit your
  resume through this job application. If your resume is
  approved, we’ll send you the coding assessment with further
  instructions.

  What You’ll Do

  - Design and implement backend services and APIs using Python
    + Django (and DRF or similar).
  - Model and evolve our domain in the database with clean,
    well-structured schemas and relationships.
  - Implement algorithmic/AI logic in the backend (e.g.,
    scoring, ranking, routing, decision rules).
  - Write pragmatic, production-ready code that’s easy to reason
    about and iterate on.
  - Optimize for correctness and performance: efficient queries,
    smart indexing, and lean responses.
  - Work with the team to turn product ideas into concrete
    technical designs and endpoints.
  - Help shape how we build things: patterns, conventions, and
    how we ship and iterate as we grow.

  What We’re Looking For

  - Strong experience building backend applications with Python
    + Django.
  - Solid understanding of relational data modeling and SQL (we
    use PostgreSQL).
  - Comfortable designing and building RESTful APIs (bonus if
    you’ve used DRF or similar frameworks).
  - Experience working on non-trivial business logic or
    algorithms (e.g., decision flows, scoring rules,
    optimization logic).
  - Good instincts around performance: understanding query
    behavior, avoiding obvious pitfalls, and using caching
    when it counts.
  - A startup mindset: comfortable with ambiguity, moving fast,
    and iterating based on real-world feedback.
  - Ability to work independently in a remote environment and
    communicate clearly.

  Bonus Points For

  - Experience in startups, side projects, or hackathons where
    you’ve had to ship scrappy solutions fast.
  - Background in algorithms, optimization, or data-heavy
    systems.
  - Experience with Google Cloud Platform (GCP) in production.
  - Familiarity with Redis (caching, queues) and PostgreSQL at
    some scale.
  - Exposure to containers and orchestration (Docker,
    Kubernetes) and/or serverless on GCP.

  This role is a central piece of our backend roadmap, and
  we’re aiming to fill it quickly once we meet the right
  person. If it resonates with you, go ahead and apply now.

  Send us your resume to start the assessment process (and get
  a chance at the $100 bonus).
