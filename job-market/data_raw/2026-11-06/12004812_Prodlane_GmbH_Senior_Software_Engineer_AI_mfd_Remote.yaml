title: (Senior) Software Engineer – AI (m/f/d) – Remote
company: Prodlane GmbH
location: Berlin, DEU
remote: true
work_type: FULL_TIME
company_size: 30 Employees
description: |
  What we do MAIA is an AI platform for companies. With MAIA,
  teams search their internal data and embed agents deep into
  their processes. We help companies use AI not just in
  individual departments, but across the entire organisation.
  On a technical level, this means: we build a GenAI
  application with our own agent systems, RAG pipelines and
  agent-based workflows, connect our customers' external
  systems and analyse their data. We use the best available
  models, operated in the EU, and make them reliable for
  demanding work with large, complex datasets. Many industrial
  companies have been using MAIA intensively for years.
  Following our successful 2026 funding round, we are now
  taking MAIA to a broader market. MAIA has been developed in
  Leipzig since 2021. What you'll do As a Software Engineer,
  you develop MAIA further and help decide from the start how
  we solve problems. What you can work on: * From concept to
  feature. Together with product management, you sharpen rough
  concepts and own features from prototype to continuous
  improvement based on feedback and usage data. * Chat and
  agents. You shape how people work with MAIA: asking
  questions, providing context and letting agents complete
  multi-step tasks, with traceable progress and verifiable
  results. * Unlocking company knowledge. You connect external
  systems and make knowledge from many different file formats
  usable. This way, MAIA finds the right passages, delivers
  answers with sources and respects existing access rights. *
  Models and quality. You integrate new language models and
  compare quality, cost and speed. With evals, you detect
  errors and systematically improve answers and agents. *
  Secure, fast and stable. You build isolated environments for
  running code and tools and improve response times and data
  processing, so that MAIA runs reliably even with large
  knowledge bases. What we're looking for * Solid software
  engineering. You have built and shipped backend systems and
  operated them in production over a longer period.
  Architecture, API design, data modelling and asynchronous
  processing are familiar to you. You recognise weak
  architecture even when a coding agent wrote it. * Very
  strong in at least one of our languages. TypeScript, Python
  or Go, ideally one of the statically typed ones. You don't
  need all three. You'll get up to speed in the others. * At
  home in the LLM ecosystem. You have built real applications
  with LLMs, professionally or in complex personal projects.
  You know RAG, embeddings, vector search and tool calling
  from practice, including where they fail. You try out new
  models and frameworks on your own initiative and separate
  substance from hype. Production experience with LLM systems
  is a big plus. * Measure, don't guess. You know how to test
  and evaluate systems that don't always give the same answer
  to the same question. You build the simplest solution that
  solves the problem. Additional retrieval stages, prompt
  chains or abstractions only come in when measurements
  justify them. * Product thinking. You think about the person
  who needs to finish a quote under time pressure or clarify a
  technical question with MAIA. You like to get involved early
  in product management's concepts, ask the right questions
  and contribute your own ideas, even when not everything is
  settled yet. * Agentic engineering. Coding agents are part
  of your daily work. You write plans that others review and
  that coding agents can build on, you review the results
  critically, and you know where agents help and where they
  don't. * Security-minded. Our customers trust us with their
  internal knowledge. Tenant isolation, access rights and
  secure development are second nature to you. * Remote-ready.
  You communicate proactively, document your work so others
  can follow it, and move things forward without constant
  coordination. * Clear communication. You explain technical
  topics clearly, including to product management, customer
  success and sales. You are fluent in English. German is a
  plus. This role has no people management responsibility.
  Whether you join at regular or senior level is something
  we'll discuss openly with you after the technical interview
  at the latest. Working at MAIA We share a common goal:
  building a really great product. Everyone takes ownership of
  their own area. We enjoy our work and are proud of what our
  customers achieve with MAIA. Paths are short and decisions
  are made quickly. In the engineering team, we critically
  question how we develop and continuously improve our
  processes, especially in agentic development. Much of the
  team works together in our office in Leipzig, centrally
  located between the city centre and the zoo, where we cook
  together almost every day. You work remotely from anywhere
  in Germany. You need to live in Germany for this role. Twice
  a year, we meet in person for team events, and from time to
  time there are team days in Leipzig. When your day starts is
  up to you. * Access to the latest frontier models and coding
  agents * Support for training that fits your professional
  development * Access to a Wellpass membership Compensation
  The annual gross salary is €75,000 to €95,000\. Where you
  fall within this range depends on your level. We'll discuss
  this after the technical interview at the latest. On top of
  that, you receive a virtual share in our VSOP. Application
  and next steps You don't need a cover letter. Apply with
  your CV here and answer one question in a few sentences of
  your own: Why do you want to help shape MAIA? We work with
  AI every day. For this answer, though, your own perspective
  is what counts. So please write it yourself. Short and
  unpolished is fine. If there's a fit, you'll have a
  30-minute intro call, a 90-minute technical interview and a
  final conversation with our management. After each step,
  you'll usually hear from us within two business days. Our
  goal is a decision in about three weeks. We look forward to
  your application.
