description: |
  Codingal (www.codingal.com) is the global leader in online
  AI & coding education for kids and teens. We offer live,
  interactive classes led by expert Computer Science
  instructors, empowering students to build apps, games,
  websites, and AI-powered projects.

  Our mission is to help kids fall in love with coding and
  prepare them to become future-ready creators, entrepreneurs,
  engineers, and scientists. With a curriculum accredited by
  STEM.org and aligned with the K–12 Computer Science
  Framework, we offer personalized learning through 1:1 and
  small-group classes.

  As AI reshapes the world, Codingal integrates real-world AI
  tools like ChatGPT, machine learning, and data science into
  the learning journey, helping kids not just use AI but build
  with it.

  Trusted by over 1 million students worldwide and backed by Y
  Combinator, Rebright Partners, and top angel investors,
  Codingal is rated 4.9/5 by students and has an NPS of 86,
  making it the most loved platform for coding and AI
  education.

  Position Overview

  We’re seeking a detail-oriented Curriculum Developer Intern
  to refine and enhance our existing AI & coding courses.
  You’ll work on improving lesson plans, Teacher Agenda,
  assignments, quizzes, and coding activities to ensure
  they’re student-friendly, teacher-ready, and aligned with
  the latest AI developments.

  Key Responsibilities

  - Redesign existing course content (lesson plans, code
    examples, quizzes, in-class activities & assignments) to
    simplify complex concepts.
  - Break down AI and coding topics into step-by-step, age-
    appropriate instructions.
  - Collaborate with teachers to ensure content is easy to teach
    and aligned with student learning curves.
  - Identify and address gaps where students might struggle
    (e.g., breaking down concepts into smaller chunks,
    debugging, syntax errors, and conceptual
    misunderstandings).
  - Review and update content to reflect the latest trends in
    AI, coding, and educational best practices.
  - Develop AI-focused learning modules (e.g., generative AI,
    machine learning, natural language processing, computer
    vision) tailored for K–12 learners.
  - Create real-world projects where students build apps, games,
    or solutions leveraging AI tools (ChatGPT, Hugging Face,
    scikit-learn, etc.).

  Qualifications

  - Excellent written communication and collaboration skills
  - Degree in Computer Science, AI/ML, Data Science, or a
    related field
  - Strong foundation in Python and Data Science fundamentals
  - Ability to explain AI and coding concepts clearly to younger
    learners (prior teaching or mentoring experience is a
    plus)
  - Meticulous attention to detail - catching errors in code
    examples, instructions, or flow
  - Familiarity with instructional design principles or
    curriculum development

  Good to Have

  - Experience with an AI library or API (scikit-learn, Hugging
    Face, OpenAI or Anthropic).
  - Block coding or web basics (Scratch, App Inventor,
    HTML/CSS/JS).
  - Teaching, tutoring or mentoring experience.
  - A portfolio: a lesson plan, tutorial or small AI project you
    made.
  - Familiarity with instructional design.

  Perks

  - First-hand experience in scaling an international Ed-Tech
    business.
  - Opportunity to impact thousands of students & teachers
    globally.
  - Mentorship from senior curriculum developers.
  - A chance to convert into a full-time role based on
    performance.
  - Free lunch + dinner.

  Education: Bachelor’s degree Stipend: INR
  25,000–27,000/month Working days: Monday to Saturday Shift
  Time: 11am to 8pm Duration: 6 Months Location: HSR Layout,
  Bangalore, India (in-person only, no remote option)

  You get to work with a young & smart team, including
  directly with the founders, who are on a mission to inspire
  school kids to fall in love with coding & AI. Join us on an
  exciting journey to provide AI & coding education to every
  K-12 student and prepare them for the future.

  👉 Apply now!
