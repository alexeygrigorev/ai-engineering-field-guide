description: |
  Meet the Team

  The Engineering function is responsible for all engineering
  activities within a firm to ensure that business objectives
  are met. Includes the creation, development, design and
  improvement of products, equipment, facilities, services,
  standards and procedures in all engineering fields. The
  Quality Assurance area is responsible for ensuring that all
  applications, system products, and projects meet defined
  quality standards. Develops, conducts, and evaluates
  application audits and testing processes. Staff often have
  in-depth knowledge of automated testing tools, and quality
  control and assurance approaches. The Quality Assurance
  Engineering focus specializes in debugging software using
  automated tests to achieve quality standards for firm
  products. Develops, modifies and executes software test
  plans, automated scripts and programs for testing to ensure
  program functionality, consulting with development engineers
  in resolution of issues. Provides guidance and feedback in
  the preparation of technical appraisals of programming
  languages and systems, computational software, and related
  technology. This job family is in the professional level
  category and works independently with flexibility and
  authority over daily work priorities. Incumbents in this job
  level category may provide work direction to other employees
  but would not typically have the authority to discipline or
  reward other employees. There are different levels available
  that provide clarity on contribution expectations based on
  knowledge, application, problem solving, and collaboration.

  Your Impact

  As an AI System Test Engineer, your responsibilities will
  include: Designing and developing AI/ML-based tools and
  frameworks for functional testing of Cisco products,
  ensuring quality and stability from a system/solution
  perspective that simulates customer environments with IIoT
  deployments

  - Work with AI/ML tools in developing, testing, and
    maintaining AI-driven solutions for network monitoring,
    automation, and optimization.
  - Participate in automation initiatives using scripting, AI
    tools, and modern networking frameworks.
  - Stay updated with emerging trends in AI, networking
    technologies, and automation practices.
  - Contribute to internal tools, proofs-of-concept, and
    innovation projects related to AI-enabled network
  - Collaborate with senior engineers to design, test, and
    deploy network and AI-based features or enhancements.
  - Monitor system performance, investigate anomalies, and
    contribute to root-cause analysis and resolution.
  - Support day-to-day network engineering activities, including
    configuration validation, troubleshooting, and performance
    analysis.
  - Supporting the test team in expanding their knowledge of
    AI/ML, testing technologies and networking by staying
    updated with the latest industry developments.
  - Contributing to the department’s knowledge retention by
    systematically archiving meaningful documentation and
    equipment.

  Minimum Qualifications

  - Bachelor’s degree in Computer Science, AI/ML, or a related
    engineering field, with 2-4 years of hands-on experience
    in AI/ML development, implementation or related areas
  - Demonstrated strong knowledge of AI/ML concepts with the
    ability to apply them effectively in practical scenarios
  - Excellent programming or scripting skills (Python)
  - Strong analytical thinking, problem-solving ability, and
    communication skills.
  - Familiarity with networking concepts, including TCP/IP,
    routing, switching, and network protocols, is a plus.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

