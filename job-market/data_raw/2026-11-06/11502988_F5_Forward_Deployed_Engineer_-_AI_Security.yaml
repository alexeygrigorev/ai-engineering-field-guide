  About the Role:

  *EST opportunity - This role will be located in the east
  coast time zone (EST) and work with clients in that
  territory. Please apply to this role if you are in or able
  to relocate to the Eastern United States*

  As our Forward Deployed Engineer, you’ll play a critical
  role in ensuring customer success from the moment a deal is
  signed. You’ll lead technical onboarding and implementation
  efforts, serve as the customer’s primary post-sales
  technical point of contact, and work closely with Solutions
  Engineering, and Support to drive adoption, reduce time-to-
  value, and lay the foundation for successful long-term
  partnerships.

  This is a hands-on, high-impact role for someone who thrives
  in early-stage environments, wears many hats, and wants to
  help shape the customer journey in a fast-growing AI
  security market.

  Key Responsibilities:

  - Lead technical onboarding and implementation for new
    customers, including planning, scoping, milestones, and
    success metrics

  - Own the post-sales relationship from a technical standpoint,
    serving as the main point of contact for customer
    engineering and security teams

  - Develop and execute structured implementation plans to
    ensure customers achieve First Time to Value quickly and
    reliably

  - Proactively manage risk by identifying blockers, misaligned
    expectations, or skill gaps - on either side - and
    escalating as needed

  - Collaborate cross-functionally with Sales, Engineering,
    Services and Product to ensure successful handoffs and
    knowledge sharing

  - Document repeatable processes, technical guides,
    implementation templates, and internal runbooks

  - Coordinate support needs, triage technical issues, and
    ensure efficient collaboration with Support and Dev. teams

  - Act as a customer advocate, gathering feedback and insights
    to inform roadmap and future services

  Skills & Experience:

  - 8+ years in a Post-Sales technical role (e.g., TAM,
    Solutions Engineer, Integration Engineer, Implementation
    Consultant, or similar)

  - Experience building and/or deploying AI Systems/Applications

  - Strong understanding of enterprise infrastructure (e.g.,
    networking, containers, security protocols)

  - Experience leading technical deployments (on-prem, hybrid,
    or complex SaaS integrations)

  - Experience working with enterprise customers in regulated
    industries (huge bonus: AI/ML or cybersecurity products)

  - Excellent communication and project management skills - you
    can set expectations, drive timelines, and keep everyone
    aligned

  - Ability to thrive in a high growth environment - comfortable
    with ambiguity, self-directed, and proactive.
  - Red Hat Certified Specialist in OpenShift Administration -
    nice to have

  We offer a competitive salary, commission, and benefits
  package, as well as opportunities for career growth and
  advancement. If you are a self-starter with a passion for
  sales and business development, we encourage you to apply
  for this exciting opportunity.

