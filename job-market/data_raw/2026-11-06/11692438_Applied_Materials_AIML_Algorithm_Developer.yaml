  Job Description

  About Rocket

  Rocket is a team within Applied dedicated to advancing and
  scaling rapid innovation methodologies across the
  organization. We focus on accelerating breakthrough
  technologies by combining deep scientific expertise,
  advanced computational methods, and practical engineering to
  solve complex challenges in semiconductor manufacturing.

  Position Summary

  We are seeking a highly motivated and intellectually curious
  Algorithm Developer to work at the intersection of
  artificial intelligence and machine learning (AI/ML),
  theoretical physics, and systems engineering. In this role,
  you will drive the development of next-generation solutions
  for high-impact semiconductor manufacturing applications.

  The successful candidate will contribute to multiple
  disruptive design initiatives by developing automated
  systems capable of ingesting and processing data from
  thousands of sensors, identifying critical physics-based
  relationships, and building predictive and control models.
  These solutions will leverage a hybrid approach that
  combines first-principles physics modeling with advanced
  machine learning techniques, including physics-informed
  neural networks (PINNs), to optimize complex manufacturing
  processes in real time.

  Key Responsibilities

  - Design and develop scalable data pipelines to collect,
    process, and analyze high-volume sensor data from
    semiconductor manufacturing systems.
  - Identify and model underlying physical relationships
    governing complex process behavior.
  - Develop predictive and control algorithms using a
    combination of traditional physics-based methods and
    machine learning approaches.
  - Build robust, maintainable software modules that integrate
    directly with real-world manufacturing tools and systems.
  - Collaborate with multidisciplinary teams spanning physics,
    engineering, software development, and data science to
    accelerate innovation and technology deployment.
  - Contribute to the design and implementation of intelligent
    automation solutions for advanced semiconductor
    manufacturing processes.
  - Develop ML surrogates or reduced order models, based on
    rigorous physics simulations, including research, design,
    development and implementation & proliferation
    accompanying in accordance with project budgets and time
    schedules.
  - Optimize accuracy / performance tradeoffs, to retain achieve
    but speed execution of algorithm modules
  - Analyze large quantities of sensor and metrology data, and
    iteratively improve simulation and models to improve
    accuracy
  - Implement models and code for user facing applications, in
    control systems or dashboards
  - Maintain a clean and consistent code base, that can be
    extended by team

  Ideal Candidate Profile

  The ideal candidate possesses a strong foundation in
  theoretical and computational disciplines, coupled with
  practical software development expertise. You are passionate
  about applying scientific principles to solve real-world
  engineering challenges and are equally comfortable moving
  between mathematical modeling, machine learning, and
  software implementation.

  You should demonstrate:

  - Deep expertise in one or more areas of theoretical physics,
    applied mathematics, computational science, or simulation-
    driven engineering.
  - Working knowledge of modern machine learning, data science,
    and statistical modeling techniques.
  - Strong software engineering capabilities, including the
    ability to translate complex algorithms into clean,
    scalable, and production-ready code.
  - A practical mindset focused on delivering solutions that
    interact with and control physical systems in real-world
    environments.

  Qualifications

  Minimum Requirements

  - Ph.D. in Physics, Applied Mathematics, Computational
    Chemistry, Electrical Engineering, Mechanical Engineering,
    or a related quantitative discipline, or
  - Master’s degree in one of the above fields with a minimum of
    2 years of relevant industry or research experience.

  Preferred Qualifications

  - Demonstrated ability to develop high-quality, maintainable
    code, evidenced through public GitHub repositories, open-
    source contributions, peer-reviewed publications, or
    equivalent technical work.
  - Experience with computational methods, computer-aided
    engineering (CAE), engineering simulation, physical
    modeling, or the analysis of complex systems, with a focus
    on practical and impactful outcomes.
  - Experience applying machine learning techniques to
    scientific, engineering, or industrial problems.
  - Strong interest in sensors, instrumentation, hardware
    systems, robotics, or other technologies that bridge
    software with physical-world applications.
  - Proven ability to work effectively in interdisciplinary
    environments and solve ambiguous, complex technical
    problems.

  Why Join Rocket?

  Rocket offers a unique opportunity to work on cutting-edge
  challenges at the convergence of physics, AI, and
  semiconductor manufacturing. You will help develop
  transformative technologies that directly influence next-
  generation manufacturing systems while collaborating with a
  team dedicated to rapid innovation, scientific excellence,
  and real-world impact.

