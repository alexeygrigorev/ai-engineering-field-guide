description: |
  Position Summary...

  What you'll do...Skillset: Java with React, AI
  exposure.Experience range: 10 - 15 years

  About Team:

  Our team is part of Walmart’s Global Governance organization
  within Walmart Global Tech, building technology solutions
  that help automate and streamline compliance, security,
  risk, and investigation processes.

  We develop data-driven platforms and intelligent
  capabilities that simplify complex workflows, improve
  operational efficiency, and enable actionable insights for
  associates and stakeholders. Our engineers work on large-
  scale enterprise systems spanning application development,
  data platforms, cloud technologies, analytics, and emerging
  AI/ML capabilities.

  We are looking for a Staff Software Engineer to design and
  build scalable, secure, cloud-native enterprise applications
  with a emphasis on backend engineering and distributed
  systems. You will provide hands-on technical leadership
  across architecture, software engineering, operational
  excellence, and the adoption of AI/ML capabilities.

  What you'll do:

  - Lead the architecture, design, and hands-on development of
    scalable, resilient, secure, and highly available
    enterprise applications, with primary emphasis on backend
    services while contributing across the full technology
    stack.
  - Own complex technical initiatives end-to-end, translating
    business problems into sound engineering solutions and
    driving them from architecture and proof-of-concept
    through implementation, deployment, production readiness,
    and continuous improvement.
  - Drive engineering excellence through design and code
    reviews, automated testing, observability, performance
    engineering, CI/CD, production reliability, security, and
    disciplined software-development practices.
  - Apply modern cloud, data, AI, and ML engineering concepts to
    build intelligent capabilities, while optimizing
    infrastructure utilization, cloud cost, model/API
    consumption, and AI token efficiency.
  - Provide technical leadership and mentorship to engineers,
    influence architectural decisions across teams,
    collaborate with product and business partners, and help
    establish reusable patterns, standards, and engineering
    best practices.

  What you'll bring:

  - Strong software engineering experience building large-scale,
    production-grade distributed applications, with deep
    hands-on expertise in backend development and the ability
    to work across the full stack.
  - Strong proficiency in Java, Spring/Spring Boot, RESTful
    APIs, microservices, object-oriented design, data
    structures, algorithms, concurrency, design patterns, and
    distributed-system fundamentals.
  - Experience with modern frontend technologies such as React,
    JavaScript/TypeScript and related web-development
    frameworks, with deeper expertise expected on backend
    technologies.
  - Strong understanding of system design, including API design,
    data modeling, relational and NoSQL databases, caching,
    asynchronous/event-driven architectures, scalability,
    performance, resiliency, and disaster-recovery patterns.
  - Experience designing and operating applications on public
    cloud platforms such as GCP or Azure, including containers
    and orchestration technologies such as Docker and
    Kubernetes.
  - Experience implementing CI/CD, automated testing,
    observability, logging, monitoring, alerting, and
    production-support practices for enterprise applications.
  - Understanding of cloud architecture and FinOps principles,
    with experience identifying opportunities to improve
    infrastructure utilization, application efficiency,
    performance, and cloud cost.
  - Exposure to machine learning / MLE concepts, including the
    software and data engineering considerations involved in
    integrating, deploying, monitoring, and operating ML-
    powered capabilities.
  - Exposure to Generative AI / LLM-based application
    development, including concepts such as prompt/context
    design, model/API integration, evaluation, responsible AI,
    latency/cost trade-offs, and token-consumption
    optimization.
  - Ability to analyze complex technical problems, evaluate
    architectural trade-offs, and make pragmatic engineering
    decisions balancing scalability, reliability, security,
    maintainability, performance, and cost.
  - Strong communication and collaboration skills with
    demonstrated ability to influence technical direction,
    mentor engineers, and work effectively across engineering,
    product, business, and platform teams.
  - Curiosity and willingness to continuously evaluate and adopt
    emerging technologies where they provide measurable
    engineering or business value.

