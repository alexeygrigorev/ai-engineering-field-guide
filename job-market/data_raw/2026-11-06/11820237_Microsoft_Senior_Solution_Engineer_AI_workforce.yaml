description: |
  Overview

  Join a team that clears the path for you to thrive. As an AI
  Workforce Solution Engineer supporting the Japan Global
  Specialist Team Unit, you will work with some of Microsoft’s
  most strategic global customers headquartered in Japan. You
  will help them reimagine how their workforces operate using
  advanced cloud and artificial intelligence solutions, while
  navigating the unique business, regulatory, and cultural
  dynamics of a high‑growth market.



  In this global role covering top Japanese global accounts,
  you will be the senior technical leader who connects
  customer business priorities to Microsoft’s solution
  portfolio, particularly in areas where AI can transform
  productivity, employee experience, and operational
  excellence. You will lead the technical strategy across
  complex, multi-country engagements, orchestrate the right
  experts and partners, and ensure that our solutions land
  with measurable impact for customers and for Microsoft’s
  growth in this strategic market. You will collaborate
  closely with the Japan Global Specialist Team Unit to shape
  long-term architectures, de‑risk large deals, and turn
  customer feedback into actionable insight for our product
  and engineering teams.



  At Microsoft, our mission to empower every person and every
  organization on the planet to achieve more guides how we
  partner with customers to deliver trusted, impactful
  solutions. With a growth‑mindset culture, we innovate
  responsibly and measure success by shared progress, people,
  teams, and customers. Join us to do meaningful work that
  changes the world and helps shape what’s next for everyone.

  Responsibilities

  - Use deep customer, industry, and solution expertise to build
    credibility with technical decision makers and act as a
    trusted advisor on how Microsoft solutions can address
    their security and workforce transformation needs.
  - Apply advanced sales methodologies to guide customers
    through complex digital transformation journeys, designing
    and validating architectures and solutions that showcase
    clear business value and innovation.
  - Lead and ensure complex technical wins across workloads,
    regions, and teams by defining rules of engagement,
    coaching technical sellers and account teams, and
    orchestrating Microsoft resources and programs.
  - Scale customer success through partners by building strong
    technical relationships, promoting partners across the
    Microsoft ecosystem, and identifying new partnership
    opportunities that support subsidiary strategy.
  - Develop and share competitive and market insights,
    documenting patterns and feeding them back to product and
    engineering teams to influence strategy, offerings, and
    competitive positioning.

  Qualifications

  - Demonstrated background in technical pre-sales, solution
    engineering, technical consulting or technology delivery,
    with the ability to translate customer needs into
    technical solutions.
  - Good understanding of AI and cloud technologies, with
    technical depth in areas such as Microsoft Copilot,
    Copilot Studio, Azure AI or GitHub Copilot.
  - Ability to engage and influence senior customer
    stakeholders, connecting technical solutions with business
    needs.
  - Proven ability to work effectively across global or
    international teams, customers or projects.
  - Ability to work independently and proactively, taking
    ownership and driving customer opportunities with limited
    day-to-day direction.



  Solution Engineering IC5 - The typical base pay range for
  this role across United Kingdom is £ 79,700.00 - £
  133,900.00 per year. Certain roles may be eligible for
  benefits and other compensation.



  Find additional benefits and pay information here:
  https://careers.microsoft.com/v2/global/en/corporate-
  pay/united-kingdom-corporate-pay.html

  This position will be open for a minimum of 5 days, with
  applications accepted on an ongoing basis until the position
  is filled.

  Microsoft is an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to age, ancestry, citizenship, color, family or
  medical care leave, gender identity or expression, genetic
  information, immigration status, marital status, medical
  condition, national origin, physical or mental disability,
  political affiliation, protected veteran or military status,
  race, ethnicity, religion, sex (including pregnancy), sexual
  orientation, or any other characteristic protected by
  applicable local laws, regulations and ordinances. If you
  need assistance with religious accommodations and/or a
  reasonable accommodation due to a disability during the
  application process, read more about requesting
  accommodations.
