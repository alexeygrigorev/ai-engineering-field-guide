description: |
  Arcadia is dedicated to happier, healthier days for all. We
  believe that there is a better healthcare world – one
  powered by data. Our platform transforms complex, diverse
  data into a unified foundation for health, helping
  organizations deliver better care, boost revenue, and lower
  costs.



  We’re a team of fiercely driven individuals committed to
  making healthcare more sustainable—and we’re looking for
  passionate people to help us get there.



  For more information, visit arcadia.io.

  Why This Role Is Important to Arcadia

  Teams across Arcadia already put agents to work enabling
  clients' clinical, analytics, and operations teams. We use
  them heavily for our own work, too. Much of the platform
  foundation is in place. Now it has to handle longer-running
  workflows, client-facing agents, and PHI at scale.

  You'll join the team that owns the platform underneath these
  agent workflows. This isn't a solo mandate. Your influence
  comes from what you ship and what other teams build on top
  of it.

  How We Build

  Engineers at Arcadia own outcomes end to end: the problem,
  the design, the code, the rollout, and the result in
  production. We build alongside AI without handing it our
  judgment; our automation is governed and transparent, built
  to strengthen human expertise, not replace it. We have few
  layers, high agency, deep ownership. We adopt new tools and
  practices quickly, which lets us move faster than many
  startups while keeping the discipline a regulated
  environment demands.

  Our agent platform sits on top of governed access to AWS-
  based petabyte-scale lakehouse data with open table formats,
  distributed Spark processing, and Kubernetes services. The
  current implementation has an OSS agent harness and a
  gateway/router across model providers, all built on a third-
  party agent framework.

  What Success Looks Like

  Arcadia product teams should be able to spin up an agent
  quickly, ship it with confidence, and evolve it over time
  safely and cost-effectively. The platform provides the
  building blocks: persistence, workflows, memory, and
  identity-aware, compliant connectivity to tools. The
  platform also takes care of the quality attributes: caching,
  compaction, evals, guardrails, observability, resiliency,
  and safe handling of PHI.

  Teams adopt it because it's the fastest safe path, not
  because they're told to. You treat it as a product and can
  show the impact in numbers.

  Next: customers bring their own agents to Arcadia, and
  eventually assemble them from our building blocks.

  What You'll Be Doing

  What You'll Bring

  - Platforms you've built and run that other engineering teams
    adopted, from ambiguous beginnings through years of
    operation, with results you can show.
  - Deep foundations in cloud-native distributed systems, data
    infrastructure, and service architecture. You reason from
    first principles.
  - Hands-on infrastructure depth: IaC, cloud, security
    architecture, and running production systems. You can go
    deep with SRE, not just hand work off to them.
  - Current, hands-on production coding, and the desire to keep
    doing it.
  - Passion for developer experience (DevEx/DevProd) as a
    discipline.
  - Writing clear enough to set standards beyond your own work,
    and influence that comes from credibility, not title.
  - No healthcare background required. We hire builders from
    fintech, infrastructure, and consumer scale, and teach the
    domain.

  Would Love for You to Have

  - Scars from production LLM/agent deployments beyond glossy
    demos (but we won't ask for 20 years of LLM experience).
  - Pragmatism about the LLM ecosystem: excited by it, not
    distracted by it.
  - Regulated-data experience (HIPAA, PHI, SOC 2 or HITRUST
    environments).
  - A public voice through talks, writing, or open source.

  What You'll Get

  About Arcadia

  Arcadia.io helps innovative providers and payers across the
  country transform healthcare to reduce cost while improving
  patient health. We do this by aggregating large amounts of
  disparate data, applying algorithms to identify
  opportunities to provide better patient care, and making
  those opportunities actionable by physicians at the point of
  care in near-real time. We are passionate about helping our
  customers drive meaningful outcomes. We are growing fast and
  have emerged as a market leader in the highly competitive
  population health management software market and have been
  recognized by industry analysts KLAS, IDC, Forrester, and
  Chilmark for our leadership. For a better sense of our brand
  and products, please explore our website.

  Protect Yourself

  If you have concerns about the authenticity of a job offer
  or recruitment-related communication claiming to be from
  Arcadia, we encourage you to verify by contacting us
  directly at (781) 202-3600 and select option 3. For more
  information, visit our website.

  This position is responsible for following all Security
  policies and procedures in order to protect all PHI under
  Arcadia's custodianship as well as Arcadia Intellectual
  Properties.  For any security-specific roles, the
  responsibilities would be further defined by the hiring
  manager.
