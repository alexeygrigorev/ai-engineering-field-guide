description: |
  JOB TITLE

  Software Engineer - Data & AI

  A CAREER WITH POINT72’S PROPRIETARY RESEARCH

  On our proprietary research team—Market Intelligence—you’ll
  partner with our Investment Professionals and Compliance
  team to uncover insights about companies, industries, and
  the broader economy through deep fundamental research and
  applying data science and engineering techniques to
  alternative data sets. You’ll work alongside a talented team
  with diverse skills, backgrounds, and perspectives. Our
  industry researchers, product managers, and data scientists
  and engineers work together to build compliant research
  products that answer the questions our investment
  professionals care about most. We look for other bright,
  motivated, and collaborative people to join our team and
  grow with us—more than 90% of the leaders in our group were
  promoted from within.

  WHAT YOU'LL DO

  Software Engineer - Data & AI on the Proprietary Research
  team design and build Data & AI Platform to transform
  structured and unstructured data into actionable insights.
  As a member of our Data Engineering team, you will work
  closely with investment professionals, researchers, and data
  scientists to design, build, and launch robust end-to-end
  business solutions including data pipelines, products and
  tools that help extract the most value out of Point72’s data
  assets. In this role, you will: • Design and build big data
  pipelines for ingestion, transformation, trend creation, and
  delivery of AI-ready data assets. • Develop reusable
  software components, libraries, and APIs to support
  experimentation and production deployment. • Implement data
  quality, lineage, and governance controls to ensure datasets
  are reliable, auditable, and compliant. • Build scalable,
  AI-native, cloud-based infrastructure using distributed
  systems and modern cloud technologies. • Optimize system
  performance, cost, and reliability through benchmarking and
  continuous improvement. • Explore emerging Data and AI
  technologies, run proof of concepts, and convert successful
  ideas into business deliverables. • Partner with investment,
  research, data science, and compliance teams to turn
  research needs into production-ready data products and
  analytics. • Provide hands-on technical leadership,
  influence architecture and team processes, and support
  development efforts across engineers and stakeholders. • Use
  AI as a core operating layer by deploying LLM-based tools
  and building agentic workflows for business impact. •
  Demonstrate strong project management, business intuition,
  collaboration, ethical standards, and a solution-oriented
  mindset in a fast-paced environment.

  WHAT’S REQUIRED

  • 5+ years of experience in Data Engineering, Software
  Engineering, or a related field. • 2+ years of strong hands-
  on Python development experience. • Experience in system
  design and leading development efforts involving multiple
  contributors. • Strong knowledge of distributed data
  processing frameworks such as Spark. • Experience building
  scalable APIs, backend infrastructure, and software
  applications. • Hands-on experience with cloud platforms and
  services for data storage and compute, such as AWS, Google
  Cloud Platform, or Azure. • Experience with workflow
  orchestration technologies such as Airflow. • Exposure to
  LangGraph, LangChain, embedding models, vector databases, or
  graph databases is a plus. • Strong interest in staying
  current with AI advancements and applying emerging
  techniques to real-world use cases. • Demonstrates key
  values including integrity, ownership, commerciality,
  humility, adaptability, and the ability to elevate the team
  through strong work ethic and domain knowledge. • Commitment
  to the highest ethical standards

  WE TAKE CARE OF OUR PEOPLE

  We invest in our people, their careers, their health, and
  their well-being. When you work here, we provide: • Health
  care benefits • Maternity, Adoption & related leave policies
  • Generous paternity and family care leave policies •
  Employee Assistance Program & Mental wellness programs •
  Transportation support • Tuition assistance

  ABOUT POINT72

  Point72 is a leading global alternative investment firm led
  by Steven A. Cohen. Building on more than 30 years of
  investing experience, Point72 seeks to deliver superior
  returns for its investors through fundamental and systematic
  investing strategies across asset classes and geographies.
  We aim to attract and retain the industry’s brightest talent
  by cultivating an investor-led culture and committing to our
  people’s long-term growth. For more information, visit
  https://point72.com.
