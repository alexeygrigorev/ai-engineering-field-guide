description: |
  Job Description Team: Technology - Reporting and Analytics
  Salary Range: USD 175K Location: Remote Opportunity for
  Impact Applied builds cloud software and AI-powered
  solutions that are reinventing how the global insurance
  industry operates, and we do it at a pace that keeps us
  ahead. What you ship here reaches thousands of agencies and
  brokers worldwide and sets the standard for what modern
  insurance technology looks like. Applied Systems, Inc., a
  worldwide leader in insurance technology, is currently
  searching for an experienced Staff Software Engineer,
  Agentic AI to join our Technology - Reporting and Analytics
  team. They will contribute to the build-out of agentic AI
  capabilities across our platform. We are on an exciting
  journey to scale our Data and Analytics capabilities to
  enable better insights and to lay the foundation for AI. In
  this role, you will design, build, and operate autonomous
  and semi-autonomous AI agents that reason over our data and
  systems - orchestrating multi-step workflows, calling tools,
  and taking action, not just generating text. If you are
  passionate about agentic AI and excited to work on cutting-
  edge technologies, we want to hear from you! At Applied,
  Staff engineers are strong, hands-on builders. Technical
  practitioners who are passionate about building, shipping,
  and teaching by doing. You will have an AI-First approach to
  development, with a specific focus on agentic systems. Areas
  of development include What You'll Do Agentic AI Systems

  - Design, build, and run autonomous and semi-autonomous agents
    that plan, use tools, and take multi-step action over our
    data and platform
  - Architect agent orchestration patterns (planning, memory,
    tool-use, multi-agent coordination) and select the right
    pattern for the problem
  - Build the evaluation harnesses needed to measure agent
    accuracy, reliability, and regressions before and after
    they ship

  Guardrails, Observability, and Incidents

  - Architect, build and deploy observability, alerting, and
    guardrail frameworks to monitor the health, cost, and
    behavior of AI agents in production
  - Define safe failure modes and human-in-the-loop checkpoints
    for agents that take action on production data or systems
  - Respond to incidents when they occur, including agent
    misbehavior. Drive RCAs.

  Data Foundations for Agents

  - Architect, build and run high volume batch/streaming data
    pipelines that feed agent context and retrieval
  - Partner across Applied teams to enforce data quality,
    lineage tracking, access control, and cataloging so agents
    can be trusted with the data they touch

  SDLC

  - Drive the adoption of AI-driven and agent-assisted
    development processes
  - Follow and help refine engineering standards, best
    practices, and design patterns for building and operating
    agentic systems within the team
  - Be a reliable go-to resource on the team for complex agentic
    AI and data engineering problems and production incidents
  - Mentor and grow engineers through code reviews, design
    discussions, and technical guidance
  - Translate business requirements into sound technical designs
    for where agentic AI adds real value.

  What We're Looking For

  - 5+ years in software engineering with strong impact
  - Computer Science degree or equivalent
  - Strong knowledge of software engineering principles and best
    practices
  - Hands-on builder experience (actively coding, testing,
    shipping at scale)
  - Hands-on experience building agentic AI systems in
    production - agent orchestration frameworks, tool-calling,
    planning/reasoning loops, and multi-agent coordination
  - Practical experience building evaluation, guardrail, and
    observability tooling specifically for AI agents, not just
    traditional data pipelines
  - Strong collaborator who works well across engineering and
    cross-functional teams
  - Pragmatic approach and obsessed with eliminating waste
  - Growth mindset with a willingness to mentor and to keep
    learning
  - Adaptability, resilience, and the ability to thrive in
    ambiguity with iteration
  - Excellent communication skills, able to meet your audience
    where they are and explain complex problems in a way that
    can be understood
  - Expertise across various data and software technologies -
    GCP BigQuery
  - Good understanding of Data Migration processes a plus

  Bonus points if you also have:

  - Prior experience acting as a strategic technical partner to
    senior leadership across multiple teams; exposure to
    applying AI/ML within data platforms.
  - Experience with large-scale, multi-tenant SaaS data
    platforms (ideally in insurance or another regulated
    industry)
  - A track record of leading complex, large-scale migrations
    with minimal disruption
  - Experience building engineering culture and mentoring
    engineers to promotion.

  Talent shows up in a lot of different ways, and we mean
  that. We welcome candidates from all backgrounds and
  experience levels, including military members and their
  spouses and those without a traditional degree or tech
  background. If this role speaks to you, apply.  Why You'll
  Like Working on Team Applied The best work happens when
  smart people move fast, together. For over 40+ years,
  Applied has built technology that solves real problems for
  insurance professionals - and we're still pushing what's
  possible. You'll be part of our people-first culture built
  on trust, inclusion, and growth - where you're supported to
  deliver, collaborate with teammates who care, and grow with
  leaders invested in your success. How We'll Support You We
  invest in the whole person, not just the role. Our benefits
  and resources are built to support your health, your time,
  and your life outside of work:

  - Medical, Dental, and Vision Coverage
  - Holiday and Vacation Time
  - Health & Wellness Days
  - A Bonus Day for Your Birthday

  Compensation Transparency  Our targeted starting base salary
  in the United States for this position considers a variety
  of factors, including depth and breadth of experience,
  skills and role scope. Depending on the role, team members
  may also be eligible for additional compensation plans
  (bonus and commission). Your Security Matters: Our
  candidates' personal information and online safety are top
  of mind. Applied communicates with candidates only via a
  secure @appliedsystems.com email address or through our
  official careers portal. Recruiters will never request
  payments or ask for financial account or sensitive personal
  information like Social Security numbers. AI Utilization We
  leverage AI tools to streamline parts of our recruitment
  workflow (such as resume parsing and interview scheduling).
  However, final decisions are always conducted by real
  humans. EEO Statement Applied Systems is proud to be an
  Equal Employment Opportunity Employer. Diversity and
  Inclusion is a business imperative and is a part of building
  our brand and reputation. At Applied, we don't discriminate,
  and we are committed to recruit, develop, retain, and
  promote regardless of race, religion, color, national
  origin, sexual orientation, gender identity, disability,
  age, veteran status, and other protected status as required
  by applicable law. #LI-Remote #LI-US
