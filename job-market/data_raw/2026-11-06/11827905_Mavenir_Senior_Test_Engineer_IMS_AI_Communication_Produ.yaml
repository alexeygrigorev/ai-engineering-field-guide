description: |
  Mavenir is building the future of networks and pioneering
  advanced technology, focusing on the vision of a single,
  software-based automated network that runs on any cloud. As
  the industry's only end-to-end, cloud-native network
  software provider, Mavenir is transforming the way the world
  connects, accelerating software network transformation for
  250+ Communications Service Providers in over 120 countries,
  which serve more than 50% of the world’s subscribers.

  Role Summary

  We are looking for a highly skilled Senior Test Engineer
  with 5-6 years of experience in testing IMS-based telecom
  products and next-generation AI-powered communication
  applications, including Voice Translation, Speech
  Processing, Conversational AI, and Real-Time Media platforms

  Key Responsibilities

  IMS & Telecom Testing

  - Perform functional, integration, system, performance, and
    regression testing of IMS-based products.
  - Validate end-to-end call flows across IMS network elements.
  - Analyze and troubleshoot telecom signaling and media issues.
  - Execute interoperability testing with various IMS components
    and network elements.
  - Perform capacity, load, scalability, failover, resiliency,
    and soak testing.

  AI Product Testing

  - Test AI-powered communication products such as:
    - Voice Translation
    - Speech-to-Text (STT)
    - Text-to-Speech (TTS)
    - Conversational AI / Voice Bots
    - Real-time Media Processing
  - Validate AI inference accuracy, latency, scalability, and
    multilingual capabilities.
  - Develop test scenarios for AI model validation and user
    experience verification.

  Automation & Cloud-Native Testing

  - Design and implement automation frameworks using Python.
  - Develop test scripts for validating APIs, SIP call flows,
    and media scenarios.
  - Execute testing in Kubernetes/OpenShift environments.
  - Validate deployment, upgrade, rollback, and high-
    availability scenarios.

  Protocol & Media Validation

  - Analyze SIP traces using Wireshark, HOMER, or equivalent
    tools.
  - Validate RTP, SRTP, RTCP media flows.
  - Debug signaling and media issues across distributed systems.

  Review logs, packet captures, and KPIs to identify product
  defects

  Job Requirements

  - Telecom / IMS: IMS Architecture, SIP, SDP, RTP/SRTP, RTCP,
    Diameter, HTTP/REST APIs, WebRTC
  - IMS Network Elements: SBC, TAS/Application Server, MRF, IMS
    Core Components
  - Cloud & Containerization: Kubernetes (K8s), Docker, Helm,
    Microservices, Cloud-Native Deployments, OpenShift (Plus)
  - Automation: Python (Mandatory), API Automation, PyTest/Robot
    Framework, CI/CD (Jenkins, GitLab, GitHub Actions)
  - Testing & Monitoring Tools: Spirent Landslide, Spirent
    Abacus, Ixia, Wireshark, HOMER, SIPp, Prometheus/Grafana
    (Preferred)
  - Experience: 5 - 8 years of relevant experience
  - Candidates available to join immediate and currently working
    in Bangalore are preferred

  Accessibility

  Mavenir is committed to working with and providing
  reasonable accommodation to individuals with physical and
  mental disabilities. If you require any assistance, please
  state in your application or contact your recruiter.

  Mavenir is an Equal Employment Opportunity (EEO) employer
  and welcomes qualified applicants from around the world,
  regardless of their ethnicity, gender, religion,
  nationality, age, disability, or other legally protected
  status.
