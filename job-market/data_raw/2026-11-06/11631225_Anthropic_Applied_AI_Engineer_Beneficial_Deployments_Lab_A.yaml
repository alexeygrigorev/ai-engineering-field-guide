  About Anthropic

  Anthropic's mission is to create reliable, interpretable,
  and steerable AI systems. We want AI to be safe and
  beneficial for our users and for society as a whole. Our
  team is a quickly growing group of committed researchers,
  engineers, policy experts, and business leaders working
  together to build beneficial AI systems.

  About Beneficial Deployments

  Beneficial Deployments ensures AI reaches and benefits the
  communities that need it most. We partner with nonprofits,
  foundations, and mission-driven organizations to deploy
  Claude in education, global health, economic mobility, and
  life sciences — focusing on raising the floor for those who
  need it most.

  About the Role

  We're looking for an Applied AI Engineer to join our
  Beneficial Deployments, Life Sciences team. Our goal is for
  Claude to close the loop on scientific discovery, and a
  significant part of this is helping Claude to drive
  scientific hardware and software. You'll help deploy the
  Model Hardware Standard (MHS) to labs doing the world’s most
  important research. You’ll scale what you learn in the field
  by contributing back to the standard, building scalable
  assets, and driving associated internal product and research
  direction.

  Responsibilities

  - Work with labs to automate their experiments end-to-end with
    Claude - from advising, to prototyping, to writing
    production code.
  - Drive product, engineering and research direction based on
    field experience - e.g. building evals to measure
    limitations of our models in the physical world
    (capabilities and safety), developing new features on MHS,
    etc.
  - Scale your impact to the long tail of labs through reusable
    cookbooks, documentation, and other assets.
  - Be an EMEA ambassador for Claude in the lab - you’ll both
    inspire and build trust with scientific audiences, from
    small settings to large conferences.
  - This role will require significant travel

  You Might Be a Good Fit If You Have

  - Hands-on experience connecting software to lab robots and
    instruments (liquid handlers, plate readers, scheduling
    software, LIMS), ideally in an automated lab.
  - Strong engineering skills: you can take an LLM-powered tool
    from prototype to production code, and write evals to
    measure its performance.
  - A scientist's instinct for how experiments work: you can
    spot what's worth automating, and where AI might fail or
    be unsafe in the physical world.
  - Experience working directly with external customers or
    partners in a technical role.
  - Clear written and verbal communication: you’ll write docs
    other labs can use without you and give talks that inspire
    and earn researchers' trust.
  - A scrappy mentality–comfortable wearing multiple hats,
    building from scratch, driving clarity in ambiguous
    situations, and doing whatever it takes to further the
    mission.

  The annual compensation range for this role is listed below.

