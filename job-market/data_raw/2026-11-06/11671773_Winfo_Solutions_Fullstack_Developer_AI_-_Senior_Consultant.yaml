  Senior Full Stack Developer – AIJob Summary

  We are looking for a Senior Full Stack Developer – AI with
  strong experience in building modern web applications and
  integrating AI/GenAI capabilities into enterprise solutions.
  The candidate will work across frontend, backend, cloud,
  databases, and AI technologies.

  Key Responsibilities

  - Design, develop, and maintain scalable Full Stack
    applications.
  - Build responsive user interfaces using React.js / Angular.
  - Develop backend services and REST APIs using Python, Java,
    or .NET.
  - Integrate AI/ML and Generative AI capabilities into
    applications.
  - Work with LLMs, RAG, AI Agents, Prompt Engineering, and AI
    APIs.
  - Develop and integrate APIs, microservices, and third-party
    services.
  - Work with SQL and NoSQL databases and design efficient data
    models.
  - Deploy and manage applications on Azure, AWS, or GCP.
  - Collaborate with Solution Architects, Data Engineers, AI
    Engineers, and product teams.
  - Perform code reviews, troubleshooting, performance
    optimization, and production support.
  - Follow best practices for security, scalability, testing,
    and CI/CD.

  Required Skills

  - 6+ years of experience in Full Stack development.
  - Strong experience with React.js / Angular and Python / Java
    / .NET.
  - Strong knowledge of REST APIs, Microservices, and Cloud.
  - Hands-on experience with Generative AI, LLMs, RAG, and AI
    integrations.
  - Experience with OpenAI / Azure OpenAI or similar LLM
    platforms.
  - Good knowledge of SQL/NoSQL databases.
  - Experience with Docker, Kubernetes, Git, and CI/CD.
  - Strong problem-solving and communication skills.

  Good to Have

  - Experience building AI-powered enterprise applications.
  - Knowledge of LangChain, LlamaIndex, vector databases, and AI
    Agents.
  - Experience with Azure/AWS/GCP AI services.
  - Knowledge of data engineering and analytics platforms.
