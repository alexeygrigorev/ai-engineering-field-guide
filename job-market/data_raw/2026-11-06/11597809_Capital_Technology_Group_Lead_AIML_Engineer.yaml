description: |
  Capital Technology Group provides expert consulting services
  software development, digital transformation, human-centered
  design, data analytics and visualization, and cybersecurity.

  Our multidisciplinary teams use agile methodologies to
  rapidly and incrementally deliver value in close
  collaboration with our clients. For over a decade, we have
  been trusted by both federal and commercial clients to solve
  complex, mission-critical business challenges. The quality
  of our work has been recognized by our partners and peers
  through our inclusion in the Digital Services Coalition, a
  group of forward- thinking firms recognized for excellence
  in delivering IT services.

  Client Requirements: applicants MUST BE US Citizens and be
  able to obtain Public Trust clearance

  The CTG Experience

  At Capital Technology Group (CTG), our teams are passionate
  about modernizing how the federal government delivers
  software. We partner with federal agencies to build secure,
  scalable, and mission-driven solutions that make a
  meaningful impact on millions of people. Recognized by The
  Washington Post as a Top Workplace in 2025 and 2026. CTG
  fosters a culture rooted in our core values. Our values
  guide how we work together and support one another, creating
  an environment where employees feel trusted, empowered, and
  encouraged to grow both personally and professionally.

  About the Role

  CTG is seeking a Lead AI/ML Engineer to lead the design,
  evaluation, and implementation of cutting-edge artificial
  intelligence and machine learning solutions supporting high-
  impact federal initiatives. This role is ideal for a senior
  technical leader who thrives at the intersection of AI,
  cloud engineering, and innovation, helping drive enterprise
  adoption of emerging technologies while mentoring
  engineering teams and partnering directly with federal
  clients.

  You Will Get To

  - Lead technical evaluations of emerging AI/ML technologies
    through prototypes, proof of concepts, and
    experimentation.
  - Analyze and communicate the benefits, tradeoffs, and
    implementation risks of new technologies to technical and
    business stakeholders.
  - Design, develop, and deploy production-ready AI/ML
    applications within AWS cloud environments.
  - Support AI/ML application development across development,
    operations, and security disciplines in cloud-native
    environments.
  - Drive enterprise adoption of modern AI technologies and
    engineering best practices.
  - Build, train, evaluate, and optimize machine learning models
    for production use cases.
  - Collaborate directly with clients and cross-functional
    engineering teams to deliver mission-critical solutions.
  - Provide technical leadership by mentoring engineers and
    supporting the professional growth of junior team members.
  - Present technical findings, experiment results, and
    architectural recommendations to internal leadership and
    federal customers.

  Who You Are

  - A technical leader who enjoys solving complex engineering
    and machine learning challenges.
  - Passionate about applying AI to solve meaningful, real-world
    problems within the federal government.
  - Comfortable leading technical discussions with engineers,
    architects, and executive stakeholders.
  - Curious about emerging AI technologies and excited to
    evaluate new tools and platforms.
  - A collaborative mentor who enjoys helping teams grow while
    driving technical excellence.
  - An excellent communicator capable of translating complex
    technical concepts into actionable recommendations.

  Qualifications

  - Bachelor's degree in Computer Science, Data Science,
    Engineering, Mathematics, Information Systems, or a
    related technical field (or equivalent experience).
  - 7–10 years of professional experience in software
    engineering or cloud engineering experience.
  - At least 3 years of experience deploying production
    enterprise applications in AWS.
  - At least 2 years of experience deploying production AI/ML
    applications in enterprise environments.
  - Strong proficiency in Python.
  - Experience with machine learning frameworks such as
    TensorFlow or PyTorch.
  - Experience with AI/ML platforms and services including
    Amazon Bedrock, SageMaker, Hugging Face, Weights & Biases,
    or similar technologies.
  - Strong data analysis and manipulation experience using
    pandas.
  - Experience visualizing and presenting experiment results
    using tools such as matplotlib.
  - Experience working within AWS cloud environments.
  - Ability to quickly learn new technologies and contribute
    across multiple projects.
  - Strong analytical, communication, and problem-solving
    skills.
  - Comfortable presenting technical solutions to clients and
    executive stakeholders.

  Nice to Have

  - Experience leading or managing engineering teams.
  - Experience mentoring software engineers or machine learning
    engineers.
  - Experience with Large Language Models (LLMs), Generative AI,
    Retrieval-Augmented Generation (RAG), or AI agents.
  - Experience deploying AI solutions using MLOps best
    practices.
  - Experience with containerization technologies such as Docker
    and Kubernetes.
  - Experience building CI/CD pipelines for AI/ML workloads.
  - Familiarity with DevSecOps and secure software development
    practices.
  - Experience supporting federal, highly regulated, or mission-
    critical environments.

  Client Requirements

  - Applicants must be U.S. Citizens.
  - Ability to obtain a Public Trust clearance.

  Salary

  We are committed to offering a competitive salary for this
  position, with an estimated range of $180,000 to $230,000
  annually. Please note that this range is intended to provide
  a general idea of what to expect. The final offer may vary
  based on experience, skills, and other factors.

  Full Time Employee Benefits

  - Remote Work (Hybrid roles will be specified in the job post)
  - Competitive Compensation Package
  - Medical, Dental, and Vision
  - Life Insurance, Short/Long Term Disability
  - Employee Assistance Program
  - 401(k) with 4% matching
  - Liberal PTO vacation policy
  - Generous Annual Continuing Education
  - Annual Wellness Budget
  - Bonus Incentive Programs (Employee referrals and
    performance-based rewards)

  Thanks for your interest in Capital Technology Group!

  Capital Technology Group is an equal opportunity employer
  and all qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  national origin, disability status, protected veteran
  status, or any other characteristic protected by law.
