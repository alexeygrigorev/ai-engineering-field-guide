description: |
  About Fello:

  Fello is a profitable, hyper-growth, VC-backed B2B SaaS
  company building the agentic real estate platform of the
  future.

  Our platform combines data intelligence, marketing
  automation, and conversational AI to help real estate teams
  engage smarter and scale faster. At the center of it is
  Felix, our AI teammate, which takes real work off a team's
  plate — running follow-up across calls, texts, and emails
  today, with more of the team's day-to-day work coming next.

  We're not another tool in the stack. We're the system that
  powers it — learning, adapting, and executing in real time
  so teams can focus on growth, not guesswork.

  If you're excited about building an AI product that's
  changing how an entire industry works, you'll fit right in.
  Location: This job is open to all applicants based in India.

  About You:

  You’re a software engineer first. You spent years building
  and scaling backend systems before LLMs made it easy:
  distributed services, databases, cloud infrastructure, the
  stuff that has to stay up when traffic spikes. You’ve since
  gone deep on AI: agents, tool use, structured outputs,
  retrieval, memory. You know where a schema, a rule, or a
  small model beats a prompt, and you don’t ship coding-agent
  output you can’t explain.

  You’re opinionated about structure. When the team wants to
  ship a new definition of a field that already exists, you’re
  the one who says “no, we use the canonical one, here’s why.”
  You’re comfortable being the person who slows things down
  for the right reasons, and you explain your reasoning well
  enough that people start thinking that way themselves.

  You lead by building. You set technical direction across
  multiple teams while staying hands-on in the code, and you’d
  rather level up the engineers around you than move into pure
  management. You’re happy juggling several products at once
  without a roadmap handed to you, and you give and take blunt
  technical feedback without it becoming a thing.

  You Will:

  - Design, build, and maintain backend services and APIs using
    Node.js
  - Architect and optimize databases for efficient read and
    write performance
  - Implement and improve CI/CD pipelines that support fast and
    safe deployments
  - Own technical leadership across multiple teams, guiding
    engineers from architecture to shipped product.
  - Own performance, reliability, and security of the systems
    you build
  - Contribute to technical decisions, code reviews, and
    engineering best practices
  - Help us scale from early stage to a mature, high-traffic
    platform
  - Own the complete system architecture and design end-to-end
    solutions across the stack.

  You Have:

  - 7+ years of software engineering, mostly pre-LLM era. You've
    built systems from the ground up, not just wired existing
    ones together.
  - System Architecture & Design: Lead the architectural vision
    for our backend services. Design highly available, fault-
    tolerant, and scalable distributed systems on AWS to
    support rapidly growing user bases and data volumes.
  - Backend Development: Write clean, highly performant, and
    secure enterprise-grade code in TypeScript and Node.js.
    Champion engineering best practices, including rigorous
    code reviews, automated testing, and comprehensive
    documentation.
  - Technical Leadership & Mentorship: Act as a technical
    multiplier. Mentor Senior and Mid-level engineers,
    providing guidance on complex technical challenges, system
    design, and career development.
  - Cloud Infrastructure: Architect and manage cloud-native
    solutions using a wide array of AWS services (e.g.,
    Lambda, ECS/EKS, API Gateway, SQS/SNS, DynamoDB, RDS).
  - Operational Excellence: Drive initiatives around system
    observability, monitoring, and alerting (e.g., Datadog,
    CloudWatch). Ensure systems meet strict SLAs for uptime
    and latency. Establish and refine CI/CD pipelines for
    seamless deployment.
  - Cross-Functional Collaboration: Partner directly with
    Product Managers, Frontend Engineering, and Data teams to
    define technical roadmaps, balance technical debt with
    feature delivery, and translate business requirements into
    technical execution.
  - Hands-on production experience with modern LLMs (Anthropic,
    OpenAI, open models): agents, copilots, or workflows you
    shipped and maintained.
  - Experience shipping products in a startup environment,
    especially from 0 to 1
  - Appreciation for clean, modular architecture
  - A strong sense of ownership, proactiveness and the ability
    to deliver high-quality systems
  - Nice to have: Full-stack experience, with a strong backend
    focus and enough frontend chops to ship complete features
    on your own.

  Our Benefits:

  - Competitive Compensation: Attractive salary and benefits
    package.
  - Flexible Work Environment: Fully remote work with flexible
    hours to promote work-life balance.
  - Professional Growth: Opportunities for career advancement
    and professional development.
  - Health & Wellness: Comprehensive health and vision insurance
    plans.
  - Paid Time Off: Generous PTO and paid holidays to recharge
    and relax.
  - Collaborative Culture: A supportive team environment that
    values innovation and collaboration.
  - Equity Options: Opportunity to own a part of Fello and share
    in our success.
  - Cutting-Edge Projects: Work on innovative products that
    leverage AI and advanced technologies.
