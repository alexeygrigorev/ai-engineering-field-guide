description: |
  Snap Inc is a technology company. We believe the camera
  presents the greatest opportunity to improve the way people
  live and communicate. Snap contributes to human progress by
  empowering people to express themselves, live in the moment,
  learn about the world, and have fun together.

  The Company operates Snapchat, a visual messaging app that
  enhances your relationships with friends, family, and the
  world, and Specs Inc., a wholly-owned subsidiary dedicated
  to making computing more human, in addition to Bitmoji,
  Saturn, and other digital services.

  Snap Engineering teams build fun and technically
  sophisticated products that reach hundreds of millions of
  Snapchatters around the world, every day. We’re deeply
  committed to the well-being of everyone in our global
  community, which is why our values are at the root of
  everything we do. We move fast, with precision, and always
  execute with privacy at the forefront.

  We're looking for a Machine Learning Engineer to join the
  Consumer Gen AI Product MLE team at Snap!

  What you’ll do:

  - Develop ML-products and AI Lenses that serve millions of
    Snapchatters on a daily basis, with a primary focus on
    image and video generation and editing, as well as LLMs
  - Build cutting-edge augmented reality experiences with
    diffusion/flow matching models
  - Work on state of the art GenAI pipelines for image and video
    generation. Ship well-scoped consumer-facing features
    within weeks, with guidance on broader architecture and
    launch decisions
  - Extensively collaborate with Product, Software Engineering,
    Lens Content and Data Science teams to prototype new
    ideas, integrate ML models and APIs into production, and
    refine them through A/B testing and user feedback
  - Actively monitor the market and research landscape for new
    developments in Gen AI, run focused evaluations of open-
    source models and third-party AI APIs/services and share
    findings to support the team’s build-vs-buy decisions
  - Evaluate open-source Gen AI models and APIs

  Knowledge, Skills & Abilities:

  - A proven passion for machine learning; you stay up-to-date
    with research and are excited about prototyping new ideas
    quickly
  - Knowledge of mathematics and deep learning foundations
  - Excellent verbal and written communication skills, with
    meticulous attention to detail
  - Ability to work independently on well-defined technical
    problems and seek guidance when needed
  - Ability to contribute to large, complex technical
    initiatives by owning well-scoped features or components

  Minimum Qualifications:

  - Strong foundations in Machine Learning, demonstrated through
    hands-on projects, research, internships, or professional
    work
  - Strong programming skills in Python or C++
  - Bachelor’s Degree in a technical field such as computer
    science, mathematics, statistics or equivalent years of
    engineering experience in one or more of the following:
    neural rendering, generative models, segmentation, object
    detection, classification, tracking, or other related
    applications of deep learning or computer vision
  - At least 3 years of machine learning experience after
    completing a bachelor’s degree, or a master’s degree in a
    relevant technical field

  Preferred Qualifications:

  - Knowledge of computer graphics foundations
  - Experience with visual Gen AI models for Image and Video
    generation and Editing
  - Familiarity with evaluating the visual quality of Image and
    Video models
  - Hands-on experience with GenAI projects, such as working
    prototypes, research projects, or open-source
    contributions
  - Ability to proactively learn new concepts and apply them at
    work

  If you have a disability or special need that requires
  accommodation, please don’t be shy and provide us some
  information.

