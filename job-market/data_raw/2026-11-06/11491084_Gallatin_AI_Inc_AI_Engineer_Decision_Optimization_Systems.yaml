title: "AI Engineer – Decision & Optimization Systems"
company: Gallatin AI, Inc.
location: El Segundo, USA
work_type: FULL_TIME
description: |
  About Gallatin

  At Gallatin, we are rebuilding logistics infrastructure for
  the national security missions of the United States and
  allied partners. We build AI systems that determine how
  logistics decisions are made — not just how they're
  executed. From factory to foxhole, we operate at the layer
  where data becomes decisions, and decisions make the
  advantage.

  About the Role

  We’re looking for an AI Engineer – Decision & Optimization
  Systems to own the feasibility, authority, and constraint
  layers that sit between AI reasoning and real-world
  execution.

  In this role, you will build the systems that decide what
  plans are allowed to exist before any optimizer, agent, or
  human can act on them. Your work ensures that AI-generated
  logistics plans respect command hierarchy, policy, safety,
  and operational reality—so when we execute, we execute
  correctly.

  You'll partner closely with routing, packing, optimization,
  and AI-agent teams to turn intent, authority, and
  uncertainty into decision systems that are auditable,
  enforceable, and explainable.

  What You’ll DoBuild & Own Feasibility and Authority Models

  - Design and implement models that encode command hierarchy,
    authority limits, and policy rules into formal feasibility
    checks.
  - Convert outputs from AI agents (LLMs, planners,
    probabilistic models) into deterministic, enforceable
    constraints before execution.
  - Ensure authority and policy interpretations are traceable,
    inspectable, and safe.

  Constraint & Feasibility Frameworks

  - Build and maintain a centralized constraint framework used
    across plaaning and optimization systems.
  - Encode:
    - Authority rules
    - Timing Windows
    - Compatibility constraints
    - Asset availability and readiness
  - Surface clear diagnostics for infeasible plans and
    constraint violations so both humans and machines can
    understand what failed and why.

  Data Ownership & Validation

  - Own the data inputs needed for feasibility and constraint
    enforcement.
  - Define and enforce data contracts, normalization, and
    validation pipelines.
  - Build robustness against incomplete, delayed, or noisy
    operational data.

  Production Integration

  - Integrate feasibility checks into real-time and batch
    planning pipelines.
  - Partner with optimization and execution teams to gate every
    action on valid, policy-compliant inputs.
  - Validate system behavior through scenario testing,
    simulations, and operational feedback from real users.

  What We’re Looking ForStrong Engineering & Modeling Skills

  - Proficiency in at least one of: Python, Java, Go, or C++
  - Experience building constraint-based or rule-based systems
    in production.
  - Experience integrating AI or agent-based reasoning into
    downstream decision or execution pipelines.

  Optimization & Decision Science Background

  - Degree or equivalent experience in Operations Research,
    Applied Math, Industrial Engineering, Computer Science, or
    related field.
  - Strong understanding of: Linear programming, Mixed-integer
    programming, Constraint satisfaction systems.
  - Experience using tools such as Gurobi, CPLEX, OR-Tools,
    Pyomo, AMPL, or equivalent.

  Systems Thinking

  - Ability to reason about feasibility vs optimality tradeoffs.
  - Comfort integrating probabilistic or AI-derived outputs into
    deterministic systems.
  - Strong instincts for debugging, failure analysis, and
    explainability in high-stakes environments.

  Bonus Points

  - Experience with logistics, supply chain, or routing systems.
  - Experience working alongside optimization or planning teams.
  - Exposure to defense, government, or mission-critical
    operations.
  - Prior work integrating AI agents into decision or execution
    pipelines.

  Mission and Identity

  We are building the system that enables faster, smarter
  logistics decisions in contested environments, and we're
  doing it with a team of seasoned entrepreneurs, operators,
  and technologists who have built and scaled solutions in
  this space before. We hold ourselves to an extremely high
  standard. We value clear thinking, direct communication, and
  the kind of ownership that doesn't stop until something
  actually works.

  Our mission is to create decision advantage when the stakes
  are the highest. If we succeed, the system doesn't just run;
  it gets smarter. We're not building AI for its own sake.
  We're building it because faster, smarter decisions in the
  most demanding environments on earth can't wait. If you want
  to work somewhere the stakes are real and the mission is
  urgent — you'll fit in here.

  Why Gallatin?

  The logistics infrastructure that supports America's
  warfighters and humanitarian disaster responders is overdue
  for transformation, and we are building it. From defense
  operations to disaster response, we're solving the hardest
  problems that keep missions moving when it matters most.
  Join a team where the mission is the point. Compensation:
  Gallatin offers competitive compensation commensurate with
  experience. Actual compensation may vary based on
  experience, skills, and location. In addition to base
  salary, we offer a generous equity grant, full healthcare
  coverage, 401k, unlimited PTO, and the perks of working in a
  high-caliber, mission-driven environment.

  Gallatin is an equal opportunity employer. We do not
  discriminate on the basis of race, color, religion, sex,
  national origin, age, disability, veteran status, sexual
  orientation, gender identity, or any other characteristic
  protected by applicable federal, state, or local law.

  This position may require the ability to obtain and maintain
  a U.S. government security clearance. The successful
  candidate must be able to work in a classified environment
  when necessary.

  We comply with the United States Department of Labor's Pay
  Transparency provision.

  Note: Due to the nature of certain government contracts held
  by this organization, U.S. citizenship is a requirement for
  all positions at Gallatin. Proof of citizenship will be
  required prior to employment if selected.
