description: |
  About us

  Founded in 2021, Axion is at the forefront of transforming
  product quality and customer satisfaction in manufacturing.
  Our cutting-edge AI-powered platform empowers manufacturers
  to swiftly identify, thoroughly investigate, and effectively
  resolve quality issues while simultaneously elevating
  customer experiences and outcomes.

  As trailblazers in end-to-end quality intelligence, we're
  setting new industry standards. Our innovative approach
  enables industrial, aerospace, consumer, and medtech
  manufacturers to harness the power of quality and post-
  market data, driving down costs and boosting business
  performance.

  Our vision extends beyond mere problem-solving; we're
  committed to reshaping the future of manufacturing. By
  seamlessly integrating advanced AI technology with deep
  industry expertise, Axion is paving the way for smarter,
  safer, and more efficient production processes across
  diverse sectors.

  Backed by leading investors, including Bessemer Venture
  Partners and Salesforce Ventures, Axion is poised to lead
  the quality revolution in manufacturing.

  About the role

  We’re hiring for a Senior or Staff Software Engineer to help
  lead our agile, fast-moving backend teams. In this role,
  you’ll design and build scalable agentic systems, backend
  services and data-processing workflows that transform
  complex, unstructured customer data into reliable,
  structured outputs. . You’ll help shape the architecture of
  our APIs, databases, cloud infrastructure, and LLM-powered
  and agentic systems while improving their reliability,
  observability, and performance. Working closely with
  engineering, product, and customer-facing teams, you’ll
  translate ambiguous business needs into clear technical
  direction and lead foundational decisions that scale with
  the company. This is a high-impact opportunity to shape the
  company’s technical strategy and make foundational decisions
  that will scale with us

  Responsibilities

  - Architect and operate multi-step, tool-using agentic
    pipelines that convert unstructured data into reliable
    structured output
  - Build evaluation frameworks, golden datasets, and feedback
    loops that measure quality and catch regressions
  - Improve model performance through prompt and pipeline
    optimization, model selection, and fine-tuning where it
    pays off
  - Own the reliability of cloud-native services: deployment,
    observability, scalability, and on-call support
  - Mentor engineers and lead cross-team technical initiatives
    from design through production

  What you'll bring

  - 5+ years building and operating production backend or data-
    intensive systems
  - Production experience with LLM systems, including multi-
    step, tool-using, or agentic workflows
  - Experience measuring and improving model quality, through
    evals, prompting, fine-tuning, or a mix
  - Experience designing distributed systems, asynchronous
    workflows, and reliable data-processing services
  - Working knowledge of data warehousing, ideally applied to
    versioned datasets, lineage, or feedback capture
  - Experience running containerized applications on a major
    cloud platform ([AWS/GCP/Azure])

  Bonus points

  - Fine-tuning or distillation experience (SFT, LoRA, or
    provider tuning APIs)
  - Experience with LLM observability and cost/latency
    optimization

  Our values

  - Collaborate deeply. Feedback is part of how we build —
    everyone has a voice, and ideas win on merit.
  - Leave ego at the door. Titles don’t define value;
    contribution does.
  - Bias toward action. We iterate fast and favor progress over
    perfection.
  - Communicate with clarity. Direct, transparent, and always in
    service of the mission.
  - Act like owners. Everyone is accountable for outcomes, not
    just tasks.
  - Sustain excellence. We push hard but don’t glorify burnout —
    we’re in this for the long game.

  What we offer

  - Full Medical, Dental & Vision coverage for all single
    employees + Axion covers an additional 70% of the excess
    for dependents. Medical Carriers: Aetna & Kaiser
  - HSA - Eligible Plan with monthly Axion contribution
  - Unlimited PTO, and we really mean it! Take time off whenever
    you need to rest, travel, or recharge. We want everyone to
    unplug and return refreshed.
  - 401(k) Retirement Plan
  - More Perks & Benefits included

  Ready to drive the future of manufacturing with AI? Apply
  today to join our team and help us build the category-
  defining platform for quality intelligence.

  Axion is an Equal Opportunity / Affirmative Action employer
  committed to diversity in the workplace. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  age, national origin, disability, protected veteran status,
  gender identity, or any other factor protected by applicable
  federal, state, or local laws.
