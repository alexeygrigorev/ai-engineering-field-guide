description: |
  Join the Team Modernizing Medicine

  At ModMed, we’re not just building software—we’re
  reimagining the healthcare experience. Founded in 2010 by a
  practicing physician and a successful tech entrepreneur, we
  took a radically different approach: we hired doctors and
  taught them how to code. This "for doctors, by doctors"
  philosophy has allowed us to create an AI-enabled,
  specialty-specific cloud platform that places patients at
  the center of care.

  A Culture of Excellence

  When you join ModMed, you’re joining an award-winning team
  recognized for innovation and employee satisfaction.   From
  our global headquarters in Boca Raton Florida, and extensive
  employee base in Hyderabad India, we are a team of 4,500+
  passionate problem-solvers on a mission to increase medical
  practice success and improve patient outcomes:

  - Consistently ranked as a Top Place to Work
  - 2025 Globee Business Awards: Gold Globee for “Technology
    Team of the Year”
  - 2025 Black Book Awards: Ranked #1 EHR in 11 Specialties
  - Florida Venture Forum: Venture-Backed Company of the Year

  We are growing fast, thinking big, and we are just getting
  started.

  Ready to modernize medicine with us?

  Job Description Summary:

  Why ModMed?

  At ModMed, we are on a mission to place doctors and patients
  at the center of care through an intelligent, specialty-
  specific cloud platform. We envision a world where our
  software increases medical-practice success and improves
  patient outcomes.

  We don't just build code; we innovate boldly to save time
  for healthcare providers so they can focus on what matters
  most. If you want to align your passion with purpose and use
  AI to do good in the world, you belong here.

  The Opportunity

  We are looking for a Staff AI Engineer who dreams big,
  thinks strategically, and builds hands-on. In this role, you
  will help define and architect the next generation of AI
  capabilities at ModMed—from Generative AI and LLM
  applications to Agentic AI, RAG, and intelligent automation.

  You will operate as a technical leader and hands-on
  engineer, solving complex problems, establishing scalable AI
  patterns, and taking AI capabilities from concept to
  reliable production systems. You will work closely with
  Product, Engineering, Data Science, and healthcare domain
  experts to turn emerging AI technologies into meaningful
  customer outcomes.

  How You’ll Make an Impact

  - Architect AI Innovation: Design and build scalable,
    production-grade LLM, Generative AI, and Agentic AI
    solutions that solve complex healthcare and medical-
    practice workflows.
  - Build AI Systems End-to-End: Lead the architecture and
    implementation of RAG pipelines, AI agents, orchestration,
    tool calling, document intelligence, and intelligent
    automation from prototype through production.
  - Engineer for Reliability: Establish robust approaches for
    LLM evaluation, grounding, guardrails, observability,
    security, latency, and cost optimization to ensure AI
    systems are reliable and production-ready.
  - Solve Complex Problems: Apply advanced prompt engineering,
    model selection, fine-tuning, retrieval strategies, and ML
    techniques to address specialty-specific healthcare
    challenges.
  - Drive Technical Excellence: Define reusable AI engineering
    patterns, architecture standards, and best practices that
    can be adopted across ModMed's AI initiatives.
  - Lead Without Authority: Partner with Product, Engineering,
    Data Science, and domain experts to influence technical
    direction, make architecture decisions, and drive
    successful delivery of high-impact AI initiatives.
  - Mentor & Multiply: Mentor senior and junior engineers,
    conduct technical design reviews, and raise the
    engineering and AI maturity of the broader organization.
  - Innovate Responsibly: Help ensure AI solutions are secure,
    explainable, governable, and appropriate for healthcare,
    with strong attention to privacy, compliance, and
    responsible AI practices.

  What You Bring to the TeamThe Essentials:

  - Experience: 8+ years of experience in AI/ML, Machine
    Learning, Data Science, or Software Engineering, with
    significant hands-on experience building production AI
    systems.
  - Generative AI Expertise: Deep hands-on experience with LLMs,
    Generative AI, RAG, prompt engineering, embeddings, vector
    search, and AI agents.
  - Technical Mastery: Strong proficiency in Python and
    experience with modern AI/ML frameworks such as PyTorch,
    Hugging Face, LangChain, LangGraph, LlamaIndex, or
    equivalent technologies.
  - AI Architecture: Proven ability to design scalable, reliable
    AI/ML architectures and translate ambiguous business
    problems into production-ready technical solutions.
  - Production Engineering: Strong software engineering
    fundamentals, including APIs, distributed systems,
    testing, CI/CD, observability, and production operations.
  - Cloud & ML Platforms: Experience deploying AI/ML solutions
    at scale using AWS or equivalent cloud platforms, with
    experience in platforms such as Databricks, MLflow,
    SageMaker, or similar technologies.
  - AI Evaluation & Quality: Strong understanding of LLM
    evaluation, hallucination mitigation, grounding, model
    quality, and AI observability.
  - Technical Leadership: Demonstrated ability to influence
    architecture and technical direction, mentor engineers,
    and lead complex initiatives without necessarily having
    direct people-management responsibility.

  Bonus Points:

  - Experience building multi-agent / Agentic AI systems with
    orchestration, planning, memory, and tool use.
  - Experience with document intelligence, OCR, document
    classification, information extraction, and multimodal AI.
  - Experience working with healthcare AI, clinical workflows,
    medical data, RCM, billing, or claims.
  - Familiarity with healthcare standards such as FHIR, HL7,
    X12/EDI, or similar healthcare data formats.
  - Experience with HIPAA, healthcare data privacy, AI security,
    and responsible AI.
  - Experience working with foundation models such as OpenAI,
    Anthropic, Llama, Mistral, or equivalent.
  - Experience optimizing LLM inference cost, latency,
    scalability, and reliability.

  Our Culture & Values

  We believe in Thinking Big and Having Fun. At ModMed, you'll
  find a team that is high-performing but humble. We move fast
  to make things happen, but we never lose sight of our goal:
  to save time for doctors and improve the lives of patients.

  As a Staff AI Engineer, you'll have the opportunity to shape
  not just individual AI solutions, but how ModMed builds and
  scales AI across the organization.

  We align passion with purpose. Come help us build the future
  of healthcare.

  ModMed Benefits Highlight:  At ModMed, we believe it’s
  important to offer a competitive benefits package designed
  to meet the diverse needs of our growing workforce. Eligible
  Modernizers can enroll in a wide range of benefits:

  - Meals & Snacks: Enjoy complimentary office lunches & dinners
    on select days and healthy snacks delivered to your desk,
  - Insurance Coverage: Comprehensive health, accidental, and
    life insurance plans, including coverage for family
    members, all at no cost to employees,
  - Allowances: Annual wellness allowance to support your well-
    being and productivity,
  - Earned, casual, and sick leaves to maintain a healthy work-
    life balance,
  - Bereavement leave for difficult times and extended medical
    leave options,
  - Paid parental leaves, including maternity, paternity,
    adoption, surrogacy, and abortion leave,
  - Celebration leave to make your special day even more
    memorable, and company-paid holidays to recharge and
    unwind.

  PHISHING SCAM WARNING: ModMed is among several companies
  recently made aware of a phishing scam involving imposters
  posing as hiring managers recruiting via email, text and
  social media. The imposters are creating misleading email
  accounts, conducting remote "interviews," and making fake
  job offers in order to collect personal and financial
  information from unsuspecting individuals. Please be aware
  that no job offers will be made from ModMed without a formal
  interview process, and valid communications from our hiring
  team will come from our employees with a ModMed email
  address (first.lastname@modmed.com). Please check senders’
  email addresses carefully.  Additionally, ModMed will not
  ask you to purchase equipment or supplies as part of your
  onboarding process. If you are receiving communications as
  described above, please report them to the FTC website.

  ModMed Technologies India Private Limited follows a strict,
  merit-based and transparent recruitment process conducted
  only through official and authorized channels. We do not:

  - Charge any fees, processing charges, or amount by any
    nomenclature, whether as a fee or deposit at any stage of
    the recruitment process;
  - Authorise any individual, employee, or third party to
    collect any such payments (regardless of nomenclature) to
    offer or facilitate or recruitment opportunities; or
  - Conduct hiring via informal messaging apps or personal email
    IDs.

  All official communication is made only through verified
  channels, our website, and recognised recruitment platforms.
  We strongly advise candidates not to share
  personal/financial information or make any payments in
  response to suspicious communications. Any such instances
  may be reported to us at hrcompliance@modmed.com . ModMed
  Technologies India Private Limited will not be responsible
  for any loss arising from fraudulent or unauthorised
  communications.
