description: |
  Company Description NBCUniversal is one of the world's
  leading media and entertainment companies. We create world-
  class content, which we distribute across our portfolio of
  film, television, and streaming, and bring to life through
  our global theme park destinations, consumer products, and
  experiences. We own and operate leading entertainment and
  news brands, including NBC, NBC News, NBC Sports, Telemundo,
  NBC Local Stations, Bravo, and Peacock, our premium ad-
  supported streaming service. We produce and distribute
  premier filmed entertainment and programming through our
  powerhouse film and television studios, including Universal
  Pictures, DreamWorks Animation, and Focus Features, and the
  four global television studios under the Universal Studio
  Group banner, and operate industry-leading theme parks and
  experiences around the world through Universal Destinations
  & Experiences, including Universal Orlando Resort, home to
  Universal Epic Universe, and Universal Studios Hollywood.
  NBCUniversal is a subsidiary of Comcast Corporation. Visit
  www.nbcuniversal.com for more information. Our impact is
  rooted in improving the communities where our employees,
  customers, and audiences live and work. We have a rich
  tradition of giving back and ensuring our employees have the
  opportunity to serve their communities. We champion an
  inclusive culture and strive to attract and develop a
  talented workforce to create and deliver a wide range of
  content reflecting our world. Job Description NBCUniversal
  is building the foundation for responsible, scalable AI
  across one of the world's most recognized media and
  entertainment portfolios. As a Senior AI Governance
  Engineer, you'll help define how AI products are governed,
  secured, monitored, and operationalized across sports, news,
  entertainment, film, and digital businesses.

  - Design and maintain semantic models in Snowflake and
    Databricks to ensure AI systems operate using trusted
    business definitions.
  - Partner with data owners and engineering teams to define
    governed metrics, entities, lineage, and access patterns.
  - Build CI/CD pipelines and Infrastructure-as-Code solutions
    supporting AI applications, agents, semantic models, and
    ML workloads.
  - Enable repeatable deployment patterns across development,
    staging, and production environments.
  - Create monitoring frameworks for latency, quality,
    reliability, model usage, and AI operational health.
  - Define standards for auditability, compliance, and
    responsible AI adoption.
  - Optimize AI infrastructure utilization and manage cloud
    consumption across Snowflake, Databricks, and supporting
    services.
  - Develop visibility into model, agent, and inference costs to
    support sustainable AI growth.
  - Design governance frameworks for models, agents, tools,
    datasets, and APIs.
  - Implement RBAC, identity controls, and policy enforcement
    across AI platforms.

  Qualifications

  - Bachelor's degree in computer science in related discipline
    or equivalent
  - 5+ years of experience in Data / Cloud Platform Engineering
  - Coding Python , Advanced SQL(Snowflake) , AWS, Semantic
    modelling, Git
  - Experience with AI and Database: Snowflake(Cortex) or
    Databricks (Genie/Agent Bricks)
  - Ability to understand how AI Frameworks work: LangGraph,
    MCP, RAG
  - Terraform/IaC: infrastructure as code for cloud AI
    environments
  - Security & Identity: RBAC, IAM policies, Azure AD
  - AI Finops: Cloud cost allocation, Tagging, and Optimization
  - Docker / Kubernetes: containerization model serving and
    orchestration
  - Excellent communication and presentation skills

  Desired Characteristics:

  - 5+ years of experience in Snowflake (SnowPro Core or
    Advanced preferred)
  - 5+ years of experience in Databricks or Apache Spark
  - 3+ years of experience in MLOps / AIOps pipeline ownership
  - 3+ years of experience in CI/CD tooling: GitHub Actions,
    Terraform, dbt
  - 1+ years of experience in LLM / Generative AI platform
    integration

  Additional Requirements:  Fully Remote: This position has
  been designated as fully remote, meaning that the position
  is expected to contribute from a non-NBCUniversal worksite,
  most commonly an employee's residence. This position is
  eligible for company sponsored benefits, including medical,
  dental and vision insurance, 401(k), paid leave, tuition
  reimbursement, and a variety of other discounts and perks.
  Learn more about the benefits offered by NBCUniversal by
  visiting the Benefits page of the Careers website. Salary
  range: $115,000 - $145,000 We are accepting applications for
  this position on an ongoing basis. Additional Information As
  part of our selection process, external candidates may be
