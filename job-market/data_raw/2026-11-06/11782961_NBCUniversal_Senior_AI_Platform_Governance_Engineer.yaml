  unable or limited in your ability to use or access
  nbcunicareers.com as a result of your disability. You can
  request reasonable accommodations by emailing
  AccessibilitySupport@nbcuni.com. For LA County and City
  Residents Only: NBCUniversal will consider for employment
  qualified applicants with criminal histories, or arrest or
