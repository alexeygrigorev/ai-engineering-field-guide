description: |
  Zensar Technologies Limited is seeking a skilled AI Engineer
  to join our innovative team. You will work end‑to‑end on
  AI‑powered solutions, from concept through production,
  leveraging our enterprise AI stack, large language models,
  and multi‑agent frameworks to deliver cutting‑edge
  applications for our clients.

  Responsibilities

  - Design, develop, and deploy AI‑powered applications using
    Zensar's enterprise AI stack.
  - Build and execute proof‑of‑concepts (POCs) with Large
    Language Models (LLMs) and modern AI orchestration tools.
  - Create intelligent agents and multi‑agent systems using
    LangGraph and agent builder platforms.
  - Implement Model Context Protocol (MCP) integrations, MCP
    Tools, and agent‑to‑agent (A2A) communication patterns.
  - Leverage vector stores, embeddings, and Retrieval‑Augmented
    Generation (RAG) architectures.
  - Manage source code through CI/CD pipelines and ensure
    observability of AI applications.
  - Contribute to and maintain the internal agent registry and
    integration standards.
  - Perform prompt engineering and fine‑tuning for GPT, Gemini,
    and other LLMs.
  - Collaborate with cross‑functional teams to align AI
    solutions with business objectives.
  - Document designs, workflows, and best practices for AI
    development.

  Qualifications

  - Hands‑on experience integrating LLMs (e.g., GPT, Gemini) and
    prompt engineering.
  - Proficiency with LangGraph and LangSmith for building AI
    workflows and agents.
  - Experience with agent builder platforms, multi‑agent
    systems, and orchestration.
  - Familiarity with Model Context Protocol (MCP), MCP Tools,
    and A2A communication.
  - Strong programming skills in Python and familiarity with
    AI/ML libraries (e.g., PyTorch, TensorFlow).
  - Knowledge of vector databases, embeddings, and RAG
    architectures.
  - Experience with CI/CD tools (e.g., Jenkins, GitHub Actions)
    and monitoring/observability solutions.
  - Bachelor’s or higher degree in Computer Science, AI, Machine
    Learning, or related field.
  - Excellent problem‑solving abilities and a collaborative
    mindset.
  - Ability to work in an agile environment and manage multiple
    priorities.

  About UsAt Zensar, we’re “experience-led everything”. We are
  committed to conceptualizing, designing, engineering,
  marketing, and managing digital solutions and experiences
  for over 130 leading enterprises. We are a company driven by
  a bold purpose: Together, we shape experiences for better
  futures. Whether for our clients, our people, or the world
  around us, this belief powers everything we do. At the heart
  of our culture is ONE with Client - a set of four core
  values that reflect who we are and how we work: One Zensar,
  Nurturing, Empowering, and Client Focus. Part of the $4.8
  billion RPG Group, we’re a community of 10,000+ innovators
  across 30+ global locations, including Milpitas, Seattle,
  Princeton, Cape Town, London, Zurich, Singapore, and Mexico
  City. Explore Life at Zensar and join us to Grow. Own.
  Achieve. Learn. to be the best version of yourself. We
  believe the best work happens when individuality is
  celebrated, growth is encouraged, and well-being is
  prioritized. We are an equal employment opportunity (EEO)
  and affirmative action employer, committed to creating an
  inclusive workplace. All qualified applicants will be
  considered without regard to race, creed, color, ancestry,
  religion, sex, national origin, citizenship, age, sexual
  orientation, gender identity, disability, marital status,
  family medical leave status, or protected veteran status.
