description: |
  Company Description

  Miratech helps visionaries change the world. We are a global
  IT services and consulting company that brings together
  enterprise and start-up innovation. Today, we support
  digital transformation for some of the world's largest
  enterprises. By partnering with both large and small
  players, we stay at the leading edge of technology, remain
  nimble even as a global leader, and create technology that
  helps our clients further enhance their business. We are a
  values-driven organization and our culture of Relentless
  Performance has enabled over 99% of Miratech's engagements
  to succeed by meeting or exceeding our scope, schedule,
  and/or budget objectives since our inception in 1989.
  Miratech has coverage across 5 continents and operates in
  over 25 countries around the world. Miratech retains nearly
  1000 full-time professionals, and our annual growth rate
  exceeds 25%.

  Job Description

  Miratech is looking for a skilled Senior AI Engineer with
  Python, LangGraph and LangChain to join our US Healthcare
  client. You will play a key role in developing and enhancing
  an enterprise AI platform that enables intelligent
  workflows, conversational experiences, and AI-powered
  automation across multiple business functions. This is an
  exciting opportunity to work with cutting-edge agentic AI
  architectures, build scalable AI solutions, and collaborate
  with a high-performing engineering team to accelerate
  innovation and business impact.

  Responsibilities

  - Develop and enhance AI agents and orchestration capabilities
    using Python, LangGraph, and LangChain.
  - Build and extend AI-enabled guided workflows and automation
    capabilities.
  - Design, develop, and optimize conversational AI and chat-
    based experiences.
  - Implement agent planning, orchestration, memory, tool-
    calling, and response-generation capabilities.
  - Integrate AI agents and applications with enterprise
    systems, services, and APIs.
  - Support modern AI integration frameworks and agent
    communication patterns.
  - Implement AI observability, monitoring, telemetry, and
    performance tracking capabilities.
  - Collaborate closely with engineering teams and stakeholders
    to accelerate platform development and business use case
    delivery.
  - Troubleshoot technical challenges, improve solution
    reliability, and drive continuous platform enhancements.
  - Contribute to architecture discussions, best practices, and
    the adoption of scalable AI engineering standards.

  Qualifications

  - 8+ years of hands-on experience in Software Engineering and
    enterprise application development.
  - 4+ years of experience in Python development.
  - 2+ years of hands-on experience with LangGraph, including
    agent workflows, stateful orchestration, multi-agent
    systems, and AI-driven execution flows.
  - 2+ years of experience with LangChain, including building
    LLM-powered applications, tool integrations, retrieval-
    augmented generation (RAG), and workflow automation.
  - Strong understanding of agentic AI concepts, including AI
    agents, planning, orchestration, memory management, and
    tool-calling frameworks.
  - Experience building and deploying production-grade
    Generative AI applications and solutions.
  - Experience integrating AI applications with enterprise
    platforms, backend services, and APIs.
  - Experience designing and implementing conversational AI and
    chat-based applications in production environments.
  - Familiarity with AI observability, monitoring, telemetry,
    and evaluation platforms.
  - Strong knowledge of software engineering best practices,
    testing, debugging, and performance optimization.
  - Experience working in Agile development environments and
    collaborating with cross-functional teams.
  - Excellent problem-solving, communication, and stakeholder
    management skills.

  Nice to Have

  - Hands-on experience with Model Context Protocol (MCP) and
    Agent-to-Agent (A2A) communication.
  - Experience building and deploying multi-agent AI solutions
    in production.
  - Experience implementing Retrieval-Augmented Generation (RAG)
    architectures and knowledge-based AI systems.
  - Experience working with vector databases and semantic search
    technologies.
  - Experience with cloud platforms such as Azure, AWS, or GCP.
  - Experience working on centralized AI platforms supporting
    multiple business functions and use cases.
  - Exposure to healthcare or other highly regulated enterprise
    environments.

  Additional Information

  We offer:

  - Culture of Relentless Performance: join an unstoppable
    technology development team with a 99% project success
    rate and more than 30% year-over-year revenue growth.
  - Competitive Pay and Benefits: enjoy a comprehensive
    compensation and benefits package, including health
    insurance, and a relocation program.
  - Work From Anywhere Culture: make the most of the flexibility
    that comes with remote work.
  - Growth Mindset: reap the benefits of a range of professional
    development opportunities, including certification
    programs, mentorship and talent investment programs,
    internal mobility and internship opportunities.
  - Global Impact: collaborate on impactful projects for top
    global clients and shape the future of industries.
  - Welcoming Multicultural Environment: be a part of a dynamic,
    global team and thrive in an inclusive and supportive work
    environment with open communication and regular team-
    building company social events.
  - Social Sustainability Values: join our sustainable business
    practices focused on five pillars, including IT education,
    community empowerment, fair operating practices,
    environmental sustainability, and gender equality.

  * Miratech is an equal opportunity employer and does not
  discriminate against any employee or applicant for
  employment on the basis of race, color, religion, sex,
  national origin, age, disability, veteran status, sexual
  orientation, gender identity, or any other protected status
  under applicable law.
