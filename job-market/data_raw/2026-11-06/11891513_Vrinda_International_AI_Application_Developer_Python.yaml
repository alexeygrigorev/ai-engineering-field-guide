description: |
  AI Application Developer – Python

  Summary

  We are seeking a highly skilled and experienced AI
  Application Developer to drive the creation and deployment
  of advanced artificial intelligence solutions within our IT
  Services division. In this pivotal role, you will leverage
  your expertise in Python and machine learning frameworks to
  build scalable, secure, and high-performance applications.
  The ideal candidate will possess a deep understanding of
  software architecture and cloud infrastructure, playing a
  critical part in integrating AI capabilities into complex
  systems, including digital twin models and manufacturing
  engineering workflows. This position offers the opportunity
  to work with cutting-edge technologies while collaborating
  within an agile environment to deliver innovative digital
  transformations.

  Responsibilities

  - Design, develop, and maintain robust AI and machine learning
    applications using Python and leading frameworks such as
    TensorFlow, PyTorch, and Scikit-learn.
  - Architect and implement secure software solutions, ensuring
    adherence to best practices in software security and
    system design.
  - Build and optimize RESTful APIs using web frameworks like
    Flask, FastAPI, or Django to facilitate seamless data
    exchange and integration.
  - Manage data processing pipelines to ensure efficient
    handling, transformation, and analysis of large datasets
    for model training and inference.
  - Collaborate with cross-functional teams using Agile
    methodologies and tools like JIRA to plan, track, and
    deliver project milestones effectively.
  - Deploy and manage applications on various cloud platforms,
    utilizing CI/CD pipelines and version control systems like
    Git for streamlined development and deployment.
  - Contribute to the development of digital twin technologies
    and support manufacturing engineering initiatives through
    advanced simulation and analytics.

  Requirements

  Requirements:

  - Bachelor's degree in Computer Science, Engineering, or a
    related field, with 6 to 9 years of professional
    experience in software development.
  - Proficiency in Python programming with a strong portfolio of
    AI/ML application development projects.
  - Hands-on experience with deep learning libraries including
    TensorFlow, PyTorch, or Scikit-learn.
  - Solid understanding of cloud computing platforms and their
    application in hosting AI workloads.
  - Demonstrated expertise in software architecture, security
    protocols, and the implementation of REST APIs.
  - Proficiency with version control systems (Git) and
    experience setting up or maintaining CI/CD pipelines.
  - Familiarity with Agile project management tools,
    specifically JIRA, and the ability to work effectively in
    a collaborative team environment.
  - Knowledge of digital twin concepts and their application in
    manufacturing or engineering sectors is highly
    advantageous.
