description: |
  Firmware Validation Engineer (Python - AI, Automation)



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  Compute at HPE helps organizations power their edge-to-cloud
  platform with proven, workload-optimized products,
  solutions, and services. Our leading supercomputing
  technologies enable customers to transform and modernize
  their IT infrastructure, solve complex problems and support
  new business opportunities with purpose-built infrastructure
  and software. Join us redefine what’s next for you.

  What you'll do:

  - Develop comprehensive test plans and automate test solutions
    for firmware products and system-level solutions across
    multiple platforms and organizations within the Global
    Business Unit.
  - Contribute as an individual contributor while actively
    driving hands-on qualification and validation of iLO
    products and solutions.
  - Collaborate with Quality Engineering (QE) teams and
    outsourced partners across all phases of the Software
    Testing Life Cycle (STLC).
  - Build and strengthen partnerships with internal and
    outsourced development teams to support software design,
    validation, and quality initiatives.
  - Provide domain expertise and technical leadership to cross-
    functional projects, programs, and organizational
    initiatives.
  - Drive innovation through the adoption and integration of
    emerging technologies, tools, and methodologies within
    software validation and engineering activities.

  You will join a world-class engineering team focused on
  qualifying and testing HPE's next-generation infrastructure
  and lifecycle management solutions. Our team is passionate
  about delivering exceptional customer value through strong
  collaboration, innovation, and a commitment to getting it
  right the first time.

  What you need to bring:

  Education and Experience

  - Bachelor's or Master's degree in Computer Science,
    Information Systems, Electronics, or a related field.
  - Typically, 5+ years of experience.

  Required Knowledge and Skills

  - Strong BIOS/UEFI, firmware, and server platform validation
    knowledge.
  - Good understanding of CPU, Memory, Security, RAS, and
    platform management features.
  - Experience in end-to-end test planning, execution, defect
    analysis, and release qualification.
  - Hands-on expertise in Python-based test automation and
    firmware debugging.
  - Ability to drive quality initiatives and collaborate
    effectively across engineering teams.
  - Familiarity with AI/GenAI tools to improve test design,
    automation, debugging, developing AI agents to increase
    the productivity.
  - Good with Python scripting and test automation development.
  - Strong hands-on experience with GitHub Copilot and AI-
    assisted software development workflows.
  - Ability to effectively leverage AI tools such as GitHub
    Copilot to accelerate automation script development,
    debugging, and test execution.
  - Strong understanding of server management technologies,
    platform validation, option validation, firmware
    architecture, and low-level system components.
  - Working knowledge of Redfish APIs; experience in security
    testing is highly desirable.
  - Experience assembling and configuring server hardware,
    including CPUs, memory, storage devices, network adapters,
    power supplies, and disk drives.
  - Strong understanding of the testing ecosystem, including
    tools, test environments, data management, automation
    frameworks, and execution infrastructure.
  - Good understanding of Software Development Life Cycle (SDLC)
    methodologies and Agile development practices.

  Additional Skills

  - Proven leadership capabilities with a strong focus on
    execution and results.
  - Excellent verbal and written communication skills.
  - Knowledge of fault-tolerant systems and high-availability
    architectures is an advantage.

