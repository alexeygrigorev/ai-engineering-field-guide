description: |
  Company Description

  Oteemo is an industry-leading technology consulting firm at
  the forefront of AI-driven, cloud native, enterprise
  DevSecOps transformation. We build intelligent, automated,
  secure systems for organizations tackling their toughest
  technical and business challenges and we're pushing the
  boundaries of what AI, generative AI, and agentic systems
  can do in production, not just in theory. Join us and you'll
  work alongside recognized experts on cutting-edge projects
  that blend cloud native architecture, extreme automation,
  and AI/ML at the core. We foster a dynamic, inclusive, and
  collaborative culture built on continuous learning, where
  your ideas shape real outcomes for our clients. If you're
  passionate about building what's next in AI and cloud
  technology and want to do it with a team that sets the
  standard rather than follows it, Oteemo is where you belong.

  Job Description

  AI Engineer / Forward Deployed Engineer (FDE) Location:
  Hyderabad, India (Hybrid) · Must have reliable overlap with
  US Eastern hours for client collaboration Level: Mid to
  Senior (4–8 years) Team: AI Engineering Employment Type:
  Full-time

  About Oteemo

  Oteemo is a digital transformation consultancy helping
  enterprise and public-sector clients modernize how they
  build and ship software. AXIOM is our AI platform for
  building secure, agentic AI applications and copilots
  deployed across regulated commercial and federal
  environments.

  As an AI Engineer on the team, you'll build the agents,
  pipelines, and integrations that power real client solutions
  and, over time, work directly with clients to prototype and
  deploy them in the field.

  Role Overview

  We're looking for a hands-on AI Engineer who can build
  scalable, AI-powered applications and solve complex business
  problems. The ideal candidate is an out-of-the-box thinker,
  passionate about emerging technologies, and comfortable
  working across backend, frontend, AI, and cloud.

  This role has a clear path to evolve into a Forward Deployed
  Engineer (FDE) working closely with clients to understand
  their challenges, rapidly prototype solutions, and deploy
  them in real-world environments.

  Key Responsibilities

  - Build and deploy AI-powered applications, agentic workflows,
    and backend services.
  - Design and ship LLM agents using LangGraph, LangChain,
    LibreChat, or equivalent frameworks.
  - Build RAG pipelines — chunking, embeddings, vector search
    (pgvector/Redis), and retrieval evaluation.
  - Establish prompt/agent evaluation practices to measure
    accuracy and reduce hallucination.
  - Develop APIs and services using Python, FastAPI, TypeScript,
    and Node.js.
  - Build frontend applications using React, TypeScript, and
    Tailwind CSS.
  - Work with PostgreSQL and MongoDB (Redis a plus).
  - Deploy and manage applications using Docker, cloud
    platforms, and Infrastructure as Code.
  - Integrate cloud-native AI services from Azure AI Foundry
    (Azure OpenAI, Azure AI Search, Document Intelligence,
    Vision/Speech/Language) and/or AWS AI/ML (Bedrock,
    SageMaker, Textract, Comprehend, Rekognition, Kendra).
  - Follow secure coding practices and handle
    sensitive/regulated client data responsibly.
  - Collaborate with engineering, business, and client teams to
    turn requirements into working solutions.
  - Participate in client discussions, technical workshops, and
    solution demos where required.

  Required Qualifications

  - 4–8 years of professional software engineering experience.
  - Strong Python and backend/API development skills (FastAPI,
    REST).
  - Working knowledge of TypeScript/Node.js and modern React
    frontend development.
  - Hands-on experience with LLMs and AI agents (LangGraph,
    LangChain, or similar).
  - Experience with PostgreSQL and/or MongoDB.
  - Hands-on with Docker and at least one cloud platform (Azure,
    AWS, or GCP).
  - Strong communication and collaboration skills; comfortable
    in client-facing settings.

  Nice-to-Have (Bonus)

  - Experience with RAG, vector databases (pgvector, Redis, or
    similar), and agent evaluation.
  - Azure AI/Cognitive Services (Azure OpenAI, AI Search,
    Document Intelligence, Vision).
  - AWS AI services (Bedrock, SageMaker, Textract, Comprehend,
    Rekognition, Kendra).
  - Infrastructure as Code — Terraform preferred (Pulumi or
    similar acceptable).
  - Kubernetes exposure (AKS/EKS/GKE).
  - LibreChat or similar chat-platform customization.
  - Prior consulting or forward-deployed / client-embedded
    experience.

  What We Look For

  - An out-of-the-box thinker with strong problem-solving
    skills.
  - A passion for learning, experimentation, and continuous
    upskilling.
  - The ability to quickly pick up new technologies and thrive
    in evolving environments.
  - A proactive, ownership-driven mindset able to take ideas
    from concept to deployment.
  - Clear communication and genuine collaboration instincts.

  What Success Looks Like (First 90 Days)

  - 30 days: Ramp on the codebase and stack; ship your first
    meaningful PR.
  - 60 days: Independently build and deploy an agentic workflow
    or RAG feature to a staging environment.
  - 90 days: Own a client-facing feature end-to-end from
    requirement to deployed solution with measurable quality
    (eval-backed).

  Oteemo is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.

  Qualifications

  Education:

  Bachelor's or Master's degree in Computer Science,
  Artificial Intelligence, Data Science, or a related field

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
