description: |
  COMPANY OVERVIEW

  KKR is a leading global investment firm that offers
  alternative asset management as well as capital markets and
  insurance solutions. KKR aims to generate attractive
  investment returns by following a patient and disciplined
  investment approach, employing world-class people, and
  supporting growth in its portfolio companies and
  communities. KKR sponsors investment funds that invest in
  private equity, credit and real assets and has strategic
  partners that manage hedge funds. KKR’s insurance
  subsidiaries offer retirement, life and reinsurance products
  under the management of Global Atlantic Financial Group.
  References to KKR’s investments may include the activities
  of its sponsored funds and insurance subsidiaries.

  POSITION SUMMARY We are looking for a skilled Full-Stack
  Software Engineer to join our Platform Engineering team. In
  this role, you will build and maintain scalable, reliable,
  and secure platform services that empower engineering teams
  to develop, deploy, and operate applications efficiently.
  You will work across infrastructure, cloud platforms, and
  application layers, with a strong focus on automation,
  system design, and AI-enabled capabilities. We are operating
  in a 4-day in office, 1-day flexible work arrangement.

  ROLES & RESPONSIBILITIES •    Design, build, and maintain
  core platform services and internal developer tooling •
  Develop backend services and automation using Python and
  Java •    Design and implement scalable, fault-tolerant
  systems following strong system design principles •
  Manage and provision infrastructure using Terraform and
  Infrastructure as Code (IaC) best practices •    Build and
  operate cloud-native solutions on AWS, GCP, or Azure (at
  least one required) •    Integrate and support AI-driven
  services and workflows within the platform •    Work with
  MCP (Model Context Protocol) or similar AI/platform
  integration frameworks •    Collaborate with application,
  DevOps, and security teams to improve platform reliability
  and developer experience •    Monitor, troubleshoot, and
  optimize platform performance and cost •    Contribute to
  architectural decisions, technical standards, and best
  practices

  QUALIFICATIONS

  •    4 to 8 years of relevant experience •    Strong
  experience with Python and Java in production environments •
  Hands-on experience with Terraform and Infrastructure as
  Code •    Solid understanding of system design, distributed
  systems, and cloud-native architectures •    Experience with
  at least one major cloud provider: AWS, GCP, or Azure •
  Familiarity with AI concepts, services, or integrations in
  modern software platforms •    Experience or working
  knowledge of MCP (Model Context Protocol) or similar AI
  integration patterns •    Understanding of CI/CD pipelines,
  containerization, and modern DevOps practices •    Strong
  problem-solving skills and ability to work in a
  collaborative environment

  PREFERRED QUALIFICATIONS •    Experience building internal
  platforms or developer tooling •    Knowledge of Kubernetes
  and service orchestration •    Exposure to multi-cloud or
  hybrid-cloud environments •    Experience with observability
  tools (logging, monitoring, tracing) •    Background in
  security best practices for cloud platforms

