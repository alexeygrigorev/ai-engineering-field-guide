title: Senior LiveKit / Voice AI Engineer
company: Jodie AI
location: London, GBR
remote: true
work_type: FULL_TIME
company_size: 10 Employees
description: |
  Make a phone conversation feel natural, even when the
  network is not. Own the real-time voice systems at the heart
  of Jodie, where latency, interruptions and reliability all
  shape the customer experience.

  The work matters.

  Jodie AI is a UK company building an AI receptionist for
  busy businesses. Jodie answers calls, captures the important
  details and helps owners get back to customers, even when
  they can't pick up themselves. Work remotely with our London
  engineering team. This specialist role is open in the UK and
  Ireland; it is not a work-from-anywhere arrangement.

  What you'll own

  - Build production voice agents with LiveKit Agents and Python
    or Node.js.

  - Improve turn detection, interruptions, speech recognition
    and synthesis across real customer conversations.

  - Own SIP and telephony integrations, call transfers and
    graceful recovery when a provider fails.

  - Measure end-to-end latency, completion rates and
    conversation quality with traces and repeatable
    evaluations.



  What you'll bring

  - Hands-on production experience with LiveKit and real-time
    voice applications.

  - Strong Python or TypeScript/Node.js skills and an
    understanding of asynchronous systems.

  - Practical knowledge of WebRTC, SIP, audio pipelines and
    network failure modes.

  - Experience evaluating voice quality and safely shipping
    changes to a live service.



  Useful, but not essential

  STT/TTS provider evaluation, VAD, multilingual audio, load
  testing and privacy-conscious call observability. You don't
  need a particular degree or every nice-to-have. Show us the
  relevant work you've done and how you think.

  Your first 90 days

  - By day 30: Map the call path, reproduce common failure modes
    and establish useful measurements.

  - By day 60: Ship a tested improvement to latency,
    interruption handling or call reliability.

  - By day 90: Own a repeatable evaluation and release process
    for a meaningful part of the voice stack.



  Where and when you'll work

  Full-time, 37.5 hours a week. Based in the UK or Ireland,
  with at least four working hours overlapping 09:00-17:00
  London time. London HQ is also an option. You'll need to be
  based in one of the listed countries. We'll confirm the
  employing arrangement, local benefits and any location
  restrictions with you before moving to an offer. Tell us
  your location and whether you need visa sponsorship when you
  apply; sponsorship and relocation support are not
  guaranteed.

  What you'll earn

  Annual base salary, before tax: GBP 140k - 180k (or EUR 165k
  - 210k).

  The benefits

  - 30 days of paid annual leave, plus the public holidays where
    you work.

  - A GBP 2,000 annual learning budget, or local-currency
    equivalent, for courses, books and conferences.

  - A company laptop, the software you need and a suitable
    workspace setup, with support getting your home workspace
    ready for remote roles.

  - A 5% employer pension contribution for UK employees.

  - A published salary range, real ownership and direct access
    to decision-makers.



  Hiring process

  A first conversation about your experience, the work,
  location and compensation; a look at how you work (discuss a
  voice pipeline and diagnose a sample trace with latency and
  interruption issues); then meet the team.

  How to apply: https://heyjodie.com/en-gb/careers/senior-
  livekit-voice-engineer/
