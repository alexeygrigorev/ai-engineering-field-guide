description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the LifeThe Artificial Intelligence and Data
  Science function develops enterprise software solutions that
  leverage artificial intelligence, large language models
  (LLMs), machine learning, and modern software engineering
  practices to solve complex business challenges. The team
  partners with product, engineering, and business
  stakeholders to design, develop, deploy, and support
  scalable AI-enabled applications, workflow automation
  solutions, and cloud-integrated platforms that drive
  operational efficiency and business value. This position is
  based in Hyderabad, India and follows a Flex work
  arrangement. No travel is required.

  As a Senior AI Data Science Engineer, you will design,
  build, and maintain enterprise-grade AI applications that
  combine full stack engineering, prompt engineering, workflow
  automation, cloud integration, and large language model
  technologies. The role requires hands-on expertise in AI
  application development, scalable software architecture,
  modern web technologies, and collaboration across cross-
  functional teams to deliver secure, high-quality business
  solutions.

  Primary Responsibilities

  - Design, develop, and maintain full stack applications using
    Vue.js, TypeScript, JavaScript, Python, Flask, REST APIs,
    and modern user interface frameworks.
  - Develop and deploy AI-enabled applications utilizing large
    language models (LLMs), prompt engineering techniques,
    machine learning models, and intelligent automation
    capabilities.
  - Build enterprise business applications with workflow
    automation, role-based access controls, secure
    authentication, and database integrations.
  - Design and implement prompt engineering strategies to
    improve performance, accuracy, and usability of AI-driven
    application features.
  - Integrate applications with cloud platforms, third-party
    services, AI technologies, and enterprise systems.
  - Develop and support solutions using PostgreSQL and other
    relational or non-relational database technologies.
  - Participate in Agile software development activities
    including planning, technical design, code reviews,
    testing, continuous integration, deployment, and
    production support.
  - Collaborate with product, engineering, and business
    stakeholders to translate requirements into scalable
    technical solutions and drive successful delivery.

  Required Qualifications

  - Bachelor's degree with 4+ years of experience OR Master's
    degree with 2+ years of experience in Artificial
    Intelligence, Data Science, Software Engineering, Computer
    Science, or related software development disciplines.
  - Experience developing enterprise AI applications using large
    language models (LLMs), prompt engineering, and generative
    AI platforms such as Claude, Gemini, OpenAI GPT, or
    equivalent technologies.
  - Strong experience in full stack software development using
    Vue.js, TypeScript, JavaScript, Python, Flask, and REST
    APIs.
  - Experience developing and integrating cloud-based
    applications, workflow automation solutions, and third-
    party APIs.
  - Experience with Agile software development, application
    architecture, database integration, and production
    application support.

  Preferred Qualifications

  - Experience with PostgreSQL, PostgREST, Redis, Docker, and
    multi-container application environments.
  - Experience with machine learning model development,
    deployment, and AI-enabled enterprise platforms.
  - Experience with automated testing frameworks, CI/CD
    pipelines, Git-based development workflows, and DevOps
    practices.
  - Experience developing secure applications with role-based
    access control and enterprise security requirements.
  - Experience working within cross-functional product
    development teams in regulated or quality-driven
    environments.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

