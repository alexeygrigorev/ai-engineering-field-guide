description: |
  About dunnhumby dunnhumby is the global leader in Customer
  Data Science, helping the world's most ambitious retailers
  and brands put the customer at the heart of every decision.
  With nearly 3,000 experts across Europe, Asia, Africa and
  the Americas, we partner with iconic businesses like Tesco,
  Coca-Cola, Meijer, Procter & Gamble and Metro to turn data
  into growth, innovation and measurable value for their
  customers.Tesco Media

  Tesco Media is the ultimate media partner to brands. Built
  on unrivalled customer insight, it’s a media owner with
  soul, scale, and storytelling power. Tesco Media helps
  brands and agencies connect meaningfully with customers,
  drive creative effectiveness, and grow at the point of
  purchase.

  About the Role

  Retail Media is transforming how advertisers connect with
  consumers through personalised and targeted campaigns across
  retailers' digital and physical touchpoints. As a Senior AI
  Engineer within Tesco Media, you will help build intelligent
  products and scalable platforms that enable advertisers and
  retailers to make better decisions through data, measurement
  and automation.

  Working closely with product, engineering and analytics
  teams, you will develop AI-powered capabilities that enhance
  campaign effectiveness, improve user experiences and unlock
  measurable business value.

  What You'll Be Doing

  You'll play a key role in designing, developing and
  deploying AI-enabled solutions within a modern engineering
  environment.

  - Build and deploy AI-powered applications and services that
    support Tesco Media products.
  - Collaborate with engineers, product managers and data
    specialists to translate business challenges into
    technical solutions.
  - Develop scalable APIs, data pipelines and platform
    capabilities that support machine learning and intelligent
    automation.
  - Drive engineering excellence through testing, code reviews,
    CI/CD practices and continuous improvement.
  - Contribute to architecture discussions and help shape the
    future direction of AI capabilities across the platform.

  What We're Looking For

  You'll be someone who combines strong software engineering
  fundamentals with a passion for applying AI technologies to
  real-world problems.

  - Overall 5+ years with experience developing and delivering
    production-grade software in a modern cloud-based
    environment.
  - Strong understanding of software architecture, APIs,
    distributed systems and engineering best practices.
  - Knowledge of AI, machine learning or generative AI concepts
    and their practical application in products.
  - Confidence working across cross-functional teams to deliver
    scalable and maintainable solutions.
  - Curiosity, problem-solving ability and a continuous-learning
    mindset.

  You'll Thrive If You...

  - Enjoy solving complex business problems using technology,
    data and AI.
  - Have experience building intelligent products that create
    measurable customer value.
  - Are comfortable mentoring colleagues and sharing technical
    expertise.
  - Thrive in a fast-moving, collaborative and product-focused
    environment.

  What You Can Expect From Us

  We won't just meet your expectations. We'll defy them. So
  you'll enjoy the comprehensive rewards package you'd expect
  from a leading technology company. But also, a degree of
  personal flexibility you might not expect. Plus, thoughtful
  perks, like flexible working hours and your birthday off.

  And we don't just talk about diversity and inclusion. We
  live it every day – with thriving networks including dh
  Gender Equality Network, dh Proud, dh Family, dh One, dh
  Enabled and dh Thrive as the living proof. We want everyone
  to have the opportunity to shine and perform at your best
  throughout our recruitment process — please let your
  recruiter know what adjustments would help.

