title: Google Cloud AI Engineer - USA
company: Cogniify
location: USA
remote: true
work_type: FULL_TIME
description: |
  The Role

  Cogniify is hiring a Google Cloud AI Engineer to build and
  deploy Generative AI applications and AI agents that work
  with real business data. In this hands-on role, you will use
  Vertex AI, Python and BigQuery to take solutions from design
  to production.

  We are looking for an engineer who has built production AI
  or machine learning applications, can connect them securely
  to enterprise data, and enjoys working with both engineering
  teams and business stakeholders.

  What You Will Do

  - Build and deploy AI agents using Vertex AI Agent Builder and
    Google’s Agent Development Kit (ADK), including multi-
    agent workflows.
  - Connect AI applications to BigQuery and other enterprise
    databases through secure APIs and tools, including MCP
    where appropriate.
  - Develop retrieval-augmented generation (RAG) and grounding
    workflows that help agents answer questions using relevant
    business data.
  - Write Python services and BigQuery SQL for data preparation,
    feature engineering and AI applications.
  - Train, evaluate and deploy models on Vertex AI, including
    serving models through Vertex AI endpoints.
  - Use Google Cloud Storage and, where needed, Dataflow or
    Apache Beam to support data pipelines and real-time
    inference.
  - Test AI output quality, troubleshoot production issues and
    protect sensitive data, including personally identifiable
    information (PII).
  - Work with stakeholders to understand requirements, explain
    technical decisions and deliver practical solutions.

  What We Are Looking For

  - Hands-on experience building and deploying Generative AI,
    agentic AI, RAG or machine learning applications on Google
    Cloud Platform (GCP).
  - Practical experience with Vertex AI, such as Agent Builder,
    model deployment, pipelines or model evaluation.
  - Strong Python and advanced SQL skills, with direct
    experience using BigQuery.
  - Experience with Google Cloud Storage and production model
    serving through Vertex AI endpoints.
  - Ability to integrate AI applications with enterprise data
    while managing security and access.
  - Ownership of delivery, from understanding the problem
    through deployment and troubleshooting.
  - Preferred Experience
  - Google ADK, MCP Toolbox for Databases, Spanner, AlloyDB or
    BigQuery vector search.
  - Dataflow or Apache Beam for streaming data pipelines and
    real-time inference.
  - AI or data projects in financial services or retail.
  - PII masking, privacy controls or compliance requirements for
    sensitive data.

  Perks And Benefits Of Working With Us

  - Unlimited PTO.
  - Please ask us about our very generous parental leave, much
    above industry standards!.
  - Entrepreneurial culture where pushing limits and taking
    risks is everyday business.
  - Open communication with management and company leadership.
  - Small, dynamic teams = massive impact.
  - Medical, Dental and Vision coverage for employees.
  - Access to Disability & Life insurance.
  - Mental health and wellbeing support
  - Annual bonus program
  - Employer Stock Purchase Program (ESPP)
  - Yearly Team building experiences
  - Mentorship and sponsorship opportunities
  - Manager resources and support

  We are an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, disability, or any other protected characteristic.
