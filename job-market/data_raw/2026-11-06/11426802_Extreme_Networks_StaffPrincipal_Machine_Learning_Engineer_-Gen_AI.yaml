description: |
  Over 50,000 customers globally trust our end-to-end, cloud-
  driven networking solutions. They rely on our top-rated
  services and support to accelerate their digital
  transformation efforts and deliver unprecedented progress.
  With double-digit growth year over year, no provider is
  better positioned to deliver scalable outcomes than Extreme.

  Inclusion is one of our core values and in our DNA. We are
  committed to fostering an inclusive workplace that embraces
  our differences and creates an atmosphere where all our
  employees thrive because of their differences, not in spite
  of them.

  Become part of Something big with Extreme! As a global
  networking leader, learn why there’s no better time to join
  the Extreme team.

  About the position

  - Be a thought leader and forward thinker, help drive an
    innovative vision for our various products and platforms,
    design and launch strategic machine learning (ML)
    solutions and drive business-wide innovation.
  - Take the lead in the end-to-end software development
    lifecycle, encompassing design, testing, deployment, and
    operations, lead technical discussions and strategy, and
    participate hands-on in design reviews, code reviews, and
    implementation.
  - Craft high-performance, high-scale microservices
    architectures, including synchronous and asynchronous web
    services.
  - Develop real-time online inferencing for highly complex
    models using Triton, TensorRT and mixed precision
    computing.
  - Mentor and develop other engineers on the team, establish
    technical direction and foster team culture.
  - Uphold the highest standards of technical rigor in
    engineering and operational excellence, build highly
    resilient and scalable systems, and champion operational
    and process improvements.

  Basic Qualifications:

  - Degree in mathematics/computer science or related
    discipline.
  - 5 to 10 years of experience in the complete software
    development lifecycle including design, coding, code
    reviews, testing, build processes, deployments and
    operations.
  - 5 to 10 years of experience in Python with an in-depth
    knowledge of its advanced features and libraries.
  - Expertise in designing RESTful APIs with hands-on experience
    with technologies such as FastAPI.
  - Proficient in Docker, Kubernetes, and modern CI/CD
    practices.
  - 3+ years of experience in leading the design and
    architecture of large distributed systems preferably on
    cloud platforms (e.g., AWS, Azure, Google Cloud).
  - Experience as a mentor, tech lead or leading an engineering
    team.

  Preferred Qualifications:

  - MS or PhD in Computer Science or equivalent experience in
    ML.
  - Experience working with ML technologies (PyTorch, Sagemaker,
    Triton, TensorRT, etc.).
  - Experience with NoSQL and document databases.
  - Proven ability to handle big data, optimize workflows, and
    improve system performance.
  - Come work with a team of highly talented engineers, and
    advance with us to achieve new heights every day!
  - Salary based on qualifications, experience and region up to
    USD 170 k to 240 K plus benefits.

