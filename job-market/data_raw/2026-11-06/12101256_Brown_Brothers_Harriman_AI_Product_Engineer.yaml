description: |
  At BBH, Partnership is more than a form of ownership—it’s
  our approach to business and relationships.  We know that
  supporting your professional and personal goals is the best
  way to help our clients and advance our business. We take
  that responsibility seriously. With a 200-year legacy and a
  shared passion for what’s next, this is the right place to
  build a fulfilling career.

  Role Summary

  The Capital Partners (CP) Artificial Intelligence (AI)
  Product Engineer will help convert approved AI concepts,
  requirements, and business needs into deployed, scalable,
  secure, maintainable AI-enabled products and solutions.
  Working in partnership with the CP AI Strategy &
  Transformation Leader, AI Design & Enablement function,
  Product Owners, Business SMEs, Technology, Data, Operations,
  Risk, Compliance, Legal, Information Security, Change
  Management, Training, and Executive Leadership, this role
  will support the design, build, configuration, testing,
  deployment, monitoring, and ongoing improvement of CP's AI-
  enabled products, agents, copilots, workflows, integrations,
  and platform capabilities. The role will be responsible for
  ensuring AI solutions are engineered into existing workflows
  where appropriate, supported by clear technical
  documentation, tested for readiness, aligned to approved
  requirements, and maintainable after release. This role
  serves as the bridge between AI strategy, product
  management, engineering, and operational deployment, helping
  CP move priority use cases from pilot concepts to
  production-ready capabilities with measurable business value
  and sustainable support models.

  AI Product Design & Engineering

  - Translate approved AI use cases and business requirements
    into solution designs, technical architectures, user
    interactions, system dependencies, agent configurations,
    integration patterns, and implementation plans.

  - Build, configure, test, deploy, and maintain AI-enabled
    products, Copilot Studio agents, workflow automations,
    connectors, actions, and platform components in alignment
    with approved requirements.

  - Partner with Product Owners and Business SMEs to refine
    functional requirements, define user journeys, clarify
    acceptance criteria, and support backlog prioritization
    based on business value, readiness, and scalability.

  - Collaborate with Technology and Data teams to design and
    implement APIs, connectors, data access patterns,
    integrations, and platform capabilities needed for CP AI
    solutions.

  - Configure enterprise data connections, authentication
    approaches, access controls, and environment settings in
    partnership with appropriate technology and security
    teams.

  - Design AI-enabled workflows that support operational
    processes, including future-state workflow maps, handoffs,
    approvals, exception paths, human review, workflow
    controls, operational safeguards, and production support
    needs.

  Technical Testing, Release Readiness & Operational Support

  - Develop and execute technical test plans, including
    functional testing, access testing, regression testing,
    integration testing, response-quality testing, and release
    validation.

  - Document test results, defects, remediation actions,
    deployment dependencies, operational risks, and readiness
    considerations for review by appropriate stakeholders.

  - Provide implementation recommendations and technical
    tradeoff analysis relating to scalability,
    maintainability, usability, performance, and operational
    support requirements.

  - Prepare deployment plans, release checklists, runbooks,
    implementation evidence, known limitations, support
    requirements, and technical handoff materials to support
    controlled launch and sustainable operations.

  - Support monitoring and observability for AI-enabled
    products, including usage patterns, user experience
    metrics, performance visibility, reliability trends,
    logging, exception tracking, issue triage, and support
    routines.

  - Troubleshoot grounding issues, workflow failures, connector
    issues, access concerns, performance defects, and
    production support items in partnership with AI Context
    Engineers and Technology teams.

  - Support platform enhancements and release iterations based
    on user feedback, monitoring results, and approved backlog
    priorities.

  Governance, Cross-Functional Delivery & Continuous
  Improvement

  - Collaborate with Information Security, Risk, Compliance,
    Legal, Technology, and Data partners to support secure-by-
    design implementation, approved access patterns, data
    protection expectations, and release practices.

  - Ensure technical designs, agent configurations, workflow
    automations, and integration approaches are documented
    clearly and aligned to approved requirements and operating
    model expectations.

  - Partner with the AI Design & Enablement function to ensure
    new AI capabilities are accompanied by clear onboarding,
    communications, training inputs, and support materials.

  - Partner with AI Context Engineers to align solution
    configuration with approved knowledge sources, metadata
    structures, prompt patterns, system instructions, and
    context maintenance needs.

  - Capture recurring technical issues, user friction points,
    reliability trends, and platform constraints to inform
    continuous improvement of AI products and delivery
    practices.

  - Reinforce consistency and shared engineering standards while
    enabling practical, localized innovation across CP AI use
    cases.

  Relevant Knowledge & Exposure

  - 5+ years of relevant work experience required

  - Experience supporting software engineering, product
    engineering, AI solution delivery, workflow automation,
    systems integration, platform configuration, or technical
    product management.

  - Strong understanding of AI agents, copilots, workflow
    orchestration, connectors, APIs, authentication patterns,
    technical testing, monitoring, and production support
    practices.

  - Ability to translate business requirements into buildable
    technical designs, backlog items, agent configurations,
    workflow specifications, and release artifacts.

  - Experience working with business, technology, data,
    operations, risk, compliance, legal, information security,
    change management, training, and leadership stakeholders.

  - Strong documentation skills, including solution designs,
    test plans, release checklists, deployment plans,
    runbooks, support guides, and technical decision records.

  - Copilot Studio agent build experience preferred.

  - Experience operating in regulated or complex environments is
    preferred.



  Salary Range

  $90,000 - $130,000 base salary + annual bonus opportunity

  BBH and its affiliates' compensation program includes base
  salary, discretionary bonuses, and profit-sharing. The
  anticipated base salary range(s) shown above are only for
  the indicated location(s) and may differ in other locations
  due to cost of living and labor considerations. Base
  salaries may vary based on factors such as skill, experience
  and qualification for the role. BBH's total rewards package
  recognizes your contributions with more than just a
  paycheck—providing you with benefits that enhance your
  experience at BBH from long-term savings, healthcare, and
  income protection to professional development opportunities
  and time off, our programs support your overall well-being.



  We value diverse experiences. We value diverse experiences
  and transferrable skillsets. If your career hasn’t followed
  a traditional path, includes alternative experiences, or
  doesn’t meet every qualification or skill listed in the job
  description, please do go ahead and apply.

  About BBH:

