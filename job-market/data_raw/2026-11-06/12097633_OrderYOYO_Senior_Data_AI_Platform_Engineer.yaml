description: |
  ORDERYOYO – Senior Data & AI Platform Engineer

  Remote · Quarterly team gatherings in one of our global
  offices

  Join OrderYOYO’s Data team to build the data pipelines and
  lakehouse that power executive reporting and merchant
  insights across our platform, and automate how we deliver
  finance data and AI-driven data products to the rest of the
  business.

  You’ll own complex changes from technical design through
  release and production operation, working closely with the
  leadership team, Finance, Product and fellow engineers. Your
  work will improve the accuracy and reliability of our
  reporting, merchant insights and finance data, while
  reducing routine manual Finance work.

  Our data platform runs in a Microsoft Azure cloud
  environment, and we’re moving it to Microsoft Fabric. We
  value transferable experience: strong Azure Databricks or
  Synapse engineers who can quickly develop deep Fabric
  expertise are encouraged to apply. This is a hands-on
  engineering role, not a pure architecture, BI or people-
  management position, and you’ll regularly design, code,
  troubleshoot and operate production data solutions.

  Role Mission

  Build and evolve OrderYOYO’s data platform into a single
  source of truth for executive reporting, merchant insights,
  finance automation and AI, leading the move to a modern
  Microsoft Fabric lakehouse. You’ll help strengthen the
  reliability and quality of our data in production while
  building AI into how we deliver data products and supporting
  our growing international restaurant platform.

  Core responsibilities

  • Design, build and operate production-grade data solutions
  in Microsoft Fabric across Lakehouse, Warehouse, notebooks,
  pipelines and related platform capabilities.

  • Build and run production pipelines in Fabric, Python and
  PySpark that are tested and maintainable, not just
  notebooks.

  • Design ingestion and transformation patterns that scale
  across multiple source systems, databases and business
  domains while controlling source impact, concurrency and
  platform cost.

  • Manage Fabric capacity and cost, and retire redundant
  legacy layers.

  • Lead migrations from legacy to modern platforms with
  metric parity, stakeholder sign-off, change control and safe
  decommissioning.

  • Run the platform in production: monitoring, alerting,
  incident triage, root-cause analysis, data-quality checks,
  lineage and runbooks.

  • Diagnose and resolve production issues across SQL, Spark,
  pipelines and semantic models, including performance
  degradation, data failures and capacity/resource
  constraints.

  • Support and evolve governed semantic models and reusable
  metric definitions, working closely with analytics and
  business stakeholders to ensure performance, consistency and
  reliability.

  • Build AI into the platform and our delivery: RAG, Azure
  OpenAI and agents, with prompt and version management.

  • Deliver applied data science such as churn,
  recommendations, personalisation, fraud or risk models, and
  show the results.

  • Work with executives, Finance, Product and engineering,
  and judge when to move fast, standardise, automate or hold.

  Must-have requirements

  • 6+ years of relevant data experience, including
  substantial recent hands-on data engineering or data-
  platform engineering responsibility in production
  environments.

  • Demonstrated ability to independently take a data-
  engineering problem from requirements and technical design
  through implementation, production deployment, monitoring
  and ongoing operation.

  • Deep hands-on Microsoft Fabric, or strong Synapse,
  Databricks or Delta experience with a clear path to Fabric.

  • Strong understanding of lakehouse architecture and Delta-
  based data engineering, including partitioning, schema
  evolution, file optimisation and performance considerations.

  • Expert SQL and T-SQL, including complex modelling and
  tuning.

  • Production-grade Python or PySpark.

  • Strong experience designing and implementing incremental
  data ingestion patterns, including approaches such as CDC,
  change tracking or watermarks, with reliable merge/upsert,
  replay and idempotent processing.

  • Experience with analytical and semantic data modelling,
  ideally with Power BI/Fabric semantic models, including
  performance optimisation, governance and reusable business
  metrics.

  • Working knowledge of Azure platform fundamentals including
  Azure SQL, ADLS/OneLake, Entra ID, managed identities, RBAC
  and Key Vault.

  • A track record of leading a legacy-to-modern migration.

  • Real, hands-on AI engineering beyond out-of-the-box
  Copilot.

  • Concrete data science or ML models you delivered, with
  results.

  Strong-to-have experience

  • Strong Power BI/Fabric experience, including Direct Lake,
  DAX, semantic model performance tuning, incremental refresh
  and capacity considerations.

  • Infrastructure-as-Code experience with Terraform, Bicep or
  equivalent tooling.

  • Data platform experience in SaaS, marketplace, fintech,
  payments, e-commerce or multi-region businesses.

  Who We Are

  At OrderYOYO, company culture comes first. We create a
  positive, inclusive environment where people are trusted to
  do their best work and take ownership of what they build. We
  look for engineers who take ownership, raise risks early,
  explain decisions clearly, collaborate respectfully and
  follow through on commitments.

  Our values describe what that looks like day to day:

  - Passion: Adaptable and positive in a fast-moving
    environment, proactive about improving how things work.
  - Action: Leads by example and takes the initiative rather
    than waiting to be asked.
  - Compassion: Supports colleagues and considers the impact of
    decisions on merchants and teammates.
  - One Team: Communicates clearly in writing and in person,
    stays calm under pressure and shares information openly.

  We help restaurants succeed online by providing branded
  websites, mobile apps and tailored marketing solutions,
  giving them full control of their business. By removing high
  commission fees charged by third-party platforms, we empower
  restaurants to grow sustainably.

  What we offer

  • A salary of up to £80,000 per year (or local equivalent).

  • A remote role, with quarterly in-person gatherings at one
  of our global offices.

  • Ownership of a business-critical data and AI platform.

  • A collaborative, international engineering team.
