description: |
  Jeeves is the stablecoin-native banking platform for global
  enterprises. Thousands of companies across 35 countries run
  their corporate cards, payments, treasury and spend on one
  platform, with more than $5B in annualized volume, payouts
  to 190 countries, and one of the fastest-growing stablecoin
  payment networks in the world. BMW, H&M, Lululemon, Burger
  King, Kavak and XP are among them, and more than 80% of
  customers use multiple Jeeves products.

  We chose hard problems on purpose.

  We hire for one thing: relentlessness. A strong motor that
  keeps going when the problem has no playbook. You'll know in
  your first week if Jeeves is right for you. For the right
  people, it's the steepest learning curve of your career.

  Jeeves has raised more than $400 million in equity funding
  from Andreessen Horowitz, Y Combinator, CRV, Coinbase
  Ventures, GIC, AllianceBernstein, CoinFund and others.

  If you want to rebuild how money moves across borders, come
  build it with us.

  Jeeves is building AI into the core of its financial
  platform — from intelligent spend categorization and anomaly
  detection to LLM-powered workflows that help finance teams
  move faster. We're looking for a AI Engineer who is obsessed
  with building AI systems that actually work in production:
  reliable, observable, cost-efficient, and genuinely useful.

  This is not a research role. You will ship AI-powered
  features that process real financial data for real
  businesses. You'll work alongside backend engineers, data
  scientists, and product teams to take AI from prototype to
  production — and you'll help define how Jeeves builds with
  AI as the company scales.

  If you've built LLM pipelines, designed RAG architectures,
  operated ML systems in production, and care deeply about
  what happens when your AI makes a wrong call in a financial
  context — we want to meet you.

  Location: This is a full-time remote position. #LI-REMOTE



