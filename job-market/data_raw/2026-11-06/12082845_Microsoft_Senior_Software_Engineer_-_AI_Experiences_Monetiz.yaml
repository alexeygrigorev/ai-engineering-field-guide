description: |
  Overview

  About the team

  As part of Microsoft AI Experiences, our Monetization Demand
  Quality team builds the services that help protect
  advertising quality and keep creative review fast, accurate,
  and reliable. Our team works across creative APIs, content
  scanning, AI-assisted auditing, malware detection, policy
  enforcement, and operational analytics. The team is
  modernizing distributed services on Azure while improving
  the experience of advertisers, publishers, and internal
  partners.

  The team is looking for a Senior Software Engineer to drive
  technical solutions that advance artificial intelligence
  capabilities and engineering practices across the software
  development lifecycle. You’ll work with stakeholders to
  define requirements for creative quality and advertising
  scenarios, lead architecture and testing strategies for
  complex systems, and build extensible solutions that can
  scale across teams.

  You’ll provide technical leadership through mentoring,
  debugging, code quality improvements, and the adoption of
  effective engineering patterns. You’ll also develop
  deployment automation, improve operational readiness, and
  drive toward zero-touch production operations where
  practical. In partnership with other engineering teams,
  you’ll ensure services meet security, reliability,
  compliance, and integration requirements before launch.

  You’ll continuously evaluate emerging technologies, apply
  them to current technical challenges, and share learnings
  that improve engineering practices across the broader
  organization.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  AI Experiences employees who live within a 50- mile commute
  of a designated Microsoft Hub in the U.S. are expected to
  work from the office at least four days per week. This
  expectation is subject to local law and may vary by
  jurisdiction.

  Responsibilities

  - Understand user requirements
    - Partner with product managers, engineering leads, security
      and privacy specialists, and customer support teams to
      define feasible requirements and measurable outcomes for
      creative processing, audit quality, API performance, and
      policy enforcement.
    - Use customer feedback and service data to identify unmet
      needs, including security, privacy, accessibility, and
      globalization. Define feedback loops and success
      measures that connect engineering changes to customer
      value.
  - Design
    - Lead architecture and design for complex APIs, distributed
      workers, event-driven pipelines, and data services
      spanning creative ingestion, scanning, scoring, search,
      and publishing. Evaluate design alternatives and make
      trade-offs explicit.
    - Identify upstream and downstream dependencies; align service
      contracts, ownership, and delivery plans across teams.
      Design for scalability, resiliency, disaster recovery,
      security, privacy, and sustainable infrastructure cost,
      including migrations from legacy systems to Azure.
    - Own test strategies covering integration, performance,
      security invariants, negative cases, and regression
      prevention. Mentor engineers in testable design and
      improve the reliability, speed, and diagnostic value of
      automated tests.
  - AI-native development
    - Improve AI-assisted requirements, design, coding, testing,
      and operations. Take responsibility for the accuracy,
      security, and maintainability of AI-generated assets,
      and coach peers to validate outputs and apply
      Responsible AI controls.
    - Experiment with AI tools and agent-assisted workflows;
      recommend adoption based on demonstrated value. Apply
      SDLC and engineering health measures, such as
      Accelerate, SPACE, and the Engineering System Success
      Playbook (ESSP), to improve team practices.
  - Coding
    - Lead by example and mentor engineers across teams to deliver
      extensible, maintainable, secure, well-tested, and
      performant code.
    - Establish reusable patterns and metrics that improve
      quality, stability, testability, and operating cost.
    - Lead debugging across application, data, and infrastructure
      boundaries using tests, logs, telemetry, and explicit
      verification of assumptions.
    - Resolve ambiguous failures, anticipate blockers, and
      communicate delivery risks and mitigation plans.
    - Provide timely, substantive code and test reviews that
      strengthen correctness, diagnosability, security, and
      maintainability. Integrate automated source analysis
      into development and builds, and use reviews to coach
      engineers.
  - Engineering excellence
    - Build security and compliance into designs, code, and
      operations through least-privilege access, threat
      modeling, security invariants, deployment gates,
      artifact integrity, and privacy-aware telemetry.
      Maintain audit evidence and apply relevant Microsoft
      standards and regulations, including AI safety
      requirements.
    - Establish end-to-end validation, live-site coverage, and
      escalation paths with partner teams before launch.
      Improve developer tooling and reusable engineering
      practices; evaluate emerging technologies and
      responsible reuse of internal or open-source components,
      and share knowledge through mentoring and technical
      discussions.
  - Implementation and delivery
    - Translate multi-team initiatives into milestones, estimates,
      and release plans. Partner with product and data science
      teams on feature flags and experiments with success and
      guardrail metrics; use results to guide rollout and ship
      decisions.
    - Automate CI/CD and production deployment toward zero-touch
      operation. Validate changes in production-like
      environments, manage secure dependencies, and plan
      progressive rollout, capacity, failover, backup and
      restore, and explicit rollback criteria.
  - Reliability and supportability
    - Design instrumentation, dashboards, and alerts for
      availability, latency, throughput, audit coverage, and
      safety mechanisms. Use telemetry to improve reliability
      and efficiency while respecting privacy and data-
      retention requirements.
    - Serve as a designated responsible individual (DRI) in the
      on-call rotation. Lead incident mitigation, communicate
      impact and status, coordinate partner teams, and restore
      service within agreed service-level expectations using
      minimum required access.
    - Lead incident retrospectives and durable repairs that reduce
      recurrence. Improve troubleshooting guides, runbooks,
      tests, and automation, and mentor engineers in reliable
      service ownership.

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 8+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.

