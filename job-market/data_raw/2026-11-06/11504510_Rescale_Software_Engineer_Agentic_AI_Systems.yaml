title: Software Engineer, Agentic AI Systems
company: Rescale
location: USA
remote: true
work_type: FULL_TIME
description: |
  Rescale is pioneering the future of engineering and
  scientific discovery. As the leader in digital engineering,
  we’re transforming how products are developed—through
  intelligent automation, applied AI, data management, and the
  integration of the world’s largest network of engineering
  and R&D applications. Joining Rescale means becoming part of
  a diverse, collaborative, and mission-driven team that’s
  unlocking faster innovation across industries like
  aerospace, energy, life sciences, and manufacturing. We’re
  solving complex challenges that traditional HPC can’t—and
  we’re seeking passionate, curious minds to help build the
  next wave of breakthroughs.

  We’re hiring a product-focused Software Engineer, AI Systems
  to build Rescale’s Data Intelligence and Agentic AI
  platforms within our infrastructure organization. The work
  spans production agents, retrieval, evals, ingestion
  pipelines, and the data services connecting customer
  environments, cloud storage, and compute clusters.

  Projects often start as broad goals. You’ll partner with
  Product to identify the customer problem, sharpen the spec,
  and decide what to ship first. You’ll own the technical
  design and delivery of a meaningful part of the platform.
  You’ll use Rescale’s product yourself, find friction in the
  full workflow, and keep improving what you launch.

  What you’ll do:

  - Build and operate LLM-backed APIs, agents, retrieval
    systems, and integrations with internal and external
    systems.
  - Develop evals for agent and RAG workflows, then use the
    results to improve quality and reliability.
  - Build ingestion pipelines and high-throughput file and data
    paths between customer environments, cloud object storage,
    and compute clusters, balancing reliability, performance,
    and cost.
  - Work with Product and Design to turn broad goals into clear
    problems, practical specs, and small releases.
  - Spot worthwhile improvements, bring the right people into
    the decision, ship frequently, and follow through on the
    result.
  - Work across backend services (Python, Java, Go), cloud
    infrastructure (AWS, Azure, GCP, containers/Kubernetes),
    and occasional UI changes (React and TypeScript) to
    complete the customer experience.

  What we’re looking for:

  - 3–5 years of experience building and operating backend
    services and distributed systems in AWS, Azure, or GCP.
  - Production experience with agentic AI, retrieval-augmented
    generation (RAG), and evals. You can explain how your
    evaluations led to changes in a shipped system.
  - Strong experience in at least one of Python, Java, or Go,
    with comfort working across services and APIs.
  - Experience with data-intensive systems such as object
    storage, relational databases, caches, and queues or
    streams.
  - Effective use of AI coding agents in your development work,
    including the judgment to verify their output. You follow
    new AI engineering practices and test ideas that could
    improve how the team builds.
  - The ability to turn an ambiguous goal into a plan with
    Product, make sound architectural decisions for your area,
    and take responsibility for how the work performs after
    launch.
  - A BS in Computer Science or equivalent experience.

  Diversity, equity, inclusion and belonging are fundamental
  to our success. We strive to be a workplace where we:

  - Welcome ALL and ALL are welcome.
  - Show up with our whole selves or whichever parts of
    ourselves we’re comfortable sharing, and be ready to see
    the same in others.
  - Be ready to learn, unlearn, and learn again.
  - Respect others and their opinions. We practice empathy in
    the way we interact with each other and celebrate
    uniqueness as a team.
  - Seek to understand - ask more questions than one makes
    statements.
  - Provide safety from judgment and preserve a collaborative
    environment.

  Rescale is an equal opportunities employer and welcomes
  applications from all qualified persons regardless of their
  race, sex, disability, religion/belief, sexual orientation
  or age. As part of our standard hiring process for new
  employees, employment with Rescale will be contingent upon
  successful completion of a comprehensive background check.
  Here at Rescale, we are committed to being transparent in
  our policies around candidate privacy. For more details on
  the information Rescale collects in your application, please
  view the Rescale Applicant Privacy Policy here.
