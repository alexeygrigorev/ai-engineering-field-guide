description: |
  About VinMotion and Vingroup

  VinMotion is a pioneering subsidiary of Vingroup, a
  trailblazer in Vietnam’s robotics revolution, forging a
  future where advanced technology seamlessly integrates with
  human progress. With a strong commitment to technological
  excellence and innovation, VinMotion is dedicated to
  advancing cutting-edge AI for humanoid robotics. Our mission
  extends beyond research and development—we strive to attract
  top global talent, foster AI applications in robotics, and
  elevate the reputation of VinMotion, Vingroup, and Vietnam
  as global technology leaders.

  Job Overview

  VinMotion USA is looking for an AI Communication Engineer to
  design and implement AI-driven speech, NLP, vision, and
  multimodal interaction solutions for humanoid robots. This
  role focuses on Generative AI, Physical AI, and AI Vision to
  enable intelligent, real-time robotic communication.

  Key Responsibilities

  - Develop Generative AI models for natural, human-like
    conversations in humanoid robots.
  - Implement speech-to-text (ASR), text-to-speech (TTS), and
    chatbot functionalities.
  - Optimize transformer-based NLP models (GPT, BERT, Whisper,
    etc.) for real-time execution.
  - Enhance robotic perception using AI Vision models for lip-
    reading, facial expression recognition, and gaze tracking.
  - Integrate Physical AI by combining NLP with gesture
    recognition and emotion-aware interactions.
  - Work with multimodal AI to fuse speech, vision, and movement
    for natural human-robot interactions.
  - Deploy AI models in edge computing environments for real-
    time robotic processing.

  Qualifications & Experience

  - Bachelor’s or Master’s degree in AI, NLP, Computer Vision,
    Robotics, or related fields.
  - 2+ years of experience in AI development, NLP, or AI Vision.
  - Strong knowledge of transformer models, LLMs, and generative
    AI.
  - Proficiency in Python, TensorFlow, PyTorch, OpenCV, and NLP
    frameworks.
  - Experience with robotics perception, ASR, TTS, and
    multimodal AI is a plus.

  Benefits

  - Competitive compensation package with performance-based
    bonuses.
  - Work with top AI and robotics experts in a cutting-edge
    environment.
  - Access to top-tier AI talent, global research partnerships,
    and cutting-edge technology.
  - Work in a dynamic and innovation-driven environment with
    Vingroup’s strong backing.
