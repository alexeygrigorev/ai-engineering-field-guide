description: |
  About us

  Umbrella brings specialist firms together under one roof,
  covering strategy, digital transformation, data and AI, and
  IT infrastructure, cloud and security. Our clients get one
  partner who is accountable for their whole transformation,
  from strategy through to execution.

  About the role

  We’re looking for a Solution Engineer to join our AI
  practice and help clients use AI and automation to solve
  real business problems and turn successful solutions into
  repeatable offerings. The role combines client advisory,
  hands-on delivery and productization, working across teams
  to shape how we deliver.

  This is an active opportunity, looking to hire immediately
  in India. This is a remote role.

  Requirements

  Client advisory & pre-sales:

  - Lead discovery with business/technical stakeholders.
  - Identify and prioritize automation opportunities
  - Assess data, systems and security readiness; build
    demos/POCs and support solution scoping.

  Solution design & delivery:

  - Design, build and support AI-powered workflows and
    integrations across ERP, CRM, e-commerce and Microsoft
    365. Deliver document processing for invoices, POs,
    shipping documents and contracts; build secure knowledge
    assistants grounded in client content
  - Implement human review, audit trails and security controls.

  Productize the work:

  - Convert recurring client needs into packaged services,
    reusable accelerators, discovery/assessment methods,
    reference architectures, repeatable implementation plans,
    and clearly defined deliverables/outcomes.

  Ongoing improvement:

  - Monitor production solutions for accuracy, usage and cost;
    tune and improve solutions and identify new opportunities
    with clients.

  Qualifications

  - 5+ years in solution engineering, technical consulting,
    software or data engineering, including 2+ years building
    GenAI/automation solutions in production.
  - Hands-on experience with LLMs (OpenAI, Anthropic Claude,
    Azure OpenAI or similar), prompt design, RAG and agent
    frameworks.
  - Experience deploying and operating agent harnesses such as
    Hermes Agent, OpenClaw, Claude Code or similar—including
    tools, skills, memory, business-system connections and
    secure production operation.
  - Strong integration skills with APIs, Python or TypeScript,
    and business systems such as ERP, CRM and Microsoft 365.
  - Track record of turning one-off project work into repeatable
    services, accelerators or delivery methods.
  - Understanding of AI security/privacy, including Canadian
    requirements such as PIPEDA and Québec’s Law 25.
  - Strong communication skills with the ability to explain
    technical concepts to non-technical and executive
    audiences.
  - Comfortable working independently and owning delivery end-
    to-end.

  Nice to Have

  · Microsoft Copilot Studio, Azure AI Foundry, Power
  Automate, AWS Bedrock or n8n.

  · Document AI experience (Azure AI Document Intelligence or
  Google Document AI).

  · Experience building service offerings in consulting or
  managed-services environments.

  · Certifications such as Azure AI Engineer or AWS Machine
  Learning.



  What we offer

  ·      Varied client work across industries.

  ·      Real influence over how our offerings are designed
  and delivered.

  ·      Access to specialists in strategy, data, digital and
  security.

  Umbrella is an equal opportunity employer. We welcome
  applicants of all backgrounds, and accommodation is
  available on request throughout the hiring process.
