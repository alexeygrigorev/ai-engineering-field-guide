description: |
  About iion

  iion is the leading global game advertising platform,
  reaching brands’ ideal customers across all gaming
  environments. We are ambitious trailblazers, aiming to be an
  indispensable element in brands' media strategy. We are a
  growing team of 50+ people, working primarily remote,
  headquartered in Australia and consisting of teams working
  across APAC and Europe.

  About the Role

  We’re seeking a talented and enthusiastic AI Engineer to
  join our growing team at iion.io. You’ll play a key role in
  designing and deploying agentic AI systems that power the
  full lifecycle of media planning, campaign optimization, and
  performance monitoring. This includes building task-specific
  agents for autonomous budget allocation, KPI tracking, real-
  time reporting, and insight generation using Agentic RAG and
  LLM-integrated conversational interfaces.

  If you thrive at the intersection of backend engineering and
  applied AI - and want to shape how automation drives smarter
  media outcomes - this role is for you.

  Role Responsibilities:

  - Design, build, and deploy scalable RESTful/async backend
    services using FastAPI and Python
  - Architect and implement intelligent agent workflows (ReAct)
    using frameworks like LangChain, LangGraph, Crew AI, and
    LlamaIndex
  - Create advanced conversational analytics and reporting
    interfaces integrated with large language models (LLMs)
  - Deploy efficient retrieval-augmented generation (RAG)
    systems for actionable insights and automation
  - Develop autonomous agents for media planning, campaign
    execution, performance monitoring, and continuous
    optimization
  - Collaborate with product and analytics teams to define
    metrics, performance dashboards, and real-time analytics
    insights
  - Implement and monitor ML pipelines to support campaign
    optimization
  - Design, conduct, and interpret A/B tests with clear
    methodologies and statistical rigor
  - Develop and implement predictive models to support decision-
    making processes and forecasting

  Role Requirements:

  - 2 - 4 years backend Python (FastAPI/Flask) or data
    engineering experience
  - 1.5 - 2 years building and deploying agentic AI solutions
    (ReAct agents, RAG applications)
  - Proficiency in async programming (asyncio), AWS, and CI/CD
    tools
  - Hands-on experience building agentic AI systems using
    frameworks like LangChain, LangGraph, Crew AI, or
    LlamaIndex, with practical integration of LLMs (e.g., GPT,
    Claude) and vector databases such as Chroma or Pinecone
  - Solid understanding of A/B testing, hypothesis testing, and
    predictive modeling
  - Proactive attitude, strategic mindset, and ability to adapt
    quickly in a dynamic environment
  - Ambitious with strong values of collaboration, agility, and
    willingness to challenge the status quo
  - Bachelor’s/ Master's degree in Computer Science, Data
    Science, AI/ML, or related fields, or equivalent practical
    experience

  *This is a fully remote role, with a preference for
  candidates based in Mumbai, New Delhi, Bangalore, Hyderabad
