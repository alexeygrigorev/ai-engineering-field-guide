description: |
  Keyloop bridges the gap between dealers, manufacturers,
  technology suppliers and car buyers.

  We empower car dealers and manufacturers to fully embrace
  digital transformation. How? By creating innovative
  technology that makes selling cars better for our customers,
  and buying and owning cars better for theirs.



  We use cutting-edge technology to link our clients’ systems,
  departments and sites. We provide an open technology
  platform that’s shaping the industry for the future. We use
  data to help clients become more efficient, increase
  profitability and give more customers an amazing experience.
  Want to be part of it?





  The Opportunity

  Keyloop is in the middle of an AI-enabled transformation,
  driven by the AI Empowered Programme — a board-mandated
  effort to lift AI maturity across our ~80 Product &
  Engineering teams. Two teams sit at the heart of it:
  Keystone, which builds the underlying AI capability and
  technical pathways, and Impost, which enables teams to adopt
  that capability hands-on.

  We're looking for an highly motivated AI Enablement Engineer
  to join Impost and help our engineering teams put Keystone's
  AI capability to real, effective use. The primary mode of
  engagement is through a team's AI Champion — coaching,
  mentoring, or pairing with them to drive sustained, long-
  term change. You'll also work directly with teams for
  shorter periods to help resolve specific technical
  challenges, or gain the kind of deep, first-hand insight
  that's only visible from inside a team's day-to-day work and
  feeding it back into the programme.


  This is a hands-on software engineering role, not an
  "engineer who used to code." You'll sit on the frontline of
  AI-driven development lifecycle innovation at Keyloop — as
  part of the Impost team, you'll be the first adopter team
  for Keystone's experimental new solutions, taking ownership
  of real internal systems as genuine test grounds. You'll
  contribute directly to Keystone's solutions — sometimes
  through early feedback on what's rough or missing, sometimes
  through hands-on contribution and pull requests.

  Keyloop itself is a dual-speed technology organization: a
  large, successful DMS heritage business running on
  established platforms built up over decades, alongside
  Fusion — a modern, cloud-native Automotive Retail Platform
  built on AWS, event-driven domain services. You won't need
  to master every technology across that estate yourself —
  each team owns its own stack, and that expertise stays with
  them. Your focus is AI: helping teams leverage Claude Code,
  skills, agents, and Keystone's recommended solutions
  effectively, whatever stack they happen to be working in.

