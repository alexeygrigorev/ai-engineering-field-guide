title: Lead AI Engineer - NBA
company: Humana
location: USA
remote: true
work_type: FULL_TIME
description: |
  Become a part of our caring community The Lead AI Engineer
  owns the design and delivery of the NBA platform's agentic
  AI capabilities. This is a hands-on engineering role first -
  you are expected to be a significant individual contributor
  building production AI systems every sprint. You also lead a
  small team of engineers and contractors focused on bringing
  AI-powered workflows and intelligent analysis into the
  platform's user-facing experiences. This role is forward-
  looking: you are building the foundation for how AI augments
  and automates decision-making across the platform.

  What You'll Own

  - Agentic AI delivery - design, build, and own AI agent
    workflows that surface intelligent analysis,
    recommendations, and automation across the NBA platform's
    user interfaces and internal tooling
  - Hands-on development - actively write and ship production
    code alongside your team; this is not a supervisory role
  - AI workflow design - architect multi-step agentic pipelines
    that integrate with the platform's data layer, decisioning
    outputs, and activation channels to deliver meaningful AI-
    driven experiences
  - LLM integration - own the integration of large language
    models (Claude, GPT, or equivalents) into platform
    workflows, including prompt engineering, tool use,
    structured output handling, and context management
  - User-facing AI experiences - partner with frontend and
    product teams to bring AI-powered analysis and
    recommendations into the Command and Control UI and other
    operator-facing surfaces
  - Evaluation and reliability - build evaluation frameworks to
    measure AI output quality; ensure agentic workflows are
    reliable, auditable, and safe in a regulated healthcare
    environment
  - Contractor management - manage AI engineering contractors
    within your pod; set expectations, review work, and hold
    the team to quality standards
  - AI productivity tooling - model best practices for AI-
    assisted development (Claude, Copilot, etc.) across the
    broader engineering organization

  Use your skills to make an impact


  Required Qualifications

  - 6+ years of software or ML engineering experience with at
    least 1-2 years focused on LLM integration, agentic AI, or
    AI product engineering
  - Hands-on experience building production agentic systems -
    multi-step pipelines, tool orchestration, structured
    output handling, and multi-turn conversation management
  - Experience with RAG patterns and vector search - you have
    built retrieval-augmented systems in production, not just
    read about them
  - Strong Python engineering skills; comfortable building and
    shipping production-grade AI systems, not just prototypes
  - Experience integrating LLM APIs (Anthropic, OpenAI, or
    equivalents) into real applications
  - Proven ability to lead a small team or pod through delivery
    and manage contractor resources
  - Strong judgment on when AI is the right tool and when it is
    not - especially in a regulated, member-facing context
  - Clear communicator - you can explain an agentic architecture
    to an engineer and a product owner without losing either
    of them
  - Deep fluency with AI productivity tools (Claude, Copilot, or
    similar) - this is table stakes for this role

  Preferred Qualifications

  - Experience orchestrating multi-agent systems - coordinating
    multiple AI agents across complex, long-running workflows
  - Experience integrating agentic AI into bespoke enterprise
    software and connecting to external systems like
    Salesforce, Adobe Experience Platform, claims platforms,
    or similar
  - Experience building AI-powered analytics or insight surfaces
    in a business intelligence or operational UI context
  - Background in healthcare, insurance, or other regulated
    industries where AI outputs carry compliance risk
  - Experience with AI evaluation frameworks and techniques for
    measuring output quality and detecting drift
  - Familiarity with the Anthropic Claude API and the Claude
    Agent SDK.

  Work Hours: Typical business hours are Monday-Friday, 8
  hours/day, 5 days/week-- some flexibility might be possible,
  depending on business needs.

  Very minimal travel might be required for training,
  meetings, and/or conferences

  Interview Format

  As part of our hiring process, we will be using on-demand
  technology provided by Hire Vue, a third-party vendor. This
  technology provides our team of recruiters and hiring
  managers with an enhanced method for decision-making through
  on-demand candidate assessments.

  If you are selected to move forward from your application
  prescreen, you will receive correspondence inviting you to
  participate in an on-demand assessment with pre-determined
  questions. You should anticipate the assessment to take
  approximately 10-15 minutes.

  Your on-demand assessment will be reviewed, and you will
  subsequently be informed if you will be moving forward to
  next round of interviews.

  SSN Task via Workday

  Should you be extended a formal employment offer you will
  receive a request to enter your SSN into our Workday system
  to scan for duplicate profiles.

  Work at Home Requirements: To ensure Home or Hybrid
  Home/Office employees’ ability to work effectively, the
  self-provided internet service of Home or Hybrid Home/Office
  employees must meet the following criteria: At minimum, a
  download speed of 25 Mbps and an upload speed of 10 Mbps is
  required; wireless, wired cable or DSL connection is
  suggested. In certain roles, the minimum recommended
  internet speed required by Humana may not be sufficient for
  business needs. Humana reserves the right to require
  associates to upgrade their internet service if necessary.
  Work from a dedicated space lacking ongoing interruptions to
  protect member PHI / HIPAA information. Travel: While this
  is a remote position, occasional travel to Humana's offices
  for training or meetings may be required.

  Scheduled Weekly Hours

  40

  Pay Range

  The compensation range below reflects a good faith estimate
  of starting base pay for full time (40 hours per week)
  employment at the time of posting. The pay range may be
  higher or lower based on geographic location and individual
  pay will vary based on demonstrated job related skills,
  knowledge, experience, education, certifications, etc.



  $129,300 - $177,800 per year



  This job is eligible for a bonus incentive plan. This
  incentive opportunity is based upon company and/or
  individual performance.

  Description of Benefits

  Humana, Inc. and its affiliated subsidiaries (collectively,
  “Humana”) offers competitive benefits that support whole-
  person well-being. Associate benefits are designed to
  encourage personal wellness and smart healthcare decisions
  for you and your family while also knowing your life extends
  outside of work. Among our benefits, Humana provides
  medical, dental and vision benefits, 401(k) retirement
  savings plan, time off (including paid time off, company and
  personal holidays, paid parental and caregiver leave),
  short-term and long-term disability, life insurance and many
  other opportunities.

