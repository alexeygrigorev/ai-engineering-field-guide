description: |
  We are looking for a Senior Full-Stack AI-First Developer to
  design, build, and deliver end-to-end applications using AI-
  augmented development practices. The role involves
  collaborating closely with clients and team members to build
  scalable, intelligent systems while leveraging AI tools and
  prompt-driven workflows to improve productivity, quality,
  and delivery speed. Key Responsibilities:

  - Leverage AI-assisted development tools (such as Claude,
    ChatGPT, Copilot) as core engineering collaborators to
    improve productivity, code quality, and delivery speed.
  - Apply AI-augmented development practices, including prompt
    engineering, iterative development, rapid prototyping, and
    automation of development workflows.
  - Design, develop, and maintain full-stack applications using
    .NET Core (backend) and Angular/React (frontend).
  - Architect and build high-performance APIs and microservices
    with a focus on scalability, reliability, and
    maintainability.
  - Develop reusable prompt patterns and AI-assisted workflows
    for code generation, debugging, testing, and system
    design.
  - Write clean, maintainable, and testable code while adhering
    to best practices, coding standards, and clean
    architecture principles.
  - Implement cloud-native solutions using platforms such as
    Azure, including CI/CD pipelines and containerized
    deployments (Docker).
  - Ensure application security through proper authentication
    and authorization mechanisms (OAuth, JWT).
  - Apply strong testing practices including TDD/BDD using
    frameworks like xUnit, NUnit, or MSTest, leveraging AI for
    test generation and coverage.
  - Collaborate with cross-functional teams to translate
    business requirements into scalable technical solutions
    and take ownership of delivery.

  Skill Requirements:

  - 8+ years of experience in software development with strong
    expertise in .NET Core and C# for building scalable
    backend systems.
  - Proven experience in full-stack development, including
    frontend technologies such as Angular or React.
  - Hands-on experience with AI-assisted coding tools (Claude,
    ChatGPT, Copilot, or similar) integrated into the
    development workflow.
  - Strong understanding of prompt engineering, AI-driven
    development workflows, and rapid experimentation
    techniques.
  - Expertise in building RESTful APIs and microservices
    architectures.
  - Experience with relational databases such as SQL Server or
    PostgreSQL, including data modeling and query
    optimization.
  - Familiarity with cloud platforms (Azure preferred) and SaaS-
    based architectures.
  - Knowledge of authentication and authorization mechanisms
    (OAuth2, JWT, RBAC).
  - Strong understanding of unit testing and TDD using
    frameworks such as xUnit, MSTest, or NUnit.
  - Experience with Docker, containerization, CI/CD pipelines,
    and DevOps practices.
  - Proficiency with version control systems such as Git.
  - Strong communication skills and ability to work effectively
    in a collaborative, team-oriented environment.
  - Detail-oriented with the ability to manage priorities, work
    independently, and consistently deliver high-quality
    results.
