  About the role

  As a Senior AI/ML Research Engineer, you will apply advanced
  AI/ML methods to engineering and industrial use cases. You
  will combine research, experimentation, evaluation, and
  production grade software engineering to turn promising
  models, methods, and existing tools into reliable, agent-
  accessible capabilities.

  This role is ideal for a technically strong researcher and
  builder who can move from an engineering problem to a
  validated approach, then help convert that approach into a
  reusable production component.

  What you will do

  - Apply AI/ML methods to challenging engineering and
    industrial use cases.

  - Research, prototype, and evaluate approaches using frontier
    AI models and related techniques.

  - Convert existing models, tools, and analytical capabilities
    into agent-accessible artifacts.

  - Translate successful experiments into reusable software and
    platform components.

  - Design and execute evaluation, benchmarking, and validation
    approaches.

  - Collaborate with data engineers, software engineers, cloud
    architects, and engineering stakeholders.

  - Contribute to requirements, specifications, constitutions,
    contracts, context, and AI harnesses.

  - Use GitHub workflows, automated testing, and CI/CD practices
    to integrate and validate work.

  - Deploy and evaluate capabilities using GCP or comparable
    cloud services.

  - Communicate technical findings through internal
    documentation, publications, patents, or open-source
    contributions.

  Required qualifications

  - Master’s degree or PhD in a relevant technical field.

  - Five to eight years of relevant professional experience.

  - Experience applying AI/ML methods to engineering,
    manufacturing, industrial, or comparable technical use
    cases.

  - Experience building agentic AI systems.

  - Experience converting models and tools into agent-accessible
    artifacts.

  - Experience with GCP or comparable cloud platforms.

  - Experience with GitHub, CI/CD, and automated testing.

  - Evidence of technical contribution through publications,
    patents, or open-source work.

  What success looks like

  - You deliver validated AI/ML capabilities for multiple
    engineering use cases.

  - You convert selected existing models and tools into
    reusable, agent-accessible artifacts.

  - You establish repeatable evaluation and benchmarking
    practices.

  - You contribute production-ready components to the shared
    architecture.

  - Your work demonstrates measurable value for engineering
    users.

