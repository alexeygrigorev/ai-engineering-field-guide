description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. SMAI Story Micron Technology's vision is to
  transform how the world uses information to enrich life, and
  our commitment to people, innovation, tenacity,
  collaboration, and customer focus allows us to fulfill our
  mission to be a global leader in memory and storage
  solutions. This means conducting business with integrity,
  accountability, and professionalism while supporting our
  global community. Do you believe that data provides
  groundbreaking insight? Do you see data as an asset that
  builds a competitive advantage? Great...so do we! Micron
  Technology operates in a highly competitive industry where
  innovation depends on hardworking minds extracting fresh
  insights from an ever-expanding data universe. We are
  seeking a technically strong Solution Architect who can
  design and build innovative, rock-solid data science, AI/ML,
  and Agentic AI solutions for Smart Manufacturing use cases.
  We have a diverse, collaborative environment where problem
  solving is a team sport and creative solutions are
  recognized and rewarded. Does this sound like the right team
  for you? Apply today! Solution Architects in this role
  partner with Data Scientists, AI Engineers, and AI Product
  Owners to architect scalable and innovative data science
  solutions in technology domains such as Artificial
  Intelligence (AI), Machine Learning (ML), Gen AI, Big Data,
  and Internet of Things (IoT) using both on prem and cloud-
  based platforms. In this role, you will need to be
  technically sound and capable of crafting innovative end-to-
  end designs to solve highly complex business problems. We
  are looking for team members who enjoy learning, introducing
  new technologies, and building scalable solutions that drive
  value for the business. The ideal candidate will have
  significant experience architecting enterprise data and
  analytics platforms, especially in cloud-based and hybrid
  environments, and the ability to dive deep into hands-on
  technical solutions while mentoring others through strong
  technical leadership. Roles & Responsibilities

  - Define and architect scalable, production-ready cloud
    analytics, machine learning, and data science solutions to
    solve highly complex Smart Manufacturing business
    problems.
  - Lead technical architecture decisions that minimize
    technical debt through robust system design, data models,
    platform standards, and lifecycle management practices.
  - Provide deep subject matter expertise to troubleshoot
    critical technical issues and drive innovative solutions
    across multiple projects and pillars.
  - Work effectively in cross-functional teams, tiger teams, and
    technical working groups to align stakeholders and deliver
    strong, scalable architecture outcomes.
  - Coach and mentor Data Scientists, AI Engineers, and AI
    Product Owners through technical reviews, knowledge
    sharing, and solution guidance to elevate overall team
    capability.

  Qualifications and Experience

  - Overall 15+ yrs of IT experience in Data technologies with
    5+ years of experience in architecting and delivering
    large-scale cloud data analytics and AI/ML solutions,
    preferably on Google Cloud Platform (GCP) or Microsoft
    Azure and on-prem enterprise platforms.
  - Hands-on experience with any of the GCP/Azure cloud and
    popular on-prem platforms. Expertise in Agentic AI, Gen AI
    and distributed enterprise computing tech such as
    OpenShift/Kubernetes, Solace is desired.
  - 5+ years of hands-on experience in Python, .NET, SQL, and
    modern front-end technologies such as Angular, with
    expertise in software engineering and GitHub-based
    collaboration practices.
  - Excellent analytical, problem-solving, and written
    communication skills. Great presentation skills, with a
    high degree of comfort interacting with management,
    developers, architects, and business stakeholders.
  - Demonstrated ability to adapt to new technologies, learn
    quickly, and evaluate emerging tools and frameworks to
    drive innovation and long-term business value.

