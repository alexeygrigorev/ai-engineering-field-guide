description: |
  Job Title: Forward Deployed Engineer

  Experience: 4-6 Years

  About the Company:

  Blue Machines builds production Voice AI for India's largest
  enterprises—handling millions of live conversations in
  Hindi, Hinglish, and regional languages. As a Forward
  Deployed Engineer, you will design, build, integrate,
  support, and debug production-grade AI agents end-to-end.
  You are directly responsible for the delivery and execution
  of your agent, not a partner handing off to it. You will
  bridge the gap between client systems and the Blue Machines
  platform across APIs, cloud services, and AI frameworks.

  The Role

  We are seeking a Forward Deployed Engineer (FDE) who bridges
  the gap between deep software engineering, cutting edge AI
  agent orchestration, and client delivery. In this role, you
  aren't just writing specifications or handing off prototypes
  you directly design, build, deploy, optimize, and debug
  production AI agents end-to-end. You will embed deeply with
  client environments to build seamless integrations while
  taking full technical ownership of agent performance in the
  wild.

  What You'll Do

  ● End-to-End AI Agent Architecture: Design, prompt, build,
  and deploy production voice agents, including guardrails,
  conversation design, and tool-calling logic.

  ● Production Integration Engineering: Build scalable backend
  integrations (REST APIs, WebSockets, webhooks, callbacks,
  CRM writes) connecting the Blue Machines platform with
  enterprise systems.

  ● AI Orchestration & Ecosystems: Implement AI/LLM frameworks
  using LangChain, OpenAI APIs, or similar SDKs to deliver
  intelligent workflows.

  ● System Observability & Root-Cause Analysis: Read system
  logs, traces, and call flows to run rigorous root-cause
  analysis—proving whether an issue stems from prompt design,
  platform layer, or data pipelines.

  ● Agent Evaluation & Funnel Optimization: Continuously
  monitor and optimize agent metrics (completion rate,
  hallucination rate, latency, cost) and run funnel
  experiments on conversation cadence.

  ● Client Technical Leadership: Partner directly with client
  engineering teams, lead technical workshops, manage
  expectations with clarity, and travel for live-call reviews.

  What We Look For

  ● Core Experience: (4-6) years of software development
  experience, with at least 2+ years of hands-on experience
  shipping live LLM/AI applications (agents, RAG, or chatbots;
  voice experience is a plus).

  ● Core Backend Skills: Proficiency in Python or Java for
  backend architecture and integration work.

  ● Cloud & Web Architecture: Hands-on experience with cloud
  platforms (preferably GCP) along with deep knowledge of
  APIs, WebSockets, and auth protocols (OAuth2, JWT).

  ● Data Fluency: Comfortable pulling and analyzing data
  independently using SQL, Python, or Sheets.

  ● Communication & Presence: Strong client-facing
  communication skills with the ability to explain technical
  complexities in plain terms.

  ● Mobility: Willingness to travel for on-site client
  workshops and deployment reviews.

  Nice to Have

  ● Knowledge of telephony stacks and real-time protocols
  (SIP, WebRTC, Twilio, Avaya, Ubona).

  ● Experience with Voice AI or Conversational AI Systems
