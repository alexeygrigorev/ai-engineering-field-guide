description: |
  Artificial intelligence is changing how legal and tax
  professionals work. At Loyens & Loeff, the AI Solutions Team
  is responsible for driving the firm’s AI transformation by
  developing practical AI solutions together with our
  Expertise Groups and Business Functions. The international
  team brings together product managers, engineers and
  legal/business experts who translate legal and business
  needs into usable, scalable solutions.

  We are looking for an experienced Legal Engineer who
  combines legal knowledge and a consultative approach with
  hands-on solution delivery. You will work with business
  users to understand their needs, translate these into
  practical AI workflows, and coordinate delivery with
  technical colleagues. You will also help organise and
  maintain the knowledge underpinning these solutions, so they
  are reliable, reusable and easy to adopt. The emphasis is on
  understanding legal work, configuring solutions and guiding
  implementation, rather than software development readiness
  of our services.

  Your role as an Legal AI Engineer

  You are responsible for designing, developing, implementing,
  and continuously improving AI solutions that contribute to
  Loyens & Loeff's strategic objectives. You work at the
  intersection of technology, business processes, legal
  knowledge, and information management. You ensure that
  solutions are not only technically robust but also aligned
  with user needs and sustainably embedded within the
  organization. In addition, you will:

  - Work with legal Expertise Groups and business teams to
    identify, analyse and prioritise opportunities for AI-
    enabled solutions.
  - Translate legal and business use cases into practical AI-
    enabled workflows, configuring tools, instructions and
    knowledge sources where appropriate and working with
    engineers when technical development or integration is
    required.
  - Define standards for how legal knowledge and information
    assets are structured and used in AI-enabled solutions.
  - Advise practice teams on knowledge management choices that
    make AI solutions easier to scale, maintain and reuse.
  - Coordinate the intake, evaluation and delivery of AI
    initiatives together with engineers, IT colleagues, and
    business stakeholders.
  - Design and execute testing activities to assess quality,
    usability and business value of AI solutions.
  - Gather user feedback, usage insights and performance data
    and translate these into improvements and new
    opportunities.
  - Support adoption by preparing documentation, guidance
    materials and demonstrations that help colleagues use AI
    effectively and responsibly.
  - Monitor developments in AI and identify opportunities to
    expand the firm's portfolio of AI solutions.

  This role is something for you, because you have:

  - You have a bachelor's or master’s degree in law or a related
    field, or you have gained substantial experience working
    with legal knowledge, legal processes or legal
    professionals in a professional services environment.

  - You have a strong interest in both legal technology and
    business processes and enjoy working at the intersection
    of the two.

  - You understand legal work and are comfortable working with
    legal professionals, legal knowledge and complex
    information-intensive processes.

  - You are comfortable analysing complex workflows and
    translating them into practical and scalable solutions.

  - You have experience applying AI tools, designing workflows,
    improving processes, configuring low-code/no-code
    platforms and/or managing knowledge in a professional
    environment. You can turn user needs into practical
    solutions and work effectively with technical specialists;
    programming is not a core requirement for this role.

  - You understand that effective AI solutions depend on well-
    structured, reliable source information and can translate
    this into practical standards and guidance.

  - You enjoy working in an international environment and
    communicate effectively in English, the day-to-day working
    language of our team.

  - You are organised, structured and able to manage multiple
    initiatives simultaneously.

  - You communicate confidently with both technical and non-
    technical stakeholders.

  - You can independently lead a workstream, set direction and
    influence stakeholders across legal, business and
    technical teams.

  To be considered for this position, you must already have a
  valid work permit for the Netherlands. Please note that
  Loyens & Loeff does not provide visa or work permit
  sponsorship for this role.

  About the team

  You will join the AI Solutions team, part of the Innovation
  department at Loyens & Loeff. This multidisciplinary and
  international team plays a central role in the firm's AI
  transformation and develops and manages AI solutions across
  all home markets.

  A critical part of this role is the effective structuring,
  management, and utilisation of legal knowledge and
  information. The quality of AI solutions depends heavily on
  the quality of the underlying knowledge assets and
  information sources. The combination of AI technology,
  knowledge management, and innovation is what makes this role
  unique. You will work with colleagues from multiple
  disciplines to build solutions that create tangible value
  for legal and business professionals.

  What we offer

  An opportunity to further develop your career at a leading
  international firm, unique in its offering and operating at
  the top of the market. You will work from our Amsterdam
  office in a driven and collaborative team where high-quality
  service, team spirit and collegiality are at the heart of
  everything we do. We offer a highly attractive employment
  package, including:

  - a salary starting from €5,000 gross per month, depending on
    your knowledge and experience;
  - 8% holiday allowance;
  - 26 vacation days;
  - a collective bonus scheme;
  - pension plan through Cappital A.S.R.;
  - a mobility allowance or lease car;
  - plenty of opportunities for personal development and
    flexibility, including hybrid working.

  Who are we?

  Loyens & Loeff, as One Firm: Law & Tax, provides unique
  support to international and domestic companies, financial
  institutions and investors. More than a thousand lawyers,
  tax advisers and civil-law notaries work together to deliver
  smart and efficient solutions under Dutch, Belgian,
  Luxembourg and Swiss law. From our home markets and offices
  in London, New York and Paris, we have a particular focus on
  Private Equity & Funds, Real Estate, Life Sciences &
  Healthcare, and Energy & Infrastructure.

  At Loyens & Loeff, we strive to create an inspiring,
  inclusive and enjoyable working environment where our
  colleagues can reach their full potential. As a high-
  performance organisation, we believe it is our "alchemy of
  talent", the combination of different talents, perspectives
  and experiences, that enables us to excel. That is why we
  actively foster a diverse and inclusive workplace in which
  everyone is encouraged to contribute their unique strengths.

  Apply for this vacancy

  Research shows that some candidates are less likely to apply
  when they feel they do not meet every requirement listed in
  a vacancy. At Loyens & Loeff, we value potential, motivation
  and diversity just as much as experience. Are you interested
  in this role but unsure whether your profile is a perfect
  match? We encourage you to apply anyway or contact Sophie
  Ravesteijn, Talent Acquisition Adviser, at
  sophie.ravesteijn@loyensloeff.com. We are happy to discuss
  the possibilities with you.

  AI is becoming an increasingly common part of the
  application process. We therefore encourage the responsible
  use of AI during your application to Loyens & Loeff. AI may
  support you, but your motivation, ideas and personality
  should always remain at the centre of your application. You
  can read more about our AI policy in our FAQ.
