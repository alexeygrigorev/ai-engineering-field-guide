description: |
  Summary

  We are seeking an accomplished Java Full Stack Developer
  with a specialized focus on Artificial Intelligence and
  Cloud technologies to join our IT Services division. In this
  pivotal role, you will architect and deploy scalable
  solutions that leverage cutting-edge cloud infrastructure
  and advanced machine learning capabilities. This position is
  designed for a seasoned professional who can bridge the gap
  between robust backend development and intelligent, data-
  driven applications, driving innovation within our technical
  landscape.

  Responsibilities

  - Design, develop, and maintain high-performance applications
    using Java, .NET, or Python within a microservices and
    event-driven architecture.
  - Implement and manage continuous integration and deployment
    pipelines utilizing CI/CD tools and infrastructure-as-code
    technologies like Terraform or CloudFormation.
  - Containerize applications and orchestrate deployments using
    Docker and Kubernetes to ensure scalability and
    reliability.
  - Engineer and optimize real-time data streaming solutions
    using Kafka and other message queue systems.
  - Develop and integrate RESTful and GraphQL APIs to support
    seamless data exchange across services.
  - Apply prompt engineering techniques and work with Large
    Language Models (LLMs) to enhance application intelligence
    and user interaction.
  - Collaborate with cross-functional teams to define technical
    requirements and deliver robust, secure, and efficient
    software solutions.

  Requirements

  Requirements:

  - Possess 8 to 15 years of professional software development
    experience within the IT Services sector.
  - Demonstrate deep expertise in backend development languages
    including Java, .NET, or Python.
  - Have proven proficiency in containerization and
    orchestration platforms such as Docker and Kubernetes.
  - Show strong command over infrastructure automation using
    Terraform or CloudFormation.
  - Exhibit hands-on experience with CI/CD methodologies and
    tools for streamlined software delivery.
  - Be skilled in designing and consuming REST and GraphQL APIs.
  - Understand and apply concepts of microservices and event-
    driven architectural patterns.
  - Possess practical knowledge of prompt engineering and
    working with LLMs.
  - Have experience managing message queuing systems like Kafka.
  - Target compensation range: ₹18-22 LPA.
