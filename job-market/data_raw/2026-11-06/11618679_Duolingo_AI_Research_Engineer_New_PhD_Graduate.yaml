description: |
  Our mission at Duolingo is to develop the best education in
  the world and make it universally available. It’s a big
  mission, and that’s where you come in!

  At Duolingo, you’ll join a team that cares about educating
  our users, experimenting with big ideas, making fact-based
  decisions, and finding innovative solutions to complex
  problems. You’ll have limitless learning opportunities and
  daily collaborations with world-class minds — while doing
  work that’s both meaningful and fun.

  Join our life-changing mission to develop education for our
  half a billion (and growing!) learners around the world.

  Read our blog to learn more.

  About the role...

  🧠  You will...

  - Solve our most ambitious problems with the right tool for
    the task
  - Collaborate cross-functionally to bring your ideas to life
    in the product
  - Identify problems, prototype solutions, evaluate their
    return on investment, and then implement the best solution
    at scale to improve the lives of our millions of learners
    each day
  - Share your findings both within Duolingo as well as to the
    broader research community

  ✅  You have...

  - You have an Ph.D. in computer science or related technical
    field (or expect to by August 2027)
  - A portfolio of impactful work, in the form of (for example)
    publications, open-source projects, or AI internships
  - Ability to relocate to Pittsburgh, PA or New York, NY
  - A creative, interdisciplinary, and entrepreneurial approach
    to R&D
  - Strong debugging and critical thinking skills

  ❤️  Why you'll love working here...

  - Language learning opportunities
  - Catered in-house lunches and breakfast
  - Company-wide Hackathon
  - PTO and company holidays
  - Frequent company-wide dinners, monthly celebrations, social
    clubs, and so much more!

  The offered salary is dependent upon several factors,
  including work experience, skills, and internal peer
  comparisons. The posted range is subject to change in the
  future. For this role, base salary is supplemented by equity
  compensation. We encourage you to talk with your recruiter
  for more information related to compensation for this role!

  Salary Range:

  $137,700—$186,300 USD

  Benefits: Take a peek at how we care for our employees'
  holistic well-being with our benefits here. Job Alerts: Sign
  up for job alerts here. Accommodations: We will do
  everything we can within reason to make sure that your
  interview takes place in an environment that fairly and
  accurately assesses your skills. If you need assistance or
