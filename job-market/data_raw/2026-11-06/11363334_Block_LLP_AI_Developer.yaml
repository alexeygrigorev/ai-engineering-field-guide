description: |
  Location: Burbank, CA Employment Type: Full-Time
  Compensation: $80,000 - $130,000 annually

  About the Role

  Block LLP is seeking a hands-on AI Developer to design,
  build, and maintain AI-powered applications, automations,
  and integrations that improve how our firm operates.

  This role will focus on turning real business and legal
  workflows into functional technology solutions. The AI
  Developer will work closely with firm leadership, our AI
  Implementation team, and departments across the organization
  to develop internal AI tools that improve efficiency, reduce
  repetitive work, and help our teams work more effectively.

  Unlike a traditional software development role, this
  position sits at the intersection of software engineering,
  artificial intelligence, automation, and legal operations.
  The ideal candidate is comfortable writing code, working
  with large language models and APIs, experimenting with new
  technologies, and taking an idea from prototype through
  deployment.

  About Block LLP

  Block LLP is a rapidly growing plaintiff personal injury law
  firm dedicated to delivering exceptional results and
  exemplary service to our clients. We are passionate about
  helping injured individuals and families navigate some of
  life's most challenging moments with compassion, advocacy,
  and expertise.

  Our culture is built around five core values: Vibrant
  Culture, Teamwork, Relentless Pursuit of Excellence,
  Dependability, and Exemplary Service. These values guide how
  we support our clients, collaborate with one another, and
  approach our work every day.

  What You'll DoAI Application Development

  - Design, build, test, and maintain internal AI-powered
    applications and tools.
  - Develop solutions using large language models (LLMs) and
    platforms such as OpenAI, Anthropic Claude, Gemini, or
    comparable technologies.
  - Build AI assistants and agents that support legal and
    operational workflows across the firm.
  - Develop tools for tasks such as document analysis,
    information extraction, summarization, internal knowledge
    retrieval, and workflow automation.
  - Take projects from initial prototype through testing,
    deployment, and ongoing improvement.

  AI Agents & Knowledge Systems

  - Build AI agents capable of completing multi-step tasks and
    interacting with firm systems.
  - Develop retrieval-augmented generation (RAG) solutions that
    allow AI applications to securely retrieve information
    from internal documents and knowledge sources.
  - Create and optimize prompts, agent instructions, tool
    integrations, and AI workflows.
  - Build processes to evaluate AI outputs for accuracy,
    consistency, and reliability.
  - Improve existing AI applications based on employee feedback,
    usage, and performance.

  APIs & Systems Integration

  - Build integrations between AI applications and existing firm
    software using APIs, webhooks, and other integration
    methods.
  - Connect AI tools with business systems, databases, document
    repositories, and third-party applications.
  - Develop automated workflows that securely move information
    between systems and reduce manual work.
  - Work with automation platforms such as n8n, Make, Zapier, or
    comparable technologies when appropriate.
  - Troubleshoot and maintain integrations as systems and
    business needs evolve.

  Software Development

  - Write clean, maintainable, and well-documented code.
  - Develop primarily in Python and/or JavaScript/TypeScript.
  - Work with structured and unstructured data, databases, APIs,
    and common business file formats.
  - Use source control and development best practices to manage
    code and application changes.
  - Test, troubleshoot, monitor, and maintain applications after
    deployment.
  - Build solutions with appropriate security, privacy, and
    access controls for sensitive legal and client
    information.

  Collaboration & Innovation

  - Partner with the AI Implementation team, leadership,
    attorneys, and staff to understand workflow challenges and
    translate them into technical solutions.
  - Evaluate the technical feasibility of proposed AI
    initiatives.
  - Rapidly prototype ideas and determine whether they can
    become reliable, scalable internal tools.
  - Research emerging AI technologies, frameworks, and platforms
    that could benefit the firm.
  - Explain technical concepts, limitations, and recommendations
    clearly to non-technical stakeholders.
  - Document systems, integrations, and development processes to
    support long-term maintenance and scalability.

  Requirements

  - 2+ years of professional software development, AI
    development, automation development, or closely related
    technical experience.
  - Strong working proficiency with Python and/or
    JavaScript/TypeScript.
  - Hands-on experience working with large language models or
    generative AI APIs such as OpenAI, Anthropic Claude,
    Gemini, or comparable platforms.
  - Experience building APIs, integrations, automations, or
    internal software applications.
  - Understanding of REST APIs, webhooks, databases, and modern
    software development concepts.
  - Experience taking technical projects from concept or
    prototype through implementation.
  - Strong troubleshooting, analytical, and problem-solving
    skills.
  - Ability to work independently in an environment where
    requirements may evolve as solutions are tested.
  - Strong communication skills and the ability to collaborate
    with both technical and non-technical team members.

  Preferred Qualifications

  - Experience developing AI agents or multi-step agentic
    workflows.
  - Experience building retrieval-augmented generation (RAG)
    applications.
  - Familiarity with vector databases, embeddings, and semantic
    search.
  - Experience with frameworks such as LangChain, LangGraph,
    LlamaIndex, or comparable AI development tools.
  - Experience with automation platforms such as n8n, Make,
    Zapier, or similar technologies.
  - Familiarity with SQL and relational databases.
  - Experience working with cloud platforms such as Azure, AWS,
    or Google Cloud.
  - Experience with Git or similar version-control systems.
  - Experience developing applications involving document
    processing, document management, or large volumes of
    unstructured data.
  - Experience working in a law firm, legal technology,
    professional services, or another environment handling
    confidential information is a plus.

  Benefits

  - Opportunity to help build the firm's AI capabilities from
    the ground up.
  - Direct collaboration with firm leadership and key decision-
    makers.
  - High-impact role with visibility across the organization.
  - 9 paid firm holidays annually, plus additional time off.
  - 401(k) retirement program.
  - Career growth and advancement opportunities.

  Apply Today

  If you're a developer who enjoys turning emerging AI
  technology into practical tools that solve real business
  problems, we'd love to hear from you.

  Block LLP is an equal opportunity employer and values
  diversity in the workplace. We encourage qualified
  candidates from all backgrounds to apply.
