description: |
  Build What Matters at RevStar

  Position: Data & AI Forward Deployed Engineer (FDE)

  - Reports To: Product Manager/Engineering Lead
  - Location: Remote (AZ, DC, FL, GA, IA, IL, ME, NY, NJ, SC,
    TX, VA)
  - Employment Type: Full-Time W2

  Job Summary

  At RevStar, we build cutting-edge cloud, data, and
  Generative AI solutions that transform how enterprise
  organizations operate. As an Advanced AWS Consulting
  Partner, we don’t just deliver code—we solve complex
  business problems, modernize legacy infrastructure, and
  deploy production-grade cloud native and AI applications
  that drive real business value. Above all, our team operates
  on three core principles:

  - Self-Mastery: We hold a high bar for how we think,
    communicate, and improve.
  - Ownership: We own outcomes, not just effort.
  - Shared Destiny: We rise or fall together.

  We are seeking a Data & AI Forward Deployed Engineer (FDE)
  to join our Digital Solutions Practice. In this highly
  visible role, you will operate embedded directly at the
  intersection of enterprise cloud architecture, hands-on
  engineering, and client-facing delivery. As an FDE, you are
  both a master cloud builder and a trusted technical advisor.
  You will own the full delivery lifecycle for high-impact
  enterprise accounts—architecting resilient cloud-native
  environments, modernizing legacy infrastructure, and
  deploying state-of-the-art AWS Generative AI (Amazon
  Bedrock, Q, SageMaker) architectures. Simultaneously, you
  will drive AWS adoption and consumption growth by
  identifying new workloads, building POCs, and driving
  strategic technical alignment with client executive
  leadership.

  Key Responsibilities

  - Hands-On Cloud Architecture & Implementation: Design, build,
    and deploy secure, scalable, and resilient cloud
    architectures on AWS using Infrastructure as Code
    (Terraform, AWS CDK, CloudFormation) and modern
    microservices/serverless patterns (Lambda, ECS/EKS, API
    Gateway, DynamoDB).
  - Enterprise Customer Delivery: Serve as the primary technical
    leader on strategic enterprise client engagements. Partner
    with CIOs, CTOs, VPs of Infrastructure/Engineering, and
    client development teams to translate complex business
    goals into high-performing AWS solutions.
  - Cloud Migration & Application Modernization: Lead large-
    scale migrations from on-premises data centers or legacy
    platforms to AWS (using AWS Application Migration Service,
    Database Migration Service, etc.) and re-architect legacy
    monolithic applications into modern serverless or
    containerized architectures.
  - AWS Generative AI & Machine Learning: Architect and deploy
    enterprise GenAI and ML workloads leveraging Amazon
    Bedrock, SageMaker, Vector Databases (OpenSearch,
    Pinecone, pgvector), and custom RAG implementations.
  - Drive Platform Adoption & Growth: Partner with RevStar
    account leadership to identify new, high-value cloud
    workloads within client accounts, driving AWS consumption
    expansion and clear ROI for client executive stakeholders.
  - Technical Mentorship & Practice Building: Coach and mentor
    Cloud Engineers and Solutions Architects. Drive internal
    RevStar accelerators, reusable Terraform modules, AWS
    Well-Architected Review frameworks, and cloud delivery
    best practices.

  RequirementsQualifications & RequirementsTechnical
  Expertise:

  - 6+ years of hands-on experience in Cloud Architecture,
    DevOps/SRE, or Software Engineering with a focus on AWS.
  - 3+ years in a client-facing consulting, Solutions
    Architecture, or Forward Deployed Engineering role.
  - Deep AWS Core Expertise: Mastery across core AWS services
    (IAM, VPC, EC2, ECS/EKS, Lambda, S3, RDS, DynamoDB,
    CloudFront, Route 53).
  - Infrastructure as Code (IaC) & CI/CD: Expert-level
    proficiency in Terraform, AWS CDK, or CloudFormation,
    along with automated CI/CD pipelines (GitHub Actions,
    GitLab CI, AWS CodePipeline).
  - AWS GenAI & Data Services: Practical experience with Amazon
    Bedrock, SageMaker, Glue, Redshift, or OpenSearch for
    building data platforms and AI solutions.
  - AWS Certifications: AWS Certified Solutions Architect –
    Professional and/or AWS Certified DevOps Engineer –
    Professional required. Specialty certifications (Security,
    Machine Learning, Data Analytics) are a plus.

  Client & Business Acumen:

  - Enterprise Track Record: Proven experience leading technical
    delivery for Fortune 500 or mid-market enterprise clients
    (Healthcare, Financial Services, Retail, or SaaS).
  - Consulting & Communication Skills: Outstanding verbal and
    written communication; adept at whiteboarding complex
    architectures, building working POCs/demos, and presenting
    to C-level executives.
  - Growth Mindset: Ability to spot technical expansion
    opportunities, conduct AWS Well-Architected Reviews, and
    advocate for cloud modernization to expand account
    footprint.

  Benefits

  - Paid Time Off – Take the time you need to recharge and stay
    productive.
  - Remote-First Working Environment – Collaborate from anywhere
    while staying connected with our global team.
  - Comprehensive Health Coverage – Medical, Dental, Vision
  - 401(k) Retirement Plan – Plan for your future with access to
    a company-sponsored 401(k) program.
  - Annual Learning & Development Stipend – Invest in your
    skills with conferences, certifications, or courses.
  - Peer Mentorship & Coaching – Learn from experienced
    engineers, product managers, and architects to accelerate
    your growth.
  - Professional Growth Opportunities – Exposure to cutting-edge
    AWS GenAI, data, and cloud technologies across diverse
    industries.
  - Company Outings & Volunteer Opportunities – Build
    relationships and give back to the community.
  - Collaborative, Innovative Culture – Work alongside top
    talent in a fast-paced, supportive environment that values
    curiosity and initiative.

  Equal Opportunity Employment

  At RevStar, we don’t just accept differences — we celebrate
