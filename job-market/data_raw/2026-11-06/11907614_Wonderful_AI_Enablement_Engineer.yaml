description: |
  AI Enablement Engineer - Germany & Austria

  (f/m/x)

  As an AI Enablement Engineer at Wonderful your mission will
  be to help our teams, customers and partners develop the
  skills to take enterprise AI from concept to working
  solution.

  What you’ll do

  You’ll combine hands-on AI engineering with technical
  teaching, designing and delivering programs where people
  learn by building on the Wonderful platform. From onboarding
  Forward Deployed Engineers and Deployment Strategists to
  leading customer workshops and partner certification, you’ll
  equip people to deploy confidently and work independently.

  - Teach by building. Guide customer teams through a scoped AI
    agent or application, connecting architecture,
    integrations and development practices to a working
    solution with practical business value.
  - Get our teams ready to deliver. Own technical onboarding for
    Wonderful’s Forward Deployed Engineers and Deployment
    Strategists, preparing them to work independently in
    customer environments.
  - Lead Wonderful Academy programs. Design and deliver platform
    workshops, hands-on training and role-based learning for
    technical and business audiences.
  - Enable our partners. Build training for systems integration
    partners covering the Wonderful platform, deployment
    methodology and implementation standards.
  - Own certification end to end. Define learning paths and
    assessments, evaluate readiness and manage certification,
    further training and recertification.
  - Practice what you teach. You’ll regularly join live customer
    projects as an FDE, keeping your skills sharp and showing
    what’s possible through hands on delivery.
  - Keep learning relevant. Track progress, gather feedback and
    use product changes and field experience to improve
    content, delivery and outcomes.

  Why should you

  - You’ll be part of what is tipped as the fastest growing
    startup in Europe.
  - Work on a cutting edge agentic solution, the hottest topic
    in enterprise right now.
  - You’ll join a team of high agency builders coming from the
    best tech companies out there.
  - Combine hands-on AI engineering with teaching, facilitation
    and customer partnership.
  - Own programs from curriculum through certification, shaping
    how Wonderful develops technical capability across
    employees, customers and partners.
  - See the impact of your work in the solutions people build
    and their ability to keep developing independently.
  - A mix of home office and travel to clients locally.
  - Great salary and early stage share options.

  What you’ll bring

  - 5+ years in technical enablement, customer education,
    technical training or a related role within SaaS, cloud,
    data or AI.
  - Fluent German and english
  - Strong hands-on AI engineering experience, including system
    architecture, LLM and agent integration, design patterns
    and modern software development practices.
  - A practical understanding of enterprise software, APIs,
    integrations and data flows, with the ability to learn and
    teach a complex platform.
  - A track record of designing and delivering technical
    onboarding, workshops and certification programs, from
    curriculum and assessments through to measuring results.
  - Strong instructional design and facilitation skills. You can
    make complex concepts clear, keep groups engaged and adapt
    to different levels of technical experience.
  - Credibility with technical stakeholders and the confidence
    to lead discussions, explain platform capabilities and
    connect learning goals to business needs.
  - An ownership mindset, excellent communication skills and a
    clear focus on helping people become self-sufficient.

  Apply here, everyone will get a response.

  Candidate Privacy Notice
