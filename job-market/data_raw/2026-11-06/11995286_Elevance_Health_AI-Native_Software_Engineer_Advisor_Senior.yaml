  Who We Are

  Elevance Health is a health company dedicated to improving
  lives and communities – and making healthcare simpler. We
  are a Fortune 25 company with a longstanding history in the
  healthcare industry, looking for leaders at all levels of
  the organization who are passionate about making an impact
  on our members and the communities we serve.

  How We Work

  At Elevance Health, we are creating a culture that is
  designed to advance our strategy but will also lead to
  personal and professional growth for our associates. Our
  values and behaviors are the root of our culture. They are
  how we achieve our strategy, power our business outcomes and
  drive our shared success - for our consumers, our
  associates, our communities and our business.

  We offer a range of market-competitive total rewards that
  include merit increases, paid holidays, Paid Time Off, and
  incentive bonus programs (unless covered by a collective
  bargaining agreement), medical, dental, vision, short and
  long term disability benefits, 401(k) +match, stock purchase
  plan, life insurance, wellness programs and financial
  education resources, to name a few.

  Elevance Health operates in a Hybrid Workforce Strategy.
  Unless specified as primarily virtual by the hiring manager,
  associates are required to work at an Elevance Health
  location at least once per week, and potentially several
  times per week. Specific requirements and expectations for
  time onsite will be discussed as part of the hiring process.

  The health of our associates and communities is a top
  priority for Elevance Health. We require all new candidates
  in certain patient/member-facing roles to become vaccinated
  against COVID-19 and Influenza. If you are not vaccinated,
  your offer will be rescinded unless you provide an
  acceptable explanation. Elevance Health will also follow all
  relevant federal, state and local laws.

