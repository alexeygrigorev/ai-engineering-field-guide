  Position Title:

  AI-Native Software Engineer Advisor Senior

  Job Description:

  AI-Native Software Engineer Advisor Senior

  PLEASE NOTE: This position is not eligible for current or
  future visa sponsorship

  Location: This role requires associates to be in-office 3
  days per week, fostering collaboration and connectivity,
  while providing flexibility to support productivity and
  work-life balance. This approach combines structured office
  engagement with the autonomy of virtual work, promoting a
  dynamic and adaptable workplace. Alternate locations may be
  considered if candidates reside within a commuting distance
  from an office.

  Please note that per our policy on hybrid/virtual work,
  candidates not within a reasonable commuting distance from
  the posting location(s) will not be considered for
  employment, unless an accommodation is granted as required
  by law. The AI-Native Software Engineer Advisor Senior will
  be responsible for shipping, evaluating, securing, and
  supporting real systems. The ideal candidate is a strong
  engineer who has real hands-on experience using AI to build
  and ship production-quality software. They should be able to
  use AI agents and coding assistants across the SDLC:
  planning, design, codebase analysis, implementation,
  testing, documentation, code review, refactoring,
  deployment, and production support. How you will make an
  impact:

  - Development on agentic AI engineering technology.
  - Daily or weekly use of AI coding tools such as GitHub
    Copilot, Cursor, Claude Code, ChatGPT, Codex-style agents,
    or similar.
  - Model evaluation and quality measurement.
  - Demonstrates knowledge of industry trends, responsible AI,
    data privacy, and secure handling of sensitive
    information.
  - Maintains active relationships with customers to determine
    business requirements, leads requirements gathering
    meetings and reviews designs with the business.
  - Owns the change request process and coordinates with other
    teams as necessary.
  - Develops and owns list of final enhancements.
  - Develops and defines application scope and objectives and
    supervises the preparation of technical and/or functional
    specifications from with programs will be written.
  - Performs technical design reviews and code reviews.
  - Coordinates and manages on-call support and owns the system
    monitoring process.
  - Owns the technical development environment and works on the
    Enterprise team.
  - Leads multiple or large projects and facilitates large group
    JAD sessions for requirements, modeling in several
    disciplines.
  - Leads vendor evaluation and analysis

  Minimum Requirements:

  Requires an BA/BS degree in Information Technology, Computer
  Science or related field of study and minimum of 7  years
  multi platform and/or business and technical applications;
  or any combination of education and experience, which would
  provide an equivalent background. Preferred Skills,
  Capabilities and Experiences:

  - Experience with healthcare, payer, claims, clinical, HIPAA,
    PHI, regulated industry, or enterprise security
    experience.
  - Strong software engineering fundamentals including, cloud-
    native development, APIs and microservices, CI/CD,
    automated testing, and secure SDLC strongly preferred.
  - Experience building or integrating AI agents, tool/function
    calling, RAG, memory, model routing, evaluations,
    guardrails, observability, and secure API/tool access
    strongly preferred.
  - Experience with Amazon Bedrock AgentCore, including
    AgentCore Runtime, Memory, Identity, Gateway, Code
    Interpreter, Browser Tool, Observability, Evaluations, and
    Policy and is strongly preferred.
  - Experience building LLM or SLM applications.
  - Ability to review, test, and harden AI-generated code.
  - Production support experience preferred.

  For candidates working in person or virtually in the below
  locations, the salary* range for this specific position is
  $141,592 to $222,042

  Location: California, Minnesota, Virginia



