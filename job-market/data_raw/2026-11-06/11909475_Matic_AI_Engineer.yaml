description: |
  About Matic Matic is an AI-native clinical intelligence
  platform designed to orchestrate care-to-collection

  workflows the way clinicians actually practice. Through a
  growing suite of modular AI agentic

  solutions, Matic connects clinical documentation, summaries,
  coding, workflow, and follow-up

  into a unified and connected intelligence layer that
  preserves clinical intent, reduces

  fragmentation, and integrates seamlessly within existing
  physician systems. To learn more about

  how Matic orchestrates intelligence across the care-to-
  collection lifecycle, visit maticinside.ai.

  About the role

  We are expanding our awesome engineering team by adding a
  AI/Python engineer to help design, build, and upgrade the
  advanced AI systems behind the Matic platform. Matic is a
  very powerful tool that works across panel management, chart
  preparation, documentation, clinical evidence, coding, inbox
  management, and follow-up to reduce complexity and help care
  flow more naturally. The quality and reliability of what you
  will build has a direct, daily impact on doctors and their
  patients.

  As a growing startup, you'll wear more than one hat. Some
  days you're writing Python for the API layer, others you're
  deep in LLM prompting and evaluation, and others you're
  working directly with a physician to understand why a note
  didn't read the way they expected and fixing it. This is a
  full-time role, 5 days a week, and it suits someone who
  wants ownership over real systems rather than a narrow slice
  of one.

  What you'll do

  Platform & API Engineering

  - Design and build Python endpoints and APIs that power our
    core system.
  - Build and extend agentic frameworks that drive our AI
    workflows.
  - Build integrations between our platform and electronic
    health record (EHR) systems.

  AI Systems & Quality

  - Work with a range of modern LLMs and hosting platforms to
    power our documentation engine.
  - Test AI systems rigorously for quality. We cannot afford AI
    deployments that are broken.
  - Continuously improve model outputs based on real-world
    clinical documentation needs.

  Customer & Clinical Support

  - Work with new customers as we onboard them onto the
    platform.
  - Interact directly with physicians when the AI's
    documentation doesn't match expectations and fix the
    underlying issue.

  Qualifications

  Required

  - Strong Python expertise
  - Practical experience working with LLMs, APIs, and endpoints
  - Rigorous attention to detail and a strong testing mindset;
    our systems operate in clinical environments where errors
    have real consequences, and we hold a strict "don't ship
    broken" standard regardless of how the code was written
  - Fluent English with clear written and verbal communication
    skills — essential when working directly with clinical
    users

  Preferred

  - Experience with Google Cloud Platform
  - Experience with Firebase

  What Success Looks Like

  In your first 90 days, you will have:

  - Shipped Python endpoints and features into our production
    system
  - Contributed meaningfully to our agentic AI frameworks
  - Resolved physician feedback on documentation quality, end to
    end
  - Built a working understanding of our EHR integration
    approach

  Why This Role

  - Join a fast-growing startup with equity grants alongside
    salary
  - Make a meaningful difference in how physicians spend their
    time and how patients are cared for
  - Work across the full stack of a real AI system, not just one
    narrow piece of it
  - Collaborate with a small, sharp team that already spans WA,
    TX, CA, and UT
  - Flexibility to work hybrid from our Dallas HQ or remote from
    anywhere in the US
