description: |
  Job Summary

  In the Clinical AI Devices team, the Software Engineer is
  primarily responsible for building and maintaining software
  in the Clinical AI domain, from wrapping deep learning
  models into containerized medical devices, to integration
  with other systems. This work spans all of the company's
  medical devices, across the main radiology modalities:
  X-Ray, CT, MRI, and Mammography. The focus of the current
  role is at the interface between product logic and the
  underlying serving platform, ensuring that requests are
  correctly validated, routed, and that results are properly
  assembled and returned.



  Essential Duties and Responsibilities

  - Participate in the software development process: design,
    refine, and develop new features, and maintain existing
    ones.
  - Write code, review teammates' code, and contribute to the
    testing framework through automated and manual tests. Work
    with the team lead and product manager to refine
    requirements.
  - Own features and projects end-to-end, from refinement to
    production. Flag risks and bugs by keeping the
    radiologist's workflow in mind. Support service and
    delivery teams with production issues.
  - Ensure compliance with Quality and Regulatory requirements
    throughout the development cycle, including technical
    documentation (e.g. implementation specs), cybersecurity
    processes, and risk analysis.
  - Collaborate with the team on strategic recommendations and
    improvements to technology and business.PLEASE NOTE: This
    is not an exhaustive list of all duties, responsibilities
    and requirements of the position described above. Other
    functions may be assigned, and management retains the
    right to add or change duties at any time.

  Minimum Qualifications, Education and Experience

  - Bachelor's or Master’s Degree in a related field such as
    computer science, biomedical engineering or similar
    (required).

  - Experience (required): at least 5 years of experience in a
    similar or related relevant role

  - At least 5 years of experience working with Java, with
    proficiency in Spring Boot (required).

  - Fluent in English (required).
  - Accustomed to CI/CD practice (required).
  - Familiar with test-driven development and testing frameworks
    like JUnit (required).
  - Experience working with docker, cloud platforms such as GCP
    or AWS, and Kubernetes (required).
  - Experience working with Agentic Coding tools like Claude and
    Cursor (preferred).

  - Experience working with microservices and distributed
    systems (preferred).

  - Experience in the MedTech field, e.g. working with DICOM
    data, AI algorithms, and clinical workflows (preferred).



  What we value

  - Strong analytical mindset.
  - Not afraid of working inside a strong regulatory framework
    and disciplined about testing needs.
  - Ability to make well-reasoned trade-offs between velocity
    and quality, understanding when to work for higher quality
    and when to optimize for time-to-market.
  - You collaborate openly, support your colleagues, and
    contribute to shared success.



   Quality Standards

  - Communicate, cooperate, and consistently function
    professionally and harmoniously with all levels of
    supervision, co-workers, visitors, and vendors.
  - Demonstrate initiative, personal awareness, professionalism
    and integrity, and exercise confidentiality in all areas
    of performance.
  - Follow all local, regional, and country laws concerning
    employment.
  - Follow all DeepHealth policies and procedures.
  - Follow data privacy, compliance, safety and confidentiality
    standards at all times.
  - Practice universal safety precautions.
  - Promote good public relations on the phone and in person.
  - Adapt and willing to learn new tasks, methods, and systems.
  - Report to work regularly as scheduled; consistently punctual
    with respect to working hours, meals and rest breaks, and
    maintain satisfactory personal attendance in accordance
    with DeepHealth guidelines.
  - Complete job responsibilities in a quality and timely
    manner.

  Travel

  This position requires domestic / international travel up to
  10%.



  Working Environment

  Hybrid, remote-friendly

  Based in France (we have offices in Paris and Grenoble) or
  in the Netherlands (we have offices in Rotterdam and
  Amsterdam)



  Salary: Dependent upon experience:

  60,000-80,000 EURO
