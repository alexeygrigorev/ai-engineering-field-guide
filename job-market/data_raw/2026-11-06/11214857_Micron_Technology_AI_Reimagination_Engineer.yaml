description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Our vision is to transform how the world uses
  information to enrich life for all . Micron Technology is a
  world leader in innovating memory and storage solutions that
  accelerate the transformation of information into
  intelligence, inspiring the world to learn, communicate and
  advance faster than ever. As an AI Reimagination Engineer in
  Micron's Generative AI Center of Excellence (GenAI COE), you
  have an outstanding chance to transform how businesses
  function. You will partner with different business areas to
  break down large, manual, multi-step processes and redesign
  them into effective, autonomous systems. This position
  combines process reimagination with AI systems engineering,
  making you a key part of the transformation journey. You
  will collaborate closely with the GenAI COE, IT
  architecture, security, and project teams. You will lead
  projects from the initial redesign to the final build,
  delivering solutions that business teams can adopt and
  scale. Responsibilities:

  - Decompose end-to-end processes: Map current-state flows,
    quantify effort and risk, and lead
    eliminate/simplify/agentify analysis before automation.
  - Architect the agentic solution: Build future-state flows and
    AI architecture, including task and agent decomposition,
    orchestration patterns, tool and data access, memory and
    context strategy, and human-in-the-loop controls.
  - Translate inventions into buildable solutions by developing
    agent workflows, composing prompt and context strategies,
    MCP/connector and integration requirements, and evaluation
    criteria. Follow Micron's "Secure by Design" and data-
    classification standards.
  - Prototype and build: Construct working agentic solutions, or
    direct their build with platform engineers, validating fit
    and value prior to full delivery.
  - Engineer trust and control: Define testable human-in-the-
    loop controls and least-privilege permissions for each
    process step.
  - Drive multi-functional delivery: Collaborate across the
    client function, IT architecture, security, platform
    engineers, and the Enterprise Project Management Office
    (EPMO) through first production release.
  - Measure value and codify patterns: Capture value baselines
    during discovery, support 30/90-day post-release
    measurement, and turn findings into reference flows,
    decomposition patterns, and playbooks. Mentor engineers
    and grow the network of agentic champions.

  Minimum Qualifications:

  - Education: Bachelor's or master's degree in computer
    science, AI/ML, engineering, or related field, or
    equivalent experience blending technical delivery with
    business process work.
  - Hybrid Experience: Proven track record in both decomposing
    complex business processes and crafting or building
    technical solutions.
  - Agentic Delivery: 8+ years of overall experience and 3+
    years in AI/ML. Recently, hands-on experience building
    agentic or LLM-based systems.

  Preferred Qualifications:

  - Process Redesign: Experience leading workshop-based process
    redesign and translating findings into requirements.
    Familiar with AI governance, responsible-AI, security
    fundamentals, and validation/testing strategies for
    autonomous behavior.
  - Technical Proficiency: Hands-on experience with enterprise
    AI and automation platforms, and proficiency across
    Python, .NET/C#, SQL, and APIs. Depth in agent
    orchestration and multi-agent development, context
    management, and long-horizon tasks.
  - Communication: Excellent facilitation, written, and
    executive interpersonal skills. Proficient in running
    discovery with business leaders and driving alignment
    across business, engineering, and risk teams.

