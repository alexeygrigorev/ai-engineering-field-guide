description: |
  Python Backend Engineer (AI Security)

  Summary

  We are seeking a highly skilled Python Backend Engineer
  specializing in AI Security to join our IT Services team. In
  this pivotal role, you will architect and maintain robust
  backend systems that secure artificial intelligence
  workflows, ensuring data integrity and system resilience.
  The position demands a deep understanding of modern Python
  frameworks, database management, and the specific challenges
  associated with securing Large Language Model (LLM)
  integrations. You will play a critical part in designing
  scalable solutions that leverage vector search capabilities
  and advanced data modeling, directly contributing to the
  safety and efficiency of our AI-driven products.

  Responsibilities

  - Design and implement secure backend services using Python
    3.11+, focusing on asynchronous processing and high-
    performance API development.
  - Develop and maintain database schemas utilizing SQLModel and
    SQLite, ensuring efficient data flow and schema
    management.
  - Architect system components following C4 principles,
    creating clear Data Flow Diagrams (DFDs) to visualize and
    secure data interactions.
  - Integrate and manage LLM APIs from providers such as OpenAI
    and Anthropic, ensuring secure and reliable communication.
  - Implement vector search functionalities and manage
    embeddings using ChromaDB to support advanced AI retrieval
    tasks.
  - Build comprehensive test suites using pytest and pytest-
    asyncio to validate the reliability and security of
    asynchronous code.
  - Collaborate with cross-functional teams to refine
    architecture and ensure alignment with security best
    practices for AI applications.

  Requirements

  Requirements:

  - 6-9 years of professional experience in backend development
    within the IT Services sector.
  - Proficiency in Python 3.11+ with a strong command of backend
    development principles.
  - Extensive experience with FastAPI, including the use of
    async/await patterns and asyncio for high-concurrency
    applications.
  - Solid expertise in SQLModel and SQLite, with a proven
    ability to manage complex database schemas.
  - Demonstrated knowledge of testing frameworks, specifically
    pytest and pytest-asyncio.
  - Familiarity with C4 Architecture methodology and the ability
    to produce detailed Data Flow Diagrams.
  - Hands-on experience with AI technologies, including working
    with embeddings, vector search, and ChromaDB.
  - Practical experience integrating and managing LLM APIs from
    major providers like OpenAI or Anthropic.
