description: |
  We are looking for a highly skilled Senior Full Stack
  Developer with strong hands-on experience in MERN stack
  development, Epic EHR/EMR integrations, and modern AI/GenAI
  technologies. The ideal candidate will be responsible for
  designing, developing, integrating, and maintaining scalable
  healthcare applications that interact with Epic and other
  healthcare systems. The candidate should have a strong
  understanding of healthcare interoperability standards such
  as FHIR and HL7, along with experience working with APIs,
  clinical data, authentication, and secure healthcare
  integrations. In addition to strong full-stack engineering
  skills, the candidate should have practical hands-on
  experience with AI/GenAI, including integrating AI
  capabilities into applications, working with LLMs, AI APIs,
  prompt engineering, RAG, or AI-assisted workflows. The
  candidate must be comfortable taking ownership of technical
  assignments independently and participating in architecture
  and technical discussions the stakeholders.

  Key Responsibilities:

  1. Full Stack Development – MERN

  - Design, develop, and maintain scalable web applications
    using:
  - MongoDB
  - Express.js
  - React.js
  - Node.js
  - Develop reusable, maintainable, and secure frontend and
    backend components.
  - Build responsive and user-friendly healthcare application
    interfaces using React.
  - Develop scalable RESTful APIs and backend services using
    Node.js.
  - Implement appropriate application architecture, design
    patterns, validation, error handling, logging, and
    exception management.
  - Optimize application performance across frontend, backend,
    and database layers.
  - Participate in code reviews and ensure adherence to coding
    standards and engineering best practices.

  2. Epic Integration & Healthcare Interoperability

  - Design and implement integrations between applications and
    Epic EHR/EMR.
  - Develop and consume Epic APIs and healthcare
    interoperability interfaces.
  - Work extensively with FHIR-based APIs and resources for
    exchanging healthcare information.
  - Understand and work with healthcare data such as:
  - Patient demographics
  - Patient/clinical records
  - Encounters
  - Appointments
  - Providers
  - Medications
  - Allergies
  - Diagnoses/conditions
  - Lab results
  - Clinical observations
  - Work with HL7 interfaces and healthcare integration
    workflows.
  - Understand Epic integration concepts such as FHIR APIs,
    SMART on FHIR, OAuth 2.0, and Epic App Orchard.
  - Build reliable workflows for retrieving, transforming,
    validating, and synchronizing healthcare data between Epic
    and external applications.
  - Handle API authentication, authorization, token management,
    error handling, retries, rate limits, and integration
    failures.
  - Troubleshoot and resolve issues across Epic and application
    integration layers.
  - Collaborate with healthcare domain experts, product teams,
    and client stakeholders to understand clinical workflows
    and integration requirements.

  3. AI / Generative AI Development

  - Design and implement AI/GenAI capabilities within healthcare
    applications.
  - Work hands-on with LLMs and AI APIs to build practical
    business and healthcare use cases.
  - Experience integrating models/services from platforms such
    as OpenAI, Azure OpenAI, or equivalent is highly
    desirable.
  - Develop AI-powered features such as:
  - Intelligent search
  - Summarization
  - Clinical/document summarization
  - Natural-language interfaces
  - Knowledge assistants
  - Content generation
  - Intelligent classification
  - Data extraction
  - AI-powered workflow automation
  - Develop and optimize prompts and workflows using prompt
    engineering techniques.
  - Build RAG (Retrieval-Augmented Generation) solutions using
    appropriate vector databases/search technologies.
  - Understand concepts such as embeddings, vector search,
    context management, hallucination mitigation, and LLM
    evaluation.
  - Integrate AI capabilities securely into existing
    applications and APIs.
  - Evaluate AI-generated responses for accuracy, reliability,
    relevance, and safety.
  - Identify opportunities where AI can improve operational
    efficiency, user experience, and productivity.

  4. Healthcare Security & Compliance

  - Develop applications following HIPAA and healthcare security
    best practices.
  - Ensure appropriate protection of PHI/PII throughout
    application and integration workflows.
  - Implement secure authentication and authorization
    mechanisms.
  - Work with OAuth 2.0, JWT, RBAC, and secure API practices.
  - Ensure sensitive healthcare data is appropriately protected
    in transit and at rest.
  - Follow secure coding practices and contribute to
    vulnerability remediation.
  - Understand the security implications of using AI/LLMs with
    healthcare data.
  - Ensure AI solutions are designed with appropriate controls
    around PHI, data privacy, access, logging, and
    auditability.

  5. API & Integration Engineering

  - Design and develop scalable REST APIs and integration
    services.
  - Integrate Epic and other third-party healthcare systems.
  - Implement API validation, error handling, retries, logging,
    monitoring, and observability.
  - Build asynchronous and event-driven workflows where
    required.
  - Transform healthcare data between different formats and
    systems.
  - Troubleshoot API and integration issues across development,
    staging, and production environments.

  6. Performance, Quality & Production Support

  - Identify and resolve application performance bottlenecks.
  - Optimize API response times, database queries, and frontend
    performance.
  - Troubleshoot production issues and perform Root Cause
    Analysis (RCA).
  - Implement logging, monitoring, and alerting mechanisms.
  - Write unit, integration, and API tests.
  - Participate in production deployments and release
    activities.
  - Ensure applications remain stable, scalable, secure, and
    maintainable.

  7. Collaboration & Technical Ownership

  - Work directly with the product team, engineering,
    healthcare, and business stakeholders.
  - Independently analyze requirements and convert them into
    technical solutions.
  - Participate in technical design and architecture
    discussions.
  - Provide effort estimates and identify technical risks and
    dependencies.
  - Collaborate with frontend, backend, QA, DevOps, product, and
    healthcare integration teams.
  - Mentor junior developers and provide technical guidance
    where required.
  - Take ownership of assigned features from requirement
    analysis through development, testing, deployment, and
    production support.

  Must-Have Skills:

  Full Stack Development

  - 5+ years of professional software development experience.
  - Strong hands-on expertise in Node.js, React.js, Express.js,
    and MongoDB.
  - Strong JavaScript/TypeScript skills.
  - Excellent understanding of REST APIs and modern web
    application architecture.
  - Experience building scalable and maintainable backend
    services.

  Epic & Healthcare Integration

  - Strong hands-on experience with Epic EHR/EMR integration.
  - Experience working with Epic APIs / FHIR APIs.
  - Strong understanding of HL7 and FHIR.
  - Experience with SMART on FHIR and OAuth 2.0.
  - Understanding of healthcare data structures and clinical
    workflows.
  - Experience troubleshooting healthcare system integrations.

  AI / GenAI

  - Strong practical, hands-on experience with AI/Generative AI.
  - Experience integrating LLMs or AI APIs into software
    applications.
  - Experience with prompt engineering.
  - Hands-on experience with RAG, embeddings, vector search, or
    AI agents is highly desirable.
  - Ability to identify and implement meaningful AI use cases
    rather than simply consuming AI tools for coding
    assistance.
  - Understanding of AI security, privacy, hallucination,
    evaluation, and responsible AI practices.

  Healthcare & Security

  - Good understanding of HIPAA, PHI, and healthcare data
    security.
  - Experience implementing secure APIs and authentication
    mechanisms.
  - Understanding of OAuth2, JWT, RBAC, and secure token
    management.

  Good-to-Have Skills:

  - Experience with Epic App Orchard.
  - Experience with SMART on FHIR application development.
  - Experience with additional healthcare interoperability
    standards and technologies.
  - Experience with Azure / AWS cloud platforms.
  - Experience with Docker and CI/CD pipelines.
  - Experience with microservices architecture.
  - Experience with message queues or event-driven architecture.
  - Experience with PostgreSQL, MySQL, or SQL Server in addition
    to MongoDB.
  - Experience with AI frameworks such as LangChain, LangGraph,
    Semantic Kernel, or equivalent.
  - Experience with vector databases/search technologies such as
    Azure AI Search, Pinecone, Weaviate, or similar.
  - Experience developing AI-powered healthcare applications.
  - Exposure to VAPT, OWASP, secure coding, and cloud security.

  About TechAhead:

  TechAhead is a global digital transformation company with a
  strong presence in the USA and India. We specialize in AI-
  first product design thinking and bespoke development
  solutions. With over 16 years of proven expertise, we have
  partnered with Fortune 500 companies and leading global
  brands to drive digital innovation and deliver excellence.
  At TechAhead, we are committed to continuous learning,
  growth and crafting tailored solutions that meet the unique
  needs of our clients.

  Join us to shape the future of digital innovation worldwide
  and drive impactful results with cutting-edge AI tools and
  strategies!
