description: |
  The Opportunity As a Senior Associate AIT AI Developer you
  will develop software solutions within our Software and
  Product Innovation practice, using software engineering
  methods to design, code, test, and refine applications that
  support client needs and business performance. As a Senior
  Associate you will analyze complex problems, manage assigned
  workstreams, build meaningful client connections, guide
  junior team members, and navigate ambiguity while deepening
  your technical skills and business context. In this role at
  PwC, you will apply modern development tools and
  methodologies, interpret feedback, use critical thinking to
  break down complex concepts, and contribute to deliverables
  that align with project objectives and client service
  expectations. Responsibilities
  - Developing AI-enabled software solutions that support
    Assurance technology platforms and client service
    applications
  - Designing, coding, and testing application components using
    Python, APIs, and modern software engineering methods
  - Integrating AI capabilities into software workflows to
    improve automation, reliability, performance, and
    maintainability
  - Reviewing code, applying coding standards, and
    troubleshooting defects across the application lifecycle
  - Building and maintaining scalable software features using
    cloud, DevOps, and continuous integration and continuous
    delivery tools
  - Interpreting business requirements and translating them into
    technical designs that align with broader project
    objectives
  - Collaborating with team members to analyze complex problems,
    resolve issues, and adjust solutions as priorities change
  - Guiding junior team members through technical questions,
    feedback, and day to day development activities
  - Documenting technical decisions, development progress, and
    testing results to support delivery transparency
  What You Must Have
  - At least a Bachelor's degree
  - At least 2 years of experience
  What Sets You Apart
  - AI development experience supporting software engineering
    engagements
  - Developing production-ready AI-enabled software solutions
    using Python, API integrations, LLM application
    development, prompt engineering, RAG patterns, and cloud-
    based AI services
  - Integrating AI models into applications while applying
    secure coding, testing, version control, and software
    development best practices
  - Python and API development skills for scalable applications
  - Experience applying CI/CD, testing, and code review
    practices
  - Ability to interpret data into insights and recommendations
  - Experience translating client needs into technical
    deliverables
  - Growing understanding of AI-human collaboration and
    application design
