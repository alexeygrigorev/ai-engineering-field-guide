  Your Skills and Expertise

    - Bachelor’s degree in computer science, Software Engineering,
      AI, or related field and 7+ years of professional
      experience in Machine Learning, Artificial Intelligence,
      Data Science, or Ai Engineering or a master’s degree
      with relevant industry experience and 5+ years of
      experience.
    - Strong hands-on expertise in Python with proven experience
      designing, developing, deploying, and optimizing
      scalable Machine Learning and AI solutions in production
      environments, including predictive modelling,
      forecasting, optimization, feature engineering, model
      evaluation, monitoring, and lifecycle management using
      cloud platforms such as Azure, Data Bricks and AWS.
    - Experience building and deploying Generative AI applications
      and Agentic AI workflows in production using frameworks
      such as Lang Graph, Lang Chain, Auto Gen, Crew AI, or
      similar technologies production grade in AWS / Azure
      cloud.
    - Practical experience with Large Language Models (LLMs),
      Prompt Engineering, RAG, AI evaluation techniques, and
      responsible AI practices.

  Preferred Qualifications:

    - Hands-on experience developing AI/ML solutions for Supply
      Chain, Healthcare, or other enterprise domains.
    - Experience implementing MLOps and LLMOps practices,
      including model versioning, CI/CD pipelines, automated
      deployment, monitoring, observability, and AI lifecycle
      management.
    - Strong understanding of system design patterns,
      microservices architecture, APIs, containerization
      (Docker), Kubernetes, and infrastructure automation.
    - Familiarity with AI governance, model explainability, data
      security, privacy, and Responsible AI practices.

