  Job Description:

  Role: Senior AI-ML Engineer / Data Scientist,

  3M Health Care is now Solventum

  At Solventum, we enable better, smarter, safer healthcare to
  improve lives. As a new company with a long legacy of
  creating breakthrough solutions for our customers’ toughest
  challenges, we pioneer game-changing innovations at the
  intersection of health, material and data science that
  change patients' lives for the better while enabling
  healthcare professionals to perform at their best. Because
  people, and their wellbeing, are at the heart of every
  scientific advancement we pursue.

  We partner closely with the brightest minds in healthcare to
  ensure that every solution we create melds the latest
  technology with compassion and empathy. Because at
  Solventum, we never stop solving for you.

  The Impact You’ll Make in this Role

  As an Senior AI/ML Engineer – Supply Chain AI & Intelligent
  Automation, you will design, develop, and deploy Artificial
  Intelligence (AI), Machine Learning (ML), and Generative AI
  solutions that improve Supply Chain across functions. You
  will build scalable, production-ready AI applications that
  enable intelligent decision-making, automation, and
  operational efficiency.

  In this role, you will develop Machine Learning models, AI
  Agents, and cloud-native AI solutions using AWS and Azure to
  solve complex supply chain challenges.

  You will collaborate with Supply Chain stakeholders, Lead
  Data Scientists, Cloud Architects, and Analytics Teams to
  translate business requirements into reliable, scalable AI
  solutions that deliver measurable business value.

  Key Responsibilities

  Machine Learning Solution Development

  - Design, develop, and deploy scalable Machine Learning models
    and AI solutions to solve complex Supply Chain business
    challenges. Build end-to-end ML pipelines for forecasting,
    optimization, predictive analytics, anomaly detection, and
    intelligent automation, ensuring models are production-
    ready, reliable, and scalable.
  - Design, develop, and deploy scalable Machine Learning models
    and AI solutions to solve complex Supply Chain business
    challenges. Build end-to-end ML pipelines for forecasting,
    optimization, predictive analytics, anomaly detection, and
    intelligent automation, ensuring models are production-
    ready, reliable, and scalable.

  Agentic AI & Generative AI Engineering

  - Design, build, test, and deploy AI Agents and multi-agent
    systems using frameworks such as Lang Graph, Lang Chain,
    Auto Gen, Crew AI, or similar technologies. Develop
    intelligent workflows that leverage LLMs, tool
    integration, memory, and orchestration to automate
    business processes and improve operational decision-
    making.
  - Design, build, test, and deploy AI Agents and multi-agent
