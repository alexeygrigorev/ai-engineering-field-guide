  Enterprise Data Engineering & AI Integration

  - Develop robust data ingestion, transformation, and feature
    engineering pipelines to process structured, semi-
    structured, and unstructured enterprise data. Integrate
    enterprise knowledge repositories, knowledge graphs,
    vector databases, and intelligent document processing
    solutions to enable contextual AI insights, enhance
    retrieval capabilities, and support scalable Machine
    Learning and Generative AI applications.
  - Develop robust data ingestion, transformation, and feature
    engineering pipelines to process structured, semi-
    structured, and unstructured enterprise data. Integrate
    enterprise knowledge repositories, knowledge graphs,
    vector databases, and intelligent document processing
    solutions to enable contextual AI insights, enhance
    retrieval capabilities, and support scalable Machine
    Learning and Generative AI applications.

  Cloud AI Deployment & MLOps

  - Deploy and manage AI and Machine Learning applications on
    AWS and Microsoft Azure. Build and maintain MLOps and
    LLMOps pipelines, including model versioning, CI/CD,
    automated deployment, monitoring, and retraining to ensure
    scalable, secure, and high-performing production AI
    systems.
  - Deploy and manage AI and Machine Learning applications on
    AWS and Microsoft Azure. Build and maintain MLOps and
    LLMOps pipelines, including model versioning, CI/CD,
    automated deployment, monitoring, and retraining to ensure
    scalable, secure, and high-performing production AI
    systems.

  Model Performance & AI Optimization

  - Evaluate, monitor, and optimize Machine Learning models and
    Large Language Models (LLMs) using appropriate performance
    metrics. Improve model accuracy, reduce inference latency,
    optimize cloud resource utilization, and implement
    responsible AI practices to ensure reliable and cost-
    effective AI solutions.
  - Evaluate, monitor, and optimize Machine Learning models and
    Large Language Models (LLMs) using appropriate performance
    metrics. Improve model accuracy, reduce inference latency,
    optimize cloud resource utilization, and implement
    responsible AI practices to ensure reliable and cost-
    effective AI solutions.

  Technical Collaboration & Engineering Excellence

  - Partner with Supply Chain stakeholders, Data Scientists,
    Software Engineers, Cloud Architects, Product Managers,
    and Digital Transformation teams to translate business
    requirements into scalable AI-ML solutions. Establish
    engineering standards, contribute to architecture and code
    reviews, create technical documentation.
  - Partner with Supply Chain stakeholders, Data Scientists,
    Software Engineers, Cloud Architects, Product Managers,
    and Digital Transformation teams to translate business
    requirements into scalable AI-ML solutions. Establish
