title: (Senior) Product Engineer – AI (m/f/d) – Remote
company: Prodlane GmbH
location: Berlin, DEU
remote: true
work_type: FULL_TIME
company_size: 30 Employees
description: |
  What we do MAIA is an AI platform for companies. With MAIA,
  teams search their internal data and embed agents deep into
  their processes. We help companies use AI not just in
  individual departments, but across the entire organisation.
  On a technical level, this means: we build a GenAI
  application with our own agent systems, RAG pipelines and
  agent-based workflows, connect our customers' external
  systems and analyse their data. We use the best available
  models, operated in the EU, and make them reliable for
  demanding work with large, complex datasets. Many industrial
  companies have been using MAIA intensively for years.
  Following our successful 2026 funding round, we are now
  taking MAIA to a broader market. MAIA has been developed in
  Leipzig since 2021. What you'll do As a Product Engineer,
  you own features from start to finish: from conversations
  with customers and concept work through to implementation
  and continuous improvement in production. What you can work
  on: * Understanding customers and the market. You talk to
  users, join customer meetings and analyse usage data. This
  way, you find out where MAIA can help most in people's daily
  work. You work closely with product management and customer
  success. * From problem to concept. You write concepts,
  build prototypes to test ideas quickly, and slice features
  so they reach users early. * Building across the full stack.
  You write the implementation plan, let coding agents
  implement it, and own architecture and quality, from the
  data model to the user interface. * AI that people
  understand. You shape how people work with MAIA: asking
  questions, providing context, letting agents complete multi-
  step tasks and following their results. * Measuring and
  improving. After a release, you check whether a feature is
  used and actually helps, and you keep improving it based on
  feedback, usage data and evals. What we're looking for *
  Solid software engineering. You have built products that
  people use every day and operated them in production, across
  backend and frontend. You recognise weak architecture even
  when a coding agent wrote it. * Very strong in at least one
  of our languages. TypeScript, Python or Go, ideally one of
  the statically typed ones. You don't need all three. You'll
  get up to speed in the others. * Product experience. You
  have talked to customers, questioned requirements and taken
  features from the first idea to daily use. You listen
  closely and recognise the problem behind a request. * A feel
  for good usability. You notice when an interface overwhelms
  people, and you'd rather build a simple solution that people
  understand than a powerful one that nobody finds. * At home
  in the LLM ecosystem. You have built applications with LLMs,
  professionally or in complex personal projects, and you know
  their quirks: answers vary, take time, and agents fail in
  unexpected places. You build products that deal with this
  honestly. * Measure, don't guess. You check whether a
  feature works using usage data, feedback and evals. You
  build the simplest solution that solves the problem. *
  Agentic engineering. Coding agents are part of your daily
  work. You write plans that others review and that coding
  agents can build on, you review the results critically, and
  you know where agents help and where they don't. * Remote-
  ready. You communicate proactively, document your work so
  others can follow it, and move things forward without
  constant coordination. * Clear communication. People
  understand your concepts on first read. You enjoy talking to
  customers as much as to engineers. You are fluent in
  English. German is a strong plus, as many of our customer
  conversations are in German. This role has no people
  management responsibility. Whether you join at regular or
  senior level is something we'll discuss openly with you
  after the technical interview at the latest. Working at MAIA
  We share a common goal: building a really great product.
  Everyone takes ownership of their own area. We enjoy our
  work and are proud of what our customers achieve with MAIA.
  Paths are short and decisions are made quickly. In the
  engineering team, we critically question how we develop and
  continuously improve our processes, especially in agentic
  development. Much of the team works together in our office
  in Leipzig, centrally located between the city centre and
  the zoo, where we cook together almost every day. You work
  remotely from anywhere in Germany. You need to live in
  Germany for this role. Twice a year, we meet in person for
  team events, and from time to time there are team days in
  Leipzig. When your day starts is up to you. * Access to the
  latest frontier models and coding agents * Support for
  training that fits your professional development * Access to
  a Wellpass membership Compensation The annual gross salary
  is €75,000 to €95,000\. Where you fall within this range
  depends on your level. We'll discuss this after the
  technical interview at the latest. On top of that, you
  receive a virtual share in our VSOP. Application and next
  steps You don't need a cover letter. Send us your CV and
  answer one question in a few sentences of your own: Why do
  you want to help shape MAIA? We work with AI every day. For
  this answer, though, your own perspective is what counts. So
  please write it yourself. Short and unpolished is fine. If
  there's a fit, you'll have a 30-minute intro call, a
  90-minute technical interview that also covers product
  decisions and a final conversation with our management.
  After each step, you'll usually hear from us within two
  business days. Our goal is a decision in about three weeks.
  We look forward to your application.
