description: |
  Fynd is a frontier technology company. We started at the
  intersection of technology and retail because that is where
  technology was the least available. Over the years, we
  became one of India’s largest retail technology platforms.
  But retail was the entry point, not the boundary.

  Today, Fynd builds intelligent software that runs business
  operations. Not tools that help people work faster, but
  systems that absorb entire functions: manufacturing,
  marketing, logistics, commerce, quality control. We sit
  inside our customers’ businesses, harvest deep domain
  context, and build AI systems that operate autonomously. We
  are expanding from retail into manufacturing, generative
  media, physical AI, and healthcare.

  Role Overview:

  Own the design, development, and operation of scalable
  backend services and AI-enabled capabilities that power core
  product experiences. This role is critical in building
  reliable, high-performance systems, strengthening production
  health through observability and incident response, and
  translating complex business needs into resilient
  engineering solutions.

  What will you do at Fynd?

  - Design and develop backend services, APIs, and data models
    using Python and modern application frameworks.
  - Build and maintain scalable, secure, and high-availability
    systems that support product growth and operational
    efficiency.
  - Implement asynchronous processing, background jobs, and
    event-driven workflows to improve throughput and
    responsiveness.
  - Contribute to AI engineering efforts by integrating agentic
    AI capabilities into backend workflows and product
    features.
  - Monitor production systems, improve observability, and
    support incident response, root-cause analysis, and post-
    incident remediation.
  - Optimize service performance, reliability, and resource
    usage through profiling, tuning, and engineering best
    practices.
  - Collaborate with product, platform, and engineering teams to
    deliver robust technical solutions from concept to
    production.
  - Participate in deployment, troubleshooting, and operational
    support across containerized and cloud-native
    environments.

  Some specific requirements

  - Bachelor's degree in Computer Science, Engineering, or a
    related field
  - 2-6 years of experience in backend or fullstack software
    development
  - Strong proficiency in Python and building production-grade
    APIs
  - Experience with scalable backend systems, data modeling, and
    asynchronous processing
  - Hands-on experience with production operations, monitoring,
    and debugging
  - Ability to design resilient systems and contribute to
    incident resolution

  Good to have

  - Experience building AI-enabled or agentic AI features
  - Familiarity with Kubernetes, Docker, and cloud-native
    infrastructure
  - Experience with observability stacks such as Grafana,
    Prometheus, or similar tools
  - Exposure to MongoDB and performance optimization in
    distributed systems
  - Understanding of fullstack development and product-facing
    engineering

  What do we offer?

  Growth

  At Fynd, growth is limitless. We nurture a culture that
  encourages innovation, embraces challenges, and supports
  continuous learning. As we expand into new product lines and
  global markets, we’re seeking talented individuals eager to
  grow with us.

  We believe in empowering our people to take ownership, lead
  with confidence, and shape their careers.

  - Learning Wallet: Enrol in external courses or certifications
    to upskill—we’ll reimburse the costs to support your
    development.

  Culture

  We believe in building strong teams and lasting connections.

  - Regular community engagement and team-building activities
  - Biannual events to celebrate achievements, foster
    collaboration, and strengthen our workplace culture

  Wellness

  Your well-being is our priority. Comprehensive Mediclaim
  policy for you, your spouse, children, and parents

  Work Environment

  We thrive on collaboration and creativity. Our teams work
  from the office five days a week to encourage open
  communication, teamwork, and innovation.

  Join us to be part of a dynamic environment where your ideas
  make an impact!
