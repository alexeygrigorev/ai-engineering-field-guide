title: Generative AI Engineer - Freshers 2026/27 (Computer Science or AI Only)
company: Digitals AI
location: Hyderabad, IND
work_type: FULL_TIME
company_size: 12 Employees
description: |
  Digitals AI Inc. is seeking talented and enthusiastic
  Computer Science Freshers, Engineering Graduates, and Junior
  AI Engineers to join our Generative AI development team.

  This opportunity is open to fresh graduates and
  professionals with 0–3 years of experience who are
  passionate about Artificial Intelligence, Python
  programming, Large Language Models (LLMs), and modern
  software development.

  You will work on real-world AI-powered SaaS applications,
  intelligent AI agents, conversational AI, Retrieval-
  Augmented Generation (RAG), and enterprise automation
  solutions.

  We welcome candidates with strong programming fundamentals,
  academic projects, internships, or hands-on experience in AI
  development.

  Key Responsibilities

  - Develop and integrate Generative AI applications using LLMs
    and modern AI frameworks.
  - Build backend services and REST APIs using Python, FastAPI,
    Flask, or Django.
  - Develop AI chatbots, intelligent agents, and automation
    workflows.
  - Implement RAG pipelines, semantic search, and vector
    database integrations.
  - Integrate OpenAI, Anthropic Claude, Google Gemini, and open-
    source AI models.
  - Work with LangChain, LangGraph, LlamaIndex, and other AI
    development frameworks.
  - Support deployment of AI applications on AWS cloud
    infrastructure.
  - Implement prompt engineering, testing, debugging, and
    performance optimization.
  - Collaborate with software engineers, product managers, and
    AI development teams.
  - Write clean, maintainable, and production-ready code.

  Requirements

  - Bachelor's or Master's degree in Computer Science,
    Information Technology, Artificial Intelligence, Machine
    Learning, Data Science, or a related discipline.
  - Freshers, recent graduates, and candidates with up to 3
    years of experience are eligible.
  - Strong fundamentals in Python programming, data structures,
    and problem-solving.
  - Basic understanding of Generative AI, LLMs, NLP, and machine
    learning concepts.
  - Knowledge of REST APIs and backend development frameworks.
  - Familiarity with Git, databases, and software development
    practices.
  - Good analytical, communication, and teamwork skills.
  - Passion for learning and building innovative AI
    applications.
