description: |
  At Securonix, we’re on a mission to secure the world by
  staying ahead of cyber threats, reinforcing all layers of
  our platform with AI capabilities. Our Securonix “ThreatQ”
  platform is a cyber threat intelligence (CTI) platform
  designed to help organizations collect, prioritize, analyze,
  and operationalize threat intelligence at scale. It acts as
  a centralized intelligence hub that integrates data from
  multiple internal and external sources, enabling security
  teams to turn raw threat data into actionable insights.



  Securonix is proud to be a cybersecurity unicorn and
  featured in CRN's 2024 Security 100 list. Backed by Vista
  Equity Partners, one of the largest private equity firms
  with over $100 billion in assets under management, we have a
  unique advantage in driving innovation and growth. With a
  global footprint, we serve more than 1,000 customers
  worldwide, including 10% of the Fortune 100. Our network of
  150+ partners and Managed Security Service Providers (MSSPs)
  enables us to deliver unmatched security solutions on a
  global scale.



  Join us as we redefine cybersecurity, innovate fearlessly,
  and grow together as one team.



  Responsibilities:

  - Lead architecture and design for major platform
    capabilities, translating product and customer needs into
    pragmatic, secure, and scalable technical plans.

  - Contribute to the evolution of ThreatQ’s service, data, and
    integration architecture, balancing near-term delivery
    with long-term operability and maintainability.

  - Design for scale across high-volume threat data ingestion,
    enrichment, search, analysis, and operational workflows;
    identify and address performance and reliability
    constraints.

  - Remain hands-on in implementation, including complex or
    high-impact changes, and establish a high bar for code
    quality, testing, observability, and operational
    readiness.

  - Provide technical leadership across teams through design
    reviews, clear technical proposals, sound trade-off
    decisions, and alignment on shared engineering standards.

  - Partner with product managers, security analysts, UX,
    security, and platform teams to clarify problems, define
    technical requirements, and deliver customer-focused
    outcomes.

  - Improve system reliability and service ownership through
    capacity planning, performance analysis, incident
    learning, risk reduction, and lifecycle management.

  - Guide the adoption of event-driven patterns, APIs, and cloud
    and on-prem deployment practices that support dependable
    integrations and customer environments.
  - Mentor engineers and grow technical capability through
    feedback, pairing, knowledge sharing, and support for
    sound independent decision-making.



  Required Skills:

  - 10-12 years of professional software engineering experience
    and a bachelor’s degree in computer science or a related
    field, or equivalent practical experience.

  - Demonstrated experience shaping architecture and delivering
    complex software across multiple services, teams, or
    product areas.

  - Strong hands-on experience with PHP (including Laravel)
    and/or Python, and a solid grounding in object-oriented
    design and software engineering fundamentals.

  - Experience designing and operating data-intensive systems
    using SQL and databases or search technologies such as
    MariaDB, MongoDB, Redis, and Solr.

  - Working knowledge of front-end technologies such as React,
    TypeScript, HTML, and CSS, sufficient to contribute to
    full-stack design and delivery.

  - Experience with distributed or microservices architectures,
    RESTful APIs, JSON, and asynchronous processing or
    messaging systems such as RabbitMQ.

  - Experience with automated testing and quality practices
    using tools such as PHPUnit, pytest, or Jest.

  - Experience with CI/CD, Git-based collaboration, containers,
    and production operations; familiarity with Docker and
    Kubernetes.

  - Experience designing or supporting cloud infrastructure on
    AWS and infrastructure as code with Terraform; on-premises
    Kubernetes such as RKE2 is an advantage.

  - Ability to communicate architectural choices and trade-offs
    clearly, build alignment across teams, and influence
    without relying on formal authority.

  - Experience working in Agile product engineering
    environments.



  AI Tools & Agent Integration Experience:

  - Experience using AI-powered developer tools (e.g., coding
    assistants, internal copilots, workflow automation) to
    improve engineering productivity, code quality, and
    development efficiency.

  - Experience designing, prototyping, and integrating AI agents
    and intelligent services into internal systems and
    customer-facing products.

  - Experience collaborating with product, security, and
    platform teams to incorporate AI capabilities that meet
    enterprise requirements for reliability, security, and
    scalability.

  - Experience mentoring or guiding engineers on effective use
    of AI tools, prompt engineering techniques, and practical
    evaluation of AI-driven features in production
    environments.



  Securonix provides equal employment opportunities (EEO) to
  all employees and applicants for employment without regard
  to race, color, religion, gender, sexual orientation, gender
  identity, national origin, age, disability, genetic
  information, marital status, amnesty or status as a covered
  veteran in accordance with applicable federal, state and
  local laws.
