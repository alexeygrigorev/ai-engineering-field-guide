description: |
  At Commure, we're building the AI Operating System for
  healthcare, the foundation that defines how care is
  delivered, documented, and financed. Our platform spans the
  full care journey: Ambient AI and Dictation eliminating
  documentation burden at the point of care, intelligent
  Agents automating patient and revenue workflows, and
  autonomous RCM processing billions in claims, all on a
  single AI-native platform integrated with 60+ EHRs.

  Healthcare carries a $1 trillion administrative burden and
  we're at the center of transforming it. Today, 500,000+
  clinicians across 500+ healthcare organizations nationwide
  trust Commure to handle $25B+ in annual claims and support
  over 200 million patient interactions. Our latest $70M raise
  at a $7B valuation reflects the confidence the market has
  placed in this mission. We've also been named to the Fortune
  Future 50 list and the 2026 AI Breakthrough Awards for
  “Overall NLP Company of the Year.”

  Our team works directly alongside clinicians, not through
  layers of process, which means the gap between what you
  build and its impact on patient care is immediate. We move
  fast, deploy daily, and take full ownership from early
  thinking to production. If you're energized by hard
  problems, high stakes, and a team that holds itself to a
  high bar, you'll find your people here.

  The future of healthcare is being built right now. Come
  deliver this transformation.

  About the Role

  Commure Ambient is our Ambient AI platform. A clinician
  records the visit, and a finished note lands in their EHR,
  along with ICD codes, orders, a Patient 360 summary, and
  carried-forward history on supported systems. For a
  physician, that means charting is done when the visit is
  done.

  Practices decide on Ambient by trying it: their own
  providers, their own patients, inside their own EHR. As a
  Sales Engineer on the Ambient team, you'll own those pilots
  from the first scoping call through a signed contract and
  hand-off to implementation.

  This is a presales role. You'll partner with Account
  Executives on Commure Ambient pilots and on advanced AI
  pilots with healthcare practices: coding, orders, Patient
  360, carry forward, and pre-visit summaries, running live
  inside ten EHRs (athenahealth, eClinicalWorks, AdvancedMD,
  ModMed, NextGen, Practice Fusion, WebPT, Prompt, iKnowMed,
  and Meditech Expanse). You'll typically have several pilots
  in flight at once, and you'll work closely with Engineering,
  our template team, and our implementation and operations
  teams to make each one succeed.

  What You'll Do

  - Scope pilots. Lead the technical scoping call for each
    pilot, working directly with the providers who'll use
    Ambient and the decision makers evaluating it. Capture
    specialty, note types, EHR, and workflow, and turn it into
    a technical scope the deal can move forward on.
  - Build EHR integrations. Stand up the integration for each
    pilot across browser automation, DOM injection, and API
    paths. Our target from approved requests to a live
    integration the customer can use. When a note doesn't land
    in the chart, you'll find out why and fix it.
  - Bring advanced AI into the pilot. Confirm which beyond-the-
    note features the customer's EHR supports, configure them,
    and help providers put them to work: ICD coding, orders,
    Patient 360, carry forward, and pre-visit summaries.
  - Get templates right. Translate gold-standard notes and
    specialty requirements into template requests for our
    template engineering team, and triage template updates
    during the pilot on a 24-hour SLA.
  - Keep pilots healthy. Own the pilot Slack channel as the
    thread of record, triage in-pilot requests (template,
    integration, app feature) within 24 hours, and keep status
    and usage current in Salesforce so the AE always knows how
    the pilot is going.
  - Enable the sales team. Field integration and feature
    questions from AEs, help run the weekly integrations sales
    desk where engineering commitments to deals are made and
    tracked, and own the technical sections of RFPs and
    security questionnaires.
  - Hand off well. Deliver each new customer to implementation
    with the integration, templates, provider list, and known
    issues documented, so go-live picks up right where the
    pilot left off.
  - Make the team better. Escalate integration and product
    findings to Engineering with clear reproduction steps, and
    help build the tooling and playbook (debugging queries,
    checklists, wiki) that lets the next SE ramp faster than
    you did.

  What Success Looks Like

  - Pilots start on the date we committed to the customer.
  - In-pilot issues are triaged within speed and urgency
  - Providers in your pilots are using Ambient, and where the
    EHR supports it, coding, carry forward, and Patient 360.
  - Your pilots convert, and implementation can pick up your
    hand-offs without rework.

  What You Have

  - 3–7 years in sales engineering, solutions engineering,
    implementation, or healthcare IT. Engineers who want to
    spend more time with customers are welcome.
  - Hands-on experience with at least one ambulatory EHR
    (athenahealth, eClinicalWorks, AdvancedMD, NextGen,
    ModMed, Practice Fusion, WebPT). Epic, Cerner, or Meditech
    Expanse is a plus.
  - Comfort reading and debugging an integration: browser
    automation, DOM, REST APIs, JSON schemas, HL7/FHIR. You
    can use SQL and internal tooling to figure out why a note
    didn't land.
  - The ability to explain to a physician or technical teams how
    ambient AI builds a note, where it can miss, and what to
    do about it, in plain language.
  - Strong organization. You can juggle several pilots across
    multiple EHRs, keep Salesforce current, use Slack as your
    thread of record, and write updates that are short and
    specific.
  - Healthcare fluency: clinical documentation, specialty
    workflows, HIPAA, and the security questionnaires (SOC 2,
    HITRUST) that come with selling into practices.
  - A strong sense of ownership. Pilots launch on an SE's
    approval, and you take that responsibility seriously.

  What We Offer

  - Live pilots from your first weeks, with providers using what
    you built.
  - Work at the frontier: LLM-generated notes, codes, and orders
    landing in production EHRs at real practices, every week.
  - A close working relationship with Product and Engineering.
    What you learn from customers shapes what we build next.
  - Documented SLAs, a written playbook, and a team that helps
    you ramp.
  - A clear path into Forward Deployed Engineering, enterprise
    Sales Engineering, or Product.
  - Competitive compensation and benefits.

  Please be aware that all official communication from us will
  come exclusively from email addresses ending in
  @commure.com. Any emails from other domains are not
  affiliated with our organization.

  Employees will act in accordance with the organization’s
  information security policies, to include but not limited to
  protecting assets from unauthorized access, disclosure,
  modification, destruction or interference nor execute
  particular security processes or activities. Employees will
  report to the information security office any confirmed or
  potential events or other risks to the organization.
  Employees will be required to attest to these requirements
  upon hire and on an annual basis.
