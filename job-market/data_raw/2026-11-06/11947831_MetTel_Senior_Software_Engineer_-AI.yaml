description: |
  MetTel is a global communications solutions provider with
  the most complete suite of fully managed services that focus
  on secure connectivity, and network and mobility services.
  We simplify communications and networking for business and
  government agencies. Our customers include many of the
  Fortune 500, and Gartner recognizes us as an industry
  leader. We have the broadest portfolio of technology and
  integrated partnerships, as well as our private network,
  which we use to create tailored solutions design,
  deployment, and ongoing management, driving cost savings,
  efficiency, innovation, and the ability to focus on core
  objectives.

  We believe that each team member is a key to the success and
  sustainability of the group. In order to achieve this, we
  offer an environment where all professionals can grow and
  develop their skills and competencies, collaborate with
  diverse professionals, share knowledge and enjoy a rewarding
  career.

  Join our Bruin Software Engineering Team and help shape the
  future of AI-driven software development.

  We are seeking an experienced Senior Software Engineer – AI
  & Platform Modernization to lead the transformation of
  critical enterprise applications while helping establish AI-
  native software engineering practices across the
  organization. This role combines full-stack software
  engineering, cloud architecture, and modern AI development
  methodologies to accelerate innovation and improve
  engineering productivity.

  You will leverage advanced AI development tools such as
  Claude Code, GitHub Copilot, Cursor, OpenAI, Anthropic, and
  future AI engineering platforms to architect, develop, and
  modernize mission-critical applications. Beyond simply using
  AI tools, you will be instrumental in designing and
  implementing AI-powered software solutions, automating
  workflows, and integrating Large Language Models (LLMs) into
  enterprise products and business processes.

  This is an ideal opportunity for engineers passionate about
  AI application development, Generative AI, intelligent
  automation, platform modernization, cloud-native
  architecture, and next-generation software engineering
  practices.

  Key ResponsibilitiesAI-Driven Software Engineering &
  Development

  - Lead the development of AI-enabled applications utilizing
    Large Language Models (LLMs), Generative AI technologies,
    and intelligent automation frameworks.
  - Design and implement scalable AI-powered solutions including
    AI assistants, copilots, knowledge retrieval systems,
    workflow automation, and enterprise productivity
    applications.
  - Partner with AI coding platforms such as Claude Code, GitHub
    Copilot, Cursor, and emerging AI development tools to
    accelerate software delivery while maintaining engineering
    quality and architectural integrity.
  - Evaluate and implement AI development best practices, prompt
    engineering techniques, AI governance standards, and
    responsible AI methodologies.
  - Develop AI-enhanced workflows that improve developer
    productivity, software quality, testing efficiency, and
    operational effectiveness.

  Platform Modernization Leadership

  - Own the end-to-end modernization of a complex enterprise
    application ecosystem, migrating legacy technology
    platforms to modern cloud-native architectures.
  - Architect and execute module-by-module migration strategies
    while maintaining compatibility with existing Microsoft
    SQL Server environments.
  - Drive technical decision-making around platform
    architecture, scalability, maintainability, observability,
    and security.

  Full-Stack Application Development

  - Build and maintain modern applications utilizing:
    - TypeScript
    - Node.js
    - NestJS
    - React
    - Python
    - REST APIs
    - SQL and NoSQL databases
  - Create highly scalable front-end and back-end solutions
    supporting enterprise workloads and AI-enabled user
    experiences.
  - Design secure, performant APIs and service-oriented
    architectures.

  AI Workflow & Process Automation

  - Design and implement intelligent workflow orchestration
    solutions using Temporal.io and related workflow
    platforms.
  - Integrate AI decisioning into long-running enterprise
    processes, human task queues, automation frameworks, and
    approval workflows.
  - Identify opportunities to automate manual business processes
    through AI-powered technologies.

  Cloud Architecture & DevOps

  - Design, deploy, and maintain cloud-native applications
    across AWS, Azure, and GCP environments.
  - Implement CI/CD pipelines, Infrastructure as Code (IaC),
    container orchestration, and automated deployment
    processes.
  - Optimize cloud infrastructure for performance, cost
    efficiency, and scalability.

  Engineering Excellence

  - Establish best practices for AI-assisted development,
    software architecture, testing, code quality, and
    security.
  - Conduct code reviews and technical design reviews.
  - Mentor engineers in modern AI-driven software development
    methodologies.
  - Serve as a technical leader driving innovation in AI-enabled
    engineering practices.

  Required Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Systems, or equivalent practical experience.
  - 5+ years of professional software engineering experience
    delivering enterprise-grade applications.
  - Strong expertise in:
    - TypeScript
    - JavaScript
    - Node.js
    - NestJS
    - React
    - Modern API development
  - Experience developing and deploying cloud-native
    applications in AWS, Azure, or GCP.
  - Strong understanding of software architecture, distributed
    systems, and enterprise integration patterns.
  - Demonstrated experience using AI-assisted development tools
    such as:
    - Claude Code
    - GitHub Copilot
    - Cursor
    - OpenAI tooling
    - Anthropic tooling
    - Similar AI engineering platforms
  - Experience integrating APIs, third-party services, and
    enterprise applications.
  - Strong analytical and problem-solving skills.
  - Excellent communication and stakeholder management
    abilities.

  Preferred Qualifications

  - Experience building Generative AI applications and AI-
    powered enterprise solutions.
  - Knowledge of Large Language Models (LLMs), prompt
    engineering, model orchestration, and AI application
    architecture.
  - Experience with Retrieval-Augmented Generation (RAG)
    solutions.
  - Familiarity with AI frameworks such as:
    - LangChain
    - Semantic Kernel
    - LlamaIndex
    - OpenAI SDKs
    - Anthropic APIs
  - Experience with vector databases including Pinecone,
    Weaviate, Chroma, or PostgreSQL pgvector.
  - Experience developing AI agents, intelligent copilots, and
    conversational AI applications.
  - Knowledge of machine learning operations (MLOps) and AI
    infrastructure.
  - Experience with:
    - Kafka
    - Apache Airflow
    - Apache Flink
    - Event-driven architectures
  - Workflow orchestration expertise using Temporal.io,
    Conductor, or similar platforms.
  - Experience modernizing low-code, legacy, or monolithic
    enterprise systems.
  - Cloud certifications in AWS, Azure, Google Cloud,
    Kubernetes, or AI-focused cloud technologies.

  Why Join Us

  - Build next-generation AI-powered enterprise software.
  - Work with cutting-edge AI development platforms and
    technologies.
  - Influence the adoption of AI engineering best practices
    across the organization.
  - Lead high-impact modernization initiatives with executive
    visibility.
  - Collaborate with talented engineers solving complex
    technical challenges at scale.
  - Shape the future of AI-enabled software development within a
    fast-growing technology organization.

  *The salary range reflected is a good faith estimate of base
  pay for the primary location of the position. Our
  compensation reflects the cost of labor across several U.S.
  geographic markets, and we pay differently based on those
  defined markets. The U.S. pay for this position ranges from
  $150,000.00 to $165,000.00 annually. Pay varies by work
  location and may also depend on job -related knowledge,
  skills, experience and abilities of the successful
  candidate. Your recruiter can share more about the specific
  salary range for the job location during the hiring process.



