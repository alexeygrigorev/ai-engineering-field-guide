description: |
  Experience: 3–5 years

  Role summary

  The Senior FDE builds and ships AI features on GCP end to
  end, working closely with client users. They are the pod's
  hands-on technical anchor and guide the two Junior FDEs day
  to day.

  Key responsibilities

  •         Build and deploy AI solutions on GCP from design
  through production

  •         Develop GenAI and LLM features: prompt pipelines,
  RAG, tool calling and agent workflows

  •         Build voice workflows (speech-to-text, text-to-
  speech, voice bots) and document pipelines (extraction,
  classification, search)

  •         Write clean, tested Python services and integrate
  with client systems and APIs

  •         Lead debugging of production issues and drive
  fixes to closure

  •         Review Junior FDEs' code, pair with them and break
  work into clear tasks

  •         Join client calls to gather requirements, demo
  progress and explain technical choices

  •         Document solutions, runbooks and handover notes

  Required skills

  •         GCP stack: hands-on with Vertex AI, Cloud Run or
  Cloud Functions, BigQuery, Cloud Storage and Pub/Sub

  •         Python: strong; REST APIs, data processing, unit
  and integration testing

  •         AI: practical GenAI and LLM delivery (Gemini or
  similar), embeddings, vector search, prompt engineering

  •         Voice and document management: working experience
  with Speech-to-Text or Text-to-Speech and Document AI or OCR
  tools

  •         Debugging: independent troubleshooting across
  code, cloud logs and integrations

  •         Communication and presentability: clear with
  client users; can run a demo and write crisp status updates

  Python & Data Structures / Algorithms (DSA)

  Required Skills

  - 3+Strong
       proficiency in Python programming with hands-on
  experience in building production-grade applications and
  APIs.
  - Deep
       understanding of Object-Oriented Design, Design
  Patterns, Exception Handling, Testing Frameworks, and
  Dependency Management.
  - Strong
       command over Data Structures including Arrays, Linked
  Lists, Trees, Graphs, Hash Tables, Heaps, Stacks, and
  Queues.
  - Strong
       algorithmic problem-solving skills involving Searching,
  Sorting, Dynamic Programming, Recursion, Backtracking, and
  Graph Algorithms.
  - Experience
       optimizing code for performance, scalability, and
  maintainability.
  - Ability
       to analyze and improve solutions using time and space
  complexity considerations.
  - Experience
       mentoring junior engineers on coding standards and best
  practices.

  Good to have

  •         Google Cloud Associate or Professional
  certification

  •         Dialogflow CX or another conversational AI
  platform

  •         Docker, CI/CD (Cloud Build or GitHub Actions)

  •         Client-facing or onsite delivery experience

  Qualifications

  Bachelor's degree in Computer Science, Engineering or a
  related field.
