description: |
  Computer Vision AI Engineer

  The Opportunity:

  Booz Allen is seeking an innovative and experienced AI
  Developer specializing in computer vision to join our
  growing team for space solutions. In this role, you will
  leverage your expertise in AI, data science, and machine
  learning (ML) engineering to train, test, deploy, and
  maintain models that learn from data.

  You will collaborate with cross-functional teams to develop
  and deploy advanced computer vision models and systems,
  bringing significant technological advancements that drive
  mission success. In this role, you’ll contribute to the
  direction of mission-critical solutions by applying best-fit
  ML algorithms and technologies. You’ll grow within a large
  community of ML engineers across the company and collaborate
  with a team of dedicated space industry and AI professionals
  to deliver world-class solutions to solve missile warning
  problems in near-real-time.

  What You'll Work On:

  - Develop and implement deep learning computer vision models,
    with a focus on sensor fusion and target tracking.
  - Collaborate with multidisciplinary teams to design, develop,
    test, and deploy technical solutions in Python, C++, and
    Rust.
  - Develop and maintain Fire Control Systems, ensuring
    robustness and accuracy in real-time applications.
  - Utilize GPU programming, including CUDA or RAPIDs, to
    optimize the performance of computer vision applications.
  - Contribute to the architecture and implementation of
    embedded systems programming using C, C++, or Rust.

  Join us. The world can’t wait.

  You Have: 

  - 4+ years of experience in sensor fusion and target tracking
  - Experience in deep learning for computer vision, including
    the use of transformer-based models such as DINO, CLIP, or
    SAM
  - Experience in AI, data science, ML engineering, or software
    engineering
  - Secret clearance
  - Bachelor's degree

  Nice If You Have: 

  - Experience with embedded systems programming in C, C++, or
    Rust
  - Experience in GPU programming, including CUDA or RAPIDs
  - Experience developing space solutions
  - Knowledge of modern software design patterns, including
    microservice design and orchestration in Kubernetes
    deployment
  - TS/SCI clearance
  - Master’s degree in a CS or AI field

  Clearance:

  Applicants selected will be subject to a security
  investigation and may need to meet eligibility requirements
  for access to classified information; Secret clearance is
  required.

  Compensation

  At Booz Allen, we celebrate your contributions, provide you
  with opportunities and choices, and support your total well-
  being. Our offerings include health, life, disability,
  financial, and retirement benefits, as well as paid leave,
  professional development, tuition assistance, work-life
  programs, and dependent care. Our recognition awards program
  acknowledges employees for exceptional performance and
  superior demonstration of our values. Full-time and part-
  time employees working at least 20 hours a week on a regular
  basis are eligible to participate in Booz Allen’s benefit
  programs. Individuals that do not meet the threshold are
  only eligible for select offerings, not inclusive of health
  benefits. We encourage you to learn more about our total
  benefits by visiting the Resource page on our Careers site
  and reviewing Our Employee Benefits page.

  Salary at Booz Allen is determined by various factors,
  including but not limited to location, the individual’s
  particular combination of education, knowledge, skills,
  competencies, and experience, as well as contract-specific
  affordability and organizational requirements. The projected
  compensation range for this position is $99,000.00 to
  $225,000.00 (annualized USD). The estimate displayed
  represents the typical salary range for this position and is
  just one component of Booz Allen’s total compensation
  package for employees. This posting will close within 90
  days from the Posting Date.

  Identity Statement

  As part of the hiring process, we will ask you to complete
  an identity verification process that leverages advanced
  biometrics and artificial intelligence to ensure
  authenticity and protect against identity fraud. You are
  expected to be on camera during interviews and assessments.
  We reserve the right to take your picture to verify your
  identity and prevent fraud.

  Candidate AI Usage Policy

  AI is a part of our daily work at Booz Allen, and we are
  committed to the responsible and ethical use of AI tools.
  However, we want to ensure a fair candidate process based on
  your own skills and knowledge. As part of this commitment,
  the use of artificial intelligence (AI) or other tools to
  assist with responses during interviews (whether in-person
  or virtual) is prohibited unless permission is explicitly
  provided.

  Work Model Our people-first culture prioritizes the benefits
  of collaboration. To support engagement and effective
  communication, employees working virtually are generally
  expected to have their cameras on during meetings.

  - Remote: If this position is listed as remote, there may
    still be occasions when you are required to work in person
    at a Booz Allen or customer facility.
  - Hybrid: If this position is listed as hybrid, you will be
    expected to work from a Booz Allen or customer facility,
    in alignment with your leadership's expectations and the
    needs of the role.
  - Onsite: If this position is listed as onsite, work will
    primarily be performed full-time at a customer facility,
    where employees will collaborate directly with colleagues
    and customers as required by the role.

  Commitment to Non-Discrimination

  All qualified applicants will receive consideration for
  employment without regard to disability, status as a
  protected veteran or any other status protected by
  applicable federal, state, local, or international law.
