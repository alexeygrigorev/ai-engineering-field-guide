  - Our jobs are listed only on the ŌURA Careers page and
    trusted job boards.
  - We will never ask for personal information like ID or
    payment for equipment upfront.
  - Official offers are sent through Docusign after a verbal
    offer, not via text or email.

  Stay cautious and protect your personal details.

  To all recruitment agencies: ŌURA does not accept agency
  resumes. Please do not forward resumes to our jobs alias,
  ŌURA employees, or any other organization's location. ŌURA
  is not responsible for any fees related to unsolicited
  resumes.
