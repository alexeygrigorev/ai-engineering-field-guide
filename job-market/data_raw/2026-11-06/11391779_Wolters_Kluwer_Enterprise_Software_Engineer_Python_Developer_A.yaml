description: |
  Basic Function

  Work in a team to design, build and integrate WK next
  generation of enterprise cloud services, contributing to key
  projects and initiatives in GBS.

  Primary focus is following given design directions to
  develop and release software solutions from given business
  requirements to automate traditional IT Operations tasks
  using Generative AI tools and solutions, Cloud software
  development kits (SDKs), configuration management tools
  (like Ansible), infrastructure orchestration tools (such as
  Terraform) and driving IT Governance and Standardization to
  organization identified cloud patterns.

  Enterprise Cloud Software engineer will work closely with
  other engineers leveraging a standard set of enterprise-wide
  artifacts such as Design Patterns and Standards, follow
  guiding design principles ensuring the develop solutions or
  technical components deliver GBS strategic intent, while
  meeting the solution requirements providing business value.

  What You'll Do

  - Write code, engineer CI/CD pipelines, and champion the
    adoption of Infrastructure-as-Code (IaC) across divisions,
    departments, teams, and applications
  - Envision and execute on an enterprise-scale cloud operations
    discipline using serverless technologies such as AWS
    Lambda & Azure Functions
  - Lead change of developing and delivering operational
    services to our partner teams by leveraging GenAI tools to
    support code authoring, using Ansible, Jenkins and Azure
    DevOps to help meet operational, security, audit, and
    compliance requirements
  - Build and evolve standardization solutions to drive IT Cloud
    governance.
  - Write software with high quality through automated self-
    certification prior to delivery to consumers.
  - Partner closely with Architecture and Engineering, Cloud
    Operations and Security teams to ensure the
    operationalization and adoption of engineering work
  - Drive projects to completion by clarifying requirements,
    providing technical insights, and removing roadblocks
  - Report to stakeholders and leadership teams on the progress
    of key initiatives regularly
  - Relentlessly document your implementation, patterns,
    practices, and processes.

  What You Bring To The Team

  - Passion and Energy to work in a team to turn a vision into a
    reality
  - Understand and be comfortable with failing fast and learning
    from failures to fully realize and maximize innovative
    spirit of the team.
  - Support strong focus on ensuring services can be effectively
    ran by operations
  - Customer-focused mindset –work with the team to solve real
    problems for our customers and users

  Other Duties

  - Performs other duties as assigned by management

  Job Qualifications & EXPERIENCE

  Education:

  - Required: Bachelor's degree in Computer Science, Information
    Systems, or a related field
  - A Valid Technical Certificate in Azure, AWS

  Experience:

  - 2-5 years of application/code (Python) development
    experience leveraging version control systems
  - 2 years of experience with one or more of the following
    scripting languages
    - Python
    - PowerShell
    - Bash
    - JavaScript
  - Experience in using Generative AI tools and solutions to
    support code authoring
  - Experience with design patterns, SOLID Principles,
    especially cloud resiliency patterns
  - Experience working in an agile environment with an SDLC like
    Scrum, SaFE, etc.
  - Experience participating in software release cycle,
    including code reviews and defect triage.
  - Experience with software development best practices like
    test-driven development.
  - Experience in code refactoring, quality improvement, and
    performance optimization
  - Knowledge of multi-threading, scalability, performance, and
    application security
  - Experience creating and implementing ARM, Cloud formation or
    Terraform templates
  - Experience to manage Infrastructure as code

  Soft Skills:

  - Team working
  - A logical approach to work
  - The ability to prioritize tasks/organize work
  - Excellent oral, written and interpersonal English
    communication skills including strong presentation skills.
  - Availability to work on extra time
  - Problem-solving skills
  - Patience
  - Meticulous attention to details

  Travel requirements

  Position requires occasional travel on a domestic and
  international travel

  Our Interview Practices

  To maintain a fair and genuine hiring process, we kindly ask
  that all candidates participate in interviews without the
  assistance of AI tools or external prompts. Our interview
  process is designed to assess your individual skills,
  experiences, and communication style. We value authenticity
  and want to ensure we’re getting to know you—not a digital
  assistant. To help maintain this integrity, we ask to remove
  virtual backgrounds and include in-person interviews in our
  hiring process. Please note that use of AI-generated
  responses or third-party support during interviews will be
  grounds for disqualification from the recruitment process.

  Applicants may be required to appear onsite at a Wolters
  Kluwer office as part of the recruitment process.
