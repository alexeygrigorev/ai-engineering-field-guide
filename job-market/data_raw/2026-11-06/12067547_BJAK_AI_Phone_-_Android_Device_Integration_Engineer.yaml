title: AI Phone - Android Device Integration Engineer
company: BJAK
location: USA
remote: true
work_type: FULL_TIME
description: |
  About

  We are reimagining the phone. AI phones need to be
  proactive, intuitive, intelligent and low cost. This is a
  mission critical for rest of the world to adopt
  intelligence.

  There are over 5 billion people using everyday applications
  such as email, messaging, notes, tasks, and calendars, yet
  most are not AI-native. Our mission is to build proactive
  applications and devices that bring intelligence into daily
  conversations, coordination and workflows, with minimal
  prompting.

  Focus: Making the Android OS / custom ROM work correctly
  with the actual physical phone hardware.

  This is different from conventional Android application
  development.

  Responsibilities

  - Integrate AOSP / custom ROM with the selected device
    hardware.
  - Work with Board Support Packages (BSPs).
  - Integrate vendor-specific Hardware Abstraction Layers
    (HALs).
  - Work with firmware and device drivers.
  - Support device bring-up and boot processes.
  - Integrate camera, microphone, speakers, sensors, modem, Wi-
    Fi and Bluetooth.
  - Troubleshoot hardware and firmware compatibility issues.
  - Work with ODM/OEM and chipset vendors.
  - Optimize power consumption and hardware performance.

  Requirements

  - Experience with Android platform, BSP or embedded Linux
    development.
  - Understanding of Android HAL and hardware integration.
  - C / C++ knowledge.
  - Understanding of Linux kernel and device drivers.
    (IMPORTANT)
  - Experience debugging firmware and hardware integration
    issues.

  Nice to have

  - Qualcomm or MediaTek experience.
  - Android device bring-up.
  - Custom ROM development.
  - Experience working with smartphone manufacturers or ODMs.
