description: |
  Lead with Purpose, Unlock Your Team’s Passion

  At LPL, people leaders hold the key to the employee
  experience — shaping culture, driving performance, and
  guiding individuals to new heights. Because when that
  happens, we all win – clients, LPL, and most importantly
  our, employees.

  If you're ready to lead with intention and discover what’s
  possible, LPL Financial invites you to apply today.

  Job Overview: As an AVP, Full Stack Developer, you will be a
  key contributor to designing, developing, and maintaining
  scalable, cloud-native applications, including solutions
  that incorporate AI and Generative AI capabilities. You will
  work across the full software development lifecycle,
  building modern user experiences, APIs, microservices, and
  AI-enabled workflows that solve business problems. This role
  requires strong software engineering fundamentals along with
  hands-on experience leveraging LLMs, AI services, and
  agentic technologies within enterprise applications.
  Responsibilities:

  - Design, develop, and maintain scalable full-stack
    applications using modern front-end frameworks such as
    React or Angular and back-end technologies such as C#,
    Java, or Python.
  - Build and integrate AI/GenAI capabilities into enterprise
    applications using LLMs, APIs, AI services, and agentic
    workflows.
  - Design and implement RESTful APIs, microservices, and cloud-
    native services, integrating applications with AI models
    and enterprise data sources.
  - Develop solutions utilizing concepts such as prompt
    engineering, RAG, embeddings/vector search, tool/function
    calling, and AI agents, where appropriate.
  - Partner with product owners, architects, business analysts,
    and engineering teams to translate business requirements
    into scalable technical and AI-enabled solutions.
  - Write clean, secure, maintainable, testable code and
    participate in code reviews, automated testing, CI/CD, and
    engineering best practices.
  - Evaluate and leverage AI-assisted development tools such as
    GitHub Copilot, Cursor, or similar tools to improve
    development productivity and code quality.
  - Troubleshoot application and AI-integrated production
    issues, perform root cause analysis, and improve
    application reliability, performance, and observability.
  - Mentor engineers and contribute to technical direction,
    engineering standards, and the responsible adoption of
    emerging AI technologies.

  AI & GenAI Engineering Expectations

  - Hands-on experience integrating LLMs or Generative AI
    capabilities into applications, rather than solely using
    AI productivity tools.
  - Experience working with enterprise AI services or platforms
    such as AWS Bedrock, Azure OpenAI, Amazon SageMaker, or
    comparable technologies.
  - Understanding of prompt engineering, RAG, embeddings, vector
    databases/search, function/tool calling, and agentic AI
    patterns.
  - Ability to develop and integrate AI services through APIs,
    SDKs, and microservices within existing enterprise
    applications.
  - Understanding of AI security, privacy, responsible AI, model
    evaluation, observability, and production considerations.
  - Experience with AI-assisted software development tools such
    as GitHub Copilot, Cursor, or similar platforms.

  What are we looking for?

  We’re looking for strong collaborators who deliver
  exceptional client experiences and thrive in fast-paced,
  team-oriented environments. Our ideal candidates pursue
  greatness, act with integrity, and are driven to help our
  clients succeed. We value those who embrace creativity,
  continuous improvement, and contribute to a culture where we
  win together and create and share joy in our work.

  Requirements:

  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - Minimum of 7 years of progressive software engineering
    experience, with strong hands-on full-stack application
    development experience.
  - Strong development experience with a modern front-end
    framework such as React or Angular and at least one back-
    end language such as C#, Java, or Python.
  - Demonstrated experience designing and developing APIs,
    microservices, and cloud-native applications, preferably
    within AWS.
  - Hands-on experience integrating AI/Generative AI
    capabilities into software applications, including
    experience with LLM APIs/services and familiarity with
    RAG, prompt engineering, vector search/embeddings, or AI
    agents.

  Core Competencies:

  - Experience with AWS, including services supporting modern
    application and AI architectures such as Bedrock, Lambda,
    API Gateway, EKS, and related services.
  - Experience with relational and/or NoSQL databases and
    familiarity with vector databases or semantic/vector
    search.
  - Experience with Docker, Kubernetes, CI/CD, automated
    testing, observability, and DevOps practices.
  - Understanding of enterprise AI considerations including
    security, privacy, responsible AI, model evaluation,
    monitoring, and production reliability.
  - Financial services experience is preferred.
  - Experience in the financial services industry is a plus.

  ** This is a hybrid role, requiring onsite presence at our
  Charlotte/Fort Mill or NYC/Midtown office 2–3 days per week,
  as much of the team and leadership are based there.



  Pay Range:

  $140,500.00 - $234,100.00 Actual base salary varies based on
  factors, including but not limited to, relevant skill, prior
  experience, education, base salary of internal peers,
  demonstrated performance, and geographic location.
  Additionally, LPL Total Rewards package is highly
  competitive, designed to support your success at work, at
  home, and at play – such as 401K matching, health benefits,
  employee stock options, paid time off, volunteer time off,
  and more. Your recruiter will be happy to discuss all that
  LPL has to offer!


  Company Overview:

  LPL Financial Holdings Inc. (Nasdaq: LPLA) is among the
  fastest growing wealth management firms in the U.S. As a
  leader in the financial advisor-mediated marketplace(6) ,
  LPL supports over 32,000 financial advisors and the wealth
  management practices of approximately 1,100 financial
  institutions, servicing and custodying approximately $2.3
  trillion in brokerage and advisory assets on behalf of
  approximately 8 million Americans. The firm provides a wide
  range of advisor affiliation models, investment solutions,
  fintech tools and practice management services, ensuring
  that advisors and institutions have the flexibility to
  choose the business model, services, and technology
  resources they need to run thriving businesses. For further
  information about LPL, please visit www.lpl.com.

  At LPL, independence means that advisors and institution
  leaders have the freedom they deserve to choose the business
  model, services, and technology resources that allow them to
  run a thriving business. They have the flexibility to do
  business their way. And they have the freedom to manage
  their client relationships, because they know their clients
  best. Simply put, we take care of our advisors and
  institutions, so they can take care of their clients.

  For further information about LPL, please visit www.lpl.com.

  Join the LPL team and help us make a difference by turning
  life’s aspirations into financial realities. Please log in
  or create an account to apply to this position. Principals
  only. EOE.

  Information on Interviews:

  LPL will only communicate with a job applicant directly from
  an @lplfinancial.com email address and will never conduct an
  interview online or in a chatroom forum.  During an
  interview, LPL will not request any form of payment from the
  applicant, or information regarding an applicant’s bank or
  credit card.  Should you have any questions regarding the
  application process, please contact LPL’s Human Resources
  Solutions Center at (855) 575-6947.

