  Responsibilities: •            Design, develop, test,
  document, and maintain AI-enabled applications and services.
  •            Implement AI and agent workflows using
  LangChain, Microsoft Agent Framework, or other suitable
  frameworks and services. •            Develop RAG
  capabilities, including data ingestion, retrieval,
  grounding, and integration with authorized enterprise
  information sources. •            Integrate AI models with
  APIs, enterprise applications, and business workflows,
  including appropriate tool use and human review. •
  Work with product owners, users, and functional specialists
  to understand needs and translate them into technical
  designs, user stories, and acceptance criteria. •
  Develop and maintain application components, APIs, and
  services using Python and established software engineering
  practices. •            Create and execute automated tests
  and evaluations to assess accuracy, relevance, grounding,
  safety, and performance. •            Troubleshoot
  application and model behavior; use test results, telemetry,
  and user feedback to improve solution quality. •
  Support deployment and operations, including CI/CD,
  monitoring, documentation, incident resolution, and ongoing
  maintenance. •            Apply security and privacy
  requirements, including identity and access controls,
  authorization-aware retrieval, and protection of sensitive
  data. •            Collaborate with data, cloud,
  cybersecurity, DevSecOps, and software engineering teams to
  integrate solutions into the enterprise environment. •
  Contribute reusable components, technical documentation, and
  engineering practices that improve consistency and
  maintainability. •            Familiarity with AI safety
  frameworks such as the NIST AI Safety Framework to support
  implementation of alignment controls in artificial
  intelligence LLMs and agents •            Contribute to the
  development of the AI Safety/Alignment policies, procedures,
  etc., for ensuring ethical, controllable, and aligned
  artificial intelligence systems and agents Qualifications:
  Required: •            Bachelor's degree + 10 years of
  experience in artificial intelligence, machine learning,
  software engineering, or related field; equivalencies
  considered (Master's + 7 years; 16 years with no degree; AA
  + 12 years) •            At least five years of experience
  in software engineering, application development, AI/ML
  engineering, or a related technical field. •
  Demonstrated experience developing software applications or
  services using Python and APIs. •            Hands-on
  experience building generative AI or machine learning
  applications that integrate models with data, applications,
  or workflows. •            Experience using LangChain,
  Microsoft Agent Framework, or a comparable framework to
  build AI or agent-based capabilities. •
  Understanding of RAG, prompt and context design, model or
  application evaluation, and integration with enterprise
  data. •            Experience with automated testing,
  version control, and CI/CD practices. •
  Familiarity with cloud-based application development and
  deployment; experience with Microsoft Azure is preferred. •
  Understanding of secure software development and the need to
  protect sensitive information and restrict access to
  enterprise data. •            Ability to work
  collaboratively with technical teams, product staff, and
  functional stakeholders, and to communicate technical work
  clearly. Desired: •            Experience developing
  production applications using both LangChain and Microsoft
  Agent Framework. •            Experience with LangGraph or
  other approaches for building stateful, multi-step agent
  workflows. •            Experience with Azure OpenAI, Azure
  AI services, or Azure AI Foundry. •            Experience
  implementing authorization-aware RAG, data filtering, and
  access controls for retrieval and tool use. •
  Experience with AI evaluation methods, test sets, tracing,
  observability, and monitoring for quality, latency, and
  cost. •            Experience integrating AI applications
  with enterprise systems, microservices, and web interfaces.
  •            Familiarity with responsible AI practices,
  including human review, explainability, and safe handling of
  uncertain or unsupported outputs. •            Relevant
  cloud, AI, or software engineering certifications.

