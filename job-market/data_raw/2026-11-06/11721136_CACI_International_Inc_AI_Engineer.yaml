  The Opportunity: We are seeking an AI Engineer to design,
  develop, test, and support AI-enabled applications and
  agent-based solutions to support the United States Secret
  Service (USSS) contract supporting the Department of
  Homeland Security. The engineer will work across the
  software development lifecycle, translating mission and user
  needs into secure, reliable capabilities that integrate AI
  models with enterprise data, applications, and workflows.
  The work may use frameworks such as LangChain and Microsoft
  Agent Framework, along with cloud-based AI services and
  established software engineering practices. The AI Engineer
  will collaborate with product, functional, data,
  cybersecurity, and infrastructure teams to develop practical
  solutions that meet user needs and enterprise requirements.
  The role includes building and evaluating capabilities such
  as retrieval-augmented generation (RAG), tool and API
  integrations, and agent workflows; improving system quality
  through testing and user feedback; and supporting
  deployment, monitoring, and continuous improvement.
  Responsibilities: The Opportunity: We are seeking an AI
  Engineer to design, develop, test, and support AI-enabled
  applications and agent-based solutions to support the United
  States Secret Service (USSS) contract supporting the
  Department of Homeland Security. The engineer will work
