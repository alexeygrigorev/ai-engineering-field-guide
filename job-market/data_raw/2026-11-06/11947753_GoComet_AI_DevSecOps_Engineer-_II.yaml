description: |
  AI DevSecOps Engineer II

  GoComet | Platform Engineering

  Experience: 2 to 4 years

  Location: Bangalore (onsite)

  Department: Platform

  Employment: Full-time

  About GoComet

  GoComet is a logistics and supply chain SaaS platform. Our
  Platform team runs the cloud

  infrastructure, Kubernetes clusters, delivery pipelines and
  observability stack that engineering

  teams ship on. We run primarily on AWS, with GCP as well,
  and are growing our multi-cloud and

  on-prem footprint.

  The Role

  You will work under Ashish in a small Platform team,
  building and operating reliable, secure and

  cost-efficient infrastructure. This is a hands-on role for
  someone who takes initiative, writes code

  and follows work through to a verified result.

  You will own scoped infrastructure and automation projects
  end to end: clarify the problem,

  agree priorities and scope with Ashish, plan the work,
  implement and test changes, roll them out

  safely and verify the outcome. You will coordinate with
  engineering teams, raise blockers early

  and seek review for high-risk changes.

  Key Responsibilities

  ● Provision and maintain AWS infrastructure using Terraform
  and configuration automation

  such as Ansible.

  ● Build and manage Kubernetes clusters and workloads,
  including scaling, upgrades,

  security hardening and Helm packaging.

  ● Improve CI/CD and GitOps delivery using GitHub Actions and
  ArgoCD, with reliable

  deployment checks and rollback paths.

  ● Build observability through metrics, logs, dashboards,
  alerting and SLOs using

  Prometheus, Grafana and Loki.

  ● Reduce repetitive work across provisioning, configuration,
  patching, backups and

  runbooks. Build maintainable automation with error handling,
  tests, documentation and

  safe recovery.

  ● Use AI-assisted tools to build, debug and improve scripts,
  infrastructure code and

  operational workflows. Review and test generated changes,
  protect credentials and

  production data, and retain human review for high-risk
  actions.

  ● Support data stores and messaging systems, including
  PostgreSQL, MongoDB, Redis

  and queues. Participate in on-call, incident response and
  blameless postmortems, and

  follow through on reliability improvements.

  ● Apply least-privilege IAM, secrets management and network
  policies. Monitor cloud cost

  and resource usage, and implement improvements with verified
  impact.

  Must Have Skills

  ● 2 to 4 years of hands-on CloudOps, DevOps or Platform
  engineering experience,

  including work on production systems.

  ● Strong hands-on AWS experience and the ability to
  troubleshoot infrastructure issues.

  ● Practical Terraform experience, including modules, remote
  state, workspaces and safe

  change planning.

  ● Production Kubernetes experience, including deploying and
  troubleshooting workloads;

  familiarity with Helm packaging.

  ● Solid Linux and networking fundamentals, plus the ability
  to write and debug useful scripts

  or tools in Bash, Python or Go.

  ● Experience with source control, CI/CD, GitOps and
  observability. We use GitHub Actions,

  ArgoCD, Prometheus, Grafana and Loki; comparable tool
  experience is welcome.

  ● Demonstrated delivery of an infrastructure improvement or
  automation from problem

  definition through rollout and verification.

  ● Leverages AI to build high quality systems and governance
  framework.

  ● Practical proficiency with AI-assisted engineering. You
  can explain a working script,

  infrastructure change or workflow you built with AI, how you
  validated it and how you

  handled incorrect or unsafe output.

  Good to Have

  ● Ansible or similar configuration-management experience.

  ● GCP experience, including GKE, Cloud SQL, IAM and Secret
  Manager.

  ● Cloud and Kubernetes hardening, vulnerability scanning or
  compliance experience.

  ● Database operations, backups, replication or tuning for
  PostgreSQL and MongoDB.

  ClickHouse or Redis; messaging experience with Kafka,
  RabbitMQ, SQS or similar.

  ● Cloud migrations, multi-cloud operations or on-prem
  Kubernetes experience with bare

  metal, kubeadm, RKE or similar.

  ● System design experience covering high availability,
  scalability and disaster recovery.

  What We Look For

  ● Ownership and initiative: you identify useful
  improvements, turn agreed priorities into

  action and see work through without repeated follow-up.

  ● Strong judgment: you investigate before making changes,
  balance speed with reliability

  and know when to ask for review or escalate.

  ● Clear communication and fast learning: you make progress
  visible, explain trade-offs and

  blockers, and work effectively across a small team.

  What Success Looks Like

  You independently deliver agreed improvements, reduce
  repeated manual work, make

  deployments safer and address recurring operational
  problems. You verify the effect through

  relevant measures such as time saved, deployment
  reliability, incident recurrence or cloud cost.
