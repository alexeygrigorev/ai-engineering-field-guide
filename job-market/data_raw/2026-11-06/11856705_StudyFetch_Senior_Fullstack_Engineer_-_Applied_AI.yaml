description: |
  About Studyfetch

  StudyFetch is the #1 AI-native learning platform globally,
  transforming how millions of students learn through
  personalized AI-powered education. We’re growing fast with
  backing from top-tier investors and a mission that’s
  redefining the future of education and ethical learning.

  About the Role

  We’re seeking exceptional Senior Fullstack Engineers with
  Applied AI expertise who thrive in fast-paced startup
  environments. As we scale, you’ll join a team that’s working
  to redefine education through AI. This is an in-person role
  where you’ll work directly with our founding team to build
  technology that impacts millions of learners and educators
  worldwide.

  Key Responsibilities

  - Design and implement scalable full-stack solutions
    integrating cutting-edge AI/LLM technologies into our
    learning platform for both mobile and web
  - Experiment with emerging AI technologies to continuously
    improve our platform’s capabilities
  - Work closely with product, design, sales, and marketing
    teams to deliver features that delight students and
    educators

  Technical Requirements

  - Frontend: Expert-level proficiency in Next.js, React,
    TypeScript, and Tailwind CSS
  - Backend: Strong experience with Node.js, Express, REST API
    design, and serverless architectures
  - AI/LLM Integration: Hands-on experience implementing and
    optimizing LLM applications, prompt engineering, and AI
    workflows
  - Database: Expertise in MongoDB and PostgreSQL, with
    understanding of vector databases for AI applications
  - Cloud & Infrastructure: AWS experience (Bedrock, S3, VPC,
    Lambda), Vercel
  - Mobile: React Native experience for iOS/Android development

  What We’re Looking For

  - 5+ years of experience
  - You’ve been an early engineer at a startup or have founding
    engineer experience and are willing to work fast and long
    on issues
  - You’re motivated by our mission to democratize education
    through technology

  What We Offer

  - $170,000 - $270,000 Base Salary
  - With equity
  - 100% employer paid Medical, Dental, and Vision Insurance
  - 75% dependent coverage
  - 401(k) with employer matching
  - Daily team dinner provided in-office
  - A high-growth, mission-driven team focused on transforming
    how students learn

