  except as set forth within the following policy:
  https://pwc.to/H-1B-Lottery-Policy. Learn more about how we
  work: https://pwc.to/how-we-work For only those qualified
  applicants that are impacted by the Los Angeles County Fair
  Chance Ordinance for Employers, the Los Angeles' Fair Chance
  Initiative for Hiring Ordinance, the San Francisco Fair
