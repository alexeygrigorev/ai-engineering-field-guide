description: |
  JOB OVERVIEW

  As an AI Engineer II you’ll help implement solutions that
  utilize machine learning/deep learning models to solve
  business problems. You will be a part of a software
  engineering team focused on implementing use cases that can
  only be solved with Artificial Intelliegence. You efforts
  will form a critical pillar of the company’s SAAS based
  software to help company’s pay bills and get paid. Bring
  your experience to the table to collaborate, analyze,
  develop, test, implement, and maintain amazing software.
  Prepare to learn and grow as you employ your best efforts to
  create something genius and work along side other great
  engineers, product strategists, architects, and data
  enthusiasts.

  What You'll Do:

   Artificial Intelligence and Intelligent Systems

  - Design and develop non traditional data models geared
    towards predictive modeling or solving complex
    representational and interpretation needs.
  - Utilize statistical or mathematical methods to conduct
    exploratory data analysis and build evidence in support of
    solution approaches.
  - Utilize where necessary existing machine learning libraries
    and frameworks.
  - Keep abreast of developments in the field of Artificial
    Intelligence
  - Focus on enhancing or extending traditional application
    models with intelligent systems design.
  - Guarantee the quality and state of the ML Software Delivery
    (model lifecycle) and guide the team to improve it.

  Collaboration

  - Build open communication with your Product Owner, Quality
    Test Automation Engineers, fellow Software Engineers,
    Development DBA and Scrum Master to understand and
    transform business requirements into business-savvy
    features.

  Traditional Software Engineering

  - Solve problems, debug and optimize code to ensure optimum
    performance and security.
  - *Implement optimal architecture, efficiency,
    maintainability, and scalability parameters in cooperation
    with developers and architects
  - Team up with QA to review, approve and design test cases-
    ensuring the customers' expectations are fulfilled.
  - Manage code quality and ensure appropriate unit test
    coverage.
  - Create code that follows documented standards and best
    practices
  - Mentor other junior Engineers.

  What We're Looking For:

  Required Experience, Qualifications, and Skills

  - Bachelor’s degree in Computer Science, Computer Engineering
    or related field required and 5+ years of software
    development experience OR a Master’s degree in Computer
    Science, Computer Engineering or related and 3+ years of
    software development experience with multi-tiered systems
  - Great knowledge of C#, R, Python
  - Experience with Statistical Learning methods
  - Experience with Artificial Intelligence concepts and system
    design.
  - Good knowledge of exercising sound coding practices, such as
    unit testing, object-oriented programming, design
    patterns, and SOLID principles.
  - Thorough knowledge of handling code versions via source
    control systems (such as Git) in continuous integration
    environments
  - Hands-on experience following Agile software development
    processes (Scrum/Kanban)
  - Employing secure coding practices including familiarity with
    OWASP top ten

  Preferred Experience, Qualifications, and Skills

  - Plus one for experience in any of the following
    technologies: Hadoop, Spark, or DataBricks, Deedle
    Exploratory Library for .Net, F# Data Toolbox, XPLot.
  - Plus two for experience enhancing or extending traditional
    application models through intelligent systems design and
    the application of artificial intelligence via one or more
    of its sub disciplines: Computer Vision, Natural Language
    Understanding, Autonomous and Robotic Systems, Machine
    Learning, Deep Learning and Reinforcement Learning.
  - Plus three for experience in any one of the following
    disciplines: Systems Engineering, Feedback Control Systems
    or Model Based Software Engineering.



  Work Authorization

  For this position, AvidXchange will not sponsor applicants
  for work visas. Applicants must be currently authorized to
  work in the United States on a full-time basis.

  About AvidXchange

  AvidXchange is a leading provider of accounts payable (“AP”)
  automation software and payment solutions for middle-market
  businesses and their suppliers. By trade, we are a
  technology company, but if you ask anyone who works here,
  they’ll tell you our people are at the core of who we are.
  At AvidXchange, mindset is everything. We are Connected as
  People, Growth Minded, and Customer Obsessed. These three
  mindsets represent our culture – who we are, who we’ve
  always been, and they guide us to improve every day. Since
  our founding in 2000 in Charlotte, NC, we’ve created a
  company of over 1,300 teammates working across the U.S., or
  remotely. AvidXchange is proud to be Certified™ as a Great
  Place to Work®. The prestigious recognition is based on
  anonymous data from our teammates and makes official what
  our teammates have known for years – that AvidXchange is a
  Great Place to Work®.

  Who you are:

  - A go-getter with an entrepreneurial mindset – that means you
    are not afraid of taking risks, winning big or facing the
    unknown.
  - Someone who understands that business is people centric.
    Connecting with others as humans first allows you to
    develop mutually beneficial working relationships.
  - Focused on making a difference for our customers.
    AvidXchange exists to help solve complex problems for our
    customers so we can all realize our potential.

  What you’ll get:

  AvidXchange teammates (we call them AvidXers) get the perks
  and prestige of a growing tech company paired with the
  flexibility of a founder-led startup. We help our AvidXers
  develop as professionals and as human beings, providing
  work/life balance, development programs, and competitive
  benefits. At AvidXchange, we are building more than a tech
  company – we are building an experience. We remain committed
  to a culture where you can fully be 'you’ – connected with
  others, chasing big goals, and making a meaningful impact.
  If you want to help us grow while realizing your potential
  and creating stories you’ll tell for years, you’ve come to
  the right place.

  AvidXers enjoy:

  - 18 days PTO*
  - 11 Holidays (8 company recognized & 3 floating holidays)
  - 16 hours per year of paid Volunteer Time Off (VTO)
  - Competitive Healthcare
  - 401(k) Match: 100% match on the first 3% of your salary,
    plus 50% match on the next 2%
  - Parental Leave: 8 weeks 100% paid by AvidXchange**
  - Eldercare Leave: 8 weeks at 100% pay to care for a
    qualifying family member***
  - Discounts on Pet, Home, and Auto insurance
  - Onsite gym fitness center, yoga studio, and basketball court
  - Gym reimbursements for remote teammates up to $28/month
  - Tuition Reimbursement up to the federal maximum of $5,250***
  - Hybrid Workplace Flexibility
  - Free parking

  *Fully granted from beginning of year, pro-rated if hired
  mid-year

  **Must be full-time for at least 3 months

  ***Must be full-time for at least one year

  Equal Employment Opportunity

  AvidXchange is an equal opportunity employer. AvidXchange is
