  legally recognized basis. This includes, but is not limited
  to veteran status, race, color, religion, sex, sexual
  orientation, gender identity, gender expression, national
  origin, age and physical or mental disability.

  Applicants must be currently authorized to work in the
  United States on a full-time basis. AvidXchange does not
  provide sponsorship for employment-based work visas for this
  position.
