description: |
  The Applications Development Senior Programmer Analyst is an
  intermediate level position responsible for participation in
  the establishment and implementation of new or revised
  application systems and programs in coordination with the
  Technology team. The overall objective of this role is to
  contribute to applications systems analysis and programming
  activities. Responsibilities:

  - Conduct tasks related to feasibility studies, time and cost
    estimates, IT planning, risk technology, applications
    development, model development, and establish and
    implement new or revised applications systems and programs
    to meet specific business needs or user areas
  - Monitor and control all phases of development process and
    analysis, design, construction, testing, and
    implementation as well as provide user and operational
    support on applications to business users
  - Utilize in-depth specialty knowledge of applications
    development to analyze complex problems/issues, provide
    evaluation of business process, system process, and
    industry standards, and make evaluative judgement
  - Recommend and develop security measures in post
    implementation analysis of business usage to ensure
    successful system design and functionality
  - Consult with users/clients and other technology groups on
    issues, recommend advanced programming solutions, and
    install and assist customer exposure systems
  - Ensure essential procedures are followed and help define
    operating standards and processes
  - Serve as advisor or coach to new or lower level analysts
  - Has the ability to operate with a limited level of direct
    supervision.
  - Can exercise independence of judgement and autonomy.
  - Acts as SME to senior stakeholders and /or other team
    members.
  - Appropriately assess risk when business decisions are made,
    demonstrating particular consideration for the firm's
    reputation and safeguarding Citigroup, its clients and
    assets, by driving compliance with applicable laws, rules
    and regulations, adhering to Policy, applying sound
    ethical judgment regarding personal behavior, conduct and
    business practices, and escalating, managing and reporting
    control issues with transparency.

  Recommended Qualifications:

  - 8-12 years of relevant experience in an Apps Development
    role or senior level experience in an Enterprise
    Architecture role with
  - subject matter expert in one or more areas.
  - Proven experience in successfully building, leading, and
    delivering complex technology projects from conception
    through to
  - deployment and ongoing support.
  - Demonstrated ability to design, develop, implement, and
    provide sustained support for enterprise-grade
    applications.
  - Demonstrate knowledge on automating code quality, code
    performance, unit testing, and build processing in the
    CI/CD.
  - Hands-on expertise in developing robust, enterprise-grade
    applications leveraging modern technology stacks,
    including:
  - Frontend development using Angular or similar JavaScript
    frameworks, Backend development utilizing Java
    microservices
  - architecture, Designing and implementing RESTful APIs.
  - Demonstrable expertise in utilizing modern development tools
    and technologies across all phases of the Software
  - Development Life Cycle (SDLC) (e.g., Devin, Friday.AI,
    GitHub Co-pilot, or equivalent).
  - Working knowledge and adherence to industry best practices
    and established software development standards.
  - A strong and comprehensive understanding of Wealth
    Management, Retail Banking operations, CRM, various
    investment
  - products, and critical back-office operations within a
    financial institution.
  - Exceptional written and verbal communication skills, with
    the ability to articulate complex technical concepts and
    strategic
  - objectives clearly and concisely to diverse audiences.
  - Prior exposure to Gen AI/Agentic AI implementations in a
    financial domain desirable

  Education:

  - Bachelor’s degree/University degree or equivalent experience

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

