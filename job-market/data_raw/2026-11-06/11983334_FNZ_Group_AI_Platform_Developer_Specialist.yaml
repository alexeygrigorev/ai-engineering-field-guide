description: |
  Role Description: AI Platform Engineers are software
  developers who build, maintain, and evolve the FNZ’s
  deployment framework that underpins FNZ's AI and non-AI
  products.

  The AI Platform Engineer will work within FNZ's Client
  Application Deployment Framework and internal Launchpad,
  ensuring AI services such as AI Foundry, LLMs, RAG
  platforms, MCP gateways, model serving infrastructure,
  storage, caching, and associated cloud services are
  delivered using the same engineering standards, governance,
  operational processes, and FinOps principles applied across
  FNZ's broader platform estate.

  The role requires a strong Platform Engineering mindset,
  combining expertise in cloud infrastructure, Kubernetes,
  IaaC, CI/CD, observability, security, and automation with
  knowledge of modern AI infrastructure patterns, agentic
  workloads, model lifecycle management, and AI governance
  requirements.

  Specific Role Responsibilities:

  - Design, develop, and maintain reusable cloud infrastructure
    and platform capabilities using Terraform, Azure,
    Kubernetes, and Infrastructure-as-Code best practices.
  - Implement and operate AI infrastructure services including
    Azure AI Foundry (preferred), LLM platforms, MCP gateways,
    RAG solutions, vector databases, storage, and caching
    services.
  - Build, maintain, and optimise CI/CD pipelines, automation
    frameworks, and deployment processes using GitHub, GitHub
    Actions, and modern Platform Engineering practices.
  - Enable product teams to securely deploy and consume AI and
    cloud services through standardised platform patterns,
    self-service capabilities, and golden paths.
  - Implement security, identity, access control, data
    governance, and compliance controls for cloud and AI
    workloads, including management of sensitive and regulated
    data.
  - Establish observability, monitoring, distributed tracing,
    logging, and usage instrumentation to ensure platform
    reliability, operational visibility, and AI workload
    performance.
  - Drive FinOps and cost optimisation initiatives by
    implementing infrastructure, cloud, and AI service usage
    monitoring, reporting, and governance controls.
  - Support the lifecycle management of AI services and models,
    including onboarding, upgrades, deprecation planning,
    rollout of new capabilities, and operational support.
  - Collaborate with Product, Platform Engineering, Security, AI
    Governance, and Operations teams to design scalable,
    secure, and resilient platform solutions.
  - Evaluate emerging cloud, AI, and Platform Engineering
    technologies, contributing to the continuous improvement
    of FNZ's Application Deployment Framework (ADF) and
    overall platform strategy.

  Infrastructure (IaC) implementation

  - Implement infrastructure architecture designs to support
    agentic workloads, including models, LLM and MCP gateways,
    RAG, storage, and caching for agentic loops and inference
  - Implement data governance controls (e.g. access control and
    handling of PII within RAG stores)
  - Iterate as agent patterns and provider offerings evolve

  Support for product development

  - Assist product teams with configuration and deployment of
    infrastructure aligned to their use cases
  - Ensure appropriate cost and usage instrumentation (e.g.
    token/API usage) for each AI product
  - Ensure access controls are in place around the product’s LLM
    and tool usage.
  - Assist product teams in evidencing the above when seeking
    approvals.

  Note: development of harnesses and agents sits with other
  teams

  Production support and lifecycle management

  Provide an escalation point for AI related production
  support queries.

  Participate in monitoring and feedback loops between AI
  Governance, Product, and Project teams, including supporting
  model version deprecation, preview evaluations, and rollout
  of replacement models for across projects. Assist InfoSec
  and project teams with stale or toxic data and memory
  cleanup as the need arises. Experience required Primary
  Experience:

  - Bachelor’s degree or higher (min A- average for under-
    graduate, first class for post-graduate);
  - Experience deploying and operating LLM-based solutions in
    Azure or other major cloud providers.
  - Experience with MCP (Model Context Protocol).
  - Familiarity with AI gateways, model routing, and model
    management platforms.
  - Experience implementing RAG solutions including vector
    databases, caching strategies, and retrieval pipelines.
  - Understanding of agent orchestration frameworks.
  - Knowledge of AI security and governance controls.
  - Experience implementing data residency and regulatory
    compliance requirements.
  - Experience building reusable platforms, developer self-
    service capabilities, and golden-path architectures.
  - Experience developing Terraform modules, providers, or
    reusable infrastructure frameworks.
  - Experience with HashiCorp Vault, Key Vault, or equivalent
    secret-management technologies.

  Preferred Experience: Microsoft Azure experience Essential
  Technical Skills:

  - Terraform and Infrastructure-as-Code
  - Microsoft Azure (Preferred)
  - Azure AI Foundry (Preferred)
  - Kubernetes (Production Operations and Troubleshooting)
  - GitHub / GitHub Actions
  - Open Telemetry and Distributed Tracing
  - Monitoring and Logging Platforms
  - Azure Networking and Hybrid Connectivity (Preferred)
  - LLM, RAG and MCP

