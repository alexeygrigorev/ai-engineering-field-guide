title: Senior Software Engineer II, Mobile - Revenue Experiences (AI Native)
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360

  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 102.4 million monthly active
  users (MAU), as of June 30, 2026, across more than 180
  countries.

  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).

  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.

  Life360 is a remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.

  We are AI Native

  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.

  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.

  About The Team

  The Revenue Experiences team (Direct Revenue org) owns the
  premium experience behind Life360 membership. We work on
  subscription tiering, pricing, packaging, and positioning,
  and we own the premium features and services members pay
  for: the ones that exist today and the ones we haven't built
  yet. This includes maintaining these services and ensuring
  they consistently meet the highest quality standards for our
  premium users.

  Our focal point is ownership and quality. We extend the
  premium feature set by building new features while keeping
  the existing ones healthy, fast, and worth the price. We
  still run experiments across paywalls, pricing, ad placement
  and mediation because every monetization and packaging
  decision should be grounded in evidence, not instinct. But
  experiments are how we decide what to build and how to
  package it, not the whole job.

  We are a product-minded, AI-Native engineering team. AI
  isn't just a tool we use — it's how we work. We treat it as
  a first-class collaborator at every stage: ideation, coding,
  testing, review, and iteration. We ship faster and go deeper
  because of it, and we're looking for someone who wants to
  help define what that looks like at scale.

  About the Job

  Life360 is hiring an AI-Native Senior Software Engineer II —
  a builder who thinks natively in AI tooling and takes real
  ownership of outcomes, not just tickets. You'll be central
  to how the Revenue Experiences team builds, ships, and
  maintains the premium features and monetization surfaces
  behind Life360 membership.

  You'll take ideas from a brief to a shipped product that
  holds up for 100M+ monthly active users, and you'll own
  premium features end-to-end: building new ones and keeping
  existing ones reliable and good as they grow. Why now:
  premium features are what members pay for and the set keeps
  growing, so the quality bar rises with every launch. This
  role keeps the existing features strong while we build the
  new ones.

  In your first year, success looks like owning the end-to-end
  delivery of several features or experiments that contribute
  to global revenue growth or improve the quality of premium
  features we already serve to our existing customers.

  For candidates based in the US, the salary range for this
  position is $118,500 to $216,500 USD. For candidates based
  out of Canada, the salary range for this position is 171,500
  to 201,000 CAD. Note: Please be aware that the job title for
  positions in Canada will be "Developer" in lieu of
  "Engineer." We take into consideration an individual's
  background, job-related knowledge, skills, and experience in
  determining final salary. Base pay may also vary based on
  geographic location, with US work locations falling into one
  of three geographic tiers.

  Total compensation is inclusive of equity compensation in
  the form of Restricted Stock Units (RSUs), as well as a
  comprehensive benefits package, including medical, dental,
  vision, financial, and other benefits.

  What You’ll Do

  - Design, build, and maintain the premium features and
    services behind Life360 membership, owning their quality
    from design through production: new features, extensions
    to existing ones, and the unglamorous fixes that keep them
    reliable.
  - Build the surfaces that carry our subscription tiering,
    pricing, packaging, and positioning: paywalls, plan
    selection, upsell and upgrade flows, and one-time purchase
    (IAP) flows.
  - Own the quality of the ads experience, including placement,
    mediation, and the performance and stability impact ads
    have on the app.
  - Partner with product, design, data science, and analytics to
    turn hypotheses into shippable work and results into the
    next decision — pushing back when a hypothesis or plan
    doesn't hold up.
  - Work with AI (Claude Code or equivalent) as a first-class
    collaborator — your primary workflow involves
    orchestrating agents to create specs, generate code and
    tests, verify results, and perform reviews.
  - Ship polished, performant, reliable experiences to 100M+
    users, with strong attention to startup time, memory,
    battery, ANR, and crash-free rates.
  - Contribute to architectural decisions, code reviews, and a
    culture of craft and continuous improvement across the
    mobile codebases.
  - Participate in on-call rotation and incident response for
    premium features and releases.
  - Mentor other engineers and contribute to team processes,
    technical standards, and the evolution of the team's AI-
    native engineering practices.

  What We’re Looking For

  Required:

  - 6+ years of Android software engineering experience shipping
    production apps at consumer scale.
  - Cross-platform, including 1+ year of AI-assisted iOS
    development.
  - Experience with in-app billing and subscription platforms
    (Google Play Billing and StoreKit).
  - Strong proficiency with Kotlin and Jetpack Compose (and the
    Android View system); deep familiarity with the modern
    Android toolchain (Android Studio, Kotlin Coroutines,
    Flow).
  - Experience with Android architecture patterns (MVVM, MVI,
    Clean Architecture, Jetpack/ViewModel/Navigation, Hilt or
    Dagger) in a large, multi-team codebase.
  - Comfort with mobile experimentation concepts: feature
    flagging, A/B testing, exposure logging, holdouts, and
    guardrail metrics.
  - Solid grounding in mobile performance, memory, battery, ANR,
    and crash diagnostics (Android Studio Profiler,
    Perfetto/Systrace, Macrobenchmark, Crashlytics or
    equivalent).
  - Experience with CI/CD for Android (Gradle, Fastlane, GitHub
    Actions, Bitrise, or similar) and modular build systems.
  - Strong technical expertise in LLM-powered agentic systems,
    prompt engineering, context-window optimization, and MCP-
    based integrations.
  - Communicates tradeoffs clearly.
  - Bachelor's degree in a technical field, or equivalent
    experience.

  Optional:

  - Experience with mobile ad SDKs and mediation (AdMob,
    AppLovin MAX, or similar).
  - Experience working with an experimentation platform
    (Statsig, LaunchDarkly, Optimizely, Eppo, GrowthBook, or
    similar).
  - Background in mobile analytics pipelines (Amplitude,
    Segment, Snowflake/Databricks downstream).
  - Contributions to mobile open source or internal developer
    tooling.

  AI-Native Expectations

  We use AI coding tools as a professional standard on this
  team. In practice:

  - Daily use — You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation, not just research or
    autocomplete.
  - Judgment and ownership — AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity — We expect senior engineers who use AI well to
    operate with meaningful leverage, taking on problems that
    would otherwise require a larger team.
  - Team leadership — You share what works, automate prompting
    strategies others can build on, and help teammates earlier
    in their AI workflow adoption get up to speed.
  - Continuous learning — The tooling changes fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.

  Our Benefits

  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer life and disability
    as well as supplemental plans for medical and dental for
    Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Paid parental leave.
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being.
  - Generous time off: flexible PTO, companywide holidays
    throughout the year plus summer and winter shutdowns.
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership and Tile trackers.

  AI Usage: We use AI to help make our hiring process
  efficient. That said, every hiring decision is made by real
  Life360 hiring teams

  Life360 Values

  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference

  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.

  Our Commitment to Belonging

  Life360 is an equal opportunity employer. We don’t
  discriminate on the basis of race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, disability status, or any other legally
  protected status. We believe diverse perspectives make us
  better, and we’re building a workplace that reflects the
  communities we serve. Don’t meet every qualification? Apply
  anyway.

