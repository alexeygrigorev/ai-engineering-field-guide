description: |
  We’re looking for an ERPNext / Frappe developer to join our
  team and take ownership of ongoing development,
  customizations, integrations, and maintenance.

  You should have hands-on experience using AI coding agents
  such as Claude Code, OpenAI Codex, Cursor, or equivalent
  tools as part of your development workflow. We want someone
  who can guide these tools effectively, review their output,
  and take responsibility for the finished code.

  What you’ll do

  - Develop and maintain custom Frappe applications and ERPNext
    functionality.
  - Build DocTypes, workflows, reports, dashboards, and print
    formats.
  - Integrate ERPNext with external platforms through APIs and
    webhooks.
  - Diagnose bugs, improve performance, and maintain existing
    customizations.
  - Use AI coding agents to support implementation, debugging,
    refactoring, testing, and documentation.
  - Review generated code for correctness, security,
    maintainability, and compatibility with our ERPNext
    version.
  - Work through Git, staging environments, and a clear release
    process.
  - Communicate progress, flag blockers, and clarify
    requirements before making assumptions.

  Requirements

  What we’re looking for

  - Proven ERPNext / Frappe development experience beyond
    installation and configuration.
  - Strong Python, JavaScript, and SQL skills.
  - Experience with Frappe permissions, document events,
    background jobs, and migrations.
  - Practical experience using AI coding agents on real
    development projects.
  - Ability to understand an existing codebase and debug code
    independently.
  - Experience with Git, Linux, and deploying or maintaining
    Frappe applications.
  - Clear written and spoken English.
  - Availability for agreed working-hour overlap with our team
    on Eastern Time (ET).

  Useful additional experience

  - ERPNext manufacturing, inventory, purchasing, and accounting
    workflows.
  - Vue.js and custom Frappe interfaces.
  - Docker, automated testing, and CI/CD.

  Benefits

  Location: Remote - Latin America preferred; candidates based
  in India also welcome Commitment: Full-time, long-term

  Budget: Around USD $2,000 per month, depending on experience

  How to apply

  Please send:

  - A summary of your ERPNext / Frappe experience, including
    versions and modules you’ve worked with.
  - Two relevant projects, explaining your specific
    contribution. GitHub links or code samples are welcome.
  - Which AI coding agents you use and an example of how you
    used one to deliver an ERPNext / Frappe feature.
  - An example of incorrect code an AI agent produced, how you
    identified the issue, and how you fixed it.
  - Your location, time zone, start date, and expected monthly
    compensation.
  - Confirmation that you’re available for a full-time role.

  Shortlisted candidates will be invited to a technical
  discussion. You’re encouraged to use your usual AI coding
  tools during the task and explain your approach, review
  decisions, and validation.
