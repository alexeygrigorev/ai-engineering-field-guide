description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Key Responsibilities

  - GenAI System Development: Design, build, and improve GenAI-
    powered and agentic systems supporting ASIC semiconductor
    engineering workflows such as code generation, data
    extraction, analytics, documentation automation, failure
    triage, root cause analysis, and technical knowledge
    retrieval.
  - LLM Workflow Engineering: Build, evaluate, and optimize LLM-
    based workflows, including prompting, developing skills,
    retrieval-augmented generation (RAG and Graph-RAG),
    benchmarking, and quality evaluation.
  - Machine Learning Production: Develop and implement machine
    learning and deep learning models for classification,
    regression, anomaly detection, failure analysis, and
    engineering decision support.
  - Cross-Functional Collaboration: Partner with domain experts
    and cross-functional teams to translate complex
    engineering problems into scalable AI/ML and analytics
    solutions.
  - Production Deployment: Support deployment, monitoring, and
    operationalization of AI/ML solutions in cloud and
    enterprise environments.
  - Technical Communication: Communicate technical findings,
    recommendations, and model outcomes clearly to both
    technical and non-technical stakeholders.
  - Innovation Leadership: Identify and drive high-impact
    opportunities where GenAI, machine learning, and analytics
    can improve engineering productivity and business
    outcomes!

  Minimum Qualifications

  - Bachelor's with 10+ years or Master's degree with 8+ in
    Electrical Engineering, Computer Science, Data Science,
    Statistics, Artificial Intelligence, or a related field
  - Minimum 4 years of hands-on experience developing and
    deploying AI applications in semiconductors, electronics,
    or other engineering industries.
  - Strong programming proficiency in Python.
  - Familiarity with modern AI coding tools / agentic coding
    harnesses, such as Claude Code, Cursor, Gemini CLI, or
    similar tools.
  - Practical experience in developing and implementing AI/ML
    systems involving LLMs, including RAG, agentic workflows,
    and frameworks.

  Preferred Qualifications

  - Experience building agentic systems or AI solutions for ASIC
    semiconductor pre-silicon and post-silicon workflows.
  - Deep understanding of semiconductor-specific AI/ML
    applications
  - Cloud experience with GCP, AWS, or Azure, including
    deploying ML pipelines in production.
  - Experience with LLM training, inference, and evaluation
    workflows, including prompt design, benchmarking,
    validation, or retrieval-augmented systems.
  - Experience with data analytics and visualization to deliver
    actionable engineering insights using tools and libraries
    such as pandas, scikit-learn, matplotlib, plotly, or
    similar ecosystems.
  - Experience with web application technologies such as
    JavaScript, HTML, and CSS.
  - Experience designing scalable, enterprise-grade AI/ML
    systems with attention to reliability, traceability, and
    operational readiness.
  - Familiarity with document-processing pipelines, technical
    knowledge platforms, or retrieval systems for engineering
    content.
  - Experience working in multi-functional environments spanning
    systems architecture, engineering, data science, and IT.

