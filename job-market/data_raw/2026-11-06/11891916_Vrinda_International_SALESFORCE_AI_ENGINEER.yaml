description: |
  Salesforce AI Engineer

  Summary

  We are seeking a highly skilled Salesforce AI Engineer to
  drive the integration of artificial intelligence
  capabilities within our IT Services ecosystem. This pivotal
  role focuses on leveraging advanced Salesforce development
  tools and AI-driven frameworks to enhance enterprise
  solutions. The successful candidate will bridge the gap
  between complex system integrations and modern AI
  technologies, ensuring robust, scalable, and intelligent
  implementations that align with our strategic business
  objectives.

  Responsibilities

  - Architect and execute comprehensive Salesforce integrations
    and large-scale enterprise implementations.
  - Design and develop custom solutions using Apex, Triggers,
    and other core Salesforce development languages.
  - Lead the adoption and configuration of AI-powered
    development environments, including Copado AI, GitHub
    Copilot, Cursor, and Claude.
  - Implement and manage Agentforce capabilities to automate
    workflows and enhance user experiences.
  - Conduct rigorous unit and integration testing to guarantee
    system reliability and performance.
  - Collaborate within Agile/Scrum teams to deliver high-quality
    software solutions on schedule.
  - Optimize existing Salesforce architectures to incorporate
    emerging AI features and best practices.

  Requirements

  Requirements:

  - Possess 4 to 6 years of professional experience in
    Salesforce development and implementation.
  - Demonstrate proven expertise in Salesforce Integrations and
    Enterprise Salesforce deployments.
  - Proficiency in Apex programming, including the creation of
    Triggers and custom logic.
  - Strong background in Agile/Scrum methodologies and software
    delivery lifecycles.
  - Hands-on experience with Unit & Integration Testing
    frameworks and practices.
  - Familiarity with AI-enhanced development tools such as
    Copado AI, GitHub Copilot, Cursor, and Claude.
  - Knowledge of Agentforce and its application within the
    Salesforce ecosystem.
  - Salary expectation: ₹12 lpa.
