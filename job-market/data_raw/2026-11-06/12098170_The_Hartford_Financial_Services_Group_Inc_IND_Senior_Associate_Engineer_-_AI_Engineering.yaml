  Leadership Expectations

  Area

  Required capability

  What good looks like in the HIG India POD

  Ownership

  Takes accountability for outcomes, not only assigned tasks.

  Raises risks early, follows through on commitments, and
  drives blockers to closure.

  Technical judgment

  Uses design thinking and tradeoff analysis to choose
  maintainable solutions.

  Can explain options, risks, and recommended approach to tech
  leads and stakeholders.

  Collaboration

  Works across US/India time zones and functions without
  waiting for perfect instructions; learns adjacent QE
  practices such as Playwright and contributes where needed.

  Brings questions, proposals, and artifacts that make
  decisions easier.

  Mentoring

  Helps peers with code reviews, debugging, standards, and
  onboarding.

  Improves POD capability through examples, documentation, and
  pairing.

  Bias for action

  Moves work forward with appropriate urgency while respecting
  enterprise controls.

  Breaks ambiguous problems into next steps and demonstrates
  follow-through.

  Business Acumen Expectations

  Area

  Required capability

  What good looks like in the HIG India POD

  Outcome orientation

  Understands how technical work supports claimant, employer,
  operations, and product outcomes.

  Frames decisions around stability, speed, user experience,
  and business risk.

  Domain awareness

  Develops working knowledge of Employee Benefits, claims,
  intake, leave, payments, profile, and service workflows
  relevant to the POD.

  Can connect defects/features to user journeys and
  operational impact.

  Risk and controls

  Understands compliance, data protection, security,
  accessibility, and production-readiness expectations.

  Plans for controls during development rather than treating
  them as afterthoughts.

  Financial awareness

  Understands HIG India is a strategic capacity and vendor-
  reduction lever.

  Demonstrates productivity, knowledge transfer, and reduced
  dependency on external SMEs.

  Communication

  Communicates clearly with business/technology partners using
  concise status, risks, decisions, and asks.

  Can explain technical topics in business-friendly language.

  Required Skills & Experience

  Software Engineering

  ·         5+ years of software engineering experience.

  ·         Strong Java development experience with Spring
  Boot and enterprise API development.

  ·         Strong understanding of SOLID principles, design
  patterns, and microservices architecture.

  ·         Hands-on experience developing RESTful APIs and
  service integrations.

  ·         Experience with SQL, database troubleshooting, and
  enterprise application support.

  Python Development

  ·         Strong Python development experience for
  automation, analytics, AI workflows, and backend services.

  ·         Experience using Python libraries such as:

  ·         Pandas

  ·         NumPy

  ·         FastAPI

  ·         PyTest

  ·         LangChain/LangGraph (preferred)

  AI & GenAI Experience

  ·         Demonstrated experience designing, developing, and
  deploying AI solutions in production environments.

  ·         Experience building:

  ·         AI pipelines

  ·         AI agents

  ·         Enterprise AI integrations

  ·         Event-driven AI workflows

  ·         Experience tuning, testing, evaluating, and
  optimizing AI solutions.

  ·         Experience implementing AI governance controls and
  responsible AI practices.

  ·         Experience working with enterprise LLM platforms.

  AI Modeling Skills

  ·         Natural Language Processing (NLP)

  ·         Intent Classification

  ·         Prompt Engineering

  ·         LLM Evaluation Frameworks

  ·         Retrieval-Augmented Generation (RAG)

  ·         Agentic AI Architecture

  ·         Risk Assessment and Confidence Evaluation

  ·         AI Monitoring and Operational Excellence

  Cloud & Platform Skills

  ·         AWS (preferred) or GCP experience.

  ·         Containerization technologies (Docker/Kubernetes).

  ·         CI/CD pipelines.

  ·         GitHub and GitHub Actions.

  ·         Cloud observability and monitoring tools.

  Preferred / Nice-to-Have Skills

  ·         Java 17/21, Spring Boot 3, Spring 6, Tomcat,
  containerization or cloud migration experience.

  ·         Vertex AI, Gemini, OpenAI, Azure OpenAI,
  Anthropic, or similar AI platforms.

  ·         Vector databases such as Pinecone, Weaviate,
  Chroma, or Vertex AI Search.

  ·         LangChain, LangGraph, Semantic Kernel, CrewAI, or
  equivalent orchestration frameworks.

  ·         MLOps and AI Operations experience.

  ·         Insurance, Benefits, Claims, Leave Management, or
  Financial Services domain experience.

  ·         Experience building enterprise copilots and
  intelligent workflow solutions.

