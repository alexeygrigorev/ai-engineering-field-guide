description: |
  IND Senior Software Engineer - GCC024

  We’re determined to make a difference and are proud to be an
  insurance company that goes well beyond coverages and
  policies. Working here means having every opportunity to
  achieve your goals – and to help others accomplish theirs,
  too. Join our team as we help shape the future.

  Purpose: Recruit and assess a hands-on Java/AI engineer for
  the HIG India POD model, with emphasis on Java design
  patterns, secure API/backend delivery, Python as an adjacent
  technical skill, cloud readiness, AI developer tools,
  ownership, and business-aligned execution.

  Design principle: This is one Java JD. Python is included as
  a supporting technical skill, not as a separate role. The
  expectation is strong Java engineering fundamentals, AI-
  assisted delivery habits, mature technical judgment, and
  ability to operate in an accountable POD with US + India
  collaboration.

  Location

  Hyderabad, India

  Employment type

  Full-time

  Experience level

  4-6 years preferred; strong candidates with lower tenure may
  be considered if they demonstrate excellent fundamentals,
  learnability, and analytical problem solving.

  Role family

  Software Engineering - Application Development

  Operating model

  HIG India POD / Agile delivery team with strong
  collaboration across US and India

  Core expectation

  Strong Java engineering coupled with Python-based AI
  development, GenAI solution delivery, API integration,
  cloud-native architecture, AI developer tools, and
  accountable POD ownership. Candidate should be capable of
  designing, developing, deploying, and operating enterprise
  AI-enabled applications and intelligent workflows while
  maintaining secure, scalable, and compliant software
  solutions.

  Position Overview

  The Employee Benefits IT team is seeking a Software Engineer
  with strong Java, Python, API engineering, and AI
  development capabilities to support HIG India POD
  initiatives across application modernization, intelligent
  automation, GenAI solutions, cloud-native architectures, and
  enterprise platform delivery.

  The ideal candidate combines strong software engineering
  fundamentals with practical AI implementation experience,
  including large language models (LLMs), AI orchestration
  frameworks, RAG-based solutions, prompt engineering, and
  production AI governance. The engineer should be comfortable
  building secure APIs, integrating enterprise systems,
  operationalizing AI solutions, and collaborating across
  Product, Architecture, QE, DevOps, Data, and Business teams.

  Key Responsibilities

  ·         Design, develop, test, deploy, and support
  enterprise applications using Java, Spring Boot, Python, and
  cloud-native technologies.

  ·         Build and maintain REST APIs, event-driven
  integrations, and scalable backend services.

  ·         Design and implement end-to-end AI solutions
  including:

  ·         Data ingestion pipelines

  ·         Retrieval-Augmented Generation (RAG)

  ·         Agentic workflows

  ·         Model integrations

  ·         Enterprise AI service orchestration

  ·         Develop AI-powered applications using LLMs, prompt
  engineering techniques, and semantic search capabilities.

  ·         Implement AI governance controls, guardrails,
  monitoring, evaluation frameworks, and responsible AI
  practices.

  ·         Integrate AI services with downstream
  applications, APIs, databases, and enterprise platforms.

  ·         Use AI developer tools responsibly to accelerate
  coding, testing, code analysis, documentation, and
  troubleshooting.

  ·         Participate in Agile ceremonies and contribute to
  architecture discussions, technical design reviews, and
  production readiness assessments.

  ·         Collaborate with business stakeholders to
  understand customer journeys, operational workflows, and
  automation opportunities.

  ·         Troubleshoot production issues using logs,
  monitoring tools, telemetry, AI observability platforms, and
  structured root-cause analysis.

  ·         Contribute to engineering standards related to
  software quality, AI governance, security, performance, and
  reliability

