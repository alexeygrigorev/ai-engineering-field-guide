description: |
  About the role

  You will build the shared AI platform every Truvio product
  team uses to ship agents into Dynamics 365. Think model
  access, retrieval, evaluation, guardrails and observability,
  delivered as paved roads so product teams can move fast
  without reinventing the plumbing. Your users are our
  engineers; your measure of success is how quickly and safely
  they ship AI features to customers.

  What you will do

  • Design and run the core platform services: LLM gateway and
  model routing, prompt and tool registries, retrieval over
  our context graph, and agent orchestration.

  • Build evaluation and testing infrastructure so every AI
  feature has offline evals, regression suites and production
  quality signals before and after release.

  • Make AI safe to run in customer ERP tenants: tenant
  isolation, data residency, PII handling, cost controls,
  audit trails and human-in-the-loop hooks for Trust &
  Control.

  • Own observability for AI workloads: tracing, latency,
  token cost and quality dashboards per customer and per
  feature.

  • Ship SDKs, templates and docs that let product teams build
  an agent in days, not months.

  • Partner with the Principal AI Engineer and product teams
  to turn repeated needs into platform capabilities.

  • Evaluate new models and frameworks with a bias toward what
  is proven in production.

  What you bring

  • 6+ years of software engineering, with at least 2 years
  building production systems on top of LLMs or ML models.

  • Strong backend skills in Python and/or C#/.NET, plus solid
  API and distributed systems design.

  • Hands-on cloud experience, ideally Azure (Azure OpenAI or
  AI Foundry, AKS or Container Apps, Functions, Key Vault).

  • Practical experience with retrieval, embeddings, vector or
  graph stores, and agent or tool-calling patterns.

  • A habit of measuring things: evals, SLOs, cost per
  request.

  • Infrastructure as code and CI/CD (Bicep or Terraform,
  GitHub Actions or Azure DevOps).

  • Clear written English and comfort working across time
  zones in a remote team.

  Nice to have

  • Experience with Microsoft Dynamics 365, Dataverse or other
  ERP data models.

  • Knowledge graphs or graph databases.

  • Familiarity with MCP, Semantic Kernel, LangGraph or
  similar agent frameworks.

  • Working knowledge of GDPR, the EU AI Act or SOC 2 controls
  as they apply to AI systems.

  • Experience building internal developer platforms at a
  multi-product company.

  Who you are

  You combine technical curiosity with a strong sense of
  ownership and a practical approach to problem-solving. You
  enjoy making complex technology easier for others to use,
  sharing knowledge and building solutions that teams can rely
  on. You build trust through clear communication and
  collaboration, and you care as much about the developer
  experience as the technology behind it.

  Why Truvio

  At Truvio, you will join a global SaaS environment with a
  clear product focus and a strong connection to the Microsoft
  Dynamics ecosystem. This role gives you the opportunity to
  build shared AI capabilities that support product teams
  across Truvio. Working alongside the Principal AI Engineer
  and product teams, you will help make it easier to deliver
  reliable AI features and turn technical innovation into
  meaningful customer value.

  Other information

  Location: Remote, Europe (Nordic hubs or Vienna welcome). We
  have offices in Sweden, Denmark, UK and the Netherlands.

  Level: Senior individual contributor

  Employment: Permanent, 100 %

  Start: As soon as we find the right candidate

  About Truvio

  Truvio is a global software company delivering solutions for
  Microsoft Dynamics 365. We help organizations get more value
  from their business systems by bringing together finance,
  business operations and commerce. Truvio has approximately
  450 employees across North America, Europe, Asia and
  Australia.

  Our core values: Take Ownership, Build Trust, Drive
  Innovation and Succeed Together, guide how we work and help
  our customers get more from their ERP investments. Own your
  growth, shape your future with us.

  Ready to help build the foundation for AI at Truvio? We’d
  love to hear from you.
