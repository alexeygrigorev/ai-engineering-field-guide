description: |
  Bring more to life. At Danaher, our work saves lives. And
  each of us plays a part. Fueled by our culture of continuous
  improvement, we turn ideas into impact, innovating at the
  speed of life. Our 60,000+ associates work across the globe
  at more than 15 unique businesses within life sciences,
  diagnostics, and biotechnology. Are you ready to accelerate
  your potential and make a real difference? At Danaher, you
  can build an incredible career at a leading science and
  technology company, where we're committed to hiring and
  developing from within. You'll thrive in a culture of
  belonging where you and your unique viewpoint matter. DHR
  Enterprise AI Solutions is Danaher's enterprise AI
  engineering capability, responsible for identifying
  opportunities, building and scaling reusable AI solutions,
  and accelerating measurable business impact across operating
  companies. We combine product, architecture, AI science,
  engineering and operations to industrialise AI, establish
  enterprise standards and enable the next generation of AI-
  powered products, workflows, applications and decision-
  making. We look forward to welcoming you to our
  organisation. In DHR Enterprise AI Solutions, you will be
  responsible for designing, developing and deploying
  production-grade AI solutions that create measurable
  business value across Danaher operating companies. You will
  work within multidisciplinary engineering teams to transform
  business opportunities into scalable AI applications,
  agents, services and reusable capabilities that can be
  adopted, operated and supported across the enterprise. In
  this role, you will have the opportunity to: • Design,
  develop and deploy AI solutions for enterprise applications
  and products, building scalable AI services, workflows and
  reusable capabilities that solve real business problems. •
  Develop and optimise Large Language Model (LLM) applications
  using prompt engineering, Retrieval-Augmented Generation
  (RAG), fine-tuning, agentic workflows and modern AI
  engineering techniques. • Implement and support MLOps,
  DataOps and LLMOps practices for model lifecycle management,
  deployment, monitoring, governance and continuous
  improvement. • Contribute to the design and implementation
  of scalable, reliable and maintainable AI architectures,
  ensuring solutions meet enterprise standards for quality,
  performance, security and supportability. • Collaborate
  closely with Product Owners, Architects, AI Scientists,
  Platform and Data Engineering teams to build, industrialise
  and scale trusted, reusable AI solutions across Danaher. The
  essential requirements of the job include: • 5+ years of
  software engineering experience with significant hands-on
  experience building AI, machine learning or advanced
  analytics solutions. • Strong proficiency in Python and
  modern AI development frameworks, libraries and tooling. •
  Experience developing, deploying and supporting production-
  grade AI, machine learning or data-driven solutions in cloud
  environments. • Strong understanding of software engineering
  practices, architecture patterns, APIs, microservices, CI/CD
  and cloud-native development. • Good understanding of modern
  AI methodologies, including LLMs, semantic models, knowledge
  and context graphs, Retrieval-Augmented Generation (RAG) and
  agentic AI architectures. It would be a plus if you also
  possess previous experience in: • Building or deploying AI
  solutions in regulated industries such as life sciences,
  diagnostics, healthcare or advanced manufacturing. •
  Developing AI capabilities that support knowledge
  extraction, decision support, process optimisation or
  workflow automation across enterprise data ecosystems. •
  Enterprise AI governance and Responsible AI practices,
  including model evaluation, explainability, bias assessment
  and compliance with emerging AI regulations and frameworks.
  Danaher offers a broad array of comprehensive, competitive
  benefit programs that add value to our lives. Whether it's a
  healthcare program or paid time off, our programs contribute
  to life beyond the job. At Danaher, we believe in designing
  a better, more sustainable workforce. We recognise the
  benefits of flexible and remote working arrangements for
  eligible roles and are committed to providing enriching
  careers regardless of work arrangement. This position is
  eligible for a remote work arrangement in which you can work
  remotely from your home. Additional information about this
  remote work arrangement will be provided by your interview
  team. Explore the flexibility and challenge that working for
  Danaher can provide.

  Join our winning team today. Together, we’ll accelerate the
  real-life impact of tomorrow’s science and technology. We
  partner with customers across the globe to help them solve
  their most complex challenges, architecting solutions that
  bring the power of science to life.

  For more information, visit www.danaher.com.
