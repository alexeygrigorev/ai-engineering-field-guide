title: Sr. Developer, AI and Agentforce
company: NeuraFlash
location: USA
remote: true
work_type: FULL_TIME
description: |
  Why NeuraFlash, Part of Accenture:

  At NeuraFlash, Part of Accenture, we are redefining the
  future of business through the power of AI and
  groundbreaking technologies like Agentforce. As a trusted
  leader in AI, AWS, and Salesforce innovation, we craft
  intelligent solutions—integrating Salesforce Einstein,
  Service Cloud Voice, Amazon Connect, Agentforce and more—to
  revolutionize workflows, elevate customer experiences, and
  deliver tangible results. From conversational AI to
  predictive analytics, we empower organizations to stay ahead
  in an ever-evolving digital landscape with cutting-edge,
  tailored strategies.

  We are proud to be creating the future of generative AI and
  AI agents. Salesforce has launched Agentforce, and
  NeuraFlash, Part of Accenture, was selected as the only
  partner for the private beta prior to launch. Post-launch,
  we’ve earned the distinction of being Salesforce’s #1
  partner for Agentforce, reinforcing our role as pioneers in
  this transformative space.

  Be part of the NeuraFlash, Part of Accenture journey and
  help shape the next wave of AI-powered transformation. Here,
  you’ll collaborate with trailblazing experts who are
  passionate about pushing boundaries and leveraging
  technologies like Agentforce to create impactful customer
  outcomes. Whether you're developing advanced AI-powered
  bots, streamlining business operations, or building
  solutions using the latest generative AI technologies, your
  work will drive innovation at scale. If you’re ready to make
  your mark in the AI space, NeuraFlash, Part of Accenture is
  the place for you.

  As a Sr. Developer on our AI Acceleration team, you will be
  responsible for delivering high-quality, scalable, AI-
  powered solutions across Salesforce Agentforce and Data 360,
  as well as net-new AI technologies adjacent to the
  Salesforce ecosystem. You'll build Agentforce agents and
  automations, architect underlying data foundations,
  prototype emerging AI capabilities, and craft the Apex and
  LWCs that help bring these solutions to life. As part of the
  broadening agentic landscape, you'll have regular
  opportunity to work on other platforms — AWS, GCP, and
  beyond — and to explore technologies that haven't yet become
  mainstream Salesforce practice. You will work closely with
  project teams and engage directly with customers to shape
  the right solution, often for their most strategic and
  forward-looking initiatives.

  You will have the opportunity to:

  - Build, test, and enhance Agentforce Agents, workflows, and
    automations, supporting intelligent customer-facing and
    internal experiences
  - Prototype and evaluate net-new AI technologies adjacent to
    the Salesforce stack, assessing fit and feasibility for
    client strategic initiatives
  - Design and build scalable and secure data architectures on
    Salesforce Data 360, defining DLOs, DMOs, identity
    resolution strategies, and real-time data activation
    patterns
  - Leverage unstructured DMOs, retrievers, and search indexes
  - Engage with customers to define requirements, and propose
    and deliver complex, often ambiguous solutions that
    combine Salesforce and adjacent AI technologies
  - Develop using the Lightning Framework (LWCs), Apex, and
    JavaScript
  - Collaborate with project teams to translate requirements —
    including exploratory and strategic asks — into effective
    technical solutions
  - Stay current with Salesforce releases, Agentforce
    enhancements, platform best practices, and the broader AI
    landscape
  - Acquire and maintain relevant Salesforce certifications
    aligned with your career development goals
  - Travel up to 25% for customer projects and company events
  - Be a NeuraFlash and Accenture evangelist in the Salesforce
    and AI communities, and help cultivate a company culture
    of success, both company and personal, and fun
  - Leverage the latest AI tools and development assistants to
    maximize the efficiency and speed of builds

  What we're looking for

  - 3+ years of hands-on Salesforce development experience,
    including Apex, Lightning Web Components (LWCs), and
    JavaScript
  - Strong understanding of Salesforce's Apex language and
    coding patterns/best practices
  - Strong foundation in overall software development
    principles, including programming fundamentals and object-
    oriented programming (OOP)
  - Strong understanding of CI/CD processes and source tracking
    with Git
  - Experience integrating Salesforce with third-party systems
    via REST APIs
  - Experience building solutions on Salesforce Data 360
  - Experience building Agentforce agents, workflows, and
    automations
  - Demonstrated curiosity about, and hands-on experimentation
    with, AI technologies beyond core Salesforce (LLM APIs,
    agent frameworks, emerging tooling)
  - Strong ability to learn and acquire new technical skills
    quickly to solve business problems
  - Strong written and verbal communication skills, including
    the ability to explain technical concepts to non-technical
    stakeholders

  Preferred Skills

  - Experience with Data 360 capabilities, including
    unstructured DMOs, retrievers, search indexes, RAG, and
    identity resolution
  - Experience with Agentforce Agent Script (next gen authoring)
  - Relevant certifications such as Salesforce Platform
    Developer I/II, Salesforce Data Cloud Consultant,
    Salesforce Agentforce Specialist, or Claude Certified
    Architect
  - Prior consulting or professional services delivery
    experience
  - Experience prototyping with LLM providers (Anthropic,
    OpenAI, etc.), vector databases, or agent orchestration
    frameworks outside the Salesforce ecosystem
  - Experience across additional Salesforce Clouds (Service
    Cloud, Sales Cloud, Experience Cloud, etc.)
  - Understanding of Salesforce's Enhanced Chat and Omni-channel
  - Experience with Amazon Connect or other telephony platforms
  - Experience writing, testing, and deploying AWS Lambda
    functions
  - Proficiency in using Claude Code or similar AI coding agents

  What can you expect in the interview process?

  - Recruiter screen (phone) - 30 minutes
  - Peer interview (Video) - 45 minutes
  - Panel interview with real-time exercise (Video) - 60 minutes
  - Leadership interview (Video) - 45 minutes

