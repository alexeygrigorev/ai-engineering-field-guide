  What’s it like to be a part of NeuraFlash, Part of
  Accenture?

  - Remote & In-Person: Whether you work out of our HQ in
    Massachusetts, one of our regional hubs, or you're one of
    over half of our NeuraFlash, Part of Accenture Family who
    work remotely, we’re focused on keeping everyone connected
    and unified as one team.
  - Travel: Get ready to pack your bags and hit the road! For
    certain roles, travel is an exciting part of the job, with
    an anticipated travel commitment of up to 25%. So, if you
    have a passion for adventure and don't mind a little jet-
    setting, this opportunity could be your ticket to
    exploring new places while making a positive impact on
    clients.
  - Flexibility: Do you have to take the dog to the vet, pick up
    the kids from school, or the in-laws from the airport? We
    know that a perfect 9-5 isn’t possible. So you have to
    jump out to do any of those, no problem! We build a
    culture of trust and understanding. We value good work not
    the hours in which you get it done
  - Collaboration: You have a voice here!  If you work with a
    team of smart people like we do, it’s a no-brainer to take
    suggestions and feedback on how to keep NeuraFlash, Part
    of Accenture thriving.  Our executive team holds town
    halls & company meetings where they address any
    suggestions or questions asked, no matter how big or
    small.
  - Celebrate Often: We take our work seriously, but we don’t
    take ourselves too seriously. Whether it is an arm
    wrestling contest, costume party, or ugly holiday sweaters
    our teams love to have fun. And while we work hard, we
    don’t forget to slow down and celebrate the big things and
    the small things together.
