description: |
  Who We Are

  At Kyndryl, we run and reimagine the mission-critical
  technology systems that drive advantage for the world’s
  leading businesses.  We are at the heart of progress; with
  proven expertise and a continuous flow of AI-powered
  insight, enabling smarter decisions, faster innovation, and
  a lasting competitive edge. For our people—Kyndryls—that
  means doing purposeful work that powers human progress. Join
  us and experience a flexible, supportive environment where
  your well-being is prioritized and your potential can
  thrive.

  The Role

  As an AI Platform Engineer in our AI Infra Stream, you will
  design, build, and maintain the advanced AI services that
  power our customers' Data and AI platforms. You will be at
  the forefront of driving AI enablement, ensuring our
  services provide access to state-of-the-art technology and
  AI models while remaining strictly scalable, governable, and
  secure.

  You will bring a deep passion for AI and platform
  engineering, coupled with a strong understanding of the
  compliance and regulatory requirements necessary for well-
  designed implementations in the banking sector. As a clear
  communicator and collaborative problem-solver, you will
  bridge the gap between cutting-edge AI innovation and robust
  enterprise-grade security.

  What You Will Do

  - Design and Build: Develop cutting-edge, scalable AI
    infrastructure adhering to strict enterprise standards,
    focusing on security-by-design, networking, privacy, and
    auditability.
  - Innovate and Prototype: Translate emerging AI infrastructure
    components and features into robust, enterprise-ready
    standards.
  - Collaborate on Compliance: Align regulatory banking
    requirements with enterprise architecture, security, risk,
    data governance, and platform teams.
  - Enable Developers: Support development teams consuming AI
    services by sharing your combined expertise in
    infrastructure, AI, and platform architecture.
  - Create Standards: Build automated templates and reference
    implementations to streamline and standardize AI
    infrastructure consumption.
  - Engineer the Platform: Design and implement scalable cloud-
    native solutions, integrating Azure AI services seamlessly
    with Azure Kubernetes Service (AKS) and supporting
    platforms.
  - Drive Automation: Develop and maintain robust CI/CD
    (Continuous Integration / Continuous Delivery) pipelines
    to ensure seamless platform automation.

  Your Future at Kyndryl

  Becoming an AI Platform Engineer at Kyndryl is an excellent
  gateway to many different paths. You’ll be creating a well-
  rounded skillset while gaining professional certifications
  and qualifications. You can evolve horizontally into other
  technical or non-technical areas, or move vertically into
  senior leadership or specialized domain roles. There are
  many different types and flavors of roles at Kyndryl, so
  everyone can find the opportunity that suits them best.

  Who You Are

  You’re good at what you do and possess the required
  experience to prove it. However, equally as important – you
  have a growth mindset; keen to drive your own personal and
  professional development. You are customer-focused – someone
  who prioritizes customer success in their work. And finally,
  you’re open and borderless – naturally inclusive in how you
  work with others.

  Required Skills and Experience

  - Proven experience in platform engineering and designing
    scalable, cloud-native infrastructure solutions.
  - Strong hands-on expertise with Azure (AI) Services and Azure
    Kubernetes Service (AKS).
  - Demonstrated experience using Infrastructure as Code (IaC)
    tools, specifically Bicep, and development environments
    like VSCode.
  - Proficiency in managing and navigating data platforms such
    as Databricks and Unity Catalog.
  - Extensive experience designing and implementing CI/CD
    pipelines using Azure DevOps (Repositories/Pipelines).
  - Solid understanding of IT governance, security-by-design,
    and compliance requirements for highly regulated
    environments (e.g., banking).
  - Excellent communication skills with a goal-oriented,
    flexible, and highly collaborative mindset.

  Preferred Skills and Experience

  - Previous experience working directly with financial or
    banking IT infrastructure projects.
  - Advanced industry certifications in Microsoft Azure
    Architecture or AI Engineering.
  - Experience with MLOps principles and deploying advanced
    Large Language Models (LLMs) in enterprise environments.
  - A strong portfolio of building reference architectures and
    automation templates for developer enablement.

  Being You

  The “Kyn” in Kyndryl means kinship, which represents the
  strong bonds we have with each other, our customers and our
  communities. We focus on ensuring all Kyndryls feel included
  and we welcome people of all cultures, backgrounds, and
  experiences. Even if you don’t meet every requirement, we
  encourage you to apply. We believe in growth, and we’re
  excited to see what you can bring. At Kyndryl, employee
  feedback has told us that our number one driver of employee
  engagement is belonging. That sense of belonging — being a
  valued, respected, trusted member of the team — is
  fundamental to our culture and fueling great experiences for
  our customers. This dedication to welcoming everyone into
  our company means that Kyndryl gives you the ability to
  thrive and contribute to our culture of empathy and shared
  success. That’s The Kyndryl Way.

  What You Can Expect

  Your career with us isn’t just a job—it’s an adventure with
  purpose.  We offer a dynamic, hybrid-friendly culture that
  supports your well-being and empowers you to grow. Our Be
  Well programs are thoughtfully designed to support your
  financial, mental, physical, and social health—because we
  know that when you feel your best, you do your best.  From
  your very first day, you’ll dive into impactful work that
  powers the systems our customers rely on every day. You
  won’t just contribute—you’ll make a difference, tackling
  meaningful projects that sharpen your skills and fuel your
  growth. We’re here to champion your journey. With powerful
  tools to chart your career path, personalized development
  goals aligned with your ambitions, and continuous feedback
  to keep you inspired and on track, you’ll have everything
  you need to thrive and evolve. You’ll develop in-demand
  skills to grow your career and achieve your ambitions with
  access to cutting-edge learning opportunities—from
  certifications with Microsoft, Google, and Amazon to
  coaching and hands-on experiences. And through it all,
  you’ll be part of a culture that values empathy, restless
  learning, and a devotion to shared success. We want you to
  thrive here—and we’re committed to helping you do just that.
  Ready to make an impact? Join us and help shape what’s next.

  Get Referred!

  If you know someone that works at Kyndryl, when asked ‘How
  Did You Hear About Us’ during the application process,
  select ‘Employee Referral’ and enter your contact's Kyndryl
  email address.
