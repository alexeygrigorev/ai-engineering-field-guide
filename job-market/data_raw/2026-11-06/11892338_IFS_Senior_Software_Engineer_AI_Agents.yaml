description: |
  Company Description

  Before you apply

  This is a hands-on production role, not a research or
  prototyping one. Please only apply if you've personally
  built or been a core builder on a system that's live with
  real users — not a demo, hackathon, or personal project.

  You should be able to speak in depth, from direct
  experience, to most of the following:

  - You've built an agent or LLM system that takes actions
    against business systems — calls APIs, updates records,
    triggers workflows — not one that only answers questions
    from documents.
  - You've shipped Go (or Java or similar languages) in a
    production backend (be specific about which, and how
    much).
  - You've worked with a service-to-service orchestration tool
    such as n8n, Temporal, MuleSoft, Apache Camel, or Boomi.
  - You've operated an API gateway (Kong, Tyk, or similar) in
    production.
  - You've built or run a system serving multiple
    tenants/customers on shared infrastructure.
  - You've built or used an evaluation framework to validate AI
    output quality before it shipped — not just spot-checked
    it.

  If your AI experience is mainly demos, personal projects, or
  wiring a single LLM call into an app, this role is above
  that level.

  IFS is a billion-dollar revenue company with 7000+ employees
