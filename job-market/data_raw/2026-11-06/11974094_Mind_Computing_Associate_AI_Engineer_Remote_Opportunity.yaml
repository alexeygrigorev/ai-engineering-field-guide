job_id: 11974094
title: Associate AI Engineer (Remote Opportunity)
company: Mind Computing
location: USA
remote: true
work_type: FULL_TIME
description: |
  Mind Computing is seeking a motivated Associate AI Engineer
  to support AI-driven software development, automation, and
  technology innovation across enterprise IT projects and
  business development initiatives. The ideal candidate is an
  early career engineer with strong programming fundamentals,
  hands on experience using AI-assisted development tools, and
  a passion for applying emerging AI technologies to practical
  technical challenges.

  This role will collaborate with experienced software
  engineers, technical architects, and project teams to
  develop AI-powered solutions, improve development workflows,
  and support technical research and proposal development for
  federal IT opportunities. Recent graduates and candidates
  with relevant academic, personal, or open source projects
  are encouraged to apply.

  The candidate must reside within the continental US.

  Responsibilities:

  - Develop, test, debug, and enhance software applications
    using modern programming languages and AI-assisted
    development tools such as Claude Code, Cursor, GitHub
    Copilot, and OpenAI Codex.
  - Collaborate with software engineers and technical architects
    to identify opportunities for AI-driven improvements to
    existing applications and development workflows.
  - Design and develop AI-powered prototypes, automation
    scripts, utilities, and lightweight applications to
    improve developer productivity and operational efficiency.
  - Explore opportunities to automate software development
    activities, including code reviews, testing,
    documentation, troubleshooting, and defect analysis.
  - Experiment with large language models (LLMs), AI agents,
    APIs, and emerging AI frameworks to develop practical
    solutions for enterprise applications and workflows.
  - Evaluate AI-generated code and solutions for accuracy,
    quality, security, performance, and maintainability in
    collaboration with senior developers.
  - Research emerging AI technologies, development frameworks,
    and automation tools and recommend potential applications.
  - Document and assess the effectiveness of AI-driven
    solutions, including productivity improvements, time
    savings and process efficiencies.
  - Support technical architects and business development teams
    in analyzing technical requirements, researching solution
    approaches, and preparing technical responses to RFIs,
    RFQs, RFPs, and other federal opportunities.
  - Leverage AI tools and emerging technologies to automate and
    improve capture, business development, market research,
    competitive intelligence, opportunity tracking, proposal
    preparation, and knowledge management processes.
  - Assist in developing technical narratives, architecture
    diagrams, solution concepts, prototypes, and supporting
    proposal documentation.
  - Collaborate with cross functional teams to communicate
    technical findings, demonstrate prototypes, and support
    adoption of approved AI tools and solutions.
  - Ensure AI-assisted development and experimentation comply
    with customer requirements, data protection policies, and
    approved technology usage guidelines.
  - Perform additional duties as needed to support project
    objectives and organizational innovation initiatives.

  Qualifications:

  - Bachelor's degree in Computer Science, Software Engineering,
    Artificial Intelligence, Information Technology, or a
    related technical field, or equivalent practical
    experience. Recent graduates are encouraged to apply.
  - 0–2 years of relevant experience using AI-powered coding
    tools to develop, test, and debug software applications.
  - Working knowledge of at least one programming language,
    preferably Python, JavaScript, TypeScript, Java, or C#.
  - Hands on experience using AI-assisted coding tools such as
    Claude Code, Cursor, GitHub Copilot, OpenAI Codex, or
    similar platforms through academic, personal, or
    professional projects.
  - Basic understanding of generative AI, large language models
    (LLMs), prompt engineering, and their applications in
    software development.
  - Familiarity with software development fundamentals, REST
    APIs, Git, debugging, and software testing.
  - Ability to use AI tools to build functional applications,
    automate tasks, or solve technical problems.
  - Working knowledge of the federal acquisition lifecycle,
    including IDIQs, GWACs, task orders, RFPs, RFIs, and other
    federal procurement processes.
  - Strong analytical, problem-solving, and critical-thinking
    skills, with the ability to learn new technologies
    independently.
  - Effective written and verbal communication skills and the
    ability to collaborate with technical and non-technical
    stakeholders.
  - Self-motivated, curious, adaptable, and eager to experiment
    with emerging technologies.
  - Relevant academic projects, personal applications,
    hackathons, open-source contributions, and independently
    developed AI solutions can be considered in place of
    professional experience.

  Additional Qualifications:

  - Experience developing applications using OpenAI, Anthropic
    Claude, or other LLM APIs.
  - Familiarity with AI agents, agentic workflows, Retrieval-
    Augmented Generation (RAG), embeddings, vector databases,
    or AI orchestration frameworks.
  - Experience with Python scripting, workflow automation,
    application integrations, or API development.
  - Exposure to cloud platforms such as AWS, Microsoft Azure, or
    Google Cloud.
  - Familiarity with CI/CD pipelines, automated testing,
    DevSecOps practices, or modern software development
    environments.
  - Experience using AI-assisted development tools to build
    complete applications, prototypes, or automation
    solutions.
  - Familiarity with technical documentation, architecture
    diagrams, or technical solution development.
  - Exposure to enterprise applications, healthcare IT, or
    federal government technology projects.
  - Ability to obtain a government clearance.

  Benefits:

  - Medical/Dental/Vision
  - 401k with Employer Match
  - PTO + Federal Holidays
  - Corporate Laptop
  - Training Opportunities
  - Remote Opportunity

  Note: Selected candidates will be required to complete
  fingerprinting at a government facility and undergo a
  background check as part of the hiring process.

  Mind Computing is an equal opportunity employer. Qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, national origin,
  sexual orientation, gender identity, disability, or
  protected veteran status.

  At this time, we are unable to offer sponsorship.
