description: |
  About Turing

  Turing’s mission is to accelerate superintelligence to drive
  real economic progress. Headquartered in San Francisco,
  Turing works with frontier AI labs to generate high-quality
  datasets, reinforcement learning environments, and frontier
  research benchmarks that improve model capabilities in
  software engineering, enterprise knowledge work, and
  advanced STEM reasoning. In software engineering, Turing is
  the largest and longest-running data provider in the
  category. Turing also works with Fortune 500 enterprises
  across financial services, life sciences, healthcare,
  retail, automotive, and CPG to build and deploy end-to-end
  agentic AI systems inside mission-critical workflows. By
  operating on both sides, Turing closes the loop between
  frontier research and enterprise deployment, turning real-
  world deployment signals into better data, evaluations, and
  more capable models. Learn more at www.turing.com.



  Role: Senior Full-Stack Engineer Location: Mumbai, India
  Employment Type: Full-time Experience Level: 5+ years of
  professional software engineering experience Work Model:
  Hybrid, with three days per week in the Mumbai office

  Why Join the Team?

  You will build and support applications used by asset
  management clients, including a private equity dashboard and
  related enterprise software.

  This is a hands-on role with ownership of complex features
  and application changes from requirements and design through
  deployment and production support. You will work across the
  Python backend, React frontend, APIs, integrations, and
  database layer while making sound engineering trade-offs and
  delivering maintainable software.

  You will also have the opportunity to use AI-enhanced
  development tools such as Claude and Codex across design,
  implementation, testing, debugging, and code review.

  As a Senior Full-Stack Engineer, You WillBuild Full-Stack
  Features

  Design and deliver production features using Python and
  React, taking ownership of complex implementation decisions.

  Develop Backend Services

  Build and maintain Python backend applications, services,
  and APIs.

  Build User Interfaces

  Develop responsive and usable web applications with React.

  Own Delivery End to End

  Translate requirements into technical designs, identify
  dependencies, and drive delivery through testing, release,
  deployment, and production support.

  Build Enterprise Integrations

  Implement integrations across APIs, relational databases,
  and enterprise systems.

  Support Production Applications

  Investigate issues, contribute to root cause analysis,
  support deployments, and help maintain reliable production
  applications.

  Maintain Engineering Quality

  Write automated tests, participate in code reviews, maintain
  clear technical documentation, and take ownership of code
  quality, security, and correctness.

  The Anti-Sell

  Hands-on engineering: This is not a role for someone who
  primarily coordinates work or implements specifications
  without owning the underlying problem. You will be expected
  to design, build, test, deploy, and support production
  software.

  Full-stack ownership: You should be comfortable working
  across Python backend services, React applications, APIs,
  databases, authentication, testing, and deployment.

  Independent judgment: You will be expected to evaluate
  trade-offs, diagnose complex problems, ask the right
  questions, and move work forward with minimal direction.

  AI-assisted development with accountability: You may use
  Claude, Codex, and other AI development tools, but you
  remain responsible for evaluating their output and ensuring
  the resulting code is secure, correct, maintainable, and
  production-ready.

  Our Senior Full-Stack Engineers Typically Have

  Production full-stack experience: A track record of
  delivering production full-stack applications and taking
  technical ownership of complex features.

  Python backend expertise: Hands-on experience building
  backend applications, services, and APIs with Python.

  React experience: Hands-on experience building and
  maintaining production web interfaces with React.

  Enterprise application fundamentals: Experience with
  authentication, application design, testing, deployment,
  SQL, data modeling, and relational databases.

  Integration and cloud experience: Experience integrating
  applications with APIs and enterprise systems, deploying
  applications on a cloud platform, and supporting production
  systems.

  AI-enhanced software development: Practical experience using
  Claude, Codex, or similar tools across the software
  development lifecycle, with the judgment to evaluate AI-
  generated code and maintain ownership of quality, security,
  and correctness.

  Clear communication: The ability to collaborate effectively
  with engineers, business stakeholders, and cross-functional
  teams.

  Candidates whose experience is limited to prototypes,
  isolated frontend work, or work without production ownership
  will not be a fit for this role.

  Top-Tier Candidates Will Have

  - Experience building and testing AI agents that combine large
    language models with tools or APIs to support multi-step
    workflows.
  - Experience evaluating agent outputs and handling failures.
  - Experience building software for financial technology, asset
    management, or other enterprise environments.
  - Demonstrated interest in financial technology and solving
    complex engineering challenges.

  Values

  - We are client first: We put our clients at the center of
    everything we do, because their success is the ultimate
    measure of our value.
  - We work at Start-Up Speed: We move fast, stay agile and
    favor action because momentum is the foundation of
    perfection
  - We are AI forward: We help our clients build the future of
    Al and implement it in our own roles and workflow to
    amplify productivity.

  Advantages of joining Turing

  - Work at the frontier of AI, helping the world’s leading AI
    labs improve their most advanced models by building expert
    datasets, RL environments, and first-of-a-kind benchmarks.
  - Contribute to leading-edge AI research and showcase your
    work at top conferences such as ICLR, ICML, and NeurIPS.
  - Bring frontier AI innovation to the enterprise, applying
    lessons learned from leading AI labs to solve real-world
    business challenges.
  - Collaborate with and learn from exceptional colleagues with
    deep AI experience from Google, Meta, Amazon, and other
    leading technology companies.
  - Move at the pace of AI innovation, with the speed,
    ownership, and impact of a startup.

  Turing is proud to be an equal opportunity employer. We do
  not discriminate on the basis of race, religion, color,
  national origin, gender, gender identity, sexual
  orientation, age, marital status, disability, protected
  veteran status, or any other legally protected
  characteristics. At Turing we are dedicated to building a
  diverse, inclusive and authentic workplace  and celebrate
  authenticity, so if you’re excited about this role but your
  past experience doesn’t align perfectly with every
  qualification in the job description, we encourage you to
  apply anyways. You may be just the right candidate for this
  or other roles.

