title: Senior Software Engineer, AI Platform
company: Vanta
location: USA
remote: true
work_type: FULL_TIME
description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  AI Platform builds the shared foundations that help teams
  across Vanta ship trustworthy AI products. We own SDKs,
  model integrations, agent infrastructure, and tools for
  evaluating and debugging AI behavior. Our work spans quality
  and evaluations, data and context, and the foundations
  behind Vanta’s agentic experiences.

  We partner closely with AI product engineers to solve real
  customer problems, turn successful experiments into reusable
  capabilities, and operate them reliably in production.

  How does the team impact the business?

  We help teams deliver AI capabilities faster, improve
  customer outcomes, and manage reliability, latency, and cost
  across Vanta’s AI products.

  What gaps will this hire fill?

  This hire will expand our ability to turn applied AI
  experiments into reliable, reusable platform capabilities.
  They will combine hands-on implementation with evaluation,
  operational ownership, and close product-team partnership.



  Why join this team?

  Your work can improve AI experiences across Vanta.
  Challenges include reliable agent execution, useful
  retrieval and context, reproducible evaluations, and tools
  that help engineers investigate and fix AI failures.



  Growth trajectory

  Grow from owning a platform capability end to end to leading
  broader technical initiatives, mentoring engineers, and
  shaping capabilities adopted across teams.

  Visit our Vanta Engineering Blog to learn more about what
  our team is working on!

  What you’ll do as a Senior Software Engineer, AI Platform at
  Vanta:

  - Build shared SDKs, APIs, and infrastructure for AI features
    and agentic workflows.
  - Integrate durable execution infrastructure for long-running
    agent workflows, including checkpointing, retries, human-
    in-the-loop steps, and recovery from partial failures.
  - Evolve our agent harness, the runtime for tool calling,
    context management, memory, and model orchestration.
  - Develop evaluation and debugging tools that turn production
    failures into measurable improvements and regression
    coverage.
  - Improve model integrations, retrieval, and context delivery
    to support accurate, useful AI behavior.
  - Own platform capabilities through rollout and operation,
    including reliability, observability, performance, and
    secure handling of customer data.
  - Partner with product teams to prototype solutions, identify
    common needs, and drive adoption of reusable platform
    capabilities.

  How to be successful in this role:

  - Strong software engineering fundamentals and experience
    building and operating backend services, APIs, or
    developer platforms.
  - Hands-on experience shipping LLM-powered products or agentic
    workflows and understanding their failure modes.
  - Experience with durable execution or workflow orchestration
    platforms and designing for idempotency, retries, and
    long-running state.
  - Familiarity with agent harnesses and frameworks, including
    tool design, context management, subagents, and their
    tradeoffs.
  - Practical evaluation experience: defining success,
    diagnosing failures, and measuring whether changes improve
    outcomes.
  - Product judgment: connecting platform decisions to developer
    needs and customer outcomes.
  - Ownership, curiosity, and clear communication across teams
    in a rapidly changing technical environment.
  - Uses AI in day-to-day work to amplify their skills and
    strengthen their outcomes, applying it across routine
    workflows, actively building fluency through
    experimentation, and exercising sound judgment to ensure
    AI-assisted work meets a high quality bar.



  What you can expect as a Vanta’n:

  - Industry-competitive salary and equity
  - Comprehensive medical, dental, and vision coverage, with
    100% of employee-only benefit premiums covered for most
    medical plans
  - 16 weeks paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and cellphone stipend
  - Commuter benefits for team members who report to the SF and
    NYC office
  - Family planning benefits
  - Matching 401(k) contribution with immediate vesting
  - Flexible PTO policy, plus 80 hours of Sick Time
  - 11 company-paid holidays
  - Virtual team building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney

  To provide greater transparency to candidates, we share base
  pay ranges for all US-based job postings regardless of
  state. We set standard base pay ranges for all roles based
  on function, level, and country location, benchmarked
  against similar-stage growth companies. Final offer amounts
  are determined by multiple factors and may vary based on
  candidate location, skills, depth of work experience, and
  relevant licenses/credentials.

  #LI-remote

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
