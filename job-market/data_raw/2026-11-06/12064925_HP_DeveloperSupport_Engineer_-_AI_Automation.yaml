description: |
  Developer/Support Engineer - AI & Automation

  Description -

  Job Summary

  We are seeking a AI & Automation Developer / Support
  Engineer to design and deliver cutting-edge solutions at the
  intersection of Agentic AI, automation, and opportunity
  discovery. This role blends deep technical expertise with
  strategic thinking to not only build intelligent systems but
  also identify and prioritize areas where AI and automation
  can drive measurable impact across the organization.

  You’ll work hands-on with large language models, agent
  frameworks, and automation tools while collaborating with
  cross-functional teams to uncover high-value use cases and
  deliver end-to-end intelligent solutions.

  Key Responsibilities:

  - Design and develop Agentic AI systems using LLMs and multi-
    agent frameworks to drive autonomous decision-making and
    task execution.
  - Build scalable automation solutions to streamline manual
    processes and improve operational efficiency.
  - Proactively identify and assess opportunities for AI and
    automation through close collaboration with business and
    technical stakeholders.
  - Integrate AI-driven solutions with enterprise systems (e.g.,
    JIRA, SharePoint, ServiceNow) via APIs and cloud
    platforms.
  - Lead the full development lifecycle – from concept and POC
    to deployment and optimization.
  - Translate complex requirements into scalable technical
    architectures.
  - Stay current on advancements in GenAI, Agentic AI, and
    intelligent automation to continuously evolve solution
    capabilities.

  Required Skills:

  - Strong programming background (Python required;
    JavaScript/TypeScript or other languages a plus).
  - Hands-on experience in developing GenAI/LLM-based
    applications.
  - Knowledge of agent frameworks (e.g., LangChain Agents,
    OpenAI Agents, AutoGen).
  - Experience building automation workflows using RPA tools,
    scripting, or custom logic.
  - Familiarity with RAG (Retrieval-Augmented Generation),
    vector databases, and enterprise data systems.
  - Strong problem-solving skills and ability to communicate
    technical concepts clearly.
  - Project management experience with an Agile mindset.

  Education & Experience Recommended • Four-year or Graduate
  Degree in Computer Science, Statistics, Mathematics, or any
  other related discipline or commensurate work experience or
  demonstrated competence. • Typically has 5-7 years of work
  experience, preferably in computer programming languages,
  agile development methodology, or a related field.

  - - Experience integrating AI with enterprise tools (e.g.,
    JIRA, Salesforce, SharePoint).
  - Exposure to cloud platforms
  - Prior experience leading discovery workshops or assessments
    for AI/automation opportunities.

  Knowledge & Skills • Agile Methodology • Algorithms • Amazon
  Web Services • Apache Spark • Artificial Intelligence •
  Automation • Big Data • C++ (Programming Language) •
  Computer Science • Data Science • Deep Learning • Java
  (Programming Language) • Machine Learning • Microsoft Azure
  • Natural Language Processing • Python (Programming
  Language) • PyTorch (Machine Learning Library) • Scikit-
  learn (Machine Learning Library) • Software Engineering •
  TensorFlow Cross-Org Skills • Effective Communication •
  Results Orientation • Learning Agility • Digital Fluency •
  Customer Centricity Impact & Scope • Impacts function and
  leads and/or provides expertise to functional project teams
  and may participate in cross-functional initiatives.
  Complexity • Works on complex problems where analysis of
  situations or data requires an in-depth evaluation of
