  Job Description: Senior AI Platform Engineer

  How does this role contribute to our collective success?

  The Senior AI Platform Engineer will help AXIS deliver
  secure, reliable, and reusable AI capabilities that support
  business teams across underwriting, claims, operations, and
  other strategic functions. This role sits at the
  intersection of platform engineering, DevOps, data
  engineering, and applied AI, with a focus on productionising
  AI services safely and consistently.

  You will design, build, deploy, and operate cloud-native AI
  workloads, including LLM-powered services, agentic
  workflows, data pipelines, and reusable platform components.
  You will play a key role in improving engineering standards,
  automation, observability, release discipline, and
  operational readiness across AXIS AI platforms.

  This is a hands-on senior engineering role for someone who
  can take ownership from design through production support,
  work effectively with distributed teams, and help shape
  pragmatic, maintainable approaches to enterprise AI
  delivery.

  What will you do in this role?

  - Design, build, and operate production-grade AI services,
    data pipelines, and platform capabilities on Azure and
    Databricks.

  - Develop LLM-powered and agentic workflows that support
    business process automation, document intelligence,
    orchestration, and decision support.

  - Expose AI capabilities through secure, maintainable APIs and
    Azure Function or Container App backend services,
    including FastAPI-based or other services where
    appropriate.

  - Own CI/CD delivery pipelines for AI and data workloads,
    including build, release, deployment, validation, and
    environment promotion.

  - Implement infrastructure-as-code using Terraform and Azure-
    native tooling, ensuring environments are repeatable,
    secure, and supportable.

  - Build and manage Databricks jobs, workflows, asset bundles,
    and data engineering pipelines.

  - Implement monitoring, logging, tracing, and alerting using
    OpenTelemetry or equivalent observability tools.

  - Support production AI systems, including incident response,
    troubleshooting, operational runbooks, release readiness,
    and service improvement.

  - Contribute to architecture decisions, engineering standards,
    reusable patterns, and platform strategy.

  - Collaborate with engineering, data science, product,
    security, infrastructure, and business teams to deliver
    end-to-end solutions.

  - Mentor engineers, lead technical enablement sessions, and
    promote strong engineering practices across the team.

  What will you need to succeed?

  Required skills and experience

  - Strong production-level Python engineering experience, with
    the ability to build maintainable, tested, and supportable
    services.

  - Experience with PySpark or equivalent large-scale data
    processing frameworks.

  - Hands-on experience designing and operating CI/CD pipelines
    using Azure DevOps or similar tooling.

  - Experience deploying and supporting workloads on Azure,
    including identity, access control, networking, and secure
    resource configuration.

  - Practical experience with infrastructure-as-code, preferably
    Terraform.
  - Experience building APIs, backend services, and service
    integrations for data or AI workloads.

  - Experience with monitoring, logging, alerting, incident
    response, and operational support for production systems.

  - Strong engineering discipline across testing, code quality,
    branching, release management, and automated validation.

  - Ability to troubleshoot across application, data,
    infrastructure, deployment, and security boundaries.

  - Strong communication skills, with the ability to work with
    technical and non-technical stakeholders.

  Desirable skills and experience

  - Experience with Databricks Jobs, Workflows, Asset Bundles,
    Apps, and medallion-style data architectures.

  - Experience with Azure AI Foundry, Azure OpenAI, LLM-based
    application development, or agent SDKs and frameworks.

  - Experience with MLflow, model lifecycle management,
    evaluation, tracing, and AI observability.

  - Experience with containers, Docker, Kubernetes, AKS,
    OpenShift, or equivalent container platforms.

  - Experience building reusable platform components, shared
    libraries, templates, or engineering standards.

  - Experience working in regulated environments with strong
    security, governance, auditability, and operational
    control requirements.

  What good looks like

  - AI services are delivered with clear ownership from design
    through deployment and production support.

  - Delivery pipelines are automated, repeatable, secure, and
    aligned to release management standards.

  - Systems are observable, supportable, and designed with
    reliability, scalability, and operational readiness in
    mind.

  - Engineering approaches are pragmatic, maintainable,
    reusable, and suitable for enterprise adoption.

  - Incidents, risks, and technical dependencies are surfaced
    early, communicated clearly, and resolved collaboratively.

  - The engineer improves the wider team through mentoring,
    standards, reusable patterns, and technical leadership.

  Role factors

  - This role requires close collaboration with distributed
    technology, business, data, security, infrastructure, and
    vendor teams.

  - The successful candidate will be expected to work
    independently, manage competing priorities, and provide
    clear technical leadership.

  - The role involves hands-on engineering delivery as well as
    contribution to standards, architecture, production
    support, and operational improvement.

  - The candidate should be comfortable engaging with
    stakeholders, explaining technical decisions clearly, and
    supporting local and global team objectives.

  This posting is for an existing vacancy.
