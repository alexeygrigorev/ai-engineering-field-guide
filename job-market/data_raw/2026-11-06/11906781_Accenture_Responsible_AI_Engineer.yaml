description: |
  Project Role : Responsible AI Engineer Project Role
  Description : Assess AI systems for adherence to predefined
  thresholds and benchmarks related to responsible, ethical
  and sustainable practices. Design and implement technology
  mitigation strategies for systems to ensure ethical and
  responsible standards are achieved. Must have skills :
  Responsible AI, Large Language Models (LLMs) Good to have
  skills : NA Minimum 5 year(s) of experience is required
  Educational Qualification : 15 years full time education
  Summary: As a Responsible AI Engineer, a typical day
  involves evaluating artificial intelligence systems to
  ensure they meet established ethical, responsible, and
  sustainable standards. This role requires continuous
  monitoring and assessment of AI outputs against predefined
  benchmarks. The engineer designs and applies strategies to
  mitigate risks and enhance the ethical performance of AI
  technologies. Collaboration with various stakeholders to
  maintain compliance and promote responsible AI practices is
  a key aspect of daily activities, ensuring that AI systems
  operate within acceptable guidelines and contribute
  positively to organizational goals.

  Roles & Responsibilities:
  - Expected to be an SME, collaborate and manage the team to
    perform.
  - Responsible for team decisions.
  - Engage with multiple teams and contribute on key decisions.
  - Provide solutions to problems for their immediate team and
    across multiple teams.
  - Lead initiatives to develop and implement frameworks that
    promote ethical AI usage.
  - Facilitate knowledge sharing and training sessions to
    enhance team understanding of responsible AI principles.
  - Support junior team members by providing guidance and
    fostering a collaborative environment.

  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Responsible AI, Large
    Language Models (LLMs).
  - Strong knowledge of AI ethics, fairness, transparency, and
    accountability principles.
  - Experience in designing and implementing mitigation
    strategies for AI bias and risk management.
  - Familiarity with AI governance frameworks and compliance
    requirements.
  - Ability to analyze AI system performance and identify areas
    for ethical improvement.
  - Skilled in collaborating with cross-functional teams to
    integrate responsible AI practices.

  Additional Information:
  - The candidate should have minimum 5 years of experience in
    Responsible AI.
  - This position is based at our BDC7C - SEZ office.
  - A 15 years full time education is required.


  15 years full time education

