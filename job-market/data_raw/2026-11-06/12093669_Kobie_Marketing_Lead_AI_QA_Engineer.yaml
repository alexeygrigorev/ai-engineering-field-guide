  What you need to be successful

  About Kobie

  Named a Top Workplace in the USA and Top Remote Workplace,
  Kobie is where the best minds in loyalty come together,
  driven by passion and innovation. We’re always looking for
  talented individuals ready to join a collaborative, growth-
  focused culture.

  As a trusted partner to some of the world’s most recognized
  brands, we are loyalty leaders, helping brands build lasting
  emotional connections with their consumers.  We do this with
  a strategy-led technology approach that uncovers the truth
  behind what drives consumers on an emotional level.As we
  launch our India Tech Hub, we are excited to bring our
  award-winning culture to a new region - creating an
  environment where collaboration, flexibility, and career
  growth come together to build something truly special.

  We are proud to be the only loyalty provider to be
  externally recognized for their culture. We believe people
  thrive when they feel valued, supported, and empowered to be
  their authentic selves. Our commitment to diversity, equity,
  and inclusion ensures every teammate has a voice and the
  opportunity to be heard.

  Giving back is in our DNA at Kobie,through an annual
  fundraiser, charitable partnerships, and volunteer
  opportunities, we encourage our teammates to make a
  difference in their communities.

  To support our teammates beyond just their careers, we offer
  highly competitive benefits, comprehensive health coverage,
  and well-being perks that support our teammates and their
  dependents. We understand the importance of time for life
  outside of work - recognizing public holidays,offering
  flexible time off, and prioritizing work-life balance.

  As we expand into India, our new teammates will be fully
  integrated with our U.S. teams, working on global projects
  and gaining exposure to top industry leaders. With continued
  growth, we will establish a physical office in Bengaluru,
  India, giving teammates aspace for collaboration and
  fostering connection.

  Now is the perfect time to join Kobie. Be part of something
  big and help shape the future of our global capabilities
  center, the Kobie India Tech Hub.
