description: |
  Join our India Tech Hub – Be among the first hires!

  Kobie, a 35-year veteran of the loyalty industry, a multi-
  year Forrester Leader, and USA Top Workplace is expanding
  its global footprint by establishing a Tech Hub in India.
  Kobie partners with global brands to build deep connections
  with their customers through personalized, data-driven
  loyalty experiences and has a mission of growing enterprise
  value through loyalty. The Tech Hub will serve as a Global
  Capabilities Center for a broad range of technology roles,
  and this is your chance to play a pivotal role in shaping
  our presence in India. Join us as we continue to lead in
  loyalty, delivering innovative customer experiences for some
  of the world’s most recognized brands while working
  alongside some of the best and brightest in loyalty.

  About the team and what we will build together

  We’re looking for an Lead AI QA Engineer with 6+ years of
  experience who thrives on designing test strategies and
  evaluation harnesses for production-grade, agentic AI
  systems in addition to experience in ETL. You have strong
  Python skills, hands-on experience testing LLM-powered
  features (prompt regression, tool/function-call validation,
  RAG correctness, and structured-output schema checks), and
  working knowledge of evaluation frameworks such as RAGAS,
  DeepEval, LangSmith or Langfuse. You are comfortable writing
  solid SQL, automating tests with PyTest, exercising APIs
  through Postman or REST clients, and shipping test pipelines
  using Git, Docker and CI tooling like Jenkins or GitHub
  Actions.

  Kobie runs some of the largest loyalty programs in the
  world. We are building an internal agent platform on Dataiku
  that automates analyst workflows, surfaces insights from
  program data in Snowflake, and gives our teams an LLM-native
  way to work with complex loyalty logic. As an Lead AI QA
  Engineer on the India Tech Hub team, you will play a key
  role in protecting that platform — designing golden
  datasets, running LLM-as-judge and regression suites, and
  owning the quality bar for what goes to production. This is
  not a manual-only role: you will automate, build qa &
  automation strategies, roadmaps, instrument, monitor and
  partner closely with our U.S. AI & Innovation team and
  cross-functional partners across Engineering, Data, AI and
  Product.

