  Job Description:

  Job Description 2: Senior Full-Stack AI Engineer – 10+ Years
  Experience

  Location: Hybrid / Onsite / Remote Experience Required: 10+
  Years (4–5 Years in AI/ML + Full-Stack) Department: AI
  Platform Engineering

  Role Overview

  We are looking for a Senior Full-Stack AI Engineer with deep
  expertise in Python, modern frontend frameworks, and AI
  system design. The candidate will lead the development of
  enterprise-scale Agentic AI platforms, architect multi-agent
  systems, and drive end-to-end delivery from UI to AI
  backend.

  Key Responsibilities

  ·        Architect and lead full-stack AI solutions

  ·        Design scalable Agentic AI and multi-agent systems

  ·        Build advanced RAG pipelines and knowledge systems

  ·        Develop backend services (Python, FastAPI)

  ·        Lead frontend development (React.js)

  ·        Drive CI/CD, DevOps, and deployment strategies

  ·        Mentor junior developers

  ·        Collaborate with stakeholders for solution design

  ·        Ensure performance, scalability, and cost
  optimization

  Required Skills

  ·        10+ years software development experience

  ·        4–5 years in AI/ML or Agentic AI

  ·        Expert Python programming

  ·        Strong frontend skills (React.js)

  ·        Deep understanding of RAG and LLM systems

  ·        Experience with vector databases

  ·        CI/CD and DevOps expertise

  ·        Strong knowledge of GitHub workflows

  ·        Experience with JIRA or Agile tools

  Good to Have

  ·        Cloud architecture (AWS/Azure/GCP)

  ·        Kubernetes and microservices

  ·        Observability frameworks

  ·        AI governance and security

  ·        Enterprise system integration (ITSM, automation)

  Leadership & Soft Skills

  ·        Technical leadership and mentoring

  ·        Strategic thinking

  ·        Excellent communication

  ·        Ownership and accountability

