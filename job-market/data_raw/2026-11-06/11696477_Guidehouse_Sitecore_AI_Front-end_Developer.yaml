description: |
  Job Family:

  Software Application & Development (India)

  Travel Required:

  None

  Clearance Required:

  None

  What You Will Do:

  We are seeking a Front-end Developer focused on Sitecore AI
  development to build polished, accessible, and high-
  performing digital experiences on our enterprise Sitecore
  platform. In this role, you will develop reusable front-end
  components and Sitecore AI solutions; translate product,
  content, and design requirements into maintainable
  implementations; create intuitive visual authoring
  experiences; and deliver AI-enabled capabilities that
  improve content discovery, personalization, and customer
  engagement. You will collaborate with the Sitecore
  Architect, UX designers, content teams, marketing
  stakeholders, back-end and integration engineers, and
  external partners using Sitecore XM Cloud, React, Next.js,
  TypeScript, the Sitecore Content SDK, GraphQL, Experience
  Edge, Vercel, and modern cloud delivery practices.

  - Develop reusable, responsive, and accessible React and
    Next.js components for Sitecore AI, translating approved
    designs into clean, maintainable TypeScript.
  - Create flexible component data models, rendering
    definitions, placeholders, variants, and visual authoring
    configurations that enable content teams to build pages
    efficiently and safely.
  - Integrate frontend applications with Sitecore Experience
    Edge, GraphQL, the Sitecore Content SDK, and approved APIs
    and services.
  - Develop and integrate Sitecore AI capabilities—including AI-
    assisted search, recommendations, content discovery, and
    personalization—in partnership with architecture,
    analytics, content, and integration teams, with
    appropriate privacy, security, and governance controls.
  - Collaborate with UX and design teams to ensure accurate
    implementation of design systems, interaction patterns,
    responsive behavior, and cross-browser compatibility.
  - Optimize Core Web Vitals, rendering performance, caching,
    image delivery, SEO/GEO, accessibility, and client-side
    application behavior.
  - Write unit, integration, accessibility, and end-to-end
    tests; participate in code reviews; and support automated
    quality checks within CI/CD pipelines.
  - Troubleshoot complex frontend, rendering, personalization,
    API, deployment, and content-delivery issues using browser
    tools, logs, monitoring, and root-cause analysis.
  - Implement privacy-conscious analytics and engagement
    tracking, including approved GA4 event contracts, consent-
    aware behavior, and data-layer standards.
  - Improve frontend standards, shared libraries, documentation,
    development tooling, and delivery practices while
    mentoring peers through reviews and knowledge sharing.



  What You Will Need:

  - Bachelor’s degree in Computer Science, Engineering,
    Information Systems, or a related field, or equivalent
    professional experience.
  - At least 4 years of front-end or full-stack development
    experience, including hands-on delivery of Sitecore-based
    digital experiences and AI-enabled capabilities in
    enterprise environments.
  - Strong proficiency in React, Next.js, TypeScript or
    JavaScript, semantic HTML, modern CSS, responsive design,
    and component-based development.
  - Hands-on experience developing headless Sitecore XM Cloud
    and Sitecore AI solutions using Sitecore JSS or the
    Sitecore Content SDK, Experience Edge, GraphQL, and
    Vercel.
  - Experience creating Sitecore components, content models,
    rendering parameters, placeholders, variants, and author-
    friendly visual editing experiences.
  - Experience consuming REST and GraphQL APIs and integrating
    frontend applications with enterprise services such as
    analytics, identity, consent management, search, CRM, or
    personalization platforms.
  - Working knowledge of Sitecore headless patterns, composable
    DXP architecture, design systems, and reusable frontend
    architecture.
  - Experience with Git-based development, pull requests,
    automated testing, code-quality tools, and CI/CD
    deployment practices.
  - Demonstrated ability to improve web performance, Core Web
    Vitals, accessibility, SEO, browser compatibility,
    security, and frontend resilience.
  - Ability to diagnose rendering, state-management, caching,
    API, build, deployment, and content-delivery issues across
    environments.
  - Strong written and verbal communication skills, with the
    ability to explain technical decisions to technical and
    non-technical audiences.
  - Ability to work independently, manage competing priorities,
    collaborate across disciplines, and support peers through
    code reviews, troubleshooting, documentation, and
    knowledge sharing.

  What Would Be Nice to Have:

  - Experience with Sitecore products such as Search, CDP,
    Personalize, Content Hub, or SXA.
  - Experience implementing AI-assisted search, recommendations,
    conversational interfaces, content discovery, or
    personalization within customer-facing digital
    experiences.
  - Experience with Microsoft Azure or another major cloud
    platform and with serverless or edge-based application
    patterns.
  - Familiarity with Storybook, automated accessibility testing,
    visual regression testing, performance testing, and modern
    frontend observability tools.
  - Knowledge of SEO, answer engine optimization (AEO), and
    generative engine optimization (GEO) principles for
    structured, discoverable web content.
  - Sitecore certification or equivalent demonstrated expertise.
  - Experience working in regulated, high-traffic, or complex
    enterprise environments.
  - Strong presentation and stakeholder-management skills.

