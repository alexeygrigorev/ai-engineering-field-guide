description: |
  At Stout, we’re dedicated to exceeding expectations in all
  we do – we call it Relentless Excellence ®. Both our client
  service and culture are second to none, stemming from our
  firmwide embrace of our core values: Positive and Team-
  Oriented, Accountable, Committed, Relationship-Focused,
  Super-Responsive, and being Great communicators. Sound like
  a place you can grow and succeed? Read on to learn more
  about an exciting opportunity to join our team.

  Impact You'll Make

  Flightline started as an AI-native start-up built to rethink
  how consulting work gets done: how research is gathered, how
  analysis comes together, and how insight reaches the people
  making decisions.

  In October 2026, Stout, a global advisory firm with more
  than 30 years of experience and 1,000+ professionals,
  acquired Flightline to put itself at the forefront of how AI
  is changing knowledge work. Flightline teamed up with the
  firm's strategy consulting practice, Stout Strategy. For 20+
  years, Stout Strategy has advised private equity firms and
  global Fortune 1000 corporates on investment diligence and
  growth strategy, with over 500 PE processes and more than
  1,000 corporate growth strategy assessments behind it.

  The combination is rare: technology built the way a start-up
  builds it, with deep domain expertise in-house to define
  what great work looks like. That's how we intend to be the
  fastest to market, with the highest-quality work.

  As a Senior Full-Stack Engineer in our Applied Innovation
  Group, you get the best of both worlds: working at the
  frontier of AI and knowledge work, inside a firm with the
  clients, expertise and scale to make it succeed. Teams
  across the firm are adopting Flightline quickly, and we're
  growing our small team to keep pace. You would join as the
  third engineer, in a team where everyone covers a lot of
  ground. You will work closely with the Managing Director,
  Applied Innovation, who leads the group, and collaborate day
  to day with the other engineers and our UI/UX and product
  colleagues, while owning meaningful elements of the
  platform.

  - Work on a real product that consultants use on live client
    work, across the whole stack, and see the effect of what
    you ship quickly.
  - Own real areas of the platform and grow with them as more
    teams across the firm adopt it.
  - Learn quickly: new domains, new parts of the system and new
    AI tooling, alongside a small team that will help you get
    up to speed.
  - Turn expert judgment into engineering: the evals, tests and
    checks that make AI-generated work trustworthy.

  What You'll Do

  - Ship features from refined requirements to production across
    the frontend and the backend.
  - Take ownership of areas of the platform, such as a data
    pipeline, a service or a part of the UI.
  - Work on the LLM-backed core of the product, including
    extraction, retrieval, chat and content generation, and
    help measure and improve output quality.
  - Use AI coding agents as a core part of the development
    workflow: break work into well-specified tasks, review
    agent output closely, and take over when writing the code
    by hand is faster or safer.
  - Build the tests, evals and checks that make AI-assisted
    changes quick to verify and safe to ship.
  - Pick up whatever the team needs next, whether that is a bug
    in unfamiliar code, a new integration or a quick tool for
    consultants, and learn what you need to do it well.
  - Partner with consultants, product and design to sharpen
    requirements early.

  What You'll Bring

  - Five or more years of professional software engineering
    across the full stack: user interfaces, server-side logic,
    APIs, data stores and background processing, including
    running what you build in production. We care more about
    what you've shipped and run than about the number of
    years.
  - Experience in the languages and frameworks you know best. We
    use React, TypeScript and Python today, but we don't
    require any of them. What matters is that you can pick up
    a new stack quickly, as shown by a track record of getting
    productive in an unfamiliar codebase, domain or tool and
    then contributing meaningfully.
  - The ability to understand how logic and data flow through a
    system, and to trace a problem end to end across its
    components.
  - Experience owning an area of a system and seeing it through
    to production and beyond, with comfort wearing many hats
    and the judgment to know what matters most right now.
  - Daily use of AI coding tools: writing clear specs and
    acceptance criteria an agent can execute, reviewing output
    closely, knowing when to write the code by hand, and
    building the tests and checks that make AI-assisted
    changes safe to ship, without being dogmatic about any one
    tool.
  - Clear written and spoken communication, including the
    ability to explain technical trade-offs to consultants
    without jargon.
  - Experience with LLM applications, such as retrieval,
    structured output, orchestration and context management,
    and with turning vague quality feedback into testable
    checks, such as building an eval when an output feels
    thin.
  - Interest in how consultants and deal teams work.

  How You'll Thrive

  - Take ownership of problems and areas of the system end to
    end, and follow them through to production.
  - Build the smallest version that proves the point, and cut
    scope willingly.
  - Push back constructively on vague requirements and help
    product and design make them clearer.
  - Work closely with a small team, take direction on
    priorities, and speak up when something looks wrong.
  - Go deep in an area while staying willing to jump across the
    stack when the team needs it.
  - Ask questions early, learn from the code and the people
    around you, and share what you learn.
  - Write down design notes, decisions and hand-offs so others
    can pick up the work.
  - Stay curious about how consultants use the platform and ask
    why a feature matters before building it.

  Why Stout? At Stout, we offer a comprehensive Total Rewards
  program with competitive compensation, benefits, and
  wellness options tailored to support employees at every
  stage of life. We foster a culture of inclusion and respect,
  embracing diverse perspectives and experiences to drive
  innovation and success. Our leadership is committed to
  inclusion and belonging across the organization and in the
  communities we serve. We invest in professional growth
  through ongoing training, mentorship, employee resource
  groups, and clear performance feedback, ensuring our
  employees are supported in achieving their career goals.
  Stout provides flexible work schedules and a discretionary
  time off policy to promote work-life balance and help
  employees lead fulfilling lives. Learn more about our
  benefits and commitment to your success.

  https://www.stout.com/en/careers/benefits

  The specific statements shown in each section of this
  description are not intended to be all-inclusive. They
  represent typical elements and criteria necessary to
  successfully perform the job.

  Stout is an Equal Employment Opportunity. All qualified
  applicants will receive consideration for employment on the
  basis of valid job requirements, qualifications and merit
  without regard to race, color, religion, sex, national
  origin, disability, age, protected veteran status or any
  other characteristic protected by applicable local, state or
  federal law.

  Stout is required by applicable state and local laws to
  include a reasonable estimate of the compensation range for
  this role. The range for this role considers several factors
  including but not limited to prior work and industry
  experience, education level, and unique skills. The
  disclosed range estimate has not been adjusted for any
  applicable geographic differential associated with the
  location at which the position may be filled. It is not
  typical for an individual to be hired at or near the top of
  the range for their role and compensation decisions are
  dependent on the facts and circumstances of each case.

  A reasonable estimate of the current range is $87,000.00 -
  $195,000.00 Annual. This role is also anticipated to be
  eligible to participate in an annual bonus plan. Information
  about benefits can be found here -
  https://www.stout.com/en/careers/benefits.
