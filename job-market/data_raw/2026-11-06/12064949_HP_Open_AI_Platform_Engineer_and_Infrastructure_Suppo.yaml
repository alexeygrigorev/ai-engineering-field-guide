  Open AI Platform Engineer and Infrastructure Support

  Description -

  Job Summary • This role is responsible for ensuring the
  technical design, development, installation, and maintenance
  of state-of-the-art software applications and services for
  the company. The role plays a crucial role in building
  technical solutions to help other developers/engineers
  deliver faster with modern software and application
  development tools. The role is responsible for technical
  need analysis and project management. The role builds &
  maintains relationships with stakeholders across different
  departments and provide guidance & coaching to reportees in
  executing their tasks/responsibilities.

   Responsibilities

  - Led OpenAI platform engineering and infrastructure support
    activities, ensuring platform availability, scalability,
    and operational excellence.
  - Managed AI platform integrations, access governance,
    monitoring, and performance optimization to support
    enterprise adoption.
  - Collaborated with security, compliance, and infrastructure
    teams to deliver a secure and reliable AI ecosystem.
  - Supported AI enablement initiatives by providing technical
    guidance, troubleshooting, automation, and platform
    enhancements.
  - Data Analytics to support AI Governance and data management
  - Leads the building of various software development projects
    and platforms while aligning them with business and
    security strategies and requirements.
  - Builds standards, designs, and automates the deployment of
    software.
  - Designs and develops solutions that protect and manage
    software products and data.
  - Contributes to technology strategy and engineering roadmaps
    around software engineering; executes strategic software
    engineering proof of concepts.
  - Assists in scheduling, determining manpower requirements,
    and estimating costs to project completion in order to
    meet user requirements.
  - Identifies, recommends and implements changes to enhance
    effectiveness of engineering, implementation and service
    strategies Education & Experience Recommended • Four-year
    or Graduate Degree in Computer Science, Information
    Technology, Software Engineering, or any other related
    discipline or commensurate work experience or demonstrated
    competence. • Typically has 7-10 years of work experience,
    preferably in software designing & development, software
    architecture, programming languages, or a related field.
    Preferred Certifications • Programming Language/s
    Certification (Java, C++, Python, JavaScript, or similar)
    Knowledge & Skills
    - AI /Open AI and AI Strategy • Agile Methodology • Amazon Web
      Services • Application Programming Interface (API) •
      Automation • C++ (Programming Language) • Computer
      Science • DevOps • Docker (Software) • Full Stack
      Development • Java (Programming Language) • JavaScript
      (Programming Language) • Kubernetes • Microservices •
      Microsoft Azure • Python (Programming Language) •
      React.js • Scalability • Software Development • Software
      Engineering • SQL (Programming Language) Cross-Org
      Skills • Effective Communication • Results Orientation •
      Learning Agility • Digital Fluency • Customer Centricity
      Impact & Scope • Impacts function and leads and/or
      provides expertise to functional project teams and may
      participate in cross-functional initiatives. Complexity
      • Works on complex problems where analysis of situations
      or data requires an in-depth evaluation of multiple
      factors. Disclaimer • This job description describes the
      general nature and level of work performed in this role.
      It is not intended to be an exhaustive list of all
      duties, skills, responsibilities, knowledge, etc. These
      may be subject to change and additional functions may be
      assigned as needed by management.

