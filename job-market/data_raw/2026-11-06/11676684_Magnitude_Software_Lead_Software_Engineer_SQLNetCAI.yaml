description: |
  About Us:

  insightsoftware is a global provider of reporting,
  analytics, and performance management solutions that unlock
  the potential of business data and transform the way finance
  and data teams operate. We empower leaders from over 32,000
  organizations to make timely and intelligent decisions. Our
  comprehensive solutions span Financial Planning and Analysis
  (FP&A), Controllership, and Data and Analytics. We deliver
  finance teams the insights required to navigate any economic
  climate and drive greater financial intelligence, while
  increasing productivity, visibility, accuracy, and
  compliance. Learn more at insightsoftware.com.

  Job Description:

  Job Description

  insightsoftware is looking for a technically sharp, people-
  first Engineering Lead to lead our Financial Reporting team
  — a squad at the center of our most complex and high-stakes
  enterprise workloads. This is not a process-management role.
  We want a hands-on technical leader who codes when it
  counts, drives architecture decisions with conviction, and
  knows how to get the best out of engineers in an AI-
  accelerated development environment.

  You'll lead a team building and maintaining mission-critical
  reports and dashboards that serve Fortune 500 financial
  enterprises. You think in systems, not just features. You
  hold the bar high on code quality, design integrity, and
  delivery discipline — and you coach your team to do the
  same.

  If you've led high-performing backend engineering teams, are
  fluent in modern AI developer tooling, and thrive at the
  intersection of technical depth and people leadership — this
  role is built for you.



  The differentiator we're hiring for: This is not a role for
  someone who has moved away from the database. We need an
  architect-level Oracle SQL/PL-SQL practitioner who leads by
  example — writing and reviewing the hardest queries on the
  team, not just approving other people's designs.

  Responsibilities

  - Own end-to-end delivery of Reporting and BI features: from
    technical design through sprint execution to production —
    with full accountability for quality and timelines
  - Drive architectural decisions for scalable, high-performance
    dashboards using Oracle, BI Tools, Azure and .NET/C#—
    creating PoCs, reviewing PRs, and actively contributing
    code where it matters
  - Champion AI-first development practices across the team —
    mandating and coaching effective use of GitHub Copilot,
    Claude Code, or equivalent AI coding tools as a standard
    part of the engineering workflow, not an optional extra
  - Shape the technical roadmap in partnership with Product —
    ensuring long-term architectural health is never traded
    away for short-term velocity
  - Run high-quality 1:1s, performance reviews, and growth
    conversations that move the needle on individual
    development and team retention
  - Enforce engineering standards: code quality gates, branch
    policies, code freeze discipline, and release management
    protocols — with zero ambiguity
  - Lead code reviews and architecture discussions as a teacher
    and a critic — raising the technical floor of every
    engineer on the team
  - Translate complex data reporting requirements into clean,
    maintainable, production-ready software
  - Partner with cross-functional teams — Product, QA, DevOps,
    and Customer Success — to deliver releases that enterprise
    clients can depend on

  Qualifications

  - Bachelor’s degree in computer science or equivalent
    demonstrated engineering depth
  - 10+ years of hands-on experience in designing and developing
    enterprise SaaS applications on the backend with deep
    understanding of Databases
  - 2+ years of engineering team management with a proven record
    of growing senior engineers and retaining high performers
  - Architect/Principal engineer level deep expertise in
    relational databases - Oracle PL/SQL — complex query
    optimization, stored procedures, performance tuning, and
    large-scale data handling
  - Very strong command of SQL and data modelling

  - Experience in Reporting/BI on Development side (Power BI,
    Tableau, Qlik etc.)

  - Demonstrated, day-to-day use of AI developer tools (GitHub
    Copilot, Claude Code, Cursor) with the ability to coach
    teams on maximizing their impact
  - Experience in building and consuming RESTful APIs using
    .Net/C# in distributed, enterprise-scale systems
  - Solid grounding in Agile/Scrum delivery — sprint discipline,
    backlog ownership, and release management rigor
  - Strong proficiency with Git, branching strategies, and CI/CD
    practices
  - Experience in financial domain applications — FinTech or
    equity management — is a significant plus
  - Experience with Azure Cloud will be a plus
  - Exceptional written and verbal communication — you can
    explain a complex database design to a product manager and
    a deployment risk to an engineering Director with equal
    clarity

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.

