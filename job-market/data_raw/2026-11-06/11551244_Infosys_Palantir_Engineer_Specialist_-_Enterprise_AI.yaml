  Palantir Engineer Specialist  Enterprise AI practice London

  About Us

  Do you want to boost your career and collaborate with
  expert, talented colleagues to solve and deliver against our
  clients' most important challenges? We are growing and are
  looking for people to join our team. You will be part of an
  entrepreneurial, high-growth environment of 300.000
  employees. Our dynamic organization allows you to work
  across functional business pillars, contributing your ideas,
  experiences, diverse thinking, and a strong mindset. Are you
  ready?

  About Your Role

  As a Consultant – Palantir Engineer, you lead and deliver
  end-to-end, data-driven solutions using Palantir Foundry in
  complex client environments. You operate at the intersection
  of engineering, data, and consulting, working closely with
  business and technical stakeholders to translate complex
  problems into scalable, production-ready solutions. You
  combine strong hands-on technical skills with a consulting
  mindset, taking ownership of solution design,
  implementation, and adoption across organisations.

  Your role will include:

  - Own the end-to-end delivery of Palantir Foundry–based
    solutions, from problem definition to production
  - Design and implement data pipelines and transformations
    across diverse data sources
  - Model data using Foundry Ontology concepts to support
    analytics and operational use cases
  - Build scalable, reliable solutions using Python, SQL, and
    PySpark within Foundry
  - Collaborate closely with business stakeholders to define
    requirements, success metrics, and roadmaps
  - Support prototyping, productionisation, and scaling of data-
    driven applications
  - Ensure solutions meet requirements for data quality,
    governance, security, and performance
  - Act as a technical advisor within project teams and
    contribute to best practices

  Requirements

  What you bring – required

  Experience & Seniority

  - Proven experience as a Senior Consultant or Principal
    Consultant in data, analytics, or platform engineering
  - Strong experience delivering client-facing data solutions in
    complex environments
  - Ability to take ownership and work independently in
    ambiguous problem spaces

  Core Data & Analytics Technology Skills

  - Strong programming skills in Python and SQL; PySpark
    experience required
  - Hands-on experience with Palantir Foundry, including:
  - Pipeline Builder / Code Workbook
  - Data integration and transformation
  - Ontology modelling and data lineage
  - Solid understanding of data architectures, including data
    lakes, lakehouses, and data warehouses
  - Experience working with APIs, databases, and structured /
    semi-structured data


  Engineering & Platform Foundations

  - Experience building scalable ETL/ELT pipelines
  - Familiarity with CI/CD concepts, testing, and production
    deployments
  - Strong focus on solution quality, maintainability, and
    performance
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, Mathematics, or a related field or equivalent
    practical experience

  Nice to have

  - Experience with cloud platforms (AWS, Azure, GCP)
  - Familiarity with containerisation (Docker, Kubernetes)
  - Prior experience as a Palantir FDE or in Foundry-heavy
    delivery roles
  - Domain experience in industries such as Energy, Finance,
    Public Sector, Healthcare, or Logistics

  Language & Mobility

  - Very good English skills
  - Willingness to travel for project-related work

  Benefits

  About your team

  Join our growing Data & Analytics practice and make a
  difference. In this practice you will be utilizing the most
  innovative technological solutions in modern data ecosystem.
  In this role you’ll be able to see your own ideas transform
  into breakthrough results in the areas of Data & Analytics
  strategy, Data Management & Governance, Data Platforms &
  engineering, Analytics & Data Science.

  About Infosys Consulting

  Be part of a globally renowned management consulting firm on
  the front-line of industry disruption and at the cutting
  edge of technology.  We work with market leading brands
  across sectors. Our culture is inclusive and
  entrepreneurial. Being a mid-size consultancy within the
  scale of Infosys gives us the global reach to partner with
  our clients throughout their transformation journey.

  Our core values, IC-LIFE, form a common code that helps us
  move forward. IC-LIFE stands for Inclusion, Equity and
  Diversity, Client, Leadership, Integrity, Fairness, and
  Excellence. To learn more about Infosys Consulting and our
  values, please visit our careers page.

  Within Europe, we are recognized as one of the UK’s top
  firms by the Financial Times and Forbes due to our client
  innovations, our cultural diversity and dedicated training
  and career paths. Infosys is on the Germany’s top employers
  list for 2023. Management Consulting Magazine named us on
  their list of Best Firms to Work for. Furthermore, Infosys
  has been recognized by the Top Employers Institute, a global
  certification company, for its exceptional standards in
  employee conditions across Europe for five years in a row.

  We offer industry-leading compensation and benefits, along
  with top training and development opportunities so that you
  can grow your career and achieve your personal ambitions.
  Curious to learn more? We’d love to hear from you.... Apply
  today!



