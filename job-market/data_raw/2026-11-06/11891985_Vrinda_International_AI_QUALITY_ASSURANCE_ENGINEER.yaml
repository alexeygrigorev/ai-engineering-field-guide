  AI Quality Assurance Engineer

  Summary

  We are seeking a skilled AI Quality Assurance Engineer to
  join our IT Services team, where you will play a pivotal
  role in ensuring the reliability and performance of our
  advanced artificial intelligence solutions. In this
  position, you will be responsible for designing and
  executing comprehensive testing strategies that validate the
  functionality of machine learning models and automated
  systems. Your expertise will be crucial in maintaining high-
  quality standards across our software delivery lifecycle,
  directly contributing to the stability and efficiency of our
  AI-driven products.

  Responsibilities

  - Develop and implement robust test automation frameworks
    tailored for AI and machine learning applications.
  - Conduct thorough functional and regression testing to verify
    system behavior under various conditions.
  - Create, maintain, and update detailed test documentation to
    ensure clear communication and traceability.
  - Perform deep-dive root cause analysis to identify, isolate,
    and resolve complex defects within the software.
  - Design and execute precise test cases that cover diverse
    scenarios specific to AI/ML workflows.
  - Validate API integrations and data flows to ensure seamless
    interaction between system components.
  - Collaborate with development teams to integrate quality
    checks early in the development process.

  Requirements

  Requirements:

  - Possess 4 to 6 years of professional experience in software
    quality assurance, with a focus on technology services.
  - Demonstrate strong proficiency in test automation tools and
    scripting languages.
  - Have a solid background in functional testing, regression
    testing, and API testing methodologies.
  - Show expertise in crafting effective test documentation and
    test case design.
  - Possess specific knowledge and practical experience in
    testing AI and Machine Learning applications.
  - Exhibit strong analytical skills with the ability to perform
    effective root cause analysis.
  - Be familiar with the unique challenges and requirements of
    validating AI-driven systems.

  Salary: ₹15 LPA
