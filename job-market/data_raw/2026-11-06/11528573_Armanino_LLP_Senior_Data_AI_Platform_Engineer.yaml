description: |
  At Armanino, you determine your career path. This means it's
  possible to pursue challenges you are passionate about, in
  industries you care about.

  Armanino is proud to be among the top 20 Largest Accounting
  and Consulting Firms in the Nation and one of the Best
  Places to Work. We have a community of resources that are
  ready and willing to support your ideas, build your skills
  and expand your professional network. We want you to
  integrate all aspects of your life with your career. At
  Armanino, we know you don’t check-out of life when you
  check-in at work. That’s why we’ve created a unique work
  environment where your passions, work, and family & friends
  can overlap. We want to help you achieve growth by giving
  you access to a network of smart and supportive people,
  willing to listen to your ideas.

  This is a senior engineering role. You will architect,
  operate, and continuously improve cloud data and analytics
  platforms (e.g., Microsoft Fabric, Snowflake, Databricks)
  and own BI delivery infrastructure (e.g., Power BI,
  Tableau). You set the standards for platform reliability,
  CI/CD, environment design, security, and governance, and you
  carry those standards through to production. You work
  independently, make architecture calls, and own the outcome.

  Job Responsibilities

  Platform Architecture & Operations

  - Own the design and day-to-day operation of cloud data
    platforms: workspace and project architecture, access
    models, capacity planning, configuration standards, and
    troubleshooting.
  - Define and enforce platform standards: naming and tagging
    conventions, access patterns, cost management, and
    environment separation.
  - Drive platform maturity: identify structural gaps, propose
    the fix, and implement it without waiting to be told.

  DevOps & Deployment

  - Design, build, and own CI/CD workflows for data and
    analytics assets (pipelines, jobs, semantic models,
    reports), including branching strategy, promotion,
    approvals, and rollback.
  - Establish reusable templates, checklists, and release
    documentation that the rest of the team deploys against.
  - Set the deployment bar and hold the team to it through
    review and automation.

  Data & Analytics Platform Leadership

  - Serve as the technical authority across a core platform
    (Fabric, Snowflake, or Databricks) plus a BI tool (Power
    BI or Tableau), and provide working depth across the
    others.
  - Lead onboarding and enablement for engineering and client
    teams: patterns, guardrails, and reusable solutions rather
    than one-off answers.
  - Own performance: diagnose and resolve query, job, refresh,
    and capacity issues, and design the platform so they stop
    recurring.

  Reliability, Monitoring & Incident Response

  - Own platform reliability. Design monitoring and alerting,
    set SLOs where they matter, and reduce operational toil.
  - Build and maintain the runbook library (standard operating
    procedures, known issues, escalation paths) and keep it
    current.
  - Lead incident response: drive triage, own the resolution,
    run the post-incident review, and land the preventative
    fix.

  Security & Governance

  - Define and enforce least-privilege access and secure secret
    handling (e.g., Key Vault, secret scopes) across
    environments.
  - Own data governance in practice: PII handling, row- and
    column-level security, and environment separation, aligned
    to firm and client policy.
  - Review the work of other engineers for security and
    governance before it reaches clients.

  Requirements

  - Minimum 6 years in data engineering, platform engineering,
    analytics engineering, or cloud operations, with a track
    record of owning platforms in production.
  - Minimum 2 years of representative accounting experience,
    whether implementing accounting systems or working in
    direct accounting roles.
  - Deep, production-grade command of a cloud data platform:
    Snowflake (preferred), Microsoft Fabric, or Databricks,
    with working fluency across the others.
  - Strong command of a BI platform: Power BI or Tableau,
    including data modeling, security, and refresh
    architecture.
  - CI/CD ownership: Git, branching and PR discipline, and
    building pipelines, not just running them.
  - Solid scripting in Python or PowerShell.
  - Advanced troubleshooting: you break down ambiguous problems,
    gather evidence, decide, and communicate clearly to
    technical and non-technical audiences.
  - Strong SQL and performance skills: indexing and partitioning
    strategy, query plans, and capacity tuning.
  - Working command of cloud fundamentals: identity and access,
    resource organization, logging, and monitoring.
  - Clear technical writing: runbooks, standards, and
    architecture documentation others can follow.
  - Relevant certifications (Azure, Snowflake, Databricks, etc.)
    are a plus.
  - Hands-on AI/ML/GenAI enablement experience (model lifecycle,
    AI Search, Azure OpenAI integration, or MLOps) is a strong
    plus.

