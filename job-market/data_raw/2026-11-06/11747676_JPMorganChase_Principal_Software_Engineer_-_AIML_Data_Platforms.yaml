description: |
  We’re looking for a tech leader ready to take their career
  to new heights. Join the ranks of top talent at one of the
  world’s most influential companies.

  As a Principal Software Engineer at JPMorganChase within the
  Chief Data & Analytics Office (CDAO) AI/ML Data Platforms
  Team, you provide deep engineering expertise and work across
  agile teams to enhance, build, and deliver trusted market-
  leading technology products in a secure, stable, and
  scalable way. Leverage your deep expertise to consistently
  challenge the status quo, innovate for business impact, lead
  the strategic development behind new and existing products
  and technology portfolios, and remain at the forefront of
  industry trends, best practices, and technological advances.

  Job responsibilities

  - Advises and leads on the strategy and development of
    multiple products, applications, and technologies across a
    portfolio
  - Creates novel code solutions and drives the development of
    new production code capabilities across teams and
    functions
  - Architects and governs agentic AI-enabled engineering
    workflows (using enterprise-authorized tools within the
    work environment) to improve delivery speed, code quality,
    and operational outcomes at scale (e.g., AI-driven PR
    review assistance, test generation/maintenance, release
    readiness checks, incident triage and root-cause
    acceleration), while defining guardrails for validation,
    security, resiliency, and reuse across teams.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation at scale.
  - Translates highly complex technical issues, trends, and
    approaches to leadership to drive the firm’s innovation
    and enable leaders to make strategic, well-informed
    decisions about technology advancements
  - Drives adoption and implementation of technical methods in
    specialized fields in line with the latest product
    development methodologies
  - Creates durable, reusable software frameworks that are
    leveraged across teams and functions
  - Influences across business, product, and technology teams
    and successfully manages senior stakeholder relationships
  - Serves as the function’s go-to subject matter expert
  - Build and operate 24x7, tier‑1 online services
  - Champions the firm’s culture of diversity, opportunity,
    inclusion, and respect



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and advanced applied experience
  - Practical experience delivering system design, application
    development, testing, and operational stability
  - Proficiency in one or more of the following languages: Rust,
    Java, Go, C++
  - Demonstrated experience designing and leading adoption of
    agentic AI-enabled development practices (using
    enterprise-authorized tools within the work environment)
    across teams, including setting standards for human-in-
    the-loop validation, auditability/traceability of changes,
    and secure handling of sensitive data.
  - Strong understanding of responsible AI use and control
    expectations in engineering workflows, including
    security/resiliency implications, data sensitivity, and
    risk-based governance; ability to influence senior
    technical leaders on safe scaling patterns and reuse.
  - Proven track record building and operating 24x7, tier‑1
    online services.
  - Demonstrated prior experience with influencing across
    functions and teams and delivering value at scale
  - Experience applying expertise and new methods to determine
    solutions for complex technology problems across various
    technical disciplines
  - Extensive practical cloud native experience
  - Expertise in Computer Science, Computer Engineering,
    Mathematics, or a related technical field



  Preferred qualifications, capabilities, and skills

  - Familiarity with open‑source projects in the OLAP/data
    stack: Apache DataFusion, DuckDB, Apache Arrow Flight SQL.

