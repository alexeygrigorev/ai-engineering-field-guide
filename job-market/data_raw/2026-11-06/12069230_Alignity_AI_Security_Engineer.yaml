  RequirementsAbout the Role

  We are seeking an AI Security Engineer to secure how our
  client designs, builds, and adopts AI. You will focus on AI-
  specific threats and on secure architecture, design, and
  implementation across AI-enabled applications, software, and
  processes. This is a hands-on role that partners with
  engineering, data, and security teams to design and build
  safeguards.

  What You Will Do

  •         Focus on AI security threats, secure architecture,
  design, and implementation across AI-enabled applications,
  software, and processes.

  •         Partner with relevant stakeholders to ensure AI
  security standards, architecture templates, safeguards, and
  security controls are incorporated into AI workloads and
  application designs.

  •         Assess AI solutions and architectures to identify
  security risks, control gaps, and appropriate security
  requirements throughout the solution lifecycle.

  •         Develop and promote reusable AI security
  architecture patterns to enable consistent and secure
  adoption of AI capabilities.

  •         Identify opportunities to automate security
  architecture, assessment, validation, and control processes,
  leveraging existing security tooling and architecture
  patterns where practical.

  •         Research and evaluate AI security testing tools,
  frameworks, and utilities to strengthen security validation
  and support secure implementation.

  •         Support the implementation and integration of
  appropriate AI security controls and testing capabilities
  into enterprise AI solutions.

  What You Bring

  •         3+ years of experience in security engineering,
  security architecture, or application security, as part of
  at least 7 years of overall work experience.

  •         Working knowledge of AI security risks, such as
  prompt injection, sensitive data exposure, model and supply
  chain risk, and misuse of AI agents and tools, plus
  familiarity with frameworks like the OWASP Top 10 for LLM
  Applications, NIST AI RMF, or MITRE ATLAS.

  •         Ability to review a solution design, identify
  security gaps, and turn them into clear, practical
  requirements.

  •         Comfort with scripting or automation to reduce
  repetitive security work.

  •         Strong written and verbal communication, and the
  ability to work well with engineering and data teams.

  •         Senior-level self-starter who can own an
  assignment end to end and see it through with minimal
  oversight.

  Standout Skills

  None of these are required. Any one is a plus.

  •         Experience securing AI workloads on Google Cloud
  Vertex AI.

  •         Experience with threat modeling and secure design
  reviews.

  •         Relevant security certifications or equivalent
  demonstrated skill.

  •         Experience implementing AI security tooling, such
  as AI Security Posture Management (AISPM) platforms like Wiz
  AISPM.

