description: |
  Systems Test Engineer, HPC & AI Systems



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  High Performance Computing, AI and Labs is a critical
  element of HPE. We are focused on delivering innovative
  solutions that accelerate our customers’ digital
  transformation, enabling them to tackle their complex, and
  data-intensive workloads. Combining deep expertise and the
  development of the world’s most cutting-edge, high-
  performance supercomputers, is defining the next era of
  computing delivering valuable insight & innovation. Join us
  and redefine what’s next for you.

  What you'll do:

  - You are a hands-on systems engineer who enjoys solving
    complex integration problems across hardware, software,
    firmware, operating systems, networking, and storage.
  - You are motivated by working on leading-edge hardware and
    HPC technologies that support next-generation AI
    development and applications.
  - You understand the importance of validating complex
    integrated systems before release to help protect customer
    uptime, reliability, and overall experience.
  - You look for opportunities to identify product issues early,
    strengthen test coverage, improve automation, and increase
    release readiness.
  - You work effectively across engineering, program, product,
    vendor, and global test teams to drive issues to
    resolution.
  - You communicate clearly about technical issues, risks,
    status, and recommendations with both technical teams and
    leadership.

  What you need to bring:

  Knowledge and Skills

  - Hands-on experience with HPE HPC platforms, including,
    Industry Standard Server, storage, and networking
    products.
  - Strong working knowledge of Linux operating systems,
    including Red Hat, SLES, Ubuntu, and related certification
    or validation processes.
  - Understanding of hardware and software interactions in
    complex server, storage, networking, and integrated
    systems environments.
  - Experience developing, executing, and improving test
    strategies for complex product releases.
  - Strong troubleshooting and debugging skills for complex
    issues in collaboration with engineering, product, and
    test teams.
  - Familiarity with automated test execution, test tools, and
    validation frameworks.
  - Ability to manage multiple priorities in a fast-moving
    product development environment.
  - Ability to work effectively in a global, culturally diverse
    engineering team.
  - Strong written and verbal communication skills, with the
    ability to effectively communicate technical concepts,
    issues, and recommendations.
  - Bash scripting experience required to support system test
    execution and troubleshooting.
  - Python experience preferred for test support, log analysis,
    and validation efficiency improvements.
  - Knowledge of Redfish commands, RESTful APIs, and JSON is a
    plus.

  Responsibilities

  - Validate complex system configurations across servers,
    accelerators, storage, networking, firmware, operating
    systems, and management interfaces used in HPC
    environments.
  - Translate product requirements and feature changes into
    validation strategies that improve test coverage, identify
    integration risks early, and provide clear release-
    readiness feedback to engineering and program teams.
  - Analyze, debug, and drive resolution of issues discovered
    during integrated systems testing.
  - Support Linux OS certification and submission activities
    with vendors such as Red Hat, SUSE, and Ubuntu.
  - Execute testing in local and remote lab environments and
    coordinate automated test execution across global teams.
  - Partner with product development, program management,
    product management, technical leads, and third-party
    vendors to resolve development and release issues.
  - Use test tools, automation support, and process improvements
    to improve validation efficiency for current and next-
    generation HPE HPC products.
  - Communicate with management and development partners on
    system requirements, test plan status, project progress,
    risks, and issue resolution.
  - Train, guide, and support onshore and offshore test teams in
    test setup, execution, and result triage.
  - Mentor less-experienced staff members and contribute to
    overall team capability.

  Education and Experience Required

  - Bachelor’s or master’s degree in either Computer
    Engineering, Computer Science, Electrical Engineering, or
    an equivalent technical field.
  - Minimum 6 years of relevant experience in systems
    engineering, software engineering, test engineering,
    platform validation, or related technical roles.

