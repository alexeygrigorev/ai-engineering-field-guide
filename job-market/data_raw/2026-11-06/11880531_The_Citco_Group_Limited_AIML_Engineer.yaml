  About the Role:

  Citco Technology Management is looking for a Gen AI/ML
  Engineer to design, build and deploy machine learning and
  generative AI solutions, primarily leveraging AWS and Amazon
  SageMaker. You will be part of the team driving AI-led
  innovation across the firm, working closely with product
  managers, architects and developers across the globe.

  Key Responsibilities: 1. Design, develop, enhance, and
  maintain Gen AI and ML applications and pipelines. 2. Build,
  train, tune and deploy models using Amazon SageMaker
  (Training Jobs, Pipelines, real-time and batch endpoints).
  3. Develop Generative AI solutions such as LLM-based
  applications, RAG pipelines, copilots, and document
  intelligence using AWS services (Bedrock, SageMaker
  JumpStart). 4. Troubleshoot and resolve model performance,
  latency and accuracy issues. 5. Maintain strong knowledge of
  design patterns and MLOps best practices. 6. Maintain
  working knowledge of technical enhancements and emerging Gen
  AI/ML technologies. 7. Learn, adapt, test/evaluate, and
  implement new tools and technologies in the AI/ML space. 8.
  Communicate effectively with business and Product Management
  teams on AI solution outcomes. 9. Coordinate with the DevOps
  team to push model and infrastructure changes (via
  SageMaker, AWS CI/CD) to higher environments. 10. Provide
  technical documentation for models, pipelines and deployed
  solutions. 11. Maintain a strong understanding of CI/CD
  integration for ML workflows. 12. Communicate effectively
  with peers and leads. 13. Participate and contribute to all
  team activities such as sprint planning, daily scrums, and
  retrospectives



  About You:

  1. Bachelor's or Master's degree in Computer Science, Data
  Science, Engineering, Mathematics or a related field. 2.
  Around 3 years of hands-on experience in AI/ML engineering,
