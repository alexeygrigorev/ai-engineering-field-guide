title: Microsoft 365 AI Security Engineer (Remote)
company: Inviso Corporation
location: USA
remote: true
work_type: FULL_TIME
description: |
  The Role

  The Inviso Microsoft 365 AI Security Engineer is a hands-on
  technical consultant who designs, implements, and optimizes
  security, compliance, identity, and governance solutions
  across Microsoft 365.

  This role focuses on helping clients secure Microsoft 365
  environments using Microsoft Purview, Microsoft Entra ID,
  Microsoft Defender, and emerging Microsoft agent security
  and governance capabilities, including Agent 365. The
  Engineer translates security and compliance requirements
  into practical technical controls and works directly with
  client teams to implement, validate, and operationalize
  those solutions.

  As part of Inviso’s Microsoft Solutions Group (MSG), the
  Engineer works across client engagements, partnering with
  architects, consultants, security teams, and client
  stakeholders to deliver secure, governed Microsoft 365
  environments.

  This is a 100% remote role working in the US and requiring
  US time-zone availability.

  Key Activities for this Role

  - Design, configure, and implement Microsoft Purview security,
    compliance, data governance, and information protection
    capabilities.
  - Configure and optimize Purview Information Protection,
    sensitivity labels, Data Loss Prevention (DLP), retention,
    eDiscovery, and related compliance controls.
  - Implement security and governance capabilities for Microsoft
    365 Copilot and AI agents using Agent 365 and related
    Microsoft security technologies.
  - Design and implement identity and access controls using
    Microsoft Entra ID, including Conditional Access, MFA,
    RBAC, identity governance, and privileged access.
  - Assess Microsoft 365 environments, identify security and
    compliance gaps, and develop actionable recommendations
    and remediation plans.
  - Configure and integrate Microsoft Defender, Microsoft 365
    security, compliance, identity, and governance
    capabilities across customer environments.
  - Partner directly with client security, compliance, identity,
    and IT teams to translate business and regulatory
    requirements into technical solutions.
  - Develop technical documentation, configuration standards,
    governance frameworks, implementation plans, and
    operational procedures.
  - Support client workshops, technical discovery, solution
    design, implementation, testing, and knowledge transfer.
  - Maintain delivery activities, technical work items,
    documentation, and project status while meeting Inviso
    quality and utilization expectations.

  Experience & Skills Required

  - 3+ years of hands-on experience implementing and supporting
    Microsoft 365 security, compliance, or identity solutions
    in enterprise environments.
  - Strong hands-on experience with Microsoft Purview, including
    Information Protection, sensitivity labels, Data Loss
    Prevention, retention, eDiscovery, or related compliance
    capabilities.
  - Experience implementing Microsoft Entra ID security
    controls, including Conditional Access, MFA, RBAC,
    privileged access, and identity governance.
  - Working knowledge of Microsoft 365 Copilot, AI agents, Agent
    365, or security and governance controls for enterprise AI
    workloads.
  - Experience with Microsoft Defender and Microsoft 365
    security capabilities, including integration across
    identity, applications, endpoints, and cloud services.
  - Understanding of Zero Trust principles and their application
    across Microsoft 365 identity, data, applications, and
    collaboration services.
  - Experience assessing existing environments, identifying
    security or compliance gaps, and implementing remediation
    recommendations.
  - Proficiency with PowerShell and automation for Microsoft 365
    administration, security, compliance, and configuration.
  - Strong consulting and customer-facing skills with the
    ability to lead technical discussions and clearly
    communicate recommendations.
  - Strong written documentation skills and experience working
    within structured consulting or project delivery teams.

  Desired Qualifications

  - Microsoft security certifications such as SC-100, SC-300,
    SC-400, or equivalent Microsoft 365 security and
    compliance certifications preferred.
  - Experience securing Microsoft 365 Copilot, Copilot Studio
    agents, or other enterprise AI and agent-based solutions.
  - Experience with Microsoft Sentinel, Defender for Cloud Apps,
    or broader Microsoft Security technologies.
  - Experience working in consulting, professional services, or
    complex enterprise Microsoft 365 environments.
  - Bachelor’s degree in a related technical field or equivalent
    professional experience preferred.

  Compensation

  At Inviso, we believe great talent should be rewarded with
  competitive pay, meaningful benefits, and room to grow. The
  salary for this role ranges from $90,000 to $115,000
  annually, reflecting the cost of labor across multiple US
  geographic markets. Beyond base pay, we offer a strong
  benefits package that includes medical, dental, and vision
  insurance, a 401(k) plan with company match, annual training
  reimbursement, paid time off, paid holidays, and additional
  perks designed to support your well-being and long-term
  success.

  Why You’ll Love Working at Inviso:

  - Do work that matters. We are a global technology and
    business consulting firm that helps organizations
    implement AI, modern data platforms, and digital marketing
    strategies.
  - Work somewhere people choose to stay. Our low attrition,
    strong average tenure, and employees who have spent 10,
    15, or even 20 years with Inviso speak volumes about our
    culture and how we care for our people.
  - Bring your ideas and be heard. You will join a
    collaborative, people-first environment where ideas
    matter, contributions are recognized, and excellent work
    creates real opportunities for growth.
  - Keep learning and growing. Inviso invests in employees
    through continuous learning, mentorship, collaboration,
    and career development across a diverse global
    organization.
  - Join a company with deep industry credibility. Inviso has
    worked closely with Microsoft for more than 20 years and
    is proud to be a top-rated supplier and Managed Partner
    with numerous credentials.
