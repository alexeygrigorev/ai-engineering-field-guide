title: "Associate SAP Security Engineer - AI & Automation"
company: Maersk
location: Yelahanka, IND
work_type: FULL_TIME
company_size: 38,151 Employees
description: |
  Company:

  Maersk is going through times of unprecedented change. As we
  aspire to secure sustainable growth of our businesses, we
  need to re-think the way we engage with our customers and
  partners.

  If you are passionate about working in an entrepreneurial
  and ever-changing environment, developing new products that
  engage and provide an enhanced customer experience – you
  maybe what we are looking for.

  We Offer:

  Joining Maersk will embark you on a great journey with
  career development in a global organization. As an SAP
  Security Technical Engineer working with the new age SAP
  Platform you will gain broad business knowledge of the
  company’s activities globally, as well as take part in the
  transformation of the transport and logistics industry.

  You will work and communicate across geographical and
  cultural borders that will enable you to build a strong
  professional network. We will provide you with opportunities
  that broaden your knowledge and strengthen your technical
  and professional foundation.

  Professional Requirements:

  - 3 to 5 years of core Security experience with SAP at its
    core and main skill
  - Bachelor’s or master’s degree or equal by experience

  Key Professional Skills:

  - Build, test and deploy SAP solutions based on the design
    from the solution architects and at the same time be able
    to progress into detailed design for a successful
    implementation and transition to application support team
  - Solve complex business problems in the areas of finance,
    operations, human capital, customer, and governance, risk
    and compliance whilst using SAP technologies primarily.
  - Has experience in more than 1-2 Full Lifecycle SAP
    Implementation project
  - Excellent communication skills as the job requires a high
    degree of verbal and written communication
  - Be highly motivated, hardworking and possess good time
    management and communication skills
  - Knowledge and experience of delivering projects in an Agile
    framework

  Core SAP Security skills:

  - Ensure governance and compliance through effective and
    accurate analysis, design, development and quality
    assurance of information security controls
  - Can directly build and manage roles / authorisations and its
    maintenance along with user access in SAP systems and is
    willing to learn admin controls for peripheral systems
    including cloud SAP security controls
  - Have strong experience in SAP GRC AC, S4HANA, FioriBW4HANA &
    SAC, HANA DB Security
  - Respond timely to business requests requiring security
    control changes and solicit accurate and complete business
    and functional requirements from Solution Architects and
    Subject Matter Experts
  - Have familiarity with security framework controls as it
    applies to SAP system access e.g Enterprise Segregation of
    Duties, EAM, Access controls
  - Support & manage different SAP internal & external audit
    activities. Manage and define security processes.
  - Implements proper security controls to secure SAP Systems
    resources.
  - Assists with periodic security reviews, critical transaction
    reviews, and segregation of duty reviews to ensure access
    within the system is appropriate based upon job
    responsibilities.
  - Adheres to change control rules and methodology with regard
    to break fix and project support.
  - Provides SAP security project support for site deployments,
    implementations and related functional enhancements.
  - Engages in knowledge transfer and training of SAP Security
    team members, IT team members and business users as
    applicable
  - Has knowledge of Enterprise level threat detection tools
    such as SIEM
  - Working experience in Enterprise Identity & Governance tools
    would be added advantage

