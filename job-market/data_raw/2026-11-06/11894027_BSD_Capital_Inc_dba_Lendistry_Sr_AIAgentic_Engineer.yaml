  Physical Requirements

  This is a stationary position that requires frequent sitting
  (approximately 95%), repetitive wrist motions, grasping,
  speaking, listening, close vision, and the ability to adjust
  focus.  It also may require occasional standing, lifting,
  carrying of 20lbs or less, walking, kneeling,
  bending/stooping, twisting, pulling/pushing, and reaching
  above the shoulder.  Employees in this position must be
  physically able to efficiently perform the essential
  functions of the position.

