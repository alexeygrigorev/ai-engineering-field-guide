description: |
  Why NeuraFlash, Part of Accenture:

  At NeuraFlash, Part of Accenture, we are redefining the
  future of business through the power of AI and
  groundbreaking technologies like Agentforce. As a trusted
  leader in AI, AWS, and Salesforce innovation, we craft
  intelligent solutions—integrating Salesforce Einstein,
  Service Cloud Voice, Amazon Connect, Agentforce and more—to
  revolutionize workflows, elevate customer experiences, and
  deliver tangible results. From conversational AI to
  predictive analytics, we empower organizations to stay ahead
  in an ever-evolving digital landscape with cutting-edge,
  tailored strategies.

  We are proud to be creating the future of generative AI and
  AI agents. Salesforce has launched Agentforce, and
  NeuraFlash, Part of Accenture, was selected as the only
  partner for the private beta prior to launch. Post-launch,
  we’ve earned the distinction of being Salesforce’s #1
  partner for Agentforce, reinforcing our role as pioneers in
  this transformative space.

  Be part of the NeuraFlash, Part of Accenture journey and
  help shape the next wave of AI-powered transformation. Here,
  you’ll collaborate with trailblazing experts who are
  passionate about pushing boundaries and leveraging
  technologies like Agentforce to create impactful customer
  outcomes. Whether you're developing advanced AI-powered
  bots, streamlining business operations, or building
  solutions using the latest generative AI technologies, your
  work will drive innovation at scale. If you’re ready to make
  your mark in the AI space, NeuraFlash, Part of Accenture is
  the place for you.

  In this position, you will join our specialized AI
  acceleration team to drive compelling, client-facing
  Agentforce-powered engagements for users and deliver
  impactful business value to our clients.

  Our core engagements encompass three core areas:

  - Competitive bake-offs. Partnering with organizations
    evaluating Agentforce alongside other AI architectures,
    constructing dynamic agents directly within tight project
    cycles to incorporate feedback in real time.
  - Fast prototypes. Rapidly engineering functional proof-of-
    value implementations to confirm technical feasibility
    prior to broader deployment commitments.
  - Art-of-the-possible demos. Architecting innovative,
    unprompted agentic solutions to demonstrate groundbreaking
    platform capabilities to prospective stakeholders.

  This focus centers specifically on rapid execution rather
  than long-term project delivery or baseline platform
  development.

  Working alongside a Pursuit Architect responsible for
  qualification, executive alignment, and commercial scope,
  you will lead and own the technical design, continuous
  tuning, and direct customer interactions to bring the
  client’s desired business value. You will directly architect
  and execute solutions using advanced AI tooling as force
  multipliers.

  To support real-time troubleshooting and active
  collaboration during client working hours, this role is
  based in North America, aligned directly with regional
  client operational schedules. This coverage is essential for
  maintaining agility across all delivery milestones.

  You will have the opportunity to:

  - Rapidly construct agentic solutions directly within client
    environments, translating core requirements into
    functional architectures-including subagents,
    deterministic guardrails, dynamic actions, and
    foundational data models-across condensed delivery cycles.
  - Lead recurring technical client engagements, serving as the
    primary touchpoint to demonstrate progress, incorporate
    real-time feedback, delineate scope boundaries, and drive
    iteration throughout the opportunity lifecycle.
  - Connect technical delivery directly to strategic business
    metrics like deflection, handle duration, operational
    expenses, and user sentiment when presenting solutions to
    key leadership and non-technical stakeholders.
  - Proactively identify delivery bottlenecks, integration
    constraints, architecture limits, or misalignment among
    business sponsors, raising visibility early to maintain
    velocity against aggressive milestone schedules.
  - Perform real-time troubleshooting and optimization under
    tight timeframes to resolve dialogue flow failures,
    execution bugs, or system logic issues.
  - Deliver authoritative live interactive demonstrations,
    featuring complex Agentforce solutions under active
    scrutiny.
  - Convert technical insights gained from client
    implementations into reusable solution accelerators,
    demonstration assets, and internal knowledge bases to
    scale collective delivery velocity.

  What we're looking for

  - 4+ years executing technical solutions, consulting, or
    solution engineering in client-facing environments. Direct
    engagement with key stakeholders during critical decision
    moments is mandatory.
  - 2+ years hands-on experience building with Agentforce,
    Service Cloud, or comparable agentic AI architectures-
    building and architecting active solutions rather than
    outlining theoretical models.
  - Active Salesforce accreditations, including Agentforce
    Specialist, Platform Developer I, or System Administrator
    credentials.
  - Ability to perform rapid prototyping and real-time
    troubleshooting. You can stand up functional solutions
    quickly and analyze Flows, Apex, or agent execution traces
    to pinpoint root causes and resolve issues under pressure.
  - Strong grasp of enterprise architectural principles-
    including integration patterns, data models, and platform
    boundaries-to accurately align technical commitments with
    real-world capability.
  - Skill in translating complex technical trade-offs into
    executive-level business impact. You address stakeholder
    hesitation proactively while tying solutions directly to
    operational metrics.
  - Commitment to leveraging modern AI tooling to multiply
    efficiency. Platforms like Claude are core components of
    our day-to-day methodology to drive rapid execution.
  - Comfort operating within rapid, evolving environments where
    you actively help chart the path forward under condensed
    timelines.

  Nice to have

  - Demonstrated background leading fast-paced competitive bake-
    offs, proof-of-value prototypes, or pre-sales engagements
    within the AI landscape.
  - Deep expertise in telephony and voice integration platforms
    such as Service Cloud Voice, Amazon Connect, Genesys, or
    NICE.
  - Familiarity with broader agentic ecosystems like Amazon
    Bedrock, Google Vertex AI, or contemporary LLM
    orchestration frameworks.
  - Background with modern enterprise data architectures
    including Salesforce Data 360, Snowflake, Databricks, or
    BigQuery.

  What can you expect in the interview process?

  - Recruiter screen (phone) - 30 minutes
  - Peer interview (Video) - 45 minutes
  - Panel interview with real-time exercise (Video) - 60 minutes
  - Leadership interview (Video) - 45 minutes

