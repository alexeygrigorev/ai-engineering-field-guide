title: AI Solutions Developer
company: Two Sigma
location: New York, USA
work_type: FULL_TIME
company_size: 1,700 Employees
description: |
  Position Summary  Two Sigma is a leading quantitative
  investment management and trading firm. The company applies
  a scientific approach to investing, combining cutting-edge
  technology, artificial intelligence, data science, and
  quantitative research with rigorous human inquiry to
  capitalize on market opportunities and deliver alpha for
  investors. Our team of engineers, quantitative researchers
  and data scientists looks beyond the traditional to test
  hypotheses and develop creative solutions to some of the
  world's most complex economic problems. Two Sigma is
  building a new team to deliver AI-powered systems across the
  firm. AI Solutions operates as an embedded engineering
  capability: project-based, domain-agnostic, and focused on
  translating AI potential into production reality. We are
  hiring a mid-to-senior Software Engineer to join the team.
  This is not a research role and it is not a product
  management role. It is a building role. You will work
  directly with teams across the firm, understand their
  problems, design solutions that leverage agentic AI, and
  ship systems that people depend on. The work is varied by
  design. One project might be a two-day integration. The next
  might be a multi-month platform build. You will need the
  engineering depth to build reliable production systems and
  the judgment to figure out what to build in the first place.
  You will take on the following responsibilities:

  - Embed with teams across the firm to understand workflows,
    identify opportunities for AI augmentation, and deliver
    working systems
  - Design and build agent-based workflows for knowledge and
    analysis tasks, including orchestration, escalation, and
    human-agent interaction patterns
  - Develop integrations between AI capabilities and existing
    firm infrastructure: MCP servers, APIs, data pipelines,
    and internal tooling
  - Build and maintain deployment infrastructure for AI-powered
    systems, including monitoring, observability, and
    operational support
  - Contribute to the definition of Two Sigma's AI platform
    through direct experience building production systems
    across diverse domains
  - Operate with significant autonomy: scoping problems, making
    architectural decisions, and delivering results with
    minimal specification

  You should possess the following qualifications:

  - BS or equivalent work experience in Science, Technology,
    Engineering or Math (an MS is a plus)
  - Minimum 1 year of experience required; 5-10 years of
    experience preferred
  - Strong software engineering fundamentals: you build
    production systems that other people depend on
  - Meaningful experience working with AI tooling and agentic
    systems over the past 2-3 years, with a clear
    understanding of how these tools have evolved and where
    they break down
  - Comfort with ambiguity and rapid context-switching across
    projects, domains, and partner teams
  - Experience designing and building integrations, APIs, or
    developer tooling
  - Strong communication skills: you will spend significant time
    understanding other people's problems before you start
    solving them

  You will enjoy the following benefits:

  - Core Benefits: Fully paid medical and dental insurance
    premiums for employees and dependents, competitive 401k
    match, employer-paid life & disability insurance
  - Perks: Onsite gyms with laundry service, wellness
    activities, casual dress, snacks, game rooms
  - Learning: Tuition reimbursement, conference and training
    sponsorship
  - Time Off: Generous vacation and unlimited sick days,
    competitive paid caregiver leaves
  - Hybrid Work Policy: Flexible in-office days with budget for
    home office setup

  The base pay for this role will be between $165,000 and
  $300,000. This role may also be eligible for other forms of
  compensation and benefits, such as a discretionary bonus,
  health, dental and other wellness plans and 401(k)
  contributions. Discretionary bonus can be a significant
  portion of total compensation. Actual compensation for
  successful candidates will be carefully determined based on
  a number of factors, including their skills, qualifications
  and experience. We are proud to be an equal opportunity
  workplace. We do not discriminate based upon race, religion,
  color, national origin, sex, sexual orientation, gender
  identity/expression, age, status as a protected veteran,
  status as an individual with a disability, or any other
  applicable legally protected characteristics. Two Sigma is
  committed to providing reasonable accommodations to
  qualified individuals in accordance with applicable federal,
  state, and local laws. If you believe you need an
  accommodation, please visit our website for additional
  information.
