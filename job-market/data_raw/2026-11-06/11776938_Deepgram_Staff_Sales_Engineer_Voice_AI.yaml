description: |
  Company Overview

  Deepgram is the leading platform underpinning the emerging
  trillion-dollar Voice AI economy, providing real-time APIs
  for speech-to-text (STT), text-to-speech (TTS), and building
  production-grade voice agents at scale. More than 200,000
  developers and 1,300+ organizations build voice offerings
  that are ‘Powered by Deepgram’, including Twilio,
  Cloudflare, Sierra, Decagon, Vapi, Daily, Cresta, Granola,
  and Jack in the Box. Deepgram’s voice-native foundation
  models are accessed through cloud APIs or as self-hosted and
  on-premises software, with unmatched accuracy, low latency,
  and cost efficiency. Backed by a recent Series C led by
  leading global investors and strategic partners, Deepgram
  has processed over 50,000 years of audio and transcribed
  more than 1 trillion words. There is no organization in the
  world that understands voice better than Deepgram.

  Company Operating Rhythm

  At Deepgram, we expect an AI-first mindset—AI use and
  comfort aren’t optional, they’re core to how we operate,
  innovate, and measure performance.

  Every team member who works at Deepgram is expected to
  actively use and experiment with advanced AI tools, and even
  build your own into your everyday work. We measure how
  effectively AI is applied to deliver results, and
  consistent, creative use of the latest AI capabilities is
  key to success here. Candidates should be comfortable
  adopting new models and modes quickly, integrating AI into
  their workflows, and continuously pushing the boundaries of
  what these technologies can do.

  Additionally, we move at the pace of AI. Change is rapid,
  and you can expect your day-to-day work to evolve just as
  quickly. This may not be the right role if you’re not
  excited to experiment, adapt, think on your feet, and learn
  constantly, or if you’re seeking something highly
  prescriptive with a traditional 9-to-5.

  The Opportunity

  Enterprises are moving fast from transcribing conversations
  to automating them. Contact centers, healthcare, financial
  services and consumer brands are putting voice agents in
  front of their customers. The buyers range from CX leaders
  to platform engineers, and the deals turn on latency,
  reliability, cost per minute and whether the agent holds up
  in production.

  Deepgram is hiring a Staff Sales Engineer, Voice Agent to
  drive adoption of our Voice Agent platform globally. You’ll
  work alongside every Account Executive on the team as the
  technical lead on voice agent deals, and you’ll carry a
  quota for new Voice Agent logos and ARR. Most of your time
  is spent in front of customers: positioning Deepgram in
  discovery, winning the technical evaluation and getting
  customers to production. You report to the VP of Sales.

  What You'll Do

  - Win voice agent deals. Lead discovery, technical
    qualification, architecture and proofs of concept for
    Voice Agent opportunities, and own the technical win from
    first call through production.
  - Be the expert in the room. Whiteboard how a customer's
    telephony stack (SIP trunks, PBX, CCaaS) connects to their
    voice agents and where Deepgram fits. Go deep on latency,
    turn-taking, interruption handling, function calling, cost
    per minute and build vs. buy.
  - Build what sells. Ship demos, reference agents and
    integration patterns across LLMs, telephony/SIP, CCaaS
    platforms and orchestration frameworks that AEs and
    customers can use on day one.
  - Carry the number. Own a quota tied to Voice Agent growth and
    run your pipeline and forecast with discipline.
  - Make the team better. Create the positioning, competitive
    battlecards, objection handling and enablement that let
    every AE sell Voice Agent with confidence, even when you
    are not on the call.
  - Bring the field into Product. Turn patterns from deals into
    clear, evidence-backed requirements for our API, SDKs and
    docs.
  - Work the ecosystem. Partner with CCaaS, telephony and LLM
    partners to build joint solutions and co-sell plays.

  What You Bring

  - 7+ years in customer-facing technical roles such as
    solutions engineering, sales engineering, solutions
    architecture or forward-deployed engineering, ideally at
    an API, CPaaS, CCaaS or conversational AI company.
  - Hands-on voice agent experience across the stack: telephony
    (SIP, WebRTC, PBX or CCaaS integration), orchestration
    (LLM agent frameworks, tool calling, real-time streaming
    pipelines) and models (STT, TTS, LLMs).
  - You build. You've shipped demos, POCs or production
    integrations in Python, Node.js or similar, and you can
    show us something you've built.
  - A track record in revenue-tied roles. You've been measured
    on technical wins, pipeline or quota, and you consistently
    hit your targets.
  - Comfort leading complex, multi-stakeholder enterprise deals
    with everyone from platform engineers to CX executives.
  - Clear communication. You can walk an engineer through a SIP
    call flow and a VP through a cost-per-minute business case
    in the same meeting.

  Nice to Have

  - Voice agents built on frameworks or platforms like Pipecat,
    LiveKit, Vapi, Retell or OpenAI Realtime
  - Contact center domain experience (Genesys, NICE, Five9,
    Amazon Connect, Talkdesk or similar)
  - Experience carrying an individual or overlay quota
  - Hands-on work with MCP servers, agent harnesses or CLI
    tools, or open-source contributions with real adoption
  - Familiarity with Challenger or a similar sales methodology
  - Experience selling across both self-serve and enterprise
    motions

  Notice: We're aware of individuals impersonating Deepgram
  recruiters. All legitimate Deepgram recruiting communication
  comes from an @deepgram.com email address. If you've
  received a message claiming to be Deepgram, please forward
  it to careers@deepgram.com.
