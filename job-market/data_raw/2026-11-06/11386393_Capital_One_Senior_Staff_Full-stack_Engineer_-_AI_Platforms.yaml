description: |
  Senior Staff Full-stack Engineer - AI Platforms & Customer
  Management Modernization As a Senior Staff Engineer at
  Capital One, you will be part of a community of technical
  experts working to define the future of banking in the
  cloud. You will work alongside our talented team of
  developers, machine learning experts, product managers and
  people leaders. Our Senior Staff Engineers are leading
  experts in their domains, helping devise practical and
  reusable solutions to complex problems. You will drive
  innovation at multiple levels, helping optimize business
  outcomes while delivering strong technology solutions. At
  Capital One, we believe diversity of thought strengthens our
  ability to influence, collaborate and provide the most
  innovative solutions across organizational boundaries. You
  will promote a culture of engineering excellence and strike
  the right balance between lending expertise and providing an
  inclusive environment where the ideas of others can be heard
  and championed. You will lead the way in creating next-
  generation talent for Capital One Tech, mentoring engineers
  and actively recruiting to keep building our community.
  Senior Staff Engineers are expected to lead through
  technical contribution. You will operate as a trusted
  advisor for our key technologies, platforms and capability
  domains, creating clear and concise communications, code
  samples, blog posts and other materials to share knowledge
  both inside and outside the organization. You will
  specialize in a particular subject area, but your input and
  impact will be sought and expected throughout the
  organization. The Team: In this role, you will be the
  technical lead for the Customer Management engineering
  organization, setting and delivering the technical agenda
  for the foundational platforms and horizontal thread teams
  (SRE, Sustained Engineering, Data, and Operations). You will
  manage the entire credit card customer lifecycle-from offer
  management to retention-to ensure a seamless and delightful
  experience. You will make credit decisioning & offers real
  time and intelligent, spanning dynamic credit offers, line,
  balance transfer, product upgrades, retention offers
  leveraging novel data sources and predictive models, as well
  as quantitative in-market testing and experimentation. You
  will drive an agenda to ship exponentially more products,
  experiences, and offers by arming cross-functional partners
  with GenAI tools, datasets, experimentation frameworks, and
  configurable/extensible systems that allow for self-service
  product delivery. All with one overarching goal: put more
  Capital One cards in more wallets. You will lead 100+
  engineers across multiple directors, grow high-potential
  senior leaders, and even found a novel SRE function that
  raises operational excellence across the entire Customer
  Management domain. This is not a pure architecture role and
  you will work elbow-to-elbow with project teams coding,
  delivering, optimizing and operating the systems you design.
  The ideal candidate will excel at both surveying broad
  business domains, crafting a technical strategy to support
  the many possible futures of the business, and diving deep
  into the details and personally delivering the highest-
  leverage projects from that roadmap. What You'll Do:

  - Articulate and evangelize a bold technical vision for your
    domain
  - Decompose complex problems into practical and operational
    solutions
  - Ensure the quality of technical design and implementation
  - Serve as an authoritative expert on non-functional system
    characteristics, such as performance, scalability and
    operability
  - Continue learning and injecting advanced technical knowledge
    into our community
  - Handle several projects simultaneously, balancing your time
    to maximize impact
  - Act as a role model and mentor within the tech community,
    helping to coach and strengthen the technical expertise
    and know-how of our engineering and product community
  - Drive modernization of monolithic systems into microservice
    architectures and event-driven platforms
  - Collaborate with senior engineering and architecture leaders
    to define long-term platform strategy and API standards
  - Serve as a force-multiplier for the team, balancing deep,
    hands-on technical contribution and innovation with
    mentoring and elevating the skills of peers and junior
    engineers.
  - Lead cross-divisional projects and impacts that promote
    technological best practices and enhancements
  - Partner with product management to set an ambitious roadmap
    for expanding Capital One's reach
  - Partner with product management to set an ambitious roadmap
    for expanding Capital One's reach.
  - Hands-on full-stack coding (frontend, backend, data
    processing, automation)
  - Lead the multi-year strategy to decommission legacy systems
    and converge the destination stack, reducing maintenance
    overhead and eliminating duplicative customer experiences
    across channels.
  - Stand up and scale a hybrid SRE + Engineering Productivity
    function supporting the entire Acquisitions engineering
    org, achieving strong statistical process control and
    operational maturity.
  - Design solutions that enable non-technical contributors to
    design, test, and deliver marketing experiments, UI
    treatments, and credit offers.

  Basic Qualifications:

  - Bachelor's Degree or higher in Computer Science or a related
    quantitative field (Statistics, Economics, Operations
    Research, Analytics, Mathematics, Engineering)
  - At least 9 years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture

  Preferred Qualifications:

  - Master's Degree in Computer Science or Software Engineering
  - 12+ years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Web technologies (JavaScript, TypeScript and SPA frameworks)
    - Designing and building distributed HPC and ML systems
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture
  - 12+ years of professional experience coding in commonly used
    languages like Go, Java, JavaScript/TypeScript, Python,
    Rust, C#, Scala
  - 10+ years of experience with database and database
    management systems
  - 12+ years of professional experience in the full lifecycle
    of system development, from conception through
    architecture, implementation, testing, deployment and
    production support
  - 10+ years of experience with public cloud platforms (AWS,
    GCP, Azure), cloud-based productivity tools, or
    virtualization technologies
  - 12+ years of experience with Networking protocols and
    integration with third party distributed systems
  - 7+ years of experience mentoring senior engineers and
    driving professional development within technical teams
  - 3+ years of experience leading cross-domain architectural
    reviews or establishing coding and design standards
  - Expertise in the strategic application of agentic AI coding
    tools to solve systemic development challenges

