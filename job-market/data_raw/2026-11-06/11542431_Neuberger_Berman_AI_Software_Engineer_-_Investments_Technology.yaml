description: |
  About Neuberger:

  Neuberger was founded in 1939 to do one thing: deliver
  compelling investment results for our clients over the long
  term. This remains our singular purpose today, driven by a
  culture rooted in deep fundamental research, the pursuit of
  investment insight and continuous innovation on behalf of
  clients, and facilitated by the free exchange of ideas
  across the organization.

  As a private, independent, employee-owned investment
  manager, Neuberger is structurally aligned with the long-
  term interests of our clients. We have no external parent or
  public shareholders to serve, nor other lines of business to
  distract us from our core mission, and with our employees
  and their families invested alongside our clients - plus
  100% of employee deferred cash compensation directly linked
  to team and firm strategies - we are truly in this together.

  From offices in 40 cities worldwide, Neuberger manages a
  range of equity, fixed income, private equity and hedge fund
  strategies on behalf of institutions, advisors and
  individual investors worldwide. With more than 700
  investment professionals and more than 2,900 employees in
  total, Neuberger has built a diverse team of individuals
  united in their commitment to client outcomes and investment
  excellence. Our culture has afforded us enviable retention
  rates among our senior investment staff and has earned us
  citations in the top-ranked firms (among those with 1,000 or
  more employees) in the Pensions & Investments “Best Places
  to Work in Money Management” survey each year since 2013.

  For more information, please visit our website at
  www.neuberger.com.

  Position Overview:

  We are seeking a talented Junior AI Software Engineer to
  join our growing Fixed Income Technology team. In this role,
  you will design, develop, and deploy AI-powered capabilities
  that drive real business impact. You will work closely with
  business stakeholders, engineering, and data engineering
  teams to build scalable, production-grade AI systems. This
  is an exciting opportunity to shape the next generation of
  intelligent products while growing your expertise in a
  collaborative and innovative environment.

  Primary Responsibilities:

  - Build and maintain end-to-end AI powered solutions covering
    data ingestion, feature engineering, model training,
    evaluation, and deployment.

  - Work on building new dashboards / integrating large language
    models (LLMs) and foundation models into product features,
    including prompt engineering, fine-tuning, MCP Servers and
    RAG architecture.

  - Write clean, well-tested, and well-documented code following
    engineering best practices.

  - Partner with the FI business users to design and build
    agentic workflows, web dashboards, backend APIs

  - Work with Application Support team to troubleshoot and
    maintain existing production applications

  - Stay current with advances in AI/ML research and evaluate
    emerging tools, frameworks, and techniques for adoption.

   Key Requirements / Qualifications: (essential unless
  otherwise stated)

  - Bachelor’s or master’s degree in computer science, Machine
    Learning, or a related quantitative field
  - 1–2 years of professional software development experience,
    ideally including building and deploying AI solutions in
    production environments.
  - Proficiency in Python and AI/agentic frameworks, FastAPI,
    Flask, Pandas, LangChain, LangGraph, MCP Servers, RAG
    systems
  - Good understanding of data structures, data pipelines, SQL
    databases – MS SQL Server / Postgres, Snowflake
  - Solid software engineering fundamentals — version control
    (Git), CI/CD, testing, and containerization (Docker)
  - Any knowledge of Fixed Income Markets or a related financial
    sector would be desirable

