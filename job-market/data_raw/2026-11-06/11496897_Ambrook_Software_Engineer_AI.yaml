description: |
  Ambrook helps American family-run businesses become more
  profitable and resilient. From volatile markets to climate
  shifts, independent operators face mounting pressure. While
  sustainable investments often yield the best long-term
  returns, they require financial clarity and capital that
  fragmented legacy systems can’t provide. We are rebuilding
  the financial infrastructure that real economy operators
  rely on. By replacing paperwork with modern tools for
  accounting, banking, and spending, Ambrook gives owners the
  data they need to prove viability to lenders and the next
  generation. We empower the stewards of land and labor to
  make confident investments in their future. We’re a Series B
  startup backed by Lachy Groom, Thrive Capital, Dylan Field,
  Thomson Reuters Ventures, Cameron Ventures, and leaders at
  Notion, Gusto, and Vercel. We’re looking for team members to
  help us untangle the intersection of American industry,
  climate, and the economy.

  The opportunity

  Ambrook is building a world-class team to empower farmers,
  ranchers, and small-business owners using modern AI tools.
  You’ll shape how we use LLMs and intelligent systems to make
  messy, high-stakes financial workflows faster, smarter, and
  more accessible for users across the country.

  We’re shipping features that lift our customers out of the
  drudgery of rote bookkeeping and that help them make smart
  financial decisions, from cashflow management, to enterprise
  P&L analysis to long term investment planning. Our goal is
  to supplement our customer’s talents and savvy with the
  intelligence of a fortune 500 finance team in the form of an
  AI CFO.

  We’re looking for someone who we can count on to:

  - Own: Development of intelligent systems and tools that use
    LLMs, other generative AI solutions and heuristics to
    streamline bookkeeping, financial workflows and deeper
    applications that truly understand the user, as well as
    the infrastructure for evaluating those systems.
  - Teach: Best practices around ML system design, evaluation,
    prompt engineering, and scalable AI infrastructure.
  - Learn: How messy real world financial data really is - from
    scanned PDFs to unformatted CSVs to text-heavy emails -
    and how to make sense of it using language models.
  - Improve: Our internal tooling and infrastructure for
    classification, tagging, summarization, and user-in-the-
    loop AI systems.

  Within 1 month you'll...

  - Build an assistant that powers a critical bookkeeping
    workflow.
  - Collaborate with operations, product and engineering to
    understand customer workflows and where AI would reduce
    user pain.
  - Review our current AI infrastructure and propose
    improvements to our evaluation infrastructure, harness
    design, shared memory, durability and similar foundational
    components.

  Within 3 months you'll...

  - Act on your proposals from month one: scaling our evaluation
    pipelines, making our harnesses more extensible, and so
    on.
  - Implement or improve systems for document extraction and
    financial transaction tagging, using both heuristics and
    model-based approaches.
  - Collaborate closely with design and product to make AI
    features feel reliable, intuitive, and helpful – not
    mysterious or brittle.

  Within 6 months you'll...

  - Own and scale the systems that form the backbone of our
    vision for an AI CFO.
  - Contribute to our long-term AI strategy: which tasks to
    automate, how to measure confidence, and when to keep a
    human in the loop.
  - Help build internal tooling for prompt iteration, embedding
    search, labeling, and retraining.
  - Share learnings in a post on Ambrook engineering blog or an
    open-source tool that helps others tackle similar messy
    real-world data problems.

  About you

  - You've built and shipped ML/AI-driven features to
    production.
  - You're excited to apply language models to real-world,
    unstructured, often ugly datasets, and turn them into
    valuable product experiences.
  - You're pragmatic about AI: you know when to use an LLM, when
    to write a regular expression, and when to ask the user.
  - You understand the value of experimentation in a rapidly
    evolving world.
  - You have experience working with LLM APIs, prompt
    engineering, embeddings, vector search, or fine-tuning.
  - Bonus: You've worked on products involving transactions,
    finance, document processing, or communications tooling.
  - Bonus: Experience with TypeScript and AI tooling — e.g.
    Vercel AI SDK, Braintrust or similar eval vendors, and
    provider APIs (Anthropic, OpenAI, Gemini, Jev).

  Our Tech Stack

  - Next.js / React application written in Typescript
  - AI SDK, Braintrust, access to whatever provider you need
  - Hosted on Google Cloud
  - Firestore & Google Cloud Storage for data storage
  - BigQuery & Data Studio for data insights

  Values

  - Real Talk – We create space for ourselves and others to be
    straightforward, vulnerable, and accountable.
  - Reach Understanding – We are driven by curiosity and empathy
    to learn about our customers, team, and world.
  - Be Proactively Resourceful – We are internally motivated and
    externally empowered to identify opportunities and solve
    problems.
  - Derisk Thoughtfully – We lean into the biggest risks we face
    as a company and put in the work to address them
    systematically.
  - Find the Positive-Sum – We believe in creating incentive
    structures that align the needs of our company, our
    customers, and our planet.
  - Ambrook is an equal opportunity employer. We are committed
    to building diversity and inclusion into our core company
    culture.

  Benefits

  - Competitive compensation
  - Health insurance
  - 401(k) with matching contribution
  - Paid parental leave
  - Flexible work hours and vacation time
  - Work-from-home/remote office stipend
  - Wellness stipend
  - Professional development stipend
