description: |
  Pyramid Global Hospitality is a leading hospitality
  management company with a portfolio of more than 200 hotels
  and resorts and over 18,000 associates across the United
  States, Caribbean, and Europe. Our platform includes
  Benchmark Resorts & Hotels, a collection of distinctive
  independent properties; Axiom Hospitality, our European
  hotel management company; and PYRAMIDWORKS, which provides
  integrated workplace and facilities services. With corporate
  offices in Boston, The Woodlands, Texas, and London, Pyramid
  combines global scale with a hands-on approach focused on
  exceptional service, operational excellence, and long-term
  partnerships.

  At Pyramid, our people are at the heart of everything we do.
  We are committed to creating an environment where associates
  are respected, supported, and empowered to grow their
  careers. Team members have the opportunity to collaborate
  directly with experienced leaders, take on meaningful
  stretch assignments, and gain exposure to a diverse
  portfolio of properties, brands, and markets. Whether you
  are beginning your hospitality career or bringing years of
  experience, you'll find opportunities to learn, develop, and
  make an impact.

  Our commitment to associates, guests, owners, and the
  communities we serve has helped make Pyramid and our
  properties among the most recognized in hospitality. From
  being named among the best places to work by respected
  publications such as USA Today, The Boston Globe, and The
  Houston Chronicle to earning top travel accolades from
  Travel + Leisure, Condé Nast Traveler, Forbes Travel Guide,
  and U.S. News & World Report, these recognitions reflect the
  culture, service excellence, and commitment to people that
  define the Pyramid experience.

  About our property:

  Pyramid Global Hospitality (“Pyramid”) is a leading hotel
  management company, operating in the US, Caribbean, and
  Western Europe. With portfolio revenues exceeding $3
  billion, Pyramid manages 230 hotels, resorts, and conference
  centers, both branded and independent. The firm maintains
  offices in Boston (Headquarters), Cincinnati, Houston, and
  London. Additional information about Pyramid can be found at
  www.pyramidglobal.com   In 2021, Pyramid and Benchmark
  Resorts and Hotels merged to add an additional 59 Managed or
  Asset Managed Resorts and over 10,000 additional team
  members. The two companies share the same company culture,
  values and philosophies.  We are growing and opportunities
  abound!    What really sets Pyramid apart from our
  competitors is our reputation as an employer. Professional
  growth is not just possible throughout the company but
  planned and encouraged. The Leadership Team at Pyramid
  consider team member development its first priority,
  understanding that success is only achieved in a workplace
  where every contributor is respected and recognized. This is
  why we deliver superior results.   There is opportunity to
  work directly with senior leaders, experience stretch
  assignments and learn hospitality management from industry
  giants. You will come to know a distinctive people centric
  culture that is at the core of all we do. The decisions we
  make and the paths we take are bound by a commitment to our
  Owners, Associates, Customers and the Communities where we
  work. We attract the most talented associates in the
  industry, and actively encourage candidates with a
  “hospitality spirit” who may be thinking about a career
  change to join our team.

  What you will have an opportunity to do:

  Overview

  We are looking for a highly motivated Full Stack AI Engineer
  focused on two things: building secure, production-grade web
  applications from end to end, and building AI-powered
  solutions on top of them. You will join a dynamic team and
  play a critical role in delivering the tools our field
  leaders, corporate executives, and property owners use to
  drive performance and make decisions. Timely, accurate, and
  predictive information is our competitive advantage, and
  this role is pivotal to our success.



  An ideal candidate combines strong technical expertise with
  a business solutions-oriented mindset. The ability to
  collaborate with technical teams and business stakeholders
  is imperative to success in this role.



  The core Full Stack AI Engineer responsibilities are two-
  fold. First, the role involves designing, building, and
  supporting full stack applications across the frontend,
  backend, and data layers. This includes secure sign-in and
  access control, reliable data integrations, and day-to-day
  operational excellence as our applications scale to support
  the company’s aggressive growth plans.



  Secondly, the Full Stack AI Engineer position involves
  developing AI-driven solutions using Agentic AI, Retrieval-
  Augmented Generation (RAG), and Large Language Models (LLMs)
  on Microsoft Foundry. The Full Stack AI Engineer is a key
  collaborator in solution development and must combine sound
  engineering and data structures with creativity and
  innovation.



  This role involves strategic design and operational
  execution. You will join a team led by the Senior Vice
  President of Analytics and play a crucial part in advancing
  our AI and data strategy and supporting the company’s ever-
  expanding appetite for information solutions.



  Essential Functions:



  The Full Stack AI Engineer responsibilities include but are
  not limited to:

  - Design, build and support secure, reliable and highly
    available full stack web applications and internal tools
    (React, Node.js, serverless APIs), turning business needs
    into working, user-friendly solutions
  - Use AI-assisted development tools (such as Claude Code) and
    AI coding agents day to day, and review and correct their
    output
  - Design and deliver AI-enabled features and AI agents using
    LLMs, Agentic AI and RAG on Microsoft Foundry, including
    tool use, guardrails and evaluation
  - Develop, deploy, and maintain machine learning models for
    predictive analytics to improve forecasting and budgeting
  - Build and maintain data pipelines, database schemas and APIs
    that feed applications and AI solutions with high-quality
    data
  - Write automated tests at several levels (unit, integration
    and browser) and ship through CI/CD pipelines
  - Resolve application and data integrity issues with measures
    to permanently address the root cause
  - Support the migration of legacy tools and systems to modern
    cloud, data, and AI technologies
  - Collaborate with company-wide stakeholders to create/improve
    effective technology
  - Monitor evolving technologies for opportunities to advance
    our practices and solutions
  - Other responsibilities as assigned

  What are we looking for?

  Qualifications

  - A Bachelor’s degree in Computer Science or Information
    Systems, and/or a Master’s degree in Artificial
    Intelligence, Data Science, Data Analytics, or a related
    field
  - 4+ years of experience building production web applications
    across frontend and backend, with strong modern
    JavaScript, React and Node.js skills
  - Hands-on experience building LLM applications and AI agents,
    including Agentic AI, RAG, prompt design, tool/function
    calling and evaluating results
  - Experience with Microsoft Foundry (Azure AI Foundry) and
    Azure OpenAI or similar LLM platforms
  - Experience developing and deploying machine learning models
    for predictive analytics
  - Data Engineering knowledge, including SQL, data modeling,
    data pipelines and Python
  - Experience in the Microsoft Azure / Microsoft Fabric
    environments
  - Experience with authentication and authorization (Microsoft
    Entra ID / OAuth 2.0) and row-level security
  - Daily use of AI-assisted development tools (such as Claude
    Code)
  - Experience with Git, pull requests, automated testing and
    CI/CD (Azure DevOps preferred)
  - Excellent communication and interpersonal skills
  - Strong problem-solving skills
  - The ability to work collaboratively as well as independently
  - A natural passion for latest technologies



  If you're a highly motivated individual with experience in
  managing data pipelines and building AI solutions, we want
  to hear from you!

