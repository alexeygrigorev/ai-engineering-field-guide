  business groups. What You'll Do: • Design, develop, and
  build scalable, high-performance applications that meet
  business requirements while emphasizing reliability,
  maintainability, security, and excellent user experience. •
  Conduct proofs of concept (POCs) and develop prototypes to
  evaluate new technologies, validate potential solutions, and
  address emerging business and technical challenges. • Lead
  with curiosity and innovation by designing and developing
  reusable components, frameworks, and modern capabilities
  that can be leveraged across applications and teams. • Stay
  current with advancements in Generative AI, LLMs, cloud
  technologies, and software engineering practices,
  identifying opportunities to improve efficiency, automation,
  and business outcomes. • Work effectively both independently
  and collaboratively, demonstrating strong ownership,
  prioritization, and problem-solving. What You'll Bring: •
  5-7 years of hands-on software development experience •
  Solid understanding of the full Software Development
  Lifecycle (SDLC) • Proficiency with both Agile and Waterfall
  methodologies • A flexible mindset-ready to work across
  different platforms and projects • Excellent written and
  verbal communication skills, with the ability to work
  effectively across all levels of the organization and across
  teams. Required Skills: • Languages/Frameworks: Python, C#,
  .NET Core, Angular, TypeScript • AI/LLM Engineering: AWS
  Bedrock, Claude, OpenAI, MCP • Cloud Platform: AWS Services
  (or Azure/GCP) • Data Engineering: Oracle, SQL Server,
  PostgreSQL • Enterprise Integrations & API Development
  Preferred Skills: • Financial Services / Investment
  Technology Domain Expertise Job Level: LEVELPF3 Pay
