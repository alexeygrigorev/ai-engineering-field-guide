title: Sales Engineer (AI)
company: Luma Health
location: USA
remote: true
work_type: FULL_TIME
description: |
  WE'RE LUMA HEALTH.

  Needing healthcare can be hard — getting care shouldn’t be.

  We built Luma Health because we are all patients. We believe
  it should be easy to see and connect with our doctor. To get
  the care we need, when we need it.

  So, we’ve created solutions to fix this problem. Our
  technology makes messaging easier, scheduling appointments
  more efficient, and it modernizes care delivery from
  beginning to end.

  Sales Engineer

  What YOU will do at Luma Health:

  - Deliver compelling live demonstrations of AI agents (voice
    and messaging) that create “aha” moments for clinical,
    operational, and IT audiences, using empathy and
    confidence to build trust throughout the deal cycle
  - Run discovery with healthcare organizations to understand
    their technical requirements and challenges, map current-
    state workflows, and connect each pain point to measurable
    value
  - Design, configure, and prototype customized AI-enabled
    workflows for specific prospects, including conversation
    flows, escalation paths, and EHR integration touchpoints
  - Persuade and present the art of possible: be the change
    agent in deals by challenging the status quo, de-
    positioning competitors, and recommending winning
    solutions
  - Build personal rapport with buyers at every level, from
    front-line staff to executives
  - Provide technical guidance to the sales team so they can
    understand and address customer needs
  - Explain integration architecture and concepts such as HL7,
    FHIR, and webhooks to both technical and non-technical
    audiences
  - Respond to RFPs and RFIs independently
  - Partner with Product Development to relay customer feedback
    and ensure seamless integration with existing healthcare
    systems
  - Work with Sales, Marketing, and Product on a cohesive go-to-
    market story for our AI offerings, and hand off clear,
    detailed workflow documentation to the Delivery team after
    a deal closes

  Who You Are:

  - 2+ years of experience as a Sales Engineer demoing AI agents
    or AI-driven workflows
  - Comfortable discussing API and integration concepts such as
    HL7, FHIR, and webhooks with both technical and non-
    technical audiences
  - Experience responding to RFPs and RFIs independently
  - Strong discovery skills with the ability to map current-
    state workflows and connect pain points to product value
  - Excellent presentation and demo delivery skills across
    clinical, operational, and IT stakeholders
  - Actively uses AI tools to drive personal productivity and
    find efficiencies in day-to-day work
  - Bachelor's degree or equivalent combination of education and
    experience
  - Previous experience in a startup or high-growth SaaS
    environment preferred
  - Familiarity with AI-powered voice and messaging products,
    workflow automation tools, and patient engagement
    platforms with the ability to demo and position these
    solutions within complex healthcare organizations is a
    plus

  Bonus:

  We Take Care of You!

  - Competitive Health Benefits: Luma Health covers 99% of the
    employee and 85% of the dependent premium costs.
  - Work Life Balance
  - Flexible Time Off
  - Wellness Programs
  - Discounted Perks
  - 401(k) and Company Equity

  Don’t meet every single requirement? At Luma Health we are
  dedicated to building an inclusive workplace so if you’re
  excited about this role but your past experience doesn’t
  align  with every qualification in the job description, we
  encourage you to apply anyways. You may be just the right
  candidate for this or other roles.

  Luma Health is proud to be an Equal Employment Opportunity
  and Affirmative Action employer. We believe in order to
  thrive, businesses need a diverse team and leadership. We
  welcome every race, religion, color, national origin, sex,
  sexual orientation, gender identity, gender expression, age,
  status as a protected veteran, status as an individual with
  a disability, genetic information, or other applicable
  legally protected characteristics. Everyone is welcome here.

  Come join us if you want to make a difference in health
  care.

  Pay Transparency Notice: Depending on your work location,
  the target annual salary for this position can range as
  detailed below. Full time offers from Luma also include
  target bonus + stock options + benefits (including medical,
  dental, and vision.)

  Base Pay Range: 120,000—140,000 USD

  Please note that you will never be asked to submit payment
  or share financial information to participate in our
  interview process. All emails from Luma Health will come
  from "@lumahealth.io" email addresses. Any emails from other
  email addresses are scams. If you suspect that you've been
  contacted by a scammer, we recommend you cease all
  communication with the scammer and contact the FBI Internet
  Crime Complaint Center. If you'd like to verify the
  legitimacy of an email you've received from Luma Health
  recruiting, forward it to careers@lumahealth.io.
