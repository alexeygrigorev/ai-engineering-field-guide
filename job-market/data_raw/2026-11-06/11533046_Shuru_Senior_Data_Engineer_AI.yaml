description: |
  Shuru is a self-managed technology team specializing in
  accelerating visions through product, technology, and AI
  leadership. With a focus on bespoke execution, we deliver
  impactful solutions that are scalable and designed for
  success. At Shuru, we deliver mobile solutions that meet and
  exceed customer expectations. Our collaborative and fast-
  paced environment encourages creativity and innovation.

  We are looking for a skilled Data Engineer to design, build,
  and maintain scalable data pipelines and cloud-based data
  solutions using Python, SQL, Snowflake, PySpark, and AWS.

  Key Responsibilities

  - Design and maintain scalable data pipelines using Python,
    SQL, Snowflake, and AWS.
  - Build data ingestion, transformation, and analytics
    solutions for large-scale datasets.
  - Work with product, business, and QA teams to deliver
    reliable data solutions.
  - Improve data processing performance, reliability, and
    overall data quality.
  - Use AI-native development practices and AI tools for coding,
    reviews, testing, documentation, and productivity.

  Requirements

  - Strong experience in Python development, particularly for
    ETL, data processing, and automation.
  - Strong expertise in SQL and Snowflake is required, including
    data modeling and performance optimization.
  - Hands-on experience with PySpark and Big Data technologies
    is required for building and processing large-scale data
    pipelines.
  - Experience with AWS services such as S3, SNS, and Glue,
    along with cloud-based data engineering solutions.
  - Experience building scalable data pipelines, integration
    frameworks, and AI-assisted development workflows is
    essential.

  Benefits

  - Work on international projects: Be part of a global team
    working with clients from across the world.
  - Regular team outings: Even with remote work, we believe in
    building strong team bonds through regular social and
    team-building events.
  - Collaborative & growth-oriented: Learn from senior
    engineers, work in a collaborative environment, and grow
    professionally with opportunities for career development.
  - Competitive Salary and Benefits
