title: SQA Engineer – Automation and AI
company: Miso Robotics
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  MISO develops technology that elevates human lives in the
  commercial kitchen.

  We’re engineering production-ready robotic systems that
  tightly integrate perception, real-time decision making, and
  electromechanical controls to automate the most dangerous,
  least desirable tasks in food preparation. That means
  building software that understands the physical world as it
  actually behaves, and hardware that can execute precisely in
  the face of chaos. Success is measured in uptime,
  throughput, and trust from our customers, not demos.

  Our flagship platform, Flippy, is already operating in high-
  volume restaurant kitchens across seven states. Zippy, our
  Kitchen Intelligence software centralizes all operational
  data in our broader ecosystem, expanding the role of AI
  enabled autonomy in real-world operations. Backed by
  industry leaders, including Ecolab (NYSE: ECL), Miso
  combines the stability of a proven commercial product with
  the technical depth and ambition of a company passionately
  innovating to solve foundational problems in robotics and
  restaurant operations.

  If you’re excited by hard constraints, real customers, and
  the challenge of making software and machines perform
  reliably where failure isn’t an option, you’ll find
  meaningful problems to work on here.

  The Role

  As an SQA Engineer – Automation & AI at Miso Robotics,
  you'll help ensure the quality and reliability of software
  powering restaurant operations, AI applications, and kitchen
  robotics. This is an early-career engineering role focused
  on building automated testing solutions and leveraging AI
  tools to improve software quality, accelerate development,
  and reduce manual effort.

  What You'll Do

  - Develop and maintain automated tests for web applications,
    APIs, backend services, and system integrations.
  - Build Python-based test automation for functional,
    integration, regression, and end-to-end testing.
  - Leverage AI coding assistants and testing tools to
    accelerate test development, expand coverage, and improve
    efficiency.
  - Diagnose software defects, analyze test results, and
    collaborate with engineering teams to identify root causes
    and validate fixes.
  - Integrate automated testing into CI/CD workflows and
    continuously improve test coverage, reliability, and
    scalability.

  Qualifications

  - 0–3 years of experience in software development, QA
    automation, or related technical work, including
    internships or academic projects.
  - Programming proficiency in Python or a similar language,
    with a strong interest in developing automated testing
    solutions.
  - Understanding of software testing fundamentals, REST APIs,
    JSON, and modern web applications.
  - Familiarity with Git, debugging, and modern software
    development practices, including AI-assisted coding tools.
  - Degree in Computer Science, Software Engineering, or a
    related discipline, or equivalent practical experience.
    Must be able to work on-site in Pasadena, CA, five days
    per week.

  Desired Multipliers

  - Experience with Python testing frameworks such as PyTest and
    browser automation tools like Playwright or Selenium.
  - Experience with AI-powered testing platforms, coding
    assistants, or autonomous AI agents.
  - Familiarity with CI/CD pipelines, cloud platforms (AWS), and
    modern web architectures.
  - Exposure to AI/ML applications, robotics software,
    microservices, or complex integrated software systems.

  Compensation $90,000–$120,000 per year + Benefits

  The stated compensation range reflects the targeted base
  salary range for candidates residing in the Los Angeles
  Metro area and does not include additional compensation or
  benefits. If your salary requirements fall outside this
  range, we still encourage you to apply.
