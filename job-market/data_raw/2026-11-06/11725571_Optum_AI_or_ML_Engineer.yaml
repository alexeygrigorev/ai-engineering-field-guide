description: |
  Requisition Number: 2373054 Optum is a global organization
  that delivers care, aided by technology to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. Primary Responsibilities:

  - Design, develop, and deploy Agentic AI and Digital Worker
    (ROVER) solutions to automate pharmacy operations and SOP-
    driven workflows
  - Build and optimize AI/ML models, RAG pipelines, workflow
    orchestration, and tool execution frameworks for scalable
    production deployment
  - Integrate AI agents with enterprise applications, APIs, and
    business systems to enable autonomous and governed task
    execution
  - Develop, test, and maintain Python-based AI services,
    microservices, and MLOps pipelines
  - Implement AI guardrails, ARS-based confidence scoring,
    human-in-the-loop reviews, and Responsible AI controls
  - Monitor solution performance, accuracy, drift, and
    operational health using observability platforms and
    analytics
  - Collaborate with business SMEs, product owners, data
    engineers, and platform teams to translate business
    requirements into AI-driven solutions
  - Support production releases, issue resolution, continuous
    improvement, and scaling of Digital Worker capabilities
    across pharmacy use cases
  - Comply with all applicable Company policies, procedures, and
    business directives, changes including those relating to
    work location, team assignments, work schedules, and
    flexible work arrangements

  Required Qualifications:

  - Master's degree in computer science, Data Science,
    Artificial Intelligence, Engineering, or a related field
  - 3+ years of experience in AI/ML engineering, software
    development, or intelligent automation
  - Hands-on experience building and deploying ML models and
    production AI applications
  - Experience with Generative AI, LLMs, RAG architectures, and
    AI agent frameworks
  - Experience implementing Responsible AI controls, model
    validation, and human-in-the-loop workflows
  - Knowledge of workflow orchestration, microservices, REST
    APIs, and automation platforms
  - Familiarity with Azure AI services, MLOps, CI/CD, and
    monitoring/observability tools
  - Solid proficiency in Python, API integration, and cloud-
    native application development
  - Demonstrated solid problem-solving, communication, and
    cross-functional collaboration skills

  Preferred Qualification:

  - Healthcare, Pharmacy, PBM, or Digital Worker automation
    experience

  At UnitedHealth Group, our mission is to help people live
  healthier lives and make the health system work better for
  everyone. We believe everyone-of every race, gender,
  sexuality, age, location and income-deserves the opportunity
  to live their healthiest life. Today, however, there are
  still far too many barriers to good health which are
  disproportionately experienced by people of color,
  historically marginalized groups and those with lower
  incomes. We are committed to mitigating our impact on the
  environment and enabling and delivering equitable care that
  addresses health disparities and improves health outcomes -
  an enterprise priority reflected in our mission.
