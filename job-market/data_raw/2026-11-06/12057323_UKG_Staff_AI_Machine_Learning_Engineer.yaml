description: |
  Why UKG:



  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.



  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you. About the Role: UKG is a
  leader in the HCM space, and is at the forefront of
  artificial intelligence innovation, dedicated to developing
  cutting-edge generative AI solutions that transform the HR /
  HCM industry and enhance user experiences. We are seeking a
  talented and motivated AI Engineers to join our dynamic team
  and contribute to the development of next-generation
  AI/GenAI based products and solutions. This role will
  provide you with the opportunity to work on cutting-edge
  SaaS technologies and impactful projects that are used by
  enterprises and users worldwide. As a Lead Software
  Engineer, you will be involved in the design, development,
  testing, deployment, and maintenance of software solutions.
  You will work in a collaborative environment, contributing
  to the technical foundation behind our flagship products and
  services. Responsibilities Lead architecture and delivery of
  cloud micro-services in Python with LangChain, LangGraph,
  ADK, MCP, A2A and web-first frameworks such as FastAPI,
  Streamlit, Gradio, FastHTML. Own GenAI initiatives end-to-
  end—data strategy, model selection or fine-tuning,
  evaluation, deployment, and continuous optimization for
  structured reasoning, autonomous planning, image/video
  generation, and real-time “live-mode” interactions. Set
  engineering standards for reliability, security,
  performance, CI/CD, and observability; enforce them through
  rigorous code reviews and mentoring. Drive cross-functional
  execution—scope epics with product, align roadmaps, and
  deliver high-value features on time while proactively
  mitigating risk. Champion production excellence—define SLOs,
  monitor telemetry, lead incident response, and run blameless
  root-cause analyses in a true DevOps model. Mentor and
  multiply talent—coach engineers, run lightning talks, and
  foster a culture of candid feedback and continuous learning.
  Document and broadcast decisions through clear design docs
  and architecture reviews that scale knowledge across the
  organization. Basic Qualifications Bachelor’s degree in CS,
  Engineering, or equivalent practical experience (Master’s
  preferred). 6+ years of professional Python development,
  including large-scale, production AI/ML systems.
  Demonstrated experience in building applications on
  foundation-model APIs and to use AI daily in your workflow
  (GitHub Copilot, Windsurf/Cursor, Claude Code, etc.). Hands-
  on cloud experience (GCP, AWS, or Azure) plus
  containerisation (Docker, Kubernetes) and modern CI/CD
  pipelines. Demonstrated leadership in setting technical
  direction and mentoring engineers. Preferred qualifications:
  Deep expertise with LangChain, LangGraph, ADK, MCP, A2A and
  multimodal model orchestration. Experience in Next-gen AI
  coding agents/IDEs such as Cursor, Windsurf, Claude Code.
  Knowledge of GCP services (Vertex AI, BigQuery, GKE,
  Kubeflow), Terraform, GitHub Actions, Docker, Kubernetes.
  Knowledge of Vector, SQL, and NoSQL data stores; streaming
  frameworks; distributed-systems concepts; advanced
  observability and SRE practices. A self-starter who devours
  research papers and turns them into production-ready
  prototypes. Energized by ambiguity and full ownership in an
  AI-first culture; you instinctively raise the bar for those
  around you. Inclusive, candid, and relentlessly customer-
  obsessed. *** Please add a link in your résumé (GitHub repo,
  blog post, Kaggle entry, etc.) that shows something you
  taught yourself in the last six months and why it excited
  you.***



