description: |
  Who We Are

  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work is faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.

  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, building things
  that last, and the belief that great work is still
  fundamentally human. Our goal isn’t to ship the next
  feature. Each and every team of Notinos is working to set
  the standard for how humans work together in the AI era.
  From building a business’s system of record to making and
  managing AI agents to automating away the busy work, we care
  deeply about giving our customers more time for their life’s
  work.

  About the Role:

  As a Developer Platform engineer, you will directly
  contribute to the foundational pieces that make Notion
  extensible and connected. You will build tools, APIs, and
  platform experiences that help customers connect Notion to
  the world — bringing their apps, data, and workflows into
  one workspace. Your work will make it easier for developers,
  admins, and builders to create reliable integrations and
  automations on top of Notion.

  You will be a key player in building the robust technical
  foundation that allows Notion to achieve the connected
  workspace vision. Your work will include both internal
  platform contributions that accelerate other Notion
  engineering teams and end-user-facing functionality that
  enables toolmaking ubiquity. You will be presented with
  challenging technical problems, as Notion’s product needs
  are complex. You’ll play a key role in identifying and
  executing against technical investments that ensure the
  long-term quality, reliability, and performance of Notion’s
  platform as we scale.

  This role can be based in either San Francisco or New York
  City. We work from our offices on Mondays, Tuesdays and
  Thursdays (our Anchor Days) because we do our best thinking
  and building together in person. We’re looking for someone
  who’s excited to work alongside the team during those days.

  What You'll Achieve:

  - You’ll work with a team of engineers and cross-functional
    partners across product, design, data science, and user
    research to define a product strategy and drive execution
    through conception, research, implementation, and
    maintenance.
  - You’ll evolve Developer Platform capabilities across APIs,
    MCP tools, and integration infrastructure that help
    customers automate workflows, customize Notion, and
    connect Notion to the tools and data they use every day.
  - You’ll contribute to the overall performance, reliability,
    and robustness of the Notion product, ensuring it scales
    elegantly across many dimensions.
  - You’ll partner with engineering leaders to identify and
    execute against high-leverage technical investments that
    ensure the long-term flexibility and sustainability of our
    core systems.

  Skills You'll Need to Bring:

  - 10+ years of experience shipping production software, with a
    strong track record of owning features end-to-end
  - Fluency with TypeScript across both backend and frontend
  - Strong product instincts: you can take a vague problem,
    propose a solid technical approach, and know when to cut
    scope
  - You don’t need to be an AI expert, but you’re curious and
    willing to adopt AI tools to work smarter and deliver
    better results

  Nice to Haves:

  - Experience building developer tools like APIs and SDKs
  - Experience driving teams toward shared goals and balancing
    business priorities with individuals’ strengths, areas of
    interest, and career development goals
  - Familiarity with AI/agent tooling, evals, or LLM-driven
    product experiences

  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in San Francisco or
  New York City, the estimated base salary range for this role
  is $272,000 – $304,000 per year.

  By clicking “Submit Application”, I understand and agree
  that Notion and its affiliates and subsidiaries will collect
  and process my information in accordance with Notion’s
  Global Recruiting Privacy Policy and NYLL 144.

  #LI-Onsite

  A Note on AI

  You don’t need deep AI expertise for every role, but we do
  expect every Notino to be intellectually curious, drawn to
  tinkering and discovery, and excited to use AI as a real
  collaborator in their work. For some roles, AI fluency is a
  core requirement — when that’s the case, we'll say so
  explicitly in the qualifications. People who thrive here
  don’t treat AI as a novelty. They use it to think better,
  and make their work easier for others to build on.

