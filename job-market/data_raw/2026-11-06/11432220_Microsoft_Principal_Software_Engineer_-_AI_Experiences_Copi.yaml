title: Principal Software Engineer - AI Experiences, Copilot Engineering
company: Microsoft
location: USA
remote: true
work_type: FULL_TIME
description: |
  Overview

  As Microsoft continues to push the boundaries of AI we are
  on the lookout for passionate individuals to work with us on
  the most interesting and challenging AI questions of our
  time. Our vision is to enable users to get more done in
  their existing workflows by maximally leveraging agentic
  workflows. It’s also inclusive: we make AI accessible to all
  — consumers, businesses, developers — so that everyone can
  realize its benefits.

  Our AI Experiences, Copilot Engineering team is at the
  forefront of redefining how AI enhance everyday computing on
  Copilot. We build the full stack from working with data and
  models to user experiences with native tools and quality
  feedback loops. We’re shipping consumer-scale services that
  are transforming how users interact with their PCs. Whether
  it’s designing intelligent prompts, engineering robust
  backends to interface with models, or developing native
  Copilot platform and UX features, this team does it all.

  As a Principal Software Engineer on the team, you will work
  at the intersection of distributed systems, AI, and agent-
  driven development to build systems that can reason, plan,
  and execute tasks—powering the next generation of AI-
  assisted and agentic computing experiences.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  AI Experiences employees who live within a 50- mile commute
  of a designated Microsoft Hub in the U.S. are expected to
  work from the office at least four days per week. This
  expectation is subject to local law and may vary by
  jurisdiction.

  Responsibilities

  - Design and develop next generation products and features for
    Copilot experiences on Windows, Mac, and mobile.
  - Design and develop secure and performant platform services
    that support Copilot experiences on Windows, Mac, and
    mobile.
  - Work collaboratively with platform, infrastructure,
    application engineers and researchers to build next
    generation AI products and services.
  - Ship high-quality, well-tested, secure, and maintainable
    code.
  - Overcome obstacles to deliver work quickly and iteratively
    to users
  - Enjoy working in a fast-paced, design-driven, product
    development cycle.
  - Embody our Culture and Values.

  Qualifications

  Required Qualifications

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Preferred Qualifications

  - Master's Degree in Computer Science or related technical
    field AND 12+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 15+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - Extensive hands-on experience using modern AI coding
    agents (e.g., Claude Code, Codex, Github Copilot, or
    similar tools), with a track record of:
  - Acting as a team expert or go-to resource for AI-
    assisted/agentic development workflows
  - Driving adoption of agentic coding tools to improve
    engineering velocity and code quality
  - Defining best practices for prompt design, tool usage, and
    human-in-the-loop systems



