description: |
  NVIDIA has continuously reinvented itself. Our invention of
  the GPU sparked the growth of the PC gaming market,
  redefined modern computer graphics, and revolutionized
  parallel computing. Today, research in artificial
  intelligence is booming worldwide, creating demand for the
  highly scalable and massively parallel computing
  capabilities in which NVIDIA GPUs excel. NVIDIA is a
  “learning machine” that constantly evolves by adapting to
  new opportunities—challenges that are difficult to solve,
  that only we can address, and that matter to the world. This
  is our life’s work: amplifying human creativity and
  intelligence. As an NVIDIAN, you’ll be immersed in a
  diverse, supportive environment where everyone is inspired
  to do their best work. Come join our diverse team and see
  how you can make a lasting impact on the world!

  NVIDIA is seeking passionate, highly motivated, and creative
  engineers to join our Physical Design AI team. In this role,
  you will combine deep physical design knowledge with modern
  AI technologies to build intelligent, scalable solutions for
  our Physical Design Implementation teams. You will work
  closely with domain experts to understand complex
  implementation challenges and develop agentic AI solutions
  that improve productivity, efficiency, and quality across
  NVIDIA product lines. This position offers the opportunity
  to make a real impact in a dynamic, technology-focused
  company whose products span consumer graphics, accelerated
  computing, self-driving cars, and the rapidly growing field
  of artificial intelligence. We have built a team of
  exceptional people across the globe whose mission is to push
  the boundaries of what is possible today and define the
  platform for the future of computing.

  What you’ll be doing:

  - Work with Physical Design Implementation teams to understand
    complex problems and build agentic AI solutions for all
    product lines.
  - Deliver efficient, token-optimized AI solutions that
    consistently produce high-quality outputs.
  - Provide continuous support, maintenance, and enhancements
    for AI solutions.
  - Benchmark solutions across various AI models to evaluate and
    improve their effectiveness.
  - Research and innovate new AI methods to address evolving
    physical design challenges.
  - Build robust regression testbenches to validate the quality,
    reliability, and performance of AI solutions.

  What we need to see:

  - 4+ years of experience in Physical Design with
    BE/BTech/MTech degree, or equivalent experience.
  - Strong understanding of the RTL-to-GDSII flow and design
    implementation in leading process technologies, including
    synthesis, place and route, clock tree synthesis, timing
    convergence, and layout closure.Good understanding of AI
    concepts such as tokens, KV cache, context windows,
    skills, agents, subagents, and hooks.
  - Hands-on experience with AI tools such as Claude, Codex, and
    Cursor. Strong knowledge and experience in standard place-
    and-route flows. Experience with Synopsys ICC2 and Cadence
    Innovus flows is preferred.
  - Good automation skills in Tcl, Python, and tool-specific
    scripting for one or more industry-leading place-and-route
    tools.
  - Ability to multitask and work effectively in a global
    environment. Excellent communication skills, strong
    motivation, and strong analytical and problem-solving
    abilities.

  Widely considered to be one of the technology world’s most
  desirable employers, NVIDIA offers highly competitive
  salaries and a comprehensive benefits package. As you plan
  your future, see what we can offer you and your family at
  NVIDIA Benefits.

