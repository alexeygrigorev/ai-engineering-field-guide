description: |
  Job Summary

  Synechron is seeking a AWS Platform Engineer with 8+ years
  of experience in AWS cloud engineering, infrastructure
  automation, DevOps, and AI platform enablement. The role
  will design, migrate, secure, and operate scalable AWS
  platforms.

  Software RequirementsRequired

  - AWS core services: EC2, Lambda, S3, EBS, VPC, Route 53,
    RDS/Aurora, DynamoDB, IAM, and CloudWatch
  - Terraform, CloudFormation, or AWS CDK
  - Python or another modern programming language
  - Docker and Kubernetes, ECS, Fargate, or EKS
  - Git and CI/CD tools such as TeamCity or GitHub Actions
  - AWS AI services, including Bedrock, SageMaker, Textract, and
    Amazon Q
  - Current AWS Associate-level or higher certification

  Preferred

  - MCP and AI agentic workflows
  - Advanced AWS certification
  - Policy-as-code and automated compliance
  - GitOps and cloud cost-optimization tools

  Overall Responsibilities

  - Design, build, and migrate workloads to AWS.
  - Develop secure and reusable infrastructure using IaC.
  - Manage AWS environments, upgrades, provisioning,
    performance, stability, security, and lifecycle
    activities.
  - Implement CI/CD, containerization, monitoring, and
    automation.
  - Enable AI platforms and APIs with security, audit, and
    operational guardrails.
  - Apply AWS Well-Architected principles.
  - Collaborate with application, architecture, security, data,
    and operations teams.
  - Troubleshoot incidents and improve platform reliability and
    cost efficiency.

  Technical Skills

  - Cloud: AWS compute, storage, networking, databases, IAM,
    monitoring, and cost management.
  - Infrastructure: Terraform, CloudFormation, AWS CDK, Docker,
    Kubernetes, ECS, Fargate, or EKS.
  - Programming: Python or equivalent scripting language.
  - DevOps: Git, CI/CD, automated testing, deployment,
    monitoring, and rollback.
  - AI/ML: Bedrock, SageMaker, Textract, Amazon Q, APIs, MCP,
    and AI guardrails.
  - Security: IAM, least privilege, encryption, secrets
    management, secure APIs, logging, and audit controls.

  Experience Requirements

  - 8+ years of experience in AWS cloud, platform engineering,
    DevOps, infrastructure, or related roles.
  - Practical experience designing, migrating, and operating AWS
    workloads.
  - Experience with IaC, CI/CD, containers, monitoring, cloud
    security, and automation.
  - Experience enabling AI capabilities on cloud platforms.
  - Enterprise-scale or regulated-environment experience is
    preferred.

  Day-to-Day Activities

  - Build and maintain AWS infrastructure and IaC modules.
  - Develop CI/CD pipelines and automate deployments.
  - Monitor platform performance, security, availability, and
    cost.
  - Support cloud services, databases, networking, and container
    platforms.
  - Integrate AI services and maintain platform guardrails.
  - Resolve incidents and document runbooks, designs, and
    procedures.
  - Participate in architecture reviews, planning meetings, and
    operational discussions.

  Qualifications

  - Bachelor’s degree in Computer Science, Engineering,
    Information Technology, or a related field.
  - Equivalent relevant experience may be considered.
  - Current AWS Associate-level or higher certification is
    required.
  - AWS Professional/Specialty, Kubernetes, DevOps, or AI
    certifications are preferred.
  - Commitment to continuous learning in AWS, AI, security, and
    platform engineering.

  Professional Competencies

  - Strong analytical and problem-solving skills.
  - Effective communication and cross-functional collaboration.
  - Ability to manage priorities, risks, and technical
    dependencies.
  - Adaptability to changing cloud and AI technologies.
  - Focus on automation, security, reliability, and continuous
    improvement.

