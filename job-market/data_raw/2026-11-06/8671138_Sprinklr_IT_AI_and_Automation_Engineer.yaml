description: |
  Sprinklr is the definitive, AI-native platform for Unified
  Customer Experience Management (Unified-CXM), empowering
  brands to deliver extraordinary experiences at scale —
  across every customer touchpoint.

  By combining human instinct with the speed and efficiency of
  AI, Sprinklr helps brands earn trust and loyalty through
  personalized, seamless, and efficient customer interactions.
  Sprinklr’s unified platform provides powerful solutions for
  every customer-facing team — spanning social media
  management, marketing, advertising, customer feedback, and
  omnichannel contact center management — enabling enterprises
  to unify data, break down silos, and act on real-time
  insights.

  Today, 1,900+ enterprises and 60% of the Fortune 100 rely on
  Sprinklr to help them deliver consistent, trusted customer
  experiences worldwide.

  Job Description

  Responsibilities -

  AI & Automation Enablement Responsibilities 

  - Design, build, and maintain AI-driven support workflows
    using Microsoft Copilot and related platforms

  - Develop and manage Copilot Studio agents integrated with
    ITSM, asset management, IT catalog, and request management
    systems

  - Build Power Automate flows and API-based automations to
    reduce repetitive Tier 1 and Tier 2 support tasks

  - Integrate internal systems via APIs and connectors to enable
    conversational IT support and self-service experiences

  - Identify high-volume ticket patterns and propose scalable
    automation solutions

  - Maintain and optimise automation scripts, workflows, and AI
    prompt structures

  - Monitor chatbot and automation performance using usage
    analytics and continuously improve effectiveness

  - Ensure governance, auditability, and security controls are
    applied to all automation implementations

  - Research emerging AI tools relevant to IT operations and
    propose pilot initiatives

  - This role is expected to spend a meaningful portion of time
    driving automation initiatives alongside core support
    responsibilities.



  Required Automation & Systems Capability 

  - 5+ years of overall software development experience within
    an enterprise environment

  - Hands-on experience building automations using Copilot
    Studio, Power Automate, Azure Foundry, or workflow
    platforms

  - Practical experience working with REST APIs, connectors, or
    system integrations including authentication concepts and
    data flows Experience

  - Experience contributing to ITSM improvements, service
    catalog automation, or self-service enablement

  - Experience with AI/ML concepts and Copilot technologies is
    preferred

  - Ability to analyse ticket trends and design scalable
    solutions that reduce repetitive manual effort

  - Proficiency in at least one programming language: C#, .NET,
    JavaScript / TypeScript, Python

  - Strong interest in AI-driven service delivery and
    demonstrated experience experimenting with or implementing
    AI tools

  Professional Attributes 

  - Self-motivated with the ability to work independently

  - Strong written and verbal communication skills with
    attention to detail

  - Able to prioritise effectively across operational support
    and project work

  - Comfortable working in a fast-changing, global environment

  - Proactive mindset with curiosity around emerging
    technologies



  Essential Technologies 

  - Microsoft 365 including Teams, SharePoint, and OneDrive

  - Microsoft Copilot Studio, Power Platform including Power
    Automate

  - ITSM platforms

  We focus on our mission: Sprinklr was founded in 2009 to
  solve a big problem: growing enterprise complexity that
  separated brands from their customers. Our vision was clear:
  to unify fragmented teams, tools and data — helping large
  organizations build deeper, more meaningful connections with
  the people they serve. Today, Sprinklr has a unified, AI-
  native platform for four product suites: Sprinklr Service,
  Sprinklr Social, Sprinklr Marketing, and Sprinklr Insights.
  Sprinklr is here to do three things:

  - Lead a new category of enterprise software that we call
    Unified-CXM.

  - Empower companies to deliver next generation, unified
    engagement journeys that reimagine the customer
    experience.
  - Create a culture of customer obsession, with trust,
    teamwork, and accountability.

  We believe in our product: Customers who value exceptional
  customer experiences have what they need on our single
  unified platform, built with an operating system approach on
  a single codebase. That means that everything — and everyone
  — can work together to service, respond, sell, and market to
  customers on the channels they prefer. While Unified
  Customer Experience Management (Unified-CXM) as a category
  is just getting started, we are well on our way to creating
  a no-compromise, unified approach to better customer
  experiences for the world’s leading enterprise brands.



