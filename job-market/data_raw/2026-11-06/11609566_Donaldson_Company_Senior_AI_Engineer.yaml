description: |
  Donaldson is committed to solving the world’s most complex
  filtration challenges. Together, we make cool things. As an
  established technology and innovation leader, we are
  continuously evolving to meet the filtration needs of our
  changing world. Join a culture of collaboration and
  innovation that matters and a chance to learn, effect
  change, and make meaningful contributions at work and in
  communities.



  About the Role: The AI Center of Excellence (AI CoE) is
  seeking a Senior AI Engineer to lead the design,
  development, and deployment of enterprise AI solutions that
  create measurable business impact across the organization.

  This is a senior individual contributor role within the AI
  Center of Excellence (AI CoE) for an experienced engineer
  who thrives in ambiguity and enjoys turning complex business
  challenges into scalable AI solutions. You will work closely
  with Principal AI Engineers, enterprise architects, business
  stakeholders, and product teams to drive AI initiatives from
  concept through production.

  As a key member of the AI CoE, you will lead end-to-end
  solution development, including architecture, development,
  integration, evaluation, deployment, governance, and
  operationalization of AI solutions. You will also help
  establish engineering best practices, reusable frameworks,
  and standards that accelerate AI adoption across the
  enterprise.

  This role is ideal for a builder who enjoys ownership,
  technical leadership, and creating innovative solutions in a
  rapidly evolving AI landscape.

  Key Responsibilities

  - Lead the end-to-end delivery of AI and Generative AI
    solutions, taking ownership from business discovery and
    solution design through deployment and operational
    support.
  - Work directly with business stakeholders to identify
    opportunities, define requirements, prioritize use cases,
    and translate business challenges into practical AI
    solutions.
  - Design scalable solution architectures leveraging LLMs, RAG,
    AI agents, enterprise knowledge sources, APIs, workflow
    automation, and cloud services.
  - Develop and deploy production-grade AI applications,
    services, and copilots using Python, Azure AI, Azure
    OpenAI, Snowflake, and related enterprise technologies.
  - Drive technical decisions across AI projects, evaluating
    architecture options, implementation approaches, trade-
    offs, risks, and long-term maintainability.
  - Establish and implement testing, evaluation, and monitoring
    practices to ensure AI solutions are accurate, reliable,
    secure, and production ready.
  - Collaborate with architects, data engineers, platform teams,
    security teams, and business partners to successfully
    integrate AI capabilities into enterprise systems and
    processes.
  - Build reusable frameworks, accelerators, templates, and
    engineering standards that improve delivery speed and
    enable scalable AI adoption across the organization.
  - Provide technical leadership through architecture reviews,
    design guidance, code reviews, technical coaching, and
    sharing best practices across the AI CoE.

  - Continuously evaluate emerging AI technologies and recommend
    innovative solutions that deliver measurable business
    value and strategic advantage

  Minimum Qualifications:

  - Master’s or Bachelor’s degree in Computer Science,
    Engineering, or a related field (or equivalent
    experience).
  - 4-6 years of relevant professional experience in AI, machine
    learning, data, or software engineering with min 1 year of
    hands-on experience designing, developing, and deploying
    AI, Machine Learning, or Generative AI solutions end-to-
    end.
  - Strong Python development skills and experience with
    software engineering principles including modular design,
    API development, testing, version control, secure coding
    practices, system integration, and maintainable
    application architecture.
  - Strong understanding of modern Gen AI architectures
    including Large Language Models (LLMs), Retrieval-
    Augmented Generation (RAG), AI agents, prompt engineering,
    evaluation frameworks, deterministic orchestration and AI
    solution architectures.
  - Hands-on experience with AI application and orchestration
    frameworks such as LangChain, LangGraph, Semantic Kernel,
    AutoGen, CrewAI, LlamaIndex, or equivalent technologies.
  - Proven ability to operate in ambiguous environments,
    independently drive technical solutions, and lead
    initiatives from concept through production deployment

  Preferred Qualifications:

  - Experience with Azure AI Foundry, Azure OpenAI, Azure AI
    Search, Microsoft Copilot Studio, Snowflake Cortex AI, or
    other enterprise AI platforms.
  - Experience designing and developing enterprise AI
    applications, copilots, intelligent assistants, automation
    solutions, or agent-based systems deployed to business
    users.
  - Experience with CI/CD, DevOps, MLOps, and LLMOps practices
    for enterprise AI solution deployment and support.
  - Experience with containerization and cloud-native
    development technologies such as Docker, Kubernetes, Azure
    Container Apps, or Azure Kubernetes Service (AKS).
  - Experience building AI-enabled applications and services
    using frameworks such as FastAPI, Flask, Streamlit, React,
    Next.js, .NET, or equivalent application development
    frameworks.
  - Demonstrated experience leading the technical delivery of
    complex software, AI, or automation projects involving
    multiple stakeholders, systems, and business functions.
  - Familiarity with enterprise governance controls for GenAI
    (privacy, safety, auditability).
  - Experience optimizing inference costs/latency and
    implementing observability for AI features.

  Professional Skills

  - Strong analytical and problem-solving abilities.
  - Excellent communication and stakeholder management skills.
  - Capacity to thrive in agile, fast-paced environments.
  - Collaborative approach and leadership potential.
  - Commitment to continuous learning and skill development.
  - Effective task prioritization and project management across
    multiple initiatives.

