description: |
  Senior Agentic AI Engineer

  Would you like to help create products to support the
  sharing of scientific knowledge?

  Do you enjoy collaborating to solve complex technical
  problems?

  This hybrid role is open to candidates based within a
  commutable distance of our Bangalore office. We value
  meaningful in-person moments to connect, collaborate, plan
  and for other key moments.



  About our Team:

  The Submission and Editorial platform is at the heart of
  Elsevier's publishing ecosystem, supporting millions of
  interactions between researchers, editors, reviewers, and
  publishers every year.

  Our team provides the Document Intelligence capabilities
  that underpin the Submission product portfolio. Using
  combination data science models and LLMs, we transform
  complex, unstructured documents into structured, trusted and
  reusable data, enabling our products and teams to understand
  submitted content and use that intelligence to create
  smarter experiences throughout the Submission and Editorial
  journey.



  About the Role:

  As a Senior Agentic AI Engineer Engineer on our team, you'll
  help build the Document Intelligence capabilities that
  enable Elsevier's Submission products to understand
  scientific content at scale. You'll work on services that
  transform complex, unstructured manuscripts into structured,
  meaningful information and knowledge through document
  transformation, metadata extraction, content enrichment, and
  entity recognition.

  You'll help turn this intelligence into capabilities that
  power smarter submission and editorial experiences, from
  automating traditionally manual processes to enabling
  content discovery and new AI-driven features across the
  Submission portfolio.

  We combine AWS, event-driven architectures, microservices,
  data science and AI/LLM capabilities to build reliable,
  secure, and highly scalable Document Intelligence services.
  You'll work at the intersection of software engineering,
  data engineering and AI, solving challenging problems around
  understanding and processing millions of research documents
  within Elsevier's publishing ecosystem.

  Responsibilities:

  - Designing, developing and deploying applications in a cloud-
    hosted distributed system to build our next-generation
    product
  - Collaborating with business stakeholders to identify
    requirements and gather feedback in a fast-moving
    environment
  - Providing input into architectural decisions to ensure
    stability and performance
  - Identifying and implementing enhancements to continually
    improve our delivery process
  - Partnering with cross-functional Agile and DevOps
    implementation teams

  Requirements:

  To be successful in this role, you will demonstrate
  proficiency in some of our requirements, with a willingness
  to learn new ones as needed.

  - Demonstrate some proficiency in most of these technologies;
    Java, Python, Spring Boot, with a willingness to learn the
    others.
  - Display some experience with version control system (i.e.
    Git)
  - Enjoy collaborating with team members to create innovative
    solutions
  - Have experience with a modern IDE (IntelliJ / VS Code) and
    proficiency in using refactoring tools
  - Be open to discussing and honing approaches for our team to
    improve our working practices
  - Have some experience with test-driven development and
    mocking libraries (Jest, Mockito)
  - Be familiar with collaborative documentation tools (Jira and
    Confluence)
  - Have some real knowledge of Agile practices and execution
    (Scrum, Kanban)
  - Some familiarity with AI coding tools (GitHub Copilot,
    Claude, Codex, Antigravity) is desirable.
  - Wanting to learn about Agentic software development
  - Wanting to learn about distributed and event-driven
    solutions using Kafka and AWS cloud services
  - Be eager to grow your skills and experience

  Work in a way that works for you: -

  We promote a healthy work/life balance across the
  organization. With an average length of service of 9 years,
  we are confident that we offer an appealing working prospect
  for our people. With numerous wellbeing initiatives, family
  leave and tuition reimbursement, we will help you meet your
  immediate responsibilities and long-term goals.

  Working flexible hours - flexing the times when you work in
  the day to help you fit everything in and work when you are
  the most productive.

