description: |
  Senior Cloud and AI Ops Engineer



  This role has been designed as ‘’Onsite’ with an expectation
  that you will primarily work from an HPE office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  As part of HPE Networking business unit, this is a great
  opportunity for someone who is looking to make a difference!
  You will be joining HPE to provide top class Cloud Services
  to meet the fast-growing business requirements of Secure
  Access Service Edge (SASE) business. The Senior Cloud
  Developer builds from the ground up to meet the needs of
  mission-critical Cloud applications and is always looking
  for innovative approaches to deliver end-to-end technical
  solutions to solve customer problems.

  We are seeking a skilled and proactive engineer with 7-10
  years of experience to join our growing team. This role is
  tailored for engineers who have a strong background in
  managing cloud-native applications at scale and are
  passionate about automation, reliability, and performance.
  You will work at the intersection of software development
  and operations, driving reliability and scalability in
  complex, distributed cloud environments.

  What you will do:

  - Lead Cloud Operations to support customer success as well as
    escalations to engineering.
  - Enable day-to-day operational support and monitoring for HPE
    Networking SASE products to ensure that Cloud services are
    highly reliable and available to customers.
  - Design, implement, and maintain scalable infrastructure
    using Infrastructure as Code (IaC) tools such as Terraform
    or CloudFormation.
  - Collaborate with development teams to improve Cloud
    applications performance and reliability from design
    through production.
  - Implement AI workflows from the data fetched from monitoring
    of various Cloud services to enhance the product's
    features.
  - Drive automation for deployment, monitoring, scaling, and
    incident response.
  - Manage and optimize Kubernetes clusters and containerized
    applications.

  What you need to bring:

  - Bachelor's or master's degree in computer science,
    engineering, information systems, or equivalent.
  - 10 years of overall experience in Cloud and AI Operations.
  - 7+ years of strong programming experience in Python is a
    must.
  - 7+ years of experience in developing Cloud native
    applications using Kubernetes, Helm, or Docker container
    environments is a must.
  - Expertise in automation and CI-CD pipeline tools like
    Terraform, Ansible, Jenkins, and/or Git is a must.
  - Expertise in monitoring tools like Grafana, Datadog, or
    Prometheus is a must.
  - Experience in developing, deploying, and maintaining
    applications for Public Cloud environments (AWS, Azure,
    GCP, etc).
  - Knowledge of networking protocols and concepts such as
    routing, TCP/IP, BGP, OSPF/ISIS, NetFlow, SNMP, and
    Internet Traffic Engineering techniques.
  - Excellent written and verbal communication skills. Ability
    to effectively communicate issue resolutions, product
    architectures, and design proposals at senior management
    levels.
  - A desire to constantly grow and learn new skills. In this
    team you will be exposed to new technologies and new
    problems. Ability to assimilate new ideas and tackle tough
    problems as they arise will be the key to success

