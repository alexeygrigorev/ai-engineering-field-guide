  out more here: https://semianalysis.com About SemiAnalysis

  SemiAnalysis is an independent research and analysis firm
  specializing in the Semiconductor and AI industries. Our in-
  depth coverage spans the entire supply chain, from
  semiconductor fabrication processes to cutting-edge AI
  Models, software, and infrastructure. We are recognized as
  the leading authority on the semiconductor supply chain,
  with the highest concentration of industry experts within
  one team, and a deep-rooted passion for delving into the
  intricacies.

  We are a global team of analysts, each with extensive
  networks across the semiconductor supply chain and AI
  ecosystem, publishing industry shaping articles while
  participating in numerous conferences annually.

  Our newsletters reach more than 200,000 subscribers
  worldwide, including senior management and c-suite leaders
  at the leading semiconductor and AI companies.

  We also offer three core products:

  - Industry Models – we develop and publish industry models on
    accelerator shipments, datacentre demand and supply, GPU
    total cost of ownership, and more. We work with
    hyperscalers, neoclouds, many of the world’s largest hedge
    funds, and government agencies.
  - Core Research – our public equity markets product, geared
    towards financial investors, distils our deep technical
    research and knowledge into key insights on technology and
    product trends.
  - Consulting and Technical Due Diligence – We conduct custom
    research and project work to guide key strategic and
    investment decisions for the largest private equity funds,
    leading venture capital firms, companies across the AI
    ecosystem, and government agencies.

  Position Overview

  We’re hiring a Software Engineer to build and support the
  dashboards that deliver our institutional models to clients.
  Our clients use these dashboards to decide what to buy, what
  to charge, and what to finance. Every dashboard must be as
  accurate and reliable as the models behind it.

  You will work directly with the analysts who build our
  models across three dashboards:

  - TCO dashboard: Presents our AI Cloud TCO Model, covering the
    cost of buying, housing, powering, and financing GPU
    clusters. It calculates cost per GPU-hour and compares it
    with rental prices across NVIDIA, AMD, Google TPU, and
    custom accelerators.
  - Tokenomics dashboard: Presents our AI Tokenomics Model,
    tracking revenue, token prices, compute spending, and
    margins at AI labs and clouds.
  - CCM dashboard: Presents our Compute Capital and Markets
    Model, tracking AI financing deals and debt, GPU rental
    prices, funding costs, and token return benchmarks across
    neoclouds, hyperscalers, and AI labs.

  This is a full-time, remote software engineering role. You
  will write code that turns our models into dashboards
  clients can trust while learning the economics of AI
  infrastructure. Our team uses AI coding agents every day,
  and we expect you to use them effectively and check their
  work.

  Responsibilities

  - Help launch the TCO dashboard, then build new views and
    features across all three dashboards.
  - Load new model releases into the dashboards and develop
    checks to identify errors before clients see them.
  - Collect and validate data, including component prices, power
    costs, GPU rental prices, and token prices, while
    maintaining clear sources.
  - Work directly with analysts to translate model outputs into
    accurate, reliable dashboards.
  - Learn the models well enough to answer client questions
    about the numbers.
  - Turn results into charts and short written explanations.
  - Contribute to newsletter articles, with opportunities for
    direct authorship.

  Requirements

  - A degree in Computer Science, Software Engineering, Computer
    Engineering, or a related field.
  - Strong Python or TypeScript skills.
  - Software engineering experience.
  - Demonstrated interest in AI hardware, datacenters, or
    technology markets through projects, coursework, or work.
  - Ability to use AI coding agents effectively and verify their
    output.
  - Strong attention to numerical accuracy.
  - Ability to learn quickly and revise work based on feedback.
  - A self-driven approach and pride in the quality of your
    work.

  Preferred Skills

  - Experience with React or Next.js.

  Growth Areas

  - Develop expertise in AI infrastructure economics, including
    GPU cluster costs, cloud pricing, token economics, and
    financing.
  - Deepen your understanding of how institutional models inform
    client decisions.
  - Build experience explaining technical and financial results
    to clients.
  - Develop research and writing skills through newsletter
    contributions, with opportunities for direct authorship.

