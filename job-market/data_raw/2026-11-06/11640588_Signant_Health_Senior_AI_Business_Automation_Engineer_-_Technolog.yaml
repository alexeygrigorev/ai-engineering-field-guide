description: |
  About Signant Health

  At Signant Health, we help bring life-changing treatments to
  patients faster. We are a global evidence generation company
  that supports clinical trials with smart technology,
  scientific expertise, and hands-on operational support — so
  better data leads to better decisions in healthcare. We
  embrace AI and advanced technologies to enhance every aspect
  of what we do, from data analysis to operational efficiency.



  Our teams work at the intersection of science, technology,
  and patient experience, delivering digital solutions powered
  by AI innovation that make clinical trials more efficient,
  more accurate, and more accessible around the world. Trusted
  by leading pharmaceutical companies and CROs, our platforms
  and services support studies across more than 90 countries
  and have contributed to hundreds of new drug approvals.



  If you are motivated by meaningful work, global impact, and
  innovation in clinical research and digital health —
  including the opportunity to work with cutting-edge AI
  technologies — you will find purpose and opportunity at
  Signant Health.



  About the Role

  Signant Health is seeking a Senior AI Business Automation
  Engineer who works in two complementary modes. In one mode,
  you embed directly with functional Subject Matter Experts —
  sitting shoulder-to-shoulder with the people doing the work,
  understanding their workflows including the workarounds and
  group knowledge that never appear in process documents, and
  then designing, prototyping, and delivering the custom
  technical solutions that transform how those teams operate.



  In the other mode, you work on a small, focused delivery
  squad — sometimes leading, sometimes contributing — tasked
  with shipping AI-driven automation into a business unit at
  pace. In both modes the discipline is the same: get close to
  the real work, find the highest-leverage process to
  reinvent, and put working code in front of real users
  quickly.



  The role lives inside IT and carries the full weight of our
  infrastructure, data, integration, automation, and
  information security standards required of a clinical-trial
  technology provider. Your measure of success is the number
  of workflows you have permanently transformed and the extent
  to which the business teams you work with start every task
  with an AI tool.



  What you will do

  - Flex between two operating modes: embed directly with a
    cohort of business SMEs to surface the highest-leverage
    workflows to reinvent with an AI-first design; and
    contribute to or lead small, focused delivery squads
    tasked with shipping AI-driven automation into a business
    unit at pace.
  - Design, prototype, and deliver working solutions — custom
    tools, AI agents, automations, and reusable skills —
    tailored to each engagement's specific workflows, using a
    cadence of regular incremental delivery against real
    workflow data.
  - Coach and partner with the business users you work
    alongside, taking them through a progressive journey: from
    awareness, to first win, to regular AI integration, to
    full workflow transformation.
  - Develop and deploy AI agents leveraging LLMs and Model
    Context Protocol (MCP) integrations, end-to-end
    automations across REST APIs, webhooks, and third-party
    SaaS, and secure data pipelines — built to enterprise
    standards.
  - Build every solution for handoff from day one — technology
    choices, documentation, observability, and runbooks
    designed so other engineers can operate and evolve the
    solution without ongoing involvement from you.
  - Recognise patterns across engagements and systematically
    scale what works — tools and transformation patterns made
    reusable for peers and documented for other engineers.
  - Translate observed business problems into technical
    solutions and share wins visibly within your cohort and
    with leadership, with ROI, effort, and risk articulated to
    make prioritisation decisions easy.
  - Participate in end-to-end testing and quality validation of
    AI, automation, and integrated solutions prior to
    production deployment.
  - Use AI development tools fluently throughout the build
    lifecycle — AI coding assistants (e.g. Claude Code,
    Cursor, GitHub Copilot), eval harnesses, golden datasets,
    regression suites, and human-in-the-loop checkpoints — to
    validate accuracy, safety, and business alignment before
    production deployment.
  - Ensure automation solutions meet enterprise standards for
    security, scalability, and maintainability, including SOC
    2 and ISO 27001 compliance requirements for automation and
    data handling.
  - Mentor both directions: upskill business users to build and
    maintain their own AI-assisted workflows, and support
    junior engineers by establishing reusable patterns,
    solution designs, and runbooks.



  Preferred Qualifications

  - Bachelor's degree in Computer Science, Information Systems,
    Engineering, or equivalent practical experience.
  - 5+ years of experience in enterprise automation, software
    development, or IT engineering.
  - Hands-on experience designing and operating workflow
    automation (self-hosted or cloud) with REST API and
    webhook integrations across enterprise SaaS platforms.
  - 2+ years of experience building with the modern AI
    development toolkit: LLM APIs (Anthropic, OpenAI, or
    equivalent), MCP servers and clients, agent frameworks, AI
    coding assistants used as a daily driver, structured
    prompt engineering, retrieval-augmented generation, and
    eval harnesses for production.
  - Proficiency in JavaScript/TypeScript and Python; experience
    with Git, CI/CD pipelines, and cloud platforms (AWS,
    Azure, or GCP).
  - Demonstrated ability to discover real workflows by working
    closely with practitioners — surfacing the workarounds,
    shared spreadsheets, and undocumented group knowledge that
    determine whether an AI solution works on real edge cases.
  - Comfortable operating in small, high-velocity delivery teams
    — able to step into either a lead or contributor role on a
    squad of 2–4 engineers and hold a clear delivery line
    under time pressure.
  - Ability to communicate technical solutions clearly to both
    engineering teams and executive stakeholders, with
    demonstrated experience authoring business cases, solution
    designs, and implementation roadmaps.



  Desired Qualifications

  - Relevant professional certifications in IT service
    management, project management, or enterprise automation
    platforms (e.g. ITIL, PMP, or platform-specific
    certifications).
  - Experience with iPaaS integration platforms (Boomi,
    MuleSoft, or Workato) connecting enterprise systems
    including ERP, HRIS, CRM, and ITSM tooling.
  - Global experience collaborating with distributed teams to
    deliver enterprise technology initiatives.
  - Experience using AI to discover and redesign workflows —
    analysing transaction histories, ticket logs, or content
    repositories with LLMs to surface bottlenecks, or building
    agentic prototypes to test a hypothesis before committing
    to a production build.



  Candidates must demonstrate depth in the track below

  Track — General Enterprise

  Essential:

  - Proven experience building and deploying enterprise platform
    extensions, custom scripting behaviours, and AI agent
    integrations in production service management and workflow
    environments.
  - Proficiency in Groovy, in addition to JavaScript/TypeScript
    and Python, for scripting in enterprise automation
    platforms.
  - Experience integrating AI/LLM APIs into production workflows
    across a broad set of enterprise SaaS platforms (Finance,
    Legal, HR, Operations, Commercial, or similar).

  Desirable:

  - Experience with platforms such as Boomi, UiPath, Salesforce,
    Snowflake, or Jira in cross-functional automation
    contexts.



  Why Signant Health?

  At Signant Health, your work has real impact. Everything we
  build, support, and deliver helps advance clinical research
  and bring new treatments to patients faster — improving
  lives around the world. Our teams combine science,
  technology, and operational expertise to solve complex
  clinical trial challenges, and every role contributes to
  that mission.



  We offer a collaborative, global environment where you can
  grow your career while working alongside experts across
  clinical, technology, data, and operations, with
  opportunities to learn, take ownership, and drive meaningful
  innovation — not just maintain the status quo.



  If you are looking for purpose-driven work, smart
  colleagues, and the opportunity to help shape the future of
  clinical research and digital health, Signant Health is the
  place to do it.

  At Signant Health, accepting difference isn't enough — we
  celebrate it, we support it, and we nurture it for the
  benefit of our team members, our clients, and our community.
