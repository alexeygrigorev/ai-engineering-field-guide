description: |
  Location Designation: Hybrid - 3 days per week  Business
  Unit Within the Tech, Data, AI, Ventures (TDAV)
  organization, our work is guided by a shared vision:
  deploying the power of technology, data, AI and ventures to
  accelerate sustainable competitive advantage for New York
  Life's businesses. We build solutions that power how we
  serve policy owners, agents, advisors and employees while
  delivering measurable business outcomes. Across technology,
  data, AI, cyber, product, digital experience, architecture
  and infrastructure, TDAV combines the scale and investment
  of an industry leader, access to leading-edge technologies
  and the opportunity to help shape how a world-class
  financial services company competes in the AI era - all
  backed by the stability and purpose of a mutual company
  built to last. Role Overview We are looking for a detail-
  oriented and initiative-taking QA Test Engineer with
  experience in test automation, AI-enabled QA practices and
  manual testing. The ideal candidate will be responsible for
  validating software applications, designing and executing
  test cases, developing, and supporting automation
  frameworks, and leveraging AI tools to improve test
  efficiency, coverage, and defect detection. What You'll Do:
  Automation Testing Responsibilities

  - Develop and maintain automated test scripts for web, API,
    and backend applications.
  - Execute automated regression suites and analyze test
    execution results.
  - Support CI/CD integration for automated test execution.
  - Improve automation framework stability and reusability.
  - Work with Selenium WebDriver, MABL, Cypress, Playwright,
    TestNG, JUnit, Rest Assured, Jenkins.

  AI QA Responsibilities

  - Utilize AI-powered testing tools to enhance test generation
    and test execution automation.
  - Analyze AI model outputs for accuracy, bias, reliability,
    and validation.
  - Participate in AI testing strategies for applications
    involving machine learning or generative AI features.
  - Evaluate opportunities to improve QA productivity using AI-
    driven solutions.

  Functional QA Responsibilities

  - Analyze business requirements, functional specifications,
    and user stories.
  - Create detailed test plans, test scenarios, and test cases.
  - Ensure traceability between requirements and evaluate
    coverage.
  - Perform functional, regression, integration, system, smoke,
    and other testing.
  - Validate APIs, UI workflows, database interactions, and
    backend processes.
  - Identify, document, track, and retest software defects using
    defect management tools.
  - Collaborate with Business Analysts, Developers, Product
    Owners, and Scrum teams.
  - Participate in Agile ceremonies including sprint planning,
    stand-ups, and retrospectives.
  - Prepare QA status reports and testing metrics.

  What You'll Bring:

  - Strong understanding of STLC and SDLC.
  - Experience in manual and automation testing.
  - Knowledge of Selenium, API testing tools, SQL, Agile, and
    CI/CD pipelines.
  - Experience with defect tracking tools such as JIRA and
    PractiTest.
  - Basic to intermediate understanding of AI-assisted testing
    concepts.
  - Strong analytical, communication, and critical thinking
    skills.

  Preferred Skills

  - Bachelor's degree in computer science, Information
    Technology, or related field.
  - Experience testing AI applications.

  Pay Transparency Salary Range: $65,000-$92,500 Overtime
  eligible: Exempt Discretionary bonus eligible: Yes Sales
