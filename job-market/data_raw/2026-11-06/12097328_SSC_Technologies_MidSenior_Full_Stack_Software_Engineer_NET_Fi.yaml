description: |
  SS&C is a leading provider of mission-critical, AI-powered
  technology and services empowering financial services and
  healthcare organizations to work smarter, faster, and
  securely. Founded in 1986, SS&C is headquartered in Windsor,
  Connecticut, and has offices worldwide. More than 23,000
  financial services and healthcare organizations, from the
  world's largest companies to small and mid-market firms,
  rely on SS&C for expertise, scale, and technology.

  Job Description

  Position Summary

  We are seeking an experienced Mid-to-Senior Full Stack
  Software Engineer to join our Trust Application Development
  team. This position will contribute to the ongoing
  development, modernization, and support of our enterprise
  Trust accounting and financial technology platform.

  The ideal candidate combines strong software engineering
  skills with an understanding of financial technology
  (FinTech), financial services, and business processes. The
  developer should be able to understand complex business
  requirements and translate them into reliable, scalable
  technical solutions while recognizing the operational and
  client impact of application changes.

  The position requires strong experience with Microsoft .NET,
  C#, and Microsoft SQL Server, along with full-stack web
  development skills using JavaScript, HTML, and related web
  technologies. Experience with C++, TypeScript, and modern
  JavaScript frameworks such as Vue.js 3 is highly desirable.

  In addition to traditional application development, we are
  looking for a developer with experience or strong practical
  knowledge in Artificial Intelligence (AI), Generative AI,
  and Large Language Model (LLM) application development. The
  engineer will help identify, design, and implement AI-
  enabled capabilities within our financial technology
  applications while working within established security, data
  privacy, and AI governance standards.

  This role requires someone who can work effectively across
  technology and business domains, collaborating with business
  analysts, product owners, QA engineers, architects,
  developers, and business stakeholders in an Agile
  development environment.

  Key Responsibilities

  - Design, develop, test, and maintain enterprise applications
    supporting our Trust accounting and financial technology
    platform.
  - Develop and enhance backend services and business logic
    using Microsoft .NET / .NET Core and C#.
  - Develop and maintain user-facing functionality using
    JavaScript, TypeScript, HTML, CSS, and modern web
    technologies.
  - Work with existing C++ components and services where
    required.
  - Participate in the continued modernization of legacy
    application components toward modern web, API,
    microservices, and service-based architectures.
  - Design, develop, and consume RESTful APIs and web services
    supporting internal applications, client applications, and
    third-party integrations.
  - Design, develop, troubleshoot, and optimize database
    solutions using Microsoft SQL Server, including complex
    SQL queries, stored procedures, database objects, and data
    access components.
  - Analyze and troubleshoot database performance issues,
    including query execution, indexing, locking, blocking,
    and transaction-related issues.
  - Develop a strong understanding of Trust accounting,
    financial services workflows, business rules, transaction
    processing, and client requirements.
  - Work closely with business analysts and stakeholders to
    translate business and financial requirements into
    effective technical solutions.
  - Understand the downstream business, financial, operational,
    and client impact of application changes.
  - Participate in the design and development of AI-enabled
    application capabilities, including Generative AI and LLM-
    based solutions.
  - Integrate applications with enterprise AI platforms, APIs,
    and AI/LLM services.
  - Apply techniques such as prompt engineering, structured LLM
    outputs, Retrieval-Augmented Generation (RAG),
    tool/function calling, and AI-assisted workflows, where
    appropriate.
  - Identify opportunities where AI and automation can improve
    business processes, operational efficiency, data analysis,
    and the client/user experience.
  - Ensure AI-enabled solutions comply with organizational
    requirements for security, privacy, protection of
    financial/client data, responsible AI, and AI governance.
  - Troubleshoot production and non-production application
    issues and perform root-cause analysis.
  - Participate in code reviews and contribute to application
    development standards and best practices.
  - Write clean, maintainable, testable, secure, and performant
    code.
  - Participate throughout the full Software Development Life
    Cycle (SDLC), including requirements analysis, technical
    design, development, testing, deployment, and production
    support.
  - Collaborate closely with developers, QA engineers, business
    analysts, product owners, and business stakeholders within
    an Agile development environment.
  - Mentor and provide technical guidance to less experienced
    developers as appropriate.

  Required Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Technology, or a related discipline, or
    equivalent professional experience.
  - Approximately 5+ years of professional software development
    experience, with consideration given to candidates with
    equivalent demonstrated experience and technical
    capability.
  - Strong development experience with Microsoft .NET / .NET
    Core and C#.
  - Strong experience with Microsoft SQL Server in enterprise
    application environments.
  - Strong SQL development skills, including experience with
    T-SQL, stored procedures, complex queries, joins, database
    objects, and data access patterns.
  - Experience troubleshooting and optimizing SQL Server
    application performance, including query performance and
    execution plans.
  - Understanding of database transactions, locking, blocking,
    concurrency, and data integrity.
  - Experience developing full-stack enterprise web
    applications.
  - Strong knowledge of JavaScript, HTML, CSS, and web
    application development.
  - Experience designing, developing, and consuming REST APIs
    and web services.
  - Strong understanding of object-oriented programming,
    software design patterns, and application architecture.
  - Experience with source control and modern software
    development practices, preferably Git/GitHub.
  - Understanding of secure application development practices,
    authentication, authorization, and protection of sensitive
    financial and client data.
  - Experience working within an Agile/Scrum development
    environment.
  - Strong analytical, troubleshooting, and problem-solving
    skills.
  - Demonstrated ability to understand complex business
    requirements, workflows, and business rules and translate
    them into technical designs and software solutions.
  - Ability to communicate effectively with both technical and
    non-technical/business stakeholders.

  Financial Technology & Business Knowledge

  The ideal candidate will have experience or demonstrated
  knowledge in one or more of the following areas:

  - Financial technology (FinTech) or enterprise financial
    applications.
  - Trust accounting, wealth management, asset management,
    banking, custody, retirement services, or related
    financial services.
  - Financial transactions, account processing, cash and asset
    movement, positions, holdings, income, fees, or other
    accounting concepts.
  - Integration between financial systems, third-party
    providers, custodians, payment platforms, or client
    applications.
  - Understanding of how technology supports business
    operations, client servicing, accounting, reporting, risk,
    and regulatory requirements.
  - Ability to analyze business processes and identify
    opportunities for technology, automation, APIs, and AI to
    improve efficiency or user experience.
  - Experience working directly with business analysts, product
    owners, operations teams, or clients to understand
    requirements and develop solutions.
  - Ability to understand not only how a system works
    technically, but why a business process exists and how
    technology changes may affect users, clients, financial
    transactions, and downstream systems.

  Direct Trust accounting experience is highly desirable but
  not required for candidates with strong financial technology
  experience and the ability to quickly learn complex
  financial and business domains.

  AI / Generative AI Experience

  Candidates should have practical experience or demonstrated
  knowledge in one or more of the following areas:

  - Developing applications using Generative AI or Large
    Language Models (LLMs).
  - Integrating .NET or enterprise applications with commercial
    or enterprise LLM platforms and APIs.
  - Prompt engineering and management of prompts within
    production applications.
  - Retrieval-Augmented Generation (RAG), embeddings, vector
    search, or enterprise knowledge retrieval.
  - LLM tool/function calling and integration with existing
    application services and APIs.
  - Developing AI agents or AI-assisted workflows.
  - Applying AI to existing business processes, applications,
    and enterprise data.
  - Evaluating and testing AI-generated responses for quality,
    accuracy, security, and reliability.
  - Understanding AI security considerations, including
    protection of confidential/client data, prompt injection
    risks, access controls, and appropriate use of enterprise
    data.
  - Familiarity with responsible AI principles and AI governance
    practices within regulated or financial-services
    environments.

  Preferred Qualifications

  - Experience with Vue.js 3 and modern component-based front-
    end application development.
  - Experience with TypeScript, preferably in conjunction with
    Vue.js 3 or another modern front-end framework.
  - Experience with Vue.js technologies and patterns such as the
    Composition API, reusable components, state management,
    and modern front-end build tooling.
  - Experience developing or maintaining applications using C++.
  - Experience with Microsoft Azure and cloud-based application
    architectures.
  - Experience with Azure API Management or similar API gateway
    technologies.
  - Experience with messaging technologies such as RabbitMQ and
    event-driven architectures.
  - Experience developing microservices or distributed
    applications.
  - Experience with OAuth, JWT, SSO, or Microsoft Entra ID.
  - Experience with CI/CD pipelines and GitHub-based development
    workflows.
  - Experience modernizing large enterprise or legacy
    applications.
  - Experience with financial services, FinTech, Trust
    accounting, wealth management, banking, custody, payments,
    or related financial technology.
  - Experience developing systems handling high-value
    transactions, sensitive financial information, personally
    identifiable information, or regulated client data.

  Core Technical Skills

  Required / Core: C#, Microsoft .NET / .NET Core, Microsoft
  SQL Server, T-SQL, JavaScript, HTML, CSS, REST APIs/Web
  Services

  Preferred / Desirable: TypeScript, Vue.js 3, C++,
  Git/GitHub, Microsoft Azure, Azure API Management, RabbitMQ,
  Microservices, CI/CD

  AI Technologies & Concepts: Generative AI, Large Language
  Models (LLMs), Prompt Engineering, RAG, Embeddings/Vector
  Search, AI Agents, Tool/Function Calling, AI APIs,
  Responsible AI, AI Security and Governance

  Desired Attributes

  The successful candidate will be a strong hands-on developer
  who combines technical depth, financial technology
  knowledge, business understanding, database expertise, and
  emerging AI capabilities.

  We are particularly interested in candidates who can bridge
  the gap between business needs and technology. The
  individual should be comfortable learning complex financial
  and Trust accounting concepts, understanding the business
  purpose behind requirements, and translating those
  requirements into secure, reliable, scalable software.

  The ideal candidate should be comfortable working across the
  application stack—from SQL Server and backend business logic
  through APIs and modern web interfaces—and understand how
  design decisions at each layer can affect application
  performance, reliability, and the overall client experience.

  The candidate will also help bridge traditional enterprise
  financial software engineering and emerging AI technologies,
  understanding that successful AI implementation requires
  more than experimentation and must integrate securely and
  reliably with existing applications, APIs, workflows,
  business rules, and financial data

  Unless explicitly requested or approached by SS&C
  Technologies, Inc. or any of its affiliated companies, the
  company will not accept unsolicited resumes from
  headhunters, recruitment agencies, or fee-based recruitment
  services.

  SS&C Technologies offers a comprehensive total rewards
  package designed to support your wellbeing, growth, and
  future. Our benefits include medical, dental, and vision
  coverage; a 401(k) plan with company match; paid time off,
  holidays, and parental leave; and professional development
  reimbursement opportunity.

  Applications will be accepted on an ongoing basis until the
  position is filled.

  SS&C Technologies is an Equal Employment Opportunity
  employer and does not discriminate against any applicant for
  employment or employee on the basis of race, color,
  religious creed, gender, age, marital status, sexual
  orientation, national origin, disability, veteran status or
  any other classification protected by applicable
  discrimination laws.
