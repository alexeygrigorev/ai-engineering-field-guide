description: |
  You’re ready to gain the skills and experience needed to
  grow within your role and advance your career — and we have
  the perfect software engineering opportunity for you

  As a Software Engineer II at JPMorganChase within the
  Corporate Technology Employee Platforms team, you are part
  of an agile team that works to enhance, design, and deliver
  the software components of the firm’s state-of-the-art
  technology products in a secure, stable, and scalable way.
  As an emerging member of a software engineering team, you
  execute software solutions through the design, development,
  and technical troubleshooting of multiple components within
  a technical product, application, or system, while gaining
  the skills and experience needed to grow within your role.


  Job Responsibilities

  - Participates in, design and develop scalable and resilient
    systems using Java to contribute to continual, iterative
    improvements for product teams
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity (e.g., code
    generation/refactoring, unit test creation,
    documentation), while validating outputs through peer
    review, automated testing, and secure coding standards
  - Creates secure and high-quality production code and
    maintains algorithms that run synchronously with
    appropriate systems
  - Produces or contributes to architecture and design artifacts
    for applications while ensuring design constraints are met
    by software code development
  - Gathers, analyzes, synthesizes, and develops visualizations
    and reporting from large, diverse data sets in service of
    continuous improvement of software applications and
    systems
  - Identifies hidden problems and patterns in data and uses
    these insights to drive improvements to coding hygiene and
    system architecture
  - Contributes to software engineering communities of practice
    and events that explore new and emerging technologies
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 2+ years applied experience
  - Hands-on experience using enterprise-authorized AI-assisted
    software development tools within the work environment
    (e.g., for coding, testing, troubleshooting, or
    documentation) with demonstrated ability to critically
    evaluate and validate AI-generated output
  - Proficient in coding in Java, SpringBoot, ReactJS languages
  - Exposure to AWS cloud technologies
  - Prompt engineering and Co-pilot knowledge
  - Understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectation
  - Understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Knowledge of software applications and technical processes
    within a technical discipline (e.g., cloud, artificial
    intelligence, etc.)

  Preferred qualifications, capabilities, and skills

  - Exposure to AI technologies
