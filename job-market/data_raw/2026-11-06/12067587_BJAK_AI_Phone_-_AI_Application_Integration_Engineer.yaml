title: AI Phone - AI Application Integration Engineer
company: BJAK
location: USA
remote: true
work_type: FULL_TIME
description: |
  About

  We are reimagining the phone. AI phones need to be
  proactive, intuitive, intelligent and low cost. This is a
  mission critical for rest of the world to adopt
  intelligence.

  There are over 5 billion people using everyday applications
  such as email, messaging, notes, tasks, and calendars, yet
  most are not AI-native. Our mission is to build proactive
  applications and devices that bring intelligence into daily
  conversations, coordination and workflows, with minimal
  prompting.

  Focus: Making applications accessible and actionable by AI
  agents, so agents can interact with applications and execute
  workflows across them.

  Responsibilities

  - Build integrations between AI agents and first-party
    applications.
  - Expose structured actions that agents can execute.
  - Implement interfaces for retrieving information from
    applications.
  - Support actions such as search, create, update, send and
    delete.
  - Build cross-application workflows.
  - Develop reusable integration interfaces and SDKs.
  - Handle authentication, authorization and permissions.
  - Investigate third-party application integration limitations.
  - Work with Android engineers on system-level application
    access.

  Requirements

  - Strong software engineering and API development experience.
  - Experience integrating multiple applications or external
    services.
  - Understanding of mobile application architecture.
  - Experience with authentication and authorization.
  - Strong debugging and integration skills.
  - Experience building reliable APIs and asynchronous
    workflows.

  Nice to have

  - Android development experience.
  - Knowledge of Android intents, IPC and accessibility
    services.
  - Experience with messaging, email, calendar or productivity
    integrations.
  - Experience building agent tools or MCP integrations.
  - Experience with application interoperability.
