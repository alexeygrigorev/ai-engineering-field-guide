description: |
  AI and Automation Developer

  Description -

  Job Summary

  - This role is responsible for developing, testing, and
    supporting AI-powered applications and automation
    solutions that improve business operations. It combines
    programming skills with practical knowledge of AI, RPA,
    cloud platforms, and application infrastructure. The role
    works with senior developers, business analysts, and
    technical teams to deliver reliable solutions.

  Responsibilities

  - Develops AI applications, intelligent agents, RPA bots, and
    automation workflows based on agreed requirements and
    designs.
  - Writes maintainable code and builds reusable components
    using established engineering standards.
  - Implements capabilities for document understanding,
    information extraction, data validation, and business rule
    processing.
  - Integrates solutions with APIs, enterprise applications,
    databases, and other data sources.
  - Implements exception handling and human review steps within
    automation workflows.
  - Supports cloud deployment, application configuration, and
    routine infrastructure troubleshooting.
  - Performs unit and integration testing, evaluates AI outputs,
    and resolves defects.
  - Uses version control, CI/CD pipelines, logging, and
    monitoring tools.
  - Investigates production issues and contributes to
    improvements in accuracy, performance, and reliability.
  - Maintains technical documentation and follows security,
    privacy, and access control requirements.

  Education & Experience Recommended

  - Degree in Computer Science, Engineering, Information
    Systems, or a related discipline, or equivalent practical
    experience.
  - Typically has 3–5 years of relevant experience in software
    development, AI, RPA, or enterprise automation.
  - Hands-on programming experience and practical exposure to AI
    or automation solutions.
  - Working experience with cloud platforms, APIs, databases,
    and application deployment.

  Preferred Certifications

  - AI, Cloud Platform, or RPA Certification
  - Programming Language Certification

  Knowledge & Skills

  - Python or Comparable Programming Languages
  - Generative AI, Large Language Models, and Agentic Workflow
    Fundamentals
  - Prompt Engineering and Retrieval-Augmented Generation
  - RPA and Workflow Automation
  - Document Processing and Information Extraction
  - APIs, SQL, and Databases
  - Microsoft Azure, Amazon Web Services, or Google Cloud
  - Git, CI/CD, and Container Fundamentals
  - Application Infrastructure, Networking, and Access Control
    Fundamentals
  - Testing, Debugging, Logging, and Monitoring
  - Security and Data Privacy Practices

  Cross-Org Skills

  - Customer Centricity
  - Analytical Thinking and Problem-Solving
  - Collaboration and Communication
  - Ownership and Accountability
  - Prioritization
  - Adaptability and Continuous Learning

  Impact & Scope

  - Delivers automation components and workflows that improve
    processing efficiency, accuracy, and user experience
    across assigned business processes.

  Complexity

  - Independently resolves routine development issues and
    moderately complex technical problems, seeking guidance
    for architectural decisions and unfamiliar scenarios..

