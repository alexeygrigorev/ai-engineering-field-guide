description: |
  Who We Are:

  WHY Brands Inc., a parent company of Munchkin, Inc., focuses
  on creating, incubating, and growing the next generation of
  consumer lifestyle brands. Founded in 1990, Munchkin is the
  leading consumer product company and most loved baby
  lifestyle brand behind the innovative gear and products for
  children, mothers, and caregivers. Munchkin has sold
  billions of dollars of products through our key retail
  partners: Target, Walmart, and Amazon and has global
  distribution in over 50 countries. With over 350+ patents
  under our belt and over 250 international product and brand
  design awards, we continue to create solutions that leave
  our customers asking, "how did I ever live without this?"
  Innovation is the core of our company DNA and has been
  driving our designs for over 30 years!  Recognized as #8 on
  America’s Most Innovative Companies list by Fortune
  Magazine, innovation is the core of our company DNA and has
  been driving our designs for 30 years!

  Independent Contractor Assignment:

  Munchkin/WHY Brands is seeking a qualified Senior AWS
  Agentic AI Developer to build secure, production-ready AI
  applications and intelligent automation systems. This is a
  hands-on contract role for someone who can turn AI concepts
  into reliable solutions integrated with enterprise data,
  APIs, business workflows, and internal tools.

  Formal years-of-experience requirements are not necessary.
  Demonstrated capability, relevant work samples, and the
  ability to deliver secure, maintainable solutions are the
  primary considerations.

  This project is expected to run for approximately 3-6
  months. The contractor will be engaged in services of an
  anticipated commitment of up to 15-20 hours per week.

  Independent Contractor Assignment Scope of Work:

  - Design and develop agentic AI solutions using AWS, including
    Amazon Bedrock
  - Build AI agents, RAG systems, APIs, automations, and
    enterprise integrations
  - Connect AI solutions with internal tools, databases, Jira,
    Workfront, Oracle, and other business systems
  - Implement security, access controls, logging, monitoring,
    testing, and governance safeguards
  - Develop clean, modular, maintainable, and production-ready
    code
  - Collaborate with AI, Security, DevOps, data, and business
    teams
  - Document architecture, deployment processes, system setup,
    and ongoing support requirements
  - Help evaluate existing prototypes and move promising
    solutions toward secure enterprise deployment
  - Other scope of work may be assigned

  Independent Contractor Requirements

  - Demonstrated ability to design and deploy secure AWS-based
    AI applications
  - Practical experience with LLMs, AI agents, tool calling,
    RAG, APIs, and workflow automation
  - Strong knowledge of AWS services, IAM, security, databases,
    and cloud deployment practices
  - Experience with Python, TypeScript, JavaScript, or similar
    development technologies
  - Ability to integrate AI systems with enterprise data and
    business workflows
  - Ability to write clean, modular, readable, and maintainable
    code
  - Strong problem-solving, communication, and documentation
    skills
  - Portfolio, GitHub profile, or examples of relevant work
    preferred

  Hourly Range: $50 to $80 (DOE)

