description: |
  We are looking for a consultant to join Devleaps and work
  together with us on our client's project. Our client, an
  international company in the retail and e-commerce industry,
  is building agentic workflows in its Finance domain. The
  first end-to-end journey is purchase-to-pay (P2P): it starts
  in Coupa and ends in the payment system, with AI agents
  handling the steps in between.

  As a Devleaps consultant, you will be part of the team
  delivering this journey, working with the client's Finance
  team alongside a Product Owner, an Engineering Manager and
  data colleagues who support you as the work develops. At the
  same time, you are part of the Devleaps team, with
  colleagues to collaborate with, learn from and share your
  experience with.

  What you will do

  - Build agents that move money, safely. Design and build
    agentic workflows across the full P2P journey, from Coupa
    through to payment.
  - Create the missing connections. Build MCP servers on top of
    Finance systems, such as Coupa and payment platforms,
    where none exist yet.
  - Plug in what's already out there. Integrate and configure
    vendor-provided MCP servers where they are available.
  - Own the integration layer. Take ownership of the MCP layer
    for the Finance domain, including reliability, security,
    versioning and documentation.
  - Go end to end. Build the supporting application components,
    from backend services and APIs to lightweight front ends
    where users need them.
  - Keep humans in the loop. Build logging, audit trails and
    human-in-the-loop steps into every workflow that touches
    financial transactions.
  - Turn process into product. Work directly with Finance users
    to translate their process steps into workflows that can
    be tested.



  - Experience: Medior level, with roughly 3 to 5 years of
    hands-on development experience.

  - Full-stack skills: A strong backend and integration focus,
    working in Python and/or TypeScript.
  - Agentic AI in practice: Hands-on experience building agentic
    or LLM-based workflows, for example tool calling,
    orchestration frameworks, and prompt and evaluation
    design.
  - MCP knowledge: Working knowledge of MCP (Model Context
    Protocol), or clear evidence that you can pick it up
    quickly.
  - Integration expertise: Experience with REST APIs,
    authentication and integrating third-party SaaS platforms.
  - Cloud and CI/CD: Comfortable working in a cloud environment
    with CI/CD pipelines.
  - The right attitude: A clear communicator who is easy to work
    with. You ask for help early and share what you learn.

  Nice to have

  - Exposure to finance or procurement processes, such as P2P,
    invoice matching and approvals.
  - Experience with Coupa or ERP integrations.
  - Experience testing and evaluating non-deterministic systems.

  Why Devleaps

  At Devleaps you are not just placed on a project. You join a
  team of engineers who work together, share knowledge and
  support each other across client assignments. You get to
  work on meaningful, technically challenging projects like
  this one, with the backing of a company that invests in your
  growth and keeps you connected to a wider engineering
  community.

  Ready to build the future of finance with AI? We'd love to
  hear from you.
