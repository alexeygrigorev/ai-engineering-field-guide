title: "Engineering Lead, Developer Productivity (AI & Agents)"
company: Humanoid
location: London, GBR
work_type: FULL_TIME
company_size: 200 Employees
description: |
  Here at Humanoid, we believe in a future where robots
  amplify human potential. That’s why we’ve set out on a
  mission to build the world’s most capable, commercially-
  scalable, and safe humanoid robots. We’re bringing that
  mission to life with HMND‑01 - our rapidly developed
  humanoid platform being deployed in real industrial
  environments - and we’re growing the team to take it even
  further.

  About the role: At Humanoid, we are working from a simple
  hypothesis that AI is rapidly transforming engineering. The
  bottlenecks are shifting from writing code to how
  efficiently AI-authored changes can be verified.

  We’re looking for an Engineering Lead to own developer
  productivity in the age of AI and agents. You’ll build the
  platform that lets our engineers move faster with coding
  agents while protecting our code, infrastructure, and
  robots. You’ll give developers and agents the environments,
  context, and tools to work effectively, and build
  verification and security into the path from task to healthy
  deployment. This means rethinking how engineering work gets
  done, not just adding agents to existing processes, and
  establishing the access controls, isolation, and monitoring
  needed to guard against mistakes, misuse, and new security
  threats.

  This is a hands-on leadership role and the keystone hire for
  a new developer productivity team. You’ll build the critical
  systems yourself, recruit and lead engineers, and work
  across Developer Tools, Security, Safety, Simulation, and
  robot software. Success means increasing engineering output
  while reducing cost and human review per accepted change,
  without increasing defects or safety risk. What you'll do:

  - Own the path from an agent task to a healthy deployed
    change, including acceptance criteria, execution,
    verification, merge, rollout, monitoring, and rollback.
  - Build secure, reproducible agent runtimes with task-scoped
    identity, short-lived credentials, bounded access, cost
    controls, and re-playable execution records. Proactively
    detect unauthorized agent activity across our compute
    clusters, whether internal or external.
  - Build the interfaces developers use to launch, monitor, and
    control agents, alongside tooling for agents to
    collaborate through shared memory, coordinated work, and
    appropriately authorized access to company resources.
  - Reduce the tokens and retries required for accepted work
    through better context assembly, model and tool routing,
    caching, task decomposition, and feedback.
  - Give agents fast access to builds, tests, simulation,
    replay, and hardware-in-the-loop, with acceptance criteria
    they cannot alter.
  - Work with engineering teams to make the codebase easier to
    navigate and verify through clear interfaces, strong
    invariants, reproducible environments, fast local checks,
    and well-documented implementation paths.
  - Recruit and lead the team while remaining hands-on. Measure
    success through cost per accepted change, human review
    time, escaped defects, and time from push to healthy on
    the robot.

  What we're looking for:

  - Experience building and operating developer tooling or
    infrastructure used across engineering teams, such as
    build systems, CI/CD, test infrastructure, deployment
    pipelines, or internal platforms.
  - Strong software engineering skills and comfort working in
    large codebases or monorepos.
  - Practical experience with Linux, containers, and cloud
    infrastructure, plus working knowledge of Kubernetes.
  - Hands-on experience using and integrating coding agents into
    real engineering workflows. You understand how context,
    tools, and evals affect reliability, latency, and cost,
    and can talk concretely about what worked and what didn’t.
  - Sound security judgment around workload isolation, identity,
    permissions, and credentials. You can design appropriate
    boundaries for agents accessing code, infrastructure, and
    company resources.
  - Experience building reliable automated tests or verification
    systems and diagnosing failures across code, tooling, and
    infrastructure. You have good judgment about what
    automated checks establish and where human review still
    matters.
  - Experience leading engineers while remaining hands-on. You
    can set technical direction, recruit a strong team, and
    turn an ambitious goal into systems that engineers use and
    trust.

  What We Offer:

  - Competitive equity: stock options with meaningful upside as
    we scale.
  - 30+ paid days off, including 23 days of annual leave, all UK
    bank holidays, and additional company closure days
    (including Christmas–New Year shutdown).
  - Private healthcare, including virtual and in-person care.
  - Pension scheme with 8% total contribution (5% employee, 3%
    employer) on full earnings.
  - Free daily breakfast, catered lunch, and snacks in-office.
  - Work at the frontier - collaborate daily with world-class
    engineers, researchers, and product experts building the
    next generation of AI and humanoid robotics.
  - Real ownership - direct access to founding leadership,
    meaningful input on product direction, and the ability to
    drive key initiatives from day one.
