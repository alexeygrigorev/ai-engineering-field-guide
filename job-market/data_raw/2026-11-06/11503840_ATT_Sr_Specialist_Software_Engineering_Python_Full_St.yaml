description: |
  Key Responsibilities

  - Design, develop, and maintain scalable backend applications
    using Python and Flask.
  - Build and consume APIs for integration with internal and
    external systems.
  - Develop cloud-native solutions on Microsoft Azure.
  - Implement data processing, transformation, and analytics
    pipelines using Polars and Python.
  - Design and optimize database schemas, queries, and stored
    procedures in PostgreSQL.
  - Utilize Redis for caching, session management, and
    performance optimization.
  - Develop front-end components using HTML, CSS, and JSON-based
    integrations.
  - Collaborate with cross-functional teams including Product
    Owners, Architects, DevOps, and Security teams.
  - Ensure applications follow secure coding standards,
    performance best practices, and cloud governance
    requirements.
  - Participate in code reviews, testing, troubleshooting, and
    production support activities.
  - Contribute to CI/CD automation and deployment processes.





  Required Technical Skills

  Must Have

  - Strong programming experience in Python
  - Hands-on experience with Flask Framework
  - Experience with Microsoft Azure services
  - Strong SQL development skills with PostgreSQL
  - Experience with Redis
  - Experience with Polars or similar data processing frameworks
    (Pandas, PySpark, etc.)
  - API development and integration
  - Proficiency in HTML, CSS, and JSON
  - Git-based source control and collaborative development
  - Hands on experience with agentic AI development with coding
    agents
  - Playwright for creating and executing automated web testing



  Good to Have

  - Azure App Services, Azure Functions, Azure Container Apps
  - Docker and Kubernetes
  - CI/CD using GitHub Actions or Azure DevOps
  - Authentication and Authorization (OAuth, SSO, JWT)
  - Monitoring and Logging solutions
  - AI/ML integration experience (Azure OpenAI, LLM-based
    applications)
  - Jira Cloud for user story management



  Experience

  8+ years of relevant experience



  Desired Competencies

  - Strong problem-solving and analytical skills
  - Ability to work in Agile/Scrum environments
  - Excellent communication and stakeholder collaboration skills
  - Self-driven with ownership mindset
  - Ability to design scalable, secure, and maintainable
    solutions









