description: |
  Job Description:

  This is a senior technical lead role that pairs deep
  platform engineering expertise with the thought leadership
  needed to bring AI into production operations. The person
  owns the build, hardening, patching, and lifecycle of the
  operating system and platform estate, and serves as the top
  escalation point for complex incidents — while
  simultaneously identifying where AI and automation can
  replace manual toil, reduce incident volume, and shorten
  recovery times. Success depends as much on change leadership
  as on engineering: shaping standards, winning stakeholder
  buy-in, and guiding 1st line operations through new AI-
  enabled ways of working without disrupting service levels.

  Key Responsibilities:

  - Platform engineering depth — packaging and hardening
    approved OS builds, management agent stacks, patch
    currency, and configuration standards across the estate
  - AI-driven operations innovation — identifying, piloting, and
    scaling AI/automation use cases for incident triage, root
    cause analysis, runbook execution, and predictive
    monitoring
  - Thought leadership and evangelism — articulating an AI-for-
    operations vision, authoring white papers and R&D
    positions, staying ahead of emerging tooling
  - Change management and adoption — driving organizational
    uptake of new practices, coaching 1st line teams, managing
    risk and resistance while protecting SLAs
  - Incident, problem, and change discipline — major incident
    leadership, RCA, and rigorous change control in a
    regulated production environment
  - Service improvement measurement — instrumenting and
    evidencing reductions in incident volume and MTTR from
    process redesign and automation
  - Solution design and implementation planning — translating
    requirements into physical builds, costed designs, and
    multi-workstream delivery plans
  - Automation and infrastructure-as-code fluency — scripting,
    configuration management, and pipeline-driven platform
    delivery
  - Standards, compliance, and documentation — run books,
    technical policies, and AI governance/guardrails to
    document-control standards
  - Cross-functional influence — partnering with architecture,
    security, development, vendors, and the business to land
    change.

  Required Qualifications:

  - Provides a high level of technical and subject matter
    expertise in one or more technologies and serves as a
    point of escalation for technical issues related to
    specialty.
  - Produces, delivers, and maintains appropriate documentation
    for systems in accordance document control standards and
    procedures.
  - Provide input to records, quality systems and management
    reports as required
  - Contributes to the definition and implementation of improved
    operability on new and current systems.
  - Uses innovative methods including the redesign of process
    and providing technical solutions to reduce the volume and
    mean time to recover incidents in assigned business unit.
  - Identifies risks & issues and takes ownership to deliver
    appropriate resolutions.
  - Provides technical expertise for root cause analysis and
    problem management.
  - Provides detailed implementation/project plans across
    multiple, complex work streams according to agreed
    standards and ensures project processes and timelines are
    understood and followed.
  - Works and cooperates with internal and external groups when
    required in order to fully support environments and
    maintain service.
  - Adheres to change management procedures in defining,
    planning and implementing change in such a way that
    ensures appropriate coordination with other teams,
    minimizes service disruption, and ensures adherence to
    Service Level Agreements.
  - Improves change management processes and procedures to
    ensure the most efficient processing of change within
    appropriate service risk constraints.
  - Provides specialist support during complex and/or major
    incidents.
  - May be asked to lead recovery efforts during major incidents
    within business unit.
  - Deputize for the team manager as required.
  - Contributes to or author technical documentation such
    complex changes instructions.
  - Reviews, and updates as appropriate, operations procedures,
    standards, and technical policies.
  - May be asked to assist with production of white papers on
    technical R&D projects
  - Collaborates with business, third party vendors, developers,
    application support and technical operations groups to
    determine appropriate hardware/software needed and to
    resolve any issues impacting the application processes.
  - Stays abreast of recent developments in related technical
    community, including new technology and business news that
    may impact vendors’ ability to provide service.
  - Responsible to seek out all information and to fully
    understand all aspects of each device’s technology
    configuration and uses all approved engineering tools
    available to implement conforming change.
  - Leads the analysis and design of complex solutions and
    requirements definition, including translating technical
    and business requirements into physical installations,
    costing design elements, and obtaining agreement to
    proposed solutions.
  - Reviews and coordinates the implementation of proposed
    modifications, and changes to the production environment.
  - Provides direction into standards and procedures for
    monitoring, capacity planning, tuning, maintenance,
    performance optimization, backups and recovery; ensures
    infrastructure will meet capacity requirements to deliver
    projects on time.

  Preferred Qualifications:

  - Provides direction for: proactive health and performance
    monitoring of databases, indexes and logs, and
    troubleshooting of reported issues.
  - Reviews implemented scripts, stored procedures, and reports
    generated by automated database maintenance scripts.
  - Participates in the technical design process as it relates
    to database implementations, reviews technical documents,
    and communicates any risks or issues using the appropriate
    escalation procedures.
  - Provides directions to Technical Recovery plans (Database
    Standby and Replication, Backup and Recovery).
  - Platform Engineer:
  - Packages company approved hardened versions of targeted
    operating systems.
  - Ensures stack of agents for management systems are properly
    installed and connected.
  - Maintains patch levels in accordance with change management
    and security standards.
  - Storage Engineer:
  - Provides leadership for storage-related projects, including
    switch installations, disk consolidations, disk
    assignments, replication, and more.
  - Works closely with architecture teams to set, communicate,
    and maintain storage standards.
  - Network Engineer:
  - Reviews the network infrastructure documentation/ run book
    for standards adherence.
  - Complies with all routing and rules sets, sequences,
    defaults, and standards.
  - Documents and maintains all applicable configuration
    standards.
  - Assures all NIC and port speeds are appropriately locked
    down.
  - Application Engineer:
  - Fully familiarizes self with all aspects of the developed
    code.
  - Recognizes design problems and errors and takes corrective
    action from a design perspective on the object code
    Environment. Interfaces with development teams on system
    design enhancements and the elimination of intermittent
    hardware/software problems.

  #LI-VGA1

  What’s in it For You?

  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.

  About Us

  Thomson Reuters informs the way forward by bringing together
  the trusted content and technology that people and
  organizations need to make the right decisions. We serve
  professionals across legal, tax, accounting, compliance,
  government, and media. Our products combine highly
  specialized software and insights to empower professionals
  with the data, intelligence, and solutions needed to make
  informed decisions, and to help institutions in their
  pursuit of justice, truth, and transparency. Reuters, part
  of Thomson Reuters, is a world leading provider of trusted
  journalism and news.

  We are powered by the talents of 26,000 employees across
  more than 70 countries, where everyone has a chance to
  contribute and grow professionally in flexible work
  environments. At a time when objectivity, accuracy,
  fairness, and transparency are under attack, we consider it
  our duty to pursue them. Sound exciting? Join us and help
  shape the industries that move society forward.

  As a global business, we rely on the unique backgrounds,
  perspectives, and experiences of all employees to deliver on
  our business goals. To ensure we can do that, we seek
  talented, qualified employees in all our operations around
  the world regardless of race, color, sex/gender, including
  pregnancy, gender identity and expression, national origin,
  religion, sexual orientation, disability, age, marital
  status, citizen status, veteran status, or any other
  protected classification under applicable law. Thomson
  Reuters is proud to be an Equal Employment Opportunity
  Employer providing a drug-free workplace.

  We also make reasonable accommodations for qualified
  individuals with disabilities and for sincerely held
  religious beliefs in accordance with applicable law. More
  information on requesting an accommodation here.

