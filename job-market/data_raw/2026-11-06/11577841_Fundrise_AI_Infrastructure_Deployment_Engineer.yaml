description: |
  Fundrise is a financial technology company on a mission to
  build a better financial system for the individual. With
  more than 2 million users and over $3 billion in assets
  under management, we are the largest direct-to-investor
  alternative asset platform in the United States, making
  institutional-quality real estate, private credit, and
  venture capital investments accessible to anyone. Through
  the software we build, we are democratizing the private
  investment industry. We continue to push into new territory:
  our Innovation Fund (VCX) recently listed on the NYSE as one
  of the first public venture capital funds, and our AI
  subsidiary, RealAI, is bringing institutional-grade real
  estate intelligence to everyday investors and professionals.
  Fundrise has been recognized by CNBC's World's Top Fintech
  Companies (2024, 2025) and the Inc. 5000 list of fastest-
  growing private companies for three consecutive years
  (2023-2025).



  Fundrise is building a distributed compute infrastructure
  platform across industrial, commercial, and build-to-rent
  properties. We are hiring an electrical engineer to evaluate
  sites, define electrical infrastructure upgrades, and lead
  deployment of modular GPU-compute nodes from diligence
  through commissioning. You will be a field-oriented
  technical owner. You determine whether a property has viable
  power, equipment, fiber, access, and permitting conditions,
  then coordinate the utility, electrical contractors,
  engineering consultants, network providers, equipment
  vendors, and property teams needed to deliver the
  installation safely and reliably.



  While this is a remote position, frequent travel to
  properties across the United States is required.

