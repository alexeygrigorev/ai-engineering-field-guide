description: |
  Title: Staff Software Engineer - AI

  Location: India, Remote



  EGNYTE YOUR CAREER. SPARK YOUR PASSION.

  Egnyte is a place where we spark opportunities for amazing
  people. We believe that every role has meaning, and every
  Egnyter should be respected. With 22,000+ customers
  worldwide and growing, you can make an impact by protecting
  their valuable data. When joining Egnyte, you’re not just
  landing a new career, you become part of a team of Egnyters
  that are doers, thinkers, and collaborators who embrace and
  live by our values:

    Invested Relationships

    Fiscal Prudence

    Candid Conversations



  ABOUT EGNYTE

  Egnyte is the secure multi-cloud platform for content
  security and governance that enables organizations to better
  protect and collaborate on their most valuable content.
  Established in 2008, Egnyte has democratized cloud content
  security for more than 22,000 organizations, helping
  customers improve data security, maintain compliance,
  prevent and detect ransomware threats, and boost employee
  productivity on any app, any cloud, anywhere. For more
  information, visit www.egnyte.com.

  Our team consistently delivers valuable features with high
  efficiency and quality.





  WHAT YOU’LL DO:

  - Design and develop highly scalable and resilient cloud
    architecture that seamlessly integrates with on-premises
    systems
  - Drive the team’s goals and technical direction to find and
    pursue technical opportunities that make Egnyte’s cloud
    platform more efficient
  - Effectively communicate complex design and architecture
    details
  - Understand company and industry-wide trends to help develop
    new technologies
  - Conceptualize, develop, and implement changes that prevent
    key systems from becoming unreliable, under-utilized, or
    unsupported
  - Own all aspects of critical software projects from design to
    implementation, QA, deployment, and monitoring



  YOUR QUALIFICATIONS:

  - BE, ME, or related technical field, or equivalent practical
    experience
  - 6-8 years of professional experience in engineering with a
    history of technical innovation
  - Experience in providing technical leadership to engineers



  BENEFITS:

  - Competitive salaries
  - Medical insurance and healthcare benefits for you and your
    family
  - Flexible hours and PTO
  - Gym reimbursement
  - Childcare reimbursement
  - Group term life insurance



  Equal Employment Opportunity

  At Egnyte, we celebrate our unique differences and thrive on
  our diversity for our employees, our products, our
  customers, our investors, and our communities. Our global
  Egnyte Employee Communities (EECs) support representation
  and inclusion across our diverse workplace. Egnyters are
  encouraged to bring their whole selves to work and to
  appreciate the many differences that collectively make
  Egnyte a higher-performing company and a great place to be.
  Any employees with questions or concerns about equal
  employment opportunities in the workplace are encouraged to
  bring these issues to the attention of hr@egnyte.com. Egnyte
  will not allow any form of retaliation against employees who
  raise issues of equal employment opportunity. If employees
  feel they have been subjected to any such retaliation, they
  should contact hr@egnyte.com. To ensure the workplace is
  free of artificial barriers, violation of this policy
  including any improper retaliatory conduct will lead to
  discipline, up to and including discharge. All employees
  must cooperate with all investigations conducted pursuant to
  this policy.
