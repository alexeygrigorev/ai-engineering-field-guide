description: |
  About Us

  Our leading SaaS-based Global Employment Platform™ enables
  clients to expand into over 180 countries quickly and
  efficiently, without the complexities of establishing local
  entities. At G-P, we’re dedicated to breaking down barriers
  to global business and creating opportunities for everyone,
  everywhere.

  Our diverse, remote-first teams are essential to our
  success. We empower our Dream Team members with flexibility
  and resources, fostering an environment where innovation
  thrives and every contribution is valued and celebrated.

  The work you do here will positively impact lives around the
  world. We stand by our promise: Opportunity Made Possible.
  In addition to competitive compensation and benefits, we
  invite you to join us in expanding your skills and helping
  to reshape the future of work.

  At G-P, we assist organizations in building exceptional
  global teams in days, not months—streamlining the hiring,
  onboarding, and management process to unlock growth
  potential for all.

  About the Company

  At G-P, our mission is to break down barriers to global
  business, enabling opportunities for everyone, everywhere.
  With remote-first and diverse teams all around the world,
  our people are key to achieving this mission. That’s why we
  trust our Dream Team members with the flexibility and
  autonomy to do their best and most innovative work,
  encourage and support their personal growth and career
  development, and believe in recognition for a job well done.

  Our industry-leading SaaS-based Global Employment Platform™
  enables our customers to expand and grow into 180+
  countries, creating more opportunities for global success –
  without requiring entity or subsidiary setup. The technical
  opportunities you’ll experience here have a positive impact
  on people and their work/life possibilities around the
  world. Beyond the power of our platform, we never forget
  that behind every hire is a human being. And that brings us
  to you.

  If you have a passion for automation, are a deep innovator,
  and want to solve complex problems that lead to a world of
  positive results, consider G-P. Here, your knowledge and
  experience will be crucial to helping design and develop
  high-performing cloud-based software products using
  traditional Agile methodologies and modern frameworks.

  Beyond a competitive compensation and benefits package, what
  we offer to all employees along the way is the clear and
  simple promise of Opportunity Made Possible. Come expand
  your skills in new ways and experience the thrill of your
  best innovations becoming reality.

  What you will do:

  - Use an AI native / AI first approach through the SDLC.
  - Iteratively turn ideas into prototypes and into production-
    grade code.
  - Design and develop our best-in-class cloud platform, working
    on all parts of the G-P ecosystem and building frameworks
    and services to build the platform.
  - Develop solutions that fit a cloud-managed and serverless-
    first platform ecosystem
  - Build quick prototypes to refine concepts, then turn them
    into real production-quality features
  - Advocate and evangelize modern agile methodologies and best
    practices such as the Well Architected Framework
  - Advocate and evangelize quality and scalability mindset and
    building software with scale and speed
  - Diagnose and fix issues reported by internal teams and
    customers
  - Develop and promote a full spectrum of test suites and
    quality mindset (unit, contract, integration, etc)
  - Support and develop software engineers by providing advice,
    coaching and educational opportunities

  What we are looking for:

  - 8+ years of experience in developing highly scalable
    enterprise level services, platforms or products.
  - Extensive experience in building large scale distributed
    enterprise applications in geographically distributed
    teams
  - Deep knowledge of backend stack with knowledge in most or
    all of the following: Node.js,Java, Python, Redis, Golang
  - Knowledge of and experience choosing between SQL and NoSQL
    database technologies such as MySQL/PostgreSQL and
    MongoDB/DynamoDB
  - Knowledge of modern cloud architectures and technologies;
    experience with AWS is a plus
  - Excellent communication skills and experience documenting
    and delivering technical concepts to both technical and
    non-technical audiences
  - Experience in a startup or high-growth environment and
    ability to hustle is desirable
  - Hands-on experience in any of the following areas a plus:

  - Data modeling, data architecture, and data governance
  - Integrating CRM systems such as Salesforce with internal
    systems
  - Integrating 3rd party systems with internal and external
    workflows
  - Business workflow orchestration / choreography patterns
  - Prior hands-on experience with AI in production environments
    will be strongly preferred

  Individuals with disabilities are encouraged to apply for
  these positions.

  #LI-Remote

  Our ranges are established using objective market
  benchmarking data for this level of work. Final placement
  within the range is determined by gender-neutral criteria,
  including the candidate's relevant skills, experience, and
  specific qualifications for the role.

  Actual compensation for this position may vary and will
  depend on multiple factors such as relevant qualifications,
  experience, education, and geographic location. For Full-
  Time Regular Employees, this position is also eligible for
  additional compensation as follows:

  - Sales Roles: This position is eligible for a commission
    structure in addition to base salary.
  - Non-Sales Roles: This position is eligible for an annual
    bonus which is paid dependent on various factors,
    including and without limitation, individual and company
    performance in addition to base salary.

  Benefits

  G-P values its employees and offers excellent benefits and
  perks including generous paid parental leave, flexible time
  off, spending accounts, medical insurance, dental insurance,
  vision insurance, sabbatical after 5 years and more.



