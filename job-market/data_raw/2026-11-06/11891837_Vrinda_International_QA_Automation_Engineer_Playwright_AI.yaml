  QA Automation Engineer – Playwright & AI

  Summary

  We are seeking a highly skilled QA Automation Engineer
  specializing in Playwright and AI technologies to join our
  IT Services team. In this pivotal role, you will be
  responsible for designing and implementing robust automated
  testing frameworks that leverage modern tools like
  Playwright and Selenium, alongside advanced AI/LLM testing
  methodologies. The position demands a professional who can
  seamlessly integrate SAP BTP solutions into the testing
  lifecycle, ensuring the delivery of high-quality software
  through rigorous functional, regression, and API testing
  strategies. Your expertise will be instrumental in driving
  test efficiency, minimizing defects, and enhancing the
  overall reliability of our digital products.

  Responsibilities

  - Architect and develop comprehensive automation test suites
    utilizing Playwright and Selenium to cover functional and
    regression scenarios.
  - Design, execute, and manage test cases within SAP Business
    Technology Platform (BTP) environments to validate
    business logic and system integration.
  - Conduct thorough API testing to ensure data integrity and
    seamless communication between services.
  - Leverage AI and Large Language Model (LLM) capabilities to
    optimize test generation, analysis, and execution
    processes.
  - Identify, document, and track defects throughout the
    development lifecycle, ensuring timely resolution and
    high-quality releases.
  - Perform manual testing activities where automation is not
    feasible, supplementing automated efforts with deep-dive
    exploratory testing.
  - Collaborate with cross-functional teams to define test
    strategies, review requirements, and ensure alignment with
    project goals.

  Requirements

  Requirements:

  - Possess 5 to 7 years of hands-on experience in software
    quality assurance within the IT Services sector.
  - Demonstrate proven expertise in test automation using
    Selenium and Playwright frameworks.
  - Show strong proficiency in SAP BTP (Business Technology
    Platform) for application testing and integration.
  - Exhibit solid skills in API testing, test case design,
    execution, and defect reporting/tracking systems.
  - Have a deep understanding of functional and regression
    testing methodologies, including both manual and automated
    approaches.
  - Display familiarity with AI/LLM testing concepts and their
    application in modern software development cycles.
