description: |
  We require people to be on-site, 4 days/week at our NYC or
  Denver office and are unable to offer relocation support. LG
  Ad Solutions

  LG Ad Solutions is a global leader in connected TV (CTV) and
  cross-screen advertising. We pride ourselves on delivering
  state-of-the-art advertising solutions that integrate
  seamlessly with today's ever-evolving digital media
  landscape.



  The Opportunity:

  We are seeking a talented and motivated Senior Software
  Engineer 2 (Full Stack) to join our Measurement and
  Reporting team. We enable our clients to visualize their
  impact across different verticals and enable our sales and
  operations teams to identify the shortcomings during the
  campaign execution.

  You will work on both frontend and backend development,
  building and maintaining the web applications and services
  that power our reporting platform. You will be responsible
  for developing user interfaces, APIs, backend services and
  Agentic solutions, collaborating with cross-functional
  teams, and contributing to all stages of the development
  lifecycle. If you're passionate about building efficient,
  scalable, and user-friendly applications at scale in the
  adtech space, we want to hear from you!

  Responsibilities:

  - Design, develop, deploy and maintain scalable web
    applications across both frontend and backend. This
    includes developing UI features, APIs, and database
    integrations.
  - Write clean, maintainable, and efficient code while adhering
    to best practices across the full technology stack.
  - Develop responsive and intuitive user interfaces while
    simultaneously building robust backend services and APIs.
  - Design and implement backend services, RESTful APIs, and
    microservices architectures to support application
    functionality and business logic.
  - Manage databases and ensure data integrity through effective
    backend development. Optimize database queries and design
    efficient data models.
  - Work on micro services which are integrated with the UI
    application, ensuring seamless communication between
    frontend and backend systems.
  - Identify and address performance bottlenecks. Optimize
    system performance, scalability, and reliability across
    both client and server-side components.
  - Troubleshoot and resolve complex technical issues across
    both frontend and backend systems.
  - Conduct code reviews, providing constructive feedback to
    ensure high code quality and adherence to best practices.
  - Provide technical mentorship to junior engineers and foster
    a culture of innovation.

  Requirements:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field.
  - 5+ years of experience in full stack software development,
    with demonstrated ability to work effectively on both
    frontend and backend technologies.
  - Proficiency in ReactJS/AngularJS/VueJS/TypeScript and NodeJS
    programming languages.
  - Expertise in working with relational and NoSQL databases
    (e.g., MySQL, MongoDB, Redis). Experience with database
    design and optimization.
  - Proficiency in writing and maintaining unit tests,
    integration tests, and end-to-end tests.
  - Demonstrated ability to stay current with AI tools and
    emerging technologies, with a quick learning aptitude for
    adopting new tools and frameworks.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and collaboration abilities.
  - Ability to coordinate and work with contractors/consultants
    and owning the work done by contractors.

  Preferred:

  - Familiarity with the AdTech space.
  - Familiarity with Scala/PySpark and Python.
  - Experience with CI/CD pipelines.
  - Familiarity with containerization (Docker) and orchestration
    (Kubernetes).
  - Familiarity with Databricks.
  - Familiarity with GenAI and AI Agents.

  LG Ad Solutions provides equal work opportunities to all
  team members and applicants, and it prohibits discrimination
  and harassment of any type on the basis of race, color,
  ethnicity, caste, religion, age, sex (including pregnancy),
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by our
  policies or federal, state, or local laws.

  We want to ensure that our hiring process is accessible. If
  you need reasonable accommodation for any part of the
  application process because of a medical condition or
  disability, please send an email to careers@lgads.tv to let
  us know the nature of your request.

  Application Deadline: December 31, 2026

  Compensation & Benefits

  - Tier 1* (San Francisco Bay Area, New York City Tri-State
    Area, Los Angeles Metro Area, and Seattle Metro
    Area)$185,000 - $264,000/year
  - Tier 2* (all other U.S. Locations outside of Tier 1)
    $162,000 – $231,000/yr
  - Offers Bonus
  - Benefits & Perks: 100% employer-paid medical, dental, and
    vision coverage for employees and eligible dependents.
    Company-paid life and AD&D, STD and LTD insurance, plus
    optional supplemental coverage. 401(k) with company match.
    Flexible Time Off (FTO). Paid parental leave.

  *Certain markets, including the San Francisco Bay Area, New
  York City Tri-State Area, Los Angeles Metro Area, and
  Seattle Metro Area, are aligned to Tier 1 compensation
  bands. All other U.S. locations -including Denver - are
  aligned to Tier 2 compensation bands. The compensation
  offered will take into account internal equity and may vary
  depending on the candidate's geographic region, job-related
  knowledge, skills, and experience.
