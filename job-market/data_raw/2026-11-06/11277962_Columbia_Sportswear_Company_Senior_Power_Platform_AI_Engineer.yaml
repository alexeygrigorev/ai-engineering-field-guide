description: |
  Columbia Sportswear Company connects active people with
  their passions and is a global multi-brand leader in
  outdoor, active, and lifestyle products, including apparel,
  footwear, accessories, and equipment. Founded in 1938 in
  Portland, Oregon, the company's brands are sold in 122
  countries. Alongside its flagship Columbia brand, the
  company owns Mountain Hardwear, SOREL, and prAna — together
  spanning hiking, trail running, snow sports, fishing,
  hunting, mountaineering, yoga, climbing, and everyday
  outdoor lifestyle apparel and footwear. With a strong global
  presence across wholesale, direct-to-consumer, and
  e-commerce channels, Columbia Sportswear Company India
  Sourcing Pvt Ltd plays a key role in supporting the
  organization's sourcing and supply chain operations
  worldwide.

  Senior Power Platform & AI Engineer

  We believe our people are our greatest asset and it is our
  goal to ignite the human potential for growth. We want you
  to grow and develop with us and recognize every career
  adventure is different, so we encourage you to build your
  own path

  OUTGROWN YOUR OWN BACKYARD? COME PLAY IN OURS.

  At Columbia, we’re as passionate about the outdoors as you
  are. And while our gear is available worldwide, we’re proud
  to be based in the Pacific Northwest, where natural wonders
  are our playground.

  Every product we make and every task we undertake is
  inspired by the famous words of our founder Gert Boyle:
  “It’s perfect. Now make it better.” As pioneers of
  relentless improvement, we are constantly evolving.

  We believe the outdoors is ours to protect and strive to
  keep our planet healthy. We believe in empowering people to
  experience the outdoors to the fullest.

  And we believe in you.

  ABOUT THE POSITION

  Although we're an apparel and footwear focused company,
  technology is central to everything we do.  Columbia
  Sportswear’s Intelligent Process Automation team enables
  business teams to increase efficiency and effectiveness
  while accelerating growth through engagement in high-value
  activities & innovation.

  We are seeking a Senior Power Platform & AI Engineer with 5+
  years of hands-on experience designing and delivering
  enterprise automation, AI, and low-code solutions. This role
  will primarily focus on Microsoft Copilot Studio, Power
  Platform, and Generative AI, while also leveraging RPA and
  orchestration technologies to automate end-to-end business
  processes across enterprise systems.

  The ideal candidate will be a technical leader capable of
  building intelligent copilots, agentic AI solutions,
  workflow automation, and scalable integrations that drive
  operational efficiency and business transformation.

  HOW YOU’LL MAKE A DIFFERENCE

  AI Agent Development:

  - Design, develop, and deploy enterprise AI agents using
    Microsoft Copilot Studio.
  - Build conversational AI experiences that integrate with
    enterprise applications, knowledge sources, and business
    processes.
  - Implement prompt engineering, grounding, retrieval-augmented
    generation (RAG), and response validation strategies.
  - Optimize AI performance, accuracy, security, and user
    adoption.

  Power Platform Development

  - Develop scalable solutions using Power Apps, Power Automate,
    Dataverse, and Power Fx.
  - Build complex automation workflows and AI-powered business
    processes.
  - Create reusable components, custom connectors, and
    integration frameworks.
  - Lead solution design and technical implementation across the
    Power Platform ecosystem.

  RPA & Intelligent Orchestration

  - Design and support enterprise automation solutions using RPA
    and orchestration platforms such as Microsoft Power
    Automate Desktop, Automation Anywhere, UiPath, or similar
    technologies.
  - Orchestrate end-to-end business processes across multiple
    systems, applications, and AI services.
  - Integrate attended and unattended automations with Copilot
    Studio agents and Power Platform solutions.
  - Drive intelligent automation initiatives by combining
    workflow automation, RPA, AI, and business rules.

  Enterprise Integration & Architecture

  - Design end-to-end solutions integrating Copilot Studio,
    Power Platform, Azure services, SharePoint, Microsoft 365,
    and third-party systems.
  - Develop API-based integrations using REST, JSON, Microsoft
    Graph, Azure Functions, Logic Apps, and custom connectors.
  - Ensure solutions meet enterprise standards for scalability,
    reliability, security, and compliance.

  Generative AI Engineering

  - Integrate Azure OpenAI, Azure AI Foundry, Azure AI Search,
    Document Intelligence, and other AI services into business
    applications.
  - Implement responsible AI practices, content safety controls,
    governance frameworks, and hallucination mitigation
    techniques.
  - Monitor AI solution performance, usage, quality, and
    operational costs.

  Technical Leadership

  - Partner with business stakeholders to translate requirements
    into scalable AI-enabled solutions.
  - Mentor developers and provide technical leadership on Power
    Platform, AI, and automation best practices.
  - Drive adoption of emerging Microsoft AI capabilities,
    agentic AI patterns, and intelligent automation
    technologies.

  YOU ARE

  - 5+ years of hands-on experience with Microsoft Power
    Platform.
  - Advanced expertise in:
    - Microsoft Copilot Studio
    - Power Apps
    - Power Automate
    - Dataverse
    - Power Fx
  - Proven experience building enterprise copilots,
    conversational AI solutions, and agent-based applications.
  - Strong understanding of Generative AI, LLMs, prompt
    engineering, grounding, RAG, and Responsible AI practices.
  - Experience with:
    - REST APIs
    - JSON
    - Microsoft Graph
    - Custom Connectors
    - Enterprise System Integrations
  - Hands-on experience with Azure services, including:
    - Azure OpenAI
    - Azure AI Foundry
    - Azure Functions
    - Logic Apps
    - Azure AI Search
  - Experience designing secure, scalable, and supportable
    enterprise solutions.
  - Strong communication, architecture, and problem-solving
    skills.

  Preferred Qualifications

  - Experience with RPA and orchestration platforms such as,
    Automation Anywhere, Power Automate Desktop or similar
    technologies.
  - Experience integrating AI agents with enterprise automation
    platforms.
  - Microsoft Power Platform, Copilot Studio, Azure AI, or RPA-
    related certifications.
  - Experience with SharePoint, Microsoft 365, Purview, and
    enterprise governance frameworks.
  - Familiarity with DevOps, CI/CD, ALM, and agile delivery
    methodologies.

