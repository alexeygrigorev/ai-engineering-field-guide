description: |
  Voyager (94001), India, Bangalore, Karnātaka Senior Manager-
  AI Engineer At Capital One India, we are creating
  responsible and reliable AI systems, changing banking for
  good. For years, Capital One has been an industry leader in
  using machine learning to create real-time, personalized
  customer experiences. Our investments in technology
  infrastructure and world-class talent - along with our deep
  experience in machine learning - position us to be at the
  forefront of enterprises leveraging AI. From informing
  customers about unusual charges to answering their questions
  in real time, our applications of AI & ML are bringing
  humanity and simplicity to banking. We are committed to
  continuing to build world-class applied science and
  engineering teams to deliver our industry leading
  capabilities with breakthrough product experiences and
  scalable, high-performance AI infrastructure. At Capital
  One, you will help bring the transformative power of
  emerging AI capabilities to reimagine how we serve our
  customers and businesses who have come to love the products
  and services we build. Team Description: The Intelligent
  Foundations and Experiences (IFX) team is at the center of
  bringing our vision for AI at Capital One to life. We work
  hand-in-hand with our partners across the company to advance
  the state of the art in science and AI engineering, and we
  build and deploy proprietary solutions that are central to
  our business and deliver value to millions of customers. Our
  AI models and platforms empower teams across Capital One to
  enhance their products with the transformative power of AI,
  in responsible and scalable ways for the highest leverage
  impact. What You'll Do:

  - Partner with a cross-functional team of engineers, research
    scientists, technical program managers, and product
    managers to deliver AI-powered products that change how
    our associates work and how our customers interact with
    Capital One
  - Oversee the design, development, testing, deployment, and
    support AI software components including foundation model
    training, large language model inference, similarity
    search, guardrails, model evaluation, experimentation,
    governance, and observability, etc.
  - Make high judgment build-vs-buy decisions across a broad
    stack of Open Source and SaaS AI technologies such as AWS
    Ultraclusters, Huggingface, VectorDBs, PyTorch, and more
  - Invent and introduce state-of-the-art foundation model
    optimization techniques to improve the performance -
    scalability, cost, latency, throughput - of large scale
    production AI systems
  - Contribute to the technical vision and the long term roadmap
    of foundational AI systems at Capital One
  - Attract and retain top talent in the AI industry and nurture
    personal and professional development for your team.
    Foster a culture of learning and staying abreast of the
    state-of-the-art in AI
  - Translate enterprise AI goals into actionable team roadmaps
    with measurable outcomes and regular readouts
  - Operationalize Responsible AI: establish review gates,
    documentation/evaluation requirements, and
    rollout/rollback standards for all production AI systems
  - Create strong collaboration interfaces with Research, Data,
    and Platform teams to accelerate model lifecycle

  The Ideal Candidate:

  - You love to build systems, take pride in the quality of your
    work, and also share our passion to do the right thing.
    You want to work on problems that will help change banking
    for good
  - Passion for staying abreast of the latest research, and an
    ability to intuitively understand scientific publications
    and judiciously apply novel techniques in production
  - You get fulfillment from empowering others to achieve their
    potential and you actively drive professional development
    through mentoring and coaching. You are hands-on when
    necessary and lead by example
  - You adapt quickly and thrive on bringing clarity to big,
    undefined problems. You love asking questions and digging
    deep to uncover the root of problems and can articulate
    your findings concisely with clarity. You have the courage
    to share new ideas even when they are unproven
  - You are deeply Technical. You possess a strong foundation in
    engineering and mathematics, and your expertise in
    hardware, software, and AI enables you to see and exploit
    optimization opportunities that others miss
  - You are a resilient trailblazer who can forge new paths to
    achieve business goals when the route is unknown

  Basic Qualifications:

  - Bachelor's Degree in Computer Science, AI, Electrical
    Engineering, Computer Engineering
  - At least 6 years of experience developing AI and ML
    algorithms or technologies
  - At least 1 year of people leadership experience

  Preferred Qualifications:

  - 3+ years of experience managing and leading an engineering
    team
  - 6+ years of experience deploying scalable and responsible AI
    solutions on cloud platforms (e.g. AWS, Google Cloud,
    Azure, or equivalent private cloud)
  - 6+ years of experience developing AI and ML algorithms or
    technologies (e.g. LLM Inference, Similarity Search and
    VectorDBs, Guardrails, Memory) using Python, C++, C#,
    Java, CUDA, or Golang
  - 3+ years of experience in building agentic AI systems and
    agentic workflows
  - Passion for staying abreast of the latest AI research and AI
    systems, and judiciously apply novel techniques in
    production
  - Excellent communication and presentation skills, with the
    ability to articulate complex AI concepts to peers
  - 3+ years of experience leading technical strategy for a
    multi-disciplinary AI team, balancing research exploration
    with production delivery
  - Familiarity with MLOps, AI observability (evaluation
    pipelines, drift monitoring, model/version governance) to
    ensure reliability and compliance
  - Track record mentoring engineers/scientists to productize
    prototypes and meet production SLOs
  - 3+ years of experience right-sizing models, instance counts,
    and hardware types given requirements (e.g., context
    length, token inputs, token outputs)

