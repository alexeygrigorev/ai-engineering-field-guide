title: Senior Software Engineer II, Mobile - On App Ads (AI Native)
company: Life360
location: USA
remote: true
work_type: FULL_TIME
description: |
  About Life360

  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 102.4 million monthly active
  users (MAU), as of June 30, 2026, across more than 180
  countries.

  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).

  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.

  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.

  We are AI Native

  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.

  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.

  About The Team

  The On App Ads Engineering team owns the ads layer inside
  the Life360 app, which reaches approximately 102.4 million
  monthly active users. We build and maintain the SDK, header-
  bidding and mediation integrations, ad quality, and consent
  behind every ad on iOS and Android, serving 300M+ ad
  requests a day. We also own the testing and monitoring that
  keep that stack reliable, so every impression is
  competitively priced, respects each member’s privacy
  choices, and renders safely.

  We guide the direction of our future advertising experience
  by introducing new formats, placements, and capabilities
  that grow revenue while protecting the member experience. We
  work closely with the Ad Server & Exchange team, Ad
  Operations, Data, and Privacy, and we ship through
  controlled experiments, so every new ad surface proves its
  revenue lift without costing member trust. We build with AI
  agents because a small team owns a large surface of SDKs,
  partner integrations, and privacy regimes, and agents let us
  ship and test more of it without trading away quality.

  About the Job

  Life360 is hiring a Senior Software Engineer II for Mobile,
  On App Ads, to join our AI Native engineering team. This is
  a senior engineer who doesn't just use AI tools, but thinks
  natively in them. You'll be central to how the Ads
  Engineering team builds, scales, and evolves monetization in
  the Life360 app, and to how we use AI for development going
  forward.

  You'll own key parts of the ads stack on iOS: our in-house
  ads SDK, header-bidding and mediation integrations, consent
  and privacy flows, and the ad formats and placements members
  actually see. The bar is high on two fronts at once. Ads
  have to perform for the business, and they have to respect
  the member experience in an app that families rely on for
  safety.

  This role is iOS-first. Most of your work will be in Swift
  on the iOS app and SDK. Our AI-Native way of working also
  rewards engineers who treat platform boundaries as fluid, so
  you should be willing to build on Android, ad-server config,
  or backend when a partner integration or experiment calls
  for it.

  We’re expanding on-app ad formats and demand partners, and
  the iOS stack has to scale with it. You’ll be the engineer
  who makes that happen, across 300M+ daily ad requests and
  10+ partners, without costing the member experience.

  In your first year, success looks like this:

  - You've shipped at least one new ad format or demand
    integration end-to-end on iOS.
  - You've measurably improved ad quality or performance.
  - At least one AI-native workflow you built has been adopted
    beyond this team.

  For candidates based in the US, the salary range for this
  position is $118,500 to $216,500 USD. For candidates based
  out of Canada, the salary range for this position is 171,500
  to 201,000 CAD. Note: Please be aware that the job title for
  positions in Canada will be "Developer" in lieu of
  "Engineer."

  We take into consideration an individual's background, job-
  related knowledge, skills, and experience in determining
  final salary. Base pay may also vary based on geographic
  location, with US work locations falling into one of three
  geographic tiers.

  Total compensation is inclusive of equity compensation in
  the form of Restricted Stock Units (RSUs), as well as a
  comprehensive benefits package, including medical, dental,
  vision, financial, and other benefits.

  What You’ll Do

  - Design, build, and maintain the iOS ads layer: our in-house
    ads SDK, demand partner and header-bidding integrations
    (e.g., Prebid, Google Mobile Ads/GAM), and mediation.
  - Introduce new ad formats, placements, and capabilities that
    grow revenue while protecting startup time, scroll
    performance, and the member experience.
  - Own privacy and consent on iOS: ATT, IDFA handling,
    SKAdNetwork/AdAttributionKit, and consent frameworks
    (TCF/GPP). Make sure ads behave correctly in every region
    and under every user setting.
  - Protect ad quality. Detect and block bad creatives, diagnose
    rendering and fill issues, and partner with ad ops to
    resolve problems fast.
  - Instrument ad events (requests, impressions, clicks, and
    revenue signals) accurately, so the revenue and A/B test
    results the business relies on can be trusted.
  - Run A/B tests on ads configuration, such as floors, refresh,
    placements, and partner mix, and turn the results into the
    next decision.
  - Work with AI (Claude Code) as a first-class collaborator.
    Your main workflow is orchestrating agents to write specs,
    generate Swift code and tests, verify results, and review
    changes.
  - Partner closely with product, ad operations, data science,
    and partner engineering teams at third-party SDK vendors.
  - Contribute to architectural decisions, code reviews, and a
    culture of craft and continuous improvement on the iOS
    codebase.
  - Take part in the on-call rotation and incident response for
    ads and mobile releases.
  - Mentor teammates and help set technical standards for the
    team.

  What We’re Looking ForTechnical foundation:

  - 6+ years of iOS engineering experience shipping production
    apps at consumer scale.
  - At least 1 year of hands-on experience prompting,
    evaluating, and building with LLMs.
  - Strong proficiency in Swift, SwiftUI, and UIKit, plus deep
    familiarity with the modern iOS toolchain (Xcode, Swift
    Concurrency, Combine).
  - Experience with iOS architecture patterns (MVVM,
    coordinators, dependency injection, modularization with
    SPM or CocoaPods) in a large, multi-team codebase.
  - Experience integrating and debugging third-party SDKs in
    production, including version upgrades, behavior inside
    closed-source binaries, and their effect on app size and
    performance.
  - Solid grounding in iOS performance, memory, and crash
    diagnostics (Instruments, MetricKit, Crashlytics or
    equivalent).
  - Experience with CI/CD for iOS (Fastlane, Xcode Cloud,
    Buildkite, GitHub Actions, or similar).
  - Hands-on experience with agentic workflows, prompt
    engineering, context-window management, and MCP/function
    calling.
  - Bachelor's degree in a technical field, or equivalent
    experience.

  What matters most to us:

  - Growth mindset: You structure problems precisely, learn
    quickly, take interest outside "your lane," and are always
    happy to try something new.
  - Collaborative approach: You communicate clearly, work well
    across teams and with external partners, and value diverse
    perspectives.
  - Ownership mentality: You take responsibility for your work
    from design through production and beyond.
  - Thoughtful communication: You can explain technical
    tradeoffs and articulate ideas effectively.

  Nice-to-Have

  - Hands-on ad tech experience: OpenRTB, Prebid Mobile, Google
    Mobile Ads/GAM, AdMob, or mediation platforms (e.g.,
    AppLovin MAX, ironSource/Unity LevelPlay).
  - Experience with iOS privacy and attribution: ATT,
    SKAdNetwork/AdAttributionKit, Privacy Manifests, and
    consent management platforms (Google UMP, TCF/GPP).
  - Experience building or maintaining an SDK or framework that
    other teams consume.
  - Familiarity with ad quality tooling, creative rendering
    (WKWebView, MRAID), and diagnosing fill or latency issues.
  - Experience with an experimentation platform (Statsig,
    LaunchDarkly, Optimizely, or similar).
  - Android/Kotlin experience, or a willingness to contribute
    cross-platform.

  AI-Native Expectations

  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:

  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.

  Our Benefits

  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer life and disability
    as well as supplemental plans for medical and dental for
    Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Paid parental leave.
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being.
  - Generous time off: flexible PTO, companywide holidays
    throughout the year plus summer and winter shutdowns.
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership and Tile trackers.

  AI Usage: We use AI to help make our hiring process
  efficient. That said, every hiring decision is made by real
  Life360 hiring teams

  Life360 Values

  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference

  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.

  Our Commitment to Belonging

  Life360 is an equal opportunity employer. We don’t
  discriminate on the basis of race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, disability status, or any other legally
  protected status. We believe diverse perspectives make us
  better, and we’re building a workplace that reflects the
  communities we serve. Don’t meet every qualification? Apply
  anyway.

