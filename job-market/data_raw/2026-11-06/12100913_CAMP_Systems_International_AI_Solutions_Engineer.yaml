description: |
  About CAMP Systems: At CAMP Systems, we are the trusted
  leader in aircraft compliance and health management, proudly
  serving the global business aviation industry. With over
  20,000 aircraft and 33,000 engines supported on our cutting-
  edge platforms, and partnerships with more than 1,300
  maintenance facilities and parts suppliers worldwide, we’re
  shaping the future of aviation technology. Since our
  founding in 1968, we’ve grown to a dynamic team of 1,600+
  employees across 14 locations globally—all united by a
  passion for innovation and excellence.

  Our Mission & Vision: We connect the aviation industry
  through smart technology to make flight safer and more
  efficient, driving the future of aviation with intelligence
  and exceptional customer experiences.

  Our Values & Excellence Mindset: We are customer obsessed,
  trust-driven, owners of our work, stronger together,
  constantly curious, and boldly innovative.

  What You Will Experience in This Role:

  About CAMP Aviate

  CAMP Aviate brings together aviation ERP solutions, AI
  products, workflow applications, and integration
  capabilities to help aviation businesses plan and operate
  more effectively. Our AI Solutions include AI Operations
  Manager, AI Technician, and AI Analyst. They can work with
  CAMP ERP products or complement other enterprise systems.

  The opportunity

  Our strongest AI conversations start with a customer’s own
  data and operational problem. We are looking for a Solutions
  Engineer who can turn that material into a credible
  demonstration, a practical pilot, and a clear technical path
  forward.

  You will work with our AI commercial leader, customer-facing
  teams, Product, and Engineering. This role combines hands-on
  data work with technical discovery and live customer
  engagement. You should enjoy opening a dataset as much as
  presenting its implications to an operations leader.

  Responsibilities:

  - Build and deliver customer-specific demonstrations using
    operational data, workflows, and use cases.
  - Inspect, map, validate, transform, and troubleshoot
    structured data using SQL, APIs, scripting, and analytics
    tools.
  - Lead technical discovery on customer systems, data sources,
    integrations, security needs, and desired outcomes.
  - Scope pilots with clear technical requirements, assumptions,
    dependencies, and success criteria.
  - Explain current capability accurately and identify where
    configuration, integration, or product development is
    needed.
  - Handle routine technical presales work and engage Product or
    Engineering for deeper architecture or feasibility
    questions.
  - Turn successful demonstrations, data mappings, and
    integration approaches into reusable playbooks.
  - Help account teams present AI Solutions effectively to
    executives, operational teams, and IT stakeholders.

  You have:

  - At least four years in Solutions Engineering, technical
    consulting, solutions architecture, or a similar customer-
    facing technical role.
  - Hands-on experience with SQL, APIs, data mapping,
    validation, transformation, and integration
    troubleshooting; ability to use Python or comparable
    scripting tools.
  - Experience building or adapting demonstrations and proofs of
    concept with customer data.
  - Working knowledge of AI, analytics, and LLM-based
    applications, with sound judgment about technical limits.
  - Strong discovery, problem-solving, live demonstration, and
    communication skills across technical and business
    audiences.
  - Comfort with evolving products and willingness to travel for
    important customer work.



  Why Work at CAMP?

  Join a culture where your ideas matter, your impact is real,
  and your growth is supported. Be part of a team reimagining
  the future of aviation.

