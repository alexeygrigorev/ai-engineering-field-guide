description: |
  Make an impact with NTT DATA Join a company that is pushing
  the boundaries of what is possible. We are renowned for our
  technical excellence and leading innovations, and for making
  a difference to our clients and society. Our workplace
  embraces diversity and inclusion – it’s a place where you
  can grow, belong and thrive.

  Your day at NTT DATA The Team Lead, Software Applications
  Development is an entry level management role, responsible
  for taking accountability for the direction, design,
  development and implementation of new applications and
  upgrades for systems to meet business requirements. This
  role takes responsibility for directing the design of new
  applications from conception to completion and oversees the
  technical staff involved with the development project(s),
  including overseeing and directing software application
  upgrades. The Team Lead, Software Applications Development
  strives towards fostering a collaborative and innovative
  team culture focused on operational excellence.

  Key responsibilities:

  - Ensures that software applications development projects with
    clients are executed.
  - Performs proof of concept as and when required and ensure
    that development costs and activities remain within
    budget.
  - Uses business requirements to advise on the design,
    deployment and operation of infrastructures.
  - Helps determine how technology can be applied to meet
    external client and business requirements by crafting high
    level solutions and work breakdown.
  - Works closely with various external stakeholders to define
    the scope or boundary of the concepts which includes a
    cost benefit analysis, risk management plan and a
    feasibility study.
  - Translates the business and external client needs to various
    teams and assigns development tasks.
  - Takes accountability for the development of applications and
    takes on more complicated programming activities.
  - Assists the team and resolves any technical issues during
    the design, development and implementation phase of the
    project.
  - Ensures the appropriate testing of applications for
    efficiency and resolve escalated problems with the design
    prior to deployment.
  - Ensures that the development phase is documented to ensure
    the development of procedures for application use.
  - Directs the implementation of the application by ensuring
    the evaluation, testing and modification of the
    application until its functionality meets business and
    external client goals.
  - Oversees and manages the provision of the relevant
    documentation, training and support to the relevant teams
    to ensure the highest level of performance.
  - Researches and investigates emerging infrastructure and
    application technologies and the best practices associated
    with them.
  - Conducts detailed quality assurance and automated testing
    requirements, processes and guidelines.
  - Leads and manages a team of Software Application Developers
    in the achievements of team and individual objectives.

  Knowledges and Attributes:

  - Ability to effectively interact with senior management,
    and/or major customers which frequently involves
    negotiating matters of significance to the organization.
  - Ability to manage multiple projects simultaneously and
    deliver within budget and stipulated timelines.
  - Knowledge on multi-technology application and infrastructure
    design best practice.
  - Holistic view of technology environments including hardware
    platforms, applications, databases, operating systems and
    storage.
  - Entry level ability to build a cohesive team and to manage
    people effectively.
  - Ability to set the short-term direction of the team.
  - Good communication skills, including the ability to be
    influential and persuasive with stakeholders.
  - Displays a high level of detail consciousness by closely
    monitoring work progress in order to produce the required
    results.
  - Knowledge and understanding of all relevant industry
    standards.
  - Knowledge and understanding of best practices for software
    applications development.
  - Relevant technical skills such as programming languages,
    programming applications and troubleshooting.
  - Ability to resolve performance issues and deliver effective
    solutions to problems.

  Academic qualifications and certifications:

  - Bachelor's degree or equivalent in computer science or
    software engineering or related field.
  - Certification in various programming languages, for example
    (but not limited to) Java, Perl, Python, C++ preferred.
  - Scrum / Project Management certification preferred.

  Required experience:

  - Demonstrated experience with a strong background in all
    aspects of software application development.
  - Demonstrated experience gained in a similar type of role.
  - Demonstrated experience with a variety of software
    applications.
  - Demonstrated experience with a wide variety of computer
    software, hardware, and peripherals, including
    Microsoft365.
  - Relevant experience of dealing with relevant stakeholders,
    building strong relationships and negotiating with
    decision makers and influencers.
  - Relevant experience of delivering consultancy type projects,
    utilizing Agile or Waterfall methodologies.
  - Relevant experience of translating technical concepts into
    business terms.

  Workplace type:

  Hybrid Working

