description: |
  Premier Research is looking for a Senior AI Developer to
  join our IT & Corporate Administration team.

  You will help biotech, medtech, and specialty pharma
  companies transform life-changing ideas and breakthrough
  science into new medicines, devices, and diagnostics. What
  we do is profoundly connected to saving and improving lives,
  and we recognize our team members are the most valuable
  asset in delivering success.

  - We are here to help you grow, to give you the skills and
    opportunities to excel at work with the flexibility and
    balance your life requires.
  - Your ideas influence the way we work, and your voice matters
    here.
  - As an essential part of our team, you help us deliver the
    medical innovation that patients are desperate for.

  Join us and build your future here.

  The Senior AI Developer is responsible for designing,
  developing, and supporting enterprise‑grade AI solutions
  across Premier’s technology ecosystem. This role partners
  closely with business stakeholders, application end users,
  and global IT teams to build AI‑powered integrations,
  resolve day‑to‑day system issues, lead implementation and
  upgrade projects, and provide best‑practice guidance on the
  use of AI tools including Microsoft Copilot, Anthropic
  Claude, and Azure AI Foundry, Anthropic Claude, and
  Microsoft Copilot.

  What you will be doing:

  The Senior AI Developer will provide technical leadership,
  development, and administration of Premier’s AI platforms
  and enterprise applications, including:

  - Lead AI solution design and orchestration using Microsoft
    Copilot Studio, Claude Workflows, and Azure AI Foundry,
    Claude on Foundry / Claude Skills, and Microsoft Copilot
    Studio.

  - Develop, test, and optimize AI prompts, workflows, and
    pipelines for enterprise use cases.

  - Build and maintain integrations between AI platforms and
    corporate applications using REST APIs, webhooks,
    event‑driven architectures, and secure connectors.

  - Implement RAG (Retrieval‑Augmented Generation) using Azure
    AI Search, vector databases, and embedding pipelines.

  - Deploy and manage custom MCP servers and agent UIs via Azure
    Container Apps.

  - Develop and maintain automation scripts using Python,
    TypeScript, PowerShell, and other languages.

  - Administer and configure Azure AI Foundry, including:

  - Prompt Flow

  - Model catalog (Azure OpenAI, Claude, Phi)

  - Safety evaluations

  - Deployment endpoints

  - Monitoring and observability

  - Agent Service configuration

  - Resolve AI‑related issues through Premier’s ticketing system
    while meeting SLAs.

  - Lead AI platform upgrades, patches, and new feature rollouts
    with documented test cases and validation controls.

  - Develop and maintain documentation for AI workflows,
    integrations, and business processes.

  - Create knowledge base articles for Premier’s IT Service
    Management platform.

  - Configure security models for AI applications, ensuring
    least‑privilege access and compliance with Responsible AI
    standards.
  - Lead AI projects while keeping project team members,
    stakeholders, vendors, and IT leadership informed of
    issues and overall status.

  What we are searching for:

  - Bachelor’s degree and 4–6 years of IT experience, or 6–8
    years equivalent experience, supporting enterprise
    applications/AI systems.

  - Hands‑on experience with Microsoft Copilot, Copilot Studio,
    Claude Workflows, and Azure AI Foundry. Claude on Foundry
    / Claude Skills, Microsoft Copilot Studio.

  - Strong understanding of LLM architecture, prompt
    engineering, AI safety, and model evaluation.

  - Experience with Azure Container Apps for deploying custom
    MCP servers and agent front-ends.

  - Experience with AI and integrating enterprise applications
    such as Workday, Salesforce, Cornerstone, or similar
    systems.

  - Experience with Workday integrations (EIB, Core Connector,
    RaaS, Studio) is a plus.

  - Proficiency in Python, TypeScript, SQL, .NET, JavaScript,
    and automation scripting is a plus.

  - Experience with integration platforms such as Azure
    Integration Services, WSO2, or similar.

  - Strong understanding of web services, APIs, XML, JSON, and
    XSLT.

  - Fluent verbal and written English.

  - Excellent team player; collaborative and consensus‑driven.

  - Ability to multitask and work effectively in a fast‑paced
    environment with changing priorities.

  - Strong communication, negotiation, organizational, and
    time‑management skills.

  - Strong desire to learn new skills and expand technical
    experience.

  - Accountable, dependable, and committed to delivering
    high‑quality results.

  - Customer‑service‑focused approach to internal and external
    stakeholders.

  - Ability to work both independently and within a team
    environment.
