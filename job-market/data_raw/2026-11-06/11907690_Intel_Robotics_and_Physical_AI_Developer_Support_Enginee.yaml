description: |
  Job Details:

  Job Description:

  Intel Client Computing and Physical AI Group is building the
  open ecosystem for Physical AI and Robotics. We are seeking
  a passionate and technically strong Software Engineer to
  help grow and scale the developer communities around Intel's
  Robotics AI Suite, Physical AI Toolkit, OpenVINO Physical AI
  Framework, and related robotics software platforms.

  In this role, you will serve as the technical voice of Intel
  within the robotics developer ecosystem and the voice of
  developers within Intel. You will engage directly with
  developers across GitHub, Discord, forums, social channels,
  hackathons, and industry communities to accelerate adoption,
  improve developer experience, and help shape the future of
  Intel's Physical AI software portfolio.

  This position requires a unique blend of software
  engineering, developer relations, technical mentoring, and
  community leadership.

  Key Responsibilities:

  Developer Community Leadership

  Build, moderate, and grow Intel's robotics and Physical AI
  developer communities across GitHub, Discord, Reddit, ROS
  communities, and other developer platforms. Engage daily
  with developers, answer technical questions, troubleshoot
  issues, and ensure a positive community experience. Foster
  an open, collaborative, and inclusive developer ecosystem
  around Intel's robotics software stack. Identify community
  champions, influencers, and contributors and help scale
  their impact.

  Technical Enablement

  Develop sample applications, tutorials, demos, and reference
  implementations using Robotics AI Suite and Physical AI
  Toolkit. Create technical content including blog posts,
  walkthroughs, videos, workshops, and hands-on labs.

  Developer Feedback & Product Influence

  Collect, prioritize, and communicate developer feedback to
  product and engineering organizations. Identify friction
  points in onboarding, documentation, tooling, and deployment
  workflows. Drive measurable improvements in developer
  experience and time-to-first-success.

  Qualifications:

  Minimum Qualifications:

  - Bachelor's degree in Computer Science or related field.
  - 5+ years of software engineering or developer relations
    experience. Strong programming experience in Python and/or
    C++.
  - Experience working with AI/ML frameworks such as PyTorch or
    OpenVINO.
  - Experience supporting developer communities, open-source
    projects, or technical forums. Strong written and verbal
    communication skills.

  Preferred Qualifications:

  - Experience in robotics, Physical AI, autonomous systems, or
    edge AI.
  - Experience with robotics system software & frameworks such
    as ROS/ROS2. Contributions to open-source projects.
  - Experience managing GitHub communities and developer
    programs.
  - Experience speaking at technical conferences or conducting
    workshops. Familiarity with simulation environments,
    VLA/VLM workflows, and modern robotics AI stacks.
  - Experience with community platforms such as Discord, Slack,
    Reddit, Discourse, or Stack Overflow.

  Ideal Candidate Profile:

  - A hands-on software engineer who enjoys helping developers
    succeed, thrives in open-source communities, and is
    passionate about robotics and Physical AI.
  - The ideal candidate combines strong technical depth with the
    ability to build relationships, grow communities, and
    translate developer needs into product .



