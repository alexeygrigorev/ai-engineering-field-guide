description: |
  The Opportunity As a Tax Innovation - AI Engineer - Senior
  Manager you will lead AI engineering efforts that translate
  tax business needs into scalable solutions, working within
  our Tax practice and drawing on data, algorithms, and
  software engineering to develop and deploy AI and machine
  learning systems. As a Senior Manager you will lead large
  projects, apply sound judgment, and guide teams through
  complexity while shaping clear messages, coaching others,
  and using a strategic point of view to support client work
  and internal priorities. In this role at PwC, you will
  oversee multiple work streams, contribute to technical
  design and implementation, validate solution performance,
  and help move ideas from concept into practical use across
  tax delivery workflows. Responsibilities
  - Leading AI engineering workstreams for tax technology
    initiatives, translating client needs into scalable
    machine learning and software solutions
  - Designing and implementing AI systems using Python, deep
    learning, and natural language processing to support tax
    data automation and insight generation
  - Building data pipelines, wrangling structured and
    unstructured data, and validating model inputs for use in
    production environments
  - Applying analytical thinking and systems thinking to
    identify opportunities for process improvement and AI
    driven transformation in tax service delivery
  - Directing teams through ambiguity and complex delivery
    scenarios while making timely decisions on technical
    issues and delivery risks
  - Crafting clear technical narratives and presenting findings,
    tradeoffs, and recommended approaches to clients and
    internal stakeholders
  - Guiding rapid experimentation, model testing, and iteration
    to refine AI solutions and improve business outcomes
  - Coaching team members on AI implementation methods, open
    source tools, and responsible use of machine learning
    techniques
  - Modeling professional and technical standards while aligning
    solutions to firm policies, independence requirements, and
    client service objectives
  What You Must Have
  - At least a Bachelor's degree
  - At least 7 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Developing AI solutions for tax workflows and service
    delivery improvement
  - Applying Python, machine learning, and NLP in client-facing
    delivery
  - Translating complex data findings into concise leadership
    messages
  - Directing cross-functional teams through ambiguity with
    sound judgment
