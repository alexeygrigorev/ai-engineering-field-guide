description: |
  Summary

  We are seeking a highly skilled Google Cloud Vertex AI
  Engineer to join our IT Services team. In this pivotal role,
  you will leverage your expertise in generative and agentic
  AI to drive innovation and operational excellence. The
  position focuses on the end-to-end development and
  management of machine learning models, ensuring they are
  robust, scalable, and aligned with business objectives. You
  will play a critical part in advancing our technical
  capabilities by applying advanced cloud computing principles
  and sophisticated AI evaluation frameworks.

  Responsibilities

  - Design and develop machine learning models using Google
    Cloud Vertex AI, ensuring optimal performance and
    scalability.
  - Lead the deployment and ongoing management of AI models
    within production environments.
  - Conduct comprehensive troubleshooting and debugging of
    applications to maintain system reliability.
  - Create and maintain detailed technical documentation to
    support team collaboration and knowledge sharing.
  - Apply prompt engineering techniques and utilize AI
    evaluation frameworks to refine model outputs and
    accuracy.
  - Oversee the complete lifecycle of machine learning models,
    from initial concept to final deployment and monitoring.
  - Collaborate effectively with cross-functional teams to
    integrate AI solutions into broader business applications.

  Requirements

  Requirements:

  - Possess 4-6 years of professional experience within the IT
    Services sector.
  - Demonstrate a strong command of cloud computing fundamentals
    and Google Cloud Platform services.
  - Show proven expertise in Generative AI, Agentic AI, and
    Prompt Engineering.
  - Have hands-on experience with Google Cloud Vertex AI for
    model development, deployment, and lifecycle management.
  - Exhibit strong skills in application troubleshooting,
    debugging, and technical documentation.
  - Display excellent capabilities in team collaboration and
    communication.
  - Hold a competitive salary expectation of ₹12 lpa.
