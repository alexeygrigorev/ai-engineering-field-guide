description: |
  Elastic, the Search AI Company, enables everyone to find the
  answers they need in real time, using all their data, at
  scale — unleashing the potential of businesses and people.
  The Elastic Search AI Platform, used by more than 50% of the
  Fortune 500, brings together the precision of search and the
  intelligence of AI to enable everyone to accelerate the
  results that matter. By taking advantage of all structured
  and unstructured data — securing and protecting private
  information more effectively — Elastic’s complete, cloud-
  based solutions for search, security, and observability help
  organizations deliver on the promise of AI.

  What is The Role

  Elastic, makers of the hugely popular open source products
  Elasticsearch, Kibana, Logstash, and Beats, is growing very
  fast and so is our marketing team. As a key member of the
  Marketing AI, Operations and Automation team, you will play
  a hands-on, critical role in designing and building the
  automation infrastructure that powers marketing at scale.
  From connecting systems via APIs and webhooks to calling AI
  models for reasoning within live workflows, you will be the
  technical builder behind how marketing teams work smarter
  and move faster.

  Elastic is looking for a flexible and adaptable person with
  the ability to manage a variety of integration and
  automation challenges across a modern marketing tech stack.
  This is an ideal position for a self-motivated individual
  who has hands-on experience with no-code platforms and
  system integrations, is comfortable working directly with
  APIs and LLMs, and has the ability to work in a fast-paced,
  distributed environment.

  What You Will Be Doing

  - Design and build automated marketing workflows using no-code
    and low-code platforms, connecting tools across the
    marketing tech stack so data flows reliably between
    systems without manual intervention.
  - Integrate marketing platforms, AI content tools, and third-
    party services via APIs and webhooks, handling
    authentication, error states, and data formatting across
    each connection.
  - Work with AI models and generative AI platforms to build
    structured, repeatable workflows that produce consistent
    outputs at scale, configuring prompts and agent behaviour
    at the system level.
  - Call LLM APIs to trigger AI reasoning within workflows,
    constructing prompts programmatically, handling model
    responses, and routing outputs back to connected systems
  - Gather requirements from marketing teams across functions
    and translate them into workflow specifications,
    identifying opportunities for reuse and cross-team impact
    over single-team solutions.
  - Own the reliability and maintainability of the workflows you
    build, writing documentation clear enough for non-
    technical stakeholders to understand what runs, why, and
    how.
  - Evaluate new tools and integration patterns as the marketing
    tech stack evolves, recommending additions based on
    technical fit and organisational need.
  - Collaborate with operations, regional marketing, content,
    demand generation, and other marketing teams to understand
    where automation removes friction and build accordingly.

  What You Bring

  - 4+ years in marketing operations, marketing technology
    engineering, or a closely adjacent technical role focused
    on integrations and automation.
  - Hands-on experience building multi-step workflows using no-
    code or low-code platforms such as Workfront Fusion,
    Zapier, Make, or n8n in a production environment.
  - Practical experience working with APIs and webhooks:
    constructing authenticated requests, reading API
    documentation, handling errors, and passing data between
    systems reliably.
  - Experience connecting marketing platforms (Workfront,
    Marketo, Google Workspace, or similar) to external tools
    and services through system-level integrations.
  - Experience working with at least one AI model or generative
    AI platform in a workflow or integration context,
    including configuring system-level prompts and handling
    structured outputs.
  - Experience calling LLM APIs to trigger AI reasoning within a
    workflow, including constructing prompts programmatically,
    handling responses, and routing outputs back to connected
    systems.
  - Ability to gather requirements from non-technical
    stakeholders and convert them into buildable workflow
    specifications.
  - Strong written documentation habits, with the ability to
    make complex automation logic understandable to others.
  - Experience working across globally distributed teams
    spanning multiple time zones.
  - Preferred experience with Workfront, Zapier, Marketo, Adobe
    Fusion, Google Suite.

  Bonus Points

  - Google Apps Script, JavaScript, or Python for cases where
    no-code tools reach their limits.

  Additional Information - We Take Care of Our People

  As a distributed company, diversity drives our identity.
  Whether you’re looking to launch a new career or grow an
  existing one, Elastic is the type of company where you can
  balance great work with great life. Your age is only a
  number. It doesn’t matter if you’re just out of college or
  your children are; we need you for what you can do.

  We strive to have parity of benefits across regions and
  while regulations differ from place to place, we believe
  taking care of our people is the right thing to do.

  - Competitive pay based on the work you do here and not your
    previous salary
  - Health coverage for you and your family in many locations
  - Ability to craft your calendar with flexible locations and
    schedules for many roles
  - Generous number of vacation days each year
  - Increase your impact - We match up to $2000 (or local
    currency equivalent) for financial donations and service
  - Up to 40 hours each year to use toward volunteer projects
    you love
  - Embracing parenthood with minimum of 16 weeks of parental
    leave

