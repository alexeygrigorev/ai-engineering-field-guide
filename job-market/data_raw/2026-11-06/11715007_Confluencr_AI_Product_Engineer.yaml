description: |
  About Us

  Walnut Folks Group is the parent company of three agencies
  shaping how brands grow in India:

  - Confluencr – influencer marketing (700+ brands served)

  - Intent Farm – performance and marketplace marketing

  - Kalakaaar – talent representation

  We blend a marketer's mindset with a builder's one.
  Alongside our agency work, we run a consumer-facing Creator
  App with a large, active user base, and are building SaaS
  products that are getting ready to go to market. This role
  sits at the centre of that.

  Job Description

  You've probably been the person who spots the problem,
  writes the spec, and then waits for someone else to build
  it. Not here. With AI, you can go from idea to working
  product yourself, and we want you to.

  At Walnut Folks Group, you'll own products end to end
  across:

  - SaaS products, being tested internally now and getting ready
    to go to market

  - Our Creator App, a consumer-facing app with a large, active
    user base

  - Internal systems that power our agencies

  The Gist of What You'll Do:

  Decode the Business:

  Work closely with leadership, teams and users to spot
  problems worth solving, whether that's slow workflows,
  missing insights, manual grunt work or gaps in the product.

  Scope the Product:

  Define what to build and why, who it's for, and how we'll
  know it's working. Say no to the things that don't matter.

  Research Before You Build:

  Look at existing tools and approaches, talk to users, and
  avoid reinventing what already works.

  Prototype & Build with AI:

  Use AI coding tools, no-code/low-code platforms and APIs to
  turn ideas into working products, fast.

  Launch & Drive Adoption:

  Roll it out to internal teams, early customers or app users.
  Measure adoption, find where people drop off, and fix it.

  Iterate & Maintain:

  Track usage, collect feedback, fix what's broken and improve
  what's working. You own it long after launch.

  Examples of What You Might Build:

  - New features for our Creator App, from finding the problem
    to measuring impact

  - SaaS products for brands and marketers, taken from internal
    testing to their first external customers

  - AI workflows that screen, score or summarise candidates,
    creatives or campaign data

  What We're Looking For:

  - 2–4 years of experience in product, ops, consulting, growth
    or engineering roles

  - Proof that you've built and shipped something using AI
    tools, end to end and by yourself

  - Strong problem-solving: you break down a fuzzy problem
    before jumping to solutions

  - Comfort with data, logic and tools. You don't need to be a
    hardcore coder, but you aren't afraid of code

  - Clear communication with both business teams and tech

  - High ownership, and you hate leaving things half-done

  - Marketing experience is a bonus, not a requirement

  To Apply:

  Share one thing you've built using AI: the problem it
  solved, who uses it, and how you built it. Screenshots, a
  Loom or a live link all work.

  Why should you join us?

  - In case you want to build products used by real customers
    and creators, not just internal teams

  - In case you want to be early on SaaS products before they go
    to market, with a big say in shaping them

  - In case you want to own products end to end, not just a
    slice of them

  - In case you value high involvement from founders and
    learning directly from them

  - In case you want the autonomy to experiment without worrying
    about failures

  - In case you want to work on the cutting edge of AI, applied
    to real business problems

  - In case you want a long-term place where your impact is
    visible and rewarded

  Why shouldn't you join us?

  - In case you want a single, mature product with a large team
    around it. Here you'll juggle multiple products at
    different stages, with a lean team

  - In case you want a well-defined spec handed to you. Here,
    figuring out what to build is the job

  - In case you want a rigid, structured corporate setup. We're
    nimble and bootstrapped

  - In case you're looking for top-bracket pay in the industry.
    We may not be the right fit

  Perks:

  - Comprehensive health coverage, including medical and
    accidental insurance

  - Complimentary meals at the office: breakfast, lunch and
    evening snacks

  - Sponsored courses, certifications and weekly training

  - High ownership and the freedom to bring your ideas to life

  - Team outings, offsites and engaging workplace experiences

  Working Days: Monday to Friday (Onsite) + Saturday Half Day
  (WFH)

  Location: Bommanahalli, Bangalore
