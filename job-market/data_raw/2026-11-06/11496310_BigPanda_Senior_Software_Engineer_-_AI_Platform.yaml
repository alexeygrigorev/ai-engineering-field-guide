title: Senior Software Engineer - AI Platform
company: BigPanda
location: USA
remote: true
work_type: FULL_TIME
description: |
  Location requirements:

  Remote based role. Open to candidates in the USA across
  Mountain, Central, and Eastern time zones.



  About the Team

  AI Platform is building the foundation for BigPanda's
  generative AI products for IT Operations: unified data
  connectors (UDC), secure ingestion and indexing of
  enterprise data, unified identity and access, and the shared
  agentic infrastructure behind AI-powered incident response,
  prevention, automation, knowledge retrieval, and operational
  intelligence. We are expanding what enterprise IT teams can
  do with AI, not just making existing workflows slightly
  faster.

  This is an early-stage platform environment inside an
  established enterprise company. We move quickly, work
  directly with customers, make pragmatic tradeoffs, and
  prioritize shipping differentiated customer value over the
  perfect process. Engineers on this team are expected to
  operate with extreme ownership, high urgency, and a strong
  bias for action.

  The ideal candidate is a strong product-minded software
  engineer with hands-on AI experience, but less traditional
  paths are welcome. We care most about agency, judgment,
  output, speed, customer empathy, technical depth, and the
  ability to turn ambiguity into a valuable product for our
  customers.

  Today, the AI Platform team operates across data ingestion
  and synchronization, enterprise integrations, vector
  database indexing, APIs, authentication and RBAC, workflow
  orchestration, agentic infrastructure, and direct customer
  collaboration.

  What You'll Do

  As a Senior Software Engineer on AI Platform, you will
  design, build, and ship the platform capabilities that power
  AI across BigPanda's products. You will own meaningful
  features end to end: understand the customer problem, shape
  the solution, make technical decisions, build the system,
  validate it hands-on, launch it, respond to issues, and
  iterate quickly.

  You will work on systems involving data ingestion and
  synchronization, enterprise integrations, LLMs, agents, RAG,
  knowledge graphs, vector databases, workflow orchestration,
  automation, web applications, APIs, authentication and RBAC,
  and operational data pipelines.

  You will be expected to maximize velocity and output without
  becoming reckless. The team values engineers who take
  problems head-on, unblock themselves, communicate clearly,
  and push through ambiguity rather than waiting for perfect
  requirements or ideal conditions. You will also be expected
  to share best practices and contribute where you see
  opportunities to enhance how the team as a whole operates to
  meet our goals.

  While the role is centered on engineering execution, our
  core operating philosophy prioritizes complete product
  success above all else. Every team member meets with and
  builds relationships with customers, develops their own
  ideas, and shares ownership of our strategic roadmap,
  actively shaping what we ought to construct and driving
  technical choices that directly influence the customer
  experience across the BigPanda platform.

  Responsibilities

  - Build production-grade software across backend services,
    APIs, data ingestion pipelines, enterprise integrations,
    web applications, workflow systems, and automation
    platforms.
  - Build and own secure, reliable ingestion of customer data
    from enterprise systems like ServiceNow and Snowflake, so
    our AI products have the context they need.
  - Architect and implement AI-native capabilities using LLMs,
    prompting, tool calling, agent orchestration, RAG, vector
    search, knowledge graphs, embeddings, and
    structured/unstructured enterprise data.
  - Use AI coding platforms such as Cursor, Claude Code, and
    similar tools as a core part of your development workflow
    to increase speed, exploration, and delivery quality.
  - Write high-quality prompts for development, debugging,
    product behavior, agent execution, data extraction,
    reasoning workflows, and customer-facing AI experiences.
  - Propose, design and own features from concept through
    delivery, including customer discovery, technical design,
    implementation, manual validation, release, bug
    resolution, and iteration.
  - Work directly and build relationships with customers, GTM,
    product, and other engineers to identify high-value
    problems and translate them into product capabilities.
  - Make pragmatic tradeoffs between speed, quality,
    reliability, cost, latency, scalability, and customer
    impact.
  - Move fast in ambiguous problem spaces without hiding behind
    process, excessive documentation, or prolonged design
    debates.
  - Respond rapidly and transparently to bugs, regressions, and
    customer-impacting issues.
  - Collaborate through paired development, design discussion,
    code review, debugging, and direct technical debate.
  - Help raise the team's bar for velocity, technical judgment,
    ownership, and customer-focused execution, building and
    contributing to internal tools and processes within and
    outside of our team.

  What We're Looking For

  - Strong software engineering fundamentals across backend,
    full-stack, distributed systems, data pipelines, APIs, or
    product engineering.
  - Hands-on experience building AI-enabled product capabilities
    with LLMs, RAG, vector databases, embeddings, agents,
    workflow automation, knowledge systems, or related
    technologies.
  - High agency: you learn what you need to learn quickly, make
    forward progress independently, and do not wait for
    someone else to define every step. You want to develop
    ideas independently to improve customer outcomes and team
    operations.
  - Extreme ownership: you care about outcomes, customer impact,
    reliability, and follow-through, not just completing
    assigned tickets.
  - High velocity: you are motivated to ship, learn, and iterate
    quickly while maintaining sound engineering judgment.
  - Customer curiosity: you want direct exposure to users and
    are comfortable using customer feedback to shape
    priorities.
  - Product judgment: you can distinguish between what is
    technically interesting and what creates meaningful
    customer value.
  - Strong practical prompting skills, including prompt
    iteration, context design, tool-use instructions,
    structured outputs, and failure-mode analysis.
  - High proficiency with modern AI development tools such as
    Cursor, Claude Code, ChatGPT, or similar platforms; you
    should already be using AI to materially improve your
    engineering output.
  - Ability to architect and build agent systems that can
    reason, retrieve context, call tools, execute actions,
    handle errors, and operate safely in enterprise
    environments.
  - Healthy conflict: you can challenge weak ideas directly
    while remaining considerate, collaborative, and low-ego.
  - Comfort with uncertainty, changing priorities, incomplete
    requirements, and fast iteration cycles.
  - Excitement about applying AI to real enterprise IT
    Operations problems, not just building demos.

  Technical Areas You May Work In Already

  (You do not need to be familiar with all of these)

  - Extremely familiar with agentic coding (Cursor, Claude Code,
    Codex etc.)
  - Data ingestion, indexing, synchronization, and unstructured
    data processing
  - ServiceNow, Snowflake, ITSM, monitoring, alerting, and
    incident management integrations
  - RAG pipelines, vector databases, embeddings, and retrieval
    systems
  - Knowledge graphs, agent memory, and enterprise knowledge
    modeling
  - Authentication, authorization, OAuth, SSO, API keys, and
    RBAC
  - TypeScript / Node.js backend services
  - S3, SQS, Lambda, and AWS-based service architecture
  - React / Next.js customer-facing applications
  - Agent workflow engines, Agent-tracing, LangSmith etc.
  - Prompt engineering, context engineering, and tool-use design
  - ITOps domain expertise: change risk, ITSM, and incident
    prevention use cases

  You'll Thrive Here If

  You are a builder with urgency and agency. You do not
  hesitate when faced with ambiguity, hard problems,
  unfamiliar technology, or customer pressure. You take things
  head-on, figure out what needs to be learned, use every tool
  available to move faster, and drive the work to completion.
  You figure out what we should be building and how we should
  be operating; you are not simply assigned tasks.

  You are comfortable building a strong MVP quickly, putting
  it in front of users, learning from feedback, and improving
  it. You care about architecture, but you do not use
  architecture as an excuse to slow down. You value direct
  communication, high standards, fast feedback loops, and
  meaningful customer impact.

  This May Not Be the Right Role If

  You need fully defined requirements before starting, prefer
  long design cycles before implementation, are uncomfortable
  with direct customer interaction, or do not want AI tools
  deeply embedded in your daily engineering workflow. It may
  also not be a fit if you prefer narrow ownership, low
  ambiguity, low conflict, or optimizing mature systems more
  than inventing new product capabilities.

  Why This Role Matters

  AI Platform is at the center of BigPanda's unified platform
  strategy. The AI capabilities we bring to market, from how
  enterprise IT Operations teams investigate incidents to how
  they prevent outages, automate workflows, and make
  operational decisions, depend on the data, identity, and
  agentic infrastructure this team builds. A strong engineer
  on this team will directly influence platform direction,
  customer outcomes, engineering velocity across every team,
  and the pace at which BigPanda brings differentiated AI
  capabilities to market.



  About Us:

  BigPanda delivers agentic automation for IT operations. We
  enable enterprise IT to keep its digital world running by
  transforming manual and reactive human processes into
  intelligent, autonomous systems that detect, respond, and
  prevent IT incidents at machine speed. That’s why the
  world’s most trusted brands rely on BigPanda to improve
  operational efficiency and deliver exceptional service
  reliability to their customers.

  We have an awesome team of motivated, knowledgeable, fun-
  loving, and friendly Pandas. We provide comprehensive health
  coverage, parental leave, competitive cash and equity
  compensation, and a supportive, collaborative, and
  innovative environment to empower you to do the best work of
  your career.

  Our Benefits:

  - Competitive equity
  - Remote-first environment
  - Unlimited PTO
  - Twelve (12) paid holidays throughout the year
  - Comprehensive health benefits
  - #PandaParent support. Financial assistance for fertility,
    adoption, and surrogacy expenses, plus up to eighteen (18)
    weeks of fully paid leave for birthing parents and up to
    twelve (12) weeks for non-birthing parents.
  - Financial planning services
  - Employee learning & development budget
  - Values-based recognition (quarterly and annually)
  - Social community & ERG programs
  - Dog friendly office
  - Lunches provided in office
  - Flexible work environment along with a work-from-home
    stipend to support remote work arrangements
  - Values-based culture



  Please note that visa sponsorship is not available for this
  position.

  Market competitive salary with an anticipated base
  compensation range of $187,000 - $220,000. Actual salaries
  will vary depending on a candidate’s experience,
  qualifications, skills, and location

  BigPanda offers a generous total rewards package that
  includes base pay, bonus, equity, and a world-class benefits
  program. We run one (1) compensation review cycle per year
  to ensure that managers can recognize employees without much
  lag between achievement and reward. All of this builds
  toward the best compensation we can give to anyone: the
  ability to develop your skills each and every day. BigPanda
  has a significant focus on career development that is at the
  core of our employee experience.

  BigPanda is proud to be an Equal Employment Opportunity
  workplace employer. We do not discriminate based upon race,
  religion, color, national origin, gender (including
  pregnancy, childbirth, or related medical conditions),
  sexual orientation, gender identity, gender expression, age,
  status as a protected veteran, status as an individual with
  a disability, or other applicable legally protected
  characteristics.

  Note: BigPanda is an E-Verify Employer

  If you need assistance or an accommodation due to a
  disability, you may contact us at
  peoplequestions@bigpanda.io.
