description: |
  Company Description

  About Playtech

  Founded in 1999, the company has a premium listing on the
  Main Market of the London Stock Exchange and is focused on
  regulated and regulating markets across its B2B business. By
  leveraging its proprietary technology, Playtech delivers
  innovative products and services to ensure a safe, engaging
  and entertaining gaming experience.

  As the gaming industry's leading technology company, it
  combines business intelligence-driven software, services,
  content, and platform technology to drive excellence and
  innovation across the sector. Read more about who we are and
  what we do here: www.playtechpeople.com and www.playtech.com

  Here at Playtech, we genuinely believe that people are our
  biggest asset. Diverse thoughts, experiences, and individual
  characteristics enrich our work environment and lead to
  better business decisions. Embracing differences and
  maintaining transparency in our processes is the core of
  Playtech's overall commitment to responsible business
  practices.

  Ready to level up your career?

  We’re hiring AI Solutions Engineers who enjoy turning ideas
  into practical solutions, experimenting with the latest
  tools, and solving real business problems. We are currently
  filling three roles.  This is not about theory - it’s about
  building AI that works in the real world!

  Job Description

  Your Influential Mission: You Will…

  - Build practical AI tools, prototypes, and applications that
    improve workflows, products, and productivity.
  - Create reusable patterns, templates, and best practices for
    AI adoption across Playtech.
  - Design agentic workflows that automate tasks, use APIs, and
    support complex processes.
  - Stay current with AI trends and turn insights into demos,
    workshops, and recommendations.
  - Partner with teams to turn ideas into real solutions and
    support AI adoption hands-on.
  - Drive efficiency and productivity through AI across multiple
    business units.
  - Improve solution quality, cost, and performance through
    better design and optimisation.
  - Identify and mitigate AI risks, ensuring safe and
    responsible use.
  - Contribute to AI standards, governance, and best practices.
  - Share knowledge, mentor others, and raise the overall AI
    engineering bar.

  Qualifications

  Components for Success: You…

  - Have a strong interest in AI, especially enterprise AI
    solutions, and genuine enthusiasm to learn and keep pace
    with the latest developments and trends.
  - Bring a strong engineering background, with hands-on
    experience building and deploying AI, ML, or LLM-based
    systems.
  - Have experience designing platform-level capabilities (APIs,
    SDKs, shared services) that other engineering teams
    consume.
  - Are comfortable working across teams, explaining trade-offs,
    mentoring others, and partnering with various
    stakeholders.
  - Have a practical understanding of modern AI tooling: LLM
    APIs, vector stores, RAG, evals, agent frameworks, and
    developer assistants such as Cursor.
  - Understand software architecture and version control (Git),
    whether from a development background or equivalent hands-
    on AI experience.
  - Bring a pragmatic, delivery-focused mindset; comfortable in
    a large, regulated, multi-product engineering environment.

  You’ll Get Extra Points for…

  - Familiarity with Google Cloud AI services (Gemini Enterprise
    Agent Platform, ADK)
  - AI evaluation or AI security experience.
  - Agentic development experience (MCP, multi-agent systems).
  - RAG implementation experience.
  - Cloud DevOps or Terraform experience.
  - Prior experience in iGaming, fintech, or another regulated
    industry.
  - AI governance experience or interest.
  - Coding experience, especially in Python

  Thrive in a culture that values…

  - Ownership and accountability where you take responsibility
    for delivery, operations, and outcomes.
  - Proactive collaboration across the business units and teams
    globally.
  - Innovation with responsibility, encouraging improvement
    while maintaining strong governance and compliance.
  - Versatile and exciting challenges that keep you going and
    growing.
  - Hybrid working style – work in our modern and comfortable
    office as well as work from home office.
  - Neat benefits & bonus package.

  Additional Information

  CENTRAL AI TEAM

  The team is Playtech’s AI Centre of Excellence, driving AI
  adoption across the business. Operating at the intersection
  of platform engineering, solution delivery, and governance,
  the team builds shared capabilities while enabling business
  units to apply AI safely and effectively. With 80+ use cases
  already in progress, this is a unique opportunity to work on
  real enterprise challenges using cutting-edge technologies.
  Joining now means shaping how AI scales across a global
  organisation and influencing solutions used by thousands of
  colleagues and millions of players. Backed by strong
  executive support, AI is a key strategic priority at
  Playtech, offering high visibility and long-term impact.

  Playtech is an equal opportunities employer. Our mission is
  to welcome everyone and create inclusive teams. We celebrate
  differences and encourage everyone to be themselves at work.
