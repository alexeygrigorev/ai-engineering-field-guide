description: |
  Our vision is to transform how the world uses information to
  enrich life for all .  Micron Technology is a world leader
  in innovating memory and storage solutions that accelerate
  the transformation of information into intelligence,
  inspiring the world to learn, communicate and advance faster
  than ever. Our vision is to transform how the world uses
  information to enrich life for all. Micron Technology is a
  world leader in innovating memory and storage solutions that
  accelerate the transformation of information into
  intelligence, inspiring the world to learn, communicate and
  advance faster than ever. Senior AI Engineer, EEF, SMAI Job
  Summary Join Micron Technology at a defining moment in our
  AI and smart manufacturing transformation. As a and AI
  Engineer, you will contribute to the design, development,
  deployment, and support of AI-powered applications that
  improve manufacturing operations across Micron's global
  network of fabs and assembly/test sites. You will work
  closely with data scientists, software engineers, and
  manufacturing stakeholders to build scalable AI solutions,
  web applications, APIs, and automation tools that enable
  data-driven decision-making and autonomous operations. Main
  Responsibilities

  - Design and build end-to-end AI solutions, including data
    ingestion pipelines, feature engineering, model training
    and inference, APIs, web applications, and observability
    capabilities.
  - Develop responsive front-end applications using React,
    Angular, or Streamlit, backed by Python/FastAPI services,
    with strong type-safe development and test coverage
    practices.
  - Support development and implementation of machine learning
    and AI models for structured and unstructured data.
  - Support development of analytics and AI solutions that
    improve manufacturing and operational decision-making.
  - Support integration of LLMs and agentic AI capabilities into
    manufacturing and engineering workflows.
  - Support integration of robotics platforms, AMRs, tool
    automation systems, control systems, and the Micron MES
    ecosystem.
  - Develop and maintain containerized applications using Docker
    and deploy solutions through Kubernetes or OpenShift
    environments.
  - Work with data platforms and modeling environments to
    support scalable AI application development.
  - Build, train and deploy predictive machine learning models.

  Other Responsibilities

  - Contribute to CI/CD pipelines and automated software release
    processes using tools such as GitHub Actions, while
    supporting monitoring, drift detection, model evaluation,
    and feedback loop implementation for production AI
    applications.
  - Apply Responsible AI practices, including input validation,
    prompt-injection prevention, PII/IP protection, model
    governance, and audit logging.
  - Support application and model optimization efforts to
    improve performance, reliability, scalability, and cost
    efficiency.
  - Support testing, debugging, technical documentation,
    installation, and maintenance activities for AI and
    software solutions.
  - Integrate AI-assisted tools and insights into daily work to
    improve efficiency, quality, and effectiveness while
    complying with organizational standards, legal
    requirements, and governance policies.
  - Contribute to a culture of continuous improvement by
    identifying, testing, and sharing AI-enabled enhancements
    within one's scope of work.
  - Building and executing end-to-end ML systems automating
    training, testing, and deploying Machine Learning models
    in cloud platforms.

  Minimum Required Qualifications / Experience

  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, Data Science, or a related field; equivalent
    industry experience accepted.
  - 5+ years building and shipping production web or AI
    applications end to end.
  - Experience developing and deploying web applications, APIs,
    or data-driven solutions.
  - Hands-on experience with at least one cloud platform (AWS,
    Azure, or GCP).

  Must Have Technical Skills

  - Strong programming skills in Python and modern
    Angular/TypeScript.
  - Data architecture, encompassing data structures and schemas,
    along with strong SQL writing and comprehension skills.
  - Experience with Docker, Kubernetes/OpenShift, and CI/CD
    development practices.
  - Working knowledge of GenAI technologies, including prompt
    engineering, Retrieval-Augmented Generation (RAG), LLM
    integration, agentic AI concepts, model evaluation, and
    Responsible AI practices.
  - Ability to apply AI literacy and digital fluency to use AI-
    enabled tools responsibly and effectively for research,
    analysis, content creation, problem-solving, operational
    tasks, automation, and achieving business outcomes.
  - Machine learning frameworks (TensorFlow, PyTorch, scikit-
    learn, etc.)
  - Prediction (regression) and classification algorithms and
    familiarity with deep learning, reinforcement learning and
    generative AI.

  Must Have Soft Skills

  - Strong analytical and problem-solving skills.
  - Effective communication and collaboration skills.
  - Ability to learn quickly and adapt in a fast-paced
    environment.

  Highly Desirable / Preferred Skills or Experience

  - Experience in semiconductor manufacturing, industrial
    automation, or smart manufacturing environments.
  - Exposure to MLOps, machine learning model deployment, or
    enterprise AI applications.
  - Familiarity with MES, Industrial IoT, or equipment
    automation systems.
  - Experiecne in Building AI Agents

  Embody Micron's Core Values

  - People - Respect, develop, and empower others.
  - Innovation - Drive continuous improvement and breakthrough
    thinking.
  - Tenacity - Show grit and determination.
  - Collaboration - Build trust and foster teamwork.
  - Customer Focus - Deliver excellence and value.
  - Speed - Act with purpose and set the pace.

