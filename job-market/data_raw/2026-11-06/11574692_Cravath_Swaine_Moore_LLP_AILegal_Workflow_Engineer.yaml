description: |
  Overview

  The AI/Legal Workflow Engineer designs, develops, and
  improves AI-powered workflows for legal practice groups.
  The role focuses on prompt engineering, workflow
  development, the identification and removal of recurring
  friction in how legal work gets done, and quality assurance
  to ensure AI tools meet the Firm’s needs.  The AI/Legal
  Workflow Engineer works with IT, Practice Technology,
  Innovation, and Security teams to develop effective AI
  solutions and support the Firm’s innovation goals.

  Essential Responsibilities

  - Designs, develops, tests, and iterates AI-powered workflows
    for legal practice groups, translating legal tasks and
    processes into effective AI-enabled solutions;
  - Develops and maintains prompts, workflow templates,
    evaluation methods, and quality assurance standards for
    AI-powered tools, ensuring consistent, high-quality
    outputs;
  - Executes on the Firm’s strategy for AI-enabled workflows and
    contributes to roadmaps and priorities for workflow
    development and optimization;
  - Translates practice requirements into AI workflow
    specifications, prompt libraries, and knowledge
    repositories, ensuring AI outputs align with attorney
    expectations, Firm standards, and established legal
    workflows;
  - Provides input on AI workflow priorities and optimization
    efforts, balancing practice group needs, technical
    feasibility, quality standards, and long-term strategic
    value;
  - Monitors and reports on KPIs, quality metrics, and attorney
    satisfaction measures for AI-powered workflows, using
    data-driven insights to guide optimization and iteration;
  - Conducts research and development efforts to identify
    opportunities for AI enhancement in workflows, staying
    current with advances in large language models, AI
    workflow design and evaluation techniques, and legal AI
    applications;
  - Supports pilot programs and proof-of-concept initiatives for
    new AI workflows and optimization techniques, contributing
    to evaluation, definition of success criteria, and
    deployment recommendations;
  - Partners with stakeholders across the Firm to support
    coordinated development, testing, and deployment of AI
    workflows;
  - Contributes to training and adoption strategies for AI-
    powered tools and workflows, helping ensure attorneys and
    staff understand best practices for effective AI
    utilization in their work;
  - Collaborates with AI platform vendors and internal
    technology teams to provide feedback on system
    performance, identify enhancement opportunities, and
    support product development to better serve legal
    workflows;
  - Works closely with the Manager of Innovation on AI workflow
    initiatives, ensuring alignment between workflow
    optimization efforts and broader AI innovation objectives;
  - Provides updates on AI workflow performance, optimization
    progress, and quality metrics to the Manager and relevant
    stakeholders; and
  - Performs other duties and special projects, as assigned.

  Candidate Qualifications

  - Bachelor’s degree required; Juris Doctor (JD) and/or
    advanced degree in law, computer science, information
    systems, or a related field strongly preferred;
  - Minimum of three years’ experience in legal technology,
    knowledge management, legal practice, or a technology or
    innovation role within a professional services firm or
    similarly complex professional environment;
  - Demonstrated experience developing or optimizing AI-enabled
    workflows, prompts, or related technology solutions
    required;
  - Strong working knowledge of generative AI and prompt
    engineering, including key concepts such as retrieval-
    augmented generation (RAG), context management, model
    capabilities and limitations, and AI evaluation
    techniques;
  - Experience developing prompts, workflow templates, knowledge
    resources, and quality assurance processes for AI tools;
  - Hands-on experience with an enterprise AI platform,
    preferably in a legal or professional services
    environment, including building, testing, and maintaining
    multi-step workflows and reusable prompts, or similar AI-
    enabled solutions;
  - Ability to analyze complex professional workflows, identify
    appropriate opportunities for AI enablement, and translate
    user requirements into structured, testable solutions;
  - Ability to identify failure modes, design appropriate test
    cases, and evaluate AI outputs for accuracy, consistency,
    and alignment with attorney requirements, Firm standards,
    and established legal workflows;
  - Proficiency in Microsoft Word, PowerPoint, Excel, and
    Outlook;
  - Ability to track performance metrics and user feedback to
    improve AI tools and outputs;
  - Ability to support training and adoption of AI tools for
    attorneys and staff;
  - Strong communication and interpersonal skills, with the
    ability to work effectively with attorneys, technology
    teams, knowledge management, and administrative staff;
  - Ability to manage priorities and adjust projects in response
    to stakeholder and management feedback;
  - Ability to work independently and collaboratively while
    managing multiple projects and priorities;
  - Sound judgment, discretion, and attention to detail;
  - Ability to excel in a fast-paced, dynamic, 24x7 technology
    department; and
  - Availability to work additional hours as needed.

  This position is located in our New York office, and
  currently has a hybrid work schedule, but that is subject to
  change. The estimated salary range for this position is
  $155,000 to $195,000. The actual salary offered will be
  based on a wide range of factors, including relevant skills,
  training, experience, education, and where applicable,
  licensure or certification obtained. Market and Firm factors
  are also considered. In addition to base salary and
  discretionary bonus(es), we offer a generous employee
  benefits package including, but not limited to, paid time
  off, medical, dental, vision care, 401(k) and substantial
  health club discounts.
