description: |
  Job Details:

  Job Description:

  The world is transforming - and so is Intel. Intel is a
  company of bold and curious inventors and problem solvers
  who create some of the most astounding technology
  advancements and experiences in the world. With a legacy of
  relentless innovation and a commitment to bring smart,
  connected devices to every person on Earth, our diverse and
  brilliant teams are continually searching for tomorrow's
  technology and revel in the challenge that changing the
  world for the better brings. We work every single day to
  design and manufacture silicon products that empower
  people's digital lives. Come join us and do something
  wonderful.

  Join Intel's AI Revolution Intel's AI SoC organization
  develops cutting-edge products powering a wide range of AI
  applications, from edge devices to data center accelerators.
  If you are an engineer with strong technical and
  communication skills who thrives in a fast-paced environment
  with abundant learning opportunities, you are the ideal
  candidate for this role. Join us to shape the future of AI
  hardware. This role is at the heart of Intel's product
  development process, combining technical expertise, creative
  problem-solving, and disciplined execution. By joining our
  team, you will contribute to the design and development of
  next-generation technologies that power the future of
  computing, enabling transformative experiences for billions
  of users worldwide. This is your opportunity to work
  alongside some of the brightest minds in the industry,
  leveraging innovative methodologies to overcome challenging
  design problems and shaping the future of technology.

  Key Responsibilities: Develop logic design, RTL coding, and
  simulation for SoC designs. Define and implement
  architecture and microarchitecture features for logic
  blocks. Perform quality checks across RTL, timing, power,
  and design integrity to meet performance goals. Optimize RTL
  logic to ensure compliance with power, performance, area,
  and timing targets. Collaborate with IP providers to
  integrate and validate IPs at the SoC level. Review and
  contribute to verification plans and ensure design features
  are comprehensively tested. Identify and resolve RTL test
  failures to ensure feature correctness. Employ secure
  development practices to address security objectives and
  threats in the design. Drive quality assurance compliance
  for seamless IP and SoC handoff throughout the design flow.

  Qualifications:

  You must possess the below minimum qualifications to be
  initially considered for this position. Preferred
  qualifications are in addition to the minimum requirements
  and are considered a plus factor in identifying top
  candidates. Experience listed below would be obtained
  through a combination of your degree, research and or
  relevant previous job and or internship experiences.

  Minimum Qualifications: Bachelor's or Masters/Phd in
  Electrical Engineering, Computer Engineering, Computer
  Science, or a related field with 3+ years of experience.
  Expertise in microarchitecture, RTL design, coding, and
  simulation using SystemVerilog. Strong knowledge of system-
  level design principles, including power, performance, and
  area optimization. Demonstrated experience with timing/power
  convergence methodologies and tools. Preferred
  Qualifications:

  Experience with SoC architecture and SoC microarchitecture.

  Passion for continuous learning, including an understanding
  of AI models and how they shape AI hardware architectures
  Proficiency in clock domain crossing analysis and
  implementation techniques.

  Hands-on experience with quality assurance practices and
  secure development in logic design.

  Proven ability to effectively communicate across
  multidisciplinary teams. Track record of disciplined
  execution and delivering high-quality designs under tight
  deadlines. Experience in driving innovative solutions to
  complex design challenges. Passion for continuous learning
  and staying current with advancements in SoC design
  methodologies and technologies. Join us to push the
  boundaries of technology and make a lasting impact on the
  future of computing.



