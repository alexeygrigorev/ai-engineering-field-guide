job_id: 11869305
title: Sr. AI Voice Engineer
company: Westlake Financial
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  This role involves working with state-of-the-art speech
  recognition, speech synthesis, voice streaming, and AI agent
  frameworks to create scalable voice solutions for customer
  service, sales, finance, and automation applications. This
  is an on-site position with no relocation assistance
  provided.

  If you're passionate about conversational AI and enjoy
  solving challenging engineering problems, we'd love to hear
  from you.

  - Responsibilities
    - Design and develop real-time voice-to-voice AI agents.
    - Build conversational AI systems using LLMs and agent
      frameworks.
    - Integrate Speech-to-Text (STT) and Text-to-Speech (TTS)
      technologies into production applications.
    - Optimize latency and streaming performance for natural
      conversations.
    - Develop backend services and APIs using Python and C#/.NET.
    - Integrate with telephony, voice streaming, and communication
      platforms.
    - Implement conversation memory, tool calling, function
      execution, and retrieval-augmented generation (RAG)
      workflows.
    - Collaborate with product managers, AI engineers, and
      software developers to deliver production-ready AI
      solutions.
    - Evaluate emerging AI models, speech technologies, and voice
      platforms.
    - Monitor, troubleshoot, and continuously improve voice agent
      performance and reliability.

