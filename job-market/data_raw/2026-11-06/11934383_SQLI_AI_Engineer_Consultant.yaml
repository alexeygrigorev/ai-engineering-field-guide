description: |
  Company Description

  We Elevate. Digitally.

  SQLI, a European leader in customer experience and digital
  transformation, helps major international brands create
  value through technology and digital innovation. From
  strategy to the deployment of our clients technological
  assets, we design and build robust, high-performance
  architectures and engaging experiences by combining cutting-
  edge technologies, proven methodologies, and deep technical
  expertise.

  To strengthen our teams (2,200 people across 12 countries),
  we are recruiting passionate individuals who share our
  values: Creative Spirit, Commitment, Forward Thinking.

  Job Description

  The Senior AI Consultant supports clients in modernising
  their organisations through AI by conducting in-depth
  analyses of complex needs and proposing strategic solutions
  grounded in benchmarks, evidence, and operational reality.

  Drawing on AI expertise and consulting experience, you
  enrich recommendations, challenge stakeholders to think
  harder about the problems worth solving, and guide teams
  through the organisational change that AI adoption demands.
  You formalise high-quality deliverables, evaluate the
  medium- and long-term impact of what you recommend, and
  ensure clients are satisfied with both the journey and
  outcome.

  This role is highly client-facing. In most AI engagements,
  you will be the senior SQLI voice in the room, supported by
  architects and engineers from across the Data & AI service
  line and the wider SQLI group. You will work closely with
  the Service Line Manager on offer development and with
  Solution Architects on solution design.

  You will also help shape the practice itself. New
  accelerators, methodologies, points of view, and reusable IP
  come out of the work you do with clients. We want someone
  who sees that as part of the role, not a side project.

  What You Will Do

  - Conduct in-depth analysis of client needs and context,
    identifying where AI can create tangible business value
    and challenging stakeholders to solve root causes rather
    than surface-level symptoms.
  - Design and propose AI solutions based on benchmarks,
    evidence, and feedback, with a credible path from business
    objectives to measurable outcomes.
  - Advise clients on strategic and operational decision-making,
    assessing the medium- and long-term impact of AI adoption
    on operating models, processes, teams, and commercial
    performance.
  - Lead discovery workshops, AI strategy sessions,
    presentations, and executive-level discussions with
    technical and non-technical stakeholders.
  - Support change management initiatives around AI adoption,
    driving engagement, skills transfer, and organisational
    buy-in.
  - Shape commercial proposals together with the Service Line
    Manager, contributing to solution design and technical
    storytelling throughout the sales-to-delivery lifecycle.
  - Collaborate with Solution Architects, Data Specialists, and
    Engineering teams to validate technical feasibility and
    design scalable AI architectures.
  - Design and advise on AI applications leveraging RAG
    (Retrieval-Augmented Generation), AI agents, MCP
    ecosystems, enterprise knowledge retrieval, and workflow
    automation capabilities.
  - Assess and improve the reliability, quality, and performance
    of AI solutions using evaluation frameworks, testing
    methodologies, and governance best practices.
  - Contribute to new AI offerings, accelerators, reusable
    assets, and internal initiatives that strengthen SQLI's
    positioning in the AI market.
  - Ensure delivery excellence, maintain high-quality standards,
    and build long-term trusted-advisor relationships with
    clients.

  Qualifications

  - Strong consulting mindset with the ability to understand
    business objectives, KPIs, operational challenges, and
    organisational dynamics.
  - Experience identifying business opportunities for AI and
    translating them into practical, measurable solutions.
  - Excellent communication and stakeholder management skills,
    capable of simplifying technical concepts for executive
    audiences.
  - Practical understanding of Claude Code, AI agents, MCP
    connectors, plugins, skills, orchestration layers, and
    agentic workflows.
  - Hands-on experience designing and delivering RAG-based
    solutions, including retrieval strategies, grounding
    techniques, vector databases, enterprise search, and
    knowledge management use cases.
  - Experience working with AI agents and multi-agent systems,
    understanding orchestration patterns, memory management,
    tool calling, and workflow automation.
  - Experience assessing AI solution quality through frameworks
    and tooling such as Harness, LangSmith, Promptfoo,
    Humanloop, or equivalent evaluation platforms.
  - Technical background sufficient to discuss enterprise
    architecture, integrations, APIs, security, data flows,
    and solution design at a senior level.
  - Strong understanding of where AI creates value, where it
    fails, and how to balance business ambition with
    implementation reality.
  - Native-level Dutch and Fluent English.

  Additional Information

  What do we offer?.

  - Hybrid policy work. (2 days office)
  - Competitive salary.
  - Work Schedule Monday to Friday.



  Data protection notice

  SQLI Group ensures that applicants' personal data is
  processed as required by the EU General Data Protection
  Regulation (GDPR) and the Ley de Protección de Datos 3/2018
  of the Spanish Kingdom . Personal data is processed for the
  purpose of carrying out the hiring process and joining to
  our talent community. You can exercise your rights in terms
  of General Data Protection and digital guarantees through
  privacy@sqli.com
