  About Us:

  Building Services 32BJ Benefit Funds (“the Funds”) is the
  umbrella organization responsible for administering Health,
  Pension, Retirement Savings, Training, and Legal Services
  benefits to over 185,000 SEIU 32BJ members. Our mission is
  to make significant contributions to the lives of our
  members by providing high quality benefits and services.
  Through our commitment, we embody five core values:
  Flexibility, Initiative, Respect, Sustainability, and
  Teamwork (FIRST). By following our core values, employees
  are open to different and new ways of doing things, take
  active steps to improve the organization, create an
  environment of trust and respect, approach their work with
  the intent of a positive outcome, and work collaboratively
  with colleagues.

  The Funds oversees and manages $11 billion of dollars in
  assets, which are made up of many, varied and complex funds.
  The dollars come from a number of sources, including the
  property owners who pay into the funds on behalf of their
  employees, and as such, requires those who oversee and
  manage the money to be highly skilled financial management
  people.

  32BJ Benefit Funds will continue to drive innovation,
  equity, and technology insights to further help the lives of
  our hard-working members and their families. We use cutting
  edge technology such as: M365, Dynamics 365 CRM, Dynamics
  365 F&O, Azure, AWS, SQL, Snowflake, QlikView, and more.

  Please take a moment to watch our video to learn more about
  our culture and contributions to our members:
  youtu.be/hYNdMGLn19A

  Job Summary:

  Under the direction of the Manager, Data Science, we’re
  looking for an early-career Associate AI Solutions Developer
  with practical experience in software, data, or automation.
  In this role, you will use Python and existing AI and data
  platforms to build, test, and improve applications and
  workflows, which may include classical Machine Learning and
  Large Language Models. The work will also involve using AI
  coding assistants to explore code, draft or refine changes,
  configure coding agents or subagents, and create tests. You
  will review and validate AI-generated work and understand
  the code you submit. This role applies existing AI
  capabilities; it does not involve training or developing AI
  models from scratch.

  Your responsibilities will include owning agreed assignments
  from clarification through implementation, testing, and
  documentation, with support from your supervisor and
  experienced teammates. Your supervisor will help set
  priorities, review your approach, and provide coaching
  through formal weekly check-ins, brief daily discussions to
  share progress and resolve blockers, and hands-on training.
  As your skills grow, there will be opportunities to take on
  broader assignments and greater responsibility.

  Depending on the project, you may use Python, Visual Studio
  Code, PyCharm, GitHub, Databricks and its AI Gateway
  capabilities, Microsoft Fabric, Microsoft Foundry, and
  related enterprise data and AI platforms. AI coding
  assistants may include GitHub Copilot, Claude Code, Genie
  Code, or Codex. You are not expected to know every tool when
  you start; the team will provide training and support.

  Essential Duties and Responsibilities:

  - Work with your supervisor and teammates to understand
    business needs, agree on priorities, and define manageable
    assignments. Clarify requirements, share progress, and
    raise questions or blockers.

  - Take responsibility for completing agreed assignments
    through implementation, testing, and documentation,
    incorporating feedback from your supervisor and teammates.

  - Build and improve small applications, agents, and AI-
    assisted workflows that support clearer member experiences
    or more efficient internal operations.

  - Write and debug Python scripts or application features that
    process data, automate tasks, or connect approved data
    sources, APIs, models, and business tools.

  - Use approved AI coding assistants to support development
    tasks, such as understanding a codebase, drafting or
    refining code, configuring coding agents or subagents, and
    creating or updating tests. Review and validate
    suggestions before using them.

  - Build and test prototypes and updates to existing solutions.
    Review your approach with your supervisor and seek
    guidance and approval for changes affecting system design,
    security, or production use.

  - Test workflows with representative questions and tasks.
    Record whether results are useful, accurate, consistent,
    and timely; investigate failures and implement
    improvements within your assigned scope.

  - Use GitHub, Azure DevOps and follow team practices for
    version control, testing, documentation, and code review.
    Support experienced teammates as changes are prepared for
    use and monitored.

  - Work with data scientists, data engineers, business
    partners, IT, and security colleagues to understand data
    sources, operational needs, and privacy and security
    requirements.

  - Explore relevant tools and capabilities and share practical
    findings and suggestions with the team.

  Qualifications (Competencies):

  - 1-3 years of professional experience in software
    development, data, analytics, automation, or a related
    technical field. Candidates with less professional
    experience may be considered if internships, fellowships,
    or substantial projects demonstrate the capabilities below

  - Experience writing and debugging Python scripts or small
    application features that process data, automate tasks, or
    connect systems. You should be able to explain how the
    code works, how you investigated problems, and how you
    verified the results, including contributions developed
    with AI assistance.

  - Experience completing a technical project or assignment that
    solved a practical problem. You should be able to describe
    the purpose, your contribution, the challenges you
    encountered, and how you tested the result.

  - Hands-on experience using AI tools in software development
    through work, an internship, coursework, or a personal
    project. Examples include using an AI coding assistant to
    understand, write, refine, or test code. You should be
    able to explain how you reviewed its suggestions and
    checked their accuracy.

  - Familiarity with Git or another version-control tool for
    tracking changes and collaborating on code.

  - Familiarity with structured data, such as CSV files or JSON,
    and experience using basic SQL or Python to inspect and
    organize data.

  - Ability to explain technical work clearly, clarify
    requirements, share progress, incorporate feedback, and
    recognize when to seek help.

  - Willingness to follow established procedures for handling
    sensitive information.

  - Preferred Qualifications:
    - Experience connecting applications or workflows to APIs,
      data sources, or business tools.
    - Exposure to automated testing or collaborative code review.
    - Experience with Databricks, Microsoft Fabric, Microsoft
      Foundry, or a similar enterprise data or AI platform.
    - Experience configuring an AI agent, coding agent, subagent,
      or workflow.
    - Experience working with regulated or sensitive data
      including but not limited to insurance and financial
      domains.

  Soft Skills (Interpersonal Skills):

  - Curiosity about emerging AI technologies and a preference
    for testing assumptions through hands-on experimentation
    rather than theoretical assessment.

  - Willingness to report findings objectively, including
    results that do not support a preferred or previously
    proposed approach.

  - Ability to clearly communicate technical findings,
    limitations, tradeoffs, and recommendations to technical
    and non-technical stakeholders.

  - Comfort working with ambiguous or loosely defined problems
    and the ability to translate them into testable questions
    with measurable success criteria.

  - Ability to collaborate effectively across data science,
    engineering, IT, security, and governance teams,
    incorporating their requirements early in the development
    process.

  - Attention to detail and follow-through in maintaining
    versioned, documented, and reproducible work.

  Education:

  Bachelor’s degree in Computer Science, Data Science,
  Engineering, or a related STEM field, or comparable
  practical experience through education, internships,
  projects, or work experience.

  Reasoning Ability:

  High

