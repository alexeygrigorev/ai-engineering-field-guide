job_id: 11670077
title: Senior AI Engineer, Supply Chain
company: Sensata Xirgo
location: Pune, IND
work_type: FULL_TIME
company_size: 74 Employees
description: |
  The Senior AI Engineer, Supply Chain designs, builds, and
  deploys enterprise AI solutions that integrate advanced AI
  models with business data, systems, and workflows. This role
  delivers scalable, production-ready applications that drive
  business value while leveraging modern AI technologies,
  automation, and engineering best practices.

  General Responsibilities

  - Design, develop, and deploy production models, services, and
    pipelines that are reliable, scalable, and maintainable.
  - Partner with data science, product, data engineering, and
    platform teams to translate business problems into
    technical solutions.
  - Build and optimize model training, evaluation, deployment,
    monitoring, and retraining workflows.
  - Improve model performance, latency, cost efficiency,
    reliability, and explainability in production
    environments.
  - Develop reusable infrastructure, tooling, libraries, and
    patterns that accelerate team delivery.
  - Monitor deployed models for performance degradation, bias,
    drift, and operational issues; recommend and implement
    corrective actions.
  - Collaborate with stakeholders to communicate technical
    trade-offs, risks, timelines, and recommendations clearly.
  - Mentor engineers and contribute to technical standards, best
    practices, and architecture decisions.
  - Stay current with advances in practices.



  Experience / Qualifications

  - A university degree required (i.e. Bachelors degree) or
    equivalent relevant work experience.
  - Must be a team player able to work in a fast-paced
    environment with demonstrated ability to handle multiple
    competing tasks and demands
  - Strong communication skills; oral, written and presentation
  - Strong organization, planning and time management skills to
    achieve results
  - Strong personal and professional ethical values and
    integrity
  - Holds self-accountable to achieving goals and standards
  - Proficient in Microsoft Office programs (Outlook, Word,
    PowerPoint, and Excel)
  - Strong interpersonal & collaboration skills to work
    effectively with all levels of the organization including
    suppliers and/or external customers

  Additional Responsibilities:

  - Lead the development and deployment of enterprise AI
    applications from concept through production.
  - Build AI-powered solutions including intelligent agents,
    copilots, and retrieval-augmented generation (RAG)
    applications.
  - Develop integrations that connect AI capabilities with
    enterprise systems, data sources, and business processes.
  - Create reusable frameworks, components, and engineering
    standards that accelerate solution delivery.
  - Establish testing, evaluation, and release criteria to
    ensure solution quality, reliability, and business impact.
  - Partner with internal teams and external vendors to ensure
    AI solutions meet technical, security, and operational
    requirements.

  Additional Qualifications:

  - 5+ years of software engineering experience delivering
    production applications.
  - Professional proficiency in spoken and written English
  - Experience developing AI, machine learning, generative AI,
    or intelligent automation solutions.
  - Strong proficiency in Python, APIs, system integration,
    cloud technologies, and modern software development
    practices.
  - Experience with AI technologies such as large language
    models (LLMs), intelligent agents, copilots, or retrieval-
    augmented generation (RAG).
  - Knowledge of software testing, CI/CD, deployment automation,
    and production support best practices.
  - Experience integrating solutions with enterprise platforms,
    business applications, and data ecosystems.
  - Azure, Azure AI services, Copilot Studio, or Power Platform
    experience preferred.
  - Advanced degree in Computer Science, Software Engineering,
    Artificial Intelligence, or a related technical field
    preferred.

