  Job Description:



  In the HPE Hybrid Cloud, we lead the innovation agenda and
  technology roadmap for all of HPE. This includes managing
  the design, development, and product portfolio of our next-
  generation cloud platform, Green Lake. Working with
  customers, we help them reimagine their information
  technology needs to deliver a simple, consumable solution
  that helps them drive their business results. Join us
  redefine what’s next for you.

  Role Overview

  We are looking for a skilled Storage AI Engineer to help
  ensure the quality, reliability, and safety of our AI-
  powered products. The ideal candidate has a strong testing
  mindset, experience with software quality processes, and a
  passion for evaluating AI systems, including large language
  models (LLMs), recommendation systems, and intelligent
  automation features.

  As a QA Engineer on our AI product team, you will design and
  execute testing strategies for both traditional software
  features and AI-specific behaviors such as model accuracy,
  hallucination detection, prompt reliability, safety, bias,
  performance, and user trust. You will work closely with
  product managers, engineers, data scientists, and designers
  to validate product quality from concept to production.

  This role is ideal for engineers with strong software
  development fundamentals and a passion for Generative AI
  technologies.



  What You’ll do



  Key Responsibilities

  - Design, develop, and execute test plans for AI-driven
    products and features
  - Evaluate model behavior across real-world scenarios, edge
    cases, and adversarial inputs
  - Test prompt flows, agent behaviors, recommendations,
    summarization, search, classification, and generative
    outputs
  - Identify and document issues related to hallucinations,
    inaccurate outputs, bias, unsafe content, latency, and
    poor user experience
  - Build automated test frameworks for regression testing and
    continuous quality assurance
  - Conduct manual exploratory testing for new AI features and
    workflows
  - Create evaluation metrics and quality rubrics for AI product
    performance
  - Collaborate with ML engineers and product teams to define
    success criteria for AI features
  - Monitor production issues, analyze root causes, and drive
    quality improvements
  - Maintain test documentation, defect tracking, and reporting
    to stakeholders
  - Partner with cross-functional teams to improve product
    quality and release readiness



  What You Need to Bring



  Required Skills

  - 2-4 years of software QA, quality engineering, or related
    roles
  - Basic understanding of LLMs, prompt engineering, embeddings,
    and RAG.
  - Familiarity with Git, Docker, and cloud environments.
  - Strong analytical and problem-solving skills.
  - Ability to learn and work with emerging AI technologies.
  - Strong understanding of QA methodologies, testing lifecycle,
    and defect management
  - Experience with test case design, exploratory testing, and
    regression testing
  - Hands-on experience with test automation tools such as
    Selenium, Playwright, Cypress, Postman, or similar
  - Familiarity with API testing, DB and backend validation
  - Ability to think critically about edge cases and user
    behavior
  - Excellent communication and documentation skills
  - Experience with bug tracking tools such as Jira, Azure
    DevOps, or similar

  Preferred Qualifications

  - Experience testing AI, ML, or GenAI applications
  - Knowledge of LLM evaluation techniques, prompt testing, RAG
    systems, or model benchmarking
  - Familiarity with Python, JavaScript, or automation scripting
  - Understanding of metrics such as precision, recall, latency,
    user satisfaction, and error rates
  - AI observability and evaluation tools.

