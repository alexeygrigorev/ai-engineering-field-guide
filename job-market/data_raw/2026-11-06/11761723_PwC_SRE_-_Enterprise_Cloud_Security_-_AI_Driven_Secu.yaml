description: |
  The Opportunity As a SRE - Enterprise & Cloud Security - AI
  Driven Security Senior Associate you will support the
  design, development, deployment, monitoring, and maintenance
  of AI-enabled security solutions within our Advisory
  practice. As a Senior Associate you will analyze complex
  problems, manage assigned workstreams, build meaningful
  client connections, guide junior team members, and use
  critical thinking to break down technical concepts while
  adapting to changing client needs and priorities. In this
  role at PwC, you will apply artificial intelligence
  engineering and cybersecurity methods to help design
  scalable systems, interpret data to inform recommendations,
  and contribute to work that strengthens enterprise and cloud
  security across client environments. Responsibilities
  - Designing and deploying AI-enabled security solutions that
    support enterprise and cloud environments
  - Developing machine learning workflows, data pipelines, and
    model implementation processes for scalable security use
    cases
  - Analyzing complex security and data challenges to identify
    patterns, risks, and opportunities for automation
  - Applying Python, Java, TensorFlow, and machine learning
    libraries to build and refine AI-driven capabilities
  - Evaluating data quality, integration, and modeling
    approaches that support secure and reliable system
    performance
  - Supporting client engagements by translating technical
    findings into clear recommendations and implementation
    steps
  - Reviewing work products for accuracy, consistency, and
    alignment with professional and technical standards
  - Guiding junior team members through technical tasks, issue
    resolution, and delivery activities
  - Building relationships with client stakeholders to
    understand security needs and evolving business context
  - Contributing to the design of scalable security controls
    across identities, infrastructure, and cloud platforms
  What You Must Have
  - At least a Bachelor's degree
  - At least 3 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating hands-on work in cloud security, AI security,
    or cyber risk
  - Applying data analysis and scripting skills to security use
    cases
  - Interpreting technical findings for client-facing
    deliverables and recommendations
  - Collaborating across teams while mentoring junior
    professionals
  The salary range for this position is: $77,000 - $202,000.
