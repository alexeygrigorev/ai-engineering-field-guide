description: |
  About Vanguard Founded in 1975, Vanguard is one of the
  world's leading investment management companies. The firm
  offers investments, advice, and retirement services to tens
  of millions of individual investors around the
  globe—directly, through workplace plans, and through
  financial intermediaries.



  Vanguard India

  Vanguard’s office in India is a significant milestone in our
  global expansion. We are committed to establishing an
  enduring technology center in Hyderabad, Telangana and are
  excited to be adding talent who will focus on Artificial
  Intelligence (AI), mobile, and cloud-based technologies that
  drive our business outcomes and deliver a world-class
  experience for our clients.

  Role Summary

  We are seeking a Lead Full-Stack Software Engineer to
  provide technical leadership for the design, development,
  and delivery of cloud-based applications and intelligent
  digital experiences. This role combines strong engineering
  expertise with architecture leadership, stakeholder
  engagement, and team mentorship responsibilities.

  Responsibilities

  - Lead the design and delivery of full-stack software
    solutions.
  - Define architecture and technical solution strategies.
  - Guide engineering teams on design patterns, scalability, and
    best practices.
  - Lead technical reviews, code reviews, and solution
    evaluations.
  - Provide technical direction across frontend, backend, APIs,
    and cloud platforms.
  - Partner with business and technology stakeholders to define
    solutions.
  - Mentor and develop engineering talent.
  - Identify and mitigate technical risks and dependencies.
  - Drive engineering standards, automation, and operational
    excellence.
  - Evaluate and adopt emerging technologies, including AI-
    enabled solutions.

  Required Qualifications

  - Minimum 8 years of software engineering experience.
  - Bachelor's degree in Computer Science, IT, Engineering, or
    related field.
  - Approximately 10 years of overall technology experience.
  - Minimum 3 years of technical leadership experience.
  - Strong full-stack application development expertise.
  - Experience with JavaScript, Angular, APIs, and integration
    services.
  - Strong AWS cloud experience.
  - Experience with GitHub and CI/CD practices.
  - Proven architecture and solution-design experience.
  - Excellent stakeholder management and communication skills

  Preferred Qualifications

  - Experience leading distributed engineering teams.
  - Exposure to Generative AI and conversational AI platforms.
  - Experience with agent-based AI solutions.
  - Experience building large-scale cloud-native applications

  Location

  This role is based in Hyderabad, Telangana at Vanguard
  India. Only qualified external applicants will be
  considered.

  Our mission

  Vanguard adheres to a simple purpose: To take a stand for
  all investors, to treat them fairly, and to give them the
  best chance for investment success.



  Our commitment to you

  Vanguard takes the same long-term view of your success—at
  work and in life—with Benefits and Rewards packages that
  reflect what you care about, throughout all the phases and
  stages of your life. Our Total Rewards programs provide you
  and your loved ones with wellness support for key areas in
  your life:

  Financial wellness  We're committed to enabling your
  financial success and provide competitive offers and
  programs.

  Physical wellness  We're committed to providing benefits
  that support your physical health and wellness.

  Personal wellness  We're committed to providing resources
  that help support the full scope of your life.

  How we work

  Vanguard has implemented a hybrid working model for most of
  our employees (crew members), designed to capture the
  benefits of enhanced flexibility while enabling in-person
  learning, collaboration, and connection. We believe our
  mission-driven and highly collaborative culture is a
  critical enabler to support long-term client outcomes and
  enrich the employee experience.
