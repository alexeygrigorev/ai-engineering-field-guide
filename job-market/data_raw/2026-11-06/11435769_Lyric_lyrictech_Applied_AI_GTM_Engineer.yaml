  About the Role

  This is one of the most important GTM hires we’ll make in
  2026. We’re building the most data-driven, AI-native
  organization in enterprise supply chain, and we need an
  applied AI operator to help us go even faster.

  We’re looking for a motivated IC who builds AI-powered
  products, ships them into production, and uses them to drive
  real GTM impact.

  What you need to know about this role:

  - This role isn’t about running reports. You will build the
    products and systems that drive internal GTM operations at
    Lyric.
  - Applied AI is the job. From Claude Code and the Claude Agent
    SDK to custom agents, you’ll use AI to multiply output
    across GTM. Your first instinct is “how can we build that
    better/faster/stronger?”
  - We dive deep. We expect root-cause thinking and SME-level
    fluency in your function instead of surface-level insights
    or pretty decks.
  - We hold a high bar. This is a performance culture and we
    expect high effort and impactful outcomes.

  What You’ll Do

  Build AI-Powered Internal and GTM Products

  - Ship AI-powered tools and agents into production that your
    teammates use every day.
  - Own the design, build, and iteration cycle end to end. You
    will not hand off requirements; you will build the thing.
  - Embed AI deeply into the company and GTM tech stack (Slack,
    Salesforce, Notion, Claude, Fathom, internal tooling).

  Operate at the Center of New Lyric Motions

  - Work directly with founders and leadership, with a bias to
    get things done fast
  - Partner with Sales & Marketing leadership to design and
    instrument new acquisition channels, expansion plays, and
    vertical motions as Lyric scales.
  - Translate company strategy into systems: data models,
    automations, AI workflows, and GTM operating cadences that
    scale beyond the people who built them.
  - Build MVP systems and products that scale once we prove
    value.
  - You will start in RevOps, the engine room of GTM, and turn
    it into the most automated function on the market

  About You

  We get a lot of incredible applications and it’s genuinely
  hard to get back to everyone in time. Please apply if all of
  the following describe you:

  - You automate instead of waiting for someone else to solve
    your problem. You’ve used engineering to solve a ‘pebble
    in the shoe’ problem that you were facing. We want to hear
    from you if you’ve built plug-ins and workflows to
    automate an aspect of your life!
  - You’ve tried and tested new-age AI tools. Strong familiarity
    in building and tinkering with agentic
    frameworks/platforms
  - You’ve personally shipped products or AI-powered systems
    into production. We’re ideally seeking builders with
    products that were adopted by critical mass instead of
    those that were vibe-coded and forgotten. (++ if you have
    a RevOps/GTM background but not required)
  - You have a high ownership, high agency mindset and Mach10
    pace.
  - 3-5+ years in an engineering role, BizOps, consulting, or
    even early-stage founders or founding team members

  Bonus: Enterprise SaaS, supply chain, or vertical AI
  experience is great to have
