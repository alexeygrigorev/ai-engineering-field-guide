title: AI Engineer, Marketing
company: Project Management Institute, Inc.
location: USA
remote: true
work_type: FULL_TIME
description: |
  Are you a dreamer, innovator, thinker and a do-er who
  believes in contributing to something that makes difference?
  Make an impact. Join PMI.

  How will you make a difference to PMI?

  We are seeking a senior-level AI Engineer, Marketing to lead
  the design, development, and operationalization of AI-
  powered workflows across the marketing organization. This
  role serves as the technical owner of Marketing AI and
  Automation initiatives, partnering closely with Marketing
  stakeholders and the Martech team to deliver production-
  ready, scalable AI capabilities embedded within existing
  tools and processes.

  The AI Engineer owns the end-to-end lifecycle of marketing
  AI solutions—from opportunity intake and backlog management
  through architecture, deployment, and measurement—ensuring
  solutions are reliable, observable, and aligned with
  business outcomes.

  What you’ll bring to the role:

  AI Product & Backlog Ownership

  - Own and manage the Marketing AI & Automation backlog,
    translating marketing opportunities into prioritized
    initiatives.
  - Partner with Marketing Operations and Martech teams to
    identify high-impact AI use cases.
  - Define success metrics and acceptance criteria for AI
    solutions.
  - Serve as technical owner balancing rapid iteration with
    production stability.

  AI Systems & Agentic Workflow Design

  - Design and build LLM-powered workflows and multi-agent AI
    systems.
  - Implement RAG pipelines using enterprise data and knowledge
    sources.
  - Create reusable AI components embedded into existing
    marketing tools.
  - Ensure systems include guardrails, fallback behaviors, and
    human-in-the-loop controls.

  Data Foundation & Platform Enablement

  - Build the data foundation required for AI agents across CRM,
    analytics, and data warehouse environments.
  - Enable AI functionality within existing Martech platforms.
  - Partner with analytics teams to ensure data quality and
    accessibility.
  - Document data flows, integrations, and dependencies.

  Production Deployment & Operations

  - Deploy AI systems into production with monitoring and
    evaluation.
  - Implement observability to track performance and business
    impact.
  - Continuously improve AI solutions based on usage and
    feedback.
  - Ensure systems are secure, supportable, and resilient.

  Stakeholder Partnership & Enablement

  - Act as a trusted AI partner to Marketing leadership.
  - Translate complex AI concepts into business implications.
  - Enable non-technical teams through intuitive tools and
    documentation.
  - Maintain transparency on roadmap, risks, and outcomes.

  Role Qualifications:

  Qualifications

  - Senior-level experience delivering AI-powered systems in
    enterprise environments.
  - Hands-on experience with LLM workflows, RAG, and agentic
    systems.
  - Strong analytics or data engineering background.
  - Proven cross-functional marketing and technology partnership
    skills.

  Skills & Competencies

  - AI systems and agentic workflow design
  - Marketing automation and CRM workflows
  - Analytics and evaluation frameworks
  - Product mindset and backlog prioritization
  - Clear communication with technical and non-technical
    audiences

  Technology Environment

  - CRM: Adobe, Microsoft Dynamics 365
  - Analytics: Adobe Analytics, Tableau
  - Data Warehouse: Snowflake
  - Work Management: Jira, monday.com
  - Collaboration: SharePoint, Microsoft Teams

  Travel Requirements

  Remote role with less than 10% travel as needed



  What you can expect from us

  We value and nurture an environment of inclusivity and
  diversity, and a culture of communication and collaboration.
  Your health, safety and well-being come first, and we
  believe that you should have time for your work, but you
  should also have time for you..

  Join us and you’ll get:

  • an excellent total package, with compensation and benefits
  based upon your geographic location.

  • skill development opportunities, to help you grow now and
  into the future.

  • access to a global network, to enrich your professional
  experience.

  • flexible options to help balance work time and your time

  • award and bonus opportunities.

  The salary offer will be based on several factors, including
  the candidate’s demonstrated skills, qualifications and
  relevant experience.



  Let’s help make the world work better for everyone. Apply
  today!

  Project Management Institute, Inc. is committed to providing
  equal employment opportunities without regard to sex, gender
  identity, sexual orientation, race, color, religious creed,
  national origin, physical or mental disability, protected
  veteran status, or any other characteristic protected by
  applicable law.
