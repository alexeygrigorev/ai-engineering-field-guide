description: |
  Job Description

  At SIXT, we are building the semantic foundation that lets
  AI agents and thousands of analysts query our data platform
  reliably in natural language. As Senior Analytics/Data
  Engineer in our Data Platform team, you design the semantic
  layer and ontologies on top of our AWS-based data platform
  and build the text-to-SQL agents that turn them into
  business value. You will join a team of 30 data engineers
  building the data platform for analytics and AI agents
  across the SIXT group, working with state-of-the-art LLM
  technology to shape how our business interacts with data,
  apply now and become part of Team Orange!

  YOUR ROLE AT SIXT

  - You define and build our semantic layer (metrics,
    dimensions, entities) on top of the AWS data warehouse,
    creating a single source of truth for KPIs consumed by BI
    tools, analysts, and AI agents
  - You design and implement text-to-SQL agents on the data
    warehouse, from retrieval and prompt strategy over query
    generation and validation to evaluation pipelines that
    measure answer accuracy
  - You specify ontologies and business glossaries for the
    mobility domain (rental, fleet, pricing, customer) and
    publish them in machine-readable form so agents and
    services can consume them
  - You integrate semantic context, metadata, and lineage from
    our data catalogue into agent workflows, and define the
    standards that make datasets "agent-ready"
  - You partner closely with data engineers, analysts, and our
    AI platform teams, evangelize semantic modeling best
    practices, and mentor engineers across the platform
    organization
  - You continuously evaluate emerging tooling (semantic layer
    engines, knowledge graphs, LLM frameworks) and drive
    build-vs-buy decisions

  YOUR SKILLS MATTER

  - Education You have B.Tech, B.E, or Master's degree in
    Computer Science or a closely related discipline
  - Experience You bring 9+ years in analytics/data engineering,
    including hands-on experience building a semantic or
    metrics layer (e.g. dbt Semantic Layer, Cube, AtScale,
    LookML) and productionizing LLM based applications,
    ideally text-to-SQL or RAG systems
  - Tech Stack You are highly proficient in SQL and Python; you
    have worked with modern cloud data warehouses (Redshift,
    Snowflake, or Databricks) on AWS, and with LLM frameworks
    and APIs (e.g. LangChain, Bedrock, Anthropic API)
  - Semantic Modeling You have experience in dimensional and
    semantic data modeling is a Big plus; Knowledge of
    ontology standards (RDF, OWL, SKOS), knowledge graphs, or
    MCP-based agent context is again an advantage
  - Ways of Working You work with engineering best practices
    (Git, CI/CD, code reviews, testing), take ownership end-
    to-end, and communicate complex concepts clearly to
    technical and business stakeholders

  WHAT WE OFFER

  - Grow Further, Go Further Advance your skills and unlock your
    potential with our Education Assistance Program
  - AI Excellence With Claude by Anthropic and SIXTgpt, our own
    AI platform, you work with state-of-the-art AI tools from
    day one, with the freedom to try new technologies and use
    AI to work faster and smarter
  - Balance Your Career Benefit from a hybrid work environment
    complemented by flexible working hours
  - Fuel Your Day Great work deserves great fuel — enjoy meal
    benefits that keep you energised and ready to bring your
    A-game
  - Your Wellness Matters We are committed to your well-being
    through comprehensive insurance, wellness programs, health
    checkups, and fitness benefits
  - Recognition That Counts We create a culture of appreciation,
    rewarding your impact through referral incentives and
    loyalty perks as you grow with us
  - Growing Families, Growing Joy As your family grows, we are
    here to celebrate with a special newborn gift for your
    little one

  Additional Information

  About us:

  We are a globally leading mobility service provider with a
  revenue of €4.00 billion and around 9,000 employees
  worldwide. Our mobility platform ONE combines our products
  SIXT rent (car rental), SIXT share (car sharing), SIXT ride
  (taxi, ride, and chauffeur services), and SIXT+ (car
  subscription), giving our customers access to our fleet of
  350,000 vehicles, the services of 4,000 cooperation
  partners, and around 5 million drivers worldwide. Together
  with our franchise partners, we are present in more than 110
  countries at 2,000 rental stations. At SIXT, top-tier
  customer experience and outstanding customer service are our
  highest priorities. We believe in true entrepreneurship and
  long-term stability and align our corporate strategy with
  foresight. Get started with us and apply now!
