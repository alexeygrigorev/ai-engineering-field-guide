description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Serve as an early, senior full-stack engineer building AI-
  driven applications, owning the design and delivery of both
  back-end and user-facing systems. Work closely with product,
  design and engineering colleagues while helping set
  technical direction and engineering standards.

  What you'll do

  - Partner with engineers, product managers and designers to
    architect, build and own a user-facing application.

  - Design intelligent solutions that span back-end and front-
    end systems.

  - Promote sound engineering practices and help shape technical
    strategy and roadmaps.

  - Help define how the team measures success.

  - Initiate, influence and drive technical projects from idea
    through delivery.

  Requirements

  What we're looking for

  - 4+ years of experience building AI products.

  - Experience at a SaaS startup.

  - Proficiency in Python and SQL/Postgres.

  - Experience building AI applications and agents with common
    agent frameworks.

  - Experience working with large language model APIs from
    leading providers.

  - Exposure to containerized deployments and a major cloud
    platform.

  - Professional experience with CI/CD and git.

  - Daily use of AI coding tools.

  - A computer science degree.

  - Comfort with challenging, ambiguous and fast-changing
    problems, and a desire for broad impact as an early team
    member.

  Bonus points

  - Experience monitoring LLM-based systems.

  - Experience training models.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 300,000 per year

  - Equity

  - Relocation support

  Location and work model

  - New York, New York, United States

  - On-site, 5 days per week in office

  - Full-time
