description: |
  About Highlevel

  HighLevel is an AI-powered business operating system that
  gives agencies, entrepreneurs and SMBs the infrastructure to
  build, automate and scale. Today, HighLevel supports SMBs
  across 150+ countries, fueling community-driven growth
  rooted in real customer outcomes. To date, businesses
  operating on HighLevel have generated over $7 billion in
  ecosystem value, demonstrating the impact of shared
  infrastructure at scale. By centralizing conversations,
  automation and intelligence into one system, we help
  businesses move faster, reduce complexity and execute
  efficiently. Behind the platform, HighLevel powers more than
  4 billion API hits and 2.5 billion message events daily.
  With 250 terabytes of distributed data, 250+ microservices
  and over 1 million domain names supported, our architecture
  is built for performance, resilience and long-term
  scalability.

  Our people

  With over 2,000 team members across 10+ countries, HighLevel
  operates as a global, remote-first organization built for
  speed and ownership. We value initiative, clarity and
  execution, creating space for ambitious people to build
  systems that support millions of businesses worldwide. Here,
  innovation thrives, ideas are celebrated and people come
  first, no matter where they call home.

  Our impact

  Every month, HighLevel enables more than 1.5 billion
  messages, 200 million leads and 20 million conversations for
  the more than 1 million businesses we support. Behind those
  numbers are real people building independence, expanding
  opportunity and creating measurable impact. We’re proud to
  be a part of that. Learn more about us on our  YouTube
  Channel or Blog Posts

  About the Role

  We’re looking for a Lead Software Engineer to join our AI
  Studio Team, the group responsible for building AI Studio —
  an AI-based React application builder that generates
  production-ready websites and other React applications from
  natural language, which users can then connect to custom
  domains and publish live to the internet — from prompt-
  driven app generation, component and layout creation,
  automated copy/design generation, real-time preview and
  editing, to one-click deployment across our product
  ecosystem.

  This team owns the intelligence layer that helps millions of
  SMBs build production-ready websites and React applications
  without technical expertise. The AI Studio platform
  orchestrates complex workflows across data processing, LLM-
  powered reasoning, code and component generation, design
  generation, and live deployment to custom domains. With
  millions of applications and billions of visitor
  interactions flowing through our systems, reliability,
  correctness, and performance are mission-critical.

