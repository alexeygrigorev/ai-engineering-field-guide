description: |
  Overview

  About us:

  Founded in 1990, LS Power is a premier development,
  investment, and operating company focused on the North
  American power and energy infrastructure sector, with
  leading platforms across generation, transmission and energy
  expansion solutions. Since inception, LS Power has developed
  or acquired 50,000 MW of power generation, including
  utility-scale solar, wind, hydro, battery energy storage,
  and natural gas-fired facilities. Through its transmission
  business, LS Power Grid, the company built and operates 780+
  miles of high-voltage transmission and 7 transmission
  utilities and has another 375+ miles currently in
  construction or development. LS Power actively invests in
  and scales businesses that are meeting the growing needs of
  the energy expansion, including electric vehicle charging,
  demand response, microgrids, renewable fuels and waste-to-
  energy platforms. Over the years, LS Power has raised more
  than $89 billion in debt and equity capital to support North
  American infrastructure.

  Our Purpose, Mission, & Values:

  Our Purpose is to solve complex energy problems that improve
  the world

  Our Mission is to make lives better by developing a cleaner
  and more reliable energy ecosystem

  Our Values are the willingness to participate in and help
  strengthen our culture of integrity, Innovation, Teamwork,
  and Taking Ownership

  Our People create value and are our Most Valuable asset.  We
  take our values of Integrity, Innovation, Teamwork and
  Taking Ownership seriously and ask candidates to think about
  how they can help us further enhance our culture with their
  specific skillsets, capabilities and experiences.



  Benefits

  We provide our team the opportunity to share their unique
  perspectives, solve new challenges, and continue in their
  career growth. We are committed to supporting employees’
  happiness, healthiness, and overall well-being by providing
  comprehensive benefits that include 100% employer paid
  premium healthcare, paid parental leave and more.

  Compensation

  The salary for this role is $90,000-$130,000. This is the
  range that we in good faith anticipate relying on when
  setting wages for this position. We may ultimately pay more
  or less than the posted range and this range is only
  applicable for jobs to be performed in New York.  This
  salary range may also be modified in the future.

  About the Role:

  As LS Power expands its use of AI and automation across
  business units, we are seeking an Automation Developer to
  serve as an embedded technical resource within a designated
  business unit. In this role, you will work directly with
  business leadership and subject matter experts to identify
  opportunities, build solutions, and deploy tools that
  improve efficiency and decision-making.

  This is a highly hands‑on role for a pragmatic builder who
  can translate business processes into technical solutions,
  select appropriate tools or models, and develop
  production‑ready applications in an enterprise environment.
  You will operate with a high degree of ownership,
  functioning as a dedicated technical resource within the
  business unit, while collaborating with LS Power’s broader
  technology and development community.

  Responsibilities

  What you will do:

  Build & Deploy Automation

  - Design, develop, and maintain automation workflows and
    AI‑enabled tools to improve efficiency and reduce manual
    processes.
  - Leverage large language model (LLM) APIs (e.g., OpenAI,
    Claude) and agentic frameworks to build task‑specific
    applications.
  - Integrate solutions with existing enterprise systems, data
    sources, and SaaS platforms.

  Partner with the Business

  - Translate business needs into technical requirements and
    scalable solutions.
  - Collaborate directly with operators, analysts, and
    leadership to identify high‑impact automation
    opportunities.
  - Provide training and documentation to ensure adoption and
    long‑term maintainability of solutions.

  Collaborate Across LS Power

  - Coordinate with central IT on security reviews, enterprise
    architecture, and governance standards.
  - Partner with developers across business units to share best
    practices, reuse components, and align on development
    standards.
  - Contribute to the evolution of LS Power’s AI governance
    framework and technical ecosystem.

  Qualifications

  We want you on our team because you…

  - Bring hands‑on experience building and deploying automation
    or software solutions in an enterprise environment.
  - Are proficient in Python and/or JavaScript and comfortable
    working across the full development lifecycle.
  - Have experience working with LLM APIs, prompt engineering,
    and building production‑ready integrations.
  - Can independently scope, build, and deploy solutions with
    minimal oversight.
  - Communicate effectively with both technical and
    non‑technical stakeholders.
  - Have experience working with modern development tools,
    including AI‑assisted coding platforms.

  Ideally, you have…

  - 2+ years of professional experience in software development,
    automation, or related technical roles.
  - Experience working with cloud-native data platforms (e.g.,
    Snowflake, Microsoft Fabric).
  - Familiarity with unstructured data pipelines, OCR, or
    intelligent document processing.
  - Experience with retrieval-augmented generation (RAG) or
    agent-based workflows.
  - Exposure to secure software development practices and SDLC
    considerations.
  - Experience with cloud platforms (Azure, AWS, or GCP) and
    enterprise security frameworks.
  - Familiarity with workflow automation platforms (e.g., Power
    Automate).
  - Prior exposure to the energy industry, power markets, or
    asset management environments.
