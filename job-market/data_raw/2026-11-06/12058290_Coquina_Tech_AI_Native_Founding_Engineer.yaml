description: |
  About Coquina

  Coquina connects the public sector with the best technology
  solutions. Our goal is to become the largest provider of
  software to the government in the next 10 years, displacing
  huge, slow & outdated incumbents that do everything
  manually. Our mission is to make our government wildly more
  effective.

  The Role

  We’re hiring a Founding AI-Native Engineer to design and
  implement AI-first business processes on both sides of our
  marketplace. In the coming quarters, this role will also be
  responsible for building, hiring, and managing an
  Engineering team.

  AI is transforming how companies are built. Instead of
  scaling teams with people, we scale with AI agents—making
  software development faster and cheaper. We're looking for
  someone who shares this vision and is eager to create an AI-
  native company that’s lean, fast, and infinitely scalable.

  What We’re Looking For

  - 4+ years of engineering experience
  - Hands-on AI-native development experience (experience with
    tools like Cursor, etc.)
  - High-agency, high-velocity mindset with an exceptional work
    ethic
  - Enthusiasm for building an amazing culture in a fast-moving
    startup
  - Passion for improving the public sector with cutting-edge
    tech

  Why Join Us?

  - Work alongside a small, high-impact founding team (3-4
    people)
  - Build from the ground up and play a pivotal role in shaping
    the company
  - Our team works onsite 5 days a week at our office in Herald
    Square, New York
  - Be part of a mission-driven company poised for massive scale

  While our company is still under the radar, I'm happy to
  share more info about the business model and strategy on a
  call. More background on me, Thomas (Founder):
  https://www.linkedin.com/in/thomasjcsmyth/

  Due to high interest, we may not be able to respond to all
  applicants—but we appreciate your time and will be opening
  more roles soon!
