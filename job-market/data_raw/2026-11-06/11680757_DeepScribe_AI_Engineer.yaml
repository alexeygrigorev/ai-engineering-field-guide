description: |
  About DeepScribe

  DeepScribe is building AI agents to automate and transform
  clinical workflows. Our mission goes beyond note-taking -
  we’re building the operating system for healthcare. From
  clinical trial matching to billing and ambient
  documentation, we’re embedding AI directly into the
  workflows of the most overburdened professionals in the
  world.

  We’ve raised over $60 million in total funding from top-tier
  investors, including Index Ventures and prominent angels
  such as Alexandr Wang (fmr CEO of Scale AI) and Dylan Field
  (CEO of Figma). Our solutions are trusted by some of the
  largest healthcare organizations in the country, including
  The US Oncology Network (the nation’s largest oncology
  network) and Ochsner Health (the largest healthcare system
  on the Gulf Coast).

  About the Role

  We are looking for an AI Engineer to build and ship LLM-
  powered healthcare applications. You’ll have ownership over
  new AI workflows, from prototype to production. Expect to
  ship fast, talk directly to customers, and build systems
  that genuinely reduce clinician burnout.

  This is a deeply technical role that blends ML, product
  thinking, and engineering. You'll build and own production
  services that rely on LLMs, speech models, and medical
  reasoning.

  What you’ll do

  - Develop and own end-to-end AI applications, such as clinical
    trial matching, ambient copilots, billing automation, and
    more.
  - Improve our LLM-powered documentation platform, used daily
    by thousands of clinicians
  - Build and optimize inference pipelines and real-time speech
    recognition systems
  - Collaborate closely with PMs, designers, clinical experts,
    and GTM teams to iterate rapidly and launch high-impact
    features

  About You

  We’re looking for exceptional, top-tier talent to join our
  team.

  - 3+ years building production AI systems, ideally in fast-
    moving environments or as a founder
  - Extensive experience with LLM inference (e.g., OpenAI,
    Anthropic, Llama, etc.)
  - Strong product sense
  - Comfortable working across the stack (frontend, backend,
    etc) to get features shipped
  - Obsessed with speed, ownership, and getting real user
    feedback

  This is a remote position, although Bay Area residents are
  encouraged to work from our SF office.

  Nice to Haves

  - Experience with ASR systems (e.g. Whisper)
  - Experience with EHR integrations (FHIR, HL7) or healthcare-
    specific ontologies
  - Familiarity with SOC-2, HIPAA, or sensitive data pipelines

  Perks and benefits

  $150,000 to $250,000 annual salary. Actual compensation will
  be determined based on factors including but not limited to
  experience, education, skill level, location, and internal
  equity, and may vary from the posted range.

  Meaningful equity stake in the company

  Flexible PTO

  Work from home stipend

  Medical, Dental, Vision, 401K

  About the Team

  At DeepScribe, we value trust, teamwork, and transparency,
  and we’re dedicated to promoting diversity and equity in the
  workforce through inclusive hiring practices. Candidates
  with backgrounds that are underrepresented in the technology
  industry are encouraged to apply.

  In compliance with federal law, all persons hired will be
  required to verify identity and eligibility to work in the
  United States and to complete the required eligibility
  verification form upon hire.

  We’re excited to connect with people who feel inspired by
  our mission to transform medical documentation with AI. As
  part of your application, we ask you to briefly tell us why
  you want to work at DeepScribe. Applications without a
  thoughtful response may not be considered.

  How to use AI during our hiring process

  - When applying: create the first draft of your resume
    yourself, but it’s OK to use AI to help you polish it
  - While preparing: use AI to research DeepScribe, practice
    your answers, or prepare questions for us
  - During live interviews: no AI assistance of any kind unless
    we indicate otherwise. We want to see how you think,
    approach problems, and work through challenges in real
    time.
