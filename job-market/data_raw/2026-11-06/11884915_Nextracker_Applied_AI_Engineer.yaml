description: |
  Job Description:

  Location: Hyderabad

  Experience:

  BS and 5-8 years MS and 3-6 years PhD and 0-3 yea

  Primary Areas: Agentic AI, LLM Application Development,
  Backend Engineering

  Primary Stack: Python, Django/FastAPI, Azure OpenAI, Azure
  AI Foundry, PostgreSQL, Redis, Go, Angular/TypeScript,
  Docker

  ROLE SUMMARY

  Build practical, production-oriented AI applications and
  agentic workflows for Nextpower's engineering and business
  platforms.

  You will develop agents that can understand tasks, use tools
  and APIs, work with enterprise data, produce structured
  outputs, and involve people when approval or review is
  required. You will integrate these capabilities into our
  Python/Django, Go, and Angular/TypeScript platform on Azure.

  The role requires strong software engineering fundamentals
  and a willingness to balance rapid experimentation with
  reliability, security, evaluation, and maintainability.

  KEY RESPONSIBILITIES

  - Design and build agentic AI features using tool/function
    calling, structured outputs, workflow orchestration, state
    management, and human-in-the-loop controls.
  - Integrate agents with APIs, databases, documents, business
    services, and external systems.
  - Select appropriate solutions, including deterministic
    workflows, single-agent solutions, or multi-agent
    orchestration.
  - Build LLM applications using prompt engineering, context
    management, RAG, vector search, and model APIs.
  - Implement asynchronous workflows with retries, timeouts,
    progress tracking, and recovery.
  - Integrate AI capabilities into backend services and expose
    them through clean APIs and user interfaces.
  - Define evaluations and automated tests for accuracy, task
    completion, tool use, reliability, latency, cost, and
    safety.
  - Add guardrails for prompt injection, unauthorized actions,
    data leakage, and unsafe tool use.
  - Add tracing and observability for prompts, model calls,
    retrieval, tool calls, workflow state, errors, latency,
    and cost.
  - Collaborate with product, engineering, QA, security, and
    subject-matter experts to deliver maintainable AI
    capabilities.

  REQUIRED SKILLS

  - Professional software engineering experience.
  - Hands-on experience building an LLM-powered or agentic AI
    application, prototype, or production feature.
  - Strong Python skills with Django, FastAPI, or a similar
    backend framework.
  - Practical understanding of LLM application patterns,
    including tool calling, structured outputs, prompt and
    context management, agent workflows, and RAG.
  - Experience with an LLM or agent framework such as LangGraph,
    LangChain, Semantic Kernel, or similar.
  - Experience integrating APIs, databases, or business services
    into AI workflows.
  - Understanding of REST APIs, asynchronous processing,
    retries, and error handling.
  - Experience with PostgreSQL or MySQL, Redis, and Docker.
  - Understanding of AI evaluation, testing, observability, and
    responsible AI practices.
  - Strong fundamentals in software design, debugging, version
    control, code reviews, and maintainability.

  PREFERRED SKILLS

  - Experience with Azure OpenAI, Azure AI Foundry, or Azure AI
    Search.
  - Experience deploying AI applications to the cloud.
  - Experience with multi-step, asynchronous, or long-running
    agent workflows.
  - Experience with PostgreSQL/pgvector or another vector
    database.
  - Go backend or Angular/TypeScript experience.
  - Familiarity with event-driven systems, queues, workflow
    orchestration, or OpenTelemetry.
  - Experience with AI-assisted development or developer-
    productivity tools.

  SOFT SKILLS

  - Curious, pragmatic, and able to learn rapidly in a changing
    technology area.
  - Strong quality, security, and reliability mindset.
  - Able to choose when agentic AI is appropriate and when
    deterministic logic is preferable.
  - Clear communicator with strong ownership of outcomes.
  - Comfortable working through ambiguity and iterating from
    prototype to production.

  EDUCATIONAL QUALIFICATION

  - Bachelor's or Master's degree in Computer Science,
    Information Technology, Engineering, or a related field.
  - Equivalent practical experience may also be considered.

