title: Senior AI Developer Technology Engineer
company: NVIDIA
location: USA
remote: true
work_type: FULL_TIME
description: |
  We are seeking a Senior AI Developer Technology (DevTech)
  Engineer to accelerate the frontier of generative AI
  training and inference. Our team is the bridge connecting
  the NVIDIA platform with developers worldwide. We dive deep
  into customer projects to accelerate performance, eliminate
  bottlenecks, and partner with a vibrant developer community
  to deliver the best performance on NVIDIA systems.

  If you are passionate about accelerating the world's most
  advanced AI models and want your insights to directly
  influence the future of NVIDIA hardware and software stacks,
  we want you to be on our team.

  What you will be doing:

  - Develop cutting-edge techniques to GPU-accelerate complex
    workloads across state-of-the-art generative AI (including
    LLMs, diffusion models, and multimodal systems), deep
    learning, and machine learning domains.

  - Work directly with key developers to optimize and accelerate
    generative AI training and inference on NVIDIA platform.
    Build and optimize algorithms to deliver the best
    performance, and contribute to training and inference
    frameworks, low-level software libraries, and open-source
    projects.

  - Partner directly with top technical experts in industry and
    academia to perform in-depth analysis and optimization of
    complex AI algorithms on modern CPU and GPU architectures.

  - Shape the design of next-generation hardware, system
    software, libraries, and programming models through tight
    collaboration with NVIDIA’s internal engineering and
    research teams.

  - Share your breakthrough optimization techniques by
    publishing in developer blogs and presenting at industry
    conferences.



  What we need to see:

  - MS in Computer Science, Computer Engineering, or related
    computational field (or equivalent experience).

  - 8+ years of relevant work or research experience in software
    engineering and performance tuning.

  - Programming fluency in C/C++ with a deep understanding of
    algorithms and software development.

  - A background in accelerated computing, with comprehensive
    knowledge of parallel programming, performance analysis
    and optimization.

  - Hands on experience doing low-level performance
    optimizations.

  - Foundational understanding of modern CPU and GPU
    architectures.

  - Good communication and organization skills, with a logical
    approach to problem solving, and prioritization skills.

  Ways to stand out from the crowd:

  - Expertise in the parallelization and performance
    optimization of Large Language Models (LLMs), Diffusion
    Models, and Multimodal Architectures for training and
    inference.

  - Experience with training and inference stacks, serving
    frameworks, pre-training and post-training pipelines.

  - Strong foundation in linear algebra and numerical methods.

  - Continuous learning, proactively keeping up with cutting-
    edge technologies, and adapting to a rapidly evolving
    landscape.



  What's DevTech? We are a global organization whose mission
  is to drive innovation we see in the market towards our
  products. As recognized specialists across many domains, our
  work makes valuable contributions in two important ways. Our
  solutions are at the cutting edge of technology, advancing
  NVIDIA’s leadership in accelerated computing. Our
  discoveries generate findings that benefit the Developer
  Community and provides guidance to our engineering teams to
  help make our products better. NVIDIA's success in the
  advancement and availability of Artificial Intelligence has
  created incredible growth across the Company, and our
  Developer Technology Engineering team has been steadily
  growing to meet the demands for our services.

  #LI-Hybrid

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary ranges for this position are: 184,000
  USD – 287,500 USD for Level 4; and 224,000 USD – 356,500 USD
  for Level 5.

  You will also be eligible for equity and benefits.

  Applications for this job will be accepted at least until
  November 3, 2026.

