description: |
  🚀 About WRITER

  WRITER is the AI platform built for the world’s most
  ambitious marketing and revenue teams, bringing the frontier
  of AI to the people who drive enterprise growth. With
  WRITER, autonomous agents work across the buyer journey,
  continuously executing on market signals and enterprise
  intelligence to grow revenue faster. Every agent action and
  asset is grounded in trust, built on an Enterprise Brain
  that unites brand, product, and company knowledge with
  fiduciary-grade governance and compliance.

  Fortune 500 companies are transforming how they go to market
  with WRITER, including 3 of the top 5 US banks, 2 of the 5
  largest global CPG conglomerates, and 4 of the top 5 US
  healthcare insurers. Founded in 2020, WRITER is backed by
  investors including Insight Partners, ICONIQ, Radical
  Ventures, Premji Invest, Balderton, B Capital, Salesforce
  Ventures, Adobe Ventures, Accenture, Citi Ventures, IBM
  Ventures, WndrCo, and others. Learn more at WRITER.com.

  📐 About the role

  As an AI engineer at WRITER, you'll be at the forefront of
  shaping how enterprises harness superintelligence. This
  isn't just about theory; you'll be building tangible AI
  solutions that power the future of work for hundreds of the
  world's leading companies. Your work will directly impact
  the performance, scalability, and ethical alignment of our
  cutting-edge LLMs and AI agents, enabling businesses to
  unlock unprecedented levels of productivity and innovation
  with AI that is truly grounded in their data.

  This role can be hybrid in our San Francisco, New York City,
  or Seattle hubs. You'll report to the head of AI
  engineering.

  🦸🏻‍♀️ What you'll do

  - Architect, develop, and deploy high-performance, scalable AI
    applications into production environments, ensuring robust
    integrations with our end-to-end platform.
  - Drive the development of intelligent agents and AI-powered
    features, translating complex research into practical,
    impactful solutions for our customers.
  - Collaborate closely with research scientists, data
    scientists, and product managers to define technical
    requirements and deliver features that address critical
    business needs.
  - Contribute to the research and evaluation of emerging AI
    technologies, frameworks, and tools to maintain WRITER's
    leadership in the enterprise generative AI space.
  - Champion responsible AI practices, including bias detection,
    explainability, and safety alignment, making sure our AI
    is trustworthy and ethical.

  ⭐️ What you need

  - 5+ years of professional experience building and deploying
    machine learning or AI systems in a production
    environment.
  - Proficiency in Python and experience with relevant AI/ML
    frameworks such as PyTorch, TensorFlow, or JAX.
  - A strong foundation in machine learning principles, deep
    learning architectures, and natural language processing,
    particularly with large language models.
  - Experience with cloud platforms (e.g., AWS, GCP, Azure) and
    MLOps tools for managing the AI lifecycle.
  - Demonstrated ability to write clean, efficient, and well-
    tested code for scalable software systems.
  - Exceptional problem-solving skills and a passion for
    tackling complex technical challenges with creative AI
    solutions.
  - You Connect by collaborating seamlessly across diverse
    teams, Challenge the status quo to innovate, and Own your
    projects with a commitment to impact and excellence.

  🍩 Benefits & perks (US Full-time employees)

  - Generous PTO, plus company holidays
  - Medical, dental, and vision coverage for you and your family
  - Paid parental leave for all parents (16 weeks)
  - Fertility and family planning support
  - Early-detection cancer testing through Galleri
  - Flexible spending account and dependent FSA options
  - Health savings account for eligible plans with company
    contribution
  - Annual work-life stipends for:
    - Wellness stipend for gym, massage/chiropractor, personal
      training, etc.
    - Learning and development stipend
  - Company-wide off-sites and team off-sites
  - Competitive compensation, company stock options and 401k

  WRITER is an equal-opportunity employer and is committed to
  diversity. We don't make hiring or employment decisions
  based on race, color, religion, creed, gender, national
  origin, age, disability, veteran status, marital status,
  pregnancy, sex, gender expression or identity, sexual
  orientation, citizenship, or any other basis protected by
  applicable local, state or federal law. Under the San
  Francisco Fair Chance Ordinance, we will consider for
  employment qualified applicants with arrest and conviction
  records.

  By submitting your application on the application page, you
  acknowledge and agree to WRITER's Global Candidate Privacy
  Notice.
