  practices. The salary range for this role is ($275,000 -
  $300,000) + equity + benefits. A candidate’s salary is
  determined by various factors including, but not limited to,
  relevant work experience, skills, and certifications.  The
  salary range may differ in other states and may be impacted
  by proximity to major metropolitan cities.

