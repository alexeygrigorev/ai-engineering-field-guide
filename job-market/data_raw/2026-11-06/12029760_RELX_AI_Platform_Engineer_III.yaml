  Systems Engineer III



  Do you enjoy creating efficiencies through automation?

  Would you like to take ownership of implementing successful
  change management?



  About the Business

  LexisNexis Risk Solutions is the essential partner in the
  assessment of risk. Within our Business Services vertical,
  we offer a multitude of solutions focused on helping
  businesses of all sizes drive higher revenue growth,
  maximize operational efficiencies, and improve customer
  experience. Our solutions help our customers solve difficult
  problems in the areas of Anti-Money Laundering/Counter
  Terrorist Financing, Identity Authentication & Verification,
  Fraud and Credit Risk mitigation and Customer Data
  Management. You can learn more about LexisNexis Risk at
  https://risk.lexisnexis.com/



  About the Team:

  Team is tech hub for rest of the organization and hence
  working across multiple domains – US Healthcare, Insurance,
  Government etc. Team primarily works on data extraction,
  manipulation, loading, and analytics using technologies like
  Python, PySpark, Bigdata – HPCC, language ECL, Talend, Azure
  tools (Data Synapse, ADF etc), Power BI, Essbase, OCI, etc.

  About the Role

  As a Systems Engineer III (AI Platform Engineer), you will
  help engineer, operate, and scale enterprise AI platforms
  that enable AI adoption across the organization. You will
  work across Microsoft 365 Copilot, Copilot Studio, Power
  Platform, Azure AI Foundry, enterprise agents, and emerging
  AI technologies to create secure, governed, and automated
  platform foundations required for AI at enterprise scale.
  This role combines AI platform engineering, automation,
  integration, security, and operational governance while
  partnering with teams across Microsoft 365, Enterprise AI,
  Security, IAM, Architecture, ServiceNow, and FinOps.

  Responsibilities

  - Engineer and administer Microsoft 365 Copilot, Copilot
    Studio, Agent 365 and associated enterprise AI services.
    Configure and operate governed environments for enterprise
    AI and agent development.
  - Support the end-to-end lifecycle of AI agents, including
    development, testing, promotion, operation and retirement.
  - Engineer Power Platform Managed Environments, environment
    routing and appropriate access controls and implement and
    maintain DLP policies, connector controls and environment-
    level guardrails.
  - Develop repeatable ALM and deployment patterns for Copilot
    Studio, Power Platform and agent solutions. Build
    automation to reduce manual platform administration and
    improve operational efficiency.
  - Integrate AI platforms with enterprise services using REST
    APIs, Microsoft Graph, OAuth, service principals, managed
    identities, connectors and MCP.
  - Develop automated reporting covering platform health,
    adoption, governance, agent inventory and consumption.
  - Support investigation and remediation of ungoverned,
    orphaned or incorrectly configured AI assets. Produce
    technical documentation, operational procedures and
    reusable engineering standards.
  - Work with Security, IAM and Architecture teams to ensure AI
    platform solutions follow enterprise security and identity
    standards.

  Requirements

  - Experience administering and engineering Microsoft 365
    Copilot, Copilot Studio, Power Platform, Azure AI
    services, or similar enterprise platforms.
  - Knowledge of governed platform operations, access controls,
    security guardrails, and environment management.
  - Experience implementing DLP policies, connector governance,
    and platform controls.
  - Understanding of application lifecycle management (ALM),
    deployment automation, and platform engineering practices.
  - Experience integrating enterprise services using REST APIs,
    Microsoft Graph, OAuth, service principals, managed
    identities, connectors, and MCP.
  - Knowledge of AI platform governance, operational reporting,
    inventory management, and service monitoring.
  - Familiarity with consumption-based services, usage
    reporting, and operational cost controls. Ability to
    create technical documentation, operational standards, and
    engineering procedures.
  - Experience collaborating with Security, IAM, Architecture,
    Service Management, and cross-functional technology teams.

  Certifications:

  - AB-900: Microsoft 365 Copilot and Agent Administration
    Fundamentals
  - Microsoft Certified: Power Platform Fundamentals

