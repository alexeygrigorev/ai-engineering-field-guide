  - Experience designing RAG data flows, including document
    ingestion, preprocessing, storage, retrieval, and response
    grounding.
  - Understanding of data security, access controls, retention,
    and protection of sensitive information used by AI
    applications.

  Preferred

  - Experience with relational and NoSQL databases.
  - Experience with managed vector database services and hybrid
    search.
  - Knowledge of data quality, data lineage, document
    versioning, and source validation.
  - Experience implementing data ingestion and synchronization
    pipelines.

