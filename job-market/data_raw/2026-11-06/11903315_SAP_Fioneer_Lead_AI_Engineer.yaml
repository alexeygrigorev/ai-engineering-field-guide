description: |
  Be Part of Us:

  Innovation is and will always be the core of SAP Fioneer.

  SAP Fioneer builds on a heritage of outstanding technology
  and a deep understanding of corporate and consumer demands.
  At the heart of it all it is simple: We bring financial
  services to the next level with innovative software
  solutions and platforms.

  We are empowering companies in the financial services
  industry to achieve speed, scalability, and cost-efficiency
  through digital business innovation, cloud technology, and
  solutions that cover banking and insurance processes end-to-
  end.

  A global company, with rapid growth, innovative people, and
  a lean organization makes SAP Fioneer a place where you
  accelerate your future!

  About the Role:

  We are seeking an experienced AI Engineer to join our AI
  innovation team and help drive the adoption of AI-powered
  solutions within the banking industry.

  In this role, you will combine hands-on AI engineering with
  customer engagement and solution delivery responsibilities.
  You will work closely with customers -especially in ANZ and
  APAC - to understand business requirements, shape AI use
  cases, and support the successful implementation of AI
  capabilities in real-world banking environments.

  You will also coordinate a small team of AI engineers and
  help ensure timely and high-quality delivery while remaining
  actively involved in solution design and development.

  Key Responsibilities:

  - Design, develop, test, and deploy AI-powered solutions for
    our banking products.

  - Work directly with customers to understand business needs
    and translate requirements into practical AI solutions.

  - Drive customer discussions, workshops, demonstrations, and
    solution reviews throughout the project lifecycle.

  - Coordinate a small team of AI engineers and support the
    planning and execution of development activities.

  - Ensure successful delivery of AI initiatives by aligning
    customer expectations, delivery progress, and product
    capabilities.

  - Contribute hands-on to software development, AI
    implementation, experimentation, and prototyping
    activities.

  - Collaborate closely with product management, engineering
    teams, solution experts, and customer-facing teams.

  - Support the rollout and adoption of AI capabilities at
    customer sites.

  - Identify opportunities for additional AI use cases and help
    customers maximize the value of AI technologies.

  - Stay informed about emerging AI technologies and contribute
    ideas for future product enhancements.

  Requirements

  Job Requirements:

  - Degree in Computer Science, Business Informatics,
    Mathematics, Engineering, or a related field.

  - Several years of experience in software engineering and AI
    solution development.

  - Experience working directly with customers, managing
    requirements, and supporting solution delivery.

  - Strong understanding of Generative AI technologies and
    enterprise AI architectures.

  - Strong programming skills (Python, Java, JavaScript, or
    similar).

  - Experience with cloud-native development and container
    technologies (Azure, AWS, Docker, Kubernetes).

  - Ability to translate business requirements into scalable and
    practical AI solutions.

  - Strong communication and stakeholder management skills.

  - Experience coordinating delivery activities across
    distributed teams.

  - Experience within banking, financial services, or regulated
    industries is a plus.

  - Willingness for regular travel to APAC (in particular
    Australia+ New Zealand) to drive our work with the clients
    in the region.

  Benefits

  Benefits:

  You will have the opportunity to collaborate with some of
  the brightest minds in the industry on an incredibly
  ambitious project to shape the ever-evolving financial
  sector. This is an environment where you can have it all -
  the agility, enthusiasm and dynamism of a start-up, combined
  with the established expertise, solid market presence and
  extensive customer network of a more established
  organisation.

  At SAP Fioneer, you will benefit from a flexible work
  environment that encourages creativity and encourages you to
  think outside the box, bring new ideas to the table, and
  challenge the status quo. You will become part of a diverse
  and global team that we are proud of and are constantly
  growing and reinventing. As an employee, you will have the
  chance to chart your own career path and take advantage of
  competitive compensation packages and progression
  opportunities based on merit.

  Join us for a rewarding career where your needs are not just
  met but exceeded
