description: |
  About thinkbridge

  thinkbridge builds the business systems growing companies
  run on: ERP replacements, connected systems, AI agents
  inside real workflows and modernized legacy software. We
  have built custom software for growing companies for more
  than 12 years.

  Today we deliver every system with thinkOne, our method that
  pairs our experts with our agentic engineering and delivery
  platform. The platform writes much of the code. Our people
  understand the client's business, work out the right
  solution and take it to production. A typical system goes
  live in about four months. Our commitments to clients are
  written into the contract before a build starts.

  Why work at thinkbridge

  - About 80% of the job is thinking and problem solving: the
    rest is building.
  - Our clients stay with us for four to five years on average,
    so
  you get to know their business well.
  - Part of the working week is set aside for learning, so it
  doesn't eat into your evenings.
  - You can move into a different role inside thinkbridge.
  - We are Great Place to Work Certified and have an employee
    NPS
  above 90. See what our people say and the industry firsts
  behind our certification.

  Benefits: Benefits built for remote-first work

  - Work from Chennai Office.
  - Shape your day around your life, as long as the work lands
    on time.
  - Take time off when you need it.
  - A work laptop of your own, set up the way you like it within
    our security guidelines.
  - Weeks when the team gets together in person to work side by
    side.
  - Learning time in working hours, and paid certifications.

  Five values guide how we build for clients and how we work
  with each other: Outcomes, Quality, Accountability,
  Communication and Care.

  In practice:

  - We take software to
  production.
  - We check our work before
  anyone else has to.
  - We stand by our
  commitments.
  - We keep people informed
  in plain language.
  - We treat a problem as
  ours to solve.

  We hire curious people who own the outcome.Meet the team
  that leads thinkbridge.

  Requirements

  About Role

  Job Location - Chennai

  We are looking for an AI-Native Product Engineer -
  Generalist with 0-2 Years of experience someone who is a
  highly motivated early-career engineer with strong
  programming and problem-solving skills. The ideal candidate
  can build end-to-end software solutions across frontend,
  backend, APIs, and integrations, while effectively
  leveraging AI-assisted development tools to accelerate
  delivery, drive innovation, and take ownership from concept
  to deployment.

  What You'll Do

  As part of the job

  - Programming and problem-solving foundations; can read,
    modify and explain ordinary software code.
  - Practical understanding of APIs, relational or document
    databases, Git and tests.
  - Ability to build useful applications with AI tools while
    checking and correcting generated output.
  - Comfort learning an unfamiliar codebase and breaking an
    unclear requirement into testable steps.
  - Strong communication, curiosity and follow-through.

  Requirements:

  Must have technical skills  

  - 0-2 years of software engineering experience (internships,
    academic projects, and personal projects considered).
  - Strong programming and problem-solving fundamentals.
  - Python or TypeScript, APIs, Git, and basic testing.
  - Experience with LLMs, agent frameworks, and AI coding tools

  Strong differentiators

  - Built personal AI projects, experimented with agent
    workflows, evaluated LLM outputs, or demonstrated
    exceptional problem-solving and learning agility.

