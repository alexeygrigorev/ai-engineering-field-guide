description: |
  At Gilead, we’re creating a healthier world for all people.
  For more than 35 years, we’ve tackled diseases such as HIV,
  viral hepatitis, COVID-19 and cancer – working relentlessly
  to develop therapies that help improve lives and to ensure
  access to these therapies across the globe. We continue to
  fight against the world’s biggest health challenges, and our
  mission requires collaboration, determination and a
  relentless drive to make a difference.


  Every member of Gilead’s team plays a critical role in the
  discovery and development of life-changing scientific
  innovations. Our employees are our greatest asset as we work
  to achieve our bold ambitions, and we’re looking for the
  next wave of passionate and ambitious people ready to make a
  direct impact.


  We believe every employee deserves a great leader. People
  Leaders are the cornerstone to the employee experience at
  Gilead and Kite. As a people leader now or in the future,
  you are the key driver in evolving our culture and creating
  an environment where every employee feels included,
  developed and empowered to fulfill their aspirations. Join
  Gilead and help create possible, together. Job Description


  Job Responsibilities

  - Own the end-to-end development of enterprise-grade full-
    stack applications with embedded AI/ML and Generative AI
    capabilities delivering scalable and intelligent digital
    products.
  - Design build and maintain modern front-end applications
    back-end services APIs databases and cloud-native
    platforms with significant hands-on coding responsibility.
  - Develop and integrate LLM-powered solutions RAG
    architectures AI agents machine learning models and
    intelligent automation workflows into business-critical
    applications.
  - Engineer secure scalable and high-performing microservices
    and distributed systems while ensuring reliability
    maintainability and operational excellence.
  - Partner closely with product managers data scientists
    architects and business stakeholders to translate complex
    requirements into innovative technical solutions.
  - Drive engineering excellence through hands-on development
    code reviews automated testing performance tuning and
    implementation of secure coding practices.
  - Build and support CI/CD pipelines cloud deployments
    infrastructure automation observability and production
    operations to enable rapid and reliable software delivery.
  - Leverage modern technology stacks including cloud services
    AI platforms vector databases and enterprise integration
    frameworks to accelerate solution delivery.
  - Provide technical leadership and mentoring while remaining
    deeply involved in architecture design development
    troubleshooting and delivery of production-quality
    software.

  Skills and Experience

  - 7+ years of experience in full-stack or AI-focused software
    engineering roles with Bachelor’s degree in Computer
    Science, Engineering or related field, 5+ years with
    Master’s degree.
  - Proficiency in modern front-end frameworks, back-end
    technologies, APIs, databases, and cloud-native
    application development
  - Expertise in integrating AI/ML or GenAI capabilities into
    enterprise applications
  - Strong understanding of scalable application architecture,
    microservices, and secure coding practices
  - Experience with cloud platforms, containers, CI/CD
    pipelines, and agile development methodologies
  - Strong problem-solving, debugging, and collaboration skills
    within global teams

  - Experience in pharmaceuticals, healthcare, or regulated
    industries preferred
  - Familiarity with LLM orchestration frameworks, vector
    databases, and AI application architectures
  - Exposure to MLOps, observability, and AI model deployment
    practices would be a plus
  - Experience building data-intensive or analytics-driven
    enterprise platforms desirable
  - Relevant certifications in cloud, AI/ML, or full-stack
    engineering technologies preferred



