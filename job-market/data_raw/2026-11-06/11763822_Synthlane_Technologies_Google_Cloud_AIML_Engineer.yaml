description: |
  About the role



  Synthlane builds AI solutions on Google Cloud for Google
  partners and their clients in North America. These clients
  want AI that works in production, on their own data, within
  strict security rules. You will design, build and run those
  systems end to end.



  What strong looks like here



  - You understand ML from first principles, and you know which
    approach fits which problem.
  - You measure quality with real evaluations, and you judge
    each change by the numbers.
  - You take AI systems from prototype to reliable production.
  - You write clean, tested Python.
  - You know enough about cloud networking and security to keep
    data and models inside their boundaries.
  - You explain AI trade-offs clearly to clients, and you take
    ownership of the outcome.



  Experience



  - 3–10 years of software or ML engineering, with production AI
    work on Google Cloud. We value depth over years.
  - 6 hours of overlap with North American Eastern time.



  Nice to have



  - A Google Cloud certification in ML or AI.



  You will enjoy this role if



  - You like turning an AI demo into a reliable product.
  - You want your work used by real clients, every day.



  What you get



  - Direct work on Google-referred projects, alongside Google
    Cloud teams.



  Type: Remote, contract or full time.



  This is a remote position.
