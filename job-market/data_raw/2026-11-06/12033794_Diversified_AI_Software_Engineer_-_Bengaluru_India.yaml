description: |
  About Diversified:

  Diversified is a global leader in audio visual and media
  innovation, recognized for designing and building the
  world’s most experiential environments. Our award-winning
  team specializes in delivering solutions for the most
  complex, large-scale and immersive installations. Serving a
  global clientele that includes major media organizations and
  retailers, sports and live performance venues, corporate
  enterprises, and government agencies, Diversified partners
  with clients to create spaces that bring people together and
  keep them coming back.

  What to Expect:

  At Diversified, we're on a mission to create a world without
  boundaries, where technology enables all people to connect
  and experience the moments that matter, wherever they choose
  to be.  With clients spanning the globe and an exciting
  pipeline of projects across industries, Diversified offers
  more than just a job. We offer a career path with the
  flexibility to grow personally and professionally, wherever
  your ambitions take you.

  As a Diversified associate, you'll dive headfirst into big,
  complex, and rewarding projects that push the boundaries of
  what's possible. Plus, you'll enjoy a flexible work
  environment, competitive compensation and benefits, and a
  culture that celebrates diversity and inclusion.

  IF YOU CAN DREAM IT, YOU CAN DO IT AT DIVERSIFIED.

  We are seeking an AI Engineer to lead the development and
  adoption of internal AI-powered solutions that improve
  employee productivity, automate business processes, and
  drive innovation. This role will partner with business and
  technology teams to identify opportunities, define product
  roadmaps, and deliver AI solutions using tools across the
  business. This position sits within the internal IT team
  working alongside the Lead Engineer and Platform team, with
  direct exposure to the CIO and AI Council.

  Key Responsibilities

  - Own the vision, roadmap, and backlog for internal AI
    products and solutions.
  - Lead the implementation of AI, automation, and Generative AI
    solutions for Enterprise Platforms
  - Build agentic workflows, prompt engineering and evaluation
    pipelines, agent orchestration layer, LLM gateway
    integration, RAG pipelines and model evaluation and
    monitoring
  - Identify and prioritize AI use cases that deliver measurable
    business value.
  - Partner with the AI Council and business stakeholders to
    gather requirements and define product features.
  - Collaborate with architects, developers, data engineers, and
    business teams.
  - Monitor solution performance, usage, and business outcomes.
  - Ensure AI solutions comply with security, privacy, and
    governance standards.
  - Evaluate emerging AI technologies and recommend future
    capabilities.

  Qualifications

  - Bachelor's degree in Computer Science, Information
    Technology, Data Science, Engineering, or related field.
  - 5+ years of experience in technology, product management,
    business systems, AI, or digital transformation.
  - Experience with building Enterprise AI platforms and Agentic
    workflows
  - Strong understanding of Agile methodologies and product
    ownership practices.
  - Excellent stakeholder management and communication skills.

  Key Skills

  - AI & Generative AI Solutions
  - Agentic workflows and frameworks such as LangChain, Mastra,
    or similar
  - Azure AI Services, Azure OpenAI, Anthropic, and others
  - RAG pipelines and Graphs
  - Product Ownership & Roadmap Management
  - Business Process Automation
  - Requirements Gathering
  - Change Management
  - Stakeholder Engagement
  - Agile Project Delivery

  Why Join Us?

  Help shape the future of work by building AI solutions that
  transform how our employees collaborate, make decisions, and
  serve our customers. This role offers the opportunity to
  lead enterprise AI initiatives and influence the
  organization's AI strategy.



  What We Offer:

  Along with competitive compensation, you will be eligible
  for the following benefits:

  - Multiple medical plan for self and family
  - Company paid Basic Life, AD&D, Short-Term and Long-Term
    Disability Insurance, and Employee Assistance Plan (EAP)
  - Paid Time Off and Paid Holidays
  - Commuter & Shift Benefits (US / APAC shifts)

  To learn more about becoming part of the Diversified team,
  visit us at https://onediversified.com/careers/careers-at-
  diversified  or email us at careers@onediversified.com.



  Diversified is an equal opportunity employer committed to
  fostering an inclusive and diverse workplace. All aspects of
  employment will be based on job requirements, individual
  qualifications, merit, performance, and business need.



  We do not discriminate based on race, color, religion, sex,
  national origin, age, disability, veteran status, sexual
  orientation, gender identity, or any other protected
  characteristic under applicable law.



  We believe in fair and equitable hiring practices and strive
  to create an environment where all individuals feel valued
  and empowered.
