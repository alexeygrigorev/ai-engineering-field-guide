description: |
  Job Description

  We are seeking a hands-on AI & Automation Developer to
  identify, design, build, deploy, and scale solutions that
  modernize existing legacy BASES reports, operational
  processes, and workflows. The role will reduce repetitive
  manual effort, improve speed and quality, and create
  reusable digital capabilities for Innovation.

  The successful candidate will combine strong Python
  engineering with practical experience in Large Language
  Models (LLMs), data processing, APIs, workflow automation,
  and analytics. This person will work end to end, from
  understanding current processes and quantifying
  opportunities through development, production deployment,
  user adoption, and measurement of realized business value.

  Key Responsibilities

  Process Assessment and Solution Design

  - Understand existing Innovation reports and processes and
    partner with stakeholders to identify pain points,
    repetitive activities, quality issues, and automation
    opportunities.
  - Identify and prioritize automation opportunities based on
    business value, feasibility, risk, and reuse potential.
  - Translate business requirements into practical technical
    solutions and clear delivery plans.

  Development, Deployment, and Support

  - Develop Python-based automations, data-processing workflows,
    APIs, and scheduled solutions for legacy reports and
    processes.
  - Build LLM-powered solutions for relevant use cases such as
    extraction, summarization, classification, knowledge
    retrieval, and recommendation generation.
  - Integrate solutions with existing tools, files, databases,
    APIs, and cloud services while maintaining quality,
    security, and auditability.
  - Deploy, document, monitor, and support solutions in
    production, and create reusable components that can be
    scaled across ARC.
  - Work with stakeholders to drive adoption and measure
    improvements in effort, cycle time, quality, and
    reliability.

  Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field; Master's degree is a plus.
  - 5+ years of relevant experience in software development,
    automation engineering, data engineering, analytics
    engineering, AI solutions, or a comparable technical role.
  - Demonstrated experience delivering automation or AI
    solutions into production and supporting them after
    release.

  Must-Have Skills

  - Strong hands-on proficiency in Python, including object-
    oriented programming, data processing, reusable package
    design, and maintainable coding practices.
  - Practical experience building applications or automations
    using Large Language Models (LLMs), including prompt
    design, grounding, evaluation, and safe use of model
    outputs.
  - Experience with structured and unstructured data, data
    modeling, SQL, and common Python data libraries such as
    Pandas or Polars.
  - Experience designing and consuming REST APIs and integrating
    multiple systems and data sources.
  - Ability to automate legacy reports and operational processes
    while preserving business rules, controls, quality, and
    auditability.
  - Experience with Git, code reviews, testing frameworks such
    as Pytest, CI/CD practices, logging, exception handling,
    and production support.
  - Working knowledge of cloud-based solutions, preferably
    Microsoft Azure, and enterprise AI services such as Azure
    OpenAI.
  - Strong analytical, debugging, and problem-solving skills,
    with the ability to convert ambiguous business needs into
    practical solutions.
  - Clear stakeholder communication, documentation, ownership,
    and prioritization skills.

  Good-to-Have Skills

  - Experience with RAG, vector databases, semantic search,
    LangChain or comparable orchestration frameworks.
  - Experience with workflow and low-code automation platforms
    such as Power Automate, and analytics tools such as Power
    BI.
  - Familiarity with Infrastructure as Code (Terraform, Pulumi).
  - Knowledge of SQL and NoSQL databases, distributed systems,
    microservices, and event-driven architecture.
  - Exposure to Docker, Kubernetes, infrastructure as code, and
    observability tools.
  - Experience with AI-assisted development tools such as GitHub
    Copilot and with Agile/Scrum delivery practices.
  - Familiarity with responsible AI, privacy, access controls,
    data governance, and security requirements in enterprise
    environments.

  Candidate Profile

  The ideal candidate is a product-minded, hands-on builder
  who combines technical depth with business curiosity. They
  are comfortable working with existing legacy environments,
  understand that automation must be reliable and supportable,
  and focus on reusable architecture rather than isolated
  scripts. They can independently move a solution from
  opportunity discovery to adoption while maintaining strong
  partnerships with stakeholders.

