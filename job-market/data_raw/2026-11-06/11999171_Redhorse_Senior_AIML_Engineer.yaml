description: |
  About the Organization

  Now is a great time to join Redhorse Corporation. We are a
  solution-driven company delivering data insights and
  technology solutions to customers with missions critical to
  U.S. national interests. We’re looking for thoughtful,
  skilled professionals who thrive as trusted partners
  building technology-agnostic solutions and want to apply
  their talents supporting customers with difficult and
  important mission sets.

  About the Role

  Redhorse transforms the way government uses data and
  technology. To support this mission, we are seeking an
  Artificial Intelligence (AI)/Machine Learning (ML) Engineer
  to support Condition-Based Maintenance Plus (CBM+)
  initiatives that improve aircraft sustainment and optimize
  maintenance and logistics for the United States Air Force
  (USAF).

  In this role, you will serve as a key architect in the CBM+
  ecosystem, bridging the gap between cutting-edge development
  and operational deployment. Working within cross-functional
  teams in an Agile environment, you will translate complex
  predictive models into production-grade systems that
  directly enhance fleet readiness and sustainment efficiency.
  This is a unique opportunity to operate at the intersection
  of aerospace logistics and advanced MLOps, delivering high-
  impact solutions for our nation's defense.

  Key Responsibilities

  Required Experience/Clearance

  Desired Experience

  - Ph.D. in a STEM field, with a preference for Data Science,
    Data Analytics, or Computer Science.
  - Advanced expertise applying artificial intelligence and
    machine learning (AI/ML) to predictive maintenance,
    condition-based maintenance, or defense logistics
    challenges.
  - Direct experience developing sensor-based failure prediction
    models and equipment health indicators.
  - Practical experience conducting Monte Carlo simulations and
    calculating statistical confidence intervals.
  - Demonstrated expertise in end-to-end data pipeline
    engineering, including customer-facing UI/UX integration.
  - Prior experience supporting defense aviation data
    environments or DoD enterprise systems.

  The salary range provided for this position represents the
  anticipated base salary for successful candidates. Actual
  compensation will be determined based on a variety of
  factors, including relevant experience, education,
  certifications, skills, security clearance level, geographic
  location, market conditions, and internal equity. In
  addition to base salary, eligible employees may participate
  in Redhorse's comprehensive benefits programs and may be
  eligible for performance-based or other incentive
  compensation, where applicable.



