description: |
  Job Title: AI Application Engineer

  Johnson Controls International (JCI) is seeking AI
  Application Modernization Engineer to join our Digital
  Transformation team. This role is ideal for an experienced
  software engineer with deep expertise in legacy application
  modernization, AI-assisted software development, and
  Microsoft cloud technologies.

  As AI Application Modernization Engineer, you will lead the
  transformation of mission-critical business applications
  built on VB6 front-end technologies and IBM i (AS400)
  platforms, including Synon, RPG, RPGLE, and CLP. You will
  leverage AI and Generative AI technologies to accelerate
  code conversion, application modernization, testing,
  documentation, and deployment to modern Microsoft platforms.

  You will play a critical role in reducing technical debt,
  improving application maintainability, and accelerating
  JCI's digital transformation strategy through scalable,
  cloud-ready solutions.

  How you will do it

  AI-Powered Application Modernization

  - Hands on application development to modernization of legacy
    applications built using VB6, Synon, RPG, RPGLE, CLP, and
    IBM i (AS400) technologies.
  - Utilize Generative AI, GitHub Copilot, Azure OpenAI, and AI-
    assisted development tools to accelerate code analysis,
    conversion, testing, and documentation.
  - Design and execute migration strategies from legacy
    platforms to modern Microsoft technologies.
  - Develop reusable modernization frameworks, patterns, and
    best practices for enterprise-scale application
    transformation.

  Microsoft Development & Cloud Engineering

  - Design and develop modern business applications using
    Microsoft technologies including C#, .NET 8+, ASP.NET
    Core, and .NET MAUI.
  - Modernize desktop applications into cloud-enabled and cross-
    platform solutions within the Microsoft ecosystem.
  - Design API-first architectures and service-based
    integrations using Azure services.
  - Collaborate with enterprise architects, infrastructure
    teams, and business stakeholders to deliver secure and
    scalable solutions.

  AI Strategy & Engineering Excellence

  - Identify opportunities to apply AI and Generative AI to
    improve software engineering productivity and
    modernization outcomes.
  - Lead proof-of-concepts and pilots demonstrating AI-driven
    modernization capabilities.
  - Establish engineering standards, governance, and best
    practices for AI-assisted application development.
  - Mentor development teams on modernization approaches, AI
    tools, and Microsoft development platforms.

  Qualifications & Experience

  - Bachelor’s degree in computer science, Software Engineering,
    Information Technology, or related discipline.
  - 5+ years of software development experience.
  - 5+ years of experience with VB6 application development and
    maintenance.
  - Proven experience modernizing legacy applications to
    Microsoft technologies.
  - Experience delivering large-scale application modernization
    or migration programs.
  - Hands-on experience using AI-assisted software development
    tools and Generative AI technologies.
  - Experience working with enterprise business-critical
    applications and complex integrations.

  Technical Expertise

  Front-End Technologies - Visual Basic 6 (VB6), C#, .NET
  Framework, .NET 8+, ASP.NET Core, .NET MAUI, WinUI, WPF,
  XAML, HTML5, JavaScript

  Back-End Technologies

  Synon (CA 2E), RPG, RPGLE, CLP, IBM i / AS400, DB2, SQL
  Server, Stored Procedures, API Development

  AI & Modernization Technologies

  Azure OpenAI, GitHub Copilot Enterprise, Microsoft Copilot,
  Azure AI Services, AI-assisted code conversion tools, Prompt
  Engineering, Retrieval-Augmented Generation (RAG)

  Cloud & DevOps

  Microsoft Azure, Azure DevOps, GitHub, Azure App Services,
  Azure Functions, Azure API Management, Power Platform, CI/CD
  Pipelines

  Preferred Qualifications

  - Experience converting VB6 applications to .NET MAUI, WinUI,
    or modern Microsoft technologies.
  - Experience modernizing Synon, RPG, RPGLE, or AS400
    applications.
  - Experience with Azure-based application modernization
    programs.
  - Knowledge of enterprise architecture, application
    rationalization, and technical debt reduction strategies.
  - Experience within manufacturing, industrial, or enterprise
    ERP environments.
  - Microsoft Azure certifications preferred.

  Ideal Candidate: An engineer who has successfully delivered
  VB6 and AS400 modernization programs and has leveraged AI
  technologies to accelerate application conversion to modern
  Microsoft platforms such as .NET, MAUI, Azure, and Power
  Platform.
