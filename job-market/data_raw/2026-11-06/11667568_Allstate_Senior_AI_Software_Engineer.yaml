description: |
  At Allstate, great things happen when our people work
  together to protect families and their belongings from
  life’s uncertainties. And for more than 90 years, our
  innovative drive has kept us a step ahead of our customers’
  evolving needs. From advocating for seat belts, air bags and
  graduated driving laws, to being an industry leader in
  pricing sophistication, telematics, and, more recently,
  device and identity protection.

  Job Description

  About Law & Regulations Law & Regulations delivers expert
  legal services that protect Allstate and its customers while
  ensuring compliance with evolving regulatory and ethical
  standards. We provide comprehensive support across claims
  litigation, complex corporate transactions, and enterprise-
  wide compliance programs, enabling the business to
  confidently navigate today's legal landscape. By leveraging
  innovative legal strategies, modern technology, and emerging
  AI capabilities, we promote seamless collaboration,
  proactive risk management, intelligent decision-making, and
  effective problem solving across the organization. We
  demonstrate our core values through integrity,
  accountability, collaboration, and excellence. We are
  trusted legal advisors who place the needs of our customers
  and business partners at the heart of everything we do. We
  value each other, seek feedback, and take meaningful action
  to continuously improve. As our legal technology ecosystem
  evolves, we embrace Generative AI, intelligent automation,
  and data-driven innovation to enhance operational
  efficiency, knowledge management, and service delivery while
  maintaining the highest standards of governance, security,
  privacy, and responsible AI. Our collective success is
  enabled by collaboration across all areas of responsibility
  within Allstate and by upholding the legal and ethical
  foundation that drives business performance. What We Deliver
  Exceptional Legal Support: Expert counsel and representation
  that safeguard Allstate's interests and support our
  customers. Compliance & Ethical Governance: Oversight of
  enterprise-wide privacy, regulatory compliance, and ethics
  programs. Innovative Legal Operations: Use of agile
  processes, Generative AI, and modern technologies to enhance
  operational efficiency, knowledge discovery, and service
  delivery. Job Summary The AI Software Engineer designs,
  develops, deploys, and supports secure AI-powered enterprise
  applications, intelligent automation solutions, and system
  integrations that enable critical business operations.
  Working across backend services, frontend experiences,
  cloud-native architectures, and AI engineering, this role
  delivers scalable, reliable solutions to complex business
  challenges. The ideal candidate combines software
  engineering expertise with hands-on experience in Generative
  AI, Large Language Models (LLMs), Retrieval-Augmented
  Generation (RAG), Agentic AI frameworks, and cloud-native
  technologies. This role includes ownership of technical
  solutions, participation in architectural discussions, and
  collaboration with business, legal, and technology teams to
  deliver innovative AI-driven products while adhering to
  governance, compliance, privacy, and security standards.

  Key Responsibilities

  ·    Design, develop, and maintain backend services and APIs
  using modern frameworks (e.g., Java Spring Boot, Node.js, or
  Python FastAPI).

  ·    Integrate and deploy Generative AI models (e.g.,
  OpenAI, Hugging Face, LangChain) into production
  environments.

  ·    Design and implement solutions leveraging LLMs,
  Generative AI, Agentic AI, and Retrieval-Augmented
  Generation (RAG) architectures.

  ·    Fine-tune and optimize LLMs for specific use cases.

  ·    Collaborate with product managers, architects, and
  cross-functional teams to define technical solutions and
  deliver business outcomes.

  ·    Integrate AI/ML services and APIs into enterprise
  applications while following engineering and security best
  practices.

  ·    Develop intelligent automation solutions that improve
  productivity, user experience, and operational efficiency.

  ·    Troubleshoot, optimize, and enhance application
  performance, scalability, and reliability.

  ·    Contribute to technical documentation, architecture
  discussions, and continuous improvement initiatives.

  ·    Deploy and manage applications on cloud platforms,
  preferably Microsoft Azure.

  ·    Participate in Agile ceremonies, including daily
  standups, sprint planning, backlog refinement, and
  retrospectives.

  ·    Actively contribute to software development efforts by
  writing, reviewing, and maintaining high-quality, scalable,
  and secure code.

  Required Skills

  ·    3+ years of software development experience using
  Python and/ or Java Spring Boot.

  ·    Experience working with Generative AI APIs and/or open-
  source models.

  ·    Experience with LangChain, LLM orchestration, or RAG
  (Retrieval-Augmented Generation) pipelines.

  ·    Familiarity with prompt engineering, embedding models,
  or vector databases. 

  ·    Strong understanding of RESTful APIs, microservices
  architecture, and asynchronous processing.

  ·    Knowledge of web and API security frameworks.

  ·    Experience with relational databases NoSQL databases
  (MongoDB, DocumentDB), vector databases, Kafka, caching, and
  Kubernetes.

  ·    Strong communication, collaboration, and problem-
  solving skills.

  ·    Ability to manage multiple priorities and contribute
  effectively within a cross-functional team.

  Preferred Skills:

  ·    Exposure to multi-modal AI systems and agentic AI
  frameworks.

  ·    Exposure to MLOps and model deployment workflows.

  ·    Experience with Docker, Kubernetes, and CI/CD
  pipelines.

  ·    Experience with cloud platforms (Azure, AWS or GCP).

  ·    Knowledge of frontend frameworks like React or Angular.

  Experience

  ·    4 or more years of experience

  Skills

  Cloud Platforms: Microsoft Azure (Azure OpenAI Service,
  Azure AI Search, Azure Machine Learning, ADLS), AWS

  Containerization & Orchestration: Kubernetes, Docker, AWS
  EKS, Linux

  Programming: Java, Spring Boot, Python,
  JavaScript/TypeScript, React

  DevOps & Automation: Jenkins CI/CD, MLOps, Pipeline
  Orchestration

  Data & Databases: SQL Server, MongoDB, DocumentDB, Vector
  Databases

  AI/ML & LLM Technologies: Azure OpenAI, LangChain, Semantic
  Kernel, Agentic AI Frameworks, LLMs, Prompt Engineering, RAG

  Professional Skills: AI Application Development, Full Stack
  Development, Problem Solving, Collaboration, Agile
  Development, Communication

  Skills

  Cloud Computing, Computer Science, Continuous Integration
  Software, LLM Architecture, Software Implementations, Web
  Development

  Compensation

  Compensation offered for this role is 90,700.00 - 153,925.00
  annually and is based on experience and qualifications.

  The candidate(s) offered this position will be required to
  submit to a background investigation.

  Joining our team isn’t just a job — it’s an opportunity. One
  that takes your skills and pushes them to the next level.
  One that encourages you to challenge the status quo. One
  where you can shape the future of protection while
  supporting causes that mean the most to you. Joining our
  team means being part of something bigger – a winning team
  making a meaningful impact.

