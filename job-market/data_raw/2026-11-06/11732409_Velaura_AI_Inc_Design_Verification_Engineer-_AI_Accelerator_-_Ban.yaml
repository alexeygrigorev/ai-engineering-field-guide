description: |
  Role Overview

  We are looking for talented Design Verification Engineers to
  help verify and deliver Velaura's next generation Physical
  AI SoC. You will work closely with architects, RTL
  engineers, software engineers and system teams to establish
  confidence in the correctness, performance, reliability and
  safety of the design, from individual RTL blocks through
  complete hardware and software systems running real
  workloads.

  This role focuses on our AI acceleration units. We are
  designing custom compute engines from scratch to deliver
  industry leading inference performance at best in class
  energy efficiency, and every gain has to come inside a tight
  power envelope. You will own verification of the hardware
  that makes those numbers real, where correctness means
  numerical behavior as much as protocol.

  Why Velaura?

  Velaura is building next-generation compute technology for
  cloud, edge, and Physical AI. Our solutions will enable
  robots, autonomous systems, drones, and other intelligent
  machines to operate efficiently in the physical world. This
  is an opportunity to help build foundational technology at a
  time when the industry is undergoing fundamental change. You
  will work alongside experienced leaders, architects,
  engineers, and operators who have delivered industry-
  defining products across mobile, cloud, semiconductor, and
  AI platforms. If you enjoy solving difficult problems,
  working across disciplines, and helping shape the future of
  Physical AI, we would love to hear from you.

  Equal Employment Opportunity and Accommodations

  Velaura is an Equal Opportunity Employer that is committed
  to inclusion and diversity. Qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, national origin, gender, sexual
  orientation, gender identity, disability or protected
  veteran status. We also take affirmative action to offer
  employment opportunities to minorities, women, individuals
  with disabilities, and protected veterans.

  Velaura is committed to working with qualified individuals
  with physical or mental disabilities. Applicants who would
  like to contact us regarding the accessibility of our
  website or who need special assistance or a reasonable
  accommodation for any part of the application or hiring
  process may contact us at: careers@velaura.ai. This contact
  information is for accommodation requests only. Evaluation
  of requests for reasonable accommodation will be determined
  on a case-by-case basis.
