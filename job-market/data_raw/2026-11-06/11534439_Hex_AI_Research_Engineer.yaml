description: |
  About Hex

  Hex is growing our team of builders on a mission to make
  everyone a data person. Our platform solves key pain points
  with today’s data and analytics tooling, and empowers anyone
  to explore data using natural language, with or without
  code, on trusted context. Thousands of customers like Ramp,
  Figma, Stubhub, Anthropic, and Gamma love Hex for our
  beautiful UI, agentic superpowers, and boundless
  flexibility.

  Hex has raised over $100M from leading investors like
  Sequoia, a16z, Snowflake and Amplify. With office hubs in
  San Francisco and New York, as well as remote team members
  throughout the US and UK, we’re a high-agency team that
  ships fast and has fun doing it. Check out our Intro to Hex
  video and employee handbook to learn more about what it’s
  like to work at Hex.

  About the role

  Hex is an AI-powered platform for modern Data Science and
  Data Analytics workflows. AI Research Engineers at Hex
  partner with product teams to build industry-leading AI
  experiences such as the Notebook Agent. In the process, AI
  Research Engineers will run experiments, fine-tune models,
  deploy AI infrastructure, and build and maintain
  experimentation tooling.

  As an AI Research Engineer partnered with Hex's product
  teams, your focus will be driving Hex's context engine and
  pushing forward the capabilities of our Notebook Agent.
  Built for people doing the most complex and impactful data
  work in an organization, the Notebook Agent is a highly
  technical data copilot that writes SQL and python, builds
  beautiful reports and visualizations, and collaborates with
  the analyst on new avenues of inquiry. Whether its pushing
  the frontiers of SQL generation quality or using LLMs to
  evaluate agent threads, your job will be to enable the data
  teams that work in Hex to build out highly accurate and
  curated data experiences for their stakeholders, unlocking
  the power of data driven decisions for the rest of the
  business.

  If you’re a strong builder excited to bring these
  capabilities to thousands of users, come do it on the best
  Data Science platform around, with the best user context.

  We are looking for a senior engineer (from an AI Eng, SWE or
  MLE background) eager to rapidly expand our capabilities in
  several greenfield applications. As one of our team’s early
  hires, you will work on a variety of initiatives including:

  - Building features and experiences from 0 to 1
  - Partnering on determining the architecture and stack for our
    AI-enabled capabilities
  - Shipping product experiences that fundamentally change the
    way that Data Scientists and Analysts operate
  - Working at the cutting edge of production AI applications

  This type of ownership will provide incredible opportunities
  for personal and professional growth. You will have ample
  technical and team leadership opportunities, depending on
  your interests.

  We aim to deliver AI capabilities that radically accelerate
  and augment the data science workflow – we’ve got an
  exciting roadmap and are willing to share more details
  during the process. We’re particularly interested in
  candidates who bring inspired excitement about what is
  possible in this space.

  We'd love to hear from you if you have:

  - Experience getting AI/ML capabilities into production and
    serving real users – we’re not currently looking for new
    grad folks.
  - A lot of enthusiasm for applications of AI to real business
    problems.
  - Understanding of core MLOps/SW Architecture concepts for
    modern ML-based applications.
    - Ideal candidates are strong on Infra aspects of MLOps as
      well.
  - You’re comfortable working in both Python & JS/TS – it’s
    okay if you’re only strong in one, but openness to both is
    important.
  - Experimentalist mindset – understanding that quick
    iteration, and discerning critical thinking, can yield
    rapid progress on new challenges.
  - Interest in the data space, and a love of shipping great
    products and building tools that empower end users to do
    more.
  - Experience maintaining a high quality bar for design,
    correctness, and testing.

  Our stack

  Our product is a web-based notebook and app authoring
  platform. Our frontend is built with Typescript and React,
  using a combination of Apollo GraphQL and Redux for managing
  application state and data. On the backend, we also use
  Typescript to power an Express/Apollo GraphQL server that
  interacts with Postgres, Redis, and Kubernetes to manage our
  database and Python kernels. Our backend is tightly
  integrated with our infrastructure and CI/CD, where we use a
  combination of Terraform, Helm, and AWS to deploy and
  maintain our stack.

  This is a full-time role based out of either our San
  Francisco or New York office. Employees are encouraged to
  come into the office at least twice a week, with Tuesdays
  and Thursdays being our main in-person days.

  The salary range for this role is: $214,000 - $285,000

  In addition to our unique culture, Hex proudly offers a
  competitive total rewards package, including but not limited
  to, market-benched salary & equity, comprehensive health
  benefits, and flexible paid time off.

  The salary range shown may be a reflection of additional
  factors such as geographical location and skill
  ranges/levels we’re open to. Placement in the salary range
  will be decided upon completion of the interview process,
  taking into account factors like leaving room for growth,
  internal fairness & parity, your demonstrated skills, and
  the depth of your experience. Our Recruiting team will be
  able to provide more details during the interview process.

  By submitting an application the candidate consents to the
  use of their personal information in accordance with the Hex
  Privacy policy: https://learn.hex.tech/docs/trust/privacy-
  policy.
