description: |
  Description

  MWDN is a global IT outstaffing company with 23+ years of
  experience that connects exceptional tech talent with
  leading companies across Israel, the USA, Great Britain, and
  Western Europe. We offer opportunities to work on
  international products in a stable and professional
  environment.

  Why does MWDN rock?

  Here’s what you can expect when you join MWDN:

  - Security: We carefully vet our clients to minimize risks and
    ensure reliability and timely payments - no fraud or
    unpleasant surprises.
  - Career support: If a project isn’t the right fit, we support
    you and actively help find new opportunities that match
    your skills and career goals.
  - Legal assistance: We provide guidance on legal matters,
    including opening and managing your independent contractor
    or sole proprietorship status, taxes, and related
    processes.
  - Professional development: We offer English courses and
    professional growth opportunities, as well as team-
    building events.

  Why choose us? MWDN is ranked among the top 5 IT employers
  in our region according to DOU. We take pride in our
  transparency and strong commitment to our team. Curious to
  learn more? See what our employees say about working with us
  on DOU.

  What is your new project?

  Domain: Gaming

  Location: US/Israel

  Company size: 11-50 employees

  Founded in: 2025

  What makes this project exciting?

  Our client is building a groundbreaking loyalty platform for
  mobile gamers, and we're seeking passionate individuals to
  form the foundation of the engineering team. Product mission
  is to empower gamers with a new way to discover games,
  connect with their friends, and earn fantastic rewards.

  Joining us, you will get to build the highest quality
  consumer app in one of the hottest domains in the gaming
  industry, and make real measurable business impact.

  With tens of thousands of daily active users and over a
  hundred games on clients platform, there are growing fast.
  Join us and let's open a whole new market together.

  You'll be the first dedicated engineer on the SDK, owning
  architecture, public API, releases and the partner
  experience end to end.

  What makes you a great fit

  - Hands-on experience with generative AI, fal.ai, and ComfyUI,
    supported by workflows or applications you have built.
  - Strong Python or TypeScript skills to automate workflows,
    integrate APIs, and handle async processing, background
    jobs, and errors.
  - Ability to build modular, config-driven pipelines that
    generate multiple variations by changing avatars, scripts,
    and other creative elements while reusing assets.
  - Experience integrating image, video, text-to-speech, and
    talking-head models, selecting models based on quality,
    cost, and the use case.
  - Practical FFmpeg experience with clip assembly, UI overlays,
    subtitles, audio mixing, and aspect-ratio formatting.
  - Ability to implement reliable job orchestration, retries,
    resumable execution, and cost tracking.
  - Clear, maintainable code and documentation that allows
    marketing staff to operate workflows without writing code.
  - Good English communication and the ability to collaborate
    with AI-video creative specialists.
  - Relevant work to demonstrate: be prepared to share your
    screen and walk us through a working pipeline or
    application, explaining your technical contribution.

  Nice to Have

  - Experience with Seedance, MiniMax, Kling, or similar video-
    generation models.
  - Experience with Stable Diffusion, LoRA training, or
    evaluating character consistency.
  - Experience building internal applications for creative teams
    or scaling automated video production.
  - Familiarity with paid mobile user acquisition creatives and
    CTR, CPI, or ROAS.
  - Experience with agent-driven or AI-assisted video editing.

  Your day-to-day in this position

  - Build modular, config-driven workflows covering scripts,
    hooks, avatars or LoRAs, voices, music, UI assets, and
    aspect ratios.
  - Integrate the fal Queue API to manage jobs, rate limits,
    webhooks, and retries.
  - Make runs resumable so failures don’t trigger duplicate
    generation costs.
  - Fetch and cache UI assets, then use FFmpeg to assemble
    clips, add subtitles and CTAs, sync talking-head audio,
    and mix sound.
  - Produce video ads in 9:16 and 1:1 formats.
  - Document the pipeline and provide configuration examples
    that the marketing team can use without writing code.

  Why work with us?

  - People-first management with minimal bureaucracy
  - A friendly company culture, proven by employees who choose
    to return
  - Flexible working hours
  - 29 days of PTO (18 working days per year pluse all national
    holidays)
  - 10 paid recovery days
  - Full financial and legal support for independent contractors
  - Free English classes, with native speakers or Ukrainian
    teachers
  - Dedicated HR support

  Our next steps

