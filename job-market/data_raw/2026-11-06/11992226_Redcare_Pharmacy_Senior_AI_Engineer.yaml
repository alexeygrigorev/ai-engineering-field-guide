description: |
  Company Description

  About Redcare Pharmacy:

  As Europe’s No.1 e-pharmacy Redcare Pharmacy is powered by
  passionate teams and cutting-edge innovation. We strive to
  create a healthy collaborative work environment where every
  employee feels valued and inspired to contribute to our
  vision “Until every human has their health”. If you’re
  seeking a career that offers purpose and aligns with your
  values join us and start your #Redcareer today.

  About the role: This is a unique opportunity to shape how AI
  drives real impact in digital healthcare at Redcare
  Pharmacy. You will build scalable and innovative solutions
  that directly influence patient outcomes and business
  operations. As part of a highly collaborative environment,
  you will take end-to-end ownership of AI initiatives and
  play a key role in defining how intelligent systems are
  embedded across the organisation. We look for someone who
  combines strong software engineering background with applied
  AI expertise and enjoys turning ambitious ideas into
  reliable real-world solutions.

  Job Description

  About the tech stack: Modern Machine Learning frameworks,
  Generative AI technologies, scalable data platforms, cloud
  infrastructure and MLOps tooling that support the full
  lifecycle of production AI systems.

  About your tasks:

  - Design, build and evolve scalable ML and generative AI
    systems that deliver measurable value in customer-facing
    and operational use cases.
  - Develop robust end-to-end pipelines for training,
    evaluation, deployment, monitoring, and continuous
    improvement of AI solutions in production.
  - Collaborate closely with product, engineering, data, and
    business stakeholders to bring AI capabilities into core
    digital healthcare systems and operations
  - Explore and implement cutting-edge AI advancements to
    continuously enhance innovation and solution effectiveness
  - Take ownership as AI Technical Owner, shaping the technical
    roadmap and driving the full AI lifecycle across strategic
    initiatives
  - Contribute to and adhere to our governance, experimentation,
    model quality, versioning, observability, and compliance
    practices in a regulated environment

  Qualifications

  About you:

  - Strong experience in building production-grade Machine
    Learning and Generative AI solutions, with a focus on
    production-ready systems
  - You enjoy working at the intersection of technology,
    healthcare, and business impact
  - A mindset of ownership and curiosity, with a drive to
    explore new AI innovations
  - You value collaboration and don’t like solving complex
    challenges on your own

  Additional Information

  About your benefits:

  In order to provide you with the best possible support for
  your individual needs - whether it‘s living a healthy life,
  having enough time for your family, or developing your
  skills - we offer a wide range of different, site-specific
  benefits:

  - Work from Home: If your job does not require you to be
    present in the office, we can arrange the place you work
    from individually - even for up to 20 days a year anywhere
    in the EU.
  - Personal development: Grow! We support and encourage your
    individual development through various in- and external
    trainings.
  - Redcare events: We promote teambuilding through creative
    team events, and celebrate our successes together at
    regularly scheduled parties.
  - Corporate pension plan: We offer a company pension scheme
    and have a dedicated external consultant to offer you the
    best guidance and advice.
  - Mental Health: Get quick and professional help from
    psychologists of nilo if you feel overwhelmed in private
    or professional life. Anonymous and free of charge.
