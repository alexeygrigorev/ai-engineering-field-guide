description: |
  About Arora Media

  Arora Media is an Award Winning Growth Consulting Firm
  founded 6 years ago, supporting leading CPG, SaaS, DTC, and
  commerce products to disrupt the future of commerce. We
  deliver our services through 3 divisions. Performance,
  Operation, and Activations. Performance builds the company
  through strategic paid, organic, and strategic efforts.
  Operations set up the companies internal systems to
  withstand the scale coming from Performance. Activations
  builds a connection with their consumer beyond the digital
  space. Events, Pop-Ups, Student Ambassadors, and more.

  You will enjoy this role if you thrive in a fast-paced
  consulting environment and appreciate the variety that comes
  with business development, solutioning, client engagement,
  delivery excellence enablement, operations and financial
  management, and team and people leadership all in one role.

  We aren't like other companies you have worked for. We are
  built on culture, giving 110% to everything we do in and
  outside of the workplace. We like to promote within, build
  skills from ground up, and keep moving forward regardless of
  our circumstances.

  we believe in hiring people not skills.

  AI Developer Objectives

  - Build AI-powered workflows, automations, and internal tools
    that multiply Arora Media's creative and media output

  - Develop and maintain AI agents for creative ideation, copy
    generation, video production pipelines, and reporting

  - Integrate LLMs and third-party APIs into our operating
    systems and client delivery

  - Ship fast, iterate on real usage, and keep Arora Media at
    the frontier of AI-driven marketing operations

  What You'll Bring

  - 3+ years building software, with hands-on experience
    integrating LLM APIs (OpenAI, Anthropic, or similar)

  - Strong Python skills; comfortable with APIs, automation, and
    lightweight web apps

  - Experience building agents, RAG pipelines, or production AI
    workflows

  - Product-minded: you care about shipping tools people
    actually use, not demos

  - Familiarity with marketing tech, ad platforms, or creative
    tooling is a plus

  Arora Media is a fiercely human business and consulting
  company that leads with outcomes to bring more value, in all
  ways, always. From strategy through delivery, our agile
  teams across 6 offices in 5 countries partner with clients
  to co-create powerful customer experiences, modern ways of
  working, and meaningful impact.

  What sets us apart? We believe work should be challenging
  and fulfilling, not perfect, but possible. That’s why we
  prioritize purpose, flexibility, connection, and
  recognition, so our people can thrive and love what they do,
  most days.

  EEO and Accommodations

  Arora Media is an equal opportunity employer and is
  committed to attracting, developing and retaining highly
  qualified talent who empower our innovative teams through
  unique perspectives and experiences. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, national origin,
  disability status, protected veterans’ status, or any other
  characteristic protected by federal, state, or local laws.
  Arora Media will also consider qualified applications with
  criminal histories, consistent with legal requirements.
  Arora Media welcomes and encourages applications from
  individuals with disabilities. Reasonable accommodations are
  available for candidates during all aspects of the selection
  process. Please advise the talent acquisition team or
  contact contact@aroramktg.com if you require accommodations
  during the interview process.
