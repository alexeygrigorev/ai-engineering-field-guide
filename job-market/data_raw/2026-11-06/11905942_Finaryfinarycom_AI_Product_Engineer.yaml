description: |
  What is Finary?

  We are on a mission to give power back to investors. Great
  financial guidance has always existed, it just came with a
  minimum net worth. We're changing that by building the AI-
  powered one-stop shop for investing, where you can track
  your assets, manage your budget, invest, and learn. One
  simple, ambitious idea drives us: put a private banker in
  everyone's pocket.

  Mounir launched Finary in 2021, and more than 1,000,000
  people now trust us with their financial lives. We ship
  cutting-edge products with touches of delight, and we care
  deeply about experience, performance, and ease of use.

  Why now?

  A new generation of investors is emerging: ambitious,
  involved, done with taboos around money. We see a world
  where investing empowers everybody to live the life they've
  always dreamt of. To fuel that, we raised €40M from
  Hedosophia, Y Combinator, and Speedinvest, alongside
  founders and operators like Steve Anavi & Alexandre Prot
  (Qonto), Matthieu Rouif (Photoroom), Eric Demuth (Bitpanda),
  Axel Weber (former UBS Chairman), and Harsh Sinha (CTO at
  Wise).

  In July 2026, the AMF granted us our MiCA license, on top of
  our Investment Firm license: one of the very few French
  platforms holding both, offering stocks, ETFs and crypto on
  a single regulated platform, right as Europe consolidates
  around licensed players. There's never been a more exciting
  time to join.

  What we offer

  We're 70 builders who genuinely love what they do: real
  ownership from day one, tier-1 salary and equity, offices in
  the heart of Paris with hybrid remote, and quarterly
  gatherings we actually look forward to.

  We hire A-players who are as kind as they are demanding,
  people whose ideas transform not just our product but the
  way we work and think. Our culture is direct, transparent,
  and built on radical candor: we challenge each other openly,
  then commit. And we don't hedge on AI. It's the single most
  important skill of the next decade and a real bar here.
  Everyone at Finary has rebuilt how they work around it. If
  that's already second nature to you, you'll be surrounded by
  people pushing that frontier every day.

  Read more about our values here.

  The opportunity

  AI is not a side project at Finary: it's how we intend to
  run the company. Our teams already build their own
  automations, so this role is about the hard part: complex
  orchestrations, and intelligence inside the products our
  advisors and operations team rely on every day. You own what
  you build end to end, from understanding the need with the
  people who'll use it to running it in production. We move
  fast and need an AI product engineer to move with us.

  What you'll do

  - Advisory at scale: build the closing machine and the systems
    that accelerate our sales team
  - Allocation engines: build the recommendation engine that
    captures our advisors' expertise
  - Operating systems: build the agentic layer that lets our
    operations team orchestrate a fleet of AI agents, with
    minimal humans interactions
  - End-to-end ownership: gather needs with the teams who use
    your products, then design, build, deploy and maintain
    them; define what a correct agent decision looks like,
    measure it, and catch drift before users do
  - Enablement: help non-engineers build their own automations,
    step in when they need something more robust, and work
    with the rest of engineering on shared agentic
    infrastructure

  What we're looking for

  - Production software experience: 3+ years shipping production
    grade software, including products you've owned end to
    end, from gathering needs to running them
  - AI systems in production: you've built and run LLM
    integrations, agents and multi-step orchestrations in
    production. You can explain how they work and evaluate
    them. You know when a simple rule beats an agent, and AI
    coding tools are part of your daily work.
  - Range across the stack: comfortable across several languages
    and codebases, and quick to pick up new ones. Our stack is
    TypeScript, Rust and Ruby, on Google Cloud and Kubernetes
    with infrastructure as code. You don't need to be an SRE,
    but you deploy and run what you build and keep data
    correct as systems evolve
  - Product sense and UX: you start from the problem, not the
    technology, and you care about the people using what you
    build and how it feels to use
  - High agency: you work across teams and switch context often,
    and you find the next problem worth solving and own it
    without waiting to be told
  - French and English: fluent French to work with our advisory
    team and the rest of the company, and professional English
  - Based in Western Europe: we expect quarterly presence for
    our onsite weeks in Paris. This role is open to candidates
    based in Europe with the right to work in the EU.
  - We're particularly interested in:
    - An agentic system you built that is in production and used
      today
    - How you know it works, and what it saves the people using it
    - A time you chose a simple script or rule over an agent, and
      why

  Nice to have

  - Familiarity with fintech or a regulated industry
  - Passion for personal finance and investing

  What we offer

  - Competitive salary: €65k - €80k base depending on
    experience, plus stock options
  - Hybrid setup: teammates across France and Europe, with one
    week together in Paris every quarter (travel and
    accommodation covered)
  - Closeness to your users: you're part of the Operations team,
    work across advisory, sales, operations and engineering,
    and have direct access to the people using what you build
    from day one
  - High-performing environment: A-players who challenge you and
    help you grow
  - Impact that compounds: what you build today makes every team
    more effective tomorrow
