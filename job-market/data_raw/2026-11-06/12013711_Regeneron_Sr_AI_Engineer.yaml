description: |
  Build our future together

  Regeneron is founded on the belief that the right idea,
  combined with the right team, can lead to significant
  transformations. Our growing global network is dedicated to
  inventing, developing, and commercializing medicines that
  change lives for those with serious diseases. In doing so,
  we are pioneering innovative approaches to science,
  manufacturing, and commercialization, as well as redefining
  our understanding of health.

  At Regeneron Digital & Technology, we are accelerating the
  adoption of Applied AI to transform how business teams
  access information, automate workflows, and make data-driven
  decisions. We are seeking a Senior Engineer, AI to join our
  Forward Deployment Engineering team and help build
  innovative AI-powered applications using Large Language
  Models (LLMs), agentic AI, enterprise data platforms, and
  cloud technologies. This role will collaborate closely with
  business stakeholders, engineering teams, and data partners
  to develop secure, scalable, and production-ready AI
  solutions that drive measurable business outcomes while
  operating within a governed and regulated environment.

  When & Where

  Hyderabad (Hybrid)

  Discover your role

  - Develop AI-powered applications using Large Language Models
    (LLMs), agentic AI workflows, retrieval-augmented
    generation (RAG), and enterprise data platforms.
  - Build intelligent workflows, AI agents, and conversational
    experiences that improve operational efficiency,
    productivity, and business decision-making.
  - Collaborate with business stakeholders to understand
    challenges and translate requirements into scalable AI
    solutions that deliver measurable value.
  - Design, develop, and maintain data pipelines, integrations,
    and knowledge retrieval frameworks that enable AI
    applications to securely access governed enterprise data.
  - Build and implement evaluation frameworks to assess AI model
    performance, response quality, grounding accuracy, and
    business effectiveness.
  - Partner with engineering, data, and platform teams to ensure
    AI solutions are scalable, reliable, secure, and aligned
    with enterprise architecture standards.
  - Participate in the complete AI solution lifecycle, including
    assessment, planning, design, development, testing,
    deployment, and continuous improvement.
  - Contribute to technical documentation, design reviews, peer
    reviews, and AI governance processes to ensure solution
    quality and compliance.
  - Support responsible AI practices by implementing data
    privacy controls, governance standards, risk mitigation
    approaches, and regulatory requirements.
  - Stay ahead of with advancements in generative AI, foundation
    models, agent architectures, and emerging technologies to
    help drive innovation across the organization.
  - Foster a culture of collaboration, continuous learning,
    innovation, and engineering excellence across global
    teams.

  This role requires

  - Bachelor's, Master's, or equivalent experience in Computer
    Science, Artificial Intelligence, Data Science,
    Information Technology, Engineering, or a related field.
  - 3-5 years of hands-on experience building software, data,
    analytics, or AI-driven applications.
  - Experience developing AI applications using Large Language
    Models (LLMs), agent workflows, retrieval-augmented
    generation (RAG), prompt engineering, and enterprise
    system integrations.
  - Strong proficiency in Python, SQL, APIs, and modern software
    engineering practices for developing scalable AI
    solutions.
  - Experience with enterprise data platforms such as
    Databricks, Snowflake, or similar cloud-based analytics
    environments.
  - Hands-on experience building data pipelines, integrations,
    and data processing solutions that support AI workloads.
  - Familiarity with AI evaluation methodologies, testing
    frameworks, observability practices, and quality
    measurement approaches.
  - Knowledge of data governance concepts, including metadata
    management, data lineage, data quality, cataloging, and
    access control.
  - Understanding of responsible AI principles, model
    governance, privacy regulations, risk management, and
    compliance requirements.
  - Experience working with cloud platforms such as AWS, Azure,
    or GCP and integrating AI solutions into enterprise
    environments.
  - Strong analytical, problem-solving, communication, and
    collaborator management skills, with the ability to
    explain complex technical concepts to non-technical
    audiences.
  - Experience in pharmaceutical, biotechnology, healthcare, or
    other regulated industries is preferred.
  - Demonstrated ability to collaborate effectively across
    global teams and operate successfully in a dynamic and
    evolving technology environment.

  Does this sound like you? Apply now to take your first step
  towards living the Regeneron Way! We are committed to
  building a workplace with an inclusive culture. Regeneron is
  an equal opportunity employer and all  qualified applicants
  will receive consideration for employment without regard to
  race, color, religion or belief (or lack thereof), sex,
  sexual orientation, gender identity or expression, gender
  reassignment, marital or civil partnership status, civil
  status, pregnancy or parental status, age, disability,
  nationality, citizenship status, ethnic or national origin,
  membership of the Traveler community, familial status,
  genetic information, military or veteran status, or any
  other characteristic protected under applicable law. Where
  required, we will provide reasonable accommodation to
  applicants with known disabilities or chronic illnesses
  during the recruitment process, unless such accommodation
  would impose undue hardship.

  Where necessary, we disclose salary ranges for roles in all
  countries in which we operate.  The final offer will be
  determined within the relevant range based on the country of
  employment, specific role level, and your skills and
  experience. In some countries, collective bargaining
  agreements (CBAs) may apply and influence certain elements
  of pay or benefits.  Regeneron offers a competitive and
  comprehensive total rewards package which may include,
  depending on country and role: annual bonuses or other
  incentive plans, equity awards, pension or retirement
  benefits, 401(k) company match, health and wellness
  programs, fitness centers, insurance benefits (e.g. medical,
  dental, vision, life and disability), paid time off, and
  family support benefits. For additional information about
  Regeneron benefits in the U.S., please visit
  https://careers.regeneron.com/en/working-at-regeneron/total-
  rewards/. For other locations, additional information will
  be provided during the recruitment process.  If you have any
  questions, please speak with your recruiter.

  Please be advised that at Regeneron, we believe we do our
  best work when we are together. For that reason, many roles
  are required to be performed on‑site. Please speak with your
  recruiter and hiring manager for more information about
  on‑site expectations for your role and location.

  As part of the recruitment process, certain background
  checks may be conducted in accordance with the laws of the
