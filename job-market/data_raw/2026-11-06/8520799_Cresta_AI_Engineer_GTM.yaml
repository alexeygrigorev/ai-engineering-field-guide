description: |
  Cresta unlocks the true potential of the customer
  experience, turning every conversation into a competitive
  advantage. Cresta’s unified AI platform combines
  conversational AI agents, real-time human agent
  augmentation, and comprehensive conversation intelligence to
  drive revenue and efficiency gains across every channel. The
  world’s leading companies, including United Airlines, Cox
  Communications, and Marriott, use Cresta to power world-
  class customer experiences every day.

  Born from the Stanford AI Lab, Cresta has raised more than
  $270 million from the world’s leading investors, including
  a16z, Greylock, and Sequoia. Cresta’s leadership includes
  some of the leading minds in AI today. Our CEO, Ping Wu,
  founded and led Google's Contact Center AI and Vertex AI
  platforms before joining Cresta to build the future of AI-
  driven customer experiences.

  Over the next few years, AI is going to redefine how people
  all over the world interact with businesses every day. Come
  build that future at Cresta.





  AI Engineer, GTM Cresta’s mission is to help companies turn
  conversations into their competitive advantage. We build AI
  that helps the world’s largest enterprises unlock revenue,
  efficiency, and insight from every customer interaction. We
  are hiring an AI Engineer (GTM) to rebuild how go to market
  works. This role is about eliminating manual work, helping
  our teams focus on the right accounts, and building systems
  that make winning easier. You will work directly with our
  CEO, CRO, CMO, and Rev Ops leadership to design and deploy
  an AI native operating system for our revenue engine.



  Location: Remote / Hybrid - Targeting SF or NYC, may
  consider additional locations across the US. What you will
  do Help GTM teams prioritize the right accounts

  - Use AI and data to help SDR, marketing, and sales focus on
    the highest value accounts
  - Surface hard to find intelligence, such as contact center
    scale, BPO footprint, and tech stack
  - Continuously enrich and reprioritize accounts as signals
    change

  Eliminate manual work

  - Replace manual research, opportunity prep, and CRM entry
    with automation and AI
  - Build systems that tell sellers what to focus on each day
    and what actions move deals forward
  - Auto-generate account plans, stakeholder maps, and discovery
    prep inside seller workflows

  Automate deal execution

  - Automate quoting, approvals, and document generation using
    AI agents
  - Streamline order forms, security reviews, and deal documents
  - Create real-time deal signals and next steps for every
    opportunity

  Own and optimize the GTM system

  - Write custom code and use AI coding tools to connect and
    extend our GTM stack
  - Integrate and maximize Salesforce, Gong, Clay, Centralize,
    Slack, Glean, Coda and more
  - Build systems that work natively inside our workflows
  - Rethink segmentation, territories, and coverage using data
    and AI
  - Take true ownership of sales effectiveness and revenue
    growth
  - Opportunity to earn commission based on measurable impact

  What we are looking for

  - Engineer who can bridge deep technical ability with real GTM
    understanding
  - Entrepreneur mindset with strong ownership and bias to build
  - Strong understanding of enterprise GTM and sales workflows
  - Comfortable writing code, using APIs, automation, data
    systems, and AI tools
  - Deep familiarity with modern sales tech stacks
  - High ownership, speed, and focus on real revenue outcomes

  Perks & Benefits:

  We offer a comprehensive and people-first benefits package
  to support you at work and in life:

  - Comprehensive medical, dental, and vision coverage with
    plans to fit you and your family
  - Flexible PTO to take the time you need, when you need it
  - Paid parental leave for all new parents welcoming a new
    child
  - Retirement savings plan to help you plan for the future
  - Remote work setup budget to help you create a productive
    home office
  - Monthly wellness and communication stipend to keep you
    connected and balanced
  - In-office meal program and commuter benefits provided for
    onsite employees

  Compensation at Cresta

  Cresta’s approach to compensation is simple: recognize
  impact, reward excellence, and invest in our people. We
  offer competitive, location-based pay that reflects the
  market and what each individual brings to the table.

  The posted base salary range represents what we expect to
  pay for this role in a given location. Final offers are
  shaped by factors like experience, skills, education, and
  geography. In addition to base pay, total compensation
  includes equity and a comprehensive benefits package for you
  and your family.

  Salary Range: $150,000 - $230,000 + Offers Equity

  Range varies based on location and experience.

  Our use of AI in recruiting: We may use AI tools in our
  recruiting process, which require human review and
  oversight. If you have questions about our use of AI or wish
  to opt out, please contact recruiting@cresta.ai (if you are
  opting out, please use the subject ‘Opt-Out’ in your email).

  Recording & AI transcription: We do not authorize candidates
  to record or use AI transcription of any interview by phone,
  notetaker app, AI glasses, or other device. Candidates may
  request an exception or accommodation for review during the
  interview process as needed.

  Recruiting impersonation scams: We have noticed a rise in
  recruiting impersonations across the industry, where
  scammers attempt to access candidates' personal and
  financial information through fake interviews and offers.
  All Cresta recruiting email communications will always come
  from the @cresta.ai domain. Any outreach claiming to be from
  Cresta via other sources should be ignored.
