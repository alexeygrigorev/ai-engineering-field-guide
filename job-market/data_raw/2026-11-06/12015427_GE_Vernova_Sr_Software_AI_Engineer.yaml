description: |
  Job Description SummaryAs a Sr. Software AI Engineer, you
  will drive the development of our AI Agents and the
  underlying infrastructure that powers it. You will implement
  AI agents and robust MCP (Model Context Protocol) servers
  that standardize data connectivity, skills, and tools. You
  will be involved from design to code implementation to
  rigorous testing and production support. You will partner
  with internal teams and external contractors to lead
  technical reviews, integrations, and delivery execution. You
  will deliver using Coding Agents, establish testing
  approaches for prompts and model performance, and implement
  observability for AI features. We value autonomy, continuous
  learning, and clear business impact. If you are excited by
  this work but unsure whether you meet every requirement, we
  encourage you to apply.

  Job Description

  Responsibilities:

  - Collaborate with cross-functional teams (product, design,
    operations, infrastructure) to build AI-native application
    experiences
  - Build AI Agents, MCP Servers, Tools and integrate LLM /
    generative AI capabilities into products, including
    structured prompting, memory management and context
    management.
  - Implement retrieval-augmented generation (RAG) patterns
    (e.g., embeddings + retrieval) and contribute to context-
    aware and personalized user experiences
  - Drive end-to-end execution of medium-to-large features with
    independence, contribute to technical direction within the
    team

  Required Qualifications:

  - Bachelor’s degree in computer science, Computer Engineering,
    or related technical field
  - 4+ years of experience using at least one general purpose
    programming language (Python [preferred], Java, or Go) and
    front-end experience with JavaScript/TypeScript
  - Proven track record shipping production applications that
    incorporate LLMs, MCPs or AI services at scale
  - Experience with cloud platforms (i.e. AWS) and advanced
    containerization (Docker, Kubernetes)

  Preferred Qualifications:

  - Experience in Cloud Software Development, including
    architecture design, technical leadership, and system
    optimization
  - Experience with Strands, ADK or Agent development
    frameworks.
  - Experience with multiple LLM providers and advanced AI
    orchestration frameworks (e.g. Amazon Bedrock AgentCore,
    LangChain)
  - Experience with modern front-end frameworks (React, Vue, or
    Angular) and advanced state management
  - Experience with vector databases (e.g. pgvector) and
    embedding model optimization
  - Experience with enterprise RAG architectures, semantic
    search optimization, and conversation memory management at
    scale

  Additional Information

  Relocation Assistance Provided: Yes
