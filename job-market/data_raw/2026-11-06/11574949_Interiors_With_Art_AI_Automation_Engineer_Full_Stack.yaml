description: |
  We want to turn a 24 year old design and build company into
  one that runs on good technology, and this role is at the
  centre of that. You'll work directly with the directors to
  find where the business loses time and information, then
  build the tools that fix it. Designers, site teams and
  finance will use what you make every day. We'd rather you
  shipped something useful in a fortnight and improved it than
  spent six months on a perfect version.

  ABOUT INTERIORS WITH ART

  Interiors With Art has been designing and building luxury
  homes, palaces and hotels for 24 years, for private clients
  around the world. We've recently opened offices in Delhi and
  Chennai and set up a joint venture with Sotheby's
  International Realty India, and the team here is growing
  quickly. Behind the scenes we're changing how the business
  runs too. We build a lot of our own technology and we want
  people who'll help us keep improving how we work.

  WHO WE'RE LOOKING FOR

  We like people who question things. If something has always
  been done one way and you can see a better way, we want to
  hear about it. It's a fun team to be part of and people work
  hard. Things move quickly because we're growing and changing
  at the same time.

  We're happy to try new software, and if it makes the work
  better or quicker, we keep it. There's not much hierarchy
  and very little corporate process, so ideas get heard
  whoever they come from. You'll work with the team both in
  India and abroad

  WHAT YOU'LL DO

  - Map how the business works, spot where time and information
    get lost, and design the architecture that connects it
    all.

  - Build full-stack products end to end, covering the backend
    (APIs, databases, cloud infrastructure) and the frontend
    (clean, intuitive interfaces the team will enjoy using).

  - Build AI agents, integrations and automated workflows that
    connect the tools we already use.

  - Get MVPs out quickly, test them with real users, learn and
    change direction without fuss.

  - Sit with non-technical teams, understand how they work and
    turn that into practical tools.

  - Structure company data securely, with privacy built in.

  - Think about security, reliability and scale, not just
    whether something works on day one.

  - Stay on top of new models, tools and trends, and know when
    to use each.

  WHAT YOU'LL BRING

  - A computer engineering or computer science background, and
    you can code properly. We're not looking for someone who
    only vibe-codes with AI tools.

  - Deep working knowledge of the AI stack, including Microsoft
    Copilot, Claude, OpenAI and related tools.

  - Experience building AI agents, integrations and automated
    workflows.

  - A problem solver's instinct for how a business works and
    what it needs.

  - The ability to work fast and ship.

  - You enjoy being part of a team and building something bigger
    than any one project.

  CLIENTS - India and international

  EXPERIENCE - 3 to 5+ years

  OPENINGS - 1 position
