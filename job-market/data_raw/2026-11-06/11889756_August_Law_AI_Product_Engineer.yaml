description: |
  The world’s largest law firm won’t be a law firm. Join us in
  building it.

  August allows law firms to compound their expertise by
  building an autonomous organization of AI agents that run
  the firm's knowledge work. We partner closely with our firms
  and grow alongside them through sharing revenue on our
  agents and equity in the firms we transform.

  We believe that in five years, more than 95% of legal work
  will be concentrated among a select few elite law firms. The
  firms that get there will be the ones that rebuild how they
  deliver it. We're partnering with those firms and building
  the engine they run on to become the biggest legal service
  provider in the world.

  We invest in partnerships, not just licenses. We sell
  finished legal work alongside our firms and take a share of
  what it earns. This enables them to scale their services and
  lets us grow along with it. That means we’re chasing the
  legal services market ($1T), which dwarfs the global legal
  tech market ($40b).

  The problem is hard. An engine of agents sits underneath
  every matter we touch, connected to every step of a lawyer's
  workflow, in an industry where there is no margin for error.
  We’re challenged with building the perfectly accurate,
  infallibly secure, and yet all-powerful engine for legal
  work.

  We're already live with several excellent firms and the
  early results are better than we expected. Lean team, in
  person, New York, backed by leading investors, growing fast.

  Every role at August is a chance to remake an industry while
  the window is open.

  The Opportunity

  August is building AGI for law. Our agents mimic a lawyers’
  reasoning, research, and drafting, and our workflows already
  outperform lawyers in third-party evaluations. We’re
  targeting mid-market law firms, automating their legal work
  and allowing them to provide our tools directly to their
  clients. Join August at an early stage as we scale our
  agents to process millions of documents simultaneously and
  create outputs exceeding human-level accuracy.

  As an AI Product Engineer at August, you will design and
  scale production-grade agents that perform legal tasks with
  expert-level reasoning. You’ll work closely with the
  founders, legal experts, and product team to deploy AI
  systems in high-stakes workflows used by real lawyers across
  the globe.

  What You'll Do

  - Build and deploy agentic systems using Python to automate,
    evaluate, and scale end-to-end legal workflows
  - Zero-to-one product development: rapidly prototype,
    evaluate, integrate, and test new product features in
    close partnership with our customers and legal team.
  - Develop new AI native workflows: implement streaming, long-
    running tasks, procedural UX, etc. for new AI tasks,
    finding the balance between state-of-the-art and
    pragmatism.

  About You

  - Experience building with LLMs, either in grad school or in
    production environments; strong coding skills
  - Demonstrated ability to ship quickly especially in early-
    stage environments while building scalable enterprise
    software
  - Grit - experience working at early-stage startups is a plus.
  - Quick and eager learner with strong fundamentals.
  - Ideally candidates would have experience and deep
    understanding of how infrastructure-layer (Database, Cloud
    Storage, etc) software systems work.

  Benefits

  - Medical insurance coverage
  - Flexible PTO
  - Parental Leave
  - Centralized office equipment ordering for all employees
  - Health and Wellness stipend for gym memberships
  - In-office perks: lunch, dinner, snacks, drinks, and more
  - Budget for intra-office travel
  - Team-building events
  - Relocation support to NYC

  Why Join August

  - Founding Impact: Shape not just your role but the company.
  - Uncapped Upside: Competitive base + commission, early equity
    ownership.
  - Top-tier Team: Work alongside people who move fast, think
    clearly, and care deeply.
  - Category-Defining Work: Help build the first true AI agents
    for the legal profession.
  - Fast Growth: Scale your career as we scale the company.
  - In-person in NYC: Collaborative, talent dense and high
    energy environment
  - Global Reach: Our clients span 4 continents and use August
    in multiple languages and jurisdictions
  - Frontier of Applied AI: August has access to proprietary
    data inaccessible to foundation model providers. We build
    agents to automate all challenging knowledge work.
