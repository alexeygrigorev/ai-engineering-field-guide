  Job Description:

  DEVOPS ENGINEER PRINCIPAL (100% Remote)

  Role Overview We are seeking a Principal DevOps Engineer to
  design, build, and optimize scalable cloud infrastructure
  and platform services that support modern application
  development and AI-driven solutions. This role centers on
  AWS, Kubernetes (Amazon EKS), Infrastructure as Code, CI/CD
  automation, and data platform engineering, with an emphasis
  on AI, MLOps/AIOps, FinOps, and cloud-native best practices.

  Key Responsibilities • Design, deploy, and manage cloud-
  native infrastructure on AWS using GitLab CI/CD. • Build and
  support Kubernetes platforms (Amazon EKS) with a focus on
  scalability, security, and high availability. • Develop and
  automate ETL workflows and data pipelines for analytics and
  AI workloads. • Implement and support MLOps/AIOps and FinOps
  capabilities, including AI infrastructure and model
  deployment pipelines. • Troubleshoot Linux-based systems,
  optimize platform performance, and enforce operational best
  practices.

  Required Qualifications • 5+ years of experience in Platform
  Engineering, DevOps, or Cloud Engineering. • Hands-on
  expertise with AWS, Amazon EKS, Linux, and GitLab CI/CD. •
  Strong experience with SQL, ETL automation, and building
  scalable data pipelines. • Experience implementing or
  supporting AI, MLOps, or AIOps platforms. • Strong scripting
  and automation skills, with a focus on cloud-native
  technologies.

  Preferred Skills • Experience with Python, Bash, or Go for
  automation and platform development. • Knowledge of
  container security, Kubernetes networking, and observability
  tools. • Familiarity with monitoring platforms such as
  Datadog. • Experience with AI/ML frameworks, vector
  databases, or enterprise LLM integrations. • AWS
  certifications (e.g., Solutions Architect Associate, DevOps
  Engineer, or Kubernetes-focused certifications).

  The likely salary range for this position is $119,000 -
  $161,000. This is not, however, a guarantee of compensation
  or salary. Rather, salary will be set based on experience,
  geographic location and possibly contractual requirements
  and could fall outside of this range.

