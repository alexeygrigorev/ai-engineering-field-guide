title: "Associate Value Engineer (AI-Driven Data Science & Analytics) - Orbit Program"
company: Celonis
location: New York, USA
work_type: FULL_TIME
company_size: 3,000 Employees
description: |
  Celonis is the trusted platform to industrialize Enterprise
  AI. At our core is the Celonis Context Model — which
  combines process data, business knowledge, and intelligence
  into a living digital twin of the enterprise that AI can
  actually understand, turning AI's operational blind spots
  into operational clarity. World's leading companies trust
  Celonis and its global ecosystem of partners to make their
  AI agents, people, systems, and processes work together,
  achieving transformational outcomes. We believe there's a
  massive opportunity to unlock global productivity and
  sustainability by giving AI the context to understand how
  every business process really works. Join our mission to
  make processes work for people, companies, and the planet.

  The Team: Global Value Engineering Center of Excellence

  Become an integral part of our international, diverse, and
  dynamic Global Value Engineering Center of Excellence. Our
  Value Engineers are trusted advisors who operate at the
  intersection of technology and business, partnering with
  sales and customers to develop compelling Celonis-powered
  solutions and prototypes that address critical business
  challenges.

  We foster a fast-paced, collaborative environment built on
  trust, continuous learning, and mutual growth through
  coaching and mentorship.

  The Role: Launch Your Enterprise Software Career

  Kickstart your career in enterprise software through our
  immersive 12-month Orbit Program. This program offers a
  unique blend of client engagements, dedicated mentorship,
  and a strong team culture where collaboration and shared
  success are paramount. You'll leverage your technical
  background to develop essential Value Engineering skills,
  build lasting client relationships, and establish yourself
  as a trusted advisor, paving the way for significant career
  growth within Celonis.

  The Orbit Program is structured into classes and cohorts,
  with start dates organized twice a year. You'll likely join
  a cohort with a summer start date (June/July) or a winter
  start date (January/February), allowing you to grow and
  develop alongside your cohort peers.

  Your journey begins with comprehensive onboarding and
  enablement, followed by hands-on experience in customer
  engagements and targeted training. You will gain expertise
  in:

  - Building and coding within the Celonis platform (SQL and
    PQL)
  - Scoping business and technical requirements
  - Effectively handling objections
  - Developing industry domain knowledge
  - Delivering impactful presentations and demos
  - Understanding value selling and realization
  - Managing customer accounts

  What You'll Do:

  - Consult with customers using systems analysis to identify
    core business challenges and determine how Celonis can
    drive impactful solutions.
  - Present the Celonis AI value proposition and vision to
    customers and align our solutions with their AI strategy.
  - Prototype and develop AI solutions tailored to customer
    needs, including both traditional machine learning and
    LLM-based solutions.
  - Execute proof projects showcasing the value of Celonis
    Process Intelligence in the context of our customers’
    strategy, business initiatives, and challenges
  - Develop and modify Celonis data models using SQL and
    analyses using PQL (Celonis proprietary language) to
    create compelling prototypes that address customer pain
    points.
  - Lead proof-of-concept projects within the Celonis platform
    to demonstrate tangible value aligned with customer
    strategies and needs.
  - Collaborate with customers and partners to design and build
    Celonis solutions that ensure a positive return on
    investment.
  - Establish strong, trusted advisor relationships with
    customers through your technical expertise, product
    knowledge, and business acumen.

  Articulate and quantify strategic business value for
  customers, delivering impactful presentations to senior
  executives.

  - Partner with the implementation services team to ensure
    successful value realization for customers.
  - Identify opportunities for innovation and collaborate with
    Product & Engineering teams to influence future product
    development.
  - Contribute to the Global Value Engineering Center of
    Excellence by creating reusable collateral, best
    practices, and tools.

  What You Need:

  - Bachelor’s degree in Business, Engineering, Data Analytics,
    Economics, Computer Science, Mathematics, or a related
    STEM field.
  - Extensive internship experience or 1-3 years of full-time
    work experience.
  - Hands-on experience with at least one of the following: SQL,
    Microsoft Power BI, Tableau, or another data analytics
    solution.
  - A strong passion for technology, big data, and its
    transformative potential.
  - Excellent analytical and creative problem-solving skills,
    with the ability to apply technology to business
    challenges.
  - A customer-centric mindset with a focus on delivering value.
  - The ability to build relationships with senior management
    and influence decision-making.
  - Confidence in presenting to diverse audiences.
  - A proactive approach to problem-solving, with a willingness
    to learn from mistakes.
  - Curiosity, self-motivation, a commitment to continuous
    learning, and the desire to thrive in a fast-paced, high-
    growth environment.
  - Strong organizational skills with the ability to prioritize
    and execute on deadlines.
  - Excellent communication skills and fluency in English.

  Bonus Points:

  - GPA of 3.6 or higher.
  - Degree in Industrial Engineering or a similar field.
  - Degrees combining technical (e.g., Computer Science, Data
    Science) and business (e.g., Economics, Marketing) skills.
  - Experience with Python and Machine Learning.
  - Customer-facing, customer success/service, or sales
    experience.
  - Experience with Proof of Concept projects.
  - Supply Chain process experience (Procurement, Order
    Management, Inventory Management, Production).
  - Finance process experience (Accounts Payable, Accounts
    Receivable).
  - Experience modeling ROI and TCO for business case
    justification.
  - Experience with SAP and/or Oracle.
  - Fluency in French and/or Spanish.

  Visa sponsorship is not offered for this role.

  The base salary range below is for the role in the specified
  location, based on a Full Time Schedule.  Total compensation
  package will include base salary + bonus/commission + equity
  + benefits (health, dental, life, 401k, and paid time off).
  Please note that the base salary range is a guideline, and
  that the actual total compensation offer will be determined
  based on various factors, including, but not limited to,
  applicant's qualifications, skills, experiences, and
  location.

  The base salary range below is for the role in New York,
  based on a Full Time Schedule.

  $90,000—$95,000 USD

  What Celonis can offer you:

  - Pioneer Innovation: Work with the global leader in Process
    Mining and the Process Intelligence Graph to shape the
    future of AI-driven business operations.
  - Ownership from Day 1: Every full-time "Celonaut" is an
    owner, receiving Restricted Stock Units (RSUs) and merit-
    based refresh grants.
  - Unrivaled Family Support: Benefit from our inclusive
    parental leave policy—24 weeks of fully paid leave for
    primary carers and 12 weeks for supporting carers,
    available from your first day of employment.
  - Work-Life Integration: Enjoy Unlimited PTO (in applicable
    regions) and generous PTO globally, as well as a flexible
    hybrid work model that balances remote focus with vibrant
    office collaboration.
  - Continuous Growth: Elevate your skills through our 70-20-10
    learning framework, mentorship programs, and access to a
    dedicated learning platform.
  - Holistic Well-being: Prioritize your health with subsidized
    Wellhub memberships, mental health counseling, and
    dedicated "Wellness Weeks" that prioritize work/life
    balance.
  - Drive Sustainability: Participate in annual Impact Days,
    where you receive paid time off to volunteer for community
    and environmental causes with your local office, or
    virtually.
  - Global Inclusion & Belonging: Find community through our
    Inclusion Think Tank and participate in our annual
    Inclusion Days, ensuring every voice is heard and valued.
  - Value-Driven Impact: Join a mission-led organization where
    our core values—Live for Customer Value, The Best Team
    Wins, We Own It, and Earth Is Our Future—drive every
    decision.

  About Us:

  Celonis is the trusted platform to industrialize Enterprise
  AI, empowering organizations to analyze, design, and operate
  AI-driven processes. The Celonis Platform is powered by the
  Celonis Context Model, which combines process data, business
  knowledge, and intelligence to create a living digital twin
  of the enterprise that AI can understand — turning AI’s
  operational blind spots into operational clarity. Industry-
  leading companies around the world trust Celonis and its
  global ecosystem of partners to make their AI agents,
  people, systems, and processes work together, achieving
  transformational outcomes. Celonis is headquartered in
  Munich, Germany, and New York City, USA, with more than 20
  offices worldwide.

  Get familiar with the Celonis Process Intelligence Platform
  by watching this video.

  Celonis Inclusion Statement:

  At Celonis, we believe our people make us who we are and
  that “The Best Team Wins”. We know that the best teams are
  made up of people who bring different perspectives to the
  table. And when everyone feels included, able to speak up
  and knows their voice is heard - that's when creativity and
  innovation happen.

  Your Privacy:

  Any information you submit to Celonis as part of your
  application will be processed in accordance with Celonis’
  Accessibility and Candidate Notices

  By submitting this application, you confirm that you agree
  to the storing and processing of your personal data by
  Celonis as described in our Privacy Notice for the
  Application and Hiring Process.

  Use of Artificial Intelligence Tools We rely on an
  artificial intelligence tool to match the information from
  your resume to the relevant Celonis job descriptions. This
  processing is limited to the information provided in your
  resume or in your candidate profile. The tool produces a
  match score per candidate for a role, suggests preliminary
  ranking, and provides recommendations. The tool is only used
  for support in parts of the job application process,
  including to facilitate the identification of the relevant
  Celonis Jobs for candidates and recruiters. All final
  decisions are made by hiring managers and the Celonis talent
  acquisition team. Hiring managers and HR specialists use
  this tool responsibly, are aware of the risk of potential
  bias, and are equipped to mitigate it.

