description: |
  About Chartmetric

  Chartmetric, Inc. is a 10-year-old startup specializing in
  music data analytics. We are trusted by Universal
  MusicGroup, Sony, Warner, and Apple Music, as well as
  hundreds of other music companies and industry
  professionals. Our team has created a self-service data
  dashboard for the music industry to better understand the
  activity happening around artists. Together, we combine
  hundreds of thousands of real-time data points across
  iTunes, Spotify, YouTube, Google, Amazon, X, and others
  through our beautifully designed tool in order to make sense
  of the increasingly complex landscape of the music industry.

  About the role

  We are looking for a versatile, experienced Senior Software
  Engineer to join Chartmetric’s Engineering team.  You’ll be
  a true full-stack engineer, comfortable building polished
  user experiences, backend services, APIs, and data-driven
  systems using TypeScript, React, Next.js, Node.js,
  PostgreSQL, and AWS.

  This is also an AI-first engineering role. You’ll use tools
  like Claude Code, Codex, and other coding agents as a core
  part of how you design, build, test, and ship software.
  You’ll also build AI agents for internal workflows and
  customer-facing product experiences.

  We’re looking for someone with strong technical judgment,
  broad engineering depth, and experience leading important
  projects from idea through production.

  What you'll do

  - Lead significant technical projects from architecture and
    design through deployment and production support
  - Use Claude Code, Codex, and AI coding agents to accelerate
    development while maintaining a high quality bar
  - Build AI-powered product features and internal agents using
    RAG, prompts, tools, and evaluations
  - Design scalable APIs, services, and data-intensive systems
  - Improve engineering productivity through reusable tooling,
    automation, and development workflows
  - Mentor teammates and contribute to architecture, code
    reviews, incident response, and engineering standards
  - Build and own full-stack product features across React,
    Next.js, Node.js, PostgreSQL, and AWS

  Qualifications

  - Strong senior-level experience building and operating
    production software
  - Strong system design, debugging, testing, and production
    engineering skills
  - Strong ownership, product judgment, and ability to turn
    ambiguous problems into shipped solutions
  - Previous experience as a Tech Lead, project lead, or
    technical owner is strongly preferred
  - 6+ years experience

  Bonus Points

  - Data Engineering experience with Python, ClickHouse,
    Snowflake, or Airflow
  - Experience building analytics or other data-intensive
    products
