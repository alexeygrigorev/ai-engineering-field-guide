description: |
  Job Summary

  The Senior Software Engineer - ServiceNow AI, Otto &
  Automation is responsible for implementing and expanding
  ServiceNow AI and automation capabilities, including Otto,
  Now Assist, Virtual Agent, AI Agents, and intelligent
  workflow automation. This role partners with business
  stakeholders to drive innovation, improve employee
  experiences, and accelerate enterprise productivity.

  Key Responsibilities

  ·         Lead implementation of ServiceNow AI and
  automation capabilities including Otto, Now Assist, Virtual
  Agent, Predictive Intelligence, and AI Agents.

  ·         Design intelligent workflows and AI-powered
  employee experiences.

  ·         Identify automation opportunities across IT, HR,
  and enterprise services.

  ·         Provide technical leadership and mentoring for
  ServiceNow development teams.

  ·         Partner with stakeholders to define AI use cases,
  business value, and adoption strategies.

  ·         Ensure AI solutions comply with governance,
  security, and responsible AI practices.

  ·         Support platform upgrades and adoption of new
  ServiceNow AI capabilities.

  ·         Drive continuous improvement and innovation across
  the ServiceNow platform.

  Required Qualifications

  ·         6+ years of ServiceNow development and platform
  experience.

  ·         Experience implementing ServiceNow AI, Virtual
  Agent, Now Assist, Otto, MCP Server and automation
  capabilities.

  ·         Strong ServiceNow development skills including
  JavaScript, Glide API, Flow Designer, and IntegrationHub.

  ·         Experience leading technical initiatives and
  delivering enterprise-scale solutions.

  ·         Strong communication and stakeholder management
  skills.

  Preferred Qualifications

  ·         ServiceNow certifications including CSA and
  CAD/CSI.

  ·         Experience with Generative AI, Agentic AI and
  conversational AI technologies.

  ·         Experience implementing enterprise automation
  programs.

  ·         Knowledge of AI governance, security, AI Control
  tower and adoption frameworks.

  Our Values

  If you want to know the heart of a company, take a look at
  their values. Ours unite us. They are what drive our success
  – and the success of our customers. Does your heart beat
  like ours? Find out here: Core Values

  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability or protected veteran status.
