description: |
  Job Description

  About Job:

  Software Engineer (Python, Fast API, Azure and AI), Chennai.

  We are seeking a highly motivated and experienced Software
  Engineer with strong expertise in  Python development,
  AI/Generative AI solutions, and database technologies. The
  ideal candidate should be capable of independently
  designing, developing, and delivering scalable software
  solutions while working closely with business and technical
  stakeholders. The role requires a handson engineer who can
  take ownership from solution design through implementation
  and deployment. This is an exciting opportunity to work on
  mission-critical systems that process massive volumes of
  consumer and retail data for customers around the globe.

  - Design, develop, test, and maintain scalable applications
    using Python.
  - Design and implement AI/ML and Generative AI solutions to
    solve business problems.
  - Translate business requirements into technical designs and
    executable solutions.
  - Build and integrate APIs, microservices, and backend
    services.
  - Design database schemas, optimize queries, and ensure data
    integrity and performance.
  - Work independently to drive projects from requirement
    gathering through production
  - deployment.
  - Evaluate new technologies, AI frameworks, and tools to
    improve engineering efficiency.
  - Troubleshoot production issues and provide timely
    resolutions.
  - Ensure adherence to coding standards, security guidelines,
    and best practices.
  - Collaborate with cross-functional teams including Product,
    Engineering, Data, and Operations
  - teams.
  - Create technical documentation, design documents, and
    operational runbooks.
  - Participate in architecture discussions and contribute to
    technical decision-making.

  Qualifications

  - Bachelor's or Master's degree in Computer Science,
    Engineering, Information Technology, or related field.
  - 4-7 years of professional software engineering experience
    developing enterprise-grade
  - applications.
  - Strong hands-on expertise in Python.
  - Proven experience designing and implementing microservices
    and distributed systems.
  - Strong understanding of Object-Oriented Programming (OOP),
    data structures, and software
  - design principles.
  - Experience with relational databases such as PostgreSQL,
    including data modeling,
  - performance tuning, and query optimization.
  - Strong SQL skills including query optimization, indexing,
    and database design.
  - Strong understanding of REST APIs, asynchronous processing,
    messaging patterns, and
  - scalable application design.
  - Experience with cloud platforms such as Azure or GCP.
  - Knowledge of software design patterns, system architecture,
    and engineering best practices.
  - Strong problem-solving skills with the ability to
    independently drive complex technical
  - solutions.
  - Demonstrated ability to incorporate AI-enabled development
    workflows while maintaining
  - engineering rigor, security standards, code quality, and
    architectural best practices.
  - Experience working in Agile development environments.
  - Excellent communication and collaboration skills.

  Additional Information

