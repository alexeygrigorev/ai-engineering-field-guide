  About LettrLabs



  LettrLabs is disrupting a $30B industry by uniting AI with
  tangible marketing. One Example: When a storm hits, our
  platform geo-locates to zip code, activates direct mail
  campaigns in minutes, and tracks every conversion back to
  digital.



  The Role



  LettrLabs already runs on AI. We built our own internal
  agentic operating system, and AI is deployed extensively
  across our technical teams. Now we're bringing that leverage
  to the rest of the company.

  As a Staff AI Product Engineer, you'll build genuinely novel
  AI products for our business teams: sales, go-to-market,
  customer service, marketing, and finance. This is not an
  integration or solutions role. You'll own real products end
  to end, from discovery with each team to production systems
  that move their numbers.

  The role is roughly 50% product and 50% engineering. You'll
  sit with each team, map how their work actually flows, find
  where AI creates real lift, then build and own the product.
  You report directly to the VP of Software.



  What you'll do

  - Embed with teams across the business to understand their
    goals, workflows, and pain points firsthand.
  - Map business processes end to end and identify where AI
    tools, agents, or automation will move the team's KPIs.
  - Design, build, and ship AI tools and harnesses, from
    prototype to production.
  - Own what you ship after launch: reliability, iteration,
    adoption, and measuring impact.
  - Work with each team to define its success metrics and
    baselines, such as pipeline per BDR or customer retention.
  - Build on our existing stack where it fits, and choose new
    technologies where they serve the problem better.
  - Create reusable patterns, components, and context so each
    new deployment is faster than the last.
  - Teach and enable teams to use and extend the tools,
    multiplying impact beyond what you build directly.

  Requirements

  - 8+ years of software engineering experience, with work at
    the staff level or equivalent scope.
  - Meaningful product engineering experience: you've shipped
    user-facing products and own outcomes.
  - Hands-on experience building with LLMs, such as agents, tool
    use, retrieval, evals, or context engineering.
  - Strong product sense: you can turn a messy business process
    into a clear problem and a working solution.
  - Excellent communication with non-technical stakeholders,
    from frontline reps to executives.
  - Proven ability to work autonomously, set your own
    priorities, and ship quickly with high quality.
  - Comfort owning production systems, including monitoring,
    reliability, and ongoing iteration.

  Nice to have

  - Experience as a forward deployed engineer, solutions
    engineer, or in another customer-embedded engineering
    role.
  - Familiarity with sales, marketing, customer success, or
    finance tooling and workflows (CRMs, support platforms,
    BI).

  How we'll measure success



  Success is direct, measurable lift on each team's own KPIs.
  You'll set those metrics and baselines with each team, then
  move them.



