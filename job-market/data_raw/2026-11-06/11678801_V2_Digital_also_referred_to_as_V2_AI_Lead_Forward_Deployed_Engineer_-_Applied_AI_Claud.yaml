description: |
  About V2 AI

  V2 AI is a leading AI-Native consultancy backed by $30m in
  VC funding, allowing us to meet our customers' needs. We
  harness the power of AI to accelerate business outcomes for
  some of the world's largest brands.

  We bring decades of experience and a unique delivery model
  to partner with our customers on the most complex problems
  for immense, measurable impact.

  Our Services

  - AI Strategy & Governance
  - AI Enablement
  - Applied AI
  - Data & AI Security

  About the Role

  We're looking for an experienced Lead Forward Deployed
  Engineer – Applied AI to lead the technical implementation
  of Claude Enterprise for a major enterprise customer within
  the financial services and asset management sector.

  As a Lead, you'll take ownership of technical delivery,
  working closely with customer stakeholders to drive the
  successful rollout and adoption of Claude Enterprise, with a
  strong focus on Claude Cowork, enterprise workflows and AI-
  powered productivity.

  This is a hands-on technical leadership role where you'll
  help shape solution architecture, navigate complex
  enterprise environments and guide engineers to deliver
  secure, scalable AI solutions that drive measurable business
  outcomes.

  You'll bring strong experience in financial services and
  asset management, with an understanding of industry
  workflows, regulatory requirements and enterprise technology
  environments.

  Responsibilities

  - Lead the technical implementation of Claude Enterprise
    within a complex enterprise environment.
  - Lead the design and implementation of Claude Cowork
    solutions, enabling intelligent workflow automation and
    AI-powered productivity across business functions.
  - Work closely with customer stakeholders, translating
    business challenges into scalable AI solutions.
  - Contribute to technical architecture, integration patterns
    and engineering best practices for enterprise-wide Claude
    adoption.
  - Lead the integration of Claude Enterprise with existing
    enterprise systems, applications, data sources and
    business workflows.
  - Provide hands-on technical leadership, solving complex
    engineering challenges and guiding teams through
    implementation and deployment.
  - Ensure solutions meet enterprise security, data privacy,
    governance and regulatory requirements, particularly
    within financial services.
  - Identify and prioritise high-value AI use cases across asset
    management and financial services, driving measurable
    business outcomes.
  - Collaborate with business leaders, architects, engineers and
    delivery teams to drive successful implementation,
    adoption and continuous improvement.
  - Mentor and provide technical guidance to engineers,
    supporting engineering capability and delivery standards.
  - Contribute to V2 AI's reusable frameworks, accelerators and
    best practices across Claude Enterprise and agentic AI
    implementations.

  What We're Looking For

  - Strong hands-on experience with Claude Cowork, including
    designing and implementing AI-powered workflows within
    enterprise environments.
  - Experience leading the implementation and rollout of Claude
    Enterprise or comparable enterprise AI platforms.
  - Strong financial services expertise, specifically within
    asset management, with an understanding of industry
    processes, business workflows and technology environments.
  - Demonstrated experience delivering complex enterprise AI
    implementations from solution design through to production
    deployment and adoption.
  - Strong technical expertise, including enterprise
    integrations, APIs, cloud infrastructure and scalable AI
    solutions.
  - Strong understanding of LLMs, agentic AI, workflow
    automation and enterprise AI implementation patterns.
  - Knowledge of enterprise security, data privacy, governance
    and regulatory requirements within highly regulated
    industries.
  - Ability to engage and collaborate with technical and
    business stakeholders, including enterprise architects and
    technology leaders.
  - Experience guiding and mentoring engineers, supporting
    technical delivery and engineering best practices.
  - Strong consulting mindset, with the ability to navigate
    ambiguity, solve complex problems and take ownership of
    customer outcomes.

  Highly Regarded

  - Experience with Claude Code, Claude APIs and Anthropic's
    broader ecosystem.
  - Experience with AWS and cloud-based enterprise
    architectures.
  - Experience across investment management, portfolio
    management, investment operations or related asset
    management workflows.
  - Experience supporting enterprise-wide AI transformation,
    adoption and change management initiatives.
  - Experience developing reusable AI frameworks, accelerators
    and engineering standards.

  Apply Now

  If you're a hands-on technical leader passionate about
  Claude, agentic AI and transforming how financial services
  organisations operate, we'd love to hear from you.

  APPLY NOW and help lead the future of enterprise AI with V2
  AI!
