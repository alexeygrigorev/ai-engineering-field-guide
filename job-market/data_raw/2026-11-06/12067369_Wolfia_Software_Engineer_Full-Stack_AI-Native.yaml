title: Software Engineer (Full-Stack, AI-Native)
company: Wolfia
location: USA
remote: true
work_type: FULL_TIME
description: |
  Wolfia is a fast-growing, Y Combinator and Khosla Ventures-
  backed startup. We are developing AI agents focused on sales
  enablement. Our environment is pretty intense and demands a
  high level of commitment, characteristic of a rapidly
  scaling company. We're looking for engineers who are truly
  native with AI and thrive in environments with high
  ownership and customer obsession.

  Our Product: AI agents making enterprise knowledge instantly
  usable for your sales teams.

  Wolfia provides AI agents designed to equip sales teams with
  the information they need, precisely when they need it. Our
  platform connects to all your company's existing knowledge
  sources (Google Drive, Notion, Slack, email, websites, trust
  centers, SOC 2 documentation, etc.). These autonomous AI
  agents maintain an up-to-date understanding of this
  information and use it to draft, validate, and format
  accurate responses to customer questions, security
  questionnaires, and RFPs. The result is that sales teams can
  deliver reliable information in seconds, rather than waiting
  on subject-matter experts, significantly accelerating the
  sales cycle. While tools like Glean help employees find
  internal knowledge, Wolfia's AI agents actively use that
  knowledge to generate actionable content for sales teams,
  turning a process that often takes weeks into mere minutes.
  Wolfia is already trusted by notable customers such as
  Amplitude, CircleCI, Sardine, Peregrine, and Lilt.

  As a Software Engineer at Wolfia, you will be central to
  developing and scaling our AI agents for sales enablement.
  You'll work closely with the founders, contributing
  significantly to a product that leverages advanced large
  language models to solve critical business challenges.

  Core Responsibilities:

  - Own and lead engineering efforts to build and enhance our
    AI-driven sales enablement platform.
  - Lead frontend development using technologies like Next.js,
    React, TypeScript, Radix UI, Tailwind and Shadcn.
  - Lead backend development using Python, Postgres, OpenAI, and
    FastAPI, with a focus on AI agent capabilities.
  - Engage with customers for feedback and iterate quickly to
    improve our product in a fast-paced development cycle.
  - Drive the technical design process for our services and
    features, ensuring robust AI integration.
  - Actively participate in roadmap planning and feature
    discussions, bringing an AI-first perspective relevant to
    sales enablement.

  Our Tech Stack:

  - Frontend: Next.js, React, TypeScript, Radix UI, Shadcn,
    Tailwind
  - Backend: Python, Postgres, OpenAI, FastAPI
  - Deployment: AWS, Vercel, Porter, Supabase

  Our Core Values:

  - Built to learn: We should be focused on learning more than
    executing.
  - Act like an owner: Treat Wolfia like your own. Drive growth
    with creativity and precision.
  - Bias for action: Take necessary actions & decisions, even
    with incomplete info.
  - Hacker mindset: Find the 80/20 solution and iterate;
    creative problem‑solving.
  - Show respect: We value the golden rule, treating others with
    the utmost respect.
  - Disagree and commit: We welcome all perspectives and healthy
    debate. Once a decision is made, we fully commit to its
    execution, regardless of initial disagreements.

  Qualifications:

  - Native experience with AI is required: You possess a deep
    understanding of how to architect, build, and integrate AI
    agents, particularly for applications like reasoning based
    information retrieval, knowledge synthesis, and response
    generation. You approach problems with an AI-native
    mindset.
  - Proficiency in full-stack development across our frontend
    (Next.js, React, TypeScript) and backend (Python,
    Postgres, FastAPI) technologies.
  - A genuine passion for problem-solving, skilled in writing
    clean, performant, and scalable code.
  - Excellent communication skills and a customer-centric
    approach to product development.
  - A strong sense of ownership and the drive to thrive in a
    fast-paced, intense, and rapidly growing YC startup
    environment.

  Candidates with an Edge:

  - You are deeply familiar with Large Language Models (LLMs)
    and can use AI to develop faster & reduce turnaround time
    on features.
  - You can use test-driven development to reduce functional and
    performance issues.
  - Demonstrated ability to handle complex data, build robust
    knowledge systems, and address security challenges
    relevant to enterprise information.
  - Previous experience thriving in an early-stage, high-growth
    startup focused on B2B SaaS or AI.

  About the Interview

  Thank you for your interest in joining Wolfia! We value your
  time and have designed our interview process to be thorough
  yet respectful of your schedule. Our process consists of a
  total of 2.5 hours of interviews (either in-person or via
  video conferencing).

  - Round 1 - 15 min interview: Discuss your background,
    personal goals, and how they align with the challenges we
    solve at Wolfia.
  - Round 2 - 45 min interview: Discuss your technical
    experience and how you can contribute to our core software
    platform and the engineering team.
  - Round 3 - 60 min technical interview: Deeper dive into your
    technical capabilities and problem-solving approach.
  - Round 4 - 30 min culture fit interview: Assess how well you
    align with Wolfia's core values and team dynamics in our
    fast-paced setting.

  If all goes well, a job offer with compensation and benefits
  will be sent by the end of the day. We move fast!
