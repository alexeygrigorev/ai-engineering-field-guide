description: |
  We're seeking someone to join our Technology Architecture &
  Modernization (A+M) team as an AI Cloud Solution Engineer in
  Operation Technology to help build a firmwide AI Development
  Platform that will aid the adoption of AI capabilities
  throughout the enterprise. The ideal candidate will have
  strong hands-on experience of building secure cloud
  services, software platforms, API based development, etc.
  Knowledge of LLM models and hands-on experience implementing
  solutions using Generative AI are also preferable. The
  candidate will have a strong passion for using AI to
  increase productivity as well as help generate new ideas for
  product improvements.

  This role requires a strong combination of both software
  development and cloud infrastructure knowledge and
  experience. The successful candidate must be able to
  demonstrate technical leadership with a track record of
  developing and driving innovative solutions.

  Morgan Stanley is advancing AI across the firm through
  applications such as Genome and AI@MS Assistant, helping
  deliver more personalized advice to clients while creating
  new opportunities to enhance capabilities for both internal
  users and clients.

  Technology Architecture & Modernization (A+M) sits at the
  center of Morgan Stanley’s technology strategy, bringing
  together architecture, product delivery, and developer
  enablement to advance the Firm’s multi-year modernization
  roadmap. As the group grows, this role offers the
  opportunity to solve complex, high-impact challenges with
  broad visibility across Technology and to collaborate with
  high-performing, multidisciplinary teams, including
  Distinguished Engineers.

  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities. This is a Software
  Engineer position at Director level, which is part of the
  job family responsible for developing and maintaining
  software solutions that support business needs.

  Since 1935, Morgan Stanley is known as a global leader in
  financial services, always evolving and innovating to better
  serve our clients and our communities in more than 40
  countries around the world.

  What you’ll do in the role:

  - Collaborate with other engineers and teams to onboard new
    cloud services to Morgan Stanley
  - Architect new cloud solutions for new use cases consistent
    with Morgan Stanley security standards.
  - Build POC’s and example code through which developers can
    access Gen AI models via standard APIs.
  - Have an application developer mindset and build common,
    reusable solutions to scale generative AI use cases.
  - Contribute to major design decisions and product selection
    for building generative AI solutions.
  - Develop tooling and self-service capabilities for deploying
    AI solutions. Collaborate with developers to enhance the
    developer’s experience when building and deploying AI
    applications.
  - Document best practices on generative AI ecosystems, when to
    use which tools, available models such as GPT, Llama,
    Claude, etc. and libraries such as Langchain and Sematic
    Kernel.

  What you’ll bring to the role:

  - Experience implementing enterprise architecture in at least
    one major cloud provider (Azure, AWS, GCP).
  - Bachelor's or a master's degree in computer science or
    related field, or equivalent job experience.
  - Strong hands-on development background in Python
    (specifically API based development in Flask or FastAPI),
    additional languages are a bonus.
  - Experience building applications using AI development
    services on prominent cloud platforms such as Azure Open
    AI, Azure AI Foundry, Azure Search, Azure Cognitive
    Services, Terraform, AWS Bedrock, AWS Sagemaker, Gemini
    enterprise agent platform.
  - Experience building AI applications, preferably Generative
    AI and LLM based apps.
  - Experience deploying resources to the cloud via terraform
    and CI/CD pipelines
  - Experience designing and implementing highly scalable
    architecture for enterprise applications
  - Strong desire and ability to influence development teams and
    help them adopt AI.
  - At least 4 years' relevant experience would generally be
    expected to find the skills required for this role.

