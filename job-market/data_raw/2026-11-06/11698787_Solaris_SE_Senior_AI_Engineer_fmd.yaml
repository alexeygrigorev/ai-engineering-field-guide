description: |
  Solaris is Europe's leading embedded finance platform.
  Solaris’ full German banking license and proprietary modular
  B2B tech stack empowers its partners – from SMEs to large,
  multinational, non-financial companies – to offer compliant,
  customer-centric banking services, providing seamless
  experiences to customers across all industries. Founded in
  2016, Solaris pioneered the Banking-as-a-Service market with
  an unparalleled combination of tech and banking. Solaris is
  headquartered in Berlin and employs 300 people in Europe.

  Your Team

  You will join our process engineering team that is tasked
  with automating business processes. You will have the
  opportunity to dive into the complex worlds of operations of
  a bank. The team is driving process improvements with
  cutting edge GenAI implementations. Focusing on areas like
  customer support, fraud detection and many more use cases.

  Your Role

  We're looking for a Senior AI Engineer to join our process
  engineering team shaping the future of banking operations.
  In this role, you'll work at the intersection of operations,
  product and engineering, owning the design, delivery, and
  operation of complex process automations. You’ll collaborate
  closely with Product Management, Engineering Leadership,
  Operations and fellow engineers to build secure, resilient,
  and reliable banking solutions.

  - Revolutionize banking operations processes using GenAI.
  - Support operations in evaluating their business processes
    from a technical perspective.
  - Architect and deliver scalable, secure operations workflows
    based on user needs.
  - Collaborate with product, engineering and operations  to
    ensure technical decisions align with business outcomes.
  - Take end-to-end ownership of systems ("You build it, you run
    it"), from design and deployment to operations.
  - Guide architectural decisions and long-term technical
    strategy within your domain.

  We'd love to see

  Depending on your level of experience, your responsibilities
  and scope of role will range. We don’t care much about fancy
  titles, but rather about real personal and professional
  development, as laid out in our learning framework. Let’s
  figure together out how you can contribute to our team.

  - Proficiency in TypeScript/Node.js, with a proven track
    record of developing scalable automation solutions.
  - Knowledge of Terraform and basics of DevOps.
  - Previous experience in integrating GenAI solutions.
  - Extensive experience in the development and operation of
    cloud-native applications across AWS.
  - Communication skills and a drive for aligning engineering
    efforts with business goals.
  - Ability to lead cross-functional initiatives, effectively
    balancing technical and product objectives in a secure and
    regulated environment.
  - Strong expertise in building and operating distributed
    systems, prioritizing performance, reliability, and
    maintainability.

  Benefits

  - Home office budget.
  - Learning & development budget of €1000 per year and a
    transparent growth framework to support your career goals.
  - Competitive salary and a variable remuneration program.
  - Monthly meal allowance.
  - Deutschland ticket subsidy.
  - 28 vacation days, increasing by 2 days after 2 years and 3
    days after 3 years with Solaris.
  - Opportunity to work abroad for up to 12 weeks per year.

  While job ads usually paint an ideal picture of a candidate,
  studies show that most applicants meet an average of 60% of
  the criteria. Unfortunately, many promising candidates tend
  to apply only if they meet all the criteria. So if you think
  you have what it takes, but don't necessarily meet every
  single item in the job description, please contact us
  anyway. We'd love to talk with you and find out if you might
  be a good fit for us.

  At Solaris, we are committed to nurturing an inclusive
  environment, where all Solarians feel valued, respected and
  supported. We are dedicated to building a diverse workforce
  that reflects the diversity of our communities. We are
  committed to equal employment opportunity regardless of
  color, ethnicity, religion, sex, origin, disability, marital
  status, citizenship, or gender identity. We are proud to be
  an equal opportunity workplace. If you have a disability or
  special need that requires accommodation, please let us
  know.

