description: |
  We currently have a career opportunity for a Senior
  Databricks AI Engineer to join our AI Data Platform BU.



  As a Senior Technical Consultant, you will participate in
  all aspects of the software development lifecycle, which
  includes estimating, technical design, implementation,
  documentation, testing, deployment, and support of
  applications developed for our clients. As a team member,
  you will take direction from solution architects and leads
  on development activities.



  Perficient is always looking for the best and brightest
  talent, and we need you! We’re a quickly-growing, global
  digital consulting leader, and we’re transforming the
  world’s largest enterprises and biggest brands. You’ll work
  with the latest technologies, expand your skills, and become
  a part of our global community of talented, diverse, and
  knowledgeable colleagues.





  Responsibilities

  - Design, build, and deploy AI/ML and Generative AI solutions
    using Databricks.
  - Develop scalable data pipelines leveraging Spark, Delta
    Lake, and Unity Catalog.
  - Build, train, and operationalize machine learning models
    using MLflow.
  - Develop RAG-based applications and LLM-powered solutions.
  - Implement MLOps best practices, including CI/CD, model
    monitoring, and governance.
  - Collaborate with data, engineering, and business teams to
    deliver innovative AI solutions.
  - Optimize performance, scalability, and reliability of
    Databricks-based AI platforms.

  Qualifications

  - 5+ years of experience in AI/ML, Data Engineering, or
    Software Engineering.
  - Strong hands-on experience with Databricks, Python, PySpark,
    and SQL.
  - Experience with Apache Spark, MLflow, Delta Lake, and Unity
    Catalog.
  - Experience building and deploying Generative AI, LLM, or RAG
    solutions.
  - Experience with Azure, AWS, or GCP cloud platforms.
  - Knowledge of MLOps, model deployment, and AI governance best
    practices.
  - Databricks certifications (Data Engineer or Machine Learning
    Engineer) is Preferred
  - Experience with LangChain, LangGraph, vector databases, and
    AI agents
  - Experience delivering enterprise-scale AI and analytics
    solutions.

  Key Skills :Databricks, Generative AI, LLMs, RAG, MLflow,
  Apache Spark, PySpark, Python, SQL, Delta Lake, Unity
  Catalog, MLOps, Azure, AWS, GCP, AI Agents.



