description: |
  T-Rex Solutions is looking to select an AI Engineer to
  support our Internal Revenue Service (IRS) EDOS program. The
  overall mission of this program is to modernize the IRS
  legacy Tax processing systems and is critical to the overall
  modernization of the IRS to improve taxpayer experience,
  increase voluntary compliance, and reduce the IRS’s reliance
  on costly and unsustainable legacy technology. This role
  will play a pivotal role in designing, developing, and
  implementing robust solutions for a variety of programs and
  applications.

  The AI Engineer partners with client teams to architect,
  develop, and operationalize responsible AI systems—including
  RLHF instruction models, generative applications, and
  comprehensive guardrails—to align with ethical, performance,
  and business objectives. They drive the adoption of AI
  development standards and conduct rigorous evaluations of
  LLMs against industry benchmarks and custom metrics. This
  role involves selecting, building, and fine-tuning machine
  learning models using Python, Java, and open-source
  frameworks, applying advanced NLP and ML techniques to
  address complex language challenges.

  Embedding robust software engineering practices, the AI
  Engineer implements reproducible experiment tracking,
  version control workflows (Git), unit and integration
  testing, and CI/CD pipelines tailored for ML deployments.
  They leverage containerization (Docker/Kubernetes) and
  infrastructure-as-code to ensure scalable, maintainable
  systems, participate in peer code reviews, and document
  solutions for cross-team knowledge sharing. Collaborating
  with leadership and stakeholders, they identify AI
  opportunities, shape strategic roadmaps, and translate
  technical findings into clear, actionable insights for
  diverse audiences.

  Responsibilities:

  - Lead and implement the development and optimization of
    prompt engineering strategies
  - Design and implement Retrieval-Augmented Generation (RAG)
    frameworks
  - Develop AI applications using Python and cloud services
  - Manage AI project delivery and support technical
    implementation
  - Collaborate with cross-functional teams to integrate AI
    solutions

  Requirements:

  - Bachelor's Degree and 7+ years of experience
  - US Citizenship required
  - Must possess an active IRS MBI Clearance and have current
    GFE
  - Hands on experience with Azure OpenAI and AWS cloud services
  - Proficient in Python AI application development
  - Deep understanding of RAG frameworks and prompt engineering
    techniques
  - Strong project management and delivery leadership skills
  - Experience supporting complex AI/ML initiatives
  - Demonstrated ability to translate technical concepts for
    diverse stakeholders
  - Experience with the following:
    - Machine learning model optimization
    - Advanced prompt engineering techniques
    - Cloud infrastructure management
    - Agile project delivery methodologies.
  - Excellent oral and written communication skills with client
    stakeholders at all organizational and technical levels

  Desired Skills:

  - Prompt Engineering
  - Artificial Intelligence (AI)
  - Large Language Models (LLMs)
  - AWS GovCloud
  - Python

  T-Rex Overview

  Established in 1999, T-Rex Solutions, LLC is a proven mid-
  tier business providing data-centric mission services to the
  Federal government as it increasingly tries to secure and
  leverage the power of data. We design, integrate, secure,
  and deploy advanced technical solutions for our customers so
  they can efficiently fulfill their critical objectives.
  T-Rex offers both IT and professional services to numerous
  Federal agencies and is a leader in providing high quality
  and innovative solutions in the areas of Cloud and
  Infrastructure Services, Cyber Security, and Big Data
  Engineering.

  T-Rex is constantly seeking qualified people to join our
  growing team. We have built a broad client base through our
  devotion to delivering quality products and customer
  service, and to do that we need quality individuals. But
  more than that, we at T-Rex are committed to creating a
  culture that supports the development of every employee's
  personal and professional lives. T-Rex has made a commitment
  to maintain the status of an industry leader in compensation
  packages and benefits which includes competitive salaries,
  performance bonuses, training and educational reimbursement,
  Transamerica 401(k) and Cigna healthcare benefits.

  T-Rex is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, religion, color, sex (including pregnancy
  and sexual orientation), parental status, national origin,
  age, disability, family medical history or genetic
  information, political affiliation, military service, or
  other non-merit based factors.

  In compliance with pay transparency guidelines, the annual
  base salary range for this position is $100,000 - $152,000.
  Please note that the salary information is a general
  guideline only. T-Rex considers factors such as (but not
  limited to) scope and responsibilities of the position,
  candidate’s work experience, education/training, key skills,
  internal peer equity, as well as market and business
  considerations when extending an offer.

  T-Rex offers a diverse and collaborative work environment,
  exciting opportunities for professional growth, and generous
  benefits, including: PTO available to use immediately upon
  joining (prorated based on start date), paid parental leave,
  individual and family health, vision, and dental benefits,
  annual budget for training, professional development and
  tuition reimbursement, and a 401(k) plan with company match
  fully vested after 60 days of employment among other
  benefits.
