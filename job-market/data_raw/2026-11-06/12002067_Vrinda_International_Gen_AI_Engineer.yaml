description: |
  Gen AI Engineer

  Summary

  We are seeking a highly skilled Gen AI Engineer to drive the
  development and deployment of advanced artificial
  intelligence solutions within our IT Services division. In
  this pivotal role, you will architect and implement cutting-
  edge AI agents, workflows, and generative models to solve
  complex business challenges. The position demands a deep
  understanding of Large Language Models (LLMs), Retrieval-
  Augmented Generation (RAG) architectures, and the ability to
  orchestrate these technologies on robust cloud
  infrastructures. This role is essential for translating
  innovative AI concepts into scalable, production-ready
  systems that enhance operational efficiency and deliver
  exceptional value to our clients.

  Responsibilities

  - Design, build, and optimize autonomous AI agents and complex
    workflow automation systems using specialized authoring
    frameworks.
  - Develop and deploy generative AI applications leveraging
    Large Language Models (LLMs) and Retrieval-Augmented
    Generation (RAG) techniques to ensure high-quality,
    context-aware outputs.
  - Architect and manage cloud-native solutions on AWS,
    specifically utilizing Elastic Kubernetes Service (EKS)
    for container orchestration and scalability.
  - Establish and maintain robust CI/CD pipelines to automate
    the testing, integration, and deployment of machine
    learning models and software updates.
  - Write clean, efficient, and maintainable code in Python to
    support backend logic, data processing, and model
    integration.
  - Collaborate with cross-functional teams to define technical
    requirements, troubleshoot system issues, and ensure the
    reliability of AI-driven services.
  - Continuously evaluate emerging AI tools and technologies to
    recommend improvements and keep our infrastructure at the
    forefront of industry innovation.

  Requirements

  Requirements:

  - Proven professional experience of 5 to 7 years in software
    engineering, with a specialized focus on Generative AI and
    Machine Learning.
  - Demonstrated expertise in building AI agents, managing
    workflows, and utilizing Gen AI authoring frameworks.
  - Strong proficiency in Python programming, with a solid track
    record of developing production-grade applications.
  - In-depth knowledge of AWS Cloud Services, particularly
    experience with Kubernetes (EKS) for container management.
  - Hands-on experience implementing and maintaining CI/CD
    pipelines for AI and software development lifecycles.
  - Practical understanding of Generative AI concepts, including
    LLM architecture and RAG implementation strategies.
  - Ability to work effectively in a fast-paced environment,
    solving complex technical problems with innovative
    solutions.

  Salary: ₹25 LPA
