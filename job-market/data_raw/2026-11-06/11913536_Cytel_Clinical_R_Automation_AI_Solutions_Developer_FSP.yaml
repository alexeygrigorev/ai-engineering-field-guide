description: |
  Who Are You?



  An experienced R/AI Developer with a passion for clinical
  development and analysis, adept at utilizing advanced
  programming and data science methods, you will lead
  development activities to improve clinical studies. You are
  excited and enthusiastic, motivate your teams to do great
  work and collaborate easily with your clients. You never
  settle for what is, but always push clinical development
  forward to what it could be. You motivate others to do the
  same.



  Sponsor-dedicated:



  Working fully embedded within one of our pharmaceutical
  clients, with the support of Cytel right behind you, you'll
  be at the heart of our client's innovation. As a Developer
  you will be dedicated to one of our global pharmaceutical
  clients; a company that is driving the next generation of
  patient treatment, where individuals are empowered to work
  with autonomy and ownership. This is an exciting time to be
  a part of this new program.



  Position Overview:



  Our R Automation and AI Solutions Developers provide
  analysis and automation support and influence for the
  associated client's trials. This role involves working
  closely with statisticians, programmers, data scientists,
  and AI/Automation leads to identify practical workflow
  improvement opportunities, provide proof-of-concept tools,
  and mature successful prototypes into documented, reusable,
  and maintainable solutions.





  Responsibilities

  As an R Automation and AI Solutions Developer your
  responsibilities will include:

  - Interpret user requirements and identify practical workflow
    improvements.
  - Define sensible scope for request.
  - Build proof-of-concept tool.
  - Utilize LLM-supported coding, R/Shiny tools.
  - Create testing and documentation.
  - Ensure that mature prototype aligns with regulated clinical
    development expectations.
  - Present to technical and non-technical audiences.

  Qualifications

  Here at Cytel we want our employees to succeed and we enable
  this success through consistent training, development and
  support. To be successful in this position you will have:

  - Strong R programmer.
  - Comfortable with clinical trial data and CDISC concepts.
  - Experience building automation tools, R packages, R Shiny
    applications and dashboards, or reusable internal
    utilities.
  - Understands regulated delivery: validation, audit trail,
    traceability, version control, documentation, testing.
  - Understands Git, code review, unit testing, CI/CD concepts.
  - Experience using LLMs for coding, summarization, extraction,
    documentation, review, or workflow automation.
