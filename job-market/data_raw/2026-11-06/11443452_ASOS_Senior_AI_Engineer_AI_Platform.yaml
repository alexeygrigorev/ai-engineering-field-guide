  Job Description

  As a Senior AI Engineer, you will be part of the AI Platform
  team, helping to build and scale the shared foundations that
  enable AI capabilities across ASOS. The primary focus of
  this role will be contributing to the Agentic AI Platform
  initiative, alongside other core AI platform capabilities as
  the platform evolves.

  This role is focused on the platform layer, rather than
  individual business use cases. You will design and implement
  shared capabilities, standards, reusable templates and
  reference implementations for agentic AI on Azure, enabling
  engineering teams across ASOS to safely design, deploy and
  operate AI agents at enterprise scale. Working closely with
  Product teams, Cloud Infrastructure, Security and
  engineering teams, you will help establish the patterns and
  capabilities that make AI secure, observable, reliable and
  reusable by default.

  You will also contribute to the production foundations
  needed to operate AI capabilities reliably, including
  LLMOps, model access patterns, prompt and agent lifecycle
  practices, evaluation, observability and secure enterprise
  integration.

  This is a hands-on engineering role where the capabilities
  you build will be used by other teams across ASOS, helping
  to establish consistent engineering practices for building
  and operating AI at scale.

  What you’ll be doing

  - Designing and building shared AI platform capabilities on
    Azure, with a strong focus on agentic AI patterns such as
    agent runtimes, orchestration and tool integration
  - Contributing to the Agentic AI Platform initiative, helping
    define how agents are built, integrated and operated
    across the organisation
  - Designing and maintaining standardised templates, reusable
    components and reference implementations for LLM and
    Generative AI workflows, enabling engineering teams to
    adopt consistent patterns
  - Building reusable patterns for prompt design, tool calling,
    multi-step agent flows, retries and failure handling
  - Helping establish engineering standards and best practices
    for production AI development across ASOS
  - Implementing secure, governed access patterns for LLMs and
    enterprise tools using APIM, platform gateways, Entra ID,
    RBAC and managed identities
  - Contributing to LLMOps and model runtime patterns, including
    standard approaches for model access, routing, caching,
    token optimisation and cost-aware usage controls
  - Supporting lifecycle and evaluation practices for agent
    configurations, prompts and AI workflows, including
    testing, controlled change and release readiness
  - Designing secure tool-access patterns for agents, including
    MCP/tool abstraction, credential management and enterprise
    API integration
  - Contributing to AgentOps and GenAIOps capabilities,
    including telemetry, run history, task outcomes, error
    analysis and feedback loops
  - Contributing to reliability patterns for production AI
    systems, including latency monitoring, alerting, scaling
    considerations and operational readiness
  - Applying CI/CD and software engineering best practices to AI
    platform and agentic components
  - Embedding observability by default, ensuring AI systems are
    measurable, debuggable and auditable through logs, metrics
    and traces
  - Working with Cloud Infrastructure and Security teams to
    design secure, scalable and cost-effective Azure
    environments
  - Working with other engineering teams to enable adoption of
    the platform, helping teams move AI capabilities from
    experimentation into reliable production





  Qualifications



  - Significant experience as an AI Engineer, AI Platform
    Engineer, Software Engineer or similar, delivering
    production-grade AI systems
  - Hands-on experience with LLMs, Generative AI and agent-based
    systems in real-world production environments
  - Experience building reusable AI capabilities, platforms,
    frameworks, templates or services that can be adopted by
    other engineering teams
  - Strong understanding of the end-to-end AI lifecycle, from
    experimentation through deployment and operation
  - Practical understanding of production LLM or GenAI runtime
    concerns, such as model access, routing, caching, token
    usage, cost optimisation and reliability
  - High proficiency in Python, with experience building APIs
    and service-oriented systems
  - Experience working with CI/CD pipelines, automated testing
    and versioned deployments for AI or platform components
  - Practical experience with observability tooling (logging,
    metrics, tracing and alerting) and using telemetry to
    improve reliability and performance
  - Hands-on experience working with Azure cloud and AI services
  - Experience with Azure AI Foundry is preferred, but we are
    also open to candidates with strong hands-on experience
    using comparable GenAI or agent platforms and the ability
    to apply those patterns within Azure
  - Experience with Azure API Management (APIM) is preferred,
    particularly as a governance or integration boundary
  - Familiarity with AgentOps, MLOps or GenAIOps concepts,
    including monitoring, evaluation and feedback loops
  - Experience establishing or contributing to engineering
    standards, reusable patterns or best practices for AI
    development
  - Strong collaboration skills, with the ability to influence
    platform standards and enable other engineering teams
  - A pragmatic, engineering-led approach to responsible and
    ethical AI, with a focus on safety, reliability and trust

