description: |
  Overview

  We’re dedicated to speeding up the pace of innovation at
  manufacturing companies by automating product regulatory
  compliance. That frees up product and engineering teams to
  focus on building great products in automotive, aerospace,
  construction, medicine and healthcare, and more.

  We’re a small, focused team, and we’re proud to be
  supporting the development of products used by over 100
  million people worldwide. We’ve raised over $6M from IA
  Ventures, 8VC, and other institutional investors.

  Our Mission

  At Daptic, we’re building an AI platform to accelerate
  product development at manufacturing companies. We do that
  by creating NLP pipelines that identify all regulations that
  are relevant to any product in development, such as an
  electric battery or the latest level-4 autonomous driving
  system.

  As engineers, reading complex legal and regulatory documents
  are often the last things we want to do. What we’re building
  means that teams can stop poring over 1000-page PDFs via
  Google Translate and can instead focus entirely on building
  the best systems that the world needs today.

  In short, what you build with us will directly lead to
  companies launching physical products months faster than
  before.

  Role

  DiploAI is seeking an experienced Staff AI Engineer to lead
  the development of our systems.

  The ideal candidate has a deep LLM/NLP background paired
  with a strong backend skillset, and has experience iterating
  quickly in a startup environment. You are ready to work with
  new technologies and learn whatever is needed to solve the
  challenges we will face. You will have complete, end-to-end
  ownership of our core models—working closely with our data
  engineers and iterating with our customers.

  We are hybrid and based out of NYC. If you are not currently
  in NYC, we would ask you to plan to move to the city in the
  next few months.

  Responsibilities

  - Collaborate closely with Product, Go-to-Market, and Data to
    translate product strategy into iterative, scalable
    product/model versions that can be rapidly deployed for
    user testing
  - Lead the team in selecting the appropriate technology stack,
    framework, and tools to enable experimentation, testing,
    and tracking
  - Own the architecture and development of the working
    product/models and beyond
  - Strategize and articulate tradeoffs between speed and
    scalability

  Qualifications

  - Bachelors or Masters in Computer Science, Engineering, or
    other related field
  - 6+ years of professional experience, Staff Engineer/Tech
    Lead/Technical Founder experience
  - A highly analytical approach and proven ability to solve
    technical problems with ML, NLP, and LLMs (commercial,
    open-source, and proprietary)
  - Product-oriented and comfortable working in a dynamic
    environment with evolving objectives and fast iteration
    with users
  - Strong backend skillset with experience building production
    systems, beyond just a proof-of-concept
  - Expertise in programming languages (e.g., Python),
    experience with agentic frameworks, and experience working
    with various LLMs (e.g., OpenAI, Anthropic, Google,
    Moonshot)
  - Excellent communication skills and low ego
  - US work authorization is required; we do not currently
    support visa transfers

  Nice to haves

  - Experience with cloud service providers (e.g., AWS), and
    IIAC (Terraform, Cloudformation)
  - Interest in being involved in the product development
    process
