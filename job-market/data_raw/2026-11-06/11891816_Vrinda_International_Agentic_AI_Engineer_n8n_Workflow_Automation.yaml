description: |
  Summary

  We are seeking a highly skilled Agentic AI Engineer to lead
  the design and implementation of intelligent automation
  solutions within our IT Services division. In this pivotal
  role, you will leverage advanced AI capabilities and the n8n
  workflow automation platform to drive operational efficiency
  and innovation. The ideal candidate will bridge the gap
  between complex business processes and cutting-edge
  artificial intelligence, creating robust, scalable systems
  that enhance organizational productivity and deliver
  measurable value.

  Responsibilities

  - Architect and develop sophisticated AI-driven workflows
    using n8n to automate complex business processes.
  - Design and implement agentic AI solutions that can
    independently execute tasks, make decisions, and adapt to
    dynamic environments.
  - Integrate diverse third-party APIs and services to ensure
    seamless data flow and connectivity across various
    platforms.
  - Optimize existing workflow structures to improve
    performance, reduce latency, and enhance overall system
    reliability.
  - Develop and maintain knowledge management systems that
    support AI agents with accurate, up-to-date information.
  - Conduct thorough analysis of business requirements to
    identify opportunities for automation and process
    improvement.
  - Troubleshoot and resolve technical issues related to
    workflow execution, API connectivity, and AI model
    performance.

  Requirements

  Requirements:

  - Possess 3 to 6 years of professional experience in software
    development, automation, or AI engineering.
  - Demonstrate strong proficiency in API integration, data
    handling, and workflow optimization techniques.
  - Show deep expertise in n8n workflow automation and the
    ability to build custom nodes or extensions.
  - Have a proven track record in developing agentic AI systems
    and deploying AI-driven process automation solutions.
  - Exhibit exceptional problem-solving abilities with a strong
    analytical mindset for diagnosing complex technical
    challenges.
  - Understand the principles of knowledge management and how to
    effectively structure data for AI consumption.
  - Hold a relevant degree in Computer Science, Engineering, or
    a related field, with a portfolio of automation projects.
