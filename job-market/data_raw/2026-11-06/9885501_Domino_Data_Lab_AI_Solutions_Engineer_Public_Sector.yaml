description: |
  Who we are

  At Domino, we build solutions that help the largest, highly
  regulated organizations adopt AI to accelerate mission-
  critical use cases. Our platform integrates a streamlined
  model and app development environment, advanced model,
  agent, and app hosting  capabilities, and novel governance
  capabilities providing regulator-ready AI at scale. Our
  customers — like Johnson & Johnson, GSK, Bristol Myers, UBS,
  FINRA and the US Navy — are using our software to solve some
  of the most important challenges in the world, such as
  developing new medicines, securing our financial markets, or
  protecting our country. Backed by Sequoia Capital, Coatue
  Management, NVIDIA, Snowflake and other leading investors,
  we have been in business for over a decade but are still a
  small team operating with the spirit of a startup. In the
  world of AI today, we believe that the future is still being
  invented — and we want to be the ones building it. For more
  information, visit www.domino.ai

  What we are building

  Our AI Solutions Engineers work with customers to understand
  the problems they are trying to solve, then design solutions
  on our platform that address them. Working with data science
  and ML teams, you will uncover where they get stuck, shape
  ideas into technical approaches, and build prototypes, demos
  and proof-of-concepts that show how their problem gets
  solved. Our Enterprise Account Executives manage the
  commercial relationship, so your focus stays on the problem
  and the solution.

  We are a growing company, so you will also feed customer
  insight back to Product, Engineering and Marketing, helping
  shape where the platform goes next. If you enjoy getting to
  the root of a problem and building something that works, you
  will feel at home here.

  What your impact will be

  - Lead technical evaluations and demonstrations of the Domino
    platform for customers across the Department of Defense,
    civilian agencies, federally funded research and
    development centers (FFRDCs), and major defense
    contractors.
  - Design and execute proof-of-concept deployments tailored to
    each customer’s environment and mission needs, showcasing
    Domino’s integration with their data science workflows and
    infrastructure.
  - Collaborate with account executives to craft solution
    architectures that meet federal security and compliance
    standards (e.g., FedRAMP, IL5).
  - Develop and maintain reusable demonstration environments and
    technical assets that accelerate future sales cycles.
  - Drive post-POC adoption readiness by partnering with
    Customer Success and Solutions Architects to ensure a
    smooth handoff into deployment.
  - Success will be evident through higher technical win rates,
    reduced time to close, and increased adoption within key
    government accounts.

  What we look for in this role

  - Security Clearance: This position requires an active U.S.
    Secret Security Clearance (US Citizenship required), with
    the ability to obtain a Top Secret / Sensitive
    Compartmented Information (TS/SCI) Security Clearance and
    program access (post start). A U.S. Security Clearance
    that has been active in the past 24 months is considered
    active.
  - Proven success in pre-sales or solutions engineering,
    ideally supporting enterprise software or AI/ML platforms.
    This does not necessarily need to be at a software vendor,
    equivalent solution engineering tasks internally or as a
    consultant developer could work.
  - Experience with U.S. public sector customers, especially
    within federal agencies, defense, or national labs —
    understanding their procurement processes, compliance
    constraints, and security environments.
  - Track record of leading successful technical evaluations or
    pilots that resulted in multimillion-dollar enterprise or
    government software deals.
  - Experience working in complex, highly regulated IT
    environments, including hybrid or air-gapped systems.
  - Proficiency in Python, R, and modern data science / machine
    learning tools.
  - Familiarity with containerization (Docker, Kubernetes),
    cloud platforms (AWS GovCloud, Azure Government, GCP), and
    networking concepts.
  - Understanding of the end-to-end AI lifecycle, from
    experimentation to production.

  What we value

  - We strongly believe in the value of growing a diverse team
    and encourage people of all backgrounds, genders,
    ethnicities, abilities, and sexual orientations to apply
  - We value a growth mindset. High-performing creative
    individuals who dig into problems and see the
    opportunities for success
  - We believe in individuals who seek truth and speak the truth
    and can be their whole selves at work
  - We value all of you that believe improving is always
    possible. At Domino, everything is a work in progress – we
    can do better at everything
  - We emphasize an environment of teaching and learning to
    equip employees with the tools needed to be successful in
    their function and the company

  #LI-Remote

  For sales roles, the range provided is the role's On Target
  Earnings ("OTE") range, meaning that the range includes both
  the sales commissions/sales bonuses target and annual base
  salary for the role. This salary range will be narrowed
  during the interview process based on a number of factors,
  including the candidate's experience, qualifications, and
  location. Additional benefits for this role may include:
  equity, company bonus or sales commissions/bonuses; 401(k)
  plan; medical, dental, and vision benefits; and wellness
  stipends.

  Total Compensation Range

  $200,000—$250,000 USD
