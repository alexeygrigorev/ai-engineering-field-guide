title: Senior AI Automation Engineer
company: MSCI Inc.
location: Mumbai, IND
work_type: FULL_TIME
company_size: 5,040 Employees
description: |
  Your Team Responsibilities

  - Design, develop, and maintain the enterprise AI Automation
    platform supporting 150+ automation workflows across
    Infrastructure Operations while maintaining ≥99%
    availability and SLA targets.
  - Own automation and AI solutions end-to-end, from design and
    development through deployment, operations, and continuous
    optimization.
  - Lead delivery of AI automation initiatives aligned with
    business priorities across Infrastructure
  - Contribute to AI-enabled and self-healing automation
    capabilities across the platform.
  - Mentor associate engineers and promote engineering best
    practices, reusable frameworks, and high-quality software
    delivery.

  Your Key Responsibilities

  - Design, build, and maintain scalable automation solutions
    across infrastructure and cloud using Python, APIs, AI
    technologies, and RPA where appropriate.
  - Build intelligent AI-powered workflows that reduce manual
    effort, improve operational efficiency, and enable self-
    healing infrastructure operations.
  - Develop reusable automation frameworks, APIs, and services
    to accelerate enterprise automation initiatives.
  - Integrate Large Language Models (LLMs) with enterprise
    systems through secure APIs and tool orchestration.
  - Apply governance, security, and audit best practices to
    ensure automation remains compliant and production ready.
  - Troubleshoot complex production issues, perform root cause
    analysis, and continuously improve platform reliability.

  Your skills and experience that will help you excel

  Infrastructure & Cloud

  - 7–11 years of experience in Automation Engineering,
    Infrastructure Automation, Cloud Automation, Platform
    Engineering, or AI Automation.
  - Solid grasp of infrastructure stack: Kubernetes, Linux and
    Windows, VMware, Cisco UCS, and networking fundamentals
    (L2/L3, DNS, load balancing, IP management)
  - Experience working with Azure or GCP cloud platforms.

  Programming & Development

  Strong hands-on experience in:

  - Python (preferred)
  - REST APIs
  - FastAPI (preferred)

  Experience designing reusable automation frameworks and
  enterprise APIs.

  AI & Agentic Automation

  Hands-on experience developing AI-enabled automation using
  Large Language Models (LLMs).

  Experience with:

  - Prompt Engineering
  - Agentic AI concepts
  - Tool Calling / Function Calling
  - AI Guardrails
  - Self-Healing Automation

  Experience with one or more of the following frameworks is
  highly desirable:

  - LangChain
  - LangGraph
  - CrewAI
  - Semantic Kernel
  - AutoGen
  - Model Context Protocol (MCP)

  AI Platforms

  Experience integrating enterprise applications with one or
  more AI platforms:

  - OpenAI
  - Azure OpenAI
  - Claude
  - Gemini

  Practical experience using AI for:

  - Automation
  - Code generation
  - Incident summarization
  - Workflow orchestration
  - Knowledge retrieval

  Cloud & DevOps

  Experience with:

  - Azure  or Google Cloud Platform (GCP)
  - Kubernetes
  - CI/CD pipelines

  Enterprise Integration

  Experience integrating with enterprise platforms such as:

  - Cloud SDKs
  - ServiceNow (preferred)

  Nice to Have

  Experience with:

  - Retrieval-Augmented Generation (RAG)
  - Vector Databases
  - AI Evaluation techniques
  - Knowledge Graphs

  Personal Attributes

  - Strong analytical and problem-solving skills.
  - Passion for AI-driven automation and enterprise platform
    engineering.
  - Ability to design scalable, reusable automation solutions.
  - Strong communication and collaboration skills.
  - Continuous learning mindset with a desire to adopt emerging
    AI technologies.

  About MSCI

  What we offer you

  - Transparent compensation schemes and comprehensive employee
    benefits, tailored to your location, ensuring your
    financial security, health, and overall wellbeing.

  - Flexible working arrangements, advanced technology, and
    collaborative workspaces.

  - A culture of high performance and innovation where we
    experiment with new ideas and take responsibility for
    achieving results.

  - A global network of talented colleagues, who inspire,
    support, and share their expertise to innovate and deliver
    for our clients.

  - Global Orientation program to kickstart your journey,
    followed by access to our Learning@MSCI platform, AI
    Learning Center , LinkedIn Learning Pro and tailored
    learning opportunities for ongoing skills development.

  - Multi-directional career paths that offer professional
    growth and development through new challenges, internal
    mobility and expanded roles.

  - We actively nurture an environment that builds a sense of
    inclusion belonging and connection, including eight
    Employee Resource Groups. All Abilities, Asian Support
    Network, Black Leadership Network, Climate Action Network,
    Hola! MSCI, Pride & Allies, Women in Tech, and Women’s
    Leadership Forum.

  At MSCI we are passionate about what we do, and we are
  inspired by our vision – to power better decisions. You’ll
  be part of an industry-leading network of creative, curious,
  and entrepreneurial pioneers. This is a space where you can
  challenge yourself, set new standards and perform beyond
  expectations for yourself, our clients, and our industry.

  MSCI strengthens global markets by connecting participants
  across the financial ecosystem with a common language. Our
  research-based data, analytics and indexes, supported by
  advanced technology, set standards for global investors and
  help our clients understand risks and opportunities so they
  can make better decisions and unlock innovation. We serve
  asset managers and owners, private-market sponsors and
  investors, hedge funds, wealth managers, banks, insurers and
  corporates.

