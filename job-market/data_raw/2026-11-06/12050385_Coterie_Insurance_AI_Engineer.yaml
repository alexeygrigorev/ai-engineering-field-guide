title: AI Engineer
company: Coterie Insurance
location: USA
remote: true
work_type: FULL_TIME
description: |
  Who we are:  Through a partnership-based approach, Coterie
  helps insurance professionals unlock untapped revenue in the
  small commercial space. With an innovative quoting platform
  that delivers accurate pricing and bindable quotes in less
  than one minute, Coterie makes small business insurance
  effortless. We are on a mission to build and foster a world-
  class team to bring speed, simplicity, and service to
  commercial insurance. We value integrity, humility, passion,
  and intelligence. If you want to push yourself and reshape a
  $200B+ market, we’re excited to talk to you!

  Position Summary: The AI Engineer will work within the
  Research & Development (R&D) subdomain of Coterie’s broader
  Data and Analytics (DnA) department to build, test and
  deploy intelligent systems that enhance business operations,
  customer and product capabilities. This role combines
  applied machine learning, software engineering and
  responsible AI practices to deliver reliable, scalable and
  secure AI-enabled solutions in production environments.

  Key Responsibilities:

  - Partner with DnA teammates, software engineers and business
    stakeholders to deliver high-impact, AI-enabled solutions
  - Integrate AI capabilities into internal tools, customer-
    facing products and operational workflows using APIs,
    cloud services and modern software development practices
  - Implement secure and compliant AI systems that align with
    company policies, regulatory expectations and responsible
    AI principles
  - Productionalize AI and machine learning solutions including
    generative AI, natural language processing, predictive
    modeling and automation workflows
  - Evaluate model performance, reliability, safety, bias,
    latency, cost and business impact; help establish
    monitoring and feedback loops for continuous improvement
  - Assist with the documentation of technical decisions, system
    architectures and model assumptions
  - Stay current on emerging AI tools, frameworks, model
    capabilities and industry best practices; recommend and
    implement pragmatic adoption strategies

  Required Qualifications:

  - Bachelor’s degree or equivalent professional experience in
    Artificial Intelligence, Computer Science, Data Science,
    Economics, Engineering, Machine Learning, Mathematics,
    Operations Research, Statistics or a related quantitative
    field
  - Intellectual curiosity
  - Hands-on experience building machine learning or AI-powered
    applications
  - Hands-on experience working with large language models,
    prompt engineering, embeddings, vector databases,
    retrieval-augmented generation or agentic workflows
  - Strong Python proficiency including hands-on experience with
    Pytest, Pydantic and FastAPI
  - Strong software engineering and familiarity with production-
    grade development practices including documentation,
    testing, version control, code review, CI/CD and
    observability
  - Familiarity with tools/technologies such as AWS/Azure/GCP,
    Claude, Databricks, Docker, Gemini, Kubernetes, LangChain,
    LangGraph, OpenAI and SQL
  - Working knowledge of data privacy, security, access controls
    and responsible AI considerations
  - A bias toward practical, measurable outcomes and the ability
    to iterate quickly while maintaining high engineering
    standards

  Preferred Qualifications (bonus experience):

  - Advanced degree or equivalent professional experience in
    Artificial Intelligence, Computer Science, Data Science,
    Economics, Engineering, Machine Learning, Mathematics,
    Operations Research, Statistics or a related quantitative
    field
  - Experience working in regulated industries such as banking,
    financial services, healthcare, insurance or related
    environments with meaningful audit, compliance,
    governance, and risk expectations
  - Experience building/leveraging reusable AI services or
    shared tooling that increases operational efficiencies
  - A clear point of view on the trade-offs between Anthropic,
    Google and OpenAI models across different task types
  - Hands-on experience acquiring data from the web at scale
    including scraping, proxy management and working with
    public APIs, aggregators and open-source datasets

  Our interview process:

  Our hiring process generally consists of 5 phases. The goal
  is to provide an opportunity for us to learn more about our
  candidates while allowing them to get to know us as well!

  - Phase 1: Due to the high volume of resumes received, the
    initial phase of our review process will involve selected
    candidates completing a pre-screen coding exercise.
    Results from this exercise will help determine advancement
    to subsequent stages of consideration.
  - Phase 2: Qualified candidates will first meet with a member
    of our People Operations team for a phone interview.  This
    discussion is a high-level conversation to understand more
    about your background and interests and for us to share
    more about Coterie and the position.
  - Phase 3: Selected candidates will be invited to participate
    in an experiential exercise interview. This will include a
    project provided in advance along with a 1.5-hour
    interview conducted with members of our Data Science team.
  - Phase 4: Top candidates will then be invited to meet with
    additional members of our Data & Analytics (DnA) team for
    a total of 45 minutes to 1 hour.
  - Phase 5: Final candidates will be invited to a 30‑minute
    interview with a senior member of our leadership team.

  What's in it for you:

  Coterie has excellent benefits for all full-time employees.
  We offer the following:

  - 100% remote
  - Health insurance through Aetna (we pay 100% of premiums)
  - Dental and vision insurance through Guardian (we pay 100% of
    premiums)
  - Basic life insurance (we pay 100% of premiums)
  - Access to flexible spending account (FSA) or health savings
    account (HSA) (for those using HSA eligible plans)
  - 401K plan (up 4% match with immediate vest). Must be 21
    years of age or older to participate
  - Flexible PTO policy offering employees up to 4 weeks of PTO
    in their first 12 months. Thereafter, PTO usage aligns
    with company standards and typically does not exceed 5
    weeks per calendar year.
  - 12 company-paid holidays each year
  - Continuing education annual stipend
  - This role is open to candidates at multiple levels. Final
    leveling (senior or non‑senior) and compensation will be
    determined based on qualifications and experience. The
    estimated annual salary range for this position is
    $115,000–$145,000, based on national market data.
    Candidates who meet all minimum requirements and
    demonstrate additional relevant experience, as outlined in
    the job description, may be considered for compensation
    above the midpoint of this range. Compensation decisions
    are guided by internal equity, established salary bands,
    market data, and the candidate’s skills, prior relevant
    experience, education, certifications, and overall
    qualifications.

  Work Authorization: At this time, Coterie Insurance is
  unable to consider candidates who require current or future
  visa sponsorship. Applicants must have authorization to work
  in the United States without the need for sponsorship now or
  in the future. Falsification of an application, including
  work authorization status, is immediate grounds for
  dismissal from consideration.
