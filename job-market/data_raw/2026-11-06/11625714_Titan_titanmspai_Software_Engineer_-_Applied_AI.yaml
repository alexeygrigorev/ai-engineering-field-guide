description: |
  About Titan

  Titan is building the AI workforce for IT. We deploy AI
  agents across our portfolio of Managed Service Providers and
  enterprise customers: agents that monitor, triage, and
  resolve work across the service desk, infrastructure,
  security, identity, endpoint, and application operations.
  The result is faster resolutions, better uptime, and more
  proactive, personalized support, delivered 24/7.

  In under a year we've raised over $100M from General
  Catalyst, 8VC, and CalPERS, acquired market-leading MSPs
  like RFA, and put agents into production in large
  enterprises. We've automated 100K+ tickets across 400+
  customers. Our tech team has talent from Scale AI,
  CoreWeave, Vanta, Dropbox, Meta, FiveRings, TwoSigma,
  Amazon, Harvard, Stanford, and MIT.

  Joining Titan means helping redefine how work gets done in
  IT services, and building a $100B company.

  About the role

  As an Applied AI Software Engineer, you own the systems that
  make Titan's agents work in production. You're as effective
  in front of a partner as you are deep in the codebase, and
  you move between the two every week.

  You take ill-defined problems from the field, prototype
  quickly, and turn them into reliable production systems.
  You'll build the agent harness, ship new capabilities across
  the portfolio, and own the backend systems, data pipelines,
  and model-adjacent infrastructure underneath them. You work
  closely with other engineers, Operations, Product, and GTM.

  This role is based in San Francisco or New York City, in
  office.

  In this role you will

  - Embed with portfolio teams to understand their technical
    requirements and business objectives
  - Architect and build integrations, APIs, and agent workflows
    on Titan's platform
  - Build and evolve the agent harness and tools our AI agents
    run on
  - Work with partner leadership to drive adoption and shape
    business outcomes across the portfolio
  - Build the platform and software systems that scale future
    deployments
  - Design evals that measure agent quality, then hill-climb our
    agents against them

  You might thrive in this role if you

  - Bring 3+ years of engineering experience that includes
    partner-facing work
  - Write and review production-grade code in TypeScript,
    Python, or a comparable stack
  - Have built LLM applications or agents in production and know
    how model behavior shapes the product experience
  - Have built full-stack systems end to end, with strong
    fundamentals in backend services, data modeling, and
    reliability
  - Have owned and shipped complex systems in ambiguous, fast-
    moving environments
  - Communicate clearly with partner stakeholders, engineers,
    and product managers
  - Bonus: experience in IT operations, MSPs, or infosec
