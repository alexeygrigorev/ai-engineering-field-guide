description: |
  WHO WE ARE

  GridUnity is the industry leader in interconnection life
  cycle management, delivering cutting-edge software solutions
  that eliminate bottlenecks in the interconnection process
  and accelerate the transition to a more affordable,
  sustainable, and resilient energy future.

  Our Mission

  We unite all grid interconnection stakeholders on a single
  platform that converts centralized data into actionable
  intelligence and accelerates the transition to a reliable,
  sustainable, and cost-efficient electric grid.

  GridUnity is a trusted partner to leading utilities, grid
  operators, and policymakers. Our technology solutions tackle
  the interconnection queue backlog by significantly reducing
  processing times. Whether cutting transmission
  interconnection timelines from years to months or enabling
  distribution applications to be processed within a day, we
  help accelerate energy projects at every scale.

  Our Vision Energizing the planet with a faster, smarter, and
  more sustainable grid.

  About the Role

  We are seeking a Senior Power System Engineer to help build
  and validate our AI-assisted study capabilities for
  generation and large load interconnection. This role is
  ideal for someone with a foundation in power system modeling
  and grid studies, practical scripting experience, and an
  interest in applying generative AI or automation to
  engineering workflows.

  You will work at the intersection of grid planning,
  interconnection analysis, simulation automation, and AI-
  enabled engineering productivity. You will help translate
  study procedures into repeatable, software-assisted
  workflows and check automated outputs against reference
  cases and engineering expectations.

  The initial focus is power flow, contingency analysis, and
  model preparation. Depending on your background and project
  needs, the work may also include short-circuit, dynamic
  stability, or electromagnetic transient (EMT) studies.

  Key ResponsibilitiesStudy Workflow Automation

  - Support the development and testing of automated workflows
    for generation and large load interconnection studies.
  - Help translate study procedures into structured, repeatable,
    and auditable automation logic under engineering
    supervision.
  - Develop Python scripts for model preparation, simulation
    runs, data checks, and results analysis.

  Model Preparation and Simulation

  - Prepare and check model files, study assumptions, and input
    data using approved public, synthetic, or authorized grid
    data.
  - Support common study tasks, including contingency setup,
    power flow analysis, results extraction, and report
    generation.
  - Work with power system simulation tools such as PSS/E, PSLF,
    TARA, PSCAD, or similar platforms, as relevant to assigned
    projects.

  Validation and Quality Assurance

  - Compare automated study outputs with engineering
    expectations, applicable planning criteria, reference
    cases, and manual study results.
  - Help develop test cases and QA/QC checks, reproduce issues,
    and verify fixes with supervising engineers.

  Collaboration and Documentation

  - Collaborate with software and AI engineers on document
    interpretation, model review, study setup assistance,
    result summarization, and report drafting.
  - Document model versions, assumptions, methods, result
    differences, and limitations. Communicate findings to
    engineering and product teams.

  Required QualificationsEducation

  - A PhD in Electrical Engineering with a focus on Power
    Systems or a related technical field.

  Technical Knowledge

  - Foundational knowledge of power system modeling, power flow,
    and dynamics.
  - Familiarity with interconnection stakeholders, including
    ISOs/RTOs, transmission owners, and developers, and their
    roles.
  - Familiarity with the interconnection process, from
    application through agreement and construction.
  - Familiarity with NERC TPL standards, regional reliability
    standards, and utility or ISO/RTO planning criteria.

  Tool Skills

  - Familiarity with PSS/E, PSLF, TARA, PSCAD, or similar tools
    and their scripting interfaces.
  - Experience using Python for engineering analysis or workflow
    automation.
  - Experience using AI to automate power system study tasks.

  Soft Skills

  - Strong ownership and accountability for technical
    correctness.
  - Strong attention to detail and a careful approach to
    checking outputs, investigating unexpected results, and
    recognizing limitations.
  - Clear communication skills and the ability to collaborate
    with power systems, software, AI, and product teams.

  Experience

  - Over three years of experience in interconnection or
    transmission planning studies for a U.S. region.
  - Experience on a transmission planning study team at a
    utility, ISO/RTO, developer, or consulting firm.
  - Project experience in NERC TPL contingency studies, steady-
    state thermal and voltage analysis, short-circuit
    analysis, dynamic stability, or EMT simulation.
  - Experience proposing and testing network upgrade solutions
    and estimating costs.
  - Experience modeling and debugging inverter-based resources
    or working on large load data center studies.

  Preferred Qualifications

  - Experience working at a software company or collaborating
    with software development teams.
  - Experience leading projects and mentoring junior engineers.
  - Hands-on experience with short-circuit, dynamic stability,
    and EMT studies.
  - Deep understanding of the end-to-end interconnection study
    process in a U.S. region.

  What Success Looks Like

  Within the first several months, work with other power
  system engineers to translate real-world interconnection
  study experience into a validated study workflow automation
  capability. Work with the product team to shape the product
  roadmap.

  OUR CULTURE

  We are a lean, fast-moving team that values bold thinking,
  reliability, and continuous learning. We operate with
  radical transparency, embrace scrappiness, and build
  solutions that anticipate customer needs. We also believe
  work should be fun and fulfilling — what we call
  “funfillment.”

  The right candidate is energized by working in a scaling,
  mission-driven company where they can shape processes, wear
  multiple hats, and grow alongside the business.

  BENEFITS/PERKS

  - Competitive compensation packages that recognize your
    expertise and contributions
  - Remote-first culture that provides flexibility and balance
  - Professional development opportunities, including training,
    mentorship, and career pathing
  - Comprehensive health, dental, and vision insurance starting
    day one
  - Short- and long-term disability and basic life insurance at
    no cost to you
  - 401(k) plan with a 4% match to help secure your future
  - Flexible PTO and a supportive work culture that values
    balance
  - Mission-driven work with the opportunity to make a
    significant impact in the energy sector

  ELIGIBILITY REQUIREMENT

  This position may involve access to data and systems subject
  to U.S. critical infrastructure protection regulations.
  Accordingly, this role is restricted to individuals who
  qualify as “U.S. persons,” defined by federal law as U.S.
  citizens, lawful permanent residents (green card holders),
  asylees, or refugees.

  OUR COMMITMENT TO APPLICANTS

  GridUnity is an equal opportunity employer. We consider all
  qualified applicants without regard to race, color,
  religion, sex, sexual orientation, gender identity or
  expression, national origin, age, disability, veteran
  status, arrest and conviction record, or any other
  characteristic protected under applicable law.

  We are committed to creating an inclusive workplace where
  every team member feels valued, supported, and able to bring
  their authentic self to work.

  If you need a reasonable accommodation during the
  application or interview process, please email
  careers@gridunity.com.

  For your security, all official communication from GridUnity
  will only come from email addresses ending in
  @gridunity.com.
