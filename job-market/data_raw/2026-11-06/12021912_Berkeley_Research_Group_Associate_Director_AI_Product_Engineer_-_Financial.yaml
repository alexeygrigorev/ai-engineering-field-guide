description: |
  We Do Consulting Differently

  Preferred locations: New York, Chicago, Washington, D.C.,
  Dallas, and Boston. Other locations considered case by case.

  About the Practice

  Berkeley Research Group is building a Financial Services
  Operations & Technology practice focused initially on
  Commercial and Consumer Banking. We combine banking
  expertise, technology, and AI to help clients improve
  operations.

  The Role

  We are hiring a hands-on AI Product Engineer focused on
  evaluation: proving whether AI products are accurate,
  reliable, and safe for banking operations. You will build
  automated tests, investigate failures, and provide evidence
  for release decisions while contributing to product
  development.

  Working with banking experts and engineers, you will define
  correct results, measure performance, and turn findings into
  product improvements. Your core responsibility is evaluation
  from early development through live use. Client stakeholders
  retain release and risk-acceptance authority.

  What You’ll DoOwn the Evaluation Approach

  - Define what each product must get right, how errors could
    affect customers or operations, and what evidence is
    needed before use.
  - Build reusable software that runs tests, scores results, and
    compares versions. Make testing part of everyday
    development, not a final checkpoint.
  - Work with engineers to reproduce failures, identify causes,
    and verify fixes. Contribute product code where needed to
    improve accuracy and control.

  Design Tests and Measure Results

  - Set pass criteria and scoring rules with business and risk
    teams. Distinguish minor defects from errors that must
    block release.
  - Maintain representative test cases, including incomplete
    records and rare, high-impact errors. Reserve unseen
    examples for final testing to avoid overstating
    performance.
  - Have banking experts establish expected answers and resolve
    scoring disagreements. Measure factual accuracy, missing
    information, incorrect additions, and support from cited
    sources.
  - Check automated scoring against expert review. Test whether
    reviewers agree and whether AI-based scoring misses
    important errors.
  - Compare versions on the same tests. Report results by task
    and error severity, with sample sizes and uncertainty, not
    just averages.

  Verify Accuracy and Explain Failures

  - Test whether the system finds the right information and
    whether its answer reflects that information. Separate
    source problems from answer errors.
  - Check extracted facts against original records.
    Independently verify amounts, dates, and totals, and test
    whether citations actually support each important claim.
  - Test when the product should answer, request clarification,
    or refer work to a person. Verify that reviewers can
    detect and correct material errors.

  Manage Risk and Monitor Performance

  - Test for invented facts, unsupported recommendations, unfair
    outcomes, disclosure of sensitive information, and
    attempts to make the system ignore its safeguards.
  - Protect client data, restrict access and permitted actions,
    and use only approved services. Verify that safeguards
    work in practice.
  - Document repeatable test results, unresolved failures, and
    limitations. Recommend release, restricted use, or further
    development; support independent review and required
    client approvals.
  - Sample live outputs and track error rates and user
    corrections. Add confirmed failures to repeatable tests;
    trigger investigation or suspension when quality falls
    below agreed standards.
  - Explain findings clearly, coach colleagues, and develop
    reusable tests and controls. Support proposals, technical
    estimates, and recruiting.

  QualificationsRequired

  - Minimum 5 years of working experience with a minimum of 1
    year experience in AI evaluation.
  - Demonstrated ownership of AI evaluations that informed real
    release decisions, including test design, expert-reviewed
    answers, scoring, and failure investigation.
  - Strong Python skills and experience building automated test
    software, connecting data sources, and recording
    repeatable results across product versions.
  - Ability to select representative samples, interpret error
    rates and uncertainty, and distinguish genuine improvement
    from weak tests or inconsistent scoring.
  - Experience building or improving AI products used in
    operations, with practical controls for sensitive data,
    output accuracy, and human review.
  - Experience in financial services or another regulated
    environment, with the ability to translate business
    requirements into practical tests and controls.
  - Strong communication and teamwork skills, ability to mentor
    colleagues, and willingness to travel to client sites as
    needed.

  Preferred

  - Banking experience in lending, payments, servicing,
    collections, or default operations.
  - Experience independently evaluating AI products, checking
    automated scoring against expert judgment, or testing
    security and fairness in financial institutions.
  - Experience evaluating document review, summaries,
    information search, or automated workflows, including
    comparisons across AI services and conventional software.
  - Consulting or product delivery experience, including client
    discovery, implementation planning, and user adoption.

  What Success Looks Like

  Success means reliable evidence of what a product gets
  right, where it fails, and whether it is ready for use.
  Evaluations catch important errors before release, guide
  measurable improvements, and detect declining quality in
  live operations. Testing supports sound decisions, not
  simply a passing score.

  Associate Director Salary range: $180,000 - $250,000

  Job title and level will be determined based on
  qualifications and experience.

  Candidates must be able to verify their legal right to work
  in the United States without employer sponsorship now or in
  the future.

