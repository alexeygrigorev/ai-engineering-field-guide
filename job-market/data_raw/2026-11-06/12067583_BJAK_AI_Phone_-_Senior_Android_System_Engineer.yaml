description: |
  About

  We are reimagining the phone. AI phones need to be
  proactive, intuitive, intelligent and low cost. This is a
  mission critical for rest of the world to adopt
  intelligence.

  There are over 5 billion people using everyday applications
  such as email, messaging, notes, tasks, and calendars, yet
  most are not AI-native. Our mission is to build proactive
  applications and devices that bring intelligence into daily
  conversations, coordination and workflows, with minimal
  prompting.

  Focus: Android Framework, system services and OS-level AI
  integration.

  Responsibilities

  - Implement and modify Android system services.
  - Develop privileged system APIs for AI capabilities.
  - Build interfaces that allow AI agents to interact with
    Android system functionality.
  - Work on permissions, IPC, application lifecycle and
    background execution.
  - Integrate AI services with Android system components.
  - Optimize system performance and resource consumption.
  - Collaborate with agent engineers to implement reliable
    execution interfaces.

  Requirements

  - Strong Android engineering experience.
  - Experience with Android Framework or AOSP development.
  - Strong Java / Kotlin knowledge.
  - Understanding of Binder IPC, Android processes and system
    services.
  - Experience with Android permissions and application
    lifecycle.
  - Strong debugging and performance optimization skills.

  Nice to have

  - Custom ROM or AOSP contributions.
  - C++ experience.
  - Experience with Android System UI.
  - Experience with background services and power management.
