description: |
  Meet the Team

  Cisco IT is seeking a Software QA Analyst to join the
  Commerce Quote to Order team. Our team focuses on delivering
  scalable solutions for digital transformation and enhancing
  Cisco's commercial platforms, playing a critical role in the
  technology that powers our global business operations.

  Your Impact

  In this role, you will collaborate with cross-functional
  teams to improve processes, manage data, and develop
  features for complex commerce processes. You will be
  instrumental in ensuring end-to-end product quality by
  driving systematic testing and implementing robust, future-
  ready automation strategies.

  - Design, build, and test software products, focusing on
    reliability, availability, latency, and performance
    through systematic and automated approaches.
  - Develop, maintain, and execute comprehensive software design
    plans, automated scripts, and test frameworks to
    facilitate quality gates throughout the software
    development lifecycle.
  - Conduct root-cause analysis on software product bugs and
    escaped defects to provide risk assessments and
    collaborate with product managers to resolve design
    issues.
  - Apply risk-based analysis to software integration points to
    mitigate risks and ensure high-quality functionality
    across the platform.
  - Document test plans, release notes, and bug reports while
    mentoring peers and engineering interns to foster
    technical excellence and productive working relationships.

  Minimum Qualifications

  - Education & Experience: Bachelor's or Master’s degree in
    Engineering, or a related field, with 4–9 years of hands-
    on software quality assurance and testing experience.
  - Automation & AI Testing: Strong, demonstrable hands-on
    experience building and maintaining test automation
    frameworks (such as Robot, Playwright, WebDriver.io, or
    Selenium) and leveraging AI-driven testing tools or
    methodologies.
  - Technical Expertise: Demonstrated expertise in debugging
    complex software systems, conducting API testing, and
    performing database validation.
  - Core QA Competencies: Proven ability to apply systematic and
    risk-based testing approaches to ensure end-to-end product
    reliability, performance, and scalability.

  Preferred Qualifications

  - Domain Expertise: Extensive experience in Quote-to-Order
    (Q2O), eCommerce, or complex commercial business
    platforms, with a deep understanding of enterprise system
    integrations and end-to-end workflows.
  - Strategic Acumen: Proven ability to analyze upstream and
    downstream impacts of system changes within large-scale
    distributed architectures, providing strategic
    recommendations to enhance platform resilience.
  - Leadership & Mentorship: Demonstrated success acting as a
    technical mentor or lead for peers and interns, fostering
    technical excellence, code quality, and collaborative
    teamwork across cross-functional groups.
  - Advanced Automation & CI/CD: Advanced proficiency in
    integrating test automation suites into CI/CD pipelines to
    establish robust quality gates throughout the software
    development lifecycle.
  - Communication & Collaboration: Ability to communicate
    technical risks, root-cause analyses, and quality metrics
    clearly to product managers and cross-functional
    stakeholders.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

