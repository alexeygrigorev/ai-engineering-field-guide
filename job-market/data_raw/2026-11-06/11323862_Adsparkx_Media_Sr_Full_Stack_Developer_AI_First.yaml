description: |
  Senior Backend & AI Engineer — Node.js / Python

  AI-first Experience: 5+ years

  About Vibelets

  Vibelets is an AI product for running Meta ads. Brands use
  it to onboard, plan their week, build campaigns, generate ad
  creatives, and optimize their advertising workflows.

  We are building an AI-first product where AI is how we work,
  not just a feature.

  The Role

  We are looking for a Senior Backend & AI Engineer with
  strong production experience in Node.js and Python who can
  design scalable backend systems and build AI-powered
  features.

  You should be an AI-native developer who actively uses
  coding agents, LLMs, and modern AI tools in your development
  workflow. You should also be comfortable learning new
  languages, frameworks, and technologies — the programming
  language should never be a barrier to solving a problem.

  You will own features from problem understanding and
  architecture through implementation, testing, deployment,
  and production monitoring.

  What you will do

  - Design and build scalable backend services using
    Node.js/TypeScript and Python.
  - Build REST APIs, microservices, asynchronous workflows, and
    third-party integrations.
  - Design and work with databases such as PostgreSQL, MongoDB,
    MySQL, Redis, DynamoDB, or time-series databases.
  - Build AI-powered applications using LLMs, Agentic AI, AI
    orchestration, RAG, tool/function calling, embeddings, and
    AI workflows.
  - Use AI coding agents and LLMs for development, debugging,
    testing, refactoring, and productivity.
  - Design reliable AI systems with appropriate evaluation,
    guardrails, context/memory, latency, and cost
    considerations.
  - Participate in architecture and technical decisions and
    communicate trade-offs clearly.
  - Debug complex production issues and identify root causes.
  - Write tests, review code, improve performance, security,
    reliability, and maintainability.
  - Work closely with product, frontend, AI, QA, and
    infrastructure teams.

  What you must have

  - 5+ years of software engineering experience with strong
    backend development experience.
  - Strong hands-on experience with Node.js,
    TypeScript/JavaScript, and Python.
  - Strong understanding of software architecture, system
    design, APIs, databases, and distributed systems.
  - Strong problem-solving, debugging, and decision-making
    skills.
  - Good understanding of data structures, algorithms, clean
    code, testing, Git, and code review.
  - Experience with scalable backend systems, microservices, and
    production applications.
  - Strong practical understanding of modern AI application
    development, including LLMs, Agentic AI, RAG,
    orchestration, and tool calling.
  - Ability and enthusiasm to learn new technologies quickly.
  - Experience with AWS or another cloud platform is a plus.

  What we value

  We are not looking for someone who only knows a particular
  language or framework.

  We value an engineer who can understand a problem, design
  the right solution, make sound technical decisions, debug
  effectively, and learn whatever technology is required to
  solve it.

  You should be curious, hands-on, comfortable experimenting
  with new AI technologies, and continuously improving how you
  build software.

  Strong engineering fundamentals + AI-native development +
  continuous learning are the core of this role.
