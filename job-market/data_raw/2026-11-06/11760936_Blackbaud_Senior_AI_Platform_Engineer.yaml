description: |
  About the role

  We are seeking a Senior AI Platform Engineer to design,
  build, deploy, and support enterprise AI solutions and the
  platform capabilities that enable them. This is a hands-on
  software engineering role focused on enabling the
  development of AI tools that will transform Blackbaud’s
  business processes.

  You will build agentic and LLM-powered solutions while
  establishing the reusable engineering patterns, security
  controls, observability, and operational practices needed to
  use AI safely and effectively at enterprise scale.

  What you’ll be doing

  - Design, build, test, deploy, and support production agentic
    and LLM-powered solutions that integrate with enterprise
    data, APIs, tools, and workflows.
  - Build reusable AI platform services, integration patterns,
    guardrails, and reference implementations that enable
    teams to adopt AI securely and efficiently.
  - Design security controls for AI agents, including identity,
    authorization, least-privilege access, sensitive-data
    handling, auditability, and secure integrations.
  - Implement AI-specific observability and evaluation,
    monitoring areas such as output quality, hallucinations,
    behavioral or model drift, failures, latency, token
    consumption, and cost.
  - Develop mechanisms to detect, troubleshoot, contain, and
    remediate unexpected or unsafe agent behavior.
  - Optimize model selection, context management, agent
    workflows, and consumption to balance quality,
    reliability, performance, and cost.
  - Apply strong software engineering practices including
    automated testing, CI/CD, telemetry, code review, secure
    development, and production support.
  - Partner closely with the Enterprise Architecture and Data
    Platform teams to establish scalable integration patterns,
    data access approaches, and technical standards for
    enterprise AI.
  - Collaborate with business stakeholders and the Product AI
    Platform team to understand use cases, share platform
    patterns and learnings, and translate enterprise needs
    into reliable AI capabilities.
  - Evaluate emerging AI models, agent frameworks, protocols,
    and platforms and help establish practical standards and
    reusable approaches for enterprise adoption.
  - Mentor other engineers and contribute to a strong
    engineering culture around AI development and operations.

  What we’ll want you to have

  - 5+ years of professional software engineering experience
    building, delivering, and supporting production software.
  - Hands-on experience delivering LLM-powered or generative AI
    solutions into production, beyond prototypes or
    demonstrations.
  - Experience building agentic AI solutions, including areas
    such as tool/function calling, RAG, orchestration, multi-
    step workflows, or autonomous/semi-autonomous execution.
  - Experience implementing AI observability, evaluation, and
    monitoring, with an understanding of hallucination, output
    quality, drift, latency, usage, and cost.
  - Strong understanding of enterprise security concepts
    including authentication, authorization, least privilege,
    sensitive-data protection, secrets management, and
    auditability.
  - Experience integrating applications with enterprise APIs,
    data sources, identity systems, and cloud services.
  - Experience with Claude in an enterprise or administrative
    context, such as enterprise access and administration,
    permissions, integrations/connectors, governance, usage
    monitoring, or solutions built using Claude.
  - Strong experience with modern software engineering practices
    including APIs, automated testing, CI/CD, telemetry, and
    production support.
  - Ability to evaluate tradeoffs across model capability,
    security, reliability, performance, maintainability, and
    cost.
  - Strong collaboration and communication skills, with the
    ability to work across engineering, architecture, data,
    security, and business teams.

