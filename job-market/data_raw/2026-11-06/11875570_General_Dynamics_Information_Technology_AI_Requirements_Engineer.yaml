  Job Description:

  AI CYBERSECURITY ENGINEER SME

  Advance your career while impacting our national security in
  cyber as an AI Cybersecurity Engineer SME at GDIT/ Praxis
  Engineering. Here, technologists have many paths to grow a
  meaningful career supporting cyber missions and operations
  across the federal government.

  MEANINGFUL WORK AND PERSONAL IMPACT

  As an AI Cybersecurity Engineer SME, the work you’ll do at
  GDIT will be impactful to a mission essential customer.

  You will play a crucial role in performing hands-on
  technical execution, low-level requirements definition, and
  functional validation of new features for an enterprise
  application integrating AI-enabled capabilities.

  Candidates should be passionate about collaboratively
  solving challenging problems and have a track record of
  delivering high-quality solutions. Work directly with
  customers, systems engineers, developers, and AI solution
  stakeholders to ensure mission-driven software capabilities
  are accurately defined, built, tested, and delivered. Engage
  tactically with the development team, close collaboration
  with stakeholders, and active participation in Agile
  delivery throughout development lifecycle.

  WHAT YOU’LL NEED TO SUCCEED

  Bring your cyber expertise and drive for innovation to GDIT.

  The AI Cybersecurity Engineer SME must have:

  ● Security clearance level: Active TS/SCI with Polygraph
  required

  ● US citizenship required ● Education: Bachelor of
  Arts/Bachelor of Science ● Experience: 15+ years of related
  experience

  Required Skills and Experience:

  - Familiarity with software development using Java or
    JavaScript frameworks, RESTful microservices, and Cloud-
    based architecture and deployment (Amazon Web Services)
  - Ability to work directly with customers to elicit, analyze,
    and document, detailed functional requirements and convert
    them into technical specifications
  - Ability to translate high-level requirements into actionable
    Jira user stories and epics for development teams
  - Experience conducting functional testing of application
    features
  - Serving as a key technical liaison, collaborating with
    cross-functional teams, including system engineers,
    software developers, and domain experts. Effectively
    present and articulate recommended AI approaches,
    discussing the tradeoffs and implications of different
    implementations with both technical and non-technical
    stakeholders
  - Knowledge of modern AI/ML advancements and ability to
    identify practical opportunities to apply emerging
    capabilities to enterprise applications

  Desired Experience:

  - Experience designing or refining technical artifacts
    specifically for AI integration
  - Ability to evaluate AI architectures, assess model
    performance, and identify system-level integration
    tradeoffs
  - Coordinating the design and development of AI-driven
    solutions from conception to deployment, ensuring seamless
    integration with the existing software architecture
  - Staying current with the latest advancements in AI and
    machine learning, continuously seeking opportunities to
    apply new technologies and methodologies to improve
    existing systems and solve complex problems

  GDIT/ PRAXIS ENGINEERING IS YOUR PLACE

  At GDIT, the mission is our purpose, and our people are at
  the center of everything we do.

  ● Growth: AI-powered career tool that identifies career
  steps and learning opportunities

  ● Support: An internal mobility team focused on helping you
  achieve your career goals

  ● Rewards: Comprehensive benefits and wellness packages,
  401K with company match, and competitive pay and paid time
  off

  ● Flexibility: Full-flex work week to own your priorities at
  work and at home

  ● Community: Award-winning culture of innovation and a
  military-friendly workplace

  OWN YOUR OPPORTUNITY

  Explore a career in cyber at GDIT and you’ll find endless
  opportunities to grow alongside colleagues who share your
  focus on defending and protecting what matters.

  The likely salary range for this position is $255,000 -
  $345,000. This is not, however, a guarantee of compensation
  or salary. Rather, salary will be set based on experience,
  geographic location and possibly contractual requirements
  and could fall outside of this range.

