description: |
  We’re looking for a Creative Engineer / AI Creative
  Technologist to explore what’s possible with the rapidly
  evolving generative media ecosystem and turn that
  exploration into exceptional model examples, workflows, and
  content.

  This is a hands-on role at the intersection of generative
  AI, creative technology, and technical storytelling. You’ll
  work directly with image and video models, experiment with
  different models and workflows, push them to their limits,
  and figure out how to consistently get the best possible
  creative results from them.

  You’ll turn that experimentation into compelling examples,
  workflows, guides, and social content that show developers
  and creators what is possible with Runware and help us move
  quickly around new model releases.

  We’re looking for someone who is already deeply immersed in
  generative media — not simply using AI tools, but
  understanding how models, prompting, pipelines,
  conditioning, and automation fit together, and knowing how
  to combine them to produce standout creative output.

  What you’ll do

  - Experiment hands-on with new generative image and video
    models, understanding their capabilities, limitations, and
    how to get exceptional results from them.
  - Build and refine advanced generative-media workflows,
    combining models, prompting techniques, conditioning,
    automation, and tools such as ComfyUI.
  - Create standout model examples, workflows, demos, and visual
    content that demonstrate what developers and creators can
    build with Runware.
  - Turn technical experimentation into engaging content for
    model launches, social media, guides, workflow breakdowns,
    and other creator- and developer-facing channels.
  - Develop repeatable and automated generation workflows that
    make it possible to produce high-quality creative output
    efficiently and at scale.
  - Stay close to new model releases and emerging techniques,
    rapidly testing them and identifying opportunities for
    compelling content and examples.
  - Work closely with Growth, Product, and Engineering to
    surface interesting use cases, support launches, and share
    insights from model experimentation and the wider
    generative AI ecosystem.

  Requirements

  - 3+ years of relevant experience in generative media,
    creative technology, creative engineering, or a closely
    related technical field.
  - Advanced experience with ComfyUI or comparable workflow
    tooling, with the ability to build sophisticated,
    repeatable pipelines combining models, conditioning,
    prompting, and automation.
  - Coding and API experience, including building custom
    integrations, scripts, tools, or ComfyUI nodes.
  - Strong knowledge of the generative media model ecosystem,
    with practical experience across multiple image and/or
    video models such as FLUX, Stable Diffusion, Wan, LTX,
    Hunyuan, Kling, or similar.
  - A strong creative eye and a portfolio of high-quality
    generative AI work that demonstrates both technical depth
    and the ability to get exceptional creative results from
    models.
  - Strong technical communication skills, with the ability to
    turn complex experiments and workflows into clear,
    engaging content for developers and creators.
  - Ability to work independently and move quickly in a rapidly
    evolving ecosystem of models, tools, and techniques.Nice
    to have

  Benefits

  We’re a remote-first collective, meeting in person twice a
  year to plan, brainstorm, celebrate wins, and enjoy some
  face-to-face time. We have core hours for cooperative
  working and calls, but outside of that your calendar is
  yours. Work the hours that let you perform at your peak
  while also building a healthy life.

  Our release cycles are fast and intense, but they’re
  followed by real downtime. After big pushes we expect the
  team to unplug, recharge, and come back ready & stronger
  than ever for the next leap.

  - Generous paid time off – vacation, sick days, public
    holidays
  - Meaningful stock options – share in the upside you create
  - Flexible hours – own your schedule outside core
    collaboration blocks
  - Family leave – paid maternity, paternity, and caregiver time
  - Company retreats – twice-yearly gatherings in inspiring
    locations
