description: |
  Microsoft Copilot and Agentic AI Engineer

  Jefferies | Information Technology — Workplace AI | Pune,
  India | Full-Time | Individual Contributor

  Role Overview

  Microsoft Copilot and Agentic AI Engineer — a mid-level
  individual contributor role in Pune, India, within the
  Workplace AI function in Information Technology. This role
  supports the firm's Microsoft 365 Copilot, AI productivity,
  automation and enterprise AI initiatives, working with a
  global team and overlapping US Eastern hours for
  coordination, vendor calls and change windows.

  This is a hands-on engineering role. You will design,
  implement, administer and optimize Microsoft 365 Copilot,
  Copilot Studio agents, agentic AI solutions, Azure AI
  services, Claude Cowork and Claude Code, taking capabilities
  from proof of concept through to a governed production
  service. Every capability must respect the controls a
  regulated financial institution is held to, from Information
  Barriers and Purview data loss prevention to records
  management and least-privilege identity. We are looking for
  an engineer with consulting instincts who owns problems end
  to end and communicates precisely with business, Compliance
  and Legal stakeholders.

  Key Responsibilities Copilot platform engineering and
  administration

  - Design, deploy, administer and optimize Microsoft 365
    Copilot and Copilot Chat across the tenant, including
    licensing strategy, enablement waves, feature rollout,
    pilot cohorts and configuration baselines.
  - Own the operational health of the Copilot estate: service
    health monitoring, message center and roadmap assessment,
    capacity and consumption tracking, and impact analysis for
    announced Microsoft changes.
  - Troubleshoot complex platform, grounding and integration
    issues across Copilot, Microsoft Graph, Exchange Online,
    SharePoint Online, OneDrive and Teams, distinguishing
    client-side behavior from tenant configuration and genuine
    product limitations.
  - Manage escalations with Microsoft engineering and support to
    closure and feed recurring product gaps back into the
    firm's roadmap discussions.

  Agentic AI, Copilot Studio and Azure AI

  - Build, deploy, manage and support Copilot Studio agents,
    declarative and custom engine agents, and bespoke AI
    assistants serving specific business functions.
  - Design and implement agentic AI solutions that transform
    business processes, including multi-step orchestration,
    tool and connector integration, grounding strategy and
    human-in-the-loop controls.
  - Configure and support Azure AI Foundry, Azure OpenAI Service
    and the wider Azure AI service portfolio, including model
    selection, deployment, prompt design, evaluation and
    retrieval-augmented generation patterns over enterprise
    content.
  - Administer the Microsoft 365 agent estate (Agent 365) —
    registration, identity, entitlement, lifecycle and
    inventory — so that agents are managed with the same rigor
    as any other enterprise application.

  Automation and integration

  - Develop and maintain automation solutions using Power
    Platform, Power Automate and related Microsoft
    technologies, replacing manual and repetitive operational
    processes.
  - Integrate enterprise applications and data sources through
    APIs, Microsoft Graph, custom connectors and automation
    frameworks, with appropriate authentication, error
    handling and monitoring.
  - Build reporting and telemetry pipelines covering adoption,
    usage, consumption and platform health, and present the
    findings in a form business and technology leadership can
    act on.

  Governance, security and compliance

  - Establish and maintain enterprise AI governance: operational
    standards, security controls, approval workflows,
    acceptable-use guardrails and a compliance framework
    covering Copilot, agents and agentic AI solutions.
  - Design, administer and troubleshoot Microsoft Information
    Barriers to support regulatory, compliance and ethical
    wall requirements, and validate that Copilot and agent
    behavior honors those boundaries in practice.
  - Ensure AI capabilities operate within Microsoft Purview
    controls — data loss prevention, sensitivity labels,
    information protection, records management, retention and
    audit — and evidence that compliance to reviewers.
  - Design and maintain identity and access patterns in
    Microsoft Entra ID, including application registrations,
    API permissions and admin consent, certificate-based
    authentication, service principals and least-privilege
    role assignment.

  Adoption, stakeholder engagement and continuous improvement

  - Partner with business stakeholders across the firm to
    identify, qualify, priorities and deliver AI-enabled use
    cases, and to retire those that do not deliver measurable
    value.
  - Work closely with Compliance, Legal, Information Security,
    Risk, Infrastructure and Data teams to secure approvals
    and to design controls into solutions from the outset
    rather than retrofitting them.
  - Support enterprise AI adoption through training, user
    enablement, office hours, documentation, runbooks and
    structured change management.
  - Drive continuous improvement and innovation across the AI
    and automation platforms, evaluating new Microsoft
    capabilities and recommending where the firm should adopt,
    pilot or wait.

  Required Areas of Expertise Copilot, agents and agentic AI

  - Microsoft 365 Copilot administration and engineering;
    Copilot Chat; Copilot agents; Copilot Studio; Microsoft
    365 Agents and Agent 365 administration.
  - Agentic AI architecture and implementation, including
    orchestration patterns, tool use, evaluation and safe
    failure behavior.
  - Prompt engineering and retrieval-augmented generation
    concepts applied to enterprise content and structured
    data.
  - Microsoft 365 platform administration across Exchange
    Online, SharePoint Online, OneDrive and Teams, and an
    understanding of how each grounds Copilot.

  Claude Cowork, Claude Code and multi-vendor AI tooling

  - Claude Cowork administration and engineering: workspace and
    user enablement, entitlement and licensing, connector and
    data-source configuration, skills and agent management,
    and day-to-day operational support.
  - Claude Code administration in a controlled enterprise
    setting: rollout to developer environments, authentication
    and access control, repository and permission scoping,
    tool and command restrictions, and usage monitoring.
  - Governance of Claude Cowork and Claude Code: acceptable-use
    policy, data handling and retention, audit logging and
    interaction reporting, model and feature approval, and
    evidencing compliance to Legal, Compliance and Information
    Security.
  - Ability to operate a multi-vendor AI estate, applying
    consistent security and compliance controls across
    Microsoft and Anthropic tooling and advising the business
    on which platform suits a given use case.

  Azure AI, automation and integration

  - Azure AI Foundry, Azure OpenAI Service and Azure AI
    Services.
  - Power Platform and Power Automate; process automation and
    workflow orchestration at enterprise scale.
  - API integrations and automation frameworks, including
    Microsoft Graph and custom connector development.
  - Enterprise platform monitoring, operational support and
    incident management.

  Governance, compliance and identity

  - Microsoft Information Barriers: deployment, administration,
    governance, troubleshooting and compliance validation.
  - Microsoft Purview, data loss prevention, sensitivity labels,
    information protection and records management.
  - Enterprise AI governance, AI security, risk management and
    regulatory compliance.
  - Microsoft Entra ID and enterprise identity and access
    management.

  Required Qualifications

  - Bachelor's degree in computer science, engineering,
    information technology or a related discipline.
  - Six to seven years of relevant experience across Microsoft
    technologies and enterprise platforms.
  - Demonstrated experience with Microsoft 365 administration
    and engineering in a large, complex tenant.
  - Hands-on experience implementing Microsoft Copilot and AI-
    powered productivity solutions in production, not solely
    in a lab or pilot setting.
  - Practical experience with Copilot Studio, Azure AI services
    and the Power Platform.
  - Strong understanding of enterprise security, governance,
    compliance and risk management, and the judgement to apply
    it to novel AI scenarios.
  - Experience integrating enterprise applications and services
    through APIs and automation frameworks.
  - Hands-on experience administering and governing Claude
    Cowork and Claude Code in an enterprise environment,
    including enablement, access control and usage oversight.

  Preferred Qualifications

  - Experience within financial services, investment banking,
    capital markets, asset management or another highly
    regulated industry.
  - Experience establishing or operating an enterprise AI
    governance program.
  - Experience managing large-scale Microsoft 365 and Copilot
    deployments across multiple regions.
  - Working knowledge of SEC, FINRA and MiFID obligations,
    information barriers, records management and electronic
    communications compliance requirements.
  - Microsoft certifications in Azure AI, Microsoft 365,
    security and compliance, Copilot, Power Platform or
    related technologies — for example AI-102, MS-102, SC-300,
    SC-401, PL-200 or PL-400.

  Soft Skills

  - Excellent verbal and written communication, with the
    discipline to produce updates that are complete and self-
    contained.
  - Strong stakeholder management and relationship-building
    capability across business and technology functions.
  - Ability to pitch an explanation correctly for the audience,
    whether that is an engineer, a compliance officer or a
    business head.
  - Analytical thinking and structured problem-solving, with a
    bias toward root cause over workaround.
  - Self-motivated and able to work independently, carrying
    issues to closure without prompting.
  - Collaborative mindset, with experience supporting globally
    distributed teams across time zones.

  About Us

  Jefferies is a leading global, full-service investment
  banking and capital markets firm that provides advisory,
  sales and trading, research, and wealth and asset management
  services. With more than 40 offices around the world, we
  offer insights and expertise to investors, companies, and
  governments.

  At Jefferies, we believe that diversity fosters creativity,
  innovation and thought leadership through the infusion of
  new ideas and perspectives. We have made a commitment to
  building a culture that provides opportunities for all
  employees regardless of our differences and supports a
  workforce that is reflective of the communities where we
  work and live. As a result, we are able to pool our
  collective insights and intelligence to provide fresh and
  innovative thinking for our clients.

