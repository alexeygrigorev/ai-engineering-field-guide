description: |
  Summary

  We are seeking a highly skilled AI-Powered Java Full Stack
  Engineer to join our dynamic IT Services team. In this
  pivotal role, you will leverage your extensive background in
  software development to design, build, and deploy scalable
  applications that integrate advanced artificial intelligence
  capabilities. You will act as a bridge between traditional
  backend architecture and cutting-edge machine learning
  models, ensuring seamless interoperability and high
  performance. Your expertise will be instrumental in driving
  innovation, optimizing system efficiency, and delivering
  robust solutions that meet the evolving demands of our
  clients in the technology sector.

  Responsibilities

  - Architect and develop full-stack applications using Java and
    Spring Boot, ensuring high availability and scalability.
  - Integrate Large Language Models (LLMs) and AI frameworks
    such as LangChain, Semantic Kernel, and LlamaIndex into
    existing software ecosystems.
  - Design and implement backend services that support Python-
    based AI modules and interactive user interfaces built
    with TypeScript or Node.js.
  - Collaborate with cross-functional teams to define technical
    specifications and translate business requirements into
    functional AI-driven features.
  - Optimize application performance and resolve complex
    technical challenges related to AI integration and full-
    stack development.
  - Maintain code quality through rigorous testing, code
    reviews, and adherence to industry best practices.
  - Stay current with emerging trends in artificial
    intelligence, full-stack technologies, and software
    engineering methodologies.

  Requirements

  Requirements:

  - Possess 6 to 8 years of professional experience in software
    development, with a strong focus on full-stack
    engineering.
  - Demonstrate deep proficiency in Java and the Spring Boot
    framework for building enterprise-grade applications.
  - Have hands-on experience with Python and specific AI
    orchestration tools including Semantic Kernel, LlamaIndex,
    and LangChain.
  - Be skilled in working with Large Language Models (LLMs) to
    create intelligent, context-aware applications.
  - Show competence in frontend and runtime technologies,
    specifically TypeScript and Node.js.
  - Exhibit a proven track record in AI-powered Java Full Stack
    Development projects.
  - Hold a competitive salary expectation aligned with the
    market rate of ₹17 LPA for this level of expertise.
