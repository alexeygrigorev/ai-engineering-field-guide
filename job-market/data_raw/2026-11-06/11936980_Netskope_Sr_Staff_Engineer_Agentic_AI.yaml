description: |
  Join the Future of Security at Netskope

  Netskope (NASDAQ: NTSK) is a leader in modern security and
  networking for the cloud and AI era. We secure and
  accelerate cloud, data, and AI in real time, everywhere.
  Thousands of customers, including more than 30 of the
  Fortune 100, trust the Netskope One platform, its Zero Trust
  Engine, and the powerful NewEdge network to gain full
  visibility and control without performance trade-offs.

  At Netskope, our technology is driven by our greatest
  strength: our people. We believe that belonging powers
  innovation, and success is both personal and organizational.
  We embrace differences in gender, ethnicity, beliefs,
  ability, and identity, creating an environment where every
  voice is heard and respected. We empower our employees to
  bring their authentic selves to work, grow their careers
  through continuous education and mentorship, and lead with
  transparency and curiosity. Join a team where you belong,
  where you are encouraged to be an entrepreneur, and where
  together, we continue to redefine the landscape of security.

  Visit Careers at Netskope to learn more. Follow us on
  LinkedIn and Instagram.

  About the team

  We are seeking an exceptional  Engineer to build next-
  generation security analytics and AI-powered capabilities
  within Netskope's platform. This is a high-impact individual
  contributor role for an engineer who excels at solving
  complex technical problems at the intersection of artificial
  intelligence, large-scale data systems, and cybersecurity.

  As a Sr.Staff Engineer, you will own the architecture and
  delivery of cloud services that handle large volumes of data
  and traffic for enterprise customers. You’ll set technical
  direction, raise the engineering bar for the team, and ship.

  What's in it for you

  This is your chance to work at the absolute intersection of
  Artificial Intelligence, large-scale Data Systems, and
  Cybersecurity. You won't just use existing tools; you will
  be designing and implementing sophisticated, cutting-edge
  systems that fundamentally change how enterprises detect and
  respond to threats.

  What you will be doing

  - Design, build, and operate scalable, high-performance
    backend services in Python on AWS
  - Architect distributed systems with sound tradeoffs across
    consistency, availability, latency, cost, and operational
    complexity
  - Provide technical leadership across the full project
    lifecycle, from discovery and design through delivery and
    operations
  - Use AI-native development workflows (Claude Code) to
    accelerate design, implementation, testing, code review,
    and debugging, and help the team develop effective
    practices for doing so
  - Partner with product and customers to turn requirements into
    well-scoped, well-designed features
  - Investigate and resolve production issues, and drive
    improvements to observability, reliability, and incident
    response
  - Improve engineering processes, CI/CD, and developer tooling

  Required skills and experience

  - 12+ years of software development experience, including
    building enterprise-grade backend systems
  - Expert-level Python, with strong experience building
    production backend services and REST APIs
  - Deep experience with AWS and cloud architecture (e.g.,
    compute, storage, networking, messaging, IAM, managed data
    services)
  - Strong distributed systems fundamentals: scalability, fault
    tolerance, concurrency, data consistency, and event-driven
    or asynchronous architectures
  - Solid knowledge of databases and data stores, both
    relational and NoSQL (OLTP and OLAP)
  - Hands-on experience with Docker and Kubernetes
  - Demonstrated fluency with AI-native development, including
    daily, hands-on use of Claude Code or similar agentic
    coding tools. You can describe how you decompose work for
    an AI agent, review and validate its output critically,
    and maintain quality, security, and maintainability while
    moving faster.
  - Strong analytical and troubleshooting skills
  - Comfort working in a fast-paced environment where you might
    lead a design one week and fix a critical bug or improve
    CI the next

  Nice to have

  - Hands-on experience building production LLM agents,
    including orchestration frameworks like LangGraph, ReAct-
    style reasoning and tool-use loops, and deep agent
    patterns (planning, sub-agents, long-running tasks)
  - Experience with observability tooling and SLO-driven
    operations
  - Experience with Infrastructure as Code (Terraform, CDK,
    CloudFormation)
  - Experience with streaming and messaging systems (Kafka,
    Kinesis, SQS/SNS)

  Education

  - BSCS or equivalent required, MSCS or equivalent strongly
    preferred

