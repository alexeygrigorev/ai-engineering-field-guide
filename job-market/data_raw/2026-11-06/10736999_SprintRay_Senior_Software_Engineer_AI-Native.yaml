description: |
  Senior Software Engineer, AI-Native

  Location: Los Angeles, CA (Onsite) Compensation: $130,000 –
  $170,000k annually (Dependant on experience)

  About the Role

  SprintRay is a forward-thinking, nimble company on a journey
  to provide digital dentistry solutions to our customers. We
  leverage conventional and unconventional wisdom with an
  entrepreneurial spirit that leaves no stone unturned as we
  develop the highest quality products, services, and
  relationships. We are looking for an experienced software
  development engineer with AI-Native end-to-end experience to
  join our Software R&D team to help us build new products and
  features that enable dental practices to efficiently produce
  and print dental appliances on premises.

  Key Responsibilities

  - Partner with senior technical leaders to design, build, and
    enhance SprintRay's software and platform, including
    microservice orchestration, micro-frontend and IoT
    workflows, and related cloud-based infrastructure.
  - Contribute senior-level design and hands-on implementation
    across the printing experience, product scalability, and
    dental manufacturing pipeline, including the AI and
    algorithm integration layer connecting native applications
    to cloud computing.
  - Drive assigned features and services end-to-end —
    requirements, design, implementation, and observability —
    within our cloud compute architecture and device software.
  - Drive the technical evolution of dental technologies from
    dental scan to final dental applications, empowering end
    users by applying cutting-edge technologies to dental
    fields.
  - Improve performance, reliability, and cost of the services
    you build, including monitoring, root cause analysis, and
    incident response.
  - Collaborate with product managers, cross-disciplinary
    engineering teams, and global stakeholders on technical
    solutions and directions.
  - Maintain a high personal bar for code scalability,
    testability, and operational excellence within the domain,
    and drive with advanced AI flows in such fields.

  Required Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field; graduate degree preferred.
  - 5+ years of professional software engineering experience
    building and operating cloud distributed systems, IoT
    systems, or large-scale compute services.
  - Strong proficiency in AI-native engineering in JavaScript,
    Kotlin/Java, C#, and/or C++.
  - Deep hands-on experience with AWS services including Lambda,
    Fargate, EC2, S3, and event-driven architectures.
  - Experience with distributed systems design, applied
    cryptography fundamentals, and microservices deployment
    with CI/CD.
  - Experience building and operating serverless and
    containerized workloads in production.
  - Track record of independently delivering and supporting
    services in production, including reliability,
    performance, and cost awareness
  - Experience in regulated industries (medical device,
    healthcare) or a global team is a plus.
  - Strong written and verbal communication skills, including
    the ability to produce clear technical documentation.

  Employment Type

  Full-time, Onsite

  About SprintRay

  SprintRay is rewriting the rules of dentistry with
  technology that’s smart, fast, and designed to make life
  easier for dental professionals. Since 2014, we’ve been on a
  mission to deliver the most advanced 3D printing solutions
  in the industry—combining hardware, software, and materials
  into one seamless ecosystem.

  But what really makes SprintRay different is our people.
  We’re a bold, global team of innovators, problem-solvers,
  and doers who thrive on pushing boundaries and challenging
  the status quo. Every product we create is driven by a
  simple goal: help dentists spend less time on repetitive
  tasks and more time changing patients’ lives.

  Our culture is entrepreneurial, collaborative, and fueled by
  curiosity. We celebrate diverse perspectives and believe the
  best ideas can come from anywhere. Whether we’re building
  next-generation AI tools, designing new materials, or
  supporting our customers on the front lines, we’re united by
  the same passion—transforming digital dentistry and having
  fun while we do it.

  At SprintRay, the future of dentistry is being printed
  today. Want to be part of it?

