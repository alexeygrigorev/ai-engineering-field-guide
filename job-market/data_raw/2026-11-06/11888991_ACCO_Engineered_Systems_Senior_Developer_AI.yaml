description: |
  Job Summary:

  The Senior AI Developer role will lead the architecture,
  technical design, and deployment of enterprise Artificial
  Intelligence solutions across ACCO’s digital infrastructure.
  The position designs Retrieval-Augmented Generation (RAG)
  pipelines, agentic workflows, custom LLM integrations, and
  intelligent system automation across our Azure and Google
  Cloud ecosystem. Working closely with our Applications
  Architect, the Senior AI Developer will establish standards
  for LLMOps, vector search, model evaluation, and secure AI
  engineering to drive innovation while maintaining rigorous
  data privacy and cybersecurity standards.

  Essential Duties and Responsibilities:

  - Drive hands-on software development by writing clean,
    maintainable, and secure code across the entire Design,
    build, and deploy production-grade AI solutions, AI
    agents, and Retrieval-Augmented Generation (RAG)
  - pipelines using enterprise data sources.
  - Partner with the Applications Architect to turn business
    requirements into secure, scalable AI microservices
  - within Azure and Google Cloud and .NET backend applications.
  - Establish and enforce standards for LLMOps, including model
    evaluation, output validation, hallucination
  - mitigation, latency reduction, and cost optimization.
  - mplement robust AI security measures, prompt guardrails, and
    data privacy protocols to protect proprietary
  - business intelligence and ensure regulatory compliance.
  - Develop and maintain automated data preparation, chunking,
    and embedding pipelines for structured and
  - unstructured business data.
  - Evaluate, benchmark, and integrate emerging open-source and
    foundation models (Gemini, OpenAI, Claude,
  - Llama) and orchestration frameworks.
  - Conduct architectural reviews, code reviews, and workshops
    to educate and upskill team members on AI
  - integration design patterns.
  - Monitor runtime performance, usage metrics, and accuracy of
    deployed AI agents and models, implementing
  - continuous improvement loops.
  - Perform other duties as assigned.

  Position Requirements (Work Experience, Skills, Licenses,
  etc.):

  - 5+ years of professional software engineering experience,
    with at least 2+ years dedicated to building, integrating,
    or deploying LLMs, vector search, or AI pipelines in
    production environments.
  - Deep technical proficiency in Python for AI/ML development,
    alongside working knowledge of C# and .NET Core
    architectures.
  - Hands-on experience with vector databases and semantic
    search technologies
  - Strong expertise with LLM orchestration frameworks (e.g.,
    Semantic Kernel, LangChain, LlamaIndex, AutoGen).
  - Proven track record deploying, scaling, and managing AI
    endpoints within the Azure and Google Cloud ecosystem.
  - Deep understanding of AI security risks (OWASP Top 10 for
    LLMs, prompt injection, data leakage) and enterprise
    encryption/privacy standards.
  - Ability to work onsite from the Pasadena corporate office
    four days a week.



  Education and Experience:

  Required:

  - Bachelor’s degree in Computer Science, Artificial
    Intelligence, Data Science, Software Engineering, or
    equivalent practical/industry experience.
  - Demonstrated experience delivering end-to-end, production-
    ready AI or agentic applications.

  Desired:

  - Prior experience building technical leads or mentoring
    engineering teams on modern cloud and AI practices.



  ACCO Competencies:

  - Proactivity/Initiative: Recognizes what needs to be done and
    accomplishes it in a manner appropriate for one’s
    level/position and with minimal supervision.
  - Perseverance: Shows wherewithal to fight for difficult goals
    despite challenges and to bounce back from adversity.
  - Motivation/Dedication: Commits to excellence in pursuing
    unselfish goals. Initiates action with collective goals,
    takes responsibility, and shows personal humility.
  - Technical Curiosity/Willingness to Learn: Interest in
    seeking out new experiences, knowledge, and candid
    feedback; demonstrating an openness to learning and
    change.
  - Insight: The ability to gather and make sense of information
    that suggests new possibilities.
  - Engagement: Shows a knack for using emotion and logic to
    communicate a persuasive vision and connect with people.
  - People Skills: Is approachable and gains the mutual trust
    and respect of others. Understands people’s strengths &
    weaknesses and actively seeks to understand other
    perspectives.
  - Communication: Fosters open, honest, candid and respectful
    communication. Effectively assesses, defines and
    communicates issues in a timely manner, both written and
    verbal.
  - Teamwork: The ability to effectively work toward common
    goals with others by supporting, encouraging, and sharing
    information in an authentic and approachable manner.
  - Big Picture: Understands and contributes to the
    organizations’ short- and long-term business strategy. On
    a personal level has independently developed a vision for
    short- and long-term career success.
  - Problem-Solver: Ability to identify, analyze, and solve
    problems in support of personnel, group, department, or
    organizational objectives.
  - Execution: Effectively takes a vision and translates into
    action by including the right people. Identify and remove
    barriers, when possible, to achieve results. Demonstrates
    appropriate compromise, effective time management,
    prioritization practices and holds team members (including
    themselves) accountable for their performance/conduct.
  - Professionalism: Respectfully observes and challenges the
    status quo with intent for improvement. Can take
    direction, accept feedback, and take full responsibility
    for their actions. Lead by example through positive
    influence and ethical leadership with consideration of the
    entire organization.



  Job Responsibility Level:

  No direct reports



  Travel Requirements:

  Travel required 10-15% of the time to other office
  locations, field, shops or project sites.



  Hours:

  This is an exempt position. Workdays are scheduled from
  Monday through Friday. Typically, work hours begin and end
  between 7:00 am and 5:00 pm as scheduled with the position's
  supervisor. Work outside of regular hours may occasionally
  be necessary to meet business needs.



  Physical Demands:

  (The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.)



  - Must frequently lift and/or move up to 10 pounds and
    occasionally lift and/or move up to 20 pounds.
  - Specific vision abilities required by this job include close
    vision and ability to adjust focus.
  - Prolonged sitting.
  - Frequently required to reach with hands and arms.
  - Occasionally required to stand; walk and stoop, kneel,
    crouch.

  Competitive Wages:

  $133,000 to $171,500 Annual Salary. Applicants please note
  that actual compensation is determined by several factors
  that are unique to each candidate, including but not limited
  to job-related skills, depth of experience, certifications,
  relevant education or training, and specific work location,
  among others. The offered wage or salary is only one aspect
  of an employee's total compensation.

