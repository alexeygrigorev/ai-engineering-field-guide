description: |
  Job Description: Senior AI-Native Full Stack Developer

  Angular | Node.js | OpenAI | Claude | AI Coding Agents

  Company: Wenodo Department: Technology & Product Engineering
  Experience: 4–8+ years (flexible for exceptional candidates)
  Employment Type: Full-Time Location: On Site

  About the Role

  Wenodo is looking for a highly skilled, forward-thinking
  Senior AI-Native Full Stack Developer who combines strong
  expertise in Angular and Node.js with hands-on experience in
  AI-powered software development and Large Language Model
  (LLM) integrations.

  We are not looking for a traditional developer who
  occasionally uses ChatGPT to generate code.

  We are looking for an engineer who has fundamentally adopted
  AI-first development workflows, uses modern AI coding agents
  to accelerate delivery, and knows how to build scalable,
  production-ready applications powered by leading AI models.

  The ideal candidate should be equally comfortable developing
  sophisticated frontend applications, building robust backend
  services, orchestrating AI coding tools, and integrating
  OpenAI, Anthropic Claude, and other LLM APIs into enterprise
  products.

  Our objective is to build better software, faster, without
  compromising code quality, security, maintainability, or
  scalability.

  Requirements

  Key Responsibilities

  1. Full Stack Application Development

  - Design, develop, and maintain modern enterprise-grade
       applications using Angular and Node.js.
  - Build scalable, modular Angular applications using
    TypeScript,
       standalone components, routing, reactive forms, and
  modern state management.
  - Develop secure, high-performance backend services and
    RESTful
       APIs using Node.js.
  - Implement reusable components, shared libraries,
       authentication, authorization, and role-based access
  control.
  - Work with relational databases, API integrations, and
    complex
       business workflows.
  - Follow software engineering best practices, including clean
       architecture, automated testing, code reviews, and
  CI/CD.

  2. AI-Native Software Engineering

  This is a core requirement of the role.

  - Demonstrate extensive practical experience using AI coding
       assistants and autonomous coding agents.
  - Use tools such as Claude Code, Cursor, GitHub Copilot,
       OpenAI Codex, or equivalent platforms to accelerate
  software development.
  - Use AI agents for:
  - Design effective prompts, instructions, project context, and
       agent workflows to produce reliable, maintainable code.
  - Review, validate, secure, and optimize AI-generated code
    before
       deploying it.
  - Continuously evaluate new AI development tools and adopt
    those
       that improve engineering productivity.

  We expect candidates to demonstrate how they use AI coding
  tools in their daily development process, not simply list
  them on their resumes.

  3. LLM API Integration & AI Application Development

  Hands-on experience with both OpenAI and Anthropic Claude
  APIs is mandatory.

  - Build production-ready AI-powered features using:
  - Implement LLM-powered application workflows using
    tool/function
       calling, structured outputs, streaming responses, and
  conversation management.
  - Build AI assistants, conversational interfaces, intelligent
       automation workflows, and AI-enabled business
  applications.
  - Integrate LLMs with internal databases, business APIs, and
       third-party applications.
  - Develop retrieval-augmented generation (RAG) solutions where
       appropriate.
  - Understand agent orchestration, multi-step workflows, and
    the
       Model Context Protocol (MCP).
  - Implement appropriate prompt engineering, context
    management,
       token optimization, caching, and model selection
  strategies.
  - Optimize LLM integration for latency, cost, accuracy,
       reliability, and scalability.
  - Implement secure AI integrations, including API key
    management,
       access control, data protection, and protection against
  prompt injection.
  - Evaluate AI responses and implement guardrails, structured
       validation, error handling, and monitoring.

  4. Architecture, Quality & Performance

  - Design maintainable, scalable frontend and backend
       architectures.
  - Write clean, well-structured, production-quality TypeScript
    and
       JavaScript.
  - Apply modern engineering principles while maintaining rapid
       delivery.
  - Implement automated testing and reliable deployment
    pipelines.
  - Optimize frontend performance, API response times, and
    backend
       resource consumption.
  - Use AI tools to improve productivity while retaining
    ownership
       of the correctness and quality of delivered code.
  - Collaborate with product managers, designers, and
    engineering
       teams to translate business requirements into
  functional applications.

  Mandatory Technical Skills

  Frontend Development

  - Advanced Angular experience with modern Angular
    architecture.
  - Strong TypeScript, JavaScript, HTML, CSS, and responsive UI
       development.
  - RxJS, Angular routing, forms, HTTP interceptors, and state
       management.
  - Experience designing modular, reusable frontend components.

  Backend Development

  - Strong Node.js experience.
  - Experience with Express.js, NestJS, or equivalent
    frameworks.
  - REST API development, authentication, security, and
    integration
       patterns.
  - Experience with SQL databases and database optimization.
  - Solid knowledge of asynchronous programming and API
       performance.

  AI Coding Tools

  - Demonstrable daily use of at least one advanced AI coding
    agent
       such as Claude Code, Cursor, or OpenAI Codex.
  - Experience with AI-assisted feature development, debugging,
       refactoring, and automated testing.
  - Ability to manage agent instructions, project context, and
       iterative development workflows.
  - Ability to critically review and improve AI-generated code.

  LLM Engineering

  - Proven hands-on development using OpenAI APIs.
  - Proven hands-on development using Anthropic Claude APIs.
  - Function/tool calling and structured JSON outputs.
  - Prompt engineering and conversation/context management.
  - Streaming APIs, error handling, rate limits, and token usage
       optimization.
  - Secure integration of AI models into backend applications.

  Good to Have

  - Google Gemini API integration.
  - OpenAI Agents SDK, Anthropic Agent SDK, or similar agent
       frameworks.
  - Model Context Protocol (MCP) servers and clients.
  - Experience developing RAG pipelines and working with vector
       databases.
  - WebSockets, Socket.IO, or real-time application development.
  - Docker, cloud infrastructure, and CI/CD pipelines.
  - Experience with AWS, Microsoft Azure, or Google Cloud.
  - Experience integrating AI with enterprise SaaS, finance, HR,
       analytics, or workflow automation products.
  - Experience modernizing legacy applications using AI coding
       tools.
  - Familiarity with multi-agent systems, AI evaluations, and
       observability.

  What Makes an Ideal Candidate?

  We are particularly interested in developers who:

  - Think AI-first: Naturally consider
       how AI agents can accelerate their engineering work.
  - Are technically strong: Can
       independently architect, build, debug, and deploy
  software without relying blindly on AI-generated code.
  - Build AI products: Have
       successfully integrated OpenAI and Claude into working
  applications.
  - Deliver end-to-end: Can take a
       requirement from concept through frontend, backend,
  testing, and deployment.
  - Optimize for efficiency: Understand
       how to reduce development time, LLM cost, and
  application latency.
  - Take ownership: Are comfortable
       working independently, making technical decisions, and
  delivering measurable results.
  - Continuously experiment: Actively
       evaluate emerging AI technologies and incorporate
  practical improvements into their workflows.

  What We Are Not Looking For

  - Developers whose AI experience is limited to copying code
    from
       ChatGPT.
  - Candidates who have used OpenAI or Claude chat applications
    but
       have never integrated their APIs.
  - Developers who depend entirely on AI-generated code without
       understanding its implementation.
  - Candidates with strong frontend skills but little or no
    backend
       development experience.
  - Developers who prioritize coding speed over application
       reliability, security, and maintainability.

  Interview & Technical Assessment

  Shortlisted candidates should be prepared to demonstrate:

  - Angular Expertise: Design and
       implement a modern Angular module following scalable
  architecture practices.
  - Node.js Expertise: Build a secure
       backend API with appropriate validation, error
  handling, and database integration.
  - AI Coding Productivity: Demonstrate
       using Claude Code, Cursor, or Codex to rapidly build,
  modify, and test an application.
  - OpenAI Integration: Develop an
       API-backed AI feature using OpenAI with structured
  output or tool calling.
  - Claude Integration: Demonstrate
       equivalent implementation knowledge using the Anthropic
  Claude API.
  - Engineering Judgment: Explain
       design decisions, identify AI-generated code defects,
  and demonstrate testing, security, and performance
  considerations.

  Candidates should be able to explain production
  implementations they have personally delivered, including
  challenges faced and how they addressed them.

  Benefits

  Why Join Wenodo?

  - Work on modern SaaS products with real-world business
       applications.
  - Build AI-powered capabilities directly into enterprise
       software.
  - Use the latest AI coding agents and LLM technologies as part
    of
       everyday development.
  - Influence engineering architecture, tooling, and AI adoption
       strategies.
  - Work in an environment that values ownership, technical
       excellence, innovation, and rapid execution.

  We are building an AI-native engineering culture where
  developers use AI as a powerful engineering multiplier—not
  as a substitute for engineering expertise.

  If you are an exceptional Angular and Node.js developer who
  actively uses AI coding agents and has real experience
  building applications with OpenAI and Claude APIs, we would
  love to hear from you.
