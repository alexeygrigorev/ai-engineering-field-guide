description: |
  About the role

  You will be the most senior hands-on AI engineer at Truvio
  and set the technical direction for how we build agents for
  finance in Dynamics 365. You will define the architecture of
  our agentic platform, lead the hardest problems yourself
  (context graph reasoning, agent reliability, governance),
  and raise the bar for every team shipping AI. You work
  closely with the CTO, product leadership and the platform
  team, and your influence comes from code, designs and
  judgment rather than reports.

  What you will do

  • Own the end-to-end architecture of the Truvio agentic
  platform: how agents reason over the context graph, call ERP
  tools, and hand decisions to humans under Trust & Control.

  • Lead design and build of the first flagship agents for AP,
  AR and treasury, writing production code and setting the
  patterns others follow.

  • Define engineering standards for AI: evaluation
  methodology, quality gates, safety and governance controls,
  cost and latency budgets.

  • Make the build, buy or partner calls on models, frameworks
  and vendors, and write the decision records behind them.

  • Mentor senior engineers across product teams and grow the
  AI engineering community (design reviews, AI Unplugged
  sessions, internal writing).

  • Represent Truvio's AI technology with key customers,
  Microsoft and partners, and translate what you learn into
  the roadmap.

  • Spot where AI changes what our products should be, not
  just how they are built, and bring those ideas to product
  leadership.

  What you bring

  • 10+ years of software engineering, including 3+ years
  leading the design of production AI or ML systems at scale.

  • A track record of shipping LLM-based or agentic systems
  that real customers depend on, with measurable outcomes.

  • Deep systems design skills: distributed systems, data
  modeling, APIs, security and multi-tenant SaaS.

  • Strong hands-on coding in Python and/or C#/.NET; you still
  enjoy writing the hard parts.

  • Expertise in evaluation, retrieval, tool calling and agent
  orchestration, and a clear view of their failure modes.

  • Experience setting technical direction across multiple
  teams without direct authority.

  • Excellent written English: you can write a design doc an
  engineer acts on and a one-pager an executive decides on.

  Nice to have

  • Experience with Microsoft Dynamics 365 (Business Central
  or Finance & Operations), Dataverse or another ERP.

  • Background in finance operations: accounts payable,
  accounts receivable, invoice processing or treasury.

  • Knowledge graphs, graph databases or semantic data
  modeling.

  • Familiarity with the EU AI Act, GDPR and audit
  requirements for AI in regulated processes.

  • Publications, open source work or conference talks in
  applied AI.

  Who you are

  You combine technical depth with curiosity and a strong
  sense of ownership. You enjoy tackling complex problems,
  challenging assumptions and turning ideas into practical
  solutions. You build trust through clear communication and
  sound judgment, and you help others succeed by sharing
  knowledge and working towards a common goal.

  Why Truvio

  At Truvio, you will join a global SaaS environment with a
  clear product focus and a strong connection to the Microsoft
  Dynamics ecosystem. This role gives you the opportunity to
  shape our AI architecture, stay close to production code and
  influence how teams build solutions for finance. Working
  alongside engineering, product and platform colleagues, you
  will help turn technical innovation into meaningful customer
  value.

  Other information

  Location: Remote, Europe (Nordic hubs or Vienna welcome). We
  have offices in Sweden, Denmark, UK and the Netherlands.

  Level: Principal individual contributor (technical lead for
  AI across Engineering)

  Employment: Permanent, 100 %

  Start: As soon as we find the right candidate

  About Truvio

  Truvio is a global software company delivering solutions for
  Microsoft Dynamics 365. We help organizations get more value
  from their business systems by bringing together finance,
  business operations and commerce. Truvio has approximately
  450 employees across North America, Europe, Asia and
  Australia.

  Our core values: Take Ownership, Build Trust, Drive
  Innovation and Succeed Together, guide how we work and help
  our customers get more from their ERP investments. Own your
  growth, shape your future with us.

  Ready to help shape the future of AI at Truvio? We’d love to
  hear from you.
