title: Senior AI Engineer (Customer Facing)
company: RapidCanvas
location: Mumbai, IND
work_type: FULL_TIME
company_size: 35 Employees
description: |
  About Us:

  RapidCanvas is a pioneer in hybrid enterprise AI. We combine
  autonomous agents with human expertise to make enterprise-
  grade AI accessible. We are the trusted partner for
  transforming businesses by unlocking the hidden value in
  data. We deliver measurable outcomes 10X faster and at 80%
  lower cost. We partner with industry leaders in
  manufacturing, retail, financial services, and
  infrastructure.

  Who We Are Looking For:

  We are seeking a highly motivated and skilled AI Engineer.
  You will have strong fundamentals in applied machine
  learning. You will have a passion for building and deploying
  production-grade AI solutions for enterprise clients. You
  will be a key technical expert and the face of our company.
  You will directly interface with customers to design, build,
  and deliver cutting-edge AI applications. This is a
  customer-facing role. It requires a balance of deep
  technical expertise and excellent communication skills.

  Roles & Responsibilities:

  Design & Deliver AI Solutions

  - Interact directly with customers.
  - Understand their business requirements.
  - Translate them into robust, production-ready AI solutions.
  - Manage AI projects with the customer's vision in mind.
  - Build long-term, trusted relationships with clients.

  Build & Integrate Agents

  - Architect, build, and integrate intelligent agent systems.
  - Automate IT functions and solve specific client problems.
  - Use expertise in frameworks like LangChain or LangGraph to
    build multi-step tasks.
  - Integrate these custom agents directly into the RapidCanvas
    platform.

  Implement LLM & RAG Pipelines

  - Develop grounding pipelines with retrieval-augmented
    generation (RAG).
  - Contextualize LLM behavior with client-specific knowledge.
  - Build and integrate agents with infrastructure signals like
    logs and APIs.

  Collaborate & Enable

  - Work with customer data science teams.
  - Collaborate with other internal Solutions Architects,
    Engineering, and Product teams.
  - Ensure seamless integration of AI solutions.
  - Serve as an expert on the RapidCanvas platform.
  - Enable and support customers in building their own
    applications.
  - Act as a Product Champion, providing crucial feedback to the
    product team to drive innovation.

  Data & Model Management

  - Oversee the entire AI project lifecycle.
  - Start from data preprocessing and model development.
  - Finish with deployment, monitoring, and optimization.

  Champion Best Practices

  - Write clean, maintainable Python code.
  - Champion engineering best practices.
  - Ensure high performance, accuracy, and scalability.

  Key Skills Required:

  Experience

  - Minimum 5+ years of hands-on experience in AI/ML engineering
    or backend systems.
  - Recent exposure to LLMs or intelligent agents is a must.

  Technical Expertise

  - Proficiency in Python.
  - Proven track record of building scalable backend services or
    APIs.
  - Expertise in machine learning, deep learning, and Generative
    AI concepts.
  - Hands-on experience with LLM platforms (e.g., GPT, Gemini).
  - Deep understanding of and hands-on experience with agentic
    frameworks like LangChain, LangGraph, or CrewAI.
  - Experience with vector databases (e.g., Pinecone, Weaviate,
    FAISS).

  Customer & Communication Skills

  - Proven ability to partner with enterprise stakeholders.
  - Excellent presentation skills.
  - Comfortable working independently.
  - Manage multiple projects simultaneously.

  Preferred Skills

  - Experience with cloud platforms (e.g., AWS, Azure, Google
    Cloud).
  - Knowledge of MLOps practices.
  - Experience in the AI services industry or startup
    environments.

  Why Join us:

  - High-impact opportunity: Play a pivotal role in building a
    new business vertical within a rapidly growing AI company.
  - Strong leadership & funding: Backed by top-tier investors,
    our leadership team has deep experience scaling AI-driven
    businesses.
  - Recognized as a top 5 Data Science and Machine Learning
    platform by independent research firm G2 for customer
    satisfaction.
