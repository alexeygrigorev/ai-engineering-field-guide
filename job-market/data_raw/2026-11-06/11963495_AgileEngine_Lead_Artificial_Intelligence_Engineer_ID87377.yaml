description: |
  We are looking for a Lead AI Engineer to architect
  generative AI workflows that accelerate cloud configuration
  and remediation. Using RAG, vector databases, and LLM APIs,
  this person automates Terraform modules and Rego policies
  while guiding the technical direction of AI enablement
  initiatives. Mentoring engineers across a distributed,
  follow-the-sun team is part of the role.

  The mandatory requirements are 6+ years of software
  engineering experience with public cloud infrastructure, 2+
  years of experience with cloud infrastructure deployment
  pipelines and IaC, 2+ years of experience developing Agentic
  models using RAG and vector databases, and proven technical
  leadership in global organizations.

  RECRUITMENT PROCESS

  1. Application — Share a few details about your experience
  and background.

  2. Coding Challenge — If applicable, complete it in the
  coding language you are most comfortable with.

  3. Video Interview — Record a short video introduction in
  English.

  4. Technical Interview or Hiring Manager Interview — Discuss
  your experience and fit for the role.

  5. Offer — If it’s a match, you’ll receive an offer.

  WHAT YOU’LL GAIN

  • Remote work — Work from where you feel most productive.

  • Local presence in India — Work in a structured and
  compliant environment aligned with Indian regulations.

  • Competitive compensation in INR — Receive compensation in
  INR, plus support for learning, education, and wellness.

  • Exciting projects — Work with modern technologies for
  global clients and fast-growing companies.

  MUST HAVES

  • 6+ years of software engineering experience developing
  applications and services hosted on public cloud
  infrastructure.

  • 2+ years of experience with cloud infrastructure
  deployment pipelines and infrastructure as code (IaC).

  • 2+ years of experience developing Agentic models (e.g.,
  OpenAI, Anthropic) using Retrieval-Augmented Generation
  (RAG) and Vector databases.

  • Proven capability of technical leadership in a global
  organization developing technology strategy and driving
  technology programs.

  • Proven capability to lead and mentor engineers in a
  distributed, asynchronous, follow-the-sun model.

  • Upper-intermediate English level.

  NICE TO HAVES

  • Hands-on experience with modern AI orchestration
  frameworks (LangChain, LangGraph).

  • Hands-on experience writing Rego policies (Open Policy
  Agent) or Regula test cases.

  • Hands-on experience with Terraform.

  • Familiarity with cloud-native security services in Amazon
  Web Services, Azure, and Google Cloud Platform.

  • Familiarity with PagerDuty, Atlassian Suite, and
  ServiceNow.

  WHAT YOU WILL DO

  • AI Architecture & Strategy: architect Generative AI
  workflows (utilizing RAG, vector databases, and LLM APIs) to
  automate the creation of configuration requirements, Rego
  policies, and Terraform modules for new cloud services
  (e.g., AWS S3).

  • Cloud Security Automation: oversee the development of AI-
  enabled drift detection, continuous discovery, and gap
  analysis capabilities to accelerate response and remediation
  activities.

  • Policy & Infrastructure as Code (IaC): accelerate the
  generation and validation of compliant Terraform modules,
  Rego policies (for Wiz Custom Configuration Rules), and
  Regula test cases for CI/CD pipelines.

  • Technical Leadership: act as the technical lead for the
  Cloud Security Tooling team’s AI enablement initiatives,
  designing service architecture, and driving extensible
  frameworks.
