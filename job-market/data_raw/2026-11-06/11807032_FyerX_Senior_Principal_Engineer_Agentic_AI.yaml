description: |
  Senior Principal Engineer – Agentic AI

  Location: Bangalore (Onsite)

  Experience: 12–18 Years

  Job Type: Contract (12 Months)

  Salary: ₹36.48 LPA

  Job Overview

  We are hiring an experienced Senior Principal Engineer to
  design, develop, and deploy production-grade Agentic AI
  solutions. The role involves building AI-native security
  workflows, automating complex business processes, and
  integrating LLM-powered agents into enterprise systems.

  Key Responsibilities

  - Develop and deploy production-ready Agentic AI workflows and
    intelligent automation solutions.
  - Build AI agents using Python, LangGraph, LangFuse, and LLM
    technologies.
  - Implement agent orchestration, tool calling, state
    management, and context engineering.
  - Integrate AI solutions with enterprise systems using REST
    APIs, GraphQL, and MCP.
  - Optimize AI applications for performance, scalability,
    latency, and cost.
  - Implement automated testing, monitoring, observability, and
    CI/CD pipelines.
  - Collaborate with cross-functional teams to automate and
    improve existing security workflows.
  - Troubleshoot production issues and ensure system
    reliability.

  RequirementsRequired Skills & Qualifications

  - 12+ years of software engineering experience.
  - Strong hands-on experience with Python, LangGraph, LangFuse,
    and LLMs.
  - Proficiency in TypeScript/JavaScript.
  - Mandatory experience building and deploying Agentic AI
    solutions in production environments, not just POCs.
  - Experience with AI agent orchestration, tool calling,
    memory, retrieval, and prompt engineering.
  - Knowledge of REST APIs, GraphQL, MCP, and enterprise
    integrations.
  - Experience with automated testing, CI/CD, observability, and
    containerized deployments.
  - Bachelor's or Master's degree in Computer Science or a
    related field, or equivalent practical experience.

  Preferred Skills

  - Experience with AI-driven security automation, DevSecOps, or
    vulnerability management.
  - Familiarity with Claude Code, GitHub Copilot, or Cursor.
  - Experience with LLMOps, model monitoring, and deployment
    strategies.
  - Understanding of secure AI development practices and OWASP
    guidelines.

  Important: Hands-on production implementation experience in
  Agentic AI and LLM-based systems is mandatory.
