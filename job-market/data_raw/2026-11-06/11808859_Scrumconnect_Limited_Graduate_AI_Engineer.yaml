description: |
  About Us

  At Scrumconnect, we are at the forefront of artificial
  intelligence and machine learning innovation. Our mission is
  to leverage cutting-edge AI technologies to solve complex
  problems and improve everyday life. We are looking for
  passionate individuals eager to build a career in AI through
  a hands-on learning experience.

  About the Role

  As an AI Grad, you will have the unique opportunity to learn
  directly from our team of AI researchers, engineers, and
  data scientists. This role is designed to provide
  structured, real-world experience in machine learning, data
  processing, and model deployment while working on exciting
  projects. You'll gain practical experience in various stages
  of AI development, from data preprocessing and algorithm
  implementation to testing and optimising AI models.

  This is an ideal role for someone looking to start their
  career in AI or further develop their technical skills in a
  professional setting.

  Key Responsibilities

  - Assist with data collection, preprocessing, and cleaning
    tasks.
  - Support the development and training of machine learning
    models.
  - Collaborate on AI research projects under the guidance of
    senior AI engineers.
  - Perform exploratory data analysis to identify patterns and
    trends.
  - Document project milestones, coding progress, and learnings.
  - Work with cutting-edge AI technologies like neural networks,
    natural language processing, and computer vision.
  - Participate in regular team meetings and brainstorming
    sessions.

  Learning Opportunities

  - Gain experience with popular AI/ML tools and frameworks such
    as Python, TensorFlow, PyTorch, and Scikit-learn.
  - Learn about data pipelines, from data ingestion to model
    deployment.
  - Deepen your understanding of algorithms, AI ethics, and the
    latest trends in AI.
  - Gain hands-on experience with real-world AI projects that
    impact our business and customers.
  - Receive mentorship and guidance from experienced
    professionals in the AI field.

  Requirements

  - Passion for AI/ML: Demonstrated interest in artificial
    intelligence and machine learning.
  - Education: Currently pursuing or recently completed a degree
    in Computer Science, Mathematics, Data Science, or a
    related field.
  - Programming Skills: Basic proficiency in Python and
    familiarity with machine learning libraries.
  - Analytical Thinking: Ability to break down complex problems
    and communicate solutions.
  - Willingness to Learn: Strong desire to learn new
    technologies and methodologies.
  - Teamwork: Ability to collaborate with others and contribute
    to team success.

  Preferred Qualifications

  - Experience with machine learning frameworks (e.g.,
    TensorFlow, Keras, PyTorch).
  - Understanding of data structures, algorithms, and
    mathematical foundations for AI.
  - Familiarity with cloud platforms (e.g., AWS, Google Cloud,
    Azure) is a plus.
  - Previous internship or project experience in AI/ML.

  What We Offer

  - Mentorship: One-on-one mentorship with industry experts.
  - Flexible Schedule: Work hours can be adjusted based on your
    academic schedule.
  - Career Development: Support in developing your portfolio and
    skills for a future role in AI.
  - Networking Opportunities: Access to professional events and
    conferences in the AI industry.

  How to Apply

  - Submit your resume and a cover letter detailing your
    interest in AI and why you'd like to join our
    apprenticeship programme.
  - Include any relevant projects or coursework that showcase
    your skills.

  We are excited to help you kick-start your career in AI.
  Apply today!

  Job Details:

  - Benefits:
    - Company pension
    - Life insurance
    - On-site parking
    - Private medical insurance
  - Schedule: Monday to Friday
  - Education: Bachelor's degree (preferred)
  - Work Location: Hybrid remote in Staines-upon-Thames

  Diversity & Inclusion

  At Scrumconnect Consulting, we believe that diversity drives
  innovation. We are committed to creating an inclusive
  environment where every individual is respected, valued, and
  supported. We welcome applications from candidates of all
  backgrounds and experiences, and we actively encourage
  applications from women, people with disabilities,
  underrepresented communities, and those seeking flexible
  working arrangements.
