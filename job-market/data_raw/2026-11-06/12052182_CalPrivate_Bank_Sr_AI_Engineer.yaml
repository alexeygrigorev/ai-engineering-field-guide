description: |
  The Role: Sr. AI Engineer- Data Analytics & Artificial
  Intelligence

  The Location: Los Angeles, Orange County, San Diego

  Make a Difference Where It Matters Most

  At CalPrivate Bank, we believe banking is personal. We have
  deep roots in the communities we serve, and our client
  relationships are built on genuine care, thoughtful problem-
  solving, and unwavering integrity. Our solutions-based
  service, paired with best-in-class talent, sets us apart in
  the market, but it’s trust that defines who we are. It's our
  gold standard, the currency we trade in, and the foundation
  of every decision we make.


  We’re looking for leaders who want more than a title. We’re
  looking for team players who want to make an impact. If
  you're driven to lead with purpose, ready to shape the
  future and have meaningful impact at a relationship-centered
  bank, CalPrivate Bank may be the place for you.

  Your Opportunity: Sr. AI Engineer

  The Senior AI Engineer will play a key role in advancing
  CalPrivate Bank’s data analytics and artificial intelligence
  capabilities, helping translate data, emerging technologies,
  and business needs into practical solutions that improve how
  the Bank operates, serves clients, manages risk, and makes
  decisions.

  This is a senior, hands-on engineering role designed for an
  individual who can operate at the intersection of AI, data,
  technology, and the business. Working closely with the
  Bank’s data and technology leadership, this individual will
  help turn strategic objectives into executable solutions,
  building the infrastructure, models, tools, and processes
  necessary to responsibly expand the use of AI and advanced
  analytics across the organization.

  The ideal candidate combines strong technical depth with
  business judgment and a builder’s mindset. They should be
  equally comfortable developing solutions, evaluating new
  technologies, improving data architecture, and partnering
  with business leaders to understand where AI and analytics
  can create meaningful value. In a growing community bank
  environment, success will require someone who is
  resourceful, collaborative, comfortable working across
  functions, and able to move initiatives from concept through
  implementation.

  As CalPrivate Bank continues to grow and invest in its
  technology and data capabilities, the Senior AI Engineer
  will help create the foundation that allows the organization
  to use its information more intelligently and efficiently.
  This role will support the development of scalable AI and
  analytics capabilities while helping the broader team
  successfully execute against its strategic roadmap.

  The Senior AI Engineer will help identify opportunities to
  automate manual processes, improve access to actionable
  information, enhance reporting and forecasting, and
  responsibly incorporate generative AI and machine learning
  into appropriate business workflows. Just as importantly,
  this individual will help establish the technical standards,
  controls, documentation, and governance necessary to ensure
  these capabilities are reliable, secure, explainable, and
  appropriate for a highly regulated banking environment.

  What You’ll Do

  Key Responsibilities

  - Design, develop, test, deploy, and maintain AI, generative
    AI, machine learning, data engineering, and advanced
    analytics solutions that address meaningful business needs
    across the Bank.
  - Partner with data and technology leadership to translate
    strategic AI and analytics objectives into technical
    requirements, development priorities, and executable
    solutions.
  - Build and enhance the Snowflake-centered data pipelines,
    integrations, APIs, and architecture required to support
    analytics, AI applications, and data products.
  - Develop solutions utilizing large language models and
    generative AI, including Snowflake Cortex AI, Cortex
    Search, Cortex Agents, retrieval-augmented generation
    (RAG), enterprise search, intelligent document processing,
    workflow automation, and internal knowledge tools where
    appropriate.
  - Design flexible, modular AI architectures that support the
    evaluation, integration, and substitution of different AI
    models and providers where appropriate, minimizing
    unnecessary vendor dependencies while balancing
    performance, security, cost, and operational complexity.
  - Evaluate emerging AI technologies, platforms, models, and
    vendors and provide thoughtful recommendations based on
    business value, scalability, security, cost, and
    regulatory considerations.
  - Develop prototypes and proofs of concept and successfully
    transition viable solutions into stable, production-ready
    applications, taking ownership through testing,
    deployment, monitoring, and ongoing support.
  - Partner with business teams to identify opportunities where
    AI, automation, or advanced analytics can improve
    efficiency, reduce manual work, enhance decision-making,
    or improve the client and employee experience.
  - Support the continued development of the Bank’s enterprise
    data environment, including data quality, accessibility,
    lineage, integration, and governance.
  - Create reusable frameworks, tools, and engineering standards
    that allow the Bank to expand its AI capabilities
    efficiently rather than developing isolated solutions.
  - Establish appropriate testing, evaluation, monitoring, and
    observability for AI solutions, including quality,
    accuracy, reliability, performance, security, cost, model
    or data drift where applicable, and ongoing effectiveness.
  - Develop and maintain technical documentation and inventory
    records for AI solutions, including models, prompts,
    agents, data sources, integrations, dependencies, and
    controls, ensuring traceability across development,
    testing, deployment, monitoring, and retirement.
  - Work closely with Information Security, Risk, Compliance,
    Legal, and other control functions to ensure AI solutions
    are developed and implemented responsibly and in
    accordance with Bank policies and regulatory expectations.
  - Serve as a senior technical resource to the broader data and
    analytics team, providing guidance, troubleshooting
    complex technical challenges, sharing best practices, and
    helping increase the team’s overall AI and engineering
    capabilities.
  - Help create repeatable development and deployment processes
    that allow the team to execute efficiently against its
    objectives and scale capabilities as the Bank grows.
  - Communicate complex technical concepts clearly to both
    technical and non-technical stakeholders, including senior
    leadership.

  Responsible AI & Banking Environment

  Because AI within financial services must be implemented
  thoughtfully, the Senior AI Engineer will be expected to
  approach development with a strong understanding of data
  privacy, cybersecurity, model risk, third-party risk,
  explainability, access controls, human oversight, and
  regulatory compliance.This individual should understand that
  innovation and responsible governance must develop together.
  The goal is not simply to introduce AI technology, but to
  build sustainable capabilities that employees and leadership
  can trust and that meaningfully support the Bank’s long-term
  strategy.

  AML/CFT/Compliance Responsibilities

  This position includes direct or indirect interaction with
  customers and other employees and therefore includes
  responsibilities relating to BSA/AML. The employee will have
  opportunity to examine and view information and documents
  produced by other employees of the Bank relating to BSA and
  therefore has the obligation to report suspicious activity
  to the BSA Officer as appropriate. The employee is
  responsible for understanding and following the Bank’s
  BSA/AML policies including elevating suspicious activity to
  the BSA Officer. Additionally, the employee is required to
  understand and follow the Bank’s compliance program BSA/AML
  policies including elevating suspicious activity to the BSA
  Officer. Additionally, the employee is required to
  understand and follow the Bank’s compliance program.

  Who You Are

  Experience & Expertise

  - Advanced experience in AI engineering, machine learning
    engineering, data engineering, applied data science, or a
    closely related discipline.
  - Strong proficiency in Python and SQL, with experience
    applying modern software and data engineering practices.
  - Demonstrated experience building and deploying production
    AI, generative AI, data, and analytics applications.
  - Hands-on experience with generative AI technologies, large
    language models, prompt engineering, embeddings, vector
    databases, RAG architectures, AI agents or workflow
    orchestration, and model/API integration.
  - Strong hands-on experience with Snowflake, including data
    engineering, data pipelines, security and access patterns,
    integrations, and building production workloads on the
    platform. Experience with Snowpark, Cortex AI, Cortex
    Search, Cortex Agents, external stages, streams/tasks,
    dynamic tables, or related Snowflake capabilities is
    highly desirable.
  - Hands-on experience integrating data and AI solutions with
    Microsoft Azure, particularly Azure Functions and Azure
    Storage/Blob Storage.
  - Strong understanding of data architecture, ETL/ELT
    pipelines, APIs, relational databases, data
    warehouses/lakehouses, and structured and unstructured
    data.
  - Experience with modern software engineering and DevOps
    practices, including Git/GitHub, branching and pull-
    request workflows, automated testing, CI/CD, environment
    management, code review, and controlled production
    deployment.
  - Ability to assess business problems and determine when AI
    is, and when it is not, the appropriate solution.
  - Strong analytical, problem-solving, and communication skills
    with the ability to operate independently while
    collaborating effectively across teams.
  - Experience working with sensitive or highly regulated data
    is strongly preferred; banking, financial services,
    fintech, or another regulated industry is highly
    desirable.

  Mindset & Values

  - You lead with accountability, integrity, and consistency.
  - You thrive in a collaborative environment where transparency
    and follow-through matter.
  - You model professionalism, calm under pressure, and a
    solutions-oriented mindset.
  - You embrace data-driven decision-making while maintaining a
    client-first perspective.
  - You embody CalPrivate’s culture, heart for client,
    excellence in service, and deep commitment to the Bank and
    its people.

  Physical Demands

  - May require some travel in order to support team, department
    and initiatives.
  - Ability to sit or stand for extended periods of time.
  - Ability to physically use a keyboard/mouse
  - Ability to walk to and from workstations
  - Ability to frequently lift and/or move up to 10lbs and
    occasionally lift and/or move up to 50 pounds.
  - Specific vision abilities required by this job include close
    vision and ability to adjust focus

  Why CalPrivate Bank?

  This isn’t just another bank job. At CalPrivate Bank, you
  will be part of something bigger. Our day-to-day operations
  and projects don’t just impact a balance sheet, they
  influence real people, real businesses, and the communities
  we proudly serve. We are guided by our commitment to
  relationships, solutions, and trust. And we’re building a
  team of people who reflect those values in everything they
  do.

  If you’re looking for a place where your work will matter,
  your ideas will be valued, and your growth will be
  supported, welcome to CalPrivate Bank! Ready to lead with
  purpose?
