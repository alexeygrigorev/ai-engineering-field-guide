title: Global Tech - Software Developer with AI, Manager
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  The Opportunity As a Software Developer with AI, Manager you
  will lead software engineering work that supports digital
  transformation, application development, and product
  innovation within our software and product innovation
  practice. As a Manager you will guide team members, shape
  delivery across multiple work streams, and apply sound
  judgment as you coach others, manage priorities, and bring
  structure to complex technical work. In this role at PwC,
  you will design, code, test, and refine software solutions
  while helping teams deliver reliable applications that
  support client needs and business performance. Within our
  Internal Firm Services practice, this role offers the chance
  to combine technical depth with leadership in a setting that
  values collaboration, accountability, and practical problem
  solving. You will work across emerging AI-enabled solutions,
  support review of deliverables, and help create clarity when
  work spans multiple components and timelines. The role calls
  for an individual who can balance hands-on development with
  mentoring, communicate with stakeholders, and adapt methods
  as technology and business needs shift. Responsibilities
  - Leading software engineering workstreams for client support
    and internal technology initiatives
  - Developing and reviewing application code, design patterns,
    and architecture choices across web, mobile, and
    enterprise platforms
  - Guiding teams through project planning, budgeting, delivery
    timelines, and issue resolution
  - Applying AI fluency to shape software solutions, automation,
    and human centered collaboration in development activities
  - Overseeing code review, testing, debugging, and release
    activities to validate functionality and system stability
  - Translating business requirements into technical
    specifications, functional designs, and development tasks
  - Improving software delivery through CI/CD pipelines, version
    control practices, and application lifecycle management
  - Coaching team members on coding standards, development
    methods, and problem solving approaches
  - Managing client expectations and communicating progress,
    risks, and delivery dependencies across stakeholders
  - Identifying opportunities to strengthen software quality,
    system performance, and product innovation
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Experience leading software development teams delivering AI-
    enabled solutions
  - Familiarity with Python, Java, JavaScript, or cloud
    platforms
  - Background managing project planning, budgeting, and
    milestone tracking
  - Experience mentoring developers through code review and
    coaching
  - Familiarity with CI/CD, testing, and application lifecycle
    management
  - Experience navigating client priorities, technical issues,
    and delivery timelines
  The salary range for this position is: $73,500 - $212,280.
