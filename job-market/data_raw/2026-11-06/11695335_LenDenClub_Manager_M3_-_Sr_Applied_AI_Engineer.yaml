description: |
  About VARTIS Platforms (Formerly known as LenDenClub
  Techserve Pvt. Ltd.)

  At VARTIS Platforms, we are a corporate group on a mission
  to democratize credit access and empower millions of people
  through cutting-edge technology. We focus on building trust
  and convenience, leveraging AI to drive the information
  revolution for smarter risk management and operational
  efficiency. VARTIS Platforms is profitable, rapidly scaling,
  and industry-recognised. Our impact has been acknowledged
  with top honours, including being awarded as the Best
  Fintech Provider by Financial Express, a testament to our
  product excellence, customer experience, and leadership in
  regulated financial technology.

  Our portfolio includes:

  LenDenClub: An RBI-licensed P2P marketplace that connects
  borrowers with lenders in a seamless digital ecosystem.

  InstaMoney: Instant digital loans that enable quick, secure,
  and accessible financial support.

  NiveshGold: India’s next-gen digital vault for wealth
  preservation, starting with 100% pure, insured 24K digital
  gold.

  UdharSaathi: A structured working capital platform built
  exclusively for QR active kirana stores, pharmacies, and
  small retailers.

  Role Overview:

  We are looking for a Senior Applied AI Engineer to set
  technical direction for our applied AI work while staying
  deeply hands-on. This role offers the opportunity to work in
  a fast-paced fintech environment, where you will own the
  path from research to production across multiple AI systems.

  Must-Have Skills

  - 6–8 years as an AI/ML Engineer, with sustained hands-on
    depth in computer vision or transformer-based models this
    is a building role, not an oversight one.
  - Has taken multiple models from research to production and
    owned them post-launch through retraining, regressions,
    and incidents.
  - Strong technical judgement on build vs. buy, fine-tune vs.
    prompt vs. classical ML able to defend the choice on cost,
    latency, and accuracy.
  - Depth in either vision (classification, detection,
    segmentation, video, ViT/VLM) or language (LLM fine-
    tuning, embeddings, task adaptation), with the ability to
    design evaluation frameworks and data strategy around it.
  - Proven ability to mentor engineers and turn ambiguous
    business problems into scoped, sequenced roadmaps.

  Preferred / Future-Ready Skills

  - Fintech AI depth  KYC, fraud, risk, or document intelligence
    at scale.
  - Experience scaling GPU training and inference infrastructure
    with cost control.
  - Exposure to model governance and explainability in a
    regulated environment.
