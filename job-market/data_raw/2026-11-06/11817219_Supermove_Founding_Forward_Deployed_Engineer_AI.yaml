description: |
  About Supermove

  Supermove builds software and AI for moving companies. We've
  raised $30M from Andreessen Horowitz (a16z) and other
  investors. We started in 2019 as the system that runs a
  moving business: sales, operations, crews, billing. Today
  that system runs moving companies across the US, Canada and
  Australia, from single-location movers to some of the
  largest van lines and franchise systems in North America.

  Now we're putting AI to work on top of it. Our voice agents
  answer and call leads, book moves, and hand off to a person
  at the right moment. Autopilot, our agent platform, goes
  further. It answers questions about the business in plain
  language, flags what needs attention, and handles work that
  used to take a person's whole day, from working the inbox to
  updating jobs.

  The role

  We're hiring a Founding Forward Deployed Engineer to help
  build and lead our Forward Deployed Engineering function
  alongside Supermove's founders.

  Our largest customers operate hundreds of locations, with
  thousands of employees, complex workflows, and multiple
  systems that need to work together. Getting AI to work
  reliably inside these businesses is a hard engineering
  problem. That's where you come in.

  You'll work directly with our largest customers to
  understand how their businesses operate, build and deploy AI
  solutions, and make sure they deliver real results. This
  isn't a role where you hand requirements to engineering and
  wait for someone else to build them. You'll write production
  code, improve our AI agents, build integrations, and solve
  technical problems yourself.

  You'll also work closely with our product and engineering
  teams to turn what you learn in the field into improvements
  to the core platform. The goal isn't to build a different
  solution for every customer. It's to figure out what works,
  make it reusable, and help us scale it.

  As one of our first Forward Deployed Engineers, you'll work
  directly alongside the founders to define how this function
  operates, from the technical tools and deployment processes
  to how we hire and develop the team over time.

  What you'll do

  - Build and lead the FDE function. Work alongside the founders
    to establish the engineering practices, tooling, and
    processes for deploying AI at enterprise scale. Help shape
    and grow the team as we expand.
  - Ship production code. Build and improve AI agents,
    integrations, and core product capabilities. Work directly
    in our codebase to solve customer problems and improve the
    platform.
  - Lead technical deployments for major accounts. Own the
    technical execution from discovery and solution design
    through implementation, testing, go-live, and ongoing
    improvement. Work across engineering, product, and
    customer teams to get things done.
  - Design AI solutions for real operations. Understand how a
    customer works and determine how our Voice Agents and
    Autopilot should fit into their business, including where
    AI can take action and where people need to stay involved.
  - Make AI agents work reliably. Review calls and agent
    sessions, investigate failures, improve prompts and
    workflows, fix underlying code, and measure performance in
    production.
  - Turn customer problems into product improvements. Identify
    patterns across deployments and build reusable
    capabilities rather than one-off solutions. Help shape the
    technical roadmap based on what customers actually need.
  - Deliver measurable results. Make sure what you build works
    in production and creates real value for customers. Use
    data to understand performance, identify problems, and
    demonstrate impact.

  What we're looking for

  - 4+ years of software engineering experience, with a track
    record of building and shipping production systems.
  - Strong full-stack or backend engineering skills. You're
    comfortable working across APIs, databases, integrations,
    and complex application logic.
  - Experience building with LLMs, AI agents, or AI-powered
    workflows. You understand the challenges of making
    probabilistic systems work reliably in production.
  - You've owned technically complex projects end to end, from
    understanding the problem and designing a solution to
    writing code, deploying it, and making sure it works.
  - You're comfortable working directly with customers. You can
    explain technical tradeoffs to a CEO or COO and work with
    frontline operators to understand how their business
    actually runs.
  - You can lead without needing a large team or formal
    authority. You're comfortable coordinating engineers and
    other stakeholders, making decisions, and driving work
    forward.
  - You thrive in ambiguity. You don't need a perfectly defined
    spec to get started, and you're willing to dig into
    unfamiliar systems to figure out how things work.
  - You use AI seriously in your own work and are constantly
    experimenting with new tools and approaches to build
    faster and better.
  - Moving, logistics, or field-services experience is a plus.
    We'll teach you the industry.

  Why this role matters

  We're at the beginning of bringing AI into some of the
  largest moving companies in North America. These businesses
  have complicated operations, and making AI work inside them
  requires more than building a good model or a polished demo.

  You'll be one of the first engineers responsible for
  bridging that gap. You'll work directly with customers,
  build production AI systems, and help determine how we turn
  successful deployments into a scalable product.

  You'll also work alongside Supermove's founders to build a
  new engineering function from the ground up, with
  significant influence over its technical direction, how it
  operates, and the team we build around it.

  You'll have the opportunity to build the product, lead real-
  world deployments, and help shape the engineering team that
  brings AI into an entire industry.

  Process

  Intro call → technical interview → practical engineering
  exercise → founder interview.
