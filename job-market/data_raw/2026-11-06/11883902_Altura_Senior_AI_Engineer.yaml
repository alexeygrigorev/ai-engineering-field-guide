description: |
  We’re Altura, an ambitious SaaS startup, and we just raised
  our Series A!

  At Altura, we’re making it easier for organisations to win
  complex deals (tenders and RfPs). With our AI-powered
  platform, we simplify bid management by turning it into a
  smooth, strategic process. We connect workflows, automate
  tasks, and make knowledge accessible, so teams can work more
  efficiently and effectively.

  But we’re not stopping there.

  We’re building the first AI-powered Agentic Virtual
  Bidmanagement Assistant, designed to automate the entire bid
  lifecycle. With fresh funding, big ambitions, and a fast-
  growing team, we’re just getting started.

  If you value innovation, enjoy working collaboratively, and
  want to make a real impact, we’d love to have you on board.

  Let’s work together!

  The opportunity Europe’s governments spend €2 trillion a
  year through 700,000+ public tenders, and in the private
  sector, RFPs account for roughly 40% of B2B enterprise
  revenue, with the average bid team defending nine figures in
  annual revenue across ~150 responses a year. The companies
  competing for that money still run their bid process
  manually, over email, and without automation built on
  institutional knowledge. We’re building the AI bid
  management category that changes that. The time for growth
  is now. We have recently rebuilt our entire product from
  scratch and revamped our GTM process, both of which are now
  fully AI-native.

  About the Team:

  We're a high-performing, innovative Engineering team. Our
  goal is to build a world class culture and are well under
  way. We apply the latest AI technologies and tools for
  software development, like spec-driven development (using
  Speckit), but avoid falling into the trap of vibe coding. We
  hold ourselves to the highest standards of software
  engineering and everyone is expected to understand the code
  written by the AI tools we drive. We foster a culture of
  experimentation, and open communication.

  What sets us apart: engineers own their projects end-to-end:
  frontend, backend, infrastructure and monitoring. You make
  the architectural decisions, write the specs, ship the work
  and monitor performance and usage. When you need help, you
  rely on your peers for collaboration, solution
  brainstorming, and expertise whenever you need it

  If you love building software in the agentic way, working on
  high-performing teams, and having a significant impact on
  the business, you'll feel right at home at Altura.

  TL;DR

  Altura is building the first agentic AI Virtual Bid
  Manager—a system that automates the entire bid lifecycle—and
  creating the Knowledge Center that turns bid data into
  actionable insights for organisations to make smarter, data-
  driven decisions.

  As a Senior AI Engineer, you’ll join a high-caliber team
  building the agentic layer that powers Altura’s next
  evolution. This is not a “plug prompts into an API” role.
  You’ll design and ship real agentic workflows: context-
  aware, production-grade systems that sit on top of our
  proprietary data graph and become a core technical moat.

  You’ll work in a small, fast-moving team with full freedom
  to experiment: Claude Code, Cursor, Copilot, and new models
  the day they drop. If something advances the state of the
  art, we’re using it.

  You’ll drive high-impact AI initiatives end-to-end:

  - From discovery and greenfield prototyping
  - To model evaluation and multi-model strategy
  - To production rollout, observability, and continuous
    improvement

  Beyond product capabilities, you’ll help shape foundational
  AI platform components: context engineering, agent
  orchestration, evaluation frameworks, tone monitoring, and
  online observability.

  No corporate red tape. No endless committees. Just
  ownership, speed, and real technical influence.

  You’ll ship AI that is:

  - Reliable in production
  - Scalable across customers
  - Measurable in impact
  - Cost-aware by design

  And you’ll help define what “great AI engineering” looks
  like inside a Series A company operating at the leading
  edge.



  Our Tech Stack

  AI: Python

  Frontend: Vue.js and Nuxt.js

  Backend: C# - ASP.NET

  Infrastructure: Azure, GitHub, Linear

  What you’ll do (responsibilities)

  - Design and Deliver an agentic layer and a rich context graph
    that delivers automation of work with deep integration in
    our customers knowledge repositories.
  - Drive architecture & delivery of production LLM/GenAI
    systems (context engineering, agentic workflows, model
    evaluations, multi-model strategies).
  - Define and implement evaluation: offline + online metrics,
    gold sets, regression tests, human review loops, and A/B
    experiments.
  - Operationalize LLMOps: deployment patterns, observability,
    monitoring, incident response, and performance/cost
    optimization (latency, throughput, token spend).
  - Build guardrails & security: prompt-injection defenses,
    data-exfiltration prevention, permissions for
    tools/actions, and safe handling of sensitive data.
  - Establish engineering standards: reference implementations,
    reusable libraries, review practices, and documentation
    that accelerates teams.
  - Mentor and influence: coach engineers, raise the bar on
    system design and code quality, and align multiple teams
    on outcomes and timelines.

  What we’re looking for (minimum qualifications)

  - Extensive experience in AI/ML software engineering (or
    equivalent), with multiple production AI/ML launches.
  - Strong software engineering fundamentals (system design,
    testing, reliability, code review, APIs).
  - Proven experience with LLM application patterns (e.g.,
    context engineering, output quality, embeddings/vector
    search, prompt design, structured outputs).
  - Hands-on experience building evaluation + monitoring for
    model/system quality in production.
  - Comfort operating in cloud environments (Azure), containers,
    CI/CD, and modern observability.
  - Excellent cross-functional communication: you can translate
    ambiguity into plans, tradeoffs, and shipped outcomes.

  Nice to have

  - Experience optimizing inference (caching, batching, routing,
    quantization) or serving open-source models.
  - Experience building internal AI platforms (evaluation
    harnesses, prompt/version management).

  What success looks like in 90–180 days

  - Delivery of AI native capabilities in our platform, aligned
    with product goals and risk constraints.
  - A repeatable evaluation + release process that prevents
    regressions and supports fast iteration.
  - AI capabilities shipped with monitoring, guardrails, and
    measurable business impact.

  Interview process

  - Recruiter screen (30 min)
  - Meet the team + system design (60 min)
  - Practical exercise or pairing (90 min)
    - Fully agentic coding session
  - Final conversation
  - Offer

  We offer:

  - Work - Build the future of SaaS at a moment when the way
    software gets made, sold, and used is being rewritten.
    We're an AI-built scaleup moving with it, still figuring
    out what world-class looks like — and there's real room
    here to do the most meaningful work of your career 🦾
  - Time - 40 hours per week ⏱️
  - Compensation - Competitive salary and Virtual Stock Units
    (VSUs) 💸
  - Free - 26 vacation days 🏖️
  - Tech - All the tools and tech stack you want 🛠️
  - Ownership - Take the lead on your work with the autonomy and
    trust to make calls without waiting for permission, drive
    real impact, and help shape where Altura goes next 🚀
  - Culture - A flat, direct, feedback-rich team that values
    judgment over hierarchy and outcomes over hours. We give
    feedback openly, skip the red tape, and trust each other
    to act like owners 🤝
  - Fun - Speed at the go-kart track or bowl your colleagues out
    during our company outings 🏎️
  - Development - Grow your skills with a budget you can unlock
    by presenting a case to leadership tied to our OKRs💡
  - Laptop 💻
  - Hybrid working model - 2 days/week in our beautiful
    Amsterdam office 🏫
