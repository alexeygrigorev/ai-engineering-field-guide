description: |
  Requisition Number: 2354541 Optum is a global organization
  that delivers care, aided by technology, to help millions of
  people live healthier lives. The work you do with our team
  will directly improve health outcomes by connecting people
  with the care, pharmacy benefits, data and resources they
  need to feel their best. Here, you will find a culture
  guided by inclusion, talented peers, comprehensive benefits
  and career development opportunities. Come make an impact on
  the communities we serve as you help us advance health
  optimization on a global scale. Join us to start Caring.
  Connecting. Growing together. AI/ML Engineers code and
  develop software that deploys ML models and algorithms into
  production. Communicate and present complex analytics
  results and concepts to leadership and internal
  stakeholders. Employ AI and/or ML that may include natural
  language processing (NLP), natural language understanding
  (NLU), semantic understanding, intent classification,
  computer vision, deep learning, and automatic speech
  recognition (ASR).Applies deep learning technologies to give
  computers the capability to visualize, learn and respond to
  complex situations. May adapt machine learning to areas such
  as artificial intelligence, robotics and other products that
  allow users to have an interactive experience. Work with
  large scale computing frameworks, data analysis systems.
  Employees in this role are expected to apply knowledge of
  experimental methodologies, statistics, optimization,
  probability theory and machine learning using code for tool
  building, statistical analysis, using both general purpose
  software and statistical languages. Generally work is self-
  directed and not prescribed. Primary Responsibilities:

  - Works with less structured, more complex issues
  - Serves as a resource to others

  Comply with the terms and conditions of the employment
  contract, company policies and procedures, and any and all
  directives (such as, but not limited to, transfer and/or re-
  assignment to different work locations, change in teams
  and/or work shifts, policies in regard to flexibility of
  work benefits and/or work environment, alternative work
  arrangements, and other decisions that may arise due to the
  changing business environment). The Company may adopt, vary
  or rescind these policies and directives in its absolute
  discretion and without any limitation (implied or otherwise)
  on its ability to do so  Required Qualifications:

  - Undergraduate degree or equivalent experience
  - 3+ years of experience working with Natural Language
    processing
  - 3+ years of experience with Deploying and manage ML models
    on cloud platforms such as Microsoft Azure, AWS, Google
    Cloud Platform (GCP)
  - 3+ years of experience leveraging cloud-native tools like
    Azure Machine Learning, AWS SageMaker, GCP AI Platform for
    model training, deployment, and monitoring
  - 2+ years of experience working with Retrieval-Augmented
    Generation

  Preferred Qualifications:

  - 8+ years of AI/ML Engineering experience
  - Experience with Optical Character Recognition (OCR) for
    document digitization and data extraction
  - Experience with Intelligent document processing
  - Experience working in accordance with Dev/Sec/Ops
    principles, and familiarity with industry deployment best
    practices using CI/CD tools, MLOps, LLMOps and
    infrastructure as code (Jenkins, Docker, Kubernetes, Git
    etc.)
  - Deep experience with additional server-side frameworks and
    technologies such as FastAPI, Node.js, Flask, Django etc.
  - Expert knowledge of Python/SQL and AI/ML libraries
    (tensorflow/PyTorch/SciKit/Seaborn etc.) Familiarity with
    telephony systems, including voice processing, speech
    recognition, and platform integration
  - Proven track record of shipping and maintaining production,
    enterprise scale AI applications and data science products
  - Proven solid computer science fundaments in data structures,
    algorithms, automated testing, object-oriented
    programming, performance complexity, and implications of
    computer architecture on software performance

