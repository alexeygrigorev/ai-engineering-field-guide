description: |
  We are seeking a hands-on AI Engineer to design, build, and
  deploy production-grade agentic workflows and intelligent AI
  solutions. In this role, you will bridge modern open-source
  agent frameworks with enterprise AI ecosystems to create
  scalable, stateful AI systems.

  Key Responsibilities

  · Agentic Architecture: Design and implement stateful,
  multi-agent orchestrations using LangGraph to handle complex
  reasoning, task decomposition, and dynamic control flows.

  · Enterprise Copilot Integration: Build, customize, and
  maintain low-code/pro-code AI assistants using Microsoft
  Copilot Studio, integrating them seamlessly with business
  systems and APIs.

  · Python Engineering: Write production-ready, clean Python
  code to build robust backend pipelines, integration layer
  endpoints, and custom tool extensions for LLMs.

  · System Optimization: Fine-tune system prompts, optimize
  context windows, and manage memory/state management for high
  reliability and low latency.

  Must-Have Qualifications

  · Advanced Python: 3+ years of professional backend software
  development experience in Python (AsyncIO, FastAPI/Flask,
  Pydantic).

  · LangGraph Expertise: Hands-on experience building cyclic
  agentic graphs, state management, human-in-the-loop
  workflows, and multi-agent coordination with LangGraph.

  · Copilot Studio Mastery: Demonstrated experience
  configuring, extending, and deploying agents in Microsoft
  Copilot Studio (including Power Platform connectors, Azure
  OpenAI integrations, and topic management).

  · Experience integrating REST APIs, vector databases, and
  enterprise data sources into LLM workflows.

  Nice-to-Haves

  · Experience with Azure AI Services or Microsoft 365
  ecosystem integrations.

  · Familiarity with evaluation frameworks (LangSmith,
  DeepEval) and CI/CD pipelines for AI applications.

  · AI & Automation: Developing Generative AI applications,
  custom deep learning models, Agentic Mesh architectures, and
  RAG/GraphRAG solutions.

  · Digital Product Engineering: Building scalable custom
  applications, mobile platforms, and modern data
  architectures using modern, LEAN MVP approaches.

  · Enterprise Service Management: Optimizing cloud
  infrastructure (CloudOps, ITOM, ITSM) and implementing major
  platforms like SAP, Salesforce, and ServiceNow.



  What We Offer

  - Opportunity to lead the technical direction of
       cutting-edge enterprise AI frameworks and agentic
  architectures.



  - A collaborative, engineering-first culture
       focused on high-impact problem solving.



  - Competitive compensation package and flexible
       work arrangements.



  About Algoleap



  Algoleap (www.algoleap.com) is a digital product engineering
  and AI services firm headquartered in Hyderabad, India, with
  global hubs in the United States, Germany, Bulgaria and the
  Netherlands.



  Founded in 2017, the company specializes in cloud-native
  product engineering, AI-driven business transformation, and
  enterprise digital solutions. Algoleap is 850+ employees
  globally and serving close to 30 global 2000 clients.

  Core Offerings & Focus Areas



  - AI & Automation: Developing Generative AI
       applications, custom deep learning models, Agentic Mesh
  architectures, and RAG/GraphRAG solutions.



  - Digital Product Engineering: Building scalable custom
       applications, mobile platforms, and modern data
  architectures using modern, LEAN MVP approaches.



  - Enterprise Service Management: Optimizing cloud
       infrastructure (CloudOps, ITOM, ITSM) and implementing
  major platforms like SAP, Salesforce, and ServiceNow.



  - Algoleap Studios: Specialized innovation
       labs focused on advanced enterprise tech, bespoke
  digital operating frameworks (e.g., Algo-OS), and AI
  accelerator blueprints.

