description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the Life

  Medtronic Digital Technologies is creating ambitious new
  products that bring connectivity, real-time guidance, and
  decision support to the operating room. To support this
  mission, we are developing compact, high-performance,
  embedded systems that enable edge computing and
  connectivity. Working closely with other teams across
  Medtronic, we are creating a connected ecosystem and
  leveraging the state of the art in computer vision to
  provide the most comprehensive view of surgery. If you’re
  interested in using cutting-edge technology to improve the
  standard of care in surgery on a global scale, this could be
  the place for you.

  As a Senior Artificial Intelligence Engineer, focused on
  algorithm optimization, you will help to design, implement,
  and optimize Machine Learning models to achieve low latency
  on edge and cloud devices. You will become part of a
  talented team exploring new concepts through fast iterative
  prototyping. You will collaborate as an AI optimization
  expert with our other machine learning engineers, platform
  engineers, embedded software engineers and research experts
  of the team.

  Primary Responsibilities:

  - Designing, benchmarking, and optimizing deep learning models
    for computer vision and video understanding.
  - Improving existing model architectures and inference
    pipelines to reduce latency, increase throughput, and
    maintain or improve accuracy across target platforms.
  - Developing and productionizing end-to-end video processing
    pipelines for surgical video analysis in cloud and/or edge
    environments.
  - Working on problems involving temporal reasoning, motion
    understanding, and multi-frame video analysis.
  - Delivering well-written, high-quality, and maintainable
    code.
  - Sharing results and technical findings during regular team
    meetings.
  - Staying current with advances in computer vision, video
    learning, and model optimization, and contributing new
    ideas

  Required Qualifications:

  - Master’s or PhD in Computer Science, Mathematics, Computer
    Vision, Machine Learning, or a related field.
  - Strong hands-on experience designing, training, and
    evaluating deep learning models for computer vision using
    PyTorch.
  - Experience with video-based machine learning problems such
    as video classification, action recognition, tracking,
    temporal modeling, or multi-frame reasoning.
  - Strong understanding of model optimization techniques such
    as pruning, quantization, sparsity, knowledge
    distillation, or architecture-level efficiency
    improvements.
  - Strong understanding of AI optimization tools, such as
    TensorRT.
  - Strong programming skills in Python and experience with
    relevant numerical and machine learning libraries such as
    NumPy, scikit-learn, and OpenCV.
  - Ability to analyze performance bottlenecks and optimize
    systems across model, software, and hardware layers.

  Preferred Qualifications:

  - Experience with AWS cloud services and containerized
    deployment workflows, including Docker, EKS, and ECS.
  - Experience with data visualization for model evaluation,
    performance analysis, and communication of results.
  - Strong communication skills, with the ability to collaborate
    effectively with engineers, clinicians, business
    stakeholders, and cross-functional partners.
  - Experience working on video processing or other performance-
    sensitive, real-time, or high-performance applications.
  - Experience in medical imaging, surgical video, or other
    safety- or quality-critical AI applications.
  - Track record of scientific publications, patents, or
    conference contributions in computer vision, machine
    learning, video understanding, or related fields.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

