description: |
  AI/ML Engineer

  Summary

  We are seeking a skilled AI/ML Engineer to drive the
  development and implementation of advanced machine learning
  solutions within our IT Services sector. In this pivotal
  role, you will bridge the gap between complex data insights
  and actionable business outcomes by designing, deploying,
  and refining sophisticated models. Your expertise will be
  essential in optimizing system performance, ensuring data
  integrity, and fostering collaboration across diverse teams
  to solve critical challenges using cutting-edge artificial
  intelligence technologies.

  Responsibilities

  - Architect and deploy scalable machine learning models while
    continuously optimizing their efficiency and accuracy.
  - Conduct comprehensive data analysis to extract meaningful
    patterns and inform strategic decision-making processes.
  - Establish robust frameworks for monitoring model performance
    in production environments to ensure reliability.
  - Collaborate closely with cross-functional teams, including
    product managers and software engineers, to integrate AI
    capabilities into broader business solutions.
  - Apply advanced problem-solving techniques to address
    technical hurdles and improve system architecture.
  - Utilize deep learning methodologies to develop innovative
    solutions for complex, unstructured data challenges.
  - Leverage Python programming to build, test, and maintain
    high-quality codebases for machine learning pipelines.

  Requirements

  Requirements:

  - Proven work experience of 4 to 7 years in developing and
    deploying AI/ML solutions.
  - Proficiency in Python programming with a strong foundation
    in data science libraries.
  - Hands-on expertise in Deep Learning (DL) and Machine
    Learning (ML) frameworks and algorithms.
  - Demonstrated ability in model deployment, optimization, and
    lifecycle management.
  - Strong analytical skills with a track record of performing
    in-depth data analysis.
  - Experience in setting up and managing model performance
    monitoring systems.
  - Excellent cross-functional collaboration skills with a
    proactive problem-solving mindset.
  - Competitive salary range of ₹13-17 LPA commensurate with
    experience and expertise.
