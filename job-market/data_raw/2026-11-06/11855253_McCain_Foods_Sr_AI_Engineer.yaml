  About the role. We are seeking an elite, hands-on Sr. AI
  Engineer to serve as a foundational technical authority
  across McCain's AI ecosystem. This is a senior Individual
  Contributor (IC) role designed for a world-class
  technologist who thrives on solving complex engineering
  challenges, building scalable AI platforms, and delivering
  production-grade solutions. As a technical leader without
  people management responsibilities, you will focus on
  architecting and developing reusable AI capabilities,
  advancing Generative AI platforms, optimizing model serving
  and inference performance, and accelerating the journey from
  experimental research to enterprise-scale deployment. You
  will play a critical role in shaping McCain's AI engineering
  standards, infrastructure, and technical direction while
  mentoring engineering teams through deep technical expertise
  and architectural guidance. What you'll be doing.

  - Lead the hands-on architecture, design, and development of
    reusable foundational AI capabilities, including
    pretrained model pipelines, multimodal workflows, and
    advanced retrieval-augmented generation (RAG)
    architectures.
  - Design, build, and optimize enterprise-grade agentic and
    multi-agent systems using modern AI orchestration
    frameworks and tools.
  - Drive integration standards for AI applications through
    Model Context Protocol (MCP), external tools, model
    routing frameworks, and enterprise data systems.
  - Transform research prototypes and proof-of-concepts into
    scalable, secure, reproducible, and production-ready AI
    applications.
  - Optimize model inference infrastructure through quantization
    strategies, runtime tuning, memory optimization, dynamic
    batching, and efficient serving architectures.
  - Design and support distributed AI workloads across
    Kubernetes-based environments and GPU-enabled
    infrastructure.
  - Implement observability, monitoring, context management,
    caching strategies, and performance guardrails that
    enhance system reliability and user experience.
  - Establish and enforce engineering best practices for code
    quality, automated testing, security compliance, and
    production readiness.
  - Conduct deep technical design and code reviews, providing
    architectural guidance and validating technical trade-offs
    before deployment.
  - Mentor software engineers, machine learning engineers, and
    technical teams through thought leadership and AI
    engineering best practices.

  What you'll need to be successful.

  - Bachelor's, Master's, or PhD in Computer Science, Machine
    Learning, Electrical Engineering, Applied Mathematics, or
    a related quantitative discipline.
  - 10-15 years of hands-on experience in software engineering,
    systems architecture, distributed systems, or enterprise
    backend development.
  - 5+ years of experience developing, deploying, and operating
    production machine learning systems, with significant
    recent experience in Generative AI technologies.
  - Demonstrated success serving as a technical lead, architect,
    or principal engineer for high-scale, highly available
    enterprise platforms.
  - Expert-level proficiency in Python and modern software
    engineering patterns, including concurrency, distributed
    computing, performance tuning, and system optimization.
  - Deep expertise with Kubernetes, containerized workloads,
    distributed systems, and GPU infrastructure management
    across enterprise environments.
  - Hands-on experience deploying and optimizing model serving
    platforms such as Triton Inference Server, vLLM, TGI, or
    similar inference technologies.
  - Advanced experience with AI orchestration frameworks
    including LangChain, LangGraph, LlamaIndex, AutoGen, or
    related technologies.
  - Strong understanding of MLOps tooling, experiment tracking,
    model registries, and lifecycle management solutions such
    as MLflow and Weights & Biases.
  - Experience implementing AI solutions across text, image,
    video, speech, audio, or multimodal domains is considered
    an asset.
  - Proven ability to communicate complex technical decisions,
    performance trade-offs, and architectural recommendations
    to both technical and business stakeholders.
  - Strong execution mindset with a focus on operational
    excellence, scalability, performance, and business impact.

  About the team. The AI Engineering team is responsible for
  building and scaling enterprise AI capabilities that enable
  innovation across McCain's business functions. As a
  Principal AI Engineer, you will serve as a senior technical
  leader and trusted advisor across engineering teams,
  partnering closely with AI engineers, software developers,
  platform engineers, infrastructure teams, data
  professionals, and business stakeholders. This role is
  positioned at the center of McCain's AI technology strategy,
  helping establish technical standards, accelerate delivery,
  and ensure that advanced AI capabilities are built with
  reliability, scalability, security, and long-term value in
