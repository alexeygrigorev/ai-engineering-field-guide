description: |
  Job Summary:

  As a Senior Associate - Forward Deployed AI Engineer, you
  will translate regulatory and operational needs into
  practical, technology-enabled solutions. You will work as an
  intersection of business, data, technology, and AI, and your
  role combines stakeholder engagement, business analysis,
  solution design, rapid prototyping, and hands-on delivery.
  You will independently deliver defined use cases, work
  closely with business and technology partners, and apply the
  appropriate combination of process improvements, data,
  analytics, automation, and AI to improve outcomes across
  Compliance and Risk functions.

  Job Responsibilities:

  - Partner with Compliance, Risk, and Operations stakeholders
    to understand business processes, pain points, regulatory
    requirements, and desired outcomes.
  - Conduct business and data analysis, document requirements,
    define use cases, and map current- and future-state
    processes.
  - Assess solution options and recommend an appropriate
    combination of process improvements, data, analytics,
    automation, and AI capabilities.
  - Design, prototype, test, and validate technology-enabled
    solutions, including copilots, agents, workflow
    automation, knowledge assistants, and decision-support
    tools.
  - Translate business requirements into solution designs, user
    stories, acceptance criteria, and implementation plans.
  - Work with Technology, Data, Architecture, and Control
    partners to integrate and implement solutions within
    enterprise standards.
  - Support demonstrations, user testing, training, feedback
    collection, and adoption activities.
  - Contribute to defining success metrics and evaluating
    solution performance against business objectives.
  - Ensure deliverables align with applicable regulatory,
    governance, privacy, and risk management requirements.

  Required Qualifications, Capabilities and Skills:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, Information Systems, Business Analytics, Data
    Science, or a related field.
  - 5+ years of experience delivering business, technology,
    analytics, automation, or AI-enabled solutions.
  - Strong business analysis skills, including stakeholder
    interviews, requirements elicitation, use-case definition,
    process mapping, and solution design.
  - Strong data analysis, process improvement, business process
    reengineering, and problem-solving capabilities.
  - Experience independently designing, prototyping, validating,
    and delivering solutions in partnership with end users.
  - Experience with Large Language Models, Generative AI, prompt
    engineering, Retrieval-Augmented Generation, AI agents,
    and enterprise AI platforms.
  - Familiarity with Knowledge Graph concepts and graph-based
    approaches to connecting information and business context.
  - Strong stakeholder management, consulting, communication,
    and presentation skills across technical and non-technical
    audiences.
  - Ability to manage assigned workstreams from requirements
    through implementation while coordinating across business
    and technology partners.

  Preferred Qualifications, Capabilities and Skills:

  - Experience within Compliance, Risk Management, Financial
    Crime, Regulatory Reporting, Surveillance, Controls,
    Audit, or related domains.
  - Experience delivering AI copilots, knowledge assistants,
    workflow automation, or decision-support solutions.
  - Experience working in large, highly regulated organizations.
  - Familiarity with Agile delivery methodologies and product-
    oriented operating models.
  - Experience supporting organizational change and adoption of
    new technologies.

