  status, sex, gender, gender identity, gender expression,
  pregnancy, childbirth and breastfeeding, age, sexual
  orientation, military or veteran status, or any other
  protected classification, in accordance with applicable
  federal, state, and local laws. EOE, including
  disability/vets.

  Our Benefits: Snap Inc. is its own community, so we’ve got
  your back! We do our best to make sure you and your loved
  ones have everything you need to be happy and healthy, on
  your own terms. Our benefits are built around your needs and
  include paid parental leave, comprehensive medical coverage,
  emotional and mental health support programs, and
  compensation packages that let you share in Snap’s long-term
  success!
