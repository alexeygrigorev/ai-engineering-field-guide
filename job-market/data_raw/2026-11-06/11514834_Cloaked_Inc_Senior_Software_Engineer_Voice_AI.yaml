description: |
  Cloaked is building a cyber expert at your side - one that
  watches, advises, and acts to keep you safe and private in
  the age of AI. 600k+ paying members already use Cloaked to
  take back control of their data, their identity, and who can
  reach them: masked emails, phone numbers, and payment cards,
  data removal from broker sites, and an AI voice agent that
  screens calls before they ring through.

  We've protected 10M+ identities, screened 50M+ calls, and
  removed 1B+ records from the data brokers who profit off
  personal information. Backed by a $375M Series B, we're now
  building the agents that turn detection into action - for
  individuals, families, and the companies that want to
  protect their people.

  About the Role

  We're looking for a Senior Software Engineer to join the
  Call Guard team and help build the next generation of our
  real-time voice AI. You'll own major parts of the stack,
  from voice agent design and conversational latency to
  adversarial robustness and the infrastructure underneath. As
  Cloaked grows, you'll have room to contribute to how we
  build AI-native consumer products across engineering.

  Call Guard is Cloaked's AI call screening product. It
  intercepts unknown callers, holds a real-time AI
  conversation with them, and only rings the user through if
  the call is legit. Spam, scams, and voice-cloned callers get
  stopped before they reach your phone. We've screened 50M+
  calls to date.

  What will you do?

  - Design and ship production voice agents that talk with
    unknown callers, classify intent, and block scams
    autonomously
  - Own key components of Call Guard's real-time voice AI stack
    and contribute to its architecture and technical direction
  - Drive down end-to-end conversational latency across STT,
    agent reasoning, and TTS
  - Build defenses against adversarial AI callers, including
    voice-cloning attacks targeting our users
  - Evaluate and integrate frontier models (LLMs, speech models,
    agent frameworks) for production use
  - Build and maintain telephony, VoIP routing, and the cloud
    infrastructure the voice agent runs on
  - Partner with product, design, and mobile to ship voice
    experiences that feel effortless
  - Raise the team's bar on quality through code reviews, design
    discussions, and knowledge sharing
  - Use AI tools daily to move faster

  What skills and experiences will help you?

  - 5+ years building production software, ideally real-time or
    distributed systems
  - Hands-on experience shipping voice or conversational AI
    products in production
  - Fluency with modern voice AI stacks: STT (Whisper,
    Deepgram), TTS (ElevenLabs, Cartesia), and real-time
    orchestration (LiveKit, Pipecat, or similar)
  - Production experience with LLMs and agent frameworks
    (LangChain, LangGraph, LlamaIndex, or equivalents)
  - Experience optimizing for low latency in real-time systems
  - Strong Python and/or Go, with experience building scalable,
    secure backend systems and APIs
  - Solid cloud infrastructure experience (AWS or GCP,
    containerized deployments)
  - Experience shipping consumer products at scale
  - Daily use of AI coding tools (Cursor, Claude, Codex) with
    good judgment on when and how to use them

  What's nice to have?

  - Telephony, VoIP, SIP, or carrier-level call routing
    experience
  - WebRTC or real-time media infrastructure experience
  - Background in speech recognition, signal processing, or
    audio engineering
  - Familiarity with adversarial ML, AI safety, or anti-fraud
    systems
  - Experience handling PII and sensitive data
  - Prior work on consumer privacy or security products

  What do we like?

  - Passion for security, privacy, and internet ethics
  - Curiosity about the frontier of voice AI and applied ML
  - Strong ownership and a bias to act
  - Strong analytical and problem-solving skills
  - Thrives on a high-velocity team and enjoys learning from and
    teaching others
  - Startup or growth-stage experience

  What we offer

  Cloaked is a well-funded Series B startup based out of NYC.
  Although we are a distributed team, the NYC team operates
  with a hybrid model. We have two floors of our building,
  with two state of the art kitchens packed with drinks,
  snacks and everything else you'd need to get through the
  day. The Cloaked team has diverse interests and so we
  frequently embark on team outings and go out for socials!



  Compensation and Benefits

  We offer above market rate pay and equity based off of the
  market's best commercially available data. Your compensation
  will be a combination of salary, bonus and equity. For full-
  time US employees, we offer a comprehensive benefits
  package: medical, dental and vision with Cloaked covering
  the majority of employee premiums, company-paid basic life,
  and a 401(k) with company match. We offer flexible work
  arrangements and the ability to work remotely as needed.
  Cloaked provides a home office stipend in addition to a new
  company laptop (and other tech depending on the role).



  Perks

  🌴 Competitive PTO: PTO, floating holidays and sick days -
  and we push people to actually use them. We see time off as
  a preventative burnout measure, not a balance to hoard.

  👶 Parental Leave: Paid leave for all new parents - birth,
  adoption, or foster placement - because the people building
  privacy deserve time with their families.

  🤸 Monthly wellness & meals stipend: Used for any kind of
  physical, mental or emotional care you'd like to take for
  yourself, be it a gym membership, a meditation app, or time
  with a personal trainer - plus lunch and coffee during the
  workday.

  🧠 Professional Growth: Opportunities for career development
  and personal growth are provided to all employees who seek
  to further their knowledge and capabilities through an
  unlimited professional development fund. Additionally team
  members are encouraged to regularly attend conferences and
  industry events.

  We are really excited about having you join our mission-
  driven team and help us build the future of online privacy!
