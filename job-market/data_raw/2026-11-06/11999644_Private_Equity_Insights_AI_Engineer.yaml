description: |
  Growth at Private Equity Insights

  Are you excited about solving real, hard problems? Are you
  looking to work in an exceptional entrepreneurial team with
  ambitious, motivated and extremely driven people? And do you
  want real ownership from your first week? If so, now is the
  time to apply for the Growth role at Private Equity
  Insights.

  The mission: build the world's largest network for private
  equity investors.

  You will work in sprints and get fast execution under your
  skin. You will learn to write copy that makes elite
  investors act, map the entire market of investors, decide
  who to target, and deploy AI to outperform a teams of 20+
  people.

  If you want an ambitious mission, real ownership and the
  fastest learning curve of your career, apply.

  Why Private Equity Insights

  Private Equity Insights is the world’s largest Private
  Equity community with 1m PE professionals, delivering impact
  through 12 global PE conferences with thousands of the
  world’s best investors and operators such as Blackstone,
  BlackRock, Apollo, Carlyle, CVC, KKR, and many more.

  Private Equity Insights is part of United Media
  (https://www.united-media.com/) which focuses on building
  large-scale industry media and conferences products in
  sectors such as insurance, finance, retail, etc. As of
  today, we have organically launched 5 media companies and
  exited 1.

  What we offer you

  - Ownership from the very start. You own outcomes, not tasks.
    We agree the goal, and you find the way
  - Unlimited growth potential. We strongly believe in and have
    a track record of promoting internally. You can expect
    coaching and development from leaders, peers and experts.
  - Skills that compound for life. Fast execution, copywriting,
    pricing, conversion optimisation, structured problem
    solving, and the ability to create impact anywhere in the
    business at scale.
  - Master the highest bar in the world. Our audience is the
    world's most demanding investors. They ignore anything
    average. If your work can make them act, you can make
    anyone act.
  - Travel opportunity. You will be joining our conferences

  Your Responsibilities

  Your responsibilities will vary; however, some of them will
  be to:

  - Build the audience. Identify, target, and convert every fund
    into our community, and make sure each one receives the
    right message, at the right time, and never one too many.
  - Own marketing channels that drive revenue. Through existing
    and new marketing channels, you execute activities that
    ultimately will drive revenue
  - Write copy that persuades. Every email, landing page and
    post. Become the best copywriter and leverage it at scale
    with AI.
  - Sprint, test, implement. Measure the impact of all
    experiments you run, test offers, copy, prices and pages
    until the numbers move.
  - Build systems, not one-offs. Anything you do twice becomes a
    playbook or an AI workflow, so the next win takes less
    effort than the last.
  - Do whatever it takes to win. Some days that means designing
    an AI workflow. Some days it means checking investors in
    at the registration desk at 7am. Nobody here is too good
    for the work that deliver value to the client.

  What we expect from you

  You possess an unparalleled work ethic with a high sense of
  urgency. You have a relentless drive and desire to be the
  very best at what you do. You take ownership of everything
  you do, are proactive and follow through on commitments.
  Moreover, you’re humble and you share our passion for
  building and executing new businesses. Furthermore, we
  expect that you:

  - 1 to 3 years of experience
  - Min. a bachelor or master degree with great results
  - A UK work permit. We do not sponsor visas.
  - Strong work ethic with a sense of urgency
  - Exceptional drive and desire to be the best at what you do
  - Proactive approach and sense of ownership/responsibility of
    everything you do
  - A humble approach and share our passion for building
    companies and developing people
  - Interested in continuous learning and proactively searching
    for ways to optimise

  Practical details

  Role is full-time, in person from our London office
  (WeWork), 5 days a week.

  Expect to travel for work about 20 days a year.

  The start date is flexible.
