  7.      Featured as Top Data Analytics Services Provider by
  GoodFirms.

  Working for us

  Kanerika is rated 4.6/5 on Glassdoor, for many good reasons.
  We truly value our employees' growth, well-being, and
  diversity, and people’s experiences bear this out. At
  Kanerika, we offer a host of enticing benefits that create
  an environment where you can thrive both personally and
  professionally. From our inclusive hiring practices and
  mandatory training on creating a safe work environment to
  our flexible working hours and generous parental leave, we
  prioritize the well-being and success of our employees. Our
  commitment to professional development is evident through
  our mentorship programs, job training initiatives, and
  support for professional certifications. Additionally, our
  company-sponsored outings and various time-off benefits
  ensure a healthy work-life balance. Join us at Kanerika and
  become part of a vibrant and diverse community where your
  talents are recognized, your growth is nurtured, and your
  contributions make a real impact. See the benefits section
  below for the perks you’ll get while working for Kanerika.



  Locations

  We are located in Austin (USA), Singapore, Hyderabad, Indore
  and Ahmedabad (India).

  Job Location: Hyderabad, Indore and Ahmedabad.

  Role:

  As an AI/ML Engineer, you will build AI and agent features
  for an enterprise-grade SaaS platform in the data privacy,
  data governance and AI governance space. Your work will
  cover agent-based workflows, AI asset discovery and AI
  guardrails that detect and enforce controls for PII,
  toxicity and prompt injection, as well as new AI features
  taken from prototype to production.

  Key Responsibilities:

  ·       Build agent-based features using LLMs and frameworks
  such as LangChain and LangGraph, including tool calling,
  orchestration and memory.

  ·       Develop AI asset discovery for models, agents,
  prompts and AI services across cloud and AI platforms.

  ·       Implement guardrail signals and enforcement,
  including PII detection and redaction, toxicity and content
  moderation, and prompt-injection and jailbreak detection.

  ·       Build RAG pipelines, prompt templates and evaluation
  harnesses.

  ·       Evaluate and benchmark models and guardrail
  classifiers for accuracy, latency and cost.

  ·       Take new AI features from prototype to production
  for new product initiatives.

  ·       Integrate AI services with backend microservices
  through well-defined APIs.

  ·       Add observability, logging and monitoring to AI
  components.

  ·       Work closely with the AI Architect on design and
  technical decisions.

  What You’ll Bring:

  ·       Bachelor’s or Master’s degree in Computer Science,
  Engineering, or a related field, or equivalent experience.

  ·       5–8+ years of software engineering experience,
  including at least 2–3 years building ML, GenAI or LLM
  applications in production.

  ·       Strong programming skills in Python.

  ·       Hands-on experience building agentic AI or LLM-
  powered features.

  Mandatory Skills:

  ·       Strong proficiency in Python, with experience in
  FastAPI or Flask.

  ·       Experience in LLM application development: prompt
  engineering, RAG, embeddings and vector databases (e.g.,
  pgvector, OpenSearch, Pinecone, Azure AI Search).

  ·       Hands-on experience with agent frameworks such as
  LangChain, LangGraph or Semantic Kernel, and familiarity
  with the Model Context Protocol (MCP).

  ·       Experience with AWS Bedrock/SageMaker and Azure
  OpenAI/Azure AI Foundry.

  ·       Experience implementing AI safety controls, such as
  PII detection (e.g., Presidio), content moderation and
  prompt-injection defense (e.g., NeMo Guardrails, Guardrails
  AI, Llama Guard).

  ·       Good understanding of ML and NLP fundamentals,
  including Hugging Face Transformers.

  ·       Experience with LLM evaluation frameworks and
  methods.

  ·       Familiarity with Git, Docker and CI/CD pipelines.

  Good to Have:

  ·       Working knowledge of Java and Spring Boot.

  ·       Knowledge of AI governance frameworks such as NIST
  AI RMF and the EU AI Act.

  ·       Experience with MLOps practices and model fine-
  tuning.

  Why join us?

  ·       Build enterprise-grade products in data privacy and
  AI governance that are used by organizations worldwide.

  ·       Work hands-on with modern technologies across GenAI,
  agentic AI, cloud (AWS and Azure) and full-stack
  engineering.

  ·       Learn from experienced architects and engineering
  leaders through mentorship, design reviews and knowledge-
  sharing sessions.

  ·       Grow your career with twice-yearly appraisals,
  certification support and a promote-from-within culture.

  ·       Competitive compensation and comprehensive benefits
  as a full-time Kanerika employee.

  ·       Be part of an award-winning, CMMI Level 3 appraised
  data and AI company.

