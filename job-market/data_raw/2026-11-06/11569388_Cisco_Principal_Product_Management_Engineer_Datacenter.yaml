description: |
  Meet the Team  Cisco Data Center Networking is the
  infrastructure foundation for the AI era. We are a global
  leader in technology innovation, dedicated to delivering
  advanced networking solutions that power AI factories and
  data centers across the globe. We empower hyperscale,
  neocloud, sovereign-cloud, enterprise, and public sector
  customers to modernize data centers to support large AI
  clusters by seamlessly integrating optics, silicon, systems,
  and software. We are committed to fostering a collaborative,
  diverse and inclusive work environment where creativity and
  innovation can thrive. We are seeking Principal Product
  Manager to manage our product portfolio and drive the
  product definition of new products. Your Impact

  - Influence, lead, and collaborate with cross-functional teams
    to help define Cisco’s Data Center Networking strategy and
    roadmap for secure, scalable AI/ML fabrics and enterprise
    data center fabrics
  - Steer product portfolio by identifying data center market
    opportunities and defining new product strategy to capture
    emerging opportunities
  - Articulate and promote our portfolio value proposition to
    drive business growth with an emphasis on emerging
    opportunities in building secure, scalable infrastructure
    for AI/ML applications and enterprise workloads
  - Influence and work with engineering, supply chain, finance,
    customer service, sales, and channel partner teams to
    build differentiated products and drive business.
  - Develop business plans for product offerings including
    market analysis, competitive analysis, financial models,
    and pricing proposals
  - Translate product capabilities into simple, compelling
    messages that resonate with customers
  - Build impactful product marketing content and collateral
    such as presentations, blogs, and videos
  - Provide solution/product briefings to customers or partners
    and cultivate relationships
  - Represent or present Cisco’s Data Center Networking vision
    and solution/product innovations at internal and external
    events
  - Partner with the broader marketing and sales team to amplify
    product messaging and drive market success

  Minimum Qualifications

  - MBA or Master’s degree in Electrical Engineering, Computer
    Science, or related technical fields
  - 5+ years of product management experience in related areas
  - 10 years of working on networking concepts, protocols, and
    architectures, or related areas
  - Demonstrable knowledge of data center networking
    technologies and experience working with cross-functional
    teams to bring new products or solutions to market

  Preferred Qualifications

  - Solid understanding of data center networking concepts,
    technologies, and system design
  - Experience in financial analysis, forecasting, market
    analysis, and competitive analysis
  - Experience in ramping up and sustaining products by building
    opportunity pipeline and closing bookings

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.

  Disclaimer

  To ensure that we hire the best talent in the right way, we
  follow a strict hiring process and recently, Cisco has been
  made aware of fraudulent recruiters claiming to be from the
  company. Please be advised that any communication from Cisco
  about careers will:

  - be in direct response to an application you have submitted
    through the company career site
  - begin with screening or an interview
  - originate from a Cisco email address, and
  - be conducted across email, phone, or WebEx

  Cisco will never make a job offer without conducting an
  interview process or ask you for money in any way. If you
  have been requested to apply for a role or have received an
  offer from a site other than https://careers.cisco.com or
  cisco.wd5.myworkday.com, do not provide any personal
  identifying information, including your Aadhaar or other
  personal identifying number, birth certificate, banking
  information, driver's license, or passport.

  If you are the target of a recruiting scam, consider filing
  a report with your local law enforcement authorities. Cisco
  bears no responsibility, and cannot be held liable, for any
  claims, damages, expenses, or other inconvenience resulting
  from or in any way connected to recruiting scams.
