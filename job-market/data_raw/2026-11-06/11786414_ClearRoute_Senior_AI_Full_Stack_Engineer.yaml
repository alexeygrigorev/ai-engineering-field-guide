description: |
  About Us:

  ClearRoute is an engineering consultancy bridging Quality
  Engineering, Cloud Platforms and Developer Experience. We
  help enterprises reliably bring high-impact digital products
  to market faster, cheaper, and safer, working with
  technology leaders facing complex business challenges.

  We take as much pride in our people, culture and work-life
  balance as we do in making better software. We’re not just
  making better software. We’re making the making of software
  better. Collaborative, entrepreneurial and dedicated to
  problem solving, we bring the step change our customer need
  to sustain innovation. Our values challenge us to do the
  best we can for ClearRoute, our customers and most
  importantly our team. This is an opportunity for you to
  build the organisation from the ground up, use your voice to
  drive change and help transform organisations and problem
  domains.

  Role:

  We are seeking a highly skilled Senior Fullstack Developer
  with 7+ YEARS OF EXPERIENCE with deep expertise in React and
  strong experience deploying applications to cloud platforms,
  ideally Microsoft Azure (AWS experience also welcome). This
  role will focus on building, deploying, and optimising
  scalable, high-performance web applications that handle
  large volumes of data and integrate AI-driven components.
  You will work closely with backend engineers, cloud
  specialists, and AI teams to deliver intelligent,
  production- ready applications at scale.

  Key Responsibilities:

  • Design, build, and maintain scalable front-end
  applications using React, python and modern
  JavaScript/TypeScript.  • Build front-end solutions that
  support high data throughput, performance optimisation, and
  responsiveness at scale. • Collaborate on the deployment of
  applications to cloud environments (Azure preferred; AWS
  acceptable). • Integrate front-end applications with AI-
  powered services, including LLM-based APIs and workflows and
  Agentic AI systems • Automation and orchestration services
  (particularly within Azure) • Work with containerised
  environments (e.g. Docker) and contribute to cloud-native
  deployment pipelines. • Support CI/CD processes and promote
  reliable, repeatable deployments.

  Required Experience:

  • Extensive experience as a Senior fullstack Developer or
  similar role. • Expert knowledge of React & Python,
  including modern patterns, hooks, state management, and
  performance optimisation. • Proven experience deploying
  applications to cloud platforms, ideally Microsoft Azure. •
  Experience integrating front-end applications with APIs,
  microservices, and distributed systems. • Familiarity with
  container technologies such as Docker and container-based
  deployment models. • Experience working on applications that
  handle large datasets or high-traffic environments. • Strong
  understanding of front-end performance, observability, and
  optimisation techniques

  Desirable Experience: • MCP / FastMCP server authorship •
  LangGraph expertise (state graphs, checkpointing,
  persistence) • Azure AI Search and retrieval evaluation •
  Experience in regulated or critical-national-infrastructure
  settings • Full-stack ownership mindset across frontend,
  backend, and infrastructure

  Working at ClearRoute We have grown from six founders to
  180+ people across five countries in three years, and what
  sets us apart isn't the pace, it's how we grow.

  - Real flexibility, in practice. We trust you to perform at
    your best and still have a life outside of work, with
    genuine hybrid working, a home office budget, an open
    feedback culture where your voice shapes decisions, and
    time off when life needs it (birthday included).
  - When ClearRoute wins, you win. We offer profit share so
    success is shared, meaningful recognition for great work,
    and benefits that look after you and your family,
    including private healthcare, competitive salary
    benchmarking, and a confidential employee assistance
    program covering counselling, mental health support, and
    financial wellbeing.
  - A community you'll genuinely want to be part of. Interest
    based communities like running and book clubs, Women in
    Tech group, monthly socials, and cross regional events
    bring people together across the company. An inclusive,
    collaborative culture where you don't need to conform to
    succeed, where people support one another and feel
    comfortable being themselves.
  - Where meaningful work meets real growth. You will tackle
    complex, real world problems at the forefront of platform
    engineering, AI, security, and scalable systems. Your
    growth is supported by learning budgets, Udemy access, a
    clear career framework, internal mobility, and thought
    leadership opportunities that take your impact beyond
    ClearRoute.

  At ClearRoute, we believe diverse perspectives lead to
  better outcomes, and inclusion creates the conditions for
  everyone to thrive. We are proud to have built a family
  friendly working environment and have many employees who
  have caring responsibilities alongside work. We welcome
  applications from people who require flexibility and will be
  happy to discuss needs on an individual basis.

  We are committed to fostering a culture where all team
  members feel respected, supported, and empowered to do their
  best work. We celebrate individuality and our differences
  and understand that some differences may mean that you
  require changes made to the interview process. We are happy
  to cater to your needs to make the interview accessible, if
  this is something you require please let us know by emailing
  us at join@clearroute.io
