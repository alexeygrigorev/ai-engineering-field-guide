description: |
  The job in short

  As a Senior Applied AI Software Engineer, you design and
  deliver complex AI-enabled product capabilities with minimal
  guidance. This role transitions away from siloed
  frontend/backend titles toward a T-shaped, full-stack
  profile spanning UI, APIs, services, and data pipelines. You
  serve as a technical authority who mentors peers and raises
  the bar on AI-native engineering practices.



  Meet the Job

  ● As a Senior AI Applied Software Engineer you are a
  technical cornerstone of your squad. You will design and
  deliver complex features with minimal guidance, ensuring
  that both the "engine" (Backend) and the "experience"
  (Frontend) are performant, secure, and scalable. ● Full SDLC
  Ownership: Lead the entire lifecycle of digital banking
  products—from initial idea and architectural design to
  release and maintenance. ● Architectural Excellence: Improve
  system architecture and design components that integrate
  smoothly across APIs and microservices. ● Technical
  Leadership: Act as a go-to resource for your team, mentoring
  junior engineers, conducting critical code reviews, and
  raising the bar for engineering standards. ● AI &
  Innovation: Contribute to the evolution of LLM-based voice
  assistants and real-time personalization engines using
  OpenAI and ML models. ● Security-First Mindset: Implement
  "Entitlements" and fraud prevention services with a focus on
  non-functional requirements like security, scalability, and
  resilience. ● Collaborative Culture: Work in a Pod based
  model, collaborating with Architects, Product Owners, and UX
  Designers to align technical solutions with business needs.



  How about you

  ● Experience: You have 5–7+ years of professional experience
  building complex, high-traffic products. ● Backend Mastery:
  Solid understanding of Java, Spring JPA/Hibernate, and
  Maven. Experience with Microservices (Netflix OSS is a plus)
  and Cloud technologies. ● Frontend Expertise: Strong skills
  in Angular and TypeScript. You are proficient with RxJS and
  modern build systems (Webpack, Jenkins). Experience with
  Vue.js is a plus. ● System Design: You have a solid grasp of
  Enterprise Integration Patterns and can design systems that
  handle complex data flows between services. ● The "Senior"
  Edge: You don't just solve tickets; you identify gaps in
  tooling, reduce technical debt, and optimize CI/CD pipelines
  to streamline delivery. ● Communication: Excellent English
  (spoken and written). You can confidently explain technical
  concepts to non-technical stakeholders and get buy-in for
  your architectural decisions. ● Domain Knowledge: Previous
  experience in Fintech or Banking is highly considered an
  advantage.
