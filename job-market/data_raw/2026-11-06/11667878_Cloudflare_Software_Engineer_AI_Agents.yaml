description: |
  About Us  At Cloudflare, we are on a mission to help build a
  better Internet. Today the company runs one of the world's
  largest networks that powers millions of websites and other
  Internet properties for customers ranging from individual
  bloggers to SMBs to Fortune 500 companies. Cloudflare
  protects and accelerates any Internet application online
  without adding hardware, installing software, or changing a
  line of code. Internet properties powered by Cloudflare all
  have web traffic routed through its intelligent global
  network, which gets smarter with every request. As a result,
  they see significant improvement in performance and a
  decrease in spam and other attacks. Cloudflare was named to
  Entrepreneur Magazine's Top Company Cultures list and ranked
  among the World's Most Innovative Companies by Fast Company.
  At Cloudflare, we're not looking for people who wait for a
  polished roadmap; we're looking for the builders who see the
  cracks in the Internet that everyone else has simply learned
  to live with. We value candidates who have the instinct to
  spot a "normalized" problem and the AI-native curiosity to
  create a solution using the latest tools. Our culture is
  built on iteration, leveraging AI to ship faster today to
  make it better tomorrow, while ensuring that every
  improvement, no matter how small, is shared across the team
  to lift everyone up. If you're the type of person who values
  curiosity over bureaucracy, and that AI is a partner in
  solving tough problems to keep the Internet moving forward,
  you'll fit right in. Software Engineer, AI Agents Location:
  India, Bangalore Exp: 5 - 10yrs Why This Role Matters At
  Cloudflare, we're building industrial-scale AI agents that
  support customers directly. This isn't research theater.
  Your code will power real customer interactions from day
  one, at global scale. Cloudflare already has the parts. You
  will assemble Workers, Durable Objects, KV, R2, D1,
  Vectorize, Workers AI, AI Gateway, and the Agent SDK into
  real agents customers use every day. Role Intent Ship
  production agents on the Cloudflare stack. Build, deploy,
  learn, repeat. Your code is the front door for Cloudflare
  customers. What You Will Do

  - Build agents on Workers with Durable Objects for state and
    short term memory
  - Wire tools with the Agent SDK, MCP, and function calling
  - Use Vectorize, KV, R2, and D1 for semantic memory, cache,
    files, and config
  - Run models through Workers AI and AI Gateway; integrate
    third parties when needed
  - Create evals, guardrails, and audits. Measure, tune, re-ship
    fast
  - Build agents that summarize, propose fixes, and escalate
    cleanly to humans
  - Expose agent health and metrics in transparent dashboards.
    No mystery boxes
  - Integrate with queues and webhooks; publish events on Queues
    or Pub/Sub
  - Cut cost per case and time to first response. Prove it with
    data.
  - Take end to end ownership including on call for what you
    ship (with team support)
  - Design and maintain robust observability for distributed AI
    workflows, implementing structured logging and end-to-end
    tracing across async service boundaries to ensure
    visibility into agent reasoning and execution.
  - Architect security boundaries for agent-led operations;
    implementing secure credential handling, multi-layer
    approval gates, and fine-grained trust scoping for
    mutative actions.

   Must Have

  - Demonstrated success shipping production systems. Repos and
    releases that show real work.
  - Strong in TypeScript or Rust on Workers. HTTP, queues,
    async, performance
  - Fluency with Durable Objects, KV or R2, and either D1 or
    Postgres
  - Hands on with model tooling. Prompt I/O, tool calling,
    evals, safety checks
  - Observability mindset. Logs, traces, metrics, redlines
  - Experience with a2a/multi-agent frameworks
  - Experience developing LLM evaluation frameworks; automated
    scoring systems, CI-integrated quality gates.
  - Bias for simple, scalable designs

   Nice to Have

  - Workers AI, AI Gateway, and Vectorize in production
  - Salesforce or Service Cloud experience. Webhooks and case
    APIs
  - Security depth. Prompt injection protection, secrets
    detection, PII handling
  - OSS agent frameworks. Know what to borrow and what to throw
    away.

   How We Build

  - Align fast on what matters.
  - Divide and conquer. Own your piece.
  - Ship. Watch customers use it.
  - Learn and repeat.

   Why Join Cloudflare in India?  Impact at global scale: Your
  code will serve Cloudflare's customers across every region.
  Tens of millions of Internet properties depend on us. Work
  on the edge: Few companies give engineers the chance to
  build AI directly into an edge platform that runs in 300+
  cities worldwide. Career growth: As one of the early
  engineers in our India based AI team, you'll have
  visibility, leadership opportunities, and a direct hand in
  shaping Cloudflare's AI roadmap. Culture of ownership: We
  believe in autonomy, accountability, and trust. Engineers
  here own outcomes, not just tickets. Learn and grow fast:
  Collaborate with peers across Support, Product, Security,
  and AI Platform teams. We encourage knowledge sharing,
  mentorship, and continuous learning. Interview Signal Expect
  to demonstrate your ability to:

  - Build a mini agent on Workers using the Agent SDK
  - Store session memory in Durable Objects
  - Add semantic recall with Vectorize
  - Ship behind a KV flag with traces and observability
  - Push to production fast and take ownership

   Team Mission  The Agent Tech team owns the end to end stack
  for customer facing agents on Cloudflare. Everything runs at
  the edge. Core Stack: Workers, Durable Objects, KV, R2, D1,
  Queues, Pub/Sub, Vectorize, Workers AI, AI Gateway, Pages,
  Zero Trust. Principles: Ship fast. Measure truth. Simplify
  relentlessly. Own outcomes. Fraud Alert: Do not fall victim
  to recruitment fraud. Cloudflare never charges application
  fees or requires candidates to purchase third-party
  certifications or training as a condition of employment. All
  official communication comes strictly from @cloudflare.com
  email addresses. What Makes Cloudflare Special? We're not
  just a highly ambitious, large-scale technology company.
  We're a highly ambitious, large-scale technology company
  with a soul. Fundamental to our mission to help build a
  better Internet is protecting the free and open Internet.
  Project Galileo: Since 2014, we've equipped more than 2,400
  journalism and civil society organizations in 111 countries
  with powerful tools to defend themselves against attacks
  that would otherwise censor their work, technology already
  used by Cloudflare's enterprise customers--at no cost.
  Athenian Project: In 2017, we created the Athenian Project
  to ensure that state and local governments have the highest
  level of protection and reliability for free, so that their
  constituents have access to election information and voter
  registration. Since the project, we've provided services to
  more than 425 local government election websites in 33
  states. 1.1.1.1: We released 1.1.1.1 to help fix the
  foundation of the Internet by building a faster, more secure
  and privacy-centric public DNS resolver. This is available
  publicly for everyone to use - it is the first consumer-
  focused service Cloudflare has ever released. Here's the
  deal - we don't store client IP addresses never, ever. We
  will continue to abide by our privacy commitment and ensure
  that no user data is sold to advertisers or used to target
  consumers. Sound like something you'd like to be a part of?
  We'd love to hear from you! Please note that applicants who
  progress to the offer stage of the interview process may be
  asked to attend an in-person interview within one of the
  Cloudflare Offices or Cloudflare Hubs. More details about
  this will be available at that stage of the interview
  process. This position may require access to information
  protected under U.S. export control laws, including the U.S.
  Export Administration Regulations. Please note that any
  offer of employment may be conditioned on your authorization
  to receive software or technology controlled under these
  U.S. export laws without sponsorship for an export license.
