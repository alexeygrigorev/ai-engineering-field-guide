description: |
  What is Contentstack?

  Contentstack is redefining how modern digital experiences
  are built and managed. As the pioneer of the Agentic
  Experience Platform (AXP), Contentstack brings together
  structured content and brand governance (Content Cloud),
  real-time customer data, omnichannel personalization (Data
  Cloud) and autonomous AI orchestration (Agent OS) into one
  unified system.

  While many organizations adopted headless CMS or standalone
  AI tools expecting transformation, they often found
  themselves managing disconnected systems and manual
  workflows. Contentstack helps enterprises move beyond that
  complexity by connecting content, data and AI in a way that
  makes digital experiences faster to launch, easier to manage
  and more adaptive in real time.

  Leading brands including Steve Madden, LG Electronics,
  Subaru of America, Dolce & Gabbana, ASICS, Decathlon, and
  Caesars Entertainment rely on Contentstack to reduce
  operational friction and deliver personalized, scalable
  digital experiences with confidence. The company is known
  for its customer-first culture and commitment to the
  communities it serves through the Contentstack Cares
  program.

  Learn more at www.contentstack.com.

  Who Are We?

  At Contentstack we are more than colleagues, we are a tribe.
  Our vision is to pursue equity among our communities,
  employees, partners, and customers. We are global-diverse
  yet close; distributed yet connected. We are dreamers and
  dreammakers who challenge the status quo. We do the right
  thing, even when no one is watching. We are curious
  trendspotters and brave trendsetters. Our mission is to make
  Contentstack indispensable for organizations to tell their
  stories and to connect with the people they care about
  through inspiring, modern experiences. We care deeply about
  our customers and the communities we serve.
  #OneTeamOneDream. Chalo, let’s go!

  - What you will be working on Assets Platform Development
    - Design, build, and maintain backend services and APIs for
      managing assets, including organization  structures,
      folders, files, and metadata, along with their create,
      update, and delete flows.
    - Implement and evolve access control and permission features,
      including sharing assets with users  and teams and
      managing visibility settings.
    - Build features for secure and performant asset delivery,
      including CDN delivery, caching, and event driven
      integrations with other platform services.
    - Build and enhance image editing capabilities such as
      cropping, resizing, rotation, format conversion,
      compression, and on-the-fly image transformations for
      delivery.
    - Build and enhance video editing and processing capabilities
      such as trimming, transcoding,  thumbnail generation,
      and optimized streaming and playback.
    - Explore and integrate AI-powered media features such as
      smart cropping, background removal,  auto-tagging, and
      automated metadata generation for images and videos.
    - Build and improve asset usage tracking, so users can see
      where assets are referenced before  changing or deleting
      them.
    - Contribute to upcoming roadmap areas around security,
      collaboration, and sharing. Roles & Responsibilities

  What Do We Offer?

  Interesting Work | We hire curious trendspotters and brave
  trendsetters. This is NOT your boring, routine, cushy, rest-
  and-vest corporate job. This is the “challenge yourself”
  role where you learn something new every day, never stop
  growing, and have fun while you’re doing it.

  Tribe Vibe | We are more than colleagues, we are a tribe. We
  have a strict “no a**hole policy” and enforce it diligently.
  This means we spend time together - with spontaneous office
  happy hours, organized outings, and community volunteer
  opportunities. We are a diverse and distributed team, but we
  like to stay connected.

  Bragging Rights | We are dreamers and dream makers. Our
  efforts pay off and we work with the most prestigious
  brands, from big-name retailers to airlines, to professional
  sports teams. Your contribution will make an impact with
  many of the most recognizable names in almost every industry
  including AirFrance KLM, ASICS, Burberry, Mattel,
  Mitsubishi, Walmart, and many more!

  One Team One Dream | This is one of our values, and it
  shows. We don’t believe in artificial hierarchies. If you’re
  part of the tribe, you have an opportunity to contribute.
  Your voice will be heard and you will also receive regular
  updates about the business and its performance. Which, btw,
  is through the roof, so it’s a great time to be joining…

