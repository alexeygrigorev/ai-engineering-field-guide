description: |
  Job Title: AI Prompt Engineer

  Job Category: Information Technology

  Time Type: Full time

  Minimum Clearance Required to Start: None

  Employee Type: Regular

  Percentage of Travel Required: Up to 10%

  Type of Travel: Local

  * * *

  The Opportunity: CACI is seeking a forward-thinking AI
  Prompt Engineer to join a team delivering innovative AI
  solutions in support of U.S. Customs and Border Protection
  (CBP). This is a unique opportunity to apply cutting-edge
  generative AI technologies to one of the nation's most
  critical missions.



  In this role, you will help modernize how frontline
  personnel access information, make decisions, and execute
  their work. By leveraging AI-powered tools and large
  language models, you will develop solutions that improve
  efficiency, enhance situational awareness, and accelerate
  access to mission-critical information. Your work will
  directly support the men and women responsible for
  protecting our nation's borders, facilitating lawful trade
  and travel, and safeguarding our nation.



  You will be part of CACI's Agile Solution Factory, a
  collaborative environment focused on rapid innovation,
  experimentation, and continuous learning. We are seeking
  individuals who combine creativity, technical curiosity, and
  a passion for exploring the evolving capabilities of AI. The
  ideal candidate can translate complex operational challenges
  into practical, high-impact AI solutions that deliver
  measurable value to mission users. Responsibilities:

  - Prompt Design & Optimization: Develop, refine, and iterate
    on prompts for various generative AI models (LLMs) to
    elicit desired behaviors, responses, and creative outputs.
  - Iterative Testing & Analysis: Conduct testing to compare
    prompt variations, analyze results drive continuous
    improvement.
  - Collaboration: Work closely with multiple groups to
    integrate prompts to streamline manual processes.
  - Research & Development: Stay abreast of the latest
    advancements in LLMs, generative AI, and prompt
    engineering techniques.
  - Fine-tuning & RAG Support: Provide input and collaborate on
    strategies for model fine-tuning and Retrieval Augmented
    Generation (RAG) to further improve accuracy.
  - Problem Solving: Debug unexpected model behaviors,
    identifying root causes within prompt structure, model
    limitations, or data context.

  Qualifications: Required: Must be a U.S. Citizen with the
  ability to pass CBP background investigation, criteria
  include, but not limited to:

  - 3-year check for felony convictions
  - 1 year check for illegal drug use
  - 1 year check for misconduct such as theft or fraud

  - Must be available to work onsite in Ashburn, VA and/or
    Washington, D.C.
  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Technology, or related field (equivalent
    experience may be considered in lieu of degree).
  - 1+ years of software development experience, internships, or
    relevant academic project work.
  - 1+ year of hands-on experience working with Large Language
    Models (e.g., OpenAI GPT series, Llama, Gemini) or other
    generative AI models.
  - Experience with at least one programming language (Python,
    JavaScript/TypeScript)
  - Familiarity with prompt engineering techniques (few-shot,
    chain-of-thought, structured outputs, function calling)

  Desired:

  - Problem-solving skills, with a data-driven approach to
    experimentation and optimization.
  - Written and verbal communication skills, with an ability to
    articulate complex technical concepts clearly.
  - Ability to work independently and collaboratively in a fast-
    paced, evolving environment.
  - Exposure to RAG concepts, including embeddings and vector
    databases
  - Understanding of AI safety considerations (e.g., prompt
    injection, bias, data privacy)
  - Exposure to Agile/Scrum development environments

  -

  What You Can Expect:

   A culture of integrity.

  At CACI, we place character and innovation at the center of
  everything we do. As a valued team member, you’ll be part of
  a high-performing group dedicated to our customer’s missions
  and driven by a higher purpose – to ensure the safety of our
  nation.

  An environment of trust.

  CACI values the unique contributions that every employee
  brings to our company and our customers - every day. You’ll
  have the autonomy to take the time you need through a unique
  flexible time off benefit and have access to robust learning
  resources to make your ambitions a reality.

  A focus on continuous growth.

  Together, we will advance our nation's most critical
  missions, build on our lengthy track record of business
  success, and find opportunities to break new ground — in
  your career and in our legacy.

  Pay Range:

  There are a host of factors that can influence final salary
  including, but not limited to, geographic location, Federal
  Government contract labor categories and contract wage
  rates, relevant prior work experience, specific skills and
  competencies, education, and certifications. Our employees
  value the flexibility at CACI that allows them to balance
  quality work and their personal lives. We offer competitive
  compensation, benefits and learning and development
  opportunities. Our broad and competitive mix of benefits
  options is designed to support and protect employees and
  their families. At CACI, you will receive comprehensive
  benefits such as; healthcare, wellness, financial,
  retirement, family support, continuing education, and time
  off benefits.

  The proposed salary range for this position is:

  $61,100 - $122,200

  CACI is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, pregnancy, sexual
  orientation, age, national origin, disability, status as a
  protected veteran, or any other protected characteristic.
