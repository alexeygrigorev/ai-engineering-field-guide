description: |
  WorldQuant develops and deploys systematic financial
  strategies across a broad range of asset classes and global
  markets. We seek to produce high-quality predictive signals
  (alphas) through our proprietary research platform to employ
  financial strategies focused on market inefficiencies. Our
  teams work collaboratively to drive the production of alphas
  and financial strategies – the foundation of a balanced,
  global investment platform.

  WorldQuant is built on a culture that pairs academic
  sensibility with accountability for results. Employees are
  encouraged to think openly about problems, balancing
  intellectualism and practicality. Excellent ideas come from
  anyone, anywhere. Employees are encouraged to challenge
  conventional thinking and possess an attitude of continuous
  improvement.

  Our goal is to hire the best and the brightest. We value
  intellectual horsepower first and foremost, and people who
  demonstrate an outstanding talent. There is no roadmap to
  future success, so we need people who can help us build it.

  Technologists at WorldQuant research, design, code, test and
  deploy firmwide platforms and tooling while working
  collaboratively with researchers and portfolio managers. Our
  environment is relaxed yet intellectually driven. We seek
  people who think in code and are motivated by being around
  like-minded people.

  The Role: Join a software engineering team at the forefront
  of agentic AI and quantitative finance, focused on building
  reliable, scalable systems that transform how complex
  software and research workflows are developed, automated,
  and maintained. This team develops AI-enabled platforms,
  intelligent workflows, and engineering systems that apply
  emerging AI capabilities to real-world quantitative
  investment problems. You will work closely with engineers,
  quantitative researchers, and platform teams to build AI-
  first products that solve meaningful real-world investment
  problems.

  As a Senior AI Software Developer, you will shape technical
  architecture, establish engineering standards for agentic
  systems, and mentor others in applying modern AI-assisted
  development practices effectively.



  What You’ll bring:

  - 5+ years of professional software engineering experience,
    with a strong record of designing and delivering
    production-grade systems.
  - Hands-on experience building or deploying LLM-powered
    applications, AI agents, multi-agent workflows, tool-using
    systems, retrieval-augmented generation, or AI-enabled
    developer platforms.
  - Ability to translate ambiguous business, research, or
    engineering workflows into robust, measurable, AI-first
    solutions.
  - Experience building production-grade systems using AI-
    assisted development methods.
  - Strong understanding of system design, software
    architecture, testing, deployment, and operational
    reliability.
  - Excellent communication skills in English.
  - Mature, thoughtful attitude with the ability to operate in a
    collaborative, team-oriented culture.
  - A strong delivery mind-set, drive to get things done.

