description: |
  Become a part of our caring community The Enterprise AI
  organization at Humana is a pioneering force, advancing AI
  innovation enterprise-wide across Humana’s Insurance,
  CenterWell, Growth, and Corporate business segments. By
  collaborating with world-leading experts, we are at the
  forefront of delivering cutting-edge AI technologies to
  improve care quality and experience of millions of
  consumers. We are actively seeking top talent to develop
  robust and reusable AI modules and pipelines, ensuring
  adherence to best practices in accountable AI. Join us in
  shaping the future of healthcare through AI excellence.

  We are seeking an AI Engineer who will contribute to
  Generative AI initiatives at Humana, leveraging state-of-
  the-art LLMs to build applications. Our goal is to create
  safe AI solutions that will revolutionize and improve
  healthcare experience and outcomes for our customers. Join
  our rapidly expanding team of dedicated data scientists,
  engineers, policy experts, and business leaders as we work
  together to build impactful and beneficial AI systems.

  Key Responsibilities 

  - AI Innovation & Responsible Generative AI Design and develop
    AI solutions using Python, AI/ML and generative models
    like LLMs. Ensure responsible development aligned with
    Humana’s ethical standards, focusing on transparency,
    safety, and real-world impact.

  - Agentic AI System Design Build autonomous AI agents using
    frameworks (i.e. LangChain, LangGraph, AutoGen, CrewAI) to
    support reasoning and decision-making in healthcare.

  - Enterprise Integration & Business Collaboration Embed AI
    into Humana’s systems and workflows. Partner with business
    teams to understand challenges, co-create solutions, and
    communicate AI capabilities clearly—especially around
    generative AI. Design for scalability, reliability, and
    compliance.

  - MLOps & DevOps Collaboration Work with engineering and
    product teams to implement best practices for deploying
    and maintaining AI models in production.

  - Execution of data science initiatives, including design,
    development, and implementation.

  - Collaborate with data scientists, date engineers, software
    engineers, and stakeholders to deliver high impact AI use
    case solutions.

  - Develop and maintain advanced AI/machine learning models and
    algorithms.

  - Design and implement robust monitoring capabilities to
    maintain optimal performance and reliability.

  - Experience in creating reports, projections, models, and
    presentations to business stakeholders.
  - Experience with AI coding assistants

  Use your skills to make an impact


  Required Qualifications

  - Bachelor's Degree and 2 or more years of applicable
    experience OR Master's Degree and 1 or more year of
    experience preferably with a focus on developing
    production-ready AI solutions

  - Experience with Agentic AI System Design

  - Experience collaborating with MLOps and DevOps teams

  - Proficiency in SQL, Python, PySpark, and data analysis/data
    mining tools

  - Experience with machine learning frameworks like Scikit-
    Learn, Tensorflow, or Pytorch

  - Experience with high performance, large-scale ML systems

  - Experience with language modeling with transformers

  - Experience with large-scale ETL

  Additional Information

  Work Style: This position will have a hybrid work style,
  with 3 days per week in office and 2 days per week
  remote/home.

  Office Location Options:

  - Louisville, KY
  - Boston, MA
  - New York, NY
  - Dallas, TX
  - Tampa, FL
  - Washington, DC (Arlington, VA)

  Scheduled Weekly Hours

  40

  Pay Range

  The compensation range below reflects a good faith estimate
  of starting base pay for full time (40 hours per week)
  employment at the time of posting. The pay range may be
  higher or lower based on geographic location and individual
  pay will vary based on demonstrated job related skills,
  knowledge, experience, education, certifications, etc.



  $97,900 - $133,500 per year



  This job is eligible for a bonus incentive plan. This
  incentive opportunity is based upon company and/or
  individual performance.

  Description of Benefits

  Humana, Inc. and its affiliated subsidiaries (collectively,
  “Humana”) offers competitive benefits that support whole-
  person well-being. Associate benefits are designed to
  encourage personal wellness and smart healthcare decisions
  for you and your family while also knowing your life extends
  outside of work. Among our benefits, Humana provides
  medical, dental and vision benefits, 401(k) retirement
  savings plan, time off (including paid time off, company and
  personal holidays, paid parental and caregiver leave),
  short-term and long-term disability, life insurance and many
  other opportunities.

  About Us About Humana: Humana Inc. (NYSE: HUM) is a leading
  U.S. healthcare company. Through our Humana insurance
  services and our CenterWell healthcare services, we make it
  easier for the millions of people we serve to achieve their
  best health – delivering the care and service they need,
  when they need it. These efforts are leading to a better
  quality of life for people with Medicare and Medicaid,
  families, individuals, military service personnel, and
  communities at large. Learn more about what we offer
  at Humana.com and at CenterWell.com.


