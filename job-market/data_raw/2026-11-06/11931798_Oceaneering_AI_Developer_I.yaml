description: |
  Join our Data & Analytics team as an AI Developer,
  responsible for designing, developing, deploying, and
  supporting enterprise AI solutions that improve
  productivity, automate business processes, and enable data-
  driven decision-making. This hands-on role uses Microsoft
  Copilot Studio, Power Automate, Power Platform, Microsoft
  Graph, and Azure AI services to translate business
  requirements into secure, scalable, supportable solutions.
  The ideal candidate combines strong development, consulting,
  and communication skills with practical knowledge of large
  language models, AI agents, prompt engineering, grounding,
  orchestration, testing, and Responsible AI.

  Responsibilities

  Functions

  ESSENTIAL

  - Design, develop, deploy, and support enterprise AI agents,
    automations, and AI-enabled applications using Microsoft
    Power Platform and Azure AI technologies.
  - Build and optimize agents in Microsoft Copilot Studio,
    including instructions, topics, actions, tools, knowledge
    sources, and orchestration logic.
  - Develop workflows, approvals, notifications, integrations,
    and process orchestrations using Power Automate.
  - Partner with business stakeholders to understand processes,
    define requirements, assess feasibility, prioritize
    opportunities, and establish measurable outcomes.
  - Translate functional requirements into maintainable
    technical designs that align with enterprise architecture,
    security, data, privacy, compliance, and AI governance
    standards.
  - Implement prompt engineering, grounding, retrieval-augmented
    generation, and human-review patterns to improve accuracy,
    reliability, and appropriate agent behavior.
  - Integrate solutions with Microsoft 365, Microsoft Graph,
    SharePoint, Dataverse, Azure services, enterprise
    applications, APIs, and approved external services.
  - Develop and execute functional, integration, regression,
    security, prompt-response, tool-calling, and user
    acceptance tests.
  - Package and deploy solutions using approved application
    lifecycle management, source control, configuration
    management, and change control practices.
  - Monitor availability, performance, usage, quality, failures,
    and adoption; troubleshoot production issues and implement
    improvements based on telemetry and feedback.
  - Support demonstrations, training, knowledge transfers,
    release communications, and adoption activities.
  - Contribute reusable prompts, components, connectors,
    templates, standards, and implementation patterns to
    improve delivery consistency and speed.

  Qualifications

  REQUIRED

  - Minimum 2 years of experience in software development,
    business application development, workflow automation,
    enterprise integration, or related technology delivery.
  - Minimum 1 year of hands-on experience with Microsoft Power
    Platform, including Power Automate, and experience
    developing AI agents in Copilot Studio.
  - Working knowledge of generative AI, large language models,
    prompt engineering, grounding, retrieval-augmented
    generation, and AI-agent orchestration.
  - Experience gathering requirements and translating business
    needs into functional and technical solutions.
  - Understanding of application lifecycle management, testing,
    deployment, change control, documentation, production
    support, security, privacy, and compliance.
  - Strong analytical, troubleshooting, communication,
    collaboration, and stakeholder management skills.

  DESIRED

  - Bachelor’s degree in Computer Science, Information
    Technology, Engineering, or a related field.
  - Experience delivering AI or automation solutions in a large
    or complex enterprise environment.
  - Experience with Azure AI Foundry, Azure OpenAI, Azure AI
    Search, Microsoft Graph, SharePoint, and Dataverse.
  - Experience with custom connectors, plugins, agent actions,
    API services, adaptive cards, and conversational
    interfaces.
  - Microsoft certifications related to Power Platform, Copilot
    Studio, or Azure AI.

  About Us

   Oceaneering is a global provider of engineered services and
  products, primarily to the offshore energy industry. We
  develop products and services for use throughout the
  lifecycle of an offshore oilfield, from drilling to
  decommissioning. We operate the world's premier fleet of
  work class ROVs. Additionally, we are a leader in offshore
  oilfield maintenance services, umbilicals, subsea hardware,
  and tooling. We also use applied technology expertise to
  serve the defense, material handling, aerospace, science,
  and renewable energy industries.

  About the Team

  Overview

  Since year 2003, Oceaneering’s India Center has been an
  integral part of operations for Oceaneering’s robust product
  and service offerings across the globe. This center caters
  to diverse business needs, from oil and gas field
  infrastructure, subsea robotics to automated material
  handling & logistics.

  Our multidisciplinary team offers a wide spectrum of
  solutions, encompassing Subsea Engineering, Robotics,
  Automation, Control Systems, Software Development, Asset
  Integrity Management, Inspection, ROV operations, Field
  Network Management, Graphics Design & Animation, and more.

  In addition to these technical functions, Oceaneering India
  Center plays host to several crucial business functions,
  including Finance, Supply Chain Management (SCM),
  Information Technology (IT), Human Resources (HR), and
  Health, Safety & Environment (HSE).

  Our world class infrastructure in India includes modern
  offices, industry-leading tools and software, equipped labs,
  and beautiful campuses aligned with the future way of work.
  Oceaneering in India as well as globally has a great work
  culture that is flexible, transparent, and collaborative
  with great team synergy.

  At Oceaneering India Center, we take pride in “Solving the
  Unsolvable” by leveraging the diverse expertise within our
  team. Join us in shaping the future of technology and
  engineering solutions on a global scale.
