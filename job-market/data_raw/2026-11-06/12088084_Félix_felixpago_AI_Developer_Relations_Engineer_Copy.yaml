description: |
  About Us

  At Félix, we are building the indispensable financial
  companion for Latinos in the US. We combine an AI-powered,
  conversational-first interface with real-time financial
  infrastructure to make cross-border money movement as easy
  as sending a text. Starting with fast, affordable
  remittances powered by AI and crypto rails, we are expanding
  into credit, savings, and wallet services to support the
  complete immigrant financial journey. Our ambition is to
  deliver a white-glove financial experience with the
  simplicity of a conversation to a community the traditional
  financial system has historically overlooked.

  We are a hyper-growth Series C company, backed by over $300
  million in funding from top-tier global investors, including
  Andreessen Horowitz, QED, Castle Island, Switch Ventures,
  HTwenty, Monashees, General Catalyst Customer Value Fund.
  This isn't just about the numbers; it's a testament to the
  trust our investors have in our vision and our team.
  Additionally, Félix was selected as an “Endeavor
  Entrepreneur” and was a recipient of the CrossTech Fintech
  Startups Award.

  Joining Félix means you will be part of a team building a
  legacy, a company that will outlive us all. This is a rare
  opportunity to apply your skills to a deeply meaningful
  mission—serving a community that has been underserved for
  too long because we are obsessed with our customers. We get
  things done with urgency and focus, driven by extreme
  ownership over our impact. We collaborate without ego,
  fostering radical transparency and fierce loyalty so we can
  grow together. Because we aim for insanely great rather than
  just good enough, we stay insatiably curious—always
  experimenting, building the future today, and delivering a
  product that truly makes our users' lives better.

  About the Role

  Félix is becoming an AI-native company. As our AI Technical
  Program Manager, you’ll take the AI initiatives leadership
  prioritizes and drive them from idea to solutions that are
  deployed, adopted, and owned.

  You’ll work across Engineering, Product, Data, FDE, AI
  Enterprise, and platform teams. Specialist engineers own the
  architecture and implementation. You own the plan, the
  dependencies, the decisions that need making, and the
  follow-through until the intended problem is solved. You’ll
  report to the Head of AI Enablement & Talent Development.

  Responsibilities

  - Translate AI priorities into technical plans with scope,
    requirements, milestones, success metrics, acceptance
    criteria, and named owners.
  - Turn incomplete briefs into testable hypotheses, baselines,
    and measurable outcomes.
  - Coordinate technical dependencies across Engineering,
    Product, Data, FDE, AI Enterprise, and platform teams.
  - Drive technical decisions with engineers: challenge
    assumptions, make trade-offs explicit, and record the
    outcome.
  - Manage execution and risk: track commitments, remove
    blockers, and escalate early with a recommendation.
  - Coordinate evaluations and deployment readiness, including
    quality, latency, cost, and permissions risks, and verify
    that FDE integrations work in the receiving team’s
    environment.
  - Secure named owners for support, monitoring, and
    maintenance, and measure whether each solution solved the
    intended problem.
  - Work with AISec and the AI Governance Committee so reviews
    happen early.
  - Turn project lessons into reusable briefs, checklists,
    decision records, and handoff standards.

  Requirements

  Must have

  - Technical program leadership. Proven experience leading
    complex technical programs or software delivery across
    several teams, with specific examples of your own
    judgment, design contributions, decisions, and results.
  - Hands-on technical fluency. Practical skills in Python, SQL,
    APIs, authentication, Git, and testing. Comfortable using
    at least one LLM SDK, such as OpenAI or Google, to
    prototype integrations and debug issues. You understand
    data modeling, pipelines, and enterprise integration
    patterns.
  - Agent and evaluation knowledge. Experience with tool
    calling, multi-step orchestration, state, structured
    outputs, human review, and fallbacks. You can assess
    quality, latency, cost, and permissions risks, and define
    useful evaluations.
  - Operational rigor. You establish baselines, validate
    assumptions through experiments, and balance
    sophistication with operational constraints.
  - Communication and ownership. A track record of translating
    between business and engineering teams, influencing
    without formal authority, mentoring others, and escalating
    decisions early. Bring examples of solution designs,
    evaluation decisions, or delivery outcomes; confidential
    work can be discussed without sharing proprietary
    material.

  Nice to have

  - Applied LLM work used by real users
  - RAG and vector database experience
  - Experience deploying into environments owned by other teams
  - Experience in a regulated or data-sensitive setting such as
    fintech
  - Experience with CX, support, or compliance metrics such as
    AHT, FCR, CSAT, and SLA

  What We Offer

  - Competitive salary
  - Initial stock options grant
  - Annual performance bonus
  - Unlimited PTO
  - Paid parental leave
  - Hybrid work setup
  - 401(k) with employer matching, for US-based employees
  - Health, dental, and vision plans
  - Continuous learning opportunities
  - Empowering opportunities for growth in a dynamic
    entrepreneurial environment

  The starting base salary for this role typically ranges
  between $193,000 and $213,000 USD, tailored to experience
  and skill set. Because we are all owners of Félix, equity is
  a core component of our total compensation package. Your
  recruiter will walk you through our complete benefits,
  health coverage, equity structure, and total compensation
  details during your first call.

