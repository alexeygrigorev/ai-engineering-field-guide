description: |
  Eden Health  |  Engineering and Product Hub, India

  AI-First Full Stack Developer

  Location: Hyderabad (Eden Health Engineering and Product
  Hub, India)

  Experience: 2 to 5 years

  Employment: Full time

  Shift: Partial overlap with US hours

  About Eden Health

  Eden Health is a US healthcare company delivering
  exceptional healthcare experiences through technology. Eden
  has set up a dedicated Engineering and Product Hub in India
  in partnership with Softobiz Technologies, to expand
  engineering capacity, speed up innovation and strengthen its
  AI and data capabilities.

  We are now building the next version of Eden’s platform: a
  connected healthcare ecosystem that brings patients,
  doctors, care teams and partners such as clinics and
  pharmacies together on one modern, cloud-native foundation.
  The India hub is at the centre of that build.

  AI is central to how Eden will grow, from clinical decision
  support to operational automation. The India hub works hand
  in hand with Eden’s US leadership, with real ownership
  across product, engineering and operations.

  Read the announcement: Expanding Our Digital Footprint in
  India

  About the role

  We’re looking for developers who treat AI as the default way
  to build software. You will help build the next version of
  Eden’s platform end to end, use AI tools to move fast
  without cutting corners, and bring AI into the product where
  it genuinely makes things better for patients, doctors and
  care teams.

  This is a hands-on engineering role on a modern platform
  being built the right way from the ground up. You’ll be part
  of a small, high-ownership team where your work reaches real
  patients quickly.

  What AI-first means here

  - Think AI: For any problem, you ask whether AI can solve it
    better, faster or cheaper. You can also tell when it
    shouldn’t be used.
  - Use AI: AI coding tools are part of how you plan, write,
    test, debug, refactor and document code every day.
  - Build AI: You can turn a good idea into a working AI feature
    when the opportunity is there.
  - Build apps: Solid engineering comes first. You ship clean,
    tested, secure, production-ready applications.

  What you’ll do

  Build the platform

  - Build end-to-end features across web apps, APIs and backend
    services.
  - Write clean, maintainable, well-tested code and own it from
    design to production.
  - Build with security and privacy in mind, from access control
    to protecting patient data.
  - Improve performance, reliability and observability across
    the platform.
  - Work with product and design to turn requirements into
    working software quickly.

  Bring AI into the product

  - Help design and build AI-powered features such as smart
    search, summarisation and assistants for patients and care
    teams.
  - Spot manual work across Support, Operations and Marketing
    that AI can automate, and help build the solutions.
  - Keep up with fast-moving AI tools and bring practical ideas
    to the team.

  Ways of working

  - Use Claude Code, Cursor, Copilot or similar tools daily, and
    stay accountable for the quality of everything you merge.
  - Share what works: prompts, workflows and shortcuts that help
    the whole team move faster.
  - Take part in code reviews, sprint ceremonies, release
    planning and the production support rotation.
  - Handle patient data responsibly under HIPAA-aligned security
    and privacy practices.
  - Communicate clearly and asynchronously with US-based
    stakeholders.

  Must have

  - 3 to 5 years of professional full stack development
    experience.
  - Strong skills in TypeScript, with React or Next.js on the
    front end and Node.js on the back end.
  - Solid experience with APIs, SQL databases and cloud
    platforms, ideally AWS.
  - AI-assisted coding as part of your daily workflow, with
    examples to show.
  - Some hands-on experience integrating AI APIs (Claude,
    OpenAI, Gemini), at work or in side projects.
  - Good engineering habits: Git, CI/CD, automated testing and
    code reviews.
  - Clear written and spoken English.

  Nice to have

  - GraphQL, microservices or event-driven architectures.
  - Agent or automation tools such as LangChain, n8n or MCP
    servers.
  - Healthcare or another regulated domain.
  - A public portfolio, GitHub or side projects that show how
    you build.

  What success looks like in your first 6 months

  - You’re shipping features independently across the full
    stack.
  - You’ve contributed to at least one AI-powered feature or
    automation that’s in use.
  - Your AI-assisted workflow is visibly raising the team’s pace
    and quality.
  - Teammates come to you for AI tooling ideas.

  Why join

  - Help build the next version of a healthcare platform from
    the ground up.
  - Be part of the founding team of Eden’s India Engineering and
    Product Hub, with a real mandate to shape what comes next.
  - Join an AI-first culture where the best tools are part of
    how everyone works.
  - High ownership, fast feedback and visible impact.

  How we’ll assess you

  - Show us something you built with AI, or something AI helped
    you build faster. Share a GitHub link, a demo or a short
    walkthrough with your application.
  - Expect a live build exercise where you use your own AI
    tools. We care about how you think, break down the problem
    and steer the AI, as much as the final result.
  - Expect a technical conversation with our engineering lead
    about your past work and decisions.
