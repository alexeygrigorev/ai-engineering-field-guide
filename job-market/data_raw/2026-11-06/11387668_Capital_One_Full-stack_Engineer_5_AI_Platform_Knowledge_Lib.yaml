description: |
  Full-stack Engineer 5 (AI Platform & Knowledge Library)
  (Enterprise Platforms Technology) Do you love building and
  pioneering in the technology space? Do you enjoy solving
  complex business problems in a fast-paced, collaborative,
  inclusive and iterative delivery environment? At Capital
  One, you'll be part of a big group of makers, breakers,
  doers and disruptors who solve real problems and meet real
  customer needs. We are seeking Full-stack Software Engineers
  who are passionate about leveraging cutting-edge open source
  frameworks and emerging technologies. In this role, you'll
  be at the forefront of driving a major transformation across
  Capital One. What You'll Do:

  - Lead a portfolio of diverse technology projects and a team
    of developers with deep experience in distributed
    microservices, and full stack systems to create solutions
    that help meet regulatory needs for the company
  - Share your passion for staying on top of tech trends,
    experimenting with and learning new technologies,
    participating in internal & external technology
    communities, mentoring other members of the engineering
    community
  - Collaborate with digital product managers, and deliver
    robust cloud-based solutions that drive powerful
    experiences to help millions of Americans achieve
    financial empowerment
  - Utilize programming languages like Java, Scala, Python, Go,
    Node.js, JavaScript and TypeScript, Open Source RDBMS and
    NoSQL databases, Container Orchestration services
    including Docker and Kubernetes, and a variety of AWS
    tools and services
  - Provide technical leadership across multiple teams, shaping
    system architecture and long-term technology direction
  - Drive end-to-end design and implementation of large-scale,
    distributed, or cloud-native systems with high reliability
    and performance requirements
  - Partner with architects and product leaders to define
    platform roadmaps and shared services strategy

  Basic Qualifications:

  - Bachelor's Degree or higher in Computer Science or a related
    quantitative field (Statistics, Economics, Operations
    Research, Analytics, Mathematics, Engineering)
  - At least 6 years of experience in software engineering
    (Internship experience does not apply)
  - At least 3 years of experience with public cloud platforms
    (AWS, GCP, Azure), cloud-based productivity tools, or
    virtualization technologies

  Preferred Qualifications:

  - Master's Degree in Computer Science or a related field
  - 9+ years of experience coding with more than two of the
    following: Go, Java, JavaScript/TypeScript, Python, Rust,
    C#, Scala
  - 5+ years of experience contributing to open source
    frameworks
  - 5+ years of experience with front-end JavaScript or
    TypeScript frameworks
  - 5+ years of experience creating synchronous and asynchronous
    APIs
  - 4+ years of experience with database and database management
    systems
  - 4+ years of experience with AWS, GCP, Azure, or cloud-based
    productivity tools or virtualization technologies
  - 4+ years of experience with CI/CD pipelines, infrastructure
    as code, and automated testing frameworks
  - 4+ years of experience using Git-based version-control
    systems (e.g., Git, GitHub, Bitbucket)
  - 4+ years of experience troubleshooting technical issues
    within cloud environments
  - 3+ years of experience mentoring senior engineers and
    driving professional development within technical teams
  - 2+ years of experience leveraging observability to identify
    and optimize performance bottlenecks in distributed
    systems
  - 1+ year of experience leading architectural design reviews
    and influencing enterprise-wide technical standards and
    methodologies
  - 1+ year of experience establishing and enforcing coding
    standards and design patterns across teams
  - 1+ year of experience implementing observability and
    reliability practices at scale
  - Experience leveraging modern AI-based coding tools and IDE
    copilots
  - Experience influencing technology strategy at the portfolio
    or business unit level
  - Experience with interactive AI tooling to accelerate
    productivity, utilizing capabilities beyond basic code
    completion
  - Experience leading cross-functional engineering efforts or
    large-scale technical initiatives

  Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
  The minimum and maximum full-time annual salaries for this
  role are listed below, by location. Please note that this
  salary information is solely for candidates hired to perform
  work within one of these locations, and refers to the amount
  Capital One is willing to pay at the time of this posting.
  Salaries for part-time roles will be prorated based upon the
  agreed upon number of hours to be regularly worked. McLean,
  VA: $229,900 - $262,400 for Full-stack Engineer 5 New York,
  NY: $250,800 - $286,200 for Full-stack Engineer 5 Richmond,
  VA: $209,000 - $238,500 for Full-stack Engineer 5 Candidates
  hired to work in other locations will be subject to the pay
  range associated with that location, and the actual
  annualized salary amount offered to any candidate at the
  time of hire will be reflected solely in the candidate's
  offer letter. This role is also eligible to earn performance
  based incentive compensation, which may include cash
  bonus(es) and/or long term incentives (LTI). Incentives
  could be discretionary or non discretionary depending on the
  plan. Capital One offers a comprehensive, competitive, and
  inclusive set of health, financial and other benefits that
  support your total well-being. Learn more at the Capital One
  Careers website . Eligibility varies based on full or part-
  time status, exempt or non-exempt status, and management
  level. This role is expected to accept applications for a
  minimum of 5 business days. No agencies please. Capital One
  is an equal opportunity employer (EOE, including
  disability/vet) committed to non-discrimination in
  compliance with applicable federal, state, and local laws.
  Capital One promotes a drug-free workplace. Capital One will
  consider for employment qualified applicants with a criminal
  history in a manner consistent with the requirements of
  applicable laws regarding criminal background inquiries,
  including, to the extent applicable, Article 23-A of the New
  York Correction Law; San Francisco, California Police Code
  Article 49, Sections 4901-4920; New York City's Fair Chance
  Act; Philadelphia's Fair Criminal Records Screening Act; and
  other applicable federal, state, and local laws and
  regulations regarding criminal background inquiries. If you
  have visited our website in search of information on
  employment opportunities or to apply for a position, and you
  require an accommodation, please contact Capital One
  Recruiting at 1-800-304-9102 or via email at
  RecruitingAccommodation@capitalone.com . All information you
  provide will be kept confidential and will be used only to
  the extent required to provide needed reasonable
  accommodations. For technical support or questions about
  Capital One's recruiting process, please send an email to
  Careers@capitalone.com Capital One does not provide, endorse
  nor guarantee and is not liable for third-party products,
