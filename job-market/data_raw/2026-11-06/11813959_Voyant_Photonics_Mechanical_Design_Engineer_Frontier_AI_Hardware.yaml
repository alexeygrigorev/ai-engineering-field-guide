description: |
  Mechanical Design Engineer, Frontier AI Hardware

  About us:

  Voyant Photonics is pushing the boundaries of silicon
  photonic chips that steer and switch light at high speed.
  They power next generation, chip-scale FMCW LiDAR for
  robotics and autonomy, and optical circuit switches (OCS)
  for AI data centers. Based in NYC, we’re a hands-on team
  designing, building, and deploying frontier hardware to
  solve problems that matter, from how machines see to how AI
  scales.

  About the Role:

  We are looking for an experienced Mechanical Engineer to
  design, document, and release the mechanical hardware for
  our LiDAR sensing products and the tooling used to build and
  test them. You will own parts and assemblies from concept
  through release and support the alignment and assembly
  processes that bring our sensors to life. In a startup
  environment, speed matters, and so does getting it right the
  first time.

  What You'll Do:

  - Design mechanical components, housings, assemblies, and
    development platforms for LiDAR sensors in SolidWorks

  - Create clear, complete, manufacturing-ready drawings with
    proper GD&T per ASME Y14.5

  - Perform tolerance stack-up analyses to verify fit, function,
    and optical alignment budgets

  - Translate system‑level requirements into robust mechanical
    architecture and detailed designs

  - Design fixtures, jigs, and tooling for assembly, alignment,
    inspection, and test

  - Support and improve lens alignment stations and related
    optical assembly processes

  - Manage engineering change requests and revisions (ECR/ECO),
    keeping documentation and BOMs accurate

  - Work with suppliers to resolve manufacturability questions
    and ensure part quality

  - Drive design-to-cost and value engineering efforts to reduce
    part cost and complexity without compromising performance

  - Collaborate with optical, electrical, and manufacturing
    engineers to turn requirements into robust designs

  - Iterate quickly through prototypes and builds, then move
    designs toward production

  What We're Looking For

  - B.S. in Mechanical Engineering or equivalent practical
    experience

  - Minimum of 4+ years of mechanical design experience for
    precision hardware products

  - Strong proficiency in SolidWorks, including assemblies,
    detailed part modeling and drawings

  - Working knowledge of GD&T and its practical application to
    functional and inspection requirements

  - Experience performing tolerance stack-up analysis (worst-
    case and statistical)

  - Experience with tool and fixture design

  Nice to Have

  - Experience with precision optomechanical design, such as
    lens mounting and adhesive bonding.

  - Experience with thermal analysis and structural FEA,
    especially for compact electro-optical packaging

  - Hands-on machining, , assembly, or test experience

  Life at Voyant

  We build frontier hardware & systems from our lab and office
  in Midtown Manhattan, where optical tables, lab benches and
  electronics sit alongside traditional office space. Our work
  is hands-on and primarily in person, but we don’t run on a
  rigid 9-to-5. We partner with customers across time zones,
  so some calls start early or run late, and we adjust
  schedules around them. We run a high-trust, high-
  accountability environment: you’ll own meaningful work, move
  quickly and often wear more than one hat. Voyant provides
  catered lunch every day at HQ, and we’re a diverse group of
  food lovers from around the world who enjoy sharing food,
  culture and technical ideas around the lunch table.

  Equal Opportunity Employer

  Voyant Photonics is an equal opportunity employer committed
