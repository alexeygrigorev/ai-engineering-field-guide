description: |
  About

  We are reimagining the phone. AI phones need to be
  proactive, intuitive, intelligent and low cost. This is a
  mission critical for rest of the world to adopt
  intelligence.

  There are over 5 billion people using everyday applications
  such as email, messaging, notes, tasks, and calendars, yet
  most are not AI-native. Our mission is to build proactive
  applications and devices that bring intelligence into daily
  conversations, coordination and workflows, with minimal
  prompting.

  Focus: Building agent capabilities, context, memory and
  orchestration.

  Responsibilities

  - Implement agent workflows and orchestration.
  - Build integrations with different tools and applications.
  - Develop context retrieval and memory mechanisms.
  - Implement multi-step task execution.
  - Support long-running workflows and state management.
  - Improve agent reliability and execution accuracy.
  - Integrate local and cloud model providers.
  - Build evaluation and regression tests for agent workflows.

  Requirements

  - Strong backend or AI application engineering experience.
  - Python, Go or TypeScript.
  - Experience with LLM APIs and tool calling.
  - Experience building AI applications or agent workflows.
  - Strong API and distributed systems knowledge.
  - Good understanding of state management and asynchronous
    execution.

  Nice to have

  - Production agent infrastructure.
  - RAG, memory and context engineering.
  - Model routing and inference optimization.
  - Experience with mobile or operating-system integrations.
