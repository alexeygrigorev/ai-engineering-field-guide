description: |
  About Valenta

  Valenta is a global professional services firm specialising
  in intelligent automation, data analytics and AI-driven
  solutions, with operations across India, the United States,
  the United Kingdom, Australia and Latin America. We are now
  building a portfolio of AI products for clients worldwide.

  Role Overview

  We are seeking an experienced AI Application Engineer to
  design, build and deliver the applications that power our AI
  products. This is a full-stack role with a strong backend
  emphasis, covering API design, AI service integration, cloud
  deployment, and frontend development.

  The successful candidate will collaborate directly with
  clients across the US, UK, Australia and other international
  markets to translate business requirements into reliable,
  production-grade solutions.

  Key Responsibilities

  - Design, develop and maintain scalable backend services and
    RESTful APIs using Python and Node.js.
  - Develop responsive, maintainable user interfaces in
    React.js, integrated with backend services.
  - Integrate large language model capabilities, including
    Claude and Azure AI services, into products through prompt
    design, tool calling and structured outputs.
  - Build and maintain secure integrations with third-party
    platforms using REST APIs, webhooks and OAuth.
  - Deploy, monitor and maintain applications on Azure
    (mandatory), Railway and Vercel.
  - Engage with international clients to gather requirements,
    present solutions and ensure successful delivery.
  - Uphold engineering best practices through code reviews,
    testing and clear technical documentation.

  RequirementsRequired Qualifications

  - Core Requirements -
  - 2-3 years of professional software development experience,
    including production backend and frontend work.
  - Hands-on experience integrating LLM APIs such as Claude or
    Azure OpenAI.
  - Proven track record of delivering third-party integrations
    in production environments.
  - Strong proficiency in Python and Node.js. is a primary skill
  - Demonstrated expertise in REST API design, including
    resource modelling, authentication, versioning, error
    handling and pagination.
  - Solid experience building applications with React.js.
  - Practical experience deploying and operating services on
    Azure, including containerisation with Docker.Preferred
    Requirements -
  - Working knowledge of relational databases such as
    PostgreSQL.
  - Excellent written and verbal communication skills in
    English, with confidence engaging international clients.

  Preferred Qualifications

  - Experience with retrieval-augmented generation (RAG) and
    vector search.
  - Proficiency in TypeScript.
  - Bachelor's degree in Computer Science, Engineering or a
    related field.

  Key Attributes

  - Strong analytical and problem-solving ability.
  - Self-motivated, with a high degree of ownership and
    accountability.
  - Quick to learn and adapt to new tools in a rapidly evolving
    AI landscape.
  - Professional, client-focused approach to communication and
    delivery.

  BenefitsWhat We Offer

  - Competitive compensation aligned with experience and market
    standards.
  - Comprehensive group health insurance
  - Employee friendly and statutory leave benefits.
  - Hybrid working with flexibility across our India locations.
  - Access to leading AI tools and platforms, including Claude
    and Azure AI.
  - Learning and certification support to grow your technical
    expertise.
  - Direct exposure to international clients and global delivery
    teams.
  - A clear career path into senior engineering, technical lead
    and solutions architecture roles.
  - A collaborative, multicultural team environment across
    multiple countries.
