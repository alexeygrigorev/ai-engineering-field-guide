description: |
  Summary

  We are seeking an experienced SAP ABAP Cloud Developer with
  a specialized focus on AI-native solutions to join our IT
  Services division. This pivotal role involves architecting
  and implementing robust enterprise applications that
  leverage the SAP Business Technology Platform (BTP) and
  integrate advanced artificial intelligence capabilities. The
  ideal candidate will drive innovation by embedding AI
  services, managing event-driven architectures, and ensuring
  strict adherence to Clean Core principles while maintaining
  the highest standards of enterprise security. This position
  is critical for modernizing our digital landscape and
  delivering scalable, intelligent solutions that meet complex
  business demands.

  Responsibilities

  - Design and develop cloud-native applications using SAP ABAP
    Cloud, ensuring alignment with Clean Core principles to
    minimize custom code in the core system.
  - Architect and implement secure authorization frameworks and
    enterprise security protocols to protect sensitive
    business data and ensure compliance.
  - Develop and manage enterprise APIs and eventing services to
    facilitate seamless communication between systems and
    external applications.
  - Integrate Large Language Models (LLM) and AI services into
    SAP solutions, utilizing the Agent Framework for advanced
    orchestration and automation.
  - Implement vector databases and semantic search capabilities
    to enhance data retrieval and enable intelligent query
    processing within the application layer.
  - Leverage SAP BTP and cloud services to build scalable,
    resilient solutions that support next-generation business
    processes.

  Requirements

  Requirements:

  - Possess 8 to 12 years of professional experience in software
    development, with a strong background in the IT Services
    sector.
  - Demonstrate expert-level proficiency in SAP ABAP Cloud and a
    deep understanding of Clean Core architecture.
  - Have proven experience working with SAP Business Technology
    Platform (BTP) and associated cloud services.
  - Show strong competency in implementing Enterprise Security
    and Authorization models.
  - Be skilled in developing Eventing services and Enterprise
    APIs for robust system integration.
  - Possess hands-on experience with Agent Frameworks, AI
    orchestration, and integrating LLMs and AI services.
  - Understand the principles of Vector Databases and their
    application in semantic search scenarios.
  - Target salary expectation is in the range of ₹15 to 18 Lakhs
    Per Annum.
