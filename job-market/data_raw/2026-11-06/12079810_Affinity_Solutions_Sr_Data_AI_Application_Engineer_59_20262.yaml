description: |
  Affinity Solutions (Affinity) is the leading consumer
  purchase insights company. We provide a complete view of
  U.S. and U.K. consumer spending, across and between brands,
  via exclusive access to fully permissioned data from over
  100 million consumers. Our proprietary AI technology,
  Comet™, transforms these purchase signals into actionable
  insights for business and marketing leaders to drive optimal
  outcomes and build lasting customer relationships. Visit
  www.affinitysolutions.com to discover how we’re shaping the
  future of consumer purchase insights.

  About Your Role:

  We are hiring a Sr. Data & AI Application Engineer to drive
  the architecture and development of a unified platform for
  Insights, Audience Building, and Measurement powered by
  large-scale data and AI. This is a hands-on leadership role
  where you will own system design decisions and build
  production-grade applications that integrate with modern
  data platforms and third-party SaaS tools.

  Your Responsibilities:

  - Lead front-end architecture and development using React and
    Next.js (Node.js)
  - Design and implement enterprise-grade systems integrating
    with third-party platforms (e.g., Snowflake, ThoughtSpot)
  - Build and manage data pipelines, Snowflake clean rooms, and
    semantic layers
  - Develop AI-powered applications, including chatbots, MCP
    integrations, and API-connected tools
  - Support audience modeling workflows including model
    training, scoring, calibration, and enrichment
  - Build measurement frameworks and embedded BI dashboards
    (e.g., ThoughtSpot)
  - Execute custom analytics requests: segmentation, overlap
    analysis, behavioral profiling, and ad hoc data pulls
  - Prototype R&D initiatives in privacy-preserving technologies
    and AI agent orchestration
  - Establish engineering standards, contribute to code quality,
    and guide architectural decisions
  - Manage development processes using Git/Bitbucket and JIRA
    branching workflows

  Your Qualifications:

  - BS or MS in Computer Science, Data Science, or Information
    Systems
  - 6–8 years of proven experience architecting and shipping an
    enterprise-level application with a polished UI and
    dependencies on embedded/third-party SaaS services
  - 3–6 years experience with Node.js, Next.js, and React
  - Strong SQL expertise including CTEs, window functions, and
    complex aggregations
  - 3–6 years of Python experience (data processing, scripting,
    APIs, OOP)
  - Experience with cloud data platforms (Snowflake, BigQuery,
    or Redshift)
  - At least 3 years building REST APIs and data pipelines
  - Familiarity with authentication/SSO systems (e.g., AWS
    Cognito)

  Preferred:

  - Experience with GenAI developer tools (e.g., Copilot,
    Cursor, Claude Code) or agent frameworks
  - Hands-on experience with Snowflake Cortex, Snowpark, or
    Streamlit
  - Familiarity with LLM APIs (OpenAI, Anthropic Claude) and
    prompt patterns
  - Experience with ML models (classification, feature
    engineering, calibration techniques)
  - Knowledge of data privacy frameworks (clean rooms,
    differential privacy, PETs)
  - Experience with Slack Bolt, AWS EC2, and deploying Python
    services
  - Familiarity with MCP servers or AI agent orchestration
  - Experience analyzing large-scale datasets (100M+ rows)
  - Background in AdTech, MarTech, audience segmentation, or
    marketing analytics

  Tech Stack:

  Snowflake, Snowpark, Snowflake Cortex, Streamlit, Python,
  SQL, ThoughtSpot, Next.js, React, Node.js, AWS Cognito,
  Claude API, MCP, Slack Bolt, AWS EC2, Bitbucket, JIRA, GenAI
  tools

  Salary Range: $165,000 – $180,000 Office Hours: 9am – 5:30pm

  Benefits for full-time employees of Affinity Solutions begin
  on the first of the month following your date of hire with a
  generous employer contribution for medical, dental, and
  vision. In addition to company paid holidays, wellness time
  off, other wellness benefits, and employee discounts, you
  will also get employer paid life insurance and have the
  option to enroll into an employer-matched 401K Plan. We
  strongly encourage work/life balance by providing unlimited
  vacation days, available starting 90 days from your hire
  date as a team member.
