description: |
  OneOrigin, where innovation meets imagination! Based in
  Scottsdale, AZ and Bangalore, India, we’re on a mission to
  harness the power of AI to transform the way Higher
  Education

  institutions operate. Our cutting-edge software solutions
  streamline administrative processes, enhance student
  engagement, and empower data-driven decision-making.

  Whether it’s automating tasks, providing actionable
  insights, or improving learning outcomes, we make AI
  accessible and impactful for colleges and universities.

  What You'll Do

  - Operate and improve AI prospecting agents: account research,
    intent signal detection, ICP scoring, sequence generation
  - Craft targeted outreach — AI drafts v1, you add judgment,
    personalization, and human context
  - Qualify meetings for the Revenue Architect; learn to run
    early discovery calls independently
  - Handle inbound customer queries with speed and clarity —
    you're the first human a customer talks to after the agent
  - Learn the product deeply; surface upsell signals to the
    Revenue Architect from customer conversations
  - Build and maintain lead intelligence dashboards using AI
    aggregation (competitor moves, hiring signals, funding
    events)
  - Track what works: measure response rates, A/B test
    messaging, feed wins back into the AI stack

  You Should Have

  - Coachable, resilient, high-activity with high quality — not
    one or the other
  - Strong written communication in English (US-facing)
  - Comfort with AI tools — you're the generation that grew up
    with ChatGPT; now productionize that instinct
  - Curiosity about how sales systems work, not just how to make
    calls
