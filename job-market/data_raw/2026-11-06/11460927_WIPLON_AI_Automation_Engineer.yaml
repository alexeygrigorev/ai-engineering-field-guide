description: |
  WIPL is looking for an enthusiastic AI Automation &
  Integration Associate who is passionate about using AI to
  simplify work, connect applications, and build smarter
  business processes.

  The role will focus on identifying opportunities for
  automation across the organization and using tried-and-
  tested AI and automation tools to integrate WIPL's existing
  applications, reduce manual effort, and improve
  productivity.

  Key Responsibilities

  - Identify repetitive/manual processes that can be automated
    using AI.
  - Integrate existing business applications and create seamless
    automated workflows.
  - Build and test automations using tools such as n8n, Make,
    Zapier, AI APIs, Python and similar platforms.
  - Explore and implement practical solutions using
    LLMs/Generative AI, AI agents and APIs.
  - Develop quick prototypes and convert successful ideas into
    reliable internal solutions.
  - Continuously explore new AI tools and identify innovative
    ways of applying them within the organization.

  What we're looking for

  A fresher or candidate with up to 1 year of experience who
  has a genuine interest in AI and automation. Hands-on
  experimentation through personal projects, internships,
  college projects or self-learning is welcome. We value
  curiosity, problem-solving ability and the enthusiasm to
  build and experiment with AI more than years of experience.

  Preferred Skills: Generative AI • AI Automation • Python •
  APIs • LLMs • Prompt Engineering • n8n/Make/Zapier •
  Application Integration • AI Agents • RAG

  The objective of the role: Use AI to connect, automate and
  continuously improve how WIPL works.
