description: |
  About this role

  Your team

  Aladdin is an end-to-end technology platform used by
  investment professionals to understand portfolios, manage
  risk, and make informed investment decisions. The Aladdin
  Platform team engineers and operates the foundational
  service layer that enables teams to build and deliver
  Aladdin products and features.

  The team develops platform capabilities spanning testing,
  security operations, developer tooling, and Continuous
  Integration and Continuous Delivery (CI/CD). We are
  modernizing our software factory to support both human
  developers and AI agents, with the ambition to enable a 10x
  increase in the velocity of change across the software
  delivery lifecycle. Our focus is simplifying how teams
  build, test, release, and operate software at scale while
  strengthening quality, reliability, and control.

  Your role and impact

  We are looking for a Product Manager to define and drive the
  evolution of our developer platform as the foundation of a
  modern software factory built for humans and AI agents. You
  will own product strategy, vision, roadmap, adoption, and
  measurable outcomes, partnering closely with engineering
  teams to address developer needs and enable agent-driven
  workflows.

  This role requires enough technical depth to understand the
  complete Software Development Life Cycle (SDLC), from
  development and testing through deployment, operations, and
  continuous improvement. Particular emphasis will be placed
  on CI/CD and modern software delivery practices. You will
  help evolve workflows, automation, and platform capabilities
  so humans and AI agents can contribute effectively across
  the lifecycle, with appropriate human oversight and
  production controls.

  You will combine developer insight, engineering strategy,
  and Aladdin's commercial priorities to determine what the
  platform should become and which problems should be solved
  first. Success means delivering capabilities that developers
  adopt because they simplify workflows, remove friction, and
  help Aladdin teams deliver software faster, more
  predictably, and with high quality.

  Your responsibilities

  In every role at BlackRock, you'll be expected to apply
  sound judgement and critical thinking to solve complex
  problems, adapt as the business evolves, and combine the
  curiosity to explore new approaches and technologies with
  the rigor to challenge the results. The scope of this role
  also includes the following responsibilities:

  - Own the product vision, strategy, roadmap, and key
    performance indicators for a core developer platform
    product, translating platform strategy, engineering
    priorities, commercial opportunities, and developer needs
    into clear product outcomes.
  - Partner deeply with engineering throughout the SDLC,
    defining and prioritizing capabilities that improve
    developer workflows across building, testing, integration,
    release, deployment, and operation of software.
  - Translate the ambition for 10x velocity of change into a
    prioritized modernization roadmap and measurable
    improvements in end-to-end delivery speed, throughput,
    quality, and reliability, removing bottlenecks across the
    software factory rather than accelerating coding alone.
  - Define and prioritize platform capabilities that support
    both human-led and agent-driven software delivery, using
    clear customer problems and measurable outcomes to guide
    AI investment, automation, and appropriate human
    oversight.
  - Build a strong community of internal developers and platform
    consumers, using research, feedback, product data, and
    adoption signals to understand customer needs, validate
    priorities, and measure product effectiveness.
  - Drive incremental delivery and adoption of platform
    capabilities across Aladdin engineering teams, managing
    cross-team dependencies and partnering with engineering
    and product organizations to mitigate delivery risks.
  - Influence senior stakeholders and partners around product
    direction, priorities, and trade-offs, connecting
    developer-platform investment to engineering outcomes and
    broader Aladdin opportunities.

  Your experience

  - 10+ years of experience in product management, engineering
    leadership, or platform leadership in a large-scale
    technology environment.
  - Product management experience owning technically complex
    platform products from vision and strategy through
    development, launch, adoption, and measurable outcomes.
  - Strong understanding of the end-to-end Software Development
    Life Cycle (SDLC), with particular depth in Continuous
    Integration and Continuous Delivery (CI/CD), DevOps
    practices, and modern software delivery workflows.
  - Ability to work at technical depth with engineering teams on
    developer-platform capabilities, translating developer
    needs, technical constraints, and architectural
    considerations into product requirements and priorities.
  - Demonstrated ability to navigate ambiguity, make informed
    trade-offs, use data to guide decisions, and drive
    iterative product delivery in a fast-moving environment.
  - Strong communication and influencing skills, with the
    ability to align engineering, product, and senior
    stakeholders across a geographically distributed, matrixed
    organization.
  - Strong analytical and data-driven product judgment;
    familiarity with Artificial Intelligence (AI) and its
    application to developer productivity or the software
    delivery lifecycle is preferred. A bachelor's degree in
    Computer Science, Engineering, or a related discipline is
    preferred.





  For New York, NY Only the salary range for this position is
  USD$215,000.00 - USD$275,000.00 . Additionally, employees
  are eligible for an annual discretionary bonus, and benefits
  including healthcare, leave benefits, and retirement
  benefits. BlackRock operates a pay-for-performance
  compensation philosophy and your total compensation may vary
  based on role, location, and firm, department and individual
  performance.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

