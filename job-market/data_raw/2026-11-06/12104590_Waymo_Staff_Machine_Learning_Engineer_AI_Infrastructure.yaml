description: |
  Waymo is an autonomous driving technology company with the
  mission to be the world's most trusted driver. Since its
  start as the Google Self-Driving Car Project in 2009, Waymo
  has focused on building the Waymo Driver—The World's Most
  Experienced Driver™—to improve access to mobility while
  saving thousands of lives now lost to traffic crashes. The
  Waymo Driver powers Waymo’s fully autonomous ride-hail
  service and can also be applied to a range of vehicle
  platforms and product use cases. The Waymo Driver has
  provided over ten million rider-only trips, enabled by its
  experience autonomously driving over 100 million miles on
  public roads and tens of billions in simulation across 15+
  U.S. states.

  The Driver Understanding and Evaluation (DUE) team at Waymo
  is developing rich metrics for understanding the behavior of
  the Waymo Driver in the real world, and technologies such as
  context and scene analysis to understand driving,
  understanding and augmenting real world driving data to
  generate rare driving events, build large scale data
  infrastructure, improve components such as agents and a
  realistic simulator. These technologies come together to
  drive the overall technical strategy and methodology used to
  evaluate the behavior of the Waymo Driver.

  The DUE Machine Learning team will build and operate
  scalable machine learning and data systems, simulation
  workflow and insight tools,  improve and speed up the
  evaluation and onboard developer journeys. It will combine
  expert human judgements and advanced machine learning models
  to deliver training and evaluation data for hundreds of
  metrics and components that make up the Waymo driver. We are
  looking for researchers and software engineers who are
  passionate about developing machine learning techniques for
  the Evaluation systems on our autonomous vehicles, and have
  an incessant drive to improve the performance of our
  technology stack.

  You will:

  - Lead the design and development of ML infrastructure that
    takes DUE models from data to training to production
    serving, including event detection models, triage
    foundation models, and agents.
  - Design and scale distributed systems for large-scale dataset
    generation, model training, and evaluation across Waymo's
    real-world and simulation data.
  - Own the reliability, efficiency, and observability of
    production ML serving, including accelerator capacity
    planning and performance optimization.
  - Keep offline evaluation and production inference consistent,
    so the models we evaluate are the models we serve.
  - Drive technical direction for the team, guide architectural
    decisions, and mentor engineers.
  - Collaborate with modeling, evaluation, and platform teams
    across Waymo to turn product and business goals into
    measurable technical deliverables.

  You have:

  - B.S. in Computer Science, Machine Learning, or a related
    technical field, or equivalent practical experience.
  - 7+ years of hands-on experience building machine learning
    systems.
  - Experience designing, scaling, training, deploying, and
    optimizing large-scale ML systems from data to model.
  - Strong coding experience in Python and/or C++.
  - Experience with ML frameworks such as JAX, TensorFlow, or
    PyTorch, including both the user-facing APIs and their
    internals.
  - Proven ability to set technical direction and influence
    partner teams in ambiguous problem spaces.

  We prefer:

  - M.S. or Ph.D. in Computer Science or a related field with a
    specialization in machine learning.
  - 10+ years of hands-on experience building production machine
    learning systems.
  - Experience serving ML models in production at scale,
    including low-latency inference on accelerators (TPU/GPU),
    SLOs, and safe model rollouts.
  - Technical leadership in serving production-quality models,
    including owning launches, reliability, and on-call for
    services that other teams depend on.
  - Experience with distributed training and accelerator
    performance profiling.
  - Experience in autonomous vehicles, robotics, or large-scale
    simulation.

  The expected base salary range for this full-time position
  across US locations is listed below. Actual starting pay
  will be based on job-related factors, including exact work
  location, experience, relevant training and education, and
  skill level. Your recruiter can share more about the
  specific salary range for the role location or, if the role
  can be performed remote, the specific salary range for your
  preferred location, during the hiring process.

  Waymo employees are also eligible to participate in Waymo’s
  discretionary annual bonus program, equity incentive plan,
  and generous Company benefits program, subject to
  eligibility requirements.

