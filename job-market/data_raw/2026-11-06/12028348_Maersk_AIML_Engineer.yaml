description: |
  Team/Opportunity:

  Data AI/ML (Artificial Intelligence and Machine Learning)
  Engineering involves the use of algorithms and statistical
  models to enable systems to analyze data, learn patterns,
  and make data-driven predictions or decisions without
  explicit human programming. AI/ML applications leverage vast
  amounts of data to identify insights, automate processes,
  and solve complex problems across a wide range of fields,
  including healthcare, finance, e-commerce, and more. AI/ML
  processes transform raw data into actionable intelligence,
  enabling automation, predictive analytics, and intelligent
  solutions. Data AI/ML combines advanced statistical
  modeling, computational power, and data engineering to build
  intelligent systems that can learn, adapt, and automate
  decisions.

  What you will do:

  - Design, develop, and implement robust, scalable, and
    optimized machine learning and deep learning models, with
    the ability to iterate with speed
  - Write and integrate automated tests alongside models or code
    to ensure reproducibility, scalability, and alignment with
    established quality standards
  - Implement best practices in security, pipeline automation,
    and error handling using programming and data manipulation
    tools
  - Identify and implement the right data-driven approaches to
    solve ambiguous and open-ended business problems,
    leveraging data engineering capabilities
  - Research and implement new models, technologies, and
    methodologies and integrate these into production systems,
    ensuring scalability and reliability
  - Apply creative problem-solving techniques to design
    innovative tools, develop algorithms and optimized
    workflows
  - Independently manage and optimize data solutions, perform
    A/B testing, evaluate performance and evaluate performance
    of systems
  - Understand technical tools and frameworks used by the team,
    including programming languages, libraries, and platforms
    and actively support debugging or refining code in
    projects
  - Contribute to the design and documentation of AI/ML
    solutions, clearly detailing methodologies, assumptions,
    and findings for future reference and cross-team
    collaboration
  - Collaborate across teams to develop and implement high-
    quality, scalable AI/ML solutions that align with business
    goals, address user needs, and improve performance

  Required skills:

  - Programming: Writing code to manipulate, analyze, and
    visualize data, often using languages like Python, R, and
    SQL.
  - AI & Machine Learning: Creating systems that can perform
    tasks that typically require human intelligence. Using
    Machine learning (ML), a subset of AI that uses algorithms
    to learn from and make predictions based on data.
  - Data Analysis: Inspecting, cleansing, transforming, and
    modeling data to discover useful information, draw
    conclusions, and support decision-making.
  - Machine Learning Pipelines: Using automated workflows that
    manage the end-to-end process of training and deploying
    machine learning models.
  - Model Deployment: Making a trained machine learning model
    available for use in production environments.

  Specialized Skills:

  - Big Data Technologies: Using continuous integration and
    continuous delivery (CI/CD) pipelines to automate the
    process of software development, including building,
    testing, and deploying code
  - Natural Language Processing (NLP): Focusing on the
    interaction between computers and humans through natural
    language.
  - Data Architecture: Designing and structuring of data
    systems, ensuring that data is stored, managed, and
    utilized efficiently
  - Data Processing Frameworks: Using tools and libraries to
    process large data sets efficiently, such as Apache Hadoop
    and Apache Spark.
  - Technical Documentation: Creating and maintaining
    documentation that explains the functionality, use, and
    maintenance of software or systems.
  - Deep Learning: Using a subset of machine learning involving
    neural networks with many layers, used to model complex
    patterns in data.
  - Statistical Analysis: Collecting and analyzing data to
    identify patterns and trends, and to make informed
    decisions.
  - Data Engineering: Designing and building systems for
    collecting, storing, and analyzing data at scale.





