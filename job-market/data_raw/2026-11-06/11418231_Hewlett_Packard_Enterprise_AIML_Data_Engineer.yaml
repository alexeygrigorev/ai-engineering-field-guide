description: |
  AI/ML Data Engineer



  This role has been designed as 'Hybrid' with a requirement
  that you will work on average 2 days per week from an HPE
  office.

  Who We Are:

  Hewlett Packard Enterprise is the global edge-to-cloud
  company advancing the way people live and work. We help
  companies connect, protect, analyze, and act on their data
  and applications wherever they live, from edge to cloud, so
  they can turn insights into outcomes at the speed required
  to thrive in today’s complex world. Our culture thrives on
  finding new and better ways to accelerate what’s next. We
  know varied backgrounds are valued and succeed here. We have
  the flexibility to manage our work and personal needs. We
  make bold moves, together, and are a force for good. If you
  are looking to stretch and grow your career our culture will
  embrace you. Open up opportunities with HPE.

  Job Description:



  At HPE Networking, the Digital Experience & Automation (DEA)
  team is reimagining how people experience support and
  services in a digital‑first world - setting new standards
  for the future of networking.

  We enable customers, partners, and employees through
  AI‑driven tools and modern platforms, transforming support
  into a unified, efficient, and simple experience that drives
  measurable value. Our mission is grounded in innovation with
  purpose: applying automation, AI, and data‑driven insights
  to simplify journeys, reduce friction, and create meaningful
  outcomes at every touchpoint.

  DEA’s charter is to discover, evaluate, and scale solutions
  that embed intelligent technology into every interaction -
  delivering proactive and predictive experiences that shorten
  resolution times and accelerate task completion. By
  modernizing processes and accelerating self‑service, we help
  shift support from reactive to truly anticipatory.

  We partner closely with technology providers, engineering,
  and business teams to deliver seamless omnichannel
  experiences and enable business transformation through data
  engineering, process optimization, and automation. Our work
  is fueled by a passion for self‑service, intelligent
  automation, and building digital experiences that are
  intuitive, scalable, and human‑centric.

  What you'll do:

   Responsibilities:

   Develop, maintain, and optimize data pipelines and
  workflows and Feature Store to ensure seamless data
  ingestion and transformation as a scalable data solution.

  - Design, develop,  implement, and architect Data Engineering
    pipelines, considering performance & scalability including
    data storage and processing.
  - Implement advanced data transformations and quality checks
    to ensure data accuracy, completeness, security and
    consistency of data.
  - Seamlessly integrate data from diverse sources, for data
    ingestion, transformation and storage, leveraging AWS S3
    Storage and possibly Snowflake as a SQL Data Warehouse.
  - Create and implement advanced data models and schemas and
    ensure data governance and data management best practices.

  What you need to bring:

  Qualification and Desired Experiences:

  - 5+ years of data analysis and engineering experience
  - Bachelor’s degree in computer science, Statistics,
    Informatics, Information Systems or another quantitative
    field.
  - Working knowledge of API or Stream-based data extraction
    processes like Salesforce API and Bulk API and have hands-
    on experience in web crawling.

  Primary Tech skills:

  - Advanced Web-crawling & scraping methods and tools
  - Building end-end Data Engineering pipelines for Semi and
    unstructured data (Text, all kinds of simple/complex table
    structures, images, video and audio data)
  - Python, Pyspark, SQL, RDBMS
  - Data Transformation (ETL/ELT) activities
  - SQL Data warehouse (e.g. Snowflake) working / preferably
    administration

  Secondary Tech skills:

  - Databricks
  - Familiarity with AWS services: S3, Glue, EMR, EC2, RDS,
    monitoring and IAM
  - Kafka, Spark & Kafka Streaming
  - Workflow automation (e.g. using Github actions)
  - Performing RCA

  Personal Skills:

  - Ability to collaborate cross-functionally and build sound
    working relationships within all levels of the
    organization
  - Ability to handle sensitive information with keen attention
    to detail and accuracy. Passion for data handling ethics.
  - Effective time management skills and ability to solve
    complex technical problems with creative solutions while
    anticipating stakeholder needs and helping meet or exceed
    expectations
  - Comfortable with ambiguity and uncertainty of change when
    assessing needs for stakeholders
  - Self-motivated and innovative; confident when working
    independently, but an excellent team player with a growth-
    oriented personality

