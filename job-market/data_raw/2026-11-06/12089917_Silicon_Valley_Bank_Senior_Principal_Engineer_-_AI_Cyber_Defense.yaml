description: |
  FC Global Services India LLP (First Citizens India), a part
  of First Citizens BancShares, Inc., a top 20 U.S. financial
  institution, is a global capability center (GCC) based in
  Bengaluru. Our India-based teams benefit from the company’s
  over 125-year legacy of strength and stability. First
  Citizens India is responsible for delivering value and
  managing risks for our lines of business. We are
  particularly proud of our strong, relationship-driven
  culture and our long-term approach, which are deeply
  ingrained in our talented workforce. This is evident across
  all key areas of our operations, including Technology,
  Enterprise Operations, Finance, Cybersecurity, Risk
  Management, and Credit Administration. We are seeking
  talented individuals to join us in our mission of providing
  solutions fit for our clients’ greatest ambitions.

  Job Description:

  Value Proposition

  Be part of a forward-looking cybersecurity team leveraging
  AI and machine learning to enable intelligent threat
  prevention, proactive protection, and predictive defense
  across enterprise environments.

  Job Details:

  Position Title: Senior Principal Cyber AI Expert – P5 Career
  Level: Senior Principal - AI Cyber Security Engineer Job
  Category: Associate Director Role Type: Hybrid Job Location:
  Bangalore

   About the Team:

  The Cybersecurity Analytics and Engineering team focuses on
  leveraging enterprise telemetry, advanced analytics, and
  AI/ML capabilities to build intelligent, proactive security
  systems. The team works closely with SOC, Perimeter Defense,
  and Threat Intelligence teams to deliver end-to-end security
  lifecycle capabilities spanning prevention, protection,
  detection, and response, while maximizing the value of
  existing security platforms.

  Impact:

  This strategic role will drive the adoption and optimization
  of AI/ML-powered security capabilities by leveraging both
  built-in AI features within existing tools and custom-
  developed models. The role will improve threat prevention,
  protection, and detection, enable predictive insights, and
  defend against AI-driven cyber threats, significantly
  enhancing enterprise cyber resilience and operational
  efficiency.

  Key Deliverables (Duties and Responsibilities)

  - Design and develop AI/ML models for cybersecurity use cases
    including anomaly detection, threat prediction, and
    behavioral analytics.
  - Leverage AI/ML capabilities embedded within existing
    security tools (SIEM, SOAR, XDR, EDR, firewalls, DLP,
    etc.) to maximize detection, prevention, and protection
    outcomes.
  - Identify and enable additional AI modules, plugins, or
    advanced features within security platforms to enhance
    capabilities.
  - Drive proactive threat prevention by identifying attack
    patterns, early signals, and adversary behaviors using
    predictive analytics.
  - Build AI-driven protection mechanisms such as automated
    blocking, adaptive controls, and risk-based access
    enforcement.
  - Strengthen defenses against AI-driven cyber threats
    including automated attacks, deepfake-based fraud,
    adversarial AI, and model evasion techniques.
  - Improve detection accuracy and reduce false positives
    through model tuning, correlation, and intelligent
    enrichment.
  - Integrate AI capabilities with SIEM, SOAR, XDR, and
    perimeter/security platforms for real-time, automated
    protection and response.
  - Develop intelligent automation workflows to reduce response
    time and enable self-healing security operations.
  - Collaborate with SOC and engineering teams to operationalize
    AI-driven prevention and protection use cases.
  - Perform data engineering and feature engineering to enable
    high-quality model training and analytics.
  - Continuously enhance models using feedback loops,
    adversarial testing, and threat intelligence inputs.
  - Ensure governance, explain ability, and responsible use of
    AI in cybersecurity.
  - Maintain documentation including models, integrations,
    playbooks, and performance metrics.

  Skills and Qualification (Functional and Technical Skills)

  Functional Skills:

  - Strong expertise in applying AI/ML across prevention,
    protection, detection, and response domains.
  - Ability to maximize value from existing security toolsets by
    leveraging embedded AI capabilities.
  - Strong understanding of emerging AI-driven threats and
    mitigation strategies.
  - Excellent analytical mindset with focus on data-driven and
    AI-assisted decision-making.
  - Strong collaboration skills across SOC, engineering, and
    threat intelligence teams.

  Technical/Business Skills:

  - 15+ years of experience in cybersecurity, with strong
    exposure to AI/ML applications.
  - Hands-on experience with machine learning frameworks
    (TensorFlow, PyTorch, Scikit-learn).
  - Strong programming skills in Python, data engineering, and
    model development.
  - Experience with SIEM, SOAR, XDR, EDR, and modern security
    platforms with embedded AI capabilities.
  - Knowledge of advanced analytics techniques (anomaly
    detection, classification, clustering, NLP).
  - Strong understanding of network, endpoint, identity, and
    perimeter security domains.
  - Experience predictive and preventive security models and
    controls.
  - Familiarity with UEBA and behavioral analytics tools.
  - Knowledge of MLOps practices, model deployment, monitoring,
    and lifecycle management.
  - Understanding of adversarial AI risks (evasion, poisoning,
    model bypass) and mitigation techniques.
  - Experience with automation frameworks, APIs, and platform
    integrations.

  Leadership Qualities

  - Acts as a thought leader in AI-driven cybersecurity,
    especially in prevention and protection domains.
  - Demonstrates ownership in building intelligent, scalable
    security capabilities.
  - Drives innovation by combining existing tool capabilities
    with custom AI enhancements.
  - Mentors teams on AI/ML adoption and best practices in
    cybersecurity.
  - Proactively evaluates emerging AI threats and defensive
    strategies.

  Relationships & Collaboration

  - Collaborates with SOC, Perimeter Security, Threat
    Intelligence, and Data Engineering teams.
  - Partners with platform owners to optimize and extend AI
    capabilities of existing security tools.
  - Works with risk and compliance teams to ensure governance
    and responsible AI usage.
  - Engages with vendors to evaluate AI-enabled security
    solutions and enhancements.

