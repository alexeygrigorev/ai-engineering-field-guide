description: |
  The Opportunity As a Tax Innovation - AI Engineer you will
  design and develop AI and machine learning solutions that
  support data-driven decision making and business growth,
  within our General Tax Consulting practice. As a Director
  you will set strategic direction, lead business development
  efforts, and guide multiple initiatives while shaping client
  relationships and mentoring future leaders. In this role at
  PwC, you will apply data, algorithms, and software
  engineering to build scalable AI systems, translate ideas
  into practical solutions, and help advance technology use
  across tax-focused client work. Responsibilities
  - Setting strategic direction for artificial intelligence
    engineering solutions that support tax innovation
    initiatives
  - Leading client-facing AI engagements from concept through
    deployment, translating business needs into scalable
    technical approaches
  - Designing and implementing machine learning, deep learning,
    and natural language processing models for tax and data
    use cases
  - Overseeing data wrangling, feature development, model
    tuning, and integration of AI systems into software
    platforms
  - Developing Python-based engineering solutions that support
    text analytics, text extraction, and sentiment analysis
    workflows
  - Advising on AI implementation approaches that balance
    technical feasibility, scalability, and business value
  - Building executive relationships and identifying new
    opportunities for AI-driven services across client
    organizations
  - Promoting responsible use of open source software and
    emerging AI technologies within delivery teams
  - Mentoring teams in analytical thinking, creativity, and
    innovation while shaping technical direction across
    multiple initiatives
  - Validating adherence to professional standards, code of
    conduct, and independence requirements in client work
  What You Must Have
  - At least a Bachelor's degree
  - At least 9 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating AI engineering leadership in tax-focused
    client settings
  - Applying machine learning and cloud platforms to client
    solutions
  - Translating tax requirements into AI-enabled technical
    designs
  - Guiding teams through innovation, governance, and delivery
    choices
  - Developing thought leadership on emerging tax automation
    approaches
  The salary range for this position is: $150,000 - $438,000.
