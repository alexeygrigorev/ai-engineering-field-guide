description: |
  About Workato

  Workato is the leading Control and Execution Platform for
  Enterprise AI — the neutral platform enterprises trust to
  put AI to work across their business. Workato unifies data,
  applications, and processes into a single platform so AI can
  reliably orchestrate business processes in production at
  enterprise scale. Built on more than a decade of running
  mission-critical processes for over half the Fortune 500 —
  including Nasdaq, Amazon, Cisco, Vodafone, Atlassian, and
  Lucid Motors — Workato turns over 14,000 enterprise systems
  AI needs to act on into one governed execution layer. For
  more information, visit workato.com.

  Why join us?

  Ultimately, Workato believes in fostering a flexible, trust-
  oriented culture that empowers everyone to take full
  ownership of their roles. We are driven by innovation and
  looking for team players who want to actively build our
  company.

  But, we also believe in balancing productivity with self-
  care. That’s why we offer all of our employees a vibrant and
  dynamic work environment along with a multitude of benefits
  they can enjoy inside and outside of their work lives.

  If this sounds right up your alley, please submit an
  application. We look forward to getting to know you!

  Also, feel free to check out why:

  - Business Insider named us an “enterprise startup to bet your
    career on”
  - Forbes’ Cloud 100 recognized us as one of the top 100
    private cloud companies in the world
  - Deloitte Tech Fast 500 ranked us as the 17th fastest growing
    tech company in the Bay Area, and 96th in North America
  - Quartz ranked us the #1 best company for remote workers

  Responsibilities

  We seek an exceptional Senior Go Engineer to join the
  Workato Genie team. In this role, you will be responsible
  for developing mission-critical features and services for
  the Workato platform, including AI chatbot dispatching and
  balancing synchronous and asynchronous AI execution. In this
  role, you will also be responsible to:

  - Build high-performance gateways and routing components
  - Build server-side infrastructure for logging and monitoring
  - Work closely with Infra and SRE teams to ensure high
    availability and scalability requirements are addressed
  - Collaborate closely with the AI team to design and implement
    innovative features for a new AI assistant, ensuring
    cutting-edge performance and user experience.
  - Contribute at all phases of the development lifecycle
  - Write well-designed, testable, efficient code
  - Evaluate and propose improvements to the existing system
  - Support continuous improvement by investigating alternatives
    and technologies and presenting these for architectural
    review

  RequirementsQualifications / Experience / Technical Skills

  - BS/MS degree in Computer Science, Engineering, or a related
    subject
  - 8+ years of industry experience
  - Strong experience with Go language at backend (4+ years)
  - Excellent debugging, analytical, problem-solving, and social
    skills
  - Good understanding of all building blocks of large web
    applications: databases, load balancers, application
    servers, message brokers, caching, monitoring, etc.
  - Experience with building and scaling distributed, highly
    available systems
  - Experience in Ruby on Rails is a plus
  - Contributions to open-source projects are a big plus
  - Understanding of possible bottlenecks in a code and a
    solution in general
  - At least basic knowledge of Kubernetes concepts and
    configuration

  Nice to Haves

  - Experience with Docker and other isolation technologies
  - Experience with Redis-based caching
  - Experience with public cloud infrastructure providers
    (AWS/Azure/Google Cloud)
  - Experience in related fields (DevOps, ML, DBA, Enterprise
    applications, etc)
  - Experience with third-party REST APIs at scale (request
    throttling, batch processing, etc)

  Soft Skills / Personal Characteristics

  - Readiness to work remotely with teams distributed across the
    world and timezones
  - Spoken English (at a level enough to pass technical
    interviews and work with colleagues)
  - Open to new technologies and willing to experiment
  - Full-cycle product feature delivery mindset (from design to
    production and maintenance).

