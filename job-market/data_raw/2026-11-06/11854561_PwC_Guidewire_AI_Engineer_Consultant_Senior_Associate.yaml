title: Guidewire AI Engineer Consultant, Senior Associate
company: PwC
location: Los Angeles, USA
work_type: FULL_TIME
description: |
  The Opportunity As a Guidewire AI Engineer Consultant,
  Senior Associate you will specialize in designing, coding,
  testing, and tailoring Guidewire-based applications that
  help insurance organizations improve policy, claims, and
  billing processes within our Advisory practice. As a Senior
  Associate you will analyze complex problems, manage assigned
  workstreams, build client relationships, and guide junior
  team members while using critical thinking, technical
  skills, and business context to deliver work that aligns
  with project goals. In this role at PwC, you will contribute
  to application consulting engagements, bring a client-
  focused mindset to changing priorities, and support the
  development of solutions that help clients improve
  operational efficiency and application use. Responsibilities
  - Designing and customizing Guidewire applications to support
    policy, billing, and claims workflows for insurance
    clients
  - Developing AI-enabled solutions and integrating automation
    capabilities into Guidewire environments
  - Coding, testing, and troubleshooting application components
    across configuration, integration, and deployment
    activities
  - Translating client requirements into technical solutions
    that support operational efficiency and digital
    transformation
  - Interpreting data and system behavior to inform
    enhancements, issue resolution, and implementation
    decisions
  - Applying software development methods, system design skills,
    and digital tooling to deliver assigned workstreams
  - Reviewing deliverables from junior team members and
    providing guidance on technical tasks and problem solving
  - Building client relationships through responsive
    communication, issue follow-up, and clear progress updates
  - Using Guidewire BillingCenter, ClaimCenter, PolicyCenter,
    and integration skills to support platform modernization
    and optimization
  - Contributing to solution design discussions by bringing
    critical thinking and awareness of insurance business
    context
  What You Must Have
  - At least a Bachelor's degree
  - At least 3 years of experience
  What Sets You Apart
  - Preference for a Master's or Masters of Business
    Administration degree in at least one of the following
    fields of study: Actuarial Science, Business
    Administration/Management, Business Analytics, Commerce,
    Computer and Information Science, Computer Applications,
    Computer Engineering, Computer Engineering & Accounting,
    Data Processing/Analytics/Science, Economics, Electrical
    Engineering, Engineering, Engineering and Business,
    Finance, Information Technology, Management Information
    Systems, Mathematics, Mechanical Engineering, Operations
    Management/Research, Risk Management, Software App,
    Statistics
  - Demonstrating Guidewire BillingCenter, ClaimCenter, or
    PolicyCenter configuration skills
  - Applying Guidewire integration skills across insurance
    technology transformations
  - Interpreting data to shape client insights and
    recommendations
  - Anticipating team and client needs in complex engagements
  - Using critical thinking to break down technical concepts;
    and
  - Upholding professional and technical standards while
    learning and adapting
