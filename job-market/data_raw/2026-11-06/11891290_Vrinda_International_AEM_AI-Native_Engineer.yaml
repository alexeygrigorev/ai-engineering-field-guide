description: |
  Summary

  We are seeking an experienced AEM AI-Native Engineer to lead
  the integration of advanced artificial intelligence
  capabilities within our IT Services ecosystem. This pivotal
  role focuses on leveraging Adobe's cutting-edge technologies
  to drive innovation in digital experience management. The
  successful candidate will bridge the gap between traditional
  content management and modern AI-driven workflows, ensuring
  scalable, secure, and intelligent solutions that enhance
  customer engagement and operational efficiency.

  Responsibilities

  - Architect and implement AI-native solutions utilizing Adobe
    Firefly, AEP, and AJO to transform content creation and
    delivery processes.
  - Develop and maintain robust applications using JavaScript
    and Python, ensuring seamless integration with Adobe APIs
    and microservices architectures.
  - Lead the deployment and management of containerized
    environments using Kubernetes and Docker to support
    scalable microservices.
  - Drive the adoption of AEM Edge Delivery Services (EDS) and
    AEM Sites to modernize digital front-ends and improve
    performance.
  - Facilitate Agile/Scrum delivery cycles, ensuring timely and
    high-quality release of features and enhancements.
  - Provide technical mentorship and leadership to development
    teams, fostering a culture of continuous learning and best
    practices in AI-assisted development.
  - Collaborate with cross-functional teams to define
    requirements and design LLM-integrated solutions that
    align with business objectives.

  Requirements

  Requirements:

  - Possess 8 to 12 years of professional experience in software
    engineering, specifically within the IT Services sector.
  - Demonstrate deep proficiency in JavaScript and Python
    programming languages.
  - Have extensive hands-on experience with Adobe Experience
    Manager (AEM) Sites, including AEM Edge Delivery Services
    (EDS).
  - Show proven expertise in managing Adobe APIs, particularly
    Firefly, AEP, and AJO.
  - Exhibit strong skills in containerization technologies such
    as Kubernetes and Docker, along with a solid understanding
    of microservices architecture.
  - Be well-versed in AI-assisted development methodologies and
    the integration of Large Language Model (LLM) APIs.
  - Display a track record of successful Agile/Scrum project
    delivery and team leadership.
  - Offer competitive salary expectations ranging from ₹18 to
    ₹22 LPA.
