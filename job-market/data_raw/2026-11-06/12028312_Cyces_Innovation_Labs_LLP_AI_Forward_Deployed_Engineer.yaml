description: |
  Job Overview

  We are looking for an AI Forward Deployed Engineer to bridge
  the gap between AI engineering and real-world business
  problems. You will work closely with clients and internal
  teams to build, prototype, and deploy AI-powered
  applications, LLM solutions, and intelligent agentic
  workflows. The role requires strong backend engineering
  skills, problem-solving abilities, and the ability to take
  AI solutions from concept to production.

  Requirements

  - Strong hands-on experience in backend development using
    Python,  TypeScript/Node.js, with expertise in REST APIs,
    microservices, and enterprise integrations.
  - Experience in building LLM-powered applications, AI agents,
    agentic workflows, and AI orchestration.
  - Hands-on knowledge of prompt engineering, context
    engineering, RAG,  vector databases, and LLM API
    integrations.
  - Proficiency in databases, asynchronous programming, testing,
    Git, Dockerization, and production deployment.
  - Ability to build rapid prototypes and Proofs of Concept
    (PoCs), and scale successful solutions into production-
    ready applications.
  - Strong problem-solving, stakeholder communication, and
    cross-functional collaboration skills.

  Requirements

  Qualifications

  - 4 - 6 years of experience in software engineering, backend
    development, application development, or related roles.
  - Strong programming and software engineering fundamentals,
    with hands-on experience delivering end-to-end
    applications.
  - Proven experience integrating AI capabilities into backend
    systems and enterprise applications.
  - Experience with Docker, Kubernetes, and cloud-native
    development.
  - Familiarity with agent frameworks such as LangChain,
    LlamaIndex, or Semantic Kernel, and Model Context Protocol
    (MCP).
  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - Experience in AI platform engineering, MLOps/LLMOps, or
    technical mentoring is an added advantage.
