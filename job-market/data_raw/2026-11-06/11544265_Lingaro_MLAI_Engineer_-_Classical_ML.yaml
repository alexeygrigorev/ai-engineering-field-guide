description: |
  Role: ML/AI Engineer

  Location: India, Remote

  Lingaro Group is the end-to-end data services partner to
  global brands and enterprises. We lead our clients through
  their data journey, from strategy through development to
  operations and adoption, helping them to realize the full
  value of their data.

  Since 2008, Lingaro has been recognized by clients and
  global research and advisory firms for innovation,
  technology excellence, and the consistent delivery of
  highest-quality data services. Our commitment to data
  excellence has created an environment that attracts the
  brightest global data talent to our team.

  What You'll Be Doing:

  - Develop and maintain production ML pipelines using Python
    and Spark/PySpark.
  - Build, deploy, and support MLbased recommendation systems
    and ranking models.
  - Work with Databricks and Unity Catalog for data and ML
    workflows.
  - Use MLflow for experiment tracking and model lifecycle
    management.
  - Monitor model performance and identify data drift and model
    drift.
  - Implement model governance and production monitoring
    practices.
  - Work with SQL and structured data to support ML solutions.
  - Collaborate with data engineers, data scientists, and
    stakeholders to deliver reliable ML solutions.

  What We're Looking For:

  - Minimum 6 years of relevant experience in machine learning
    engineering or a related role.
  - Strong Python programming skills.
  - Mandatory handson experience with Databricks.
  - Practical experience with production ML pipelines.
  - Handson experience with Spark/PySpark.
  - Experience with production recommendation systems.
  - Knowledge of MLflow and model lifecycle management.
  - Understanding of model monitoring, data drift, model drift,
    and model governance.
  - Strong SQL skills.
  - Experience with LightGBM (LGBM), XGBoost, or other
    gradientboosting algorithms.
  - Experience with Unity Catalog.
  - Familiarity with star schema and data warehousing concepts.
  - Experience with ranking and personalization models.

  We Offer:

  Missing one or two of these qualifications? We still want to
  hear from you! If you bring a positive mindset, we'll
  provide an environment where you feel valued and empowered
  to learn and grow.
