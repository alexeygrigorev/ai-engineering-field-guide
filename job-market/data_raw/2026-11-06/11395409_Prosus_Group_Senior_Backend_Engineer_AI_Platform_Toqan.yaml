description: |
  Who We Are

  You've ordered dinner through Just Eat Takeaway. You've
  bought and sold on OLX. You've paid with PayU. Chances are,
  you've already used a Prosus company today.

  We are Prosus, a global technology company powering some of
  the world's leading lifestyle ecommerce businesses. Every
  day, billions of people across India, Latin America, Europe
  and beyond use our products and services to buy, sell, pay,
  connect and discover.

  Our AI-driven ecosystem spans 100+ companies across
  ecommerce, food delivery, fintech and experiences, serving
  billions of consumers worldwide. AI powers how we operate
  and innovate, with more than 60,000 active AI agents helping
  our teams build, scale and move faster. Through our
  investment team, we also back the founders and technologies
  shaping the future: From robotics and autonomous systems to
  synthetic biology and frontier AI.

  Guided by our five values Innovation, Results, People,
  Impact, and Entrepreneurship, culture is our competitive
  advantage. We thrive with experimentation; we build, we
  test, we learn, we iterate.

  Join us in shaping the future of technology at global scale.

  The Opportunity

  Toqan is Prosus's internal AI platform — the infrastructure
  and tooling layer that powers agentic AI-driven products
  across the entire group.We are building secure, configurable
  agent runtimes that can operate reliably at scale across
  different products, channels and use cases..

  You’ll work where distributed systems meet applied AI:
  orchestrating models and tools, enabling agents to perform
  long-running work, and turning rapidly evolving AI
  capabilities into dependable platform primitives. The
  challenges span asynchronous workflows, isolated execution,
  extensible integrations, reliability, observability and cost
  control.

  The Toqan platform serves the whole Prosus portfolio and
  other connected businesses, which means the backend systems
  you build here have reach far beyond a single team. You'll
  join a 12-person engineering team in Amsterdam and work
  closely with product, platform and AI colleagues to ship
  end-to-end — at pace, without compromising quality.

  Who You Are

  You are a senior backend engineer who has moved well past
  following patterns and into setting them. You're comfortable
  owning architectural decisions on novel infrastructure — the
  kind where the right answer isn't obvious and the stakes are
  real. You think in systems, spot failure modes early, and
  hold a high bar for production quality without letting
  perfect block good. The 80/20 mindset comes naturally: you
  know when to go deep and when to ship.

  You've likely come from a startup or high-velocity
  environment where shipping fast wasn't a culture slogan — it
  was survival. You know how to cut scope without cutting
  corners, move from zero to production without a safety net,
  and iterate quickly on systems that are still finding their
  shape.

  You're genuinely curious about the AI and LLM space — not as
  a trend to track, but as a domain where you've already done
  hands-on integration work and want to go further. AI tools
  aren't an afterthought in how you work — you use them daily,
  whether that's Claude Code, Cursor, GitHub Copilot, or
  OpenAI Codex, and you've developed real judgment about where
  they accelerate work and where they don't. You operate with
  low ego, share context freely, and thrive in an environment
  where autonomy and accountability go hand in hand. Ambiguity
  doesn't slow you down — it's where you do your best work.

  What You Bring

  - Strong Go programming skills with a track record of building
    and operating production backend services
  - Hands-on AWS experience — designing, deploying, and
    operating cloud-native services at scale
  - Experience integrating LLMs, AI models or tool-calling
    systems into production applications
  - Familiarity with agentic architectures and protocols such as
    MCP, A2A
  - A systems mindset, with attention to reliability,
    scalability, performance and security
  - Experience with CI/CD, automated testing and production
    observability
  - A record of working across product and platform teams to
    deliver outcomes end-to-end
  - Regular, thoughtful use of AI coding tools as part of your
    development workflow

  Nice to haves

  - Hands-on experience building agentic AI systems that use
    tools and execute multi-step workflows
  - Experience building or maintaining event-sourced systems
  - Python programming skills
  - Experience with AI or ML infrastructure and developer
    productivity tooling

  Your Typical Day

  No two days look exactly the same. You might design a new
  capability for the agent runtime, improve how models and
  tools are orchestrated, investigate a production reliability
  issue, or take an integration from an early prototype to a
  secure, observable service.

  You’ll spend much of your time building in Go, reviewing
  code and making architectural decisions with the team.
  You’ll also work closely with product, platform and AI
  colleagues to shape requirements, test ideas and ship them
  safely. Along the way, you’ll improve the testing,
  deployment and observability foundations that let the team
  move quickly with confidence.

  What We Offer

  - Global Impact: Play a crucial role in shaping the future of
    global commerce.
  - Growth Opportunities: Expand your expertise through diverse
    global challenges and unique opportunities.
  - Innovative Culture: Join a forward-thinking team that values
    strategic insights and fosters continuous innovation.
  - Creative Environment: Engage in work that encourages
    creativity and constant improvement.
  - Collaborative Atmosphere: Benefit from autonomy and self-
    management in a supportive and positive workspace.
  - Hybrid Work: Experience the satisfaction of our flexible
    model tailored to balance work and life.
  - Competitive Compensation: Enjoy a salary package that
    reflects your skills and contributions.
  - Comprehensive Benefits: From health and wellness to
    learning, commuting, and everyday perks, we offer a well-
    rounded package designed to help you thrive at work and
    beyond.

  Why Prosus?

  At Prosus, your colleagues include 60,000 AI agents… and
  your job is to figure out what that actually means. We're
  one of the largest operators of agentic AI on the planet,
  inside a $100B+ portfolio across 100+ companies and two
  billion people. The humans here own what AI can't do alone:
  judgment, creativity, and the call on what gets built next.

  Own the impact. Work the ecosystem. Earn your growth. Build
  with backing.

  Curious about our perks and benefits? Take a look at this
  page.

  Our Diversity & Inclusion Commitment

  We respect the dignity and human rights of individuals and
  communities wherever we operate in the world. Building an
  inclusive workplace where everyone feels welcome and can
  thrive is critical for us. We provide access to education,
  which helps everyone understand the important role they play
  and the positive impact they can have.

  Want to know more about life at Prosus? Explore our culture
  and values.
