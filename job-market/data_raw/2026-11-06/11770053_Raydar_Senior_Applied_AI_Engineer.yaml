title: Senior Applied AI Engineer
company: Raydar
location: USA
remote: true
work_type: FULL_TIME
description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Prototype and test new ways of applying generative AI inside
  business software, taking ideas from early experiments
  toward real product use. The work combines engineering
  depth, quantitative reasoning and product judgment, with
  ownership of projects from concept to delivery.

  What you'll do

  - Build quick proofs of concept to test how far AI can be
    taken within data-driven workflows.

  - Design automated systems that evaluate and improve model
    output with minimal manual input.

  - Explore methods for pushing the limits of AI-generated
    video, including more lifelike synthetic people.

  - Experiment with ways to generate image and brand assets that
    stay consistent with a given visual identity.

  - Tie experimental work to practical customer and product uses
    rather than academic publication.

  - Carry projects from early exploration through to execution.

  Requirements

  What we're looking for

  - A history of designing and growing server-side systems or
    sophisticated AI products, ideally starting from a blank
    slate.

  - Evidence of fast advancement toward lead or staff-level
    engineering responsibility at respected technology
    employers.

  - Time spent at fast-moving technology companies with strong
    peers.

  - Stable job history, with roles typically lasting about a
    year and a half or longer over the last four positions.

  - Solid engineering skills, especially in system architecture
    or probabilistic modeling, plus strong quantitative
    reasoning.

  - Good product instincts and a creative, experimental approach
    to applications built on large language models.

  - Curiosity and drive; prior hands-on work with LLMs is not
    required.

  Bonus points

  - Solid grounding in core machine learning and deep learning
    concepts.

  - Hands-on work with generative image or video technology.

  - Experience in data science, or in training and fine-tuning
    models.

  - A computer science degree from a highly selective
    university.

  Benefits

  Compensation and benefits

  - Base salary: USD 180,000 to 400,000 per year

  - Equity

  Location and work model

  - Remote (US or Canada)

  - Full-time
