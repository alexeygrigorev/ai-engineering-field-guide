description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  CrowdStrike is looking to hire an Engineer III to the
  TechOps SRE team with a focus on AI agent development and
  intelligent automation. We're looking for a technically
  curious, hands-on engineer who is eager to eliminate
  operational toil through the development and deployment of
  AI-driven automation systems. In this role, you will
  contribute to building intelligent agents capable of
  reasoning, decision-making, and self-healing across our
  large-scale, mission-critical distributed infrastructure,
  working alongside senior engineers and architects to grow
  your impact over time.

  If you're excited about the intersection of AI and
  infrastructure and want to build the next generation of
  autonomous operations tooling, let's talk.

  What You'll Do:

  - Contribute to the design and development of AI agents that
    autonomously detect, diagnose, and remediate operational
    issues across bare metal servers and virtual machines,
    helping reduce repetitive human toil
  - Identify and help eliminate TOIL by documenting manual
    operational workflows and contributing to intelligent,
    event-driven automation pipelines powered by LLMs and
    agentic frameworks (e.g., LangChain, AutoGen, CrewAI, or
    custom-built solutions)
  - Build and maintain agentic workflows that integrate with
    monitoring and telemetry stacks (ELK, Prometheus, Grafana)
    to support anomaly detection, incident analysis, and
    incident response
  - Support AI-assisted incident response systems by
    contributing to tooling that correlates signals across
    distributed systems and generates remediation
    recommendations
  - Support operational aspects of our platform including
    Availability, Latency, Throughput, Monitoring, and Issue
    Response, with a focus on automating routine tasks
  - Assist in instrumenting and evaluating agent performance,
    helping establish feedback loops that improve agent
    accuracy and reliability over time
  - Participate in incident analysis for operational events,
    leveraging AI tooling to help accelerate resolution and
    contribute to post-incident reviews
  - Collaborate with a globally distributed team of engineers to
    learn best practices, contribute to shared automation
    solutions, and grow your technical expertise
  - Gather and analyze metrics from operating systems and
    applications to help feed AI models and agents with high-
    quality signals for performance tuning and predictive
    operations
  - Write and maintain technical documentation for automation
    systems, agent workflows, and operational runbooks

  What You'll Need:

  - Bachelor's degree and/or equivalent experience in Computer
    Science, Engineering, or a related field
  - 5+ years of experience in software engineering, with
    exposure to systems and infrastructure concepts
  - 5+ years of hands-on experience in one or more of: Python,
    Go, Java, C++, with Python strongly preferred for AI/ML
    and agent development
  - Foundational experience or strong interest in building AI
    agents or LLM-powered automation, including prompt
    engineering, tool/function calling, and retrieval-
    augmented generation (RAG)
  - Familiarity with agentic frameworks such as LangChain,
    LlamaIndex, AutoGen, CrewAI, or equivalent
  - Exposure to integrating automation with operational tooling
    such as ticketing systems, monitoring platforms, or CI/CD
    pipelines
  - Working knowledge of Linux engineering and administration
  - Familiarity with infrastructure technologies such as Linux,
    VMware, Docker, Kubernetes, or related platforms
  - Familiarity with modern monitoring and telemetry stacks such
    as ELK, Prometheus, or Grafana
  - Familiarity with configuration management tools such as
    Puppet, Chef, Ansible, or equivalent
  - Solid understanding of software engineering fundamentals and
    a desire to learn distributed systems concepts
  - Solid understanding of Kubernetes
  - Strong analytical and problem-solving skills with a sense of
    ownership and curiosity
  - Ability to communicate clearly and collaborate effectively
    in a diverse, globally distributed, team-focused
    environment
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Experience with MLOps or AI observability tooling (e.g.,
    LangSmith, Weights & Biases, Arize)
  - Prior exposure to SRE, Platform Engineering, or DevOps
    practices and workflows
  - Experience contributing to self-healing infrastructure or
    autonomous remediation projects
  - Contributions to open-source AI or SRE tooling

  Why This Role:

  Operational toil is the enemy of innovation. In this role,
  you'll have the opportunity to grow alongside a team that is
  fundamentally changing how SRE operates at CrowdStrike,
  replacing manual, repetitive work with intelligent systems
  that learn, adapt, and act. You'll be at the intersection of
  AI and infrastructure at one of the most impactful
  cybersecurity companies in the world, with senior engineers
  and architects invested in your development.

