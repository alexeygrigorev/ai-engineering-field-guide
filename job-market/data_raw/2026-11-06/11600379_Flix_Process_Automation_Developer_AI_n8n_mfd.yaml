description: |
  At Flix, we offer a dynamic work environment with
  competitive pay, strong growth opportunities, and a tech-
  driven approach to making travel more accessible,
  sustainable, and affordable. 

  Our Global Accounting Process Excellence team is a small,
  high-impact team working at the intersection of finance
  operations and cutting-edge technology. We build real
  solutions — Python scripts, RPA workflows, AI agents — that
  save our global accounting teams hours of manual work every
  week.

  We're looking for a hands-on technical Business Analyst who
  loves building things, not just documenting them. You'll
  work directly with our global accounting teams (Germany,
  Sofia, Mexico) to understand their pain points and turn them
  into automated, AI-enabled solutions — using Python, RPA
  tools, and AI agents as your primary toolkit.

  You'll be the first direct report to our lead of Digital
  Process Automation function — a self-starter who thrives in
  ambiguity, takes ownership end-to-end, and is excited to be
  part of building something from the ground up.

  About the Role

  - Build automation solutions: Develop and deploy practical
    automations using Python, n8n, UiPath and approved AI
    technologies — including workflow logic, system
    integrations, and exception handling
  - Develop AI-enabled features: Build applied AI components
    using LLM services (Claude or equivalent), structured
    outputs, tool calling, and agent workflows — with clear,
    measurable business value
  - Create data processing pipelines: Write Python and SQL-based
    solutions for reconciliations, validations, data
    transformations, and operational controls
  - Integrate enterprise systems: Work with REST APIs, JSON,
    databases, files and connectors to integrate with
    enterprise systems such as Oracle Fusion and automate end-
    to-end processes
  - Use AI-assisted development tools: Leverage tools like
    Claude Code to accelerate prototyping, testing, and
    deployment — build MVPs fast, validate with users, and
    evolve into maintainable solutions
  - Own production readiness: Implement proper testing, access
    management, error handling, logging, and audit trails —
    you ship things that actually work in production
  - Maintain and improve: Take long-term ownership of delivered
    solutions; coordinate with platform, security, and tech
    teams as needed
  - Translate business to technical: Engage directly with
    accounting stakeholders, understand manual processes, and
    independently define the right automation approach

  About You

  - 5+ years of hands-on experience in automation, technical
    business analysis, or solution delivery, with strong,
    production-ready Python skills and experience building
    maintainable, robust applications —not just one-off
    scripts.
  - Automation & RPA experience — practical hands-on work with
    at least one workflow or RPA tool such as UiPath, n8n, or
    equivalent
  - Integration & API skills — experience building reliable
    system integrations using REST APIs, including
    authentication, data exchange, error handling, and
    troubleshooting.
  - Practical AI/LLM exposure — you've actually built something
    using an AI tool, agent, or LLM framework — not just read
    about it
  - Independent delivery mindset — you take a problem from
    definition to working, deployed solution without
    handholding; fluent English and comfortable working in
    Central European business hours

  A Strong Advantage:

  - Finance & enterprise platform knowledge — exposure to
    accounting processes (GL, AP, AR, reconciliations, invoice
    processing) and/or enterprise tools like Oracle Fusion,
    Snowflake, or Power BI
  - AI agent frameworks & cloud basics — familiarity with
    LangChain / Mastra agentic AI frameworks, MCP, and
    similar; cloud deployment (AWS/Azure), containerization,
    or CI/CD experience is a bonus; Engineering/CS degree with
    certifications in Data Science, AI, or RPA (e.g. UiPath
    Developer Certification) is a plus

  We recognize that everyone carries a unique set of valuable
  skills and experiences. If you think you could have an
  impact even though you don't meet 100% of the requirements,
  we still encourage you to apply. We want to hear from you! 

  What We Offer

  - Travel perks: 12 free Flix vouchers + 12 discount vouchers
    for friends & family.
  - Work from (M)Anywhere: Depending on your role, work from
    another location for up to 60 days per year.
  - Hybrid work model: We are an office-first company, but we
    offer flexibility to balance work and life.
  - Wellbeing support: Access confidential 1:1 counselling,
    courses, and stress management for yourself and up to four
    family members.
  - Learning & Development: Take advantage of language classes,
    training courses, and expert-led sessions to grow your
    skills.
  - Mentoring Program: Connect with experienced colleagues to
    gain insights and accelerate your career.

  To view more local benefits specific to each office
  location, please check out this link: Locations - Flix
  Career

  Why Join Flix?

  At Flix, you’ll find teams that rally together to overcome
  challenges and spark creativity. We believe in ownership
  culture - giving you the freedom to take initiative, make an
  impact, and shape your own career path. As we continue to
  expand across the globe, you can make a real difference in
  how we work.

  If you’re ready to grow and lead your journey, Flix is the
  place for you!

