title: AI Solutions Engineer
company: xCures
location: USA
remote: true
work_type: FULL_TIME
description: |
  About xCures

  The best of medicine should belong to everyone. Nobody
  dreams of becoming good at being a patient. We have people
  to love, things we want to do, and plans we hope to keep.
  Illness already asks enough of us.

  xCures® exists to give healthcare the capacity to care for
  everyone. Healthcare has more to give. Too much of its time,
  money, and talent goes into unnecessary work that keeps
  people waiting and drives up the cost of care. Freeing those
  resources can make excellent care possible for far more
  people.

  xCures understands a patient’s history across the places
  they receive care and keeps that understanding current. It
  puts trusted information in the hands of the people who need
  it, when they need it, and uses that knowledge to take on
  more of the administrative work around care. Every extracted
  data point traces back to the exact document and page it
  came from.

  Our ambition is to empower doctors to make better decisions,
  enable researchers to develop better treatments faster, and
  help healthcare organizations serve more people with fewer
  errors and lower costs. We work with diagnostic labs,
  providers, telehealth companies, health systems, payers, and
  consumer health platforms. We are a fully remote, venture-
  backed team that holds itself to the same standard as our
  product: trustworthy, precise, and purposeful.

  We are building for the lives people want to live.

  Here’s Where You’ll Make An Impact:

  xCures is hiring an AI Solutions Engineer to join a team
  that sits between our customers and our platform. This is a
  software engineering role: you will write and own production
  code, not run demos from a script. You will report to the
  Director, Customer Solutions, with a dotted line to
  Engineering. Half your time goes to customer-facing work:
  the integrations, connectors, and proofs of concept that
  take diagnostic labs and health systems from signed contract
  to live data faster. The other half goes to the tools the
  company runs on: the agents, skills, and automations that
  let a small team operate like a much larger one.

  You will write code that ships to customers within weeks,
  see how it changes their workflow, and help shape how the
  Customer Solutions team builds and ships software. The work
  spans integrations, agents, and prototypes, and the problems
  rarely arrive well defined, so range and comfort with
  ambiguity matter as much as depth. You will work directly
  with customers and turn their requirements into working
  software. xCures is operationalizing AI across the whole
  company, so the AI-native way of working here is the
  default, not an experiment. If you want to build at the
  intersection of AI and healthcare interoperability with real
  customers and real production stakes, this is that job.

  Key Responsibilities:

  - Build and maintain customer integrations, including data
    connectors, API-based integrations, and FHIR and C-CDA
    data flows, and own them from first commit through
    production
  - Build and ship agents, skills, and automations that Customer
    Solutions, Customer Success, and Sales use in their daily
    work
  - Prototype proofs of concept and demo environments for
    prospects using synthetic patient records only, and carry
    each POC end to end with the account team
  - Support customer onboarding and technical troubleshooting,
    resolving issues at the Customer Solutions layer so fewer
    escalate to Engineering
  - Join discovery calls with Sales and Channel Partnerships to
    ask the technical questions that qualify a deal, answer
    technical questions throughout the sales cycle, and
    contribute to RFP responses and security questionnaires
  - Work with Engineering, Product, Customer Success, and Sales
    and Channel Partnerships to scope integrations, surface
    product gaps, and hand off cleanly when work belongs in
    the core platform
  - Follow the team's SDLC: every session starts with a ticket,
    work moves through code review and CI/CD, and shipped work
    is documented
  - Build with security first: threat-model what you ship,
    protect secrets and patient data, and follow our HIPAA and
    HITRUST practices
  - Design agents and automations to be safe by default: least
    privilege, human approval for anything irreversible, and a
    record of what they did
  - Help the team ship faster and safer: automate the repetitive
    parts of review, testing and deployment, and keep quality
    and security gates in the pipeline
  - Write tests alongside the code you ship, including evals for
    agent and skill behavior, so integrations and automations
    can be trusted in production
  - First 90 days: ship your first customer integration to
    production and take one prospect POC end to end
  - First year: turn one-off integrations into a reusable
    toolkit customers can adopt with less hands-on support,
    measured by time from contract to live integration, POC-
    to-closed-won conversion, and fewer Customer Solutions
    escalations to Engineering, and also measured by zero
    security or PHI incidents and by how dependably our
    automations run

  Qualifications:

  - 3+ years of professional software development experience
  - Fluency in Python, TypeScript, React or a comparable modern
    language and framework, with production code you can point
    to, and the ability to be productive in both
  - Experience directing AI coding agents at scale and
    critically reviewing their work
  - Experience building with LLM APIs, including tool use and
    evaluating output quality
  - REST API design and integration experience, plus working
    knowledge of cloud infrastructure, AWS preferred
  - Git and CI/CD experience
  - SQL and relational database experience, including querying
    and modeling data in a warehouse
  - Familiarity with standard SDLC and DevOps practices:
    ticketed work, code review, automated testing, and
    deployment pipelines
  - Experience with regulated data such as PHI, and a security-
    first approach to engineering
  - Comfortable working directly with customers to understand
    the problems they need solved and the jobs to be done,
    then turning that understanding into working solutions
    quickly
  - Bachelor's degree in computer science or a related field, or
    equivalent practical experience

  Bonus Points:

  - Experience with healthcare data standards such as FHIR or
    C-CDA, or with TEFCA and Carequality networks
  - Experience with agentic frameworks or tool-calling protocols

  Location

  xCures operates in a distributed, remote-first environment,
  with occasional travel to company offsites or key meetings
  throughout the year. Candidates may be located anywhere in
  the United States. The successful candidate must already
  have authorization to work in the United States. At this
  time, xCures does not offer sponsorship. All candidate
  information will be held in confidence and in accordance
  with EEOC guidelines.

  Additional Considerations

  We recognize that people bring a wealth of experience and
  talent beyond just the requirements listed in a job
  description. Diversity of experience and skills, combined
  with a shared passion for healthcare, is what drives us to
  innovate. We welcome candidates from all backgrounds and
  encourage you to apply, even if you don’t meet every
  qualification listed. xCures is an equal opportunity
  employer, committed to creating an inclusive environment for
  all employees.

  Benefits

  Great work deserves great support. We believe our people are
  our greatest asset, and we’re committed to supporting them
  with a strong, competitive benefits package. Our goal is to
  be a place where people genuinely want to build their
  careers, and our benefits are designed to support our team
  in the ways that matter most.

  - Remote-First
  - Paid Time Off and 13 Company Holidays
  - Equity Package
  - Paid Parental Leave
  - Medical, Vision, and Dental
  - Employer HSA Contribution
  - Employer 401(k) Match
  - STD, LTD, Life Insurance and Critical Illness Plans
  - Employee Assistance Program
  - Adoption Assistance
  - Company Offsites
  - Monthly Internet Allowance
  - Professional Development Funds
  - And more!

  Compensation

  The anticipated base salary range for this role is $100,000
  to $160,000.

  Agency Notice: xCures does not accept unsolicited resumes
  from staffing agencies, search firms, or other third-party
  recruiters. Any resumes submitted without a signed, active
  agreement with xCures will not be considered, and no fee
  will be paid in the event of a hire.
