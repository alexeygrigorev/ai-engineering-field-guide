description: |
  A Day in the Life:

  This is a hands-on role at the intersection of data
  discovery and applied AI—where insights don’t stop at a
  slide deck, they go live. As an AI Solutions Engineer on our
  AI & Innovation team, you’ll hunt for patterns, anomalies,
  and untapped opportunity across Hertz’s operational and
  customer data, often surfacing answers that no dashboard has
  shown before. You’ll partner directly with business leaders
  and senior technical stakeholders to connect siloed data,
  challenge assumptions, and build capabilities that change
  how teams work with AI.

  One week you may uncover an insight that reshapes a pricing
  decision; the next, you ship an AI agent or automated
  workflow that runs in production on a schedule. You’ll work
  in Databricks with Python and SQL, use AI-assisted
  development tools to move fast, and own the full path from
  notebook to live tool—pipelines, agents, lightweight apps,
  and knowledge systems included. You’ll also prove the value
  of what you build by establishing baselines, tracking
  outcomes, and showing leadership the real operational and
  financial impact of Hertz’s AI and automation investments.



  What You’ll Do:

  - Hunt across enterprise data—operations, customer behavior,
    pricing, and internal systems—for trends, anomalies, and
    opportunities that standard reporting never surfaces
  - Uncover hidden value where useful data sits in silos,
    incomplete or unconnected, waiting to change how a team
    operates
  - Curate and join multi-source datasets into analysis-ready
    assets on Databricks and similar platforms
  - Deliver analyses that move decisions, not just
    dashboards—with clear documentation of assumptions,
    lineage, and limitations
  - Ship insights into production: scheduled pipelines,
    refreshed datasets, embedded logic, and AI-enabled tools
    teams depend on every day
  - Build applied AI capabilities—agents, automated workflows,
    lightweight web apps, knowledge tools—that put data at the
    point of need
  - Utilizes Databricks, Python, SQL, and AI-assisted
    development tools to prototype fast and deliver
    production-quality solutions
  - Own the full journey from discovery to deployment, including
    refreshes, monitoring, and tight feedback loops with the
    teams using what you build
  - Quantify impact by establishing baselines, tracking outcomes
    before and after launch, and showing the real business
    value of AI and automation
  - Collaborates with business partners, senior technical
    leaders, and engineering teams across Hertz to validate
    findings and scale what works
  - Present findings with clarity and conviction—substance and
    business relevance over hype

  What We’re Looking For:

  - Bachelor's degree in Computer Science, Engineering,
    Information Systems, Mathematics, Economics, or a related
    technical field (required)
  - 2+ years’ experience querying relational and lakehouse data
    with SQL (professional or academic)
  - Expert proficiency in Python for data work, prototyping, and
    solution delivery
  - Comfort working with large, messy, multi-source datasets;
    ability to join, clean, and validate data before building
    on it
  - Track record of uncovering useful insights and
    operationalizing data so those insights reach stakeholders
    in a usable, repeatable form
  - Ability to measure and communicate the business impact of
    AI-enabled work
  - Master’s degree in a technical or analytical field
    (preferred)
  - Experience with Databricks or similar data platforms for
    analytics and operational insights (preferred)
  - Familiarity with AI-assisted development workflows and cloud
    data environments such as Spark (preferred)
  - Experience quantifying ROI, productivity gains, or
    operational improvement from automation or AI programs
    (preferred)
  - Energized by working across analysis and shipping—as excited
    to find the insight as to get it live on a small, fast-
    moving team
  - Deep curiosity about data and a bias toward action in
    ambiguous, high-impact problem spaces
  - Flexible and adaptable; thrives when the path forward isn’t
    fully mapped yet
  - Excellent verbal and written communication skills—able to
    make complex findings land with business and technical
    audiences
  - Results driven, with strong analytical thinking, problem
    solving, and decision-making skills



  What You’ll Get:

  - This position starts at $90K commensurate of experience
  - Up to 40% off the base rate of any standard Hertz Rental
  - Paid Time Off
  - Medical, Dental & Vision plan options
  - Retirement programs, including 401(k) employer matching
  - Paid Parental Leave & Adoption Assistance
  - Employee Assistance Program for employees & family
  - Educational Reimbursement & Discounts
  - Voluntary Insurance Programs - Pet, Legal/Identity Theft,
    Critical Illness
  - Perks & Discounts –Theme Park Tickets, Gym Discounts & more

  About UsThe Hertz Corporation operates the Hertz, Dollar Car
  Rental, Thrifty Car Rental brands in approximately 9,700
  corporate and franchisee locations throughout North America,
  Europe, The Caribbean, Latin America, Africa, the Middle
  East, Asia, Australia and New Zealand. The Hertz Corporation
  is one of the largest worldwide airport general use vehicle
  rental companies, and the Hertz brand is one of the most
  recognized in the world.




