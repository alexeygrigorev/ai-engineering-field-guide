description: |
  About Concurrence

  Concurrence (formerly Amigo) is building the platform
  healthcare organizations use to build their own clinical AI
  agents. Our mission is to make excellent care accessible to
  every patient, not rationed by the limits of clinician time.

  Underneath our platform is the Health World Model, which
  unifies a health system’s data into a living, event-level
  record of every patient’s care. On top of it, agents handle
  work across the patient journey, from intake and scheduling
  to medication management and clinical decision support.

  Our agents have supported more than 10 million patient
  encounters and are on track to grow tenfold this year. We
  run natively on Databricks, integrate with every major EHR,
  and are backed by Madrona, General Catalyst, and Optum
  Ventures. We’re about 35 people, working in person in New
  York and San Francisco.

  About the role

  Applied AI is where Concurrence meets the real world. Our
  core engineering team builds the platform. We take it into
  health systems and build what each customer actually needs
  on top of it, as durable software that runs in production.

  As a Staff Applied AI Engineer, you own our most complex
  customer use cases and set technical direction across
  deployments. You take a deployment from brief to production.
  You make the architecture calls inside it and across shared
  systems, commit the timeline, and carry the outcome.

  Success isn't your agent staying up. It's the customer's
  number moving: more intake handled, fewer denials, faster
  time to billing close.

  Your work doesn't stop at one customer. We build custom
  first, on purpose. When the same shape shows up under two
  customers, you're the one who sees it, and the pattern you
  proved becomes part of the platform everyone builds on next.

  Applied AI runs ahead of the platform, not behind it. Our
  field work is the R&D that decides what Concurrence becomes.

  What you'll do

  - Own our most complex use cases, end to end. You run the
    build from the deployment brief to production and beyond.
    You set technical direction within and across deployments,
    resolve tradeoffs with the platform team, commit the
    timelines, and stay hands-on in the hardest parts of the
    build.
  - Build agent systems that hold up in clinical settings. That
    means hierarchies of agents and skills rather than one
    monolith, and evals that measure distributions, not vibes.
    Nothing reaches a patient until it clears our safety floor
    and eval gate.
  - Take on the integration reality. EHRs, legacy systems, and
    customer data come in every shape. You find the path from
    what the customer has to what the platform needs.
  - Make it compound. You turn field-proven patterns into first-
    class platform capabilities. You also push proven work
    down from agent reasoning into deterministic data lookups,
    the move where twenty tool calls become one. That's how we
    grow without turning into a services shop.
  - Push back early. When a spec was never vetted, an
    integration isn't supported, or scope quietly changed mid-
    build, you raise it before the build pays for it.
  - Raise the people around you. Mentor engineers across
    deployments and help set the team's architecture and
    engineering standards. Write documentation good enough
    that a coding agent or a new hire could pick up your work.

  You might be a great fit if you

  - Have shipped and owned complex production systems end to
    end, with real users depending on them.
  - Have set technical direction across multiple projects or
    teams, and helped other engineers make sound architecture
    decisions.
  - Have real experience building with LLMs and agents in
    production, or the engineering depth to get there fast.
  - Treat non-deterministic systems with rigor. You know three
    runs of an agent is a feeling, not evidence.
  - Hold the near term and the long term at once: what a
    decision costs now, and what it makes easier or harder for
    the team later.
  - Are comfortable in the room with customers and clinicians.
    You'd rather understand the workflow than wait for a
    perfect spec.
  - Care about craft. Your systems fail loudly to you before
    they fail to a customer, and they keep working while
    you're on vacation.

  Nice to have

  - Healthcare experience: EHR integrations (Epic, Oracle
    Health, athenahealth), HL7, FHIR, or clinical workflows.
  - Experience with Databricks, voice agents, or forward
    deployed or customer engineering.
  - Time at an early-stage startup.

  Why this role

  - Stakes. Your work runs inside health systems and touches
    patient care.
  - Ownership, early. You own complex use cases and shared
    technical decisions from the start. At a 35-person
    company, scope arrives fast.
  - Leverage. What you build in the field becomes the platform.
    Few roles let you shape the product this directly.
  - Technical leadership. Set direction across Applied AI while
    staying close to the code. Your impact grows through the
    decisions and patterns the whole team builds on.
  - A week built for deep work. Collaborative in-office sprints
    early in the week, a protected focus day on Thursday, and
    Friday to consolidate what we learned.

  Benefits (available to Full-Time Employees) Health &
  Wellness

  - Comprehensive health, dental, and vision insurance
  - Daily catered lunch and dinner
  - Mental health support and wellness coaching
  - Flexible wellness stipend for fitness, therapy, or personal
    growth

  Growth & Development

  - Annual learning budget for courses, books, or conferences
  - Conference attendance budget for professional development
  - Annual team offsite
  - Academic collaboration opportunities
  - Unlimited PTO

  Our Core Values

  - Patients Win, We WinIf patients aren't getting better care,
    we haven't earned the right to scale. Every internal
    decision gets pressure-tested: does this make patients'
    lives better? If we can't draw the line, we question why
    we're doing it.
  - High Standards, High CareWe hold a high bar for the team
    because patients are counting on us to get this right. But
    high standards only work with genuine investment in each
    other. You can take risks, admit mistakes, and challenge
    ideas. Not despite our standards, but because of them.
  - Thoughtful UrgencyWe move fast by default, but speed without
    judgment is recklessness. The discipline is knowing which
    decisions are reversible vs. not. In healthcare AI, the
    companies that win will be fast everywhere they can be and
    careful everywhere they must be. We build the muscle to do
    both.
  - Intensely MeasuredWe instrument patient outcomes, provider
    ROI, system performance, and clinical accuracy. But data
    without action is surveillance. Every metric should have
    an owner, a threshold, and a response plan. If we're
    measuring something but never acting on it, we stop
    measuring it.

  Who Builds With Us

  - Low ego: Politics and territory don't interest you. The best
    ideas win, regardless of who has them.
  - Direct: You say the hard thing, challenge ideas openly, and
    commit fully once decided.
  - High agency: You thrive on trust rather than instruction.
    When you see something is broken, you fix it. You don’t
    file tickets and wait for someone else.
  - Bar of excellence: You hold yourself to a bar most people
    wouldn't, and you want teammates who do the same.
  - Skeptical: You push back on rules that don’t make sense and
    question assumptions that haven’t earned their place.
