title: AI Automation Engineer
company: TicketManager
location: Calabasas, USA
work_type: FULL_TIME
description: |
  Live events are fun.   Concerts, sporting events, and
  festivals create memorable lifelong experiences with
  clients, prospects, partners, friends, and family—and they
  drive real business impact. Companies spend more than $600
  billion each year on client entertainment. TicketManager is
  the enterprise platform they trust to source, manage, track,
  and report on live event tickets and hospitality—while
  maintaining compliance, control, and visibility across the
  organization. Built at the intersection of live events,
  technology, and enterprise operations, TicketManager makes
  client entertainment easy and measurable. Our industry-
  leading software supports everything from invitations and
  event execution to post-event reporting, helping companies
  clearly prove ROI and strengthen relationships through
  unforgettable experiences. TicketManager is trusted by
  thousands of global brands, including Anheuser-Busch,
  Verizon, American Express, Nike, and Visa, as well as
  Fortune 500 companies, professional sports leagues, and
  major organizations such as the NBA, NFL, NCAA, and NASCAR.
  We’re also proud to partner with some of the most iconic
  teams and venues in sports and entertainment, including the
  New York Jets, Philadelphia Eagles and Phillies, Capital One
  Arena, Texas Rangers, LAFC, and Seattle Seahawks, along with
  more than 50 professional and collegiate teams, franchises,
  universities, and technology providers. Why Work at
  TicketManager At TicketManager, you’ll help build technology
  that brings people together through live experiences—while
  solving complex, real-world problems for the world’s best
  companies. We’re a fast-growing, profitable company that
  values ownership, collaboration, and excellence, and we’re
  building a team that’s passionate about making work
  impactful and fun. If you’re excited about live events,
  cutting-edge technology, and doing work that truly matters,
  you’ll feel right at home here. The Role TicketManager is
  building its AI and automation infrastructure from the
  ground up, and we are looking for a partner to build it
  with. As an AI Automation Engineer, you will work directly
  with the VP of Enterprise Technology & AI Strategy to turn
  AI strategy into working systems: n8n workflows, MCP
  servers, LLM integrations, chat and voice agents, and AI-
  driven engineering automation that makes the whole team
  faster. This is not a role with a fully written roadmap.
  Requirements are fluid, projects range from a one-afternoon
  automation to a multi-month platform build, and the
  technology changes monthly. You will break things and fix
  them faster, stay endlessly curious, and set your own
  priorities. When the first three approaches fail, you find
  the fourth, because we believe there is always a way. Your
  work will directly shape how TicketManager operates, serves
  customers, and scales. Responsibilities:

  - Build, maintain, and measure workflow automations in n8n
    across CRM, ERP, support, and fulfillment systems, from
    first prototype through stable production
  - Build, maintain, and measure custom MCP servers that connect
    Claude and other models to internal systems and data
  - Build and manage integrations with Claude, Gemini, and other
    model APIs, including prompt engineering and structured
    outputs
  - Design agentic workflows where AI takes multi-step actions
    autonomously, and instrument them so we know when they
    work and when they don't
  - Build and maintain voice and chat agents for sales and
    support, and own the development of a full in-app chatbot
  - Use AI CLI tools such as Claude Code and Codex daily, and
    automate code review, testing, QA, and release pipelines
  - Work with data lakes on AWS and Azure to keep AI systems fed
    with clean, current data, with security (credential
    handling, access scoping, audit logging) as a default
  - Define success metrics before every pilot, track cost,
    performance, and adoption, and kill what doesn't work fast
  - Evaluate new models and tools as they appear, and recommend
    when to adopt, switch, or skip
  - Present your work to leadership and cross-functional teams,
    make the case for the technologies you believe in, and
    help non-technical colleagues put them to use

  Desired Skills and Experience:

  - Bachelor's Degree required; MS in Computer Science,
    Engineering, MIS, or a relevant field is preferred
  - 1-3 years of hands-on experience in automation engineering,
    systems integration, or a closely related technical role
  - Hands-on experience with AI CLI tools such as Claude Code,
    Codex, or similar, and with code automation and AI-
    assisted code review and QA
  - Real experience with n8n, Make, Zapier, or comparable
    orchestration tools, plus working knowledge of REST APIs,
    webhooks, and JSON
  - Familiarity with LLM APIs (Claude, Gemini, or similar) and
    prompt engineering fundamentals
  - A track record of solving problems nobody handed you a clean
    answer for; comfortable with fluid requirements and
    setting your own priorities
  - Strong communication skills: you can present an idea and
    persuade others to adopt a technology or approach
  - Visible evidence of constant learning, such as side projects
    and experiments you built to teach yourself
  - Nice to have: experience with MCP (Model Context Protocol),
    or building chat and voice agents (VAPI, Deep Chat,
    assistant-ui, or similar)
  - Nice to have: Python or JavaScript, CI/CD and release
    automation (GitHub Actions or similar), AWS or Azure data
    lakes, RAG and vector databases

  TicketManager Highlights:

  - Location: Calabasas, CA (HQ)
  - Compensation: $95,000 - $125,000 base salary + Variable
    Compensation
  - Reports to: VP, Enterprise Technology & AI Strategy
  - Work Expectations: Role is In-Office, Monday-Friday
  - Retirement: 401(k) & Company Match
  - Health Benefits: Medical, Dental, Vision & Chiropractic
  - Time Off: Unlimited PTO
  - Interview Process: Multistage interview process with senior
    leaders across TicketManager to ensure strong alignment on
    role scope and expectations.
  - Events: Quarterly live event credits (we practice what we
    preach!), monthly happy hours, and volunteering
  - Perks: Fun, collaborative, in-office culture at our HQ with
    catered lunches and big company perks with the autonomy of
    a high-growth startup
  - Recognition: Inc. 5000 fastest-growing private company by
    Inc. Magazine six years in a row. Recognized as one of the
    Best Places to Work by Inc. Magazine, The LA Business
    Journal, and Sports Business Journal
  - 4.5 out of 5 Glassdoor rating
  - Used by over 4,000 globally known companies including ~15%
    of the Fortune 500
