description: |
  We are looking for a product-minded AI engineer to turn what
  our customers are trying to decide into agents they actually
  rely on. AskWaive, our in-product assistant, is already
  live; the work now is quality, coverage, and an experience
  that wows.

  This is not a role for a prompt author or a demo builder. We
  want an owner: someone who takes a customer need—already
  expressed through our serving layers and semantic layer—and
  turns it into an endpoint, a tool, and an experience that
  makes the customer measurably better at their job. Agent
  engineering, deployment, and testing are all part of
  delivery, not a handoff.

  Our core data platform is owned by the team that built it.
  You'll build on top of it—and where data or infrastructure
  is holding an agent back, you'll have the standing to
  propose the change and drive it.

