description: |
  About dunnhumby

  dunnhumby is the global leader in Customer Data Science,
  helping the world's most ambitious retailers and brands put
  the customer at the heart of every decision. With nearly
  3,000 experts across Europe, Asia, Africa and the Americas,
  we partner with iconic businesses like Tesco, Coca-Cola,
  Meijer, Procter & Gamble and Metro to turn data into growth,
  innovation and measurable value for their customers.

  Tech / Engineering

  dunnhumby’s Technology and Engineering team builds the
  platforms, pipelines and systems that make customer data
  science possible at scale. From the data infrastructure that
  ingests billions of transactions to the APIs and cloud
  architecture that power our products, we engineer reliable,
  high-performance software trusted by the world’s leading
  retailers and brands.

  We're looking for a Senior AI Engineer to help build and
  scale dunnhumby's Enterprise AI Platform- designing,
  deploying, and operating production grade AI systems used
  across engineering teams. You'll work across the full AI
  lifecycle: model training and fine-tuning, agentic
  workflows, RAG, AI observability, and AI-powered user
  experiences, using the latest advancements in Generative AI.

  What You'll Do

  - Build reusable, scalable AI services for prompt
    orchestration, model routing, embeddings, structured
    generation, and tool calling; develop configurable multi-
    provider AI runtimes and secure cloud-native
    microservices.
  - Design multi-agent and autonomous systems with reasoning,
    planning, memory, and tool execution; build graph-based,
    long-running workflows with human-in-the-loop checkpoints
    using MCP and A2A.
  - Build enterprise-grade RAG pipelines— ingestion, chunking,
    embeddings, hybrid search, reranking, citations — and
    continuously evaluate retrieval quality.
  - Train, fine tune (LoRA/QLoRA/PEFT), and evaluate ML/DL
    models; build training pipelines, run experimentation and
    hyperparameter optimization, and productionize models with
    data science partners.
  - Deploy, monitor, and continuously improve agents and models
    in production — experiment tracking, model registry,
    versioning/rollback, drift and cost monitoring, CI/CD, and
    canary/blue-green deployments.
  - Implement guardrails for hallucination, prompt injection,
    and PII; establish evaluation, monitoring, and
    responsible-AI compliance practices.
  - Build and deploy cloud-native AI services (Docker,
    Kubernetes, Terraform) on GCP and Azure with autoscaling,
    observability, and distributed tracing; own services from
    build through production support.
  - Build responsive React-based interfaces for chat, copilots,
    prompt playgrounds, and agent/evaluation dashboards,
    integrated via REST, SSE, and WebSockets.
  - Write clean, tested code; drive architecture reviews, code
    reviews, and mentor engineers.

  What You'll Bring

  - Bachelor's/Master's in Computer Science, AI, Engineering, or
    related field.
  - 8+ years of software engineering experience, including 3+
    years building production AI/ML applications.
  - Strong grounding in distributed systems, cloud-native
    architecture, and microservices.
  - Track record delivering enterprise-grade AI solutions from
    POC to production.

  Technical Skills

  Programming: Python (expert), TypeScript/JavaScript, SQL,
  async programming, REST & gRPC, design patterns AI/ML
  Concepts: LLMs, prompt engineering, embeddings, RAG, hybrid
  search, agentic AI (tool/function calling, MCP, A2A), model
  training & fine-tuning (LoRA/QLoRA/PEFT), hyperparameter
  optimization, GPU optimization, quantization AI Frameworks:
  LangChain, LangGraph, Google ADK, OpenAI Agents SDK, CrewAI,
  AutoGen, LlamaIndex, Semantic Kernel, DSPy, Pydantic AI
  Cloud AI Platforms: Google Vertex AI, Azure AI Foundry,
  Azure OpenAI, Model Garden ML & MLOps: PyTorch, TensorFlow,
  Hugging Face, MLflow, Kubeflow, model registry, experiment
  tracking, continuous training AgentOps & Observability:
  LangSmith/Langfuse/Arize Phoenix, OpenTelemetry, Grafana,
  New Relic, agent evaluation, cost monitoring Vector
  Databases: Pinecone/Weaviate/Milvus/pgvector/Vertex AI
  Vector Search/Azure AI Search Cloud & DevOps: Docker,
  Kubernetes, Terraform, ArgoCD, GitHub Actions/Azure DevOps,
  CI/CD, IaC Workflow Orchestration: Temporal/Argo
  Workflows/event-driven architecture/message queues

  What You Can Expect From Us

  We won't just meet your expectations. We'll defy them. So
  you'll enjoy the comprehensive rewards package you'd expect
  from a leading technology company. But also, a degree of
  personal flexibility you might not expect. Plus, thoughtful
  perks, like flexible working hours and your birthday off.

  And we don't just talk about diversity and inclusion. We
  live it every day – with thriving networks including dh
  Gender Equality Network, dh Proud, dh Family, dh One, dh
  Enabled and dh Thrive as the living proof. We want everyone
  to have the opportunity to shine and perform at your best
  throughout our recruitment process — please let your
  recruiter know what adjustments would help.

  India Benefits

  - Healthcare & Family Cover: Group Medical Insurance of INR
    500,000 for employees and dependents, plus dental and
    vision cover up to INR 5,000.
  - Protection: Group Term Life Insurance and Group Personal
    Accident cover with benefit levels linked to employee
    grade, including disability benefits.
  - Retirement & Wellbeing: Provident Fund, Gratuity, National
    Pension Scheme access, Indian Health Organisation
    membership, and confidential employee assistance support.
  - Lifestyle & Flexibility: Office commute support, internet
    allowance of INR 2,000 per month for blended working,
    work-from-home kit support, subsidised food, and wellbeing
    resources.
  - Recognition & Extras: Long service awards, Talent Scout
    referral programme, and family milestone support.
  - Time Off & Family Leave: 25 days holiday plus 10 public
    holidays, paid maternity, paternity and adoption leave,
    and a day off for your birthday.

  Our approach to Flexible Working

  At dunnhumby, we value and respect difference and are
  committed to building an inclusive culture by creating an
  environment where you can balance a successful career with
  your commitments and interests outside of work.

  We believe that you will do your best at work if you have a
  work / life balance. Some roles lend themselves to flexible
  options more than others, so if this is important to you
  please raise this with your recruiter, as we are open to
  discussing agile working opportunities during the hiring
  process.

