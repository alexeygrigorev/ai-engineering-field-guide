description: |
  Project Role : AI / ML Engineer Project Role Description :
  Develops applications and systems that utilize AI tools,
  Cloud AI services, with proper cloud or on-prem application
  pipeline with production ready quality. Be able to apply
  GenAI models as part of the solution. Could also include but
  not limited to deep learning, neural networks, chatbots,
  image processing. Must have skills : Conversational AI Good
  to have skills : NA Minimum 7.5 year(s) of experience is
  required Educational Qualification : 15 years full time
  education Summary: As an AI / Machine Learning Engineer, a
  typical day involves designing and building advanced
  applications and systems that leverage artificial
  intelligence technologies. This role requires integrating
  cloud-based or on-premises pipelines to ensure solutions are
  production-ready and scalable. The engineer works on
  implementing generative artificial intelligence models and
  may engage in diverse areas such as deep learning, neural
  networks, conversational agents, and image processing.
  Collaboration with various teams to align technical
  solutions with project goals is a key aspect of daily
  activities, ensuring innovative and efficient outcomes.

  Roles & Responsibilities:
  - Expected to be an SME, collaborate and manage the team to
    perform.
  - Responsible for team decisions.
  - Engage with multiple teams and contribute on key decisions.
  - Provide solutions to problems for their immediate team and
    across multiple teams.
  - Lead the development and deployment of AI-driven
    applications ensuring alignment with organizational
    objectives.
  - Mentor junior team members to foster skill development and
    knowledge sharing.
  - Continuously evaluate emerging AI technologies and recommend
    their adoption to enhance project outcomes.

  Professional & Technical Skills:
  - Must To Have Skills: Proficiency in Conversational AI.
  - Experience in designing and implementing AI models including
    generative artificial intelligence techniques.
  - Strong understanding of cloud AI services and the ability to
    integrate them within application pipelines.
  - Familiarity with deep learning frameworks and neural network
    architectures.
  - Ability to develop and optimize chatbots and other
    conversational agents.
  - Knowledge of image processing techniques and their
    application in AI solutions.

  Additional Information:
  - The candidate should have minimum 8 years of experience in
    Conversational AI.
  - This position is based at our PDC2C - SEZ location.
  - A 15 years full time education is required.


  15 years full time education

