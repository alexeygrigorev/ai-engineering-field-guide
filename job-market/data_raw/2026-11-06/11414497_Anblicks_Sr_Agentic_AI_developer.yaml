description: |
  Senior Agentic AI Engineer

  Experience: 7–10 years

   Location: Hyderabad / Ahmedabad

   Employment Type: Full-time

  Job Summary

  We are looking for a Senior Agentic AI Engineer with strong
  hands-on experience in Generative AI, LLMs, AI agents, and
  enterprise AI solutions. The candidate will be responsible
  for designing and developing intelligent, autonomous AI
  agents that can reason, use tools, interact with enterprise
  systems, and execute multi-step workflows.

  Key Responsibilities

  - Design and develop Agentic AI solutions using LLMs, AI
    agents, and multi-agent architectures.
  - Build AI agents capable of reasoning, planning,
    tool/function calling, and autonomous task execution.
  - Develop RAG-based applications using enterprise data and
    knowledge bases.
  - Work with frameworks such as LangChain, LangGraph,
    LlamaIndex, AutoGen, CrewAI, or equivalent.
  - Integrate LLMs with enterprise APIs, databases, cloud
    services, and business applications.
  - Implement prompt engineering, context management, memory,
    agent orchestration, and guardrails.
  - Develop and optimize AI workflows using Python and modern
    AI/ML libraries.
  - Work with vector databases such as Pinecone, Weaviate,
    Milvus, Chroma, or Azure AI Search.
  - Implement evaluation, monitoring, observability, security,
    and governance for AI agents.
  - Optimize solutions for latency, scalability, reliability,
    and cost.
  - Collaborate with architects, data engineers, product teams,
    and business stakeholders to translate requirements into
    AI solutions.
  - Mentor junior engineers and contribute to technical design
    and architecture decisions.

  Required Skills

  - Strong hands-on experience with Generative AI and Large
    Language Models (LLMs).
  - Strong Python programming skills.
  - Experience developing AI Agents / Agentic AI systems.
  - Strong understanding of RAG, embeddings, vector search,
    prompt engineering, and function/tool calling.
  - Experience with LangGraph/LangChain or similar agent
    frameworks.
  - Experience with OpenAI, Azure OpenAI, Anthropic, Gemini, or
    other LLM platforms.
  - Good understanding of multi-agent systems and agent
    orchestration.
  - Experience integrating AI applications with REST APIs,
    databases, enterprise applications, and cloud platforms.
  - Knowledge of AWS/Azure/GCP and AI/ML deployment patterns.
  - Experience with Docker, Kubernetes, CI/CD, and production
    deployment is preferred.
  - Strong understanding of software engineering principles, API
    development, and scalable application architecture.

  Education

  Bachelor's/Master's degree in Computer Science, Engineering,
  AI/ML, Data Science, or a related field.
